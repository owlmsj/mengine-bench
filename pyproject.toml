[project]
name = "mengine-bench"
version = "0.1.0"
description = "Public coding-agent benchmark: real multi-step tasks with deterministic gold checks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "psutil>=7.2.2",
]

[project.scripts]
mengine-bench = "mengine_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mengine_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
