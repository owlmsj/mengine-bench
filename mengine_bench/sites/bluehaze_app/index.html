<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bluehaze</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <nav class="side" aria-label="Primary">
    <a class="brand" href="/" aria-label="Bluehaze home">Bluehaze</a>
    <a href="/" aria-label="Home" data-testid="homeLink">Home</a>
    <a id="nav-profile" href="/" aria-label="Profile" data-testid="profileLink">Profile</a>
    <button id="compose-open" class="primary" type="button" aria-label="New post" data-testid="composeBtn">New Post</button>
  </nav>
  <main id="main" class="column" aria-live="polite"><p class="muted">Loading...</p></main>
</div>
<div id="layers"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
