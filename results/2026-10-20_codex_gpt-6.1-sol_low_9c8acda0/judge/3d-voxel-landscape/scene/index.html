function mountain(x,z,r,h){const n=48,rings=12,positions=[],colors=[];const stone=new THREE.Color('#72788f'),snow=new THREE.Color('#f5e7e5');const point=(j,k)=>{let t=j/rings;let a=k/n*Math.PI*2;let rr=r*Math.pow(1-t,1.02)*(1+.035*Math.sin(k*2.7+j));return [x+Math.cos(a)*rr,1+h*t+(j===rings?0:Math.sin(k*2.3+j)*.5),z+Math.sin(a)*rr];};for(let j=0;j<rings;j++)for(let k=0;k<n;k++){let a=point(j,k),b=point(j,k+1),c=point(j+1,k),d=point(j+1,k+1);for(const tri of [[a,b,c],[b,d,c]]){let snowy=j>8||(j===8&&rand()>.45);let col=(snowy?snow:stone).clone().multiplyScalar(.86+rand()*.23);for(const p of tri){positions.push(...p);colors.push(col.r,col.g,col.b)}}}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.computeVertexNormals();mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:true}));}

function roof(w,base,parent){const verts=[],indices=[];const pts=[[-w/2,0,-w/2],[w/2,0,-w/2],[w/2,0,w/2],[-w/2,0,w/2],[-w*.32,.8,-w*.32],[w*.32,.8,-w*.32],[w*.32,.8,w*.32],[-w*.32,.8,w*.32],[0,2.0,0]];pts.forEach(p=>verts.push(...p));for(let i=0;i<4;i++){let k=(i+1)%4;indices.push(i,k,i+4,k,k+4,i+4,i+4,k+4,8)}let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(indices);g.computeVertexNormals();mesh(g,materials.dark,[0,base,0],parent);for(let i=0;i<4;i++){let a=pts[i],b=pts[(i+1)%4];branch([a[0],base+.06,a[2]],[b[0],base+.06,b[2]],.1,.1,materials.gold,parent);}}
for(let level=0;level<5;level++){const y=level*4.4,w=9.6-level*1.12;box(w,.4,w,materials.red,[0,y+.2,0],pagoda);box(w*.65,2.8,w*.65,materials.red,[0,y+1.8,0],pagoda);for(let side of [-1,1]){for(let j=-1;j<=1;j++){box(.13,1.7,.75,materials.dark,[j*w*.19,y+1.9,side*w*.33],pagoda);box(.75,1.7,.13,materials.dark,[side*w*.33,y+1.9,j*w*.19],pagoda);}for(let j=-2;j<=2;j++){box(.16,3,.16,materials.lightred,[j*w*.205,y+1.8,side*w*.43],pagoda);box(.16,3,.16,materials.lightred,[side*w*.43,y+1.8,j*w*.205],pagoda);}box(w,.15,.14,materials.lightred,[0,y+1,side*w*.48],pagoda);box(.14,.15,w,materials.lightred,[side*w*.48,y+1,0],pagoda);for(let j=-5;j<=5;j++){box(.07,.65,.07,materials.red,[j*w*.088,y+.65,side*w*.48],pagoda);box(.07,.65,.07,materials.red,[side*w*.48,y+.65,j*w*.088],pagoda);}}roof(w+2.4,y+3.3,pagoda);}
