<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Universo das Palavras — Dicionário Criativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070913;
      --panel: rgba(13, 17, 32, 0.82);
      --border: rgba(255, 255, 255, 0.1);
      --text: #eef1f8;
      --muted: #9aa4bf;
      --accent: #7dd3fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #111730 0%, #070913 75%);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }

    #labels-layer {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 2;
    }
    .node-label {
      position: absolute;
      transform: translate(-50%, -125%);
      font-size: 11px;
      font-weight: 500;
      color: rgba(238, 241, 248, 0.85);
      text-shadow: 0 1px 6px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.8);
      white-space: nowrap;
      letter-spacing: 0.02em;
      transition: opacity 0.2s ease;
    }
    .node-label.selected {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      z-index: 5;
    }
    .node-label.neighbor {
      font-size: 12px;
      font-weight: 600;
      color: #e0f2fe;
    }

    #hud-top {
      position: fixed; top: 20px; left: 20px; z-index: 10;
      width: min(360px, calc(100vw - 40px));
      display: flex; flex-direction: column; gap: 12px;
      pointer-events: none;
    }
    .card {
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      pointer-events: auto;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .stats {
      font-size: 12px;
      color: var(--muted);
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .stats strong { color: var(--text); font-weight: 600; }

    .search-wrap { position: relative; margin-top: 12px; }
    #search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(7, 9, 19, 0.7);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-input::placeholder { color: #6b7694; }

    #search-results {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: rgba(13, 17, 32, 0.96);
      border: 1px solid var(--border);
      border-radius: 10px;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      z-index: 30;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }
    .search-item {
      padding: 9px 14px;
      cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: rgba(125, 211, 252, 0.12); }
    .search-item .theme-tag { font-size: 11px; color: var(--muted); }

    #themes-bar {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .theme-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .theme-pill:hover, .theme-pill.active {
      color: var(--text);
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.12);
    }
    .theme-dot { width: 8px; height: 8px; border-radius: 50%; }

    #inspector {
      position: fixed; top: 20px; right: 20px; z-index: 10;
      width: min(340px, calc(100vw - 40px));
      max-height: calc(100vh - 40px);
      display: none;
      flex-direction: column;
    }
    #inspector.open { display: flex; }
    .insp-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      margin-bottom: 10px;
    }
    .insp-word {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1;
    }
    .close-btn {
      background: rgba(255,255,255,0.08);
      border: none; color: var(--muted);
      width: 28px; height: 28px; border-radius: 8px;
      cursor: pointer; font-size: 16px; line-height: 1;
    }
    .close-btn:hover { background: rgba(255,255,255,0.16); color: var(--text); }
    .insp-meta {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); margin-bottom: 14px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 999px;
      background: rgba(255,255,255,0.08); color: var(--text); font-weight: 500;
    }
    .neighbors-title {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin-bottom: 8px;
    }
    .neighbors-list {
      display: flex; flex-wrap: wrap; gap: 6px;
      overflow-y: auto; max-height: 45vh; padding-right: 4px;
    }
    .neighbor-chip {
      padding: 6px 11px;
      border-radius: 8px;
      background: rgba(125, 211, 252, 0.1);
      border: 1px solid rgba(125, 211, 252, 0.25);
      color: #e0f2fe;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .neighbor-chip:hover {
      background: rgba(125, 211, 252, 0.25);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    #controls-hint {
      position: fixed; bottom: 16px; left: 20px; z-index: 10;
      font-size: 11px; color: rgba(154, 164, 191, 0.7);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="labels-layer"></div>

  <div id="hud-top">
    <div class="card">
      <h1>Universo das Palavras</h1>
      <div class="stats" id="stats-bar"></div>
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Buscar palavra (ex: saudade, amor, tempo)..." autocomplete="off" />
        <div id="search-results"></div>
      </div>
    </div>
    <div class="card" id="themes-bar"></div>
  </div>

  <div class="card" id="inspector">
    <div class="insp-header">
      <div class="insp-word" id="insp-word"></div>
      <button class="close-btn" id="insp-close" title="Fechar">&times;</button>
    </div>
    <div class="insp-meta" id="insp-meta"></div>
    <div class="neighbors-title" id="insp-neighbors-title"></div>
    <div class="neighbors-list" id="insp-neighbors"></div>
  </div>

  <div id="controls-hint">Arraste para girar · Scroll para zoom · Clique em uma palavra para explorar</div>

    const THEME_COLORS = {

    const nodeById = new Map();

      adj.set(n.id, new Set());

      `<span><strong>${Object.keys(THEME_COLORS).length}</strong> temas</span>`;

    // Deterministic 3D force-directed layout
    const themes = Object.keys(THEME_COLORS);
    nodes.forEach((n, i) => {
      const tIdx = themes.indexOf(n.theme);
      const angle = (tIdx / themes.length) * Math.PI * 2;
      const r = 45 + (i % 7) * 4;
      n.x = Math.cos(angle) * r + Math.sin(i * 1.7) * 18;
      n.y = Math.sin(i * 2.3) * 26;
      n.z = Math.sin(angle) * r + Math.cos(i * 1.3) * 18;
      n.vx = 0; n.vy = 0; n.vz = 0;
    });

        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
          let d2 = dx * dx + dy * dy + dz * dz + 0.1;
          if (d2 > 6400) continue;
          let f = (160 / d2) * alpha;
          a.vx += dx * f; a.vy += dy * f; a.vz += dz * f;
          b.vx -= dx * f; b.vy -= dy * f; b.vz -= dz * f;

        n.vz -= n.z * 0.008 * alpha;

    // Highlighted ego edges
    const highlightGeo = new THREE.BufferGeometry();
    const highlightMat = new THREE.LineBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.9 });
    const highlightLines = new THREE.LineSegments(highlightGeo, highlightMat);
    scene.add(highlightLines);

    // Custom smooth orbit camera
    let target = new THREE.Vector3(0, 0, 0);
    let desiredTarget = new THREE.Vector3(0, 0, 0);
    let spherical = { radius: 135, theta: 0.4, phi: 1.25 };
    let desiredSpherical = { radius: 135, theta: 0.4, phi: 1.25 };
    let isDragging = false;
    let dragDist = 0;
    let prevMouse = { x: 0, y: 0 };

    const canvas = renderer.domElement;
    canvas.addEventListener('pointerdown', e => {
      isDragging = true;
      dragDist = 0;
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('pointermove', e => {
      if (!isDragging) return;
      const dx = e.clientX - prevMouse.x;
      const dy = e.clientY - prevMouse.y;
      dragDist += Math.hypot(dx, dy);
      desiredSpherical.theta -= dx * 0.0055;
      desiredSpherical.phi = Math.max(0.15, Math.min(Math.PI - 0.15, desiredSpherical.phi - dy * 0.0055));
      prevMouse = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('pointerup', e => {
      if (isDragging && dragDist < 5) handleCanvasClick(e);
      isDragging = false;
    });
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      desiredSpherical.radius = Math.max(22, Math.min(260, desiredSpherical.radius + e.deltaY * 0.1));
    }, { passive: false });

    // Raycasting
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredNode = null;
    let selectedNode = null;
    let activeTheme = null;

    canvas.addEventListener('pointermove', e => {
      if (isDragging) return;
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(nodeMeshes);
      hoveredNode = hits.length > 0 ? hits[0].object.userData.node : null;
      canvas.style.cursor = hoveredNode ? 'pointer' : 'grab';
    });

    function handleCanvasClick(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(nodeMeshes);
      if (hits.length > 0) {
        selectWord(hits[0].object.userData.node.id);
      }
    }

    // Selection & Inspector
    function selectWord(wordId, updateUrl = true) {
      const n = nodeById.get(wordId);
      if (!n) return;
      selectedNode = n;
      activeTheme = null;
      updateThemePills();

      if (updateUrl) {
        const url = new URL(window.location.href);
        url.searchParams.set('word', n.id);
        window.history.replaceState({}, '', url);
      }

      // Fly camera to node
      desiredTarget.set(n.x, n.y, n.z);
      desiredSpherical.radius = 52;

      // Update node opacities & highlight edges
      const nbrs = adj.get(n.id);
      nodeMeshes.forEach(m => {
        const mn = m.userData.node;
        const isSel = mn.id === n.id;
        const isNbr = nbrs.has(mn.id);
        m.material.opacity = isSel ? 1.0 : isNbr ? 0.95 : 0.15;
        m.scale.setScalar(isSel ? m.userData.baseScale * 1.45 : m.userData.baseScale);
      });
      edgeMat.opacity = 0.05;

      const hPos = new Float32Array(nbrs.size * 6);
      let idx = 0;
      nbrs.forEach(nid => {
        const nb = nodeById.get(nid);
        hPos[idx++] = n.x; hPos[idx++] = n.y; hPos[idx++] = n.z;
        hPos[idx++] = nb.x; hPos[idx++] = nb.y; hPos[idx++] = nb.z;
      });
      highlightGeo.setAttribute('position', new THREE.BufferAttribute(hPos, 3));
      highlightGeo.computeBoundingSphere();

      // Update Inspector UI
      document.getElementById('insp-word').textContent = n.id;
      document.getElementById('insp-meta').innerHTML =
        `<span class="badge"><span class="theme-dot" style="background:${n.color}"></span>${n.theme}</span>` +
        `<span>${nbrs.size} ${nbrs.size === 1 ? 'relação' : 'relações'}</span>`;
      document.getElementById('insp-neighbors-title').textContent = 'Palavras relacionadas';
      const listEl = document.getElementById('insp-neighbors');
      listEl.innerHTML = '';
      Array.from(nbrs).sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(nid => {
        const chip = document.createElement('button');
        chip.className = 'neighbor-chip';
        chip.textContent = nid;
        chip.onclick = () => selectWord(nid);
        listEl.appendChild(chip);
      });
      document.getElementById('inspector').classList.add('open');
    }

    function clearSelection() {
      selectedNode = null;
      const url = new URL(window.location.href);
      url.searchParams.delete('word');
      window.history.replaceState({}, '', url);

      desiredTarget.set(0, 0, 0);
      desiredSpherical.radius = 135;
      highlightGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
      edgeMat.opacity = 0.16;
      applyThemeFilter();
      document.getElementById('inspector').classList.remove('open');
    }

    document.getElementById('insp-close').onclick = clearSelection;

    // Theme pills
    const themesBar = document.getElementById('themes-bar');
    function updateThemePills() {
      themesBar.innerHTML = '';
      themes.forEach(t => {
        const pill = document.createElement('button');
        pill.className = 'theme-pill' + (activeTheme === t ? ' active' : '');
        pill.innerHTML = `<span class="theme-dot" style="background:${THEME_COLORS[t]}"></span>${t}`;
        pill.onclick = () => {
          activeTheme = activeTheme === t ? null : t;
          if (selectedNode) clearSelection();
          else applyThemeFilter();
          updateThemePills();
        };
        themesBar.appendChild(pill);
      });
    }
    function applyThemeFilter() {
      nodeMeshes.forEach(m => {
        const mn = m.userData.node;
        m.material.opacity = (!activeTheme || mn.theme === activeTheme) ? 0.92 : 0.12;
        m.scale.setScalar(m.userData.baseScale);
      });
    }
    updateThemePills();

    // Search
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    searchInput.addEventListener('input', () => {
      const q = normalize(searchInput.value.trim());
      if (!q) { searchResults.style.display = 'none'; return; }
      const matches = nodes
        .filter(n => normalize(n.id).includes(q))
        .sort((a, b) => {
          const as = normalize(a.id).startsWith(q) ? 0 : 1;
          const bs = normalize(b.id).startsWith(q) ? 0 : 1;
          return as - bs || b.deg - a.deg;
        })
        .slice(0, 12);
      if (matches.length === 0) { searchResults.style.display = 'none'; return; }
      searchResults.innerHTML = '';
      matches.forEach(m => {
        const item = document.createElement('div');
        item.className = 'search-item';
        item.innerHTML = `<span>${m.id}</span><span class="theme-tag">${m.theme} · ${m.deg}</span>`;
        item.onclick = () => {
          searchInput.value = '';
          searchResults.style.display = 'none';
          selectWord(m.id);
        };
        searchResults.appendChild(item);
      });
      searchResults.style.display = 'block';
    });
    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrap')) searchResults.style.display = 'none';
    });

    // Labels projection
    const labelsLayer = document.getElementById('labels-layer');
    const labelPool = new Map();
    function getLabel(id) {
      if (!labelPool.has(id)) {
        const el = document.createElement('div');
        el.className = 'node-label';
        el.textContent = id;
        labelsLayer.appendChild(el);
        labelPool.set(id, el);
      }
      return labelPool.get(id);
    }

    function updateLabels() {
      const visibleIds = new Set();
      if (selectedNode) {
        visibleIds.add(selectedNode.id);
        adj.get(selectedNode.id).forEach(nid => visibleIds.add(nid));
      } else {
        nodes.filter(n => n.deg >= 8).forEach(n => visibleIds.add(n.id));
      }
      if (hoveredNode) visibleIds.add(hoveredNode.id);

      labelPool.forEach((el, id) => {
        if (!visibleIds.has(id)) el.style.display = 'none';
      });

      const v = new THREE.Vector3();
      visibleIds.forEach(id => {
        const n = nodeById.get(id);
        const el = getLabel(id);
        v.set(n.x, n.y, n.z).project(camera);
        if (v.z > 1) { el.style.display = 'none'; return; }
        const x = (v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
        el.style.display = 'block';
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.className = 'node-label' +
          (selectedNode && selectedNode.id === id ? ' selected' :
           selectedNode && adj.get(selectedNode.id).has(id) ? ' neighbor' : '');
      });
    }

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initial ?word= param
    const urlWord = new URLSearchParams(window.location.search).get('word');
    if (urlWord) {
      const q = normalize(urlWord.trim());
      const match = nodeById.get(urlWord.trim().toLowerCase()) || nodes.find(n => normalize(n.id) === q);
      if (match) selectWord(match.id, false);
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      if (!isDragging && !selectedNode) desiredSpherical.theta += 0.0008;

      target.lerp(desiredTarget, 0.08);
      spherical.radius += (desiredSpherical.radius - spherical.radius) * 0.08;
      spherical.theta += (desiredSpherical.theta - spherical.theta) * 0.1;
      spherical.phi += (desiredSpherical.phi - spherical.phi) * 0.1;

      camera.position.set(
        target.x + spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta),
        target.y + spherical.radius * Math.cos(spherical.phi),
        target.z + spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta)
      );
      camera.lookAt(target);
      updateLabels();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
