<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Great Wave off Kanagawa — Low Poly 3D Wallpaper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #e7dcc2 0%, #ded0b2 55%, #b8b8b0 78%, #6d747a 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .cartouche {
      position: fixed;
      top: 24px;
      left: 28px;
      padding: 10px 8px;
      border: 2px solid #243952;
      background: rgba(242, 234, 214, 0.85);
      box-shadow: inset 0 0 0 2px rgba(242, 234, 214, 0.85), inset 0 0 0 3px #243952;
      writing-mode: vertical-rl;
      font-family: 'Noto Serif JP', serif;
      font-size: 13px;
      line-height: 1.45;
      letter-spacing: 0.12em;
      color: #1b2d42;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    .cartouche .sub {
      font-size: 11px;
      margin-top: 6px;
      color: #2f4966;
    }
  </style>
</head>
<body>
  <div class="cartouche" aria-hidden="true">
    富嶽三十六景<span class="sub">神奈川沖浪裏</span>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    // --- Scene, Camera, Renderer ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xdcd0b6, 0.016);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 120);
    const baseCamPos = new THREE.Vector3(0, 0.4, 15.5);
    camera.position.copy(baseCamPos);
    camera.lookAt(0, -0.3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const hemiLight = new THREE.HemisphereLight(0xf6eed8, 0x264463, 1.15);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff5dc, 1.35);
    dirLight.position.set(8, 12, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 40;
    const d = 14;
    dirLight.shadow.camera.left = -d;
    dirLight.shadow.camera.right = d;
    dirLight.shadow.camera.top = d;
    dirLight.shadow.camera.bottom = -d;
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x9bc4d9, 0.55);
    rimLight.position.set(-10, 4, -8);
    scene.add(rimLight);

    // --- Shared Low-Poly Materials ---
    const matDeepBlue = new THREE.MeshStandardMaterial({
      color: 0x0f355c,
      roughness: 0.65,
      metalness: 0.05,
      flatShading: true
    });
    const matMidBlue = new THREE.MeshStandardMaterial({
      color: 0x245d8f,
      roughness: 0.6,
      metalness: 0.04,
      flatShading: true
    });
    const matLightBlue = new THREE.MeshStandardMaterial({
      color: 0x89b3c4,
      roughness: 0.55,
      metalness: 0.02,
      flatShading: true
    });
    const matFoam = new THREE.MeshStandardMaterial({
      color: 0xf4efe2,
      roughness: 0.85,
      metalness: 0.0,
      flatShading: true
    });
    const matFujiBody = new THREE.MeshStandardMaterial({
      color: 0x283a4d,
      roughness: 0.85,
      flatShading: true
    });
    const matBoatWood = new THREE.MeshStandardMaterial({
      color: 0xd4a474,
      roughness: 0.78,
      flatShading: true
    });
    const matBoatTrim = new THREE.MeshStandardMaterial({
      color: 0x453222,
      roughness: 0.85,
      flatShading: true
    });
    const matRowerCloth = new THREE.MeshStandardMaterial({
      color: 0x1c3a57,
      roughness: 0.8,
      flatShading: true
    });
    const matRowerHead = new THREE.MeshStandardMaterial({
      color: 0xe6c19c,
      roughness: 0.8,
      flatShading: true
    });
    const matCloud = new THREE.MeshStandardMaterial({
      color: 0xf2ebd9,
      roughness: 0.95,
      flatShading: true,
      transparent: true,
      opacity: 0.72
    });

    // --- 1. Mount Fuji (Background Right-of-Center) ---
    const fujiGroup = new THREE.Group();
    fujiGroup.position.set(2.4, -1.7, -11.5);

    const fujiConeGeo = new THREE.ConeGeometry(4.4, 3.6, 11, 4);
    // Slightly roughen vertices for organic low-poly look
    const fPos = fujiConeGeo.attributes.position;
    for (let i = 0; i < fPos.count; i++) {
      const y = fPos.getY(i);
      if (y < 1.6 && y > -1.7) {
        fPos.setX(i, fPos.getX(i) + (Math.sin(i * 3.1) * 0.14));
        fPos.setZ(i, fPos.getZ(i) + (Math.cos(i * 2.7) * 0.14));
      }
    }
    fujiConeGeo.computeVertexNormals();
    const fujiMesh = new THREE.Mesh(fujiConeGeo, matFujiBody);
    fujiMesh.position.y = 1.8;
    fujiGroup.add(fujiMesh);

    const fujiSnowGeo = new THREE.ConeGeometry(1.75, 1.48, 11, 2);
    const sPos = fujiSnowGeo.attributes.position;
    for (let i = 0; i < sPos.count; i++) {
      const y = sPos.getY(i);
      if (y < 0.2) {
        sPos.setY(i, y + Math.sin(i * 4.5) * 0.18);
      }
    }
    fujiSnowGeo.computeVertexNormals();
    const fujiSnow = new THREE.Mesh(fujiSnowGeo, matFoam);
    fujiSnow.position.y = 2.95;
    fujiGroup.add(fujiSnow);
    scene.add(fujiGroup);

    // --- 2. Low-Poly Clouds ---
    const cloudsGroup = new THREE.Group();
    function createCloud(x, y, z, scale) {
      const g = new THREE.Group();
      const puffs = 4;
      for (let i = 0; i < puffs; i++) {
        const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.9 - i * 0.12, 0), matCloud);
        m.position.set((i - 1.5) * 0.85, Math.sin(i * 1.4) * 0.22, (i % 2) * 0.2);
        m.scale.set(1.4, 0.55, 0.6);
        g.add(m);
      }
      g.position.set(x, y, z);
      g.scale.setScalar(scale);
      return g;
    }
    cloudsGroup.add(createCloud(3.8, 3.6, -13, 1.25));
    cloudsGroup.add(createCloud(-4.5, 4.1, -14, 1.0));
    scene.add(cloudsGroup);

    // --- 3. The Great Wave (Left-to-Center Arching Crest) ---
    const greatWaveGroup = new THREE.Group();
    const waveSegments = 22;
    for (let i = 0; i < waveSegments; i++) {
      const t = i / (waveSegments - 1); // 0 = base left, 1 = curling tip
      const angle = THREE.MathUtils.lerp(-0.45, Math.PI * 0.88, t);
      const radiusX = 4.6 - t * 1.4;
      const radiusY = 4.5 + Math.sin(t * Math.PI) * 0.7;

      const cx = -2.2 - Math.cos(angle) * radiusX;
      const cy = -1.6 + Math.sin(angle) * radiusY;
      const cz = -0.3 + Math.sin(t * Math.PI) * 0.6;

      // Deep blue body block
      const bodyGeo = new THREE.BoxGeometry(1.15, 0.95 + (1 - t) * 1.1, 1.9 - t * 0.7);
      const bodyMat = i % 3 === 0 ? matMidBlue : matDeepBlue;
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.set(cx, cy, cz);
      body.rotation.z = angle - Math.PI * 0.5;
      body.castShadow = true;
      body.receiveShadow = true;
      greatWaveGroup.add(body);

      // Foam crest & claws on upper/outer edge
      if (t > 0.25) {
        const foamCount = t > 0.65 ? 3 : 2;
        for (let f = 0; f < foamCount; f++) {
          const foamSize = (0.34 + (1 - Math.abs(t - 0.75)) * 0.35) * (1 - f * 0.2);
          const foamGeo = new THREE.OctahedronGeometry(foamSize, 0);
          const foam = new THREE.Mesh(foamGeo, f === 0 ? matFoam : matLightBlue);
          const offsetOut = 0.55 + f * 0.38;
          foam.position.set(
            cx - Math.cos(angle) * offsetOut + (f * 0.25),
            cy + Math.sin(angle) * offsetOut + (t > 0.7 ? -f * 0.28 : 0.1),
            cz + (f - 0.5) * 0.45
          );
          foam.rotation.set(i * 0.5, f * 0.8, angle);
          foam.castShadow = true;
          greatWaveGroup.add(foam);
        }
      }
    }
    scene.add(greatWaveGroup);

    // --- 4. Foreground Secondary Wave (Lower Left-Center) ---
    const frontWaveGroup = new THREE.Group();
    for (let i = 0; i < 11; i++) {
      const t = i / 10;
      const x = -3.8 + t * 3.1;
      const y = -3.0 + Math.sin(t * Math.PI * 0.9) * 2.35;
      const z = 2.4 + Math.sin(t * Math.PI) * 0.4;

      const block = new THREE.Mesh(
        new THREE.ConeGeometry(0.95, 1.8, 5),
        i % 2 === 0 ? matDeepBlue : matMidBlue
      );
      block.position.set(x, y - 0.5, z);
      block.rotation.z = (0.5 - t) * 0.65;
      block.scale.set(1.2, 1.1, 0.9);
      block.receiveShadow = true;
      frontWaveGroup.add(block);

      if (t > 0.3) {
        const crest = new THREE.Mesh(new THREE.DodecahedronGeometry(0.38, 0), matFoam);
        crest.position.set(x, y + 0.35, z + 0.2);
        frontWaveGroup.add(crest);
      }
    }
    scene.add(frontWaveGroup);

    // --- 5. Ocean Swells (Layered Low-Poly Sea) ---
    const seaGroup = new THREE.Group();
    const swellRows = [
      { z: -6.5, y: -2.4, color: matDeepBlue, amp: 0.45 },
      { z: -3.2, y: -2.7, color: matMidBlue, amp: 0.55 },
      { z: 0.2,  y: -3.1, color: matDeepBlue, amp: 0.6 },
      { z: 3.6,  y: -3.5, color: matMidBlue, amp: 0.65 }
    ];
    swellRows.forEach((row, rIdx) => {
      const geo = new THREE.PlaneGeometry(28, 3.8, 26, 3);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vx = pos.getX(i);
        const vz = pos.getZ(i);
        const vy = Math.sin(vx * 0.65 + rIdx * 1.3) * row.amp + Math.cos(vz * 1.1) * 0.2;
        pos.setY(i, vy);
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, row.color);
      mesh.position.set(0, row.y, row.z);
      mesh.receiveShadow = true;
      seaGroup.add(mesh);
    });
    scene.add(seaGroup);

    // --- 6. Three Oshiokuri-bune Boats ---
    function createBoat(withRowers = true) {
      const boat = new THREE.Group();

      // Curved low-poly hull
      const hullSegs = 6;
      for (let i = 0; i < hullSegs; i++) {
        const t = i / (hullSegs - 1); // 0 = stern, 1 = bow
        const x = (t - 0.5) * 3.2;
        const y = Math.pow((t - 0.45) * 1.4, 2) * 0.48;
        const width = Math.sin(t * Math.PI) * 0.46 + 0.12;
        const seg = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.24, width), matBoatWood);
        seg.position.set(x, y, 0);
        seg.rotation.z = (t - 0.45) * 0.42;
        seg.castShadow = true;
        seg.receiveShadow = true;
        boat.add(seg);
      }

      // Prow (sharp upturned bow)
      const prow = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.75, 4), matBoatWood);
      prow.position.set(1.75, 0.62, 0);
      prow.rotation.z = -0.85;
      boat.add(prow);

      // Dark gunwale trim
      const trim = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.06, 0.48), matBoatTrim);
      trim.position.set(-0.05, 0.2, 0);
      boat.add(trim);

      if (withRowers) {
        const rowerCount = 7;
        for (let r = 0; r < rowerCount; r++) {
          const rx = -0.9 + r * 0.32;
          const ry = 0.24 + Math.pow((r / rowerCount - 0.4) * 1.1, 2) * 0.18;
          const torso = new THREE.Mesh(new THREE.DodecahedronGeometry(0.11, 0), matRowerCloth);
          torso.position.set(rx, ry, (r % 2 === 0 ? 0.1 : -0.1));
          boat.add(torso);

          const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.07, 0), matRowerHead);
          head.position.set(rx + 0.04, ry + 0.11, (r % 2 === 0 ? 0.1 : -0.1));
          boat.add(head);
        }
      }
      return boat;
    }

    // Boat 1: Left, riding up the great wave
    const boat1 = createBoat(true);
    boat1.position.set(-4.3, -0.85, 0.35);
    boat1.rotation.set(0.15, 0.25, 0.62);
    boat1.scale.setScalar(0.95);
    scene.add(boat1);

    // Boat 2: Mid-right, in front of Mount Fuji
    const boat2 = createBoat(true);
    boat2.position.set(2.55, -2.05, -4.4);
    boat2.rotation.set(0.05, -0.3, -0.18);
    boat2.scale.setScalar(0.82);
    scene.add(boat2);

    // Boat 3: Foreground, lower center-right
    const boat3 = createBoat(true);
    boat3.position.set(1.35, -2.85, 2.75);
    boat3.rotation.set(0.08, -0.15, -0.08);
    boat3.scale.setScalar(1.08);
    scene.add(boat3);

    // --- 7. Floating Sea Spray Particles ---
    const sprayCount = 140;
    const sprayGeo = new THREE.BufferGeometry();
    const sprayPositions = new Float32Array(sprayCount * 3);
    const spraySeeds = [];
    for (let i = 0; i < sprayCount; i++) {
      sprayPositions[i * 3] = (Math.random() - 0.5) * 10 - 0.5;
      sprayPositions[i * 3 + 1] = Math.random() * 6.5 - 2.0;
      sprayPositions[i * 3 + 2] = (Math.random() - 0.5) * 6;
      spraySeeds.push(Math.random() * Math.PI * 2);
    }
    sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPositions, 3));
    const sprayMat = new THREE.PointsMaterial({
      color: 0xf7f3e6,
      size: 0.11,
      transparent: true,
      opacity: 0.85
    });
    const sprayPoints = new THREE.Points(sprayGeo, sprayMat);
    scene.add(sprayPoints);

    // --- Pointer Parallax ---
    const pointer = { x: 0, y: 0 };
    window.addEventListener('pointermove', (e) => {
      pointer.x = (e.clientX / window.innerWidth - 0.5) * 2;
      pointer.y = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // --- Resize Handler ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Animation Loop (Gentle Motion) ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Gentle camera breathing + subtle pointer parallax
      camera.position.x += (baseCamPos.x + Math.sin(t * 0.25) * 0.25 + pointer.x * 0.45 - camera.position.x) * 0.04;
      camera.position.y += (baseCamPos.y + Math.cos(t * 0.3) * 0.14 - pointer.y * 0.28 - camera.position.y) * 0.04;
      camera.lookAt(0, -0.35, 0);

      // Great wave gentle heave
      greatWaveGroup.position.y = Math.sin(t * 0.9) * 0.12;
      greatWaveGroup.rotation.z = Math.sin(t * 0.7) * 0.015;

      // Foreground wave bob
      frontWaveGroup.position.y = Math.cos(t * 1.05) * 0.1;

      // Sea swells undulate
      seaGroup.children.forEach((swell, idx) => {
        swell.position.y = swellRows[idx].y + Math.sin(t * 1.1 + idx * 0.9) * 0.08;
      });

      // Boats rock with the waves
      boat1.position.y = -0.85 + Math.sin(t * 1.2) * 0.12;
      boat1.rotation.z = 0.62 + Math.sin(t * 1.2 + 0.5) * 0.05;

      boat2.position.y = -2.05 + Math.sin(t * 1.0 + 1.4) * 0.09;
      boat2.rotation.z = -0.18 + Math.cos(t * 1.0 + 1.4) * 0.04;

      boat3.position.y = -2.85 + Math.sin(t * 1.15 + 2.3) * 0.11;
      boat3.rotation.z = -0.08 + Math.sin(t * 1.15 + 2.3) * 0.045;

      // Clouds drift slowly
      cloudsGroup.position.x = Math.sin(t * 0.08) * 0.5;

      // Spray particles float
      const sp = sprayGeo.attributes.position;
      for (let i = 0; i < sprayCount; i++) {
        const seed = spraySeeds[i];
        sp.setY(i, sp.getY(i) + Math.sin(t * 1.4 + seed) * 0.0025);
      }
      sp.needsUpdate = true;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
