<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Universo das Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e1a; --ink:#eef1fb; --muted:#8b93ad; --line:rgba(255,255,255,.09);
    --glass:rgba(16,21,38,.72);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0;display:block;cursor:grab}
  #scene:active{cursor:grabbing}

  #hud{position:fixed;top:18px;left:18px;z-index:5;max-width:340px;pointer-events:none}
  #hud h1{font-family:Fraunces,serif;font-weight:600;font-size:26px;margin:0 0 4px;letter-spacing:.2px}
  #hud .stats{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
  #hud .stats b{color:var(--ink);font-weight:600}
  #searchbox{position:relative;pointer-events:auto}
  #search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--glass);color:var(--ink);font:500 14px Inter,sans-serif;outline:none;backdrop-filter:blur(10px)}
  #search:focus{border-color:rgba(120,140,255,.5)}
  #suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--glass);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:blur(10px);display:none}
  #suggestions .sug{padding:9px 14px;font-size:14px;cursor:pointer}
  #suggestions .sug:hover{background:rgba(120,140,255,.18)}

  #panel{position:fixed;top:18px;right:18px;z-index:6;width:300px;max-height:calc(100vh - 36px);
    overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:16px;
    padding:18px;backdrop-filter:blur(12px)}
  #panel h2{font-family:Fraunces,serif;font-size:26px;margin:0 0 6px;font-weight:600}
  #panel .badge{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:12px}
  #panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:14px 0 8px}
  #panel .chips{display:flex;flex-wrap:wrap;gap:6px}
  #panel .chip{font:500 13px Inter,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
  #panel .chip:hover{background:rgba(120,140,255,.22);border-color:transparent}
  #panel .none{color:var(--muted);font-size:13px}
  #panel .notfound{color:var(--muted);font-size:14px}
  #close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-size:16px;cursor:pointer;line-height:1}
  #close:hover{color:var(--ink);background:rgba(255,255,255,.08)}

  #legend{position:fixed;left:18px;bottom:18px;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;
    max-width:420px;background:var(--glass);border:1px solid var(--line);border-radius:14px;
    padding:10px 14px;backdrop-filter:blur(10px)}
  #legend .leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  #legend .dot{width:9px;height:9px;border-radius:50%}
  #legend .n{opacity:.6}
  #hint{position:fixed;bottom:18px;right:18px;z-index:5;font-size:11.5px;color:var(--muted);
    background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:7px 12px;backdrop-filter:blur(8px)}

  #fallback{position:fixed;inset:0;overflow:auto;padding:80px 20px 40px;display:none}
  #fallback .inner{max-width:760px;margin:0 auto}
  #fallback h1{font-family:Fraunces,serif;font-size:30px;margin:0 0 6px}
  #fallback .note{color:var(--muted);font-size:13px;margin:0 0 16px}
  #fblist{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  #fblist .chip{font:500 13px Inter,sans-serif;color:var(--ink);background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer}
  #fblist .chip:hover{background:rgba(120,140,255,.22)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="fallback" hidden>
  <div class="inner">
    <h1>O Universo das Palavras</h1>
    <p class="note" id="fbstats"></p>
    <p class="note">A visualização 3D não carregou (sem acesso à CDN). Use a busca ou a lista abaixo; as relações aparecem no painel.</p>
    <div id="fblist"></div>
  </div>
</div>

<header id="hud">
  <h1>O Universo das Palavras</h1>
  <p class="stats" id="stats"></p>
  <div id="searchbox">
    <input id="search" placeholder="buscar uma palavra… (ex.: saudade)" autocomplete="off" spellcheck="false">
    <div id="suggestions"></div>
  </div>
</header>

<aside id="panel" hidden>
  <button id="close" title="fechar">×</button>
  <h2 id="pword"></h2>
  <span id="ptheme" class="badge" hidden></span>
  <div id="pbody"></div>
</aside>

<div id="legend"></div>
<div id="hint">arraste para girar · role para zoom · clique numa palavra</div>

// ---------- model ----------
const words = Object.keys(DATA);
const index = new Map(words.map((w,i)=>[w,i]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const byNorm = new Map(words.map(w=>[norm(w),w]));

const adj = new Map(words.map(w=>[w,new Set()]));
const pairSet = new Set();
words.forEach(w=>{
  DATA[w].sinonimos.concat(DATA[w].analogas).forEach(t=>{
    if(t===w) return;
    if(!adj.has(t)) adj.set(t,new Set());
    adj.get(w).add(t); adj.get(t).add(w);
    const k=[w,t].sort().join('\u0000');
    if(!pairSet.has(k)) pairSet.add(k);
  });
});
const pairCount = pairSet.size;
let most=words[0], mostN=-1;
[...adj.keys()].sort().forEach(w=>{ const n=adj.get(w).size; if(n>mostN){mostN=n;most=w;} });

const THEMES = {
  'sentimentos':'#ff6b9d','linguagem':'#4ecdc4','comida':'#ffb347','lugares':'#a78bfa',
  'tempo':'#60a5fa','corpo':'#f87171','natureza':'#4ade80','artes':'#facc15',
  'ofícios':'#fb923c','família':'#f472b6'
};
const themeColor = t => THEMES[t] || '#94a3b8';

// ---------- shared UI ----------
const $ = id => document.getElementById(id);
const panel=$('panel'), pword=$('pword'), ptheme=$('ptheme'), pbody=$('pbody');
const search=$('search'), sug=$('suggestions');
let selected=null, hovered=null, three=null;

document.getElementById('stats').innerHTML =
  words.length+' palavras · '+pairCount+' relações · mais conectada: <b>'+most+'</b> ('+mostN+')';

function fillChips(container, list, empty){
  if(!list.length){ container.innerHTML='<span class="none">'+empty+'</span>'; return; }
  list.forEach(w=>{
    const b=document.createElement('button');
    b.className='chip'; b.textContent=w; b.onclick=()=>select(w);
    container.appendChild(b);
  });
}
function updatePanel(word){
  if(!word){ panel.hidden=true; return; }
  panel.hidden=false;
  if(!DATA[word]){
    pword.textContent=word; ptheme.hidden=true;
    pbody.innerHTML='<p class="notfound">Esta palavra não existe no universo.</p>';
    return;
  }
  pword.textContent=word;
  const t=DATA[word].tema;
  if(t){ ptheme.hidden=false; ptheme.textContent=t;
    ptheme.style.background=themeColor(t)+'2e'; ptheme.style.color=themeColor(t); }
  else ptheme.hidden=true;
  pbody.innerHTML='';
  const h1=document.createElement('h3'); h1.textContent='Sinônimos'; pbody.appendChild(h1);
  const c1=document.createElement('div'); c1.className='chips'; pbody.appendChild(c1);
  fillChips(c1, DATA[word].sinonimos, 'nenhum');
  const h2=document.createElement('h3'); h2.textContent='Palavras análogas'; pbody.appendChild(h2);
  const c2=document.createElement('div'); c2.className='chips'; pbody.appendChild(c2);
  fillChips(c2, DATA[word].analogas, 'nenhuma');
  const own=new Set(DATA[word].sinonimos.concat(DATA[word].analogas));
  const extra=[...adj.get(word)].filter(w=>!own.has(w)).sort((a,b)=>a.localeCompare(b,'pt'));
  if(extra.length){
    const h3=document.createElement('h3'); h3.textContent='Também ligada a'; pbody.appendChild(h3);
    const c3=document.createElement('div'); c3.className='chips'; pbody.appendChild(c3);
    fillChips(c3, extra, '');
  }
}
function setUrl(word){
  try{
    if(word) history.replaceState(null,'','?word='+encodeURIComponent(word));
    else history.replaceState(null,'',location.pathname);
  }catch(e){/* file:// may disallow; reading still works */}
}
function select(word, opts={}){
  const {updateUrl=true}=opts;
  selected=word;
  updatePanel(word);
  if(updateUrl) setUrl(word);
  if(three) three.select(word);
}
$('close').onclick=()=>select(null);

// search
function onSearch(){
  const q=norm(search.value.trim());
  if(three){
    sug.style.display='none'; sug.innerHTML='';
    if(!q) return;
    const matches=words.filter(w=>norm(w).includes(q)).slice(0,12);
    matches.forEach(w=>{
      const d=document.createElement('div'); d.className='sug'; d.textContent=w;
      d.onclick=()=>{ select(w); search.value=w; sug.style.display='none'; sug.innerHTML=''; };
      sug.appendChild(d);
    });
    sug.style.display=matches.length?'block':'none';
  }else{
    filterFbList(q);
  }
}
search.addEventListener('input',onSearch);
search.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ const f=sug.querySelector('.sug'); if(f) f.onclick(); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('#searchbox')) sug.style.display='none'; });

// legend
const legend=$('legend');
Object.entries(THEMES).forEach(([t,c])=>{
  const n=words.filter(w=>DATA[w].tema===t).length;
  const d=document.createElement('div'); d.className='leg';
  d.innerHTML='<span class="dot" style="background:'+c+'"></span>'+t+' <span class="n">'+n+'</span>';
  legend.appendChild(d);
});

// deep link
const want=new URLSearchParams(location.search).get('word');
const pending = want ? (byNorm.get(norm(want)) || want) : null;

// ---------- 3D view ----------
async function try3D(){
  let THREE;
  try{ THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js'); }
  catch(e){ initFallback(); return; }

  const N=words.length;
  // force layout
  const pos=new Float32Array(N*3), vel=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=30*Math.cbrt(Math.random()), th=Math.random()*6.2832, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  const edges=[];
  words.forEach((w,i)=>adj.get(w).forEach(t=>{ const j=index.get(t); if(j>i) edges.push([i,j]); }));
  const REST=14, KS=0.03, KR=1200, CENTER=0.012, DAMP=0.85, MAXV=3;
  for(let it=0; it<320; it++){
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      let d2=dx*dx+dy*dy+dz*dz; if(d2<0.01)d2=0.01;
      const d=Math.sqrt(d2), f=KR/d2, fx=f*dx/d, fy=f*dy/d, fz=f*dz/d;
      vel[i*3]+=fx; vel[i*3+1]+=fy; vel[i*3+2]+=fz;
      vel[j*3]-=fx; vel[j*3+1]-=fy; vel[j*3+2]-=fz;
    }
    for(const [i,j] of edges){
      let dx=pos[j*3]-pos[i*3], dy=pos[j*3+1]-pos[i*3+1], dz=pos[j*3+2]-pos[i*3+2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.01, f=KS*(d-REST);
      const fx=f*dx/d, fy=f*dy/d, fz=f*dz/d;
      vel[i*3]+=fx; vel[i*3+1]+=fy; vel[i*3+2]+=fz;
      vel[j*3]-=fx; vel[j*3+1]-=fy; vel[j*3+2]-=fz;
    }
    for(let i=0;i<N;i++){
      vel[i*3]-=pos[i*3]*CENTER; vel[i*3+1]-=pos[i*3+1]*CENTER; vel[i*3+2]-=pos[i*3+2]*CENTER;
      for(let a=0;a<3;a++){ vel[i*3+a]*=DAMP; vel[i*3+a]=Math.max(-MAXV,Math.min(MAXV,vel[i*3+a])); pos[i*3+a]+=vel[i*3+a]; }
    }
  }

  const canvas=$('scene');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0e1a);
  scene.fog=new THREE.Fog(0x0a0e1a,70,240);
  const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,1000);

  // stars
  const sp=new Float32Array(500*3);
  for(let i=0;i<500;i++){ const r=160+Math.random()*160, th=Math.random()*6.2832, ph=Math.acos(2*Math.random()-1);
    sp[i*3]=r*Math.sin(ph)*Math.cos(th); sp[i*3+1]=r*Math.sin(ph)*Math.sin(th); sp[i*3+2]=r*Math.cos(ph); }
  const sg=new THREE.BufferGeometry(); sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x8899bb,size:0.8,transparent:true,opacity:0.55})));

  // nodes
  const sphereGeo=new THREE.SphereGeometry(1,14,14);
  const nodeMeshes=[];
  words.forEach((w,i)=>{
    const deg=adj.get(w).size;
    const m=new THREE.Mesh(sphereGeo,new THREE.MeshBasicMaterial({color:themeColor(DATA[w].tema),transparent:true,opacity:1}));
    m.position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
    const s=0.5+Math.min(deg,16)*0.07; m.scale.setScalar(s);
    m.userData={word:w,i,baseScale:s};
    scene.add(m); nodeMeshes.push(m);
  });

  // base edges
  const ep=new Float32Array(edges.length*6);
  edges.forEach(([i,j],e)=>{ ep[e*6]=pos[i*3];ep[e*6+1]=pos[i*3+1];ep[e*6+2]=pos[i*3+2];
    ep[e*6+3]=pos[j*3];ep[e*6+4]=pos[j*3+1];ep[e*6+5]=pos[j*3+2]; });
  const eg=new THREE.BufferGeometry(); eg.setAttribute('position',new THREE.BufferAttribute(ep,3));
  scene.add(new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x5566aa,transparent:true,opacity:0.18})));

  // labels (lazy)
  const labelCache=new Map();
  function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function getLabel(w){
    if(labelCache.has(w)) return labelCache.get(w);
    const c=document.createElement('canvas'), ctx=c.getContext('2d');
    const font='600 44px Inter, sans-serif'; ctx.font=font;
    const tw=Math.ceil(ctx.measureText(w).width);
    c.width=tw+28; c.height=64;
    const g=c.getContext('2d'); g.font=font;
    g.fillStyle='rgba(10,14,26,0.6)'; rr(g,0,0,c.width,64,16); g.fill();
    g.strokeStyle='rgba(255,255,255,0.25)'; g.lineWidth=2; rr(g,1,1,c.width-2,62,15); g.stroke();
    g.fillStyle='#fff'; g.textBaseline='middle'; g.fillText(w,14,34);
    const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
    const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
    const sc=0.055; spr.scale.set(c.width*sc,64*sc,1);
    const i=index.get(w), m=nodeMeshes[i];
    spr.position.set(m.position.x,m.position.y+m.userData.baseScale+1.4,m.position.z);
    spr.visible=false; scene.add(spr); labelCache.set(w,spr);
    return spr;
  }
  function updateLabels(){
    const show=new Set();
    if(selected){ show.add(selected); adj.get(selected).forEach(t=>show.add(t)); }
    if(hovered) show.add(hovered);
    nodeMeshes.forEach(m=>{
      const w=m.userData.word;
      if(show.has(w)) getLabel(w).visible=true;
      else if(labelCache.has(w)) labelCache.get(w).visible=false;
    });
  }

  // highlight edges
  let hl=null;
  function setHighlight(word){
    if(hl){ scene.remove(hl); hl.geometry.dispose(); hl=null; }
    if(!word) return;
    const idx=index.get(word), pts=[];
    edges.forEach(([i,j])=>{ if(i===idx||j===idx)
      pts.push(pos[i*3],pos[i*3+1],pos[i*3+2],pos[j*3],pos[j*3+1],pos[j*3+2]); });
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
    hl=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.75}));
    scene.add(hl);
  }

  // camera
  let theta=0.6, phi=1.1, radius=95;
  const target=new THREE.Vector3(), focusTarget=new THREE.Vector3();
  let focusing=false, focusRadius=95;
  function updateCamera(){
    if(focusing){
      target.lerp(focusTarget,0.08); radius+=(focusRadius-radius)*0.08;
      if(target.distanceTo(focusTarget)<0.1 && Math.abs(radius-focusRadius)<0.2) focusing=false;
    }
    camera.position.set(
      target.x+radius*Math.sin(phi)*Math.cos(theta),
      target.y+radius*Math.cos(phi),
      target.z+radius*Math.sin(phi)*Math.sin(theta));
    camera.lookAt(target);
  }

  const api={
    select(word){
      const nbrs=word?adj.get(word):null;
      nodeMeshes.forEach(m=>{
        const w=m.userData.word; let op=1, sc=m.userData.baseScale;
        if(word){ if(w===word){sc*=1.8;} else if(nbrs.has(w)){sc*=1.25;} else op=0.12; }
        m.material.opacity=op; m.scale.setScalar(sc);
      });
      setHighlight(word); updateLabels();
      if(word){ const i=index.get(word);
        focusTarget.set(pos[i*3],pos[i*3+1],pos[i*3+2]); focusRadius=46; focusing=true; }
    }
  };
  three=api;

  // pointer
  const raycaster=new THREE.Raycaster(), mouse=new THREE.Vector2();
  let dragging=false, moved=0, lx=0, ly=0;
  canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;lx=e.clientX;ly=e.clientY;});
  addEventListener('pointermove',e=>{
    if(dragging){
      const dx=e.clientX-lx, dy=e.clientY-ly; moved+=Math.abs(dx)+Math.abs(dy);
      theta-=dx*0.005; phi=Math.max(0.15,Math.min(Math.PI-0.15,phi-dy*0.005));
      lx=e.clientX; ly=e.clientY; focusing=false;
    }
    mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(mouse,camera);
    const hits=raycaster.intersectObjects(nodeMeshes,false);
    const h=hits.length?hits[0].object.userData.word:null;
    if(h!==hovered){ hovered=h; updateLabels(); canvas.style.cursor=h?'pointer':'grab'; }
  });
  addEventListener('pointerup',e=>{
    if(dragging && moved<6){
      mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
      raycaster.setFromCamera(mouse,camera);
      const hits=raycaster.intersectObjects(nodeMeshes,false);
      select(hits.length?hits[0].object.userData.word:null);
    }
    dragging=false;
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    radius=Math.max(12,Math.min(230,radius*(1+Math.sign(e.deltaY)*0.08))); focusing=false;
  },{passive:false});
  addEventListener('resize',()=>{
    renderer.setSize(innerWidth,innerHeight);
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  });

  (function animate(){
    requestAnimationFrame(animate);
    if(!dragging && !selected) theta+=0.0005;
    updateCamera(); renderer.render(scene,camera);
  })();

  if(pending) select(pending);
}

// ---------- fallback ----------
function initFallback(){
  $('scene').style.display='none';
  $('hint').style.display='none';
  $('legend').style.display='none';
  const fb=$('fallback'); fb.hidden=false; fb.style.display='block';
  document.getElementById('fbstats').textContent=
    words.length+' palavras · '+pairCount+' relações · mais conectada: '+most+' ('+mostN+')';
  const list=$('fblist');
  words.slice().sort((a,b)=>a.localeCompare(b,'pt')).forEach(w=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=w;
    b.dataset.word=w; b.onclick=()=>select(w); list.appendChild(b);
  });
  window.filterFbList=q=>{
    [...list.children].forEach(b=>{ b.style.display=!q||norm(b.dataset.word).includes(q)?'':'none'; });
  };
  if(pending) select(pending);
}

try3D();
</script>
