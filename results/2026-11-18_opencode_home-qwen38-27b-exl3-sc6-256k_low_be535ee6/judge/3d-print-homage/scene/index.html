<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Great Wave off Kanagawa — low poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#e9dfc6;overflow:hidden}
  #c{display:block;width:100vw;height:100vh}
  .cap{position:fixed;left:18px;bottom:14px;font-family:'Shippori Mincho',serif;
       color:#2a3a4a;pointer-events:none;line-height:1.25}
  .cap b{font-size:18px;font-weight:700}
  .cap span{font-size:12px;opacity:.7}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><b>The Great Wave off Kanagawa</b><br><span>low poly rebuild · Hokusai, c.1831 (public domain)</span></div>
<script type="module">
import * as THREE from 'three';

// ---- palette sampled from the print ----
const C = {
  sky:      0xe9dfc6, // aged washi cream
  skyGlow:  0xf4ecd6,
  blueDeep: 0x163a5e, // prussian / indigo body
  blueMid:  0x245a86,
  blueLite: 0x4d82ab,
  foam:     0xf4f1e6, // white foam
  boatTan:  0xc79a5b, // ochre deck
  boatDark: 0x2a1c10, // hull
  fujiBlue: 0x2c4d6e,
  fujiSnow: 0xf2efe4,
  figure:   0x1a1410,
};
const mat = (c, o={}) => new THREE.MeshStandardMaterial({ color:c, flatShading:true, roughness:.9, metalness:0, ...o });

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.sky);
scene.fog = new THREE.Fog(C.sky, 9, 22);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 100);
camera.position.set(0, 1.3, 7.2);
camera.lookAt(0, 1.0, 0);

const renderer = new THREE.WebGLRenderer({ canvas:document.getElementById('c'), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

scene.add(new THREE.AmbientLight(0xfff4e0, .85));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.1);
sun.position.set(4, 6, 5);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd2e8, .35);
fill.position.set(-5, 2, -3);
scene.add(fill);

// ---- swept low-poly ribbon (the curling wave body) ----
function makeSwept(profile, width, thickness, closed=true){
  const n = profile.length, pos = [], idx = [], tang = [];
  for (let i=0;i<n;i++){
    const p=profile[closed?(i-1+n)%n:Math.max(0,i-1)], q=profile[closed?(i+1)%n:Math.min(n-1,i+1)];
    let tx=q[0]-p[0], ty=q[1]-p[1]; const L=Math.hypot(tx,ty)||1;
    tang.push([tx/L, ty/L]);
  }
  for (let i=0;i<n;i++){
    const [x,y]=profile[i], [tx,ty]=tang[i], nx=-ty, ny=tx, hx=thickness/2, hw=width/2;
    pos.push(x+nx*hx,y+ny*hx,-hw, x+nx*hx,y+ny*hx,hw, x-nx*hx,y-ny*hx,hw, x-nx*hx,y-ny*hx,-hw);
  }
  const last = closed?n:n-1;
  for (let i=0;i<last;i++){
    const a=i*4, b=(i+1)*4;
    for (let c=0;c<4;c++){ const d=(c+1)%4; idx.push(a+c,a+d,b+d, a+c,b+d,b+c); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// white foam "claws" along a crest
function addFoam(group, profile, thickness, indices, size){
  const up=new THREE.Vector3(0,1,0);
  const cone=new THREE.ConeGeometry(size, size*2.1, 6);
  const m=mat(C.foam);
  for (const i of indices){
    const [x,y]=profile[i];
    const p=profile[(i-1+profile.length)%profile.length], q=profile[(i+1)%profile.length];
    let tx=q[0]-p[0], ty=q[1]-p[1]; const L=Math.hypot(tx,ty)||1;
    const nx=-ty/L, ny=tx/L;
    const mesh=new THREE.Mesh(cone, m);
    mesh.position.set(x+nx*(thickness/2+size*.45), y+ny*(thickness/2+size*.45), 0);
    mesh.quaternion.setFromUnitVectors(up, new THREE.Vector3(nx,ny,0));
    group.add(mesh);
  }
}

// ---- the great wave (left, curling over to the left) ----
const greatProfile = [
  [2.6,0.0],[1.7,1.4],[0.9,2.6],[-0.2,3.2],[-1.4,3.1],[-2.4,2.3],
  [-2.7,1.1],[-2.2,0.3],[-1.2,0.5],[-0.4,1.3],[0.5,1.5],[1.4,1.0],[2.1,0.4]
];
const great = new THREE.Group();
const body = new THREE.Mesh(makeSwept(greatProfile, 2.3, .95), mat(C.blueDeep));
great.add(body);
// white foam crest band along the top arc
const crest = greatProfile.slice(1, 8);
const band = new THREE.Mesh(makeSwept(crest, 2.3, .34, false), mat(C.foam));
band.position.set(0, .12, 0);
great.add(band);
addFoam(great, greatProfile, .95, [1,2,3,4,5,6,7], .42);
// secondary lighter blue inner swell
const inner = new THREE.Mesh(makeSwept(greatProfile.map(p=>[p[0]*.7,p[1]*.7]), 1.6, .6), mat(C.blueMid));
inner.position.z = .1;
great.add(inner);
great.position.set(-1.3, .35, -.6);
great.scale.setScalar(.95);
scene.add(great);

// ---- foreground rolling wave mounds ----
function waveMound(r){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.ConeGeometry(r, r*1.15, 7), mat(C.blueMid));
  base.scale.y=.85; g.add(base);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(r*.62, r*.7, 7), mat(C.blueLite));
  cap.position.y=r*.55; g.add(cap);
  const foam=new THREE.Mesh(new THREE.ConeGeometry(r*.5, r*.5, 6), mat(C.foam));
  foam.position.y=r*.95; g.add(foam);
  for (let k=0;k<5;k++){
    const a=k/5*Math.PI*2;
    const f=new THREE.Mesh(new THREE.ConeGeometry(r*.16, r*.3, 5), mat(C.foam));
    f.position.set(Math.cos(a)*r*.5, r*.7, Math.sin(a)*r*.5);
    g.add(f);
  }
  return g;
}
const mounds=[];
[[-2.1,-.7,1.6,1.1],[.4,-.9,1.9,1.25],[2.3,-.6,1.5,1.0]].forEach(([x,y,z,r])=>{
  const m=waveMound(r); m.position.set(x,y,z); scene.add(m); mounds.push(m);
});

// ---- Mount Fuji (background, right of centre, snow cap) ----
const fuji=new THREE.Group();
const fBase=new THREE.Mesh(new THREE.ConeGeometry(1.15,1.7,8), mat(C.fujiBlue));
fuji.add(fBase);
const fSnow=new THREE.Mesh(new THREE.ConeGeometry(.5,0.6,8), mat(C.fujiSnow));
fSnow.position.y=.55; fuji.add(fSnow);
fuji.position.set(1.7,1.25,-1.6);
fuji.scale.setScalar(1.15);
scene.add(fuji);

// ---- boats (three, as in the print) ----
function boat(len, crew){
  const g=new THREE.Group();
  const hull=new THREE.Mesh(new THREE.BoxGeometry(len,.28,.5), mat(C.boatDark));
  g.add(hull);
  const deck=new THREE.Mesh(new THREE.BoxGeometry(len*.92,.1,.42), mat(C.boatTan));
  deck.position.y=.16; g.add(deck);
  // tapered bow/stern
  const bow=new THREE.Mesh(new THREE.ConeGeometry(.26,.5,4), mat(C.boatTan));
  bow.rotation.z=-Math.PI/2; bow.position.set(len/2,.1,0); g.add(bow);
  const stern=new THREE.Mesh(new THREE.ConeGeometry(.26,.5,4), mat(C.boatTan));
  stern.rotation.z=Math.PI/2; stern.position.set(-len/2,.1,0); g.add(stern);
  // crew: small dark figures
  const head=new THREE.SphereGeometry(.06,6,5);
  const bodyg=new THREE.CylinderGeometry(.05,.07,.16,5);
  for (let i=0;i<crew;i++){
    const x=-len*.32 + i*(len*.64/Math.max(1,crew-1));
    const b=new THREE.Mesh(bodyg, mat(C.figure)); b.position.set(x,.3,0); g.add(b);
    const h=new THREE.Mesh(head, mat(C.figure)); h.position.set(x,.42,0); g.add(h);
  }
  return g;
}
const boats=[];
const b1=boat(1.5,4); b1.position.set(-2.3,.7,.3); b1.rotation.z=.5; scene.add(b1); boats.push(b1);
const b2=boat(2.4,5); b2.position.set(1.7,.45,.4); b2.rotation.z=-.18; scene.add(b2); boats.push(b2);
const b3=boat(2.0,6); b3.position.set(.2,-.55,1.3); b3.rotation.z=.12; scene.add(b3); boats.push(b3);

// ---- faint sun glow top-right ----
const glow=new THREE.Mesh(new THREE.CircleGeometry(1.4,24),
  new THREE.MeshBasicMaterial({ color:C.skyGlow, transparent:true, opacity:.6 }));
glow.position.set(2.6,3.4,-4); scene.add(glow);

// ---- gentle motion ----
const clock=new THREE.Clock();
function animate(){
  const t=clock.getElapsedTime();
  great.rotation.z = Math.sin(t*.5)*.04;
  great.position.y = .35 + Math.sin(t*.7)*.06;
  boats.forEach((b,i)=>{
    b.rotation.z += Math.sin(t*.9+i*1.7)*.0016;
    b.rotation.x  = Math.sin(t*.8+i*2.1)*.05;
    b.position.y += Math.sin(t*1.1+i*1.3)*.0016;
  });
  mounds.forEach((m,i)=>{ m.position.y += Math.sin(t*.9+i*2.0)*.0012; });
  glow.material.opacity = .5 + Math.sin(t*.6)*.08;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
