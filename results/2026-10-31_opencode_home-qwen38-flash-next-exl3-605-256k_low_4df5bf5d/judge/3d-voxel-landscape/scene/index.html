<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chureito Pagoda at Dusk</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1230; }
  canvas { display: block; }
  #caption { position: fixed; left: 14px; bottom: 12px; color: #ffdcea; opacity: .7;
             font: 12px/1.4 system-ui, sans-serif; letter-spacing: .06em; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="caption">Chureito Pagoda &middot; Mount Fuji at dusk</div>
<script type="module">
import * as THREE from 'three';

// ---------- deterministic rng ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261031);

function groundHeight(x, z) {
  let h = 2.0 * Math.sin(x * 0.042) * Math.cos(z * 0.05)
        + 1.2 * Math.sin(x * 0.11 + 1.7) * Math.sin(z * 0.085 + 0.4);
  const d = Math.hypot(x + 16, z + 40); // flatten the plateau under the pagoda
  h *= THREE.MathUtils.smoothstep(d, 14, 46);
  return h;
}

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc9919b, 0.0016);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 2200);
const camBase = new THREE.Vector3(16, 13, 84);
const camTarget = new THREE.Vector3(-6, 30, -160);
camera.position.copy(camBase);
camera.lookAt(camTarget);

// ---------- lights (low warm sun, violet sky fill) ----------
const hemi = new THREE.HemisphereLight(0x9a7fb5, 0x33304a, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffb37a, 2.1);
sun.position.set(-160, 55, 90);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x7f8fd0, 0.4);
fill.position.set(180, 90, -120);
scene.add(fill);

// ---------- gradient dusk sky dome ----------
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    top:    { value: new THREE.Color(0x2a2153) },
    mid:    { value: new THREE.Color(0x8a5a8f) },
    bottom: { value: new THREE.Color(0xf2a65a) },
    sunDir: { value: new THREE.Vector3(-0.55, 0.08, -1).normalize() }
  },
  vertexShader: `
    varying vec3 vDir;
    void main() { vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    varying vec3 vDir;
    uniform vec3 top, mid, bottom, sunDir;
    void main() {
      float h = clamp(vDir.y, -0.05, 1.0);
      vec3 c = mix(bottom, mid, smoothstep(0.0, 0.25, h));
      c = mix(c, top, smoothstep(0.22, 0.75, h));
      float glow = pow(max(dot(normalize(vDir), normalize(sunDir)), 0.0), 24.0);
      c += vec3(1.0, 0.72, 0.42) * glow * 0.85;
      gl_FragColor = vec4(c, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat));

// ---------- low-poly ground ----------
{
  let geo = new THREE.PlaneGeometry(1400, 1400, 72, 72);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setY(i, groundHeight(pos.getX(i), pos.getZ(i)));
  }
  geo = geo.toNonIndexed();
  geo.computeVertexNormals();
  const p = geo.attributes.position;
  const colors = new Float32Array(p.count * 3);
  const grass = new THREE.Color(0x55704f), far = new THREE.Color(0x39405c), c = new THREE.Color();
  for (let i = 0; i < p.count; i += 3) {
    const x = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3;
    const z = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3;
    const t = THREE.MathUtils.smoothstep(-z, 60, 420);
    c.copy(grass).lerp(far, t);
    for (let j = 0; j < 3; j++) {
      colors[(i + j) * 3] = c.r; colors[(i + j) * 3 + 1] = c.g; colors[(i + j) * 3 + 2] = c.b;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 1, flatShading: true })));
}

// ---------- Mount Fuji (lathe profile + noise + snowline vertex colors) ----------
{
  const profile = [
    [150, 0], [128, 10], [104, 26], [84, 44], [66, 60], [50, 74],
    [37, 86], [27, 96], [19, 103], [14, 108], [11, 111], [8, 110],
    [4, 108.5], [0, 108]
  ].map(q => new THREE.Vector2(q[0], q[1]));
  let geo = new THREE.LatheGeometry(profile, 26);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const r = Math.hypot(x, z);
    if (r < 0.001) continue;
    const a = Math.atan2(z, x);
    const n = Math.sin(a * 4 + 2.1) * 0.6 + Math.sin(a * 9 + y * 0.15) * 0.3 + Math.sin(a * 17) * 0.15;
    const k = 1 + n * 0.05 * (1 - y / 130);
    pos.setX(i, x * k); pos.setZ(i, z * k);
  }
  geo = geo.toNonIndexed();
  geo.computeVertexNormals();
  const p = geo.attributes.position;
  const colors = new Float32Array(p.count * 3);
  const rock = new THREE.Color(0x4a4a72), snowC = new THREE.Color(0xf3e9f2), c = new THREE.Color();
  for (let i = 0; i < p.count; i += 3) {
    const y = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
    const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3;
    const cz = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3;
    const ang = Math.atan2(cz, cx);
    const line = 64 + Math.sin(ang * 5 + 1.3) * 7 + Math.sin(ang * 11) * 4;
    c.copy(rock).lerp(snowC, THREE.MathUtils.smoothstep(y, line - 4, line + 6));
    for (let j = 0; j < 3; j++) {
      colors[(i + j) * 3] = c.r; colors[(i + j) * 3 + 1] = c.g; colors[(i + j) * 3 + 2] = c.b;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const fuji = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 1, flatShading: true }));
  fuji.position.set(0, groundHeight(0, -330) - 2, -330);
  scene.add(fuji);
}

// ---------- distant ridges for depth ----------
for (const [x, z, r, h] of [[-280, -250, 130, 55], [250, -290, 150, 70], [330, -140, 90, 40], [-340, -120, 100, 36]]) {
  const ridge = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7),
    new THREE.MeshStandardMaterial({ color: 0x565079, roughness: 1, flatShading: true }));
  ridge.position.set(x, groundHeight(x, z) - 4, z);
  ridge.rotation.y = rand() * Math.PI;
  scene.add(ridge);
}

// ---------- five-tier red pagoda ----------
function buildPagoda() {
  const g = new THREE.Group();
  const red = new THREE.MeshStandardMaterial({ color: 0xa8262c, roughness: .8, flatShading: true });
  const dark = new THREE.MeshStandardMaterial({ color: 0x3a3448, roughness: .9, flatShading: true });
  const stone = new THREE.MeshStandardMaterial({ color: 0x8d8a93, roughness: 1, flatShading: true });
  const gold = new THREE.MeshStandardMaterial({ color: 0xd9a441, roughness: .4, metalness: .3, flatShading: true });

  const base = new THREE.Mesh(new THREE.BoxGeometry(17, 2.4, 17), stone);
  base.position.y = 1.2; g.add(base);

  let y = 2.4, w = 10.5;
  for (let i = 0; i < 5; i++) {
    const bodyH = 4.2 - i * 0.25;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, bodyH, w), red);
    body.position.y = y + bodyH / 2; g.add(body);
    const band = new THREE.Mesh(new THREE.BoxGeometry(w * .62, bodyH * .38, w * .62), dark);
    band.position.y = y + bodyH * .52; g.add(band);
    y += bodyH;
    const roofR = w * 0.92 + 2.6 - i * 0.2;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(roofR, 2.4, 4), dark);
    roof.rotation.y = Math.PI / 4; roof.position.y = y + 1.2; g.add(roof);
    const eave = new THREE.Mesh(new THREE.BoxGeometry(roofR * 1.42, 0.5, roofR * 1.42), dark);
    eave.rotation.y = Math.PI / 4; eave.position.y = y + 0.35; g.add(eave);
    y += 2.6; w *= 0.86;
  }
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 6, 6), gold);
  spire.position.y = y + 3; g.add(spire);
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.9 - i * 0.22, 0.12, 6, 12), gold);
    ring.rotation.x = Math.PI / 2; ring.position.y = y + 1.6 + i * 1.1; g.add(ring);
  }
  return g;
}
const pagoda = buildPagoda();
pagoda.position.set(-16, groundHeight(-16, -40), -40);
pagoda.rotation.y = 0.35;
scene.add(pagoda);

// ---------- small torii gate ----------
function buildTorii() {
  const g = new THREE.Group();
  const red = new THREE.MeshStandardMaterial({ color: 0xb3272d, roughness: .8, flatShading: true });
  const dark = new THREE.MeshStandardMaterial({ color: 0x241f2e, roughness: .9, flatShading: true });
  for (const sx of [-2.2, 2.2]) {
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 6, 8), red);
    pillar.position.set(sx, 3, 0); g.add(pillar);
  }
  const beam = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.5, 0.6), red);
  beam.position.y = 6.1; g.add(beam);
  const beam2 = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.4, 0.5), red);
  beam2.position.y = 5.1; g.add(beam2);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(6.9, 0.35, 0.85), dark);
  cap.position.y = 6.5; g.add(cap);
  return g;
}
const torii = buildTorii();
torii.position.set(12, groundHeight(12, 6), 6);
torii.rotation.y = -0.25;
scene.add(torii);

// ---------- cherry trees in bloom ----------
function makeTree(rng, scale) {
  const g = new THREE.Group();
  const bark = new THREE.MeshStandardMaterial({ color: 0x4c3a32, roughness: 1, flatShading: true });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.8, 6, 6), bark);
  trunk.position.y = 3; trunk.rotation.z = (rng() - .5) * .18; g.add(trunk);
  for (let i = 0; i < 3; i++) {
    const br = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.3, 3.4, 5), bark);
    const a = rng() * Math.PI * 2;
    br.position.set(Math.cos(a) * 1.4, 5.4 + rng(), Math.sin(a) * 1.4);
    br.rotation.set(Math.sin(a) * .9, 0, -Math.cos(a) * .9);
    g.add(br);
  }
  const pinks = [0xf6c3d6, 0xf1a9c6, 0xffdcea, 0xef9ec0];
  for (let i = 0; i < 7; i++) {
    const r = 1.6 + rng() * 1.8;
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0),
      new THREE.MeshStandardMaterial({ color: pinks[(rng() * pinks.length) | 0], roughness: .95, flatShading: true }));
    const a = rng() * Math.PI * 2, d = rng() * 2.6;
    blob.position.set(Math.cos(a) * d, 6.6 + rng() * 2.6, Math.sin(a) * d);
    blob.scale.y = 0.72; g.add(blob);
  }
  g.scale.setScalar(scale);
  return g;
}
for (const [x, z, s] of [[44, 52, 1.35], [-40, 30, 1.3], [-30, -18, 1.0], [44, -5, 0.9], [-46, 62, 1.8]]) {
  const tree = makeTree(rand, s);
  tree.position.set(x, groundHeight(x, z), z);
  scene.add(tree);
}

// ---------- drifting low-poly clouds ----------
const clouds = [];
for (let i = 0; i < 7; i++) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color: 0xf3c3a6, roughness: 1, flatShading: true, transparent: true, opacity: 0.9 });
  const n = 4 + (rand() * 3 | 0);
  for (let j = 0; j < n; j++) {
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(6 + rand() * 9, 1), mat);
    blob.position.set((rand() - .5) * 34, (rand() - .5) * 3, (rand() - .5) * 14);
    blob.scale.y = 0.35; g.add(blob);
  }
  g.position.set((rand() - .5) * 1300, 120 + rand() * 60, -200 - rand() * 320);
  g.userData.speed = 1.5 + rand() * 2.5;
  clouds.push(g); scene.add(g);
}

// ---------- falling sakura petals ----------
const PETALS = 260;
const petals = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.34, 0.24),
  new THREE.MeshStandardMaterial({
    color: 0xf7c1d8, roughness: 1, side: THREE.DoubleSide,
    emissive: 0xd88aa8, emissiveIntensity: 0.55 }),
  PETALS);
const petalData = [];
for (let i = 0; i < PETALS; i++) {
  petalData.push({
    x: rand() * 170 - 85, y: rand() * 55 + 3, z: rand() * 150 - 65,
    phase: rand() * Math.PI * 2, speed: 1.2 + rand() * 1.6, spin: (rand() - .5) * 3
  });
}
scene.add(petals);
const dummy = new THREE.Object3D();

// ---------- animation loop ----------
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  camera.position.set(
    camBase.x + Math.sin(t * 0.07) * 2.2,
    camBase.y + Math.sin(t * 0.11) * 0.8,
    camBase.z);
  camera.lookAt(camTarget);

  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 750) c.position.x = -750;
  }

  for (let i = 0; i < PETALS; i++) {
    const d = petalData[i];
    d.y -= d.speed * dt;
    d.x += Math.sin(t * 0.8 + d.phase) * 1.6 * dt;
    if (d.y < 0.2) { d.y = 50 + rand() * 12; d.x = rand() * 170 - 85; }
    dummy.position.set(d.x, d.y, d.z);
    dummy.rotation.set(t * d.spin + d.phase, d.phase, t * 0.7 + d.phase);
    dummy.updateMatrix();
    petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
