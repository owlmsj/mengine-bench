<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanagawa-oki Nami-ura — Low Poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8ddc4;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .cartouche{
    position:fixed;top:32px;left:36px;pointer-events:none;color:#22313f;
    font-family:'Cormorant Garamond',serif;line-height:1.5;text-shadow:0 1px 0 rgba(255,255,255,.35);
    opacity:.92;
  }
  .cartouche h1{font-size:clamp(18px,2.4vw,30px);font-weight:500;letter-spacing:.06em;margin:0;font-style:italic;}
  .cartouche p{font-size:clamp(10px,1.1vw,14px);margin:4px 0 0;letter-spacing:.18em;text-transform:uppercase;opacity:.75;}
  .credit{position:fixed;bottom:18px;right:22px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:#22313f;opacity:.6;pointer-events:none;}
</style>
</head>
<body>
<div id="app"></div>
<div class="cartouche"><h1>Kanagawa-oki Nami-ura</h1><p>Thirty-six Views of Mount Fuji · Under the Wave off Kanagawa</p></div>
<div class="credit">low-poly rebuild after Hokusai</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const INK=0x1b3a5f, INDIGO=0x2b4d79, DEEP=0x14294a, CREAM=0xf3ecd9, FOAM=0xf7f2e4;
const TAU=Math.PI*2;

const app=document.getElementById('app');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xe8ddc4);
scene.fog=new THREE.Fog(0xe8ddc4, 55, 150);

const camera=new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 9.5, 34);
camera.lookAt(0, 5.2, 0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xf6ead0, 0x2b4d79, 1.15);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0, 2.2);
sun.position.set(-18,26,14);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-40;sun.shadow.camera.right=40;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;
scene.add(sun);

const flat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.95,metalness:0,flatShading:true});

// Sky ribbon + distant cloud bands
const skyGeo=new THREE.PlaneGeometry(320,120,1,1);
const skyMat=new THREE.MeshBasicMaterial({color:0xefe4c9,fog:false});
const sky=new THREE.Mesh(skyGeo,skyMat); sky.position.set(0,52,-95); scene.add(sky);

function cloud(w,x,y,z,c=0xf2e8d2){
  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),flat(c));
  m.scale.set(w,w*.28,w*.5); m.position.set(x,y,z); m.rotation.y=Math.random()*TAU;
  scene.add(m); return m;
}
const clouds=[cloud(16,-26,20,-62),cloud(22,10,24,-66,0xeadfc6),cloud(13,30,18,-58)]; clouds.forEach((c,i)=>{c.userData.bx=c.position.x;c.userData.sp=.3+i*.15;});

// Mount Fuji, snow-capped, distant low center-right
const fuji=new THREE.Group();
const cone=new THREE.Mesh(new THREE.ConeGeometry(11,13,7,1),flat(0x7a6f66));
cone.position.y=6.5; fuji.add(cone);
const cap=new THREE.Mesh(new THREE.ConeGeometry(3.4,3.9,7,1),flat(CREAM));
cap.position.y=10.55; fuji.add(cap);
// faint gray gradient ridge behind
const ridge=new THREE.Mesh(new THREE.ConeGeometry(16,7,5,1),flat(0x8b8178));
ridge.position.set(-14,3.2,-26); fuji.add(ridge);
fuji.position.set(6,-1.5,-70); fuji.scale.set(1,1,1); scene.add(fuji);

// Water: layered flat planes
const waterMat=flat(INDIGO);
const water=new THREE.Mesh(new THREE.PlaneGeometry(240,120,24,12),waterMat);
water.rotation.x=-Math.PI/2; water.position.set(0,-0.4,-20); water.receiveShadow=true; scene.add(water);

// Diagonal swell strips lower right
const swells=[];
for(let i=0;i<3;i++){
  const s=new THREE.Mesh(new THREE.SphereGeometry(7,10,6),flat(DEEP));
  s.scale.set(1.9,.32,.55);
  s.position.set(18+i*7,0.2,-2+i*5);
  s.rotation.y=-.5+i*.12; scene.add(s); swells.push(s);
}

// Big curling wave, left
const waveGroup=new THREE.Group();
const waveBody=new THREE.Mesh(new THREE.TorusGeometry(7.2,2.5,7,14,Math.PI*1.35),flat(INK));
waveBody.rotation.set(0,0,0.45); waveBody.position.set(-13,6.5,-6); waveBody.castShadow=true;
waveGroup.add(waveBody);
const curl=new THREE.Mesh(new THREE.SphereGeometry(3.4,8,6),flat(INK));
curl.scale.set(1.25,1.35,.9); curl.position.set(-8.4,8.6,-6); waveGroup.add(curl);
const foamDots=[];
for(let i=0;i<11;i++){
  const a=Math.PI*.15+i*.24;
  const f=new THREE.Mesh(new THREE.IcosahedronGeometry(.85+Math.random()*.5,0),flat(FOAM));
  f.position.set(-13+Math.cos(a)*9.4, 6.5+Math.sin(a)*7.2, -5.1+Math.random()*1.4);
  foamDots.push(f); waveGroup.add(f);
}
const crest=new THREE.Mesh(new THREE.IcosahedronGeometry(2.1,0),flat(FOAM));
crest.position.set(-6.6,10.4,-6); crest.scale.set(1.6,.9,.8); foamDots.push(crest); waveGroup.add(crest);
scene.add(waveGroup);

// Smaller foreground wave left
const fgWave=new THREE.Mesh(new THREE.SphereGeometry(5.2,9,6),flat(INDIGO));
fgWave.scale.set(1.8,.55,.9); fgWave.position.set(-14,.6,9); fgWave.castShadow=true; scene.add(fgWave);
const fgFoam=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,0),flat(FOAM));
fgFoam.position.set(-14.8,2.0,9); fgFoam.scale.set(2.2,.7,1); scene.add(fgFoam);

// Boat builder: hull + rowers
function makeBoat(len, tint){
  const g=new THREE.Group();
  const hull=new THREE.Mesh(new THREE.CylinderGeometry(.55,.85,len,7,1,false,0,Math.PI),flat(0x8a5a34));
  hull.rotation.z=Math.PI/2; hull.scale.set(1,1,1); g.add(hull);
  // deck rim
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,len*.96,7,1,true),flat(tint));
  rim.rotation.z=Math.PI/2; rim.scale.set(1,1,.72); g.add(rim);
  const nR=Math.round(len/1.7);
  for(let i=0;i<nR;i++){
    const r=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.9,3,6),flat(0x274b73));
    body.rotation.z=Math.PI/2.4; body.position.y=.75; r.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.3,7,6),flat(0xe8c9a0));
    head.position.set(.42,1.18,0); r.add(head);
    r.position.set(-len/2+.9+i*(len-1.8)/Math.max(1,nR-1),0,0);
    r.rotation.z=.3; g.add(r);
  }
  return g;
}
const boats=[];
const b1=makeBoat(6.5,0xb98a55); b1.position.set(-13.5,3.1,-2); b1.rotation.set(0,.25,.55); scene.add(b1); boats.push({g:b1,ph:0});
const b2=makeBoat(6,0xb98a55);  b2.position.set(7.5,2.1,-4);  b2.rotation.set(0,-.3,.3);  scene.add(b2); boats.push({g:b2,ph:2.1});
const b3=makeBoat(6.8,0x6b4a2e); b3.position.set(4.5,-.1,7.5); b3.rotation.set(0,.35,-.18); scene.add(b3); boats.push({g:b3,ph:4.2});
// extra hull color via rim tint is enough

// Foam sea speckles
const speckles=[];
for(let i=0;i<26;i++){
  const s=new THREE.Mesh(new THREE.IcosahedronGeometry(.28+Math.random()*.35,0),flat(FOAM));
  s.position.set((Math.random()*2-1)*38,.25+Math.random()*.5,-12+Math.random()*26);
  scene.add(s); speckles.push(s);
}

// gentle animation
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  waveGroup.position.y=Math.sin(t*.7)*.5;
  waveGroup.rotation.z=Math.sin(t*.5)*.03;
  curl.scale.y=1.35+Math.sin(t*.9)*.06;
  foamDots.forEach((f,i)=>{f.position.y+=Math.sin(t*1.3+i)*.004;});
  fgWave.position.y=.6+Math.sin(t*1.1+1)*.35;
  fgFoam.position.y=2.0+Math.sin(t*1.1+1)*.35;
  swells.forEach((s,i)=>{s.position.y=.2+Math.sin(t*.8+i*1.4)*.22; s.rotation.x=Math.sin(t*.6+i)*.05;});
  boats.forEach(({g,ph})=>{
    g.position.y+=Math.sin(t*1.05+ph)*.004;
    g.rotation.z+=Math.sin(t*.9+ph)*.0006;
    g.rotation.x=Math.sin(t*.8+ph)*.05;
  });
  clouds.forEach(c=>{c.position.x=c.userData.bx+Math.sin(t*c.userData.sp)*3;});
  water.position.y=-.4+Math.sin(t*.6)*.12;
  speckles.forEach((s,i)=>{s.position.y=.25+Math.sin(t*1.4+i*2.2)*.18;});
  renderer.render(camera,scene);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
