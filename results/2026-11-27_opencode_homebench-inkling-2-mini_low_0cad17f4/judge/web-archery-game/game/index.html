<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Balloons — Windows 95 Archer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2a3a; --panel:#fdf6e3; --accent:#e63946; --gold:#ffd166;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow:hidden; background:#0d1b2a; font-family:'Rubik',sans-serif;}
  #wrap{position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 700px at 50% 120%, #16324f 0%, #0d1b2a 60%, #060d16 100%);}
  #game{position:relative; width:min(100vw, calc(100vh * 16 / 10)); height:min(100vh, calc(100vw * 10 / 16));
    box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 6px #2b3d52, 0 0 0 10px #101c2a; border-radius:8px; overflow:hidden; cursor:crosshair; background:#7ec8e3;}
  canvas{display:block; width:100%; height:100%;}
  #hud{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 18px; pointer-events:none; font-family:'Press Start 2P', monospace;}
  .chip{background:rgba(13,27,42,.72); border:2px solid rgba(255,209,102,.55); border-radius:8px; padding:8px 12px;
    color:#ffe9a8; font-size:12px; line-height:1.5; text-shadow:1px 1px 0 #000;}
  .chip small{display:block; font-family:'Rubik',sans-serif; font-weight:600; letter-spacing:.12em; font-size:9px; color:#9fd8ef; text-transform:uppercase; margin-bottom:2px;}
  #lives{display:flex; gap:6px; margin-top:4px;}
  .heart{font-size:14px; color:#ff5b6a; text-shadow:1px 1px 0 #000; letter-spacing:2px;}
  .heart.off{color:#3a4a5e;}
  #power{position:absolute; left:18px; bottom:18px; width:230px; pointer-events:none; opacity:0; transition:opacity .12s;}
  #power.on{opacity:1;}
  #power .label{font-family:'Press Start 2P'; font-size:10px; color:#fff; text-shadow:1px 1px 0 #000; margin-bottom:6px;}
  #powerBar{height:16px; border:2px solid #fff; border-radius:9px; background:rgba(0,0,0,.35); overflow:hidden;}
  #powerFill{height:100%; width:0%; background:linear-gradient(90deg,#7bd95b,#ffd166 60%,#ff5b3a); transition:width .05s linear;}
  .overlay{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:rgba(9,17,28,.78); backdrop-filter:blur(4px); text-align:center; z-index:5; transition:opacity .35s;}
  .overlay.hidden{opacity:0; pointer-events:none; visibility:hidden;}
  .overlay h1{font-family:'Press Start 2P'; color:#ffd166; font-size:clamp(22px,4.6vw,44px); line-height:1.5; text-shadow:3px 3px 0 #b3541e, 6px 6px 0 rgba(0,0,0,.4);}
  .overlay p{color:#cfe3ee; font-size:clamp(13px,1.6vw,17px); max-width:560px; line-height:1.6; padding:0 24px;}
  .btn{font-family:'Press Start 2P'; font-size:clamp(12px,1.6vw,16px); color:#1b2a3a; background:linear-gradient(#ffe08a,#ffb347);
    border:0; border-radius:10px; padding:16px 28px; cursor:pointer; box-shadow:0 6px 0 #b3541e, 0 10px 24px rgba(0,0,0,.45);
    transition:transform .08s, box-shadow .08s; letter-spacing:.05em;}
  .btn:hover{transform:translateY(-2px); box-shadow:0 8px 0 #b3541e, 0 14px 28px rgba(0,0,0,.5);}
  .btn:active{transform:translateY(3px); box-shadow:0 2px 0 #b3541e;}
  #finalScore{font-family:'Press Start 2P'; color:#fff; font-size:clamp(16px,2.6vw,26px); text-shadow:2px 2px 0 #000;}
  #finalScore span{color:#ffd166;}
  .kbd{display:inline-block; background:#21384e; border:1px solid #4a6b84; border-bottom-width:3px; border-radius:6px; padding:1px 8px; color:#ffe9a8; font-size:12px; margin:0 2px;}
  #toast{position:absolute; top:86px; left:50%; transform:translateX(-50%); font-family:'Press Start 2P'; font-size:clamp(10px,1.4vw,14px);
    color:#fff; text-shadow:2px 2px 0 #000; pointer-events:none; opacity:0; z-index:4;}
</style>
</head>
<body>
<div id="wrap">
  <div id="game">
    <canvas id="cv" width="1280" height="800"></canvas>
    <div id="hud">
      <div class="chip"><small>Score</small><span id="score">0</span></div>
      <div class="chip" style="text-align:right"><small>Balloons</small><span id="popped">0</span><div id="lives"></div></div>
    </div>
    <div id="power"><div class="label">DRAW</div><div id="powerBar"><div id="powerFill"></div></div></div>
    <div id="toast"></div>
    <div class="overlay" id="startScreen">
      <h1>POP<br>BALLOONS</h1>
      <p>Aim with your mouse. <b>Hold</b> to pull the bow back, <b>release</b> to loose. Pop balloons for points — let them escape or miss, and you lose a heart. Three hearts gone and it's over.</p>
      <button class="btn" id="startBtn">START GAME</button>
      <p style="font-size:12px; opacity:.75">Win 500 points to clear the level</p>
    </div>
    <div class="overlay hidden" id="endScreen">
      <h1 id="endTitle">GAME OVER</h1>
      <div id="finalScore">SCORE <span id="finalVal">0</span></div>
      <p id="endMsg">The balloons won this round.</p>
      <button class="btn" id="againBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>
<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), poppedEl = $('popped'), livesEl = $('lives'), toastEl = $('toast');
  const powerEl = $('power'), powerFill = $('powerFill');

  // ---- audio ----
  let AC = null;
  const audio = () => (AC ||= new (window.AudioContext || window.webkitAudioContext)());
  function beep(freq, dur, type='square', vol=0.18, slide=0){
    const a = audio(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  function noiseBurst(dur=0.15, vol=0.25, hp=1000){
    const a = audio(), len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type='highpass'; f.frequency.value = hp;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination); src.start();
  }
  const sfx = {
    shoot(){ noiseBurst(0.18, 0.22, 600); beep(300, 0.18, 'sawtooth', 0.12, -220); },
    pop(){ noiseBurst(0.12, 0.35, 1800); beep(620, 0.12, 'square', 0.16, 480); },
    miss(){ beep(160, 0.3, 'triangle', 0.2, -90); },
    lose(){ beep(220, 0.4, 'sawtooth', 0.16, -140); setTimeout(()=>beep(140, 0.5, 'sawtooth', 0.16, -80), 200); },
    win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'square',0.15), i*130)); },
    draw(){ /* tick handled during pull */ },
    drawTick(t){ beep(180 + t*260, 0.05, 'square', 0.05); },
  };

  // ---- state ----
  const ARCHER = { x: 150, y: H - 120 };
  const WIN_SCORE = 500, MAX_HEARTS = 3;
  let state, raf, balloons, arrows, particles, pops, spawnTimer, elapsed, lastTick;

  function reset(){
    state = { screen:'start', score:0, popped:0, hearts:MAX_HEARTS, aim:Math.atan2(H*0.35-ARCHER.y, W*0.7-ARCHER.x),
              drawing:false, power:0, over:false };
    balloons = []; arrows = []; particles = []; pops = []; spawnTimer = 0.4; elapsed = 0; lastTick = 0;
    updateHUD();
  }

  function updateHUD(){
    scoreEl.textContent = state.score;
    poppedEl.textContent = state.popped;
    livesEl.innerHTML = '';
    for (let i=0;i<MAX_HEARTS;i++){
      const s = document.createElement('span'); s.className = 'heart' + (i < state.hearts ? '' : ' off'); s.textContent = '♥';
      livesEl.appendChild(s);
    }
  }

  // ---- balloons ----
  const COLORS = ['#ff5b6a','#ffd166','#7bd95b','#5bc0ff','#c77dff','#ff9f5b'];
  function spawnBalloon(){
    const r = 34 + Math.random()*16;
    balloons.push({ x: 420 + Math.random()*(W-520), y: H + r + 20, r, vy: 40 + Math.random()*55, sway: Math.random()*Math.PI*2,
                    swayAmp: 20 + Math.random()*30, color: COLORS[(Math.random()*COLORS.length)|0], worth: Math.round(r/4)*10 + 20, wobble: Math.random()*10 });
  }

  // ---- input ----
  const game = $('game');
  function toGame(e){
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  game.addEventListener('mousemove', e => {
    if (state.screen !== 'play' || state.over) return;
    const p = toGame(e);
    state.aim = Math.atan2(p.y - ARCHER.y, p.x - ARCHER.x);
  });
  game.addEventListener('mousedown', e => {
    if (state.screen !== 'play' || state.over) return;
    if (e.button !== 0) return;
    state.drawing = true; state.power = 0; lastTick = 0;
    powerEl.classList.add('on');
  });
  window.addEventListener('mouseup', () => {
    if (!state.drawing) return;
    state.drawing = false; powerEl.classList.remove('on');
    if (state.screen !== 'play' || state.over) { state.power = 0; return; }
    if (state.power < 0.12) return; // too weak, cancel
    shoot();
  });
  game.addEventListener('touchstart', e => { e.preventDefault(); if (state.screen!=='play'||state.over) return; state.drawing = true; state.power = 0; powerEl.classList.add('on'); }, {passive:false});
  game.addEventListener('touchmove', e => { e.preventDefault(); const p = toGame(e.touches[0]); state.aim = Math.atan2(p.y - ARCHER.y, p.x - ARCHER.x); }, {passive:false});
  game.addEventListener('touchend', e => { e.preventDefault(); if (!state.drawing) return; state.drawing = false; powerEl.classList.remove('on'); if (state.power >= 0.12 && state.screen==='play' && !state.over) shoot(); }, {passive:false});

  function shoot(){
    const power = state.power;
    const speed = 620 + power * 1150;
    arrows.push({ x: ARCHER.x + Math.cos(state.aim)*70, y: ARCHER.y + Math.sin(state.aim)*70,
                  vx: Math.cos(state.aim)*speed, vy: Math.sin(state.aim)*speed, rot: state.aim, life: 4 });
    sfx.shoot();
    state.power = 0; powerFill.style.width = '0%';
  }

  function toast(t){
    toastEl.textContent = t; toastEl.style.transition = 'none'; toastEl.style.opacity = 1;
    clearTimeout(toast._t); toast._t = setTimeout(()=>{ toastEl.style.transition = 'opacity .6s'; toastEl.style.opacity = 0; }, 1100);
  }

  // ---- update ----
  function update(dt){
    elapsed += dt;
    if (state.drawing){
      const prev = state.power;
      state.power = Math.min(1, state.power + dt / 1.25);
      powerFill.style.width = (state.power*100) + '%';
      if (Math.floor(state.power*6) !== Math.floor(prev*6)) sfx.drawTick(state.power);
    }
    spawnTimer -= dt;
    if (spawnTimer <= 0 && balloons.length < 7){
      spawnBalloon();
      spawnTimer = Math.max(0.55, 1.5 - elapsed * 0.012);
    }
    for (const b of balloons){
      b.y -= b.vy * dt;
      b.sway += dt * 1.4;
      b.x += Math.sin(b.sway) * b.swayAmp * dt * 0.6;
      b.wobble += dt * 6;
    }
    // balloons escaped
    for (let i = balloons.length - 1; i >= 0; i--){
      if (balloons[i].y + balloons[i].r < -10){
        balloons.splice(i,1);
        if (!state.over){ loseHeart('Escaped!'); }
      }
    }
    // arrows
    for (let i = arrows.length - 1; i >= 0; i--){
      const a = arrows[i];
      a.vy += 620 * dt; a.x += a.vx * dt; a.y += a.vy * dt; a.rot = Math.atan2(a.vy, a.vx); a.life -= dt;
      let hit = false;
      for (let j = balloons.length - 1; j >= 0; j--){
        const b = balloons[j], dx = a.x - b.x, dy = a.y - b.y;
        if (dx*dx + dy*dy < (b.r*0.92)**2){
          popBalloon(j, b); hit = true; break;
        }
      }
      if (hit || a.life <= 0 || a.x > W + 60 || a.y > H + 60 || a.x < -60 || a.y < -80){
        arrows.splice(i,1);
        if (!hit && a.x > -40 && a.y < H + 40){ /* missed */ }
      }
    }
    // particles
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 500*dt; p.life -= dt;
      if (p.life <= 0) particles.splice(i,1);
    }
    for (let i = pops.length - 1; i >= 0; i--){ pops[i].t += dt; if (pops[i].t > 0.5) pops.splice(i,1); }
  }

  function popBalloon(j, b){
    balloons.splice(j,1);
    state.popped++; state.score += b.worth;
    pops.push({x:b.x, y:b.y, t:0, color:b.color});
    for (let k=0;k<16;k++){
      const ang = Math.random()*Math.PI*2, sp = 120 + Math.random()*260;
      particles.push({x:b.x, y:b.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 120, life:0.5+Math.random()*0.4, color:b.color, size:2+Math.random()*4});
    }
    sfx.pop(); toast('+' + b.worth);
    updateHUD();
    if (state.score >= WIN_SCORE){ endGame(true); }
  }

  function loseHeart(msg){
    state.hearts--; sfx.miss(); toast(msg); updateHUD();
    if (state.hearts <= 0) endGame(false);
  }

  function endGame(won){
    if (state.over) return;
    state.over = true; state.drawing = false; powerEl.classList.remove('on');
    setTimeout(() => {
      $('endScreen').classList.remove('hidden');
      $('endTitle').textContent = won ? 'LEVEL CLEAR!' : 'GAME OVER';
      $('endTitle').style.color = won ? '#7bd95b' : '#ffd166';
      $('finalVal').textContent = state.score;
      $('endMsg').textContent = won ? 'You cleared the level. Impressive aim.' : 'The balloons won this round.';
      state.screen = 'over';
      won ? sfx.win() : sfx.lose();
    }, won ? 500 : 650);
  }

  // ---- drawing ----
  function draw(){
    // sky
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0, '#8fd3f4'); sky.addColorStop(0.55, '#bdeaf7'); sky.addColorStop(1, '#fdf3c8');
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
    // sun
    ctx.save(); ctx.translate(W-180, 130); ctx.rotate(elapsed*0.15);
    ctx.strokeStyle = 'rgba(255,200,60,.5)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let i=0;i<10;i++){ ctx.rotate(Math.PI*2/10); ctx.beginPath(); ctx.moveTo(0,86); ctx.lineTo(0,106); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(W-180,130,64,0,7); ctx.fill();
    ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(W-180,130,52,0,7); ctx.fill();
    // clouds
    drawCloud((elapsed*22)%(W+300)-150, 120, 1); drawCloud((elapsed*14+500)%(W+300)-150, 210, 0.7);
    // hills
    ctx.fillStyle = '#6fbf5a'; ctx.beginPath(); ctx.ellipse(W*0.28, H+70, W*0.55, 190, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#57a847'; ctx.beginPath(); ctx.ellipse(W*0.82, H+90, W*0.5, 160, 0, Math.PI, 0); ctx.fill();
    // ground
    ctx.fillStyle = '#3e7d3a'; ctx.fillRect(0, H-90, W, 90);
    ctx.fillStyle = '#2f6130'; ctx.fillRect(0, H-90, W, 10);
    // grass tufts
    ctx.strokeStyle = '#69c24f'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let x=20; x<W; x+=64){ const h = 12 + Math.sin(x*3.7)*6; ctx.beginPath(); ctx.moveTo(x, H-88); ctx.lineTo(x-5, H-88-h); ctx.moveTo(x,H-88); ctx.lineTo(x+5, H-88-h-4); ctx.stroke(); }

    // archer
    drawArcher();
    // balloons
    for (const b of balloons) drawBalloon(b);
    // arrows
    for (const a of arrows) drawArrow(a);
    // particles
    for (const p of particles){ ctx.globalAlpha = Math.max(0, p.life*2); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); }
    ctx.globalAlpha = 1;
    // pop rings
    for (const p of pops){ const k = p.t/0.5; ctx.globalAlpha = 1-k; ctx.strokeStyle = p.color; ctx.lineWidth = 4*(1-k)+1; ctx.beginPath(); ctx.arc(p.x,p.y, 10 + k*70, 0, 7); ctx.stroke(); }
    ctx.globalAlpha = 1;
    // aim guide while drawing
    if (state.drawing && state.power > 0.05){
      ctx.save(); ctx.setLineDash([8,12]); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3;
      // predicted path (rough)
      let px = ARCHER.x + Math.cos(state.aim)*70, py = ARCHER.y + Math.sin(state.aim)*70;
      const speed = 620 + state.power*1150; let vx = Math.cos(state.aim)*speed, vy = Math.sin(state.aim)*speed;
      ctx.beginPath(); ctx.moveTo(px, py);
      for (let i=0;i<26;i++){ vy += 620*0.06; px += vx*0.06; py += vy*0.06; ctx.lineTo(px,py); }
      ctx.stroke(); ctx.restore();
    }
  }

  function drawCloud(x,y,s){
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(0,0,28,0,7); ctx.arc(30,-10,34,0,7); ctx.arc(64,0,26,0,7); ctx.arc(32,10,30,0,7); ctx.fill();
    ctx.restore();
  }
  function drawArcher(){
    const {x,y} = ARCHER;
    ctx.save(); ctx.translate(x,y);
    // body
    ctx.fillStyle = '#274c77'; ctx.fillRect(-16,-70,32,72); // torso
    ctx.fillStyle = '#1a3350'; ctx.fillRect(-16,0,32,26);   // legs
    ctx.fillStyle = '#e8b48a'; ctx.beginPath(); ctx.arc(0,-92,20,0,7); ctx.fill(); // head
    ctx.fillStyle = '#274c77'; ctx.beginPath(); ctx.arc(0,-96,21,Math.PI*0.95,Math.PI*2.05); ctx.fill(); // cap
    ctx.fillStyle = '#16233a'; ctx.fillRect(-14,-70,28,8);   // belt
    // arm toward aim
    const a = state.aim;
    const bx = Math.cos(a), by = Math.sin(a);
    ctx.strokeStyle = '#e8b48a'; ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0,-52); ctx.lineTo(bx*62, -52 + by*62); ctx.stroke();
    // bow
    ctx.save(); ctx.translate(bx*64, -52 + by*64); ctx.rotate(a + Math.PI/2);
    ctx.strokeStyle = '#7a4a21'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(0, 0, 54, -Math.PI*0.42, Math.PI*0.42); ctx.stroke();
    const pull = state.drawing ? state.power * 42 : 0;
    ctx.strokeStyle = '#f5f0e1'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(-Math.PI*0.42)*54, Math.sin(-Math.PI*0.42)*54);
    ctx.lineTo(0, pull);
    ctx.lineTo(Math.cos(Math.PI*0.42)*54, Math.sin(Math.PI*0.42)*54);
    ctx.stroke();
    // string arrow
    if (state.drawing){
      ctx.strokeStyle = '#d8c9a3'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, pull-46); ctx.lineTo(0, pull); ctx.stroke();
      ctx.fillStyle = '#333'; ctx.beginPath(); ctx.moveTo(0, pull-50); ctx.lineTo(-5, pull-38); ctx.lineTo(5, pull-38); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.restore();
  }
  function drawBalloon(b){
    ctx.save(); ctx.translate(b.x, b.y);
    // string
    ctx.strokeStyle = 'rgba(40,40,60,.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, b.r*0.85);
    ctx.quadraticCurveTo(Math.sin(b.wobble)*8, b.r*1.6, Math.sin(b.wobble+1)*10, b.r*2.2);
    ctx.stroke();
    // body
    const g = ctx.createRadialGradient(-b.r*0.3, -b.r*0.35, b.r*0.2, 0, 0, b.r*1.15);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.18, b.color); g.addColorStop(1, shade(b.color, -38));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, b.r*0.88, b.r, 0, 0, 7); ctx.fill();
    ctx.fillStyle = shade(b.color, -45);
    ctx.beginPath(); ctx.moveTo(-7, b.r*0.86); ctx.lineTo(7, b.r*0.86); ctx.lineTo(0, b.r*1.02); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawArrow(a){
    ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = '#dfe6ee'; ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(4,-5); ctx.lineTo(4,5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.moveTo(-34,0); ctx.lineTo(-46,-7); ctx.lineTo(-42,0); ctx.lineTo(-46,7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function shade(hex, amt){
    const n = parseInt(hex.slice(1),16);
    const r = Math.max(0, Math.min(255, (n>>16) + amt));
    const g = Math.max(0, Math.min(255, ((n>>8)&255) + amt));
    const b = Math.max(0, Math.min(255, (n&255) + amt));
    return `rgb(${r},${g},${b})`;
  }

  // ---- loop ----
  let last = 0;
  function frame(t){
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.033, (t - last) / 1000 || 0.016); last = t;
    if (state.screen === 'play' && !state.over) update(dt);
    if (state.screen === 'play') { /* keep particles/pops playing briefly */ }
    draw();
  }

  // ---- flow ----
  function startGame(){
    reset();
    state.screen = 'play';
    $('startScreen').classList.add('hidden');
    $('endScreen').classList.add('hidden');
    audio(); beep(520, 0.12, 'square', 0.12);
    toast('GO!');
  }
  $('startBtn').addEventListener('click', startGame);
  $('againBtn').addEventListener('click', startGame);

  reset(); state.screen = 'start';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
