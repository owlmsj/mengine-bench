<style>

  #panel{position:fixed;left:22px;bottom:22px;z-index:5;width:min(340px,calc(100vw - 44px));background:rgba(18,17,23,.88);border:1px solid #2c2a37;border-radius:16px;padding:18px;backdrop-filter:blur(10px)}

  #panel li button:hover{background:#26242f;color:var(--gold)}
  #hint{position:fixed;bottom:24px;right:24px;z-index:5;font-size:11px;color:#6f6a5f;letter-spacing:.05em}

  #fallback li{margin:6px 0}

<script type="module">
const DATA = JSON.parse(document.getElementById('data').textContent);
const names = Object.keys(DATA).sort();
const DEG = Object.fromEntries(names.map(n=>[n,DATA[n].links.length]));
const THEMES = [...new Set(names.map(n=>DATA[n].theme||'—'))];
const state = { selected:null, rotX:-0.35, rotY:0.4, zoom:13 };
let seed=42; const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };

let THREE=null, scene,camera,renderer,points,selGroup,positions=new Map(),themeColor=new Map();
const container=document.getElementById('scene');

try{
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  THEMES.forEach((t,i)=>{ themeColor.set(t, new THREE.Color().setHSL((i*0.13+0.02)%1, 0.55, 0.62)); });
  const maxDeg=Math.max(...Object.values(DEG));
  names.forEach(n=>{
    const r=4.2+(DEG[n]/maxDeg)*3.5+rnd()*1.2;
    const theta=rnd()*Math.PI*2, phi=Math.acos(2*rnd()-1);
    positions.set(n,new THREE.Vector3(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi)*0.75, r*Math.sin(phi)*Math.sin(theta)));
  });
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x0e0d12,0.028);
  camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,100);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  container.appendChild(renderer.domElement);

  const bg=new THREE.BufferGeometry();
  const bgN=600, bp=new Float32Array(bgN*3);
  for(let i=0;i<bgN;i++){const r=30+rnd()*40,t=rnd()*Math.PI*2,p=Math.acos(2*rnd()-1);bp[i*3]=r*Math.sin(p)*Math.cos(t);bp[i*3+1]=r*Math.cos(p)*0.6;bp[i*3+2]=r*Math.sin(p)*Math.sin(t);}
  bg.setAttribute('position',new THREE.BufferAttribute(bp,3));
  scene.add(new THREE.Points(bg,new THREE.PointsMaterial({color:0x3a3646,size:0.08,transparent:true,opacity:0.8})));

  const nodeGeo=new THREE.BufferGeometry();
  const pos=new Float32Array(names.length*3), col=new Float32Array(names.length*3);
  names.forEach((n,i)=>{const p=positions.get(n);pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z;const c=themeColor.get(DATA[n].theme||'—');col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;});
  nodeGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  nodeGeo.setAttribute('color',new THREE.BufferAttribute(col,3));
  points=new THREE.Points(nodeGeo,new THREE.PointsMaterial({size:0.22,vertexColors:true,transparent:true,opacity:0.95,depthWrite:false}));
  scene.add(points);

  const edgePts=[]; const edgeSet=new Set();
  for(const n of names) for(const t of DATA[n].links){ if(!DATA[t]) continue; const key=[n,t].sort().join('|'); if(edgeSet.has(key)) continue; edgeSet.add(key); const a=positions.get(n),b=positions.get(t); edgePts.push(a.x,a.y,a.z,b.x,b.y,b.z); }
  const eg=new THREE.BufferGeometry();
  eg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(edgePts),3));
  scene.add(new THREE.LineSegments(eg,new THREE.LineBasicMaterial({color:0x4a4658,transparent:true,opacity:0.22})));

  selGroup=new THREE.Group(); scene.add(selGroup);

  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

  let down=false,lx=0,ly=0,moved=0;
  renderer.domElement.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;moved=0;renderer.domElement.setPointerCapture(e.pointerId);});
  addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);state.rotY+=dx*0.005;state.rotX=Math.max(-1.4,Math.min(1.4,state.rotX+dy*0.005));lx=e.clientX;ly=e.clientY;});
  addEventListener('pointerup',()=>down=false);
  renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();state.zoom=Math.max(5,Math.min(30,state.zoom+e.deltaY*0.01));},{passive:false});

  const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
  renderer.domElement.addEventListener('pointerup',e=>{
    if(moved>6) return;
    mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(mouse,camera);
    const hit=ray.intersectObject(points);
    if(hit.length) select(names[hit[0].index]);
  });

  (function tick(){ requestAnimationFrame(tick); rotate(); renderer.render(scene,camera); })();
}catch(err){
  console.error(err);
  showFallback();
}

function rotate(){
  const t=Date.now()*0.0002;
  camera.position.set(Math.sin(state.rotY+t*0.2)*state.zoom, Math.sin(state.rotX)*state.zoom, Math.cos(state.rotY+t*0.2)*state.zoom);
  camera.lookAt(0,0,0);
}

function showFallback(){
  document.getElementById('scene').style.display='none';
  const f=document.getElementById('fallback');
  f.style.display='block';
  f.innerHTML='<h1>Universo de Palavras</h1><p>'+names.length+' palavras · '+countPairs()+' relações</p><ul>'+names.map(n=>'<li><b>'+esc(n)+'</b> ('+(DATA[n].theme||'—')+'): '+DATA[n].links.map(t=>'<a href="#" data-w="'+escAttr(t)+'">'+esc(t)+'</a>').join(', ')+'</li>').join('')+'</ul>';
  f.querySelectorAll('a[data-w]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();select(a.dataset.w);}));
  updatePanel();
}
function countPairs(){const s=new Set();for(const n of names)for(const t of DATA[n].links){if(!DATA[t])continue;s.add([n,t].sort().join('|'));}return s.size;}

function updateStats(){
  const pairs=countPairs();
  const most=names.reduce((a,b)=>(DEG[b]>DEG[a]||(DEG[b]===DEG[a]&&b>a))?b:a);
  document.getElementById('stats').innerHTML='<b>'+names.length+'</b>palavras<br><b>'+pairs+'</b>relações · liga mais: <b>'+esc(most)+'</b>';
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return esc(s);}

function clearHighlight(){
  if(!selGroup) return;
  while(selGroup.children.length){ const c=selGroup.children.pop(); c.geometry?.dispose?.(); c.material?.dispose?.(); }
}
function select(name){
  state.selected=name;
  const url=new URL(location.href); url.searchParams.set('word',name); history.replaceState(null,'',url);
  clearHighlight();
  if(scene){
    const p=positions.get(name); if(!p) return;
    const dot=new THREE.Mesh(new THREE.SphereGeometry(0.34,20,20),new THREE.MeshBasicMaterial({color:0xf4d47c}));
    dot.position.copy(p); selGroup.add(dot);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(0.55,0.02,8,40),new THREE.MeshBasicMaterial({color:0xc9a24b,transparent:true,opacity:0.85}));
    ring.position.copy(p); ring.lookAt(camera.position); selGroup.add(ring);
    for(const t of DATA[name].links){
      if(!positions.get(t)) continue;
      const a=positions.get(name),b=positions.get(t);
      const geo=new THREE.BufferGeometry().setFromPoints([a,b]);
      selGroup.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xf4d47c,transparent:true,opacity:0.7})));
      const tp=positions.get(t);
      const td=new THREE.Mesh(new THREE.SphereGeometry(0.18,14,14),new THREE.MeshBasicMaterial({color:0xffffff}));
      td.position.copy(tp); selGroup.add(td);
    }
  }
  updatePanel();
}
function updatePanel(){
  const n=state.selected;
  const panel=document.getElementById('panel');
  if(!n||!DATA[n]){ panel.querySelector('h1').textContent='—'; panel.querySelector('.tema').textContent='selecione uma palavra'; panel.querySelector('ul').innerHTML=''; return; }
  panel.querySelector('h1').textContent=n;
  panel.querySelector('.tema').textContent='Tema: '+(DATA[n].theme||'—')+' · '+DATA[n].links.length+' conexões';
  panel.querySelector('ul').innerHTML=DATA[n].links.map(t=>'<li><button data-w="'+escAttr(t)+'">'+esc(t)+'</button></li>').join('');
  panel.querySelectorAll('button[data-w]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.w)));
}

const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v) return;
  const hit=names.find(n=>n.toLowerCase()===v) || names.find(n=>n.toLowerCase().startsWith(v)) || names.find(n=>n.toLowerCase().includes(v));
  if(hit) select(hit);
});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=q.value.trim().toLowerCase(); const hit=names.find(n=>n.toLowerCase()===v)||names.find(n=>n.toLowerCase().includes(v)); if(hit)select(hit);}});

updateStats();
const param=new URLSearchParams(location.search).get('word');
if(param && DATA[param]) select(param);
</script>
