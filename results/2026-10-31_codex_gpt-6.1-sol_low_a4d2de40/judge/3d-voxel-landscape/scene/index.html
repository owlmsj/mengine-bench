<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanami · Evening at Chureito</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b89ba9}canvas{display:block;width:100%;height:100%}body{font-family:Georgia,'Times New Roman',serif;color:#fff6e9}.title{position:absolute;left:5.3%;top:7%;pointer-events:none;text-shadow:0 2px 20px #5a465b40}.eyebrow{font:10px Arial,sans-serif;letter-spacing:5px;text-transform:uppercase;color:#6a535d}.title h1{font-weight:normal;font-size:clamp(38px,5vw,76px);letter-spacing:-2px;margin:15px 0 9px}.title p{font-size:13px;letter-spacing:2px;margin:0;color:#725964}.vertical{position:absolute;right:5%;top:8%;writing-mode:vertical-rl;font-size:20px;letter-spacing:10px;color:#735963}.footer{position:absolute;bottom:30px;left:5.3%;right:5.3%;display:flex;justify-content:space-between;align-items:center;font:9px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#fff9eecc}.footer span:first-child{border-top:1px solid #fff9ee80;padding-top:12px}.sound{border:1px solid #fff5e450;border-radius:30px;padding:10px 14px;background:#5e4f6622;color:inherit;font:inherit;letter-spacing:2px;cursor:pointer}.error{display:none;position:absolute;bottom:80px;left:5%;font:14px Arial;color:#6b2030}@media(max-width:600px){.title{top:5%}.title h1{font-size:42px}.title p{font-size:10px}.vertical{font-size:15px;right:6%}.footer{font-size:8px;letter-spacing:1.5px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div class="title"><div class="eyebrow">Thirty-six quiet moments · No. 01</div><h1>Under the blossoms</h1><p>CHUREITO, JAPAN &nbsp; / &nbsp; 富士山</p></div>
<div class="vertical">春の静けさ</div>
<div class="footer"><span>35°30′ N &nbsp; 138°48′ E &nbsp; · &nbsp; Spring, at dusk</span><button class="sound" id="motion" aria-label="Pause animation">Pause breeze &nbsp; Ⅱ</button></div>
<div class="error" id="error">The scene could not load. Please check your internet connection and WebGL support.</div>
<script type="module">
import * as THREE from 'three';

// All forms, including the sky and snow, are constructed here without image assets.
const scene = new THREE.Scene();
scene.background = new THREE.Color('#c5acb9');
scene.fog = new THREE.FogExp2('#c3a9b7', .0055);
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.1,500);
const target=new THREE.Vector3(-3,13,-20);
function frame(){const narrow=innerWidth/innerHeight<1;camera.position.set(narrow?41:43,narrow?31:28,narrow?77:62);camera.lookAt(narrow?new THREE.Vector3(0,14,-15):target);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}frame();
scene.add(new THREE.HemisphereLight('#ffe5d0','#645e80',2.3));
const sunLight=new THREE.DirectionalLight('#ffd1a2',3.1);sunLight.position.set(-45,65,15);sunLight.castShadow=true;sunLight.shadow.mapSize.set(2048,2048);Object.assign(sunLight.shadow.camera,{left:-45,right:45,top:50,bottom:-35,near:1,far:180});sunLight.shadow.bias=-.0005;scene.add(sunLight);
const mat=(color,extra={})=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true,...extra});
const palette={red:mat('#b83d39'),redLight:mat('#df6251'),dark:mat('#383944'),roof:mat('#454450'),roofEdge:mat('#67616a'),gold:mat('#d9a56b'),cream:mat('#efcead'),wood:mat('#69515a'),stone:mat('#94858a'),grass:mat('#858c78')};
function mesh(geometry,material,x=0,y=0,z=0,parent=scene){const object=new THREE.Mesh(geometry,material);object.position.set(x,y,z);object.castShadow=true;object.receiveShadow=true;parent.add(object);return object}
function box(w,h,d,material,x,y,z,parent){return mesh(new THREE.BoxGeometry(w,h,d),material,x,y,z,parent)}
function rod(a,b,r1,r2,material,parent=scene,segments=7){const delta=new THREE.Vector3().subVectors(b,a);const object=mesh(new THREE.CylinderGeometry(r2,r1,delta.length(),segments),material,0,0,0,parent);object.position.copy(a).add(b).multiplyScalar(.5);object.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());return object}
let seed=74291;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function range(a,b){return a+(b-a)*random()}

// A vertex-colored sky dome: a warm horizon gradually becomes mauve overhead.
const skyGeo=new THREE.SphereGeometry(230,40,20);const skyColors=[];const pos=skyGeo.attributes.position;const low=new THREE.Color('#c3a9b7'),high=new THREE.Color('#868bad');for(let i=0;i<pos.count;i++){const t=THREE.MathUtils.clamp(pos.getY(i)/150,0,1);const c=low.clone().lerp(high,t);skyColors.push(c.r,c.g,c.b)}skyGeo.setAttribute('color',new THREE.Float32BufferAttribute(skyColors,3));mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,depthWrite:false,fog:false}),0,0,0).renderOrder=-10;
const sun=mesh(new THREE.SphereGeometry(7,40,24),new THREE.MeshBasicMaterial({color:'#ffe0b6',fog:false}),-59,40,-115);sun.castShadow=false;

// Fuji uses irregular concentric rings, with a separate continuous snow mantle.
function mountain(cx,cz,height,radius){const count=64,rings=13,vertices=[],colors=[],indices=[];const foothill=new THREE.Color('#797e9c'),summit=new THREE.Color('#aaa7bb');for(let j=0;j<=rings;j++){const t=j/rings;for(let i=0;i<count;i++){const angle=i/count*Math.PI*2;const ripple=1+.035*Math.sin(i*2.7)+.022*Math.cos(i*4.2);const radiusAt=radius*Math.pow(1-t,1.23)*ripple+3*t;const y=height*t+(j===rings?Math.sin(i*2.2)*.3:Math.sin(i*1.7+j)*.35);vertices.push(cx+Math.cos(angle)*radiusAt,y-5,cz+Math.sin(angle)*radiusAt);let c=foothill.clone().lerp(summit,t);c.multiplyScalar(.92+.13*Math.sin(angle+1));colors.push(c.r,c.g,c.b);if(j<rings){const a=j*count+i,b=j*count+(i+1)%count;indices.push(a,a+count,b,b,a+count,b+count)}}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(indices);g.computeVertexNormals();mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1}));const snowV=[],snowI=[];for(let j=0;j<5;j++){for(let i=0;i<count;i++){const a=i/count*Math.PI*2;const bottom=.66+.025*Math.sin(i*1.9)+.018*Math.cos(i*.7);const t=bottom+(1-bottom)*j/4;const r=radius*Math.pow(1-t,1.23)*(1+.035*Math.sin(i*2.7)+.022*Math.cos(i*4.2))+3*t+.65;snowV.push(cx+Math.cos(a)*r,height*t-4.85+(j===4?Math.sin(i*2.2)*.3:0),cz+Math.sin(a)*r);if(j<4){const k=j*count+i,n=j*count+(i+1)%count;snowI.push(k,k+count,n,n,k+count,n+count)}}}const snowG=new THREE.BufferGeometry();snowG.setAttribute('position',new THREE.Float32BufferAttribute(snowV,3));snowG.setIndex(snowI);snowG.computeVertexNormals();mesh(snowG,mat('#e9e2e4'));}
mountain(-45,-77,38,42);
// Hazy foothills establish distance behind the town.
for(let i=0;i<18;i++){const hill=mesh(new THREE.ConeGeometry(range(14,25),range(10,19),6),mat(i%2?'#8d8ca4':'#9a95aa'),-85+i*10,-2,-62+range(-4,5));hill.rotation.y=random()*3;hill.scale.z=.55;}
box(1000,2,600,mat('#99979b'),0,-5,-220);
const townMaterials=['#b7a2a3','#b0a0a8','#b9aaa6'].map(c=>mat(c));for(let i=0;i<210;i++){const x=range(-65,57),z=range(-69,-29),h=range(.3,1.5);box(range(.6,2.1),h,range(.8,2),townMaterials[i%3],x,-3+h/2,z)}

// The overlook is a sculpted island of rock, moss, paving and stairs.
mesh(new THREE.CylinderGeometry(34,29,7,11),mat('#655e69'),0,-5,7).scale.z=.67;
mesh(new THREE.CylinderGeometry(34.2,34,1.1,11),palette.grass,0,-1,7).scale.z=.67;
box(23,.5,20,mat('#baaba0'),14,-.35,5);
for(let i=0;i<11;i++)box(7,.35,1.05,palette.stone,1,-.1-i*.34,19+i*.9);
for(let i=0;i<16;i++){const rock=mesh(new THREE.DodecahedronGeometry(range(.8,2.2),0),mat(i%2?'#8f8b83':'#797c76'),range(-24,30),-.4,range(-6,24));rock.scale.y=.5;}

const pagoda=new THREE.Group();pagoda.position.set(15,0,2);scene.add(pagoda);
box(13,.65,12,palette.stone,0,0,0,pagoda);box(11.7,.4,10.7,palette.cream,0,.5,0,pagoda);
// Sweeping square eaves are rings with raised corners, triangulated into facets.
function roof(width,y){const verts=[],ix=[];const rings=[{r:width*.5,y:0},{r:width*.39,y:.12},{r:width*.23,y:1.6},{r:width*.10,y:2.05}];for(let j=0;j<rings.length;j++){const r=rings[j];for(let k=0;k<8;k++){const a=k*Math.PI/4+Math.PI/4;const corner=k%2===0;const m=corner?Math.SQRT2:1;verts.push(Math.cos(a)*r.r*m,y+r.y+(j===0&&corner?.48:0),Math.sin(a)*r.r*m);if(j<rings.length-1){const n=(k+1)%8;ix.push(j*8+k,(j+1)*8+k,j*8+n,j*8+n,(j+1)*8+k,(j+1)*8+n)}}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(ix);g.computeVertexNormals();mesh(g,palette.roof,0,0,0,pagoda);for(let k=0;k<8;k++){const n=(k+1)%8;rod(new THREE.Vector3(verts[k*3],verts[k*3+1],verts[k*3+2]),new THREE.Vector3(verts[n*3],verts[n*3+1],verts[n*3+2]),.085,.085,palette.roofEdge,pagoda,5)}}
for(let tier=0;tier<5;tier++){const y=.8+tier*4.1,w=9.5-tier*1.04;box(w,2.9,w,palette.red,0,y+1.45,0,pagoda);box(w+.35,.26,w+.35,palette.cream,0,y+.25,0,pagoda);for(const side of [-1,1]){for(let k=-1;k<=1;k++){const offset=k*w*.29;box(w*.19,1.65,.09,palette.dark,offset,y+1.5,side*(w/2+.03),pagoda);box(.09,1.65,w*.19,palette.dark,side*(w/2+.03),y+1.5,offset,pagoda)}for(const c of [-1,1])box(.3,3.05,.3,palette.redLight,c*(w/2-.15),y+1.45,side*(w/2-.15),pagoda);}
const balcony=w+1.4;box(balcony,.22,balcony,palette.redLight,0,y+.14,0,pagoda);for(const side of [-1,1]){for(let k=0;k<=10;k++){const p=(k/10-.5)*balcony;box(.10,.85,.10,palette.redLight,p,y+.63,side*balcony/2,pagoda);box(.10,.85,.10,palette.redLight,side*balcony/2,y+.63,p,pagoda)}box(balcony,.13,.13,palette.redLight,0,y+1.06,side*balcony/2,pagoda);box(.13,.13,balcony,palette.redLight,side*balcony/2,y+1.06,0,pagoda)}box(w+.5,.28,w+.5,palette.cream,0,y+2.78,0,pagoda);roof(w+4,y+3);}
rod(new THREE.Vector3(0,22.3,0),new THREE.Vector3(0,28.8,0),.16,.045,palette.dark,pagoda);
for(let i=0;i<9;i++)mesh(new THREE.TorusGeometry(.62-i*.039,.08,5,12),palette.gold,0,23.1+i*.49,0,pagoda).rotation.x=Math.PI/2;
mesh(new THREE.SphereGeometry(.25,8,6),palette.gold,0,28.8,0,pagoda);

// Blossom clusters share geometry and materials, keeping the scene lightweight.
const blossomGeo=new THREE.IcosahedronGeometry(1,0);const blossomMats=['#f7c2d0','#eda5bb','#ffd8dc','#db8fab','#f6b5ca'].map(c=>mat(c));const trunkMat=mat('#65505c');
function cherry(x,z,scale){const group=new THREE.Group();group.position.set(x,-.4,z);group.scale.setScalar(scale);scene.add(group);rod(new THREE.Vector3(0,0,0),new THREE.Vector3(.45,5,0),.55,.28,trunkMat,group);for(let branch=0;branch<7;branch++){const a=branch*2.4;const tip=new THREE.Vector3(Math.cos(a)*range(2,4),range(5,8),Math.sin(a)*range(2,3.5));rod(new THREE.Vector3(.3,range(2.8,4.7),0),tip,.23,.08,trunkMat,group);for(let twig=0;twig<3;twig++){const end=tip.clone().add(new THREE.Vector3(range(-1.5,1.5),range(.2,1.4),range(-1.5,1.5)));rod(tip,end,.075,.025,trunkMat,group);for(let b=0;b<7;b++){const bloom=mesh(blossomGeo,blossomMats[Math.floor(random()*5)],end.x+range(-1.3,1.3),end.y+range(-.6,.7),end.z+range(-1.1,1.1),group);bloom.scale.set(range(.65,1.35),range(.55,1),range(.65,1.15));bloom.rotation.set(random()*3,random()*3,random()*3);}}}return group;}
cherry(-17,15,1.6);cherry(-25,3,1.3);cherry(-7,19,1.05);cherry(28,15,1.15);cherry(31,-3,.9);cherry(-18,-7,.85);cherry(-4,-11,.7);
// Low shrubs, fallen petals and a timber fence tie the foreground together.
for(let i=0;i<35;i++){const x=range(-30,29),z=range(9,23);mesh(new THREE.IcosahedronGeometry(range(.3,.85),0),mat(i%2?'#788672':'#6f7b71'),x,-.2,z)}
for(let i=0;i<160;i++){const petal=mesh(new THREE.CircleGeometry(range(.035,.10),5),blossomMats[i%5],range(-27,29),-.01,range(5,24));petal.rotation.x=-Math.PI/2;petal.castShadow=false;}
for(let i=0;i<12;i++){const x=-29+i*2.7;box(.18,1.5,.18,palette.wood,x,.3,-3);if(i<11){box(2.7,.15,.12,palette.wood,x+1.35,.75,-3);box(2.7,.12,.12,palette.wood,x+1.35,.05,-3)}}
const petals=[];for(let i=0;i<65;i++){const p=mesh(new THREE.CircleGeometry(range(.055,.12),5),blossomMats[i%5],range(-30,32),range(0,18),range(0,26));p.material.side=THREE.DoubleSide;p.castShadow=false;petals.push({mesh:p,speed:range(.25,.7),phase:range(0,7)});}
let running=true;document.getElementById('motion').onclick=()=>{running=!running;document.getElementById('motion').textContent=running?'Pause breeze  Ⅱ':'Resume breeze  ▷';document.getElementById('motion').setAttribute('aria-label',running?'Pause animation':'Resume animation')};
const clock=new THREE.Clock();let elapsed=0;
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(running){elapsed+=dt;for(const p of petals){p.mesh.position.y-=dt*p.speed;p.mesh.position.x+=dt*(.25+Math.sin(elapsed*.4+p.phase)*.3);p.mesh.position.z+=Math.cos(elapsed*.3+p.phase)*dt*.15;p.mesh.rotation.set(elapsed*.5+p.phase,elapsed*.3,p.phase);if(p.mesh.position.y<-.2){p.mesh.position.y=18;p.mesh.position.x=range(-28,28)}}}renderer.render(scene,camera)});
addEventListener('resize',frame);
window.addEventListener('error',()=>document.getElementById('error').style.display='block');
</script>
