<!doctype html><html><head><meta charset="utf-8"><title>Great Wave - low poly wallpaper</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8d5a8}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const S=new THREE.Scene();
// sky: cream paper top, grey-brown haze near horizon, like the print
const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'#e3c98f');gr.addColorStop(.45,'#efe2c0');gr.addColorStop(.75,'#cfc6b2');gr.addColorStop(1,'#5f5d5b');g.fillStyle=gr;g.fillRect(0,0,4,256);
S.background=new THREE.CanvasTexture(c);S.background.colorSpace=THREE.SRGBColorSpace;
const cam=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,300);
S.add(new THREE.HemisphereLight(0xfff4dc,0x23407a,1.5));const L=new THREE.DirectionalLight(0xffffff,2);L.position.set(-10,20,25);S.add(L);
const G=(x,m,a,b)=>Math.exp(-Math.pow((x-m)/(x<m?a:b),2));
function H(x,z){ // big left wave (steep on right side), foreground swell, right swell
 let h=15*G(x,-11,9,4.2)*Math.exp(-Math.pow((z+2)/9,2));
 h+=6*G(x,-2,6,12)*Math.exp(-Math.pow((z-9)/5,2));
 h+=8*G(x,26,9,9)*Math.exp(-Math.pow((z+2)/12,2));
 h+=4*G(x,10,8,10)*Math.exp(-Math.pow((z-10)/4,2));
 return h-1.5+.35*Math.sin(x*1.3+z*.9)+.2*Math.sin(x*2.7-z*1.7);}
const N=110,geo=new THREE.PlaneGeometry(90,60,N,N);geo.rotateX(-Math.PI/2);
const P=geo.attributes.position;for(let i=0;i<P.count;i++)P.setY(i,H(P.getX(i),P.getZ(i)));
let ng=geo.toNonIndexed(),pp=ng.attributes.position,col=new Float32Array(pp.count*3),cs=[0x14306b,0x1d4f94,0x2f6aa8,0x9cc7d8,0xf2ecdc].map(h=>new THREE.Color(h));
for(let i=0;i<pp.count;i+=3){const y=(pp.getY(i)+pp.getY(i+1)+pp.getY(i+2))/3,x=pp.getX(i),z=pp.getZ(i);
 const n=((Math.sin(x*3.1+z*5.3)*43758.5)%1+1)%1;let t=(y+1)/15+n*.12;
 const k=t>.62?4:t>.42?3:t>.22?(n>.5?2:1):(n>.7?2:0);
 for(let j=0;j<3;j++){col.set([cs[k].r,cs[k].g,cs[k].b],(i+j)*3);}}
ng.setAttribute('color',new THREE.BufferAttribute(col,3));
S.add(new THREE.Mesh(ng,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1})));
// foam claws curling off the crest
const fm=new THREE.MeshStandardMaterial({color:0xf4efe0,flatShading:true,roughness:1}),claws=[];
for(let i=0;i<46;i++){const a=i/45,ang=Math.PI*(.95-a*.95);
 const cx=-11+Math.cos(ang)*9*a+ -1, cy=14+Math.sin(ang)*5+ -a*2.5;
 const m=new THREE.Mesh(new THREE.ConeGeometry(.35+Math.random()*.4,1.8+Math.random()*1.6,4),fm);
 m.position.set(cx+(Math.random()-.5)*1.5,cy+(Math.random()-.5)*1.5,-2+(Math.random()-.5)*5);
 m.rotation.z=-ang-.3+(Math.random()-.5)*1.2;m.userData={b:m.position.clone(),r:m.rotation.z,p:Math.random()*6};claws.push(m);S.add(m);}
// spray droplets
const sp=[];for(let i=0;i<160;i++)sp.push(-6+Math.random()*12,6+Math.random()*10,-3+Math.random()*4);
const spg=new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const spm=new THREE.Points(spg,new THREE.PointsMaterial({color:0xffffff,size:.25}));S.add(spm);
// Mount Fuji: small, snow-capped, in the gap
const fuji=new THREE.Group();
fuji.add(new THREE.Mesh(new THREE.ConeGeometry(9,6,7),new THREE.MeshStandardMaterial({color:0x1d3f78,flatShading:true})));
const cap=new THREE.Mesh(new THREE.ConeGeometry(4.6,3.1,7),new THREE.MeshStandardMaterial({color:0xf4f1ea,flatShading:true}));cap.position.y=1.45;fuji.add(cap);
fuji.position.set(3,2.2,-27);S.add(fuji);
// three boats (oshiokuri-bune): left hidden in wave, right with rowers, foreground
const hm=new THREE.MeshStandardMaterial({color:0xe2b08a,flatShading:true}),rm=new THREE.MeshStandardMaterial({color:0x1b3a73,flatShading:true});
function boat(){const b=new THREE.Group(),h=new THREE.Mesh(new THREE.CylinderGeometry(.9,.5,9,4,1),hm);h.rotation.z=Math.PI/2;h.rotation.x=Math.PI/4;h.scale.set(1,1,.8);b.add(h);
 for(let i=0;i<6;i++){const r=new THREE.Mesh(new THREE.IcosahedronGeometry(.5,0),rm);r.position.set(-2+i*.7,.7,0);b.add(r);}
 const bow=new THREE.Mesh(new THREE.ConeGeometry(.5,2.5,4),hm);bow.rotation.z=-Math.PI/2.6;bow.position.set(4.9,.8,0);b.add(bow);return b;}
const boats=[[-15,-1,.5,.45],[9,-9,-.15,.5],[2,8,.25,.7]].map(([x,z,r,s])=>{const b=boat();b.userData={x,z,r};b.scale.setScalar(s*1.3);S.add(b);return b;});
cam.position.set(0,7,26);cam.lookAt(-1,6,0);
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
R.setAnimationLoop(t=>{t/=1000;
 claws.forEach(m=>{const u=m.userData;m.rotation.z=u.r+Math.sin(t*1.2+u.p)*.12;m.position.y=u.b.y+Math.sin(t+u.p)*.25;});
 spm.position.y=Math.sin(t*.8)*.3;
 boats.forEach((b,i)=>{const u=b.userData;b.position.set(u.x,H(u.x,u.z)+.6+Math.sin(t*1.1+i*2)*.25,u.z);b.rotation.z=u.r+Math.sin(t*.9+i)*.05;});
 cam.position.x=Math.sin(t*.15)*1.5;cam.lookAt(-1,6,0);R.render(S,cam);});
</script></body></html>
