"comida", "sinonimo": ["farinha", "arroz"], "analog": ["milho", "unha"], "grau": 4}, "tristeza": {"tema": "sentimentos", "sinonimo": ["melancolia", "mágoa"], "analog": ["amor", "frase", "hoje"], "grau": 5}, "unha": {"tema": "corpo", "sinonimo": ["dedo", "peito"], "analog": ["pulmão", "paixoes", "trigo", "açúcar"], "grau": 6}, "vale": {"tema": "natureza", "sinonimo": ["serra", "rio"], "analog": ["raiz", "mar", "ponte"], "grau": 5}, "verso": {"tema": "artes", "sinonimo": ["poesia", "rima"], "analog": ["pão", "tambor", "melodia", "pescador"], "grau": 6}, "vila": {"tema": "lugares", "sinonimo": ["capital", "aldeia"], "analog": ["nação", "madrugada", "porto", "carpinteiro"], "grau": 6}, "vinho": {"tema": "comida", "sinonimo": ["chá", "água"], "analog": ["farinha", "feijão", "sotaque"], "grau": 5}, "violão": {"tema": "artes", "sinonimo": ["samba", "piano"], "analog": ["país", "enfermeira", "rima", "praça", "poesia", "escultura"], "grau": 8}, "voz": {"tema": "linguagem", "sinonimo": ["sotaque", "fala"], "analog": ["afeto", "cozinha", "nome", "capital"], "grau": 6}}}</script>
<script>
const DADOS=JSON.parse(document.getElementById('dados').textContent);
const WORDS=DADOS.words, PAL=DADOS.palette;
const nomes=Object.keys(WORDS);
const N=nomes.length;
// adjacência simétrica
const viz={}; nomes.forEach(w=>viz[w]=new Set());
for(const w of nomes) for(const t of [...WORDS[w].sinonimo,...WORDS[w].analog]) {viz[w].add(t);viz[t].add(w);}
// layout inicial determinístico: círculo por tema, baralhado por hash
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h/4294967296;}
const pos={}; nomes.forEach(w=>{const a=hash(w)*Math.PI*2,r=60+hash(w+w)*Math.min(innerWidth,innerHeight)*0.42;pos[w]=[innerWidth/2+r*Math.cos(a),innerHeight/2+r*Math.sin(a)];});
const cv=document.getElementById('ceu'), ctx=cv.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2);
function resize(){DPR=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;}
resize();addEventListener('resize',()=>{resize();});
// física
const vel={}; nomes.forEach(w=>vel[w]=[0,0]);
let foco=null, arrastando=null, ultimoMouse=null;
function passo(){
  const k=260, rep=3400, centro=0.012;
  for(const w of nomes){let fx=0,fy=0;const p=pos[w];
    for(const v of viz[w]){const q=pos[v],dx=q[0]-p[0],dy=q[1]-p[1],d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);
      const f=(d-k)/k*0.9;fx+=dx/d*f;fy+=dy/d*f;}
    // repulsão entre todos (grade aproximada: pares aleatórios por quadro)
    for(let i=0;i<6;i++){const v=nomes[(hash(w+''+i+frame)|0)%N];if(v===w)continue;const q=pos[v];const dx=q[0]-p[0],dy=q[1]-p[1],d2=dx*dx+dy*dy||1;const f=rep/d2;fx-=dx/d*f*0.02;fy-=dy/d*f*0.02;}
    fx+=(innerWidth/2-p[0])*centro;fy+=(innerHeight/2-p[1])*centro;
    vel[w][0]=(vel[w][0]+fx*0.02)*0.86;vel[w][1]=(vel[w][1]+fy*0.02)*0.86;}
  if(!arrastando) for(const w of nomes){if(foco===w)continue;pos[w][0]+=vel[w][0];pos[w][1]+=vel[w][1];}
}
function raio(w){return 3+Math.sqrt(WORDS[w].grau)*1.6;}
function desenha(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
  // fundo estrelado
  ctx.fillStyle='#0b0d14';ctx.fillRect(0,0,innerWidth,innerHeight);
  const vizFoco=foco?viz[foco]:null;
  // arestas
  const vistas=new Set();
  for(const w of nomes) for(const t of viz[w]){const par=w<t?w+'|'+t:t+'|'+w;if(vistas.has(par))continue;vistas.add(par);
    const a=pos[w],b=pos[t];
    let cor='rgba(125,134,152,',alpha=0.16;
    if(foco){const on=(w===foco||t===foco);alpha=on?0.75:0.05;cor=on?'rgba(255,209,102,':'rgba(125,134,152,';}
    ctx.strokeStyle=cor+alpha+')';ctx.lineWidth=(foco&&(w===foco||t===foco))?1.6:1;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  // nós
  for(const w of nomes){const p=pos[w],r=raio(w),c=PAL[WORDS[w].tema]||'#888';
    let alpha=1;
    if(foco){const on=(w===foco||vizFoco.has(w));alpha=on?1:0.18;}
    ctx.globalAlpha=alpha;
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill();
    if(w===foco){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p[0],p[1],r+4,0,7);ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='500 13px "IBM Plex Mono"';ctx.textAlign='center';ctx.fillText(w,p[0],p[1]-r-8);}
    else if(!foco&&WORDS[w].grau>=9){ctx.globalAlpha=.6;ctx.fillStyle='#e8e6df';ctx.font='11px "IBM Plex Mono"';ctx.textAlign='center';ctx.fillText(w,p[0],p[1]-r-4);}
    ctx.globalAlpha=1;}
}
let frame=0;
function laco(){frame++;passo();desenha();requestAnimationFrame(laco);}
laco();
// interação
cv.addEventListener('mousedown',e=>{ultimoMouse=[e.clientX,e.clientY];const w=perto(e);if(w){foco=w;abrePainel(w);arrastando=w;}})
cv.addEventListener('mousemove',e=>{if(arrastando){pos[arrastando]=[e.clientX,e.clientY];vel[arrastando]=[0,0];}});
addEventListener('mouseup',()=>arrastando=null);
cv.addEventListener('click',e=>{const w=perto(e);if(w){foco=w;abrePainel(w);setURL(w);}else if(!perto(e)){}});
function perto(e){let melhor=null,md=400;for(const w of nomes){const p=pos[w],dx=p[0]-e.clientX,dy=p[1]-e.clientY,d=dx*dx+dy*dy;if(d<md+raio(w)*raio(w)*2&&d<md*(1)||d<(raio(w)+6)**2){if(d<(raio(w)+8)**2&&d<md+ (raio(w)+8)**2){melhor=w;md=d;}}}return melhor;}
// painel
const painel=document.getElementById('painel');
function abrePainel(w){const d=WORDS[w];document.getElementById('pnome').textContent=w;
  document.getElementById('ptema').textContent='Tema: '+d.tema;
  document.getElementById('pgrau').textContent=d.grau+(d.grau===1?' palavra ligada':' palavras ligadas');
  const rotulos={sinonimo:'Sinônimos',analog:'Palavras análogas'};
  let html='';for(const rel of ['sinonimo','analog']){if(!d[rel].length)continue;
    html+='<h3>'+rotulos[rel]+'</h3><ul>'+d[rel].map(t=>'<li><a data-w="'+t+'">'+t+'</a></li>').join('')+'</ul>';}
  document.getElementById('prels').innerHTML=html||'<p class="grau">Sem ligações registadas.</p>';
  painel.style.display='block';}
painel.addEventListener('click',e=>{const w=e.target.getAttribute&&e.target.getAttribute('data-w');if(w){foco=w;abrePainel(w);setURL(w);}if(e.target.id==='fechar'){painel.style.display='none';foco=null;limpaURL();}});
function setURL(w){history.replaceState(null,'','?word='+encodeURIComponent(w));}
function limpaURL(){history.replaceState(null,'','?');}
// busca
const inp=document.getElementById('busca'),sug=document.getElementById('sugestoes');
function filtra(q){q=q.trim().toLowerCase();if(!q)return[];return nomes.filter(w=>w.toLowerCase().startsWith(q)).concat(nomes.filter(w=>!w.toLowerCase().startsWith(q)&&w.toLowerCase().includes(q))).slice(0,8);}
inp.addEventListener('input',()=>{const r=filtra(inp.value);sug.innerHTML=r.map(w=>'<li data-w="'+w+'">'+w+'</li>').join('');sug.style.display=r.length?'block':'none';});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=filtra(inp.value);if(r.length){escolhe(r[0]);}else{naoEncontrada(inp.value.trim());}}if(e.key==='Escape'){sug.style.display='none';}});
sug.addEventListener('mousedown',e=>{const w=e.target.getAttribute&&e.target.getAttribute('data-w');if(w)escolhe(w);});
function escolhe(w){inp.value='';sug.style.display='none';foco=w;abrePainel(w);setURL(w);}
function naoEncontrada(q){document.getElementById('pnome').textContent='“'+q+'”';
  document.getElementById('ptema').textContent='fora deste universo';
  document.getElementById('pgrau').textContent='Esta palavra não está no dicionário copiado em ./site.';
  document.getElementById('prels').innerHTML='<p class="grau">Tente: '+nomes.slice(0,4).join(', ')+'…</p>';
  painel.style.display='block';foco=null;}
// legenda
document.getElementById('legenda').innerHTML=Object.entries(PAL).map(([t,c])=>'<span><i style="background:'+c+'"></i>'+t+'</span>').join('');
// ?word=
const alvo=new URLSearchParams(location.search).get('word');
if(alvo){const ache=nomes.find(w=>w.toLowerCase()===alvo.toLowerCase());
  if(ache){foco=ache;abrePainel(ache);pos[ache]=[innerWidth/2,innerHeight/2];}
  else naoEncontrada(alvo);}
</script></body></html>
