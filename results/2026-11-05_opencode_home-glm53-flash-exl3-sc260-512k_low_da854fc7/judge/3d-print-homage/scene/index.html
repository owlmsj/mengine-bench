<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Great Wave - Low Poly Wallpaper</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8dcc2;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

// Palette lifted visually from the print: Prussian blue, pale indigo, cream paper, ochre boats
const C = {
  paper:   0xe9dcc0,
  deepBlue:0x1a3a6e,
  midBlue: 0x2f5a8f,
  paleBlue:0x9db8cf,
  foam:    0xf6f1e4,
  fuji:    0xd9cdb0,
  fujiCap: 0xece6d6,
  boat:    0xc98f5e,
  boatDark:0x8a5a33,
  rower:   0x22406e
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 100, 340);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 400);
camera.position.set(2, 16, 95);
camera.lookAt(0, 12, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff4dd, 0x33456b, 1.2));
const sun = new THREE.DirectionalLight(0xffeecb, 1.3);
sun.position.set(-10, 25, 20);
scene.add(sun);

function flatMesh(geo, color){
  return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color, flatShading:true, roughness:0.9}));
}

// ---------- Sea ----------
const seaGeo = new THREE.PlaneGeometry(240, 120, 48, 24);
seaGeo.rotateX(-Math.PI/2);
const sea = new THREE.Mesh(seaGeo, new THREE.MeshStandardMaterial({color:C.paleBlue, flatShading:true, roughness:1}));
scene.add(sea);
const seaBase = Float32Array.from(seaGeo.attributes.position.array);

// ---------- The Great Wave ----------
// Curling tongue: half-cylinder opening toward the viewer, axis along the wave crest
const wave = new THREE.Group();
// curling tongue: tube swept along a hooked arc (rises left, curls over right, hooks down)
const arcPts = [
  new THREE.Vector3(-24, 0, 0),
  new THREE.Vector3(-17, 9, 0),
  new THREE.Vector3(-8, 16, 0),
  new THREE.Vector3(0, 21, 0),
  new THREE.Vector3(8, 22, 0),
  new THREE.Vector3(14, 18, 0),
  new THREE.Vector3(15, 11, 0),
  new THREE.Vector3(11, 6, 0)
];
const arc = new THREE.CatmullRomCurve3(arcPts);
const curl = flatMesh(new THREE.TubeGeometry(arc, 24, 6.5, 7, false), C.deepBlue);
curl.scale.z = 3.2;
wave.add(curl);
// base of the wave merging into the sea
const base = flatMesh(new THREE.BoxGeometry(34, 8, 20, 4, 2, 2), C.deepBlue);
base.position.set(-10, 2, 2);
wave.add(base);

// claw foam: pale cones and blobs riding the outer edge of the arc
const claw = new THREE.Group();
wave.add(claw);
for (let i = 0; i <= 18; i++){
  const t = i/18;
  const pt = arc.getPointAt(t);
  const tan = arc.getTangentAt(t);
  const n = new THREE.Vector3(-tan.y, tan.x, 0).normalize(); // outward normal in XY
  const ang = Math.atan2(tan.y, tan.x);
  if (i % 2 === 0){
    const f = flatMesh(new THREE.ConeGeometry(1.0, 4 + (i%4), 5), C.foam);
    f.position.copy(pt).addScaledVector(n, 7.2);
    f.rotation.z = ang + 2.2;
    claw.add(f);
  } else {
    const b = flatMesh(new THREE.SphereGeometry(0.9 + (i%3)*0.4, 5, 4), C.foam);
    b.position.copy(pt).addScaledVector(n, 6.8);
    claw.add(b);
  }
}
// foam speckles hugging the crest underside
for (let i = 0; i < 26; i++){
  const t = 0.25 + Math.random()*0.7;
  const pt = arc.getPointAt(t);
  const b = flatMesh(new THREE.SphereGeometry(0.4+Math.random()*0.5, 5, 4), C.foam);
  b.position.set(pt.x + (Math.random()-0.5)*6, pt.y - 2 - Math.random()*4, (Math.random()-0.5)*9);
  wave.add(b);
}
// spray droplets
const spray = [];
for (let i = 0; i < 45; i++){
  const s = flatMesh(new THREE.SphereGeometry(0.14+Math.random()*0.18, 4, 3), C.foam);
  s.position.set(-24 + Math.random()*38, 22 + Math.random()*6, (Math.random()-0.5)*8);
  s.userData.v = new THREE.Vector3((Math.random()-0.5)*0.6, 0.5+Math.random()*0.8, (Math.random()-0.5)*0.3);
  spray.push(s);
  wave.add(s);
}
wave.position.set(-14, 2, -6);
wave.rotation.z = -0.18;
scene.add(wave);

// ---------- Framing swells ----------
const leftSwell = flatMesh(new THREE.SphereGeometry(9, 10, 8, 0, Math.PI*2, 0, Math.PI*0.5), C.midBlue);
leftSwell.scale.set(1.8, 1.2, 0.6);
leftSwell.position.set(-38, 0, 6);
leftSwell.rotation.z = 0.6;
scene.add(leftSwell);

const rightSwell = flatMesh(new THREE.SphereGeometry(8, 10, 8, 0, Math.PI*2, 0, Math.PI*0.5), C.midBlue);
rightSwell.scale.set(1.6, 1.1, 0.6);
rightSwell.position.set(34, 0, 0);
rightSwell.rotation.z = -0.55;
scene.add(rightSwell);

// ---------- Mount Fuji: small, snow-capped, centered on the horizon ----------
const fuji = new THREE.Group();
fuji.add(flatMesh(new THREE.ConeGeometry(9, 12, 8), C.fuji));
const cap = flatMesh(new THREE.ConeGeometry(4.6, 3.4, 8), C.fujiCap);
cap.position.y = 4.3;
fuji.add(cap);
fuji.position.set(14, 2.5, -95);
scene.add(fuji);

// ---------- Boats: 3, matching the print ----------
function boat(){
  const g = new THREE.Group();
  // hull: tapered box via simple custom geometry (long, low, pointed ends)
  const hull = new THREE.Mesh(
    new THREE.CylinderGeometry(0.9, 0.5, 7, 5, 1),
    new THREE.MeshStandardMaterial({color:C.boat, flatShading:true, roughness:0.9})
  );
  hull.rotation.z = Math.PI/2;
  hull.scale.set(1, 1, 0.55);
  g.add(hull);
  const deck = flatMesh(new THREE.BoxGeometry(6.4, 0.3, 1.4), C.boatDark);
  deck.position.y = 0.35;
  g.add(deck);
  // rower clusters at both ends, like the print
  for (let end=-1; end<=1; end+=2){
    for (let i=0;i<3;i++){
      const r = flatMesh(new THREE.SphereGeometry(0.35, 5, 4), C.rower);
      r.position.set(end*(2.4-i*0.2), 0.75, (i-1)*0.4);
      r.scale.y = 1.3;
      g.add(r);
    }
    const oar = flatMesh(new THREE.BoxGeometry(0.12, 0.12, 3.0), C.boatDark);
    oar.position.set(end*1.9, 0.3, end*1.2);
    oar.rotation.y = 0.6*end;
    oar.rotation.z = 0.4;
    g.add(oar);
  }
  return g;
}
const boats = [];
const boatSpots = [
  {x: -8, y: 5.5, z: 12, rz: -0.55, ry: 0.05},   // clinging to the great wave's face, left
  {x: 24,  y: 3, z: 2, rz: 0.35, ry: -0.15},  // right swell, riding away toward Fuji
  {x: 10,  y: 0.8, z: 14, rz: -0.12, ry: 0.1} // foreground trough with rowers
];
boatSpots.forEach(s=>{
  const b = boat();
  b.position.set(s.x, s.y, s.z);
  b.rotation.set(0, s.ry, s.rz);
  b.userData.ph = Math.random()*Math.PI*2;
  boats.push(b);
  scene.add(b);
});

// ---------- Motion ----------
const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  const p = seaGeo.attributes.position;
  for (let i=0;i<p.count;i++){
    const bx = seaBase[i*3], bz = seaBase[i*3+2];
    p.setY(i, Math.sin(bx*0.1 + t*0.6)*0.8 + Math.sin(bz*0.18 + t*0.45)*0.6);
  }
  p.needsUpdate = true;
  wave.rotation.z = -0.18 + Math.sin(t*0.35)*0.04;
  wave.position.y = 2 + Math.sin(t*0.5)*0.35;
  claw.rotation.z = Math.sin(t*0.7)*0.05;
  spray.forEach(s=>{
    s.position.addScaledVector(s.userData.v, 0.05);
    if (s.position.y > 30){
      s.position.set(-24 + Math.random()*38, 22, (Math.random()-0.5)*8);
    }
  });
  boats.forEach(b=>{
    const ph = b.userData.ph;
    b.position.y += Math.sin(t*0.9+ph)*0.015;
    b.rotation.z += Math.sin(t*0.65+ph)*0.003;
    b.rotation.x = Math.sin(t*0.45+ph)*0.03;
  });
  camera.position.x = 2 + Math.sin(t*0.1)*1.2;
  camera.position.y = 16 + Math.sin(t*0.08)*0.5;
  camera.lookAt(0, 12, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
