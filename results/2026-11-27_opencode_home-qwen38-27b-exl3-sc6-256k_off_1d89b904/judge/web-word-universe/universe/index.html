<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --panel:#11151f; --ink:#e8e6df; --dim:#8b93a7;
    --gold:#e0b45c; --teal:#6fd3c7; --line:#232a3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0}
  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
  header{padding:18px 22px 6px;pointer-events:none}
  h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;margin:0;letter-spacing:.5px}
  h1 small{font-size:15px;color:var(--dim);font-weight:400;font-style:italic;margin-left:10px}
  #searchwrap{pointer-events:auto;margin:14px 22px 0;max-width:420px;position:relative}
  #search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    background:rgba(17,21,31,.92);color:var(--ink);font-size:15px;outline:none;backdrop-filter:blur(6px)}
  #search:focus{border-color:var(--gold)}
  #sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(17,21,31,.97);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;max-height:280px;overflow-y:auto}
  #sugg div{padding:9px 14px;cursor:pointer;font-size:14px}
  #sugg div:hover{background:#1a2130;color:var(--gold)}
  #card{pointer-events:auto;position:fixed;left:22px;bottom:22px;width:340px;max-width:calc(100vw - 44px);
    background:rgba(17,21,31,.94);border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.45)}
  #card h2{font-family:"Cormorant Garamond",serif;font-size:30px;margin:0 0 2px;font-weight:600}
  #card .tema{color:var(--teal);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
  #card .lbl{font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
  #card .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{pointer-events:auto;cursor:pointer;font-size:13px;padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:#161c29;color:var(--ink);transition:.15s}
  .chip:hover{border-color:var(--gold);color:var(--gold)}
  .chip.syn{border-color:#3d5a55}
  #card .hint{color:var(--dim);font-size:13px;font-style:italic;font-family:"Cormorant Garamond",serif;font-size:17px}
  #stats{position:fixed;right:22px;bottom:22px;text-align:right;color:var(--dim);font-size:12.5px;line-height:1.7;pointer-events:none}
  #stats b{color:var(--ink);font-weight:600}
  #hint{position:fixed;right:22px;top:18px;color:var(--dim);font-size:12px;pointer-events:none;text-align:right;line-height:1.6}
  #err{position:fixed;inset:0;display:none;place-items:center;color:var(--dim);font-size:15px;text-align:center;padding:30px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="ui">
  <header><h1>Universo de Palavras<small>dicionário criativo</small></h1></header>
  <div id="searchwrap">
    <input id="search" type="text" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="sugg"></div>
  </div>
</div>
<div id="card"></div>
<div id="stats"></div>
<div id="hint">arraste para girar · role para zoom<br>clique numa palavra para vê-la</div>
<div id="err">three.js não carregou — a rede bloqueou o CDN.</div>

,"theme":"tempo"},"pastor":{"display":"pastor","theme":"ofícios"},"patria":{"display":"pátria","theme":"lugares"},"patrao":{"display":"patrão","theme":"ofícios"},"pavor":{"display":"pavor","theme":"sentimentos"},"pe":{"display":"pé","theme":"corpo"},"pedreiro":{"display":"pedreiro","theme":"ofícios"},"peito":{"display":"peito","theme":"corpo"},"peixe":{"display":"peixe","theme":"comida"},"pele":{"display":"pele","theme":"corpo"},"pergunta":{"display":"pergunta","theme":"linguagem"},"perna":{"display":"perna","theme":"corpo"},"pescador":{"display":"pescador","theme":"ofícios"},"pescoco":{"display":"pescoço","theme":"corpo"},"petala":{"display":"pétala","theme":"natureza"},"piano":{"display":"piano","theme":"artes"},"pimenta":{"display":"pimenta","theme":"comida"},"pintura":{"display":"pintura","theme":"artes"},"poesia":{"display":"poesia","theme":"artes"},"ponte":{"display":"ponte","theme":"lugares"},"porta":{"display":"porta","theme":"lugares"},"porto":{"display":"porto","theme":"lugares"},"praca":{"display":"praça","theme":"lugares"},"prado":{"display":"prado","theme":"natureza"},"praia":{"display":"praia","theme":"natureza"},"prazer":{"display":"prazer","theme":"sentimentos"},"prima":{"display":"prima","theme":"família"},"primo":{"display":"primo","theme":"família"},"professor":{"display":"professor","theme":"ofícios"},"profissao":{"display":"profissão","theme":"ofícios"},"pulmao":{"display":"pulmão","theme":"corpo"},"quarto":{"display":"quarto","theme":"lugares"},"queijo":{"display":"queijo","theme":"comida"},"raiz":{"display":"raiz","theme":"natureza"},"refeicao":{"display":"refeição","theme":"comida"},"resposta":{"display":"resposta","theme":"linguagem"},"riacho":{"display":"riacho","theme":"natureza"},"rima":{"display":"rima","theme":"artes"},"rio":{"display":"rio","theme":"natureza"},"ritmo":{"display":"ritmo","theme":"artes"},"romance":{"display":"romance","theme":"artes"},"rosto":{"display":"rosto","theme":"corpo"},"rua":{"display":"rua","theme":"lugares"},"sal":{"display":"sal","theme":"comida"},"salario":{"display":"salário","theme":"ofícios"},"samba":{"display":"samba","theme":"artes"},"sangue":{"display":"sangue","theme":"corpo"},"sapateiro":{"display":"sapateiro","theme":"ofícios"},"saudade":{"display":"saudade","theme":"sentimentos"},"seculo":{"display":"século","theme":"tempo"},"segundo":{"display":"segundo","theme":"tempo"},"selva":{"display":"selva","theme":"natureza"},"semana":{"display":"semana","theme":"tempo"},"semente":{"display":"semente","theme":"natureza"},"sentido":{"display":"sentido","theme":"linguagem"},"serra":{"display":"serra","theme":"natureza"},"significado":{"display":"significado","theme":"linguagem"},"silaba":{"display":"sílaba","theme":"linguagem"},"silencio":{"display":"silêncio","theme":"linguagem"},"sinonimo":{"display":"sinônimo","theme":"linguagem"},"sobre":{"display":"Sobre","theme":null},"sobrinho":{"display":"sobrinho","theme":"família"},"sogra":{"display":"sogra","theme":"família"},"soldado":{"display":"soldado","theme":"ofícios"},"sotaque":{"display":"sotaque","theme":"linguagem"},"surpresa":{"display":"surpresa","theme":"sentimentos"},"sussurro":{"display":"sussurro","theme":"linguagem"},"susto":{"display":"susto","theme":"sentimentos"},"tambor":{"display":"tambor","theme":"artes"},"tarde":{"display":"tarde","theme":"tempo"},"teatro":{"display":"teatro","theme":"artes"},"tela":{"display":"tela","theme":"artes"},"tempo":{"display":"tempo","theme":"tempo"},"ternura":{"display":"ternura","theme":"sentimentos"},"tia":{"display":"tia","theme":"família"},"tio":{"display":"tio","theme":"família"},"trabalho":{"display":"trabalho","theme":"ofícios"},"trigo":{"display":"trigo","theme":"comida"},"tristeza":{"display":"tristeza","theme":"sentimentos"},"unha":{"display":"unha","theme":"corpo"},"vale":{"display":"vale","theme":"natureza"},"verso":{"display":"verso","theme":"artes"},"vila":{"display":"vila","theme":"lugares"},"vinho":{"display":"vinho","theme":"comida"},"violao":{"display":"violão","theme":"artes"},"voz":{"display":"voz","theme":"linguagem"}};

const norm = s => s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]/g,"");
const keys = Object.keys(WORDS);
const byNorm = new Map(keys.map(k=>[norm(k),k]));
const find = q => byNorm.get(norm(q));

// ---- stats
const pairs = new Set();
for(const w of keys) for(const l of WORDS[w]) pairs.add([w,l].sort().join("|"));
const deg = {}; for(const w of keys) deg[w]=WORDS[w].length;
const maxDeg = Math.max(...keys.map(w=>deg[w]));
document.getElementById("stats").innerHTML =
  `<b>${keys.length}</b> palavras<br><b>${pairs.size}</b> relações<br>mais conectada: <b>${keys.filter(w=>deg[w]===maxDeg).join(", ")}</b>`;

// ---- three.js scene
let three=null;
try{ three = await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"); }
catch(e){ document.getElementById("err").style.display="grid"; }
if(three){
  const {Scene,PerspectiveCamera,WebGLRenderer,BufferGeometry,Float32BufferAttribute,
         LineSegments,LineBasicMaterial,Points,PointsMaterial,SphereGeometry,MeshBasicMaterial,
         AdditiveBlending,Color,Vector3} = three;
  const scene = new Scene();
  scene.fog = new (three.FogExp2)(0x0b0e14, 0.0016);
  const camera = new PerspectiveCamera(55, innerWidth/innerHeight, 1, 4000);
  const renderer = new WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById("scene").appendChild(renderer.domElement);

  // deterministic layout: golden-spiral sphere, radius by degree
  const N = keys.length, R = 340;
  const pos = new Map();
  keys.forEach((w,i)=>{
    const t = i/(N-1);
    const y = 1 - 2*t;
    const r = Math.sqrt(Math.max(0,1-y*y));
    const phi = i * 2.399963; // golden angle
    const rad = R * (0.55 + 0.45*Math.sqrt(deg[w]/maxDeg));
    pos.set(w, new Vector3(Math.cos(phi)*r*rad, y*rad, Math.sin(phi)*r*rad));
  });

  // lines
  const lpos = [];
  for(const w of keys) for(const l of WORDS[w]) if(w<l) {
    const a=pos.get(w), b=pos.get(l);
    lpos.push(a.x,a.y,a.z, b.x,b.y,b.z);
  }
  const lgeo = new BufferGeometry();
  lgeo.setAttribute("position", new Float32BufferAttribute(lpos,3));
  const lines = new LineSegments(lgeo, new LineBasicMaterial({color:0x2a3550, transparent:true, opacity:.5}));
  scene.add(lines);

  // nodes
  const npos = keys.map(w=>pos.get(w));
  const ngeo = new BufferGeometry();
  ngeo.setAttribute("position", new Float32BufferAttribute(npos.flatMap(v=>[v.x,v.y,v.z]),3));
  const nodes = new Points(ngeo, new PointsMaterial({color:0x9fb4d8, size:7, sizeAttenuation:true, transparent:true, opacity:.9}));
  scene.add(nodes);

  // labels via sprites
  function label(text, size, color){
    const c = document.createElement("canvas"); const ctx = c.getContext("2d");
    const font = `${size}px Inter, sans-serif`;
    ctx.font = font;
    const w = Math.ceil(ctx.measureText(text).width)+16;
    c.width=w; c.height=size+14;
    ctx.font=font; ctx.fillStyle=color; ctx.textBaseline="middle";
    ctx.fillText(text,8,(size+14)/2);
    const tex = new three.CanvasTexture(c);
    const sp = new three.Sprite(new three.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
    sp.scale.set(w/14, (size+14)/14, 1);
    return sp;
  }
  const labelMap = new Map();
  keys.forEach(w=>{
    const s = label(META[w].display, 26, "#cfd6e6");
    s.position.copy(pos.get(w)).add(new Vector3(0,10,0));
    s.visible=false;
    scene.add(s); labelMap.set(w,s);
  });

  // highlight set
  let focus=null, hi=null;
  function setFocus(w){
    focus=w;
    hi = w ? new Set([w, ...WORDS[w]]) : null;
    keys.forEach(k=>{
      const on = !hi || hi.has(k);
      labelMap.get(k).visible = on;
      labelMap.get(k).material.opacity = on ? (k===w?1:.85) : 0;
    });
    // recolor lines
    const col = new Float32Array(lpos.length);
    let i=0;
    for(const a of keys) for(const b of WORDS[a]) if(a<b){
      const on = hi && (hi.has(a)&&hi.has(b));
      const c = on ? new Color(0xe0b45c) : new Color(0x2a3550);
      col[i++]=c.r;col[i++]=c.g;col[i++]=c.b; col[i++]=c.r;col[i++]=c.g;col[i++]=c.b;
    }
    lgeo.setAttribute("color", new Float32BufferAttribute(col,3));
    lines.material = new LineBasicMaterial({vertexColors:true, transparent:true, opacity:.85});
    renderCard(w);
  }

  function renderCard(w){
    const card = document.getElementById("card");
    if(!w){
      card.innerHTML = `<div class="hint">busque uma palavra ou clique numa estrela<br>para ver suas relações</div>`;
      return;
    }
    const m = META[w];
    const syn = WORDS[w].filter(x=> (META[x].theme||"") === (m.theme||"") && m.theme);
    const chips = WORDS[w].map(x=>`<span class="chip" data-w="${x}">${META[x].display}</span>`).join("");
    card.innerHTML = `<h2>${m.display}</h2>
      ${m.theme?`<div class="tema">tema: ${m.theme}</div>`:""}
      <div class="lbl">${WORDS[w].length} relações</div>
      <div class="chips">${chips}</div>`;
    card.querySelectorAll(".chip").forEach(c=>c.onclick=()=>select(c.dataset.w));
  }

  function select(w){
    setFocus(w);
    const p = pos.get(w);
    camTarget.copy(p);
  }

  // camera orbit
  let theta=0.6, phi=1.2, dist=700;
  const camTarget = new Vector3(0,0,0);
  const targetTheta=()=>theta, targetPhi=()=>phi, targetDist=()=>dist;
  let tTheta=theta,tPhi=phi,tDist=dist;
  addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  let drag=false,px=0,py=0;
  renderer.domElement.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY});
  addEventListener("pointerup",()=>drag=false);
  addEventListener("pointermove",e=>{ if(!drag)return; tTheta-=(e.clientX-px)*.005; tPhi-=(e.clientY-py)*.005; tPhi=Math.max(.15,Math.min(Math.PI-.15,tPhi)); px=e.clientX;py=e.clientY; });
  addEventListener("wheel",e=>{ tDist*= (1+Math.sign(e.deltaY)*.12); tDist=Math.max(120,Math.min(1600,tDist)); },{passive:true});

  // click to select
  const ray = new three.Raycaster(); const mouse=new three.Vector2();
  renderer.domElement.addEventListener("click",e=>{
    mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObject(nodes);
    if(hits.length){ select(keys[hits[0].index]); }
  });

  function tick(){
    requestAnimationFrame(tick);
    if(!drag) tTheta+=.0009;
    theta+=(tTheta-theta)*.08; phi+=(tPhi-phi)*.08; dist+=(tDist-dist)*.08;
    camera.position.set(
      camTarget.x + dist*Math.sin(phi)*Math.cos(theta),
      camTarget.y + dist*Math.cos(phi),
      camTarget.z + dist*Math.sin(phi)*Math.sin(theta));
    camera.lookAt(camTarget);
    renderer.render(scene,camera);
  }
  tick();
  setFocus(null);

  // search
  const inp=document.getElementById("search"), sugg=document.getElementById("sugg");
  function showSugg(q){
    if(!q){sugg.style.display="none";return;}
    const nq=norm(q);
    const hits=keys.filter(k=>norm(k).includes(nq)).slice(0,12);
    if(!hits.length){sugg.style.display="none";return;}
    sugg.innerHTML=hits.map(k=>`<div data-w="${k}">${META[k].display}</div>`).join("");
    sugg.style.display="block";
    sugg.querySelectorAll("div").forEach(d=>d.onclick=()=>{select(d.dataset.w);sugg.style.display="none";inp.value=META[d.dataset.w].display;});
  }
  inp.addEventListener("input",()=>showSugg(inp.value));
  inp.addEventListener("keydown",e=>{
    if(e.key==="Enter"){ const w=find(inp.value); if(w){select(w);sugg.style.display="none";} }
  });
  inp.addEventListener("blur",()=>setTimeout(()=>sugg.style.display="none",150));

  // ?word=
  const q = new URLSearchParams(location.search).get("word");
  if(q){ const w=find(q); if(w){ select(w); inp.value=META[w].display; } }
}
</script>
