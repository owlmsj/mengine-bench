<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras | Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --bg2:#11151f; --ink:#e8ecf4; --dim:#8b93a7;
    --accent:#ffb454; --line:#232a3a;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:radial-gradient(1200px 800px at 70% -10%, #151b2b 0%, var(--bg) 60%);
    color:var(--ink); font-family:'Inter',system-ui,sans-serif; overflow:hidden;
  }
  canvas{position:fixed; inset:0; display:block; cursor:grab}
  canvas.dragging{cursor:grabbing}
  header{
    position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:16px;
    padding:14px 20px; pointer-events:none;
  }
  header > *{pointer-events:auto}
  h1{font-family:'Fraunces',serif; font-size:20px; margin:0; font-weight:700; letter-spacing:.2px}
  h1 span{color:var(--accent)}
  #searchwrap{position:relative; margin-left:auto}
  #search{
    width:280px; max-width:52vw; padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    background:rgba(17,21,31,.85); color:var(--ink); font:500 14px 'Inter',sans-serif; outline:none;
  }
  #search:focus{border-color:var(--accent)}
  #suggest{
    position:absolute; top:calc(100% + 6px); right:0; width:300px; max-height:300px; overflow:auto;
    background:var(--bg2); border:1px solid var(--line); border-radius:10px; display:none; z-index:6;
    box-shadow:0 12px 30px rgba(0,0,0,.5);
  }
  #suggest button{
    display:flex; width:100%; gap:8px; align-items:baseline; padding:8px 12px; background:none; border:0;
    color:var(--ink); font:500 14px 'Inter',sans-serif; cursor:pointer; text-align:left;
  }
  #suggest button:hover,#suggest button.active{background:#1b2233}
  #suggest .t{color:var(--dim); font-size:11px; margin-left:auto; text-transform:capitalize}
  #panel{
    position:fixed; left:20px; bottom:20px; z-index:5; width:330px; max-width:calc(100vw - 40px);
    background:rgba(17,21,31,.92); border:1px solid var(--line); border-radius:14px; padding:16px 18px;
    backdrop-filter:blur(6px); box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  #panel h2{font-family:'Fraunces',serif; margin:0 0 2px; font-size:26px; font-weight:700}
  #panel .tema{color:var(--accent); font-size:11px; text-transform:uppercase; letter-spacing:.12em; margin:0 0 10px}
  #panel .rel{margin:0 0 10px; color:var(--dim); font-size:12.5px; line-height:1.5}
  #panel .rel b{color:var(--ink); font-weight:600}
  #chips{display:flex; flex-wrap:wrap; gap:6px}
  .chip{
    padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--bg2);
    color:var(--ink); font:500 12.5px 'Inter',sans-serif; cursor:pointer;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  #hint{position:fixed; right:20px; bottom:20px; z-index:5; color:var(--dim); font-size:11.5px; text-align:right; line-height:1.6}
  #hint b{color:var(--ink)}
  #legend{position:fixed; top:56px; right:20px; z-index:5; display:flex; flex-direction:column; gap:4px; align-items:flex-end}
  .lg{display:flex; gap:6px; align-items:center; font-size:11px; color:var(--dim); text-transform:capitalize}
  .lg i{width:9px; height:9px; border-radius:50%; display:inline-block}
  #panel[hidden]{display:none}
  #empty{position:fixed; inset:0; display:grid; place-items:center; z-index:4; pointer-events:none}
  #empty[hidden]{display:none}
  #empty .card{
    pointer-events:auto; background:rgba(17,21,31,.92); border:1px solid var(--line); border-radius:14px;
    padding:22px 26px; max-width:420px; box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  #empty h2{font-family:'Fraunces',serif; margin:0 0 6px}
  #empty p{color:var(--dim); font-size:13.5px; line-height:1.55; margin:0}
  @media (max-width:640px){ #panel{width:calc(100vw - 40px)} #legend{display:none} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header>
  <h1>Universo de Palavras <span>· Dicionário Criativo</span></h1>
  <div id="searchwrap">
    <input id="search" type="text" placeholder="Buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="suggest"></div>
  </div>
</header>

<div id="legend"></div>

<div id="panel" hidden>
  <h2 id="w-title"></h2>
  <p class="tema" id="w-tema"></p>
  <p class="rel" id="w-rel"></p>
  <div id="chips"></div>
</div>

<div id="hint"><b>arraste</b> para mover · <b>scroll</b> para zoom<br>clique numa palavra para explorá-la<br><span id="stats"></span></div>

<div id="empty" hidden>
  <div class="card">
    <h2 id="e-title"></h2>
    <p>Essa palavra não está no universo. <button class="chip" id="e-close">fechar</button></p>
  </div>
</div>

const words = Object.fromEntries(NAMES.map(n=>[n, [...new Set([...(meta[n].sinonimos||[]), ...(meta[n].analogas||[])])].filter(x=>x in meta)]));
const DEG_IN = {}; for (const [a, ns] of Object.entries(words)) for (const b of ns) DEG_IN[b]=(DEG_IN[b]||0)+1;
const TEMAS = [...new Set(Object.values(temas))];
const PALETTE = ["#ffb454","#7bd88f","#6fb3ff","#f07f9e","#c792ea","#4ec9d4","#e0c060","#9aa7ff","#f07f5e","#7fe0c0","#c0c8d8","#d8a0e8"];
const COLOR = Object.fromEntries(TEMAS.map((t,i)=>[t, PALETTE[i%PALETTE.length]]));

// ---------- graph ----------
const nodes = NAMES.map((n,i)=>({ id:n, x:0, y:0, vx:0, vy:0, deg:words[n].length + (DEG_IN[n]||0) }));
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
const edges = [];
const seen = new Set();
for (const [a, ns] of Object.entries(words)) for (const b of ns) {
  const k = a < b ? a+"|"+b : b+"|"+a;
  if (a !== b && !seen.has(k)) { seen.add(k); edges.push({ a, b }); }
}
const neighbors = Object.fromEntries(NAMES.map(n=>[n,new Set()]));
for (const e of edges){ neighbors[e.a].add(e.b); neighbors[e.b].add(e.a); }

// ---------- canvas ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(2, devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
}
addEventListener('resize', resize); resize();

const view = { x: W/2, y: H/2, s: 1 };
let dragging=false, moved=false, lx=0, ly=0, node=null;
cv.addEventListener('pointerdown', e=>{ dragging=true; moved=false; lx=e.clientX; ly=e.clientY; cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e=>{
  if(dragging){
    const dx=e.clientX-lx, dy=e.clientY-ly;
    if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
    view.x+=dx; view.y+=dy; lx=e.clientX; ly=e.clientY;
  } else {
    node = pick(e.clientX, e.clientY);
  }
});
cv.addEventListener('pointerup', e=>{
  dragging=false; cv.classList.remove('dragging');
  if(!moved && node){ location.hash = '#'+encodeURIComponent(node.id); select(node.id); }
});
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const k = e.deltaY<0 ? 1.12 : 1/1.12;
  const mx=e.clientX, my=e.clientY;
  view.x = mx-(mx-view.x)*k; view.y = my-(my-view.y)*k; view.s*=k;
}, {passive:false});

function pick(px,py){
  const wx=(px-view.x)/view.s, wy=(py-view.y)/view.s;
  const r = Math.max(14/view.s, 6);
  let best=null;
  for(const n of nodes){
    const dx=n.x-wx, dy=n.y-wy;
    if(dx*dx+dy*dy < r*r && (!best || n.deg>best.deg)) best=n;
  }
  return best;
}

// ---------- simulation ----------
let cooling = 0;
function initLayout(){
  const R = 420;
  nodes.forEach((n,i)=>{
    const a = i/nodes.length*Math.PI*2;
    n.x = Math.cos(a)*R*(0.4+Math.random()*0.8);
    n.y = Math.sin(a)*R*(0.4+Math.random()*0.8);
  });
  for(let i=0;i<300;i++) step(1);
  fit();
}
function step(dt){
  for(const e of edges){
    const a=byId[e.a], b=byId[e.b];
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const rest = 90;
    const f = (d-rest)/d * 0.02;
    a.x += dx*f*dt; a.y += dy*f*dt; b.x -= dx*f*dt; b.y -= dy*f*dt;
  }
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b=nodes[j];
      const dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2<260*260 && d2>0.01){
        const d=Math.sqrt(d2), f=(260-d)/d*0.35;
        a.x-=dx*f*0.01*dt; a.y-=dy*f*0.01*dt; b.x+=dx*f*0.01*dt; b.y+=dy*f*0.01*dt;
      }
    }
  }
  for(const n of nodes){ n.vx*=0.85; n.vy*=0.85; n.x+=n.vx; n.y+=n.vy; }
}
function fit(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of nodes){ x0=Math.min(x0,n.x); x1=Math.max(x1,n.x); y0=Math.min(y0,n.y); y1=Math.max(y1,n.y); }
  const s = Math.min(W/(x1-x0+140), H/(y1-y0+140), 1.6);
  view.s = s;
  view.x = W/2 - (x0+x1)/2*s;
  view.y = H/2 - (y0+y1)/2*s;
}

// ---------- selection ----------
let selected = null;
const panel=document.getElementById('panel'), empty=document.getElementById('empty');
function select(word){
  if(!word || !words[word]){ selected=null; panel.hidden=true; empty.hidden=!word; if(word){document.getElementById('e-title').textContent='“'+word+'” não encontrada';} return; }
  empty.hidden=true;
  selected = word;
  document.getElementById('w-title').textContent = word;
  document.getElementById('w-tema').textContent = temas[word]||'';
  const ns=[...neighbors[word]];
  document.getElementById('w-rel').innerHTML =
    `<b>${ns.length}</b> ${ns.length===1?'conexão':'conexões'} no universo — ` +
    `<b>${(meta[word].sinonimos||[]).length}</b> sinônimos e ` +
    `<b>${(meta[word].analogas||[]).length}</b> palavras análogas.`;
  const chips=document.getElementById('chips'); chips.innerHTML='';
  for(const n of ns.sort()){
    const b=document.createElement('button'); b.className='chip'; b.textContent=n;
    b.onclick=()=>go(n); chips.appendChild(b);
  }
  panel.hidden=false;
  cooling = 120; // gentle re-settle
}
function go(word){
  history.pushState(null,'','#'+encodeURIComponent(word));
  select(word);
  const n=byId[word];
  if(n){ // center on the word
    const tx = W/2 - n.x*view.s, ty = H/2 - n.y*view.s;
    animateView(tx,ty);
  }
}
function animateView(tx,ty){
  const sx=view.x, sy=view.y, t0=performance.now();
  (function f(t){
    const k=Math.min(1,(t-t0)/350), e=1-Math.pow(1-k,3);
    view.x=sx+(tx-sx)*e; view.y=sy+(ty-sy)*e;
    if(k<1) requestAnimationFrame(f);
  })(t0);
}

// ---------- draw ----------
let alpha=1;
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(view.x,view.y); ctx.scale(view.s,view.s);

  const sel = selected;
  const ns = sel ? neighbors[sel] : null;
  const focus = !!sel;

  // edges
  for(const e of edges){
    const a=byId[e.a], b=byId[e.b];
    const hot = sel && (e.a===sel || e.b===sel);
    ctx.strokeStyle = hot ? 'rgba(255,180,84,.85)' : (focus ? 'rgba(90,100,125,.10)' : 'rgba(90,100,125,.22)');
    ctx.lineWidth = hot ? 2/view.s : 1/view.s;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  // nodes
  for(const n of nodes){
    const r = 4 + Math.min(8, n.deg*0.9);
    const isSel = sel===n.id, isNb = sel && ns.has(n.id);
    const dimmed = focus && !isSel && !isNb;
    ctx.globalAlpha = dimmed ? 0.16 : 1;
    ctx.fillStyle = isSel ? '#ffffff' : COLOR[temas[n.id]]||'#aaa';
    ctx.beginPath(); ctx.arc(n.x,n.y, isSel? r+3 : (isNb? r+1.5 : r), 0, Math.PI*2); ctx.fill();
    const showLabel = !focus || isSel || isNb || view.s>1.05;
    if(showLabel){
      ctx.globalAlpha = dimmed ? 0.14 : (isSel?1 : isNb?0.95 : Math.min(0.85, view.s));
      ctx.fillStyle = isSel ? '#fff' : (isNb ? '#e8ecf4' : '#98a1b5');
      ctx.font = `${isSel||isNb?'600 ':''}${(isSel?15:isNb?12.5:11)/view.s > 11 ? 12.5 : 11}px Inter, sans-serif`;
      ctx.font = `${(isSel?700:isNb?600:500)} ${isSel?15:isNb?12.5:11}px Inter, sans-serif`;
      ctx.textAlign='center';
      ctx.fillText(n.id, n.x, n.y - r - 5/view.s);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  if(cooling>0){ step(1); cooling--; }
  requestAnimationFrame(draw);
}

// ---------- search ----------
const inp=document.getElementById('search'), sug=document.getElementById('suggest');
let sugList=[], sugIdx=-1;
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
inp.addEventListener('input', ()=>{
  const q=norm(inp.value.trim());
  sugIdx=-1;
  if(!q){ sug.style.display='none'; return; }
  sugList = NAMES.filter(n=>norm(n).includes(q))
    .sort((a,b)=>(norm(a).startsWith(q)?0:1)-(norm(b).startsWith(q)?0:1) || b.length-a.length).slice(0,12);
  if(!sugList.length){ sug.style.display='none'; return; }
  sug.innerHTML='';
  sugList.forEach(n=>{
    const b=document.createElement('button');
    b.innerHTML=`${n}<span class="t">${temas[n]||''}</span>`;
    b.onclick=()=>{ inp.value=''; sug.style.display='none'; go(n); };
    sug.appendChild(b);
  });
  sug.style.display='block';
});
inp.addEventListener('keydown', e=>{
  const items=[...sug.children];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    sugIdx=(sugIdx+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
    items.forEach((b,i)=>b.classList.toggle('active', i===sugIdx));
  } else if(e.key==='Enter'){
    const w = sugIdx>=0 ? sugList[sugIdx] : (words[inp.value.trim()] ? inp.value.trim() : null);
    if(w){ inp.value=''; sug.style.display='none'; go(w); }
  } else if(e.key==='Escape'){ sug.style.display='none'; inp.blur(); }
});
document.addEventListener('click', e=>{ if(!e.target.closest('#searchwrap')) sug.style.display='none'; });
document.getElementById('e-close').onclick=()=>{ empty.hidden=true; history.pushState(null,'','#'); select(null); };
addEventListener('popstate', ()=>select(decodeURIComponent(location.hash.slice(1))||null));

// ---------- legend / stats ----------
const leg=document.getElementById('legend');
for(const t of TEMAS){
  const d=document.createElement('div'); d.className='lg';
  d.innerHTML=`<span>${t||'outros'}</span><i style="background:${COLOR[t]}"></i>`;
  leg.appendChild(d);
}
document.getElementById('stats').textContent = `${NAMES.length} palavras · ${edges.length} conexões`;

// ---------- boot ----------
initLayout();
draw();
const initial = decodeURIComponent(location.hash.slice(1)) || new URLSearchParams(location.search).get('word');
if(initial){
  if(words[initial]){ select(initial); const n=byId[initial]; view.x=W/2-n.x*view.s; view.y=H/2-n.y*view.s; }
  else { select(initial); } // shows "not found" card
}
</script>
</body>
</html>
