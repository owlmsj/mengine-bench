<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuji at Dusk — Chureito Pagoda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#141327}
  canvas{display:block}
  #ui{position:fixed;left:28px;bottom:26px;color:#f6e7dd;font-family:'Shippori Mincho',serif;
      text-shadow:0 2px 10px rgba(20,10,30,.6);pointer-events:none;user-select:none}
  #ui h1{margin:0;font-size:clamp(22px,4vw,40px);font-weight:700;letter-spacing:.04em}
  #ui p{margin:6px 0 0;font-size:clamp(11px,1.4vw,14px);opacity:.75;letter-spacing:.22em;text-transform:uppercase}
  #hint{position:fixed;right:24px;bottom:26px;color:#f6e7dd;opacity:.45;font-family:'Shippori Mincho',serif;
        font-size:12px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;user-select:none}
</style>
</head>
<body>
<div id="ui"><h1>Ch&#363;rei&#333;t&#333; &middot; Fuji</h1><p>&#26679;&#38634;&#12398;&#26149;&#12539;&#22815;&#26195;</p></div>
<div id="hint">drag to look &middot; scroll to zoom</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x3b2a4e, 90, 260);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 600);
const camTarget = new THREE.Vector3(0, 9, 0);
const cam = { yaw: 0.06, pitch: 0.10, dist: 46, baseYaw: 0.06, basePitch: 0.10, baseDist: 46 };
function placeCamera(t){
  const breathe = Math.sin(t*0.24)*0.8;
  const drift   = Math.sin(t*0.11)*0.035;
  const yaw = cam.yaw + drift, pitch = cam.pitch + Math.sin(t*0.17)*0.012;
  const d = cam.dist + breathe;
  camera.position.set(
    camTarget.x + d*Math.sin(yaw)*Math.cos(pitch),
    camTarget.y + d*Math.sin(pitch),
    camTarget.z + d*Math.cos(yaw)*Math.cos(pitch));
  camera.lookAt(camTarget);
}
addEventListener('pointerdown', e => { drag = {x:e.clientX, y:e.clientY}; });
addEventListener('pointermove', e => { if(!drag) return;
  cam.yaw   -= (e.clientX-drag.x)*0.004; cam.baseYaw = cam.yaw;
  cam.pitch  = Math.min(0.55, Math.max(0.02, cam.pitch + (e.clientY-drag.y)*0.003));
  cam.basePitch = cam.pitch; drag = {x:e.clientX, y:e.clientY}; });
addEventListener('pointerup', () => drag = null);
addEventListener('wheel', e => { cam.dist = Math.min(80, Math.max(26, cam.dist + e.deltaY*0.02)); cam.baseDist = cam.dist; }, {passive:true});
let drag = null;
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ---------- sky dome (dusk gradient + sun glow) ---------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sunDir: { value: new THREE.Vector3(-0.35, 0.10, -0.93).normalize() } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position);
    gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vDir; uniform vec3 sunDir;
    void main(){
      float h = clamp(vDir.y, -0.05, 1.0);
      vec3 zenith  = vec3(0.10,0.09,0.26);
      vec3 mid     = vec3(0.42,0.22,0.40);
      vec3 horizon = vec3(0.98,0.55,0.36);
      vec3 col = mix(horizon, mid, smoothstep(0.0,0.22,h));
      col = mix(col, zenith, smoothstep(0.18,0.75,h));
      float s = max(dot(normalize(vDir), sunDir), 0.0);
      col += vec3(1.0,0.62,0.32)*pow(s,18.0)*0.55;   /* broad glow   */
      col += vec3(1.0,0.82,0.55)*pow(s,300.0)*1.20;  /* sun disc     */
      gl_FragColor = vec4(col,1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 24, 16), skyMat));

/* ---------- lights ---------- */
const sun = new THREE.DirectionalLight(0xffa46b, 2.2);
sun.position.set(-42, 12, -110);
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x9c88e0, 0x33294a, 0.85);
scene.add(hemi);
/* soft warm fill from camera side so forms read at dusk */
const fill = new THREE.DirectionalLight(0x7a6ab0, 0.7);
fill.position.set(24, 34, 60);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xff8f5e, 0.9);
rim.position.set(30, 18, -60);
scene.add(rim);
scene.add(new THREE.AmbientLight(0x4a3b66, 0.9));

/* ---------- materials ---------- */
const flat = (c, o={}) => new THREE.MeshStandardMaterial({color:c, flatShading:true, roughness:.92, metalness:0, ...o});
const M = {
  fujiRock: flat(0x39315e), snow: flat(0xf7d9d4, {roughness:.85, emissive:0x8f5a6e, emissiveIntensity:.35}),
  ground: flat(0x241f3d), path: flat(0x4a3a52),
  red: flat(0xb63428, {roughness:.7}), white: flat(0xf2ece2, {roughness:.7}),
  roof: flat(0x37324e), roofEdge: flat(0x8f3a30),
  trunk: flat(0x4a3040), petalTree: flat(0xf3a8c0, {roughness:.85, emissive:0xc25e86, emissiveIntensity:.45}),
  petalTree2: flat(0xffc9d8, {emissive:0xd8789c, emissiveIntensity:.45}), cloud: flat(0xe8b9c4, {roughness:1}),
  stone: flat(0x54465f)
};

/* ---------- ground ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(200, 10), M.ground);
ground.rotation.x = -Math.PI/2;
scene.add(ground);
/* soft hill the pagoda stands on */
const hill = new THREE.Mesh(new THREE.ConeGeometry(20, 5.5, 9), M.ground);
hill.position.set(-13.5, 2.6, 9); scene.add(hill);

/* path from viewer toward pagoda */
for(let i=0;i<9;i++){
  const s = new THREE.Mesh(new THREE.BoxGeometry(2.2-i*0.12, .25, 1.4), M.stone);
  s.position.set(-8+i*0.55, .12, 24-i*2.1); s.rotation.y = .16*i;
  scene.add(s);
}

/* ---------- Mount Fuji ---------- */
function mountain(){
  const g = new THREE.Group();
  const R=64, H=46, seg=11;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(R, H, seg, 3), M.fujiRock);
  cone.position.y = H/2 - 2; g.add(cone);
  /* snow cap: cone matching the slope, base at snow line */
  const snowFrac = 0.62;
  const cap = new THREE.Mesh(new THREE.ConeGeometry(R*snowFrac, H*snowFrac, seg, 2), M.snow);
  cap.position.y = H/2 - 2 + H*(1-snowFrac)/2; g.add(cap);
  /* crater dip */
  const dip = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 5.2, 2.4, seg), M.fujiRock);
  dip.position.y = H - 2.6; g.add(dip);
  /* rocky foothills */
  for(const [x,z,r,h] of [[-46,8,16,9],[40,4,14,7],[-30,-24,13,6],[26,-26,12,5]]){
    const f = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), M.fujiRock);
    f.position.set(x, h/2-1, z); g.add(f);
  }
  g.position.set(0,0,-118);
  return g;
}
scene.add(mountain());

/* ---------- Chureito pagoda (5 tiers) ---------- */
function roofTier(w, overhang){
  const g = new THREE.Group();
  const roof = new THREE.Mesh(new THREE.ConeGeometry(w*0.5*overhang, w*0.30, 4), M.roof);
  roof.rotation.y = Math.PI/4; g.add(roof);
  const eave = new THREE.Mesh(new THREE.BoxGeometry(w*overhang*0.72, w*0.05, w*overhang*0.72), M.roofEdge);
  eave.position.y = -w*0.14; g.add(eave);
  return g;
}
function pagoda(){
  const g = new THREE.Group();
  const stone = new THREE.Mesh(new THREE.CylinderGeometry(5.6, 6.4, 1.2, 8), M.stone);
  stone.position.y = .6; g.add(stone);
  let y = 1.2, w = 5.2;
  for(let i=0;i<5;i++){
    const h = 2.5 - i*0.22;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w*0.62, h, w*0.62), M.red);
    body.position.y = y + h/2; g.add(body);
    /* white wall band + dark doorway */
    const band = new THREE.Mesh(new THREE.BoxGeometry(w*0.63, h*0.34, w*0.63), M.white);
    band.position.y = y + h*0.52; g.add(band);
    const door = new THREE.Mesh(new THREE.BoxGeometry(w*0.18, h*0.55, w*0.63+0.02), M.roof);
    door.position.y = y + h*0.32; g.add(door);
    const r = roofTier(w*1.02, 1.0 + i*0.02);
    r.position.y = y + h + w*0.14; g.add(r);
    y += h + w*0.26; w *= 0.88;
  }
  /* top finial (s\u014drin) */
  const fin = new THREE.Group();
  for(let k=0;k<4;k++){
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.34-k*.06, .05, 5, 9), M.white);
    ring.rotation.x = Math.PI/2; ring.position.y = k*0.55; fin.add(ring);
  }
  fin.position.y = y + 0.9; g.add(fin);
  const tip = new THREE.Mesh(new THREE.ConeGeometry(.14, 1.1, 6), M.white);
  tip.position.y = y + 3.1; g.add(tip);
  g.position.set(-13.5, 4.2, 9);
  g.rotation.y = 0.5;
  g.scale.setScalar(0.82);
  return g;
}
scene.add(pagoda());

/* ---------- cherry trees ---------- */
const canopies = [];
function tree(x, z, s=1){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.28*s, .42*s, 4.4*s, 5), M.trunk);
  trunk.position.y = 2.2*s; g.add(trunk);
  const mat = Math.random() < .5 ? M.petalTree : M.petalTree2;
  for(let i=0;i<4;i++){
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry((1.6 - i*0.18)*s, 0), mat);
    blob.position.set((Math.random()-.5)*2.2*s, (4.2+Math.random()*1.6)*s, (Math.random()-.5)*2.2*s);
    blob.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    g.add(blob); canopies.push(blob);
  }
  g.position.set(x, 0, z);
  g.rotation.y = Math.random()*6.28;
  scene.add(g);
}
/* framing grove near viewer + scattered blossoms along the hillside */
const grove = [[7,20,1.4],[11.5,16,1.1],[-4,26,1.2],[3,13,1.0],[15,24,1.3],
  [24,6,1.5],[30,-2,1.2],[-24,10,1.1],[-27,20,1.3],[-6,8,0.9],
  [20,14,1.0],[-19,26,1.2],[36,10,1.4],[-33,2,1.1],[9,30,1.5],[-11,32,1.2],[27,20,1.3]];
for(const [x,z,s] of grove) tree(x,z,s);

/* ---------- low poly clouds ---------- */
const clouds = [];
function cloud(x,y,z,s){
  const g = new THREE.Group();
  for(let i=0;i<4;i++){
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(s*(0.8+Math.random()*0.8), 0), M.cloud);
    b.position.set((Math.random()-.5)*s*2.6, (Math.random()-.5)*s*0.6, (Math.random()-.5)*s*1.4);
    g.add(b);
  }
  g.position.set(x,y,z); scene.add(g); clouds.push(g);
}
cloud(-55, 26, -95, 7); cloud(50, 32, -105, 9); cloud(-20, 40, -130, 8); cloud(75, 22, -70, 6);

/* ---------- falling petals (instanced) ---------- */
const PET = 380;
const petGeo = new THREE.PlaneGeometry(.16, .22);
const petMat = new THREE.MeshBasicMaterial({color:0xffb0c8, side:THREE.DoubleSide, transparent:true, opacity:.9});
const petals = new THREE.InstancedMesh(petGeo, petMat, PET);
const petState = [];
for(let i=0;i<PET;i++) petState.push({
  x:(Math.random()-.5)*70, y:Math.random()*30, z:(Math.random()-.5)*70,
  v:0.5+Math.random()*0.9, ph:Math.random()*6.28, sp:0.6+Math.random()*1.4});
scene.add(petals);
const dummy = new THREE.Object3D();

/* ---------- animate ---------- */
const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  /* petals: fall + sway + tumble */
  for(let i=0;i<PET;i++){
    const p = petState[i];
    p.y -= p.v * 0.016;
    if(p.y < 0) p.y = 30;
    dummy.position.set(p.x + Math.sin(t*p.sp + p.ph)*1.6, p.y, p.z + Math.cos(t*p.sp*0.8 + p.ph)*1.2);
    dummy.rotation.set(t*p.sp + p.ph, t*p.sp*1.3, p.ph);
    dummy.updateMatrix();
    petals.setMatrixAt(i, dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate = true;
  /* canopy sway */
  for(let i=0;i<canopies.length;i++){
    const c = canopies[i];
    c.rotation.z = Math.sin(t*0.9 + i)*0.045;
    c.position.y += Math.sin(t*1.3 + i*2)*0.0012;
  }
  /* clouds drift and wrap */
  for(const c of clouds){ c.position.x += 0.012; if(c.position.x > 110) c.position.x = -110; }
  placeCamera(t);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
placeCamera(0);
tick();
</script>
</body>
</html>
