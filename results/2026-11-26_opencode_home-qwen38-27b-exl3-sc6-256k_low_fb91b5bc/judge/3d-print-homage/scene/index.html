<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa — low poly wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2e8cf; }
  canvas { display: block; }
  #label {
    position: fixed; left: 14px; bottom: 10px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 12px; color: #2b3a55; opacity: .55;
    letter-spacing: .06em; pointer-events: none;
  }
</style>
</head>
<body>
<div id="label">The Great Wave off Kanagawa · Katsushika Hokusai · low poly homage</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---- Palette taken from the print (Prussian blue, indigo, foam white, paper, tan hull) ----
const C = {
  paper:   0xf2e8cf,
  skyTop:  0xf5eeda,
  skyLow:  0xd8d2c0,
  blueDeep:0x1b3a6b,
  blue:    0x2b5aa0,
  blueMid: 0x4a7ec0,
  foam:    0xf7f4ea,
  foamBlue:0xbcd4e8,
  fuji:    0x2e4a7a,
  snow:    0xf5f2e8,
  hull:    0xd9a05b,
  hullDark:0x8a5a2b,
  mist:    0xcfc9b8,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 60, 160);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 7, 46);
camera.lookAt(0, 6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// soft flat-ish lighting (print look: matte, no strong specular)
scene.add(new THREE.HemisphereLight(C.skyTop, C.blueDeep, 0.9));
const sun = new THREE.DirectionalLight(0xfff4dd, 0.7);
sun.position.set(-20, 30, 20);
scene.add(sun);

// ---------- helpers ----------
function flatMat(color, opts = {}) {
  return new THREE.MeshLambertMaterial({ color, flatShading: true, ...opts });
}

// ---------- sky gradient (big plane behind) ----------
{
  const g = new THREE.CanvasTexture((() => {
    const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256;
    const ctx = cv.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, '#f5eeda');
    grad.addColorStop(0.55, '#e9e2cd');
    grad.addColorStop(0.8, '#cfc9b8');
    grad.addColorStop(1, '#b9b2a0');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 4, 256);
    return new THREE.CanvasTexture(cv);
  })());
  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(600, 300),
    new THREE.MeshBasicMaterial({ map: g, fog: false })
  );
  sky.position.set(0, 40, -90);
  scene.add(sky);
}

// ---------- Mt. Fuji (center-right, snow-capped cone) ----------
const fuji = new THREE.Group();
{
  const cone = new THREE.Mesh(new THREE.ConeGeometry(14, 16, 7), flatMat(C.fuji));
  cone.position.y = 8;
  fuji.add(cone);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(6.2, 6.5, 7), flatMat(C.snow));
  cap.position.y = 13.2;
  fuji.add(cap);
}
fuji.position.set(10, -2, -46);
scene.add(fuji);

// ---------- mist band in front of Fuji ----------
{
  const mist = new THREE.Mesh(
    new THREE.PlaneGeometry(90, 7),
    new THREE.MeshBasicMaterial({ color: C.mist, transparent: true, opacity: 0.35, fog: false })
  );
  mist.position.set(10, 2, -40);
  scene.add(mist);
}

// ---------- The Great Wave: stacked curved wave forms ----------
// Each wave = a curved "tube" of blue with a white foam crest (torus-ish arc + spikes).
function makeWave({ x, y, z, radius, tube, arc, color, foamColor, seg = 24, radial = 8, scale = 1 }) {
  const g = new THREE.Group();
  // blue body: partial torus (the curling wall)
  const body = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, radial, seg, arc),
    flatMat(color)
  );
  g.add(body);
  // foam crest: thinner torus on the outer edge, white
  const crest = new THREE.Mesh(
    new THREE.TorusGeometry(radius + tube * 0.55, tube * 0.35, 6, seg, arc * 0.9),
    flatMat(foamColor)
  );
  g.add(crest);
  // foam "claws": small cones along the crest tip
  const n = 9;
  for (let i = 0; i < n; i++) {
    const t = (i / (n - 1)) * arc * 0.85 + arc * 0.05;
    const px = Math.cos(t) * (radius + tube * 0.55);
    const py = Math.sin(t) * (radius + tube * 0.55);
    const claw = new THREE.Mesh(new THREE.ConeGeometry(tube * 0.3, tube * 1.1, 5), flatMat(foamColor));
    claw.position.set(px, py, 0);
    claw.lookAt(px * 1.6, py * 1.6, 0);
    claw.rotateX(Math.PI / 2);
    g.add(claw);
  }
  // foam dots scattered on the wave face (the print's white speckles)
  const dn = 26;
  for (let i = 0; i < dn; i++) {
    const t = Math.random() * arc;
    const r = radius + (Math.random() - 0.5) * tube * 1.2;
    const dot = new THREE.Mesh(new THREE.SphereGeometry(tube * 0.12, 5, 4), flatMat(foamColor));
    dot.position.set(Math.cos(t) * r, Math.sin(t) * r, (Math.random() - 0.5) * tube * 0.8);
    g.add(dot);
  }
  g.position.set(x, y, z);
  g.scale.setScalar(scale);
  scene.add(g);
  return g;
}

// main towering wave (left, like the print)
const waveMain = makeWave({ x: -14, y: 8, z: -8, radius: 11, tube: 2.2, arc: Math.PI * 1.15, color: C.blue, foamColor: C.foam, scale: 1 });
// secondary wave behind it (darker)
const waveBack = makeWave({ x: -22, y: 5, z: -22, radius: 8, tube: 1.8, arc: Math.PI, color: C.blueDeep, foamColor: C.foamBlue, scale: 1 });
// right-side wave (smaller, receding)
const waveRight = makeWave({ x: 20, y: 3, z: -14, radius: 7, tube: 1.6, arc: Math.PI * 0.9, color: C.blueMid, foamColor: C.foam, scale: 1 });
// foreground swells (low, wide)
const waveFront1 = makeWave({ x: -6, y: -1, z: 6, radius: 10, tube: 1.4, arc: Math.PI * 0.7, color: C.blue, foamColor: C.foam, scale: 1.2 });
const waveFront2 = makeWave({ x: 12, y: -1.5, z: 10, radius: 9, tube: 1.3, arc: Math.PI * 0.6, color: C.blueMid, foamColor: C.foamBlue, scale: 1.2 });

// ---------- Boats (3, as in the print): long low hulls with crew dots ----------
function makeBoat({ x, y, z, rot = 0, len = 10, color = C.hull }) {
  const g = new THREE.Group();
  // hull: elongated box, tapered via two boxes
  const hull = new THREE.Mesh(new THREE.BoxGeometry(len, 0.9, 1.6), flatMat(color));
  g.add(hull);
  const bow = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.2, 4), flatMat(color));
  bow.rotation.z = Math.PI / 2;
  bow.position.x = len / 2 + 1;
  g.add(bow);
  const stern = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.2, 4), flatMat(color));
  stern.rotation.z = -Math.PI / 2;
  stern.position.x = -len / 2 - 1;
  g.add(stern);
  // deck line
  const deck = new THREE.Mesh(new THREE.BoxGeometry(len * 0.9, 0.15, 1.2), flatMat(C.hullDark));
  deck.position.y = 0.5;
  g.add(deck);
  // crew: small dark spheres
  for (let i = -3; i <= 3; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 5), flatMat(0x2a2a2a));
    p.position.set(i * 1.1, 0.75, 0);
    g.add(p);
  }
  g.position.set(x, y, z);
  g.rotation.y = rot;
  scene.add(g);
  return g;
}

const boat1 = makeBoat({ x: -16, y: 2.5, z: -2, rot: 0.35, len: 9 });   // left, in the trough
const boat2 = makeBoat({ x: 8,  y: 0.5, z: -6, rot: -0.15, len: 11 }); // center, near Fuji
const boat3 = makeBoat({ x: 16, y: 1.5, z: 4,  rot: 0.5,  len: 8 });   // right foreground

// ---------- gentle motion ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // waves bob and slowly curl
  waveMain.position.y = 8 + Math.sin(t * 0.6) * 0.5;
  waveMain.rotation.z = Math.sin(t * 0.4) * 0.04;
  waveBack.position.y = 5 + Math.sin(t * 0.5 + 1.3) * 0.4;
  waveRight.position.y = 3 + Math.sin(t * 0.7 + 2.1) * 0.4;
  waveFront1.position.y = -1 + Math.sin(t * 0.8 + 0.7) * 0.3;
  waveFront2.position.y = -1.5 + Math.sin(t * 0.65 + 1.9) * 0.3;

  // boats rock with the swell
  boat1.position.y = 2.5 + Math.sin(t * 0.9) * 0.35;
  boat1.rotation.z = Math.sin(t * 0.8) * 0.08;
  boat2.position.y = 0.5 + Math.sin(t * 0.7 + 1.1) * 0.3;
  boat2.rotation.z = Math.sin(t * 0.6 + 0.5) * 0.07;
  boat3.position.y = 1.5 + Math.sin(t * 1.0 + 2.0) * 0.35;
  boat3.rotation.z = Math.sin(t * 0.85 + 1.4) * 0.09;

  // very slow camera drift for wallpaper feel
  camera.position.x = Math.sin(t * 0.05) * 1.5;
  camera.position.y = 7 + Math.sin(t * 0.08) * 0.4;
  camera.lookAt(0, 6, 0);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
