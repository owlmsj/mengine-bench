<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo das Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14; --panel:rgba(16,20,30,.82); --ink:#e8e4da; --dim:#8b93a7;
  --gold:#d9a441; --rose:#c96f6f; --line:rgba(217,164,65,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
#top{padding:22px 26px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
#top h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;margin:0;letter-spacing:.5px}
#top h1 em{color:var(--gold);font-style:italic}
#stats{color:var(--dim);font-size:13px;letter-spacing:.4px}
#searchwrap{pointer-events:auto;margin-left:auto;position:relative}
#search{background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;width:230px;outline:none;
  backdrop-filter:blur(8px)}
#search:focus{border-color:var(--gold)}
#sugg{position:absolute;top:calc(100% + 6px);right:0;width:230px;max-height:260px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);
  display:none;pointer-events:auto}
#sugg div{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--dim)}
#sugg div:hover{color:var(--gold);background:rgba(217,164,65,.08)}
#panel{pointer-events:auto;margin:0 26px 22px;align-self:flex-start;max-width:420px;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);
  padding:18px 20px;display:none}
#panel.show{display:block}
#panel h2{font-family:"Cormorant Garamond",serif;font-size:34px;margin:0 0 2px;font-weight:600}
#panel .tema{color:var(--gold);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
#panel .lbl{color:var(--dim);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;margin:12px 0 6px}
#panel ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
#panel li{cursor:pointer}
#panel li a{display:inline-block;padding:4px 11px;border-radius:999px;font-size:13px;color:var(--ink);
  border:1px solid rgba(139,147,167,.3);text-decoration:none;transition:.15s}
#panel li a:hover{border-color:var(--gold);color:var(--gold)}
#panel li.syn a{border-color:var(--line)}
#close{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
#panel{position:relative}
#hint{position:fixed;bottom:22px;right:26px;color:var(--dim);font-size:12px;letter-spacing:.4px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div id="top">
    <h1>Universo das <em>Palavras</em></h1>
    <div id="stats"></div>
    <div id="searchwrap">
      <input id="search" type="text" placeholder="buscar palavra…" autocomplete="off">
      <div id="sugg"></div>
    </div>
  </div>
  <div id="panel">
    <button id="close" aria-label="fechar">×</button>
    <h2 id="pw"></h2>
    <div class="tema" id="pt"></div>
    <div class="lbl">Relações</div><ul id="psyn"></ul>
  </div>
</div>
<div id="hint">arraste para girar · role para zoom · clique numa palavra</div>

const words = Object.keys(DATA);
const idx = new Map(words.map((w,i)=>[w,i]));
const N = words.length;
const pairs = [];
const seen = new Set();
for (const w of words) for (const l of DATA[w]) {
  const a = idx.get(w), b = idx.get(l);
  if (a === b) continue;
  const key = a < b ? a + "_" + b : b + "_" + a;
  if (seen.has(key)) continue;
  seen.add(key);
  pairs.push([a, b]);
}
document.getElementById("stats").textContent = `${N} palavras · ${pairs.length} relações`;

// --- scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0e14, 0.0016);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 4000);
camera.position.set(0, 0, 420);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("scene").appendChild(renderer.domElement);

// nodes: spheres sized by degree
const deg = new Array(N).fill(0);
for (const [a,b] of pairs){deg[a]++;deg[b]++;}
const nodeGeo = new THREE.SphereGeometry(1, 20, 16);
const nodes = [];
for (let i=0;i<N;i++){
  const m = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({color:0x8b93a7, transparent:true, opacity:.9}));
  const s = 2.2 + Math.sqrt(deg[i])*1.1;
  m.scale.setScalar(s);
  m.userData = {i, base:s};
  scene.add(m); nodes.push(m);
}
// labels via sprites
function label(text){
  const c = document.createElement("canvas"); const x = c.getContext("2d");
  const fs = 44; x.font = `500 ${fs}px "Space Grotesk", sans-serif`;
  const w = Math.ceil(x.measureText(text).width)+24; c.width=w; c.height=fs+24;
  x.font = `500 ${fs}px "Space Grotesk", sans-serif`; x.fillStyle="#e8e4da";
  x.textBaseline="middle"; x.fillText(text, 12, c.height/2+2);
  const t = new THREE.CanvasTexture(c); t.minFilter=THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, transparent:true, opacity:.75, depthWrite:false}));
  sp.scale.set(w/44*7, (fs+24)/44*7, 1);
  return sp;
}
const labels = words.map(w=>{const s=label(w); scene.add(s); return s;});

// edges
const edgeGeo = new THREE.BufferGeometry();
const ep = new Float32Array(pairs.length*6);
edgeGeo.setAttribute("position", new THREE.BufferAttribute(ep, 3));
const edges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({color:0x3a4152, transparent:true, opacity:.5}));
scene.add(edges);

// --- layout: 3D force simulation
const pos = new Float32Array(N*3), vel = new Float32Array(N*3);
for (let i=0;i<N;i++){
  const r = 140*Math.cbrt(Math.random()), th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
  pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
}
function tick(){
  // repulsion (grid-free, N=251 fine)
  for (let i=0;i<N;i++) for (let j=i+1;j<N;j++){
    let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
    let d2=dx*dx+dy*dy+dz*dz+0.01;
    if (d2>90000) continue;
    const f = 900/d2;
    const d=Math.sqrt(d2); dx/=d; dy/=d; dz/=d;
    vel[i*3]+=dx*f; vel[i*3+1]+=dy*f; vel[i*3+2]+=dz*f;
    vel[j*3]-=dx*f; vel[j*3+1]-=dy*f; vel[j*3+2]-=dz*f;
  }
  // springs
  for (const [a,b] of pairs){
    let dx=pos[b*3]-pos[a*3], dy=pos[b*3+1]-pos[a*3+1], dz=pos[b*3+2]-pos[a*3+2];
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    const f=(d-55)*0.012;
    dx/=d; dy/=d; dz/=d;
    vel[a*3]+=dx*f*d*0.02; vel[a*3+1]+=dy*f*d*0.02; vel[a*3+2]+=dz*f*d*0.02;
    vel[b*3]-=dx*f*d*0.02; vel[b*3+1]-=dy*f*d*0.02; vel[b*3+2]-=dz*f*d*0.02;
  }
  // centering + integrate
  for (let i=0;i<N;i++){
    vel[i*3]-=pos[i*3]*0.002; vel[i*3+1]-=pos[i*3+1]*0.002; vel[i*3+2]-=pos[i*3+2]*0.002;
    vel[i*3]*=0.85; vel[i*3+1]*=0.85; vel[i*3+2]*=0.85;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}
let heat=1;
for (let i=0;i<300;i++){tick(); heat*=0.995;}

// --- selection / highlight
let selected=-1;
const neighbor = new Set();
function select(w){
  selected = idx.get(w) ?? -1;
  neighbor.clear();
  if (selected>=0) for (const l of DATA[w]) neighbor.add(idx.get(l));
  const panel=document.getElementById("panel");
  if (selected<0){panel.classList.remove("show");}
  else{
    document.getElementById("pw").textContent=w;
    const t=THEMES[w]; document.getElementById("pt").textContent=t?("tema: "+t):"";
    const us=document.getElementById("psyn"); us.innerHTML="";
    for (const l of DATA[w]){
      const li=document.createElement("li");
      const a=document.createElement("a"); a.textContent=l; a.href="?word="+encodeURIComponent(l);
      a.onclick=e=>{e.preventDefault(); select(l);};
      li.appendChild(a); us.appendChild(li);
    }
    
    panel.classList.add("show");
  }
  // colors
  for (let i=0;i<N;i++){
    const m=nodes[i];
    if (selected<0){m.material.color.setHex(0x8b93a7); m.material.opacity=.9;}
    else if (i===selected){m.material.color.setHex(0xd9a441); m.material.opacity=1;}
    else if (neighbor.has(i)){m.material.color.setHex(0xc96f6f); m.material.opacity=1;}
    else {m.material.color.setHex(0x39404f); m.material.opacity=.35;}
    labels[i].material.opacity = selected<0 ? .75 : (i===selected||neighbor.has(i) ? 1 : .12);
  }
  // edges
  const col = edgeGeo.getAttribute("position");
  for (let e=0;e<pairs.length;e++){
    const [a,b]=pairs[e];
    edges.material.opacity = .5;
  }
  history.replaceState(null,"","?word="+encodeURIComponent(w));
}
function clearSel(){ selected=-1; neighbor.clear();
  document.getElementById("panel").classList.remove("show");
  for (let i=0;i<N;i++){nodes[i].material.color.setHex(0x8b93a7); nodes[i].material.opacity=.9; labels[i].material.opacity=.75;}
  history.replaceState(null,"",location.pathname);
}

// --- orbit controls (manual)
let dragging=false, px=0, py=0, rotX=0, rotY=0, zoom=420, tRotX=0, tRotY=0, tZoom=420;
renderer.domElement.addEventListener("pointerdown",e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointermove",e=>{
  if(!dragging) return;
  tRotY+=(e.clientX-px)*0.005; tRotX+=(e.clientY-py)*0.005;
  tRotX=Math.max(-1.4,Math.min(1.4,tRotX));
  px=e.clientX; py=e.clientY;
});
renderer.domElement.addEventListener("wheel",e=>{
  e.preventDefault(); tZoom*= (1+Math.sign(e.deltaY)*0.08);
  tZoom=Math.max(120,Math.min(1200,tZoom));
},{passive:false});
// click to select
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let downAt=null;
renderer.domElement.addEventListener("pointerdown",e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener("pointerup",e=>{
  if(!downAt) return;
  const dx=e.clientX-downAt[0], dy=e.clientY-downAt[1]; downAt=null;
  if (dx*dx+dy*dy>25) return;
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(nodes)[0];
  if (hit) select(words[hit.object.userData.i]); else clearSel();
});

// --- search
const search=document.getElementById("search"), sugg=document.getElementById("sugg");
search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  if(!q){sugg.style.display="none";return;}
  const hits=words.filter(w=>w.startsWith(q)).slice(0,12);
  sugg.innerHTML="";
  for (const w of hits){
    const d=document.createElement("div"); d.textContent=w;
    d.onclick=()=>{select(w); sugg.style.display="none"; search.value="";};
    sugg.appendChild(d);
  }
  sugg.style.display=hits.length?"block":"none";
});
search.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const q=search.value.trim().toLowerCase();
    if (idx.has(q)) select(q);
    else { const h=words.find(w=>w.startsWith(q)); if(h) select(h); }
    sugg.style.display="none";
  }
});
document.getElementById("close").onclick=clearSel;
addEventListener("keydown",e=>{if(e.key==="Escape")clearSel();});

// --- loop
function frame(){
  requestAnimationFrame(frame);
  if (heat>0.02){ tick(); heat*=0.99; }
  rotX+=(tRotX-rotX)*0.08; rotY+=(tRotY-rotY)*0.08; zoom+=(tZoom-zoom)*0.1;
  scene.rotation.set(rotX, rotY, 0);
  camera.position.z=zoom;
  for (let i=0;i<N;i++){
    nodes[i].position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
    labels[i].position.set(pos[i*3],pos[i*3+1]+nodes[i].userData.base+8,pos[i*3+2]);
  }
  const p=edgeGeo.getAttribute("position");
  for (let e=0;e<pairs.length;e++){
    const [a,b]=pairs[e];
    p.array[e*6]=pos[a*3]; p.array[e*6+1]=pos[a*3+1]; p.array[e*6+2]=pos[a*3+2];
    p.array[e*6+3]=pos[b*3]; p.array[e*6+4]=pos[b*3+1]; p.array[e*6+5]=pos[b*3+2];
  }
  p.needsUpdate=true;
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
// deep link
const q=new URLSearchParams(location.search).get("word");
if (q && idx.has(q.toLowerCase())) select(q.toLowerCase());
frame();
</script>
