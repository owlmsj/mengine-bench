<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop Archery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- Audio (WebAudio, no assets) ----------
let AC = null;
function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol, hp) {
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime;
  const len = Math.max(1, Math.floor(ac.sampleRate * dur));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 800;
  const g = ac.createGain(); g.gain.setValueAtTime(vol || 0.3, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start(t0);
}
const sfx = {
  draw() { tone(180, 0.08, "triangle", 0.06, 240); },
  release(power) { noiseBurst(0.12, 0.15 + power * 0.1, 500); tone(300 + power * 200, 0.15, "triangle", 0.12, 120); },
  pop() { noiseBurst(0.07, 0.35, 1200); tone(600 + Math.random() * 300, 0.09, "square", 0.15, 150); },
  thud() { tone(90, 0.12, "sine", 0.2, 50); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.25, "triangle", 0.2), i * 130)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.3, "sawtooth", 0.12), i * 180)); },
  click() { tone(880, 0.05, "square", 0.08); }
};

// ---------- State ----------
const STATE = { MENU: 0, PLAY: 1, WIN: 2, LOSE: 3 };
let state = STATE.MENU;
let score = 0;
let arrowsLeft = 10;
let timeLeft = 60;
let balloons = [];
let arrows = [];
let particles = [];
let floaters = [];
let shake = 0;
let lastT = 0;
let spawnTimer = 0;

const TARGET_POP = 15; // pop this many to win
const MAX_BALLOONS = 6;

const BALLOON_COLORS = ["#ff5252", "#ffd740", "#69f0ae", "#40c4ff", "#e040fb", "#ff6e40"];

// Archer
const archer = { x: 0, y: 0, angle: -Math.PI / 4 };
function archerPos() { return { x: W * 0.12, y: H * 0.78 }; }

// Aiming
let mouse = { x: 0, y: 0 };
let drawing = false;
let drawStart = null;
let drawPower = 0;

canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
  if (drawing && drawStart) {
    const dx = drawStart.x - mouse.x;
    const dy = drawStart.y - mouse.y;
    drawPower = Math.min(1, Math.hypot(dx, dy) / 180);
  }
});
canvas.addEventListener("mousedown", (e) => {
  audio();
  if (state === STATE.MENU || state === STATE.WIN || state === STATE.LOSE) {
    startGame();
    return;
  }
  if (state === STATE.PLAY && arrowsLeft > 0) {
    drawing = true;
    drawStart = { x: mouse.x, y: mouse.y };
    drawPower = 0;
  }
});
window.addEventListener("mouseup", () => {
  if (drawing && state === STATE.PLAY) {
    drawing = false;
    if (drawPower > 0.05) shoot();
    drawPower = 0;
    drawStart = null;
  }
});
window.addEventListener("keydown", (e) => {
  if (e.code === "Space" || e.code === "Enter") {
    if (state !== STATE.PLAY) { audio(); startGame(); }
  }
});

function startGame() {
  sfx.click();
  state = STATE.PLAY;
  score = 0;
  arrowsLeft = 10;
  timeLeft = 60;
  balloons = [];
  arrows = [];
  particles = [];
  floaters = [];
  shake = 0;
  spawnTimer = 0;
  for (let i = 0; i < 3; i++) spawnBalloon();
}

function spawnBalloon() {
  if (balloons.length >= MAX_BALLOONS) return;
  const r = 26 + Math.random() * 14;
  const speed = 30 + Math.random() * 40 + Math.min(60, (TARGET_POP - score) * 2);
  balloons.push({
    x: W * 0.35 + Math.random() * W * 0.6,
    y: H + r + 10,
    r,
    vx: (Math.random() - 0.5) * 30,
    vy: -speed,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 1.5 + Math.random() * 1.5,
    color: BALLOON_COLORS[(Math.random() * BALLOON_COLORS.length) | 0],
    popped: false
  });
}

function shoot() {
  const p = archerPos();
  const dx = mouse.x - p.x;
  const dy = mouse.y - p.y;
  const ang = Math.atan2(dy, dx);
  const speed = 500 + drawPower * 900;
  arrows.push({ x: p.x, y: p.y - 20, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, ang, dead: false });
  arrowsLeft--;
  sfx.release(drawPower);
  shake = Math.min(8, 2 + drawPower * 6);
}

function popBalloon(b, idx) {
  b.popped = true;
  balloons.splice(idx, 1);
  score++;
  sfx.pop();
  shake = Math.min(10, shake + 4);
  // particles
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 200;
    particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50, r: 2 + Math.random() * 4, color: b.color, life: 0.6 + Math.random() * 0.4, t: 0 });
  }
  floaters.push({ x: b.x, y: b.y, text: "+1", t: 0, life: 0.9 });
  if (score >= TARGET_POP) {
    state = STATE.WIN;
    sfx.win();
  }
}

// ---------- Update ----------
function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  // particles always
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t += dt;
    f.y -= 40 * dt;
    if (f.t >= f.life) floaters.splice(i, 1);
  }

  if (state !== STATE.PLAY) return;

  timeLeft -= dt;
  if (timeLeft <= 0) {
    timeLeft = 0;
    state = STATE.LOSE;
    sfx.lose();
    return;
  }

  // spawn balloons
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnBalloon();
    spawnTimer = Math.max(0.5, 1.4 - score * 0.05);
  }

  // balloons
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    b.wobble += b.wobbleSpeed * dt;
    b.x += (b.vx + Math.sin(b.wobble) * 20) * dt;
    b.y += b.vy * dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < -b.r - 20) balloons.splice(i, 1);
  }

  // arrows
  const p = archerPos();
  archer.angle = Math.atan2(mouse.y - (p.y - 20), mouse.x - p.x);
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.vy += 150 * dt; // slight gravity
    a.ang = Math.atan2(a.vy, a.vx);
    if (a.x < -50 || a.x > W + 50 || a.y > H + 50 || a.y < -200) {
      arrows.splice(i, 1);
      continue;
    }
    // hit balloons
    for (let j = balloons.length - 1; j >= 0; j--) {
      const b = balloons[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) < b.r + 4) {
        popBalloon(b, j);
        arrows.splice(i, 1);
        break;
      }
    }
  }

  // lose if out of arrows with no balloons left to pop... actually lose when arrows run out
  if (arrowsLeft <= 0 && arrows.length === 0 && score < TARGET_POP) {
    state = STATE.LOSE;
    sfx.lose();
  }
}

// ---------- Draw ----------
function drawBackground() {
  // sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#7ec8f7");
  g.addColorStop(0.7, "#bfe6ff");
  g.addColorStop(1, "#e8f7ff");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // sun
  ctx.fillStyle = "rgba(255, 236, 150, 0.9)";
  ctx.beginPath();
  ctx.arc(W * 0.85, H * 0.15, 40, 0, Math.PI * 2);
  ctx.fill();

  // clouds (simple)
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  drawCloud(W * 0.2, H * 0.18, 1);
  drawCloud(W * 0.55, H * 0.1, 0.8);
  drawCloud(W * 0.75, H * 0.3, 0.6);

  // ground
  const gg = ctx.createLinearGradient(0, H * 0.85, 0, H);
  gg.addColorStop(0, "#7cb85c");
  gg.addColorStop(1, "#5a9440");
  ctx.fillStyle = gg;
  ctx.fillRect(0, H * 0.85, W, H * 0.15);
}
function drawCloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
  ctx.arc(x + 25 * s, y - 8 * s, 18 * s, 0, Math.PI * 2);
  ctx.arc(x + 48 * s, y, 20 * s, 0, Math.PI * 2);
  ctx.arc(x + 24 * s, y + 8 * s, 20 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawArcher() {
  const p = archerPos();
  ctx.save();
  ctx.translate(p.x, p.y);
  // body
  ctx.fillStyle = "#6d4c2f";
  ctx.beginPath();
  ctx.ellipse(0, -14, 10, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  // head
  ctx.fillStyle = "#f2c9a0";
  ctx.beginPath();
  ctx.arc(0, -38, 9, 0, Math.PI * 2);
  ctx.fill();
  // hat
  ctx.fillStyle = "#3e6b34";
  ctx.beginPath();
  ctx.arc(0, -42, 9, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(-13, -43, 26, 3);
  // legs
  ctx.strokeStyle = "#4a3520";
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-6, 14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(6, 14); ctx.stroke();

  // bow (rotated to aim)
  ctx.save();
  ctx.translate(0, -20);
  ctx.rotate(archer.angle);
  const pull = drawing ? drawPower * 22 : 0;
  // bow arc
  ctx.strokeStyle = "#8b5a2b";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, 0, 26, -Math.PI / 2.4, Math.PI / 2.4);
  ctx.stroke();
  // string
  ctx.strokeStyle = "#eee";
  ctx.lineWidth = 1.5;
  const bx = Math.cos(-Math.PI / 2.4) * 26, by = Math.sin(-Math.PI / 2.4) * 26;
  const bx2 = Math.cos(Math.PI / 2.4) * 26, by2 = Math.sin(Math.PI / 2.4) * 26;
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.lineTo(-pull, 0);
  ctx.lineTo(bx2, by2);
  ctx.stroke();
  // arrow nocked
  if (drawing && arrowsLeft > 0) {
    ctx.strokeStyle = "#5a3a1a";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-pull, 0);
    ctx.lineTo(30, 0);
    ctx.stroke();
    // arrowhead
    ctx.fillStyle = "#ccc";
    ctx.beginPath();
    ctx.moveTo(30, 0); ctx.lineTo(22, -4); ctx.lineTo(22, 4); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

function drawBalloon(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  // string
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, b.r);
  ctx.quadraticCurveTo(4, b.r + 14, -2, b.r + 28);
  ctx.stroke();
  // body
  const g = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.4, b.r * 0.2, 0, 0, b.r);
  g.addColorStop(0, "#ffffff");
  g.addColorStop(0.25, b.color);
  g.addColorStop(1, shade(b.color, -30));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(0, 0, b.r * 0.92, b.r, 0, 0, Math.PI * 2);
  ctx.fill();
  // knot
  ctx.fillStyle = shade(b.color, -30);
  ctx.beginPath();
  ctx.moveTo(0, b.r);
  ctx.lineTo(-5, b.r + 7);
  ctx.lineTo(5, b.r + 7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return "rgb(" + r + "," + g + "," + b + ")";
}

function drawArrow(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.ang);
  ctx.strokeStyle = "#5a3a1a";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(10, 0); ctx.stroke();
  ctx.fillStyle = "#ccc";
  ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-22, -3); ctx.lineTo(-22, 3); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a + 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.font = "bold 20px 'Press Start 2P', monospace";
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.t / f.life;
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "rgba(0,0,0,0.6)";
    ctx.lineWidth = 4;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.font = "16px 'Press Start 2P', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = "rgba(0,0,0,0.6)";
  ctx.lineWidth = 4;
  const s = "SCORE " + score + "/" + TARGET_POP;
  ctx.strokeText(s, 16, 30);
  ctx.fillText(s, 16, 30);
  const t = "TIME " + Math.ceil(timeLeft);
  ctx.strokeText(t, 16, 56);
  ctx.fillText(t, 16, 56);
  // arrows
  ctx.textAlign = "right";
  const a = "ARROWS " + arrowsLeft;
  ctx.strokeText(a, W - 16, 30);
  ctx.fillText(a, W - 16, 30);
  // power bar while drawing
  if (drawing) {
    const bw = 160, bh = 14;
    const bx = W / 2 - bw / 2, by = H - 40;
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    pg.addColorStop(0, "#69f0ae");
    pg.addColorStop(0.6, "#ffd740");
    pg.addColorStop(1, "#ff5252");
    ctx.fillStyle = pg;
    ctx.fillRect(bx, by, bw * drawPower, bh);
  }
}

function drawOverlay(title, sub, color) {
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = color;
  ctx.font = "34px 'Press Start 2P', monospace";
  ctx.strokeStyle = "rgba(0,0,0,0.8)";
  ctx.lineWidth = 6;
  ctx.strokeText(title, W / 2, H / 2 - 30);
  ctx.fillText(title, W / 2, H / 2 - 30);
  ctx.font = "14px 'Press Start 2P', monospace";
  ctx.fillStyle = "#fff";
  ctx.lineWidth = 4;
  ctx.strokeText(sub, W / 2, H / 2 + 20);
  ctx.fillText(sub, W / 2, H / 2 + 20);
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawBackground();
  for (const b of balloons) drawBalloon(b);
  for (const a of arrows) drawArrow(a);
  drawArcher();
  drawParticles();
  drawFloaters();
  ctx.restore();

  if (state === STATE.PLAY) drawHUD();
  if (state === STATE.MENU) drawOverlay("BALLOON ARCHERY", "Click to start", "#ffd740");
  if (state === STATE.WIN) drawOverlay("YOU WIN!", "Score " + score + " - Click to play again", "#69f0ae");
  if (state === STATE.LOSE) drawOverlay("GAME OVER", "Score " + score + " - Click to retry", "#ff5252");
}

// ---------- Loop ----------
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
