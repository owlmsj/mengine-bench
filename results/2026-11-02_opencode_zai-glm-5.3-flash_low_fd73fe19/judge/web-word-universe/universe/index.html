<style>

  *{box-sizing:border-box;margin:0;padding:0}

  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  header{position:fixed;inset:0 0 auto 0;z-index:10;display:flex;gap:14px;align-items:center;
    padding:12px 18px;background:linear-gradient(var(--bg) 60%,transparent);pointer-events:none}
  header>*{pointer-events:auto}
  h1{font-family:Fraunces,serif;font-weight:600;font-size:20px;letter-spacing:.2px}
  h1 span{color:var(--accent)}
  .searchwrap{position:relative;flex:0 1 360px}
  #search{width:100%;padding:9px 14px 9px 36px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font:inherit;font-size:14px;outline:none}
  #search:focus{border-color:var(--accent)}
  .searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55}
  #sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;max-height:280px;overflow-y:auto;
    box-shadow:0 12px 30px rgba(0,0,0,.5)}
  #sugg button{display:block;width:100%;text-align:left;padding:8px 14px;background:none;border:0;
    color:var(--text);font:inherit;font-size:14px;cursor:pointer}
  #sugg button:hover,#sugg button.hl{background:var(--panel2)}
  #sugg .tema{color:var(--dim);font-size:12px;float:right}
  #hint{color:var(--dim);font-size:12.5px;margin-left:auto;max-width:300px;text-align:right}
  #graph{position:fixed;inset:0;cursor:grab}
  #graph.drag{cursor:grabbing}
  #panel{position:fixed;right:16px;top:64px;bottom:16px;width:320px;z-index:9;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:20px;overflow-y:auto;display:none;
    box-shadow:0 12px 30px rgba(0,0,0,.5)}
  #panel h2{font-family:Fraunces,serif;font-size:30px;font-weight:600;line-height:1.1;word-break:break-word}
  #panel .tema-tag{display:inline-block;margin:10px 0 4px;padding:3px 10px;border-radius:99px;
    font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
  #panel .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  #panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin:18px 0 8px}
  #rel{display:flex;flex-wrap:wrap;gap:7px}
  #rel button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font:inherit;font-size:13.5px;cursor:pointer}
  #rel button:hover{border-color:var(--accent);color:var(--accent)}
  #panel .meta{margin-top:20px;font-size:12px;color:var(--dim)}
  #panel .meta a{color:var(--accent);text-decoration:none}
  #panel .meta a:hover{text-decoration:underline}
  #close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--dim);
    font-size:20px;cursor:pointer;line-height:1}
  #close:hover{color:var(--text)}
  #legend{position:fixed;left:16px;bottom:14px;z-index:9;display:flex;flex-wrap:wrap;gap:6px 14px;max-width:520px}
  #legend span{font-size:12px;color:var(--dim)}
  #legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
  #tip{position:fixed;z-index:11;pointer-events:none;background:var(--panel);border:1px solid var(--line);
    padding:4px 10px;border-radius:8px;font-size:13px;display:none}
  #empty{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:8;color:var(--dim);
    font-size:13px;background:rgba(14,16,20,.7);padding:6px 14px;border-radius:99px;border:1px solid var(--line)}
</style>
</head>

<script>
'use strict';
const DATA = JSON.parse(document.getElementById('data').textContent); // {word:{tema,rel:[]}}
const WORDS = Object.keys(DATA);
const N = WORDS.length;
const relCount = w => DATA[w].rel.length;

/* ---- tema palette ---- */
const temas = [...new Set(WORDS.map(w => DATA[w].tema))].sort();
const PALETTE = ['#f0b429','#e8654f','#5fb069','#5aa9e6','#b57edc','#e88fb0','#4ecdc4','#d98e32','#8fae5d','#c86b85','#7f9bd9','#c9a227'];
const temaColor = {};
temas.forEach((t,i)=>temaColor[t]=PALETTE[i%PALETTE.length]);

const legend = document.getElementById('legend');
legend.innerHTML = temas.map(t=>`<span><i style="background:${temaColor[t]}"></i>${t}</span>`).join('');

/* ---- force layout ---- */
const idx = new Map(WORDS.map((w,i)=>[w,i]));
const edges = []; // pairs of indices
const seen = new Set();
for (const w of WORDS) for (const r of DATA[w].rel) {
  const a = idx.get(w), b = idx.get(r);
  if (a===undefined||b===undefined) continue;
  const k = a<b ? a+'-'+b : b+'-'+a;
  if (!seen.has(k)) { seen.add(k); edges.push([a,b]); }
}
const pos = WORDS.map((w,i)=>{ // circle seed grouped by tema arc
  const a = (i/N)*Math.PI*2, r = 60+((i*7919)%97)/97*300;
  return {x:Math.cos(a)*r, y:Math.sin(a)*r};
});
(function layout(){
  const dist = WORDS.map(w=>80 - Math.min(relCount(w),12)*2); // well-connected words pulled closer
  for (let it=0; it<320; it++){
    const cool = 1 - it/340;
    const fx = new Float64Array(N), fy = new Float64Array(N);
    for (let i=0;i<N;i++) for (let j=i+1;j<N;j++){
      let dx=pos[j].x-pos[i].x, dy=pos[j].y-pos[i].y;
      let d2=dx*dx+dy*dy||0.01, d=Math.sqrt(d2);
      if (d>420) continue;
      const f = 2600/d2; dx/=d; dy/=d;
      fx[i]-=dx*f; fy[i]-=dy*f; fx[j]+=dx*f; fy[j]+=dy*f;
    }
    for (const [a,b] of edges){
      let dx=pos[b].x-pos[a].x, dy=pos[b].y-pos[a].y;
      let d=Math.sqrt(dx*dx+dy*dy)||0.01;
      const target=(dist[a]+dist[b])/2*1.15;
      const f=(d-target)*0.015; dx/=d; dy/=d;
      fx[a]+=dx*f*d; fy[a]+=dy*f*d; fx[b]-=dx*f*d; fy[b]-=dy*f*d;
    }
    for (let i=0;i<N;i++){
      pos[i].x+=Math.max(-8,Math.min(8,fx[i]*cool));
      pos[i].y+=Math.max(-8,Math.min(8,fy[i]*cool));
    }
  }
})();

/* ---- view / camera ---- */
const canvas = document.getElementById('graph'), ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
let W=0,H=0,DPR=1, cam={x:0,y:0,z:1}, selected=null, hover=-1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',resize); resize();

function w2s(p){ return {x:(p.x-cam.x)*cam.z + W/2, y:(p.y-cam.y)*cam.z + H/2}; }
function s2w(x,y){ return {x:(x-W/2)/cam.z + cam.x, y:(y-H/2)/cam.z + cam.y}; }

function neighbors(word){
  if (!word) return null;
  const set = new Set([word]);
  for (const r of DATA[word].rel) set.add(r);
  return set;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const nb = neighbors(selected);
  // edges
  for (const [a,b] of edges){
    const on = nb ? (nb.has(WORDS[a])&&nb.has(WORDS[b])&&(WORDS[a]===selected||WORDS[b]===selected)) : false;
    const lit = !nb || on;
    ctx.strokeStyle = on ? 'rgba(240,180,41,.85)' : (lit ? 'rgba(120,135,160,.18)' : 'rgba(120,135,160,.05)');
    ctx.lineWidth = on ? 1.6 : 0.7;
    const pa=w2s(pos[a]), pb=w2s(pos[b]);
    ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke();
  }
  // nodes
  for (let i=0;i<N;i++){
    const w=WORDS[i], p=w2s(pos[i]);
    if (p.x<-40||p.x>W+40||p.y<-40||p.y>H+40) continue;
    const deg=relCount(w);
    const base=2.6+Math.min(deg,14)*0.45;
    const isSel=w===selected, inNb=nb?nb.has(w):true;
    const r=base*cam.z*(isSel?1.6:inNb?1:0.7);
    const col=temaColor[DATA[w].tema];
    ctx.globalAlpha = isSel?1:inNb?(hover===i?1:.92):.13;
    if (isSel){
      ctx.beginPath(); ctx.arc(p.x,p.y,r+5*cam.z,0,7);
      ctx.strokeStyle='rgba(240,180,41,.5)'; ctx.lineWidth=2; ctx.stroke();
    }
    const g=ctx.createRadialGradient(p.x-r*.35,p.y-r*.35,r*.15,p.x,p.y,r);
    g.addColorStop(0,col); g.addColorStop(1,shade(col,-38));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fill();
    ctx.globalAlpha=1;
    if (isSel || (r>4.4&&inNb) || hover===i){
      ctx.fillStyle=isSel?'#fff':inNb?'#dfe3ea':'rgba(220,225,235,.15)';
      ctx.font=`${Math.max(10,10.5*cam.z)}px Inter, sans-serif`;
      ctx.textAlign='center';
      ctx.fillText(w, p.x, p.y-r-5*cam.z);
    }
  }
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const c=v=>Math.max(0,Math.min(255,v+amt));
  return `rgb(${c(n>>16)},${c((n>>8)&255)},${c(n&255)})`;
}

/* ---- interaction ---- */
let drag=null, moved=false;
canvas.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}; moved=false; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{
  if (drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>3) moved=true;
    cam.x=drag.cx-dx/cam.z; cam.y=drag.cy-dy/cam.z;
    return;
  }
  const m=s2w(e.clientX,e.clientY); hover=-1;
  for (let i=0;i<N;i++){
    const dx=pos[i].x-m.x, dy=pos[i].y-m.y, r=(2.6+Math.min(relCount(WORDS[i]),14)*0.45)/cam.z + 4/cam.z;
    if (dx*dx+dy*dy < r*r) { hover=i; break; }
  }
  if (hover>=0){
    const w=WORDS[hover];
    tip.style.display='block';
    tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    tip.textContent=w+' · '+DATA[w].rel.length+' ligações';
    canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='grab'; }
});
canvas.addEventListener('pointerup',e=>{
  canvas.classList.remove('drag');
  const wasDrag=moved; drag=null;
  if (!wasDrag && hover>=0) select(WORDS[hover]);
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const m=s2w(e.clientX,e.clientY);
  cam.z=Math.max(.25,Math.min(4,cam.z*(e.deltaY<0?1.12:0.89)));
  const m2=s2w(e.clientX,e.clientY);
  cam.x+=m.x-m2.x; cam.y+=m.y-m2.y;
},{passive:false});
canvas.addEventListener('dblclick',()=>{ if(selected){cam.x=0;cam.y=0;cam.z=1;} });

/* ---- panel ---- */
const panel=document.getElementById('panel');
document.getElementById('close').onclick=()=>select(null);
function select(word, skipUrl){
  selected=word;
  panel.style.display=word?'block':'none';
  document.getElementById('empty').style.display=word?'none':'block';
  if (!word){ draw(); if(!skipUrl) setUrl(null); return; }
  const d=DATA[word];
  document.getElementById('p-word').textContent=word;
  document.getElementById('p-tema').textContent=d.tema;
  document.querySelector('.tema-tag .dot').style.background=temaColor[d.tema];
  const rel=document.getElementById('rel');
  rel.innerHTML='';
  for (const r of d.rel){
    const b=document.createElement('button');
    b.textContent=r;
    b.onclick=()=>select(r);
    rel.appendChild(b);
  }
  const link=document.getElementById('p-link');
  link.onclick=e=>{
    e.preventDefault();
    const url=location.origin==='null'
      ? location.href.split('?')[0].split('#')[0]+'?word='+encodeURIComponent(word)
      : location.href.split('?')[0]+'?word='+encodeURIComponent(word);
    link.textContent='copiado ✓';
    setTimeout(()=>link.textContent='copiar link',1200);
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(()=>{});
  };
  // center camera softly on word
  const p=pos[idx.get(word)];
  cam.x=p.x; cam.y=p.y;
  draw();
  if (!skipUrl) setUrl(word);
}

/* ---- url ---- */
function setUrl(word){
  try{
    const u=location.href.split('?')[0].split('#')[0];
    history.replaceState(null,'', word? u+'?word='+encodeURIComponent(word) : u);
  }catch(_){}
  document.title=word? word+' — Universo de Palavras' : 'Universo de Palavras — Dicionário Criativo';
}
const initial=new URLSearchParams(location.search).get('word')
  || decodeURIComponent((location.hash.match(/[?#&]word=([^&]*)/)||[])[1]||'');
if (initial && DATA[initial]) select(initial,true);
else if (initial){ // case-insensitive fallback
  const hit=WORDS.find(w=>w.toLowerCase()===initial.toLowerCase());
  if (hit) select(hit,true);
}

/* ---- search ---- */
const search=document.getElementById('search'), sugg=document.getElementById('sugg');
let hl=-1, list=[];
function showSugg(q){
  q=q.trim().toLowerCase();
  list = q ? WORDS.filter(w=>w.toLowerCase().includes(q))
             .sort((a,b)=>(a.toLowerCase().indexOf(q)-b.toLowerCase().indexOf(q))||relCount(b)-relCount(a)).slice(0,12)
           : [];
  hl=-1;
  sugg.style.display=list.length?'block':'none';
  sugg.innerHTML=list.map(w=>`<button data-w="${w.replace(/"/g,'&quot;')}">${w}<span class="tema">${DATA[w].tema}</span></button>`).join('');
}
search.addEventListener('input',()=>showSugg(search.value));
search.addEventListener('focus',()=>showSugg(search.value));
sugg.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  pick(b.dataset.w);
});
search.addEventListener('keydown',e=>{
  if (e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    hl=(hl+(e.key==='ArrowDown'?1:-1)+list.length)%list.length;
    [...sugg.children].forEach((c,i)=>c.classList.toggle('hl',i===hl));
  } else if (e.key==='Enter'){
    pick(list[hl>=0?hl:0]);
  } else if (e.key==='Escape'){ sugg.style.display='none'; search.blur(); }
});
function pick(w){
  if (!w) return;
  search.value=''; sugg.style.display='none'; search.blur();
  select(w);
}
document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) sugg.style.display='none'; });

(function loop(){ draw(); requestAnimationFrame(loop); })();
</script>
</body>
