<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYSHOT! — Balloon Butte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --ink:#10142a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#0b0e22; }
  #c { display:block; width:100vw; height:100vh; cursor:crosshair; }
  .px { font-family:'Press Start 2P', monospace; }
  /* Win95-style beveled panel */
  .panel {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    background:#c0c0c0; color:var(--ink);
    border-top:3px solid #fff; border-left:3px solid #fff;
    border-right:3px solid #404040; border-bottom:3px solid #404040;
    padding:6px; text-align:center; user-select:none;
  }
  .panel .in { border-top:2px solid #808080; border-left:2px solid #808080;
    border-right:2px solid #fff; border-bottom:2px solid #fff; padding:26px 34px; }
  .titlebar { background:linear-gradient(90deg,#000080,#1084d0); color:#fff;
    font-size:10px; padding:4px 8px; text-align:left; margin:-26px -34px 18px; }
  .panel h1 { font-size:26px; letter-spacing:2px; margin-bottom:14px; text-shadow:2px 2px 0 #ff5d5d; }
  .panel p { font-size:10px; line-height:2; margin-bottom:14px; }
  .panel .big { font-size:16px; margin:10px 0 16px; }
  .btn { display:inline-block; font-size:11px; padding:12px 22px; background:#c0c0c0; color:var(--ink);
    border-top:3px solid #fff; border-left:3px solid #fff; border-right:3px solid #404040; border-bottom:3px solid #404040;
    cursor:pointer; }
  .btn:active { border-top:3px solid #404040; border-left:3px solid #404040; border-right:3px solid #fff; border-bottom:3px solid #fff; }
  #hud { position:absolute; left:12px; top:12px; display:flex; gap:10px; pointer-events:none; }
  .chip { background:#c0c0c0; border-top:2px solid #fff; border-left:2px solid #fff;
    border-right:2px solid #404040; border-bottom:2px solid #404040; padding:8px 12px;
    font-size:11px; color:var(--ink); }
  .chip b { color:#000080; }
  #wave { position:absolute; left:50%; top:22%; transform:translateX(-50%); font-size:22px;
    color:#fff; text-shadow:3px 3px 0 #d0205a; opacity:0; pointer-events:none; }
  .hidden, #hud.hidden { display:none; }
  .blink { animation:bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity:0; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="px hidden"><div class="chip">SCORE <b id="score">0</b></div><div class="chip">COMBO <b id="combo">x1</b></div><div class="chip">LIVES <b id="lives">3</b></div></div>
<div id="wave" class="px"></div>
<div id="start" class="panel px"><div class="in">
  <div class="titlebar">C:\GAMES\SKYSHOT.EXE</div>
  <h1>SKYSHOT!</h1>
  <p>BALLOONS RISE FROM THE BUTTE.<br>LET THREE ESCAPE AND IT'S GAME OVER.<br><br>
  HOLD MOUSE — DRAW THE BOW<br>RELEASE — LOOSE THE ARROW<br>WIND SHIFTS EACH WAVE.</p>
  <div class="btn blink" id="startBtn">START</div>
</div></div>
<div id="over" class="panel px hidden"><div class="in">
  <div class="titlebar">C:\GAMES\SKYSHOT.EXE</div>
  <h1>GAME OVER</h1>
  <p class="big">SCORE <span id="final">0</span></p>
  <p>BEST <span id="best">0</span></p>
  <div class="btn blink" id="againBtn">PLAY AGAIN</div>
</div></div>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();
const groundY = () => H * 0.84;
const archer = () => ({ x: W * 0.14, y: groundY() });

// ---------- audio (WebAudio, no assets) ----------
let AC = null, master = null, drawNode = null;
function audio() {
  if (AC) return AC;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createDynamicsCompressor(); master.connect(AC.destination);
  return AC;
}
function noiseBuf() {
  const n = AC.sampleRate * 0.5, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function tone(f0, f1, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function sfxShot() {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime;
  s.buffer = noiseBuf(); f.type = 'bandpass'; f.frequency.setValueAtTime(2600, t);
  f.frequency.exponentialRampToValueAtTime(300, t + 0.18); f.Q.value = 1.2;
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.22);
}
function sfxPop(pitch) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime;
  s.buffer = noiseBuf(); f.type = 'bandpass'; f.frequency.value = 900 * pitch; f.Q.value = 2.5;
  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.1);
  tone(520 * pitch, 180, 0.12, 'triangle', 0.35);
}
function sfxEscape() { tone(300, 90, 0.4, 'square', 0.25); }
function sfxWave() { tone(660, 660, 0.09, 'square', 0.2); setTimeout(() => tone(990, 990, 0.14, 'square', 0.2), 110); }
function sfxOver() { [523, 392, 311, 196].forEach((f, i) => setTimeout(() => tone(f, f * 0.98, 0.28, 'square', 0.25), i * 180)); }
function drawStart() {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf(); s.loop = true; f.type = 'bandpass'; f.frequency.value = 200; f.Q.value = 4;
  g.gain.value = 0.0; s.connect(f); f.connect(g); g.connect(master); s.start();
  drawNode = { s, f, g };
}
function drawUpdate(p) {
  if (!drawNode) return;
  drawNode.g.gain.value = 0.05 + p * 0.16;
  drawNode.f.frequency.value = 180 + p * 900;
}
function drawStop() {
  if (!drawNode) return;
  drawNode.g.gain.setTargetAtTime(0, AC.currentTime, 0.03);
  drawNode.s.stop(AC.currentTime + 0.15); drawNode = null;
}

// ---------- game state ----------
const S = { mode: 'start', score: 0, best: 0, lives: 3, combo: 0, mult: 1,
  wave: 0, toSpawn: 0, spawnT: 0, wind: 0, shake: 0, stop: 0, t: 0 };
try { S.best = +localStorage.getItem('skyshot.best') || 0; } catch (e) {}
let balloons = [], arrows = [], parts = [], texts = [];
const mouse = { x: W * 0.6, y: H * 0.3, down: false };
let power = 0;

const COLORS = ['#ff4d5e', '#ffc93c', '#3ddc84', '#4dc9ff', '#c77dff', '#ff9f43'];
const G = 980;

function startGame() {
  audio(); AC.resume();
  S.mode = 'play'; S.score = 0; S.lives = 3; S.combo = 0; S.mult = 1; S.wave = 0; S.t = 0;
  balloons = []; arrows = []; parts = []; texts = [];
  nextWave(); hud();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
}
function nextWave() {
  S.wave++; S.toSpawn = 4 + S.wave * 2; S.spawnT = 0.4;
  S.wind = (Math.random() * 2 - 1) * Math.min(0.5 + S.wave * 0.12, 1.4);
  const el = document.getElementById('wave');
  el.textContent = 'WAVE ' + S.wave + (S.wind > 0.15 ? '  WIND >' : S.wind < -0.15 ? '  < WIND' : '');
  el.style.transition = 'none'; el.style.opacity = 1;
  requestAnimationFrame(() => { el.style.transition = 'opacity 1.6s'; el.style.opacity = 0; });
  sfxWave();
}
function spawnBalloon() {
  const r = 16 + Math.random() * 16;
  balloons.push({
    x: W * (0.35 + Math.random() * 0.6), y: H + r + 30,
    vy: -(34 + S.wave * 7 + Math.random() * 26),
    r, c: COLORS[(Math.random() * COLORS.length) | 0],
    ph: Math.random() * 7, sway: 22 + Math.random() * 30,
    pts: Math.round(1400 / r) * 5
  });
}
function hud() {
  document.getElementById('score').textContent = S.score;
  document.getElementById('combo').textContent = 'x' + S.mult;
  document.getElementById('lives').textContent = S.lives;
}
function gameOver() {
  S.mode = 'over'; drawStop(); sfxOver();
  if (S.score > S.best) { S.best = S.score; try { localStorage.setItem('skyshot.best', S.best); } catch (e) {} }
  document.getElementById('final').textContent = S.score;
  document.getElementById('best').textContent = S.best;
  document.getElementById('over').classList.remove('hidden');
}

// ---------- input ----------
function aim() {
  const a = archer();
  let ang = Math.atan2(mouse.y - (a.y - 46), mouse.x - a.x);
  ang = Math.max(-Math.PI + 0.12, Math.min(-0.12, ang));
  return ang;
}
cv.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('pointerdown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (S.mode !== 'play' || mouse.down) return;
  mouse.down = true; power = 0; audio(); AC.resume(); drawStart();
});
addEventListener('pointerup', () => {
  if (!mouse.down) return;
  mouse.down = false;
  if (S.mode !== 'play') return;
  const a = archer(), ang = aim(), sp = 520 + power * 980;
  arrows.push({ x: a.x, y: a.y - 46, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
    trail: [], dead: false, stuck: 0 });
  S.shake = Math.max(S.shake, 3 + power * 5);
  sfxShot(); drawStop();
});
document.getElementById('startBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;

// ---------- update ----------
function pop(b, ax, ay) {
  S.combo++; S.mult = Math.min(1 + Math.floor(S.combo / 3), 5);
  const gain = b.pts * S.mult;
  S.score += gain; hud();
  sfxPop(1 + S.combo * 0.06);
  S.shake = Math.max(S.shake, 6); S.stop = 0.045;
  texts.push({ x: b.x, y: b.y, txt: '+' + gain, life: 1, c: S.mult > 1 ? '#ffd23c' : '#fff' });
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 260;
    parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 0.5 + Math.random() * 0.5, c: Math.random() < 0.6 ? b.c : '#fff', r: 2 + Math.random() * 3 });
  }
  parts.push({ x: b.x, y: b.y, vx: 0, vy: 40, life: 0.7, c: '#888', r: b.r * 0.4, shred: true });
}
function escaped(b) {
  S.combo = 0; S.mult = 1; S.lives--; hud(); sfxEscape();
  S.shake = Math.max(S.shake, 4);
  texts.push({ x: b.x, y: 40, txt: 'MISS!', life: 1, c: '#ff5d5d' });
  if (S.lives <= 0) gameOver();
}
function update(dt) {
  S.t += dt;
  if (mouse.down) { power = Math.min(1, power + dt / 0.85); drawUpdate(power); }
  if (S.toSpawn > 0) {
    S.spawnT -= dt;
    if (S.spawnT <= 0) { spawnBalloon(); S.toSpawn--; S.spawnT = Math.max(0.35, 1.5 - S.wave * 0.12); }
  }
  for (const b of balloons) {
    b.y += b.vy * dt;
    b.x += (Math.sin(S.t * 1.3 + b.ph) * b.sway + S.wind * 46) * dt;
    if (b.y < -b.r - 40) { b.dead = true; escaped(b); }
  }
  for (const ar of arrows) {
    if (ar.dead) { ar.stuck += dt; continue; }
    ar.vy += G * dt; ar.vx += S.wind * 60 * dt;
    ar.x += ar.vx * dt; ar.y += ar.vy * dt;
    ar.trail.push({ x: ar.x, y: ar.y }); if (ar.trail.length > 9) ar.trail.shift();
    if (ar.y > groundY() + 6) { ar.dead = true; ar.y = groundY() + 6; }
    if (ar.x < -60 || ar.x > W + 60 || ar.y > H + 80) ar.dead = true;
    const tip = { x: ar.x + Math.cos(Math.atan2(ar.vy, ar.vx)) * 14, y: ar.y + Math.sin(Math.atan2(ar.vy, ar.vx)) * 14 };
    for (const b of balloons) {
      if (b.dead) continue;
      const dx = tip.x - b.x, dy = tip.y - b.y;
      if (dx * dx + dy * dy < (b.r + 5) * (b.r + 5)) { b.dead = true; ar.dead = true; pop(b, tip.x, tip.y); break; }
    }
  }
  for (const p of parts) { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  for (const t of texts) { t.y -= 34 * dt; t.life -= dt * 0.8; }
  balloons = balloons.filter(b => !b.dead);
  arrows = arrows.filter(a => !a.dead || a.stuck < 4);
  parts = parts.filter(p => p.life > 0);
  texts = texts.filter(t => t.life > 0);
  if (S.toSpawn === 0 && balloons.length === 0 && S.mode === 'play') nextWave();
  S.shake = Math.max(0, S.shake - dt * 22);
}

// ---------- draw ----------
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b1f4b'); g.addColorStop(0.55, '#7a3b6e'); g.addColorStop(0.8, '#e8734a'); g.addColorStop(1, '#ffb46b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd9a0'; ctx.beginPath(); ctx.arc(W * 0.78, H * 0.66, 46, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137.5) % W, sy = (i * 71.3) % (H * 0.4);
    ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(S.t + i));
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#4a2c53';
  ctx.beginPath(); ctx.moveTo(0, groundY());
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, groundY() - 40 - 60 * Math.abs(Math.sin(x * 0.004 + 2)));
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  ctx.fillStyle = '#2c1b38';
  ctx.beginPath(); ctx.moveTo(0, groundY());
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, groundY() - 18 - 30 * Math.abs(Math.sin(x * 0.007 + 5)));
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  ctx.fillStyle = '#1a1026'; ctx.fillRect(0, groundY(), W, H - groundY());
}
function drawBalloon(b) {
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(b.x, b.y + b.r);
  ctx.quadraticCurveTo(b.x + Math.sin(S.t * 2 + b.ph) * 8, b.y + b.r + 22, b.x, b.y + b.r + 40); ctx.stroke();
  const g = ctx.createRadialGradient(b.x - b.r * 0.4, b.y - b.r * 0.4, b.r * 0.2, b.x, b.y, b.r);
  g.addColorStop(0, '#fff'); g.addColorStop(0.25, b.c); g.addColorStop(1, b.c);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * 0.92, b.r, 0, 0, 7); ctx.fill();
  ctx.fillStyle = b.c;
  ctx.beginPath(); ctx.moveTo(b.x - 4, b.y + b.r - 2); ctx.lineTo(b.x + 4, b.y + b.r - 2); ctx.lineTo(b.x, b.y + b.r + 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.4, b.y - b.r * 0.45, b.r * 0.16, b.r * 0.26, -0.6, 0, 7); ctx.fill();
}
function drawArcher() {
  const a = archer(), ang = aim(), pull = mouse.down ? power : 0;
  ctx.save(); ctx.translate(a.x, a.y);
  ctx.fillStyle = '#12081f'; ctx.strokeStyle = '#12081f'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(-2, -26); ctx.moveTo(8, 0); ctx.lineTo(4, -26); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(2, -52); ctx.stroke();
  ctx.beginPath(); ctx.arc(3, -60, 8, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2, -48); ctx.lineTo(16, -44); ctx.stroke();
  ctx.translate(2, -46); ctx.rotate(ang);
  ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, 26, -1.25, 1.25); ctx.stroke();
  const px = -10 - pull * 16;
  ctx.strokeStyle = '#eee'; ctx.lineWidth = 1.5;
  const ty = Math.sqrt(26 * 26 - px * px);
  ctx.beginPath(); ctx.moveTo(px, -ty); ctx.lineTo(px, 0); ctx.lineTo(px, ty); ctx.stroke();
  if (mouse.down) {
    ctx.strokeStyle = '#d9c9a3'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(30, 0); ctx.stroke();
    ctx.fillStyle = '#cfd6e6';
    ctx.beginPath(); ctx.moveTo(36, 0); ctx.lineTo(28, -4); ctx.lineTo(28, 4); ctx.fill();
  }
  ctx.restore();
  if (mouse.down) {
    ctx.fillStyle = '#c0c0c0'; ctx.fillRect(a.x - 30, a.y + 14, 60, 8);
    ctx.fillStyle = power > 0.95 ? '#ff4d5e' : '#3ddc84';
    ctx.fillRect(a.x - 28, a.y + 16, 56 * power, 4);
    let px2 = a.x, py2 = a.y - 46, vx = Math.cos(ang) * (520 + power * 980), vy = Math.sin(ang) * (520 + power * 980);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < 34; i++) {
      vy += G / 60; vx += S.wind * 60 / 60; px2 += vx / 60; py2 += vy / 60;
      if (i % 3 === 0) { ctx.globalAlpha = 0.6 * (1 - i / 34); ctx.beginPath(); ctx.arc(px2, py2, 2.5, 0, 7); ctx.fill(); }
      if (py2 > groundY()) break;
    }
    ctx.globalAlpha = 1;
  }
}
function draw() {
  ctx.save();
  if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
  drawBG();
  for (const b of balloons) drawBalloon(b);
  for (const ar of arrows) {
    const ang = Math.atan2(ar.vy, ar.vx);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
    ctx.beginPath();
    ar.trail.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.stroke();
    ctx.save(); ctx.translate(ar.x, ar.y); ctx.rotate(ang);
    ctx.strokeStyle = '#d9c9a3'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(12, 0); ctx.stroke();
    ctx.fillStyle = '#cfd6e6';
    ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(8, -4); ctx.lineTo(8, 4); ctx.fill();
    ctx.strokeStyle = '#ff4d5e'; ctx.beginPath();
    ctx.moveTo(-22, 0); ctx.lineTo(-16, -4); ctx.moveTo(-22, 0); ctx.lineTo(-16, 4); ctx.stroke();
    ctx.restore();
  }
  for (const p of parts) {
    ctx.globalAlpha = Math.max(p.life, 0);
    if (p.shred) { ctx.strokeStyle = p.c; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0.3, 2.6); ctx.stroke(); }
    else { ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
  }
  ctx.globalAlpha = 1;
  if (S.mode === 'play') drawArcher();
  ctx.font = "12px 'Press Start 2P', monospace"; ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = Math.max(t.life, 0);
    ctx.fillStyle = '#000'; ctx.fillText(t.txt, t.x + 2, t.y + 2);
    ctx.fillStyle = t.c; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, 0.033); last = now;
  if (S.mode === 'play') {
    if (S.stop > 0) { S.stop -= dt; }
    else update(dt);
  } else S.t += dt;
  draw();
}
requestAnimationFrame(frame);
window.__test = { S, startGame, spawnBalloon, get arrows() { return arrows; },
  get balloons() { return balloons; }, get parts() { return parts; },
  fire(x, y) { mouse.x = x; mouse.y = y; power = 1; mouse.down = false;
    const a = archer(), ang = aim(), sp = 520 + power * 980;
    arrows.push({ x: a.x, y: a.y - 46, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, trail: [], dead: false, stuck: 0 }); } };
</script>
</body>
</html>
