<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under the Wave off Kanagawa &mdash; low poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9dcbe}
  #cap{position:fixed;left:18px;bottom:14px;color:#123a6b;font-family:'Zen Old Mincho',serif;
       font-size:15px;letter-spacing:.06em;opacity:.85;pointer-events:none;
       text-shadow:0 1px 0 rgba(244,239,224,.6)}
  #cap small{display:block;font-size:11px;opacity:.7}
</style>
</head>
<body>
<div id="cap">神奈川沖浪裏 &mdash; Under the Wave off Kanagawa<small>after Hokusai &middot; low poly, built in code</small></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const P = { paper:0xe9dcbe, deep:0x123a6b, mid:0x1d4e89, light:0x2f6aa8,
            foam:0xf4efe0, hull:0xd8a06a, fuji:0x2c568c, grey:0x9a978f };

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(P.paper);
scene.fog = new THREE.Fog(P.paper, 42, 95);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 200);
camera.position.set(0, 7.5, 20.5);

scene.add(new THREE.HemisphereLight(0xf2e8cf, 0x1d4e89, 1.35));
const sun = new THREE.DirectionalLight(0xfff4dd, 1.4);
sun.position.set(-6, 12, 8);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xf4efe0, .8);
fill.position.set(2, 3, 12);
scene.add(fill);

// ---------- sky plane with paper/grey gradient ----------
{
  const g = new THREE.PlaneGeometry(150, 70, 2, 40);
  const c = []; const top = new THREE.Color(P.paper), gr = new THREE.Color(P.grey), low = new THREE.Color(0xc9bfa6);
  const pos = g.attributes.position;
  for (let i=0;i<pos.count;i++){
    const y = pos.getY(i); let col;
    if (y > 12) col = top;
    else if (y > 2) col = gr.clone().lerp(top, (y-2)/10);
    else col = low.clone().lerp(gr, Math.max(0,(y+12)/14));
    c.push(col.r,col.g,col.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c,3));
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, fog:false}));
  m.position.set(0, 12, -48); scene.add(m);
}

// ---------- Mount Fuji ----------
{
  const g = new THREE.ConeGeometry(2.7, 3.1, 6);
  g.translate(0, 1.55, 0);
  const pos = g.attributes.position, c = [];
  const bl = new THREE.Color(P.fuji), wh = new THREE.Color(P.foam);
  for (let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const th = Math.atan2(z,x), line = 1.55 + .28*Math.sin(th*3+1.3) + .12*Math.sin(th*7);
    const col = y > line ? wh : bl;
    c.push(col.r,col.g,col.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c,3));
  const fuji = new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true}));
  fuji.position.set(7.5, -0.4, -27); scene.add(fuji);
}

// ---------- clouds (flat paper blobs) ----------
const clouds = [];
for (let i=0;i<6;i++){
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(2+Math.random()*2.5,0),
    new THREE.MeshBasicMaterial({color:0xf4ecd6, fog:false}));
  m.scale.set(1.8,.28,.6);
  m.position.set(-24+i*9+Math.random()*4, 16+Math.random()*5, -34);
  clouds.push(m); scene.add(m);
}

// ---------- sea grid ----------
const seaGeo = new THREE.PlaneGeometry(76, 50, 110, 72);
seaGeo.rotateX(-Math.PI/2);
seaGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(seaGeo.attributes.position.count*3),3));
const sea = new THREE.Mesh(seaGeo, new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true}));
scene.add(sea);

function seaH(x,z,t){
  let h = .9*Math.sin(.35*x + .22*z + t*.5) + .6*Math.sin(.2*z - .16*x + t*.38 + 2);
  h += 1.5*Math.exp(-Math.pow(z-(.45*x+2.5),2)/7);            // diagonal foreground swell
  h += 1.3*Math.exp(-Math.pow(z-( -.35*x-9),2)/10);           // right swell behind boat B
  h -= 1.4*Math.exp(-((x-1)**2+(z+3)**2)/18);                 // trough at Fuji's foot
  h -= 2.2*Math.exp(-((x+9)**2+(z-1)**2)/30);                 // trough under the great wave
  return h;
}
const cDeep=new THREE.Color(P.deep), cMid=new THREE.Color(P.mid),
      cLight=new THREE.Color(P.light), cFoam=new THREE.Color(P.foam), tmp=new THREE.Color();
function updateSea(t){
  const pos = seaGeo.attributes.position, C = seaGeo.attributes.color;
  for (let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i), h=seaH(x,z,t);
    pos.setY(i,h);
    if (h>2.0) tmp.copy(cFoam);
    else if (h>1.1) tmp.copy(cLight).lerp(cFoam,(h-1.1)/.9);
    else if (h>-.2) tmp.copy(cMid).lerp(cLight,(h+.2)/1.35);
    else tmp.copy(cDeep).lerp(cMid,Math.max(0,(h+1.6)/1.4));
    const band = Math.sin(h*7.5) > .8 ? 1 : 0;                // woodblock stripe bands
    if (band && h<2.1 && h>.2) tmp.lerp(cFoam,.45);
    C.setXYZ(i,tmp.r,tmp.g,tmp.b);
  }
  pos.needsUpdate = true; C.needsUpdate = true;
  seaGeo.computeVertexNormals();
}

// ---------- the great wave (curling ribbon) ----------
const profile = [];
{
  const N1=14;
  for (let i=0;i<=N1;i++){ const s=i/N1;
    profile.push({x:-6.5+7.5*Math.pow(s,1.7), y:9.6*Math.pow(s,.72), foam:0}); }
  const cx=1.0, cy=7.0, N2=22;
  for (let i=1;i<=N2;i++){ const s=i/N2, a=Math.PI/2 - s*Math.PI*1.15, r=2.6-2.0*s;
    profile.push({x:cx+r*Math.cos(a), y:cy+r*Math.sin(a), foam:s>.1?1:0}); }
}
const frontProfile = [
  {x:3.1, y:7.0, foam:1}, {x:3.7, y:4.8, foam:0}, {x:4.2, y:2.6, foam:0},
  {x:4.6, y:0.6, foam:0}, {x:4.8, y:0, foam:0}
];
function buildRibbon(prof){
  const M=44, N=prof.length, pos=[], col=[], idx=[];
  for (let j=0;j<=M;j++){
    const z = -12 + 18*j/M;
    const e = Math.max(.08, Math.exp(-Math.pow((z+3)/5.5,2)));
    const dx = .22*z - 4;
    for (let i=0;i<N;i++){
      const p = prof[i];
      const x = dx + (p.x+6.5)*e - 6.5;
      pos.push(x, p.y*e, z);
      let c;
      if (p.foam) c = new THREE.Color(P.foam);
      else if (p.y>5.5) c = new THREE.Color(P.light);
      else if (p.y>2.5) c = new THREE.Color(P.mid);
      else c = new THREE.Color(P.deep);
      col.push(c.r,c.g,c.b);
    }
  }
  for (let j=0;j<M;j++) for (let i=0;i<N-1;i++){
    const a=j*N+i, b=a+1, c=a+N, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
const waveMat = new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true, side:THREE.DoubleSide});
const greatWave = new THREE.Group();
greatWave.add(new THREE.Mesh(buildRibbon(profile), waveMat));
greatWave.add(new THREE.Mesh(buildRibbon(frontProfile), waveMat));
scene.add(greatWave);

// ---------- foam claws on the curl + spray ----------
const claws = new THREE.InstancedMesh(new THREE.ConeGeometry(.3,1.2,4),
  new THREE.MeshLambertMaterial({color:P.foam, flatShading:true}), 90);
{
  const d = new THREE.Object3D(); let k=0;
  for (let j=0;j<10 && k<90;j++){
    const z = -10 + 2*j, e = Math.max(.15, Math.exp(-Math.pow((z+3)/5.5,2)));
    for (let i=19;i<profile.length && k<90;i+=2){
      const p = profile[i];
      d.position.set(.22*z - 4 + (p.x+6.5)*e - 6.5, p.y*e, z);
      const a = Math.atan2(p.y-7.0, p.x-1.0);
      d.rotation.set(0,0,a-Math.PI/2); d.rotateY(Math.random()*2);
      d.scale.setScalar(.8+Math.random()*1.0);
      d.updateMatrix(); claws.setMatrixAt(k++, d.matrix);
    }
  }
  claws.count = k; scene.add(claws);
}
const spray = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.07,0),
  new THREE.MeshBasicMaterial({color:P.foam}), 100);
const spraySeed = [];
{
  const d = new THREE.Object3D();
  for (let i=0;i<100;i++){
    spraySeed.push({x:-2+Math.random()*8, y:3+Math.random()*6, z:-8+Math.random()*8,
                    p:Math.random()*6.28});
    d.position.set(spraySeed[i].x, spraySeed[i].y, spraySeed[i].z);
    d.updateMatrix(); spray.setMatrixAt(i,d.matrix);
  }
  scene.add(spray);
}

// ---------- boats ----------
function makeBoat(withCabin){
  const g = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(-7.6,1.3); s.lineTo(-6.6,.45); s.lineTo(6.6,.45); s.lineTo(7.6,1.05);
  s.lineTo(6.6,0); s.lineTo(-6.6,0); s.closePath();
  const hull = new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:1.5,bevelEnabled:false}),
    new THREE.MeshLambertMaterial({color:P.hull, flatShading:true}));
  hull.position.z=-.75; g.add(hull);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(12.4,.12,1.25),
    new THREE.MeshLambertMaterial({color:0x8a5a33}));
  deck.position.y=.5; g.add(deck);
  if (withCabin){
    const cab = new THREE.Mesh(new THREE.BoxGeometry(3.4,1.1,1.3),
      new THREE.MeshLambertMaterial({color:0xb3835a, flatShading:true}));
    cab.position.set(-2.6,1.05,0); g.add(cab);
  }
  const body = new THREE.CylinderGeometry(.09,.12,.42,5);
  for (let r=0;r<2;r++) for (let i=0;i<7;i++){
    const o = new THREE.Group();
    o.add(new THREE.Mesh(body, new THREE.MeshLambertMaterial({color:0x14294a})));
    const head = new THREE.Mesh(new THREE.SphereGeometry(.11,5,4),
      new THREE.MeshLambertMaterial({color:0x14294a}));
    head.position.y=.32; o.add(head);
    o.position.set(-4.6+i*1.55, .75, r? .42 : -.42);
    g.add(o);
  }
  g.scale.setScalar(.55);
  return g;
}
const boats = [
  {m:makeBoat(true),  x:-7.5, z:2.5,  ry:.55, ph:0},
  {m:makeBoat(false), x:9.5,  z:-1.5, ry:-.5, ph:2.1},
  {m:makeBoat(false), x:0.5,  z:7.5,  ry:.18, ph:4.0},
];
boats.forEach(b=>scene.add(b.m));

// ---------- animation ----------
const clock = new THREE.Clock();
const dSpray = new THREE.Object3D();
function frame(){
  const t = clock.getElapsedTime();
  updateSea(t);
  greatWave.scale.y = 1 + .015*Math.sin(t*.7);
  greatWave.position.y = .12*Math.sin(t*.5);
  for (const b of boats){
    const h = seaH(b.x,b.z,t);
    const hx = (seaH(b.x+1.5,b.z,t)-seaH(b.x-1.5,b.z,t))/3;
    const hz = (seaH(b.x,b.z+1.5,t)-seaH(b.x,b.z-1.5,t))/3;
    b.m.position.set(b.x, h + .28 + .1*Math.sin(t*.8+b.ph), b.z);
    b.m.rotation.set(Math.atan(hz), b.ry, -Math.atan(hx));
  }
  for (let i=0;i<100;i++){
    const s = spraySeed[i];
    dSpray.position.set(s.x+.3*Math.sin(t*.6+s.p), s.y+.25*Math.sin(t*.9+s.p), s.z);
    dSpray.updateMatrix(); spray.setMatrixAt(i,dSpray.matrix);
  }
  spray.instanceMatrix.needsUpdate = true;
  clouds.forEach((c,i)=>{ c.position.x += .004*(1+i%3); if (c.position.x>30) c.position.x=-30; });
  camera.position.x = .6*Math.sin(t*.1);
  camera.position.y = 7.5 + .2*Math.sin(t*.13);
  camera.lookAt(-.5,4.5,-6);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
