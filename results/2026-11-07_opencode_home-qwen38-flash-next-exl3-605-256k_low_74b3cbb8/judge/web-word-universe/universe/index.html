<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo das Palavras — Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#e8e4da; --dim:#8f8a7d; --bg:#07070c; --panel:rgba(14,14,22,.82); --line:rgba(232,228,218,.14); }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:Inter,system-ui,sans-serif; }
  #scene { position:fixed; inset:0; cursor:grab; }
  #scene.dragging { cursor:grabbing; }
  header { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; gap:18px; align-items:baseline;
    padding:20px 26px; pointer-events:none; }
  header h1 { font-family:Fraunces,serif; font-weight:300; font-size:26px; letter-spacing:.02em; }
  header h1 em { font-style:normal; color:#d8b46a; }
  #stats { color:var(--dim); font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; }
  #search { position:fixed; top:20px; right:26px; z-index:6; }
  #search input { width:250px; padding:10px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:14px Inter; outline:none; backdrop-filter:blur(8px); }
  #search input:focus { border-color:#d8b46a88; }
  #suggest { position:fixed; top:58px; right:26px; z-index:7; width:250px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; overflow:hidden; backdrop-filter:blur(10px); display:none; }
  #suggest button { display:block; width:100%; text-align:left; padding:9px 14px; background:none; border:0;
    color:var(--ink); font:13.5px Inter; cursor:pointer; }
  #suggest button:hover, #suggest button.on { background:rgba(216,180,106,.14); }
  #panel { position:fixed; left:26px; bottom:26px; z-index:5; width:330px; max-height:52vh; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px;
    backdrop-filter:blur(12px); display:none; }
  #panel h2 { font-family:Fraunces,serif; font-weight:500; font-size:30px; margin-bottom:2px; }
  #panel .meta { font-size:12px; color:var(--dim); letter-spacing:.05em; text-transform:uppercase; margin-bottom:14px; }
  #panel .meta b { color:#d8b46a; font-weight:600; }
  #rel { display:flex; flex-wrap:wrap; gap:7px; }
  #rel button { padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.04);
    color:var(--ink); font:13px Inter; cursor:pointer; transition:border-color .15s; }
  #rel button:hover { border-color:#d8b46a; }
  #rel button i { font-style:normal; color:var(--dim); font-size:11px; margin-left:5px; }
  #legend { position:fixed; right:26px; bottom:26px; z-index:5; display:flex; flex-wrap:wrap; gap:6px 14px;
    max-width:300px; justify-content:flex-end; }
  #legend span { font-size:11px; color:var(--dim); letter-spacing:.04em; }
  #legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  #hint { position:fixed; bottom:26px; left:50%; transform:translateX(-50%); z-index:4; color:var(--dim);
    font-size:12px; letter-spacing:.05em; transition:opacity 1s; }
</style>
</head>

<div id="scene"></div>
<header><h1>Universo das <em>Palavras</em></h1><div id="stats"></div></header>
<div id="search"><input id="q" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false"></div>
<div id="suggest"></div>
<aside id="panel"><h2 id="pw"></h2><div class="meta" id="pm"></div><div id="rel"></div></aside>
<div id="legend"></div>
<div id="hint">arraste para girar · roda para aproximar · clique numa palavra</div>

const names = Object.keys(WORDS).sort();
const idx = new Map(names.map((n, i) => [n, i]));
const links = names.map(n => WORDS[n].map(m => idx.get(m)).filter(i => i !== undefined));
const deg = links.map(l => l.length);
const relCount = links.reduce((a, l) => a + l.length, 0) / 2;
document.getElementById('stats').textContent = `${names.length} palavras · ${relCount} relações`;
const THEME_LIST = [...new Set(names.map(n => THEMES[n] || 'outros'))].sort();
const PALETTE = ['#e0596a','#e8a04c','#e6d05a','#8fce6a','#5fc9a8','#5aa7d6','#7d7fe8','#b56ad6','#d66aa8','#bfb8a8'];
const tcolor = t => new THREE.Color(PALETTE[THEME_LIST.indexOf(t) % PALETTE.length]);
document.getElementById('legend').innerHTML =
  THEME_LIST.map(t => `<span><i style="background:${tcolor(t).getStyle()}"></i>${t}</span>`).join('');

/* force layout */
const N = names.length, P = new Float32Array(N * 3), V = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  const a = Math.acos(2 * Math.random() - 1), b = Math.random() * Math.PI * 2, r = 60 + 40 * Math.random();
  P[i*3] = r*Math.sin(a)*Math.cos(b); P[i*3+1] = r*Math.cos(a); P[i*3+2] = r*Math.sin(a)*Math.sin(b);
}
const K = 14;
for (let it = 0; it < 320; it++) {
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
    let dx = P[i*3]-P[j*3], dy = P[i*3+1]-P[j*3+1], dz = P[i*3+2]-P[j*3+2];
    let d2 = dx*dx+dy*dy+dz*dz + .01, f = K*K/d2*1.6/Math.sqrt(d2);
    V[i*3]+=dx*f; V[i*3+1]+=dy*f; V[i*3+2]+=dz*f;
    V[j*3]-=dx*f; V[j*3+1]-=dy*f; V[j*3+2]-=dz*f;
  }
  for (let i = 0; i < N; i++) for (const j of links[i]) {
    let dx = P[j*3]-P[i*3], dy = P[j*3+1]-P[i*3+1], dz = P[j*3+2]-P[i*3+2];
    let d = Math.sqrt(dx*dx+dy*dy+dz*dz) + .01, f = (d-K*1.9)/d*.028;
    V[i*3]+=dx*f; V[i*3+1]+=dy*f; V[i*3+2]+=dz*f;
  }
  const damp = .82 - it * .0008;
  for (let i = 0; i < N * 3; i++) { V[i] = V[i]*damp - P[i]*.004; P[i] += Math.max(-4, Math.min(4, V[i])); }
}

/* three scene */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07070c, .0022);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 4000);
const rend = new THREE.WebGLRenderer({ antialias:true, alpha:false });
rend.setPixelRatio(Math.min(devicePixelRatio, 2)); rend.setSize(innerWidth, innerHeight);
rend.setClearColor(0x07070c);
document.getElementById('scene').appendChild(rend.domElement);

const sphere = new THREE.SphereGeometry(1, 18, 14);
const nodes = new THREE.InstancedMesh(sphere,
  new THREE.MeshBasicMaterial({ color: 0xffffff }), N);
const base = new Float32Array(N * 3), cur = new Float32Array(N * 3), scl = new Float32Array(N);
const m4 = new THREE.Matrix4(), col = new THREE.Color();
for (let i = 0; i < N; i++) {
  base[i*3] = P[i*3]; base[i*3+1] = P[i*3+1]; base[i*3+2] = P[i*3+2];
  cur.set([base[i*3], base[i*3+1], base[i*3+2]], i*3);
  scl[i] = 1 + Math.sqrt(deg[i]) * .55;
  col.copy(tcolor(THEMES[names[i]] || 'outros'));
  nodes.setColorAt(i, col);
}
scene.add(nodes);

const eA = [], eB = [];
for (let i = 0; i < N; i++) for (const j of links[i]) if (j > i) { eA.push(i); eB.push(j); }
const eCount = eA.length;
const eGeo = new THREE.BufferGeometry();
eGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(eCount * 6), 3));
const eCol = new THREE.BufferAttribute(new Float32Array(eCount * 6), 3);
eGeo.setAttribute('color', eCol);
const edges = new THREE.LineSegments(eGeo,
  new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:.5 }));
scene.add(edges);

function labelSprite(text, big) {
  const c = document.createElement('canvas'), g = c.getContext('2d');
  const fs = big ? 64 : 44;
  g.font = `${big ? 500 : 400} ${fs}px Inter, sans-serif`;
  c.width = Math.ceil(g.measureText(text).width) + 24; c.height = fs + 20;
  g.font = `${big ? 500 : 400} ${fs}px Inter, sans-serif`;
  g.fillStyle = big ? '#f4e9cf' : '#cfcabc'; g.textBaseline = 'middle';
  g.fillText(text, 12, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  const s = big ? .052 : .04;
  sp.scale.set(c.width * s, c.height * s, 1);
  return sp;
}
const labels = names.map((n, i) => {
  const sp = labelSprite(n, deg[i] >= 10);
  scene.add(sp); return sp;
});

/* camera orbit */
let th = .6, ph = 1.15, dist = 320, tx = 0, ty = 0, tz = 0, camGoal = null;
function place() {
  cam.position.set(tx + dist*Math.sin(ph)*Math.cos(th), ty + dist*Math.cos(ph), tz + dist*Math.sin(ph)*Math.sin(th));
  cam.lookAt(tx, ty, tz);
}
let down = null, moved = 0;
const el = rend.domElement;
el.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; moved = 0;
  document.getElementById('scene').classList.add('dragging'); });
addEventListener('pointermove', e => {
  if (!down) return;
  th -= (e.clientX - down[0]) * .005; ph = Math.max(.05, Math.min(3.09, ph - (e.clientY - down[1]) * .005));
  moved += Math.abs(e.movementX) + Math.abs(e.movementY); down = [e.clientX, e.clientY];
});
addEventListener('pointerup', () => { down = null; document.getElementById('scene').classList.remove('dragging'); });
el.addEventListener('wheel', e => { dist = Math.max(30, Math.min(600, dist * (1 + e.deltaY * .001))); }, { passive:true });

const ray = new THREE.Raycaster();
el.addEventListener('click', e => {
  if (moved > 6) return;
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), cam);
  const hit = ray.intersectObject(nodes)[0];
  if (hit) select(names[hit.instanceId], true);
});

/* selection */
let sel = -1;
const panel = document.getElementById('panel');
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); }
const byNorm = new Map(names.map(n => [norm(n), n]));
function find(q) { q = norm(q); return byNorm.get(q) || names.find(n => norm(n).startsWith(q)); }
function select(word, push) {
  const i = idx.get(word); if (i === undefined) return;
  sel = i;
  const nb = WORDS[word];
  document.getElementById('pw').textContent = word;
  document.getElementById('pm').innerHTML =
    `<b>${nb.length}</b> conexões · tema <b>${THEMES[word] || '—'}</b>`;
  document.getElementById('rel').innerHTML = nb.map(w =>
    `<button data-w="${w}">${w}<i>${WORDS[w].length}</i></button>`).join('');
  panel.style.display = 'block';
  camGoal = [base[i*3], base[i*3+1], base[i*3+2], Math.max(60, 90 - deg[i] * 1.5)];
  const u = new URL(location.href); u.searchParams.set('word', word);
  history.replaceState(null, '', u);
  document.getElementById('hint').style.opacity = 0;
}
document.getElementById('rel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) select(b.dataset.w, true);
});

/* search */
const q = document.getElementById('q'), sg = document.getElementById('suggest');
let hi = -1, list = [];
q.addEventListener('input', () => {
  const v = norm(q.value); hi = -1;
  list = v ? names.filter(n => norm(n).includes(v)).slice(0, 8) : [];
  sg.style.display = list.length ? 'block' : 'none';
  sg.innerHTML = list.map((n, i) => `<button data-i="${i}">${n}</button>`).join('');
});
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') hi = Math.min(list.length - 1, hi + 1);
  else if (e.key === 'ArrowUp') hi = Math.max(0, hi - 1);
  else if (e.key === 'Enter') { const w = list[hi < 0 ? 0 : hi] || find(q.value); if (w) pick(w); return; }
  else if (e.key === 'Escape') { sg.style.display = 'none'; return; }
  else return;
  e.preventDefault();
  [...sg.children].forEach((b, i) => b.classList.toggle('on', i === hi));
});
sg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) pick(list[b.dataset.i]); });
function pick(w) { select(w, true); q.value = ''; sg.style.display = 'none'; q.blur(); }

/* render loop */
const WHITE = new THREE.Color(0xffffff), DIM = new THREE.Color(0x2a2a33), tmp = new THREE.Color();
function frame() {
  requestAnimationFrame(frame);
  if (camGoal) {
    const [x, y, z, d] = camGoal;
    tx += (x - tx) * .08; ty += (y - ty) * .08; tz += (z - tz) * .08; dist += (d - dist) * .06;
    if (Math.abs(x-tx) + Math.abs(y-ty) + Math.abs(z-tz) < .5) camGoal = null;
  }
  place();
  const t = performance.now() * .00012;
  for (let i = 0; i < N; i++) {
    const on = sel < 0 || i === sel || links[sel].includes(i);
    const s = scl[i] * (i === sel ? 1.5 : on ? 1 : .55) * (1 + Math.sin(t * 8 + i) * .04);
    m4.makeScale(s, s, s);
    m4.setPosition(base[i*3], base[i*3+1] + Math.sin(t * 6 + i * 1.7) * .8, base[i*3+2]);
    nodes.setMatrixAt(i, m4);
    cur[i*3] = m4.elements[12]; cur[i*3+1] = m4.elements[13]; cur[i*3+2] = m4.elements[14];
    if (sel < 0) tmp.copy(tcolor(THEMES[names[i]] || 'outros'));
    else if (i === sel) tmp.set('#ffe9b8');
    else if (links[sel].includes(i)) tmp.copy(tcolor(THEMES[names[i]] || 'outros')).lerp(WHITE, .35);
    else tmp.copy(DIM);
    nodes.setColorAt(i, tmp);
    const L = labels[i];
    L.position.set(cur[i*3], cur[i*3+1] + s + 2.4, cur[i*3+2]);
    L.material.opacity = sel < 0 ? (deg[i] >= 5 || i % 3 === 0 ? .95 : 0)
      : (i === sel || links[sel].includes(i) ? 1 : .07);
    L.visible = L.material.opacity > .05;
  }
  nodes.instanceMatrix.needsUpdate = true; nodes.instanceColor.needsUpdate = true;
  for (let e = 0; e < eCount; e++) {
    const a = eA[e], b = eB[e];
    eGeo.attributes.position.array.set([cur[a*3],cur[a*3+1],cur[a*3+2],cur[b*3],cur[b*3+1],cur[b*3+2]], e*6);
    const hot = sel >= 0 && (a === sel || b === sel);
    const c = sel < 0 ? .3 : hot ? .95 : .05;
    if (hot) tmp.copy(tcolor(THEMES[names[sel]] || 'outros')).lerp(WHITE, .4); else tmp.setRGB(c, c, c * 1.1);
    eCol.array.set([tmp.r,tmp.g,tmp.b,tmp.r,tmp.g,tmp.b], e*6);
  }
  eGeo.attributes.position.needsUpdate = true; eCol.needsUpdate = true;
  rend.render(scene, cam);
}
frame();
addEventListener('resize', () => { cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  rend.setSize(innerWidth, innerHeight); });

const start = new URLSearchParams(location.search).get('word');
if (start) { const w = find(start); if (w) { select(w, false); dist = 160; } }
