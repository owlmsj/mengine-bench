<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#e6b6ab">
  <title>Fuji, in bloom | A miniature landscape</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e5b7ad;color:#352f43}body{font-family:'DM Sans',sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#view{position:absolute;inset:0}header{position:absolute;top:39px;left:46px;right:46px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand{font-size:11px;font-weight:600;letter-spacing:.25em;display:flex;align-items:center;gap:13px}.brand:before{content:'';width:23px;height:23px;border:1px solid #574552;border-radius:50%;background:radial-gradient(circle,#574552 0 3px,transparent 4px)}.edition{font-size:10px;letter-spacing:.18em}.title{position:absolute;top:118px;left:46px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase}h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(52px,6.7vw,98px);font-weight:400;line-height:.95;letter-spacing:-.045em;margin:17px 0 17px}h1 i{font-weight:400}.subtitle{font-size:12px;line-height:1.8;letter-spacing:.025em;color:#695365}.vertical{position:absolute;right:47px;top:127px;writing-mode:vertical-rl;font-family:serif;font-size:22px;letter-spacing:.55em;pointer-events:none}.vertical span{font-family:sans-serif;font-size:9px;letter-spacing:.23em;margin-top:25px}footer{position:absolute;bottom:30px;left:46px;right:46px;display:flex;justify-content:space-between;align-items:end;gap:15px}.location{font-size:10px;letter-spacing:.17em;line-height:2}.location b{font-size:11px;font-weight:500}.controls{display:flex;gap:8px;align-items:center}.hint{font-size:9px;letter-spacing:.12em;margin-right:13px;opacity:.7}button{border:1px solid #745d6a55;background:#fff4e733;backdrop-filter:blur(12px);color:#493949;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:15px;transition:background .2s}button:hover{background:#fff4e7aa}button:focus-visible{outline:2px solid #493949;outline-offset:4px}.line{width:38px;height:1px;background:#695365;display:inline-block;vertical-align:middle;margin-right:12px}#status{position:absolute;bottom:90px;left:46px;font-size:12px;max-width:360px}#status:empty{display:none}.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 140px #64485818}
    @media(max-width:650px){header{top:25px;left:24px;right:24px}.edition{font-size:8px}.title{top:90px;left:24px}h1{font-size:60px}.subtitle{font-size:10px}.vertical{right:22px;top:104px;font-size:17px}footer{bottom:22px;left:24px;right:24px}.hint{display:none}.location{font-size:8px}.location b{font-size:9px}.controls{gap:6px}button{width:34px;height:34px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
  <div id="view" role="img" aria-label="Procedural low-poly scene of Mount Fuji, a red five-tier Chureito pagoda, and pink cherry blossoms at dusk"></div>
  <header><div class="brand">STILL / PLACES</div><div class="edition">JAPAN SERIES &nbsp; / &nbsp; 001</div></header>
  <div class="title"><div class="eyebrow">A moment in Yamanashi</div><h1>Fuji, <i>in bloom.</i></h1><div class="subtitle">Five stories beneath an endless sky.<br>A fleeting season, held still.</div></div>
  <div class="vertical">富士と桜<span>SPRING · ARAKURAYAMA</span></div>
  <div class="vignette"></div>
  <footer><div class="location"><b><span class="line"></span>CHUREITO PAGODA</b><br>35°30′ N &nbsp; 138°48′ E &nbsp; / &nbsp; YAMANASHI, JAPAN</div><div class="controls"><span class="hint">DRAG TO LOOK AROUND</span><button id="motion" aria-label="Pause animation" title="Pause animation">Ⅱ</button><button id="reset" aria-label="Reset view" title="Reset view">↺</button></div></footer>
  <div id="status" role="status"></div>
  <script type="module">
    import * as THREE from 'three';

    const status = document.getElementById('status');
    try {
      const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
      renderer.setPixelRatio(Math.min(devicePixelRatio,2));
      renderer.setSize(innerWidth,innerHeight);
      renderer.outputColorSpace=THREE.SRGBColorSpace;
      renderer.toneMapping=THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure=1.05;
      document.getElementById('view').appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background=new THREE.Color('#e9b9b1');
      scene.fog=new THREE.FogExp2('#dab5bc',.0045);
      const camera=new THREE.OrthographicCamera();
      const target=new THREE.Vector3(-2,10,-12);
      const baseCamera=new THREE.Vector3(18,24,65);
      const sunLight=new THREE.DirectionalLight('#ffe7c4',2.2);
      sunLight.position.set(-35,65,30);scene.add(sunLight);
      scene.add(new THREE.HemisphereLight('#f2d8e5','#71687e',1.6));
      const palette={red:'#b6443e',lightRed:'#df6350',darkRed:'#713734',roof:'#343d48',roofEdge:'#5d6470',plaster:'#f1d6b9',wood:'#674846',stone:'#b8aaa1'};
      const mats={};
      function material(color){return mats[color]??=new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true});}
      function mesh(geometry,color,parent=scene){const object=new THREE.Mesh(geometry,material(color));parent.add(object);return object;}
      function box(w,h,d,x,y,z,color,parent=scene){const object=mesh(new THREE.BoxGeometry(w,h,d),color,parent);object.position.set(x,y,z);return object;}
      let seed=84;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
      function between(a,b){return a+(b-a)*random();}
      function branch(start,end,r1,r2,color,parent){const direction=new THREE.Vector3().subVectors(end,start);const object=mesh(new THREE.CylinderGeometry(r2,r1,direction.length(),5),color,parent);object.position.copy(start).add(end).multiplyScalar(.5);object.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());return object;}

      // A vertex-colored sky dome keeps every visual asset procedural.
      const skyGeometry=new THREE.SphereGeometry(230,32,18);
      const skyColors=[];const skyPosition=skyGeometry.attributes.position;
      const horizon=new THREE.Color('#f6c9ac'),zenith=new THREE.Color('#8d91b6');
      for(let i=0;i<skyPosition.count;i++){const blend=Math.max(0,Math.min(1,(skyPosition.getY(i)+35)/135));const c=horizon.clone().lerp(zenith,blend);skyColors.push(c.r,c.g,c.b);}
      skyGeometry.setAttribute('color',new THREE.Float32BufferAttribute(skyColors,3));
      scene.add(new THREE.Mesh(skyGeometry,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false})));
      const sun= new THREE.Mesh(new THREE.CircleGeometry(5.4,64),new THREE.MeshBasicMaterial({color:'#ffdfb7',fog:false}));
      sun.position.set(-3,19,-85);sun.lookAt(baseCamera);scene.add(sun);

      function mountain(x,z,radius,height,color,snow=false){
        const count=44;const rings=[0,.16,.36,.56,.75,.92,1];const vertices=[],colors=[],indices=[];
        const shades=['#777e9d','#8589a6','#9293ae','#a4a0b6'].map(c=>new THREE.Color(c));
        const snowline=Array.from({length:count},()=>between(.56,.66));
        for(let j=0;j<rings.length;j++)for(let i=0;i<count;i++){
          const angle=i/count*Math.PI*2;const t=rings[j];const radial=radius*(.025+Math.pow(1-t,1.28)*.975)*(j===0?between(.94,1.1):1+.035*Math.sin(i*4.2));
          const level=(j===3&&snow)?snowline[i]:t;
          const rr=(j===3&&snow)?radius*(.025+Math.pow(1-level,1.28)*.975):radial;
          vertices.push(x+Math.cos(angle)*rr,height*level-2,z+Math.sin(angle)*rr*.68);
          const c=snow&&j>=3?new THREE.Color(i%3===0?'#e2deea':'#fff0e4'):snow?shades[i%4]:new THREE.Color(color);
          colors.push(c.r,c.g,c.b);
        }
        for(let j=0;j<rings.length-1;j++)for(let i=0;i<count;i++){const a=j*count+i,b=j*count+(i+1)%count;indices.push(a,a+count,b,b,a+count,b+count);}
        const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(indices);g.computeVertexNormals();
        const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:true}));scene.add(m);
      }
      mountain(-18,-54,37,27,'#9a91aa',true);
      for(let i=0;i<13;i++) mountain(-80+i*13,-66+between(-5,8),between(13,23),between(3,7),'#a7a1b4');
      for(let i=0;i<12;i++) mountain(-75+i*14,-42+between(-5,5),between(12,19),between(2,5),'#9196a4');
      box(400,1,300,0,-3,80,'#8b9b88');
      const lake=mesh(new THREE.PlaneGeometry(68,27),'#a7c0c4');lake.rotation.x=-Math.PI/2;lake.position.set(-17,-2.4,-32);
      for(let i=0;i<24;i++)box(between(1,6),.015,.09,between(-43,8),-2.36,between(-42,-22),'#d4d1cc');
      // The town recedes into the haze beneath the mountain.
      for(let i=0;i<260;i++){
        const x=between(-64,42),z=between(-24,0),h=between(.3,1.2);
        box(between(.45,1.3),h,between(.6,1.5),x,-2+h/2,z,['#c0b4b3','#c9beb1','#a3a4ad'][i%3]);
        box(1.2,.15,1.5,x,-2+h,z,['#7e8796','#89929b','#b0a4aa'][i%3]);
      }
      // Faceted green hillside and a broad stone viewing terrace.
      const hill=mesh(new THREE.IcosahedronGeometry(26,2),'#6c8177');hill.position.set(13,-16.6,15);hill.scale.set(1.8,.65,1.1);
      const hill2=mesh(new THREE.IcosahedronGeometry(18,1),'#788a77');hill2.position.set(-26,-14,15);hill2.scale.set(1.4,.7,1);
      box(18,1.8,16,14,0,8,palette.stone);
      box(18.5,.3,16.5,14,1,8,'#d3c2b2');
      for(let i=0;i<12;i++)box(6,.28,1.1,8,.88-i*.27,16.1+i*.8,'#cbbab0');
      for(let i=0;i<8;i++){box(.24,1.4,.24,5+i*2.5,1.8,15.7,'#807c78');}
      box(18,.18,.22,13.5,2.3,15.7,'#a3978e');

      const pagoda=new THREE.Group();pagoda.position.set(15,1.2,7);scene.add(pagoda);
      box(9,.6,9,0,.3,0,'#d7c6b3',pagoda);box(8,.35,8,0,.78,0,'#a89688',pagoda);
      function roof(width,y){
        const levels=[{r:width*.53,y:0},{r:width*.55,y:.18},{r:width*.39,y:.65},{r:width*.20,y:1.4}];
        const positions=[],idx=[];
        for(const level of levels){for(const [sx,sz]of[[-1,-1],[1,-1],[1,1],[-1,1]])positions.push(sx*level.r,y+level.y,sz*level.r);}
        for(let j=0;j<3;j++)for(let i=0;i<4;i++){const a=j*4+i,b=j*4+(i+1)%4;idx.push(a,b,a+4,b,b+4,a+4);}
        const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setIndex(idx);geo.computeVertexNormals();const roofMesh=mesh(geo,palette.roof,pagoda);roofMesh.material.side=THREE.DoubleSide;
        for(let i=0;i<4;i++){
          const a=i*Math.PI/2;const rim=box(width*1.1,.14,.18,0,y+.16,0,palette.roofEdge,pagoda);rim.position.x=Math.sin(a)*width*.55;rim.position.z=Math.cos(a)*width*.55;rim.rotation.y=a;
        }
        // Raised corner tips make the silhouette read as traditional temple eaves.
        for(const sx of[-1,1])for(const sz of[-1,1])branch(new THREE.Vector3(sx*width*.4,y+.15,sz*width*.4),new THREE.Vector3(sx*width*.58,y+.48,sz*width*.58),.11,.05,palette.roofEdge,pagoda);
      }
      for(let tier=0;tier<5;tier++){
        const y=1+tier*3.05,w=6.4-tier*.65;
        box(w,2.25,w,0,y+1.12,0,palette.red,pagoda);
        box(w+.25,.21,w+.25,0,y+.1,0,palette.darkRed,pagoda);
        for(const side of[-1,1]){
          box(w-.55,1.2,.06,0,y+1.3,side*(w/2+.03),palette.plaster,pagoda);
          box(.06,1.2,w-.55,side*(w/2+.03),y+1.3,0,palette.plaster,pagoda);
          for(let col=-2;col<=2;col++){
            box(.17,2.3,.19,col*w/5,y+1.15,side*(w/2+.12),palette.lightRed,pagoda);
            box(.19,2.3,.17,side*(w/2+.12),y+1.15,col*w/5,palette.lightRed,pagoda);
          }
          box(w+.2,.22,.16,0,y+1.95,side*(w/2+.13),palette.lightRed,pagoda);
          box(.16,.22,w+.2,side*(w/2+.13),y+1.95,0,palette.lightRed,pagoda);
          box(w+.85,.17,.16,0,y+.8,side*(w/2+.55),palette.red,pagoda);
          box(.16,.17,w+.85,side*(w/2+.55),y+.8,0,palette.red,pagoda);
          for(let rail=-4;rail<=4;rail++){
            box(.09,.6,.09,rail*w/9,y+.48,side*(w/2+.55),palette.red,pagoda);
            box(.09,.6,.09,side*(w/2+.55),y+.48,rail*w/9,palette.red,pagoda);
          }
        }
        box(w+1.3,.18,w+1.3,0,y+.15,0,palette.darkRed,pagoda);
        roof(w+2.2,y+2.25);
      }
      branch(new THREE.Vector3(0,16.4,0),new THREE.Vector3(0,21,0),.14,.06,'#665849',pagoda);
      for(let i=0;i<9;i++){const ring=mesh(new THREE.TorusGeometry(.45-i*.028,.055,5,12),'#796549',pagoda);ring.rotation.x=Math.PI/2;ring.position.y=17+i*.33;}
      const finial=mesh(new THREE.IcosahedronGeometry(.23,0),'#b69a69',pagoda);finial.position.y=20.8;

      const blossomColors=['#f1b7ca','#ffd1da','#e9a5c1','#f8c1d3','#d68eaf'];
      const blossomGeometry=new THREE.IcosahedronGeometry(1,1);
      function cherry(x,y,z,scale){
        const tree=new THREE.Group();tree.position.set(x,y,z);tree.scale.setScalar(scale);scene.add(tree);
        branch(new THREE.Vector3(),new THREE.Vector3(.2,5,0),.48,.22,'#654d58',tree);
        for(let i=0;i<8;i++){
          const angle=i*2.4;const end=new THREE.Vector3(Math.cos(angle)*between(2.2,4.4),between(5,8),Math.sin(angle)*between(2,4));
          branch(new THREE.Vector3(.1,between(2.7,4.5),0),end,.22,.065,'#725563',tree);
          for(let j=0;j<5;j++){
            const bloom=mesh(blossomGeometry,blossomColors[(i+j)%5],tree);bloom.position.copy(end).add(new THREE.Vector3(between(-1.4,1.4),between(-.4,1.2),between(-1.3,1.3)));bloom.scale.set(between(1.1,1.9),between(.8,1.35),between(1.1,1.7));bloom.rotation.set(random(),random(),random());
          }
        }
        return tree;
      }
      cherry(-22,-1,14,1.45);cherry(-14,-1,20,1.2);cherry(-29,-1,4,1.15);cherry(30,0,10,1.35);cherry(27,-1,22,1.1);
      for(let i=0;i<17;i++)cherry(-40+i*4.7,-2,between(-7,-3),between(.25,.45));
      // Little mossy rocks tie the terrace into the hillside.
      for(let i=0;i<45;i++){const rock=mesh(new THREE.IcosahedronGeometry(between(.4,1.4),0),['#708277','#8a927d','#ac9b92'][i%3]);rock.position.set(between(-30,35),between(-2.5,-.8),between(10,27));rock.scale.y=.6;}
      const petalGeometry=new THREE.CircleGeometry(.10,5);
      const petalMaterial=new THREE.MeshStandardMaterial({color:'#ffd0dc',roughness:1,side:THREE.DoubleSide});
      const petals=[];
      for(let i=0;i<85;i++){const petal=new THREE.Mesh(petalGeometry,petalMaterial);petal.position.set(between(-32,33),between(1,20),between(0,28));petal.rotation.set(random()*3,random()*3,random()*3);scene.add(petal);petals.push({object:petal,speed:between(.3,.8),phase:random()*6.28});}

      let yaw=0,pitch=0,desiredYaw=0,desiredPitch=0,dragging=false,lastX=0,lastY=0;
      let running=!matchMedia('(prefers-reduced-motion: reduce)').matches;
      const motion=document.getElementById('motion');
      function updateMotion(){motion.textContent=running?'Ⅱ':'▷';motion.setAttribute('aria-label',running?'Pause animation':'Resume animation');motion.title=running?'Pause animation':'Resume animation';}
      updateMotion();motion.addEventListener('click',()=>{running=!running;updateMotion();});
      document.getElementById('reset').addEventListener('click',()=>{desiredYaw=0;desiredPitch=0;});
      renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
      renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;desiredYaw=THREE.MathUtils.clamp(desiredYaw+(e.clientX-lastX)*.002,-.25,.25);desiredPitch=THREE.MathUtils.clamp(desiredPitch+(e.clientY-lastY)*.06,-5,5);lastX=e.clientX;lastY=e.clientY;});
      renderer.domElement.addEventListener('pointerup',()=>dragging=false);
      renderer.domElement.addEventListener('pointercancel',()=>dragging=false);
      function resize(){const aspect=innerWidth/innerHeight;const height=aspect<1?88:59;camera.left=-height*aspect/2;camera.right=height*aspect/2;camera.top=height/2;camera.bottom=-height/2;camera.near=.1;camera.far=500;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
      addEventListener('resize',resize);resize();
      const clock=new THREE.Clock();let time=0;
      function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(running)time+=dt;yaw+=(desiredYaw-yaw)*.06;pitch+=(desiredPitch-pitch)*.06;
        const offset=baseCamera.clone().sub(target).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.copy(target).add(offset);camera.position.y+=pitch;camera.lookAt(target);
        if(running)for(const {object,speed,phase}of petals){object.position.x+=dt*(.38+Math.sin(time*.3+phase)*.2);object.position.y-=dt*speed;object.position.z+=Math.sin(time+phase)*dt*.24;object.rotation.x+=dt*.5;object.rotation.z+=dt*.3;if(object.position.y<-.5){object.position.y=18;object.position.x=between(-30,30);}}
        renderer.render(scene,camera);
      }
      animate();
      window.__sceneReady={revision:THREE.REVISION,pagodaTiers:5,petalCount:petals.length,get animationTime(){return time;},get animationRunning(){return running;}};
    } catch(error) { status.textContent='This landscape needs WebGL. Please enable hardware acceleration and reload.';console.error(error); }
  </script>
</body>
</html>
