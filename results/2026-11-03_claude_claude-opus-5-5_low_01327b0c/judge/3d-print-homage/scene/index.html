<!doctype html><html><head><meta charset="utf-8"><title>Wave off Kanagawa - low poly</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9dcbc}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
const P={paper:0xe8d9b5,sky:0x8f8a80,deep:0x1d3a6b,mid:0x4f7fa8,pale:0xb9d3d9,foam:0xf3ecd9,boat:0xd9a77a,mount:0x3a4f6d};
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.appendChild?renderer.domElement:renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(P.paper);
const cam=new THREE.PerspectiveCamera(35,1,0.1,200);cam.position.set(0,0,40);
scene.add(new THREE.HemisphereLight(0xfff4dd,0x667788,1.6));const sun=new THREE.DirectionalLight(0xffffff,1.2);sun.position.set(5,10,10);scene.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true});
// dusky gray band at horizon behind Fuji
const band=new THREE.Mesh(new THREE.PlaneGeometry(40,5),new THREE.MeshBasicMaterial({color:P.sky,transparent:true,opacity:.55}));band.position.set(4,-3,-10);scene.add(band);
// clouds
for(const [x,y,s] of [[6,8,3],[9,7.5,2.5],[3,9,2]]){const c=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),new THREE.MeshBasicMaterial({color:0xf2ead6}));c.position.set(x,y,-12);c.scale.y=.45;scene.add(c);}
// Mount Fuji, small and centered low (as in the print)
const fuji=new THREE.Mesh(new THREE.ConeGeometry(3,2.2,7),M(P.mount));fuji.position.set(1.5,-4.4,-6);scene.add(fuji);
const cap=new THREE.Mesh(new THREE.ConeGeometry(1.4,1.05,7),M(P.foam));cap.position.set(1.5,-3.83,-5.9);scene.add(cap);
// Great wave: claw profile on the left
function waveShape(){const s=new THREE.Shape();s.moveTo(-16,-9);s.lineTo(-16,1);s.bezierCurveTo(-12,5,-7,9,-3,7.5);s.bezierCurveTo(0,6.5,1,4,-.5,2.5);s.bezierCurveTo(-2,3.6,-3.5,3,-3,1);s.bezierCurveTo(-2.5,-2,-1,-4,1,-6);s.lineTo(1,-9);return s;}
const wave=new THREE.Mesh(new THREE.ExtrudeGeometry(waveShape(),{depth:2,bevelEnabled:false,curveSegments:8}),M(P.deep));wave.position.z=-2;scene.add(wave);
// pale inner layer
const inner=new THREE.Mesh(new THREE.ExtrudeGeometry(waveShape(),{depth:.5,bevelEnabled:false,curveSegments:8}),M(P.mid));inner.scale.set(.82,.8,1);inner.position.set(-2.6,-1.8,.2);scene.add(inner);
// foam claws along crest
const foamG=new THREE.TetrahedronGeometry(.35,0),foamM=M(P.foam),foam=[];
const crest=new THREE.CubicBezierCurve3(new THREE.Vector3(-12,5,0),new THREE.Vector3(-7,9,0),new THREE.Vector3(1,7.5,0),new THREE.Vector3(-.5,2.5,0));
for(let i=0;i<70;i++){const p=crest.getPoint(i/69);const f=new THREE.Mesh(foamG,foamM);f.position.set(p.x+Math.random()*.8-.4,p.y+Math.random()*.8-.2,.3+Math.random());f.userData.b=f.position.clone();f.userData.ph=Math.random()*6;scene.add(f);foam.push(f);}
// spray dots
for(let i=0;i<60;i++){const d=new THREE.Mesh(new THREE.IcosahedronGeometry(.08,0),foamM);d.position.set(-1+Math.random()*4,-4+Math.random()*6,-1);scene.add(d);foam.push(Object.assign(d,{userData:{b:d.position.clone(),ph:Math.random()*6}}));}
// foreground small wave (bottom left, echoing Fuji) and right swells
function hump(x,y,w,h,c,z){const s=new THREE.Shape();s.moveTo(-w,0);s.quadraticCurveTo(-w*.3,h*1.1,0,h);s.quadraticCurveTo(w*.3,h*.6,w,0);const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:1,bevelEnabled:false}),M(c));m.position.set(x,y,z);scene.add(m);return m;}
const swells=[hump(-7,-9,7,4.5,P.deep,2),hump(-7,-8.6,4.5,3.5,P.foam,3.05),hump(9,-9,9,6,P.mid,-3),hump(13,-8,6,8,P.deep,-4),hump(4,-10,11,3,P.pale,1)];
// boats: 3 long oshiokuri-bune with rowers
function boat(x,y,z,rot,len){const g=new THREE.Group();const h=new THREE.Mesh(new THREE.BoxGeometry(len,.35,.8),M(P.boat));g.add(h);const bow=new THREE.Mesh(new THREE.ConeGeometry(.4,1.4,4),M(P.boat));bow.rotation.z=-Math.PI/2;bow.position.x=len/2+.6;g.add(bow);
for(let i=0;i<8;i++){const r=new THREE.Mesh(new THREE.IcosahedronGeometry(.22,0),M(P.mid));r.position.set(-len/2+.6+i*len/9,.3,0);g.add(r);}
g.position.set(x,y,z);g.rotation.z=rot;g.userData={y,rot};scene.add(g);return g;}
const boats=[boat(-11,-4.5,1.5,-.5,6),boat(6,-3.2,-2,.45,7),boat(2.5,-7.8,2.5,-.25,8)];
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.position.z=Math.max(40,40*1.5/(w/h));cam.updateProjectionMatrix();}addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime();
wave.rotation.z=Math.sin(t*.4)*.015;inner.rotation.z=wave.rotation.z;
foam.forEach(f=>{f.position.y=f.userData.b.y+Math.sin(t*1.2+f.userData.ph)*.12;f.rotation.x=t*.3+f.userData.ph;});
boats.forEach((b,i)=>{b.position.y=b.userData.y+Math.sin(t*.8+i*2)*.25;b.rotation.z=b.userData.rot+Math.sin(t*.6+i)*.05;});
swells.forEach((s,i)=>s.position.x+=Math.sin(t*.5+i)*.003);
cam.position.x=Math.sin(t*.1)*.6;cam.lookAt(0,0,0);renderer.render(scene,cam);});
</script></body></html>
