const c=document.getElementById('c'),x=c.getContext('2d');let sel=null,cam={x:0,y:0,k:1};
function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;
for(let it=0;it<400;it++)step(1-it/400);
function step(t){for(const a of N)for(const b of N){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy+1;let f=900/d;a.vx+=dx*f*t;a.vy+=dy*f*t}
for(const e of E){const a=N[e.a],b=N[e.b];let dx=b.x-a.x,dy=b.y-a.y;a.vx+=dx*.01;a.vy+=dy*.01;b.vx-=dx*.01;b.vy-=dy*.01}
for(const n of N){n.vx-=n.x*.002;n.vy-=n.y*.002;n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6}}
const P=n=>[(n.x-cam.x)*cam.k+c.width/2+150,(n.y-cam.y)*cam.k+c.height/2];
function draw(){x.clearRect(0,0,c.width,c.height);const nb=sel!=null?new Set(W[names[sel]].map(w=>idx[w])):null;
for(const e of E){const on=sel!=null&&(e.a==sel||e.b==sel);x.strokeStyle=on?(e.syn?'#ffd27a':'#7ac7ff'):(sel!=null?'#ffffff08':'#ffffff18');x.lineWidth=on?2:1;const[p,q]=[P(N[e.a]),P(N[e.b])];x.beginPath();x.moveTo(...p);x.lineTo(...q);x.stroke()}
N.forEach((n,i)=>{const[px,py]=P(n),hi=sel==i||(nb&&nb.has(i));const r=2+Math.sqrt(n.d)*1.3;x.fillStyle=sel==i?'#fff':hi?'#ffd27a':sel!=null?'#556':'#c9c3e8';x.beginPath();x.arc(px,py,r,0,7);x.fill();
if(hi||n.d>=10||cam.k>1.8){x.fillStyle=hi?'#fff':'#aab';x.font=(sel==i?18:12)+'px Fraunces';x.fillText(n.n,px+r+3,py+4)}})}
function pick(w){w=(w||'').trim().toLowerCase();if(!(w in idx)){info.innerHTML=w?'<p>“'+w+'” não está no dicionário.</p>':'';sel=null;draw();return}
sel=idx[w];const n=N[sel];cam.x=n.x;cam.y=n.y;cam.k=1.6;history.replaceState(null,'','?word='+encodeURIComponent(w));q.value=w;
info.innerHTML='<h1>'+w+'</h1><small>'+W[w].length+' ligações</small><p>'+W[w].map(v=>'<a class="'+(rel[w+'|'+v].includes('sinonimos')?'':'an')+'" data-w="'+v+'">'+v+'</a>').join(' ')+'</p>';draw()}
info.onclick=e=>{if(e.target.dataset.w)pick(e.target.dataset.w)};q.onchange=()=>pick(q.value);
c.onclick=e=>{let best=null,bd=200;N.forEach((n,i)=>{const[px,py]=P(n),d=(px-e.clientX)**2+(py-e.clientY)**2;if(d<bd){bd=d;best=i}});best!=null?pick(names[best]):(sel=null,cam.k=1,info.innerHTML='',draw())};
c.onwheel=e=>{cam.k*=e.deltaY<0?1.1:.9;draw()};let dr=null;c.onmousedown=e=>dr=[e.clientX,e.clientY];onmouseup=()=>dr=null;
c.onmousemove=e=>{if(!dr||!e.buttons)return;cam.x-=(e.clientX-dr[0])/cam.k;cam.y-=(e.clientY-dr[1])/cam.k;dr=[e.clientX,e.clientY];draw()};
const w0=new URLSearchParams(location.search).get('word');if(w0)pick(w0);else{cam.k=.9;draw()}
</script></body></html>
