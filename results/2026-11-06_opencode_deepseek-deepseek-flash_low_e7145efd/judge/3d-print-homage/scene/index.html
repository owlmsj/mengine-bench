<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Great Wave — low poly after Hokusai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #e9dcc0;
    --ink: #1d3a63;
    --ink-deep: #142a4d;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  body { font-family: "Cormorant Garamond", Georgia, serif; color: var(--ink); }
  #scene { position: fixed; inset: 0; display: block; }
  #grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    mix-blend-mode: multiply; opacity: .30;
    background-repeat: repeat; background-size: 320px 320px;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 4;
    background:
      radial-gradient(130% 100% at 46% 38%, rgba(255,250,232,0) 52%, rgba(126,101,61,.16) 100%),
      linear-gradient(180deg, rgba(255,248,230,.10), rgba(133,106,64,.07));
  }
  #cartouche {
    position: fixed; z-index: 6; top: clamp(18px, 4.2vh, 46px); left: clamp(18px, 3.4vw, 48px);
    display: flex; gap: 8px; align-items: flex-start;
    filter: drop-shadow(0 1px 0 rgba(255,248,226,.35));
  }
  #cartouche .box {
    writing-mode: vertical-rl; text-orientation: upright;
    font-family: "Shippori Mincho", "Yu Mincho", serif;
    font-weight: 700; color: #223a5c;
    font-size: clamp(12px, 1.35vw, 19px); line-height: 1.18; letter-spacing: .1em;
    border: 1.5px solid rgba(34,58,92,.85);
    padding: 10px 7px;
    background: rgba(238,226,197,.22);
  }
  #cartouche .side {
    writing-mode: vertical-rl;
    font-family: "Shippori Mincho", serif; font-weight: 500;
    font-size: clamp(8px, .72vw, 11px); letter-spacing: .18em; color: #2a4060;
    opacity: .85; padding-top: 6px;
  }
  #caption {
    position: fixed; z-index: 6; left: clamp(18px, 3.4vw, 48px); bottom: clamp(16px, 3.4vh, 40px);
    max-width: min(440px, 74vw);
    text-shadow: 0 1px 0 rgba(246,238,216,.6);
  }
  #caption .jp { font-family: "Shippori Mincho", serif; font-size: clamp(11px, 1vw, 14px); letter-spacing: .34em; color: #3a5374; margin-bottom: 4px; }
  #caption .en { font-size: clamp(17px, 1.75vw, 25px); font-weight: 600; letter-spacing: .02em; line-height: 1.05; color: #203a60; }
  #caption .sub { margin-top: 5px; font-style: italic; font-size: clamp(11px, 1.02vw, 15px); color: #55627a; letter-spacing: .02em; }
  @media (max-width: 640px) {
    #cartouche { top: 14px; left: 14px; }
    #caption { left: 14px; bottom: 14px; }
    #caption .en { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Low poly animated reinterpretation of Hokusai's Great Wave off Kanagawa"></canvas>
<div id="vignette"></div>
<div id="grain"></div>

<div id="cartouche" aria-hidden="true">
  <div class="box">冨嶽三十六景　神奈川沖浪裏</div>
  <div class="side">北斎改為一筆</div>
</div>

<div id="caption">
  <div class="jp">神奈川沖浪裏</div>
  <div class="en">The Great Wave off Kanagawa</div>
  <div class="sub">after Katsushika Hokusai, 1831 &nbsp;·&nbsp; low-poly study in motion</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- palette
const PAPER      = 0xe9dcbe;
const PAPER_HI   = 0xf3ead2;
const INK_DEEP   = 0x16376a;
const INK        = 0x1e4479;
const BLUE_MID   = 0x2f5f8e;
const BLUE_PALE  = 0x8fb3c2;
const FOAM       = 0xeee5cb;
const FOAM_BLUE  = 0xc6d8d6;
const BOAT_WOOD  = 0xcf9e68;
const BOAT_DARK  = 0x8a5a33;
const CREW       = 0xe3d7b9;
const CREW_DARK  = 0x2c3440;
const FUJI_ROCK  = 0x66788e;
const FUJI_SNOW  = 0xefe9d7;

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.Fog(PAPER, 86, 170);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(PAPER, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const camera = new THREE.OrthographicCamera(-21, 21, 13, -13, 0.1, 300);
camera.position.set(0, 0, 80);

// lights: soft, warm key from the upper left, like raking paper light
scene.add(new THREE.AmbientLight(0xfff8e8, 1.45));
const key = new THREE.DirectionalLight(0xfff3da, 1.15);
key.position.set(-18, 26, 40);
scene.add(key);
const fill = new THREE.DirectionalLight(0xb8c9dc, 0.35);
fill.position.set(24, -10, 20);
scene.add(fill);

// ---------------------------------------------------------------- helpers
const R = (a, b) => a + Math.random() * (b - a);
const mat = (color, opts = {}) => new THREE.MeshLambertMaterial({ color, flatShading: true, ...opts });

function blob(color, s, detail = 1, opts = {}) {
  return new THREE.Mesh(new THREE.IcosahedronGeometry(s, detail), mat(color, opts));
}

// grain for the paper overlay, generated locally (no external images)
(function paperGrain() {
  const c = document.createElement('canvas');
  c.width = c.height = 320;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, 320, 320);
  const img = g.getImageData(0, 0, 320, 320);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = 214 + Math.random() * 41;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = n;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // sparse fibres
  g.strokeStyle = 'rgba(150,125,86,.16)';
  for (let i = 0; i < 160; i++) {
    g.beginPath();
    const x = Math.random() * 320, y = Math.random() * 320;
    g.moveTo(x, y);
    g.lineTo(x + R(-14, 14), y + R(-4, 4));
    g.stroke();
  }
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

function paperSky() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0.00, '#f2e8cd');
  grd.addColorStop(0.42, '#ece0c2');
  grd.addColorStop(0.78, '#e4d3b0');
  grd.addColorStop(1.00, '#ddc9a4');
  g.fillStyle = grd;
  g.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(260, 150),
    new THREE.MeshBasicMaterial({ map: tex, depthWrite: false })
  );
  sky.position.set(0, 4, -60);
  return sky;
}
scene.add(paperSky());

// ---------------------------------------------------------------- clouds
const cloudGroup = new THREE.Group();
cloudGroup.position.z = -44;
scene.add(cloudGroup);
[
  [-7, 8.6, 13, 2.3, 0.5], [3, 9.4, 10, 1.9, 0.6], [11, 7.6, 12, 2.0, 0.5],
  [18, 9.0, 8, 1.5, 0.45], [-16, 10.2, 9, 1.4, 0.4]
].forEach(([x, y, sx, sy, op]) => {
  const m = blob(PAPER_HI, 1, 1, { transparent: true, opacity: op * 0.55 });
  m.position.set(x, y, 0);
  m.scale.set(sx, sy, 1.2);
  cloudGroup.add(m);
});

// ---------------------------------------------------------------- Mount Fuji
function mountFuji() {
  const g = new THREE.Group();
  const h = 5.6, rad = 2.65;
  g.userData.mountain = 'Fuji';
  const body = new THREE.Mesh(new THREE.ConeGeometry(rad, h, 9, 1), mat(FUJI_ROCK));
  body.position.y = h / 2;
  g.add(body);

  // snow cap, slightly proud of the cone so it reads as a separate print block
  const capH = 2.15;
  const cap = new THREE.Mesh(new THREE.ConeGeometry(rad * (capH / h) + 0.055, capH, 9, 1), mat(FUJI_SNOW));
  cap.position.y = h - capH / 2 + 0.015;
  g.add(cap);

  // a couple of snow fingers reaching down the gullies
  for (let i = 0; i < 3; i++) {
    const a = -0.7 + i * 0.7;
    const streak = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.9, 4, 1), mat(FUJI_SNOW));
    streak.position.set(Math.sin(a) * rad * 0.42, h - 1.9, Math.cos(a) * rad * 0.42);
    streak.rotation.z = Math.sin(a) * 0.2;
    streak.rotation.x = Math.cos(a) * 0.2;
    streak.scale.set(1, 1, 0.5);
    g.add(streak);
  }
  g.position.set(9.8, -6.3, -24);
  g.rotation.y = -0.18;
  g.scale.setScalar(0.9);
  return g;
}
const fuji = mountFuji();
scene.add(fuji);

// grey sea haze at Fuji's foot, like the print's bokashi gradient
const haze = new THREE.Mesh(
  new THREE.CircleGeometry(1, 40),
  new THREE.MeshBasicMaterial({ color: 0x9c9481, transparent: true, opacity: 0.42, depthWrite: false })
);
haze.scale.set(8, 1.5, 1);
haze.position.set(9.8, -7.0, -27);
scene.add(haze);

// ---------------------------------------------------------------- wave
// The silhouette is the print: a cliff of water rising on the left, curling
// over to the right into a claw, with a trough where Fuji sits.
function waveShape() {
  const s = new THREE.Shape();
  s.moveTo(-24.8, -7.6);
  s.lineTo(-24.5, -2.4);
  s.bezierCurveTo(-21.8, 1.4, -18.4, 5.2, -14.8, 7.4);
  s.bezierCurveTo(-12.2, 9.0, -9.2, 9.8, -6.2, 9.3);
  s.bezierCurveTo(-3.4, 8.8, -0.8, 7.3, 1.2, 5.7);
  s.bezierCurveTo(2.9, 4.3, 4.3, 3.0, 5.5, 2.0);
  s.bezierCurveTo(6.1, 1.4, 6.0, 0.4, 5.2, 0.3);
  s.bezierCurveTo(4.4, 0.2, 3.9, 1.0, 4.3, 1.8);   // claw toe curling under
  s.bezierCurveTo(3.3, 2.4, 2.3, 2.2, 1.7, 1.4);
  s.bezierCurveTo(2.6, -0.7, 4.2, -2.7, 6.4, -4.3);
  s.bezierCurveTo(7.0, -5.2, 8.0, -6.5, 8.8, -7.6);
  s.closePath();
  return s;
}
const waveGeo = new THREE.ExtrudeGeometry(waveShape(), {
  depth: 4.6, steps: 1, bevelEnabled: true, bevelThickness: 0.42, bevelSize: 0.4, bevelSegments: 1, curveSegments: 14
});
waveGeo.translate(0, 0, -2.3);
waveGeo.computeVertexNormals();

const wave = new THREE.Group();
const waveBody = new THREE.Mesh(waveGeo, mat(INK, { side: THREE.DoubleSide }));
wave.add(waveBody);

// the pale apron of foam and smooth water on the wave's lower face
function apronShape() {
  const s = new THREE.Shape();
  s.moveTo(-24.6, -7.4);
  s.lineTo(-24.3, -1.6);
  s.bezierCurveTo(-21.4, -0.5, -18.2, 0.4, -15.0, 0.9);
  s.bezierCurveTo(-11.8, 1.4, -8.8, 1.5, -6.0, 1.9);
  s.bezierCurveTo(-3.4, 2.3, -1.4, 2.7, 0.6, 2.4);
  s.bezierCurveTo(2.0, 2.2, 3.0, 1.2, 3.8, -0.4);
  s.bezierCurveTo(4.8, -2.4, 6.0, -4.6, 7.6, -6.4);
  s.lineTo(8.6, -7.4);
  s.closePath();
  return s;
}
const apron = new THREE.Mesh(new THREE.ShapeGeometry(apronShape(), 18), new THREE.MeshBasicMaterial({ color: 0xe9e5d2, side: THREE.DoubleSide }));
apron.position.z = 2.88;
wave.add(apron);

// pale blue shadows and indigo accents painted on the apron
const paint = new THREE.Group();
[
  { p: [[-23.4, -6.4], [-22.8, -4.0], [-22.2, -2.2]], r: 0.16, c: 0x33628e },
  { p: [[-21.0, -6.9], [-20.1, -4.6], [-19.4, -2.6], [-18.9, -1.1]], r: 0.15, c: 0x33628e },
  { p: [[-18.6, -7.0], [-17.4, -4.8], [-16.5, -2.8], [-15.9, -1.0]], r: 0.17, c: 0x33628e },
  { p: [[-16.0, -7.0], [-14.9, -4.9], [-14.0, -2.8], [-13.4, -0.9]], r: 0.13, c: 0x33628e },
  { p: [[-13.4, -6.8], [-12.3, -4.8], [-11.5, -2.7], [-11.0, -0.6]], r: 0.16, c: 0x33628e },
  { p: [[-10.8, -6.4], [-9.7, -4.3], [-9.0, -2.2], [-8.5, 0.0]], r: 0.12, c: 0x33628e },
  { p: [[-8.1, -6.0], [-7.1, -3.8], [-6.5, -1.6], [-6.1, 0.5]], r: 0.15, c: 0x33628e },
  { p: [[-5.4, -5.3], [-4.6, -3.1], [-4.0, -0.8], [-3.6, 1.0]], r: 0.11, c: 0x33628e },
  { p: [[-20.0, -5.2], [-19.0, -3.4], [-18.2, -1.8]], r: 0.09, c: 0xbcd2d5 },
  { p: [[-15.2, -5.4], [-14.2, -3.6], [-13.4, -1.9]], r: 0.08, c: 0xbcd2d5 },
  { p: [[-10.4, -4.8], [-9.5, -3.1], [-8.7, -1.4]], r: 0.075, c: 0xbcd2d5 },
  { p: [[-6.0, -4.0], [-5.2, -2.4], [-4.5, -0.6]], r: 0.07, c: 0xbcd2d5 }
].forEach(({ p, r, c }) => {
  const curve = new THREE.CatmullRomCurve3(p.map(q => new THREE.Vector3(q[0], q[1], 2.98)));
  paint.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 10, r * 0.55, 4, false), new THREE.MeshBasicMaterial({ color: c })));
});

// a second pale slope below the claw, like the face that catches the light
const innerSlope = new THREE.Mesh(
  (() => {
    const s = new THREE.Shape();
    s.moveTo(1.0, 1.8);
    s.bezierCurveTo(3.0, -0.6, 5.0, -2.8, 7.6, -4.8);
    s.bezierCurveTo(9.0, -5.9, 10.4, -6.8, 11.6, -7.4);
    s.lineTo(12.2, -7.4);
    s.bezierCurveTo(9.0, -5.4, 6.4, -2.6, 4.6, 0.2);
    s.closePath();
    return new THREE.ShapeGeometry(s, 14);
  })(),
  new THREE.MeshBasicMaterial({ color: 0xd5dbcd, side: THREE.DoubleSide })
);
innerSlope.position.z = 2.94;
wave.add(innerSlope);

wave.add(paint);

// ---------------------------------------------------------------- foam
// cream foam pebbles hugging the crest, like Hokusai's frozen spray
const crestPts = [
  [-23.6, -2.2], [-21.6, 1.4], [-19.2, 4.4], [-16.6, 6.9], [-13.6, 8.6],
  [-10.6, 9.4], [-7.6, 9.5], [-4.8, 8.9], [-2.2, 7.7], [0.2, 6.2],
  [2.4, 4.7], [4.3, 3.1], [5.7, 1.7]
];
const crestCurve = new THREE.CatmullRomCurve3(crestPts.map(p => new THREE.Vector3(p[0], p[1], 2.5)));
const foamGroup = new THREE.Group();
wave.add(foamGroup);

// continuous foam rim under the pebbles, so the crest reads as one white edge
const rim = new THREE.Mesh(new THREE.TubeGeometry(crestCurve, 90, 0.34, 4, false), mat(FOAM));
rim.position.z = 0.25;
wave.add(rim);

const foamPebbles = [];
{
  const N = 128;
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const mesh = new THREE.InstancedMesh(geo, mat(FOAM), N);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const p = crestCurve.getPoint(t);
    const off = (t > 0.06 && t < 0.94) ? 1 : 0;
    dummy.position.set(
      p.x + R(-0.55, 0.55) * off + (1 - off) * R(-0.5, 0.5),
      p.y + R(-0.5, 0.45) + 0.2,
      p.z + R(0.6, 1.7)
    );
    const s = R(0.16, 0.44);
    dummy.scale.set(s * R(0.9, 1.6), s, s * R(0.7, 1.2));
    dummy.rotation.set(R(0, 3), R(0, 3), R(0, 3));
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    foamPebbles.push({ base: dummy.position.clone(), scale: dummy.scale.clone(), phase: R(0, 6.28), amp: R(0.03, 0.12) });
  }
  mesh.instanceMatrix.needsUpdate = true;
  foamGroup.add(mesh);
  foamGroup.userData.mesh = mesh;
}

// spray: dots around the claw and above the crest
const spray = [];
{
  const N = 150;
  const geo = new THREE.IcosahedronGeometry(1, 0);
  const mesh = new THREE.InstancedMesh(geo, mat(FOAM, { transparent: true, opacity: 0.96 }), N);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (i < 92) {
      const a = R(0, Math.PI * 2), r = Math.pow(Math.random(), 0.6);
      x = 5.4 + Math.cos(a) * r * 4.2;
      y = 2.4 + Math.sin(a) * r * 2.8;
    } else {
      x = R(-12, 2); y = R(9.0, 11.8);
    }
    z = R(3.0, 6.4);
    dummy.position.set(x, y, z);
    const s = R(0.055, 0.2);
    dummy.scale.setScalar(s);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    spray.push({ base: new THREE.Vector3(x, y, z), phase: R(0, 6.28), speed: R(0.4, 1.2), amp: R(0.04, 0.2), s });
  }
  mesh.instanceMatrix.needsUpdate = true;
  wave.add(mesh);
  wave.userData.spray = mesh;
}

// the claw's long foam fingers, drooping over the trough
const fingers = new THREE.Group();
[
  [1.9, 1.2, 1.5, 0.1], [2.8, 0.9, 1.8, 0.05], [3.7, 0.7, 1.5, -0.1],
  [4.6, 0.5, 1.2, -0.2], [5.4, 0.6, 0.9, -0.3], [0.9, 1.7, 1.1, 0.2],
  [1.4, 2.3, 0.9, 0.35], [3.2, 1.5, 1.0, 0.0], [4.9, 1.2, 0.8, -0.15]
].forEach(([x, y, len, tilt]) => {
  const f = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.22, len, 5, 1), mat(FOAM));
  cone.position.y = -len / 2;
  cone.rotation.z = Math.PI;
  f.add(cone);
  const drop = blob(FOAM, 0.22, 0);
  drop.position.set(0, -len, 0.05);
  drop.scale.set(1, 1.25, 0.9);
  f.add(drop);
  f.position.set(x, y, 3.15);
  f.rotation.z = tilt;
  f.userData.base = { x, y, rz: tilt };
  fingers.add(f);
});
wave.add(fingers);

// foam boiling around the claw tip
const clawFoam = new THREE.Group();
for (let i = 0; i < 26; i++) {
  const a = R(-0.4, 3.1), rr = Math.pow(Math.random(), 0.6) * 1.1;
  const f = blob(FOAM, R(0.16, 0.42), 0);
  f.position.set(6.1 + Math.cos(a) * rr * 0.7, 0.1 + Math.sin(a) * rr * 0.5, R(3.2, 4.4));
  f.scale.set(R(1, 1.7), R(0.7, 1.2), R(0.8, 1.2));
  clawFoam.add(f);
}
wave.add(clawFoam);

// foam licking up the base of the wave
const baseFoam = new THREE.Group();
for (let i = 0; i < 52; i++) {
  const b = blob(FOAM, R(0.25, 0.85), 0);
  const t = Math.pow(Math.random(), 0.8);
  b.position.set(-24 + t * 22 + R(-0.8, 0.8), R(-7.2, -3.0) + t * 3.4, R(3.4, 6.4));
  b.scale.set(R(1, 2.1), R(0.6, 1.05), R(0.7, 1.3));
  b.rotation.set(R(0, 3), R(0, 3), R(0, 3));
  b.userData.phase = R(0, 6.28);
  b.userData.baseY = b.position.y;
  baseFoam.add(b);
}
wave.add(baseFoam);

wave.position.set(0, 0, 0);
scene.add(wave);

// ---------------------------------------------------------------- low poly boats
function createBoat(L) {
  const boat = new THREE.Group();
  const half = L / 2;

  const hullGeo = new THREE.BoxGeometry(L, 0.62, 1.42, 10, 1, 3);
  const pos = hullGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const u = Math.abs(x / half);
    // pointed, upswept bow and stern
    pos.setZ(i, z * (1.06 - 0.88 * Math.pow(u, 1.7)));
    pos.setY(i, y + 0.34 * Math.pow(u, 2.4) * (y > 0 ? 1.4 : 0.7));
  }
  hullGeo.computeVertexNormals();
  const hull = new THREE.Mesh(hullGeo, mat(BOAT_WOOD, { side: THREE.DoubleSide }));
  boat.add(hull);

  // dark gunwale + deck
  const rimGeo = new THREE.BoxGeometry(L * 0.97, 0.10, 1.28, 10, 1, 2);
  const rp = rimGeo.attributes.position;
  for (let i = 0; i < rp.count; i++) {
    const x = rp.getX(i), y = rp.getY(i), z = rp.getZ(i);
    const u = Math.abs(x / half);
    rp.setZ(i, z * (1.05 - 0.86 * Math.pow(u, 1.7)));
    rp.setY(i, y + 0.34 * Math.pow(u, 2.4));
  }
  rimGeo.computeVertexNormals();
  const rim = new THREE.Mesh(rimGeo, mat(BOAT_DARK));
  rim.position.y = 0.34;
  boat.add(rim);

  const deck = new THREE.Mesh(new THREE.BoxGeometry(L * 0.9, 0.06, 1.0), mat(0xb98450));
  deck.position.y = 0.4;
  boat.add(deck);

  // cross planks
  for (let i = -2; i <= 2; i++) {
    const plank = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 1.0), mat(BOAT_DARK));
    plank.position.set(i * L * 0.135, 0.44, 0);
    boat.add(plank);
  }

  // crew: cramped rows of rowers, pale robes and dark heads
  const crew = new THREE.Group();
  const n = Math.max(5, Math.round(L * 0.85));
  for (let i = 0; i < n; i++) {
    const u = (i / (n - 1) - 0.5) * 0.78;
    const x = u * L;
    const z = i % 2 === 0 ? -0.27 : 0.27;
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.25, 2, 5), mat(CREW));
    body.position.set(x, 0.6, z);
    body.rotation.z = R(-0.32, -0.05);
    body.rotation.x = R(-0.15, 0.15);
    crew.add(body);
    const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.105, 0), mat(CREW_DARK));
    head.position.set(x - 0.02, 0.85, z);
    crew.add(head);
  }
  boat.add(crew);

  // oars sweeping outboard
  [-0.3, 0.3].forEach((z, k) => {
    const oar = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, L * 1.15, 4), mat(0x5d4327));
    oar.position.set(-L * 0.08, 0.62, z * 1.9);
    oar.rotation.z = Math.PI / 2 - 0.22;
    oar.rotation.y = k ? 0.14 : -0.14;
    boat.add(oar);
  });

  boat.scale.setScalar(0.96);
  return boat;
}

const boats = [];
[
  { L: 8.4, pos: [-12.9, -2.9, 8.8], rz: -0.30, ry: 0.26 },
  { L: 8.2, pos: [3.2, -6.0, 9.6], rz: 0.19, ry: -0.16 },
  { L: 9.4, pos: [14.6, -8.2, 11.4], rz: 0.14, ry: -0.30 }
].forEach(cfg => {
  const b = createBoat(cfg.L);
  b.position.set(...cfg.pos);
  b.rotation.z = cfg.rz;
  b.rotation.y = cfg.ry;
  b.userData.baseY = cfg.pos[1];
  b.userData.baseRZ = cfg.rz;
  b.userData.phase = R(0, 6.28);
  scene.add(b);
  boats.push(b);
});

// ---------------------------------------------------------------- sea in front
function wavyBand(yBase, amp, color, z, opacity = 1) {
  const s = new THREE.Shape();
  const x0 = -30, x1 = 30;
  s.moveTo(x0, yBase - 7);
  s.lineTo(x0, yBase);
  const steps = 30;
  for (let i = 1; i <= steps; i++) {
    const x = x0 + (x1 - x0) * (i / steps);
    const y = yBase + Math.sin(i * 0.8 + yBase) * amp + Math.sin(i * 0.23) * amp * 0.7;
    s.lineTo(x, y);
  }
  s.lineTo(x1, yBase - 7);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.4, bevelEnabled: false });
  const m = new THREE.Mesh(geo, mat(color, { transparent: opacity < 1, opacity }));
  m.position.z = z;
  return m;
}

// cream sea bed under the waterline, so the wave sits in water not paper
const seaBed = new THREE.Mesh(new THREE.PlaneGeometry(80, 12), new THREE.MeshBasicMaterial({ color: 0xeee7d1 }));
seaBed.position.set(0, -14.2, -4);
scene.add(seaBed);

const sea = new THREE.Group();
sea.add(wavyBand(-8.3, 0.55, 0xdfe4d5, 2.0));
sea.add(wavyBand(-9.7, 0.95, BLUE_PALE, 5.0));
sea.add(wavyBand(-11.1, 1.05, BLUE_MID, 7.5));
sea.add(wavyBand(-12.7, 0.95, INK, 14.5));
sea.add(wavyBand(-14.2, 0.8, INK_DEEP, 17.5));
scene.add(sea);

// foam lip on the front ribbons
const lipGroup = new THREE.Group();
[-8.3, -9.7, -11.1, -12.7].forEach((yb, bi) => {
  for (let i = 0; i < 46; i++) {
    const x = -26 + i * 1.16 + R(-0.35, 0.35);
    const f = blob(bi === 1 ? FOAM_BLUE : FOAM, R(0.15, 0.42), 0);
    f.position.set(x, yb + Math.sin(i * 0.8 + yb) * 1.0 + R(-0.15, 0.3) + 0.1, 3.0 + bi * 3.6);
    f.scale.set(R(1.2, 2.4), R(0.5, 1), R(0.8, 1.4));
    lipGroup.add(f);
  }
});
scene.add(lipGroup);

// the big swell on the right edge
function rightSwell() {
  const s = new THREE.Shape();
  s.moveTo(28, -16);
  s.lineTo(28, -1.2);
  s.bezierCurveTo(25.2, -2.0, 22.6, -3.6, 21.0, -6.0);
  s.bezierCurveTo(19.6, -8.2, 19.2, -10.4, 20.0, -12.0);
  s.bezierCurveTo(18.4, -12.6, 16.6, -13.4, 15.0, -14.4);
  s.lineTo(15.4, -16);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 2.6, bevelEnabled: true, bevelThickness: 0.25, bevelSize: 0.25, bevelSegments: 1, curveSegments: 10 });
  const m = new THREE.Mesh(geo, mat(BLUE_MID));
  m.position.set(0, 0, 5.0);
  return m;
}
const swell = rightSwell();
scene.add(swell);

const swellFoam = new THREE.Group();
for (let i = 0; i < 34; i++) {
  const t = i / 33;
  const x = 15.6 + t * 7.2;
  const y = -14.2 + t * 10.6;
  const f = blob(FOAM, R(0.14, 0.4), 0);
  f.position.set(x + R(-0.3, 0.3), y + R(-0.25, 0.4), 7.9);
  f.scale.set(R(1, 2), R(0.5, 1), R(0.7, 1.2));
  swellFoam.add(f);
}
scene.add(swellFoam);

// ---------------------------------------------------------------- animation
const clock = new THREE.Clock();
const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
window.addEventListener('pointermove', e => {
  pointer.tx = (e.clientX / window.innerWidth - 0.5) * 2;
  pointer.ty = (e.clientY / window.innerHeight - 0.5) * 2;
});

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const aspect = w / h;
  let viewW = 42, viewH = viewW / aspect;
  if (viewH < 26.5) { viewH = 26.5; viewW = viewH * aspect; }
  camera.left = -viewW / 2;
  camera.right = viewW / 2;
  camera.top = viewH / 2;
  camera.bottom = -viewH / 2;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', resize);
resize();

const dummy = new THREE.Object3D();
const foamMesh = foamGroup.userData.mesh;
const sprayMesh = wave.userData.spray;

function animate() {
  const t = clock.getElapsedTime();

  // breathing of the whole wave
  wave.position.y = Math.sin(t * 0.55) * 0.13;
  wave.rotation.z = Math.sin(t * 0.4) * 0.006;
  wave.scale.setScalar(1 + Math.sin(t * 0.35) * 0.0035);

  // the claw fingers flex a little
  fingers.children.forEach((f, i) => {
    f.rotation.z = f.userData.base.rz + Math.sin(t * 0.9 + i * 0.7) * 0.06;
  });

  // foam pebbles drift
  for (let i = 0; i < foamPebbles.length; i++) {
    const p = foamPebbles[i];
    dummy.position.set(p.base.x, p.base.y + Math.sin(t * 0.9 + p.phase) * p.amp, p.base.z);
    dummy.scale.copy(p.scale);
    dummy.rotation.set(0, 0, Math.sin(t * 0.5 + p.phase) * 0.2);
    dummy.updateMatrix();
    foamMesh.setMatrixAt(i, dummy.matrix);
  }
  foamMesh.instanceMatrix.needsUpdate = true;

  // spray floats up and resets (gentle, never busy)
  for (let i = 0; i < spray.length; i++) {
    const p = spray[i];
    const rise = (t * p.speed + p.phase) % 2.6;
    dummy.position.set(
      p.base.x + Math.sin(t * 0.5 + p.phase) * p.amp * 2,
      p.base.y + rise * 0.35,
      p.base.z
    );
    dummy.scale.setScalar(p.s * (1 - rise / 4.5));
    dummy.updateMatrix();
    sprayMesh.setMatrixAt(i, dummy.matrix);
  }
  sprayMesh.instanceMatrix.needsUpdate = true;

  // boats ride the swell
  boats.forEach((b, i) => {
    const ph = b.userData.phase;
    b.position.y = b.userData.baseY + Math.sin(t * 0.8 + ph) * 0.14;
    b.rotation.z = b.userData.baseRZ + Math.sin(t * 0.65 + ph) * 0.022;
    b.rotation.x = Math.sin(t * 0.5 + ph + 1) * 0.015;
  });

  // base foam bobs
  baseFoam.children.forEach(f => {
    f.position.y = f.userData.baseY + Math.sin(t * 0.8 + f.userData.phase) * 0.07;
  });

  // clouds slide very slowly
  cloudGroup.position.x = Math.sin(t * 0.055) * 1.4;

  // sea ribbon breathing
  sea.position.y = Math.sin(t * 0.5 + 1.2) * 0.07;

  // parallax
  pointer.x += (pointer.tx - pointer.x) * 0.035;
  pointer.y += (pointer.ty - pointer.y) * 0.035;
  camera.position.x = pointer.x * 0.9;
  camera.position.y = -pointer.y * 0.45;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
window.__sceneReady = true;
</script>
