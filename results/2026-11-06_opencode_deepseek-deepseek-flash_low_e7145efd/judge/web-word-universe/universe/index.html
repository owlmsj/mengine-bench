<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo das Palavras · Dicionário Criativo</title>
<meta name="description" content="Um mapa navegável das 250 palavras e 743 relações do Dicionário Criativo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080a0f; --ink:#f3ede1; --muted:#8b91a0; --line:rgba(243,237,225,.12);
    --gold:#e2bd85; --glass:rgba(13,16,24,.82); --glass-2:rgba(18,22,32,.72);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;overflow:hidden}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.55) 100%)}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.dragging{cursor:grabbing}
  canvas.pointing{cursor:pointer}
  .topbar{position:fixed;z-index:6;top:0;left:0;right:0;display:flex;align-items:flex-start;
    justify-content:space-between;gap:24px;padding:26px 30px 0;pointer-events:none}
  .brand{pointer-events:auto;user-select:none}
  .brand .kicker{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--gold);opacity:.9;margin-bottom:7px}
  .brand h1{font-family:Fraunces,Georgia,serif;font-weight:340;font-size:clamp(24px,2.5vw,34px);
    line-height:1;margin:0;letter-spacing:-.015em}
  .brand h1 em{font-style:italic;color:var(--gold)}
  .brand .sub{margin-top:7px;font-size:11px;color:var(--muted);letter-spacing:.02em}
  .searchwrap{pointer-events:auto;position:relative;width:min(390px,44vw);margin-top:2px}
  .searchbox{display:flex;align-items:center;gap:10px;background:var(--glass);
    border:1px solid var(--line);border-radius:12px;padding:0 10px 0 14px;height:44px;
    backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.35);
    transition:border-color .2s,box-shadow .2s}
  .searchbox:focus-within{border-color:rgba(226,189,133,.55);box-shadow:0 0 0 3px rgba(226,189,133,.09),0 12px 40px rgba(0,0,0,.4)}
  .searchbox svg{flex:none;opacity:.55}
  #q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);
    font:400 13.5px Inter,sans-serif;letter-spacing:.01em}
  #q::placeholder{color:#767d8d}
  .kbd{font-family:"JetBrains Mono",monospace;font-size:9px;color:#8b91a0;border:1px solid var(--line);
    border-radius:5px;padding:2px 5px;line-height:1.4;flex:none}
  #dice{flex:none;width:26px;height:26px;display:grid;place-items:center;border:0;border-radius:7px;
    background:rgba(243,237,225,.06);color:var(--gold);cursor:pointer;font-size:13px;transition:background .2s}
  #dice:hover{background:rgba(226,189,133,.16)}
  #suggest{position:absolute;top:50px;left:0;right:0;background:rgba(12,15,22,.96);
    border:1px solid rgba(226,189,133,.22);border-radius:12px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.6);display:none;backdrop-filter:blur(18px)}
  #suggest.open{display:block}
  #suggest button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:10px 14px;background:none;border:0;border-bottom:1px solid rgba(243,237,225,.05);
    color:var(--ink);font:400 13px Inter,sans-serif;cursor:pointer}
  #suggest button:last-child{border-bottom:0}
  #suggest button:hover,#suggest button.active{background:rgba(226,189,133,.1)}
  #suggest .dot{width:6px;height:6px;border-radius:50%;flex:none}
  #suggest .meta{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:9px;
    color:var(--muted);text-transform:lowercase;letter-spacing:.05em}
  #suggest .none{padding:14px;font-size:12px;color:var(--muted)}
  .intro{display:none}
  #names{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  #names button{position:absolute;left:0;top:0;background:none;border:0;padding:5px 9px;
    font:italic 400 13px Fraunces,Georgia,serif;letter-spacing:.16em;text-transform:uppercase;
    white-space:nowrap;cursor:pointer;pointer-events:auto;opacity:.58;
    text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 2px #000;transition:opacity .2s}
  #names button:hover,#names button.on{opacity:1}
  #names button.on{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
  .stats{position:fixed;z-index:5;left:30px;bottom:24px;display:flex;align-items:center;gap:14px;
    font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:var(--muted);
    text-transform:uppercase;pointer-events:none;user-select:none}
  .stats b{color:var(--ink);font-weight:500}
  .stats .sep{width:1px;height:11px;background:var(--line)}
  .hint{position:fixed;z-index:5;left:50%;bottom:25px;transform:translateX(-50%);
    font-size:10px;color:#8b91a0;letter-spacing:.07em;pointer-events:none;white-space:nowrap;
    font-family:"JetBrains Mono",monospace;text-transform:lowercase}
  @media (max-width:1100px){.hint{display:none}}
  .legend{position:fixed;z-index:5;right:30px;bottom:20px;display:flex;flex-wrap:wrap;
    justify-content:flex-end;gap:5px 12px;max-width:min(430px,38vw);user-select:none}
  .legend button{display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;
    color:#9198a7;font:400 10px Inter,sans-serif;cursor:pointer;letter-spacing:.02em;
    transition:color .2s,opacity .2s;opacity:.8}
  .legend button:hover{color:var(--ink);opacity:1}
  .legend button.on{color:var(--ink);opacity:1}
  .legend button.on span.n{box-shadow:0 0 0 3px rgba(243,237,225,.13)}
  .legend i{width:5px;height:5px;border-radius:50%;display:block}
  .panel{position:fixed;z-index:7;top:92px;right:26px;bottom:84px;width:min(348px,calc(100vw - 52px));
    background:linear-gradient(160deg,rgba(19,23,33,.94),rgba(11,14,21,.94));
    border:1px solid rgba(243,237,225,.1);border-radius:18px;backdrop-filter:blur(20px);
    box-shadow:0 30px 90px rgba(0,0,0,.55);padding:24px 24px 18px;overflow:auto;
    transform:translateX(calc(100% + 40px));opacity:0;
    transition:transform .42s cubic-bezier(.22,.9,.28,1),opacity .3s}
  .panel.open{transform:none;opacity:1}
  .panel::-webkit-scrollbar{width:5px}
  .panel::-webkit-scrollbar-thumb{background:rgba(243,237,225,.13);border-radius:4px}
  .panel .close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:0;border-radius:50%;
    background:rgba(243,237,225,.06);color:#aab0bd;font-size:15px;cursor:pointer;line-height:1;
    transition:background .2s,color .2s}
  .panel .close:hover{background:rgba(243,237,225,.12);color:var(--ink)}
  .eyebrow{display:flex;align-items:center;gap:8px;font-family:"JetBrains Mono",monospace;
    font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);
    padding-right:26px;margin-bottom:15px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .eyebrow .deg{margin-left:auto;color:var(--gold);white-space:nowrap}
  .panel h2{font-family:Fraunces,Georgia,serif;font-weight:360;font-size:clamp(30px,3.6vw,44px);
    line-height:1.03;margin:0 0 6px;letter-spacing:-.02em;overflow-wrap:anywhere}
  .panel .theme-line{font-size:11.5px;color:var(--muted);margin-bottom:20px}
  .panel .theme-line b{font-weight:500;color:#c9cdd6}
  .group{margin-top:19px}
  .group h3{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.18em;
    text-transform:uppercase;color:#8b91a0;margin:0 0 9px;display:flex;align-items:center;gap:7px}
  .group h3 .bar{flex:1;height:1px;background:rgba(243,237,225,.08)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid rgba(243,237,225,.1);background:rgba(243,237,225,.035);color:#dfdae0;
    font:400 11.5px Inter,sans-serif;padding:5px 9px;border-radius:7px;cursor:pointer;
    transition:background .18s,border-color .18s,color .18s;letter-spacing:.01em}
  .chip:hover{background:rgba(226,189,133,.13);border-color:rgba(226,189,133,.35);color:#fff}
  .chip .n{font-family:"JetBrains Mono",monospace;font-size:8.5px;color:#8b91a0;margin-left:3px}
  .panel .actions{display:flex;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid rgba(243,237,225,.08)}
  .panel .actions button{flex:1;height:34px;border:1px solid rgba(243,237,225,.12);border-radius:8px;
    background:none;color:#c9cdd6;font:400 10.5px Inter,sans-serif;letter-spacing:.04em;cursor:pointer;
    transition:background .2s,color .2s}
  .panel .actions button:hover{background:rgba(243,237,225,.07);color:var(--ink)}
  .toast{position:fixed;z-index:20;left:50%;bottom:72px;transform:translate(-50%,14px);
    background:rgba(24,28,39,.96);border:1px solid rgba(226,189,133,.3);color:var(--ink);
    font-size:11.5px;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .tooltip{position:fixed;z-index:8;pointer-events:none;background:rgba(10,13,20,.93);
    border:1px solid rgba(243,237,225,.14);border-radius:7px;padding:5px 9px;font-size:11px;
    color:var(--ink);opacity:0;transition:opacity .12s;white-space:nowrap;backdrop-filter:blur(8px)}
  .tooltip small{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:8.5px;
    margin-left:6px;letter-spacing:.05em}
  .tooltip.show{opacity:1}
  .intro{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);
    text-align:center;pointer-events:none;opacity:1;transition:opacity .6s;max-width:440px}
  .intro.hide{opacity:0}
  .intro .ring{width:34px;height:34px;border:1px solid rgba(226,189,133,.35);border-radius:50%;
    margin:0 auto 16px;position:relative}
  .intro .ring::after{content:"";position:absolute;inset:8px;border-radius:50%;
    background:rgba(226,189,133,.5);animation:pulse 2.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(.55);opacity:.35}50%{transform:scale(1);opacity:.9}}
  .intro p{font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:340;font-style:italic;
    color:#c8c4bc;line-height:1.5;margin:0}
  .intro span{display:block;margin-top:10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:#767d8d;font-family:"JetBrains Mono",monospace}
  @media (max-width:760px){
    .topbar{padding:16px 16px 0;flex-direction:column;gap:14px}
    .brand h1{font-size:24px}.brand .sub{display:none}
    .searchwrap{width:100%;margin-top:0}
    .stats{left:16px;bottom:16px;gap:10px;font-size:8px}
    .legend{right:16px;bottom:16px;max-width:calc(100vw - 32px);display:none}
    .hint{display:none}
    .panel{top:auto;left:12px;right:12px;bottom:12px;width:auto;max-height:58vh;padding:20px}
    .intro{top:58%;max-width:300px}.intro p{font-size:15px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header class="topbar">

    const col=THEME_COLORS[t];
    const rad = (VW<760?130:210)*Math.max(.6,cam.z);
    const ng=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,rad);
    ng.addColorStop(0,hexA(col,filterTheme>=0&&filterTheme!==t?.02:.075));
    ng.addColorStop(.65,hexA(col,.022));
    ng.addColorStop(1,hexA(col,0));
    ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(c.x,c.y,rad,0,7); ctx.fill();
  }
  // stars (fixed to world, subtle parallax)
  for (const s of stars){
    const sx = (s.x-cam.x)*cam.z*.35+VW/2, sy=(s.y-cam.y)*cam.z*.35+VH/2;
    if (sx<-10||sx>VW+10||sy<-10||sy>VH+10) continue;
    ctx.globalAlpha=s.a; ctx.fillStyle='#dfe6f0';
    ctx.beginPath(); ctx.arc(sx,sy,s.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;

  const sel = selectIdx;
  const neighbors = sel>=0 ? new Set(ADJ[sel]) : null;

  // theme names are DOM elements positioned below (crisper text, clickable)

  // edges
  const anyFocus = sel>=0 || hoverIdx>=0 || filterTheme>=0;
  const focusIdx = sel>=0?sel:hoverIdx;
  const focusN = focusIdx>=0 ? new Set(ADJ[focusIdx]) : null;
  for (let e=0;e<EDGES.length;e++){
    const [a,b,type]=EDGES[e];
    if (focusIdx>=0 && a!==focusIdx && b!==focusIdx){
      if (filterTheme>=0 && (TW[a]===filterTheme||TW[b]===filterTheme)){} else continue;
    }
    if (focusIdx<0 && filterTheme>=0 && TW[a]!==filterTheme && TW[b]!==filterTheme) continue;
    e;
    const A=screenOf(P[a]), B=screenOf(P[b]);
    const isHot = focusIdx>=0 && (a===focusIdx||b===focusIdx);
    const onTheme = filterTheme>=0 && (TW[a]===filterTheme||TW[b]===filterTheme);
    let alpha = isHot?.68:(focusIdx>=0?.04:.15);
    if (TW[a]!==TW[b]) alpha*=focusIdx>=0?1:.5;
    if (filterTheme>=0) alpha = onTheme?(isHot?.7:.22):.028;
    let col = type===2?'#7fbfd4':type===3?'#b9a5d6':'#e2bd85';
    ctx.strokeStyle=hexA(col,alpha);
    ctx.lineWidth = isHot?1.15:.6;
    // gentle arc
    const mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
    const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1;
    const bend = (((a*31+b*17)%13)-6)*0.9*Math.min(1,len/70);
    const cx=mx + (-dy/len)*bend, cy=my + (dx/len)*bend;
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(cx,cy,B.x,B.y); ctx.stroke();
  }

  // nodes
  for (let i=0;i<N;i++){
    const p=P[i], s=screenOf(p), r=Math.max(1.6,p.r*Math.sqrt(cam.z)*(cam.z>.9?1:1.06));
    const hot = i===sel || i===hoverIdx;
    const near = focusN ? focusN.has(i) : false;
    const onTheme = filterTheme<0 || TW[i]===filterTheme;
    let alpha = 1;
    if (focusIdx>=0) alpha = hot?1:(near?.95:.3);
    if (filterTheme>=0) alpha = (TW[i]===filterTheme)?(focusIdx>=0?(hot||near?1:.45):.95):.14;
    if (anyFocus && alpha<.2) alpha=.14;
    const col=THEME_COLORS[TW[i]];
    if (hot){
      const glow=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,r*6.5);
      glow.addColorStop(0,hexA(col,.5)); glow.addColorStop(.4,hexA(col,.16)); glow.addColorStop(1,hexA(col,0));
      ctx.globalAlpha=1; ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(s.x,s.y,r*6.5,0,7); ctx.fill();
    }
    ctx.globalAlpha=alpha;
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(s.x,s.y,r,0,7); ctx.fill();
    if (hot || near || (filterTheme>=0&&onTheme)){
      ctx.strokeStyle='rgba(243,237,225,.55)'; ctx.lineWidth=hot?1.4:.8; ctx.stroke();
    }
    if (i===topIdx && sel<0 && filterTheme<0){
      ctx.globalAlpha=.5;
      ctx.strokeStyle=hexA(col,.55); ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(s.x,s.y,r+5+Math.sin(performance.now()/900)*2,0,7); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;

  // labels
  const showAll = cam.z > 1.45;
  ctx.textAlign='center'; ctx.textBaseline='top';
  for (let i=0;i<N;i++){
    const hot = i===sel||i===hoverIdx;
    const near = focusN ? focusN.has(i) : false;
    const onTheme = filterTheme>=0 && TW[i]===filterTheme;
    const show = hot || near || DEG[i]>=9 || onTheme || showAll;
    if (!show) continue;
    if (focusIdx>=0 && !hot && !near && DEG[i]<9) continue;
    const s=screenOf(P[i]), r=Math.max(2,P[i].r*Math.sqrt(cam.z));
    const fs = hot?13.5:(near?11.5:10.5);
    ctx.font=(hot?'500 ':'400 ')+fs+'px Inter, sans-serif';
    const label=W[i];
    const alpha = hot?1:(focusIdx>=0?(near?.9:.18):.78);
    ctx.globalAlpha=alpha;
    // halo
    ctx.lineWidth=3; ctx.strokeStyle='rgba(8,10,15,.9)';
    ctx.strokeText(label,s.x,s.y+r+5);
    ctx.fillStyle=hot?'#fff7e8':'#d7d4cc';
    ctx.fillText(label,s.x,s.y+r+5);
  }
  ctx.globalAlpha=1;
  positionNames();
}

function positionNames(){
  const els=namesEl.querySelectorAll('button');
  if (!els.length) return;
  for (let t=0;t<THEMES.length;t++){
    const c=screenOf(themeCenters[t]);
    const ang=-Math.PI/2 + t*Math.PI*2/THEMES.length;
    const x=c.x+Math.cos(ang)*142*Math.max(.62,cam.z);
    const y=c.y+Math.sin(ang)*108*Math.max(.62,cam.z);
    const el=els[t];
    el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;
    const dim = filterTheme>=0 ? (filterTheme===t?1:.18) : .55;
    el.style.opacity=dim;
  }
}

function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}

// ---------- selection / panel / URL ----------
const panel=document.getElementById('panel'), panelBody=document.getElementById('panelBody');
const intro=document.getElementById('intro');
const search=document.getElementById('q'), suggest=document.getElementById('suggest');
const tooltip=document.getElementById('tooltip');
const toastEl=document.getElementById('toast');
let toastTimer;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800);}

function groupFor(a,b,t){ return {syn:t===1||t===3, ana:t===2||t===3}; }
function typeOf(a,b){ const k=a<b?a+'-'+b:b+'-'+a; return TYPE.get(k)||1; }

function select(i,{push=true,pan=true}={}){
  selectIdx=i;
  if (i<0){ panel.classList.remove('open'); intro.classList.remove('hide'); return; }
  intro.classList.add('hide');
  const name=W[i], theme=THEMES[TW[i]], col=THEME_COLORS[TW[i]];
  const links=ADJ[i].slice().sort((a,b)=>DEG[b]-DEG[a]||W[a].localeCompare(W[b],'pt-BR'));
  const syn=[], ana=[];
  for (const j of links){
    const t=typeOf(i,j);
    if (t===1||t===3) syn.push(j);
    if (t===2||t===3) ana.push(j);
  }
  const chip = j => `<button class="chip" data-i="${j}">${W[j]}<span class="n">${DEG[j]}</span></button>`;
  panelBody.innerHTML=`
    <div class="eyebrow"><span class="dot" style="background:${col}"></span>${theme}<span class="deg">${DEG[i]} conexões</span></div>
    <h2>${name}</h2>
    <div class="theme-line">constelação <b>${theme}</b> · ${links.length} palavras ligadas</div>
    ${syn.length?`<div class="group"><h3>Sinônimos<span class="bar"></span><span>${syn.length}</span></h3><div class="chips">${syn.map(chip).join('')}</div></div>`:''}
    ${ana.length?`<div class="group"><h3>Palavras análogas<span class="bar"></span><span>${ana.length}</span></h3><div class="chips">${ana.map(chip).join('')}</div></div>`:''}
    <div class="actions"><button id="copyLink">copiar link desta palavra</button></div>`;
  panel.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>select(+b.dataset.i)));
  panel.querySelector('#copyLink').addEventListener('click',copyLink);
  panel.classList.add('open');
  if (push) setURL(name);
  // keep the chosen word out from under the panel, moving the camera as little as possible
  if (pan && VW>760){
    const s=screenOf(P[i]);
    const rightLimit=VW-380, leftLimit=90, topLimit=120, botLimit=VH-100;
    let dx=0, dy=0;
    if (s.x>rightLimit-30) dx=s.x-(rightLimit-30);
    if (s.x<leftLimit) dx=s.x-leftLimit;
    if (s.y>botLimit) dy=s.y-botLimit;
    if (s.y<topLimit) dy=s.y-topLimit;
    if (dx||dy){ cam.x+=dx/cam.z; cam.y+=dy/cam.z; }
  }
}
panel.addEventListener('click',e=>{ if(e.target.closest('.close')){select(-1,{push:true});} });
document.getElementById('closePanel').addEventListener('click',()=>select(-1,{push:true}));

function setURL(name){
  const url = location.pathname + (name?('?word='+encodeURIComponent(name)):'');
  try { history.replaceState(null,'',url); } catch(e){ location.hash='word='+encodeURIComponent(name||''); }
}
function copyLink(){
  if (selectIdx<0) return;
  const url = location.href.split('#')[0].split('?')[0] + '?word=' + encodeURIComponent(W[selectIdx]);
  const done=()=>toast('Link copiado');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done).catch(()=>fallbackCopy(url,done));
  } else fallbackCopy(url,done);
}
function fallbackCopy(text,cb){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('Copie da barra de endereço'); }
  ta.remove();
}

// ---------- search ----------
function searchList(q){
  const nq=norm(q); if(!nq) return [];
  const scored=[];
  for (let i=0;i<N;i++){
    const nw=norm(W[i]); let s=-1;
    if (nw===nq) s=0; else if (nw.startsWith(nq)) s=1; else if (nw.includes(nq)) s=2;
    else if (lev(W[i],q)<=2) s=3;
    if (s>=0) scored.push([s,DEG[i],i]);
  }
  scored.sort((a,b)=>a[0]-b[0]||b[1]-a[1]||W[a[2]].localeCompare(W[b[2]],'pt-BR'));
  return scored.slice(0,8).map(x=>x[2]);
}
function lev(a,b){
  a=norm(a); b=norm(b); a.length>b.length&&([a,b]=[b,a]);
  if (Math.abs(a.length-b.length)>2) return 9;
  const prev=Array.from({length:a.length+1},(_,i)=>i);
  for(let j=1;j<=b.length;j++){
    let cur=[j];
    for(let i=1;i<=a.length;i++){
      cur[i]=Math.min(cur[i-1]+1,prev[i]+1,prev[i-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev.splice(0,prev.length,...cur);
  }
  return prev[a.length];
}
let sugItems=[], sugActive=0;
function renderSuggest(q){
  sugItems=searchList(q); sugActive=0;
  if (!q.trim()){ suggest.classList.remove('open'); search.setAttribute('aria-expanded','false'); return; }
  if (!sugItems.length){ suggest.innerHTML='<div class="none">Nenhuma palavra encontrada.</div>'; }
  else suggest.innerHTML=sugItems.map((i,k)=>{
    const col=THEME_COLORS[TW[i]];
    return `<button role="option" data-i="${i}" class="${k===0?'active':''}"><span class="dot" style="background:${col}"></span>${W[i]}<span class="meta">${THEMES[TW[i]]} · ${DEG[i]}</span></button>`;
  }).join('');
  suggest.classList.add('open'); search.setAttribute('aria-expanded','true');
  suggest.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i; hideSuggest(); select(i); search.value='';
  }));
}
function hideSuggest(){suggest.classList.remove('open');search.setAttribute('aria-expanded','false');}
search.addEventListener('input',()=>renderSuggest(search.value));
search.addEventListener('keydown',e=>{
  if (e.key==='Escape'){ hideSuggest(); search.blur(); return; }
  if (!sugItems.length) return;
  if (e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault(); sugActive=(sugActive+(e.key==='ArrowDown'?1:-1)+sugItems.length)%sugItems.length;
    suggest.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('active',k===sugActive));
  }
  if (e.key==='Enter'){ e.preventDefault(); const i=sugItems[sugActive]; hideSuggest(); search.value=''; select(i); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('.searchwrap')) hideSuggest(); });
document.addEventListener('keydown',e=>{
  if (e.key==='/' && document.activeElement!==search){ e.preventDefault(); search.focus(); }
  else if (e.key==='Escape' && document.activeElement!==search){ select(-1); }
});
document.getElementById('dice').addEventListener('click',()=>{
  let n; do { n = Math.floor(Math.random()*N); } while (n===selectIdx);
  select(n);
});

// ---------- legend ----------
const legend=document.getElementById('legend');
legend.innerHTML=THEMES.map((t,i)=>`<button data-t="${i}"><i style="background:${THEME_COLORS[i]}"></i>${t}</button>`).join('');
legend.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  const t=+b.dataset.t;
  filterTheme = filterTheme===t ? -1 : t;
  legend.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.t===filterTheme));
  namesEl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.t===filterTheme));
  if (filterTheme>=0){
    const c=themeCenters[t];
    cam.x += (c.x-cam.x)*.55; cam.y += (c.y-cam.y)*.55;
    targetZ = Math.max(cam.z, .95);
    intro.classList.add('hide');
  }
}));

const namesEl=document.getElementById('names');
namesEl.innerHTML=THEMES.map((t,i)=>`<button data-t="${i}" style="color:${THEME_COLORS[i]}">${t}</button>`).join('');
namesEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  legend.querySelector(`button[data-t="${b.dataset.t}"]`).click();
}));

// ---------- stats ----------
const stats=document.getElementById('stats');
stats.innerHTML=`<span><b>${N}</b> palavras</span><span class="sep"></span>
<span><b>${EDGES.length}</b> relações</span><span class="sep"></span>
<span><b>${THEMES.length}</b> temas</span><span class="sep"></span>
<span>mais conectada <b>${W[topIdx]}</b></span>`;

// ---------- pointer ----------
function pick(x,y){
  let best=-1,bd=1e9;
  for (let i=0;i<N;i++){
    const s=screenOf(P[i]); const d=Math.hypot(s.x-x,s.y-y);
    const hit=Math.max(9,P[i].r*Math.sqrt(cam.z)+5);
    if (d<hit && d<bd){bd=d;best=i;}
  }
  return best;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinchDist=Math.hypot(a.x-b.x,a.y-b.y);
    dragNode=-1; dragging=false; return;
  }
  const i=pick(e.clientX,e.clientY);
  dragging=true; moved=false; downAt=performance.now();
  dragNode=i; last={x:e.clientX,y:e.clientY};
  cv.classList.add('dragging');
  if (i>=0) hoverIdx=i;
});
cv.addEventListener('pointermove',e=>{
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (pointers.size===2){
    const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
    if (pinchDist>0){ zoomAt((VW)/2,(VH)/2, d/pinchDist); }
    pinchDist=d; return;
  }
  if (dragging){
    const dx=e.clientX-last.x, dy=e.clientY-last.y;
    if (Math.abs(dx)+Math.abs(dy)>3) moved=true;
    if (dragNode>=0){
      P[dragNode].x += dx/cam.z; P[dragNode].y += dy/cam.z;
    } else {
      cam.x -= dx/cam.z; cam.y -= dy/cam.z;
    }
    last={x:e.clientX,y:e.clientY};
    return;
  }
  const i=pick(e.clientX,e.clientY);
  if (i!==hoverIdx){
    hoverIdx=i;
    cv.classList.toggle('pointing',i>=0);
    if (i>=0){
      tooltip.innerHTML=`${W[i]}<small>${THEMES[TW[i]]} · ${DEG[i]}</small>`;
      tooltip.classList.add('show');
    } else tooltip.classList.remove('show');
  }
  if (i>=0){
    tooltip.style.left=Math.min(VW-160,e.clientX+14)+'px';
    tooltip.style.top=(e.clientY+16)+'px';
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size<2) pinchDist=0;
  if (!dragging) return;
  dragging=false; cv.classList.remove('dragging');
  const dt=performance.now()-downAt;
  if (!moved && dt<550){
    if (dragNode>=0) select(dragNode);
    else select(-1,{push:true});
  }
  dragNode=-1;
  tooltip.classList.remove('show');
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('pointerleave',()=>{ if(!dragging){hoverIdx=-1;tooltip.classList.remove('show');cv.classList.remove('pointing'); }});

let zoomAnchor=null;
function zoomAt(cx,cy,factor){
  targetZ=Math.max(.32,Math.min(3.2,targetZ*factor));
  zoomAnchor={x:cx,y:cy};
}
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0014));
},{passive:false});
// double click empty space -> reset
cv.addEventListener('dblclick',e=>{
  if (pick(e.clientX,e.clientY)>=0) return;
  zoomAnchor=null; fit();
});

// ---------- loop ----------
function frame(){
  if (Math.abs(targetZ-cam.z)>.0005){
    const ax=zoomAnchor?zoomAnchor.x:VW/2, ay=zoomAnchor?zoomAnchor.y:VH/2;
    const wx=(ax-VW/2)/cam.z+cam.x, wy=(ay-VH/2)/cam.z+cam.y;
    cam.z += (targetZ-cam.z)*.16;
    cam.x = wx-(ax-VW/2)/cam.z;
    cam.y = wy-(ay-VH/2)/cam.z;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- boot from ?word= / #word= ----------
function boot(){
  const params=new URLSearchParams(location.search);
  let w=params.get('word');
  if (!w && location.hash){
    const m=location.hash.match(/(?:^#|&)word=([^&]+)/);
    if (m) w=decodeURIComponent(m[1]);
  }
  if (!w) return;
  let dec=w; try{dec=decodeURIComponent(w);}catch(e){}
  const i=IDX.get(dec.toLowerCase()) ?? NORM.get(norm(dec));
  if (i!==undefined && i>=0){ select(i,{push:false}); }
  else { toast('“'+dec+'” não está neste universo'); }
}
boot();
window.__universe={W,DEG,ADJ,THEMES,select,get sel(){return selectIdx;}};
</script>
