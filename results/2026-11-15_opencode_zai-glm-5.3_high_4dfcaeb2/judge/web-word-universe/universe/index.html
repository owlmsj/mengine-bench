<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --panel:rgba(13,19,34,.88); --line:rgba(255,255,255,.09);
  --ink:#e8edf7; --dim:#8b96ad; --gold:#ffd166;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden}
#bgstars{position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 74% 12%,#9db4ff,transparent),radial-gradient(1.5px 1.5px at 42% 68%,#fff,transparent),radial-gradient(1px 1px at 88% 54%,#ffd9a0,transparent),radial-gradient(1px 1px at 26% 84%,#fff,transparent),radial-gradient(1px 1px at 58% 34%,#c9b8ff,transparent),radial-gradient(1px 1px at 6% 58%,#fff,transparent),radial-gradient(1px 1px at 94% 86%,#fff,transparent)}
#stage{position:fixed;inset:0;cursor:grab}
#stage.dragging{cursor:grabbing}

header{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:18px;
  padding:14px 20px;background:linear-gradient(180deg,rgba(7,11,20,.92),rgba(7,11,20,0));pointer-events:none}
header>*{pointer-events:auto}
h1{font-family:'Fraunces',serif;font-weight:400;font-size:22px;letter-spacing:.02em;white-space:nowrap}
h1 em{font-style:italic;color:var(--gold)}
#stats{color:var(--dim);font-size:12.5px;line-height:1.5}
#stats b{color:var(--ink);font-weight:600}

#searchbox{position:relative;margin-left:auto;width:min(340px,42vw)}
#search{width:100%;padding:10px 14px 10px 38px;border-radius:12px;border:1px solid var(--line);
  background:rgba(13,19,34,.8);color:var(--ink);font:inherit;font-size:15px;outline:none;backdrop-filter:blur(8px)}
#search:focus{border-color:rgba(255,209,102,.55)}
#searchicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:15px;pointer-events:none}
#sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;display:none;backdrop-filter:blur(10px);max-height:320px;overflow-y:auto}
#sugg.open{display:block}
.sug{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;cursor:pointer;font-size:14.5px}
.sug:hover,.sug.sel{background:rgba(255,209,102,.12)}
.sug small{color:var(--dim);font-size:11.5px}
mark{background:none;color:var(--gold)}

#legend{position:fixed;left:20px;bottom:18px;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;backdrop-filter:blur(10px);display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px}
.lg{display:flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer;user-select:none}
.lg.off{opacity:.35;text-decoration:line-through}
.lg i{width:10px;height:10px;border-radius:50%;flex:none}

#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:15;color:var(--dim);
  font-size:12px;letter-spacing:.04em;pointer-events:none;text-align:center}

#panel{position:fixed;top:74px;right:20px;bottom:18px;width:min(348px,92vw);z-index:25;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(14px);overflow-y:auto;
  transform:translateX(24px);opacity:0;pointer-events:none;transition:transform .28s ease,opacity .28s ease}
#panel.open{transform:none;opacity:1;pointer-events:auto}
#panel .close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
#pw{font-family:'Fraunces',serif;font-style:italic;font-weight:500;font-size:38px;line-height:1.05;margin:2px 0 10px}
#ptema{display:inline-block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;
  border-radius:99px;border:1px solid;margin-bottom:16px}
.grp{margin-top:14px}
.grp h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  font-size:14px;cursor:pointer;transition:background .15s}
.chip:hover{background:rgba(255,209,102,.14);border-color:rgba(255,209,102,.5)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
#pdeg{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;line-height:1.7}
#pdeg b{color:var(--ink)}
#share{margin-top:12px;width:100%;padding:9px;border-radius:10px;border:1px solid rgba(255,209,102,.4);
  background:rgba(255,209,102,.1);color:var(--gold);font:inherit;font-size:13.5px;cursor:pointer}
#share:hover{background:rgba(255,209,102,.2)}

#cloud{position:fixed;inset:0;z-index:5;overflow-y:auto;padding:110px 6vw 60px;display:none;
  align-content:flex-start;flex-wrap:wrap;gap:6px 14px;align-items:center}
#cloud .wd{font-size:15px;color:var(--ink);cursor:pointer;line-height:1.5}
#cloud .wd:hover{color:var(--gold)}
#fallbackmsg{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:6;color:var(--dim);
  font-size:12px;display:none;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 16px}
@media (max-width:760px){
  header{flex-wrap:wrap;gap:8px}
  #searchbox{margin-left:0;width:100%;order:3}
  #legend{display:none}
  #panel{top:auto;bottom:0;left:0;right:0;width:100%;max-height:62vh;border-radius:18px 18px 0 0}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="bgstars"></div>
<div id="stage"></div>
<div id="fallbackmsg">Visualização 3D indisponível · mostrando todas as palavras — a busca e os vínculos funcionam</div>
<div id="cloud"></div>

<header>
  <h1>Universo de <em>Palavras</em></h1>
  <div id="stats"></div>
  <div id="searchbox">
    <span id="searchicon">⌕</span>
    <input id="search" type="text" autocomplete="off" spellcheck="false"
      placeholder="Buscar palavra… (ex.: saudade)" aria-label="Buscar palavra">
    <div id="sugg"></div>
  </div>
</header>

<div id="legend"></div>
<div id="hint">arraste para girar · role para aproximar · clique numa palavra</div>

<aside id="panel" aria-live="polite">
  <button class="close" title="Fechar">✕</button>
  <div id="pw"></div>
  <span id="ptema"></span>
  <div class="grp"><h3 id="gsin"></h3><div class="chips" id="csin"></div></div>
  <div class="grp"><h3 id="gana"></h3><div class="chips" id="cana"></div></div>
  <div class="grp"><h3 id="ginc"></h3><div class="chips" id="cinc"></div></div>
  <div id="pdeg"></div>
  <button id="share">⧉ Copiar link desta palavra</button>
</aside>

const RESULT = {"words": 250, "relations": 743, "most_connected": ["palavra", "tempo"]};
const PALETTE = {"linguagem": "#38bdf8", "ofícios": "#f59e0b", "sentimentos": "#fb7185", "lugares": "#2dd4bf", "corpo": "#a78bfa", "comida": "#fb923c", "tempo": "#e879f9", "natureza": "#4ade80", "artes": "#fde047", "família": "#60a5fa"};

const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const nodes = DATA.nodes;                     // {w, tema}
const links = DATA.links;                     // {s, t, k:'sin'|'ana'}
const idx = new Map(nodes.map((n,i)=>[n.w,i]));
const deg = new Array(nodes.length).fill(0);
const nbr = nodes.map(()=>new Set());
const outSin = nodes.map(()=>[]), outAna = nodes.map(()=>[]), inLinks = nodes.map(()=>[]);
links.forEach(l=>{
  const i = idx.get(l.s), j = idx.get(l.t);
  (l.k==='sin'?outSin:outAna)[i].push(j);
  inLinks[j].push([i,l.k]);
  nbr[i].add(j); nbr[j].add(i);
});
nodes.forEach((n,i)=>deg[i]=nbr[i].size);
const maxDeg = Math.max(...deg);
const temi = t => PALETTE[t] || '#9aa7bf';

/* ---------- header stats ---------- */
document.getElementById('stats').innerHTML =
  `<b>${RESULT.words}</b> palavras · <b>${RESULT.relations}</b> relações<br>` +
  `mais conectadas: <b>${[].concat(RESULT.most_connected).join('</b>, <b>')}</b>`;

/* ---------- legend ---------- */
const legend = document.getElementById('legend');
Object.entries(PALETTE).forEach(([t,c])=>{
  const el = document.createElement('div');
  el.className='lg'; el.dataset.tema=t;
  el.innerHTML = `<i style="background:${c};box-shadow:0 0 8px ${c}"></i>${t}`;
  el.onclick = ()=> el.classList.toggle('off');
  legend.appendChild(el);
});

/* ---------- panel ---------- */
const panel = document.getElementById('panel');
let selected = -1;
function chipHTML(i){
  const n = nodes[i];
  return `<span class="chip" data-i="${i}"><span class="dot" style="background:${temi(n.tema)}"></span>${n.w}</span>`;
}
function showPanel(i){
  const n = nodes[i];
  selected = i;
  document.getElementById('pw').textContent = n.w;
  const t = document.getElementById('ptema');
  t.textContent = n.tema; t.style.color = temi(n.tema); t.style.borderColor = temi(n.tema);
  const fill = (ul, arr)=> ul.innerHTML = arr.length? arr.map(chipHTML).join('') : '<span style="color:var(--dim);font-size:13px">—</span>';
  document.getElementById('gsin').textContent = `Sinônimos (${outSin[i].length})`;
  document.getElementById('gana').textContent = `Palavras análogas (${outAna[i].length})`;
  document.getElementById('ginc').textContent = `Apontam para esta palavra (${inLinks[i].length})`;
  fill(document.getElementById('csin'), outSin[i]);
  fill(document.getElementById('cana'), outAna[i]);
  fill(document.getElementById('cinc'), inLinks[i].map(([j])=>j));
  document.getElementById('pdeg').innerHTML =
    `grau <b>${deg[i]}</b> de ${maxDeg} · ligada a <b>${nbr[i].size}</b> palavras distintas<br>` +
    `vizinhas: <b>${[...nbr[i]].map(j=>nodes[j].w).join('</b>, <b>')}</b>`;
  panel.classList.add('open');
}
function hidePanel(){ selected = -1; panel.classList.remove('open'); applyFocus(); pushUrl(); }
panel.addEventListener('click', e=>{
  const c = e.target.closest('.chip');
  if (c){ select(+c.dataset.i, true); return; }
  if (e.target.classList.contains('close')) hidePanel();
});
document.getElementById('share').onclick = ()=>{
  try{ navigator.clipboard.writeText(location.href); }catch(_){}
};

/* ---------- selection core ---------- */
const listeners = [];
function onSelect(fn){ listeners.push(fn); }
function pushUrl(){
  try{
    const u = new URL(location.href);
    if (selected >= 0) u.searchParams.set('word', nodes[selected].w); else u.searchParams.delete('word');
    history.replaceState(null,'',u.href);
  }catch(_){}
}
function select(i, fly){
  showPanel(i);
  pushUrl();
  listeners.forEach(fn=>fn(i, fly));
  document.getElementById('search').value = nodes[i].w;
}
function applyFocus(){ listeners.forEach(fn=>fn(selected, false)); }

/* ---------- search ---------- */
const searchEl = document.getElementById('search'), sugg = document.getElementById('sugg');
let sugIdx = -1, sugList = [];
function renderSug(){
  if (!sugList.length){ sugg.classList.remove('open'); sugg.innerHTML=''; return; }
  const q = norm(searchEl.value);
  sugg.innerHTML = sugList.slice(0,40).map((i,k)=>{
    const n = nodes[i];
    let label = n.w;
    if (q){
      const p = norm(n.w).indexOf(q);
      if (p>=0) label = n.w.slice(0,p)+'<mark>'+n.w.slice(p,p+q.length)+'</mark>'+n.w.slice(p+q.length);
    }
    return `<div class="sug${k===sugIdx?' sel':''}" data-i="${i}">${label}<small>${n.tema} · grau ${deg[i]}</small></div>`;
  }).join('');
  sugg.classList.add('open');
}
searchEl.addEventListener('input', ()=>{
  const q = norm(searchEl.value);
  sugIdx = -1;
  sugList = nodes.map((n,i)=>[i,n]).filter(([,n])=>!q || norm(n.w).includes(q))
    .sort((a,b)=> deg[b[0]]-deg[a[0]] || a[1].w.localeCompare(b[1].w,'pt')).map(([i])=>i);
  renderSug();
});
searchEl.addEventListener('keydown', e=>{
  if (e.key==='ArrowDown'){ e.preventDefault(); sugIdx=Math.min(sugIdx+1,Math.min(sugList.length,40)-1); renderSug(); }
  else if (e.key==='ArrowUp'){ e.preventDefault(); sugIdx=Math.max(sugIdx-1,0); renderSug(); }
  else if (e.key==='Enter'){
    const i = sugIdx>=0? sugList[sugIdx] : sugList[0];
    if (i!=null){ select(i,true); sugg.classList.remove('open'); searchEl.blur(); }
  } else if (e.key==='Escape'){ sugg.classList.remove('open'); }
});
sugg.addEventListener('mousedown', e=>{
  const s = e.target.closest('.sug');
  if (s){ select(+s.dataset.i,true); sugg.classList.remove('open'); }
});
document.addEventListener('click', e=>{ if (!e.target.closest('#searchbox')) sugg.classList.remove('open'); });

/* ---------- 3D universe (three.js), com fallback ---------- */
let threeOK = false;
import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js')
  .then(m=>{ threeOK = true; initGraph(m); })
  .catch(()=>fallbackCloud());

setTimeout(()=>{ if(!threeOK) fallbackCloud(); }, 6000);

function fallbackCloud(){
  if (threeOK) return;
  document.getElementById('cloud').style.display='flex';
  document.getElementById('fallbackmsg').style.display='block';
  document.getElementById('hint').style.display='none';
  const cloud = document.getElementById('cloud');
  cloud.innerHTML = nodes.map((n,i)=>
    `<span class="wd" data-i="${i}" style="font-size:${11+deg[i]*1.4}px;opacity:${.45+.55*deg[i]/maxDeg};color:${temi(n.tema)}">${n.w}</span>`
  ).join('<span style="color:var(--dim)">·</span>');
  cloud.onclick = e=>{ const w=e.target.closest('.wd'); if(w) select(+w.dataset.i,false); };
  const initial = new URLSearchParams(location.search).get('word');
  const i = initial? idx.get(initial): -1;
  if (i!=null && i>=0) select(i,false);
}

function initGraph(THREE){
  const stage = document.getElementById('stage');
  const W = ()=>innerWidth, H = ()=>innerHeight;
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(W(),H());
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070b14, 0.0028);
  const camera = new THREE.PerspectiveCamera(58, W()/H(), 1, 4000);

  const graph = new THREE.Group(); scene.add(graph);

  /* positions + force layout */
  const N = nodes.length;
  const pos = new Float32Array(N*3), vel = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    const r = 40+Math.random()*130, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph); pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  let alpha = 1;
  const REST = 46, REP = 2600;
  function tick(){
    if (alpha < .003) return;
    alpha *= .994;
    for (let i=0;i<N;i++){
      const ix=i*3;
      for (let j=i+1;j<N;j++){
        const jx=j*3;
        let dx=pos[jx]-pos[ix], dy=pos[jx+1]-pos[ix+1], dz=pos[jx+2]-pos[ix+2];
        let d2 = dx*dx+dy*dy+dz*dz; if (d2<1) { dx=Math.random()-.5; dy=Math.random()-.5; dz=Math.random()-.5; d2=1; }
        const f = REP*alpha/d2, d=Math.sqrt(d2), fx=f*dx/d, fy=f*dy/d, fz=f*dz/d;
        vel[ix]-=fx; vel[ix+1]-=fy; vel[ix+2]-=fz;
        vel[jx]+=fx; vel[jx+1]+=fy; vel[jx+2]+=fz;
      }
    }
    // springs
    for (let e=0;e<links.length;e++){
      const i=idx.get(links[e].s)*3, j=idx.get(links[e].t)*3;
      const dx=pos[j]-pos[i], dy=pos[j+1]-pos[i+1], dz=pos[j+2]-pos[i+2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
      const f=(d-REST)*.03*alpha, fx=f*dx/d, fy=f*dy/d, fz=f*dz/d;
      vel[i]+=fx; vel[i+1]+=fy; vel[i+2]+=fz;
      vel[j]-=fx; vel[j+1]-=fy; vel[j+2]-=fz;
    }
    for (let i=0;i<N;i++){
      const ix=i*3;
      vel[ix]=vel[ix]*.86 - pos[ix]*.0016*alpha;
      vel[ix+1]=vel[ix+1]*.86 - pos[ix+1]*.0016*alpha;
      vel[ix+2]=vel[ix+2]*.86 - pos[ix+2]*.0016*alpha;
      pos[ix]+=vel[ix]; pos[ix+1]+=vel[ix+1]; pos[ix+2]+=vel[ix+2];
    }
  }

  /* node meshes */
  const nodeGeo = new THREE.SphereGeometry(1, 20, 16);
  const meshes = [];
  nodes.forEach((n,i)=>{
    const r = 1.6 + 4.4*Math.pow(deg[i]/maxDeg, .8);
    const mat = new THREE.MeshBasicMaterial({color:temi(n.tema), transparent:true});
    const m = new THREE.Mesh(nodeGeo, mat);
    m.scale.setScalar(r);
    m.userData.i = i;
    graph.add(m); meshes.push(m);
  });

  /* labels */
  const labels = new THREE.Group(); graph.add(labels);
  function makeLabels(){
    nodes.forEach((n,i)=>{
      const c = document.createElement('canvas');
      const fs = 30 + 26*Math.pow(deg[i]/maxDeg, .9);
      c.width=512; c.height=128;
      const g = c.getContext('2d');
      g.font = `500 ${fs}px 'Space Grotesk', sans-serif`;
      g.textAlign='center'; g.textBaseline='middle';
      g.shadowColor = temi(n.tema); g.shadowBlur = 18;
      g.fillStyle = '#f2f6ff';
      g.fillText(n.w, 256, 66, 480);
      const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
      const s = 7 + 7*Math.pow(deg[i]/maxDeg, .9);
      sp.scale.set(s*4, s, 1);
      sp.userData.i = i;
      labels.add(sp);
    });
  }
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(()=>setTimeout(makeLabels, 100));
  else makeLabels();
  setTimeout(()=>{ if(!labels.children.length) makeLabels(); }, 2500);

  /* edges */
  const epos = new Float32Array(links.length*6);
  const egeo = new THREE.BufferGeometry();
  egeo.setAttribute('position', new THREE.BufferAttribute(epos,3));
  const edges = new THREE.LineSegments(egeo,
    new THREE.LineBasicMaterial({color:0x43557a, transparent:true, opacity:.32}));
  graph.add(edges);
  /* highlight edges (selected) */
  let hlIdx = [], hlGeo = null, hlLines = null;
  function buildHL(i){
    if (hlLines){ graph.remove(hlLines); hlGeo.dispose(); }
    hlIdx = [];
    if (i>=0) links.forEach((l,e)=>{
      if (l.s===nodes[i].w || l.t===nodes[i].w) hlIdx.push(e);
    });
    hlGeo = new THREE.BufferGeometry();
    hlGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(hlIdx.length*6),3));
    hlLines = new THREE.LineSegments(hlGeo,
      new THREE.LineBasicMaterial({color:0xffd166, transparent:true, opacity:.95}));
    graph.add(hlLines);
  }

  /* camera orbit */
  let theta = .4, phi = 1.1, dist = 420, tgt = new THREE.Vector3();
  let userMoved = false, followI = -1;
  function placeCam(){
    camera.position.set(
      tgt.x + dist*Math.sin(phi)*Math.cos(theta),
      tgt.y + dist*Math.cos(phi),
      tgt.z + dist*Math.sin(phi)*Math.sin(theta));
    camera.lookAt(tgt);
  }

  /* selection glue */
  onSelect((i, fly)=>{
    buildHL(i);
    meshes.forEach((m,k)=>{
      const on = i<0 || k===i || nbr[i].has(k);
      m.material.opacity = on? 1 : .07;
    });
    labels.children.forEach(sp=>{
      const k = sp.userData.i;
      sp.material.opacity = i<0 || k===i || nbr[i].has(k) ? .95 : .06;
    });
    edges.material.opacity = i<0 ? .32 : .05;
    followI = fly? i : (i>=0? i : -1);
    if (i>=0 && fly) dist = Math.min(dist, 240);
  });

  /* pointer: orbit + click */
  const ray = new THREE.Raycaster(); ray.params.Points = {};
  const ptr = new THREE.Vector2();
  let downX=0, downY=0, dragging=false, lastX=0, lastY=0;
  stage.addEventListener('pointerdown', e=>{
    dragging=true; downX=lastX=e.clientX; downY=lastY=e.clientY;
    stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e=>{
    if (!dragging){
      ptr.set(e.clientX/W()*2-1, -(e.clientY/H())*2+1);
      ray.setFromCamera(ptr, camera);
      const hit = ray.intersectObjects(meshes, false)[0];
      stage.style.cursor = hit? 'pointer' : 'grab';
      return;
    }
    userMoved = true;
    theta += (e.clientX-lastX)*.005;
    phi = Math.max(.15, Math.min(Math.PI-.15, phi-(e.clientY-lastY)*.005));
    lastX=e.clientX; lastY=e.clientY;
  });
  stage.addEventListener('pointerup', e=>{
    dragging=false; stage.classList.remove('dragging');
    if (Math.hypot(e.clientX-downX, e.clientY-downY) < 5){
      ptr.set(e.clientX/W()*2-1, -(e.clientY/H())*2+1);
      ray.setFromCamera(ptr, camera);
      const hit = ray.intersectObjects([...meshes, ...labels.children], false)[0];
      if (hit) select(hit.object.userData.i, true);
      else if (selected>=0 && e.target === renderer.domElement) hidePanel();
    }
  });
  stage.addEventListener('wheel', e=>{
    e.preventDefault(); userMoved = true;
    dist = Math.max(80, Math.min(1200, dist*(1+Math.sign(e.deltaY)*.09)));
  }, {passive:false});

  addEventListener('resize', ()=>{
    camera.aspect = W()/H(); camera.updateProjectionMatrix();
    renderer.setSize(W(),H());
  });

  /* boot */
  const initial = new URLSearchParams(location.search).get('word');
  const initI = initial? idx.get(initial) : -1;
  if (initI==null || initI<0){
    // overview: most connected word pre-highlighted lightly? keep clean overview
  } else select(initI, true);

  let frame = 0;
  (function loop(){
    requestAnimationFrame(loop);
    frame++;
    tick();
    for (let i=0;i<N;i++){
      meshes[i].position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
      if (labels.children[i]) labels.children[i].position.set(pos[i*3],pos[i*3+1]+meshes[i].scale.x+2.2,pos[i*3+2]);
    }
    for (let e=0;e<links.length;e++){
      const i=idx.get(links[e].s)*3, j=idx.get(links[e].t)*3;
      epos[e*6]=pos[i]; epos[e*6+1]=pos[i+1]; epos[e*6+2]=pos[i+2];
      epos[e*6+3]=pos[j]; epos[e*6+4]=pos[j+1]; epos[e*6+5]=pos[j+2];
    }
    egeo.attributes.position.needsUpdate = true;
    if (hlGeo){
      const hp = hlGeo.attributes.position.array;
      hlIdx.forEach((e,k)=>{
        const i=idx.get(links[e].s)*3, j=idx.get(links[e].t)*3;
        hp[k*6]=pos[i]; hp[k*6+1]=pos[i+1]; hp[k*6+2]=pos[i+2];
        hp[k*6+3]=pos[j]; hp[k*6+4]=pos[j+1]; hp[k*6+5]=pos[j+2];
      });
      hlGeo.attributes.position.needsUpdate = true;
    }
    if (!userMoved) graph.rotation.y += .0007;
    if (followI>=0 && selected===followI){
      tgt.lerp(new THREE.Vector3(pos[followI*3],pos[followI*3+1],pos[followI*3+2]), .06);
    } else if (selected>=0){
      tgt.lerp(new THREE.Vector3(pos[selected*3],pos[selected*3+1],pos[selected*3+2]), .06);
    } else {
      tgt.lerp(new THREE.Vector3(0,0,0), .02);
    }
    placeCam();
    // keep selected pulsing
    if (selected>=0){
      const s = 1 + .12*Math.sin(frame*.09);
      meshes[selected].scale.setScalar((1.6+4.4*Math.pow(deg[selected]/maxDeg,.8))*s);
    }
    renderer.render(scene, camera);
  })();
}
</script>
