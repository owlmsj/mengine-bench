<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo das Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080d; --ink:#e9e6df; --dim:#8b8778; --line:#2a2c36;
  --panel:rgba(12,13,20,.82); --accent:#f2c14e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:400 14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
canvas{display:block;position:fixed;inset:0;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:Fraunces,Georgia,serif;font-weight:300;letter-spacing:.01em;
  text-shadow:0 1px 6px #000,0 0 14px #000;will-change:transform}
.lbl.sel{font-weight:600;color:var(--accent)}
.lbl.nb{color:#fff}
.lbl.faded{opacity:.16}
header{position:fixed;top:0;left:0;right:0;padding:18px 22px;z-index:5;
  display:flex;gap:18px;align-items:flex-start;pointer-events:none}
h1{margin:0;font:600 20px/1.1 Fraunces,Georgia,serif;letter-spacing:-.01em}
h1 span{display:block;font:400 11px/1.4 Inter,sans-serif;color:var(--dim);
  letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
#stats{margin-left:auto;text-align:right;color:var(--dim);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase}
#stats b{color:var(--ink);font-weight:500}
#ui{position:fixed;left:22px;bottom:20px;z-index:6;width:min(340px,calc(100vw - 44px))}
#search{position:relative}
#q{width:100%;padding:11px 13px;background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;font:400 15px Inter,sans-serif;
  backdrop-filter:blur(8px);outline:none}
#q:focus{border-color:#5a5443}
#sug{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;backdrop-filter:blur(8px);
  display:none;max-height:230px;overflow-y:auto}
#sug div{padding:7px 12px;cursor:pointer;display:flex;gap:8px;justify-content:space-between}
#sug div i{color:var(--dim);font-style:normal;font-size:11px}
#sug div.on,#sug div:hover{background:#1d2030}
#card{margin-top:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:14px 15px;backdrop-filter:blur(10px);display:none}
#card h2{margin:0;font:600 26px/1.1 Fraunces,Georgia,serif}
#card .tema{font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  margin:6px 0 10px;display:flex;align-items:center;gap:7px}
#card .dot{width:8px;height:8px;border-radius:50%}
#card h3{margin:12px 0 5px;font:500 10px/1 Inter,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;border:1px solid var(--line);border-radius:99px;cursor:pointer;
  font-size:12.5px;background:#12141d}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip small{opacity:.55}
.chip.out{border-left:2px solid var(--accent)}
.chip.in{border-left:2px solid #4e8cf2}
#legend{position:fixed;right:22px;bottom:20px;z-index:6;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;backdrop-filter:blur(10px)}
#legend b{display:block;font:500 10px/1 Inter;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px}
#legend label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:12px;padding:2px 0}
#legend input{display:none}
#legend .sw{width:9px;height:9px;border-radius:50%;flex:none}
#legend label.off{opacity:.32;text-decoration:line-through}
#hint{color:var(--dim);font-size:11px;text-transform:none;letter-spacing:.02em;margin-top:6px}
#err{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--dim);display:none}
@media (max-width:760px){#legend,#hint{display:none}}
</style>
</head>
<body>
<canvas id="c2d"></canvas>
<div id="labels"></div>

<header>
  <h1>Universo das Palavras<span>Dicionário Criativo · mapa de relações</span></h1>
  <div id="stats"></div>
</header>


<div id="ui">
  <div id="card"></div>
  <div id="search">
    <input id="q" placeholder="buscar palavra (ex.: saudade)" autocomplete="off" spellcheck="false">
    <div id="sug"></div>
  </div>
</div>
<div id="legend"><b>Temas</b><span id="themes"></span></div>
<div id="err">a visualização precisa de um navegador com canvas</div>

      ctx.beginPath(); ctx.arc(proj[i*3],proj[i*3+1],Math.max(1,r),0,6.284); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  drawLabels(focus, hasFocus);
}
function col3(c,k){ c.r=Math.min(1,c.r*k); c.g=Math.min(1,c.g*k); c.b=Math.min(1,c.b*k); }
function drawLabels(focus, hasFocus){
  const show = [];
  if (hasFocus) for (const i of focus) show.push(i);
  else { const top = words.map((w,i)=>i).sort((a,b)=>deg[b]-deg[a]);
         for (const i of top) if (visible(i) && show.length<26) show.push(i); }
  if (hov>=0 && !show.includes(hov)) show.push(hov);
  while (labelPool.length < show.length){ const d=document.createElement("div");
    d.className="lbl"; labels.appendChild(d); labelPool.push(d); }
  labelPool.forEach((d,k)=>{
    if (k>=show.length){ d.style.display="none"; return; }
    const i = show[k];
    d.style.display="block";
    d.textContent = words[i];
    d.style.left = Math.max(70, Math.min(W-70, proj[i*3]))+"px";
    d.style.top = Math.max(28, Math.min(H-20, proj[i*3+1] - (10+deg[i]/maxDeg*16))) + "px";
    d.style.fontSize = (12 + deg[i]/maxDeg*15).toFixed(1)+"px";
    d.style.zIndex = 1000 - Math.round(proj[i*3+2]);
    d.className = "lbl" + (i===sel?" sel":"") + (focus.has(i)&&hasFocus?" nb":"") +
                  (hasFocus && !focus.has(i) ? " faded":"");
  });
}
function tick(){
  if (tRotX !== null){
    let dy = tRotY - rotY; while (dy > Math.PI) dy -= 2*Math.PI; while (dy < -Math.PI) dy += 2*Math.PI;
    rotY += dy*0.12; rotX += (tRotX - rotX)*0.12;
    if (Math.abs(dy) < 0.004 && Math.abs(tRotX - rotX) < 0.004){ rotY = tRotY; rotX = tRotX; tRotX = tRotY = null; }
  } else if (autoSpin && !dragging) rotY += spin;
  draw();
  requestAnimationFrame(tick);
}
/* aim the camera at a node so a shared ?word= always lands in view */
function frame(i){
  const x = P[i*3], y = P[i*3+1], z = P[i*3+2];
  const ry = Math.atan2(x, z), z1 = x*Math.sin(ry) + z*Math.cos(ry);
  tRotY = ry; tRotX = Math.max(-1.45, Math.min(1.45, Math.atan2(y, z1)));
}

/* ---------- picking, drag, zoom ---------- */
let dragging=false, moved=0, px=0, py=0;
function pick(mx,my){
  let best=-1, bd=26*26;
  for (let i=0;i<N;i++){ if(!visible(i)) continue;
    const dx=proj[i*3]-mx, dy=proj[i*3+1]-my, d=dx*dx+dy*dy;
    if (d<bd){ bd=d; best=i; } }
  return best;
}
addEventListener("pointerdown", e=>{ if (e.target!==document.body && e.target.tagName!=="CANVAS") return;
  dragging=true; moved=0; px=e.clientX; py=e.clientY; tRotX=tRotY=null; });
addEventListener("pointermove", e=>{
  if (dragging){ const dx=e.clientX-px, dy=e.clientY-py; moved+=Math.abs(dx)+Math.abs(dy);
    rotY += dx*0.006; rotX += dy*0.006; rotX = Math.max(-1.5,Math.min(1.5,rotX));
    px=e.clientX; py=e.clientY; }
  else hov = pick(e.clientX,e.clientY);
});
addEventListener("pointerup", e=>{
  if (dragging && moved<5){ const i = pick(e.clientX,e.clientY); if (i>=0) select(i); else select(-1); }
  dragging=false;
});
addEventListener("wheel", e=>{ zoom = Math.max(.35, Math.min(4, zoom*(e.deltaY<0?1.1:0.9))); }, {passive:true});
addEventListener("keydown", e=>{ if (e.key==="Escape") select(-1); });
addEventListener("resize", ()=>{ W=innerWidth; H=innerHeight;
  canvas.width=W*devicePixelRatio; canvas.height=H*devicePixelRatio;
  if (gl){ gl.renderer.setSize(W,H); gl.cam.aspect=W/H; gl.cam.updateProjectionMatrix(); } });

/* ---------- selection, card, url ---------- */
function esc(s){ return s.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function select(i, push=true){
  sel = i;
  if (i>=0) frame(i);
  const card = document.getElementById("card");
  if (i<0){ card.style.display="none"; }
  else {
    const w = words[i];
    const o = OUT[i].filter(j=>j>=0), n = IN[i].filter(j=>j>=0);
    const chip = (j,cls) => `<span class="chip ${cls}" data-i="${j}" title="${OUT[i].includes(j)?"ligação recíproca":"só neste sentido"}">${esc(words[j])}${OUT[i].includes(j)?"":" <small>↦</small>"}</span>`;
    card.style.display="block";
    card.innerHTML =
      `<h2>${esc(w)}</h2>
       <div class="tema"><span class="dot" style="background:${color[i]}"></span>${esc(themes[w]||"—")} · ${deg[i]} ${deg[i]===1?"ligação":"ligações"}</div>
       <h3>Remete a (${o.length})</h3><div class="chips">${o.map(j=>chip(j,"out")).join("")||"<i>nada declarado</i>"}</div>
       <h3>Citada por (${n.length})</h3><div class="chips">${n.map(j=>chip(j,"in")).join("")||"<i>nada declarado</i>"}</div>`;
    card.querySelectorAll(".chip").forEach(c=>c.onclick=()=>select(+c.dataset.i));
  }
  if (push){
    const url = new URL(location.href);
    if (i<0) url.searchParams.delete("word"); else url.searchParams.set("word", words[i]);
    try { history.replaceState(null,"",url); } catch(e){}
  }
}

/* ---------- search ---------- */
const q = document.getElementById("q"), sug = document.getElementById("sug");
const nwords = words.map(norm);
let hits = [], cur = 0;
function find(word){ const k = norm(word); let i = nwords.indexOf(k);
  if (i<0) i = nwords.findIndex(w=>w.startsWith(k));
  if (i<0) i = nwords.findIndex(w=>w.includes(k));
  return i; }
function update(){
  const k = norm(q.value.trim());
  hits = !k ? [] : words.map((w,i)=>[w.startsWith(k)?0:nwords[i].startsWith(k)?1:nwords[i].includes(k)?2:9,i])
    .filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||deg[b[1]]-deg[a[1]]).slice(0,8).map(x=>x[1]);
  cur = 0;
  sug.style.display = hits.length ? "block" : "none";
  sug.innerHTML = hits.map((i,k)=>`<div data-i="${i}" class="${k===cur?"on":""}">
    <span>${esc(words[i])}</span><i>${deg[i]} · ${esc(themes[words[i]])}</i></div>`).join("");
  sug.querySelectorAll("div").forEach(d=>d.onclick=()=>{ select(+d.dataset.i); q.value=""; sug.style.display="none"; });
}
q.addEventListener("input", update);
q.addEventListener("keydown", e=>{
  if (e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault();
    cur = (cur + (e.key==="ArrowDown"?1:-1) + hits.length) % (hits.length||1); update(); }
  else if (e.key==="Enter"){ const i = hits.length ? hits[cur] : find(q.value.trim());
    if (i>=0){ select(i); q.value=""; sug.style.display="none"; q.blur(); } }
  else if (e.key==="Escape"){ sug.style.display="none"; q.value=""; hits=[]; }
});
q.addEventListener("blur", ()=>setTimeout(()=>sug.style.display="none",120));

/* ---------- legend ---------- */
const legend = document.getElementById("themes");
legend.innerHTML = themeList.map(t=>
  `<label data-t="${esc(t)}"><span class="sw" style="background:${DATA.themeColors[t]}"></span>${esc(t)} · ${DATA.themeCounts[t]}</label>`).join("");
legend.querySelectorAll("label").forEach(l=>l.onclick=()=>{
  const t=l.dataset.t;
  if (off.has(t)) off.delete(t); else off.add(t);
  l.classList.toggle("off", off.has(t));
});

/* ---------- stats + boot ---------- */
document.getElementById("stats").innerHTML =
  `<b>${N}</b> palavras · <b>${edges.length}</b> relações<br>mais ligada: <b>${esc(DATA.mostConnected)}</b> (${DATA.mostConnectedDegree})`;
document.getElementById("stats").insertAdjacentHTML("beforeend",
  `<div id="hint">arraste para girar · roda para aproximar · clique numa palavra<br>↦ = ligação só neste sentido</div>`);
canvas.width = W*devicePixelRatio; canvas.height = H*devicePixelRatio;
const want = new URLSearchParams(location.search).get("word") || location.hash.replace(/^#/,"");
if (want){ const i = find(decodeURIComponent(want)); if (i>=0) select(i,false); }
tick();
</script>
</body>
