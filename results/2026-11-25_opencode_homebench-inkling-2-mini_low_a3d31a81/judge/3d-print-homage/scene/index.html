<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Wave — Low Poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8dcc0;}
  #app{position:fixed;inset:0;}
  .cartouche{
    position:fixed;top:24px;left:26px;z-index:2;
    font-family:'Cormorant Garamond',serif;color:#3a2e22;
    background:rgba(232,220,192,.82);border:1px solid #3a2e22;
    padding:10px 18px;border-radius:2px;max-width:300px;
    box-shadow:2px 2px 0 rgba(58,46,34,.35);
  }
  .cartouche h1{font-size:20px;margin:0 0 4px;font-weight:600;letter-spacing:.06em;}
  .cartouche p{font-size:12px;margin:0;font-style:italic;opacity:.8;}
  .sig{position:fixed;bottom:18px;right:22px;z-index:2;font-family:'Cormorant Garamond',serif;font-style:italic;color:#3a2e22;opacity:.65;font-size:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="cartouche"><h1>The Great Wave</h1><p>after Hokusai &middot; Mount Fuji</p></div>
<div class="sig">— the artist's mark</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const PAL = {
  indigo: 0x2f4d6e, deep: 0x1d3350, seafoam: 0xf2ead8, sky: 0xe8dcc0,
  snow: 0xefe9da, hull: 0x6e4f33, foam: 0xf6f1e4
};

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.sky);
scene.fog = new THREE.Fog(PAL.sky, 90, 220);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 14, 46);
camera.lookAt(-4, 9, 0);

const hemi = new THREE.HemisphereLight(0xfff4e0, 0x2f4d6e, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d6, 1.5);
sun.position.set(-30, 40, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-60; sun.shadow.camera.right=60;
sun.shadow.camera.top=60; sun.shadow.camera.bottom=-60;
scene.add(sun);

const mat = (c, extra={}) => new THREE.MeshStandardMaterial({color:c, flatShading:true, roughness:.9, metalness:0, ...extra});

// sea
const seaGeo = new THREE.PlaneGeometry(220, 160, 40, 30);
const pos = seaGeo.attributes.position;
for(let i=0;i<pos.count;i++){
  const x=pos.getX(i), y=pos.getY(i);
  pos.setZ(i, Math.sin(x*0.16)*Math.cos(y*0.12)*1.4 + Math.sin(x*0.05+y*0.07)*1.2);
}
seaGeo.computeVertexNormals();
const sea = new THREE.Mesh(seaGeo, mat(PAL.indigo));
sea.rotation.x = -Math.PI/2;
sea.receiveShadow = true;
scene.add(sea);

// Mount Fuji — snow-capped cone on horizon, center-low
const fuji = new THREE.Group();
const slope = new THREE.Mesh(new THREE.ConeGeometry(26, 30, 7, 3), mat(0x3d3652));
slope.position.y = 15; slope.castShadow = true;
const cap = new THREE.Mesh(new THREE.ConeGeometry(9.5, 9, 7, 1), mat(PAL.snow, {roughness:.95}));
cap.position.y = 30.4;
cap.scale.y = 0.8;
fuji.add(slope, cap);
fuji.position.set(6, 0, -58);
scene.add(fuji);

// clouds
const clouds = new THREE.Group();
for(let i=0;i<6;i++){
  const c = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 + Math.random()*2.4, 0), mat(0xcfd6cf));
  c.position.set(-46 + Math.random()*90, 26 + Math.random()*12, -45 - Math.random()*15);
  c.scale.y = 0.45;
  c.castShadow = true;
  clouds.add(c);
}
scene.add(clouds);

// Great wave, left — curling mass with foam claws
const wave = new THREE.Group();
const waveBody = new THREE.Mesh(new THREE.ConeGeometry(11, 34, 6, 4), mat(PAL.indigo));
waveBody.position.y = 17;
waveBody.rotation.z = 0.42;
waveBody.castShadow = true;
wave.add(waveBody);
for(let i=0;i<7;i++){
  const foam = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6 + Math.random()*1.6, 0), mat(PAL.foam));
  const t = i/6;
  foam.position.set(-2 - Math.cos(t*2.2)*9.5, 30 + Math.sin(t*2.6)*-4 + t*6, 1.2*Math.sin(t*5));
  foam.scale.set(1.6, 0.9, 1.2);
  foam.castShadow = true;
  wave.add(foam);
}
wave.position.set(-24, 0, -10);
scene.add(wave);

// foreground trough wave
const trough = new THREE.Mesh(new THREE.IcosahedronGeometry(5.5, 1), mat(PAL.deep));
trough.scale.set(1.8, 0.8, 1.4);
trough.position.set(-5, 2.2, 14);
trough.castShadow = true;
scene.add(trough);

// boats — oshiokuri-bune, three, hunched rowers
function makeBoat(){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.CapsuleGeometry(1.5, 5.5, 3, 6), mat(PAL.hull));
  hull.rotation.z = Math.PI/2;
  hull.scale.set(1, 0.75, 0.62);
  hull.castShadow = true;
  g.add(hull);
  const prow = new THREE.Mesh(new THREE.ConeGeometry(1.05, 2.6, 5), mat(PAL.hull));
  prow.rotation.z = -Math.PI/2;
  prow.position.x = 4.6;
  g.add(prow);
  for(let i=-1;i<=2;i++){
    const rower = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 0), mat(0x33302a));
    rower.position.set(i*1.9, 1.15, 0);
    rower.scale.set(1.25, 0.85, 0.9);
    rower.castShadow = true;
    g.add(rower);
  }
  return g;
}
const boats = [];
const boatDefs = [
  {p:[-19, 2.2, 4],  ry: 0.25, s:1.0},
  {p:[-2, 2.6, 12],  ry: -0.15, s:1.15},
  {p:[15, 2.4, 2],   ry: -0.35, s:1.05},
];
for(const d of boatDefs){
  const b = makeBoat();
  b.position.set(...d.p); b.rotation.y = d.ry; b.scale.setScalar(d.s);
  b.userData.y = d.p[1];
  scene.add(b); boats.push(b);
}

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  sea.position.y = Math.sin(t*0.7)*0.35;
  wave.rotation.y = Math.sin(t*0.25)*0.05;
  wave.position.y = Math.sin(t*0.8)*0.4;
  trough.position.y = 2.2 + Math.sin(t*0.9 + 1.4)*0.35;
  boats.forEach((b,i)=>{
    b.position.y = b.userData.y + Math.sin(t*1.1 + i*2.1)*0.4;
    b.rotation.z = Math.sin(t*0.9 + i*1.7)*0.07;
    b.rotation.x = Math.sin(t*0.7 + i)*0.05;
  });
  clouds.children.forEach((c,i)=>{ c.position.x += Math.sin(t*0.2 + i)*0.004; });
  fuji.rotation.y = Math.sin(t*0.1)*0.02;
  renderer.render(scene,camera);
}
tick();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
