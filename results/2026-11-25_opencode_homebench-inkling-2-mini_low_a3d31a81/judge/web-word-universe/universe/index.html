<title>Universo das Palavras — Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{ --ink:#f2ede4; --dim:#9aa3b2; --accent:#e9c46a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0b0f1a; color:var(--ink); font-family:'Inter',system-ui,sans-serif; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }
  .panel{ position:fixed; z-index:10; }
  #header{ top:22px; left:24px; right:24px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
  #brand h1{ font-family:'Fraunces',serif; font-weight:300; font-size:clamp(22px,3.4vw,38px); letter-spacing:.01em; margin:0; line-height:1.05; }
  #brand h1 em{ font-style:italic; color:var(--accent); }
  #brand p{ margin:6px 0 0; font-size:12px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
  #searchbox{ pointer-events:auto; display:flex; align-items:center; gap:10px; background:rgba(13,17,29,.78); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:.55em .55em .55em 1.1em; backdrop-filter:blur(8px); max-width:min(440px,60vw); }
  #searchbox input{ background:transparent; border:0; outline:0; color:var(--ink); font-family:'Inter'; font-size:15px; width:100%; }
  #searchbox input::placeholder{ color:#6b7280; }
  #searchbox button{ background:var(--accent); color:#1a1206; border:0; border-radius:999px; padding:.45em 1.1em; font-weight:600; font-family:'Inter'; cursor:pointer; font-size:13px; }
  #sidecard{ top:92px; right:24px; width:min(330px,88vw); max-height:calc(100vh - 200px); overflow:auto; background:rgba(13,17,29,.82); border:1px solid rgba(255,255,255,.1); border-radius:16px; backdrop-filter:blur(10px); padding:16px 18px; transform:translateX(12px); opacity:0; pointer-events:none; transition:opacity .25s,transform .25s; }
  #sidecard.show{ transform:none; opacity:1; pointer-events:auto; }
  #sidecard .tema{ display:inline-block; font-size:11px; letter-spacing:.12em; text-transform:uppercase; padding:.35em .8em; border-radius:999px; border:1px solid rgba(255,255,255,.18); margin-bottom:.7em; }
  #sidecard h2{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0 0 .3em; letter-spacing:.01em; }
  #sidecard .meta{ color:var(--dim); font-size:12px; margin-bottom:.8em; }
  #sidecard h3{ font-size:10px; text-transform:uppercase; letter-spacing:.18em; color:var(--dim); border-bottom:1px dashed rgba(255,255,255,.12); padding-bottom:.35em; margin:1.1em 0 .5em; }
  #sidecard ul{ list-style:none; margin:0; padding:0; }
  #sidecard li{ padding:.3em 0; border-bottom:1px solid rgba(255,255,255,.05); }
  #sidecard li:last-child{ border:0; }
  #sidecard a{ color:var(--ink); text-decoration:none; font-size:14px; display:inline-flex; align-items:baseline; gap:.5em; }
  #sidecard a:hover{ color:var(--accent); }
  #sidecard .rel{ color:var(--dim); font-size:10px; letter-spacing:.06em; text-transform:uppercase; }
  #legend{ left:24px; bottom:20px; display:flex; gap:10px; flex-wrap:wrap; max-width:70vw; pointer-events:auto; }
  .chip{ display:flex; align-items:center; gap:.45em; font-size:11px; letter-spacing:.04em; color:var(--dim); background:rgba(13,17,29,.7); padding:.4em .7em; border-radius:999px; border:1px solid rgba(255,255,255,.07); }
  .chip i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  #tooltip{ position:fixed; z-index:12; pointer-events:none; background:rgba(10,13,22,.92); border:1px solid rgba(255,255,255,.14); padding:.35em .7em; border-radius:8px; font-size:13px; opacity:0; transition:opacity .12s; white-space:nowrap; }
  #empty{ left:24px; bottom:20px; font-size:12px; color:#5b6478; letter-spacing:.05em; }
  @media (max-width:700px){ #sidecard{ top:auto; bottom:64px; right:12px; left:12px; width:auto; max-height:44vh; } #legend{ max-width:100%; } #header{ left:12px; right:12px; } #searchbox{ max-width:100%; } }
</style>
</head>

<header id="header" class="panel">

    <h1>Universo <em>das</em> Palavras</h1>

  </form>
</header>

<div id="tooltip"></div>

const pointer = new THREE.Vector2();
let dragging = false, lastX=0, lastY=0, moved=0;
const sph = { theta: 0.5, phi: 1.05, r: 92, target: new THREE.Vector3(0,0,0) };
let targetCenter = new THREE.Vector3(0,0,0);
let targetR = 92;

renderer.domElement.addEventListener('pointerdown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; moved=0; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove', e=>{
  if (dragging){
    const dx = e.clientX-lastX, dy = e.clientY-lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx)+Math.abs(dy);
    sph.theta -= dx*0.005;
    sph.phi = Math.max(0.15, Math.min(Math.PI-0.15, sph.phi - dy*0.004));
  } else {
    pointer.x = (e.clientX/innerWidth)*2-1;
    pointer.y = -(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(points);
    const oldHover = hovered;
    hovered = hits.length ? words[hits[0].index] : null;
    if (hovered !== oldHover){
      if (hovered){
        tooltip.textContent = hovered;
        tooltip.style.opacity = 1;
      } else tooltip.style.opacity = 0;
    }
    if (hovered){
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 10) + 'px';
    }
  }
});
renderer.domElement.addEventListener('pointerup', e=>{
  dragging=false;
  if (moved < 6){
    pointer.x = (e.clientX/innerWidth)*2-1;
    pointer.y = -(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObject(points);
    if (hits.length){
      select(words[hits[0].index], true);
    } else if (e.target === renderer.domElement){
      closeCard();
    }
  }
});
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  targetR = Math.max(20, Math.min(190, targetR * (1 + e.deltaY*0.001)));
}, { passive:false });

  for (const t of targets){
    const q = positions[t];
    hp.push(p[0],p[1],p[2], q[0],q[1],q[2]);
  }
  hlEdgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(hp,3));
  hlEdges.visible = true;
  // highlight points
  const np = [], nc = [], ns = [];
  const cSel = new THREE.Color('#ffe9a3');
  const ca = new THREE.Color(temaColor[wordData[word].tema]);
  np.push(p[0],p[1],p[2]); nc.push(cSel.r,cSel.g,cSel.b); ns.push(2.6);
  for (const t of targets){
    const q = positions[t];
    const c = new THREE.Color(temaColor[wordData[t].tema]);
    np.push(q[0],q[1],q[2]); nc.push(c.r,c.g,c.b); ns.push(1.7 + Math.min(deg[t],20)*0.12);
  }
  hlGeo.setAttribute('position', new THREE.Float32BufferAttribute(np,3));
  hlGeo.setAttribute('color', new THREE.Float32BufferAttribute(nc,3));
  hlGeo.setAttribute('size', new THREE.Float32BufferAttribute(ns,1));
  hlPoints.visible = true;
  renderCard(word);
  history.replaceState(null,'','?word='+encodeURIComponent(word));
}

function closeCard(){
  selected = null;
  hlEdges.visible = false;
  hlPoints.visible = false;
  targetCenter.set(0,0,0);
  targetR = 92;
  sidecard.classList.remove('show');
  history.replaceState(null,'',location.pathname);
}

function renderCard(word){
  const wd = wordData[word];
  const ts = temaColor[wd.tema];
  const nSyn = wd.links.filter(l=>l.type==='sinonimos').length;
  const nAna = wd.links.filter(l=>l.type==='analogas').length;
  let html = `<span class="tema" style="color:${ts};border-color:${ts}">${wd.tema}</span>
    <h2>${word}</h2>
    <div class="meta">${flat[word].length} ligação${flat[word].length===1?'':'s'} · ${nSyn} sinônimos · ${nAna} análogas</div>
    <h3>Sinônimos</h3><ul>`;
  const syn = wd.links.filter(l=>l.type==='sinonimos');
  if (!syn.length) html += `<li class="rel">—</li>`;
  for (const l of syn) html += `<li><a href="#" data-w="${encodeURIComponent(l.target)}">${l.target}</a></li>`;
  html += `</ul><h3>Palavras análogas</h3><ul>`;
  const ana = wd.links.filter(l=>l.type==='analogas');
  if (!ana.length) html += `<li class="rel">—</li>`;
  for (const l of ana) html += `<li><a href="#" data-w="${encodeURIComponent(l.target)}">${l.target}</a></li>`;
  html += `</ul>`;
  sidecard.innerHTML = html;
  sidecard.classList.add('show');
  sidecard.querySelectorAll('a[data-w]').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      select(decodeURIComponent(a.dataset.w), false);
    });
  });
  sidecard.querySelectorAll('ul li').forEach(li=>{
    const a = li.querySelector('a');
    if (a) a.title = 'Na palavra';
  });
}

document.getElementById('searchbox').addEventListener('submit', e=>{
  e.preventDefault();
  const v = searchInput.value.trim();
  if (!v) return;
  const lower = v.toLowerCase();
  let exact = words.find(w=>w.toLowerCase()===lower);
  if (!exact) exact = words.find(w=>w.toLowerCase().includes(lower));
  if (exact){ searchInput.value = exact; select(exact, true); }
  else { searchInput.select(); }
});

// animation
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  sph.theta += 0.0016;
  camera.position.x += (targetCenter.x + sph.r*Math.sin(sph.phi)*Math.cos(sph.theta) - camera.position.x)*0.08;
  camera.position.y += (targetCenter.y + sph.r*Math.cos(sph.phi) - camera.position.y)*0.08;
  camera.position.z += (targetCenter.z + sph.r*Math.sin(sph.phi)*Math.sin(sph.theta) - camera.position.z)*0.08;
  camera.lookAt(targetCenter);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  const s = innerHeight*0.9;
  ptMat.uniforms.uScale.value = s;
  hlMat.uniforms.uScale.value = s;
});

// initial selection from query
const q = new URLSearchParams(location.search).get('word');
if (q){
  const lower = q.toLowerCase();
  let w = words.find(x=>x.toLowerCase()===lower);
  if (!w) w = words.find(x=>x.toLowerCase().includes(lower));
  if (w){
    searchInput.value = w;
    select(w, true);
  }
}
</script>
