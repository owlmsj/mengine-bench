<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070a14;
    --panel: rgba(13, 17, 32, 0.82);
    --line: rgba(255, 255, 255, 0.09);
    --text: #ece7de;
    --muted: #9aa1b5;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Space Grotesk", system-ui, sans-serif;
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; display: block; cursor: grab; }
  #scene:active { cursor: grabbing; }

  .ui { position: fixed; z-index: 10; }
  header.ui {
    top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 18px;
    padding: 14px 22px;
    background: linear-gradient(to bottom, rgba(7,10,20,0.92), rgba(7,10,20,0));
    pointer-events: none;
  }
  header.ui > * { pointer-events: auto; }
  .brand { line-height: 1.1; }
  .brand h1 {
    margin: 0;
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: 0.2px;
  }
  .brand p { margin: 2px 0 0; font-size: 11px; color: var(--muted); letter-spacing: 0.4px; text-transform: uppercase; }

  .stats { display: flex; gap: 8px; margin-left: auto; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--text);
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  .chip b { color: var(--accent); font-weight: 600; }

  .search {
    position: fixed; top: 78px; left: 22px; z-index: 11;
    width: 320px;
  }
  .search input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    backdrop-filter: blur(10px);
    outline: none;
    transition: border-color .2s;
  }
  .search input:focus { border-color: rgba(255, 209, 102, 0.5); }
  .search input::placeholder { color: var(--muted); }
  .suggest {
    margin-top: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    display: none;
  }
  .suggest.open { display: block; }
  .suggest button {
    display: flex; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left;
    background: transparent; border: 0;
    color: var(--text);
    padding: 9px 14px;
    font-family: inherit; font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
  }
  .suggest button:last-child { border-bottom: 0; }
  .suggest button:hover { background: rgba(255,255,255,0.07); }
  .suggest button small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

  .legend {
    position: fixed; right: 20px; top: 78px; z-index: 10;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 12px 14px;
    backdrop-filter: blur(10px);
    max-height: calc(100vh - 200px); overflow: auto;
    width: 176px;
  }
  .legend h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .legend button {
    display: flex; align-items: center; gap: 8px;
    width: 100%; background: transparent; border: 0;
    color: var(--text); font-family: inherit; font-size: 13px;
    padding: 5px 6px; border-radius: 8px; cursor: pointer;
  }
  .legend button:hover { background: rgba(255,255,255,0.06); }
  .legend button.active { background: rgba(255,255,255,0.1); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
  .legend .cnt { margin-left: auto; color: var(--muted); font-size: 11px; }

  .panel {
    position: fixed; bottom: 20px; left: 22px; z-index: 10;
    width: 380px; max-height: 46vh;
    overflow: auto;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 18px 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .panel h2 {
    font-family: "Fraunces", serif;
    font-size: 26px; margin: 0 0 4px; font-weight: 700;
    word-break: break-word;
  }
  .panel .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .theme-chip {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid var(--line);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .theme-chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .degree { font-size: 12px; color: var(--muted); }
  .panel .hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .link-chip {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 13px;
    font-family: inherit; font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .link-chip:hover { background: rgba(255,209,102,0.18); border-color: rgba(255,209,102,0.45); }
  .panel .top { margin-top: 8px; }
  .panel .top h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); margin: 14px 0 6px; font-weight: 600; }

  .labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .label {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 13px; font-weight: 600;
    color: #fff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.85);
    white-space: nowrap;
    background: rgba(7,10,20,0.6);
    padding: 2px 9px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(3px);
  }
  .label.small { font-size: 11px; font-weight: 500; opacity: 0.95; padding: 1px 7px; }

  .note { position: fixed; bottom: 18px; right: 22px; z-index: 9; font-size: 11px; color: var(--muted); text-align: right; line-height: 1.5; }

  @media (max-width: 900px) {
    .legend { display: none; }
    .panel { width: calc(100vw - 32px); left: 16px; right: 16px; bottom: 12px; max-height: 42vh; }
    .search { width: calc(100vw - 32px); left: 16px; }
    .stats .chip.hide-m { display: none; }
    .note { display: none; }
  }
</style>
</head>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const DATA = JSON.parse(document.getElementById('universe-data').textContent);
const WORDS = DATA.words;
const EDGES = DATA.edges;
const IDX = new Map(WORDS.map((w, i) => [w.id, i]));
const byId = new Map(WORDS.map(w => [w.id, w]));
const THEMES = {};
for (const w of WORDS) (THEMES[w.theme] = THEMES[w.theme] || []).push(w.id);
for (const t of Object.keys(THEMES)) THEMES[t].sort();

const PALETTE = {
  "linguagem": "#6ea8fe",
  "ofícios": "#f4a261",
  "comida": "#e76f51",
  "sentimentos": "#f27bb0",
  "lugares": "#2ec4b6",
  "corpo": "#a879f5",
  "tempo": "#f2d13d",
  "natureza": "#5ec26a",
  "artes": "#ff70a6",
  "família": "#c4a35f"
};
const themeColor = t => PALETTE[t] || "#9aa1b5";

const stats = {
  words: WORDS.length,
  relations: EDGES.length,
};
const deg = new Map(WORDS.map(w => [w.id, 0]));
for (const [a, b] of EDGES) { deg.set(a, deg.get(a) + 1); deg.set(b, deg.get(b) + 1); }
let most = null, mostDeg = -1;
for (const [k, d] of deg) { if (d > mostDeg) { mostDeg = d; most = k; } }

document.getElementById('stats').innerHTML =
  `<span class="chip"><b>${stats.words}</b> palavras</span>` +
  `<span class="chip"><b>${stats.relations}</b> relações</span>` +
  `<span class="chip hide-m">mais conectada: <b>${byId.get(most).display}</b></span>`;

// ---- three setup
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x070a14, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x070a14, 0.055);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 5.6);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const dir = new THREE.DirectionalLight(0xffffff, 1.1);
dir.position.set(3, 4, 5);
scene.add(dir);

// starfield
{
  const count = 900;
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
    const r = 12 + Math.random() * 18;
    const s = Math.sqrt(1 - u * u);
    pos[i*3] = r * s * Math.cos(th);
    pos[i*3+1] = r * s * Math.sin(th);
    pos[i*3+2] = r * u;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ color: 0x8f9bb8, size: 0.035, transparent: true, opacity: 0.75, sizeAttenuation: true });
  scene.add(new THREE.Points(g, m));
}

// nodes + edges
const group = new THREE.Group();
scene.add(group);

const nodeGeo = new THREE.SphereGeometry(1, 18, 14);
const nodes = [];
WORDS.forEach((w, i) => {
  const d = deg.get(w.id);
  const r = 0.055 + Math.min(d, 20) * 0.0085;
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(themeColor(w.theme)),
    emissive: new THREE.Color(themeColor(w.theme)),
    emissiveIntensity: 0.22,
    roughness: 0.35,
    metalness: 0.1,
    transparent: true,
    opacity: 1
  });
  const mesh = new THREE.Mesh(nodeGeo, mat);
  mesh.position.set(w.pos[0], w.pos[1], w.pos[2]);
  mesh.scale.setScalar(r);
  mesh.userData = { id: w.id, degree: d };
  group.add(mesh);
  nodes.push(mesh);
});

const edgeMat = new THREE.LineBasicMaterial({ color: 0x8fa0c9, transparent: true, opacity: 0.16, depthWrite: false });
const edgeGeo = new THREE.BufferGeometry();
const edgePos = new Float32Array(EDGES.length * 6);
EDGES.forEach(([a, b], i) => {
  const wa = byId.get(a), wb = byId.get(b);
  edgePos[i*6] = wa.pos[0]; edgePos[i*6+1] = wa.pos[1]; edgePos[i*6+2] = wa.pos[2];
  edgePos[i*6+3] = wb.pos[0]; edgePos[i*6+4] = wb.pos[1]; edgePos[i*6+5] = wb.pos[2];
});
edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgePos, 3));
const edgesLines = new THREE.LineSegments(edgeGeo, edgeMat);
group.add(edgesLines);

const hiEdgeMat = new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.95, depthWrite: false });
const hiEdgeGeo = new THREE.BufferGeometry();
hiEdgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
const hiEdgeLines = new THREE.LineSegments(hiEdgeGeo, hiEdgeMat);
group.add(hiEdgeLines);

// ---- interaction state
let selectedId = null;
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function showSelection(id) {
  selectedId = id;
  const w = byId.get(id);
  const keep = new Set([id, ...w.links]);
  nodes.forEach(m => {
    const on = keep.has(m.userData.id);
    m.material.opacity = on ? 1 : 0.16;
    m.material.emissiveIntensity = on ? 0.9 : 0.18;
    m.material.needsUpdate = true;
  });
  // highlight edges
  const pts = [];
  for (const [a, b] of EDGES) {
    if (a === id || b === id) {
      const wa = byId.get(a), wb = byId.get(b);
      pts.push(wa.pos[0], wa.pos[1], wa.pos[2], wb.pos[0], wb.pos[1], wb.pos[2]);
    }
  }
  hiEdgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
  edgeMat.opacity = 0.05;
  highlightLabels(id, keep);
  renderPanel(id);
  history.replaceState(null, '', '?word=' + encodeURIComponent(id));
}

function clearSelection() {
  selectedId = null;
  nodes.forEach(m => {
    m.material.opacity = 1; m.material.emissiveIntensity = 0.22; m.material.needsUpdate = true;
    m.scale.setScalar(0.055 + Math.min(m.userData.degree, 20) * 0.0085);
  });
  hiEdgeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
  edgeMat.opacity = 0.16;
  document.getElementById('labels').innerHTML = '';
  renderPanel(null);
  const url = new URL(location.href); url.search = '';
  history.replaceState(null, '', url.toString());
}

const labelDivs = [];
function highlightLabels(id, keep) {
  const wrap = document.getElementById('labels');
  wrap.innerHTML = '';
  labelDivs.length = 0;
  const w = byId.get(id);
  for (const lid of [id, ...w.links]) {
    const lw = byId.get(lid);
    const div = document.createElement('div');
    div.className = 'label' + (lid === id ? '' : ' small');
    div.textContent = lw.display;
    div.style.setProperty('--c', themeColor(lw.theme));
    div.style.borderColor = 'rgba(255,255,255,0.18)';
    wrap.appendChild(div);
    labelDivs.push({ div, id: lid });
  }
}

// labels update each frame
const v = new THREE.Vector3();
function updateLabels() {
  for (const { div, id } of labelDivs) {
    const w = byId.get(id);
    v.set(w.pos[0], w.pos[1], w.pos[2]);
    v.applyMatrix4(group.matrixWorld);
    v.project(camera);
    const x = (v.x * 0.5 + 0.5) * innerWidth;
    const y = (-v.y * 0.5 + 0.5) * innerHeight;
    const behind = v.z > 1;
    div.style.display = behind ? 'none' : 'block';
    div.style.left = x + 'px';
    div.style.top = (y - 26) + 'px';
  }
}

// panel
const panel = document.getElementById('panel');
function renderPanel(id) {
  if (!id) {
    const top = [...deg.entries()].sort((a,b)=>b[1]-a[1]).slice(0, 6);
    panel.innerHTML = `
      <h2>Todos os sentidos</h2>
      <div class="meta"><span class="degree">${stats.words} palavras · ${stats.relations} relações</span></div>
      <p class="hint">Busque uma palavra acima ou clique num nó do mapa. A palavra mais conectada é <b style="color:var(--accent)">${byId.get(most).display}</b> com ${mostDeg} relações.</p>
      <div class="top"><h3>Mais conectadas</h3><div class="chips">
        ${top.map(([k, d]) => `<button class="link-chip" data-id="${k}">${byId.get(k).display} <span style="color:var(--muted)">· ${d}</span></button>`).join('')}
      </div></div>`;
  } else {
    const w = byId.get(id);
    const d = deg.get(id);
    panel.innerHTML = `
      <h2>${w.display}</h2>
      <div class="meta">
        <span class="theme-chip"><i style="background:${themeColor(w.theme)};color:${themeColor(w.theme)}"></i>${w.theme}</span>
        <span class="degree">${d} ${d === 1 ? 'relação' : 'relações'}</span>
      </div>
      <div class="chips">
        ${w.links.map(l => `<button class="link-chip" data-id="${l}">${byId.get(l).display}</button>`).join('')}
      </div>
      <p class="hint">Dica: clique num chip para seguir o laço, ou limpe a busca (Esc) para ver o mapa inteiro.</p>
    `;
  }
}

// search
const q = document.getElementById('q');
const suggest = document.getElementById('suggest');
function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function matches(term) {
  const t = norm(term.trim());
  if (!t) return [];
  return WORDS.filter(w => norm(w.display).includes(t) || norm(w.id).includes(t)).slice(0, 8);
}
function renderSuggest(list) {
  if (!list.length) { suggest.classList.remove('open'); suggest.innerHTML = ''; return; }
  suggest.innerHTML = list.map(w => `<button data-id="${w.id}">${w.display}<small>${w.theme}</small></button>`).join('');
  suggest.classList.add('open');
  suggest.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    selectFromSearch(b.dataset.id);
  }));
}
function selectFromSearch(id) {
  q.value = byId.get(id).display;
  suggest.classList.remove('open');
  suggest.innerHTML = '';
  showSelection(id);
  q.blur();
}
q.addEventListener('input', () => renderSuggest(matches(q.value)));
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const list = matches(q.value);
    if (list.length) selectFromSearch(list[0].id);
  } else if (e.key === 'Escape') {
    q.value = ''; suggest.classList.remove('open'); suggest.innerHTML = ''; clearSelection(); q.blur();
  } else if (e.key === 'ArrowDown') {
    const btns = [...suggest.querySelectorAll('button')];
    if (btns.length) { btns[0].focus(); e.preventDefault(); }
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search')) suggest.classList.remove('open');
});

// legend
const legend = document.getElementById('legend');
let activeTheme = null;
function renderLegend() {
  const themes = Object.keys(THEMES).sort();
  legend.innerHTML = '<h2>Temas</h2>' + themes.map(t =>
    `<button data-theme="${t}" class="${activeTheme === t ? 'active' : ''}"><span class="dot" style="background:${themeColor(t)};color:${themeColor(t)}"></span>${t}<span class="cnt">${THEMES[t].length}</span></button>`
  ).join('');
  legend.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.theme;
    activeTheme = activeTheme === t ? null : t;
    applyThemeFilter();
    renderLegend();
  }));
}
function applyThemeFilter() {
  nodes.forEach(m => {
    const w = byId.get(m.userData.id);
    const on = !activeTheme || w.theme === activeTheme;
    if (selectedId) return; // selection takes precedence
    m.material.opacity = on ? 1 : 0.08;
    m.material.emissiveIntensity = on ? 0.22 : 0.05;
  });
  if (!selectedId) edgeMat.opacity = activeTheme ? 0.06 : 0.16;
}
renderLegend();

// ---- camera controls
let theta = 0.55, phi = 1.15, radius = 5.6;
let target = new THREE.Vector3(0, 0, 0);
let targetGoal = new THREE.Vector3(0, 0, 0);
let radiusGoal = radius, thetaGoal = theta, phiGoal = phi;
let dragging = false, moved = 0, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  lastX = e.clientX; lastY = e.clientY;
  thetaGoal -= dx * 0.005;
  phiGoal = Math.max(0.15, Math.min(Math.PI - 0.15, phiGoal - dy * 0.005));
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  if (moved < 6) pick(e);
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  radiusGoal = Math.max(2.4, Math.min(14, radiusGoal + e.deltaY * 0.004));
}, { passive: false });

function pick(e) {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(nodes, false);
  if (hits.length) {
    showSelection(hits[0].object.userData.id);
  } else {
    clearSelection();
  }
}

function focusOn(id) {
  const w = byId.get(id);
  const p = new THREE.Vector3(w.pos[0], w.pos[1], w.pos[2]);
  targetGoal.copy(p);
  radiusGoal = Math.max(2.6, radiusGoal * 0.82);
}
const origShow = showSelection;
// wrap: also focus camera
function selectAndFocus(id) {
  origShow(id);
  focusOn(id);
}
document.getElementById('panel').addEventListener('click', e => {
  const b = e.target.closest('.link-chip');
  if (b) selectAndFocus(b.dataset.id);
});
// replace the click handler that just calls showSelection
// (panel buttons re-bound above; the earlier bind focuses too via this listener)

canvas.addEventListener('dblclick', () => { targetGoal.set(0,0,0); radiusGoal = 5.6; });

// ---- loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  theta += (thetaGoal - theta) * 0.08;
  phi += (phiGoal - phi) * 0.08;
  radius += (radiusGoal - radius) * 0.08;
  target.lerp(targetGoal, 0.09);

  const sinPhi = Math.sin(phi);
  camera.position.set(
    target.x + radius * sinPhi * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * sinPhi * Math.cos(theta)
  );
  camera.lookAt(target);

  group.rotation.y = Math.sin(t * 0.05) * 0.06;

  nodes.forEach((m, i) => {
    const base = 0.055 + Math.min(m.userData.degree, 20) * 0.0085;
    let s;
    if (selectedId) {
      const w = byId.get(m.userData.id);
      const sel = byId.get(selectedId);
      const keep = sel.links.includes(m.userData.id);
      s = m.userData.id === selectedId ? base * 1.7 : (keep ? base * 1.35 : base * 0.85);
    } else s = base;
    m.scale.setScalar(s * (1 + Math.sin(t * 1.6 + i) * 0.04));
  });

  updateLabels();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// init from URL
const urlId = new URL(location.href).searchParams.get('word');
if (urlId) {
  const id = norm(urlId).trim();
  const found = WORDS.find(w => norm(w.id) === id || norm(w.display) === id);
  if (found) { selectAndFocus(found.id); q.value = found.display; }
}
renderPanel(selectedId);
</script>
