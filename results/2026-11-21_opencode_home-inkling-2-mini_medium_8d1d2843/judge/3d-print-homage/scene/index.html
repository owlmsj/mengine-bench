<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Wave off Kanagawa — Low Poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2e8ce; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .caption {
    position: fixed; left: 28px; bottom: 24px; pointer-events: none;
    color: #24303e; font-family: 'Cormorant Garamond', Georgia, serif;
    text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .caption h1 { margin: 0; font-size: clamp(22px, 3.4vw, 40px); font-weight: 600; letter-spacing: .02em; }
  .caption p { margin: 4px 0 0; font-style: italic; font-size: clamp(12px, 1.35vw, 17px); color: #4a5462; letter-spacing: .12em; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">
  <h1>The Great Wave off Kanagawa</h1>
  <p>Fugaku Sanjūrokkei &middot; Kanagawa-oki Nami-ura &middot; after Hokusai</p>
</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- palette (from the print) ----------
const C = {
  indigo: 0x2b4a6e,   // deep wave body
  indigoDark: 0x1c3350,
  mid: 0x3f6188,
  foam: 0xf6f1e2,     // off-white foam / paper
  cream: 0xf2e6c9,    // warm sky top
  horizon: 0x9aa7b4,  // grey-blue near horizon
  tan: 0xcfa878,      // wood hulls
  tanDark: 0x8a6742,
  grey: 0x6e7681,     // mountain body
  white: 0xffffff,
  blue: 0x35567a,     // rowers' garments
  skin: 0xe8c39a
};

// ---------- renderer / scene / camera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd9d3bd, 60, 190);

// gradient sky via canvas texture
{
  const cv = document.createElement('canvas'); cv.width = 16; cv.height = 256;
  const g = cv.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, '#f6e9c6');   // cream top
  grad.addColorStop(0.45, '#e8d9ae');
  grad.addColorStop(0.62, '#b9bfae');
  grad.addColorStop(0.78, '#8d9aa8');   // grey-blue horizon
  grad.addColorStop(1.0, '#5f7288');
  g.fillStyle = grad; g.fillRect(0, 0, 16, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 400);
camera.position.set(2, 8.5, 34);
camera.lookAt(-2, 8, -10);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xf6e9c6, 0x2b4a6e, 0.9));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.35);
sun.position.set(18, 30, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 200;
scene.add(sun);
const rim = new THREE.DirectionalLight(0xbcd0e8, 0.5);
rim.position.set(-25, 12, -30);
scene.add(rim);

// ---------- ocean ----------
const oceanGeo = new THREE.PlaneGeometry(320, 300, 72, 60);
oceanGeo.rotateX(-Math.PI / 2);
const ocean = new THREE.Mesh(oceanGeo, new THREE.MeshStandardMaterial({
  color: C.indigo, roughness: 0.85, metalness: 0.05, flatShading: true
}));
ocean.position.y = 0;
ocean.receiveShadow = true;
scene.add(ocean);
const oceanBase = oceanGeo.attributes.position.array.slice();

// ---------- background swells (mid ridges) ----------
function swell(x, z, w, h, mat) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(w, 7, 5, 0, Math.PI * 2, 0, Math.PI / 2), mat);
  m.scale.set(1, h / w, 0.55);
  m.position.set(x, -0.4, z);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}
const swellMat = new THREE.MeshStandardMaterial({ color: C.mid, roughness: 0.8, flatShading: true });
swell(-40, -52, 34, 9, swellMat);
swell(46, -60, 40, 11, swellMat);
swell(0, -78, 60, 13, swellMat);

// ---------- mountain (Mount Fuji) ----------
const mountain = new THREE.Group();
const mtBody = new THREE.Mesh(new THREE.ConeGeometry(11, 11, 7), new THREE.MeshStandardMaterial({ color: C.grey, flatShading: true, roughness: 1 }));
mtBody.position.y = 5.5;
const snow = new THREE.Mesh(new THREE.ConeGeometry(4.6, 4.6, 7), new THREE.MeshStandardMaterial({ color: C.white, flatShading: true, roughness: 0.9 }));
snow.position.y = 9.6;
mountain.add(mtBody, snow);
mountain.position.set(13, 0, -74);
mountain.rotation.y = 0.4;
mountain.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(mountain);

// ---------- giant wave (curling curl) ----------
const wave = new THREE.Group();
// curved shell: open cylinder segment with flat shading
const shellGeo = new THREE.CylinderGeometry(26, 26, 26, 40, 14, true, Math.PI * 0.42, Math.PI * 0.72);
const shell = new THREE.Mesh(shellGeo, new THREE.MeshStandardMaterial({
  color: C.indigo, roughness: 0.62, metalness: 0.06, flatShading: true, side: THREE.DoubleSide
}));
shell.material.color.set(C.indigo);
// twist/curl the shell vertices: pull top edge forward to make the claw
{
  const pos = shellGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const t = (y + 13) / 26; // 0 bottom -> 1 top
    const curl = Math.pow(t, 2.2) * 7.5;
    pos.setX(i, x + curl * Math.cos(Math.atan2(z, x) - Math.PI * 0.5));
    pos.setZ(i, z + curl * Math.sin(Math.atan2(z, x) - Math.PI * 0.5));
  }
  pos.needsUpdate = true;
  shellGeo.computeVertexNormals();
}
shell.castShadow = true;
wave.add(shell);

// dark inner shading band
const shellInner = new THREE.Mesh(shellGeo.clone(), new THREE.MeshStandardMaterial({
  color: C.indigoDark, roughness: 0.7, flatShading: true, side: THREE.BackSide
}));
shellInner.scale.setScalar(0.985);
wave.add(shellInner);

// foam claws along the crest
const foam = new THREE.Group();
const foamMat = new THREE.MeshStandardMaterial({ color: C.foam, roughness: 0.9, flatShading: true });
const clawSpots = [-11, -7.5, -4, -0.8, 2.6, 6.2, 9.4];
for (const ox of clawSpots) {
  const claw = new THREE.Mesh(new THREE.ConeGeometry(1.5, 5.2, 5), foamMat);
  const a = Math.PI * 0.5 + ox * 0.062;
  const r = 26;
  claw.position.set(Math.cos(a) * r + 7.0, 13.2, Math.sin(a) * r + 2.0);
  claw.rotation.z = Math.PI * 0.5 + ox * 0.05;
  claw.rotation.x = 0.35;
  claw.scale.set(1.0, 1.0 + (Math.abs(ox) % 3) * 0.12, 0.55);
  claw.castShadow = true;
  foam.add(claw);
}
// big lip over the top
const lip = new THREE.Mesh(new THREE.TorusGeometry(13.4, 2.1, 6, 18, Math.PI * 0.62), foamMat);
lip.position.set(0, 12.6, 2.2);
lip.rotation.set(Math.PI / 2.25, 0, Math.PI * 0.06);
lip.scale.set(1.05, 1, 0.55);
lip.castShadow = true;
foam.add(lip);
wave.add(foam);

wave.position.set(-24, 0, -30);
wave.rotation.set(0.05, 0.55, -0.10);
scene.add(wave);

// foreground small curling wave (lower-left)
const smallWave = new THREE.Group();
const swShell = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 13, 18, 8, true, Math.PI * 0.45, Math.PI * 0.6), new THREE.MeshStandardMaterial({ color: C.mid, roughness: 0.65, flatShading: true, side: THREE.DoubleSide }));
swShell.castShadow = true;
const swCrest = new THREE.Mesh(new THREE.TorusGeometry(6.6, 1.5, 5, 12, Math.PI * 0.6), foamMat);
swCrest.rotation.set(Math.PI / 2.2, 0, 0.5);
swCrest.position.y = 6.4;
smallWave.add(swShell, swCrest);
smallWave.position.set(-44, 0, 6);
smallWave.rotation.y = 0.7;
scene.add(smallWave);

// ---------- spray droplets ----------
const sprayCount = 90;
const sprayGeo = new THREE.SphereGeometry(0.32, 5, 4);
const sprayMat = new THREE.MeshStandardMaterial({ color: C.foam, roughness: 0.9 });
const spray = new THREE.InstancedMesh(sprayGeo, sprayMat, sprayCount);
const sprayData = [];
for (let i = 0; i < sprayCount; i++) {
  sprayData.push({
    x: -24 + (Math.random() - 0.5) * 46,
    y: 6 + Math.random() * 26,
    z: -30 + (Math.random() - 0.5) * 22,
    s: 0.4 + Math.random() * 1.5,
    vy: 0.008 + Math.random() * 0.02,
    ph: Math.random() * Math.PI * 2
  });
}
scene.add(spray);

// ---------- boats ----------
function makeBoat() {
  const boat = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.85, 1.35), new THREE.MeshStandardMaterial({ color: C.tan, flatShading: true, roughness: 0.85 }));
  hull.position.y = 0.45;
  hull.castShadow = true;
  boat.add(hull);
  const rimGeo = new THREE.CylinderGeometry(0.28, 0.28, 5.6, 5);
  rimGeo.rotateZ(Math.PI / 2);
  const rimBar = new THREE.Mesh(rimGeo, new THREE.MeshStandardMaterial({ color: C.tanDark, flatShading: true }));
  rimBar.position.y = 0.95;
  boat.add(rimBar);
  // tapered ends
  for (const s of [-1, 1]) {
    const end = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.6, 5), new THREE.MeshStandardMaterial({ color: C.tanDark, flatShading: true }));
    end.rotation.z = s * -Math.PI / 2;
    end.position.set(s * 2.95, 0.5, 0);
    end.castShadow = true;
    boat.add(end);
  }
  // huddled rowers
  const rows = 7;
  for (let i = 0; i < rows; i++) {
    const x = -2.2 + i * 0.73;
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.95, 5), new THREE.MeshStandardMaterial({ color: C.blue, flatShading: true, roughness: 0.9 }));
    body.position.set(x, 1.35, 0);
    body.castShadow = true;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 6, 5), new THREE.MeshStandardMaterial({ color: C.skin, flatShading: true }));
    head.position.set(x, 1.92, 0.05);
    boat.add(body, head);
  }
  return boat;
}
const boats = [];
const boatSpecs = [
  { pos: [-30, 0.6, -16], rotY: 0.35, scale: 1.15 },   // under the wave's curl
  { pos: [3, 0.6, -6], rotY: -0.28, scale: 1.0 },      // lower center-right
  { pos: [24, 0.5, -34], rotY: -0.5, scale: 0.8 }      // further back right
];
for (const s of boatSpecs) {
  const b = makeBoat();
  b.position.set(...s.pos);
  b.rotation.y = s.rotY;
  b.scale.setScalar(s.scale);
  scene.add(b);
  boats.push({ group: b, baseY: s.pos[1], phase: Math.random() * Math.PI * 2 });
}

// ---------- clouds ----------
const clouds = [];
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xf8f4e6, roughness: 1, flatShading: true });
for (const [x, y, z, s] of [[-30, 32, -95, 7], [24, 38, -100, 9], [-4, 44, -110, 6]]) {
  const c = new THREE.Group();
  for (const [ox, oy, sc] of [[0, 0, 1], [3.4, 0.6, 0.72], [-3.2, 0.4, 0.66]]) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(s * sc, 6, 5), cloudMat);
    p.scale.set(1.5, 0.62, 1);
    p.position.set(ox, oy, 0);
    c.add(p);
  }
  c.position.set(x, y, z);
  scene.add(c);
  clouds.push({ group: c, speed: 0.16 + Math.random() * 0.2 });
}

// ---------- animation ----------
const clock = new THREE.Clock();
const dummy = new THREE.Object3D();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // ocean ripple
  const pos = oceanGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = oceanBase[i * 3], z = oceanBase[i * 3 + 2];
    pos.setY(i, Math.sin(x * 0.14 + t * 1.15) * 0.55 + Math.cos(z * 0.11 + t * 0.85) * 0.45 + Math.sin((x + z) * 0.05 + t * 0.5) * 0.35);
  }
  pos.needsUpdate = true;
  oceanGeo.computeVertexNormals();

  // wave sway + foam breathing
  wave.rotation.z = -0.10 + Math.sin(t * 0.5) * 0.03;
  wave.rotation.x = 0.05 + Math.sin(t * 0.34) * 0.02;
  foam.position.y = Math.sin(t * 0.9) * 0.35;
  foam.rotation.z = Math.sin(t * 0.45) * 0.02;
  smallWave.rotation.y = 0.7 + Math.sin(t * 0.4) * 0.04;

  // boats bob & rock
  for (const b of boats) {
    b.group.position.y = b.baseY + Math.sin(t * 1.25 + b.phase) * 0.34;
    b.group.rotation.z = Math.sin(t * 0.9 + b.phase) * 0.075;
    b.group.rotation.x = Math.cos(t * 0.7 + b.phase) * 0.05;
  }

  // spray drift
  for (let i = 0; i < sprayCount; i++) {
    const d = sprayData[i];
    d.y += d.vy * (1 + Math.sin(t + d.ph) * 0.3);
    if (d.y > 34) d.y = 6;
    dummy.position.set(d.x + Math.sin(t * 0.8 + d.ph) * 0.8, d.y, d.z);
    dummy.scale.setScalar(d.s);
    dummy.updateMatrix();
    spray.setMatrixAt(i, dummy.matrix);
  }
  spray.instanceMatrix.needsUpdate = true;

  // clouds drift
  for (const c of clouds) {
    c.group.position.x += c.speed * 0.016;
    if (c.group.position.x > 90) c.group.position.x = -90;
  }

  // camera sway
  camera.position.x = 2 + Math.sin(t * 0.12) * 1.6;
  camera.position.y = 8.5 + Math.sin(t * 0.09) * 0.5;
  camera.lookAt(-3, 9, -14);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
