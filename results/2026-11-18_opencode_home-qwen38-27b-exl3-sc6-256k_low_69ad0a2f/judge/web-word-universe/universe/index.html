<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --panel:rgba(16,16,24,.72);
    --panel-border:rgba(255,255,255,.08);
    --ink:#f3efe6;
    --ink-dim:#9a94a8;
    --accent:#e8c07a;
    --accent-2:#8fb8d8;
    --rel:#c98b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(1200px 800px at 70% 20%, #14121f 0%, #0a0a0f 60%, #07070b 100%);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0;display:block}

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:20px;
    padding:16px 26px;
    pointer-events:none;
  }
  .brand{
    font-family:'Cormorant Garamond',serif;
    font-size:22px;font-weight:600;letter-spacing:.5px;
    color:var(--ink);
    pointer-events:auto;
    line-height:1;
  }
  .brand small{
    display:block;font-family:'Inter',sans-serif;
    font-size:10px;font-weight:400;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--ink-dim);margin-top:4px;
  }
  .searchwrap{
    margin-left:auto;position:relative;pointer-events:auto;width:min(340px,42vw);
  }
  .searchwrap input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:999px;
    color:var(--ink);
    font-family:'Inter',sans-serif;font-size:14px;
    padding:11px 18px 11px 40px;
    outline:none;
    backdrop-filter:blur(10px);
    transition:border-color .2s, box-shadow .2s;
  }
  .searchwrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,192,122,.12)}
  .searchwrap .icon{
    position:absolute;left:15px;top:50%;transform:translateY(-50%);
    color:var(--ink-dim);font-size:15px;pointer-events:none;
  }
  .suggestions{
    position:absolute;top:calc(100% + 8px);left:0;right:0;
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:14px;backdrop-filter:blur(14px);
    overflow:hidden;display:none;max-height:320px;overflow-y:auto;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  .suggestions.open{display:block}
  .suggestions button{
    display:flex;align-items:center;gap:10px;width:100%;
    background:none;border:none;color:var(--ink);
    font-family:'Inter',sans-serif;font-size:14px;
    padding:11px 16px;cursor:pointer;text-align:left;
  }
  .suggestions button:hover,.suggestions button.active{background:rgba(232,192,122,.10)}
  .suggestions button .deg{margin-left:auto;font-size:11px;color:var(--ink-dim)}
  .suggestions .noresult{padding:12px 16px;color:var(--ink-dim);font-size:13px}

  /* ---------- detail panel ---------- */
  .panel{
    position:fixed;right:26px;top:84px;z-index:9;
    width:min(360px,86vw);
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:20px;
    backdrop-filter:blur(16px);
    padding:26px 26px 22px;
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    transform:translateX(24px);opacity:0;pointer-events:none;
    transition:transform .35s cubic-bezier(.2,.7,.2,1), opacity .3s;
  }
  .panel.open{transform:translateX(0);opacity:1;pointer-events:auto}
  .panel .kicker{
    font-size:10px;letter-spacing:3px;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:8px;
  }
  .panel h1{
    font-family:'Cormorant Garamond',serif;
    font-size:46px;font-weight:600;line-height:1;
    color:var(--ink);margin-bottom:6px;
  }
  .panel .theme{
    font-size:12px;color:var(--ink-dim);margin-bottom:18px;
    font-style:italic;
  }
  .panel .stat{
    display:flex;align-items:baseline;gap:8px;margin-bottom:18px;
  }
  .panel .stat .num{font-size:30px;font-weight:600;color:var(--accent-2)}
  .panel .stat .lbl{font-size:11px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase}
  .panel .relhead{
    font-size:10px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--ink-dim);margin-bottom:10px;font-weight:600;
  }
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    background:rgba(201,139,107,.12);
    border:1px solid rgba(201,139,107,.3);
    color:#e8c3ad;
    font-size:12.5px;font-weight:500;
    padding:6px 12px;border-radius:999px;cursor:pointer;
    transition:background .15s,transform .1s;
  }
  .chip:hover{background:rgba(201,139,107,.24);transform:translateY(-1px)}
  .chip.syn{background:rgba(143,184,216,.12);border-color:rgba(143,184,216,.3);color:#bcd6ea}
  .chip.syn:hover{background:rgba(143,184,216,.24)}
  .panel .close{
    position:absolute;top:14px;right:16px;
    background:none;border:none;color:var(--ink-dim);
    font-size:20px;cursor:pointer;line-height:1;padding:4px;
  }
  .panel .close:hover{color:var(--ink)}
  .panel .divider{height:1px;background:var(--panel-border);margin:16px 0}
  .panel .legend{display:flex;gap:16px;font-size:11px;color:var(--ink-dim)}
  .panel .legend span{display:flex;align-items:center;gap:6px}
  .panel .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

  /* ---------- footer stats ---------- */
  .statsbar{
    position:fixed;left:26px;bottom:22px;z-index:8;
    display:flex;gap:26px;pointer-events:none;
  }
  .stat-item{display:flex;flex-direction:column}
  .stat-item .v{font-size:20px;font-weight:600;color:var(--ink)}
  .stat-item .k{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-dim);margin-top:2px}
  .stat-item .v.hi{color:var(--accent)}

  .hint{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:8;
    font-size:11px;color:var(--ink-dim);letter-spacing:.5px;
    pointer-events:none;opacity:.8;
  }
  .hint b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="topbar">
  <div class="brand">Universo de Palavras<small>Dicionário Criativo</small></div>
  <div class="searchwrap">
    <span class="icon">&#9906;</span>
    <input id="search" type="text" placeholder="Buscar uma palavra..." autocomplete="off" spellcheck="false">
    <div class="suggestions" id="suggestions"></div>
  </div>
</div>

<aside class="panel" id="panel">
  <button class="close" id="closePanel" aria-label="Fechar">&times;</button>
  <div class="kicker">Palavra</div>
  <h1 id="pWord">saudade</h1>
  <div class="theme" id="pTheme">Tema: sentimentos</div>
  <div class="stat">
    <span class="num" id="pDeg">0</span>
    <span class="lbl">palavras ligadas</span>
  </div>
  <div class="relhead">Sinônimos</div>
  <div class="chips" id="pSyn"></div>
  <div class="divider"></div>
  <div class="relhead">Palavras análogas</div>
  <div class="chips" id="pAna"></div>
  <div class="divider"></div>
  <div class="legend">
    <span><i style="background:var(--accent)"></i> foco</span>
    <span><i style="background:var(--rel)"></i> análoga</span>
    <span><i style="background:var(--accent-2)"></i> sinônimo</span>
  </div>
</aside>

<div class="statsbar">
  <div class="stat-item"><span class="v" id="sWords">0</span><span class="k">palavras</span></div>
  <div class="stat-item"><span class="v" id="sRel">0</span><span class="k">relações</span></div>
  <div class="stat-item"><span class="v hi" id="sMost">—</span><span class="k">mais conectada</span></div>
</div>

<div class="hint" id="hint">arraste para girar &middot; role para aproximar &middot; clique numa palavra</div>

/* ================= GRAPH BUILD ================= */
const nodeWords = Object.keys(WORDS);
const nodeSet = new Set(nodeWords);
// collect all referenced words (including dangling links like rascunho-3)
const allWords = new Set(nodeWords);
for (const w of nodeWords) for (const l of WORDS[w]) allWords.add(l);

// node index
const nodes = [];
const idx = new Map();
for (const w of allWords) {
  idx.set(w, nodes.length);
  nodes.push({ word: w, hasPage: nodeSet.has(w), deg: 0 });
}

// edges (undirected, dedup)
const edgeSet = new Set();
const edges = [];
for (const w of nodeWords) {
  const a = idx.get(w);
  for (const l of WORDS[w]) {
    const b = idx.get(l);
    const key = a < b ? a+'_'+b : b+'_'+a;
    if (edgeSet.has(key)) continue;
    edgeSet.add(key);
    edges.push([a,b]);
  }
}
// degree
for (const [a,b] of edges){ nodes[a].deg++; nodes[b].deg++; }

// adjacency for focus
const adj = new Map();
for (const [a,b] of edges){
  if(!adj.has(a)) adj.set(a,[]);
  if(!adj.has(b)) adj.set(b,[]);
  adj.get(a).push(b);
  adj.get(b).push(a);
}

// stats
const sWords = nodeWords.length;
const sRel = edges.length;
let mostWord = '—', mostDeg = -1;
for (const n of nodes){ if(n.deg > mostDeg){ mostDeg = n.deg; mostWord = n.word; } }

document.getElementById('sWords').textContent = sWords;
document.getElementById('sRel').textContent = sRel;

/* ---- layout: 3D force-directed, run synchronously ---- */
const N = nodes.length;
const pos = new Float32Array(N*3);
const vel = new Float32Array(N*3);
// seed on a sphere
for(let i=0;i<N;i++){
  const t = Math.acos(1 - 2*(i+0.5)/N);
  const p = Math.PI*(1+Math.sqrt(5))*i;
  const r = 150;
  pos[i*3]   = r*Math.sin(t)*Math.cos(p);
  pos[i*3+1] = r*Math.cos(t);
  pos[i*3+2] = r*Math.sin(t)*Math.sin(p);
}
const REP = 2600, SPRING = 0.012, REST = 42, CENTER = 0.006, DAMP = 0.82;
for(let it=0; it<220; it++){
  const f = new Float32Array(N*3);
  // repulsion (O(N^2) but N~260, fine)
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      let d2 = dx*dx+dy*dy+dz*dz + 0.01;
      let d = Math.sqrt(d2);
      let m = REP/d2;
      dx/=d; dy/=d; dz/=d;
      f[i*3]+=dx*m; f[i*3+1]+=dy*m; f[i*3+2]+=dz*m;
      f[j*3]-=dx*m; f[j*3+1]-=dy*m; f[j*3+2]-=dz*m;
    }
  }
  // springs
  for(const [a,b] of edges){
    let dx=pos[b*3]-pos[a*3], dy=pos[b*3+1]-pos[a*3+1], dz=pos[b*3+2]-pos[a*3+2];
    let d = Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    let m = SPRING*(d-REST);
    dx/=d; dy/=d; dz/=d;
    f[a*3]+=dx*m; f[a*3+1]+=dy*m; f[a*3+2]+=dz*m;
    f[b*3]-=dx*m; f[b*3+1]-=dy*m; f[b*3+2]-=dz*m;
  }
  // centering + integrate
  for(let i=0;i<N;i++){
    f[i*3]-=pos[i*3]*CENTER; f[i*3+1]-=pos[i*3+1]*CENTER; f[i*3+2]-=pos[i*3+2]*CENTER;
    vel[i*3]=(vel[i*3]+f[i*3])*DAMP;
    vel[i*3+1]=(vel[i*3+1]+f[i*3+1])*DAMP;
    vel[i*3+2]=(vel[i*3+2]+f[i*3+2])*DAMP;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}
// recenter
let cx=0,cy=0,cz=0;
for(let i=0;i<N;i++){cx+=pos[i*3];cy+=pos[i*3+1];cz+=pos[i*3+2];}
cx/=N;cy/=N;cz/=N;
for(let i=0;i<N;i++){pos[i*3]-=cx;pos[i*3+1]-=cy;pos[i*3+2]-=cz;}

function makeDotTexture(){
  const c = document.createElement('canvas'); c.width=c.height=64;
  const g = c.getContext('2d');

  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); return t;
}

/* ---- labels: canvas texture per node, shown on hover/focus ---- */
function makeLabel(text){
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  const font = '500 28px Inter, sans-serif';
  g.font = font;
  const w = Math.ceil(g.measureText(text).width)+24;
  const h = 44;
  c.width=w; c.height=h;
  const g2 = c.getContext('2d');
  g2.font = font;
  g2.fillStyle='rgba(10,10,15,0.78)';
  roundRect(g2,0,0,w,h,12); g2.fill();
  g2.fillStyle='#f3efe6';
  g2.textBaseline='middle';
  g2.fillText(text,12,h/2+1);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  return { tex, aspect:w/h };
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

const labelCache = new Map();
function getLabel(word){
  if(!labelCache.has(word)) labelCache.set(word, makeLabel(word));
  return labelCache.get(word);
}

const raycaster = new THREE.Raycaster();

let hoverWord = null;

const panel = document.getElementById('panel');

function setFocus(word){
  focusWord = word;
  const i = idx.get(word);
  const neighbors = adj.get(i) || [];
  const nset = new Set(neighbors);

  // dim non-neighbors
  for(let k=0;k<N;k++){
    const isF = k===i;
    const isN = nset.has(k);
    const m = nodeMeshes[k].material;
    if(isF){ m.color.set(0xe8c07a); m.opacity=1; }
    else if(isN){ m.color.set(0x8fb8d8); m.opacity=0.95; }
    else { m.color.set(0xf3efe6); m.opacity=0.12; }
  }
  edgeMat.opacity = 0.05;

  // build highlight edges
  if(hlEdges){ hlGroup.remove(hlEdges); hlEdges.geometry.dispose(); }
  if(hlNode){ hlGroup.remove(hlNode); }
  const hPos = new Float32Array(neighbors.length*2*3);
  for(let e=0;e<neighbors.length;e++){
    const b=neighbors[e];
    hPos[e*6]=pos[i*3]; hPos[e*6+1]=pos[i*3+1]; hPos[e*6+2]=pos[i*3+2];
    hPos[e*6+3]=pos[b*3]; hPos[e*6+4]=pos[b*3+1]; hPos[e*6+5]=pos[b*3+2];
  }
  const hGeo = new THREE.BufferGeometry();
  hGeo.setAttribute('position', new THREE.BufferAttribute(hPos,3));
  hlEdges = new THREE.LineSegments(hGeo, hlEdgeMat);
  hlGroup.add(hlEdges);

  // big focus dot
  const fs = 10 + Math.min(nodes[i].deg,16)*0.5;
  hlNode = new THREE.Sprite(hlNodeMat);
  hlNode.position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
  hlNode.scale.set(fs,fs,1);
  hlGroup.add(hlNode);

  // labels for focus + neighbors
  nodeGroup.children.forEach(c=>{ if(c.userData.isLabel) c.visible=false; });
  showLabel(i, 1.6, 0xe8c07a);
  for(const b of neighbors) showLabel(b, 1.3, 0x8fb8d8);

  // panel
  pWord.textContent = word;
  const theme = THEMES[word] || '';
  pTheme.textContent = theme ? 'Tema: '+theme : '';
  pDeg.textContent = nodes[i].deg;
  // split syn vs ana from WORDS[word]
  pSyn.innerHTML=''; pAna.innerHTML='';
  if(nodeSet.has(word)){
    const list = WORDS[word];
    // heuristics: first two are synonyms (site lists synonyms first), rest analogous
    // we don't have exact split stored; mark all as analogous, but label first half syn
    const half = Math.min(2, list.length);
    list.forEach((l,k)=>{
      const chip = document.createElement('span');
      chip.className = 'chip' + (k<half ? ' syn':'');
      chip.textContent = l;
      chip.onclick = ()=> setFocus(l);
      (k<half ? pSyn : pAna).appendChild(chip);
    });
  } else {
    pSyn.innerHTML='<span class="chip" style="opacity:.5">sem página</span>';
  }
  panel.classList.add('open');

  // camera: ease toward focus
  camTarget.copy(new THREE.Vector3(pos[i*3],pos[i*3+1],pos[i*3+2]));
  camGoal = true;
}

function clearFocus(){
  focusWord = null;
  for(let k=0;k<N;k++){ nodeMeshes[k].material.color.set(0xf3efe6); nodeMeshes[k].material.opacity=0.9; }
  edgeMat.opacity=0.28;
  if(hlEdges){ hlGroup.remove(hlEdges); hlEdges.geometry.dispose(); hlEdges=null; }
  if(hlNode){ hlGroup.remove(hlNode); hlNode=null; }
  nodeGroup.children.forEach(c=>{ if(c.userData.isLabel) c.visible=false; });
  panel.classList.remove('open');
  camGoal = false;
}

function showLabel(i, scale, color){
  const n = nodes[i];
  const { tex, aspect } = getLabel(n.word);
  const m = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, depthTest:false });
  const sp = new THREE.Sprite(m);
  const h = 10*scale;
  sp.scale.set(h*aspect, h, 1);
  sp.position.set(pos[i*3], pos[i*3+1]+ (8+scale*4), pos[i*3+2]);
  sp.userData.isLabel = true;
  sp.renderOrder = 999;
  nodeGroup.add(sp);
}

document.getElementById('closePanel').onclick = clearFocus;

/* ---- mouse: rotate + hover + click ---- */
let dragging=false, px=0, py=0, moved=0;
let rotY=0, rotX=0, targetRotY=0, targetRotX=0;
let zoom=420, targetZoom=420;

canvas.addEventListener('pointerdown', e=>{ dragging=true; px=e.clientX; py=e.clientY; moved=0; });
window.addEventListener('pointerup', ()=>{ dragging=false; });
window.addEventListener('pointermove', e=>{
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  if(dragging){
    const dx=e.clientX-px, dy=e.clientY-py;
    moved += Math.abs(dx)+Math.abs(dy);
    targetRotY += dx*0.005;
    targetRotX += dy*0.005;
    targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
    px=e.clientX; py=e.clientY;
  }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  targetZoom += e.deltaY*0.4;
  targetZoom = Math.max(120, Math.min(900, targetZoom));
},{passive:false});

canvas.addEventListener('click', e=>{
  if(moved>6) return; // was a drag
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes, false);
  if(hits.length){
    const i = hits[0].object.userData.i;
    setFocus(nodes[i].word);
  }
});

/* ---- hover label ---- */
function updateHover(){
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes, false);
  const w = hits.length ? nodes[hits[0].object.userData.i].word : null;
  if(w !== hoverWord){
    hoverWord = w;
    nodeGroup.children.forEach(c=>{ if(c.userData.isHoverLabel) c.visible=false; });
    if(w && w!==focusWord){
      const i = idx.get(w);
      const { tex, aspect } = getLabel(w);
      const m = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, depthTest:false });
      const sp = new THREE.Sprite(m);
      const h=9;
      sp.scale.set(h*aspect,h,1);
      sp.position.set(pos[i*3], pos[i*3+1]+9, pos[i*3+2]);
      sp.userData.isHoverLabel=true; sp.renderOrder=998;
      nodeGroup.add(sp);
      canvas.style.cursor='pointer';
    } else {
      canvas.style.cursor = dragging?'grabbing':'grab';
    }
  }
}

/* ================= SEARCH ================= */
const searchInput = document.getElementById('search');
const sugg = document.getElementById('suggestions');
let suggItems = [];
let activeIdx = -1;

function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function renderSuggestions(q){
  sugg.innerHTML='';
  const nq = norm(q);
  suggItems = [];
  if(!nq){ sugg.classList.remove('open'); return; }
  const matches = nodeWords.filter(w => norm(w).includes(nq)).slice(0,12);
  if(!matches.length){
    sugg.innerHTML='<div class="noresult">nenhuma palavra encontrada</div>';
    sugg.classList.add('open'); return;
  }
  matches.forEach((w,k)=>{
    const b=document.createElement('button');
    const d=nodes[idx.get(w)].deg;
    b.innerHTML='<span>'+w+'</span><span class="deg">'+d+' ligaç'+(d===1?'ão':'ões')+'</span>';
    b.onclick=()=>{ setFocus(w); searchInput.value=w; closeSugg(); };
    b.dataset.word=w;
    sugg.appendChild(b);
    suggItems.push(b);
  });
  activeIdx=-1;
  sugg.classList.add('open');
}
function closeSugg(){ sugg.classList.remove('open'); }
searchInput.addEventListener('input', ()=> renderSuggestions(searchInput.value));
searchInput.addEventListener('focus', ()=>{ if(searchInput.value) renderSuggestions(searchInput.value); });
searchInput.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); activeIdx=Math.min(activeIdx+1,suggItems.length-1); markActive(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); activeIdx=Math.max(activeIdx-1,0); markActive(); }
  else if(e.key==='Enter'){
    if(activeIdx>=0 && suggItems[activeIdx]){ setFocus(suggItems[activeIdx].dataset.word); searchInput.value=suggItems[activeIdx].dataset.word; closeSugg(); }
    else if(suggItems.length){ setFocus(suggItems[0].dataset.word); searchInput.value=suggItems[0].dataset.word; closeSugg(); }
  } else if(e.key==='Escape'){ closeSugg(); searchInput.blur(); }
});
function markActive(){ suggItems.forEach((b,k)=> b.classList.toggle('active', k===activeIdx)); }
document.addEventListener('click', e=>{ if(!e.target.closest('.searchwrap')) closeSugg(); });

/* ================= URL PARAM ================= */
function applyUrl(){
  const p = new URLSearchParams(location.search);
  const w = p.get('word');
  if(w && idx.has(w)){
    setFocus(w);
    searchInput.value = w;
  }
}

/* ================= ANIMATE ================= */
const camTarget = new THREE.Vector3(0,0,0);
let camGoal = false;
let autoRot = 0;
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // slow auto-rotation when idle
  if(!dragging && !focusWord) targetRotY += dt*0.03;

  rotY += (targetRotY-rotY)*0.08;
  rotX += (targetRotX-rotX)*0.08;
  zoom += (targetZoom-zoom)*0.08;

  // rotate whole graph group
  nodeGroup.rotation.y = rotY;
  nodeGroup.rotation.x = rotX;
  edgeLines.rotation.y = rotY;
  edgeLines.rotation.x = rotX;
  hlGroup.rotation.y = rotY;
  hlGroup.rotation.x = rotX;

  // camera
  if(camGoal){
    // keep camera at distance zoom from focus, but orbit with rotation
    const dir = new THREE.Vector3(0,0,1).applyEuler(new THREE.Euler(rotX,rotY,0));
    camera.position.copy(camTarget).add(dir.multiplyScalar(zoom*0.55));
    camera.lookAt(camTarget);
  } else {
    camera.position.set(0,0,zoom);
    camera.lookAt(0,0,0);
  }

  updateHover();
  renderer.render(scene, camera);
}

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

applyUrl();
animate();
</script>
