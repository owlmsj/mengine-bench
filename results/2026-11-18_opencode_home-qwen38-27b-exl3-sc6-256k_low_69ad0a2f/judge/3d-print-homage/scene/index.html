<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa - low poly</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#E4D4AF; }
  #c { display:block; width:100%; height:100%; }
  .label {
    position:fixed; left:14px; bottom:12px;
    font:12px/1.5 system-ui, -apple-system, sans-serif;
    color:#6b5a34; letter-spacing:.02em; opacity:.85;
    pointer-events:none; user-select:none;
  }
  .label b { font-weight:600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label"><b>The Great Wave off Kanagawa</b> &middot; low-poly tribute &middot; after Katsushika Hokusai (public domain)</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ------------------------------------------------------------------ *
 *  Palette lifted from the print
 * ------------------------------------------------------------------ */
const C = {
  sky:        0xE4D4AF,  // warm cream sky
  blueDark:   0x16324F,  // deep Prussian (wave shadow / figures)
  blueMid:    0x24507E,  // main wave body
  blueLight:  0x5E8CB8,  // lighter blue (secondary water)
  foam:       0xF7F4EA,  // off-white foam
  fujiSnow:   0xF2EFE6,  // snow cap
  fujiShadow: 0x7A8CA6,  // blue-grey mountain shadow
  wood:       0xC9A876,  // tan hull
  woodDark:   0x8A6D45,  // hull shadow
  figure:     0x1B3A5C,  // crouching fishermen
  cloud:      0xF7F4EA,
};

const M = (color, extra = {}) =>
  new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.92, metalness: 0, ...extra });

const mWave   = M(C.blueMid,   { side: THREE.DoubleSide });
const mWaveDk = M(C.blueDark,  { side: THREE.DoubleSide });
const mWaveLt = M(C.blueLight, { side: THREE.DoubleSide });
const mFoam   = M(C.foam);
const mWood   = M(C.wood);
const mWoodDk = M(C.woodDark);
const mFig    = M(C.figure);
const mSnow   = M(C.fujiSnow);
const mShadow = M(C.fujiShadow);
const mCloud  = M(C.cloud);
const mSea    = M(C.blueLight, { side: THREE.DoubleSide });

/* ------------------------------------------------------------------ *
 *  Renderer / scene / camera
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.sky);
scene.fog = new THREE.Fog(C.sky, 18, 40);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.5, 1.6, 15);
camera.lookAt(0, 0.8, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xfff6e0, 0.8);
sun.position.set(-4, 8, 6);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd2e8, 0.25);
fill.position.set(5, 3, -4);
scene.add(fill);

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
const box  = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
const cone = (r, h, s, m) => new THREE.Mesh(new THREE.ConeGeometry(r, h, s), m);
const ico  = (r, m) => new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), m);

/* Extrude a closed 2D silhouette (array of [x,y]) into a solid low-poly
   shape. The print is 2D, so extruding its silhouette matches it from the
   front while giving real 3D depth. */
function extrudeShape(points, depth, matRef) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, steps: 1, curveSegments: 1 });
  geo.translate(0, 0, -depth / 2);
  return new THREE.Mesh(geo, matRef);
}

/* A long narrow boat with upturned ends and crouching figures. */
function makeBoat(len = 3.0) {
  const g = new THREE.Group();
  const hull = box(len, 0.3, 0.6, mWood);
  g.add(hull);
  const inner = box(len * 0.84, 0.16, 0.42, mWoodDk);
  inner.position.y = 0.11;
  g.add(inner);
  const endL = box(0.5, 0.48, 0.6, mWood);
  endL.position.set(-len / 2, 0.2, 0); endL.rotation.z = 0.55;
  g.add(endL);
  const endR = box(0.5, 0.48, 0.6, mWood);
  endR.position.set(len / 2, 0.2, 0); endR.rotation.z = -0.55;
  g.add(endR);
  const count = 5;
  for (let i = 0; i < count; i++) {
    const fig = ico(0.12, mFig);
    fig.position.set(-len * 0.32 + (len * 0.64 / (count - 1)) * i, 0.26, 0);
    fig.scale.y = 0.8;
    g.add(fig);
  }
  return g;
}

/* A soft low-poly cloud: a few flattened blobs. */
function makeCloud(scale = 1) {
  const g = new THREE.Group();
  const puffs = [[0, 0, 0, 1.0], [0.9, 0.1, 0.1, 0.7], [-0.9, 0.05, -0.1, 0.75], [0.3, 0.35, 0, 0.6], [-0.3, 0.3, 0.1, 0.55]];
  for (const [x, y, z, s] of puffs) {
    const b = ico(0.6 * s, mCloud);
    b.position.set(x, y, z);
    b.scale.set(1.6, 0.7, 1.2);
    g.add(b);
  }
  g.scale.setScalar(scale);
  return g;
}

/* ------------------------------------------------------------------ *
 *  Sea base
 * ------------------------------------------------------------------ */
const sea = new THREE.Mesh(new THREE.PlaneGeometry(70, 50), mSea);
sea.rotation.x = -Math.PI / 2;
sea.position.y = -2.4;
scene.add(sea);

/* ------------------------------------------------------------------ *
 *  The Great Wave (hero, left) - solid extruded silhouette
 * ------------------------------------------------------------------ */
const greatWave = new THREE.Group();

// Closed silhouette of the wave: rises from bottom-left, crest at top,
// curls over to the right with a pronounced hook, front face comes down,
// closes along the bottom. The curl tip points down-left like the print.
const heroProfile = [
  [-4.8, -2.6],   // bottom-left
  [-4.5, -0.8],
  [-3.9,  1.0],
  [-3.1,  2.4],
  [-2.1,  3.3],
  [-1.1,  3.7],   // crest rising
  [ 0.0,  3.85],  // crest top
  [ 1.0,  3.6],
  [ 1.8,  3.0],   // curl outer
  [ 2.3,  2.1],
  [ 2.35, 1.2],   // curl
  [ 1.9,  0.6],   // curl tip (points down-left)
  [ 1.3,  0.5],
  [ 1.0,  0.85],  // hooks back up (inside of curl)
  [ 0.7,  0.2],   // front face
  [ 0.2, -0.7],
  [-0.2, -1.6],
  [ 0.6, -2.2],
  [ 1.7, -2.6],
  [ 2.8, -2.6],   // bottom-right
];
const hero = extrudeShape(heroProfile, 6.5, mWave);
greatWave.add(hero);

/* foam: white dots along the crest and curl */
const crestPts = [
  [-2.1, 3.3], [-1.1, 3.7], [0.0, 3.85], [1.0, 3.6], [1.8, 3.0], [2.3, 2.1], [2.35, 1.2], [1.9, 0.6],
];
for (const [x, y] of crestPts) {
  for (let k = 0; k < 3; k++) {
    const d = ico(0.13 + Math.random() * 0.09, mFoam);
    d.position.set(x + (Math.random() - 0.5) * 0.35, y + 0.08 + Math.random() * 0.16, 3.25 + Math.random() * 0.25);
    greatWave.add(d);
  }
}
/* claw-like foam fingers at the curl tip */
for (let i = 0; i < 6; i++) {
  const spike = cone(0.09, 0.5 + Math.random() * 0.3, 5, mFoam);
  spike.position.set(1.6 + i * 0.16, 0.7 + i * 0.26, 3.25);
  spike.rotation.z = -0.6 - i * 0.14;
  greatWave.add(spike);
}
greatWave.position.set(-0.9, 0, 0);
greatWave.scale.setScalar(1.05);
scene.add(greatWave);

/* ------------------------------------------------------------------ *
 *  Right wave (rises on the right, like the print)
 * ------------------------------------------------------------------ */
const rightProfile = [
  [-2.2, -2.4],
  [-1.8, -0.8],
  [-1.1,  0.6],
  [-0.3,  1.5],
  [ 0.5,  1.9],   // crest
  [ 1.2,  1.7],
  [ 1.7,  1.1],
  [ 1.9,  0.4],   // curl
  [ 1.5, -0.1],
  [ 1.0, -0.9],
  [ 0.6, -1.8],
  [ 1.4, -2.4],
  [ 2.2, -2.4],
];
const rightWave = extrudeShape(rightProfile, 5.0, mWave);
rightWave.position.set(5.2, -0.3, 1.0);
rightWave.rotation.y = -0.3;
scene.add(rightWave);

/* foam on the right wave crest */
for (let i = 0; i < 6; i++) {
  const d = ico(0.11 + Math.random() * 0.07, mFoam);
  d.position.set(5.2 - 0.6 + i * 0.3, 1.4 + Math.sin(i * 0.9) * 0.25, 3.4);
  scene.add(d);
}

/* ------------------------------------------------------------------ *
 *  Foreground wave (bottom)
 * ------------------------------------------------------------------ */
const fgProfile = [
  [-3.2, -2.4],
  [-2.4, -1.2],
  [-1.4, -0.2],
  [-0.4,  0.4],
  [ 0.6,  0.5],   // crest
  [ 1.5,  0.2],
  [ 2.2, -0.6],
  [ 2.7, -1.6],
  [ 3.0, -2.4],
];
const fgWave = extrudeShape(fgProfile, 7.0, mWaveLt);
fgWave.position.set(1.0, -1.0, 5.0);
scene.add(fgWave);

/* foam on the foreground wave crest */
for (let i = 0; i < 8; i++) {
  const d = ico(0.1 + Math.random() * 0.06, mFoam);
  d.position.set(1.0 - 1.2 + i * 0.3, -0.5 + Math.sin(i * 0.8) * 0.18, 8.3);
  scene.add(d);
}

/* ------------------------------------------------------------------ *
 *  Mount Fuji (small, snow-capped, centre-right, in the distance)
 * ------------------------------------------------------------------ */
const fuji = new THREE.Group();
const body = cone(2.3, 2.6, 8, mShadow);
body.position.y = 1.3;
fuji.add(body);
const snow = cone(1.5, 1.7, 8, mSnow);
snow.position.y = 2.0;
fuji.add(snow);
fuji.position.set(4.0, -2.2, -8);
fuji.scale.setScalar(0.8);
scene.add(fuji);

/* ------------------------------------------------------------------ *
 *  Clouds
 * ------------------------------------------------------------------ */
const clouds = [];
const cloudDefs = [[-4.5, 4.4, -7, 1.1], [0.5, 4.8, -8, 1.3], [4.2, 4.2, -6.5, 0.9], [-1.5, 5.2, -9, 0.8]];
for (const [x, y, z, s] of cloudDefs) {
  const c = makeCloud(s);
  c.position.set(x, y, z);
  scene.add(c);
  clouds.push(c);
}

/* ------------------------------------------------------------------ *
 *  Boats (3, seated in the wave troughs)
 * ------------------------------------------------------------------ */
const boats = [];
function addBoat(x, y, z, len, rotY, phase) {
  const b = makeBoat(len);
  b.position.set(x, y, z);
  b.rotation.y = rotY;
  b.userData = { baseY: y, phase };
  scene.add(b);
  boats.push(b);
}
addBoat(-2.6, -0.9, 3.4, 3.0, 0.45, 0.0);  // left, in the wave trough
addBoat(0.6, -1.1, 3.0, 2.8, 0.1, 1.7);    // centre
addBoat(3.4, -1.5, 4.4, 3.2, -0.25, 3.1);  // right foreground

/* ------------------------------------------------------------------ *
 *  Gentle motion
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  greatWave.position.y = Math.sin(t * 0.5) * 0.12;
  greatWave.rotation.z = Math.sin(t * 0.3) * 0.012;

  rightWave.position.y = -0.3 + Math.sin(t * 0.55 + 2.0) * 0.10;
  fgWave.position.y = -1.0 + Math.sin(t * 0.6 + 1.0) * 0.09;

  for (const b of boats) {
    const p = b.userData.phase;
    b.position.y = b.userData.baseY + Math.sin(t * 0.8 + p) * 0.08;
    b.rotation.z = Math.sin(t * 0.8 + p) * 0.08;
    b.rotation.x = Math.cos(t * 0.6 + p) * 0.04;
  }

  for (const c of clouds) {
    c.position.x += 0.003;
    if (c.position.x > 8) c.position.x = -8;
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
