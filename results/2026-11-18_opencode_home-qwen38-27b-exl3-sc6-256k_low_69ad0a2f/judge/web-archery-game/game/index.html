<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Blaster '95</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; cursor: crosshair; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ---------- Canvas ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 960, H = 540;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------- Audio (Web Audio API, no assets) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playShoot(power) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Bowstring snap: short noise burst
  const bufSize = audioCtx.sampleRate * 0.08;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.25 + power * 0.3, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  const f = audioCtx.createBiquadFilter();
  f.type = 'bandpass';
  f.frequency.value = 800 + power * 1200;
  f.Q.value = 1.5;
  src.connect(f).connect(g).connect(audioCtx.destination);
  src.start(t);
  src.stop(t + 0.1);
}

function playPop() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Pop: quick sine drop + click
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(600, t);
  osc.frequency.exponentialRampToValueAtTime(150, t + 0.12);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.15);
  // Click transient
  const bufSize = audioCtx.sampleRate * 0.02;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.3, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  src.connect(g2).connect(audioCtx.destination);
  src.start(t);
}

function playMiss() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, t);
  osc.frequency.exponentialRampToValueAtTime(80, t + 0.3);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.3);
}

function playGameOver() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [330, 262, 208, 165].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.12, t + i * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.2 + 0.18);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t + i * 0.2);
    osc.stop(t + i * 0.2 + 0.2);
  });
}

function playLevelUp() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [262, 330, 392, 523].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.12, t + i * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.09);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(t + i * 0.1);
    osc.stop(t + i * 0.1 + 0.1);
  });
}

// ---------- Game State ----------
const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
let state = STATE.MENU;
let score = 0;
let lives = 3;
let level = 1;
let combo = 0;
let comboTimer = 0;
let bestCombo = 0;

// Archer
const archer = { x: 120, y: H - 80 };

// Aiming
let mouseX = W / 2, mouseY = H / 2;
let isDrawing = false;
let drawStartX = 0, drawStartY = 0;
let power = 0; // 0..1
const MAX_POWER = 1;
const MIN_POWER = 0.15;

// Arrows
let arrows = [];

// Balloons
let balloons = [];
let spawnTimer = 0;
let spawnInterval = 2.0;

// Particles
let particles = [];

// Floating score text
let floatTexts = [];

// Screen shake
let shakeX = 0, shakeY = 0, shakeTime = 0;

// ---------- Balloon ----------
const BALLOON_COLORS = [
  ['#ff4444', '#cc2222'], // red
  ['#44aaff', '#2266cc'], // blue
  ['#ffdd44', '#cc9900'], // yellow
  ['#44dd66', '#22aa44'], // green
  ['#ff66cc', '#cc3399'], // pink
  ['#aa66ff', '#7733cc'], // purple
  ['#ff8844', '#cc5500'], // orange
];

function spawnBalloon() {
  const colorIdx = Math.floor(Math.random() * BALLOON_COLORS.length);
  const size = 28 + Math.random() * 18;
  const speed = (30 + Math.random() * 40) * (1 + level * 0.15);
  const fromLeft = Math.random() < 0.5;
  balloons.push({
    x: fromLeft ? -size : W + size,
    y: 60 + Math.random() * (H - 160),
    vx: fromLeft ? speed : -speed,
    vy: 0,
    size,
    colorIdx,
    wobblePhase: Math.random() * Math.PI * 2,
    wobbleSpeed: 1.5 + Math.random() * 2,
    wobbleAmp: 8 + Math.random() * 12,
    popped: false,
  });
}

// ---------- Particles ----------
function spawnPopParticles(x, y, colorIdx) {
  const [c1, c2] = BALLOON_COLORS[colorIdx];
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 200;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 3 + Math.random() * 5,
      color: Math.random() < 0.5 ? c1 : c2,
      life: 0.5 + Math.random() * 0.4,
      maxLife: 0.5 + Math.random() * 0.4,
      gravity: 200,
    });
  }
  // String bits
  for (let i = 0; i < 4; i++) {
    particles.push({
      x, y: y + 20,
      vx: (Math.random() - 0.5) * 60,
      vy: 50 + Math.random() * 80,
      size: 2,
      color: '#ffffff',
      life: 0.6,
      maxLife: 0.6,
      gravity: 100,
    });
  }
}

function spawnArrowTrail(x, y) {
  particles.push({
    x, y,
    vx: 0, vy: 0,
    size: 2,
    color: 'rgba(255,255,200,0.5)',
    life: 0.15,
    maxLife: 0.15,
    gravity: 0,
  });
}

// ---------- Floating text ----------
function addFloatText(x, y, text, color, size) {
  floatTexts.push({ x, y, text, color, size: size || 16, life: 1.0, maxLife: 1.0 });
}

// ---------- Shooting ----------
function shootArrow() {
  const dx = mouseX - archer.x;
  const dy = mouseY - archer.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1) return;
  const nx = dx / dist, ny = dy / dist;
  const speed = 300 + power * 500;
  arrows.push({
    x: archer.x + nx * 30,
    y: archer.y + ny * 30,
    vx: nx * speed,
    vy: ny * speed,
    power,
    trail: [],
  });
  playShoot(power);
  // Recoil shake
  shakeTime = 0.08;
  shakeX = -nx * 3;
  shakeY = -ny * 3;
}

// ---------- Collision ----------
function checkCollisions() {
  for (let ai = arrows.length - 1; ai >= 0; ai--) {
    const a = arrows[ai];
    for (let bi = balloons.length - 1; bi >= 0; bi--) {
      const b = balloons[bi];
      if (b.popped) continue;
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const r = b.size + 4;
      if (dx * dx + dy * dy < r * r) {
        // Hit!
        b.popped = true;
        arrows.splice(ai, 1);
        spawnPopParticles(b.x, b.y, b.colorIdx);
        playPop();

        combo++;
        comboTimer = 2.0;
        if (combo > bestCombo) bestCombo = combo;
        const comboMult = Math.min(combo, 5);
        const points = 10 * comboMult;
        score += points;
        addFloatText(b.x, b.y - 20, '+' + points, '#ffdd44', 14 + comboMult * 2);
        if (combo >= 3) {
          addFloatText(b.x, b.y - 40, combo + 'x COMBO!', '#ff66cc', 12);
        }

        // Screen shake on hit
        shakeTime = 0.1;
        shakeX = (Math.random() - 0.5) * 4;
        shakeY = (Math.random() - 0.5) * 4;

        // Check level up
        if (score >= level * 100) {
          level++;
          playLevelUp();
          addFloatText(W / 2, H / 2 - 60, 'LEVEL ' + level + '!', '#44ddff', 24);
          spawnInterval = Math.max(0.6, 2.0 - level * 0.15);
        }
        break;
      }
    }
  }
  // Remove popped balloons
  balloons = balloons.filter(b => !b.popped);
}

// ---------- Update ----------
let lastTime = 0;
function update(dt) {
  if (state !== STATE.PLAYING) return;

  // Combo timer
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;
  }

  // Spawn balloons
  spawnTimer += dt;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnBalloon();
    // At higher levels, occasionally spawn two
    if (level >= 3 && Math.random() < 0.3) spawnBalloon();
  }

  // Update balloons
  for (const b of balloons) {
    b.x += b.vx * dt;
    b.wobblePhase += b.wobbleSpeed * dt;
    b.y += Math.sin(b.wobblePhase) * b.wobbleAmp * dt;
  }
  // Remove off-screen balloons (missed)
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    if (b.x < -b.size - 20 || b.x > W + b.size + 20) {
      balloons.splice(i, 1);
      // Missed balloon = lose a life
      lives--;
      combo = 0;
      playMiss();
      addFloatText(W / 2, H - 100, 'MISSED!', '#ff4444', 18);
      shakeTime = 0.15;
      shakeX = (Math.random() - 0.5) * 6;
      shakeY = (Math.random() - 0.5) * 6;
      if (lives <= 0) {
        state = STATE.GAMEOVER;
        playGameOver();
      }
    }
  }

  // Update arrows
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    // Trail
    a.trail.push({ x: a.x, y: a.y, life: 0.2 });
    if (a.trail.length > 8) a.trail.shift();
    for (const t of a.trail) t.life -= dt;
    a.trail = a.trail.filter(t => t.life > 0);
    // Off screen
    if (a.x < -20 || a.x > W + 20 || a.y < -20 || a.y > H + 20) {
      arrows.splice(i, 1);
    }
  }

  checkCollisions();

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update float texts
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.y -= 30 * dt;
    f.life -= dt;
    if (f.life <= 0) floatTexts.splice(i, 1);
  }

  // Screen shake decay
  if (shakeTime > 0) {
    shakeTime -= dt;
    if (shakeTime <= 0) { shakeX = 0; shakeY = 0; }
  }
}

// ---------- Drawing ----------
function drawBackground() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a1a3e');
  grad.addColorStop(0.5, '#2a2a5e');
  grad.addColorStop(1, '#3a3a6e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137 + 50) % W;
    const sy = (i * 89 + 30) % (H * 0.6);
    const ss = (i % 3 === 0) ? 2 : 1;
    ctx.fillRect(sx, sy, ss, ss);
  }

  // Moon
  ctx.fillStyle = '#ffffcc';
  ctx.beginPath();
  ctx.arc(W - 100, 80, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a1a3e';
  ctx.beginPath();
  ctx.arc(W - 110, 75, 25, 0, Math.PI * 2);
  ctx.fill();

  // Ground
  ctx.fillStyle = '#2a4a2a';
  ctx.fillRect(0, H - 40, W, 40);
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, H - 40, W, 4);
}

function drawArcher() {
  const ax = archer.x, ay = archer.y;
  const aimAngle = Math.atan2(mouseY - ay, mouseX - ax);

  ctx.save();
  ctx.translate(ax, ay);

  // Body
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(-8, -10, 16, 30); // torso
  ctx.fillStyle = '#654321';
  ctx.fillRect(-10, 20, 20, 12); // legs

  // Head
  ctx.fillStyle = '#deb887';
  ctx.beginPath();
  ctx.arc(0, -20, 10, 0, Math.PI * 2);
  ctx.fill();

  // Hood
  ctx.fillStyle = '#4a3728';
  ctx.beginPath();
  ctx.arc(0, -22, 11, Math.PI, 0);
  ctx.fill();

  // Bow arm + bow
  ctx.save();
  ctx.rotate(aimAngle);

  // Bow arm
  ctx.fillStyle = '#deb887';
  ctx.fillRect(0, -3, 28, 6);

  // Bow
  const bowX = 30;
  ctx.strokeStyle = '#8B4513';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(bowX, 0, 20, -Math.PI / 2.5, Math.PI / 2.5);
  ctx.stroke();

  // Bowstring
  const pullBack = isDrawing ? power * 15 : 0;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(bowX + Math.cos(-Math.PI / 2.5) * 20, Math.sin(-Math.PI / 2.5) * 20);
  ctx.lineTo(bowX - pullBack, 0);
  ctx.lineTo(bowX + Math.cos(Math.PI / 2.5) * 20, Math.sin(Math.PI / 2.5) * 20);
  ctx.stroke();

  // Arrow on bow when drawing
  if (isDrawing) {
    ctx.strokeStyle = '#deb887';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(bowX - pullBack, 0);
    ctx.lineTo(bowX + 25, 0);
    ctx.stroke();
    // Arrowhead
    ctx.fillStyle = '#cccccc';
    ctx.beginPath();
    ctx.moveTo(bowX + 25, 0);
    ctx.lineTo(bowX + 20, -4);
    ctx.lineTo(bowX + 20, 4);
    ctx.fill();
  }

  ctx.restore();

  ctx.restore();
}

function drawPowerMeter() {
  if (!isDrawing) return;
  const mx = archer.x + 50;
  const my = archer.y - 50;
  const mw = 60, mh = 8;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(mx - 1, my - 1, mw + 2, mh + 2);
  const p = Math.max(0, Math.min(1, power));
  const r = Math.floor(255 * (1 - p));
  const g = Math.floor(255 * p);
  ctx.fillStyle = 'rgb(' + r + ',' + g + ',0)';
  ctx.fillRect(mx, my, mw * p, mh);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.strokeRect(mx, my, mw, mh);
}

function drawBalloon(b) {
  const [c1, c2] = BALLOON_COLORS[b.colorIdx];
  const wobX = Math.sin(b.wobblePhase) * 2;

  ctx.save();
  ctx.translate(b.x + wobX, b.y);

  // String
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, b.size);
  ctx.quadraticCurveTo(3, b.size + 15, 0, b.size + 30);
  ctx.stroke();

  // Balloon body
  ctx.fillStyle = c1;
  ctx.beginPath();
  ctx.ellipse(0, 0, b.size * 0.85, b.size, 0, 0, Math.PI * 2);
  ctx.fill();

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(-b.size * 0.3, -b.size * 0.3, b.size * 0.25, b.size * 0.35, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Knot
  ctx.fillStyle = c2;
  ctx.beginPath();
  ctx.moveTo(-4, b.size);
  ctx.lineTo(4, b.size);
  ctx.lineTo(0, b.size + 6);
  ctx.fill();

  ctx.restore();
}

function drawArrow(a) {
  const angle = Math.atan2(a.vy, a.vx);
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(angle);

  // Trail
  for (let i = 0; i < a.trail.length; i++) {
    const t = a.trail[i];
    const alpha = t.life / 0.2;
    ctx.fillStyle = 'rgba(255,255,200,' + (alpha * 0.4) + ')';
    ctx.beginPath();
    ctx.arc(-i * 8, 0, 2 * alpha, 0, Math.PI * 2);
    ctx.fill();
  }

  // Shaft
  ctx.strokeStyle = '#deb887';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-15, 0);
  ctx.lineTo(10, 0);
  ctx.stroke();

  // Arrowhead
  ctx.fillStyle = '#cccccc';
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.lineTo(8, -4);
  ctx.lineTo(8, 4);
  ctx.fill();

  // Fletching
  ctx.fillStyle = '#ff4444';
  ctx.beginPath();
  ctx.moveTo(-15, 0);
  ctx.lineTo(-10, -4);
  ctx.lineTo(-8, 0);
  ctx.lineTo(-10, 4);
  ctx.fill();

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawFloatTexts() {
  for (const f of floatTexts) {
    const alpha = f.life / f.maxLife;
    ctx.globalAlpha = alpha;
    ctx.font = (f.size || 16) + 'px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  // Score
  ctx.font = '16px "Press Start 2P", monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffdd44';
  ctx.fillText('SCORE ' + score, 20, 30);

  // Level
  ctx.fillStyle = '#44ddff';
  ctx.fillText('LEVEL ' + level, 20, 55);

  // Lives
  ctx.fillStyle = '#ff4444';
  let livesStr = '';
  for (let i = 0; i < lives; i++) livesStr += '\u2665 ';
  ctx.fillText(livesStr, 20, 80);

  // Combo
  if (combo >= 2) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#ff66cc';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillText(combo + 'x COMBO', W - 20, 30);
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.font = '32px "Press Start 2P", monospace';
  ctx.fillStyle = '#ffdd44';
  ctx.fillText('BALLOON BLASTER', W / 2, H / 2 - 80);

  ctx.font = '16px "Press Start 2P", monospace';
  ctx.fillStyle = '#44ddff';
  ctx.fillText("'95 EDITION", W / 2, H / 2 - 40);

  ctx.font = '12px "Press Start 2P", monospace';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('AIM WITH MOUSE', W / 2, H / 2 + 20);
  ctx.fillText('HOLD TO DRAW BOW', W / 2, H / 2 + 50);
  ctx.fillText('RELEASE TO SHOOT', W / 2, H / 2 + 80);
  ctx.fillText('POP BALLOONS, DONT LET THEM ESCAPE', W / 2, H / 2 + 110);

  // Blinking start prompt
  if (Math.floor(Date.now() / 500) % 2 === 0) {
    ctx.fillStyle = '#ffdd44';
    ctx.fillText('CLICK TO START', W / 2, H / 2 + 170);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.font = '28px "Press Start 2P", monospace';
  ctx.fillStyle = '#ff4444';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 60);

  ctx.font = '16px "Press Start 2P", monospace';
  ctx.fillStyle = '#ffdd44';
  ctx.fillText('SCORE: ' + score, W / 2, H / 2);

  ctx.fillStyle = '#44ddff';
  ctx.fillText('BEST COMBO: ' + bestCombo + 'x', W / 2, H / 2 + 35);

  ctx.fillStyle = '#ffffff';
  ctx.fillText('LEVEL REACHED: ' + level, W / 2, H / 2 + 70);

  if (Math.floor(Date.now() / 500) % 2 === 0) {
    ctx.fillStyle = '#ffdd44';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillText('CLICK TO PLAY AGAIN', W / 2, H / 2 + 130);
  }
}

// ---------- Main loop ----------
function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);

  ctx.save();
  if (shakeTime > 0) {
    ctx.translate(shakeX, shakeY);
  }

  drawBackground();

  if (state === STATE.PLAYING || state === STATE.GAMEOVER) {
    for (const b of balloons) drawBalloon(b);
    for (const a of arrows) drawArrow(a);
    drawArcher();
    drawPowerMeter();
    drawParticles();
    drawFloatTexts();
    drawHUD();
  }

  ctx.restore();

  if (state === STATE.MENU) drawMenu();
  if (state === STATE.GAMEOVER) drawGameOver();

  requestAnimationFrame(gameLoop);
}

// ---------- Input ----------
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY,
  };
}

canvas.addEventListener('mousemove', (e) => {
  const pos = getCanvasPos(e);
  mouseX = pos.x;
  mouseY = pos.y;
  if (isDrawing) {
    const dx = mouseX - archer.x;
    const dy = mouseY - archer.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    power = Math.min(MAX_POWER, dist / 200);
  }
});

canvas.addEventListener('mousedown', (e) => {
  ensureAudio();
  const pos = getCanvasPos(e);
  mouseX = pos.x;
  mouseY = pos.y;

  if (state === STATE.MENU) {
    startGame();
    return;
  }
  if (state === STATE.GAMEOVER) {
    startGame();
    return;
  }
  if (state === STATE.PLAYING) {
    isDrawing = true;
    drawStartX = pos.x;
    drawStartY = pos.y;
    power = 0;
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (state === STATE.PLAYING && isDrawing) {
    if (power >= MIN_POWER) {
      shootArrow();
    }
    isDrawing = false;
    power = 0;
  }
});

canvas.addEventListener('mouseleave', () => {
  if (isDrawing) {
    isDrawing = false;
    power = 0;
  }
});

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  ensureAudio();
  const touch = e.touches[0];
  const pos = getCanvasPos(touch);
  mouseX = pos.x;
  mouseY = pos.y;
  if (state === STATE.MENU || state === STATE.GAMEOVER) {
    startGame();
    return;
  }
  if (state === STATE.PLAYING) {
    isDrawing = true;
    power = 0;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const pos = getCanvasPos(touch);
  mouseX = pos.x;
  mouseY = pos.y;
  if (isDrawing) {
    const dx = mouseX - archer.x;
    const dy = mouseY - archer.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    power = Math.min(MAX_POWER, dist / 200);
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (state === STATE.PLAYING && isDrawing) {
    if (power >= MIN_POWER) shootArrow();
    isDrawing = false;
    power = 0;
  }
}, { passive: false });

// ---------- Game control ----------
function startGame() {
  state = STATE.PLAYING;
  score = 0;
  lives = 3;
  level = 1;
  combo = 0;
  comboTimer = 0;
  bestCombo = 0;
  arrows = [];
  balloons = [];
  particles = [];
  floatTexts = [];
  spawnTimer = 0;
  spawnInterval = 2.0;
  // Spawn a few initial balloons
  for (let i = 0; i < 3; i++) spawnBalloon();
}

// ---------- Start ----------
requestAnimationFrame(gameLoop);

})();
</script>
</body>
</html>
