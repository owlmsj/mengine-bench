<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Fuji and Chureito Pagoda</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9b9b0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const hash=(x,z)=>{const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s);};
const FOG=0xe8b4b8;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(FOG,70,330);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,0.1,1200);
const camBase=new THREE.Vector3(2,8.5,32), look=new THREE.Vector3(0,17,-60);
camera.position.copy(camBase); camera.lookAt(look);

// sky dome
const sky=new THREE.Mesh(new THREE.SphereGeometry(700,32,16),new THREE.ShaderMaterial({
 side:THREE.BackSide,depthWrite:false,
 uniforms:{sun:{value:new THREE.Vector3(-0.35,0.12,-1).normalize()}},
 vertexShader:'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:`varying vec3 d;uniform vec3 sun;
 void main(){float h=clamp(d.y,0.,1.);
 vec3 hor=vec3(.96,.72,.68),mid=vec3(.62,.52,.72),top=vec3(.2,.22,.45);
 vec3 c=mix(hor,mid,smoothstep(0.,.25,h));c=mix(c,top,smoothstep(.2,.8,h));
 float s=max(dot(d,sun),0.);c+=vec3(1.,.6,.35)*pow(s,24.)*.55+vec3(1.,.85,.6)*pow(s,300.)*1.2;
 gl_FragColor=vec4(c,1.);}`}));
scene.add(sky);
scene.add(new THREE.HemisphereLight(0xffd6d0,0x6a5a7a,1.1));
const sunL=new THREE.DirectionalLight(0xffc89a,2.2); sunL.position.set(-40,30,-30); scene.add(sunL);

// terrain
function groundY(x,z){
 let y=0.6*Math.sin(x*.21)*Math.cos(z*.17)+0.35*Math.sin(x*.5+z*.4);
 y+=0.0045*x*x*(z>-40?1:0.4);
 y+=-0.03*Math.max(0,-z-20)*0.6;
 y+=9*Math.exp(-Math.pow((z+75)/16,2))*(0.55+0.45*Math.sin(x*.06+1))*(Math.abs(x)>14?1:0.45);
 return y;}
{
 const g=new THREE.PlaneGeometry(520,420,130,105); g.rotateX(-Math.PI/2);
 const p=g.attributes.position;
 for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i)-60;p.setY(i,groundY(x,z)+(hash(x,z)-.5)*0.5);p.setZ(i,z);}
 const ng=g.toNonIndexed(); ng.computeVertexNormals();
 const pp=ng.attributes.position, col=new Float32Array(pp.count*3), c=new THREE.Color();
 for(let i=0;i<pp.count;i+=3){
  const cx=(pp.getX(i)+pp.getX(i+1)+pp.getX(i+2))/3,cy=(pp.getY(i)+pp.getY(i+1)+pp.getY(i+2))/3,cz=(pp.getZ(i)+pp.getZ(i+1)+pp.getZ(i+2))/3;
  const n=hash(Math.floor(cx*3),Math.floor(cz*3));
  c.setHSL(0.27+0.05*n,0.38,0.2+0.1*n+0.012*cy);
  if(cz<-60) c.setHSL(0.45,0.25,0.22+0.07*n);
  if(Math.abs(cx)<3&&cz>-4&&cz<30) c.setHSL(0.09,0.3,0.45+0.05*n);
  for(let k=0;k<3;k++){col[(i+k)*3]=c.r;col[(i+k)*3+1]=c.g;col[(i+k)*3+2]=c.b;}
 }
 ng.setAttribute('color',new THREE.BufferAttribute(col,3));
 scene.add(new THREE.Mesh(ng,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true})));
}

// Fuji
{
 const R=78,H=62,g=new THREE.ConeGeometry(R,H,16,10,true); g.translate(0,H/2,0);
 const p=g.attributes.position;
 for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  const a=Math.atan2(z,x), j=(Math.sin(a*5)*.8+Math.sin(a*9+y*.1)*.5)*(y<H-1?1:0);
  const s=1+0.03*j; const k=y>H-0.1?0:1;
  p.setXYZ(i,x*s,y+(hash(x*.5,z*.5)-.5)*1.2*k,z*s);}
 const ng=g.toNonIndexed(); ng.computeVertexNormals();
 const pp=ng.attributes.position,col=new Float32Array(pp.count*3),c=new THREE.Color();
 for(let i=0;i<pp.count;i+=3){
  const cy=(pp.getY(i)+pp.getY(i+1)+pp.getY(i+2))/3, cx=(pp.getX(i)+pp.getX(i+1)+pp.getX(i+2))/3, cz=(pp.getZ(i)+pp.getZ(i+1)+pp.getZ(i+2))/3;
  const a=Math.atan2(cz,cx);
  const snowLine=H*(0.62+0.07*Math.sin(a*7)+0.06*Math.sin(a*13+1)+0.03*hash(cx,cz));
  if(cy>snowLine) c.setHSL(0.6,0.25,0.9-0.12*hash(cx*2,cz*2));
  else c.setHSL(0.68-0.05*(cy/H),0.22,0.38+0.08*hash(cx,cz)+0.05*(cy/H));
  for(let k=0;k<3;k++){col[(i+k)*3]=c.r;col[(i+k)*3+1]=c.g;col[(i+k)*3+2]=c.b;}}
 ng.setAttribute('color',new THREE.BufferAttribute(col,3));
 const m=new THREE.Mesh(ng,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true,side:THREE.DoubleSide}));
 m.position.set(8,-6,-135); m.scale.set(1.25,1,0.8); scene.add(m);
}

// clouds
const clouds=[];
{
 const mat=new THREE.MeshLambertMaterial({color:0xffe3df,flatShading:true,transparent:true,opacity:.85});
 for(let i=0;i<9;i++){const grp=new THREE.Group();
  for(let j=0;j<4;j++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(3+rnd()*3,0),mat);m.scale.set(1.8,.45,.9);m.position.set(j*4-6+rnd()*2,rnd()*1.2,rnd()*2);grp.add(m);}
  grp.position.set(-90+i*24,30+rnd()*14,-120-rnd()*40); grp.userData.v=.4+rnd()*.5; scene.add(grp); clouds.push(grp);}
}

// pagoda (5 tiers)
{
 const pagoda=new THREE.Group();
 const red=new THREE.MeshLambertMaterial({color:0xc4271f,flatShading:true});
 const dark=new THREE.MeshLambertMaterial({color:0x3a3033,flatShading:true});
 const wood=new THREE.MeshLambertMaterial({color:0x6b4a38,flatShading:true});
 const gold=new THREE.MeshLambertMaterial({color:0xe3b341,flatShading:true});
 const stone=new THREE.MeshLambertMaterial({color:0x9a958f,flatShading:true});
 const add=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);pagoda.add(m);return m;};
 add(new THREE.BoxGeometry(7,.8,7),stone,0,.4,0);
 add(new THREE.BoxGeometry(5.6,.5,5.6),stone,0,1.05,0);
 let y=1.3;
 for(let t=0;t<5;t++){
  const w=3.6-t*.42, bh=1.15;
  add(new THREE.BoxGeometry(w,bh,w),red,0,y+bh/2,0);
  for(const s of [-1,1]){
   add(new THREE.BoxGeometry(.18,bh,.18),wood,s*w/2,y+bh/2,w/2);
   add(new THREE.BoxGeometry(.18,bh,.18),wood,s*w/2,y+bh/2,-w/2);}
  add(new THREE.BoxGeometry(w*.5,bh*.55,.05),dark,0,y+bh/2,w/2+.03);
  y+=bh;
  const rw=w+1.9;
  add(new THREE.BoxGeometry(rw,.18,rw),dark,0,y+.09,0);
  const roof=add(new THREE.ConeGeometry(rw*.78,.95,4),dark,0,y+.18+.475,0); roof.rotation.y=Math.PI/4;
  y+=.18+.8;
 }
 add(new THREE.CylinderGeometry(.07,.07,2.6,6),gold,0,y+1.2,0);
 for(let i=0;i<5;i++) add(new THREE.TorusGeometry(.22-i*.02,.04,4,8),gold,0,y+.6+i*.4,0).rotation.x=Math.PI/2;
 add(new THREE.ConeGeometry(.15,.5,6),gold,0,y+2.7,0);
 const px=-9,pz=4; pagoda.position.set(px,groundY(px,pz)+.1,pz); scene.add(pagoda);
 for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(2.6,.3,1),stone);m.position.set(px,groundY(px,pz+5+i)+.1,pz+5+i);scene.add(m);}
}

// cherry trees
const canopies=[];
{
 const trunkM=new THREE.MeshLambertMaterial({color:0x4a3328,flatShading:true});
 const pinks=[0xffb7c9,0xff9ebb,0xffd0dc,0xf58cac].map(c=>new THREE.MeshLambertMaterial({color:c,flatShading:true}));
 function tree(x,z,s){
  const g=new THREE.Group(), h=3.2*s;
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.25*s,.45*s,h,6),trunkM); tr.position.y=h/2; tr.rotation.z=(rnd()-.5)*.15; g.add(tr);
  const cg=new THREE.Group(); cg.position.y=h;
  const n=5+Math.floor(rnd()*3);
  for(let i=0;i<n;i++){const r=(1.4+rnd()*1.1)*s;
   const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),pinks[Math.floor(rnd()*4)]);
   m.position.set((rnd()-.5)*3.4*s,(rnd()-.2)*1.6*s+.8*s,(rnd()-.5)*3.4*s); m.rotation.set(rnd()*3,rnd()*3,rnd()*3); cg.add(m);}
  g.add(cg); g.position.set(x,groundY(x,z)-.1,z); g.rotation.y=rnd()*6; scene.add(g);
  canopies.push({g:cg,ph:rnd()*6});
 }
 const spots=[[-4,22,1.5],[-14,18,1.8],[-22,10,1.6],[7,24,1.3],[13,19,1.7],[19,12,1.5],[24,22,1.9],[-24,24,1.7],[-18,0,1.4],[-3,10,1.0],[16,2,1.5],[-13,8,1.2],[-6,-4,1.2],[10,-6,1.3],[-28,-8,1.6],[24,-4,1.7],[-12,-14,1.4],[5,-20,1.6],[-20,-26,1.8],[18,-28,1.8],[30,8,1.8],[-33,14,2]];
 for(const [x,z,s] of spots) tree(x,z,s);
 const pine=new THREE.MeshLambertMaterial({color:0x264a3a,flatShading:true});
 for(let i=0;i<70;i++){const x=(rnd()-.5)*160,z=-20-rnd()*60; if(Math.abs(x)<8&&z>-30)continue;
  const m=new THREE.Mesh(new THREE.ConeGeometry(1.4,5,5),pine); m.position.set(x,groundY(x,z)+2.3,z); m.scale.setScalar(.8+rnd()*.8); scene.add(m);}
}

// petals
const N=500, pos=new Float32Array(N*3), vel=[];
for(let i=0;i<N;i++){pos.set([(rnd()-.5)*70,rnd()*22,-30+rnd()*70],i*3);vel.push([.3+rnd()*.5,-(.8+rnd()*.8),(rnd()-.5)*.3,rnd()*6]);}
const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xffc2d4,size:.28,sizeAttenuation:true,fog:false})));

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
 for(let i=0;i<N;i++){const v=vel[i];
  pos[i*3]+=(v[0]+Math.sin(t+v[3])*.3)*dt; pos[i*3+1]+=v[1]*dt; pos[i*3+2]+=(v[2]+Math.cos(t*.7+v[3])*.2)*dt;
  if(pos[i*3+1]<0||pos[i*3]>35){pos[i*3]=-35+rnd()*20;pos[i*3+1]=14+rnd()*8;pos[i*3+2]=-30+rnd()*70;}}
 pg.attributes.position.needsUpdate=true;
 for(const c of canopies){c.g.rotation.z=Math.sin(t*.8+c.ph)*.02;c.g.rotation.x=Math.cos(t*.6+c.ph)*.015;}
 for(const c of clouds){c.position.x+=c.userData.v*dt; if(c.position.x>120)c.position.x=-120;}
 camera.position.set(camBase.x+Math.sin(t*.12)*1.6,camBase.y+Math.sin(t*.17)*.3,camBase.z);
 camera.lookAt(look);
 renderer.render(scene,camera);
});
</script></body></html>
