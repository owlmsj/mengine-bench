<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神奈川沖浪裏 — low-poly 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f1e8d3}
  canvas{display:block}
  #ui{position:fixed;inset:0;pointer-events:none;font-family:'Shippori Mincho','Noto Serif JP',serif}
  .cartouche{position:absolute;top:22px;left:22px;border:2px solid #1c3a5e;background:rgba(246,239,221,.92);
    padding:14px 9px;display:flex;gap:8px}
  .cartouche .main{writing-mode:vertical-rl;font-size:26px;font-weight:800;color:#1c3a5e;letter-spacing:.35em}
  .cartouche .sub{writing-mode:vertical-rl;font-size:12px;font-weight:600;color:#41587a;letter-spacing:.28em}
  .caption{position:absolute;left:22px;bottom:18px;font-family:'Noto Serif JP',serif;font-size:13px;
    color:#41587a;background:rgba(246,239,221,.8);padding:6px 12px;border-left:3px solid #1c3a5e}
</style>
</head>
<body>
<div id="ui">
  <div class="cartouche">
    <div class="main">神奈川沖浪裏</div>
    <div class="sub">富嶽三十六景</div>
  </div>
  <div class="caption">The Great Wave off Kanagawa · Katsushika Hokusai, c.&nbsp;1831 · public domain — rebuilt as low-poly 3D</div>
</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---- palette sampled from the print ----
const PAPER = 0xf1e8d3;  // cream paper sky
const DEEP  = 0x1c3a5e;  // deep Prussian blue
const MID   = 0x2f5f8f;  // mid blue
const SOFT  = 0x5f8fb8;  // soft blue
const PALE  = 0x9fc2da;  // pale blue
const FOAM  = 0xf4f2ea;  // white foam
const FUJI  = 0x71808f;  // Mt Fuji grey
const SNOW  = 0xf6f4ec;  // snow cap
const PINK  = 0xd69a72;  // foreground boat hull
const TRIM  = 0xe9e2d0;  // light hull trim
const WATER = 0x17304f;  // deep water

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.Fog(PAPER, 40, 95);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.5, 3, 33);
camera.lookAt(0.5, 1.2, 0);

scene.add(new THREE.HemisphereLight(0xfff6e6, 0x24405f, 1.0));
const sun = new THREE.DirectionalLight(0xfff1da, 1.2);
sun.position.set(8, 14, 10);
scene.add(sun);

const mat = (hex) => new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:1, metalness:0});

// ================= GREAT WAVE (left) =================
const wave = new THREE.Group();
wave.position.set(-8.5, 1.5, 0);

// wave face: white foam inside the curl
wave.add(new THREE.Mesh(new THREE.CircleGeometry(7.0, 22), mat(FOAM)));

// concentric curl bands, outer -> inner (the print's nested blue arcs)
const band = (r, tube, arc, hex, seg=28) => {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 8, seg, arc), mat(hex));
  wave.add(m); return m;
};
band(7.0, 1.7, Math.PI*1.50, DEEP);
band(5.4, 1.1, Math.PI*1.45, MID);
band(3.6, 0.9, Math.PI*1.40, SOFT);
band(2.0, 0.7, Math.PI*1.30, PALE);

// foam "claws": white spikes around the crest, curling outward
const claws = new THREE.Group();
{
  const n = 12, r = 8.1, a0 = -0.10*Math.PI, a1 = 0.75*Math.PI;
  for (let i=0; i<n; i++){
    const a = a0 + (a1-a0)*(i/(n-1));
    const s = 1.0 + 0.45*Math.sin(i/(n-1)*Math.PI); // longer at the tip
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.42*s, 1.35*s, 5), mat(FOAM));
    c.position.set(Math.cos(a)*r, Math.sin(a)*r, 0.4);
    c.rotation.z = a - Math.PI/2;                    // point radially outward
    c.rotation.x = -0.25;                            // slight curl forward
    claws.add(c);
  }
  wave.add(claws);
}

// scattered foam dots on the face
{
  for (let i=0; i<22; i++){
    const a = -0.5*Math.PI + Math.random()*1.6*Math.PI;
    const r = 1.2 + Math.random()*4.6;
    const d = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16+Math.random()*0.2, 0), mat(FOAM));
    d.position.set(Math.cos(a)*r, Math.sin(a)*r, 0.6);
    wave.add(d);
  }
}

// base wedge: wave body sinking into the water at lower left
{
  const w = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), mat(DEEP));
  w.scale.set(7.5, 2.2, 3.2);
  w.position.set(-7, -4.6, 1);
  w.rotation.z = 0.16;
  wave.add(w);
}
scene.add(wave);

// secondary wave crests in the foreground (lower right), smaller echoes
function crest(x, y, z, s){
  const g = new THREE.Group();
  g.position.set(x, y, z); g.scale.setScalar(s);
  g.add(new THREE.Mesh(new THREE.TorusGeometry(3.2, 1.0, 8, 20, Math.PI*1.4), mat(MID)));
  g.add(new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.7, 8, 16, Math.PI*1.3), mat(SOFT)));
  const n = 7;
  for (let i=0;i<n;i++){
    const a = -0.15*Math.PI + 1.15*Math.PI*(i/(n-1));
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.95, 5), mat(FOAM));
    c.position.set(Math.cos(a)*3.9, Math.sin(a)*3.9, 0.3);
    c.rotation.z = a - Math.PI/2;
    g.add(c);
  }
  scene.add(g); return g;
}
const crestA = crest(-3.5, -4.6, 7.5, 0.9);
const crestB = crest(7.5, -5.4, 6.5, 1.1);
const crestC = crest(13.5, -4.2, 2.5, 0.75);

// ================= MT FUJI (center-right, background) =================
const fuji = new THREE.Group();
fuji.position.set(7.5, 1.8, -14);
{
  const cone = new THREE.Mesh(new THREE.ConeGeometry(6, 8, 8), mat(FUJI));
  cone.position.y = 4;
  fuji.add(cone);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(3.5, 3.9, 8), mat(SNOW));
  cap.position.y = 6.05;
  cap.rotation.y = Math.PI/8;   // offset edges -> jagged snow line
  fuji.add(cap);
}
scene.add(fuji);

// ================= BOATS (three, as in the print) =================
function makeBoat(hullHex, {len=6, w=1.7, crew=6}={}){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), mat(hullHex));
  hull.scale.set(len/2, 0.85, w/2);
  g.add(hull);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(len*0.88, 0.12, w*0.72), mat(TRIM));
  deck.position.y = 0.38;
  g.add(deck);
  for (let i=0; i<crew; i++){
    const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), mat(FOAM));
    head.position.set((i-(crew-1)/2)*(len/crew)*0.8, 0.66, 0);
    g.add(head);
  }
  return g;
}
const boatL = makeBoat(DEEP, {len:5.5, crew:6});   // left, under the wave
boatL.position.set(-8.2, -3.9, 5.2);
boatL.rotation.set(0, 0.35, -0.22);
scene.add(boatL);

const boatF = makeBoat(DEEP, {len:5.5, crew:6});   // in front of Mt Fuji
boatF.position.set(6.3, -2.7, -5);
boatF.rotation.set(0, -0.15, 0.08);
scene.add(boatF);

const boatP = makeBoat(PINK, {len:6.5, crew:7});   // pink hull, lower center
boatP.position.set(0.8, -4.6, 7.0);
boatP.rotation.set(0, -0.35, -0.06);
scene.add(boatP);

// ================= WATER + CLOUDS =================
{
  const water = new THREE.Mesh(new THREE.PlaneGeometry(140, 70), mat(WATER));
  water.rotation.x = -Math.PI/2;
  water.position.set(0, -5.8, -6);
  scene.add(water);
}
const clouds = [];
{
  const cm = mat(0xf6efdd);
  [[11, 10.5, -18, 1.5], [18, 12.5, -22, 2.0], [4, 13, -26, 1.1]].forEach(([x,y,z,s]) => {
    const g = new THREE.Group();
    for (let i=0;i<4;i++){
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(1.1+Math.random()*0.7, 0), cm);
      b.position.set(i*1.5-2.2, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5);
      b.scale.y = 0.5;
      g.add(b);
    }
    g.position.set(x,y,z); g.scale.setScalar(s);
    scene.add(g); clouds.push(g);
  });
}

// ================= GENTLE MOTION =================
const base = {
  wave:  wave.position.y,
  boatL: boatL.position.y, boatF: boatF.position.y, boatP: boatP.position.y,
  crestA: crestA.position.y, crestB: crestB.position.y, crestC: crestC.position.y,
};
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  wave.position.y  = base.wave   + Math.sin(t*0.55)*0.35;
  wave.rotation.z  = Math.sin(t*0.40)*0.030;
  claws.scale.setScalar(1 + Math.sin(t*0.9)*0.04);

  boatL.position.y = base.boatL  + Math.sin(t*0.90 + 0.5)*0.28;
  boatL.rotation.z = -0.22 + Math.sin(t*0.70)*0.07;
  boatF.position.y = base.boatF  + Math.sin(t*0.80 + 2.1)*0.22;
  boatF.rotation.z =  0.08 + Math.sin(t*0.60 + 1.0)*0.05;
  boatP.position.y = base.boatP  + Math.sin(t*1.00 + 4.0)*0.32;
  boatP.rotation.z = -0.06 + Math.sin(t*0.80 + 2.5)*0.08;

  crestA.position.y = base.crestA + Math.sin(t*0.70 + 1.2)*0.25;
  crestB.position.y = base.crestB + Math.sin(t*0.60 + 3.0)*0.30;
  crestC.position.y = base.crestC + Math.sin(t*0.75 + 0.4)*0.20;

  for (let i=0;i<clouds.length;i++){
    clouds[i].position.x += 0.004*(i+1);
    if (clouds[i].position.x > 34) clouds[i].position.x = -34;
  }
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
