<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>o universo das palavras · dicionário criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --panel:rgba(15,19,28,.82); --line:rgba(255,255,255,.08);
    --txt:#e8e6e1; --dim:#9a9aa5;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:Inter,system-ui,sans-serif}
  #scene{position:fixed;inset:0;display:block;cursor:grab}
  #scene.dragging{cursor:grabbing}
  .serif{font-family:Fraunces,Georgia,serif}
  .hud{position:fixed;z-index:10}
  #brand{top:22px;left:26px;max-width:430px;pointer-events:none}
  #brand h1{font-family:Fraunces,serif;font-weight:600;font-size:27px;line-height:1.1;margin:0 0 8px}
  #brand h1 em{font-style:italic;font-weight:400;color:#c9c4bb}
  #brand .sub{margin:0;font-size:12.5px;color:var(--dim);letter-spacing:.02em}
  #brand .sub b{color:var(--txt);font-weight:600}
  #searchbox{position:relative}
  #search{width:270px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);backdrop-filter:blur(10px);color:var(--txt);font:500 13.5px Inter,sans-serif;
    outline:none;transition:border-color .15s}
  #search:focus{border-color:rgba(255,255,255,.35)}
  #search::placeholder{color:var(--dim)}
  #sugg{position:absolute;top:calc(100% + 6px);left:0;width:290px;max-height:290px;overflow:auto;
    background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;
    padding:6px;display:none}
  #sugg.open{display:block}
  #sugg .s{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:9px;
    font-size:13.5px;cursor:pointer;white-space:nowrap}
  #sugg .s:hover{background:rgba(255,255,255,.08)}
  #sugg .s .t{color:var(--dim);font-size:11.5px}
  #panel{top:22px;right:26px;width:308px;max-height:calc(100vh - 44px);overflow:auto;
    background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;
    padding:20px 20px 16px;transition:opacity .18s,transform .18s}
  #panel.hidden{opacity:0;transform:translateX(14px);pointer-events:none}
  #panel h2{font-family:Fraunces,serif;font-weight:600;font-size:34px;margin:0;line-height:1}
  #panel .chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 11px;
    border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.03em;
    border:1px solid var(--line);color:var(--txt)}
  #panel .chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
  #panel .meta{margin:12px 0 4px;font-size:12px;color:var(--dim)}
  #panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);
    margin:16px 0 8px;font-weight:600}
  #panel ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  #panel li button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt);
    border-radius:999px;padding:5px 12px;font:500 12.5px Inter,sans-serif;cursor:pointer;
    transition:background .12s,border-color .12s}
  #panel li button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
  #panel li.ghost button{color:var(--dim);border-style:dashed}
  #panel li.ghost button::after{content:" · pág. ausente";font-size:10.5px;color:#7a7a86}
  #panel .clear{margin-top:16px;width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);
    background:none;color:var(--dim);font:500 12px Inter,sans-serif;cursor:pointer}
  #panel .clear:hover{color:var(--txt);border-color:rgba(255,255,255,.3)}
  #legend{left:26px;bottom:22px;background:var(--panel);backdrop-filter:blur(12px);
    border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  #legend .lt{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);
    margin-bottom:8px;font-weight:600}
  #legend .row{display:flex;flex-wrap:wrap;gap:5px;max-width:330px}
  #legend .row button{display:inline-flex;align-items:center;gap:6px;border-radius:999px;
    border:1px solid var(--line);background:none;color:var(--dim);padding:4px 10px;
    font:500 11.5px Inter,sans-serif;cursor:pointer;transition:all .12s}
  #legend .row button i{width:7px;height:7px;border-radius:50%}
  #legend .row button:hover{color:var(--txt);border-color:rgba(255,255,255,.3)}
  #legend .row button.on{color:var(--txt);border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.07)}
  #hint{right:26px;bottom:22px;font-size:11px;color:var(--dim);text-align:right;pointer-events:none}
  #tip{position:fixed;z-index:20;pointer-events:none;padding:5px 10px;border-radius:8px;
    background:rgba(10,12,18,.92);border:1px solid var(--line);font:600 13px Inter,sans-serif;
    display:none;transform:translate(14px,10px)}
  #tip .serif{font-size:14px}
  @media (max-width:760px){
    #panel{width:calc(100vw - 44px)}
    #brand h1{font-size:21px}
    #legend{display:none}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="brand" class="hud">
  <h1 class="serif">o universo <em>das palavras</em></h1>
  <p class="sub">dicionário criativo · <b id="st-words"></b> palavras · <b id="st-rel"></b> ligações ·
  mais conectada: <b id="st-top"></b></p>
  <div id="searchbox" style="margin-top:14px;pointer-events:auto">
    <input id="search" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="sugg"></div>
  </div>
</div>

<div id="panel" class="hud hidden"></div>
<div id="legend" class="hud"><div class="lt">temas</div><div class="row" id="legend-row"></div></div>
<div id="hint" class="hud">arrastar gira · roda aproxima<br>clique em uma palavra · esc limpa</div>
<div id="tip"></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const DATA = JSON.parse(document.getElementById("data").textContent);
const { words, meta, ghosts, themes, colors, stats, edges } = DATA;
const WORDS = Object.keys(words);
const ALL = [...WORDS, ...Object.keys(ghosts)];
const deg = w => meta[w].degree;
const noAccent = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

// ---------- scene ----------
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 110, 260);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);

const BG = new THREE.Color(0x0b0e14);
const nodeGeo = new THREE.SphereGeometry(1, 20, 14);
const nodes = {};           // word -> mesh
const nodePos = {};         // word -> Vector3
for (const w of ALL) {
  const ghost = !meta[w];
  const color = ghost ? new THREE.Color(0x5b6270) : new THREE.Color(colors[meta[w].tema]);
  const mat = new THREE.MeshBasicMaterial({ color: color.clone(), transparent: true, opacity: ghost ? 0.55 : 1 });
  const m = new THREE.Mesh(nodeGeo, mat);
  const p = ghost ? ghostPos(w) : new THREE.Vector3(...meta[w].pos);
  const r = ghost ? 0.85 : 0.55 + deg(w) * 0.055;
  m.scale.setScalar(r);
  m.position.copy(p);
  m.userData = { word: w, ghost, base: color.clone(), r };
  scene.add(m);
  nodes[w] = m;
  nodePos[w] = p;
}
// deterministic pseudo-positions for ghost nodes, near their referrers
function ghostPos(w) {
  const from = ghosts[w].from;
  if (!from.length) return new THREE.Vector3(40, 30, 0);
  let s = new THREE.Vector3();
  for (const f of from) s.add(nodePos[f] || new THREE.Vector3());
  s.multiplyScalar(1 / from.length).multiplyScalar(1.25);
  return s;
}
// (ghost nodes are created after words in ALL, so nodePos is ready)

// ---------- edges ----------
const ePos = [], eCol = [], ePair = [];
{
  const col = new THREE.Color();
  for (const [a, b] of edges) {
    ePair.push([a, b]);
    ePos.push(...nodePos[a].toArray(), ...nodePos[b].toArray());
    const ca = nodes[a].userData.base, cb = nodes[b].userData.base;
    eCol.push(ca.r, ca.g, ca.b, cb.r, cb.g, cb.b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(ePos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(eCol, 3));
  const lines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.14 }));
  scene.add(lines);
  DATA._lines = lines;
}
const lines = DATA._lines;

// ---------- labels ----------
const labels = {};
function makeLabel(text, bright) {
  const c = document.createElement("canvas");
  let ctx = c.getContext("2d");
  const fs = 44;
  const font = `500 ${fs}px Inter, sans-serif`;
  ctx.font = font;
  const wpx = Math.ceil(ctx.measureText(text).width) + 26;
  c.width = wpx; c.height = 68;
  ctx = c.getContext("2d");
  ctx.font = font; ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,.95)"; ctx.shadowBlur = 10;
  ctx.fillStyle = bright ? "#ffffff" : "rgba(240,238,232,.9)";
  ctx.fillText(text, 13, 36);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const sy = 2.1 + text.length * 0.012;
  spr.scale.set(sy * wpx / 68, sy, 1);
  return spr;
}
for (const w of ALL) {
  labels[w] = makeLabel(w, false);
  labels[w].position.copy(nodePos[w]).add(new THREE.Vector3(0, nodes[w].userData.r + 1.5, 0));
  scene.add(labels[w]);
}
function setLabel(w, on) { labels[w].visible = on; }

// ---------- camera / orbit ----------
const orbit = { r: 100, phi: 1.12, theta: 0.65 };
const target = new THREE.Vector3(0, 0, 0);
const targetGoal = new THREE.Vector3(0, 0, 0);
function applyCamera() {
  camera.position.setFromSphericalCoords(orbit.r, orbit.phi, orbit.theta).add(target);
  camera.lookAt(target);
}
let autoRotate = true;
canvas.addEventListener("pointerdown", e => {
  autoRotate = false;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY, moved: 0, id: e.pointerId };
});
canvas.addEventListener("pointermove", e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  tip.style.left = e.clientX + "px";
  tip.style.top = e.clientY + "px";
  if (!drag) { hover(e); return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  drag.x = e.clientX; drag.y = e.clientY;
  orbit.theta -= dx * 0.005;
  orbit.phi = Math.min(Math.PI - 0.12, Math.max(0.12, orbit.phi - dy * 0.005));
});
canvas.addEventListener("pointerup", e => {
  canvas.classList.remove("dragging");
  const wasDrag = drag && drag.moved > 6;
  drag = null;
  if (!wasDrag) pick(e);
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  autoRotate = false;
  orbit.r = Math.min(240, Math.max(22, orbit.r * Math.exp(e.deltaY * 0.001)));
}, { passive: false });
let drag = null;
addEventListener("keydown", e => {
  if (e.key === "Escape") { select(null); document.activeElement?.blur(); hideSugg(); }
});

// ---------- picking ----------
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2(-2, -2);
const tip = document.getElementById("tip");
function hover(e) {
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(Object.values(nodes), false)[0];
  if (hit) {
    const w = hit.object.userData.word;
    tip.innerHTML = hit.object.userData.ghost
      ? `<span class="serif">${w}</span> <span style="color:#7a7a86;font-weight:400">página ausente</span>`
      : `<span class="serif">${w}</span>`;
    tip.style.display = "block";
    canvas.style.cursor = "pointer";
  } else { tip.style.display = "none"; canvas.style.cursor = ""; }
}
function pick(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(Object.values(nodes), false)[0];
  select(hit ? hit.object.userData.word : null);
}

// ---------- selection / highlight ----------
const neighOf = w => {
  const s = new Set(words[w] || []);
  for (const g of Object.keys(ghosts)) if (ghosts[g].from.includes(w)) s.add(g);
  return s;
};
function paint() {
  const sel = state.selected, theme = state.theme;
  for (const w of ALL) {
    const n = nodes[w], u = n.userData;
    let full = true;
    if (sel) full = w === sel || state.neigh.has(w);
    else if (theme) full = !u.ghost && meta[w].tema === theme;
    if (full) n.material.color.copy(u.base).lerp(new THREE.Color(0xffffff), w === sel ? 0.5 : 0);
    else n.material.color.copy(u.base).lerp(BG, 0.72);
    n.material.opacity = u.ghost ? (full ? 0.6 : 0.22) : (full ? 1 : 0.3);
  }
  // edges: vertex colors dimmed unless incident to selection / in theme
  const attr = lines.geometry.getAttribute("color");
  for (let i = 0; i < ePair.length; i++) {
    const [a, b] = ePair[i];
    let on = true;
    if (sel) on = a === sel || b === sel;
    else if (theme) on = !nodes[a].userData.ghost && meta[a].tema === theme ||
                         !nodes[b].userData.ghost && meta[b].tema === theme;
    const f = on ? 1 : 0.1;
    attr.setXYZ(i * 2,     eCol[i * 2] * f,       eCol[i * 2 + 1] * f,       eCol[i * 2 + 2] * f);
    attr.setXYZ(i * 2 + 1, eCol[i * 2 + 3] * f,   eCol[i * 2 + 4] * f,       eCol[i * 2 + 5] * f);
  }
  attr.needsUpdate = true;
  lines.material.opacity = sel ? 0.5 : 0.14;
  // labels
  const base = 11;
  for (const w of ALL) {
    let on;
    if (sel) on = w === sel || state.neigh.has(w);
    else if (theme) on = !nodes[w].userData.ghost && meta[w].tema === theme && deg(w) >= 6;
    else on = !nodes[w].userData.ghost && deg(w) >= base;
    setLabel(w, on);
  }
  for (const w of ALL) if (w === state.selected) labels[w].material.opacity = 1;
}
const state = { selected: null, theme: null, neigh: new Set() };
function select(w, fromUrl) {
  state.selected = w;
  state.neigh = w ? neighOf(w) : new Set();
  paint();
  renderPanel(w);
  if (w) { targetGoal.copy(nodePos[w]); orbit.r = Math.min(orbit.r, 85); }
  else targetGoal.set(0, 0, 0);
  if (!fromUrl) {
    history.replaceState(null, "", w ? "?word=" + encodeURIComponent(w) : location.pathname);
  }
}

// ---------- panel ----------
const panel = document.getElementById("panel");
function renderPanel(w) {
  if (!w) { panel.classList.add("hidden"); return; }
  panel.classList.remove("hidden");
  if (ghosts[w]) {
    panel.innerHTML = `
      <h2 class="serif"></h2>
      <span class="chip"><i style="background:#5b6270"></i>sem página</span>
      <p class="meta">esta palavra é citada no dicionário, mas sua página não existe mais.</p>
      <h3>citada em</h3><ul></ul>
      <button class="clear" data-act="clear">voltar ao universo</button>`;
    panel.querySelector("h2").textContent = w;
    const ul = panel.querySelector("ul");
    for (const f of ghosts[w].from) ul.append(li(f, false));
  } else {
    const synl = DATA.sin[w] || [], anl = DATA.anw[w] || [];
    panel.innerHTML = `
      <h2 class="serif"></h2>
      <span class="chip"><i style="background:${colors[meta[w].tema]}"></i>${meta[w].tema}</span>
      <p class="meta">${sinCount(w)} sinônimos · ${anCount(w)} análogas · ${deg(w)} ligações</p>
      <h3>sinônimos</h3><ul></ul>
      <h3>palavras análogas</h3><ul></ul>
      <button class="clear" data-act="clear">voltar ao universo</button>`;
    panel.querySelector("h2").textContent = w;
    const [u1, u2] = panel.querySelectorAll("ul");
    for (const t of synl) u1.append(li(t, true));
    for (const t of anl) u2.append(li(t, true));
    for (const g of Object.keys(ghosts))
      if (ghosts[g].from.includes(w)) u2.append(li(g, false));
    if (!synl.length) u1.parentElement.insertAdjacentHTML("beforeend", "");
  }
  panel.querySelector(".clear").addEventListener("click", () => select(null));
}
const sinCount = w => (DATA.sin[w] || []).length;
const anCount = w => (DATA.anw[w] || []).length + Object.keys(ghosts).filter(g => ghosts[g].from.includes(w)).length;
function li(w, real) {
  const l = document.createElement("li");
  if (!real) l.className = "ghost";
  const b = document.createElement("button");
  b.textContent = w;
  b.addEventListener("click", () => select(w));
  l.append(b);
  return l;
}

// ---------- search ----------
const input = document.getElementById("search");
const sugg = document.getElementById("sugg");
function hideSugg() { sugg.classList.remove("open"); }
input.addEventListener("input", () => {
  const q = noAccent(input.value.trim());
  if (!q) { hideSugg(); return; }
  const hits = ALL.filter(w => noAccent(w).includes(q)).slice(0, 9);
  sugg.innerHTML = "";
  for (const w of hits) {
    const d = document.createElement("div");
    d.className = "s";
    d.innerHTML = `<span class="serif"></span><span class="t"></span>`;
    d.querySelector(".serif").textContent = w;
    d.querySelector(".t").textContent = ghosts[w] ? "sem página" : meta[w].tema;
    d.addEventListener("mousedown", e => { e.preventDefault(); select(w); hideSugg(); input.value = ""; });
    sugg.append(d);
  }
  sugg.classList.toggle("open", hits.length > 0);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const first = sugg.querySelector(".s");
    if (first) first.dispatchEvent(new Event("mousedown", { bubbles: false, cancelable: true }));
  }
});
addEventListener("click", e => { if (!e.target.closest("#searchbox")) hideSugg(); });

// ---------- legend ----------
const legendRow = document.getElementById("legend-row");
for (const t of themes) {
  const b = document.createElement("button");
  b.innerHTML = `<i style="background:${colors[t]}"></i>${t}`;
  b.addEventListener("click", () => {
    state.theme = state.theme === t ? null : t;
    if (state.theme) select(null); // theme filter clears word selection
    else paint();
    for (const x of legendRow.children) x.classList.toggle("on", x === b && state.theme);
  });
  legendRow.append(b);
}

// ---------- header stats ----------
document.getElementById("st-words").textContent = stats.words;
document.getElementById("st-rel").textContent = stats.relations;
document.getElementById("st-top").textContent = stats.most_connected;

// ---------- boot ----------
applyCamera();
paint();
const urlWord = new URLSearchParams(location.search).get("word");
if (urlWord) {
  const hit = ALL.find(w => w.toLowerCase() === urlWord.toLowerCase())
          || ALL.find(w => noAccent(w) === noAccent(urlWord));
  if (hit) select(hit, true);
}
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
function frame() {
  requestAnimationFrame(frame);
  if (autoRotate) orbit.theta += 0.0009;
  target.lerp(targetGoal, 0.06);
  applyCamera();
  // gentle pulse on the selected node
  if (state.selected) {
    const n = nodes[state.selected];
    const s = n.userData.r * (1 + 0.06 * Math.sin(performance.now() * 0.004));
    n.scale.setScalar(s);
  }
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
