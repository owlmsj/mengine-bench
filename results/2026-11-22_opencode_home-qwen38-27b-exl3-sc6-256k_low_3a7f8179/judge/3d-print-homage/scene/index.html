<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa — low poly 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8ddc4; }
  #app { position: fixed; inset: 0; }
  #title {
    position: fixed; left: 24px; bottom: 20px; z-index: 2;
    font-family: "Zen Old Mincho", serif; color: #16324f;
    text-shadow: 0 1px 0 rgba(255,255,255,.5); pointer-events: none;
  }
  #title h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  #title p { margin: 2px 0 0; font-size: 12px; opacity: .75; }
</style>
</head>
<body>
<div id="app"></div>
<div id="title">
  <h1>神奈川沖浪裏</h1>
  <p>The Great Wave off Kanagawa · after Katsushika Hokusai (public domain)</p>
</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/* ---------- palette sampled from the print ---------- */
const C = {
  skyTop:   0xf3ead2,  // warm paper cream
  skyBot:   0xe4d6b4,
  deep:     0x16324f,  // darkest indigo
  mid:      0x1f4e79,  // mid indigo
  light:    0x5b8cae,  // pale blue
  foam:     0xf2efe4,  // white foam
  paper:    0xe8ddc4,
  hull:     0xc98d5a,  // tan hull
  hullDark: 0x8a5a33,
  fuji:     0x2b4a6b,  // Fuji blue
  fujiSnow: 0xf4f1e8,
  ink:      0x101820,
};

/* ---------- renderer / scene / camera ---------- */
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.skyTop);
scene.fog = new THREE.Fog(C.skyBot, 60, 160);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 7, 46);
camera.lookAt(0, 4, 0);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(C.skyTop, C.mid, 1.1));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.2);
sun.position.set(-20, 30, 20);
scene.add(sun);

/* ---------- sky gradient plane (paper) ---------- */
{
  const g = new THREE.BufferGeometry();
  const pos = new Float32Array([-100, -20, -80, 100, -20, -80, 100, 60, -80, -100, 60, -80]);
  const top = new THREE.Color(C.skyTop), bot = new THREE.Color(C.skyBot);
  const col = new Float32Array([
    bot.r, bot.g, bot.b,
    bot.r, bot.g, bot.b,
    top.r, top.g, top.b,
    top.r, top.g, top.b,
  ]);
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const m = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
  scene.add(new THREE.Mesh(g, m));
}

/* ---------- helpers ---------- */
function mat(color, flat = true) {
  return new THREE.MeshStandardMaterial({ color, flatShading: flat, roughness: .9, metalness: 0 });
}
function coneGeo(r, h, seg) { return new THREE.ConeGeometry(r, h, seg); }

/* ---------- Mt. Fuji: flat blue cone + snow cap ---------- */
const fuji = new THREE.Group();
{
  const body = new THREE.Mesh(coneGeo(16, 18, 5), mat(C.fuji));
  body.position.y = 9;
  fuji.add(body);
  // snow cap: shorter lighter cone on top, slightly smaller
  const cap = new THREE.Mesh(coneGeo(6.2, 7, 5), mat(C.fujiSnow));
  cap.position.y = 18 - 3.5 + 1.2;
  fuji.add(cap);
  // jagged snow edge: ring of small white cones
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.4;
    const s = new THREE.Mesh(coneGeo(1.6, 2.4, 4), mat(C.fujiSnow));
    s.position.set(Math.cos(a) * 5.6, 15.6, Math.sin(a) * 5.6);
    fuji.add(s);
  }
}
fuji.position.set(14, -8, -52);
scene.add(fuji);

/* ---------- clouds: low-poly puffs (paper-white) ---------- */
const clouds = new THREE.Group();
function puff(x, y, z, s) {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s * (0.7 + Math.random() * 0.5), 0), mat(C.foam));
    m.position.set((i - 1.5) * s * 0.8, (Math.random() - .5) * s * .4, (Math.random() - .5) * s * .5);
    g.add(m);
  }
  g.position.set(x, y, z);
  clouds.add(g);
}
puff(-30, 26, -60, 4); puff(18, 30, -66, 5); puff(48, 24, -58, 3.5); puff(-52, 30, -70, 4.5);
scene.add(clouds);

/* ---------- wave builder: a curling crest (torus arc) + foam claws ----------
   The print's signature is a wave curling over itself with claw-like foam.
   We build: a dark indigo body (tapered box), a curling crest (torus arc),
   and white foam "claws" (small cones) fanning from the crest tip. */
function makeWave(scale = 1) {
  const g = new THREE.Group();

  // body: a long tapered wedge of deep indigo (the wave's face)
  const body = new THREE.Mesh(new THREE.BoxGeometry(14, 6, 6), mat(C.deep));
  body.position.set(-2, 1, 0);
  body.rotation.z = 0.12;
  g.add(body);
  // a lighter mid band on the face
  const face = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 5), mat(C.mid));
  face.position.set(-1, 2.2, 0.4);
  face.rotation.z = 0.12;
  g.add(face);

  // the curl: a torus arc (3/4 ring) forming the overhanging crest
  const curl = new THREE.Mesh(
    new THREE.TorusGeometry(5, 1.6, 6, 14, Math.PI * 1.5),
    mat(C.deep)
  );
  curl.position.set(3, 5, 0);
  curl.rotation.z = Math.PI * 0.15;
  g.add(curl);
  // inner curl highlight
  const curlIn = new THREE.Mesh(
    new THREE.TorusGeometry(3.4, 1.0, 6, 12, Math.PI * 1.3),
    mat(C.light)
  );
  curlIn.position.set(3, 5, 0.2);
  curlIn.rotation.z = Math.PI * 0.15;
  g.add(curlIn);

  // foam claws: white cones fanning out from the crest tip (the "fingers")
  for (let i = 0; i < 7; i++) {
    const a = -0.9 + i * 0.32;
    const claw = new THREE.Mesh(coneGeo(0.7, 2.6, 5), mat(C.foam));
    claw.position.set(3 + Math.cos(a) * 5.5, 5 + Math.sin(a) * 5.5, 0);
    claw.rotation.z = a + Math.PI / 2;
    g.add(claw);
  }
  // foam along the base of the face
  for (let i = 0; i < 8; i++) {
    const f = new THREE.Mesh(coneGeo(0.6, 1.6, 5), mat(C.foam));
    f.position.set(-8 + i * 2.2, 4.5 + Math.sin(i) * 0.4, 0.6);
    f.rotation.z = 0.3;
    g.add(f);
  }

  g.scale.setScalar(scale);
  return g;
}

/* the great wave: big curling wave on the left, crest overhanging right */
const greatWave = makeWave(1.3);
greatWave.position.set(-13, -2, -4);
scene.add(greatWave);

/* secondary waves across the foreground, smaller and lower */
const waves = [];
const waveSpecs = [
  { x: 8,   z: 4,  s: 0.85, rz: -0.08 },
  { x: 24,  z: 0,  s: 0.7,  rz: -0.12 },
  { x: -4,  z: 10, s: 0.65, rz: 0.05 },
  { x: 32,  z: 8,  s: 0.55, rz: -0.1 },
  { x: -24, z: 6,  s: 0.6,  rz: 0.08 },
];
waveSpecs.forEach((w) => {
  const wv = makeWave(w.s);
  wv.position.set(w.x, -2, w.z);
  wv.rotation.z = w.rz;
  scene.add(wv);
  waves.push(wv);
});

/* ---------- boats: tan hull (box) + crew (small cones) ---------- */
function makeBoat() {
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(6, 0.9, 1.8), mat(C.hull));
  hull.position.y = 0;
  g.add(hull);
  // upturned prow/stern: thin angled boxes
  const prow = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 1.4), mat(C.hullDark));
  prow.position.set(3.2, 0.5, 0); prow.rotation.z = 0.5;
  const stern = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 1.4), mat(C.hullDark));
  stern.position.set(-3.2, 0.5, 0); stern.rotation.z = -0.5;
  g.add(prow, stern);
  // crew: row of small dark cones
  for (let i = 0; i < 5; i++) {
    const c = new THREE.Mesh(coneGeo(0.28, 0.9, 5), mat(C.ink));
    c.position.set(-2 + i * 1, 0.85, 0);
    g.add(c);
  }
  return g;
}

/* three boats, matching the print: one left, one centre-right, one foreground */
const boats = [];
const boatSpecs = [
  { x: -16, y: 3.5, z: 0,  ry: 0.3,  s: 1.0 },
  { x: 14,  y: 1.5, z: -4, ry: -0.4, s: 0.9 },
  { x: 2,   y: 0.5, z: 10, ry: 0.1,  s: 1.1 },
];
boatSpecs.forEach((b) => {
  const boat = makeBoat();
  boat.position.set(b.x, b.y, b.z);
  boat.rotation.y = b.ry;
  boat.scale.setScalar(b.s);
  scene.add(boat);
  boats.push(boat);
});

/* ---------- gentle motion ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // waves bob and roll
  greatWave.position.y = Math.sin(t * 0.8) * 0.6;
  greatWave.rotation.z = 0.15 + Math.sin(t * 0.6) * 0.04;
  waves.forEach((w, i) => {
    w.position.y = -1 + Math.sin(t * 0.9 + i) * 0.5;
    w.rotation.z += Math.sin(t * 0.5 + i) * 0.0015;
  });

  // boats ride the swell
  boats.forEach((b, i) => {
    b.position.y += Math.sin(t * 1.2 + i * 1.7) * 0.012;
    b.rotation.z = Math.sin(t * 1.0 + i) * 0.08;
    b.rotation.x = Math.cos(t * 0.8 + i) * 0.05;
  });

  // clouds drift
  clouds.rotation.y = Math.sin(t * 0.05) * 0.05;
  clouds.children.forEach((c, i) => { c.position.x += Math.sin(t * 0.1 + i) * 0.002; });

  // Fuji: slow breathing scale for life
  fuji.scale.setScalar(1 + Math.sin(t * 0.2) * 0.004);

  renderer.render(scene, camera);
}
animate();

/* ---------- resize ---------- */
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
