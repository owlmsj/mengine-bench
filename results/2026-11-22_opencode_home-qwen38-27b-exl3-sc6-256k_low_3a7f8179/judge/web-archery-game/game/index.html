<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Blaster 95</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// Balloon Blaster 95 — single-file archery game.
// Aim with mouse, hold to draw the bow (power), release to shoot.
// Pop balloons to score. Miss 3 arrows (or let 5 balloons escape) and you lose.

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- Audio (WebAudio, no assets) ----------
let actx = null;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
  }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function blip(freq, dur, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, hp) {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const len = Math.max(1, Math.floor(a.sampleRate * dur));
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(); src.buffer = buf;
  const g = a.createGain(); g.gain.value = vol || 0.2;
  let node = src;
  if (hp) { const f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp; node.connect(f); node = f; }
  node.connect(g); g.connect(a.destination);
  src.start(t);
}
const sfx = {
  draw: (p) => blip(120 + p * 220, 0.05, "sawtooth", 0.05),
  shoot: () => { noiseBurst(0.12, 0.25, 800); blip(300, 0.12, "triangle", 0.12, 90); },
  pop: () => { noiseBurst(0.08, 0.35, 1500); blip(880, 0.09, "square", 0.18, 1400); },
  miss: () => blip(160, 0.25, "sawtooth", 0.12, 60),
  escape: () => blip(500, 0.3, "triangle", 0.1, 200),
  win: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, 0.18, "square", 0.15), i * 110)); },
  lose: () => { [392, 330, 262, 196].forEach((f, i) => setTimeout(() => blip(f, 0.22, "sawtooth", 0.12), i * 140)); },
  click: () => blip(700, 0.06, "square", 0.12),
};

// ---------- State ----------
const STATE = { MENU: 0, PLAYING: 1, WIN: 2, LOSE: 3 };
let state = STATE.MENU;
let score = 0;
let misses = 0;          // arrows that hit nothing
let escapes = 0;         // balloons that floated away
const MAX_MISSES = 3, MAX_ESCAPES = 5, TARGET_SCORE = 50;

const mouse = { x: W / 2, y: H / 3, down: false };
let drawPower = 0;       // 0..1 while holding
const DRAW_SPEED = 1.4;  // per second
const MAX_DRAW = 1.0;

const archer = { x: 0, y: 0 }; // recomputed on layout
function layoutArcher() { archer.x = Math.max(70, W * 0.12); archer.y = H - 90; }
layoutArcher();
window.addEventListener("resize", layoutArcher);

// ---------- Entities ----------
let balloons = [];
let arrows = [];
let particles = [];
let floaters = []; // score popups
let spawnTimer = 0;
let shake = 0;

const BALLOON_COLORS = ["#ff4d4d", "#ffd23f", "#4dc3ff", "#7dff6b", "#ff7de9", "#ffa94d"];

function spawnBalloon() {
  const r = 22 + Math.random() * 14;
  const fromLeft = Math.random() < 0.5;
  balloons.push({
    x: fromLeft ? -r : W + r,
    y: H * (0.12 + Math.random() * 0.55),
    r,
    vx: (fromLeft ? 1 : -1) * (40 + Math.random() * 50),
    vy: 0,
    phase: Math.random() * Math.PI * 2,
    color: BALLOON_COLORS[(Math.random() * BALLOON_COLORS.length) | 0],
    wobble: 0.6 + Math.random() * 0.8,
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 220;
    particles.push({
      x, y,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
      life: 0.5 + Math.random() * 0.4, age: 0,
      size: 2 + Math.random() * 4, color,
    });
  }
}

function floater(x, y, text, color) {
  floaters.push({ x, y, text, color, age: 0, life: 0.9 });
}

// ---------- Input ----------
canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
});
canvas.addEventListener("mousedown", (e) => {
  audio();
  if (state === STATE.MENU) { startGame(); return; }
  if (state === STATE.WIN || state === STATE.LOSE) { toMenu(); return; }
  if (state === STATE.PLAYING) mouse.down = true;
});
window.addEventListener("mouseup", () => {
  if (state === STATE.PLAYING && mouse.down) {
    mouse.down = false;
    shoot();
  }
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

function startGame() {
  sfx.click();
  state = STATE.PLAYING;
  score = 0; misses = 0; escapes = 0;
  balloons = []; arrows = []; particles = []; floaters = [];
  spawnTimer = 0;
  for (let i = 0; i < 4; i++) spawnBalloon();
}
function toMenu() { sfx.click(); state = STATE.MENU; }

function shoot() {
  const p = drawPower;
  drawPower = 0;
  const dx = mouse.x - archer.x, dy = mouse.y - (archer.y - 40);
  const dist = Math.hypot(dx, dy) || 1;
  const speed = 500 + p * 900;
  arrows.push({
    x: archer.x, y: archer.y - 40,
    vx: (dx / dist) * speed, vy: (dy / dist) * speed,
    p,
  });
  sfx.shoot();
  shake = Math.min(6, 2 + p * 4);
}

// ---------- Update ----------
let last = performance.now();
function update(dt) {
  if (state !== STATE.PLAYING) return;

  if (mouse.down) {
    const before = drawPower;
    drawPower = Math.min(MAX_DRAW, drawPower + dt * DRAW_SPEED);
    if (Math.floor(before * 10) !== Math.floor(drawPower * 10)) sfx.draw(drawPower);
  }

  // spawn balloons
  spawnTimer -= dt;
  const maxBalloons = 6;
  if (spawnTimer <= 0 && balloons.length < maxBalloons) {
    spawnBalloon();
    spawnTimer = 0.9 + Math.random() * 0.8;
  }

  // balloons
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    b.phase += dt * b.wobble;
    b.x += b.vx * dt;
    b.y += (Math.sin(b.phase) * 14 - 12) * dt; // drift up slowly
    const off = b.r * 2;
    if (b.x < -off || b.x > W + off || b.y < -off) {
      balloons.splice(i, 1);
      escapes++;
      sfx.escape();
      floater(W / 2, H * 0.25, "escaped!", "#ff8080");
      if (escapes >= MAX_ESCAPES) lose();
    }
  }

  // arrows
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.vy += 260 * dt; // gravity
    a.x += a.vx * dt; a.y += a.vy * dt;
    let hit = false;
    for (let j = balloons.length - 1; j >= 0; j--) {
      const b = balloons[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) < b.r + 4) {
        balloons.splice(j, 1);
        burst(b.x, b.y, b.color, 26);
        const pts = 5 + (a.p > 0.85 ? 5 : 0); // power bonus
        score += pts;
        floater(b.x, b.y - b.r, "+" + pts, "#fff");
        sfx.pop();
        shake = Math.min(8, 4 + a.p * 4);
        hit = true;
        if (score >= TARGET_SCORE) win();
        break;
      }
    }
    if (hit || a.x < -40 || a.x > W + 40 || a.y > H + 40 || a.y < -200) {
      if (!hit) {
        misses++;
        sfx.miss();
        floater(Math.min(W - 60, Math.max(60, a.x)), Math.min(H - 60, Math.max(40, a.y)), "miss", "#9aa");
        if (misses >= MAX_MISSES) lose();
      }
      arrows.splice(i, 1);
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(i, 1); continue; }
    p.vy += 500 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  // floaters
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.age += dt; f.y -= 30 * dt;
    if (f.age >= f.life) floaters.splice(i, 1);
  }

  shake = Math.max(0, shake - dt * 20);
}

function win() { state = STATE.WIN; sfx.win(); }
function lose() { state = STATE.LOSE; sfx.lose(); }

// ---------- Draw ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#7ec8ff");
  g.addColorStop(0.7, "#cfeaff");
  g.addColorStop(1, "#e8f7ff");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = "#fff3b0";
  ctx.beginPath(); ctx.arc(W - 90, 90, 42, 0, Math.PI * 2); ctx.fill();
  // clouds
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  cloud(W * 0.2, H * 0.18, 1);
  cloud(W * 0.55, H * 0.3, 0.7);
  cloud(W * 0.8, H * 0.12, 0.9);
  // ground
  ctx.fillStyle = "#69b34c";
  ctx.fillRect(0, H - 60, W, 60);
  ctx.fillStyle = "#5aa040";
  ctx.fillRect(0, H - 60, W, 8);
}
function cloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
  ctx.arc(x + 24 * s, y - 8 * s, 18 * s, 0, Math.PI * 2);
  ctx.arc(x + 46 * s, y, 20 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawBalloon(b) {
  // string
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y + b.r);
  ctx.quadraticCurveTo(b.x + 6, b.y + b.r + 18, b.x - 2, b.y + b.r + 34);
  ctx.stroke();
  // body
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.ellipse(b.x, b.y, b.r * 0.85, b.r, 0, 0, Math.PI * 2);
  ctx.fill();
  // knot
  ctx.beginPath();
  ctx.moveTo(b.x - 5, b.y + b.r - 2);
  ctx.lineTo(b.x + 5, b.y + b.r - 2);
  ctx.lineTo(b.x, b.y + b.r + 7);
  ctx.closePath();
  ctx.fill();
  // shine
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.beginPath();
  ctx.ellipse(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.22, b.r * 0.32, -0.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawArcher() {
  const ax = archer.x, ay = archer.y;
  const aimX = mouse.x, aimY = mouse.y;
  const ang = Math.atan2(aimY - (ay - 40), aimX - ax);
  ctx.save();
  ctx.translate(ax, ay);
  // legs
  ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-6, -28); ctx.lineTo(-10, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, -28); ctx.lineTo(10, 0); ctx.stroke();
  // body
  ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(0, -52); ctx.stroke();
  // head
  ctx.fillStyle = "#f5c9a0";
  ctx.beginPath(); ctx.arc(0, -62, 10, 0, Math.PI * 2); ctx.fill();
  // hat
  ctx.fillStyle = "#2c3e50";
  ctx.beginPath(); ctx.arc(0, -64, 10, Math.PI, 0); ctx.fill();
  ctx.fillRect(-14, -65, 28, 3);

  // bow arm + bow rotated toward aim
  ctx.save();
  ctx.translate(0, -44);
  ctx.rotate(ang);
  const pull = drawPower * 26;
  // bow arc
  ctx.strokeStyle = "#7a4a1f"; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(14, 0, 26, -Math.PI / 2.4, Math.PI / 2.4);
  ctx.stroke();
  // string
  const topX = 14 + 26 * Math.cos(-Math.PI / 2.4), topY = 26 * Math.sin(-Math.PI / 2.4);
  const botX = 14 + 26 * Math.cos(Math.PI / 2.4), botY = 26 * Math.sin(Math.PI / 2.4);
  ctx.strokeStyle = "#ddd"; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(topX, topY);
  ctx.lineTo(14 - pull, 0);
  ctx.lineTo(botX, botY);
  ctx.stroke();
  // nocked arrow
  if (state === STATE.PLAYING) {
    ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(14 - pull, 0);
    ctx.lineTo(14 - pull + 34, 0);
    ctx.stroke();
    ctx.fillStyle = "#ccc";
    ctx.beginPath();
    ctx.moveTo(14 - pull + 34, 0);
    ctx.lineTo(14 - pull + 26, -4);
    ctx.lineTo(14 - pull + 26, 4);
    ctx.closePath(); ctx.fill();
  }
  // arm
  ctx.strokeStyle = "#f5c9a0"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(14 - pull, 0); ctx.stroke();
  ctx.restore();

  // power meter
  if (state === STATE.PLAYING && drawPower > 0) {
    ctx.rotate(0);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(-22, -96, 44, 8);
    const pc = drawPower < 0.5 ? "#7dff6b" : drawPower < 0.85 ? "#ffd23f" : "#ff4d4d";
    ctx.fillStyle = pc;
    ctx.fillRect(-20, -94, 40 * drawPower, 4);
  }
  ctx.restore();
}

function drawArrow(a) {
  const ang = Math.atan2(a.vy, a.vx);
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(ang);
  ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(10, 0); ctx.stroke();
  ctx.fillStyle = "#ccc";
  ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(8, -4); ctx.lineTo(8, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c0392b";
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-24, -4); ctx.lineTo(-22, 0); ctx.lineTo(-24, 4); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const t = 1 - p.age / p.life;
    ctx.globalAlpha = t;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

function drawFloaters() {
  ctx.font = "14px 'Press Start 2P', monospace";
  ctx.textAlign = "center";
  for (const f of floaters) {
    ctx.globalAlpha = 1 - f.age / f.life;
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.font = "12px 'Press Start 2P', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(12, 12, 250, 84);
  ctx.fillStyle = "#fff";
  ctx.fillText("SCORE " + score + " / " + TARGET_SCORE, 24, 34);
  // misses as X
  ctx.fillText("MISSES", 24, 58);
  for (let i = 0; i < MAX_MISSES; i++) {
    ctx.fillStyle = i < misses ? "#ff4d4d" : "rgba(255,255,255,0.3)";
    ctx.fillText("X", 108 + i * 22, 58);
  }
  // escapes as balloons
  ctx.fillStyle = "#fff";
  ctx.fillText("ESCAPES", 24, 82);
  for (let i = 0; i < MAX_ESCAPES; i++) {
    ctx.fillStyle = i < escapes ? "#ff4d4d" : "rgba(255,255,255,0.3)";
    ctx.beginPath();
    ctx.arc(112 + i * 22, 78, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

function panel(title, lines, btnText) {
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, W, H);
  const pw = Math.min(560, W - 40), ph = 300;
  const px = (W - pw) / 2, py = (H - ph) / 2;
  ctx.fillStyle = "#1e2a3a";
  ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = "#ffd23f"; ctx.lineWidth = 4;
  ctx.strokeRect(px, py, pw, ph);
  ctx.fillStyle = "#ffd23f";
  ctx.font = "22px 'Press Start 2P', monospace";
  ctx.textAlign = "center";
  ctx.fillText(title, W / 2, py + 64);
  ctx.fillStyle = "#fff";
  ctx.font = "11px 'Press Start 2P', monospace";
  lines.forEach((l, i) => ctx.fillText(l, W / 2, py + 110 + i * 26));
  // button
  const bw = 240, bh = 46;
  const bx = (W - bw) / 2, by = py + ph - 76;
  ctx.fillStyle = "#c0392b";
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = "#fff";
  ctx.font = "13px 'Press Start 2P', monospace";
  ctx.fillText(btnText, W / 2, by + 29);
}

function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }
  drawSky();
  for (const b of balloons) drawBalloon(b);
  for (const a of arrows) drawArrow(a);
  drawArcher();
  drawParticles();
  drawFloaters();
  ctx.restore();

  if (state === STATE.PLAYING) drawHUD();
  if (state === STATE.MENU) {
    panel("BALLOON BLASTER 95", [
      "Aim with the mouse.",
      "Hold to draw the bow, release to shoot.",
      "Pop " + TARGET_SCORE + " points of balloons to win.",
      "3 misses or 5 escapes and you lose.",
    ], "CLICK TO START");
  } else if (state === STATE.WIN) {
    panel("YOU WIN!", ["Final score: " + score, "The balloons fear you."], "CLICK TO CONTINUE");
  } else if (state === STATE.LOSE) {
    const why = misses >= MAX_MISSES ? "Too many missed arrows." : "Too many balloons escaped.";
    panel("GAME OVER", [why, "Final score: " + score], "CLICK TO RETRY");
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
