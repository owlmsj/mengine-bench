    }
  }
  for (const w of nodes) {
    vel[w].add(pos[w].clone().multiplyScalar(-0.008));
    vel[w].multiplyScalar(0.82);
    pos[w].add(vel[w]);
  }
}

// Three.js
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0f, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 10, 28);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0x404060, 0.6));
const dir = new THREE.DirectionalLight(0xc9c5ff, 0.7);
dir.position.set(5, 10, 5);
scene.add(dir);
const pt = new THREE.PointLight(0x6050ff, 1.2, 40);
pt.position.set(0, 6, 0);
scene.add(pt);

// Node meshes
const nodeMeshes = {};
const sphereGeo = new THREE.SphereGeometry(0.18, 12, 12);
const baseMat = new THREE.MeshStandardMaterial({ color: 0x4a4670, roughness: 0.6, metalness: 0.2 });
const hiMat = new THREE.MeshStandardMaterial({ color: 0xc9c5ff, roughness: 0.3, metalness: 0.4, emissive: 0x4030a0, emissiveIntensity: 0.3 });
const selMat = new THREE.MeshStandardMaterial({ color: 0xffd080, roughness: 0.2, metalness: 0.5, emissive: 0xff8020, emissiveIntensity: 0.5 });

for (const w of nodes) {
  const deg = (adj[w] || []).length;
  const scale = 0.5 + Math.min(deg / 8, 1.5) * 0.9;
  const mesh = new THREE.Mesh(sphereGeo, baseMat.clone());
  mesh.scale.setScalar(scale);
  mesh.position.copy(pos[w]);
  mesh.userData.word = w;
  scene.add(mesh);
  nodeMeshes[w] = mesh;
}

// Edges
const edgeMat = new THREE.LineBasicMaterial({ color: 0x3a3660, transparent: true, opacity: 0.3 });
const edgeHiMat = new THREE.LineBasicMaterial({ color: 0x8070ff, transparent: true, opacity: 0.8 });
const edgeLines = [];
const edgeSet = new Set();

for (const [w, links] of Object.entries(WORDS)) {
  for (const l of links) {
    if (!pos[l]) continue;
    const key = [w, l].sort().join('|');
    if (edgeSet.has(key)) continue;
    edgeSet.add(key);
    const geo = new THREE.BufferGeometry().setFromPoints([pos[w], pos[l]]);
    const line = new THREE.Line(geo, edgeMat.clone());
    line.userData = { a: w, b: l };
    scene.add(line);
    edgeLines.push(line);
  }
}

// Labels
function makeLabel(text) {
  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  const fs = 28;
  ctx.font = `600 ${fs}px Inter, sans-serif`;
  const tw = ctx.measureText(text).width;
  cv.width = tw + 16;
  cv.height = fs + 12;
  ctx.font = `600 ${fs}px Inter, sans-serif`;
  ctx.fillStyle = 'rgba(200,195,255,0.9)';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 8, cv.height / 2);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(cv.width / 100, cv.height / 100, 1);
  return sprite;
}

const labelSprites = {};
for (const w of nodes) {
  const s = makeLabel(w);
  s.position.copy(pos[w]).add(new THREE.Vector3(0, 0.4, 0));
  s.visible = false;
  scene.add(s);
  labelSprites[w] = s;
}

// Interaction
let selected = null;

function selectWord(w) {
  if (!nodeMeshes[w]) return;
  selected = w;
  const neighbors = new Set(adj[w] || []);
  for (const nw of nodes) {
    const m = nodeMeshes[nw];
    if (nw === w) { m.material = selMat; labelSprites[nw].visible = true; }
    else if (neighbors.has(nw)) { m.material = hiMat; labelSprites[nw].visible = true; }
    else { m.material = baseMat; labelSprites[nw].visible = false; }
  }
  for (const line of edgeLines) {
    const { a, b } = line.userData;
    line.material = (a === w || b === w) ? edgeHiMat : edgeMat;
  }
  const wi = document.getElementById('wordinfo');
  wi.style.display = 'block';
  document.getElementById('wi-word').textContent = w;
  document.getElementById('wi-tema').textContent = '';
  const linksDiv = document.getElementById('wi-links');
  linksDiv.innerHTML = '';
  for (const l of (adj[w] || [])) {
    const el = document.createElement('span');
    el.className = 'link';
    el.textContent = l;
    el.onclick = () => selectWord(l);
    linksDiv.appendChild(el);
  }
  history.replaceState(null, '', `?word=${encodeURIComponent(w)}`);
}

function deselect() {
  selected = null;
  for (const nw of nodes) {
    nodeMeshes[nw].material = baseMat;
    labelSprites[nw].visible = false;
  }
  for (const line of edgeLines) line.material = edgeMat;
  document.getElementById('wordinfo').style.display = 'none';
  history.replaceState(null, '', location.pathname);
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

canvas.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(Object.values(nodeMeshes));
  if (hits.length > 0) {
    const w = hits[0].object.userData.word;
    if (w === selected) deselect();
    else selectWord(w);
  } else {
    deselect();
  }
});

canvas.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(Object.values(nodeMeshes));
  canvas.style.cursor = hits.length > 0 ? 'pointer' : 'default';
});

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { deselect(); return; }
  const exact = nodes.find(w => w.toLowerCase() === q);
  if (exact) { selectWord(exact); return; }
  const prefix = nodes.find(w => w.toLowerCase().startsWith(q));
  if (prefix) selectWord(prefix);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim().toLowerCase();
    const match = nodes.find(w => w.toLowerCase() === q) || nodes.find(w => w.toLowerCase().startsWith(q));
    if (match) selectWord(match);
  }
  if (e.key === 'Escape') { searchInput.value = ''; deselect(); }
});

// Camera orbit
let orbitAngle = 0;
const orbitSpeed = 0.002;
const orbitRadius = 28;
const orbitY = 10;

function animate() {
  requestAnimationFrame(animate);
  orbitAngle += orbitSpeed;
  camera.position.x = Math.cos(orbitAngle) * orbitRadius;
  camera.position.z = Math.sin(orbitAngle) * orbitRadius;
  camera.position.y = orbitY;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// URL param
const params = new URLSearchParams(window.location.search);
const urlWord = params.get('word');
if (urlWord) {
  const match = nodes.find(w => w.toLowerCase() === urlWord.toLowerCase()) || nodes.find(w => w.toLowerCase().startsWith(urlWord.toLowerCase()));
  if (match) {
    selectWord(match);
    searchInput.value = match;
  }
}
</script>
</body>
