<body>
<div class="title"><div class="eyebrow">Postcards from Japan / 001</div><h1>The floating<br>world.</h1><p>Spring dusk beneath Mount Fuji</p><div class="seal">富士山</div></div>
<button class="controls" id="motion" aria-label="Pause animation" title="Pause animation">Ⅱ</button>
<div class="footer"><div>Arakurayama Sengen Park<span>35°30′ N &nbsp; 138°48′ E · Yamanashi, Japan</span></div><div>桜 &nbsp; / &nbsp; Sakura season<span>A landscape in little pieces</span></div></div><div id="error"></div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9bbc1');scene.fog=new THREE.FogExp2('#d9bbc1',.0095);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,.1,500);
const target=new THREE.Vector3(-2,16,-16);
function frame(){const portrait=innerWidth/innerHeight<1;camera.position.set(portrait?69:58,portrait?44:36,portrait?101:78);camera.lookAt(target);camera.aspect=innerWidth/innerHeight;camera.fov=portrait?49:36;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}frame();addEventListener('resize',frame);
scene.add(new THREE.HemisphereLight('#ffe7d0','#575478',2.3));const sun=new THREE.DirectionalLight('#ffe1bc',3.1);sun.position.set(-45,70,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-65,right:65,top:65,bottom:-65,far:180});sun.shadow.normalBias=.1;scene.add(sun);
let seed=481;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true});
const red=mat('#b63735'),brightRed=mat('#e75c45'),dark=mat('#343a45'),gold=mat('#d6ab6b'),wood=mat('#603c45'),cream=mat('#ffe4b9');
function box(w,h,d,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cone(r,h,n,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,n),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
// A pale sun, backed by an unlit sky, settles behind the mountain.
const sunDisk=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.MeshBasicMaterial({color:'#fbe2bd',fog:false}));sunDisk.position.set(-45,42,-91);sunDisk.lookAt(camera.position);scene.add(sunDisk);
const ridgeColors=['#ac9eaf','#9993a5','#85899a'];
for(let layer=0;layer<3;layer++){const group=new THREE.Group();for(let i=0;i<17;i++){const x=-120+i*15;cone(17+rand()*9,10+rand()*14,5,mat(ridgeColors[layer]),x,2,-85+layer*15,group)}scene.add(group)}
// Matching angular rings make a continuous snow boundary without decals.
const N=48;const mountainRings=[{r:38,y:0},{r:26,y:9},{r:16,y:20},{r:9,y:30},{r:3.6,y:39},{r:2.9,y:40}];const wiggles=Array.from({length:N},()=>rand());
function mountainSection(start,end,snow){const positions=[],colors=[];const color=new THREE.Color();for(let k=start;k<end;k++){for(let i=0;i<N;i++){const j=(i+1)%N;const vertex=(ring,idx)=>{const a=idx/N*Math.PI*2;const q=mountainRings[ring];const r=q.r*(.96+wiggles[idx]*.08);let y=q.y;if(ring===3)y+=(wiggles[idx]-.5)*4;return [Math.cos(a)*r-23,y-2,Math.sin(a)*r-49]};const vertices=[vertex(k,i),vertex(k,j),vertex(k+1,i),vertex(k,j),vertex(k+1,j),vertex(k+1,i)];color.set(snow?['#fff3e4','#e6deec','#d3d1e3'][i%3]:['#82879b','#9595a8','#a4a1b1','#777e94'][i%4]);for(const v of vertices){positions.push(...v);colors.push(color.r,color.g,color.b)}}}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geo.computeVertexNormals();scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:true})));}
mountainSection(0,3,false);mountainSection(3,5,true);
// Valley: muted tiny buildings and orchard-like parcels.
box(220,1,150,mat('#a5a4a3'),0,-3,-40);const townMats=['#c2b1ad','#cbbab2','#a3a0a6','#b7b0b1'].map(mat);for(let i=0;i<330;i++){const x=rand()*125-65,z=-22-rand()*44;const h=.35+rand()*1.5;box(.6+rand()*1.1,h,.6+rand()*1.4,townMats[i%4],x,-2+h/2,z)}
// Hillside and its stacked stone retaining wall.
const hill=cone(49,15,9,mat('#686f65'),16,-5,19);hill.scale.z=.73;box(58,2,33,mat('#85856d'),15,.3,20);box(30,.35,25,mat('#b7a58a'),21,1.45,17);
const stoneMats=['#6b7071','#7b7e7a','#8b8c81'].map(mat);for(let row=0;row<4;row++)for(let i=0;i<22;i++)box(2.6,.9,1.5,stoneMats[(i+row)%3],-12+i*2.7+row%2*.7,-2.1+row*.92,35);
// Stone approach and lanterns guide the eye up to the pagoda.
for(let i=0;i<15;i++)box(5.3,.25,1.15,mat(i%2?'#bcb09a':'#cbbba2'),7,1.56,33-i*1.2);
function lantern(x,z){box(.85,.3,.85,dark,x,1.8,z);box(.3,1.5,.3,stoneMats[1],x,2.6,z);box(.85,.7,.85,cream,x,3.5,z);cone(.85,.65,4,dark,x,4.1,z)}lantern(3,24);lantern(11,24);
const pagoda=new THREE.Group();pagoda.position.set(20,1.65,12);scene.add(pagoda);box(13,.7,12,stoneMats[1],0,.1,0,pagoda);box(11,.5,10,cream,0,.7,0,pagoda);
function roof(width,y){const verts=[],indices=[];const rings=[[width/2,y],[width*.39,y+.45],[width*.2,y+1.65]];for(const [r,h]of rings)verts.push(-r,h,-r,r,h,-r,r,h,r,-r,h,r);for(let k=0;k<2;k++)for(let i=0;i<4;i++){const a=k*4+i,b=k*4+(i+1)%4,c=a+4,d=b+4;indices.push(a,c,b,b,c,d)}indices.push(8,9,10,8,10,11);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(indices);g.computeVertexNormals();const mesh=new THREE.Mesh(g,dark);mesh.castShadow=true;mesh.receiveShadow=true;pagoda.add(mesh);for(let edge=0;edge<4;edge++){const e=box(width,.16,.18,gold,0,y+.03,edge<2?(edge===0?-width/2:width/2):0,pagoda);if(edge>=2){e.rotation.y=Math.PI/2;e.position.x=edge===2?-width/2:width/2}}}
for(let tier=0;tier<5;tier++){const w=9-tier*1.05,y=1+tier*4.1;box(w,2.6,w,red,0,y+1.3,0,pagoda);box(w+.3,.25,w+.3,brightRed,0,y+.15,0,pagoda);for(const x of [-1,1])for(const z of [-1,1])box(.36,3,.36,brightRed,x*(w/2-.15),y+1.5,z*(w/2-.15),pagoda);for(let j=-1;j<=1;j++){box(.85,1.45,.05,cream,j*w*.25,y+1.5,w/2+.03,pagoda);box(.05,1.45,.85,cream,w/2+.03,y+1.5,j*w*.25,pagoda)}box(w+1,.22,w+1,brightRed,0,y+.2,0,pagoda);for(let j=-3;j<=3;j++){box(.13,.85,.13,red,j*(w+1)/7,y+.65,(w+1)/2,pagoda);box(.13,.85,.13,red,(w+1)/2,y+.65,j*(w+1)/7,pagoda)}box(w+1,.14,.15,red,0,y+1.05,(w+1)/2,pagoda);box(.15,.14,w+1,red,(w+1)/2,y+1.05,0,pagoda);roof(w+3.1,y+2.85)}
cone(.3,5.3,8,gold,0,24,0,pagoda);for(let i=0;i<8;i++){const o=new THREE.Mesh(new THREE.TorusGeometry(.6-i*.045,.09,5,12),gold);o.rotation.x=Math.PI/2;o.position.y=22.3+i*.45;pagoda.add(o)}cone(.45,.8,6,gold,0,27,0,pagoda);
// Branches and blossoms are low-poly solids; instancing keeps the grove light.
const blossomMats=['#f4bbca','#f9ced5','#df91ad','#ffe0dc'].map(mat);const blossomGeo=new THREE.IcosahedronGeometry(1,0);const blossomInstances=blossomMats.map(m=>{const o=new THREE.InstancedMesh(blossomGeo,m,1200);o.castShadow=true;scene.add(o);return o});const counts=[0,0,0,0],dummy=new THREE.Object3D();
function branch(a,b,r){const delta=new THREE.Vector3().subVectors(b,a);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r*.68,r,delta.length(),5),wood);mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());mesh.castShadow=true;scene.add(mesh)}
function tree(x,z,s){const base=new THREE.Vector3(x,1.5,z),fork=new THREE.Vector3(x+.3*s,1.5+4*s,z);branch(base,fork,.38*s);for(let i=0;i<7;i++){const a=i*2.4;const tip=new THREE.Vector3(x+Math.cos(a)*(2+rand()*1.5)*s,1.5+(5+rand()*2)*s,z+Math.sin(a)*2.7*s);branch(fork,tip,.17*s);for(let k=0;k<28;k++){const t=rand()*Math.PI*2,r=Math.sqrt(rand())*2.1*s;dummy.position.set(tip.x+Math.cos(t)*r,tip.y+(rand()-.35)*1.8*s,tip.z+Math.sin(t)*r);dummy.rotation.set(rand(),rand(),rand());dummy.scale.setScalar((.35+rand()*.46)*s);dummy.updateMatrix();const c=Math.floor(rand()*4);blossomInstances[c].setMatrixAt(counts[c]++,dummy.matrix)}}}
[[-17,27,1.6],[-8,30,1.35],[-22,12,1.1],[-10,9,.95],[34,27,1.5],[40,14,1.4],[31,3,.9],[-27,33,1.45],[-1,4,.75],[39,36,1.5]].forEach(v=>tree(...v));blossomInstances.forEach((o,i)=>{o.count=counts[i];o.instanceMatrix.needsUpdate=true});
const petals=new THREE.InstancedMesh(new THREE.PlaneGeometry(.18,.3),new THREE.MeshStandardMaterial({color:'#ffd5df',side:THREE.DoubleSide,roughness:1}),100);scene.add(petals);const falling=Array.from({length:100},()=>({x:rand()*70-29,y:rand()*22+2,z:rand()*36+3,s:rand()*2+1}));
let running=true,last=0,elapsed=0;document.getElementById('motion').onclick=()=>{running=!running;document.getElementById('motion').textContent=running?'Ⅱ':'▷';document.getElementById('motion').setAttribute('aria-label',running?'Pause animation':'Resume animation')};
function animate(ms){requestAnimationFrame(animate);const dt=Math.min((ms-last)/1000,.05);last=ms;if(running)elapsed+=dt;falling.forEach((p,i)=>{dummy.position.set(p.x+Math.sin(elapsed*.35+i)*1.5,1+(p.y-elapsed*p.s*.35)%24+((p.y-elapsed*p.s*.35)%24<0?24:0),p.z);dummy.rotation.set(elapsed*.6+i,elapsed*.35+i,i);dummy.scale.setScalar(1);dummy.updateMatrix();petals.setMatrixAt(i,dummy.matrix)});petals.instanceMatrix.needsUpdate=true;renderer.render(scene,camera)}requestAnimationFrame(animate);
</script>
