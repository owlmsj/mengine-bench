<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balloon Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#213f42;color:#294347;font-family:'DM Sans',sans-serif}body{display:grid;place-items:center;padding:20px}.cabinet{width:min(1100px,100%);background:#f5e5c5;border:8px solid #8d5938;border-radius:22px;box-shadow:0 14px 0 #593b2b,0 24px 50px #102b2baa;overflow:hidden}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:#f9edcf;border-bottom:3px solid #be9469}.brand{font-family:Fredoka,sans-serif;font-size:29px;font-weight:700;letter-spacing:-.5px;color:#345f55}.brand span{color:#e36f52}.level{font-size:11px;letter-spacing:2px;font-weight:700;color:#a77b59;margin-top:2px}.stats{display:flex;gap:34px;text-align:right}.stat small{display:block;font-size:10px;letter-spacing:1.8px;font-weight:700;color:#a78262}.stat b{font-family:Fredoka,sans-serif;font-size:25px;color:#365b50}.stage{position:relative;aspect-ratio: 16/9;background:#a8d9d1;overflow:hidden;touch-action:none;cursor:crosshair}canvas{width:100%;height:100%;display:block}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#244e4a88;cursor:default}.overlay.hidden{display:none}.card{width:min(420px,85%);text-align:center;background:#fff4d9;border:4px solid #8c603e;border-radius:20px;padding:28px 36px;box-shadow:0 8px 0 #67482e,0 14px 30px #173d3880}.eyebrow{font-size:11px;letter-spacing:2.4px;font-weight:700;color:#cc7655}.card h1{font:700 42px/1 Fredoka,sans-serif;margin:10px 0;color:#365d52}.card p{font-size:15px;line-height:1.5;color:#6f725d;margin:12px 0 20px}.card button{border:0;border-radius:12px;background:#e46f50;color:white;font:600 19px Fredoka,sans-serif;padding:13px 32px;box-shadow:0 5px 0 #b84e38;cursor:pointer}.card button:hover{background:#ef8060;transform:translateY(-2px)}.card button:active{transform:translateY(3px);box-shadow:0 2px 0 #b84e38}.bottom{min-height:54px;display:flex;justify-content:space-between;align-items:center;padding:10px 30px;background:#f9edcf;color:#8d795f;font-size:12px;font-weight:700}.bottom strong{color:#527269}.key{background:#ead9b8;border:1px solid #d1b994;border-radius:5px;padding:3px 7px;margin-right:5px}.sound{border:0;background:none;color:#88735b;font:700 12px 'DM Sans',sans-serif;cursor:pointer}@media(max-width:600px){body{padding:8px}.cabinet{border-width:5px}.top{height:60px;padding:0 15px}.brand{font-size:22px}.stats{gap:15px}.stat b{font-size:20px}.bottom{padding:10px 15px;font-size:10px}.card{padding:20px}.card h1{font-size:32px}}
</style>
</head>
<body><main class="cabinet"><header class="top"><div><div class="brand">balloon <span>field</span></div><div class="level">THE LITTLE ARCHERY CLUB</div></div><div class="stats"><div class="stat"><small>SCORE</small><b id="score">0000</b></div><div class="stat"><small>ARROWS</small><b id="arrows">10</b></div></div></header><div class="stage" id="stage"><canvas id="game" width="960" height="540" aria-label="Archery game"></canvas><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="eyebrow">WELCOME TO LEVEL 01</div><h1 id="title">Ready, archer?</h1><p id="message">Pull back from the bow, aim for the balloons, and let your arrows fly. Make every shot count!</p><button id="start">Let's play</button></div></div></div><footer class="bottom"><div><span class="key">DRAG</span> Pull back &amp; aim <span style="padding:0 8px;color:#d3b998">/</span> <strong>Release to shoot</strong></div><button class="sound" id="sound">♫ SOUND ON</button></footer></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),arrowsEl=document.getElementById('arrows');
const W=960,H=540,bow={x:166,y:355},colors=['#ef705c','#f4ba50','#79ad88','#e88f89','#829dc1'];let state='menu',score=0,shots=10,balloons=[],arrows=[],particles=[],texts=[],drag=null,time=0,last=0,spawn=0,shake=0,audio=null,muted=false,ending=0;
function tone(freq,duration,type='sine',volume=.08,slide=1){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),audio.currentTime+duration);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function hud(){scoreEl.textContent=String(score).padStart(4,'0');arrowsEl.textContent=shots}
function newBalloon(x){let r=22+Math.random()*7;return{x:x||570+Math.random()*330,y:140+Math.random()*270,r,base:Math.random()*6.28,speed:17+Math.random()*13,color:colors[Math.floor(Math.random()*colors.length)],phase:Math.random()*6.28}}
function reset(){score=0;shots=10;arrows=[];particles=[];texts=[];balloons=[];for(let i=0;i<6;i++){let b=newBalloon(475+i*79);b.y=150+(i%3)*105;balloons.push(b)}state='playing';drag=null;spawn=0;ending=0;hud();overlay.classList.add('hidden');tone(440,.12,'sine',.05,1.5)}
function end(){state='over';document.getElementById('eyebrow').textContent='LEVEL 01 COMPLETE';document.getElementById('title').textContent='Out of arrows!';document.getElementById('message').textContent=`You scored ${score} points. The field is waiting for another round.`;document.getElementById('start').textContent='Play again';overlay.classList.remove('hidden');tone(330,.25,'sine',.07,.7)}
function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function aim(){if(!drag)return {angle:-.18,power:0};let dx=bow.x-drag.x,dy=bow.y-drag.y;let angle=Math.atan2(dy,dx);angle=Math.max(-1.05,Math.min(.45,angle));return{angle,power:Math.min(1,Math.hypot(dx,dy)/150)}}
stage.addEventListener('pointerdown',e=>{if(state!=='playing'||shots<=0)return;drag=pos(e);stage.setPointerCapture(e.pointerId);tone(180,.08,'triangle',.025,1.2)});stage.addEventListener('pointermove',e=>{if(drag)drag=pos(e)});stage.addEventListener('pointerup',e=>{if(!drag||state!=='playing')return;drag=pos(e);let a=aim();drag=null;if(a.power<.08)return;let speed=450+a.power*510;arrows.push({x:bow.x,y:bow.y,vx:Math.cos(a.angle)*speed,vy:Math.sin(a.angle)*speed,angle:a.angle,life:0,hit:false});shots--;hud();shake=3;tone(180,.14,'triangle',.09,.45);tone(700,.09,'sine',.035,.4)});stage.addEventListener('pointercancel',()=>drag=null);
document.getElementById('start').onclick=reset;document.getElementById('sound').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'♫ SOUND OFF':'♫ SOUND ON';if(!muted)tone(520,.1)};
function pop(b){score+=100;hud();shake=5;for(let i=0;i<13;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*170;particles.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.4,color:b.color})}texts.push({x:b.x,y:b.y,life:1,text:'+100'});tone(600,.12,'sine',.09,1.8);tone(230,.18,'triangle',.05,.5)}
function update(dt){time+=dt;if(state!=='playing')return;for(let b of balloons){b.y-=b.speed*dt;b.x+=Math.sin(time*1.4+b.phase)*12*dt;if(b.y< -50){b.y=H+40;b.x=470+Math.random()*420}}for(let a of arrows){a.life+=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=150*dt;a.angle=Math.atan2(a.vy,a.vx);for(let i=balloons.length-1;i>=0;i--){let b=balloons[i];if(!a.hit&&Math.hypot(a.x-b.x,a.y-b.y)<b.r+7){a.hit=true;pop(b);balloons.splice(i,1);break}}}arrows=arrows.filter(a=>a.x<W+80&&a.y<H+80&&a.life<2.5&&!a.hit);spawn+=dt;if(balloons.length<6&&spawn>.7){balloons.push(newBalloon());spawn=0}for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let t of texts){t.y-=35*dt;t.life-=dt}texts=texts.filter(t=>t.life>0);if(shots===0&&arrows.length===0){ending+=dt;if(ending>1)end()}}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.2)shake=0}let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#a4d6d0');sky.addColorStop(1,'#e2ead0');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ellipse(785,80,45,45,'#fff2be');ctx.fillStyle='#ffffff66';for(let c of [[170,90],[470,65],[720,140]]){ellipse(c[0],c[1],60,13,'#ffffff66');ellipse(c[0]-22,c[1]-10,27,17,'#ffffff66');ellipse(c[0]+20,c[1]-7,35,19,'#ffffff66')}ctx.fillStyle='#b0cda9';ctx.beginPath();ctx.moveTo(0,400);ctx.quadraticCurveTo(180,280,370,400);ctx.quadraticCurveTo(600,280,960,380);ctx.lineTo(960,540);ctx.lineTo(0,540);ctx.fill();ctx.fillStyle='#729e79';ctx.beginPath();ctx.moveTo(0,438);ctx.quadraticCurveTo(260,365,520,440);ctx.quadraticCurveTo(760,365,960,420);ctx.lineTo(960,540);ctx.lineTo(0,540);ctx.fill();ctx.fillStyle='#557e62';ctx.fillRect(0,490,960,50);for(let i=0;i<26;i++){let x=i*39+10;ctx.strokeStyle='#779b70';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,495);ctx.lineTo(x-4,486);ctx.moveTo(x,495);ctx.lineTo(x+5,488);ctx.stroke()}
// Archer and bow
ellipse(132,485,55,9,'#365e5180');ctx.strokeStyle='#4d5d4a';ctx.lineWidth=15;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(126,431);ctx.lineTo(113,479);ctx.moveTo(144,430);ctx.lineTo(158,479);ctx.stroke();ctx.fillStyle='#d99c6e';ctx.beginPath();ctx.arc(130,345,22,0,Math.PI*2);ctx.fill();ctx.fillStyle='#385d54';ctx.beginPath();ctx.moveTo(107,340);ctx.quadraticCurveTo(109,311,134,315);ctx.quadraticCurveTo(151,316,155,333);ctx.lineTo(102,336);ctx.fill();ctx.fillStyle='#e6bb70';ctx.beginPath();ctx.moveTo(112,367);ctx.quadraticCurveTo(136,355,151,371);ctx.lineTo(157,433);ctx.lineTo(106,433);ctx.closePath();ctx.fill();ctx.strokeStyle='#d99c6e';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(139,380);ctx.lineTo(165,355);ctx.stroke();let a=aim();ctx.save();ctx.translate(bow.x,bow.y);ctx.rotate(a.angle);ctx.strokeStyle='#8a4f32';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,-55);ctx.quadraticCurveTo(32,0,0,55);ctx.stroke();ctx.strokeStyle='#f9efd4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-55);ctx.lineTo(-a.power*42,0);ctx.lineTo(0,55);ctx.stroke();if(drag){ctx.strokeStyle='#fff8d5';ctx.setLineDash([5,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(330,0);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#6b4b36';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-35-a.power*42,0);ctx.lineTo(30,0);ctx.stroke();ctx.fillStyle='#f5e1a1';ctx.beginPath();ctx.moveTo(35,0);ctx.lineTo(23,-5);ctx.lineTo(23,5);ctx.fill()}ctx.restore();
for(let b of balloons){ctx.strokeStyle='#f4e7cf';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x,b.y+b.r);ctx.quadraticCurveTo(b.x+8,b.y+b.r+20,b.x-3,b.y+b.r+36);ctx.stroke();ellipse(b.x,b.y,b.r,b.r*1.17,b.color);ctx.fillStyle=b.color;ctx.beginPath();ctx.moveTo(b.x,b.y+b.r);ctx.lineTo(b.x-5,b.y+b.r+8);ctx.lineTo(b.x+5,b.y+b.r+8);ctx.fill();ellipse(b.x-b.r*.32,b.y-b.r*.35,b.r*.13,b.r*.3,'#ffffff77')}
for(let a of arrows){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);ctx.strokeStyle='#78533a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-45,0);ctx.lineTo(4,0);ctx.stroke();ctx.fillStyle='#f8e4ad';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-2,-5);ctx.lineTo(-2,5);ctx.fill();ctx.fillStyle='#f4eee0';ctx.beginPath();ctx.moveTo(-38,0);ctx.lineTo(-48,-7);ctx.lineTo(-45,0);ctx.lineTo(-48,7);ctx.fill();ctx.restore()}for(let p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ellipse(p.x,p.y,4,4,p.color)}ctx.globalAlpha=1;for(let t of texts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.fillStyle='#fff9dc';ctx.font='700 24px Fredoka, sans-serif';ctx.fillText(t.text,t.x-25,t.y)}ctx.globalAlpha=1;ctx.restore()}
function frame(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
