<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo das Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f1a;--panel:#151829;--line:#262a42;--ink:#eceaf4;--mute:#9a9bb5}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px}
body{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;overflow:hidden}
header{grid-column:1/3;display:flex;gap:20px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;margin:0}
.stats{color:var(--mute);font-size:13px}.stats b{color:var(--ink);font-weight:600}
form{margin-left:auto;display:flex;gap:6px}
input{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:9px 12px;border-radius:8px;font:inherit;width:230px}
input:focus,button:focus-visible,a:focus-visible{outline:2px solid #ffd166;outline-offset:1px}
button{background:#ffd166;border:0;color:#1a1400;font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer}
#stage{position:relative;min-height:0;min-width:0}
canvas{display:block;width:100%;height:100%;cursor:grab}
#legend{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 6px;max-width:80%}
#legend button{background:rgba(21,24,41,.85);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:12px;padding:4px 9px;border-radius:99px}
#legend button i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#legend button.off{opacity:.35}
#hint{position:absolute;right:14px;top:10px;color:var(--mute);font-size:12px}
aside{border-left:1px solid var(--line);background:var(--panel);padding:20px;overflow:auto}
aside h2{font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:600;margin:0 0 4px;word-break:break-word}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px;font-weight:600}
.tema{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.tema i{width:10px;height:10px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-left-width:4px;padding:4px 9px;border-radius:6px;cursor:pointer;background:#1b1f35}
.chips a:hover{background:#262b4a}
.none{color:var(--mute);font-style:italic}
.msg{background:#3a2330;border:1px solid #7a3b55;padding:8px 10px;border-radius:8px;margin-bottom:14px}
.share{margin-top:22px;font-size:12px;color:var(--mute);word-break:break-all}
.share code{color:#ffd166}
ol{padding-left:20px;margin:0;line-height:1.9}ol a{color:var(--ink);cursor:pointer;text-decoration:underline dotted}
@media(max-width:800px){body{grid-template-columns:1fr;grid-template-rows:auto 55vh 1fr;overflow:auto}header{grid-column:1}aside{border-left:0;border-top:1px solid var(--line)}form{margin-left:0;width:100%}input{flex:1}}
</style></head><body>

</header>

cv.onwheel=e=>{e.preventDefault();tgt=null;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,k=Math.exp(-e.deltaY*.0015),ns=Math.max(.3,Math.min(6,sc*k));ox=mx-(mx-ox)*ns/sc;oy=my-(my-oy)*ns/sc;sc=ns;draw()};
function route(){const w=new URLSearchParams(location.search).get('word');if(w){document.getElementById('q').value=w;go(w,false)}else show(null)}
legend();size();addEventListener('resize',()=>{size()});addEventListener('popstate',route);route();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
</script></body></html>
