<!doctype html><html><head><meta charset="utf-8"><title>Great Wave — low poly</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9dcc0}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xe9dcc0);
const cam=new THREE.PerspectiveCamera(40,1,.1,500);cam.position.set(0,4,30);cam.lookAt(0,4,0);
s.add(new THREE.HemisphereLight(0xfff6e0,0x8a7a60,1.6));const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(-5,10,10);s.add(dl);
const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true,side:THREE.DoubleSide});
const PRUSSIAN=0x1f3a6b,MID=0x4f78a8,FOAM=0xf3ecdc,PALE=0xa9c4d6,BOAT=0xe6c08f;
// dark grey sky band near horizon
const band=new THREE.Mesh(new THREE.PlaneGeometry(200,8),new THREE.MeshBasicMaterial({color:0x8d8a80}));band.position.set(0,1.5,-60);s.add(band);
// clouds
for(const [x,y,w] of [[6,14,10],[-14,13,6]]){const c=new THREE.Mesh(new THREE.IcosahedronGeometry(1,0),M(0xf2ead6));c.scale.set(w,1.6,1);c.position.set(x,y,-40);s.add(c);}
// Mount Fuji, small and distant at centre-right
const fuji=new THREE.Group();const f=new THREE.Mesh(new THREE.ConeGeometry(5,3.2,9),M(0x2b4d7a));fuji.add(f);
const cap=new THREE.Mesh(new THREE.ConeGeometry(2.6,1.7,9),M(0xffffff));cap.position.y=.76;fuji.add(cap);fuji.position.set(3,0.6,-30);s.add(fuji);
// sea plane
const seaG=new THREE.PlaneGeometry(120,80,60,40);seaG.rotateX(-Math.PI/2);const sea=new THREE.Mesh(seaG,M(MID));s.add(sea);const sp=seaG.attributes.position.array.slice();
// Great wave: a curling tube built from rings along an arc, left side
const waves=[];
function wave(x,z,h,len,col,crest){
 const g=new THREE.Group();const segs=14;
 for(let i=0;i<segs;i++){const t=i/(segs-1);const a=t*Math.PI*1.35;const R=h*0.5*(1-t*0.55);
  const px=Math.sin(a)*R*1.2,py=h*0.5-Math.cos(a)*R+(t<.2?0:0);
  const m=new THREE.Mesh(new THREE.BoxGeometry(1.1,R*.5+.3,len*(1-t*.3)),M(t>.75?FOAM:(i%2?PRUSSIAN:MID)));
  m.position.set(px,py,0);m.rotation.z=-a;g.add(m);}
 // claw foam fingers
 if(crest)for(let k=0;k<26;k++){const fo=new THREE.Mesh(new THREE.TetrahedronGeometry(.35+Math.random()*.4,0),M(k%3?FOAM:PALE));
  const a=Math.PI*(1.0+Math.random()*.5);fo.position.set(Math.sin(a)*h*.35+h*.25,h*.5+Math.random()*h*.45,(Math.random()-.5)*len*.8);g.add(fo);fo.userData.p=Math.random()*6;waves.push(fo);}
 const base=new THREE.Mesh(new THREE.ConeGeometry(h*.6,h*.9,7,1,true),M(PRUSSIAN));base.position.set(-h*.25,h*.3,0);g.add(base);
 g.position.set(x,0,z);g.rotation.y=Math.PI/2*0.15;s.add(g);return g;}
const big=wave(-8,-2,16,8,PRUSSIAN,true);
const mid=wave(-11,8,6,8,PRUSSIAN,true);
const right=wave(14,-6,7,10,MID,true);right.scale.x=-1;
// spray dots
const dots=new THREE.Group();for(let i=0;i<120;i++){const d=new THREE.Mesh(new THREE.OctahedronGeometry(.08,0),M(0xffffff));d.position.set(-6+Math.random()*10,6+Math.random()*10,-1+Math.random()*2);dots.add(d);}s.add(dots);
// three oshiokuri boats with rowers
const boats=[];
function boat(x,y,z,ry,rz){const g=new THREE.Group();
 const hull=new THREE.Mesh(new THREE.CylinderGeometry(.6,.25,9,6,1,false,0,Math.PI),M(BOAT));hull.rotation.z=Math.PI/2;hull.rotation.y=Math.PI/2;g.add(hull);
 for(let i=0;i<8;i++){const h=new THREE.Mesh(new THREE.SphereGeometry(.28,5,4),M(PRUSSIAN));h.position.set(-3.2+i*.85,.35,0);g.add(h);}
 g.position.set(x,y,z);g.rotation.set(0,ry,rz);s.add(g);boats.push({g,y,rz});}
boat(-6,1.2,2,.2,-.35);boat(6,1.6,-4,-.15,.3);boat(1,.4,10,.1,-.2);
function size(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?60:40;cam.updateProjectionMatrix();}addEventListener('resize',size);size();
const clk=new THREE.Clock();
r.setAnimationLoop(()=>{const t=clk.getElapsedTime();const p=seaG.attributes.position.array;
 for(let i=0;i<p.length;i+=3){p[i+1]=Math.sin(p[i]*.3+t)*.5+Math.cos(p[i+2]*.4+t*.8)*.4;}seaG.attributes.position.needsUpdate=true;seaG.computeVertexNormals();
 big.rotation.z=Math.sin(t*.5)*.02;big.position.y=Math.sin(t*.5)*.2;mid.position.y=Math.sin(t*.7+1)*.2;right.position.y=Math.sin(t*.6+2)*.25;
 for(const b of boats){b.g.position.y=b.y+Math.sin(t*.9+b.y)*.3;b.g.rotation.z=b.rz+Math.sin(t*.8+b.y)*.05;}
 for(const w of waves)w.rotation.x=t*.4+w.userData.p;
 dots.position.y=Math.sin(t)*.15;cam.position.x=Math.sin(t*.1)*.8;cam.lookAt(0,4,0);r.render(s,cam);});
</script></body></html>
