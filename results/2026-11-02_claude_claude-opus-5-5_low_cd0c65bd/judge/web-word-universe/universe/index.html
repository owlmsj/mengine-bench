for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const p=L[i],q=L[j];let dx=p.x-q.x,dy=p.y-q.y,dz=p.z-q.z,d2=dx*dx+dy*dy+dz*dz+1,f=300/d2;p.vx+=dx*f;p.vy+=dy*f;p.vz+=dz*f;q.vx-=dx*f;q.vy-=dy*f;q.vz-=dz*f}
E.forEach(([a,b])=>{const p=N.get(a),q=N.get(b),dx=q.x-p.x,dy=q.y-p.y,dz=q.z-p.z,f=.02;p.vx+=dx*f;p.vy+=dy*f;p.vz+=dz*f;q.vx-=dx*f;q.vy-=dy*f;q.vz-=dz*f});
L.forEach(p=>{p.vx-=p.x*.002;p.vy-=p.y*.002;p.vz-=p.z*.002;p.x+=p.vx*a;p.y+=p.vy*a;p.z+=p.vz*a;p.vx*=.5;p.vy*=.5;p.vz*=.5})}
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(devicePixelRatio);document.body.prepend(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,1,5000);
const geo=new THREE.SphereGeometry(1,12,12);const meshes=L.map(p=>{const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col(T[p.n]),transparent:true}));m.position.set(p.x,p.y,p.z);m.scale.setScalar(1.5+Math.sqrt(p.adj.size)*.9);m.userData=p;S.add(m);return m});
const lp=new Float32Array(E.length*6);E.forEach(([a,b],i)=>{const p=N.get(a),q=N.get(b);lp.set([p.x,p.y,p.z,q.x,q.y,q.z],i*6)});
const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(lp,3));S.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x6670aa,transparent:true,opacity:.25})));
const hg=new THREE.BufferGeometry();S.add(new THREE.LineSegments(hg,new THREE.LineBasicMaterial({color:0xffffff})));
function label(t,c){const cv=document.createElement('canvas'),x=cv.getContext('2d');cv.width=512;cv.height=96;x.font='700 52px Fraunces, Georgia';x.fillStyle=c;x.textAlign='center';x.fillText(t,256,64);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false,transparent:true}));s.scale.set(32,6,1);return s}
let labels=[],sel=null;const target=new THREE.Vector3(),origin=new THREE.Vector3();
const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function select(w,push=true){const p=N.get(w);labels.forEach(l=>S.remove(l));labels=[];
if(!p){if(w)info.innerHTML=`<p>“${esc(w)}” não está no universo.</p>`;sel=null;meshes.forEach(m=>m.material.opacity=1);hg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(0),3));return}
sel=p;q.value=w;if(push)history.replaceState(null,'','?word='+encodeURIComponent(w));
meshes.forEach(m=>m.material.opacity=(m.userData===p||p.adj.has(m.userData.n))?1:.12);
const a=[],syn=[],ana=[];
p.adj.forEach((k,o)=>{const q2=N.get(o);a.push(p.x,p.y,p.z,q2.x,q2.y,q2.z);(k.includes('sinonimos')?syn:ana).push(o);const l=label(o,col(T[o]));l.position.set(q2.x,q2.y+5,q2.z);S.add(l);labels.push(l)});
hg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(a),3));
const l=label(w,'#fff');l.scale.set(48,9,1);l.position.set(p.x,p.y+7,p.z);S.add(l);labels.push(l);target.set(p.x,p.y,p.z);
const chips=arr=>arr.sort((x,y)=>x.localeCompare(y,'pt')).map(o=>`<span class="w" style="border-left:3px solid ${col(T[o])}" data-w="${esc(o)}">${esc(o)}</span>`).join('')||'<small>—</small>';
info.innerHTML=`<h2 style="color:${col(T[w])};margin:12px 0 0">${esc(w)}</h2><small>tema: ${esc(T[w]||'sem tema')} · ${p.adj.size} ligações</small><h3>Sinônimos</h3>${chips(syn)}<h3>Palavras análogas</h3>${chips(ana)}`}
info.onclick=e=>{const w=e.target.dataset.w;if(w)select(w)};
q.onchange=()=>select(q.value.trim().toLowerCase());
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let drag=false,px,py,rotY=0,rotX=0,dist=320,moved=0;
function pick(e){mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mv,C);const h=ray.intersectObjects(meshes)[0];return h&&h.object.userData}
R.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;moved=0});
R.domElement.addEventListener('pointerup',e=>{drag=false;if(moved<5){const h=pick(e);if(h)select(h.n)}});
addEventListener('pointermove',e=>{if(drag){rotY+=(e.clientX-px)*.005;rotX=Math.max(-1.4,Math.min(1.4,rotX+(e.clientY-py)*.005));moved+=Math.abs(e.clientX-px)+Math.abs(e.clientY-py);px=e.clientX;py=e.clientY}
const h=e.target===R.domElement&&pick(e);tip.style.display=h?'block':'none';if(h){tip.textContent=h.n+' ('+h.adj.size+')';tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY+'px'}});
R.domElement.addEventListener('wheel',e=>{dist=Math.max(40,Math.min(900,dist*(1+e.deltaY*.001)))});
addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
const look=new THREE.Vector3();
(function loop(){requestAnimationFrame(loop);if(!drag&&!sel)rotY+=.0015;look.lerp(sel?target:origin,.06);const d=sel?Math.min(dist,160):dist;
C.position.set(look.x+d*Math.sin(rotY)*Math.cos(rotX),look.y+d*Math.sin(rotX),look.z+d*Math.cos(rotY)*Math.cos(rotX));C.lookAt(look);R.render(S,C)})();
const w0=new URLSearchParams(location.search).get('word');if(w0)select(w0.trim().toLowerCase(),false);
</script></body></html>
