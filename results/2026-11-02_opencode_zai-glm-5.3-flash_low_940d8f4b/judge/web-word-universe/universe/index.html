<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário Criativo — o universo das palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--panel:#12161f;--ink:#e8e6df;--dim:#8b93a3;--line:#232a38;--acc:#e8b84b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block}
#hud{position:fixed;top:14px;left:14px;z-index:5}
#hud h1{font:600 19px Fraunces,serif;margin:0 0 2px;letter-spacing:.2px}
#hud p{margin:0;color:var(--dim);font-size:12.5px}
#searchwrap{position:fixed;top:64px;left:14px;z-index:5}
#search{width:280px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(18,22,31,.92);color:var(--ink);font:inherit;outline:none;backdrop-filter:blur(6px)}
#search:focus{border-color:var(--acc)}
#hints{list-style:none;margin:6px 0 0;padding:0;width:280px;max-height:220px;overflow:auto;border-radius:10px;border:1px solid var(--line);background:rgba(18,22,31,.96);display:none}
#hints li{padding:8px 12px;cursor:pointer;font-size:14px}
#hints li:hover,#hints li.sel{background:#1c2333}
#hints li small{color:var(--dim);float:right}
#panel{position:fixed;top:14px;right:14px;z-index:5;width:320px;max-height:calc(100% - 28px);overflow:auto;background:rgba(18,22,31,.94);border:1px solid var(--line);border-radius:14px;padding:18px 20px;backdrop-filter:blur(8px);display:none}
#panel h2{font:600 26px Fraunces,serif;margin:0 0 2px;color:var(--acc)}
#panel .tema{color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;margin:0 0 12px}
#panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:14px 0 6px}
#panel .chip{display:inline-block;margin:2px 4px 2px 0;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13.5px}
#panel .chip:hover{border-color:var(--acc);color:var(--acc)}
#panel .chip.sin{border-color:#3d5a3d;background:#16241a}
#panel .chip.ana{border-color:#3a4a63;background:#161d2b}
#panel .share{margin-top:14px;font-size:12px;color:var(--dim);word-break:break-all}
#panel .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
#legend{position:fixed;bottom:12px;left:14px;z-index:5;font-size:12px;color:var(--dim)}
#legend b{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px}
#legend a{color:var(--dim);text-decoration:none;cursor:pointer}
#legend a:hover{color:var(--ink)}
#fallback{position:fixed;inset:0;overflow:auto;padding:40px;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h1>Dicionário Criativo</h1><p id="count">o universo das palavras</p></div>
<div id="searchwrap">
  <input id="search" placeholder="Buscar uma palavra…" autocomplete="off" spellcheck="false">
  <ul id="hints"></ul>
</div>
<aside id="panel">
  <button class="close" id="close" aria-label="Fechar">✕</button>
  <h2 id="pw"></h2>
  <p class="tema" id="ptema"></p>
  <div id="prels"></div>
  <p class="share" id="pshare"></p>
</aside>
<div id="legend"></div>
<div id="fallback"></div>

document.getElementById('count').textContent =
  names.length + ' palavras · ' + TEMAS.length + ' temas';
const legend = document.getElementById('legend');
legend.innerHTML = TEMAS.map((t,i)=>'<a data-t="'+t+'"><b style="background:'+PALETTE[i%PALETTE.length]+'"></b>'+t+'</a>').join('');

function neighbors(w){
  const e = DATA[w], out = new Map();
  if(!e) return out;
  for(const s of e.sinonimos) out.set(s,'sin');
  for(const a of e.analogas) if(!out.has(a)) out.set(a,'ana');
  return out;
}

/* ---------- 3D graph ---------- */
let renderer, scene, camera, nodeMesh, group, sim, picked = null, dimmed = null;
const nodes = names.map((w,i)=>({w, tema:DATA[w].tema, x:0,y:0,z:0, vx:0,vy:0,vz:0}));
const idx = new Map(nodes.map(n=>[n.w,n]));
const links = [];
for(const w of names){
  for(const s of DATA[w].sinonimos) if(idx.has(s)) links.push([idx.get(w),idx.get(s)]);
  for(const a of DATA[w].analogas) if(idx.has(a)) links.push([idx.get(w),idx.get(a)]);
}

async function init3D(){
  let THREE;
  try{ THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js'); }
  catch(e){ fallbackList(); return; }

  const canvas = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0b0e14, 0.008);
  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 200);
  camera.position.set(0,0,58);
  group = new THREE.Group(); scene.add(group);

  const geo = new THREE.SphereGeometry(1, 18, 14);
  nodeMesh = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial(), nodes.length);
  nodeMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(nodes.length*3), 3);
  group.add(nodeMesh);

  const lgeo = new THREE.BufferGeometry();
  lgeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(links.length*6), 3));
  const lcol = new THREE.BufferAttribute(new Float32Array(links.length*6), 3);
  lgeo.setAttribute('color', lcol);
  group.add(new THREE.LineSegments(lgeo, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.45})));
  scene.userData.lgeo = lgeo;

  // seeds on a sphere
  for(const n of nodes){
    const u = Math.random()*2-1, ph = Math.random()*Math.PI*2, r = 26;
    n.x = Math.sqrt(1-u*u)*Math.cos(ph)*r; n.y = u*r; n.z = Math.sqrt(1-u*u)*Math.sin(ph)*r;
  }

  // N-body repulsion + spring attraction
  sim = () => {
      for(let i=0;i<nodes.length;i++){
        const a=nodes[i];
        for(let j=i+1;j<nodes.length;j++){
          const b=nodes[j];
          let dx=a.x-b.x, dy=a.y-b.y, dz=a.z-b.z;
          const d2=dx*dx+dy*dy+dz*dz+.01, f=260/d2;
          const d=Math.sqrt(d2); dx/=d; dy/=d; dz/=d;
          a.vx+=dx*f; a.vy+=dy*f; a.vz+=dz*f;
          b.vx-=dx*f; b.vy-=dy*f; b.vz-=dz*f;
        }
      }
      for(const [a,b] of links){
        let dx=b.x-a.x, dy=b.y-a.y, dz=b.z-a.z;
        const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01, f=(d-14)/d*.06;
        a.vx+=dx*f; a.vy+=dy*f; a.vz+=dz*f;
        b.vx-=dx*f; b.vy-=dy*f; b.vz-=dz*f;
      }
      for(const n of nodes){
        n.vx*=.85; n.vy*=.85; n.vz*=.85;
        n.x+=n.vx; n.y+=n.vy; n.z+=n.vz;
      }
  };

  // picking
  const ray = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let down = null, moved = false;
  canvas.addEventListener('pointerdown', e => { down = {x:e.clientX,y:e.clientY}; moved = false; });
  canvas.addEventListener('pointermove', e => {
    if(down){
      const dx=e.clientX-down.x, dy=e.clientY-down.y;
      if(Math.abs(dx)+Math.abs(dy) > 3) moved = true;
      const rot = new THREE.Matrix4().makeRotationY(dx*.005)
        .multiply(new THREE.Matrix4().makeRotationX(dy*.005));
      group.applyMatrix4(rot);
      down = {x:e.clientX,y:e.clientY};
    } else {
      pointer.x = (e.clientX/innerWidth)*2-1;
      pointer.y = -(e.clientY/innerHeight)*2+1;
      ray.setFromCamera(pointer, camera);
      const hit = ray.intersectObject(nodeMesh)[0];
      canvas.style.cursor = hit ? 'pointer' : 'grab';
    }
  });
  addEventListener('pointerup', e => {
    if(down && !moved && e.target === canvas){
      pointer.x = (e.clientX/innerWidth)*2-1;
      pointer.y = -(e.clientY/innerHeight)*2+1;
      ray.setFromCamera(pointer, camera);
      const hit = ray.intersectObject(nodeMesh)[0];
      if(hit) show(nodes[hit.instanceId].w, true);
    }
    down = null;
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camera.position.multiplyScalar(e.deltaY > 0 ? 1.08 : .93);
    camera.position.clampLength(14, 160);
  }, {passive:false});
  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  renderer.setSize(innerWidth, innerHeight);

  const tmp = new THREE.Matrix4(), col = new THREE.Color();
  V3 = THREE.Vector3;
  const camGoal = new THREE.Vector3();
  const tick = () => {
    if(warm < 300){ sim(); warm++; }
    // glide camera to frame the focused cluster
    if(camTarget){
      const k = .04;
      camGoal.set(camTarget.x, camTarget.y, camTarget.z).applyMatrix4(group.matrixWorld).multiplyScalar(.55);
      camera.position.lerp(camGoal, k);
      camera.lookAt(0,0,0);
    }
    else group.rotation.y += .0007;
    if(warm < 300){ sim(); warm++; }
    for(let i=0;i<nodes.length;i++){
      const n = nodes[i], s = n === focus ? 2.4 : focus && neighbors(focus.w).has(n.w) ? 1.7 : 1;
      tmp.makeScale(s,s,s).setPosition(n.x,n.y,n.z);
      nodeMesh.setMatrixAt(i, tmp);
      col.set(focus ? (n===focus||neighbors(focus.w).has(n.w) ? temaColor(n.tema) : '#39435a') : temaColor(n.tema));
      col.toArray(nodeMesh.instanceColor.array, i*3);
    }
    nodeMesh.instanceMatrix.needsUpdate = true;
    nodeMesh.instanceColor.needsUpdate = true;
    const pos = scene.userData.lgeo.attributes.position;
    const lc = scene.userData.lgeo.attributes.color;
    for(let i=0;i<links.length;i++){
      const [a,b] = links[i];
      pos.setXYZ(i*2, a.x,a.y,a.z); pos.setXYZ(i*2+1, b.x,b.y,b.z);
      const on = !focus || a===focus || b===focus;
      col.set(on ? (a.tema===b.tema ? temaColor(a.tema) : '#8f9aae') : '#232b3d');
      col.toArray(lc.array, i*6); col.toArray(lc.array, i*6+3);
    }
    pos.needsUpdate = true; lc.needsUpdate = true;
    groupInv = group.matrixWorld.clone().invert();
    updateLabels();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  };
  let warm = 0;
  // pre-warm without rendering
  for(let i=0;i<250;i++) sim();
  tick();
}

let focus = null;

function show(word, push){
  const e = DATA[word];
  if(!e) return;
  focus = idx.get(word) || null;
  picked = word;
  const p = document.getElementById('panel');
  p.style.display = 'block';
  document.getElementById('pw').textContent = word;
  document.getElementById('ptema').textContent = e.tema;
  const chip = (t, cls) => '<a class="chip '+cls+'" data-w="'+t.replace(/"/g,'&quot;')+'">'+t+'</a>';
  let rels = '';
  if(e.sinonimos.length) rels += '<h3>Sinônimos ('+e.sinonimos.length+')</h3>' + e.sinonimos.map(t=>chip(t,'sin')).join('');
  if(e.analogas.length) rels += '<h3>Palavras análogas ('+e.analogas.length+')</h3>' + e.analogas.map(t=>chip(t,'ana')).join('');
  if(!rels) rels = '<p style="color:var(--dim)">Sem relações registradas.</p>';
  document.getElementById('prels').innerHTML = rels;
  document.getElementById('pshare').textContent = 'Compartilhar: ' + location.origin + location.pathname + '?word=' + encodeURIComponent(word);
  if(push) history.replaceState(null, '', '?word=' + encodeURIComponent(word));
  if(camera) camTarget = focus;
}

/* labels: focus + neighbors, projected each frame */
const labelLayer = document.createElement('div');
labelLayer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden';
document.body.appendChild(labelLayer);
let camTarget = null;
let V3 = null;        // set once three.js loads
let groupInv = null;  // inverse of the group's rotation matrix
function updateLabels(){
  labelLayer.innerHTML = '';
  if(!focus || !camera || !V3) return;
  const rel = neighbors(focus.w);
  const items = [focus, ...rel.keys()].map(w => idx.get(w)).filter(Boolean);
  const v = new V3();
  const html = [];
  for(const n of items){
    v.set(n.x, n.y, n.z);
    if(groupInv) v.applyMatrix4(groupInv);
    v.project(camera);
    if(v.z > 1) continue;
    const x = (v.x*.5+.5)*innerWidth, y = (-v.y*.5+.5)*innerHeight;
    const big = n === focus;
    const tag = big ? '' : ' <span style="color:var(--dim);font-size:11px">'+(rel.get(n.w)==='sin'?'sin.':'anál.')+'</span>';
    html.push('<div style="position:absolute;left:'+x+'px;top:'+y+'px;transform:translate(10px,-50%);'+
      'font:'+(big?'600 15px':'500 12.5px')+' Inter,sans-serif;color:'+(big?'var(--acc)':'var(--ink)')+';'+
      'text-shadow:0 1px 4px #000a;white-space:nowrap">'+n.w+tag+'</div>');
  }
  labelLayer.innerHTML = html.join('');
}


document.getElementById('panel').addEventListener('click', e => {
  const w = e.target.getAttribute && e.target.getAttribute('data-w');
  if(w) show(w, true);
});
document.getElementById('close').onclick = () => {
  document.getElementById('panel').style.display = 'none';
  focus = null; picked = null;
  history.replaceState(null, '', location.pathname);
};

/* ---------- search ---------- */
const input = document.getElementById('search');
const hints = document.getElementById('hints');
let sel = -1, matches = [];
function renderHints(){
  if(!matches.length){ hints.style.display = 'none'; return; }
  hints.innerHTML = matches.slice(0, 8).map((w,i) =>
    '<li class="'+(i===sel?'sel':'')+'" data-w="'+w.replace(/"/g,'&quot;')+'">'+w+'<small>'+DATA[w].tema+'</small></li>').join('');
  hints.style.display = 'block';
}
input.addEventListener('input', () => {
  const q = norm(input.value.trim());
  sel = -1;
  matches = q ? names.filter(w => norm(w).includes(q))
               .sort((a,b) => (norm(a).indexOf(q)-norm(b).indexOf(q)) || (norm(a).length-norm(b).length)) : [];
  renderHints();
});
input.addEventListener('keydown', e => {
  if(e.key === 'ArrowDown'){ sel = Math.min(sel+1, Math.min(matches.length,8)-1); renderHints(); e.preventDefault(); }
  else if(e.key === 'ArrowUp'){ sel = Math.max(sel-1, 0); renderHints(); e.preventDefault(); }
  else if(e.key === 'Enter'){
    const w = sel >= 0 ? matches[sel] : matches[0];
    if(w){ show(w, true); hints.style.display = 'none'; input.value = ''; input.blur(); }
  } else if(e.key === 'Escape'){ hints.style.display = 'none'; input.blur(); }
});
hints.addEventListener('click', e => {
  const w = e.target.getAttribute && e.target.getAttribute('data-w');
  if(w){ show(w, true); hints.style.display = 'none'; input.value = ''; }
});
document.addEventListener('click', e => { if(!e.target.closest('#searchwrap')) hints.style.display='none'; });
legend.addEventListener('click', e => {
  const t = e.target.closest('a') && e.target.closest('a').getAttribute('data-t');
  if(t){ const first = names.find(w => DATA[w].tema === t); if(first) show(first, true); }
});

/* ---------- deep link ---------- */
const q = new URLSearchParams(location.search).get('word');
if(q){
  const hit = names.find(w => norm(w) === norm(q));
  if(hit) show(hit, false);
}

function fallbackList(){
  document.getElementById('c').style.display = 'none';
  const f = document.getElementById('fallback');
  f.style.display = 'block';
  f.innerHTML = names.slice().sort((a,b)=>a.localeCompare(b,'pt')).map(w =>
    '<p style="margin:4px 0"><a href="#" data-w="'+w+'" style="color:var(--acc);text-decoration:none">'+w+'</a> <span style="color:var(--dim)">'+DATA[w].tema+' · '+
    [DATA[w].sinonimos.map(t=>t+' (sin)'), DATA[w].analogas.map(t=>t+' (análogo)')].flat().join(', ')+'</span></p>').join('');
  f.addEventListener('click', e => {
    const w = e.target.getAttribute && e.target.getAttribute('data-w');
    if(w) show(w, true);
  });
}

init3D();
</script>
</body>
</html>
