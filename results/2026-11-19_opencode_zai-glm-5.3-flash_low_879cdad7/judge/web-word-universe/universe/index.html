<style>
:root{
  --bg:#0d0f14; --panel:#151823; --panel2:#1b1f2e; --line:#2a3047;
  --tx:#e8e6df; --dim:#9aa0b5; --acc:#e8b04b; --acc2:#7fb8a4;
  --sin:#e8b04b; --ana:#7fb8a4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);z-index:5}
header h1{font-family:Fraunces,serif;font-weight:500;font-size:19px;letter-spacing:.3px}
header h1 em{color:var(--acc);font-style:normal}
.searchwrap{position:relative;flex:0 0 320px}
#search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px 12px;font:inherit;font-size:14px;outline:none}
#search:focus{border-color:var(--acc)}
#suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:280px;overflow:auto;display:none;z-index:10;box-shadow:0 8px 24px #0008}
#suggest div{padding:7px 12px;cursor:pointer;font-size:14px}
#suggest div small{color:var(--dim);margin-left:8px}
#suggest div:hover,#suggest div.sel{background:#2a3047}
.stats{margin-left:auto;color:var(--dim);font-size:12px;white-space:nowrap}
.stats b{color:var(--acc2)}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#hint{position:absolute;bottom:10px;left:14px;color:var(--dim);font-size:11.5px;pointer-events:none}
#legend{position:absolute;bottom:10px;right:14px;font-size:11.5px;color:var(--dim);pointer-events:none}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px}
#side{width:340px;flex:0 0 340px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:18px}
#side h2{font-family:Fraunces,serif;font-weight:500;font-size:30px;line-height:1.1;margin-bottom:2px}
.tema{display:inline-block;margin:6px 0 14px;padding:3px 10px;border:1px solid var(--acc2);color:var(--acc2);border-radius:99px;font-size:12px}
.empty{color:var(--dim);font-size:13.5px;margin-top:8px;line-height:1.6}
.rel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;margin:16px 0 8px;color:var(--dim)}
.rel h3::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.rel h3.sin::before{background:var(--sin)} .rel h3.ana::before{background:var(--ana)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--tx)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.sin{border-color:#5a4420}.chip.ana{border-color:#2c4a41}
.deg{color:var(--dim);font-size:12.5px;margin-top:14px}
.top{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.top h3{font-size:11.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);margin-bottom:8px}
.top ol{margin-left:18px;font-size:13px;color:var(--dim)}
.top li{margin:3px 0;cursor:pointer}
.top li:hover{color:var(--acc)}
@media(max-width:820px){#side{position:absolute;right:0;top:0;bottom:0;width:min(340px,86vw);z-index:6}}
</style>
</head>

/* ---------- helpers ---------- */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const WORDS = DATA.words;
const keys = Object.keys(WORDS);
const byNorm = {}; keys.forEach(w => byNorm[norm(w)] = w);
const adj = {};
keys.forEach(w => {
  adj[w] = [];
  WORDS[w].sinonimos.forEach(t => WORDS[t] && adj[w].push({to:t, kind:'sin'}));
  WORDS[w].analogas.forEach(t => WORDS[t] && adj[w].push({to:t, kind:'ana'}));
});
document.getElementById('stats').innerHTML =
  `<b>${keys.length}</b> palavras · <b>${DATA.relations}</b> relações · ${DATA.themes.length} temas`;

/* ---------- graph data ---------- */
const pairs = [];        // {a,b,kind}
const seen = new Set();
for(const w of keys) for(const e of adj[w]){
  const k = [w,e.to].sort().join('|');
  if(!seen.has(k)){ seen.add(k); pairs.push({a:w, b:e.to, kind:e.kind}); }
}
let s = 42; const rnd = () => (s = (s*1103515245+12345)&0x7fffffff)/0x7fffffff;
const themeIdx = {}; DATA.themes.forEach((t,i)=>themeIdx[t]=i);
const nodes = keys.map(w => {
  const n = { w, x:(rnd()-.5)*600, y:(rnd()-.5)*600, vx:0, vy:0, deg:adj[w].length };
  n.hue = WORDS[w].tema in themeIdx ? (themeIdx[WORDS[w].tema]*47)%360 : 210;
  return n;
});
const nodeOf = {}; nodes.forEach(n => nodeOf[n.w] = n);
const pairNodes = pairs.map(p => ({p, na:nodeOf[p.a], nb:nodeOf[p.b]})).filter(x => x.na && x.nb);

/* ---------- canvas ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function resize(){
  dpr = Math.min(devicePixelRatio||1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
}
addEventListener('resize', resize); resize();

let sel = null, hover = null, panX = 0, panY = 0, scale = 1;
const alpha = {v: 1};
const focus = new Set();

function step(){
  // forces
  const kRep = 1400, kSpring = 0.012, rest = 26 + 8;
  for(let i=0;i<nodes.length;i++){
    const a = nodes[i];
    for(let j=i+1;j<nodes.length;j++){
      const b = nodes[j];
      let dx = a.x-b.x, dy = a.y-b.y;
      let d2 = dx*dx+dy*dy || 1;
      const d = Math.sqrt(d2);
      const f = kRep/d2 * alpha.v;
      const fx = f*dx/d, fy = f*dy/d;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  for(const {p, na, nb} of pairNodes){
    const dx = nb.x-na.x, dy = nb.y-na.y;
    const d = Math.sqrt(dx*dx+dy*dy) || 1;
    const f = kSpring*(d-rest)*alpha.v;
    const fx = f*dx/d, fy = f*dy/d;
    na.vx += fx; na.vy += fy; nb.vx -= fx; nb.vy -= fy;
    // pull toward center
    na.vx -= na.x*0.0006*alpha.v; na.vy -= na.y*0.0006*alpha.v;
    nb.vx -= nb.x*0.0006*alpha.v; nb.vy -= nb.y*0.0006*alpha.v;
  }
  for(const n of nodes){
    n.vx *= .85; n.vy *= .85;
    n.x += Math.max(-8, Math.min(8, n.vx));
    n.y += Math.max(-8, Math.min(8, n.vy));
  }
  alpha.v *= 0.995; if(alpha.v < 0.02) alpha.v = 0;
}

function toScreen(n){ return [ (n.x+panX)*scale + W/2, (n.y+panY)*scale + H/2 ]; }
function fromScreen(px, py){ return [ (px-W/2)/scale - panX, (py-H/2)/scale - panY ]; }

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.lineCap = 'round';
  for(const {p, na, nb} of pairNodes){
    const [x1,y1] = toScreen(na), [x2,y2] = toScreen(nb);
    let on = !sel || p.a===sel || p.b===sel;
    ctx.strokeStyle = on ? (p.kind==='sin' ? 'rgba(232,176,75,'+(sel?0.85:0.22)+')' : 'rgba(127,184,164,'+(sel?0.85:0.22)+')') : 'rgba(42,48,71,0.25)';
    ctx.lineWidth = on && sel ? 1.6 : 0.7;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  ctx.textAlign = 'center';
  for(const n of nodes){
    const [x,y] = toScreen(n);
    if(x<-40||x>W+40||y<-40||y>H+40) continue;
    const r = Math.max(2.5, Math.min(9, 2.5 + n.deg*0.5)) * (n.w===sel?1.7:1) * Math.max(.6, scale);
    let fill;
    if(n.w===sel) fill = '#ffffff';
    else if(sel && focus.has(n.w)) fill = `hsl(${n.hue} 70% 62%)`;
    else if(sel) fill = '#2a3047';
    else fill = `hsl(${n.hue} 48% 62%)`;
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832); ctx.fill();
    const showLabel = !sel && n.deg>=7 || n.w===sel || (sel && focus.has(n.w)) || n===hover;
    if(showLabel){
      ctx.font = (n.w===sel ? '600 15px' : '500 11px') + ' Inter, sans-serif';
      ctx.fillStyle = n.w===sel ? '#ffffff' : (sel ? 'rgba(232,230,223,.85)' : 'rgba(154,160,181,.9)');
      ctx.fillText(n.w, x, y - r - 5);
    }
  }
  if(alpha.v>0 || true) {} 
}

function tick(){
  if(alpha.v>0) step();
  draw();
  requestAnimationFrame(tick);
}

/* ---------- interaction ---------- */
let drag = null;
cv.addEventListener('pointerdown', e => {
  drag = {x:e.clientX, y:e.clientY, moved:false};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if(drag){
    const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3) drag.moved = true;
    if(drag.moved){ panX += dx/scale; panY += dy/scale; alpha.v = Math.max(alpha.v, .1); }
    drag.x = e.clientX; drag.y = e.clientY;
  }
  const [gx,gy] = fromScreen(e.offsetX, e.offsetY);
  hover = null;
  let best = 22/scale;
  for(const n of nodes){
    const d = Math.hypot(n.x-gx, n.y-gy);
    if(d < best){ best = d; hover = n; }
  }
  cv.style.cursor = drag && drag.moved ? 'grabbing' : (hover ? 'pointer' : 'grab');
});
cv.addEventListener('pointerup', e => {
  if(drag && !drag.moved && hover) select(hover.w);
  drag = null;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY>0 ? .9 : 1.1;
  // zoom around cursor
  const [gx,gy] = fromScreen(e.offsetX, e.offsetY);
  scale = Math.max(.15, Math.min(5, scale*f));
  const [gx2,gy2] = fromScreen(e.offsetX, e.offsetY);
  panX += gx2-gx; panY += gy2-gy;
}, {passive:false});

/* ---------- side panel ---------- */
const side = document.getElementById('side');
function select(w){
  sel = w;
  focus.clear();
  if(w) adj[w].forEach(e => focus.add(e.to));
  const d = WORDS[w];
  if(w){
    const chips = (list, kind) => list.length
      ? `<div class="chips">` + list.map(t=>`<button class="chip ${kind}" data-w="${t.replace(/"/g,'&quot;')}">${t}</button>`).join('') + `</div>`
      : `<div class="empty">—</div>`;
    side.innerHTML = `
      <h2>${w}</h2>
      ${d.tema ? `<span class="tema">${d.tema}</span>` : ''}
      <div class="rel">
        <h3 class="sin">Sinônimos (${d.sinonimos.length})</h3>${chips(d.sinonimos,'sin')}
        <h3 class="ana">Palavras análogas (${d.analogas.length})</h3>${chips(d.analogas,'ana')}
      </div>
      <div class="deg">${adj[w].length} conexões diretas · <button class="chip" id="clearSel">ver universo inteiro</button></div>
      <div class="top"><h3>Mais conectadas</h3><ol>${DATA.most_connected.map(m=>`<li data-w="${m.word}">${m.word} <small>(${m.relations})</small></li>`).join('')}</ol></div>`;
    side.querySelectorAll('[data-w]').forEach(el => el.onclick = () => select(el.dataset.w));
    document.getElementById('clearSel').onclick = () => select(null);
  } else {
    side.innerHTML = `
      <h2>Universo</h2><span class="tema">${DATA.themes.join(' · ')}</span>
      <div class="empty">Selecione um ponto no grafo ou busque uma palavra para ver com quem ela se liga.</div>
      <div class="top"><h3>Mais conectadas</h3><ol>${DATA.most_connected.map(m=>`<li data-w="${m.word}">${m.word} <small>(${m.relations})</small></li>`).join('')}</ol></div>`;
    side.querySelectorAll('[data-w]').forEach(el => el.onclick = () => select(el.dataset.w));
  }
  const url = new URL(location);
  if(w) url.searchParams.set('word', w); else url.searchParams.delete('word');
  history.replaceState(null,'',url);
  // center on selection
  if(w){ const n = nodeOf[w]; panX = -n.x; panY = -n.y; if(scale<1) scale = 1; }
}

/* ---------- search ---------- */
const inp = document.getElementById('search'), sug = document.getElementById('suggest');
let sugList = [], sugIdx = -1;
function renderSug(){
  if(!sugList.length){ sug.style.display='none'; return; }
  sug.innerHTML = sugList.map((w,i)=>`<div data-i="${i}" class="${i===sugIdx?'sel':''}">${w}<small>${WORDS[w].tema||''} · ${adj[w].length} relações</small></div>`).join('');
  sug.style.display='block';
  [...sug.children].forEach(el => el.onmousedown = e => { e.preventDefault(); choose(sugList[+el.dataset.i]); });
}
function choose(w){ sug.style.display='none'; inp.value=''; sugList=[]; select(w); }
inp.addEventListener('input', () => {
  const q = norm(inp.value.trim());
  sugIdx = -1;
  sugList = q ? keys.filter(w => norm(w).includes(q)).sort((a,b)=>adj[b].length-adj[a].length).slice(0,12) : [];
  renderSug();
});
inp.addEventListener('keydown', e => {
  if(e.key==='ArrowDown'){ sugIdx=Math.min(sugIdx+1,sugList.length-1); renderSug(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ sugIdx=Math.max(sugIdx-1,0); renderSug(); e.preventDefault(); }
  else if(e.key==='Enter'){ choose(sugList[Math.max(sugIdx,0)] ?? inp.value.trim()); }
  else if(e.key==='Escape'){ sug.style.display='none'; }
});
document.addEventListener('pointerdown', e => { if(!sug.contains(e.target) && e.target!==inp) sug.style.display='none'; });

/* ---------- boot ---------- */
const q = new URLSearchParams(location.search).get('word');
const start = q && (WORDS[q] ? q : byNorm[norm(q)]);
tick();
select(start || null);
</script>
