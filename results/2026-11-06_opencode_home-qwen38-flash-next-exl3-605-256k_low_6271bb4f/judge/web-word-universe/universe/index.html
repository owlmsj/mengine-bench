<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo das Palavras — Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d14;--ink:#e8e6df;--dim:#8b8fa3;--panel:rgba(15,18,28,.88);--line:#262b3d}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 70% 20%,#131726 0%,var(--bg) 60%);color:var(--ink);
font:400 14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;display:block;cursor:grab}
#gl.drag{cursor:grabbing}
.hud{position:fixed;z-index:5}
#brand{top:22px;left:26px;max-width:340px;pointer-events:none}
#brand h1{font-family:Fraunces,serif;font-weight:900;font-size:26px;letter-spacing:.2px}
#brand p{color:var(--dim);font-size:12.5px;margin-top:2px}
#stats{margin-top:8px;display:flex;gap:14px}
#stats b{font-family:Fraunces,serif;font-weight:600;font-size:17px;color:var(--ink)}
#stats span{color:var(--dim);font-size:11px;display:block;text-transform:uppercase;letter-spacing:.12em}
#search{top:22px;left:50%;transform:translateX(-50%);width:min(420px,52vw)}
#q{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--ink);
padding:10px 18px;font:500 14px Inter;outline:none;backdrop-filter:blur(8px)}
#q:focus{border-color:#4a5578}
#ac{position:absolute;top:46px;left:0;right:0;background:var(--panel);border:1px solid var(--line);
border-radius:12px;overflow:hidden;display:none;backdrop-filter:blur(8px)}
#ac div{padding:8px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#ac div small{color:var(--dim)}
#ac div:hover,#ac div.on{background:#1d2338}
#panel{top:96px;right:22px;width:300px;max-height:calc(100vh - 140px);overflow:auto;background:var(--panel);
border:1px solid var(--line);border-radius:16px;padding:18px;display:none;backdrop-filter:blur(10px)}
#panel h2{font-family:Fraunces,serif;font-weight:900;font-size:26px;line-height:1.1}
#panel .tema{display:inline-block;margin-top:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
#panel .n{color:var(--dim);font-size:12px;margin:10px 0 6px}
#rel{display:flex;flex-wrap:wrap;gap:6px}
#rel a{font-size:12.5px;padding:4px 10px;border-radius:999px;background:#1a2033;border:1px solid var(--line);
color:var(--ink);text-decoration:none;cursor:pointer}
#rel a:hover{background:#28304d}
#panel .close{position:absolute;top:10px;right:14px;color:var(--dim);cursor:pointer;font-size:18px}
#legend{bottom:20px;left:26px;display:flex;flex-wrap:wrap;gap:6px 14px;max-width:46vw}
#legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);cursor:pointer}
#legend i{width:9px;height:9px;border-radius:50%}
#legend span:hover{color:var(--ink)}
#hint{bottom:20px;right:26px;color:var(--dim);font-size:11.5px}
#tip{position:fixed;z-index:6;pointer-events:none;background:#10141f;border:1px solid var(--line);
padding:3px 10px;border-radius:8px;font-size:12.5px;display:none;transform:translate(-50%,-140%)}
.lbl{position:fixed;z-index:4;pointer-events:none;font-family:Fraunces,serif;font-weight:600;
transform:translate(-50%,-160%);text-shadow:0 1px 6px #000;white-space:nowrap}
#fallback{position:fixed;inset:0;overflow:auto;padding:120px 8vw 40px;display:none}
body.no3d #fallback{display:block}
body.no3d #legend,body.no3d #hint{display:none}
#fallback h3{font-family:Fraunces,serif;margin:18px 0 8px;font-size:18px}
#fallback a{display:inline-block;margin:3px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;
color:var(--ink);text-decoration:none;cursor:pointer;font-size:13px}
#fallback a:hover{background:#1d2338}
@media(max-width:760px){#brand{max-width:60vw}#panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:45vh}#legend{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud" id="brand">
  <h1>Universo das Palavras</h1>
  <p>Um mapa do Dicionário Criativo: cada estrela é uma palavra, cada fio é uma relação.</p>
  <div id="stats"></div>
</div>
<div class="hud" id="search">
  <input id="q" placeholder="buscar uma palavra… ex.: saudade" autocomplete="off">
  <div id="ac"></div>
</div>
<div class="hud" id="panel"></div>
<div class="hud" id="legend"></div>
<div class="hud" id="hint">arraste para girar · roda para aproximar · clique numa estrela</div>
<div id="tip"></div>
<div id="fallback"></div>

const N = D.W.length, norm = s => s.normalize('NFD').replace(/\p{M}/gu,'').toLowerCase();
const deg = D.A.map(a => a.length);
const COLORS = D.THEMES.map(t => t.c);
const $ = s => document.querySelector(s);
let sel = -1, hover = -1;

$('#stats').innerHTML = [[N,'palavras'],[D.E.length,'relações'],[D.TOP.join(' · '),'mais conectada'+(D.TOP.length>1?'s':'')]]
  .map(([v,l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');
$('#legend').innerHTML = D.THEMES.map((t,i) =>
  `<span data-t="${i}"><i style="background:${t.c}"></i>${t.n} · ${D.T.filter(x=>x===i).length}</span>`).join('');
$('#legend').onclick = e => { const s = e.target.closest('[data-t]'); if (!s) return;
  const i = +s.dataset.t, first = D.T.indexOf(i); select(first); focusOn(first); };

function findWord(q) { q = norm(q.trim()); if (!q) return -1;
  let i = D.W.findIndex(w => norm(w) === q); if (i >= 0) return i;
  i = D.L.findIndex(l => norm(l) === q); if (i >= 0) return i;
  i = D.W.findIndex(w => norm(w).startsWith(q)); if (i >= 0) return i;
  return D.L.findIndex(l => norm(l).startsWith(q)); }

function select(i) { sel = i; renderPanel(); if (window.paint) window.paint(); syncURL(); }
function syncURL() { if (sel < 0) return; const w = encodeURIComponent(D.W[sel]);
  try { const u = new URL(location); u.searchParams.set('word', D.W[sel]); history.replaceState(null,'',u); } catch(e) {}
  if (decodeURIComponent((location.search.match(/[?&]word=([^&]*)/) || [])[1] || '') !== D.W[sel])
    location.hash = 'word=' + w; }

function renderPanel() { const p = $('#panel');
  if (sel < 0) { p.style.display = 'none'; return; }
  p.style.display = 'block';
  const rel = [...D.A[sel]].sort((a,b) => D.L[a].localeCompare(D.L[b],'pt'));
  p.innerHTML = `<span class="close" title="fechar">×</span><h2>${D.L[sel]}</h2>
    <span class="tema" style="color:${COLORS[D.T[sel]]};border-color:${COLORS[D.T[sel]]}55">${D.THEMES[D.T[sel]].n}</span>
    <div class="n">${rel.length} conexões</div><div id="rel">${rel.map(j =>
      `<a data-j="${j}" style="border-color:${COLORS[D.T[j]]}66">${D.L[j]}</a>`).join('')}</div>`;
  p.querySelector('.close').onclick = () => select(-1);
  p.querySelectorAll('#rel a').forEach(a => a.onclick = () => { const j = +a.dataset.j; select(j); focusOn(j); }); }

/* ---------- 3D ---------- */
let cam = {r: 260, th: 0.6, ph: 1.15}, target = null, auto = true;
async function boot() {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  const canvas = $('#gl'), rend = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  rend.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene(), cam3 = new THREE.PerspectiveCamera(50, 1, 1, 3000);
  scene.add(new THREE.AmbientLight(0xffffff, .75));
  const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(1,1,1); scene.add(dl);

  const geo = new THREE.SphereGeometry(1, 18, 18);
  const nodes = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({roughness:.45}), N);
  const M = new THREE.Matrix4(), C = new THREE.Color();
  const base = [];
  for (let i = 0; i < N; i++) {
    const s = 1.1 + Math.sqrt(deg[i]) * .62; base.push(s);
    M.makeScale(s,s,s).setPosition(D.P[i][0], D.P[i][1], D.P[i][2]);
    nodes.setMatrixAt(i, M); nodes.setColorAt(i, C.set(COLORS[D.T[i]]));
  }
  scene.add(nodes);

  const epos = new Float32Array(D.E.length * 6), ecol = new Float32Array(D.E.length * 6);
  D.E.forEach(([a,b], k) => {
    epos.set(D.P[a], k*6); epos.set(D.P[b], k*6+3);
    const ca = C.set(COLORS[D.T[a]]), cb = C.set(COLORS[D.T[b]]);
    ecol.set([ca.r,ca.g,ca.b,cb.r,cb.g,cb.b], k*6);
  });
  const eg = new THREE.BufferGeometry();
  eg.setAttribute('position', new THREE.BufferAttribute(epos,3));
  eg.setAttribute('color', new THREE.BufferAttribute(ecol,3));
  const edges = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.16}));
  scene.add(edges);
  const hlGeo = new THREE.BufferGeometry();
  const hl = new THREE.LineSegments(hlGeo, new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.75}));
  scene.add(hl);

  function paint() {
    const nb = sel >= 0 ? new Set(D.A[sel]) : null;
    for (let i = 0; i < N; i++) {
      C.set(COLORS[D.T[i]]);
      if (sel >= 0) { if (i === sel) C.set('#ffffff'); else if (!nb.has(i)) C.multiplyScalar(.16); }
      else if (hover >= 0 && i !== hover && !D.A[hover].includes(i)) C.multiplyScalar(.55);
      nodes.setColorAt(i, C);
    }
    nodes.instanceColor.needsUpdate = true;
    if (sel >= 0) { const pts = [];
      for (const j of D.A[sel]) pts.push(...D.P[sel], ...D.P[j]);
      hlGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts),3));
      hl.visible = true;
    } else hl.visible = false;
    renderLabels();
  }

  window.paint = paint;
  const lbls = [];
  function renderLabels() {
    lbls.forEach(e => e.remove()); lbls.length = 0;
    if (sel < 0) return;
    for (const j of [sel, ...D.A[sel]]) addLabel(j, j === sel);
  }
  function addLabel(i, big) { const d = document.createElement('div'); d.className = 'lbl';
    d.textContent = D.L[i]; d.style.color = big ? '#fff' : COLORS[D.T[i]]; d.style.fontSize = big ? '22px' : '13px';
    document.body.appendChild(d); lbls.push({i, el:d, big}); }
  function placeLabels() { const w = innerWidth, h = innerHeight;
    for (const e of lbls) { const v = new THREE.Vector3(...D.P[e.i]).project(cam3);
      if (v.z > 1) { e.el.style.display = 'none'; continue; }
      e.el.style.display = 'block';
      e.el.style.left = (v.x*.5+.5)*w + 'px'; e.el.style.top = (-v.y*.5+.5)*h + 'px'; } }

  const rc = new THREE.Raycaster(), pt = new THREE.Vector2();
  function pick(ev) { pt.set(ev.clientX/innerWidth*2-1, -(ev.clientY/innerHeight)*2+1);
    rc.setFromCamera(pt, cam3); const h = rc.intersectObject(nodes)[0]; return h ? h.instanceId : -1; }
  canvas.addEventListener('pointermove', ev => { if (drag) return;
    const i = pick(ev); if (i === hover) return; hover = i; canvas.style.cursor = i >= 0 ? 'pointer' : '';
    const tip = $('#tip');
    if (i >= 0) { tip.style.display = 'block'; tip.textContent = D.L[i];
      tip.style.left = ev.clientX+'px'; tip.style.top = ev.clientY+'px'; } else tip.style.display = 'none';
    if (sel < 0) paint(); });
  let drag = null;
  canvas.addEventListener('pointerdown', ev => { drag = {x:ev.clientX, y:ev.clientY, moved:0}; canvas.classList.add('drag'); auto = false; });
  addEventListener('pointermove', ev => { if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y; drag.moved += Math.abs(dx)+Math.abs(dy);
    cam.th -= dx*.005; cam.ph = Math.min(Math.PI-.05, Math.max(.05, cam.ph - dy*.005));
    drag.x = ev.clientX; drag.y = ev.clientY; });
  addEventListener('pointerup', ev => { if (!drag) return; const wasDrag = drag.moved > 6; drag = null;
    canvas.classList.remove('drag'); if (!wasDrag) { const i = pick(ev); select(i); if (i >= 0) focusOn(i); } });
  canvas.addEventListener('wheel', ev => { ev.preventDefault(); auto = false;
    cam.r = Math.min(900, Math.max(60, cam.r * (1 + Math.sign(ev.deltaY)*.09))); }, {passive:false});

  window.focusOn = i => { const p = D.P[i];
    target = {th: Math.atan2(p[0], p[2]) + Math.PI, ph: Math.acos(Math.max(-1,Math.min(1, p[1]/Math.max(1,Math.hypot(...p))))), r: Math.max(120, cam.r)}; };

  function resize() { rend.setSize(innerWidth, innerHeight); cam3.aspect = innerWidth/innerHeight; cam3.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize(); paint();

  (function loop(t) { requestAnimationFrame(loop);
    if (target) { cam.th += (target.th - cam.th)*.06; cam.ph += (target.ph - cam.ph)*.06; cam.r += (target.r - cam.r)*.06;
      if (Math.abs(target.r - cam.r) < .5) target = null; }
    if (auto && !drag) cam.th += .0007;
    cam3.position.set(cam.r*Math.sin(cam.ph)*Math.sin(cam.th), cam.r*Math.cos(cam.ph), cam.r*Math.sin(cam.ph)*Math.cos(cam.th));
    cam3.lookAt(0,0,0); rend.render(scene, cam3); placeLabels(); })(0);
}
boot().catch(() => { document.body.classList.add('no3d'); buildFallback(); });

/* ---------- fallback (sem WebGL/CDN): lista navegável ---------- */
function buildFallback() { const f = $('#fallback');
  f.innerHTML = D.THEMES.map((t,i) => `<h3 style="color:${t.c}">${t.n}</h3>` +
    D.W.map((w,j) => D.T[j]===i ? `<a data-j="${j}">${D.L[j]}</a>` : '').join('')).join('');
  f.querySelectorAll('a').forEach(a => a.onclick = () => select(+a.dataset.j)); }

/* ---------- search ---------- */
const q = $('#q'), ac = $('#ac'); let acList = [], acSel = -1;
q.addEventListener('input', () => { const v = norm(q.value);
  acList = v ? D.W.map((w,i) => [i, norm(w), norm(D.L[i])]).filter(([,a,b]) => a.includes(v)||b.includes(v))
    .sort((x,y) => (x[1].startsWith(v)?0:1)-(y[1].startsWith(v)?0:1) || deg[y[0]]-deg[x[0]]).slice(0,8).map(([i])=>i) : [];
  acSel = acList.length ? 0 : -1; drawAC(); });
function drawAC() { ac.style.display = acList.length ? 'block' : 'none';
  ac.innerHTML = acList.map((i,k) => `<div data-i="${i}" class="${k===acSel?'on':''}"><span>${D.L[i]}</span><small>${D.THEMES[D.T[i]].n} · ${deg[i]}</small></div>`).join('');
  ac.querySelectorAll('div').forEach(d => d.onclick = () => go(+d.dataset.i)); }
function go(i) { q.value = ''; ac.style.display = 'none'; acList = []; select(i); if (window.focusOn) focusOn(i); }
q.addEventListener('keydown', e => { if (e.key === 'ArrowDown'){acSel=(acSel+1)%acList.length;drawAC();e.preventDefault();}
  else if (e.key === 'ArrowUp'){acSel=(acSel-1+acList.length)%acList.length;drawAC();e.preventDefault();}
  else if (e.key === 'Enter') { const i = acSel >= 0 ? acList[acSel] : findWord(q.value); if (i >= 0) go(i); }
  else if (e.key === 'Escape') { ac.style.display = 'none'; } });
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } });

/* ---------- start ---------- */
const want = new URLSearchParams(location.search).get('word')
  || new URLSearchParams(location.hash.slice(1)).get('word');
if (want) { const i = findWord(want);
  if (i >= 0) { select(i); setTimeout(() => window.focusOn && focusOn(i), 300); } }
</script>
