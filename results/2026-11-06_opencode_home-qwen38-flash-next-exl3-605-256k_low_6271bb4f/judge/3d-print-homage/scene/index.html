<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa - low poly 3D wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9dfc6}
  #cap{position:fixed;left:20px;bottom:16px;color:#23407e;
    font-family:'Shippori Mincho',serif;letter-spacing:.06em;user-select:none;pointer-events:none}
  #cap b{display:block;font-size:17px;font-weight:700}
  #cap span{font-size:11px;opacity:.75}
</style>
</head>
<body>
<div id="cap"><b>神奈川沖浪裏</b><span>The Great Wave off Kanagawa - after Hokusai - low poly</span></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// Palette taken from the print: Prussian blues, foam white, aged-paper beige, ochre hulls.
const P = {
  paper: 0xe9dfc6, deep: 0x1b2f66, mid: 0x2f5d9e, light: 0x7fa8cf,
  pale: 0xbcd4e6, foam: 0xf4f1e8, boat: 0xd8a05e, rower: 0x23407e, snow: 0xf4f1e8
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(P.paper);
scene.fog = new THREE.Fog(P.paper, 40, 95);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 200);
camera.position.set(4.5, 9.5, 24);
camera.lookAt(-2.5, 3.2, -8);

scene.add(new THREE.HemisphereLight(0xf6efdc, 0x23407e, 1.05));
const sun = new THREE.DirectionalLight(0xfff3d6, 1.1);
sun.position.set(-6, 12, 8);
scene.add(sun);

// ---- Sea height field: rolling swells + the great wave ridge + right swell ----
function seaH(x, z, t) {
  let y = 0;
  y += 0.55 * Math.sin(x * 0.28 + t * 0.9) * Math.sin(z * 0.16 - t * 0.5);
  y += 0.34 * Math.sin(x * 0.5 - z * 0.22 + t * 1.25 + 2.0);
  y += 0.2 * Math.sin(z * 0.6 + t * 1.0 + 1.0);
  // great wave: diagonal ridge, tall at front-left, tapering back
  const bx = x + 7.0, bz = z + 1.0;
  const d = bx * 0.82 - bz * 0.42;                 // signed distance from ridge line
  const along = bx * 0.42 + bz * 0.82;             // along the ridge
  let crest = Math.exp(-d * d * 0.10) * 6.0;
  crest *= 1 / (1 + Math.max(0, along - 4) * 0.35);
  crest *= 1 + 0.10 * Math.sin(along * 1.4 - t * 1.6);
  y += crest;
  // right swell rising to the right edge
  const rd = (x - 9.5) * 0.9 - (z + 3) * 0.3;
  y += Math.exp(-rd * rd * 0.045) * 3.0;
  // foreground swell under the front boat
  const fd = (x - 1.5) * 0.5 - (z - 9) * 0.25;
  y += Math.exp(-fd * fd * 0.05) * 1.7;
  return y;
}

const W = 64, D = 46, SX = 150, SZ = 110;
const seaGeo = new THREE.PlaneGeometry(W, D, SX, SZ);
seaGeo.rotateX(-Math.PI / 2);
seaGeo.translate(0, 0, -6);
const seaPos = seaGeo.attributes.position;
const seaCol = new Float32Array(seaPos.count * 3);
seaGeo.setAttribute('color', new THREE.BufferAttribute(seaCol, 3));
const sea = new THREE.Mesh(seaGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, flatShading: true, roughness: 0.9
}));
scene.add(sea);

const cDeep = new THREE.Color(P.deep), cMid = new THREE.Color(P.mid),
      cLight = new THREE.Color(P.light), cPale = new THREE.Color(P.pale),
      cFoam = new THREE.Color(P.foam), tmp = new THREE.Color();

function colorFor(y, x, z, out) {
  // band the height like woodblock colour plates, foam on crests
  let yc = y;
  const d = (x + 7) * 0.82 - (z + 1) * 0.42;   // great-wave front faces the camera: keep it blue
  if (d > 0) yc -= 1.7;
  if (yc > 5.3) out.copy(cFoam);
  else if (yc > 4.8) out.copy(cPale);
  else if (yc > 3.6) out.copy(cLight);
  else if (yc > 1.4) out.copy(cMid);
  else out.copy(cDeep);
  // speckle foam flecks on mid crests, like the print's spray dots
  const n = Math.sin(x * 9.0) * Math.sin(z * 7.0 + x * 3.0);
  if (yc > 2.6 && n > 0.9) out.copy(cFoam);
}

function updateSea(t) {
  for (let i = 0; i < seaPos.count; i++) {
    const x = seaPos.getX(i), z = seaPos.getZ(i);
    const y = seaH(x, z, t);
    seaPos.setY(i, y);
    colorFor(y, x, z, tmp);
    seaCol[i * 3] = tmp.r; seaCol[i * 3 + 1] = tmp.g; seaCol[i * 3 + 2] = tmp.b;
  }
  seaPos.needsUpdate = true;
  seaGeo.attributes.color.needsUpdate = true;
  seaGeo.computeVertexNormals();
}

// ---- Foam fingers along the great wave crest (instanced low-poly blobs) ----
const foamGeo = new THREE.IcosahedronGeometry(0.34, 0);
const foamMat = new THREE.MeshStandardMaterial({ color: P.foam, flatShading: true, roughness: 1 });
const FOAM_N = 150;
const foam = new THREE.InstancedMesh(foamGeo, foamMat, FOAM_N);
const foamSeed = [];
for (let i = 0; i < FOAM_N; i++) {
  const along = -3 + Math.random() * 13;           // along ridge, front to back
  const off = (Math.random() - 0.5) * 2.2;         // across the crest
  foamSeed.push({ along, off, s: 0.5 + Math.random() * 1.1, ph: Math.random() * 6.28 });
}
scene.add(foam);
const dummy = new THREE.Object3D();
function updateFoam(t) {
  for (let i = 0; i < FOAM_N; i++) {
    const f = foamSeed[i];
    // ridge line: point where d=0, i.e. (x+7, z+1) along dir (0.42,0.82)*along
    const px = -7 + 0.42 * f.along + 0.82 * f.off;
    const pz = -1 + 0.82 * f.along - 0.42 * f.off + -6;
    const y = seaH(px, pz + 6, t) + 0.15 + 0.12 * Math.sin(t * 2 + f.ph);
    dummy.position.set(px, y, pz);
    const s = f.s * (0.85 + 0.15 * Math.sin(t * 1.7 + f.ph));
    dummy.scale.set(s, s * 0.7, s);
    dummy.rotation.set(f.ph, f.ph * 2, 0);
    dummy.updateMatrix();
    foam.setMatrixAt(i, dummy.matrix);
  }
  foam.instanceMatrix.needsUpdate = true;
}

// ---- Mount Fuji: small snow-capped cone in the central trough ----
const fujiGeo = new THREE.ConeGeometry(3.0, 4.2, 5);
{
  const p = fujiGeo.attributes.position, col = new Float32Array(p.count * 3);
  const rock = new THREE.Color(0x4a6fa5), snow = new THREE.Color(P.snow);
  for (let i = 0; i < p.count; i++) {
    const c = p.getY(i) > -0.2 ? snow : rock;
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  fujiGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
}
const fuji = new THREE.Mesh(fujiGeo, new THREE.MeshStandardMaterial({
  vertexColors: true, flatShading: true, roughness: 1
}));
fuji.position.set(1.5, 1.6, -16);
fuji.scale.setScalar(1.25);
scene.add(fuji);

// ---- Boats: pointed-ochre hulls with rows of rowers ----
function makeBoat(len) {
  const g = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(len / 2, 0);
  s.quadraticCurveTo(0, 0.62, -len / 2, 0);
  s.quadraticCurveTo(0, -0.62, len / 2, 0);
  const hull = new THREE.ExtrudeGeometry(s, { depth: 0.5, bevelEnabled: false, steps: 1 });
  hull.rotateX(-Math.PI / 2);
  const hp = hull.attributes.position;
  for (let i = 0; i < hp.count; i++) {           // taper the bottom
    if (hp.getY(i) < 0.25) { hp.setX(i, hp.getX(i) * 0.72); hp.setZ(i, hp.getZ(i) * 0.55); }
  }
  g.add(new THREE.Mesh(hull, new THREE.MeshStandardMaterial({ color: P.boat, flatShading: true, roughness: 0.9 })));
  const rGeo = new THREE.SphereGeometry(0.16, 5, 4);
  const rMat = new THREE.MeshStandardMaterial({ color: P.rower, flatShading: true });
  for (let i = 0; i < 6; i++) {
    const r = new THREE.Mesh(rGeo, rMat);
    r.position.set(-len / 2 + 0.7 + i * (len - 1.4) / 5, 0.62, 0);
    g.add(r);
  }
  return g;
}
const boats = [
  { g: makeBoat(5.2), x: -11.8, z: 8.5, yaw: -0.55, tilt: 0.35 },   // left, in the great wave trough
  { g: makeBoat(5.6), x: 7.6, z: -2.5, yaw: 0.95, tilt: 0.4 },     // right, climbing the right swell
  { g: makeBoat(6.2), x: 0.8, z: 5.5, yaw: -0.4, tilt: -0.12 }     // foreground
];
boats.forEach(b => b.g.scale.setScalar(1.35));
boats.forEach(b => scene.add(b.g));
function updateBoats(t) {
  for (const b of boats) {
    const y = seaH(b.x, b.z, t) - 0.14;
    const e = 0.9;
    const dhx = seaH(b.x + e, b.z, t) - seaH(b.x - e, b.z, t);
    const dhz = seaH(b.x, b.z + e, t) - seaH(b.x, b.z - e, t);
    b.g.position.set(b.x, y + 0.06 * Math.sin(t * 1.3 + b.x), b.z);
    b.g.rotation.set(0, b.yaw, 0);
    b.g.rotateZ(b.tilt + 0.05 * Math.sin(t + b.z));
    b.g.rotateX(Math.atan2(dhz, 2 * e) * 0.7);
    b.g.rotateY(-Math.atan2(dhx, 2 * e) * 0.7);
  }
}

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime() * 0.55;        // gentle motion
  updateSea(t);
  updateFoam(t);
  updateBoats(t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
updateSea(0);
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
