let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const button=document.querySelector('#motion');function label(){button.textContent=paused?'PLAY':'PAUSE';button.setAttribute('aria-label',paused?'Play animation':'Pause animation')}label();button.onclick=()=>{paused=!paused;label()};let elapsed=0,last=0;function resize(){const aspect=innerWidth/innerHeight,target=1280/860;if(aspect>target){const w=860*aspect;camera.left=(1280-w)/2;camera.right=(1280+w)/2;camera.top=860;camera.bottom=0}else{const h=1280/aspect;camera.left=0;camera.right=1280;camera.top=430+h/2;camera.bottom=430-h/2}camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
