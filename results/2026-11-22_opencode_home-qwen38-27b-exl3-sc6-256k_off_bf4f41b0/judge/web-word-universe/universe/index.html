<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo de Palavras | Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b16; --panel:#161327; --ink:#f3efe7; --muted:#9a92b5;
  --line:#2a2542; --accent:#e9c46a; --accent2:#f4a261; --node:#8ecae6; --edge:rgba(150,140,200,.35);
  --hl:#ffd166;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 800px at 70% -10%,#1d1838 0%,var(--bg) 60%);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
#scene canvas{display:block}
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;
  padding:14px 18px;pointer-events:none;z-index:5}
.brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;letter-spacing:.3px;
  color:var(--ink);text-shadow:0 1px 12px rgba(0,0,0,.5)}
.brand small{display:block;font-family:'Inter';font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.4px}
.search{margin-left:auto;pointer-events:auto;position:relative}
.search input{width:min(340px,42vw);padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);
  background:rgba(22,19,39,.8);backdrop-filter:blur(8px);color:var(--ink);font-size:14px;outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6}
.stats{position:fixed;left:18px;bottom:16px;z-index:5;pointer-events:none;font-size:12px;color:var(--muted);
  background:rgba(22,19,39,.55);backdrop-filter:blur(6px);padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.stats b{color:var(--ink);font-weight:600}
.hint{position:fixed;right:18px;bottom:16px;z-index:5;font-size:11px;color:var(--muted);pointer-events:none;opacity:.7}
/* side panel */
.panel{position:fixed;top:0;right:0;height:100%;width:min(380px,90vw);background:var(--panel);
  border-left:1px solid var(--line);z-index:6;transform:translateX(100%);transition:transform .3s ease;
  overflow-y:auto;padding:22px}
.panel.open{transform:none}
.panel .close{position:absolute;top:14px;right:14px;border:1px solid var(--line);background:transparent;color:var(--muted);
  width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;line-height:1}
.panel .close:hover{color:var(--ink);border-color:var(--muted)}
.pword{font-family:'Fraunces',serif;font-size:38px;font-weight:700;margin:6px 0 2px;color:var(--hl)}
.ptema{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.pdeg{font-size:13px;color:var(--muted);margin-bottom:18px}
.pdeg b{color:var(--ink)}
.sec{margin-top:16px}
.sec h3{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  font-size:13px;cursor:pointer;color:var(--ink);transition:.15s}
.tag:hover{border-color:var(--accent);background:rgba(233,196,106,.12);transform:translateY(-1px)}
.tag.syn{border-color:rgba(142,202,230,.4)}
.tag.ana{border-color:rgba(244,162,97,.4)}
.pempty{color:var(--muted);font-size:14px;line-height:1.6}
.loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);
  z-index:20;color:var(--muted);font-size:14px;transition:opacity .4s}
.loader.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="scene"></div>
<div class="top">
  <div class="brand">Universo de Palavras<small>Dicionário Criativo · 250 palavras · 630 relações</small></div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="text" placeholder="Buscar palavra… (ex: saudade)" autocomplete="off">
  </div>
</div>
<div class="stats" id="stats"></div>
<div class="hint">clicar num nó mostra relações · arraste para girar · role para zoom</div>
<aside class="panel" id="panel"></aside>
<div class="loader" id="loader">Carregando universo…</div>

const TEMAS = {"flor":"natureza","nora":"família","folha":"natureza","pastor":"ofícios","tristeza":"sentimentos","areia":"natureza","prima":"família","ansiedade":"sentimentos","rio":"natureza","médico":"ofícios","neta":"família","açúcar":"comida","instante":"tempo","aldeia":"lugares","mandioca":"comida","corpo":"corpo","sotaque":"linguagem","idioma":"linguagem","unha":"corpo","pele":"corpo","angústia":"sentimentos","romance":"artes","peito":"corpo","crepúsculo":"tempo","estado":"lugares","vale":"natureza","mercado":"lugares","milho":"comida","dedo":"corpo","mel":"comida","sapateiro":"ofícios","genro":"família","cidade":"lugares","coração":"corpo","cena":"artes","cozinha":"lugares","sílaba":"linguagem","patrão":"ofícios","pescador":"ofícios","praia":"natureza","aflição":"sentimentos","violão":"artes","estômago":"corpo","sangue":"corpo","letra":"linguagem","raiz":"natureza","tio":"família","avenida":"lugares","emprego":"ofícios","pais":"família","fotografia":"artes","rua":"lugares","minuto":"tempo","carpinteiro":"ofícios","operário":"ofícios","filha":"família","cachoeira":"natureza","queijo":"comida","açougueiro":"ofícios","sobrinho":"família","dança":"artes","trigo":"comida","aurora":"tempo","pai":"família","enfermeira":"ofícios","vinho":"comida","poesia":"artes","porto":"lugares","nostalgia":"sentimentos","arroz":"comida","conto":"artes","passado":"tempo","esquina":"lugares","campo":"natureza","peixe":"comida","rima":"artes","amor":"sentimentos","melodia":"artes","advogado":"ofícios","cabeça":"corpo","chá":"comida","refeição":"comida","ombro":"corpo","soldado":"ofícios","ritmo":"artes","alegria":"sentimentos","época":"tempo","semana":"tempo","lar":"lugares","marinheiro":"ofícios","semente":"natureza","avô":"família","sussurro":"linguagem","carinho":"sentimentos","país":"lugares","fruto":"natureza","dia":"tempo","juiz":"ofícios","significado":"linguagem","mão":"corpo","esperança":"sentimentos","manteiga":"comida","pétala":"natureza","padrinho":"família","mágoa":"sentimentos","música":"artes","farinha":"comida","serra":"natureza","neto":"família","onda":"natureza","momento":"tempo","braço":"corpo","fala":"linguagem","ofício":"ofícios","irmã":"família","ano":"tempo","alma":"corpo","vila":"lugares","amanhã":"tempo","teatro":"artes","salário":"ofícios","avó":"família","feijão":"comida","engenheiro":"ofícios","susto":"sentimentos","resposta":"linguagem","família":"família","piano":"artes","joelho":"corpo","herança":"família","pintura":"artes","escola":"lugares","trabalho":"ofícios","segundo":"tempo","conversa":"linguagem","ator":"artes","parentesco":"família","olho":"corpo","hoje":"tempo","pão":"comida","dicionário":"linguagem","quarto":"lugares","escultura":"artes","pulmão":"corpo","sal":"comida","hora":"tempo","verso":"artes","jantar":"comida","primo":"família","prado":"natureza","pergunta":"linguagem","manhã":"tempo","dente":"corpo","nação":"lugares","ternura":"sentimentos","canção":"artes","almoço":"comida","ferreiro":"ofícios","lavrador":"ofícios","pedreiro":"ofícios","cunhado":"família","fígado":"corpo","ponte":"lugares","acento":"linguagem","padeiro":"ofícios","lago":"natureza","pimenta":"comida","jardim":"natureza","sentido":"linguagem","história":"linguagem","desenho":"artes","mar":"natureza","montanha":"natureza","mata":"natureza","tempo":"tempo","paixão":"sentimentos","pé":"corpo","saudade":"sentimentos","frase":"linguagem","afeto":"sentimentos","palavra":"linguagem","rosto":"corpo","felicidade":"sentimentos","praça":"lugares","filho":"família","ovo":"comida","floresta":"natureza","casa":"lugares","profissão":"ofícios","natureza":"natureza","livro":"artes","ontem":"tempo","sinônimo":"linguagem","prazer":"sentimentos","compaixão":"sentimentos","grito":"linguagem","era":"tempo","comida":"comida","pátria":"lugares","contentamento":"sentimentos","janela":"lugares","alfaiate":"ofícios","dor":"sentimentos","memória":"linguagem","riacho":"natureza","água":"comida","tambor":"artes","gíria":"linguagem","pavor":"sentimentos","sogra":"família","pescoço":"corpo","leite":"comida","madrugada":"tempo","mãe":"família","porta":"lugares","arte":"artes","apelido":"linguagem","tela":"artes","professor":"ofícios","noite":"tempo","irmão":"família","selva":"natureza","língua":"corpo","surpresa":"sentimentos","árvore":"natureza","tarde":"tempo","café":"comida","boca":"corpo","espanto":"sentimentos","linguagem":"linguagem","cinema":"artes","osso":"corpo","eternidade":"tempo","perna":"corpo","carne":"comida","medo":"sentimentos","tia":"família","samba":"artes","mês":"tempo","estação":"lugares","voz":"linguagem","madrinha":"família","bairro":"lugares","melancolia":"sentimentos","capital":"lugares","nome":"linguagem","igreja":"lugares","silêncio":"linguagem","século":"tempo","futuro":"tempo"};           // { word: tema }

const keys = Object.keys(WORDS);
const idx = {}; keys.forEach((k,i)=>idx[k]=i);
const N = keys.length;

// edges (undirected, each once)
const edges = [];
for (const a of keys) for (const b of WORDS[a]) if (idx[b]!==undefined && a<b) edges.push([idx[a],idx[b]]);

// ---- 3D layout: place words in a fibonacci sphere, degree -> radius weight ----
const deg = keys.map(k=>WORDS[k].length);
const maxDeg = Math.max(...deg);
const positions = new Float32Array(N*3);
function fib(i, n, r){
  const y = 1 - (i/(n-1))*2;
  const rad = Math.sqrt(1-y*y);
  const theta = i * 2.399963229728653; // golden angle
  return [Math.cos(theta)*rad*r, y*r, Math.sin(theta)*rad*r];
}
for (let i=0;i<N;i++){
  const w = 0.6 + 1.4*(deg[i]/maxDeg);
  const r = 34 * w;
  const [x,y,z] = fib(i,N,r);
  positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
}

// ---- three.js scene ----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0b16, 0.0055);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0,0,150);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.getElementById('scene').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8888aa, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(40,60,80); scene.add(dl);

// nodes as points with size by degree
const nodeGeo = new THREE.BufferGeometry();
nodeGeo.setAttribute('position', new THREE.BufferAttribute(positions,3));
const sizes = new Float32Array(N);
const idxAttr = new Float32Array(N);
for(let i=0;i<N;i++){ sizes[i] = 1.2 + 2.6*(deg[i]/maxDeg); idxAttr[i]=i; }
nodeGeo.setAttribute('size', new THREE.BufferAttribute(sizes,1));
nodeGeo.setAttribute('i', new THREE.BufferAttribute(idxAttr,1));
const nodeMat = new THREE.ShaderMaterial({
  uniforms:{ uColor:{value:new THREE.Color(0x8ecae6)}, uHl:{value:new THREE.Color(0xffd166)}, uIdx:{value:-1} },
  vertexShader:`attribute float size; attribute float i; varying float vI;
    void main(){ vI=i;
      vec4 mv = modelViewMatrix*vec4(position,1.0);
      gl_PointSize = size * (300.0 / -mv.z);
      gl_Position = projectionMatrix*mv; }`,
  fragmentShader:`varying float vI; uniform vec3 uColor,uHl; uniform float uIdx;
    void main(){ float d=length(gl_PointCoord-0.5); if(d>0.5) discard;
      vec3 c = (uIdx>=0.0 && abs(vI-uIdx)<0.5)? uHl : uColor;
      float a = smoothstep(0.5,0.15,d);
      gl_FragColor=vec4(c,a); }`
});
const points = new THREE.Points(nodeGeo, nodeMat); scene.add(points);

// edges as line segments
const edgePos = new Float32Array(edges.length*6);
edges.forEach((e,i)=>{ for(let k=0;k<3;k++) edgePos[i*6+k]=positions[e[0]*3+k], edgePos[i*6+3+k]=positions[e[1]*3+k]; });
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgePos,3));
const edgeMat = new THREE.LineBasicMaterial({color:0x6a628c, transparent:true, opacity:0.28});
scene.add(new THREE.LineSegments(edgeGeo, edgeMat));

// ---- interaction: orbit (manual) + raycast ----
let dragging=false, px=0, py=0, rotX=0, rotY=0, zoom=150;
const cv = renderer.domElement;
cv.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{ if(!dragging)return; rotY+=(e.clientX-px)*0.004; rotX+=(e.clientY-py)*0.004; px=e.clientX; py=e.clientY; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); zoom = Math.max(40,Math.min(400, zoom + e.deltaY*0.3)); }, {passive:false});

const ray = new THREE.Raycaster(); ray.params.Points.threshold=2.5;
function pick(e){
  const rect=cv.getBoundingClientRect();
  const x=((e.clientX-rect.left)/rect.width)*2-1, y=-((e.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera({x,y}, camera);
  // rotate world group to match our manual rotation
  const hits = ray.intersectObject(points);
  if(hits.length){ let best=-1,bd=1e9; for(const h of hits){ if(h.distance<bd){bd=h.distance;best=h.index;} } return best; }
  return -1;
}
cv.addEventListener('click',e=>{ if(Math.abs(e.movementX)+Math.abs(e.movementY)>6)return; const i=pick(e); if(i>=0) selectWord(keys[i],true); });

// ---- panel + selection ----
const panel=document.getElementById('panel');
let selected=null;
function setHighlight(word){
  const i=word?idx[word]:-1;
  nodeMat.uniforms.uIdx.value=i;
  edgeMat.opacity = word?0.55:0.28;
}
function selectWord(word, open){
  if(!word||!WORDS[word])return;
  selected=word;
  setHighlight(word);
  const disp=DISPLAY[word]||word, tema=TEMAS[word]||'';
  const syn=[],ana=[];
  // reconstruct: link is union of syn+ana; we stored only union, so label all as "relacionadas"
  const rel=WORDS[word];
  let html=`<button class="close" onclick="window.__close()">×</button>
    <div class="pword">${disp}</div>
    ${tema?`<div class="ptema">${tema}</div>`:''}
    <div class="pdeg"><b>${rel.length}</b> palavras relacionadas</div>
    <div class="sec"><h3>Relações</h3><div class="tags">`+
    rel.map(r=>`<span class="tag" data-w="${r}">${DISPLAY[r]||r}</span>`).join('')+
    `</div></div>`;
  panel.innerHTML=html;
  panel.querySelectorAll('.tag').forEach(t=>t.onclick=()=>selectWord(t.dataset.w,true));
  if(open!==false) panel.classList.add('open');
}
window.__close=()=>{ panel.classList.remove('open'); selected=null; setHighlight(null); history.replaceState(null,'',location.pathname); };
function show(){panel.classList.add('open');}

// ---- stats ----
document.getElementById('stats').innerHTML =
  `Palavras <b>${N}</b> · Relações <b>${edges.length}</b> · Mais conectada <b>${DISPLAY[keys[deg.indexOf(maxDeg)]]}</b>`;

// ---- search ----
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){ return; }
  // exact match first, else prefix
  let hit = WORDS[v]? v : keys.find(k=>k.startsWith(v));
  if(hit) selectWord(hit,true);
});
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=q.value.trim().toLowerCase(); let hit=WORDS[v]?v:keys.find(k=>k.startsWith(v)); if(hit){selectWord(hit,true); q.blur();} } });

// ---- URL ?word= ----
const urlWord = new URLSearchParams(location.search).get('word');
if(urlWord){ const hit=WORDS[urlWord.toLowerCase()]?urlWord.toLowerCase():keys.find(k=>k.startsWith(urlWord.toLowerCase())); if(hit){ q.value=hit; selectWord(hit,true);} }

// ---- animate ----
let linesObj=null;
function frame(){
  requestAnimationFrame(frame);
  points.rotation.y = rotY; points.rotation.x = rotX;
  if(!linesObj) linesObj = scene.children.find(c=>c.isLineSegments);
  if(linesObj){ linesObj.rotation.y=rotY; linesObj.rotation.x=rotX; }
  camera.position.z += (zoom - camera.position.z)*0.12;
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
frame();
document.getElementById('loader').classList.add('hide');
window.__dbg = { N, cameraZ:()=>camera.position.z, points:()=>points, renderer };
</script>
