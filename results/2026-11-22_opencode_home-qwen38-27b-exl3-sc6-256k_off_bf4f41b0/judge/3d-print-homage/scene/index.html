<body>
<div id="cap">富嶽三十六景　神奈川沖浪裏<small>Great Wave off Kanagawa · K. Hokusai (public domain)</small></div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';

/* ---- Palette sampled from the print ---- */
const C = {
  sky:   0xE9D8A6,
  sky2:  0xC9C29B,
  deep:  0x123A5C,
  blue:  0x24567E,
  blue2: 0x3D739B,
  foam:  0xF4F1E4,
  hull:  0xC98A4B,
  hull2: 0x9A5F2F,
  roof:  0x6E4A26,
  snow:  0xF7F5EC,
  rock:  0x3A5A77,
  ink:   0x10222F,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.sky);
scene.fog = new THREE.Fog(C.sky2, 120, 200);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 300);
camera.position.set(0, 8, 44);
camera.lookAt(0, 7, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xF5EBC8, 0x16324F, 1.1));
const key = new THREE.DirectionalLight(0xFFF4D8, .5);
key.position.set(-20, 30, 25);
scene.add(key);

const groups = []; // {obj, baseY, phase, bobAmp, bobSpeed, tiltAmp, tiltSpeed}

/* ---------- Mt Fuji: small snow-capped cone, center-right horizon, like the print ---------- */
{
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(9, 8, 20),
    new THREE.MeshLambertMaterial({color:C.rock, flatShading:true}));
  body.position.y = 4;
  g.add(body);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(4, 3, 20),
    new THREE.MeshLambertMaterial({color:C.snow, flatShading:true}));
  cap.position.y = 7;
  g.add(cap);
  g.position.set(10, 0, -85);
  scene.add(g);
}

/* ---------- Sea: low-poly displaced plane, static crests (wave shape is in the swells) ---------- */
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(220, 220, 16, 16),
  new THREE.MeshLambertMaterial({color:C.blue2, flatShading:true}));
sea.rotation.x = -Math.PI/2;
sea.position.y = .4;
scene.add(sea);
{
  const p = sea.geometry.attributes.position;
  for(let i=0;i<p.count;i++){
    const x = p.getX(i), z = p.getZ(i);
    // gentle rolling swells toward the viewer
    p.setZ(i, Math.sin(x*.22)*.6 + Math.cos(z*.3)*.5 + Math.random()*.3);
  }
  sea.geometry.computeVertexNormals();
}

/* ---------- The great wave: one solid curl, left of frame, as in the print ---------- */
function greatWave(){
  const g = new THREE.Group();
  const matD = new THREE.MeshLambertMaterial({color:C.deep, flatShading:true, side:THREE.DoubleSide});
  const matB = new THREE.MeshLambertMaterial({color:C.blue, flatShading:true, side:THREE.DoubleSide});
  // rising back (a tall, leaning slab that curves into the crest)
  const back = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 11, 15, 9, 1, true), matB);
  back.position.set(-11, 5.5, 0);
  back.rotation.z = .5;
  g.add(back);
  // curling lip: half-torus over the crest, thick, dark
  const lip = new THREE.Mesh(new THREE.TorusGeometry(7, 2.8, 7, 12, Math.PI*1.35), matD);
  lip.position.set(-6, 10, 0);
  lip.rotation.z = Math.PI*0.82;
  g.add(lip);
  // inner face of the curl (lighter)
  const inner = new THREE.Mesh(new THREE.TorusGeometry(7, 1.6, 6, 12, Math.PI*1.2), 
    new THREE.MeshLambertMaterial({color:C.blue, flatShading:true}));
  inner.position.set(-6, 10, .1);
  inner.rotation.z = Math.PI*0.9;
  g.add(inner);
  // white foam edge tracing the lip
  const edge = new THREE.Mesh(new THREE.TorusGeometry(7.9, .8, 5, 14, Math.PI*1.3),
    new THREE.MeshLambertMaterial({color:C.foam, flatShading:true}));
  edge.position.set(-6, 10, .2);
  edge.rotation.z = Math.PI*0.85;
  g.add(edge);
  // claw curls: white foam hooks along the lip
  const clawMat = new THREE.MeshLambertMaterial({color:C.foam, flatShading:true});
  for(let i=0;i<6;i++){
    const a = Math.PI*0.85 + i*0.38;
    const claw = new THREE.Mesh(new THREE.TorusGeometry(1.0, .34, 5, 7, Math.PI*1.35), clawMat);
    claw.position.set(-6 + Math.cos(a)*7.9, 10 + Math.sin(a)*7.9, (i%2? 1.0 : -1.0));
    claw.rotation.z = -a + Math.PI*.2;
    g.add(claw);
  }
  // foam speckles on the wave face
  const dotGeo = new THREE.SphereGeometry(.5, 5, 4);
  const dotMat = new THREE.MeshLambertMaterial({color:C.foam});
  for(let i=0;i<24;i++){
    const d = new THREE.Mesh(dotGeo, dotMat);
    const a = Math.random()*Math.PI*.6;
    d.position.set(-13 + Math.cos(a)*(3+Math.random()*6), 2+Math.random()*9, (Math.random()-.5)*2.5);
    d.scale.setScalar(.45+Math.random()*.8);
    g.add(d);
  }
  // white foam at the base of the wave (wave breaks onto the swell)
  const base = new THREE.Mesh(new THREE.TorusGeometry(8.5, 1.5, 5, 12, Math.PI*.9),
    new THREE.MeshLambertMaterial({color:C.foam, flatShading:true}));
  base.position.set(-9, 1.5, 0);
  base.rotation.set(0, 0, Math.PI*.08);
  g.add(base);
  return g;
}
const gw = greatWave();
scene.add(gw);
groups.push({obj:gw, baseY:0, phase:0, bobAmp:.4, bobSpeed:.35, tiltAmp:.015, tiltSpeed:.25});

/* ---------- Foreground swells: blue cones with white crests ---------- */
function swell(x, z, s, tilt){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(6*s, 4.5*s, 7),
    new THREE.MeshLambertMaterial({color:C.blue, flatShading:true}));
  body.position.y = 2.2*s;
  g.add(body);
  const crest = new THREE.Mesh(new THREE.TorusGeometry(3.4*s, 1.0*s, 5, 10, Math.PI*1.25),
    new THREE.MeshLambertMaterial({color:C.foam, flatShading:true}));
  crest.position.y = 4.2*s;
  crest.rotation.z = tilt;
  g.add(crest);
  g.position.set(x, 0, z);
  return g;
}
[[ 13, 14, 1.0,  .6], [-16, 16, .8, 2.4], [ 3, 22, .65, 4.0],
 [ 24, 6, .6, 1.2], [-25, 8, .5, 3.3], [ 28, 18, .75, 5.1],
 [-6, 24, .5, 1.9]]
 .forEach(([x,z,s,t])=>{
   const w = swell(x,z,s,t);
   scene.add(w);
   groups.push({obj:w, baseY:0, phase:Math.random()*6.28, bobAmp:.2, bobSpeed:.55, tiltAmp:.03, tiltSpeed:.4});
 });

/* ---------- Sky clouds: flat cream slabs, upper right like the print ---------- */
const cloudMat = new THREE.MeshLambertMaterial({color:0xF2EBD3, transparent:true, opacity:.9});
[[16, 27, -80, 18, 4.5], [34, 32, -90, 14, 3.5], [28, 24, -85, 22, 3], [-8, 30, -88, 16, 3.5]]
 .forEach(([x,y,z,wx,h])=>{
   const c = new THREE.Mesh(new THREE.BoxGeometry(wx, h, 3), cloudMat);
   c.position.set(x,y,z);
   scene.add(c);
   groups.push({obj:c, baseY:y, phase:Math.random()*6.28, bobAmp:.3, bobSpeed:.12, tiltAmp:0, tiltSpeed:0});
 });

/* ---------- Boats: three sampans, exactly as in the print ---------- */
function sampan(scale=1){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(7, 1.0, 2.4),
    new THREE.MeshLambertMaterial({color:C.hull, flatShading:true}));
  g.add(hull);
  for(const s of [-1,1]){
    const bow = new THREE.Mesh(new THREE.BoxGeometry(1.9, .8, 2.2),
      new THREE.MeshLambertMaterial({color:C.hull2, flatShading:true}));
    bow.position.set(s*4.1, .45, 0);
    bow.rotation.z = s*-.55;
    g.add(bow);
  }
  const cab = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.4, 1.9),
    new THREE.MeshLambertMaterial({color:C.hull, flatShading:true}));
  cab.position.y = 1.0;
  g.add(cab);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(3.2, .45, 2.3),
    new THREE.MeshLambertMaterial({color:C.roof, flatShading:true}));
  roof.position.y = 1.95;
  g.add(roof);
  for(let i=0;i<3;i++){
    const b = new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.9,6),
      new THREE.MeshLambertMaterial({color:C.roof, flatShading:true}));
    b.position.set(-2.3 + i*.9, .95, .5);
    g.add(b);
  }
  const crewMat = new THREE.MeshLambertMaterial({color:C.ink, flatShading:true});
  for(let i=0;i<4;i++){
    const f = new THREE.Mesh(new THREE.ConeGeometry(.28,.7,5), crewMat);
    f.position.set(1.1 + i*.62, .85, (i%2? .55:-.55));
    f.rotation.x = (i%2? .45 : -.45);
    g.add(f);
  }
  g.scale.setScalar(scale);
  return g;
}
// large boat, bottom center, riding the trough between the swells (print: center bottom)
const boat1 = sampan(1.15);
boat1.position.set(1, 1.3, 18);
boat1.rotation.y = -.3;
scene.add(boat1);
groups.push({obj:boat1, baseY:1.3, phase:0, bobAmp:.7, bobSpeed:.7, tiltAmp:.14, tiltSpeed:.5});
// mid-right boat, nose down under the swell (print: right side, tilted)
const boat2 = sampan(.8);
boat2.position.set(24, 3.2, -4);
boat2.rotation.set(.55, -1.15, -.12);
scene.add(boat2);
groups.push({obj:boat2, baseY:3.2, phase:2.1, bobAmp:.6, bobSpeed:.8, tiltAmp:.18, tiltSpeed:.55});
// mid-left boat, tucked under the great wave (print: left, half hidden)
const boat3 = sampan(.7);
boat3.position.set(-14, 2.3, 4);
boat3.rotation.set(-.5, .85, .12);
scene.add(boat3);
groups.push({obj:boat3, baseY:2.3, phase:4.2, bobAmp:.5, bobSpeed:.75, tiltAmp:.16, tiltSpeed:.45});

/* ---------- Gentle motion: bob + tilt around base, slow camera drift ---------- */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  for(const o of groups){
    o.obj.position.y = (o.baseY ?? o.obj.position.y) + Math.sin(t*o.bobSpeed + o.phase) * o.bobAmp;
    o.obj.rotation.z += Math.sin(t*o.tiltSpeed + o.phase) * o.tiltAmp * .015;
  }
  camera.position.x = Math.sin(t*.12)*1.5;
  camera.lookAt(0, 7, 0);
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
