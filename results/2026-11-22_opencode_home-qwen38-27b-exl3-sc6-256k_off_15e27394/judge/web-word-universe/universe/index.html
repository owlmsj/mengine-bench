<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e1a; --ink:#eef1ff; --dim:#8b93b5; --acc:#ffb4a2; --acc2:#a7c7ff;
  --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Space Grotesk',system-ui,sans-serif}
#scene{position:fixed;inset:0}
#scene canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#top{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;gap:14px;align-items:center;
  pointer-events:none}
#brand{font-family:'Fraunces',serif;font-weight:700;font-size:20px;letter-spacing:.5px;
  color:var(--ink);text-shadow:0 2px 20px rgba(0,0,0,.6)}
#brand small{display:block;font-family:'Space Grotesk';font-weight:400;font-size:11px;color:var(--dim);letter-spacing:.2px}
#search{pointer-events:auto;flex:1;max-width:520px;margin-left:auto}
#q{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:11px 18px;font:500 15px 'Space Grotesk';outline:none;backdrop-filter:blur(8px);
  transition:border-color .2s, box-shadow .2s}
#q::placeholder{color:var(--dim)}
#q:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(167,199,255,.18)}
#drop{position:absolute;top:64px;left:auto;right:22px;width:520px;max-height:60vh;overflow:auto;
  background:#11142a;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.55);
  backdrop-filter:blur(14px);display:none}
#drop div{padding:11px 18px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:10px}
#drop div:hover,#drop div.on{background:rgba(255,255,255,.07)}
#drop .d{color:var(--dim);font-size:12px}
#panel{position:absolute;top:76px;right:22px;width:340px;max-height:calc(100% - 110px);overflow:auto;
  background:#101326cc;border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(14px);
  padding:18px 18px 16px;box-shadow:0 18px 60px rgba(0,0,0,.5);pointer-events:auto}
#panel h1{font-family:'Fraunces',serif;font-weight:700;font-size:30px;margin:0 0 2px}
#panel .sub{color:var(--dim);font-size:12px;margin:0 0 12px}
#panel .chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--acc2);transform:translateY(-1px)}
.chip.here{background:var(--acc);color:#2a1206;border-color:var(--acc);font-weight:600}
#deg{font-size:13px;color:var(--dim);margin:6px 0 14px}
#deg b{color:var(--ink);font-size:16px;font-family:'Fraunces'}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 7px;
  font-weight:600}
#hint{position:absolute;bottom:18px;left:22px;color:var(--dim);font-size:12px;
  background:rgba(11,14,26,.55);padding:6px 12px;border-radius:10px;backdrop-filter:blur(6px)}
#stats{position:absolute;bottom:18px;right:22px;color:var(--dim);font-size:12px;
  background:rgba(11,14,26,.55);padding:6px 12px;border-radius:10px;backdrop-filter:blur(6px)}
#stats b{color:var(--ink)}
@media (max-width:720px){#panel{width:calc(100% - 44px)}#drop{width:calc(100% - 44px);right:22px}}
</style></head>
<body>
<div id="scene"></div>
<div id="hud">
  <div id="top">
    <div id="brand">Universo de Palavras<small>Dicionário Criativo</small></div>
    <div id="search"><input id="q" placeholder="Busque uma palavra…" autocomplete="off" spellcheck="false">
      <div id="drop"></div></div>
  </div>
  <aside id="panel" style="display:none">
    <h1 id="pw"></h1>
    <p class="sub" id="psub"></p>
    <div id="deg"></div>
    <div class="sec">Relacionadas</div>
    <div class="chips" id="chips"></div>
  </aside>
  <div id="hint">Clique numa palavra · arraste para girar · role para zoom</div>
  <div id="stats"></div>
</div>

const DEGS = {"lingua":6,"boca":7,"dente":7,"osso":6,"tarde":5,"avo":11,"coracoes":6,"irma":6,"pais":14,"semana":5,"resposta":4,"historia":7,"letra":6,"pergunta":5,"prazer":6,"acento":7,"aurora":5,"contentamento":4,"paixoes":4,"ternura":7,"pescador":9,"acougueiro":6,"amanha":6,"lavrador":8,"pedreiro":7,"verso":8,"mes":6,"ano":5,"era":5,"ferreiro":6,"momento":5,"sinonimo":5,"esquina":5,"cozinha":7,"escola":4,"ponte":7,"praca":8,"melancolia":7,"carinho":8,"magoa":5,"medico":7,"nostalgia":6,"tristeza":5,"cabeca":5,"corpo":4,"enfermeira":6,"mao":6,"rosto":6,"saudade":5,"ansiedade":7,"dor":5,"esperanca":8,"feijao":6,"arroz":6,"avenida":5,"mandioca":7,"milho":7,"palavra":16,"vinho":5,"rio":4,"praia":5,"riacho":6,"vale":6,"advogado":10,"cachoeira":7,"eternidade":7,"fala":4,"hora":5,"juiz":6,"professor":8,"alma":9,"conto":8,"dedo":5,"idioma":7,"memoria":4,"montanha":6,"ovo":5,"patrao":7,"pintura":6,"tia":9,"pele":5,"figado":5,"leite":6,"pulmao":10,"cinema":4,"escultura":7,"fotografia":6,"tela":6,"tio":6,"folha":7,"heranca":9,"neta":7,"tempo":16,"compaixao":8,"emprego":7,"espanto":4,"saudades":4,"lar":6,"patria":6,"lago":4,"mar":7,"natureza":6,"teatro":8,"cena":7,"danca":6,"pai":6,"ritmo":5,"romance":8,"sangue":4,"perna":3,"pescoco":7,"sentido":6,"dia":5,"futuro":6,"campo":6,"manteiga":7,"refeicao":6,"trigo":5,"amor":7,"frase":8,"hoje":5,"livro":5,"acucar":5,"mel":6,"pimenta":7,"unha":7,"filho":5,"carne":8,"filha":7,"genro":5,"pavor":7,"aflicao":6,"medo":6,"ontem":3,"susto":8,"porto":5,"estacao":6,"vila":6,"areia":5,"floresta":5,"raiz":5,"prado":6,"onda":7,"piano":7,"grito":6,"conversa":4,"silencio":4,"sobrinho":7,"sussurro":5,"irmao":7,"capital":9,"cidade":6,"mercado":6,"porta":5,"quarto":4,"afeto":4,"angustia":6,"voz":8,"felicidade":6,"alegria":4,"arvore":6,"mata":5,"selva":5,"serra":5,"cunhado":4,"prima":5,"primo":6,"sotaque":7,"epoca":6,"seculo":4,"estomago":4,"farinha":6,"pao":4,"ombro":4,"agua":7,"braco":5,"ator":4,"cancao":7,"poesia":6,"cafe":5,"instante":6,"noite":5,"operario":7,"igreja":7,"passado":4,"profissao":8,"soldado":4,"manha":5,"carpinteiro":5,"pastor":5,"sapateiro":4,"segundo":4,"fruto":5,"janela":7,"nacao":7,"significado":4,"trabalho":6,"jardim":7,"semente":6,"giria":6,"joelho":6,"madrugada":9,"peixe":6,"petala":6,"cha":6,"nome":5,"apelido":6,"olho":5,"queijo":6,"surpresa":4,"bairro":5,"aldeia":4,"rua":7,"almoco":9,"nora":8,"salario":4,"violao":8,"silaba":8,"alfaiate":8,"engenheiro":6,"oficio":6,"padeiro":5,"madrinha":5,"sogra":5,"casa":6,"estado":6,"sal":3,"crepusculo":8,"melodia":5,"linguagem":5,"neto":6,"pe":5,"parentesco":4,"familia":4,"arte":6,"musica":7,"samba":6,"dicionario":4,"jantar":6,"minuto":6,"tambor":5,"desenho":5,"flor":5,"marinheiro":6,"rima":7,"paixao":5,"comida":5,"padrinho":4,"coracao":7,"peito":5,"mae":5};
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
const $ = (s)=>document.querySelector(s);
let THREE, ready=false;
import(THREE_URL).then(T=>{THREE=T; ready=true; start();}).catch(e=>fallback(e));

// deterministic layout: force-directed in 3D, seeded
const nodes = Object.keys(WORDS);
const idx = {}; nodes.forEach((n,i)=>idx[n]=i);
const N = nodes.length;
const pos = new Float32Array(N*3);
const vel = new Float32Array(N*3);
// seed
let s=42; const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
for(let i=0;i<N;i++){ pos[i*3]=(rnd()-.5)*40; pos[i*3+1]=(rnd()-.5)*40; pos[i*3+2]=(rnd()-.5)*40; }
const edges=[];
for(const [a,arr] of Object.entries(WORDS)){ for(const b of arr){ if(a===b||!idx[b])continue; edges.push([idx[a],idx[b]]); } }

function simulate(){
  for(let iter=0;iter<160;iter++){
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      const dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      let d2=dx*dx+dy*dy+dz*dz+0.01; let f=0.06/d2;
      vel[i*3]+=dx*f; vel[i*3+1]+=dy*f; vel[i*3+2]+=dz*f;
      vel[j*3]-=dx*f; vel[j*3+1]-=dy*f; vel[j*3+2]-=dz*f;
    }
    for(const [a,b] of edges){
      const dx=pos[a*3]-pos[b*3], dy=pos[a*3+1]-pos[b*3+1], dz=pos[a*3+2]-pos[b*3+2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01; const f=(d-4)*0.02;
      vel[a*3]-=dx/d*f; vel[a*3+1]-=dy/d*f; vel[a*3+2]-=dz/d*f;
      vel[b*3]+=dx/d*f; vel[b*3+1]+=dy/d*f; vel[b*3+2]+=dz/d*f;
    }
    for(let i=0;i<N;i++){
      vel[i*3]-=pos[i*3]*0.008; vel[i*3+1]-=pos[i*3+1]*0.008; vel[i*3+2]-=pos[i*3+2]*0.008;
      vel[i*3]*=0.85; vel[i*3+1]*=0.85; vel[i*3+2]*=0.85;
      pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
    }
  }
}
simulate();

function start(){
  const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x0b0e1a,0.011);
  const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,500);
  camera.position.set(0,0,60);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.getElementById('scene').appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dl=new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(20,30,20); scene.add(dl);

  // nodes
  const maxDeg=Math.max(...Object.values(DEGS),1);
  const geo=new THREE.SphereGeometry(1,16,16);
  const group=new THREE.Group();
  const meshes=[];
  nodes.forEach((n,i)=>{
    const d=DEGS[n]||0; const r=0.5+2.4*(d/maxDeg);
    const mat=new THREE.MeshStandardMaterial({color:0x9db4ff,emissive:0x000000,roughness:.5,metalness:.15,transparent:true,opacity:.9});
    const m=new THREE.Mesh(geo,mat); m.scale.setScalar(r);
    m.position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
    m.userData={name:n,base:0x9db4ff,r}; group.add(m); meshes.push(m);
  });
  scene.add(group);

  // links
  const seenPair=new Set(); const linkSegs=[];
  for(const [a,b] of edges){ const k=a<b?a+'_'+b:b+'_'+a; if(seenPair.has(k))continue; seenPair.add(k);
    linkSegs.push([pos[a*3],pos[a*3+1],pos[a*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]]); }
  const lgeo=new THREE.BufferGeometry();
  const lpos=new Float32Array(linkSegs.length*6);
  linkSegs.forEach((s,i)=>{ for(let k=0;k<6;k++) lpos[i*6+k]=s[k]; });
  lgeo.setAttribute('position',new THREE.BufferAttribute(lpos,3));
  const lmat=new THREE.LineBasicMaterial({color:0x3a4a8a,transparent:true,opacity:.35});
  const lines=new THREE.LineSegments(lgeo,lmat); scene.add(lines);

  // labels for top words
  const labelGroup=new THREE.Group(); scene.add(labelGroup);
  const top=nodes.slice().sort((a,b)=>(DEGS[b]||0)-(DEGS[a]||0)).slice(0,18);
  const labelMeshes=new Map();
  for(const n of top){
    const c=document.createElement('canvas'); const x=c.getContext('2d');
    c.width=512; c.height=96; x.font='600 48px "Space Grotesk",sans-serif';
    x.textAlign='center'; x.textBaseline='middle'; x.fillStyle='#eef1ff';
    x.shadowColor='rgba(0,0,0,.8)'; x.shadowBlur=8; x.fillText(n,256,48);
    const t=new THREE.CanvasTexture(c);
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,opacity:.9}));
    const i=idx[n]; sp.scale.set(10,2,1); sp.position.set(pos[i*3],pos[i*3+1]+ ( (DEGS[n]||0)/maxDeg*2.4+0.5)+2, pos[i*3+2]);
    labelGroup.add(sp); labelMeshes.set(n,sp);
  }

  // interaction
  const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
  let selected=null, hovered=null;
  const panel=$('#panel');
  function neighbors(n){ return new Set(WORDS[n]||[]); }
  function select(n){
    selected=n;
    const nb=neighbors(n);
    meshes.forEach(m=>{
      const on = m.userData.name===n || nb.has(m.userData.name);
      m.material.color.set(on? 0xffc9b8 : 0x46507f);
      m.material.emissive.set(n===m.userData.name? 0x663311 : 0x000000);
      m.material.opacity = on?1:.28;
    });
    // highlight labels
    labelMeshes.forEach((sp,k)=>{ sp.material.opacity = (k===n||nb.has(k))? .95 : .15; });
    // panel
    $('#pw').textContent=n;
    $('#psub').textContent = 'palavra · ' + (DEGS[n]||0) + ' ligações';
    $('#deg').innerHTML='Conecta-se a <b>'+(DEGS[n]||0)+'</b> palavra(s) neste universo.';
    const chips=$('#chips'); chips.innerHTML='';
    (WORDS[n]||[]).filter(w=>WORDS[w]).sort().forEach(w=>{
      const c=document.createElement('span'); c.className='chip'; c.textContent=w;
      c.onclick=(e)=>{e.stopPropagation(); select(w);}; chips.appendChild(c);
    });
    panel.style.display='block';
    history.replaceState(null,'','?word='+encodeURIComponent(n));
  }
  function clearSel(){
    selected=null; meshes.forEach(m=>{ m.material.color.set(0x9db4ff); m.material.emissive.set(0x000000); m.material.opacity=.9; });
    labelMeshes.forEach(sp=>sp.material.opacity=.9);
    panel.style.display='none';
    if(location.search.length>1) history.replaceState(null,'',location.pathname);
  }
  function pick(ev){
    mouse.x=(ev.clientX/innerWidth)*2-1; mouse.y=-(ev.clientY/innerHeight)*2+1;
    ray.setFromCamera(mouse,camera);
    const hit=ray.intersectObjects(meshes,false)[0];
    return hit? hit.object.userData.name : null;
  }
  renderer.domElement.addEventListener('pointermove',(e)=>{ hovered=pick(e); renderer.domElement.style.cursor=hovered?'pointer':'grab'; });
  renderer.domElement.addEventListener('click',(e)=>{ const n=pick(e); if(n) select(n); else clearSel(); });

  // orbit
  let th=0, ph=0.3, dist=60, dragging=false, lx=0,ly=0;
  renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
  addEventListener('pointerup',()=>dragging=false);
  addEventListener('pointermove',e=>{ if(!dragging)return; th+=(e.clientX-lx)*0.005; ph+=(e.clientY-ly)*0.005; ph=Math.max(-1.4,Math.min(1.4,ph)); lx=e.clientX;ly=e.clientY; });
  addEventListener('wheel',e=>{ dist=Math.max(15,Math.min(160,dist+e.deltaY*0.05)); },{passive:true});

  // stats
  const wordCount=nodes.length;
  const pairSet=new Set(); for(const [a,b] of edges){ const k=a<b?a+'|'+b:b+'|'+a; pairSet.add(k); }
  $('#stats').innerHTML='<b>'+wordCount+'</b> palavras · <b>'+pairSet.size+'</b> relações';

  function frame(){
    if(!dragging) th+=0.0012;
    camera.position.set(dist*Math.sin(th)*Math.cos(ph), dist*Math.sin(ph), dist*Math.cos(th)*Math.cos(ph));
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  frame();
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

  // deep link
  const w=new URLSearchParams(location.search).get('word');
  if(w && WORDS[w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')]) select(w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
}
function fallback(e){
  console.error('three failed', e);
  const s=$('#stats'); if(s) s.innerHTML='Three.js indisponível (offline?). Os dados continuam em words.json.';
  const q=$('#q'); if(q) q.placeholder='Busca indisponível: Three.js falhou.';
}
</script></body></html>
