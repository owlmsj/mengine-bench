<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Inter',sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;top:0;left:0;right:0;padding:20px 24px;pointer-events:none;z-index:10}
#title{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#888}
#search{margin-top:12px;pointer-events:auto}
#q{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;
  padding:10px 14px;color:#fff;font-size:15px;width:260px;outline:none;font-family:inherit}
#q:focus{border-color:rgba(120,160,255,.5);background:rgba(255,255,255,.09)}
#q::placeholder{color:#555}
#hint{position:fixed;bottom:16px;left:24px;font-size:12px;color:#444;pointer-events:none;z-index:10}
#info{position:fixed;top:20px;right:24px;text-align:right;pointer-events:none;z-index:10;
  font-size:13px;line-height:1.7;color:#aaa;max-width:240px}
#info .word{font-size:22px;font-weight:600;color:#fff}
#info .rel{color:#777;font-size:12px}
#info .rel a{color:#99b8ff;text-decoration:none;pointer-events:auto;cursor:pointer}
#info .rel a:hover{text-decoration:underline}
#stats{position:fixed;bottom:16px;right:24px;font-size:11px;color:#333;pointer-events:none;z-index:10}
</style>
</head>
<body>
<div id="ui">
  <div id="title">Universo de Palavras</div>
  <div id="search"><input id="q" placeholder="buscar palavra..." autocomplete="off"></div>
</div>
<div id="info"></div>
<div id="hint">arraste para girar &middot; scroll para zoom &middot; clique numa palavra</div>

  Object.keys(WORDS).forEach(function(w){
    if(!nodeMap.hasOwnProperty(w)){nodeMap[w]=nodes.length;nodes.push(w);}
    (WORDS[w]||[]).forEach(function(l){
      if(!nodeMap.hasOwnProperty(l)){nodeMap[l]=nodes.length;nodes.push(l);}
      var a=Math.min(nodeMap[w],nodeMap[l]),b=Math.max(nodeMap[w],nodeMap[l]);
      var k=a+'|'+b;
      if(!seen[k]){seen[k]=1;edges.push([a,b]);}
    });
  });

  var n=nodes.length;
  var pos=nodes.map(function(){
    return [
      (Math.random()-0.5)*20,
      (Math.random()-0.5)*20,
      (Math.random()-0.5)*20
    ];
  });
  var k=3;
  for(var it=0;it<300;it++){
    var disp=pos.map(function(){return[0,0,0];});
    for(var i=0;i<n;i++){
      for(var j=i+1;j<n;j++){
        var dx=pos[i][0]-pos[j][0],dy=pos[i][1]-pos[j][1],dz=pos[i][2]-pos[j][2];
        var d=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.1;
        var f=(k*k)/d;
        dx=dx/d*f;dy=dy/d*f;dz=dz/d*f;
        disp[i][0]+=dx;disp[i][1]+=dy;disp[i][2]+=dz;
        disp[j][0]-=dx;disp[j][1]-=dy;disp[j][2]-=dz;
      }
    }
    for(var e=0;e<edges.length;e++){
      var a=edges[e][0],b=edges[e][1];
      var dx=pos[a][0]-pos[b][0],dy=pos[a][1]-pos[b][1],dz=pos[a][2]-pos[b][2];
      var d=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.1;
      var f=d/k;
      dx=dx/d*f;dy=dy/d*f;dz=dz/d*f;
      disp[a][0]-=dx;disp[a][1]-=dy;disp[a][2]-=dz;
      disp[b][0]+=dx;disp[b][1]+=dy;disp[b][2]+=dz;
    }
    var cool=1-it/300;
    for(var i=0;i<n;i++){
      var len=Math.sqrt(disp[i][0]*disp[i][0]+disp[i][1]*disp[i][1]+disp[i][2]*disp[i][2]);
      if(len>0){
        var s=Math.min(len,k*cool)/len;
        pos[i][0]+=disp[i][0]*s;
        pos[i][1]+=disp[i][1]*s;
        pos[i][2]+=disp[i][2]*s;
      }
    }
  }

  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      var q=input.value.trim().toLowerCase();
      var exact=nodes.find(function(w){return w.toLowerCase()===q;});
      if(exact)selectWord(exact);
    }
  });

  function selectWord(word){
    var idx=nodeMap[word];
    var neighbors={};
    edges.forEach(function(e){
      if(e[0]===idx)neighbors[nodes[e[1]]]=1;
      if(e[1]===idx)neighbors[nodes[e[0]]]=1;
    });
    var nlist=Object.keys(neighbors).sort();
    nodeMeshes.forEach(function(mesh,i){
      var w=mesh.userData.word;
      if(w===word){
        mesh.material=new THREE.MeshBasicMaterial({color:0xffcc44});
        mesh.scale.setScalar(2.5);
        labels[i].material.opacity=1;
        labels[i].material.color=new THREE.Color(0xffcc44);
      }else if(neighbors[w]){
        mesh.material=new THREE.MeshBasicMaterial({color:0x88bbff});
        mesh.scale.setScalar(1.5);
        labels[i].material.opacity=0.9;
        labels[i].material.color=new THREE.Color(0x88bbff);
      }else{
        mesh.material=new THREE.MeshBasicMaterial({color:0x1a2535});
        mesh.scale.setScalar(0.8);
        labels[i].material.opacity=0.15;
        labels[i].material.color=new THREE.Color(0x334455);
      }
    });
    var info=document.getElementById('info');
    var links=nlist.map(function(w){
      return '<a data-w="'+w.replace(/"/g,'&quot;')+'">'+w+'</a>';
    }).join(', ');
    info.innerHTML='<div class="word">'+word+'</div><div class="rel">'+nlist.length+' rela\u00e7\u00f5es</div><div class="rel">'+(links||'sem rela\u00e7\u00f5es')+'</div>';
    info.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click',function(ev){
        ev.preventDefault();
        selectWord(a.getAttribute('data-w'));
      });
    });
    history.replaceState(null,'','?word='+encodeURIComponent(word));
  }

  function clearSelection(){
    nodeMeshes.forEach(function(mesh,i){
      mesh.material=new THREE.MeshBasicMaterial({color:0x5577aa});
      mesh.scale.setScalar(1);
      labels[i].material.opacity=0.85;
      labels[i].material.color=new THREE.Color(0xffffff);
    });
    document.getElementById('info').innerHTML='';
    history.replaceState(null,'',location.pathname);
  }

  var params=new URLSearchParams(location.search);
  var w=params.get('word');
  if(w){
    var match=nodes.find(function(x){return x.toLowerCase()===w.toLowerCase();});
    if(match)selectWord(match);
  }

  document.getElementById('stats').textContent=n+' palavras \u00b7 '+edges.length+' rela\u00e7\u00f5es';

  function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
  }
  animate();

  window.addEventListener('resize',function(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
