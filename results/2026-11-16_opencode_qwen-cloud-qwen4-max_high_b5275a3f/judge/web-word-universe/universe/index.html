<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a14; --panel:rgba(13,17,32,.88); --line:rgba(148,163,216,.16);
    --ink:#e8ecf8; --dim:#9aa3c0; --accent:#ffd93d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(1200px 800px at 70% 20%, #101736 0%, var(--bg) 60%);
    color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif}
  #sky{position:fixed;inset:0;display:block;cursor:grab}
  #sky.point{cursor:pointer} #sky.grabbing{cursor:grabbing}
  .hud{position:fixed;z-index:5}
  header.hud{top:18px;left:22px;max-width:min(430px,calc(100vw - 44px));pointer-events:none}
  header h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(22px,3.2vw,34px);
    letter-spacing:.01em;line-height:1.05}
  header h1 em{font-style:italic;color:var(--accent)}
  header p.sub{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.45}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;pointer-events:auto}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;font-size:12px;color:var(--dim);backdrop-filter:blur(8px)}
  .chip b{color:var(--ink);font-weight:700}
  .chip.star{border-color:rgba(255,217,61,.45);cursor:pointer}
  .chip.star b{color:var(--accent)}
  #searchbox{top:18px;right:22px;width:min(320px,calc(100vw - 44px))}
  #q{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);font:500 15px 'Space Grotesk',sans-serif;padding:11px 14px;outline:none;
    backdrop-filter:blur(8px)}
  #q:focus{border-color:rgba(255,217,61,.6)}
  #q::placeholder{color:#6b7394}
  #sugs{margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;display:none;backdrop-filter:blur(10px)}
  #sugs.open{display:block}
  .sug{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
    color:var(--ink);font:500 14px 'Space Grotesk',sans-serif;padding:9px 13px;cursor:pointer}
  .sug:hover,.sug.on{background:rgba(255,217,61,.12)}
  .sug small{margin-left:auto;color:var(--dim);font-size:11px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  #legend{bottom:18px;left:22px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,calc(100vw - 44px))}
  .lg{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--dim);cursor:pointer;user-select:none}
  .lg:hover{color:var(--ink)} .lg.on{border-color:currentColor;color:var(--ink)}
  .lg .n{opacity:.65;font-size:10.5px}
  #hint{bottom:18px;right:22px;color:#5d6584;font-size:11.5px;text-align:right;pointer-events:none;line-height:1.6}
  #panel{top:86px;right:22px;width:min(320px,calc(100vw - 44px));max-height:calc(100vh - 170px);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(12px);
    display:none;flex-direction:column;overflow:hidden}
  #panel.open{display:flex}
  .phead{padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative}
  .phead h2{font-family:'Fraunces',serif;font-weight:700;font-size:27px;line-height:1.1;padding-right:26px}
  .pmeta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--dim)}
  .tbadge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  #pclose{position:absolute;top:12px;right:12px;background:none;border:0;color:var(--dim);
    font-size:18px;cursor:pointer;line-height:1;padding:4px}
  #pclose:hover{color:var(--ink)}
  .pbody{overflow-y:auto;padding:12px 18px 16px}
  .pbody h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:12px 0 7px}
  .pbody h3:first-child{margin-top:2px}
  .rel{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
    border-radius:9px;color:var(--ink);font:500 14px 'Space Grotesk',sans-serif;padding:6px 8px;cursor:pointer}
  .rel:hover{background:rgba(148,163,216,.12)}
  .rel small{margin-left:auto;color:var(--dim);font-size:11px}
  .pfoot{padding:10px 18px 14px;border-top:1px solid var(--line)}
  #share{width:100%;background:rgba(255,217,61,.14);border:1px solid rgba(255,217,61,.4);color:var(--accent);
    border-radius:10px;font:700 12.5px 'Space Grotesk',sans-serif;padding:8px;cursor:pointer}
  #share:hover{background:rgba(255,217,61,.24)}
  #linkrow{display:none;margin-top:8px}
  #linkrow input{width:100%;background:#0a0e1d;border:1px solid var(--line);border-radius:8px;
    color:var(--dim);font-size:11px;padding:6px 8px}
  #tip{position:fixed;z-index:9;pointer-events:none;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:7px 11px;font-size:12.5px;display:none;backdrop-filter:blur(8px);max-width:240px}
  #tip b{font-size:14px} #tip span{color:var(--dim);font-size:11px;display:block;margin-top:2px}
  #reset{bottom:64px;right:22px;background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:10px;font:500 12px 'Space Grotesk',sans-serif;padding:6px 12px;cursor:pointer;display:none}
  #reset:hover{color:var(--ink)}
  @media (max-width:720px){
    header p.sub{display:none}
    #panel{top:auto;bottom:64px;max-height:46vh}
    #legend{bottom:12px;left:12px;max-width:calc(100vw - 24px)}
    #hint{display:none}
    #searchbox{top:auto;bottom:12px;right:12px;width:calc(100vw - 24px);display:none}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<header class="hud">
  <h1>Universo de <em>Palavras</em></h1>
  <p class="sub">Cada ponto é uma palavra do Dicionário Criativo; cada fio, uma relação de sentido.
  Navegue pelo mapa ou busque uma palavra para ver suas ligações.</p>
  <div class="stats" id="stats"></div>
</header>

<div class="hud" id="searchbox">
  <input id="q" type="search" placeholder="Buscar palavra… (ex.: saudade)" autocomplete="off" spellcheck="false" aria-label="Buscar palavra">
  <div id="sugs" role="listbox"></div>
</div>
<button class="hud" id="reset">↺ visão geral</button>

<div class="hud" id="legend"></div>
<div class="hud" id="hint">arraste o fundo para mover · role para dar zoom<br>clique numa palavra para explorar · arraste nós</div>

<aside class="hud" id="panel" aria-live="polite">
  <div class="phead">
    <button id="pclose" aria-label="Fechar">✕</button>
    <h2 id="pname"></h2>
    <div class="pmeta"><span class="tbadge" id="ptheme"></span><span id="pdeg"></span></div>
  </div>
  <div class="pbody" id="prels"></div>
  <div class="pfoot">
    <button id="share">Compartilhar esta palavra</button>
    <div id="linkrow"><input id="linkurl" readonly aria-label="Link da palavra"></div>
  </div>
</aside>

<div id="tip"></div>

/* ---------- setup ---------- */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const THEME_COLOR = {
  'sentimentos':'#ff6b6b','natureza':'#51cf66','corpo':'#ffa94d','comida':'#ffd43b',

  'artes':'#f783ac','linguagem':'#748ffc','sem tema':'#868e96'

const themeOrder = Object.keys(DATA.themes).sort((a,b)=>DATA.themes[b]-DATA.themes[a]||a.localeCompare(b));
const ids = Object.keys(DATA.nodes);

const nodes = ids.map((id,i)=>{
  const t = DATA.nodes[id].theme;

  const R = 340;
  return { id, i, label:DATA.nodes[id].label, theme:t, color:THEME_COLOR[t]||'#868e96',
    x:Math.cos(ang)*R+(Math.random()-.5)*160, y:Math.sin(ang)*R+(Math.random()-.5)*160,
    vx:0, vy:0, deg:0, nb:[], fx:null, fy:null };
});
const edges = DATA.edges.map(e=>{
  const a=idx.get(e.a), b=idx.get(e.b);
  nodes[a].deg++; nodes[b].deg++;
  nodes[a].nb.push({j:b,types:e.types}); nodes[b].nb.push({j:a,types:e.types});
  return {a,b,types:e.types};
});
const adj = nodes.map(()=>new Set());
edges.forEach(e=>{adj[e.a].add(e.b);adj[e.b].add(e.a);});
const maxDeg = Math.max(...nodes.map(n=>n.deg));
const mostId = ids.slice().sort((a,b)=>nodes[idx.get(b)].deg-nodes[idx.get(a)].deg||a.localeCompare(b))[0];
const radius = n => 3.2 + 6.5*Math.sqrt(n.deg/maxDeg);

/* ---------- canvas / camera ---------- */
const cv=document.getElementById('sky'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px'; }
addEventListener('resize',resize); resize();
const cam={x:0,y:0,k:1};
let follow=null;
const toWorld=(sx,sy)=>({x:(sx-W/2)/cam.k+cam.x, y:(sy-H/2)/cam.k+cam.y});
const toScreen=(x,y)=>({x:(x-cam.x)*cam.k+W/2, y:(y-cam.y)*cam.k+H/2});
function fitAll(){ cam.k=Math.min(W,H)/900; cam.x=0;cam.y=0; follow=null; }
fitAll();

/* ---------- simulation ---------- */
let alpha=1;
function reheat(a){ alpha=Math.max(alpha,a); }
const anchors = themeOrder.map((t,i)=>{const ang=(i/themeOrder.length)*Math.PI*2-Math.PI/2;
  return {t,x:Math.cos(ang)*300,y:Math.sin(ang)*300};});
const anchorOf = new Map(anchors.map(a=>[a.t,a]));
function tick(){
  if(alpha<0.004) return;
  alpha*=0.985;
  const rep=1500*alpha+300;
  for(let i=0;i<N;i++){
    const a=nodes[i];
    for(let j=i+1;j<N;j++){
      const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y;
      let d2=dx*dx+dy*dy; if(d2<1)d2=1;
      if(d2>160000) continue;
      const f=rep/d2, d=Math.sqrt(d2), fx=dx/d*f, fy=dy/d*f;
      a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
    }
  }
  for(const e of edges){
    const a=nodes[e.a],b=nodes[e.b];
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-95)*0.012*(alpha+0.12);
    const fx=dx/d*f,fy=dy/d*f;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
  }
  for(const n of nodes){
    const an=anchorOf.get(n.theme);
    if(an){ n.vx+=(an.x-n.x)*0.004*(alpha+0.05); n.vy+=(an.y-n.y)*0.004*(alpha+0.05); }
    n.vx-=n.x*0.0008; n.vy-=n.y*0.0008;
    if(n.fx!=null){ n.x=n.fx;n.y=n.fy;n.vx=0;n.vy=0; continue; }
    n.vx*=0.82;n.vy*=0.82;
    const sp=Math.sqrt(n.vx*n.vx+n.vy*n.vy);
    if(sp>14){n.vx*=14/sp;n.vy*=14/sp;}
    n.x+=n.vx;n.y+=n.vy;
  }
}

function neighborsOf(i){ return adj[i]; }
function select(id, center){
  const i=idx.get(id); if(i==null) return;
  sel=i; themeSpot=null;
  [...legendEl.children].forEach(c=>c.classList.remove('on'));

function renderPanel(i){
  const n=nodes[i];
  document.getElementById('pname').textContent=n.label;
  const th=document.getElementById('ptheme');
  th.innerHTML=`<span class="dot" style="background:${n.color}"></span>${n.theme}`;
  document.getElementById('pdeg').textContent=`${n.deg} ligações`;
  const syn=[],ana=[];
  for(const e of edges){
    if(e.a!==i&&e.b!==i)continue;
    const o=nodes[e.a===i?e.b:e.a];
    if(e.types.includes('sinonimo'))syn.push(o);
    if(e.types.includes('analoga'))ana.push(o);
  }
  const list=(arr)=>arr.sort((a,b)=>a.label.localeCompare(b.label,'pt'))
    .map(o=>`<button class="rel" data-id="${o.id}"><span class="dot" style="background:${o.color}"></span>${o.label}<small>${o.deg}</small></button>`).join('')||'<p style="color:var(--dim);font-size:12.5px;padding:2px 8px">nenhuma</p>';
  document.getElementById('prels').innerHTML=
    `<h3>Sinônimos · ${syn.length}</h3>${list(syn)}`+
    `<h3>Palavras análogas · ${ana.length}</h3>${list(ana)}`;
  document.querySelectorAll('.rel').forEach(b=>b.onclick=()=>select(b.dataset.id,true));
  const url=location.href.split('?')[0].split('#')[0]+'?word='+encodeURIComponent(n.id);
  document.getElementById('linkurl').value=url;
  document.getElementById('linkrow').style.display='none';
  document.getElementById('share').textContent='Compartilhar esta palavra';
}
document.getElementById('share').onclick=async()=>{
  const url=document.getElementById('linkurl').value;
  try{ await navigator.clipboard.writeText(url);
    document.getElementById('share').textContent='Link copiado ✓';
  }catch(_){
    document.getElementById('linkrow').style.display='block';
    const inp=document.getElementById('linkurl'); inp.focus(); inp.select();
    document.getElementById('share').textContent='Copie o link abaixo';
  }
};

/* ---------- search ---------- */
const q=document.getElementById('q'), sugs=document.getElementById('sugs');
const searchIndex=ids.map(id=>({id,n:norm(DATA.nodes[id].label)}));
function matches(text){
  const t=norm(text.trim()); if(!t)return[];
  const exact=[],pre=[],sub=[];
  for(const s of searchIndex){
    if(s.n===t||s.id===t)exact.push(s.id);
    else if(s.n.startsWith(t))pre.push(s.id);
    else if(s.n.includes(t))sub.push(s.id);
  }
  return [...exact,...pre,...sub].slice(0,8);
}
let sugList=[],sugOn=-1;
function drawSugs(){
  if(!sugList.length){sugs.classList.remove('open');return;}
  sugs.innerHTML=sugList.map((id,k)=>{
    const n=nodes[idx.get(id)];
    return `<button class="sug${k===sugOn?' on':''}" data-id="${id}" role="option"><span class="dot" style="background:${n.color}"></span>${n.label}<small>${n.theme} · ${n.deg}</small></button>`;
  }).join('');
  sugs.classList.add('open');
  sugs.querySelectorAll('.sug').forEach(b=>b.onclick=()=>{select(b.dataset.id,true);closeSugs();});
}
function closeSugs(){sugs.classList.remove('open');sugOn=-1;}
q.addEventListener('input',()=>{sugList=matches(q.value);sugOn=sugList.length?0:-1;drawSugs();});
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){sugOn=Math.min(sugOn+1,sugList.length-1);drawSugs();e.preventDefault();}
  else if(e.key==='ArrowUp'){sugOn=Math.max(sugOn-1,0);drawSugs();e.preventDefault();}
  else if(e.key==='Enter'){const id=sugList[sugOn>=0?sugOn:0];if(id){select(id,true);closeSugs();q.blur();}}
  else if(e.key==='Escape'){closeSugs();q.blur();}
});
document.addEventListener('click',e=>{ if(!e.target.closest('#searchbox'))closeSugs(); });

/* ---------- pointer interaction ---------- */
let dragNode=null,panning=false,lastP=null,moved=0;
function pick(sx,sy){
  const w=toWorld(sx,sy); let best=null,bd=Infinity;
  for(const n of nodes){
    const dx=n.x-w.x,dy=n.y-w.y,d=dx*dx+dy*dy;
    const r=radius(n)+6/cam.k;
    if(d<r*r&&d<bd){bd=d;best=n;}
  }
  return best;
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  lastP={x:e.clientX,y:e.clientY};moved=0;
  const n=pick(e.clientX,e.clientY);
  if(n){dragNode=n;n.fx=n.x;n.fy=n.y;follow=null;}
  else{panning=true;cv.classList.add('grabbing');}
});
cv.addEventListener('pointermove',e=>{
  if(dragNode){
    const w=toWorld(e.clientX,e.clientY);
    dragNode.fx=w.x;dragNode.fy=w.y;
    moved+=Math.abs(e.clientX-lastP.x)+Math.abs(e.clientY-lastP.y);
    lastP={x:e.clientX,y:e.clientY};reheat(.3);return;
  }
  if(panning){
    cam.x-=(e.clientX-lastP.x)/cam.k;cam.y-=(e.clientY-lastP.y)/cam.k;
    moved+=Math.abs(e.clientX-lastP.x)+Math.abs(e.clientY-lastP.y);
    lastP={x:e.clientX,y:e.clientY};follow=null;return;
  }
  const n=pick(e.clientX,e.clientY);
  hover=n?n.i:null;
  cv.classList.toggle('point',!!n);
  const tip=document.getElementById('tip');
  if(n){
    tip.style.display='block';
    tip.style.left=Math.min(e.clientX+14,W-250)+'px';
    tip.style.top=Math.min(e.clientY+14,H-80)+'px';
    tip.innerHTML=`<b>${n.label}</b><span>${n.theme} · ${n.deg} ligações</span>`;
  } else tip.style.display='none';
});
cv.addEventListener('pointerup',e=>{
  if(dragNode){
    if(moved<5)select(dragNode.id,false);
    dragNode.fx=null;dragNode.fy=null;dragNode=null;reheat(.2);
  } else if(panning){
    panning=false;cv.classList.remove('grabbing');
    if(moved<5){ clearSel(); }
  }
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const before=toWorld(e.clientX,e.clientY);
  cam.k=Math.max(.25,Math.min(6,cam.k*Math.exp(-e.deltaY*0.0012)));
  const after=toWorld(e.clientX,e.clientY);
  cam.x+=before.x-after.x;cam.y+=before.y-after.y;follow=null;
},{passive:false});

/* ---------- render ---------- */
function draw(){
  tick();
  if(follow!=null){ const n=nodes[follow];
    cam.x+=(n.x-cam.x)*0.08; cam.y+=(n.y-cam.y)*0.08;
    if(cam.k<1.1)cam.k+=(1.1-cam.k)*0.08; }
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  const nbSet = sel!=null?adj[sel]:null;
  const dimNode = i => {
    if(sel!=null) return i===sel||nbSet.has(i);
    if(themeSpot) return nodes[i].theme===themeSpot;
    return true;
  };
  // edges
  ctx.lineCap='round';
  for(const e of edges){
    const a=nodes[e.a],b=nodes[e.b];
    const pa=toScreen(a.x,a.y),pb=toScreen(b.x,b.y);
    let al=0.10,wd=1,col='#8ea2d8';
    if(sel!=null){
      if(e.a===sel||e.b===sel){ al=.85;wd=1.8;col=nodes[sel].color; }
      else al=.03;
    } else if(themeSpot){
      al=(a.theme===themeSpot&&b.theme===themeSpot)?.35:.03;
    } else if(hover!=null&&(e.a===hover||e.b===hover)){ al=.6;wd=1.5; }
    ctx.strokeStyle=col;ctx.globalAlpha=al;ctx.lineWidth=wd;
    ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();
  }
  // nodes
  for(const n of nodes){
    const p=toScreen(n.x,n.y),r=radius(n)*Math.max(.7,Math.min(cam.k,1.6));
    const lit=dimNode(n.i);
    ctx.globalAlpha=lit?1:.09;
    if(n.i===sel||n.i===hover){
      ctx.save();ctx.shadowColor=n.color;ctx.shadowBlur=18;
      ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(p.x,p.y,r+1.5,0,7);ctx.fill();ctx.restore();
    }
    ctx.fillStyle=n.color;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
    if(n.i===sel){ ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.globalAlpha=.9;
      ctx.beginPath();ctx.arc(p.x,p.y,r+3.5,0,7);ctx.stroke(); }
  }
  // labels
  ctx.textAlign='center';ctx.textBaseline='top';
  const showAll = cam.k>1.7;
  for(const n of nodes){
    const lit=dimNode(n.i);
    const important = n.deg>=8||n.i===sel||n.i===hover||(sel!=null&&nbSet.has(n.i));
    if(!showAll&&!important)continue;
    if(!lit&&sel==null&&!themeSpot)continue;
    const p=toScreen(n.x,n.y),r=radius(n)*Math.max(.7,Math.min(cam.k,1.6));
    const fs=Math.max(10,Math.min(15,11*cam.k));
    ctx.font=(n.i===sel?'700 ':'500 ')+fs+'px "Space Grotesk",sans-serif';
    ctx.globalAlpha=lit?(n.i===sel?1:.85):.06;
    ctx.fillStyle='#070a14';
    const ty=p.y+r+3;
    ctx.lineWidth=3;ctx.strokeStyle='rgba(7,10,20,.85)';
    ctx.strokeText(n.label,p.x,ty);
    ctx.fillStyle=n.i===sel?'#ffffff':'#dfe5f5';
    ctx.fillText(n.label,p.x,ty);
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ---------- deep link ---------- */
(function(){
  const want=new URLSearchParams(location.search).get('word');
  if(!want)return;
  const t=norm(want.trim());
  let id=ids.find(x=>x===t)||ids.find(x=>norm(DATA.nodes[x].label)===t)
        ||ids.find(x=>norm(DATA.nodes[x].label).startsWith(t))
        ||ids.find(x=>norm(DATA.nodes[x].label).includes(t));
  if(id){
    // let the layout settle a moment, then focus
    setTimeout(()=>select(id,true),350);
    q.value=DATA.nodes[id].label;
  } else {
    q.value=want;
    sugList=matches(want);drawSugs();
  }
})();
</script>
