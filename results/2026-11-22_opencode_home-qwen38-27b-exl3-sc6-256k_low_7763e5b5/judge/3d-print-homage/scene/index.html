<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>The Great Wave off Kanagawa - low poly 3D wallpaper</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9dfc4}
  #app{position:fixed;inset:0}
  #label{position:fixed;left:14px;bottom:10px;font:12px/1.4 Georgia,serif;color:#2b3a55;opacity:.75;pointer-events:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="label">Kanagawa Oki Nami Ura &middot; low poly wallpaper</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/* ---- Palette taken from the print ---- */
const C = {
  paper:   0xe9dfc4,
  ink:     0x1d2a44,
  indigo1: 0x16324f, // deep wave body
  indigo2: 0x2a5d8f, // mid blue
  indigo3: 0x7fb2d9, // pale blue highlights
  foam:    0xf4f1e6,
  fuji:    0x4a5f8c,
  fujiCap: 0xf2efe4,
  hull:    0xd8b98a,
  hullDark:0x8a6f4d,
  rope:    0x6b5a42,
};

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById("app").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 30, 70);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, .1, 200);
camera.position.set(0, 5.5, 20);
camera.lookAt(0, 2.6, 0);

scene.add(new THREE.HemisphereLight(0xfff6e0, 0x8a94a8, 1.2));
const sun = new THREE.DirectionalLight(0xfff2d8, .5);
sun.position.set(-6, 10, 8);
scene.add(sun);

const flat = (color, opts={}) => new THREE.MeshLambertMaterial({color, flatShading:true, ...opts});

/* ============================================================
   Wave builder: a low-poly sheet whose height follows a ridge
   profile along its length, so crests read as sharp ridges.
   Returns the mesh; a foam strip is added along the crest.
   ============================================================ */
function makeWave({width=22, depth=14, segW=26, segD=16, color, phase=0,
                   ridge=1.6, rough=0.35, x=0, y=0, z=0, rotY=0, rotZ=0, rotX=0,
                   crestColor=null, crestWidth=0.18}={}) {
  const g = new THREE.PlaneGeometry(width, depth, segW, segD);
  g.rotateX(-Math.PI/2);
  const pos = g.attributes.position;
  let crestX = 0, crestH = 0;
  for (let i=0;i<pos.count;i++){
    const px = pos.getX(i), pz = pos.getZ(i);
    const t = (px/width + .5); // 0..1 along length
    let h = Math.sin(t*Math.PI + phase) * ridge;
    h += Math.sin(t*Math.PI*3.1 + phase*2.2) * rough * .5;
    h += (pz/depth) * ridge * .15;
    pos.setY(i, h);
    if (h > crestH){ crestH = h; crestX = px; }
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, flat(color));
  m.position.set(x,y,z);
  m.rotation.set(rotX, rotY, rotZ);
  m.userData = {baseY:y, baseRZ:rotZ, baseRX:rotX};
  scene.add(m);

  if (crestColor !== null){
    // foam: a row of small low-poly "claws" (cones) along the crest line
    const n = 9;
    for (let i=0;i<n;i++){
      const fx = -width/2 + (i/(n-1))*width;
      const ft = (fx/width + .5);
      const fh = Math.sin(ft*Math.PI + phase)*ridge + Math.sin(ft*Math.PI*3.1+phase*2.2)*rough*.5;
      const claw = new THREE.Mesh(new THREE.ConeGeometry(width/n*.42, .5, 5, 1), flat(crestColor));
      claw.position.set(fx, fh + .2, -depth*.12);
      claw.rotation.z = (Math.random()-.5)*.5;
      m.add(claw); // child so it moves with the wave
    }
  }
  return m;
}

/* ---- The great curling wave (left, the iconic one) ---- */
makeWave({width:22, depth:15, segW:34, segD:20, color:C.indigo2,
  phase:0.3, ridge:3.4, rough:.5, x:-6, y:1.2, z:-1, rotY:0.15, rotZ:-0.06,
  crestColor:C.foam});
// deep under-layer
makeWave({width:22, depth:15, segW:34, segD:20, color:C.indigo1,
  phase:0.3, ridge:3.4, rough:.5, x:-6, y:0.95, z:-0.8, rotY:0.15, rotZ:-0.06});
// pale highlight band
makeWave({width:20, depth:12, segW:34, segD:20, color:C.indigo3,
  phase:0.32, ridge:3.0, rough:.4, x:-6, y:1.5, z:-1.4, rotY:0.15, rotZ:-0.06});

/* ---- Foreground rolling waves (bottom) ---- */
makeWave({width:26, depth:14, segW:34, segD:16, color:C.indigo2,
  phase:1.1, ridge:1.8, rough:.5, x:2.5, y:0.0, z:5.5, rotY:-0.04,
  crestColor:C.foam});
makeWave({width:26, depth:14, segW:34, segD:16, color:C.indigo1,
  phase:1.1, ridge:1.8, rough:.5, x:2.5, y:-0.2, z:5.7, rotY:-0.04});

/* ---- Right-side wave rising toward the boat ---- */
makeWave({width:15, depth:13, segW:24, segD:16, color:C.indigo2,
  phase:2.0, ridge:2.2, rough:.4, x:9, y:0.4, z:-1, rotY:-0.4, rotZ:0.1,
  crestColor:C.foam});
makeWave({width:15, depth:13, segW:24, segD:16, color:C.indigo1,
  phase:2.0, ridge:2.2, rough:.4, x:9, y:0.2, z:-0.8, rotY:-0.4, rotZ:0.1});

/* ---- Mid-distance small wave band behind Fuji ---- */
makeWave({width:28, depth:9, segW:34, segD:8, color:C.indigo3,
  phase:0.9, ridge:1.0, rough:.3, x:0, y:0.3, z:-10, rotY:0});

/* ============================================================
   Mount Fuji: low-poly cone + snow cap, center-back.
   ============================================================ */
(function makeFuji(){
  const grp = new THREE.Group();
  const slope = new THREE.Mesh(new THREE.ConeGeometry(5.4, 5.8, 7, 1), flat(C.fuji));
  slope.position.y = 2.9;
  grp.add(slope);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(2.4, 2.5, 7, 1), flat(C.fujiCap));
  cap.position.y = 4.7;
  cap.scale.y = .8;
  grp.add(cap);
  grp.position.set(1.5, 0.1, -15);
  scene.add(grp);
})();

/* ============================================================
   Boats: 3, as in the print. Hull + gunwale + rowers + oars.
   ============================================================ */
function makeBoat({x,y,z, rotY=0, rotZ=0, rotX=0, scale=1}={}){
  const g = new THREE.Group();
  const hullGeo = new THREE.CylinderGeometry(0.55, 0.3, 4.8, 5, 1);
  hullGeo.rotateZ(Math.PI/2);
  hullGeo.scale(1, .5, .8);
  g.add(new THREE.Mesh(hullGeo, flat(C.hull)));
  const gun = new THREE.Mesh(new THREE.BoxGeometry(4.6, .12, .7), flat(C.hullDark));
  gun.position.y = .28;
  g.add(gun);
  for (let i=0;i<5;i++){
    const hx = -1.6 + i*.8;
    const head = new THREE.Mesh(new THREE.SphereGeometry(.16, 6, 5), flat(C.ink));
    head.position.set(hx, .44, 0);
    g.add(head);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,.3,5), flat(C.indigo1));
    body.position.set(hx, .3, 0);
    g.add(body);
    const oar = new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.9), flat(C.rope));
    oar.position.set(hx, .3, .55);
    oar.rotation.x = .5;
    g.add(oar);
  }
  g.position.set(x,y,z);
  g.rotation.set(rotX, rotY, rotZ);
  g.scale.setScalar(scale);
  g.userData = {baseY:y, baseRZ:rotZ, baseRX:rotX};
  scene.add(g);
  return g;
}

const boat1 = makeBoat({x:-7, y:1.0, z:2.5, rotY:0.5, rotZ:-0.1, scale:1.0});
const boat2 = makeBoat({x:2.8, y:0.9, z:6.0, rotY:-0.15, rotZ:0.04, scale:1.05});
const boat3 = makeBoat({x:8.6, y:1.6, z:-0.4, rotY:-0.9, rotZ:0.16, scale:0.95});

/* ============================================================
   Gentle motion.
   ============================================================ */
const clock = new THREE.Clock();
const waves = [];
scene.traverse(o=>{ if(o.isMesh && o.geometry.type==="PlaneGeometry") waves.push(o); });
const boats = [boat1, boat2, boat3];

function animate(){
  const t = clock.getElapsedTime();
  for (const w of waves){
    w.position.y = w.userData.baseY + Math.sin(t*.6 + w.position.x*.3)*.12;
    w.rotation.z = w.userData.baseRZ + Math.sin(t*.4 + w.position.x)*.02;
  }
  const f = [3.2, 2.8, 3.6];
  boats.forEach((b,i)=>{
    b.position.y = b.userData.baseY + Math.sin(t*f[i])*.14;
    b.rotation.z = b.userData.baseRZ + Math.sin(t*f[i]*.8 + 1)*.08;
    b.rotation.x = b.userData.baseRX + Math.sin(t*f[i]*.6)*.05;
  });
  camera.position.x = Math.sin(t*.08)*.6;
  camera.position.y = 5.5 + Math.sin(t*.05)*.15;
  camera.lookAt(0, 2.6, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
