<title>Universo das Palavras</title>

<style>
  :root{
    --bg:#07070d; --ink:#e8e6f0; --dim:#8a87a0; --line:#23222f;
    --accent:#e0b34c; --accent2:#7fd4c1;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0}
  .panel{position:fixed;z-index:5;background:rgba(10,10,18,.72);
    backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
  #top{top:18px;left:18px;right:18px;display:flex;gap:14px;align-items:center;
    padding:12px 18px}
  #top h1{font-family:"Fraunces",serif;font-weight:600;font-size:20px;margin:0;letter-spacing:.02em}
  #top .sub{color:var(--dim);font-size:12px;margin-left:auto}
  #search{flex:1;max-width:420px}
  #search input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
    color:var(--ink);font:inherit;font-size:15px;padding:6px 2px;outline:none}
  #search input:focus{border-bottom-color:var(--accent)}
  #sugg{position:fixed;top:74px;left:18px;z-index:6;max-width:420px;max-height:50vh;overflow:auto;
    background:rgba(10,10,18,.92);border:1px solid var(--line);border-radius:12px;display:none}
  #sugg div{padding:8px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04)}
  #sugg div:hover{background:rgba(224,179,76,.12)}
  #card{left:18px;bottom:18px;width:340px;max-height:60vh;overflow:auto;padding:18px 20px}
  #card h2{font-family:"Fraunces",serif;font-size:30px;margin:0 0 2px;font-weight:600}
  #card .theme{color:var(--accent2);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
  #card h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
  #card .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;
    cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  #hint{position:fixed;right:18px;bottom:18px;z-index:5;color:var(--dim);font-size:12px;
    text-align:right;line-height:1.6;pointer-events:none}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>

    let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
    let d2=dx*dx+dy*dy+dz*dz+0.01; let d=Math.sqrt(d2);
    let rep=REP/d2; f[i*3]+=dx/d*rep; f[i*3+1]+=dy/d*rep; f[i*3+2]+=dz/d*rep;
    f[j*3]-=dx/d*rep; f[j*3+1]-=dy/d*rep; f[j*3+2]-=dz/d*rep;
  }
  for(let i=0;i<N;i++) for(const b of adj[i]){
    let dx=pos[b*3]-pos[i*3], dy=pos[b*3+1]-pos[i*3+1], dz=pos[b*3+2]-pos[i*3+2];
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    let s=SPRING*(d-REST);
    f[i*3]+=dx/d*s; f[i*3+1]+=dy/d*s; f[i*3+2]+=dz/d*s;
  }
  const cool = 1 - it/ITER;
  for(let i=0;i<N;i++){
    f[i*3]-=pos[i*3]*CENTER; f[i*3+1]-=pos[i*3+1]*CENTER; f[i*3+2]-=pos[i*3+2]*CENTER;
    vel[i*3]=(vel[i*3]+f[i*3]*cool)*0.6; vel[i*3+1]=(vel[i*3+1]+f[i*3+1]*cool)*0.6; vel[i*3+2]=(vel[i*3+2]+f[i*3+2]*cool)*0.6;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}

// ---------- three.js scene ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070d);
scene.fog = new THREE.FogExp2(0x07070d, 0.0035);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0,0,150);

// stars (words)
const starGeo = new THREE.BufferGeometry();
const sp = new Float32Array(N*3); const sc = new Float32Array(N*3); const ss = new Float32Array(N);
const cBase = new THREE.Color(0x9a97b8), cHi = new THREE.Color(0xe0b34c), cSel = new THREE.Color(0x7fd4c1);
for(let i=0;i<N;i++){
  sp[i*3]=pos[i*3]; sp[i*3+1]=pos[i*3+1]; sp[i*3+2]=pos[i*3+2];
  const t = deg[i]/Math.max(...deg);
  sc[i*3]=cBase.r+t*(cHi.r-cBase.r); sc[i*3+1]=cBase.g+t*(cHi.g-cBase.g); sc[i*3+2]=cBase.b+t*(cHi.b-cBase.b);
  ss[i]=0.6+deg[i]*0.35;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
starGeo.setAttribute('color', new THREE.BufferAttribute(sc,3));
starGeo.setAttribute('size', new THREE.BufferAttribute(ss,1));
const starMat = new THREE.PointsMaterial({size:2.2, vertexColors:true, sizeAttenuation:true,
  transparent:true, opacity:0.95, depthWrite:false});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// links
const linePos=[]; const lineCol=[];
for(let i=0;i<N;i++) for(const b of adj[i]) if(b>i){
  linePos.push(pos[i*3],pos[i*3+1],pos[i*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]);
  lineCol.push(0.35,0.34,0.45,0.35,0.34,0.45);
}
const lineGeo=new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos,3));
lineGeo.setAttribute('color', new THREE.Float32BufferAttribute(lineCol,3));
const lines=new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.35,depthWrite:false}));
scene.add(lines);

// background dust
const dustGeo=new THREE.BufferGeometry();
const dp=new Float32Array(600*3);
for(let i=0;i<600;i++){dp[i*3]=(Math.random()-.5)*700;dp[i*3+1]=(Math.random()-.5)*700;dp[i*3+2]=(Math.random()-.5)*700;}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));
scene.add(new THREE.Points(dustGeo,new THREE.PointsMaterial({size:0.7,color:0x2a2938,transparent:true,opacity:0.5,depthWrite:false})));

// labels via sprites for selected + neighbors
const labelGroup=new THREE.Group(); scene.add(labelGroup);
function makeLabel(text){
  const c=document.createElement('canvas'); const ctx=c.getContext('2d');
  const fs=44; ctx.font=`500 ${fs}px "Space Grotesk",sans-serif`;
  const w=Math.ceil(ctx.measureText(text).width)+24; const h=fs+20;
  c.width=w; c.height=h;
  ctx.font=`500 ${fs}px "Space Grotesk",sans-serif`;
  ctx.fillStyle='rgba(10,10,18,.6)'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#e8e6f0'; ctx.textBaseline='middle'; ctx.fillText(text,12,h/2);
  const tex=new THREE.CanvasTexture(c);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  spr.scale.set(w/h*6,6,1);
  return spr;
}
function clearLabels(){ while(labelGroup.children.length) labelGroup.remove(labelGroup.children[0]); }

// orbit controls (manual)
let dragging=false, px=0, py=0, rotX=0, rotY=0, dist=150;
canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{ if(!dragging)return;
  rotY+=(e.clientX-px)*0.005; rotX+=(e.clientY-py)*0.005; px=e.clientX; py=e.clientY;});
canvas.addEventListener('wheel',e=>{ dist=Math.max(30,Math.min(400,dist+e.deltaY*0.1)); e.preventDefault();},{passive:false});

// raycast pick
const ray=new THREE.Raycaster(); ray.params.Points={threshold:3};
const mouse=new THREE.Vector2();
canvas.addEventListener('click',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObject(stars);
  if(hits.length) select(hits[0].index);
});

let selected=-1;
function select(i){
  selected=i;
  const w=WORDS[i];
  // highlight colors
  const col=starGeo.attributes.color.array;
  for(let k=0;k<N;k++){
    const c=new THREE.Color();
    if(k===i) c.set(0x7fd4c1);
    else if(adj[i].includes(k)) c.set(0xe0b34c);
    else c.set(0x3a3949);
    col[k*3]=c.r; col[k*3+1]=c.g; col[k*3+2]=c.b;
  }
  starGeo.attributes.color.needsUpdate=true;
  // line highlight
  const lc=lineGeo.attributes.color.array;
  for(let k=0;k<lc.length/6;k++){
    const a=linePos[k*6], b=linePos[k*6+3];
    // find which indices (recompute from adj)
  }
  // simpler: rebuild line colors by checking endpoints against adj[i]
  const lp=lineGeo.attributes.position.array;
  for(let k=0;k<lp.length/6;k++){
    const ax=lp[k*6],ay=lp[k*6+1],az=lp[k*6+2];
    const bx=lp[k*6+3],by=lp[k*6+4],bz=lp[k*6+5];
    let on=false;
    for(let t=0;t<N;t++){ if(pos[t*3]===ax&&pos[t*3+1]===ay&&pos[t*3+2]===az&&adj[i].includes(t)) on=true; }
    const r=on?0.88:0.22,g=on?0.7:0.2,b2=on?0.3:0.28;
    lc[k*6]=r;lc[k*6+1]=g;lc[k*6+2]=b2;lc[k*6+3]=r;lc[k*6+4]=g;lc[k*6+5]=b2;
  }
  lineGeo.attributes.color.needsUpdate=true;
  // labels
  clearLabels();
  const lab=makeLabel(w); lab.position.set(pos[i*3],pos[i*3+1]+4,pos[i*3+2]); labelGroup.add(lab);
  for(const b of adj[i]){ const l2=makeLabel(WORDS[b]); l2.material.opacity=0.8;
    l2.position.set(pos[b*3],pos[b*3+1]+3,pos[b*3+2]); labelGroup.add(l2); }
  // card
  const theme=THEMES[w]||'';
  const rels=adj[i].map(b=>WORDS[b]);
  document.getElementById('card').innerHTML=
    `<h2>${w}</h2><div class="theme">${theme||'—'}</div>
     <h3>${rels.length} relações</h3><div class="chips">
     ${rels.map(r=>`<span class="chip" data-w="${r}">${r}</span>`).join('')}</div>`;
  document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
    const j=idx.get(ch.dataset.w); if(j!==undefined) select(j);});
  // camera focus
  focusTarget.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
  focusDist=Math.max(40, 20+deg[i]*3);
}
const focusTarget=new THREE.Vector3(0,0,0); let focusDist=150;

function resetColors(){
  const col=starGeo.attributes.color.array;
  for(let k=0;k<N;k++){ const t=deg[k]/Math.max(...deg);
    const c=new THREE.Color().lerpColors(cBase,cHi,t);
    col[k*3]=c.r;col[k*3+1]=c.g;col[k*3+2]=c.b;}
  starGeo.attributes.color.needsUpdate=true;
  const lc=lineGeo.attributes.color.array;
  for(let k=0;k<lc.length/3;k++){lc[k]=0.35;lc[k+1]=0.34;lc[k+2]=0.45;}
  lineGeo.attributes.color.needsUpdate=true;
  clearLabels();
}

// search
const q=document.getElementById('q'), sugg=document.getElementById('sugg');
const allWords=WORDS.slice().sort();
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){sugg.style.display='none';return;}
  const m=allWords.filter(w=>w.startsWith(v)).slice(0,12);
  if(!m.length){sugg.style.display='none';return;}
  sugg.innerHTML=m.map(w=>`<div data-w="${w}">${w}</div>`).join('');
  sugg.style.display='block';
  sugg.querySelectorAll('div').forEach(d=>d.onclick=()=>{select(idx.get(d.dataset.w));sugg.style.display='none';q.value='';});
});
q.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=q.value.trim().toLowerCase();
  if(idx.has(v)){select(idx.get(v));sugg.style.display='none';q.value='';} }});

// stats
const pairs=new Set(); for(let i=0;i<N;i++) for(const b of adj[i]) pairs.add([Math.min(i,b),Math.max(i,b)].join('|'));
document.getElementById('stats').textContent=`${N} palavras · ${pairs.size} relações`;

// deep link ?word=
const params=new URLSearchParams(location.search);
const initWord=params.get('word');
if(initWord && idx.has(initWord.toLowerCase())) select(idx.get(initWord.toLowerCase()));

// animate
function tick(){
  requestAnimationFrame(tick);
  if(!dragging) rotY+=0.0008;
  const dir=new THREE.Vector3(Math.sin(rotY)*Math.cos(rotX),Math.sin(rotX),Math.cos(rotY)*Math.cos(rotX));
  camera.position.copy(focusTarget).addScaledVector(dir,dist);
  camera.lookAt(focusTarget);
  renderer.render(scene,camera);
}
tick();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
