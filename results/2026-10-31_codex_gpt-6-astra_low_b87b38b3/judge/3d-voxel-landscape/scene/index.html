<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dfb6ad">
<title>Fuji · An evening in bloom</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#dcc0b5;color:#fff6e8;font-family:Georgia,'Times New Roman',serif}canvas{display:block;width:100%;height:100%;touch-action:none}.frame{position:fixed;inset:25px;border:1px solid #fff4df50;pointer-events:none}.top{position:fixed;top:48px;left:52px;right:52px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{font:11px/1.5 Arial,sans-serif;letter-spacing:4px;text-transform:uppercase}.edition{font:10px/1.5 Arial,sans-serif;letter-spacing:2px}.title{position:fixed;left:54px;top:115px;pointer-events:none;text-shadow:0 2px 24px #634d6930}.eyebrow{font:10px Arial,sans-serif;letter-spacing:4px;text-transform:uppercase;color:#724c61}.title h1{font-size:clamp(44px,5.8vw,86px);font-weight:normal;line-height:1.05;letter-spacing:-3px;margin:16px 0;color:#fff8ec}.title p{font-size:15px;font-style:italic;margin:0;color:#775567}.vertical{position:fixed;right:53px;top:122px;writing-mode:vertical-rl;font-size:26px;letter-spacing:12px;color:#fff5e6dd;pointer-events:none}.bottom{position:fixed;bottom:47px;left:53px;right:53px;display:flex;justify-content:space-between;align-items:end;gap:20px}.location{font:10px/1.9 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}.location strong{font-weight:normal;font-size:12px;letter-spacing:3px}.controls{display:flex;align-items:center;gap:18px}.hint{font:9px Arial,sans-serif;letter-spacing:2px;opacity:.75}button{width:40px;height:40px;border:1px solid #fff4df70;border-radius:50%;background:#594e6420;color:#fff8ee;font-size:15px;cursor:pointer;backdrop-filter:blur(8px)}button:hover{background:#fff4df30}button:focus-visible{outline:2px solid white;outline-offset:5px}#status{position:fixed;inset:0;display:grid;place-items:center;background:#dcc0b5;color:#714e61;font:12px Arial,sans-serif;letter-spacing:3px;z-index:4}#status.hidden{display:none}@media(max-width:600px){.frame{inset:14px}.top{top:32px;left:31px;right:31px}.brand{font-size:9px;letter-spacing:2px}.edition{font-size:8px}.title{left:31px;top:88px}.title h1{letter-spacing:-2px}.title p{font-size:12px}.vertical{right:28px;top:105px;font-size:19px}.bottom{left:31px;right:31px;bottom:31px}.hint{display:none}.location{font-size:8px;letter-spacing:1px}.location strong{font-size:10px;letter-spacing:2px}}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div id="status" role="status">PAINTING THE EVENING…</div>
<canvas id="view" aria-label="An animated low-poly Mount Fuji landscape, with a five-tier vermilion pagoda and blooming cherry trees at dusk"></canvas>
<div class="frame"></div>
<header class="top"><div class="brand">Elsewhere &nbsp; / &nbsp; Japan</div><div class="edition">LANDSCAPE STUDY &nbsp; 001</div></header>
<section class="title"><div class="eyebrow">An evening in bloom</div><h1>Under Fuji’s sky.</h1><p>A fleeting season. A timeless view.</p></section>
<div class="vertical" lang="ja">富士と桜</div>
<footer class="bottom"><div class="location"><strong>Chureito Pagoda</strong><br>Fujiyoshida, Japan &nbsp; / &nbsp; Spring at dusk</div><div class="controls"><span class="hint">DRAG TO WANDER &nbsp; · &nbsp; SCROLL TO ZOOM</span><button id="motion" aria-label="Pause animation" title="Pause animation">Ⅱ</button><button id="reset" aria-label="Reset view" title="Reset view">↺</button></div></footer>
<script type="module">
import * as THREE from 'three';

const canvas = document.querySelector('#view');
const status = document.querySelector('#status');
try {
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2('#c7a8b9',.009);
const camera = new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,280);
const target = new THREE.Vector3(0,10,-9);
let yaw=0, pitch=0, zoom=1;
function frameCamera(){
  const narrow=Math.max(1,1.35/camera.aspect);
  camera.position.set(24 + Math.sin(yaw)*53,22+pitch*23,47+Math.cos(yaw)*9);
  camera.position.sub(target).multiplyScalar(zoom*narrow).add(target);
  camera.lookAt(target);
}
frameCamera();

let seed=4727;
function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const materials = new Map();
function mat(color){if(!materials.has(color))materials.set(color,new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true}));return materials.get(color);}
function box(parent,x,y,z,w,h,d,color,rotation=0){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
  mesh.position.set(x,y,z);mesh.rotation.y=rotation;mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;
}
function limb(parent,a,b,r1,r2,color,sides=5){
  const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),dir=end.clone().sub(start);
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,dir.length(),sides),mat(color));
  mesh.position.copy(start.add(end).multiplyScalar(.5));mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());mesh.castShadow=true;parent.add(mesh);return mesh;
}
const ambient=new THREE.HemisphereLight('#ffe5de','#595b76',2.3);scene.add(ambient);
const sunLight=new THREE.DirectionalLight('#ffd3a1',3.1);sunLight.position.set(-35,50,20);sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);Object.assign(sunLight.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:140});sunLight.shadow.bias=-.0006;sunLight.shadow.normalBias=.04;scene.add(sunLight);

// A shader sky keeps the atmosphere entirely procedural.
const sky=new THREE.Mesh(new THREE.SphereGeometry(220,32,20),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{},vertexShader:`varying vec3 vDirection;void main(){vDirection=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 vDirection;void main(){float h=normalize(vDirection).y;vec3 horizon=vec3(.91,.67,.58);vec3 zenith=vec3(.32,.36,.55);vec3 c=mix(horizon,zenith,smoothstep(-.04,.75,h));gl_FragColor=vec4(c,1.);}`}));scene.add(sky);
const sun=new THREE.Mesh(new THREE.CircleGeometry(6.2,64),new THREE.MeshBasicMaterial({color:'#ffe5b1',fog:false}));sun.position.set(-37,34,-110);sun.lookAt(camera.position);scene.add(sun);

// Irregular concentric rings create Fuji's broad volcanic silhouette and snowline.
function fuji(){
  const rings=[{y:0,r:33},{y:3,r:27},{y:7,r:21},{y:11.5,r:16.3},{y:16,r:12.1},{y:20.5,r:8.2},{y:25,r:4.4},{y:26,r:3.3}];
  const count=40, points=[];
  for(let j=0;j<rings.length;j++){
    const ring=rings[j];points[j]=[];
    for(let i=0;i<count;i++){
      const a=i/count*Math.PI*2;
      const ridge=Math.sin(a*9)*.035+Math.sin(a*13+1)*.025;
      const r=ring.r*(1+ridge);
      const irregular=j===5?Math.sin(a*7)*.8+Math.sin(a*11)*.5:Math.sin(a*5)*.12;
      points[j].push(new THREE.Vector3(Math.cos(a)*r,ring.y+irregular,Math.sin(a)*r*.78));
    }
  }
  const vertices=[],colors=[];
  const palette=['#777895','#85839d','#9491a6','#b5a6b6','#eee4e4','#fff5e9'];
  for(let j=0;j<rings.length-1;j++)for(let i=0;i<count;i++){
    const n=(i+1)%count;
    const tris=[[points[j][i],points[j][n],points[j+1][i]],[points[j][n],points[j+1][n],points[j+1][i]]];
    for(const tri of tris){
      const c=new THREE.Color(j>=5?palette[4+(i%3===0?0:1)]:palette[Math.min(3,Math.floor(j*.66))]);
      c.multiplyScalar(.88+random()*.19);
      for(const p of tri){vertices.push(p.x,p.y,p.z);colors.push(c.r,c.g,c.b);}
    }
  }
  for(let i=0;i<count;i++){
    for(const p of [points[7][i],points[7][(i+1)%count],new THREE.Vector3(0,25.8,0)]){vertices.push(p.x,p.y,p.z);const c=new THREE.Color('#ede0e1');colors.push(c.r,c.g,c.b);}
  }
  const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geometry.computeVertexNormals();
  const mountain=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,side:THREE.DoubleSide}));mountain.position.set(-9,-1,-61);scene.add(mountain);
}
fuji();
function ridge(z,color,height){
  const vertices=[];
  for(let i=0;i<35;i++){
    const x=-110+i*7;
    const y=height+Math.sin(i*.64)*2+Math.sin(i*1.71)*1.8;
    const xn=x+7,yn=height+Math.sin((i+1)*.64)*2+Math.sin((i+1)*1.71)*1.8;
    vertices.push(x,-5,z,xn,-5,z,x,y,z,x,y,z,xn,-5,z,xn,yn,z);
  }
  const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geometry.computeVertexNormals();scene.add(new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color,roughness:1,side:THREE.DoubleSide})));
}
ridge(-85,'#a39ab0',5);ridge(-42,'#9293a4',3);ridge(-30,'#78889a',1);
box(scene,0,-3,-35,220,1,180,'#82938f');

// Quiet settlement across the valley, rendered as small pastel blocks.
const village=new THREE.Group();scene.add(village);
for(let i=0;i<170;i++){
  const x=(random()-.5)*100,z=-17-random()*27,h=.3+random()*.85;
  box(village,x,-1.9+h/2,z,.65+random()*1.4,h,.7+random(),'#b4b3b3');
  box(village,x,-1.9+h,z,1.3,.14,1.1,['#7b8494','#8e8190','#9c9299'][i%3]);
}

// Terraced foreground gives the architecture a grounded overlook.
box(scene,0,-1.6,10,58,3,32,'#526d68');
box(scene,0,-.25,10,53,.7,29,'#7a8874');
box(scene,12,.2,7,19,.8,17,'#b5aca2');
box(scene,12,.67,7,18,.24,16,'#cfc1ad');
for(let i=0;i<9;i++)box(scene,1,.12-i*.17,13+i*.72,4.4,.25,.75,'#b9b2a5');
for(let i=0;i<45;i++){
  const x=(random()-.5)*57,z=random()*24-2;
  if(x>2&&x<23&&z<16)continue;
  box(scene,x,.1+random()*.3,z,1+random()*2,.25+random()*.65,1+random()*2,['#73836b','#819177','#667d69'][i%3],random()*.5);
}

const pagoda=new THREE.Group();pagoda.position.set(13,.82,5);scene.add(pagoda);
box(pagoda,0,.25,0,9,.5,8,'#8b8b88');box(pagoda,0,.6,0,8.3,.25,7.4,'#dfd0b7');
// Each square roof has a curved profile and lifted corners, including a vermilion fascia.
function roof(y,width,depth){
  const vertices=[],indices=[];
  const profiles=[{s:1,y:0},{s:.89,y:-.11},{s:.64,y:.49},{s:.34,y:1.05},{s:.12,y:1.37}];
  profiles.forEach(p=>{
    for(let side=0;side<4;side++)for(let step=0;step<8;step++){
      const t=step/8*2-1;
      const x=side===0?t:side===1?1:side===2?-t:-1;
      const z=side===0?-1:side===1?t:side===2?1:-t;
      const corner=Math.pow(Math.min(1,Math.abs(side%2===0?x:z)),6)*.33*p.s*p.s;
      vertices.push(x*width*.5*p.s,y+p.y+corner,z*depth*.5*p.s);
    }
  });
  for(let j=0;j<profiles.length-1;j++)for(let i=0;i<32;i++){const a=j*32+i,b=j*32+(i+1)%32,c=a+32,d=b+32;indices.push(a,c,b,b,c,d);}
  const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));geometry.setIndex(indices);geometry.computeVertexNormals();
  const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:'#374b53',roughness:.9,flatShading:true,side:THREE.DoubleSide}));mesh.castShadow=true;mesh.receiveShadow=true;pagoda.add(mesh);
  for(let side=0;side<4;side++)for(let i=0;i<8;i++){
    const t=(i+.5)/8*2-1, lift=Math.pow(Math.abs(t),6)*.33;
    const x=side%2===0?t*width/2:(side===1?1:-1)*width/2;
    const z=side%2===0?(side===0?-1:1)*depth/2:t*depth/2;
    box(pagoda,x,y-.1+lift,z,side%2===0?width/8+.03:.13,.15,side%2===0?.13:depth/8+.03,'#b84e3e');
  }
}
for(let tier=0;tier<5;tier++){
  const y=.78+tier*2.85,w=6.8-tier*.72,d=6-tier*.62;
  box(pagoda,0,y+1.1,0,w-.5,2.2,d-.5,'#ce573e');
  for(const side of [-1,1]){
    box(pagoda,0,y+1.25,side*d/2,w-.4,1.25,.1,'#f0d5b4');
    box(pagoda,side*w/2,y+1.25,0,.1,1.25,d-.4,'#edcfad');
    for(let k=-2;k<=2;k++){
      box(pagoda,k*w/5,y+1.1,side*(d/2+.04),.17,2.25,.21,'#b83f30');
      box(pagoda,side*(w/2+.04),y+1.1,k*d/5,.21,2.25,.17,'#b83f30');
    }
    box(pagoda,0,y+.95,side*(d/2+.12),w,.14,.18,'#d45236');
    box(pagoda,side*(w/2+.12),y+.95,0,.18,.14,d,'#d45236');
    for(let k=-1;k<=1;k++)box(pagoda,k*.9,y+1.17,side*(d/2+.07),.55,.98,.08,'#594b48');
  }
  box(pagoda,0,y+.12,0,w+1.25,.23,d+1.2,'#ab3d2f');
  for(const side of [-1,1]){
    box(pagoda,0,y+.69,side*(d/2+.49),w+1.2,.12,.13,'#e56844');
    box(pagoda,side*(w/2+.49),y+.69,0,.13,.12,d+1.2,'#e56844');
    for(let k=-4;k<=4;k++){
      box(pagoda,k*(w+1)/9,y+.42,side*(d/2+.49),.09,.55,.09,'#d35a3d');
      box(pagoda,side*(w/2+.49),y+.42,k*(d+1)/9,.09,.55,.09,'#d35a3d');
    }
  }
  roof(y+2.13,w+2.8,d+2.6);
}
limb(pagoda,[0,15.4,0],[0,20.6,0],.13,.045,'#72634c',8);
for(let i=0;i<9;i++){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.42-i*.026,.055,4,12),mat('#887249'));ring.rotation.x=Math.PI/2;ring.position.y=16.4+i*.35;pagoda.add(ring);
}
const finial=new THREE.Mesh(new THREE.OctahedronGeometry(.29),mat('#c4a160'));finial.position.y=20.5;pagoda.add(finial);

// Instanced blossom cubes make dense, airy canopies without heavy draw calls.
const blossoms=[];
function cherry(x,z,size){
  const tree=new THREE.Group();tree.position.set(x,.25,z);scene.add(tree);
  const bark='#665055';
  limb(tree,[0,0,0],[.25*size,3.2*size,0],.36*size,.22*size,bark);
  limb(tree,[.2*size,2.5*size,0],[-1.6*size,5.1*size,.2*size],.22*size,.07*size,bark);
  limb(tree,[.2*size,2.8*size,0],[1.9*size,5.4*size,-.3*size],.24*size,.07*size,bark);
  const clusters=[[-1.9,5.3,0],[1.9,5.8,-.4],[0,6.2,0],[-.6,5.5,1.7],[1,5.8,-1.8],[-2.6,4.9,-1],[2.9,5.1,.7]];
  for(const c of clusters){
    limb(tree,[.2*size,3.2*size,0],[c[0]*size,c[1]*size,c[2]*size],.14*size,.04*size,bark);
    for(let i=0;i<60;i++){
      const a=random()*Math.PI*2,u=random()*2-1,r=Math.cbrt(random()),s=(.25+random()*.45)*size;
      blossoms.push({x:x+(c[0]+Math.cos(a)*Math.sqrt(1-u*u)*r*1.55)*size,y:.25+(c[1]+u*r*.95)*size,z:z+(c[2]+Math.sin(a)*Math.sqrt(1-u*u)*r*1.35)*size,s,color:['#f4b7c8','#ffd4dc','#ed9fb8','#ffe0df','#d984a1'][Math.floor(random()*5)]});
    }
  }
}
cherry(-16,12,1.55);cherry(-8,7,1.18);cherry(-21,1,1.1);cherry(24,13,1.18);cherry(23,-2,.83);cherry(-23,23,1.5);cherry(8,24,.85);
const dummy=new THREE.Object3D();
const blossomMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),mat('#ffffff'),blossoms.length);
blossoms.forEach((b,i)=>{dummy.position.set(b.x,b.y,b.z);dummy.rotation.set(.1,random()*.7,.1);dummy.scale.set(b.s,b.s*.82,b.s);dummy.updateMatrix();blossomMesh.setMatrixAt(i,dummy.matrix);blossomMesh.setColorAt(i,new THREE.Color(b.color));});blossomMesh.castShadow=true;blossomMesh.receiveShadow=true;scene.add(blossomMesh);

// Stone lanterns and a low railing finish the terrace.
for(const x of [4,21]){
  box(scene,x,1.02,15,.95,.35,.95,'#97968b');box(scene,x,1.8,15,.37,1.3,.37,'#b4b2a1');box(scene,x,2.6,15,.85,.7,.85,'#8a8d85');box(scene,x,2.6,15.44,.42,.38,.025,'#ffe1a0');
  const cap=new THREE.Mesh(new THREE.ConeGeometry(.86,.55,4),mat('#9a9e91'));cap.rotation.y=Math.PI/4;cap.position.set(x,3.2,15);scene.add(cap);
}
for(let i=0;i<16;i++)box(scene,-23+i*3,1,-3,.17,1.9,.17,'#625e5b');box(scene,-.5,1.5,-3,45,.16,.17,'#79716a');
const petals=new THREE.InstancedMesh(new THREE.PlaneGeometry(.16,.24),new THREE.MeshStandardMaterial({color:'#ffd0db',side:THREE.DoubleSide,roughness:1}),150);
const drift=[];
for(let i=0;i<150;i++)drift.push({x:(random()-.5)*53,y:random()*18,z:random()*33-5,s:.6+random(),p:random()*Math.PI*2});scene.add(petals);
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const motionButton=document.querySelector('#motion');
function motionLabel(){motionButton.textContent=playing?'Ⅱ':'▷';motionButton.setAttribute('aria-label',playing?'Pause animation':'Play animation');motionButton.title=playing?'Pause animation':'Play animation';}
motionLabel();motionButton.addEventListener('click',()=>{playing=!playing;motionLabel();});
document.querySelector('#reset').addEventListener('click',()=>{yaw=0;pitch=0;zoom=1;frameCamera();});
let dragging=false,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',event=>{dragging=true;lastX=event.clientX;lastY=event.clientY;canvas.setPointerCapture(event.pointerId);canvas.style.cursor='grabbing';});
canvas.addEventListener('pointermove',event=>{if(!dragging)return;yaw=THREE.MathUtils.clamp(yaw+(event.clientX-lastX)*.003,-.35,.35);pitch=THREE.MathUtils.clamp(pitch+(event.clientY-lastY)*.003,-.3,.45);lastX=event.clientX;lastY=event.clientY;frameCamera();});
function release(){dragging=false;canvas.style.cursor='grab';}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.style.cursor='grab';
canvas.addEventListener('wheel',event=>{event.preventDefault();zoom=THREE.MathUtils.clamp(zoom+event.deltaY*.0005,.78,1.35);frameCamera();},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);frameCamera();});
let time=0,previous=performance.now();
function animate(now){
  requestAnimationFrame(animate);const dt=Math.min((now-previous)/1000,.05);previous=now;if(playing)time+=dt;
  for(let i=0;i<drift.length;i++){
    const p=drift[i];dummy.position.set(((p.x+27+time*.5*p.s)%54)-27,((p.y-time*.47*p.s)%18+18)%18,p.z+Math.sin(time*.4+p.p)*.65);dummy.rotation.set(time*.6+p.p,time*.35+p.p,p.p+time*.5);dummy.scale.setScalar(p.s);dummy.updateMatrix();petals.setMatrixAt(i,dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate=true;renderer.render(scene,camera);
}
renderer.render(scene,camera);status.classList.add('hidden');requestAnimationFrame(animate);
window.__sceneEvidence={threeRevision:THREE.REVISION,pagodaTiers:5,blossomCount:blossoms.length,procedural:true};
} catch(error) {status.textContent='The scene could not start. Please enable WebGL and reload.';console.error(error);}
</script>
</body>
</html>
