<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Archery '95</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { font-family:'VT323', monospace; }
  #wrap { position:relative; width:100vw; height:100vh; }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; image-rendering:pixelated; }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(0,0,20,0.72); color:#fff; z-index:5;
  }
  .hidden { display:none; }
  h1 { font-family:'Press Start 2P', monospace; font-size:clamp(20px,4.5vw,44px);
       color:#ffd23f; text-shadow:4px 4px 0 #b34700, 8px 8px 0 rgba(0,0,0,.5);
       margin-bottom:28px; line-height:1.4; }
  .sub { font-size:clamp(18px,2.6vw,30px); color:#bfe8ff; margin-bottom:34px; line-height:1.5; }
  .btn {
    font-family:'Press Start 2P', monospace; font-size:clamp(12px,1.8vw,18px);
    color:#fff; background:#2e7d32; border:4px solid #a5d6a7;
    padding:18px 34px; cursor:pointer; box-shadow:0 6px 0 #1b5e20;
    transition:transform .05s;
  }
  .btn:hover { background:#388e3c; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #1b5e20; }
  #finalScore { font-size:clamp(22px,3.4vw,40px); color:#ffd23f; margin-bottom:30px; }
  .tip { position:absolute; bottom:14px; width:100%; text-align:center;
         color:rgba(255,255,255,.55); font-size:18px; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="startScreen" class="overlay">
    <h1>BALLOON<br>ARCHERY '95</h1>
    <div class="sub">
      Aim with the mouse &mdash; hold &amp; drag back to draw the bow.<br>
      Release to fire. Pop balloons. Don't let 5 escape!<br>
      (or press SPACE / click START)
    </div>
    <button class="btn" id="startBtn">START</button>
  </div>

  <div id="endScreen" class="overlay hidden">
    <h1>GAME OVER</h1>
    <div id="finalScore">SCORE 0</div>
    <button class="btn" id="retryBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- canvas ----------
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- audio (WebAudio, no assets) ----------
let AC = null;
function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, type, vol, slideTo) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.15, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, hp) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const len = Math.max(1, Math.floor(ac.sampleRate * dur));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(); src.buffer = buf;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let node = src;
  if (hp) { const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; node.connect(f); node = f; }
  node.connect(g); g.connect(ac.destination);
  src.start(t);
}
const SFX = {
  draw()  { beep(140, 0.08, 'sawtooth', 0.05, 90); },
  shoot() { noiseBurst(0.12, 0.25, 800); beep(220, 0.1, 'triangle', 0.12, 60); },
  pop()   { noiseBurst(0.09, 0.35, 1500); beep(660, 0.07, 'square', 0.18, 220); },
  miss()  { beep(180, 0.15, 'sine', 0.1, 80); },
  lose()  { beep(330, 0.3, 'sawtooth', 0.15, 110); },
  win()   { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.15, 'square', 0.15), i * 90)); },
};

// ---------- state ----------
const MAX_ESCAPES = 5;
const state = {
  mode: 'start',      // start | play | over
  score: 0,
  escapes: 0,
  arrows: [],         // in flight
  balloons: [],
  particles: [],
  popups: [],         // floating score text
  spawnTimer: 0,
  spawnInterval: 1.6,
  time: 0,
};
const mouse = { x: 0, y: 0, down: false, drawStart: null };
const archer = { x: 0, y: 0 };

function layout() {
  archer.x = Math.max(70, W * 0.09);
  archer.y = H - Math.max(90, H * 0.14);
}
layout();
window.addEventListener('resize', layout);

// ---------- input ----------
function ptr(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('mousemove', e => { const p = ptr(e); mouse.x = p.x; mouse.y = p.y; });
cv.addEventListener('mousedown', e => {
  if (state.mode !== 'play') return;
  const p = ptr(e);
  mouse.down = true;
  mouse.drawStart = { x: p.x, y: p.y };
  SFX.draw();
});
window.addEventListener('mouseup', e => {
  if (!mouse.down) return;
  mouse.down = false;
  if (state.mode === 'play' && mouse.drawStart) {
    const p = ptr(e);
    shoot(p);
  }
  mouse.drawStart = null;
});
cv.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state.mode !== 'play') return;
  const t = e.touches[0]; const p = ptr(t);
  mouse.x = p.x; mouse.y = p.y;
  mouse.down = true; mouse.drawStart = { x: p.x, y: p.y };
  SFX.draw();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0]; const p = ptr(t);
  mouse.x = p.x; mouse.y = p.y;
}, { passive: false });
cv.addEventListener('touchend', e => {
  e.preventDefault();
  if (!mouse.down) return;
  mouse.down = false;
  if (state.mode === 'play' && mouse.drawStart) shoot({ x: mouse.x, y: mouse.y });
  mouse.drawStart = null;
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    if (state.mode === 'start') startGame();
    else if (state.mode === 'over') startGame();
  }
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

// ---------- game flow ----------
function startGame() {
  audio();
  state.mode = 'play';
  state.score = 0;
  state.escapes = 0;
  state.arrows = [];
  state.balloons = [];
  state.particles = [];
  state.popups = [];
  state.spawnTimer = 0.4;
  state.spawnInterval = 1.6;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  SFX.win();
}
function endGame() {
  state.mode = 'over';
  document.getElementById('finalScore').textContent = 'SCORE ' + state.score;
  document.getElementById('endScreen').classList.remove('hidden');
  SFX.lose();
}

// ---------- shooting ----------
function shoot(p) {
  const dx = p.x - archer.x, dy = p.y - archer.y;
  const dist = Math.hypot(dx, dy) || 1;
  // power from drag length (drag back away from target), clamped
  let power = 0;
  if (mouse.drawStart) {
    power = Math.hypot(p.x - mouse.drawStart.x, p.y - mouse.drawStart.y);
  }
  power = Math.min(1, power / 220);
  // if no drag, small tap = weak shot toward cursor
  if (power < 0.12) power = 0.3;
  const speed = 520 + power * 780;
  const a = Math.atan2(dy, dx);
  state.arrows.push({
    x: archer.x, y: archer.y - 30,
    vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
    power, trail: [],
  });
  SFX.shoot();
}

// ---------- balloons ----------
const BALLOON_COLORS = ['#ff5252', '#ffd740', '#40c4ff', '#69f0ae', '#ff4081', '#b388ff', '#ffab40'];
function spawnBalloon() {
  const r = 26 + Math.random() * 18;
  const x = W * 0.25 + Math.random() * (W * 0.7);
  const speed = 26 + Math.random() * 30 + Math.min(40, state.score * 0.4);
  state.balloons.push({
    x, y: H + r + 10, r,
    vy: -speed,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 1.2 + Math.random() * 1.6,
    color: BALLOON_COLORS[(Math.random() * BALLOON_COLORS.length) | 0],
    hue: 0,
  });
}

// ---------- particles & popups ----------
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 260;
    state.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
      life: 0.5 + Math.random() * 0.4, t: 0,
      color, size: 2 + Math.random() * 4,
    });
  }
}
function popup(x, y, text, color) {
  state.popups.push({ x, y, text, color, t: 0, life: 0.9 });
}

// ---------- update ----------
function update(dt) {
  state.time += dt;
  if (state.mode !== 'play') return;

  // spawn
  state.spawnTimer -= dt;
  if (state.spawnTimer <= 0) {
    spawnBalloon();
    state.spawnTimer = state.spawnInterval * (0.7 + Math.random() * 0.6);
    // difficulty ramps with score
    state.spawnInterval = Math.max(0.55, 1.6 - state.score * 0.012);
  }

  // arrows
  for (let i = state.arrows.length - 1; i >= 0; i--) {
    const a = state.arrows[i];
    a.trail.push({ x: a.x, y: a.y });
    if (a.trail.length > 8) a.trail.shift();
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.vy += 60 * dt; // slight gravity
    if (a.x < -40 || a.x > W + 40 || a.y < -60 || a.y > H + 40) {
      state.arrows.splice(i, 1);
      SFX.miss();
    }
  }

  // balloons
  for (let i = state.balloons.length - 1; i >= 0; i--) {
    const b = state.balloons[i];
    b.wobble += b.wobbleSpeed * dt;
    b.x += Math.sin(b.wobble) * 18 * dt;
    b.y += b.vy * dt;
    if (b.y < -b.r - 30) {
      state.balloons.splice(i, 1);
      state.escapes++;
      popup(b.x, 60, 'ESCAPED!', '#ff8a80');
      SFX.miss();
      if (state.escapes >= MAX_ESCAPES) { endGame(); return; }
    }
  }

  // collisions: arrow vs balloon
  for (let i = state.arrows.length - 1; i >= 0; i--) {
    const a = state.arrows[i];
    for (let j = state.balloons.length - 1; j >= 0; j--) {
      const b = state.balloons[j];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < b.r + 6) {
        // pop!
        const pts = b.r > 36 ? 15 : 10;
        state.score += pts;
        burst(b.x, b.y, b.color, 26);
        popup(b.x, b.y, '+' + pts, '#fff176');
        state.balloons.splice(j, 1);
        state.arrows.splice(i, 1);
        SFX.pop();
        break;
      }
    }
  }

  // particles
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.t += dt;
    if (p.t >= p.life) { state.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 500 * dt;
  }

  // popups
  for (let i = state.popups.length - 1; i >= 0; i--) {
    const p = state.popups[i];
    p.t += dt;
    if (p.t >= p.life) state.popups.splice(i, 1);
  }
}

// ---------- draw ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#7ec8ff');
  g.addColorStop(0.6, '#bfe6ff');
  g.addColorStop(1, '#e8f7ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = 'rgba(255,236,150,0.9)';
  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.14, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,236,150,0.25)';
  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.14, 70, 0, Math.PI * 2); ctx.fill();
  // clouds (parallax drift)
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (let i = 0; i < 5; i++) {
    const cx = ((i * 260 + state.time * 12) % (W + 200)) - 100;
    const cy = H * (0.1 + (i % 3) * 0.09);
    cloud(cx, cy, 1 + (i % 2) * 0.4);
  }
  // ground
  ctx.fillStyle = '#7cb342';
  ctx.fillRect(0, H - 46, W, 46);
  ctx.fillStyle = '#558b2f';
  ctx.fillRect(0, H - 46, W, 6);
}
function cloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
  ctx.arc(x + 24 * s, y - 8 * s, 18 * s, 0, Math.PI * 2);
  ctx.arc(x + 48 * s, y, 20 * s, 0, Math.PI * 2);
  ctx.arc(x + 24 * s, y + 8 * s, 16 * s, 0, Math.PI * 2);
  ctx.fill();
}

function drawArcher() {
  const ax = archer.x, ay = archer.y;
  // aim angle: toward mouse, but bow drawn back when dragging
  let aim = Math.atan2(mouse.y - (ay - 30), mouse.x - ax);
  let draw = 0;
  if (mouse.down && mouse.drawStart) {
    draw = Math.min(1, Math.hypot(mouse.x - mouse.drawStart.x, mouse.y - mouse.drawStart.y) / 220);
  }
  // body
  ctx.save();
  ctx.translate(ax, ay);
  // legs
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, -18); ctx.lineTo(-10, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, -18); ctx.lineTo(10, 0); ctx.stroke();
  // torso
  ctx.strokeStyle = '#c62828'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, -40); ctx.stroke();
  // head
  ctx.fillStyle = '#ffcc80';
  ctx.beginPath(); ctx.arc(0, -50, 9, 0, Math.PI * 2); ctx.fill();
  // hat
  ctx.fillStyle = '#2e7d32';
  ctx.fillRect(-11, -58, 22, 5);
  ctx.fillRect(-7, -64, 14, 7);
  ctx.restore();

  // bow at shoulder, rotated to aim
  ctx.save();
  ctx.translate(ax, ay - 30);
  ctx.rotate(aim);
  const pull = draw * 26;
  // bow arc
  ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, 0, 34, -Math.PI / 2.4, Math.PI / 2.4);
  ctx.stroke();
  // string
  const tipA = { x: Math.cos(-Math.PI / 2.4) * 34, y: Math.sin(-Math.PI / 2.4) * 34 };
  const tipB = { x: Math.cos(Math.PI / 2.4) * 34, y: Math.sin(Math.PI / 2.4) * 34 };
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(tipA.x, tipA.y);
  ctx.lineTo(-pull, 0);
  ctx.lineTo(tipB.x, tipB.y);
  ctx.stroke();
  // nocked arrow when drawing
  if (draw > 0.02) {
    ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-pull, 0); ctx.lineTo(30, 0); ctx.stroke();
    ctx.fillStyle = '#eceff1';
    ctx.beginPath();
    ctx.moveTo(38, 0); ctx.lineTo(28, -5); ctx.lineTo(28, 5); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // aim guide (dotted) when playing
  if (state.mode === 'play') {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2; ctx.setLineDash([4, 8]);
    ctx.beginPath();
    ctx.moveTo(ax, ay - 30);
    ctx.lineTo(ax + Math.cos(aim) * 160, ay - 30 + Math.sin(aim) * 160);
    ctx.stroke();
    ctx.restore();
  }
}

function drawBalloon(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  // string
  ctx.strokeStyle = 'rgba(80,80,80,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, b.r); ctx.quadraticCurveTo(4, b.r + 18, 0, b.r + 34); ctx.stroke();
  // body
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, b.r * 0.86, b.r, 0, 0, Math.PI * 2);
  ctx.fill();
  // knot
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.moveTo(-5, b.r - 2); ctx.lineTo(5, b.r - 2); ctx.lineTo(0, b.r + 8); ctx.closePath(); ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.ellipse(-b.r * 0.3, -b.r * 0.35, b.r * 0.22, b.r * 0.32, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawArrow(a) {
  // trail
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
  if (a.trail.length > 1) {
    ctx.beginPath();
    ctx.moveTo(a.trail[0].x, a.trail[0].y);
    for (const t of a.trail) ctx.lineTo(t.x, t.y);
    ctx.stroke();
  }
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(Math.atan2(a.vy, a.vx));
  // shaft
  ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(10, 0); ctx.stroke();
  // head
  ctx.fillStyle = '#eceff1';
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(8, -5); ctx.lineTo(8, 5); ctx.closePath(); ctx.fill();
  // fletching
  ctx.fillStyle = '#ef5350';
  ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-22, -5); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-16, 0); ctx.lineTo(-22, 5); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  ctx.font = '28px "VT323", monospace';
  ctx.textBaseline = 'top';
  // score panel
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(14, 14, 220, 44, 8); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.fillText('SCORE ' + state.score, 26, 26);
  // escapes panel
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(W - 234, 14, 220, 44, 8); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('ESCAPED', W - 222, 26);
  for (let i = 0; i < MAX_ESCAPES; i++) {
    ctx.fillStyle = i < state.escapes ? '#ff5252' : 'rgba(255,255,255,0.25)';
    ctx.beginPath(); ctx.arc(W - 120 + i * 24, 36, 8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  drawSky();
  for (const b of state.balloons) drawBalloon(b);
  for (const a of state.arrows) drawArrow(a);
  drawArcher();
  // particles
  for (const p of state.particles) {
    const k = 1 - p.t / p.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  // popups
  ctx.font = '26px "VT323", monospace';
  ctx.textAlign = 'center';
  for (const p of state.popups) {
    const k = 1 - p.t / p.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - p.t * 50);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  if (state.mode === 'play') drawHUD();
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
