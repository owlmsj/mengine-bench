<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--ink:#e8e6e1;--dim:#8a8f98;--acc:#e0b34c;--line:#2a2f3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
header{padding:20px 28px;display:flex;align-items:baseline;gap:14px;pointer-events:none}
header h1{font-family:Fraunces,serif;font-weight:600;font-size:22px;letter-spacing:.02em}
header span{color:var(--dim);font-size:13px}
#searchwrap{position:fixed;top:18px;right:28px;pointer-events:auto}
#search{background:#12151d;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 14px;font:14px Inter,sans-serif;width:220px;outline:none}
#search:focus{border-color:var(--acc)}
#panel{position:fixed;left:28px;bottom:28px;max-width:340px;background:rgba(13,16,23,.92);border:1px solid var(--line);border-radius:12px;padding:18px 20px;pointer-events:auto;backdrop-filter:blur(6px)}
#panel h2{font-family:Fraunces,serif;font-size:26px;font-weight:600;margin-bottom:2px}
#panel .tema{color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
#panel .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.14em;margin:10px 0 6px}
#panel ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
#panel li a{display:inline-block;background:#1a1f2b;border:1px solid var(--line);color:var(--ink);text-decoration:none;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
#panel li a:hover{border-color:var(--acc);color:var(--acc)}
#panel .close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
#hint{position:fixed;bottom:24px;right:28px;color:var(--dim);font-size:12px;pointer-events:none}
#stats{position:fixed;top:64px;right:28px;color:var(--dim);font-size:12px;text-align:right;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
<header><h1>Universo de Palavras</h1><span>Dicionário Criativo</span></header>

<div id="stats"></div>

<button class="close" id="close">×</button>

<div id="hint">arraste para girar · clique numa palavra</div>

const WORDS = Object.keys(DATA);
const N = WORDS.length;
const idx = new Map(WORDS.map((w,i)=>[w,i]));

// build edges (undirected, dedup)
const edges = [];
const eset = new Set();
for (const w of WORDS) for (const l of DATA[w].sin.concat(DATA[w].ana)) {
  const j = idx.get(l);
  if (j === undefined) continue;
  const i = idx.get(w);
  const key = i<j ? i+"-"+j : j+"-"+i;
  if (!eset.has(key)) { eset.add(key); edges.push([i,j]); }
}

// degree
const deg = new Array(N).fill(0);
for (const [a,b] of edges){ deg[a]++; deg[b]++; }

// layout: 3D force-directed (simple)
const pos = new Float32Array(N*3);
const vel = new Float32Array(N*3);
for (let i=0;i<N;i++){
  // spherical initial
  const t = i/N*Math.PI*2, r = 60+ (i%7)*4;
  pos[i*3]   = Math.cos(t)*r + (Math.random()-.5)*20;
  pos[i*3+1] = (Math.random()-.5)*80;
  pos[i*3+2] = Math.sin(t)*r + (Math.random()-.5)*20;
}
function tick(){
  const rep = 900, k = 0.02, damp = 0.85;
  for (let i=0;i<N;i++){
    for (let j=i+1;j<N;j++){
      let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      let d2 = dx*dx+dy*dy+dz*dz + 0.01;
      let f = rep/d2;
      let d = Math.sqrt(d2);
      dx/=d; dy/=d; dz/=d;
      vel[i*3]+=dx*f; vel[i*3+1]+=dy*f; vel[i*3+2]+=dz*f;
      vel[j*3]-=dx*f; vel[j*3+1]-=dy*f; vel[j*3+2]-=dz*f;
    }
  }
  for (const [a,b] of edges){
    let dx=pos[b*3]-pos[a*3], dy=pos[b*3+1]-pos[a*3+1], dz=pos[b*3+2]-pos[a*3+2];
    let d = Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    let f = (d-28)*k;
    dx/=d; dy/=d; dz/=d;
    vel[a*3]+=dx*f; vel[a*3+1]+=dy*f; vel[a*3+2]+=dz*f;
    vel[b*3]-=dx*f; vel[b*3+1]-=dy*f; vel[b*3+2]-=dz*f;
  }
  for (let i=0;i<N;i++){
    // centering
    vel[i*3]-=pos[i*3]*0.002; vel[i*3+1]-=pos[i*3+1]*0.002; vel[i*3+2]-=pos[i*3+2]*0.002;
    vel[i*3]*=damp; vel[i*3+1]*=damp; vel[i*3+2]*=damp;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}
for (let s=0;s<300;s++) tick();

// three.js scene
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0e14, 0.0035);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0,0,180);

// nodes: spheres sized by degree
const nodeGeo = new THREE.SphereGeometry(1, 12, 12);
const nodeMat = new THREE.MeshBasicMaterial({color:0x8a8f98});
const nodes = [];
for (let i=0;i<N;i++){
  const m = nodeMat.clone();
  const mesh = new THREE.Mesh(nodeGeo, m);
  const s = 0.6 + Math.min(deg[i],16)*0.16;
  mesh.scale.setScalar(s);
  mesh.position.set(pos[i*3], pos[i*3+1], pos[i*3+2]);
  mesh.userData.i = i;
  scene.add(mesh);
  nodes.push(mesh);
}
// edges: lines
const lineGeo = new THREE.BufferGeometry();
const linePos = new Float32Array(edges.length*6);
edges.forEach(([a,b],e)=>{
  linePos[e*6]=pos[a*3]; linePos[e*6+1]=pos[a*3+1]; linePos[e*6+2]=pos[a*3+2];
  linePos[e*6+3]=pos[b*3]; linePos[e*6+4]=pos[b*3+1]; linePos[e*6+5]=pos[b*3+2];
});
lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos,3));
const lineMat = new THREE.LineBasicMaterial({color:0x2a2f3a, transparent:true, opacity:0.5});
scene.add(new THREE.LineSegments(lineGeo, lineMat));

// labels: sprites for top words + selected
function makeLabel(text, big){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const fs = big?44:28;
  ctx.font = `600 ${fs}px Inter, sans-serif`;
  const w = ctx.measureText(text).width + 20;
  c.width = w; c.height = fs+16;
  const ctx2 = c.getContext("2d");
  ctx2.font = `600 ${fs}px Inter, sans-serif`;
  ctx2.fillStyle = big ? "#e0b34c" : "#e8e6e1";
  ctx2.textBaseline = "middle";
  ctx2.fillText(text, 10, c.height/2);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const sp = new THREE.Sprite(mat);
  const scale = big?0.28:0.16;
  sp.scale.set(c.width*scale, c.height*scale, 1);
  return sp;
}
const labels = [];
const topWords = [...WORDS].sort((a,b)=>deg[idx.get(b)]-deg[idx.get(a)]).slice(0,12);
for (const w of topWords){
  const i = idx.get(w);
  const sp = makeLabel(w, false);
  sp.position.set(pos[i*3], pos[i*3+1]+1.8, pos[i*3+2]);
  scene.add(sp); labels.push(sp);
}

// interaction: rotate on drag
let dragging=false, px=0, py=0, rotX=0, rotY=0;
renderer.domElement.addEventListener("pointerdown", e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener("pointerup", ()=>dragging=false);
addEventListener("pointermove", e=>{
  if(!dragging) return;
  rotY += (e.clientX-px)*0.005;
  rotX += (e.clientY-py)*0.005;
  px=e.clientX; py=e.clientY;
});
// click to select
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
renderer.domElement.addEventListener("click", e=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(nodes);
  if (hits.length) select(WORDS[hits[0].object.userData.i]);
});

// highlight
let selected = null;
const hlMat = new THREE.MeshBasicMaterial({color:0xe0b34c});
const dimMat = new THREE.MeshBasicMaterial({color:0x232833});
function select(w){
  selected = w;
  const i = idx.get(w);
  const neigh = new Set([i]);
  for (const l of DATA[w].sin.concat(DATA[w].ana)) { const j=idx.get(l); if(j!==undefined) neigh.add(j); }
  nodes.forEach((n,k)=>{
    n.material = neigh.has(k) ? (k===i?hlMat:nodeMat) : dimMat;
  });
  // panel
  const p = document.getElementById("panel");
  p.hidden = false;
  document.getElementById("pword").textContent = w;
  const tema = (DATA[w] && DATA[w].tema) || "";
  document.getElementById("ptema").textContent = tema ? "Tema: "+tema : "";
  const sin = DATA[w].sin || [];
  const ana = DATA[w].ana || [];
  document.getElementById("psin").innerHTML = sin.map(x=>`<li><a data-w="${x}">${x}</a></li>`).join("") || "<li><span style='color:var(--dim)'>—</span></li>";
  document.getElementById("pana").innerHTML = ana.map(x=>`<li><a data-w="${x}">${x}</a></li>`).join("") || "<li><span style='color:var(--dim)'>—</span></li>";
  p.querySelectorAll("a").forEach(a=>a.onclick=()=>select(a.dataset.w));
  history.replaceState(null,"","?word="+encodeURIComponent(w));
}
document.getElementById("close").onclick = ()=>{
  document.getElementById("panel").hidden = true;
  selected = null;
  nodes.forEach(n=>n.material=nodeMat);
  history.replaceState(null,"",location.pathname);
};

// search
const search = document.getElementById("search");
search.addEventListener("input", ()=>{
  const q = search.value.trim().toLowerCase();
  if (!q) return;
  const hit = WORDS.find(w=>w.toLowerCase()===q) || WORDS.find(w=>w.toLowerCase().startsWith(q));
  if (hit) select(hit);
});

// stats
document.getElementById("stats").textContent = N+" palavras · "+edges.length+" relações";

// ?word= deep link
const qp = new URLSearchParams(location.search).get("word");
if (qp) {
  const hit = WORDS.find(w=>w.toLowerCase()===qp.toLowerCase());
  if (hit) select(hit);
}

// animate
function loop(){
  requestAnimationFrame(loop);
  if (!dragging) rotY += 0.0012;
  scene.rotation.y = rotY;
  scene.rotation.x = rotX;
  renderer.render(scene, camera);
}
loop();
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
