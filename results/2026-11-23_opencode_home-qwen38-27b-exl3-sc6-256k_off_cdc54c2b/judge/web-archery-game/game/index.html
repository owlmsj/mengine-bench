<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Blaster '95</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { image-rendering:pixelated; cursor:crosshair; }
  .overlay {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    background:rgba(10,10,30,.82); z-index:10;
    font-family:'Press Start 2P', monospace; color:#fff; text-align:center;
  }
  .overlay h1 { font-size:clamp(22px,5vw,44px); color:#ffd23f; text-shadow:4px 4px 0 #b33, 8px 8px 0 #222; letter-spacing:2px; }
  .overlay p { font-family:'VT323',monospace; font-size:clamp(18px,2.6vw,26px); color:#cfe8ff; line-height:1.5; }
  .overlay .big { font-size:clamp(26px,4vw,38px); color:#ff5d5d; }
  .btn {
    font-family:'Press Start 2P',monospace; font-size:clamp(14px,2vw,20px);
    padding:18px 34px; color:#111; background:#ffd23f; border:4px solid #fff;
    box-shadow:0 8px 0 #a06a00, 0 12px 0 #333; cursor:pointer;
  }
  .btn:active { transform:translateY(6px); box-shadow:0 2px 0 #a06a00, 0 4px 0 #333; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="overlay" id="startScr">
  <h1>BALLOON BLASTER '95</h1>
  <p>Hold the mouse to draw the bow, aim with the cursor.<br>
     Release to shoot. Pop 15 balloons to win!<br>
     Miss 3 times and the level is lost.</p>
  <button class="btn" id="startBtn">START</button>
</div>
<div class="overlay hidden" id="endScr">
  <h1 id="endTitle">YOU WIN!</h1>
  <p id="endText"></p>
  <button class="btn" id="againBtn">PLAY AGAIN</button>
</div>
<script>
(() => {
"use strict";
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W = 0, H = 0;
function resize(){
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
}
window.addEventListener('resize', resize); resize();

// ---------- audio ----------
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(f0, f1, dur, type, vol, when=0){
  const a = ac(), t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol, hp=800, when=0){
  const a = ac(), t = a.currentTime + when;
  const n = Math.floor(a.sampleRate*dur), buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type='highpass'; f.frequency.value = hp;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
const sfx = {
  draw(){ tone(120, 260, 0.25, 'sawtooth', 0.05); },
  shoot(){ noise(0.12, 0.25, 1200); tone(300, 90, 0.1, 'square', 0.12); },
  pop(big){
    tone(big?900:1300, big?200:300, 0.12, 'square', 0.22);
    noise(0.08, 0.3, 2000);
    if(big){ tone(1800, 400, 0.18, 'triangle', 0.15, 0.03); }
  },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,f,0.18,'square',0.15,i*0.12)); },
  lose(){ [392,330,262,196].forEach((f,i)=>tone(f,f*0.9,0.25,'sawtooth',0.15,i*0.18)); },
};

// ---------- state ----------
const WIN_SCORE = 15, MAX_MISS = 3;
let state = 'menu'; // menu | play | win | lose
let score = 0, misses = 0, shots = 0;
let balloons = [], arrows = [], parts = [], floaters = [];
let mouse = {x:0, y:0, down:false};
let drawT = 0; // 0..1 bow draw
let shake = 0;
const archer = { x:0, y:0 };

function archerPos(){ archer.x = W*0.12; archer.y = H*0.78; }

const COLORS = [
  ['#ff4d6d','#c9184a'], ['#ffd23f','#e09f00'], ['#4dd2ff','#0096c7'],
  ['#7cff6b','#2f9e44'], ['#c77dff','#7b2cbf'], ['#ff9e4d','#d9480f'],
];

function spawnBalloon(){
  const big = Math.random() < 0.18;
  const r = big ? 34+Math.random()*10 : 22+Math.random()*10;
  const c = COLORS[(Math.random()*COLORS.length)|0];
  balloons.push({
    x: W*0.3 + Math.random()*W*0.65,
    y: H + r + 10,
    r, c, big,
    vy: -(big? 0.7 : 1.0 + Math.random()*0.7),
    sway: Math.random()*Math.PI*2,
    swayAmp: 12 + Math.random()*18,
    swaySpd: 0.6 + Math.random()*0.8,
    t: 0,
  });
}

function reset(){
  score = 0; misses = 0; shots = 0;
  balloons = []; arrows = []; parts = []; floaters = [];
  for(let i=0;i<5;i++) spawnBalloon();
}

// ---------- input ----------
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mousedown', e => { if(e.button===0) mouse.down = true; });
window.addEventListener('mouseup', e => { if(e.button===0) mouse.down = false; });
window.addEventListener('touchstart', e => { const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY; mouse.down=true; }, {passive:true});
window.addEventListener('touchmove', e => { const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY; }, {passive:true});
window.addEventListener('touchend', () => mouse.down=false);

document.getElementById('startBtn').onclick = () => { ac(); sfx.draw(); state='play'; reset();
  document.getElementById('startScr').classList.add('hidden'); };
document.getElementById('againBtn').onclick = () => { ac(); state='play'; reset();
  document.getElementById('endScr').classList.add('hidden'); };

// ---------- shooting ----------
function fire(){
  const power = Math.min(1, drawT);
  if(power < 0.15) return;
  const a = Math.atan2(mouse.y - archer.y, mouse.x - archer.x);
  const sp = 9 + power*11;
  arrows.push({ x: archer.x + Math.cos(a)*34, y: archer.y + Math.sin(a)*34,
                vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, a, life:0 });
  shots++;
  sfx.shoot();
  shake = Math.min(6, 2 + power*4);
  for(let i=0;i<6;i++) parts.push({x:archer.x+Math.cos(a)*34, y:archer.y+Math.sin(a)*34,
    vx:Math.cos(a+ (Math.random()-0.5))*2, vy:Math.sin(a+(Math.random()-0.5))*2,
    life:0.25, max:0.25, col:'#fff', r:2});
}

function burst(b){
  const n = b.big ? 26 : 16;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 2+Math.random()*4;
    parts.push({x:b.x, y:b.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1,
      life:0.5+Math.random()*0.3, max:0.8, col:b.c[0], r:2+Math.random()*3});
  }
  floaters.push({x:b.x, y:b.y, txt: b.big?'+2':'+1', t:0, col:b.c[0]});
  sfx.pop(b.big);
  shake = Math.min(8, shake + (b.big?5:2.5));
}

// ---------- update ----------
let last = performance.now();
function update(dt){
  archerPos();
  if(state === 'play'){
    drawT = mouse.down ? Math.min(1, drawT + dt*1.6) : Math.max(0, drawT - dt*3);
    if(!mouse.down && drawT > 0.02 && drawT < 1) { /* decaying */ }
    if(mouse.down && drawT >= 1) { fire(); drawT = 0; mouse.down = false; }
    // spawn
    if(balloons.length < 6 && Math.random() < dt*1.2) spawnBalloon();
    // balloons
    for(let i=balloons.length-1;i>=0;i--){
      const b = balloons[i];
      b.t += dt;
      b.y += b.vy;
      b.x += Math.sin(b.t*b.swaySpd + b.sway) * b.swayAmp * dt;
      if(b.y < -b.r - 20){ balloons.splice(i,1); }
    }
    // arrows
    for(let i=arrows.length-1;i>=0;i--){
      const ar = arrows[i];
      ar.life += dt;
      ar.x += ar.vx; ar.y += ar.vy;
      ar.a = Math.atan2(ar.vy, ar.vx);
      let hit = false;
      for(let j=balloons.length-1;j>=0;j--){
        const b = balloons[j];
        const dx = ar.x-b.x, dy = ar.y-b.y;
        if(dx*dx+dy*dy < (b.r+4)*(b.r+4)){
          burst(b); balloons.splice(j,1); hit = true;
          score += b.big?2:1;
          if(score >= WIN_SCORE){ state='win'; sfx.win(); showEnd(true); }
          break;
        }
      }
      if(hit || ar.x < -50 || ar.x > W+50 || ar.y > H+50 || ar.y < -200){
        arrows.splice(i,1);
        if(!hit && ar.y > H+50) { misses++; if(misses >= MAX_MISS){ state='lose'; sfx.lose(); showEnd(false); } }
      }
    }
  }
  // particles always
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt;
    p.x += p.vx; p.y += p.vy; p.vy += 0.15;
    if(p.life <= 0) parts.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i]; f.t += dt; f.y -= 30*dt;
    if(f.t > 0.9) floaters.splice(i,1);
  }
  shake = Math.max(0, shake - dt*22);
}

function showEnd(win){
  const t = document.getElementById('endTitle');
  const p = document.getElementById('endText');
  if(win){ t.textContent = 'LEVEL CLEAR!'; t.style.color = '#7cff6b';
    p.textContent = `Score ${score}  ·  Shots ${shots}  ·  Accuracy ${shots?Math.round(100*score/shots):0}%`;
  } else { t.textContent = 'OUT OF ARROWS!'; t.style.color = '#ff5d5d';
    p.textContent = `You popped ${score} of ${WIN_SCORE} balloons. So close!`;
  }
  setTimeout(()=>document.getElementById('endScr').classList.remove('hidden'), win?400:700);
}

// ---------- draw ----------
function drawSky(){
  const g = cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1b2a6b'); g.addColorStop(0.55,'#3a4fb0'); g.addColorStop(1,'#7a5fc0');
  cx.fillStyle = g; cx.fillRect(0,0,W,H);
  // stars
  cx.fillStyle = 'rgba(255,255,255,.7)';
  for(let i=0;i<40;i++){
    const x = (i*97.3)%W, y = (i*57.7)%(H*0.5);
    const tw = 0.4+0.6*Math.abs(Math.sin(performance.now()/700 + i));
    cx.globalAlpha = tw*0.8; cx.fillRect(x, y, 2, 2);
  }
  cx.globalAlpha = 1;
  // ground
  cx.fillStyle = '#233d2b'; cx.fillRect(0, H*0.86, W, H*0.14);
  cx.fillStyle = '#2f5238'; cx.fillRect(0, H*0.86, W, 6);
}

function drawArcher(){
  const a = Math.atan2(mouse.y - archer.y, mouse.x - archer.x);
  cx.save(); cx.translate(archer.x, archer.y);
  // body
  cx.fillStyle = '#5a3d2b'; cx.fillRect(-10, -6, 20, 26); // torso
  cx.fillStyle = '#e8b88a'; cx.beginPath(); cx.arc(0, -14, 9, 0, 7); cx.fill(); // head
  cx.fillStyle = '#7b3f00'; cx.fillRect(-9, -22, 18, 5); // hat
  // bow arm + bow
  cx.rotate(a);
  const pull = drawT * 22;
  cx.strokeStyle = '#8a5a2b'; cx.lineWidth = 4;
  cx.beginPath(); cx.arc(26, 0, 26, -1.15, 1.15); cx.stroke();
  // string
  cx.strokeStyle = '#eee'; cx.lineWidth = 1.5;
  const s1 = {x:26+26*Math.cos(-1.15), y:26*Math.sin(-1.15)};
  const s2 = {x:26+26*Math.cos(1.15), y:26*Math.sin(1.15)};
  cx.beginPath(); cx.moveTo(s1.x, s1.y); cx.lineTo(26-pull, 0); cx.lineTo(s2.x, s2.y); cx.stroke();
  // nocked arrow
  if(drawT > 0.05){
    cx.strokeStyle = '#d9c9a3'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(26-pull, 0); cx.lineTo(26-pull+30, 0); cx.stroke();
    cx.fillStyle = '#ccc';
    cx.beginPath(); cx.moveTo(26-pull+36,0); cx.lineTo(26-pull+28,-4); cx.lineTo(26-pull+28,4); cx.fill();
  }
  cx.restore();
  // power meter
  if(state==='play' && drawT > 0.02){
    const pw = 60, ph = 8, px = archer.x - pw/2, py = archer.y + 34;
    cx.fillStyle = '#000a'; cx.fillRect(px-2, py-2, pw+4, ph+4);
    const g = cx.createLinearGradient(px,0,px+pw,0);
    g.addColorStop(0,'#7cff6b'); g.addColorStop(0.6,'#ffd23f'); g.addColorStop(1,'#ff4d4d');
    cx.fillStyle = g; cx.fillRect(px, py, pw*drawT, ph);
  }
}

function drawBalloon(b){
  cx.save(); cx.translate(b.x, b.y);
  // string
  cx.strokeStyle = 'rgba(255,255,255,.55)'; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(0, b.r);
  cx.quadraticCurveTo(4, b.r+12, -2, b.r+24); cx.stroke();
  // body
  const g = cx.createRadialGradient(-b.r*0.3, -b.r*0.35, b.r*0.15, 0, 0, b.r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, b.c[0]); g.addColorStop(1, b.c[1]);
  cx.fillStyle = g;
  cx.beginPath(); cx.ellipse(0, 0, b.r*0.88, b.r, 0, 0, 7); cx.fill();
  // knot
  cx.fillStyle = b.c[1];
  cx.beginPath(); cx.moveTo(0, b.r); cx.lineTo(-5, b.r+7); cx.lineTo(5, b.r+7); cx.fill();
  // shine
  cx.fillStyle = 'rgba(255,255,255,.5)';
  cx.beginPath(); cx.ellipse(-b.r*0.3, -b.r*0.4, b.r*0.18, b.r*0.28, -0.5, 0, 7); cx.fill();
  cx.restore();
}

function drawArrow(ar){
  cx.save(); cx.translate(ar.x, ar.y); cx.rotate(ar.a);
  cx.strokeStyle = '#d9c9a3'; cx.lineWidth = 3;
  cx.beginPath(); cx.moveTo(-16,0); cx.lineTo(10,0); cx.stroke();
  cx.fillStyle = '#ccc';
  cx.beginPath(); cx.moveTo(16,0); cx.lineTo(8,-4); cx.lineTo(8,4); cx.fill();
  cx.fillStyle = '#fff';
  cx.beginPath(); cx.moveTo(-16,0); cx.lineTo(-20,-3); cx.lineTo(-18,0); cx.lineTo(-20,3); cx.fill();
  cx.restore();
}

function drawHUD(){
  cx.font = '20px "Press Start 2P", monospace';
  cx.textAlign = 'left';
  cx.fillStyle = '#0008'; cx.fillRect(12, 12, 220, 84);
  cx.fillStyle = '#ffd23f';
  cx.fillText('SCORE '+score+' / '+WIN_SCORE, 24, 40);
  // misses as X marks
  cx.fillStyle = '#ff5d5d';
  let s = 'MISS ';
  for(let i=0;i<MAX_MISS;i++) s += i < misses ? '✕' : '·';
  cx.fillText(s, 24, 78);
  // crosshair
  cx.strokeStyle = '#fff'; cx.lineWidth = 2;
  cx.beginPath(); cx.arc(mouse.x, mouse.y, 12, 0, 7); cx.stroke();
  cx.beginPath();
  cx.moveTo(mouse.x-18, mouse.y); cx.lineTo(mouse.x-6, mouse.y);
  cx.moveTo(mouse.x+6, mouse.y); cx.lineTo(mouse.x+18, mouse.y);
  cx.moveTo(mouse.x, mouse.y-18); cx.lineTo(mouse.x, mouse.y-6);
  cx.moveTo(mouse.x, mouse.y+6); cx.lineTo(mouse.x, mouse.y+18);
  cx.stroke();
}

function draw(){
  cx.save();
  if(shake > 0) cx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawSky();
  balloons.forEach(drawBalloon);
  arrows.forEach(drawArrow);
  // particles
  parts.forEach(p => {
    cx.globalAlpha = Math.max(0, p.life/p.max);
    cx.fillStyle = p.col;
    cx.fillRect(p.x-p.r/2, p.y-p.r/2, p.r, p.r);
  });
  cx.globalAlpha = 1;
  drawArcher();
  // floaters
  floaters.forEach(f => {
    cx.globalAlpha = 1 - f.t/0.9;
    cx.font = 'bold 22px "VT323", monospace';
    cx.textAlign = 'center';
    cx.fillStyle = f.col;
    cx.fillText(f.txt, f.x, f.y);
  });
  cx.globalAlpha = 1;
  if(state === 'play') drawHUD();
  cx.restore();
}

function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
