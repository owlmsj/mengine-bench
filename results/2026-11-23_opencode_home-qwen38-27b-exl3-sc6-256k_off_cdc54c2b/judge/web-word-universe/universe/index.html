<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--ink:#e8e4da;--dim:#8a8577;--accent:#c9a96e;--accent2:#7ea8a0;--card:#131824}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
#ui{position:fixed;top:0;left:0;right:0;padding:20px 28px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10}
#ui *{pointer-events:auto}
h1{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--ink);letter-spacing:.02em}
h1 span{color:var(--accent)}
#search{background:rgba(19,24,36,.85);border:1px solid #2a3040;border-radius:8px;padding:8px 14px;color:var(--ink);font-size:14px;width:220px;outline:none;backdrop-filter:blur(6px)}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--dim)}
#hint{font-size:11px;color:var(--dim);margin-top:6px;text-align:right}
#panel{position:fixed;right:24px;top:80px;width:300px;max-height:calc(100vh - 104px);overflow-y:auto;background:rgba(19,24,36,.92);border:1px solid #2a3040;border-radius:12px;padding:20px;backdrop-filter:blur(8px);z-index:10;display:none}
#panel.show{display:block}
#panel h2{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--accent);margin-bottom:4px}
#panel .theme{font-size:12px;color:var(--accent2);margin-bottom:14px;font-style:italic}
#panel .sec{margin-bottom:14px}
#panel .sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:6px}
#panel .sec a{display:inline-block;background:#1c2333;border:1px solid #2a3040;border-radius:6px;padding:3px 10px;margin:0 4px 6px 0;font-size:13px;color:var(--ink);text-decoration:none;cursor:pointer;transition:border-color .15s}
#panel .sec a:hover{border-color:var(--accent)}
#panel .count{font-size:12px;color:var(--dim);margin-bottom:10px}
#stats{position:fixed;bottom:20px;left:28px;font-size:12px;color:var(--dim);z-index:10}
#stats b{color:var(--accent)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <div>
    <h1>Universo de <span>Palavras</span></h1>
    <div id="hint">clique num nó ou busque</div>
  </div>
  <div>
    <input id="search" placeholder="buscar palavra…" autocomplete="off">
  </div>
</div>
<div id="panel"></div>
<div id="stats"></div>

const pos = new Float32Array(N*3);
const vel = new Float32Array(N*3);
for (let i=0;i<N;i++){
  const t = Math.acos(2*Math.random()-1), p = Math.random()*Math.PI*2, r = 30+Math.random()*20;
  pos[i*3]=r*Math.sin(t)*Math.cos(p); pos[i*3+1]=r*Math.sin(t)*Math.sin(p); pos[i*3+2]=r*Math.cos(t);
}
for (let iter=0; iter<300; iter++){
  for (let i=0;i<N;i++){
    for (let j=i+1;j<N;j++){
      let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      let d2=dx*dx+dy*dy+dz*dz+0.01, d=Math.sqrt(d2);
      let f=120/d2; dx/=d; dy/=d; dz/=d;
      vel[i*3]+=dx*f; vel[i*3+1]+=dy*f; vel[i*3+2]+=dz*f;
      vel[j*3]-=dx*f; vel[j*3+1]-=dy*f; vel[j*3+2]-=dz*f;
    }
  }
  for (const [a,b] of edges){
    let dx=pos[b*3]-pos[a*3], dy=pos[b*3+1]-pos[a*3+1], dz=pos[b*3+2]-pos[a*3+2];
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01, f=(d-12)*0.04;
    dx/=d; dy/=d; dz/=d;
    vel[a*3]+=dx*f; vel[a*3+1]+=dy*f; vel[a*3+2]+=dz*f;
    vel[b*3]-=dx*f; vel[b*3+1]-=dy*f; vel[b*3+2]-=dz*f;
  }
  for (let i=0;i<N;i++){
    vel[i*3]-=pos[i*3]*0.005; vel[i*3+1]-=pos[i*3+1]*0.005; vel[i*3+2]-=pos[i*3+2]*0.005;
    vel[i*3]*=0.85; vel[i*3+1]*=0.85; vel[i*3+2]*=0.85;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}

// ---- scene ----
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0,0,90);

const nodeGeo = new THREE.SphereGeometry(1, 12, 12);
const nodeGroup = new THREE.Group();
const nodeMeshes = [];
for (let i=0;i<N;i++){
  const s = 0.4 + Math.sqrt(deg[i])*0.35;
  const m = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({color:0xc9a96e}));
  m.scale.setScalar(s);
  m.position.set(pos[i*3], pos[i*3+1], pos[i*3+2]);
  m.userData.idx = i;
  nodeGroup.add(m);
  nodeMeshes.push(m);
}
scene.add(nodeGroup);

const epos = new Float32Array(edges.length*6);
edges.forEach(([a,b],k)=>{
  epos[k*6]=pos[a*3]; epos[k*6+1]=pos[a*3+1]; epos[k*6+2]=pos[a*3+2];
  epos[k*6+3]=pos[b*3]; epos[k*6+4]=pos[b*3+1]; epos[k*6+5]=pos[b*3+2];
});
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.BufferAttribute(epos,3));
const edgeMat = new THREE.LineBasicMaterial({color:0x3a4258, transparent:true, opacity:0.5});
const lineObj = new THREE.LineSegments(edgeGeo, edgeMat);
scene.add(lineObj);

// labels
function makeLabel(text){
  const c = document.createElement('canvas');
  const fs = 48;
  let ctx = c.getContext('2d');
  ctx.font = fs+'px Inter, sans-serif';
  const w = Math.ceil(ctx.measureText(text).width)+16;
  c.width = w; c.height = fs+16;
  ctx = c.getContext('2d');
  ctx.font = fs+'px Inter, sans-serif';
  ctx.fillStyle = '#e8e4da';
  ctx.fillText(text, 8, fs);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  const sc = 0.05;
  sp.scale.set(w*sc, (fs+16)*sc, 1);
  return sp;
}
const labelGroup = new THREE.Group();
for (let i=0;i<N;i++){
  const sp = makeLabel(names[i]);
  sp.position.set(pos[i*3], pos[i*3+1]+1.2, pos[i*3+2]);
  labelGroup.add(sp);
}
scene.add(labelGroup);

// interaction
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function selectWord(name){
  const i = idx.get(name);
  if (i === undefined) return;
  const linked = new Set(adj[i]);
  nodeMeshes.forEach((m,k)=>{
    m.material.color.setHex(k===i ? 0xffd700 : linked.has(k) ? 0xc9a96e : 0x2a3040);
  });
  edgeMat.opacity = 0.15;
  const meta = META[name] || {synonyms:[], analogous:[], theme:null};
  const panel = document.getElementById('panel');
  panel.classList.add('show');
  const chips = arr => arr.map(s=>`<a data-w="${s}">${s}</a>`).join('') || '<span style="color:var(--dim)">—</span>';
  panel.innerHTML = '<h2>'+name+'</h2>'
    + (meta.theme ? '<div class="theme">Tema: '+meta.theme+'</div>' : '')
    + '<div class="count">'+deg[i]+' relações</div>'
    + '<div class="sec"><h3>Sinônimos</h3>'+chips(meta.synonyms)+'</div>'
    + '<div class="sec"><h3>Análogas</h3>'+chips(meta.analogous)+'</div>';
  panel.querySelectorAll('a[data-w]').forEach(a=>a.onclick=()=>selectWord(a.dataset.w));
  history.replaceState(null,'','?word='+encodeURIComponent(name));
}

function clearSelection(){
  nodeMeshes.forEach(m=>m.material.color.setHex(0xc9a96e));
  edgeMat.opacity = 0.5;
  document.getElementById('panel').classList.remove('show');
  history.replaceState(null,'','');
}

canvas.addEventListener('click', e=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodeMeshes);
  if (hits.length) selectWord(names[hits[0].object.userData.idx]);
  else clearSelection();
});

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', ()=>{
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { clearSelection(); return; }
  const match = names.find(n=>n===q) || names.find(n=>n.startsWith(q));
  if (match) selectWord(match);
});

// URL param
const params = new URLSearchParams(location.search);
const initWord = params.get('word');
if (initWord && idx.has(initWord.toLowerCase())) selectWord(initWord.toLowerCase());

// stats
const maxDeg = Math.max(...deg);
const topWords = names.filter((_,i)=>deg[i]===maxDeg).join(', ');
document.getElementById('stats').innerHTML =
  '<b>'+N+'</b> palavras · <b>'+edges.length+'</b> relações · mais conectadas: <b>'+topWords+'</b>';

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let rotY = 0;
function animate(){
  requestAnimationFrame(animate);
  rotY += 0.001;
  nodeGroup.rotation.y = rotY;
  labelGroup.rotation.y = rotY;
  lineObj.rotation.y = rotY;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
