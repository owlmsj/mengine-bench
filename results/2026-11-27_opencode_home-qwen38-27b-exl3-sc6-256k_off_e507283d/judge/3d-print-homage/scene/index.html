<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa - low poly wallpaper</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8dcc0}
  canvas{display:block}
  #label{position:fixed;left:14px;bottom:12px;font:12px/1.4 Georgia,serif;color:#2b4a6f;opacity:.75;pointer-events:none}
</style>
</head>
<body>
<div id="label">The Great Wave off Kanagawa &mdash; after Katsushika Hokusai (public domain)</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---- palette sampled from the print ----
const C = {
  paper:   0xe9ddc0,
  skyTop:  0xe6d9b8,
  skyLow:  0xcfc09c,
  waveDeep:0x1d3a5f,
  waveMid: 0x2e5f8a,
  waveLite:0x7fa8c9,
  foam:    0xf4efe2,
  fuji:    0x2b4a6f,
  fujiSnow:0xf4efe2,
  hull:    0xc98d5a,
  hullDark:0x8a5a33,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 80, 170);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8, 55);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const key = new THREE.DirectionalLight(0xfff6e0, 1.1);
key.position.set(-8, 16, 12);
scene.add(key);
scene.add(new THREE.AmbientLight(0xd8cbb0, 0.9));

const flat = (color) => new THREE.MeshLambertMaterial({color, flatShading:true});

// ---- sky gradient plane ----
{
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-100,50,0, 100,50,0, -100,-20,0, 100,-20,0]),3));
  const c = [C.skyTop,C.skyTop,C.skyLow,C.skyLow].map(h=>new THREE.Color(h).toArray()).flat();
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(c),3));
  g.setIndex([0,2,1, 1,2,3]);
  const sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide}));
  sky.position.z = -90;
  scene.add(sky);
}

// ---- Mt. Fuji: small cone in the gap, center-right, clearly visible ----
const fuji = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.ConeGeometry(8, 10, 7), flat(C.fuji));
  body.position.y = 5;
  fuji.add(body);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(3.8, 4.2, 7), flat(C.fujiSnow));
  cap.position.y = 8.4;
  fuji.add(cap);
}
fuji.position.set(7, -1.5, -26);
scene.add(fuji);

// ---- foam claw: row of shrinking foam blobs along a curling arc ----
function foamClaw(len, r0, n){
  const g = new THREE.Group();
  for (let i=0;i<n;i++){
    const t = i/(n-1);
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(r0*(1-t*0.55), 0), flat(C.foam));
    s.position.set(-len/2 + t*len, Math.sin(t*Math.PI*0.9)*r0*1.7, -t*len*0.2);
    s.scale.y = 0.85;
    g.add(s);
  }
  return g;
}

// ---- wave: solid curling mass = big base + rising curl of fat discs (overlapping, no gaps) ----
function makeWave({w=10, h=7, color=C.waveMid, curl=0.5, foam=true}={}){
  const g = new THREE.Group();
  // solid base mound
  const base = new THREE.Mesh(new THREE.CylinderGeometry(w*0.55, w*0.7, h*0.55, 9), flat(color));
  base.position.y = h*0.27;
  g.add(base);
  // rising curl: overlapping fat discs, each lower than the gap so no plate look
  const n = 8;
  for (let i=0;i<n;i++){
    const t = i/(n-1);
    const r = w*0.5*(1 - t*0.55);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1.4, 9), flat(color));
    m.position.y = h*0.45 + t*h*0.6;
    m.position.z = -t*t*h*curl;
    g.add(m);
  }
  if (foam){
    const claw = foamClaw(w*0.85, w*0.13, 12);
    claw.position.y = h*1.02;
    claw.position.z = -h*curl*0.7;
    g.add(claw);
  }
  return g;
}

// The Great Wave: left, tall, claw reaching right
const greatWave = makeWave({w:16, h:13, color:C.waveDeep, curl:0.55});
greatWave.position.set(-12, -4, 0);
scene.add(greatWave);

// mid wave, center
const wave2 = makeWave({w:11, h:8, color:C.waveMid, curl:0.45});
wave2.position.set(-1, -5, 6);
scene.add(wave2);

// right wave
const wave3 = makeWave({w:13, h:9, color:C.waveMid, curl:0.5});
wave3.position.set(14, -5, 2);
scene.add(wave3);

// foreground trough: wide, low, pale
const wave4 = makeWave({w:20, h:4, color:C.waveLite, curl:0.3});
wave4.position.set(0, -11, 18);
scene.add(wave4);

// ---- boats ----
function makeBoat(scale=1){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(7, 1.0, 2.0), flat(C.hull));
  g.add(hull);
  const prow = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.7, 1.7), flat(C.hull));
  prow.position.set(3.7, 0.8, 0);
  prow.rotation.z = -0.55;
  g.add(prow);
  const stern = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.7, 1.7), flat(C.hull));
  stern.position.set(-3.7, 0.8, 0);
  stern.rotation.z = 0.55;
  g.add(stern);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(7.3, 0.22, 2.3), flat(C.hullDark));
  rail.position.y = 0.55;
  g.add(rail);
  for (let i=0;i<6;i++){
    const p = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4, 0), flat(C.waveDeep));
    p.position.set(-2.3 + i*0.92, 0.9, 0.3);
    g.add(p);
  }
  g.scale.setScalar(scale);
  return g;
}

// boat 1: left, cradled under the great wave
const boat1 = makeBoat(1.0);
boat1.position.set(-8, 4.5, 10);
boat1.rotation.y = 0.3;
scene.add(boat1);

// boat 2: right, on the right wave
const boat2 = makeBoat(1.0);
boat2.position.set(13, -0.5, 8);
boat2.rotation.y = -0.45;
scene.add(boat2);

// boat 3: foreground center, long, in the trough
const boat3 = makeBoat(1.3);
boat3.position.set(1, -5.5, 17);
boat3.rotation.y = 0.1;
scene.add(boat3);

// ---- gentle motion ----
const clock = new THREE.Clock();
const waves = [
  {o:greatWave, a:0.5, s:0.7, p:0},
  {o:wave2,     a:0.4, s:0.9, p:1.3},
  {o:wave3,     a:0.45,s:0.8, p:2.1},
  {o:wave4,     a:0.3, s:1.1, p:0.6},
];
const boats = [
  {o:boat1, a:0.3, s:0.8, p:0.4, y:0.5},
  {o:boat2, a:0.35,s:0.9, p:1.7, y:-0.5},
  {o:boat3, a:0.25,s:1.0, p:2.4, y:-6.5},
];

function tick(){
  const t = clock.getElapsedTime();
  for (const w of waves){
    w.o.position.y += Math.sin(t*w.s + w.p)*w.a*0.015;
    w.o.rotation.z = Math.sin(t*w.s*0.8 + w.p)*0.015;
  }
  for (const b of boats){
    b.o.position.y = b.y + Math.sin(t*b.s + b.p)*b.a*0.5;
    b.o.rotation.z = Math.sin(t*b.s*0.9 + b.p)*0.05;
    b.o.rotation.x = Math.cos(t*b.s*0.7 + b.p)*0.03;
  }
  camera.position.x = Math.sin(t*0.05)*1.0;
  camera.lookAt(0, 2, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
