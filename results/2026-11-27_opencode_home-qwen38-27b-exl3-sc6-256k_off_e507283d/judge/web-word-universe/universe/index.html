<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --panel:#11151f; --ink:#e8e6df; --dim:#8b93a7;
    --line:#232a3a; --gold:#e0b34c; --teal:#5cc8c0; --rose:#e07a9a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 70% -10%, #16203a 0%, var(--bg) 55%);
    color:var(--ink); font-family:Inter,system-ui,sans-serif; overflow:hidden;
  }
  #scene{position:fixed;inset:0}
  canvas{display:block}
  .ui{position:fixed;z-index:2}
  header.ui{top:0;left:0;right:0;padding:20px 26px;display:flex;align-items:baseline;gap:16px;pointer-events:none}
  header h1{font-family:Fraunces,serif;font-weight:600;font-size:26px;margin:0;letter-spacing:.3px}
  header .sub{color:var(--dim);font-size:13px}
  #search{
    position:fixed;top:18px;right:26px;z-index:3;
    background:rgba(17,21,31,.85);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px);
  }
  #search input{
    background:transparent;border:0;outline:0;color:var(--ink);font:15px Inter;
    width:190px;
  }
  #search input::placeholder{color:var(--dim)}
  #stats{
    position:fixed;left:26px;bottom:22px;z-index:2;color:var(--dim);font-size:12.5px;
    line-height:1.7;pointer-events:none;
  }
  #stats b{color:var(--ink);font-weight:600}
  #panel{
    position:fixed;right:26px;bottom:22px;z-index:3;width:300px;max-height:60vh;overflow:auto;
    background:rgba(17,21,31,.92);border:1px solid var(--line);border-radius:16px;
    padding:18px 20px;backdrop-filter:blur(8px);display:none;
  }
  #panel h2{font-family:Fraunces,serif;font-size:24px;margin:0 0 2px;font-weight:600}
  #panel .tema{color:var(--teal);font-size:12.5px;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px}
  #panel h3{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);margin:14px 0 8px}
  #panel ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  #panel li a{
    display:inline-block;padding:5px 11px;border-radius:999px;font-size:13px;
    background:#1a2130;border:1px solid var(--line);color:var(--ink);text-decoration:none;cursor:pointer;
  }
  #panel li a:hover{border-color:var(--gold);color:var(--gold)}
  #hint{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;
    color:var(--dim);font-size:12.5px;pointer-events:none;
  }
  .close{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer}
  .close:hover{color:var(--ink)}
</style>
</head>
<body>
<div id="scene"></div>
<header class="ui">
  <h1>Universo de Palavras</h1>
  <span class="sub">dicionário criativo — 250 palavras, 599 laços</span>
</header>
<div id="search">
  <input id="q" type="text" placeholder="buscar palavra…" autocomplete="off" spellcheck="false">
</div>
<div id="stats"></div>
<div id="hint">clique numa palavra · arraste para girar · role para zoom</div>
<aside id="panel">
  <button class="close" id="close">×</button>
  <h2 id="p-word"></h2>
  <p class="tema" id="p-tema"></p>
  <h3>Conexões</h3>
  <ul id="p-links"></ul>
</aside>

/* ---- normalize for search ---- */
function norm(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
const byNorm = new Map(Object.keys(WORDS).map(w=>[norm(w),w]));

/* ---- graph layout: 3D force-directed, precomputed ---- */
const nodes = Object.keys(WORDS).map((w,i)=>({id:w,i}));
const idx = new Map(nodes.map(n=>[n.id,n.i]));
const edges = [];
for (const w of Object.keys(WORDS))
  for (const l of WORDS[w])
    if (idx.has(l) && w < l) edges.push([idx.get(w), idx.get(l)]);

const N = nodes.length;
const pos = new Float32Array(N*3);
for (let i=0;i<N;i++){
  const t=Math.acos(2*Math.random()-1), p=Math.random()*Math.PI*2, r=60+Math.random()*40;
  pos[i*3]=r*Math.sin(t)*Math.cos(p);
  pos[i*3+1]=r*Math.sin(t)*Math.sin(p);
  pos[i*3+2]=r*Math.cos(t);
}
/* simple force iterations */
const vel = new Float32Array(N*3);
const k = 14, rep = 900, spring = 0.02, center = 0.004;
for (let it=0; it<220; it++){
  for (let i=0;i<N;i++){
    let fx=0,fy=0,fz=0;
    for (let j=0;j<N;j++){
      if (i===j) continue;
      let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      let d2=dx*dx+dy*dy+dz*dz+0.01, d=Math.sqrt(d2);
      let f=rep/d2;
      fx+=dx/d*f; fy+=dy/d*f; fz+=dz/d*f;
    }
    fx-=pos[i*3]*center; fy-=pos[i*3+1]*center; fz-=pos[i*3+2]*center;
    vel[i*3]+=fx; vel[i*3+1]+=fy; vel[i*3+2]+=fz;
  }
  for (const [a,b] of edges){
    let dx=pos[b*3]-pos[a*3], dy=pos[b*3+1]-pos[a*3+1], dz=pos[b*3+2]-pos[a*3+2];
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    let f=(d-k)*spring;
    vel[a*3]+=dx/d*f; vel[a*3+1]+=dy/d*f; vel[a*3+2]+=dz/d*f;
    vel[b*3]-=dx/d*f; vel[b*3+1]-=dy/d*f; vel[b*3+2]-=dz/d*f;
  }
  for (let i=0;i<N;i++){
    vel[i*3]*=0.85; vel[i*3+1]*=0.85; vel[i*3+2]*=0.85;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}

/* ---- three.js scene ---- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0e14, 0.0035);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0,0,220);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("scene").appendChild(renderer.domElement);

/* nodes */
const nodeGeo = new THREE.SphereGeometry(1.6, 16, 16);
const nodeMats = [];
const nodeMeshes = [];
for (let i=0;i<N;i++){
  const w = nodes[i].id;
  const c = new THREE.Color(THEME_COLORS[THEME[w]] || "#8b93a7");
  const m = new THREE.MeshStandardMaterial({color:c, emissive:c, emissiveIntensity:0.25, roughness:0.5});
  const mesh = new THREE.Mesh(nodeGeo, m);
  mesh.position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
  const deg = WORDS[w].length;
  const s = 1 + Math.min(deg,10)*0.16;
  mesh.scale.setScalar(s);
  mesh.userData = {i, w};
  scene.add(mesh);
  nodeMeshes.push(mesh); nodeMats.push(m);
}
/* edges */
const edgeGeo = new THREE.BufferGeometry();
const ep = new Float32Array(edges.length*6);
edges.forEach((e,j)=>{
  ep[j*6]=pos[e[0]*3]; ep[j*6+1]=pos[e[0]*3+1]; ep[j*6+2]=pos[e[0]*3+2];
  ep[j*6+3]=pos[e[1]*3]; ep[j*6+4]=pos[e[1]*3+1]; ep[j*6+5]=pos[e[1]*3+2];
});
edgeGeo.setAttribute("position", new THREE.BufferAttribute(ep,3));
const edgeMat = new THREE.LineBasicMaterial({color:0x3a465e, transparent:true, opacity:0.35});
const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
scene.add(edgeLines);

/* labels: sprite per node */
function makeLabel(text){
  const cv=document.createElement("canvas"); cv.width=256; cv.height=64;
  const ctx=cv.getContext("2d");
  ctx.font="600 30px Inter, sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#e8e6df";
  ctx.fillText(text,128,32);
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  sp.scale.set(22,5.5,1);
  return sp;
}
const labels = nodeMeshes.map((m,i)=>{
  const sp = makeLabel(nodes[i].id);
  sp.position.copy(m.position).add(new THREE.Vector3(0, m.scale.x*1.6+3, 0));
  sp.material.opacity = 0.0;
  scene.add(sp);
  return sp;
});

/* lights */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(80,120,100); scene.add(dl);

/* orbit controls (manual) */
let rotX=0.15, rotY=0, dist=220, dragging=false, px=0, py=0;
const group = new THREE.Group();
scene.add(group);
group.add(edgeLines);
nodeMeshes.forEach(m=>group.add(m));
labels.forEach(l=>group.add(l));
renderer.domElement.addEventListener("pointerdown",e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointermove",e=>{
  if(!dragging) return;
  rotY += (e.clientX-px)*0.005; rotX += (e.clientY-py)*0.005;
  rotX = Math.max(-1.4, Math.min(1.4, rotX));
  px=e.clientX; py=e.clientY;
});
addEventListener("wheel",e=>{dist = Math.max(60, Math.min(500, dist + e.deltaY*0.2));},{passive:true});

/* raycast click */
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
renderer.domElement.addEventListener("click",e=>{
  mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(nodeMeshes);
  if (hits.length) select(hits[0].object.userData.w, false);
});

/* selection */
let selected = null;
function select(w, updateUrl){
  selected = w;
  const nbrs = new Set(WORDS[w]);
  nodeMats.forEach((m,i)=>{
    const id = nodes[i].id;
    if (id===w){ m.emissiveIntensity=0.9; m.color.set(0xffffff); }
    else if (nbrs.has(id)){ m.emissiveIntensity=0.55; m.color.set(new THREE.Color(THEME_COLORS[THEME[id]])); }
    else { m.emissiveIntensity=0.05; m.color.set(new THREE.Color(THEME_COLORS[THEME[id]]).multiplyScalar(0.4)); }
    labels[i].material.opacity = (id===w||nbrs.has(id)) ? 0.95 : 0.0;
  });
  /* panel */
  const panel = document.getElementById("panel");
  panel.style.display="block";
  document.getElementById("p-word").textContent = w;
  document.getElementById("p-tema").textContent = "tema: " + (THEME[w]||"");
  const ul = document.getElementById("p-links"); ul.innerHTML="";
  for (const l of WORDS[w]){
    const li=document.createElement("li");
    const a=document.createElement("a"); a.textContent=l;
    a.onclick=()=>select(l,true);
    li.appendChild(a); ul.appendChild(li);
  }
  if (updateUrl) history.replaceState(null,"","?word="+encodeURIComponent(w));
}
document.getElementById("close").onclick=()=>{
  document.getElementById("panel").style.display="none";
  selected=null;
  nodeMats.forEach((m,i)=>{
    m.emissiveIntensity=0.25;
    m.color.set(new THREE.Color(THEME_COLORS[THEME[nodes[i].id]]));
    labels[i].material.opacity=0.0;
  });
  history.replaceState(null,"","");
};

/* search */
const q = document.getElementById("q");
q.addEventListener("input",()=>{
  const v = norm(q.value.trim());
  if (!v){ return; }
  const match = [...byNorm.keys()].find(k=>k.startsWith(v));
  if (match) select(byNorm.get(match), false);
});
q.addEventListener("keydown",e=>{
  if (e.key==="Enter"){
    const v=norm(q.value.trim());
    const match=[...byNorm.keys()].find(k=>k.startsWith(v));
    if (match) select(byNorm.get(match), true);
  }
});

/* stats */
const deg = Object.fromEntries(Object.keys(WORDS).map(w=>[w,WORDS[w].length]));
const top = Object.entries(deg).sort((a,b)=>b[1]-a[1])[0];
const pairSet = new Set();
for (const w of Object.keys(WORDS)) for (const l of WORDS[w]) pairSet.add([w,l].sort().join("|"));
document.getElementById("stats").innerHTML =
  `<b>${Object.keys(WORDS).length}</b> palavras · <b>${pairSet.size}</b> laços<br>mais conectada: <b>${top[0]}</b> (${top[1]})`;

/* deep link ?word= */
const params = new URLSearchParams(location.search);
const init = params.get("word");
if (init){
  const v=norm(init);
  const match=[...byNorm.keys()].find(k=>k.startsWith(v));
  if (match) select(byNorm.get(match), false);
}

/* animate */
function tick(){
  requestAnimationFrame(tick);
  if (!dragging) rotY += 0.0006;
  group.rotation.y = rotY; group.rotation.x = rotX;
  camera.position.z = dist;
  renderer.render(scene, camera);
}
tick();
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
