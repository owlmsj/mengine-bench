<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pocket Sky Archery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142c4e;color:#fff;font-family:Fredoka,system-ui,sans-serif}body{display:grid;place-items:center}.frame{position:relative;width:min(100vw,150vh);height:min(100vh,66.667vw);max-width:1500px;max-height:1000px;overflow:hidden;background:#8ed8ef;box-shadow:0 24px 90px #071526aa;user-select:none}.top{position:absolute;z-index:3;left:3.2%;right:3.2%;top:4%;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}.brand{font-size:clamp(17px,2.5vw,34px);font-weight:700;letter-spacing:.02em;text-shadow:0 3px 0 #143b65}.brand small{display:block;margin-top:2px;font:700 clamp(8px,1vw,13px) 'DM Mono',monospace;letter-spacing:.18em;color:#1c5376;text-shadow:none}.stats{display:flex;gap:clamp(8px,1.2vw,18px)}.pill{min-width:clamp(72px,9vw,125px);padding:8px 13px 7px;border:2px solid #fff8;border-radius:14px;background:#fff2;color:#163958;box-shadow:0 4px 0 #28638733;text-align:center}.pill b{display:block;font:700 clamp(17px,2.1vw,27px) 'DM Mono',monospace;line-height:1}.pill span{display:block;margin-top:5px;font:700 clamp(7px,.8vw,10px) 'DM Mono',monospace;letter-spacing:.14em}.pill.score{background:#fff;color:#dc6e36;border-color:#fff}.pill.score b{color:#ef7844}.hudhint{position:absolute;z-index:3;left:50%;top:17%;transform:translateX(-50%);color:#1c5376;font:700 clamp(9px,1.15vw,14px) 'DM Mono',monospace;letter-spacing:.12em;white-space:nowrap;opacity:.82}.canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}.overlay{position:absolute;z-index:5;inset:0;display:grid;place-items:center;background:linear-gradient(#123c5a55,#17304f88);transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(440px,84%);padding:clamp(20px,4vw,42px);border:3px solid #fff;border-radius:26px;background:#fffaf0;color:#193957;text-align:center;box-shadow:0 10px 0 #17446155,0 28px 55px #15325055}.stamp{display:inline-block;padding:6px 12px;border-radius:99px;background:#ffd56b;color:#704622;font:700 10px 'DM Mono',monospace;letter-spacing:.14em}.card h1{margin:13px 0 5px;font-size:clamp(30px,5vw,52px);line-height:.98;color:#ef7844}.card p{margin:12px auto 22px;max-width:310px;font-size:clamp(14px,1.7vw,18px);line-height:1.4;color:#46627b}.button{border:0;border-radius:14px;padding:13px 26px;background:#ef7844;color:white;font:700 17px Fredoka,system-ui;box-shadow:0 5px 0 #bc512e;cursor:pointer;transition:transform .1s,box-shadow .1s}.button:hover{transform:translateY(-2px);box-shadow:0 7px 0 #bc512e}.button:active{transform:translateY(3px);box-shadow:0 2px 0 #bc512e}.footer{position:absolute;z-index:3;bottom:3%;left:3%;right:3%;display:flex;justify-content:space-between;pointer-events:none;color:#174664;font:700 clamp(8px,.95vw,12px) 'DM Mono',monospace;letter-spacing:.08em}.toast{position:absolute;z-index:4;left:50%;top:25%;transform:translate(-50%,-6px);padding:7px 13px;border-radius:99px;background:#fff;color:#db673b;font:700 clamp(12px,1.5vw,18px) 'DM Mono',monospace;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
</style></head>
<body><main class="frame" id="frame"><canvas class="canvas" id="game"></canvas><div class="top"><div class="brand">POCKET SKY<small>ARCHERY CLUB · LEVEL 01</small></div><div class="stats"><div class="pill score"><b id="score">000</b><span>POPS</span></div><div class="pill"><b id="arrows">12</b><span>ARROWS</span></div></div></div><div class="hudhint" id="hint">DRAG BACK · RELEASE TO SHOOT</div><div class="toast" id="toast">NICE SHOT!</div><div class="footer"><span>WIND <span id="wind">→ 2</span></span><span>POP 12 BALLOONS TO WIN</span></div><section class="overlay" id="overlay"><div class="card"><span class="stamp" id="stamp">A SUNNY LITTLE CHALLENGE</span><h1 id="title">Ready, archer?</h1><p id="copy">Twelve balloons. Twelve arrows. Pull back from the bow, line up a shot, and let the sky confetti begin.</p><button class="button" id="start">Let’s shoot!</button></div></section></main>
<script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),frame=document.getElementById('frame');const $=id=>document.getElementById(id);let W=1200,H=800,scale=1,active=false,ended=false,score=0,arrows=12,wind=2,drag=null,shots=[],balloons=[],particles=[],tick=0,last=0,audio=null,toastTimer=0;
const colors=['#ff6f61','#ffd166','#57c7b6','#9b8be8','#ff9f43','#f06292'];function resize(){const r=frame.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);scale=W/1200}window.addEventListener('resize',resize);resize();
function sound(freq,dur,type='sine',vol=.06,slide=0){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}catch(_){}}
function noise(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const n=audio.createBufferSource(),b=audio.createBuffer(1,audio.sampleRate*.12,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);n.buffer=b;const g=audio.createGain();g.gain.value=.12;n.connect(g).connect(audio.destination);n.start()}catch(_){}}
function reset(){score=0;arrows=12;shots=[];particles=[];balloons=[];wind=Math.random()<.5?-1:1;for(let i=0;i<12;i++){let col=colors[i%colors.length],x=510+(i%4)*155+(Math.random()*36-18),y=245+Math.floor(i/4)*133+(Math.random()*34-17);balloons.push({x,y,base:y,r:29+Math.random()*5,phase:Math.random()*6.28,speed:.7+Math.random()*.8,c:col,alive:true})}updateHud()}
function updateHud(){$('score').textContent=String(score).padStart(3,'0');$('arrows').textContent=String(arrows).padStart(2,'0');$('wind').textContent=(wind<0?'← ':'→ ')+Math.abs(wind*2)}function start(){reset();active=true;ended=false;$('overlay').classList.add('hidden');$('hint').textContent='DRAG BACK · RELEASE TO SHOOT';sound(520,.12,'sine',.05,180)}$('start').addEventListener('click',start);
function end(win){active=false;ended=true;$('stamp').textContent=win?'LEVEL COMPLETE':'OUT OF ARROWS';$('title').textContent=win?'Sky’s the limit!':'Good try, archer!';$('copy').textContent=win?`You popped all 12 balloons with ${arrows} arrow${arrows===1?'':'s'} to spare. That’s a perfect day at the range.`:`You popped ${score} of 12 balloons. The sky’s still full of targets — fancy another round?`;$('start').textContent='Play again';$('overlay').classList.remove('hidden');sound(win?740:180,.35,win?'triangle':'sine',.08,win?500:-60)}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*1200/r.width,y:(e.clientY-r.top)*800/r.height}}function bow(){return{x:150,y:526}}function down(e){if(!active||ended)return;const p=pos(e),b=bow();if(p.x>260||p.y<350||p.y>700)return;drag={x:p.x,y:p.y};canvas.setPointerCapture(e.pointerId);sound(150,.035,'triangle',.025)}function move(e){if(drag){const p=pos(e);drag.x=p.x;drag.y=p.y}}function up(e){if(!drag)return;const p=pos(e),b=bow(),dx=b.x-p.x,dy=b.y-p.y;drag=null;if(dx<7){return}const power=Math.min(1,Math.hypot(dx,dy)/230),ang=Math.atan2(dy,dx);if(power<.08)return;fire(ang,power)}canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',()=>drag=null);
function fire(a,p){if(arrows<=0)return;arrows--;updateHud();const b=bow(),speed=510+660*p;shots.push({x:b.x,y:b.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,rot:a,alive:true,age:0});sound(185+220*p,.16,'sawtooth',.045,-100);setTimeout(()=>sound(980,.07,'triangle',.018,-200),42)}
function pop(ball){if(!ball.alive)return;ball.alive=false;score++;updateHud();for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,s=50+Math.random()*220;particles.push({x:ball.x,y:ball.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.4,max:.9,c:ball.c,r:2+Math.random()*4,star:i%4===0})}for(let i=0;i<3;i++)setTimeout(()=>sound(460+i*170,.12,'sine',.065,250),i*35);noise();showToast(['POP!','BULLSEYE!','NICE SHOT!','CLEAN HIT!'][Math.floor(Math.random()*4)]);if(score>=12)setTimeout(()=>end(true),600);else if(arrows===0&&!shots.some(s=>s.alive))setTimeout(()=>end(false),700)}
function showToast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),650)}
function update(dt){tick+=dt;balloons.forEach(b=>{if(b.alive)b.y=b.base+Math.sin(tick*b.speed+b.phase)*15});for(const s of shots){if(!s.alive)continue;s.age+=dt;s.vy+=690*dt;s.vx+=wind*34*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot=Math.atan2(s.vy,s.vx);for(const b of balloons){if(!b.alive)continue;if(Math.hypot(s.x-b.x,s.y-b.y)<b.r+5){s.alive=false;pop(b);break}}if(s.x>1250||s.y>830||s.x<0||s.age>3)s.alive=false}shots=shots.filter(s=>s.alive);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.vx*=.985}particles=particles.filter(p=>p.life>0);if(active&&arrows===0&&shots.length===0&&!ended){setTimeout(()=>{if(active&&!shots.length)end(false)},350)}}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,800);g.addColorStop(0,'#8bd7ee');g.addColorStop(.66,'#d2f1e6');g.addColorStop(1,'#f9dfaa');ctx.fillStyle=g;ctx.fillRect(0,0,1200,800);ctx.fillStyle='#fff7c5';ctx.beginPath();ctx.arc(1010,145,62,0,Math.PI*2);ctx.fill();ctx.globalAlpha=.35;for(const c of [[235,150,1],[750,140,.7],[930,310,.55]]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(c[0],c[1],53*c[2],18*c[2],0,0,Math.PI*2);ctx.ellipse(c[0]+38*c[2],c[1]-9*c[2],30*c[2],20*c[2],0,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.fillStyle='#94c8a1';ctx.beginPath();ctx.moveTo(0,570);ctx.quadraticCurveTo(250,455,485,580);ctx.quadraticCurveTo(770,425,1200,570);ctx.lineTo(1200,800);ctx.lineTo(0,800);ctx.fill();ctx.fillStyle='#72b585';ctx.beginPath();ctx.moveTo(0,640);ctx.quadraticCurveTo(320,535,640,660);ctx.quadraticCurveTo(950,540,1200,620);ctx.lineTo(1200,800);ctx.lineTo(0,800);ctx.fill();ctx.fillStyle='#f5d79b';ctx.beginPath();ctx.ellipse(620,790,740,150,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#bc8453';ctx.fillRect(0,747,1200,53);ctx.fillStyle='#d9a66c';for(let i=0;i<18;i++){ctx.beginPath();ctx.ellipse(i*78+20,758+(i%2)*8,4,2,0,0,7);ctx.fill()}}
function balloon(b){if(!b.alive)return;ctx.save();ctx.translate(b.x,b.y);ctx.strokeStyle='#54738a';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,b.r+3);ctx.bezierCurveTo(7,b.r+22,-7,b.r+30,2,b.r+44);ctx.stroke();ctx.fillStyle=b.c;ctx.beginPath();ctx.ellipse(0,0,b.r*.78,b.r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.ellipse(-b.r*.27,-b.r*.35,b.r*.17,b.r*.28,-.4,0,Math.PI*2);ctx.fill();ctx.fillStyle=b.c;ctx.beginPath();ctx.moveTo(-6,b.r-2);ctx.lineTo(6,b.r-2);ctx.lineTo(0,b.r+7);ctx.fill();ctx.restore()}
function drawBow(){const b=bow();ctx.save();ctx.lineCap='round';ctx.strokeStyle='#71482c';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(b.x,b.y-80);ctx.quadraticCurveTo(b.x+49,b.y,b.x,b.y+80);ctx.stroke();ctx.strokeStyle='#f8e4bb';ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(b.x,b.y-80);ctx.lineTo(drag?drag.x:b.x+8,drag?drag.y:b.y);ctx.lineTo(b.x,b.y+80);ctx.stroke();ctx.strokeStyle='#d69345';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(b.x-2,b.y-76);ctx.quadraticCurveTo(b.x+39,b.y,b.x-2,b.y+76);ctx.stroke();ctx.fillStyle='#e9b95e';ctx.beginPath();ctx.arc(b.x,b.y,13,0,7);ctx.fill();ctx.restore();if(drag){const dx=b.x-drag.x,dy=b.y-drag.y,a=Math.atan2(dy,dx),p=Math.min(1,Math.hypot(dx,dy)/230);ctx.save();ctx.setLineDash([7,8]);ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(b.x,b.y);for(let t=0;t<1.1;t+=.08){const x=b.x+Math.cos(a)*(80+470*p)*t,y=b.y+Math.sin(a)*(80+470*p)*t+340*t*t;ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([]);ctx.restore()}}
function drawArrow(s){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.strokeStyle='#754a2c';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-25,0);ctx.lineTo(23,0);ctx.stroke();ctx.fillStyle='#f5dfbd';ctx.beginPath();ctx.moveTo(27,0);ctx.lineTo(17,-5);ctx.lineTo(18,5);ctx.fill();ctx.fillStyle='#ef7950';ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(-30,-8);ctx.lineTo(-16,0);ctx.lineTo(-30,8);ctx.fill();ctx.restore()}
function drawArcher(){const b=bow();ctx.save();ctx.fillStyle='#244c68';ctx.beginPath();ctx.ellipse(b.x-27,b.y+148,54,17,0,0,7);ctx.fill();ctx.fillStyle='#efbd84';ctx.beginPath();ctx.arc(b.x-8,b.y-24,22,0,7);ctx.fill();ctx.fillStyle='#58433d';ctx.beginPath();ctx.arc(b.x-13,b.y-33,23,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#3887a2';ctx.beginPath();ctx.moveTo(b.x-29,b.y+2);ctx.quadraticCurveTo(b.x+4,b.y-11,b.x+24,b.y+13);ctx.lineTo(b.x+36,b.y+128);ctx.lineTo(b.x-42,b.y+128);ctx.closePath();ctx.fill();ctx.strokeStyle='#f0bd84';ctx.lineWidth=13;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x-7,b.y+35);ctx.lineTo(b.x+3,b.y+95);ctx.moveTo(b.x+12,b.y+20);ctx.lineTo(drag?drag.x:b.x+13,drag?drag.y:b.y);ctx.stroke();ctx.fillStyle='#f4d872';ctx.beginPath();ctx.ellipse(b.x-31,b.y+128,21,9,0,0,7);ctx.ellipse(b.x+18,b.y+128,21,9,0,0,7);ctx.fill();ctx.restore()}
function draw(){ctx.save();ctx.scale(W/1200,H/800);drawSky();balloons.forEach(balloon);drawBow();shots.forEach(drawArrow);drawArcher();particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;if(p.star){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(tick*6);ctx.fillRect(-p.r/2,-p.r*1.5,p.r,p.r*3);ctx.fillRect(-p.r*1.5,-p.r/2,p.r*3,p.r);ctx.restore()}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}});ctx.globalAlpha=1;if(active){ctx.fillStyle='#fff9';ctx.font='700 14px "DM Mono"';ctx.fillText('AIM',111,640)}ctx.restore()}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;if(active)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
