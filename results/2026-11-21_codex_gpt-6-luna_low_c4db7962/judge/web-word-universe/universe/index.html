const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');let W=0,H=0,selected=null,points=[],drag=null,offset={x:0,y:0};function resize(){let r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);layout();draw()}function hash(s){let h=2166136261;for(let c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}function layout(){let cx=W/2,cy=H/2,rx=Math.min(W*.43,H*.45),ry=Math.min(H*.42,W*.42);points=keys.map((word,i)=>{let h=hash(word),a=(i/keys.length)*Math.PI*2+(h%1000)/1000*.13,r=.28+((h>>>10)%700)/1000*.72;return {word,x:cx+Math.cos(a)*rx*r,y:cy+Math.sin(a)*ry*r,r:2.2+(words[word].length?Math.min(words[word].length,14)*.55:0),color:(h%3)}})}function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(offset.x,offset.y);let by=new Map(points.map(p=>[p.word,p]));ctx.lineWidth=.7;ctx.strokeStyle='rgba(116,158,151,.14)';for(const [a,ns]of Object.entries(words)){let p=by.get(a);for(const b of ns){let q=by.get(b);if(!q||norm(a)>norm(b))continue;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}}for(const p of points){let active=selected===p.word,near=selected&&words[selected].includes(p.word);ctx.beginPath();ctx.arc(p.x,p.y,p.r+(active?5:near?2:0),0,Math.PI*2);ctx.fillStyle=active?'#d9f36a':near?'#6fe0cb':['#94aaa1','#82999b','#758f8b'][p.color];ctx.globalAlpha=selected&&!active&&!near?.3:.83;ctx.fill();ctx.globalAlpha=1;if(active||near||(!selected&&p.r>8)){ctx.font=(active?'600 13px':'11px')+' system-ui';ctx.fillStyle=active?'#eff5df':'#a8b8b1';ctx.fillText(p.word,p.x+p.r+5,p.y+4)}}ctx.restore()}function choose(w,update=true){if(!w)return;selected=w;document.querySelector('#q').value=w;document.querySelector('#focus').textContent=w;document.querySelector('#meta').textContent=`${words[w].length} ligações diretas`;document.querySelector('#relcount').textContent=words[w].length;let box=document.querySelector('#relations');box.replaceChildren();
