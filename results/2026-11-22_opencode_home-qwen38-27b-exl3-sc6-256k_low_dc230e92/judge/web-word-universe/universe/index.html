<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#ece9f2; --dim:#9a94ac; --line:#2c2735; --bg0:#0d0b11; --bg1:#171320; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    background: radial-gradient(120% 120% at 30% 10%, var(--bg1) 0%, var(--bg0) 60%);
    color:var(--ink); font-family:Inter,system-ui,sans-serif; overflow:hidden;
  }
  #scene { position:fixed; inset:0; display:block; cursor:grab; }
  #scene:active { cursor:grabbing; }
  header { position:fixed; top:22px; left:26px; z-index:5; pointer-events:none; }
  header h1 { font-family:Fraunces,serif; font-weight:500; font-size:30px; margin:0; letter-spacing:.01em; }
  header .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  #hud { position:fixed; top:22px; right:26px; z-index:6; width:300px; display:flex; flex-direction:column; gap:10px; }
  #searchwrap { position:relative; }
  #search {
    width:100%; padding:11px 14px; font:15px Inter,sans-serif; color:var(--ink);
    background:#1b1622cc; border:1px solid var(--line); border-radius:12px; outline:none;
  }
  #search:focus { border-color:#5a4d75; }
  #sugs { position:absolute; top:calc(100% + 6px); left:0; right:0; background:#1b1622f2; border:1px solid var(--line); border-radius:12px; overflow:hidden; display:none; }
  #sugs div { padding:9px 14px; font-size:14px; cursor:pointer; }
  #sugs div:hover, #sugs div.on { background:#2a2138; }
  #panel { background:#1b1622cc; border:1px solid var(--line); border-radius:14px; padding:16px; display:none; backdrop-filter:blur(6px); }
  #panel .word { font-family:Fraunces,serif; font-size:24px; font-weight:600; line-height:1.1; }
  #panel .tema { color:var(--dim); font-size:12px; margin:4px 0 10px; text-transform:lowercase; }
  #panel .label { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin-bottom:6px; }
  #panel .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #panel .chip { font:13px Inter,sans-serif; color:var(--ink); background:#2a2138; border:1px solid #37304a; border-radius:999px; padding:5px 11px; cursor:pointer; }
  #panel .chip:hover { background:#37304a; }
  #legend { position:fixed; left:26px; bottom:22px; z-index:5; display:flex; flex-wrap:wrap; gap:6px 14px; max-width:46vw; }
  #legend span { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  #legend i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  #hint { position:fixed; right:26px; bottom:22px; z-index:5; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<header>
  <h1>universo de palavras</h1>
  <div class="sub" id="stats"></div>
</header>
<div id="hud">
  <div id="searchwrap">
    <input id="search" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="sugs"></div>
  </div>
  <div id="panel">
    <div class="word" id="pword"></div>
    <div class="tema" id="ptema"></div>
    <div class="label">laços</div>
    <div class="chips" id="pchips"></div>
  </div>
</div>
<div id="legend"></div>
<div id="hint">arraste para girar · roda para aproximar · clique numa palavra · esc limpa</div>

const norm = s => s.trim().toLowerCase()
  .replace(/[àáâãäå]/g,'a').replace(/[èéêë]/g,'e').replace(/[ìíîï]/g,'i')
  .replace(/[òóôõö]/g,'o').replace(/[ùúûü]/g,'u').replace(/ç/g,'c')
  .replace(/[º°]/g,'').replace(/\s+/g,' ');

const THEME_COLORS = {
  'sentimentos':'#f2789f', 'família':'#f5a25a', 'natureza':'#7ed096',
  'comida':'#e9c94f', 'corpo':'#de6b52', 'linguagem':'#6faeef',
  'lugares':'#9a8bf0', 'ofícios':'#4fc8c4', 'tempo':'#c7c2d9', 'artes':'#e08fd0'
};
const FALLBACK = '#8f8a9c';

// ---- graph ----
const nodes = [], byNorm = new Map();
for (const [w, links] of Object.entries(DATA.words)) {
  const n = { word:w, norm:norm(w), tema:DATA.theme[w]||null,
              pos:new THREE.Vector3((Math.random()-.5)*120,(Math.random()-.5)*120,(Math.random()-.5)*120),
              vel:new THREE.Vector3(), links, neighbors:new Set() };
  nodes.push(n); byNorm.set(n.norm, n);
}
const edges = [];
for (const n of nodes) for (const w of n.links) {
  const m = byNorm.get(norm(w));
  if (m && m !== n) { edges.push([n, m]); n.neighbors.add(m); }
}
const pairCount = new Set(edges.map(([a,b]) => { const x=a.norm<b.norm?[a,b]:[b,a]; return x[0].norm+'|'+x[1].norm; })).size;
document.getElementById('stats').textContent =
  `${nodes.length} palavras · ${pairCount} laços · ${Object.keys(THEME_COLORS).length} temas`;

// ---- three ----
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 1, 3000);

function makeLabel(text, colorCss) {
  const font = '500 44px Inter, sans-serif';
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width) + 28;
  c.width = w; c.height = 68;
  ctx.font = font; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffffff';
  ctx.fillText(text, 14, c.height/2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false }));
  const s = 0.075;
  spr.scale.set(w*s, 68*s, 1);
  return spr;
}
for (const n of nodes) {
  const color = new THREE.Color(n.tema ? (THEME_COLORS[n.tema]||FALLBACK) : FALLBACK);
  n.spr = makeLabel(n.word, color.getHexString());
  n.spr.material.color = color.clone();
  n.baseColor = color;
  n.spr.position.copy(n.pos);
  n.spr.userData.node = n;
  scene.add(n.spr);
}
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(edges.length*6), 3));
lineGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(edges.length*6), 3));
const lines = new THREE.LineSegments(lineGeo,
  new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:.85 }));
scene.add(lines);

// ---- orbit ----
let yaw = .6, pitch = .35, radius = 190;
const target = new THREE.Vector3(), targetGoal = new THREE.Vector3();
function applyCamera() {
  target.lerp(targetGoal, .06);
  camera.position.set(
    target.x + radius*Math.cos(pitch)*Math.sin(yaw),
    target.y + radius*Math.sin(pitch),
    target.z + radius*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(target);
}
let dragging = false, moved = 0, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly; lx = e.clientX; ly = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  yaw += dx * .005; pitch = Math.max(-1.45, Math.min(1.45, pitch + dy * .005));
});
addEventListener('pointerup', e => {
  if (dragging && moved < 6) pick(e);
  dragging = false;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  radius = Math.max(40, Math.min(600, radius * Math.exp(e.deltaY * .001)));
}, { passive:false });

// ---- picking / selection ----
const ray = new THREE.Raycaster();
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1), camera);
  const hit = ray.intersectObjects(nodes.map(n => n.spr))[0];
  select(hit ? hit.object.userData.node : null, true);
}
function select(n, pushUrl) {
  selected = n;
  if (n) {
    targetGoal.copy(n.pos);
    for (const m of nodes) {
      const on = m === n || n.neighbors.has(m);
      m.spr.material.opacity = on ? 1 : .12;
      m.spr.material.color.copy(m === n ? new THREE.Color('#ffffff') : m.baseColor);
    }
    for (let i = 0; i < edges.length; i++) {
      const [a, b] = edges[i];
      const on = a === n || b === n;
      const c = on ? new THREE.Color('#e8e2f5') : new THREE.Color('#211d2b');
      colAttr.setXYZ(i*2, c.r, c.g, c.b); colAttr.setXYZ(i*2+1, c.r, c.g, c.b);
    }
    colAttr.needsUpdate = true;
    document.getElementById('pword').textContent = n.word;
    document.getElementById('ptema').textContent = n.tema ? 'tema: ' + n.tema : '';
    const chips = document.getElementById('pchips');
    chips.innerHTML = '';
    [...n.neighbors].sort((a,b) => a.word.localeCompare(b.word,'pt')).forEach(m => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = m.word;
      b.onclick = () => select(m, true);
      chips.appendChild(b);
    });
    document.getElementById('panel').style.display = 'block';
    document.getElementById('search').value = n.word;
    if (pushUrl) history.replaceState(null, '', '?word=' + encodeURIComponent(n.word));
  } else {
    targetGoal.set(0,0,0);
    for (const m of nodes) { m.spr.material.opacity = 1; m.spr.material.color.copy(m.baseColor); }
    const c = new THREE.Color('#4a4560');
    for (let i = 0; i < edges.length; i++) { colAttr.setXYZ(i*2, c.r,c.g,c.b); colAttr.setXYZ(i*2+1, c.r,c.g,c.b); }
    colAttr.needsUpdate = true;
    document.getElementById('panel').style.display = 'none';
    document.getElementById('search').value = '';
    if (pushUrl) history.replaceState(null, '', location.pathname);
  }
}
let selected = null;
const colAttr = lineGeo.getAttribute('color');
addEventListener('keydown', e => { if (e.key === 'Escape') select(null, true); });

// ---- search ----
const input = document.getElementById('search'), sugs = document.getElementById('sugs');
let sugIdx = -1, sugList = [];
function renderSugs() {
  sugs.innerHTML = '';
  sugList.forEach((n, i) => {
    const d = document.createElement('div');
    d.textContent = n.word;
    if (i === sugIdx) d.className = 'on';
    d.onclick = () => select(n, true);
    sugs.appendChild(d);
  });
  sugs.style.display = sugList.length ? 'block' : 'none';
}
function doSearch() {
  const q = norm(input.value);
  sugIdx = -1;
  if (!q) { renderSugs(); return; }
  sugList = nodes.filter(n => n.norm.includes(q)).sort((a,b) =>
    (a.norm.startsWith(q) === b.norm.startsWith(q)) ? a.word.localeCompare(b.word,'pt') : (a.norm.startsWith(q) ? -1 : 1))
    .slice(0, 8);
  renderSugs();
}
input.addEventListener('input', doSearch);
input.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { sugIdx = Math.min(sugList.length-1, sugIdx+1); renderSugs(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sugIdx = Math.max(-1, sugIdx-1); renderSugs(); e.preventDefault(); }
  else if (e.key === 'Enter') {
    if (sugList.length) { select(sugIdx >= 0 ? sugList[sugIdx] : sugList[0], true); sugs.style.display = 'none'; }
  }
});

// ---- legend ----
const legend = document.getElementById('legend');
for (const [t, c] of Object.entries(THEME_COLORS)) {
  const s = document.createElement('span');
  s.innerHTML = `<i style="background:${c}"></i>${t}`;
  legend.appendChild(s);
}

// ---- force simulation ----
let alpha = 1;
const REP = 420, SPRING = .028, REST = 17, CENTER = .0045, DAMP = .86;
function step() {
  alpha = Math.max(.04, alpha * .996);
  const N = nodes.length;
  for (let i = 0; i < N; i++) {
    const a = nodes[i];
    for (let j = i+1; j < N; j++) {
      const b = nodes[j];
      let dx = a.pos.x-b.pos.x, dy = a.pos.y-b.pos.y, dz = a.pos.z-b.pos.z;
      let d2 = dx*dx+dy*dy+dz*dz;
      if (d2 < .01) { dx = Math.random()-.5; dy = Math.random()-.5; dz = Math.random()-.5; d2 = dx*dx+dy*dy+dz*dz; }
      const f = Math.min(REP*alpha/d2, 3) / Math.sqrt(d2);
      dx *= f; dy *= f; dz *= f;
      a.vel.x += dx; a.vel.y += dy; a.vel.z += dz;
      b.vel.x -= dx; b.vel.y -= dy; b.vel.z -= dz;
    }
  }
  for (const [a, b] of edges) {
    const dx = b.pos.x-a.pos.x, dy = b.pos.y-a.pos.y, dz = b.pos.z-a.pos.z;
    const d = Math.max(Math.sqrt(dx*dx+dy*dy+dz*dz), .01);
    const f = (d - REST) * SPRING * alpha / d;
    a.vel.x += dx*f; a.vel.y += dy*f; a.vel.z += dz*f;
    b.vel.x -= dx*f; b.vel.y -= dy*f; b.vel.z -= dz*f;
  }
  for (const n of nodes) {
    n.vel.addScaledVector(n.pos, -CENTER*alpha);
    n.vel.multiplyScalar(DAMP);
    n.pos.add(n.vel);
  }
}
function sync() {
  for (const n of nodes) n.spr.position.copy(n.pos);
  const p = lineGeo.getAttribute('position');
  for (let i = 0; i < edges.length; i++) {
    const [a, b] = edges[i];
    p.setXYZ(i*2, a.pos.x, a.pos.y, a.pos.z);
    p.setXYZ(i*2+1, b.pos.x, b.pos.y, b.pos.z);
  }
  p.needsUpdate = true;
}

// ---- resize / loop ----
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const q = new URLSearchParams(location.search).get('word');
function boot() {
  (async () => {
    try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); } catch {}
    if (q) {
      const n = byNorm.get(norm(q));
      if (n) select(n, false);
    }
  })();
}
boot();
(function loop() {
  requestAnimationFrame(loop);
  step(); sync(); applyCamera();
  renderer.render(scene, camera);
})();
</script>
