<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Great Wave - low poly wallpaper</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f0e2c3}
  canvas{display:block}
  #cartouche{position:fixed;left:28px;top:24px;writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;
    font-size:22px;color:#1c3f7a;border:2px solid #1c3f7a;padding:10px 4px;background:#f6f1e3cc;letter-spacing:4px;pointer-events:none}
</style>
</head>
<body>
<div id="cartouche">神奈川沖浪裏</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// Palette sampled by eye from the print: cream paper, Prussian blue, pale foam, tan boats.
const C = {
  paper: 0xf0e2c3, horizon: 0x8d8e96,
  deep: 0x1c3f7a, mid: 0x2f6fb3, pale: 0x9fc1d9, foam: 0xf6f1e3,
  boat: 0xc8906b, boatDark: 0x8a5d3d, fujiRock: 0x3d5f93, snow: 0xf4f1e8
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 3.2, 22);
camera.lookAt(0, 2.5, 0);

scene.add(new THREE.HemisphereLight(0xfff4dc, 0x2f6fb3, 1.3));
const sun = new THREE.DirectionalLight(0xfff0d0, 0.9);
sun.position.set(6, 12, 24);
scene.add(sun);

const flat = (color) => new THREE.MeshLambertMaterial({ color, flatShading: true, side: THREE.DoubleSide });

// Sky: grey band at the horizon like the bokashi gradient of the print
const skyGeo = new THREE.PlaneGeometry(90, 40, 1, 16);
const skyCol = [];
const pos = skyGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const t = (pos.getY(i) + 20) / 40;
  const c = new THREE.Color(C.horizon).lerp(new THREE.Color(C.paper), Math.min(1, t * 2.2));
  skyCol.push(c.r, c.g, c.b);
}
skyGeo.setAttribute('color', new THREE.Float32BufferAttribute(skyCol, 3));
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true }));
sky.position.set(0, 10, -40);
scene.add(sky);

// Mount Fuji: small, low, centre, under the hollow of the wave
const fuji = new THREE.Group();
const rock = new THREE.Mesh(new THREE.ConeGeometry(4.5, 2.6, 7), flat(C.fujiRock));
rock.position.y = 1.3;
const snow = new THREE.Mesh(new THREE.ConeGeometry(1.5, 0.9, 7), flat(C.snow));
snow.position.y = 2.17;
fuji.add(rock, snow);
fuji.position.set(2.5, -0.9, -30);
fuji.scale.set(1.3, 1.0, 1);
scene.add(fuji);

// Far sea
const seaGeo = new THREE.PlaneGeometry(90, 40, 70, 30);
seaGeo.rotateX(-Math.PI / 2);
const sea = new THREE.Mesh(seaGeo, flat(C.mid));
sea.position.set(0, -1.2, -8);
scene.add(sea);
const seaBase = seaGeo.attributes.position.array.slice();

// Great wave: tall ridge from a profile swept across X, crest leaning into the hollow
function waveProfile(x, t) {
  const peak = Math.exp(-((x + 0.35) ** 2) * 3.2) * 9.5;
  const ramp = Math.max(0, -x) * 1.4;
  return peak + ramp + Math.sin(x * 9 + t) * 0.15;
}
function buildWave(width, depth, heightScale, color) {
  const g = new THREE.PlaneGeometry(width, depth, 60, 10);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, flat(color));
  m.userData.base = g.attributes.position.array.slice();
  m.userData.heightScale = heightScale;
  m.userData.width = width;
  return m;
}
function deformWave(mesh, t, curl) {
  const p = mesh.geometry.attributes.position;
  const b = mesh.userData.base;
  for (let i = 0; i < p.count; i++) {
    const x = b[i * 3], z = b[i * 3 + 2];
    const nx = x / (mesh.userData.width / 2);
    const zt = (z + 4) / 8;
    const h = waveProfile(nx, t) * mesh.userData.heightScale * zt;
    const lean = curl * Math.max(0, h - 5) * 0.5;
    p.setXYZ(i, x + lean, h, z);
  }
  p.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
}
const greatWaveBack = buildWave(30, 8, 1.0, C.deep);
greatWaveBack.position.set(-5, -1, -4);
const greatWaveFront = buildWave(30, 8, 0.85, C.mid);
greatWaveFront.position.set(-5, -1.4, -1);
scene.add(greatWaveBack, greatWaveFront);

// Foam claws along the crest
const foamGeo = new THREE.IcosahedronGeometry(0.35, 0);
const foamMat = new THREE.MeshBasicMaterial({ color: C.foam });
const claws = [];
for (let i = 0; i < 70; i++) {
  const m = new THREE.Mesh(foamGeo, foamMat);
  m.scale.setScalar(0.6 + Math.random() * 1.1);
  m.userData = { nx: -0.9 + Math.random() * 1.1, drop: Math.random() * 2.5, phase: Math.random() * 6.28 };
  scene.add(m);
  claws.push(m);
}

// Spray dots (the white droplets of the print)
const dotGeo = new THREE.BufferGeometry();
const dots = new Float32Array(400 * 3);
for (let i = 0; i < 400; i++) {
  dots[i * 3] = -14 + Math.random() * 22;
  dots[i * 3 + 1] = 2 + Math.random() * 9;
  dots[i * 3 + 2] = -6 + Math.random() * 8;
}
dotGeo.setAttribute('position', new THREE.BufferAttribute(dots, 3));
const spray = new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: C.foam, size: 0.18 }));
scene.add(spray);

// Foreground swell at the right
function makeSheet(color) {
  const g = new THREE.PlaneGeometry(60, 14, 60, 10);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(g, flat(color));
  m.userData.base = g.attributes.position.array.slice();
  return m;
}
const foreWave = makeSheet(C.deep);
foreWave.position.set(8, -2.2, 6);
const foreFoam = makeSheet(C.pale);
foreFoam.position.set(8, -2.0, 6.2);
scene.add(foreWave, foreFoam);

// Three oshiokuri-bune: long narrow hulls, upturned ends, rowers as cones
function makeBoat() {
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 0.9), flat(C.boat));
  const bow = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.8, 4), flat(C.boatDark));
  bow.rotation.z = -Math.PI / 2 - 0.5; bow.position.set(3.4, 0.5, 0);
  const stern = bow.clone(); stern.rotation.z = Math.PI / 2 + 0.5; stern.position.set(-3.4, 0.5, 0);
  g.add(hull, bow, stern);
  for (let i = 0; i < 8; i++) {
    const rower = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.6, 5), flat(0x2a2f3a));
    rower.position.set(-2.4 + i * 0.7, 0.55, (i % 2 ? 0.2 : -0.2));
    g.add(rower);
  }
  return g;
}
const boats = [
  { m: makeBoat(), x: -9.5, y: 1.0, z: 2.5, rot: -0.55, s: 0.7 },
  { m: makeBoat(), x: 1.5, y: -0.4, z: 4.5, rot: -0.35, s: 0.75 },
  { m: makeBoat(), x: 10.5, y: 1.1, z: 1.5, rot: 0.55, s: 0.7 }
];
boats.forEach(b => { b.m.position.set(b.x, b.y, b.z); b.m.rotation.z = b.rot; b.m.scale.setScalar(b.s); scene.add(b.m); });

// Animation: breathing waves, bobbing boats, drifting spray
const clock = new THREE.Clock();
function deformSea(t) {
  const p = sea.geometry.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = seaBase[i * 3], z = seaBase[i * 3 + 2];
    p.setY(i, Math.sin(x * 0.5 + t) * 0.35 + Math.cos(z * 0.9 + t * 0.8) * 0.2);
  }
  p.needsUpdate = true;
  sea.geometry.computeVertexNormals();
}
function deformFore(mesh, t, lift) {
  const p = mesh.geometry.attributes.position;
  const base = mesh.userData.base;
  for (let i = 0; i < p.count; i++) {
    const x = base[i * 3], z = base[i * 3 + 2];
    const nx = x / 30;
    const crest = Math.exp(-((nx - 0.35) ** 2) * 4) * 4.5 + Math.max(0, nx) * 1.5;
    p.setY(i, crest * ((z + 7) / 14) + Math.sin(x * 1.3 + t * 0.9) * 0.25 + lift);
  }
  p.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
}

function animate() {
  const t = clock.getElapsedTime();
  const breathe = Math.sin(t * 0.6) * 0.12;
  deformWave(greatWaveBack, t * 0.5, 1.0 + breathe);
  deformWave(greatWaveFront, t * 0.5 + 1.0, 0.8 + breathe);
  deformSea(t * 0.7);
  deformFore(foreWave, t, 0);
  deformFore(foreFoam, t + 0.6, -0.25);

  claws.forEach(c => {
    const h = waveProfile(c.userData.nx, t * 0.5);
    c.position.set(
      c.userData.nx * 15 - 5 + Math.max(0, h - 5) * 0.5 * (1 + breathe) + Math.sin(t + c.userData.phase) * 0.15,
      h - 0.6 - c.userData.drop * 0.3 + Math.cos(t * 1.3 + c.userData.phase) * 0.12,
      -0.5 + c.userData.drop * 0.4
    );
    c.rotation.y = t * 0.3 + c.userData.phase;
  });

  const d = spray.geometry.attributes.position;
  for (let i = 0; i < d.count; i++) {
    d.setY(i, d.getY(i) - 0.01);
    d.setX(i, d.getX(i) + 0.012);
    if (d.getY(i) < 1.5) { d.setY(i, 8 + Math.random() * 3); d.setX(i, -12 + Math.random() * 10); }
  }
  d.needsUpdate = true;

  boats.forEach((b, i) => {
    b.m.position.y = b.y + Math.sin(t * 0.9 + i * 2.1) * 0.35;
    b.m.rotation.z = b.rot + Math.sin(t * 0.7 + i * 1.7) * 0.08;
  });

  camera.position.x = Math.sin(t * 0.15) * 0.4;
  camera.lookAt(0, 2.5, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
