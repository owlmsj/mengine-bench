<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Great Wave — a low-poly homage</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Shippori+Mincho:wght@500&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eadbb9}canvas{display:block;width:100%;height:100%}
#caption{position:fixed;left:28px;bottom:24px;color:#173e56;pointer-events:none;font:400 10px/1.5 'DM Sans',sans-serif;letter-spacing:.18em;text-transform:uppercase;opacity:.75}#caption b{display:block;font:500 19px/1.4 'Shippori Mincho',serif;letter-spacing:.08em;text-transform:none}#seal{position:fixed;right:26px;top:24px;border:1px solid #a34d38;color:#a34d38;padding:7px 5px;font:500 12px/1.15 'Shippori Mincho',serif;writing-mode:vertical-rl;opacity:.8;pointer-events:none}
</style>
</head>
<body><div id="caption"><b>The Great Wave</b>after Katsushika Hokusai · 1831</div><div id="seal">富嶽三十六景</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const C={paper:0xeadbb9,foam:0xf5efd8,mist:0xd8dfc9,pale:0x9fbfba,blue:0x28657d,deep:0x123e59,ink:0x18384b,wood:0xc59c70,skin:0xe0bb8f,red:0xa34d38};
const scene=new THREE.Scene();scene.background=new THREE.Color(C.paper);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const camera=new THREE.OrthographicCamera(-12,12,7,-7,.1,100);camera.position.set(0,0,25);
const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true});
const M={};for(const k in C)M[k]=mat(C[k]);
scene.add(new THREE.HemisphereLight(0xffffff,0x9aabb0,2.2));const sun=new THREE.DirectionalLight(0xffffff,1.7);sun.position.set(-6,9,12);scene.add(sun);
function shape(points,material,z=0){const s=new THREE.Shape();points(s);const g=new THREE.ExtrudeGeometry(s,{depth:.12,bevelEnabled:false,curveSegments:5});const m=new THREE.Mesh(g,material);m.position.z=z;scene.add(m);return m}
function poly(a,material,z=0,parent=scene){const s=new THREE.Shape();a.forEach((p,i)=>(i?s.lineTo(...p):s.moveTo(...p)));s.closePath();const m=new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:.08,bevelEnabled:false}),material);m.position.z=z;parent.add(m);return m}
function curve(pts,color=C.foam,r=.035,z=1,parent=scene){const path=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],0)));const m=new THREE.Mesh(new THREE.TubeGeometry(path,8,r,3,false),M[color]||color);m.position.z=z;parent.add(m);return m}
// Quiet, faceted sky.
poly([[-18,7],[-18,2],[-8,1],[-2,2],[7,.4],[18,1],[18,7]],mat(0xeee1c1),-5);
poly([[-16,1],[-9,.3],[-3,.6],[2,-.1],[8,-.8],[17,-.2],[17,-4],[-16,-4]],mat(0xb9b7a3),-4);
// Distant Mount Fuji: small, snow-capped, unmistakable.
const fuji=new THREE.Group();scene.add(fuji);fuji.position.set(4,-.4,-2.5);
poly([[-2.3,-.8],[-1.45,-.25],[-.62,.5],[0,1.55],[.32,1.22],[1.18,.15],[2.35,-.8]],M.ink,0,fuji);
poly([[-1.4,-.24],[-.62,.5],[0,1.55],[.32,1.22],[1.15,.15],[.62,.25],[.37,.02],[.15,.35],[-.08,.15],[-.28,.45],[-.52,.15],[-.78,.15]],M.foam,.12,fuji);
poly([[-1.55,-.35],[-.9,-.15],[-.2,-.55],[.6,-.28],[1.5,-.4],[2.25,-.8],[-2.25,-.8]],M.blue,.16,fuji);
// Sea body and rhythmic low-poly facets.
poly([[-18,-7],[18,-7],[18,-1.4],[13,-2],[10,-1.7],[6,-2.2],[2,-1.4],[-2,-2.4],[-7,-1.8],[-12,-3],[-18,-2]],M.deep,-1.8);
for(let i=0;i<15;i++){const x=-16+i*2.5;poly([[x,-6.4],[x+2.9,-5.5],[x+1.4,-5.15],[x-1,-5.55]],i%3?M.blue:M.pale,-1.4)}
// Left hero wave: deep talon rising, curling over the boats.
const hero=new THREE.Group();scene.add(hero);hero.position.z=-.4;
poly([[-13,-6],[-12,-3],[-10,-1],[-9,1],[-8,3.5],[-6.8,5],[-5.4,5.9],[-4,6],[-3.1,5.55],[-2.3,5.7],[-1.2,5.1],[-.6,4.4],[.2,4.1],[1.2,3.4],[.55,3.15],[1.55,2.9],[.65,2.5],[.2,2.75],[-.5,2.4],[-1.15,1.4],[-1.55,.2],[-1.15,-1.3],[.15,-2.4],[-1.8,-3.1],[-4,-3.9],[-6,-4.8],[-9,-5.7]],M.blue,0,hero);
poly([[-13,-6],[-11,-3.7],[-9,-1.8],[-7,-1.5],[-6,-2.3],[-4,-1.5],[-3,-2.8],[-1.5,-2.2],[-.1,-2.5],[-1.6,-3.6],[-4,-4.8],[-8,-6]],M.deep,.14,hero);
// Ivory crest follows the printed silhouette and splits into claw-like fingers.
poly([[-12,2.1],[-10,4.1],[-8.6,5.2],[-7.1,5.9],[-5.8,6.25],[-4.6,6.3],[-3.9,6.05],[-3.1,6.22],[-2.4,5.9],[-1.4,5.75],[-.6,5.05],[.1,4.9],[.9,4.4],[1.55,4.15],[2.25,3.55],[2.65,2.8],[2.1,2.35],[1.65,2.65],[1.75,3.25],[1.25,3.15],[.85,3.65],[.2,3.9],[-.15,4.25],[-.6,4.3],[-.85,4.65],[-1.55,4.75],[-1.85,4.4],[-2.25,4.8],[-2.8,4.6],[-3.25,5.05],[-3.85,4.85],[-4.4,5.15],[-5.1,4.75],[-5.75,4.85],[-6.4,4.35],[-7.3,4.25],[-8.4,3.35],[-9.6,2.4]],M.foam,.25,hero);
// Blue inner planes preserve the woodblock's flat graphic structure.
poly([[-10.8,-3.7],[-9,-.9],[-7.8,2.6],[-6.5,4.35],[-5.4,4.8],[-6,3.8],[-6.4,2.7],[-5.6,3.5],[-4.8,4.15],[-4.7,3.2],[-5.1,2.3],[-4.4,2.8],[-3.7,3.65],[-3.3,2.5],[-3.75,1.4],[-2.9,2.05],[-2.25,2.8],[-2.2,1.45],[-2.7,.25],[-2.4,-1.4],[-1.2,-2.3],[-3.1,-2.8],[-5.1,-1.7],[-7.3,-2.7]],M.deep,.18,hero);
poly([[-10.5,1],[-8.5,3.3],[-7.6,4.25],[-6.7,4.6],[-7.4,3.5],[-8.5,2.4],[-8.7,1.2]],M.pale,.21,hero);
// Foam claws around the curling crest.
const claws=[[-4.6,5.2,-.6],[-3.8,5.3,-.25],[-2.9,5.15,.1],[-1.9,4.95,.25],[-.9,4.5,.45],[.05,4.15,.6],[1,3.75,.75],[1.8,3.2,.9]];
for(const [x,y,r] of claws){const g=new THREE.Group();g.position.set(x,y,.45);g.rotation.z=r;hero.add(g);poly([[0,0],[.35,.18],[.58,.05],[.76,-.24],[.7,-.6],[.43,-.82],[.48,-.47],[.3,-.25],[.08,-.22],[-.15,-.35],[-.28,-.15]],M.foam,0,g);curve([[.02,-.04],[.2,.02],[.38,-.13],[.42,-.36]],'blue',.026,.1,g)}
// C-shaped foam eddies: drawn as geometry, never an image texture.
function eddies(parent,list,scale=1){for(const [x,y,s] of list){const g=new THREE.Group();g.position.set(x,y,.52);g.scale.setScalar(s*scale);parent.add(g);curve([[-.32,.1],[-.24,.35],[.05,.4],[.27,.22],[.23,-.02],[.05,-.1],[-.02,.03]],'foam',.045,0,g);curve([[-.36,-.16],[-.18,-.3],[.08,-.25]],'foam',.035,0,g)}}
eddies(hero,[[-8.6,3.4,.8],[-7.4,4.4,.75],[-6.4,4.8,.7],[-5.6,4.2,.8],[-4.8,4.55,.7],[-3.8,4.2,.8],[-2.8,4.15,.7],[-1.7,3.9,.75],[-.6,3.35,.65],[-8.7,1.2,.65],[-7.5,2.1,.55],[-6.2,2.9,.5],[-5.1,3.15,.6],[-3.9,2.8,.6],[-2.8,1.8,.6],[-8.4,-.3,.7],[-6.9,.7,.55],[-5.8,1.2,.6],[-4.5,.6,.65],[-3.3,-.2,.6],[-9.4,-2,.6],[-7.7,-1.4,.55],[-6.3,-1.1,.55],[-4.8,-1.3,.55],[-2.5,-1.5,.6]],1);
// Secondary wave at left and rising right-hand wave frame Fuji.
const right=new THREE.Group();scene.add(right);right.position.z=.15;
poly([[5,-6],[6,-3.8],[8,-2.2],[10,-.7],[12,1],[14,3.4],[16,4.4],[18,5],[18,-7]],M.foam,0,right);
poly([[5.5,-6],[7,-3.4],[9,-1.8],[11,.2],[13,2.5],[15,4.3],[18,5.4],[18,2.2],[15,1],[13,-1],[10,-2.8],[8,-5]],M.blue,.12,right);
poly([[8,-5.7],[10,-3.5],[12,-2.1],[14,-1],[16,-.7],[18,.3],[18,-1.3],[15,-2],[13,-3.2],[11,-5]],M.deep,.2,right);
eddies(right,[[9,-2.1,.8],[10,-1.2,.8],[11,-.2,.8],[12,1,.75],[13,2,.8],[14,3,.85],[15,3.6,.8],[16,3.9,.7]],1);
// Foreground surf, long pale ridges and indigo troughs.
const front=new THREE.Group();scene.add(front);front.position.z=.65;
poly([[-18,-7],[-18,-4],[-15,-3.2],[-12,-4.2],[-9,-4],[-6,-2.7],[-4,-1.4],[-2.6,-1.8],[-1.2,-3],[1,-3.4],[3,-3],[5,-3.5],[8,-4.4],[11,-4],[15,-5],[18,-4.2],[18,-7]],M.foam,0,front);
poly([[-17,-6.7],[-14,-4.7],[-12,-5.2],[-9,-4.9],[-7,-3.5],[-5,-2.7],[-4,-2.2],[-4.5,-3.6],[-7,-4.6],[-9,-5.8],[-12,-6.1]],M.blue,.12,front);
poly([[-5,-6.8],[-2,-4.5],[0,-4.1],[2,-4.3],[4,-4.1],[7,-5],[9,-5.6],[7,-6.2],[4,-5.4],[1,-5.3],[-1,-5.6]],M.deep,.13,front);
poly([[7,-6.5],[10,-4.9],[13,-4.8],[16,-4.1],[18,-4.4],[18,-5.7],[15,-5.5],[12,-6]],M.blue,.13,front);
for(let i=0;i<18;i++){const x=-17+i*2;curve([[x,-6.5],[x+1,-5.8],[x+2,-5.7]],i%3===0?'pale':'blue',.07,.2,front)}
// Three long cargo boats, with low-poly rowers and oars.
const boats=[];
function boat(x,y,angle,len){const g=new THREE.Group();g.position.set(x,y,1.4);g.rotation.z=angle;scene.add(g);boats.push(g);poly([[-len/2,0],[-len/2+.45,.26],[len/2-.55,.22],[len/2,.52],[len/2-.25,-.18],[-len/2+.65,-.42]],M.wood,0,g);poly([[-len/2+.45,.22],[len/2-.5,.18],[len/2-.3,-.02],[-len/2+.65,-.16]],M.foam,.11,g);poly([[-len/2+.65,-.16],[len/2-.3,-.02],[len/2-.25,-.18],[-len/2+.65,-.42]],M.ink,.12,g);for(let i=0;i<9;i++){const px=-len*.32+i*len*.075;poly([[px-.14,.15],[px,.5],[px+.15,.15]],M.ink,.2,g);const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.105,0),M.skin);head.position.set(px,.49,.28);g.add(head);curve([[px-.25,.12],[px+.15,.22],[px+.65,-.4]],'ink',.022,.16,g)}return g}
boat(-7.5,-2.45,-.38,6.1);boat(6.3,-1.65,.43,7.4);boat(.1,-4.65,-.12,7.3);
// Spray, sparse and airy like the print.
const spray=new THREE.Group();scene.add(spray);const dots=[[-2,1.8],[-1.2,1.2],[.1,.9],[1.5,1.7],[-3.2,2.5],[-.2,2.4],[-4,3.4],[2.1,2.4],[-1.8,.2],[-5.2,1.7]];for(const [x,y] of dots){const d=new THREE.Mesh(new THREE.IcosahedronGeometry(.045+Math.random()*.055,0),M.foam);d.position.set(x,y,1);spray.add(d)}
// A fine paper-coloured vignette and very gentle living motion.
const clock=new THREE.Clock();let px=0,py=0;addEventListener('pointermove',e=>{px=(e.clientX/innerWidth-.5);py=(e.clientY/innerHeight-.5)});
function resize(){const a=innerWidth/innerHeight;const h=a<1.25?8.8:7;camera.left=-h*a;camera.right=h*a;camera.top=h;camera.bottom=-h;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();hero.rotation.z=Math.sin(t*.45)*.0035;right.position.y=Math.sin(t*.55+1)*.035;front.position.y=Math.sin(t*.65)*.025;spray.position.y=Math.sin(t*.8)*.06;boats.forEach((b,i)=>{b.position.y=[-2.45,-1.65,-4.65][i]+Math.sin(t*.8+i*1.8)*.045;b.rotation.z=[-.38,.43,-.12][i]+Math.sin(t*.65+i)*.008});camera.position.x+=(px*.22-camera.position.x)*.025;camera.position.y+=(-py*.14-camera.position.y)*.025;camera.lookAt(0,0,0);renderer.render(scene,camera)}animate();
</script></body></html>
