<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Wave — Low Poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f3e9d2;font-family:'Shippori Mincho',serif;}
  #app{position:fixed;inset:0;}
  .caption{position:fixed;left:28px;top:24px;color:#24344a;z-index:2;pointer-events:none;}
  .caption h1{font-size:clamp(18px,2.6vw,32px);margin:0;letter-spacing:.14em;font-weight:700;}
  .caption p{margin:6px 0 0;font-size:clamp(10px,1.2vw,14px);letter-spacing:.08em;opacity:.75;}
  .cartouche{position:fixed;right:28px;bottom:24px;border:2px solid #24344a;padding:10px 14px;color:#24344a;font-size:clamp(10px,1.1vw,13px);letter-spacing:.2em;background:rgba(243,233,210,.65);z-index:2;pointer-events:none;}
</style>
</head>
<body>
<div id="app"></div>
<div class="caption"><h1>KAWAKAMIGAWA</h1><p>Low-poly rebuild · after Hokusai</p></div>
<div class="cartouche">THE GREAT WAVE · MOUNT FUJI</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3e9d2);
scene.fog = new THREE.Fog(0xf3e9d2, 60, 160);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 10, 46);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('app').appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xfff6e0, 0x2a3b55, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe9c0, 1.5);
sun.position.set(-18, 30, 24);
scene.add(sun);

const MAT = {
  blue: new THREE.MeshStandardMaterial({color:0x27436e, flatShading:true, roughness:.9}),
  blueLight: new THREE.MeshStandardMaterial({color:0x4f6d93, flatShading:true, roughness:.9}),
  foam: new THREE.MeshStandardMaterial({color:0xf6efdd, flatShading:true, roughness:.85}),
  tan: new THREE.MeshStandardMaterial({color:0xb0793e, flatShading:true, roughness:.8}),
  tanDark: new THREE.MeshStandardMaterial({color:0x7a4f26, flatShading:true, roughness:.85}),
  snow: new THREE.MeshStandardMaterial({color:0xf7f3e6, flatShading:true, roughness:.7}),
  grey: new THREE.MeshStandardMaterial({color:0x5c6e8c, flatShading:true, roughness:.95}),
  rock: new THREE.MeshStandardMaterial({color:0x33455e, flatShading:true, roughness:.9})
};

function water(){
  const g = new THREE.PlaneGeometry(220, 220, 40, 40);
  g.rotateX(-Math.PI/2);
  const pos = g.attributes.position;
  for(let i=0;i<pos.count;i++){
    pos.setY(i, (Math.sin(pos.getX(i)*0.35)+Math.cos(pos.getZ(i)*0.3))*0.22);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, MAT.blue);
  m.position.y = -2.2;
  return m;
}
scene.add(water());

// Mount Fuji: grey-blue cone + snow cap
const fuji = new THREE.Group();
const cone = new THREE.Mesh(new THREE.ConeGeometry(11, 15, 7, 3), MAT.grey);
cone.position.y = 5.3; cone.rotation.y = 0.4;
const snow = new THREE.Mesh(new THREE.ConeGeometry(4.6, 5.2, 7, 2), MAT.snow);
snow.position.y = 10.6; snow.rotation.y = 0.4;
const baseRock = new THREE.Mesh(new THREE.ConeGeometry(12.6, 3.4, 8, 1), MAT.rock);
baseRock.position.y = -0.4;
fuji.add(baseRock, cone, snow);
fuji.position.set(15, 0, -34);
scene.add(fuji);

// The great wave: curved body + foam claws
const wave = new THREE.Group();
const bodyArc = new THREE.TorusGeometry(11, 4.4, 9, 26, Math.PI*1.15);
const body = new THREE.Mesh(bodyArc, MAT.blue);
body.rotation.z = Math.PI*0.62;
body.rotation.y = 0.15;
body.scale.set(1.25, 1, 0.85);
wave.add(body);
const inner = new THREE.Mesh(new THREE.TorusGeometry(7.2, 2.4, 7, 20, Math.PI*0.85), MAT.blueLight);
inner.rotation.z = Math.PI*0.72;
inner.rotation.y = 0.15;
inner.position.set(0.6, 0.4, 1.2);
wave.add(inner);
const claws = new THREE.Group();
for(let i=0;i<11;i++){
  const t = Math.PI*0.18 + i*(Math.PI*0.78/10);
  const x = Math.cos(t)*13.6 + 1.2;
  const y = Math.sin(t)*11.2 + 4.2;
  const claw = new THREE.Mesh(new THREE.ConeGeometry(1.05+Math.random()*0.9, 3.6+Math.random()*2.6, 5), MAT.foam);
  claw.position.set(x, y, 0.6);
  claw.rotation.z = t - Math.PI/2 + Math.PI;
  claw.rotation.x = 0.25;
  claws.add(claw);
}
wave.add(claws);
wave.position.set(-4, 2.4, -8);
scene.add(wave);

// Foreground echo wave lower-left
const fg = new THREE.Group();
const fgBody = new THREE.Mesh(new THREE.TorusGeometry(5.4, 2.1, 7, 18, Math.PI*1.05), MAT.blueLight);
fgBody.rotation.z = Math.PI*0.55; fgBody.rotation.y = 0.3; fgBody.scale.set(1.3,1,0.8);
fg.add(fgBody);
for(let i=0;i<5;i++){
  const t = Math.PI*(0.25+i*0.16);
  const claw = new THREE.Mesh(new THREE.ConeGeometry(0.75, 2.6, 5), MAT.foam);
  claw.position.set(Math.cos(t)*6.6, Math.sin(t)*5.4+2.2, 0.4);
  claw.rotation.z = t - Math.PI/2 + Math.PI;
  fg.add(claw);
}
fg.position.set(-19, 0.4, 6);
scene.add(fg);

function boat(){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.55, 5.4, 7, 1), MAT.tan);
  hull.rotation.z = Math.PI/2; hull.scale.set(1, 1, 0.72);
  hull.position.y = 0.55;
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 4.9, 7, 1, true), MAT.tanDark);
  rim.rotation.z = Math.PI/2; rim.scale.set(1,1,0.72); rim.position.y = 0.55;
  g.add(hull, rim);
  for(let i=0;i<4;i++){
    const r = new THREE.Group();
    const bodyR = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.9, 5), new THREE.MeshStandardMaterial({color:0x8a5a33, flatShading:true}));
    bodyR.rotation.x = 0.9; bodyR.position.y = 1.05;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 5), new THREE.MeshStandardMaterial({color:0xd9b98c, flatShading:true}));
    head.position.set(0, 1.42, 0.18);
    r.add(bodyR, head);
    r.position.set(-1.7 + i*1.15, 0.75, 0);
    g.add(r);
  }
  return g;
}
const boats = [];
const boatPos = [[-10.5, 0.9, 2.5, -0.35], [-1.5, 1.0, 9.5, 0.18], [9.5, 0.95, -2.5, -0.12]];
boatPos.forEach(([x,y,z,ry],i)=>{
  const b = boat();
  b.position.set(x,y,z); b.rotation.y = ry;
  b.userData.phase = i*2.1;
  scene.add(b); boats.push(b);
});

const mist = new THREE.Group();
for(let i=0;i<26;i++){
  const s = new THREE.Mesh(new THREE.TetrahedronGeometry(0.28+Math.random()*0.3), MAT.foam);
  const a = Math.random()*Math.PI*2;
  s.position.set(-4+Math.cos(a)*(9+Math.random()*7), 6+Math.random()*7, -8+Math.sin(a)*(6+Math.random()*5));
  mist.add(s);
}
scene.add(mist);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  boats.forEach(b=>{
    b.position.y = 0.95 + Math.sin(t*1.15 + b.userData.phase)*0.32;
    b.rotation.z = Math.sin(t*0.9 + b.userData.phase)*0.055;
    b.rotation.x = Math.cos(t*0.7 + b.userData.phase)*0.04;
  });
  wave.rotation.z = Math.sin(t*0.5)*0.02;
  claws.children.forEach((c,i)=>{ c.position.y += Math.sin(t*2 + i)*0.0025; });
  fg.rotation.z = Math.sin(t*0.6+1.2)*0.03;
  mist.children.forEach((s,i)=>{ s.position.y += Math.sin(t*1.6+i)*0.004; s.rotation.y += 0.01; });
  camera.position.x = Math.sin(t*0.12)*1.6;
  camera.lookAt(-2, 5.5, -6);
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
