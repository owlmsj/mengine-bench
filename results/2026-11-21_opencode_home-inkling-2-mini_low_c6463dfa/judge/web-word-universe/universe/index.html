<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras — Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0c0a14; --panel:rgba(18,16,30,.82); --line:rgba(255,255,255,.09); --ink:#ece7f5; --dim:#9b93b3; --accent:#f2b366; --accent2:#7ad0c8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Fraunces",serif; }
  #scene { position:fixed; inset:0; }
  canvas { display:block; }
  header { position:fixed; top:0; left:0; right:0; padding:22px 28px 0; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:5; }
  h1 { font-size:clamp(20px,3vw,34px); font-weight:300; letter-spacing:.02em; margin:0; }
  h1 em { font-style:italic; color:var(--accent); }
  .sub { font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--dim); margin-top:6px; letter-spacing:.12em; text-transform:uppercase; }
  .stats { font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--dim); text-align:right; line-height:1.7; text-transform:uppercase; letter-spacing:.1em; }
  .stats b { color:var(--ink); font-weight:500; }
  #panel { position:fixed; left:28px; bottom:28px; width:min(340px, calc(100vw - 56px)); background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(14px); z-index:6; overflow:hidden; }
  #searchbox { padding:14px 14px 10px; border-bottom:1px solid var(--line); position:relative; }
  #q { width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:9px; color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:14px; padding:10px 12px; outline:none; }
  #q:focus { border-color:var(--accent); }
  #suggest { position:absolute; top:100%; left:14px; right:14px; background:#1c1930; border:1px solid var(--line); border-radius:10px; max-height:220px; overflow:auto; display:none; z-index:7; box-shadow:0 14px 40px rgba(0,0,0,.5); }
  #suggest button { display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink); padding:8px 12px; font-family:"IBM Plex Mono",monospace; font-size:13px; cursor:pointer; }
  #suggest button:hover { background:rgba(242,179,102,.15); color:var(--accent); }
  #detail { padding:14px 16px 16px; max-height:44vh; overflow:auto; }
  #now { font-size:26px; font-weight:600; margin:0 0 2px; color:var(--accent); }
  #now-meta { font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; margin:0 0 12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-family:"IBM Plex Mono",monospace; font-size:12px; background:rgba(122,208,200,.1); border:1px solid rgba(122,208,200,.35); color:var(--accent2); border-radius:999px; padding:4px 11px; cursor:pointer; transition:.15s; }
  .chip:hover { background:rgba(122,208,200,.28); color:#fff; }
  .empty { color:var(--dim); font-style:italic; font-size:14px; }
  #hint { position:fixed; right:28px; bottom:28px; font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--dim); letter-spacing:.08em; z-index:5; }
  #loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:20; font-style:italic; color:var(--dim); font-size:18px; transition:opacity .6s; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="loader">acendendo as palavras…</div>
<header>
  <div>
    <h1>O <em>Universo</em> de Palavras</h1>
    <div class="sub">Dicionário Criativo · grafo de relações</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div id="panel">
  <div id="searchbox">
    <input id="q" type="text" placeholder="buscar palavra…" autocomplete="off" spellcheck="false">
    <div id="suggest"></div>
  </div>
  <div id="detail"><p class="empty">Busque uma palavra para ver como ela se liga às outras.</p></div>
</div>
<div id="hint">arraste para girar · scroll para zoom · clique num nó</div>

ritmo","romance","tempo"],"tela":["cinema","desenho","milho","pé","pintura"],"tempo":["açúcar","capital","floresta","futuro","história","hora","idioma","onda","pátria","pescador","prado","rua","sogra","susto","teatro","tio"],"ternura":["alegria","carinho","compaixão","engenheiro","medo","praça"],"tia":["estação","filha","irmão","pais","primo","sogra","tio"],"tio":["folha","herança","neta","tempo","tia"],"trabalho":["aldeia","carpinteiro","engenheiro","ofício","sentido"],"trigo":["arroz","farinha","milho","unha"],"tristeza":["amor","frase","hoje","mágoa","melancolia"],"unha":["açúcar","dedo","paixão","peito","pulmão","trigo"],"vale":["mar","ponte","raiz","rio","serra"],"verso":["melodia","pão","pescador","poesia","rima","tambor"],"vila":["aldeia","capital","carpinteiro","madrugada","nação","porto"],"vinho":["água","chá","farinha","feijão","sotaque"],"violão":["enfermeira","escultura","país","piano","poesia","praça","rima","samba"],"voz":["afeto","capital","cozinha","fala","nome","sotaque"]}};
const NAMES = DATA.words;
const LINKS = DATA.links;
const idx = {}; NAMES.forEach((n,i)=>idx[n]=i);
const N = NAMES.length;

// --- edges
const edges = []; const seen = new Set();
for (const w of NAMES) for (const l of (LINKS[w]||[])) {
  const a=idx[w], b=idx[l]; if(a===undefined||b===undefined) continue;
  const k=a<b?a+'-'+b:b+'-'+a;
  if(!seen.has(k)){seen.add(k);edges.push([a,b]);}
}

// --- deterministic layout (force simulation, no randomness)
const nodes=[];
for(let i=0;i<N;i++){
  const t=i/N*Math.PI*2;
  nodes.push({x:Math.cos(t)*(1+ (i%7)*0.35), y:Math.sin(t*1.7)*1.6, z:(i%5-2)*0.8});
}
const degree=new Array(N).fill(0);
for(const [a,b] of edges){degree[a]++;degree[b]++;}
const K = 26;
const idealDist = i => 5.5 + degree[i]*0.22;
for(let iter=0;iter<380;iter++){
  const fx=new Float64Array(N), fy=new Float64Array(N), fz=new Float64Array(N);
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      let dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y, dz=nodes[i].z-nodes[j].z;
      let d2=dx*dx+dy*dy+dz*dz; if(d2<1e-4){dx=(i%3-1)*0.1;dy=0.1;dz=0.1;d2=dx*dx+dy*dy+dz*dz;}
      const d=Math.sqrt(d2), f=K*K/d2;
      dx/=d;dy/=d;dz/=d;
      fx[i]+=dx*f; fy[i]+=dy*f; fz[i]+=dz*f; fx[j]-=dx*f; fy[j]-=dy*f; fz[j]-=dz*f;
    }
  }
  for(const [a,b] of edges){
    let dx=nodes[b].x-nodes[a].x, dy=nodes[b].y-nodes[a].y, dz=nodes[b].z-nodes[a].z;
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.001;
    const ideal=idealDist(a)*0.9+idealDist(b)*0.9+2.2;
    const f=(d-ideal)*0.02*4;
    dx/=d;dy/=d;dz/=d;
    fx[a]+=dx*f; fy[a]+=dy*f; fz[a]+=dz*f; fx[b]-=dx*f; fy[b]-=dy*f; fz[b]-=dz*f;
  }
  // center gravity
  for(let i=0;i<N;i++){ fx[i]-=nodes[i].x*0.06; fy[i]-=nodes[i].y*0.06; fz[i]-=nodes[i].z*0.06; }
  const damp=0.82;
  for(let i=0;i<N;i++){
    nodes[i].x+=fx[i]*0.045*damp; nodes[i].y+=fy[i]*0.045*damp; nodes[i].z+=fz[i]*0.045*damp;
  }
}
// normalize scale
let maxR=0; for(const n of nodes){const r=Math.hypot(n.x,n.y,n.z); if(r>maxR)maxR=r;}
const SCALE=30/maxR; for(const n of nodes){n.x*=SCALE;n.y*=SCALE;n.z*=SCALE;}

// --- scene
const container=document.getElementById('scene');
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0c0a14,0.010);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,500);
camera.position.set(0,18,66);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
container.appendChild(renderer.domElement);
const amb=new THREE.AmbientLight(0xddccff,0.85); scene.add(amb);
const dir=new THREE.DirectionalLight(0xfff0dd,1.1); dir.position.set(40,60,30); scene.add(dir);
const pt=new THREE.PointLight(0x7ad0c8,900,0,2); pt.position.set(0,0,0); scene.add(pt);

// stars
const starGeo=new THREE.BufferGeometry(); const sp=[];
for(let i=0;i<1200;i++){const r=140+Math.random()*200, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
  sp.push(r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th));}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x8f86b8,size:0.55,sizeAttenuation:true})));

// nodes
const nodeGeo=new THREE.SphereGeometry(1,14,14);
const nodeMat=new THREE.MeshStandardMaterial({color:0xe9e2f7,roughness:0.35,metalness:0.15,emissive:0x241d3a,emissiveIntensity:0.6});
const inst=new THREE.InstancedMesh(nodeGeo,nodeMat,N);
const dummy=new THREE.Object3D();
const baseScale=i=>1.05+Math.sqrt(degree[i])*0.55;
for(let i=0;i<N;i++){dummy.position.set(nodes[i].x,nodes[i].y,nodes[i].z);dummy.scale.setScalar(baseScale(i));dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix);}
scene.add(inst);

// edges (two line sets: normal dim, highlight bright)
const edgeGeo=new THREE.BufferGeometry();
const ep=new Float32Array(edges.length*2*3);
edges.forEach(([a,b],i)=>{
  ep[i*6]=nodes[a].x; ep[i*6+1]=nodes[a].y; ep[i*6+2]=nodes[a].z;
  ep[i*6+3]=nodes[b].x; ep[i*6+4]=nodes[b].y; ep[i*6+5]=nodes[b].z;
});
edgeGeo.setAttribute('position',new THREE.BufferAttribute(ep,3));
const edgeMat=new THREE.LineBasicMaterial({color:0x5a517a,transparent:true,opacity:0.38});
const edgeLines=new THREE.LineSegments(edgeGeo,edgeMat); scene.add(edgeLines);

// labels via sprites only for selection/hover
function makeLabel(text){
  const c=document.createElement('canvas'); c.width=512;c.height=128;
  const g=c.getContext('2d'); g.font='600 58px Fraunces, serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='rgba(10,8,18,0.78)'; g.beginPath(); g.roundRect(6,6,500,116,24); g.fill();
  g.strokeStyle='rgba(242,179,102,0.6)'; g.lineWidth=3; g.stroke();
  g.fillStyle='#f2e9ff'; g.fillText(text,256,66);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp2=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp2.scale.set(14,3.5,1); return sp2;
}

// --- interaction
let selected=-1, hovered=-1;
let rotY=0.35, rotX=0.22, dist=78;
let dragging=false, px=0, py=0;

const ray=new THREE.Raycaster(); const ptr=new THREE.Vector2();
const q=document.getElementById('q'), suggest=document.getElementById('suggest'), detail=document.getElementById('detail');

function setSelected(name, updateURL=true){
  selected=idx[name];
  if(updateURL){const u=new URL(location.href);u.search='?word='+encodeURIComponent(name);history.replaceState(null,'',u);}
  renderDetail(name);
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  inst.instanceColor && null;
  // color selected node + neighbors
  const nbr = selected>=0 ? (LINKS[NAMES[selected]]||[]).map(n=>idx[n]).filter(i=>i!==undefined) : [];
  for(let i=0;i<N;i++){
    const col = i===selected ? new THREE.Color(0xf2b366) : (nbr.includes(i) ? new THREE.Color(0x7ad0c8) : new THREE.Color(0xe9e2f7));
    inst.setColorAt(i,col);
    const s = i===selected ? baseScale(i)*1.7 : (nbr.includes(i) ? baseScale(i)*1.35 : baseScale(i));
    dummy.position.set(nodes[i].x,nodes[i].y,nodes[i].z); dummy.scale.setScalar(s); dummy.updateMatrix(); inst.setMatrixAt(i,dummy.matrix);
  }
  inst.instanceMatrix.needsUpdate=true; if(inst.instanceColor) inst.instanceColor.needsUpdate=true;
  document.getElementById('stats').innerHTML = `<b>${N}</b> palavras · <b>${edges.length}</b> relações`;
}

function renderDetail(name){
  if(selected<0){detail.innerHTML='<p class="empty">Busque uma palavra para ver como ela se liga às outras.</p>';return;}
  const links=LINKS[name]||[];
  detail.innerHTML=`<h2 id="now">${name}</h2><p id="now-meta">${links.length} ligação${links.length===1?'':'s'} direta${links.length===1?'':'s'}</p>`+
    (links.length?`<div class="chips">${links.map(l=>`<button class="chip" data-w="${l}">${l}</button>`).join('')}</div>`:'<p class="empty">Nenhuma ligação direta.</p>');
  detail.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const n=c.dataset.w; setSelected(n); q.value=n;});
}

function suggestList(s){
  if(!s){suggest.style.display='none';return;}
  const m=NAMES.filter(n=>n.toLowerCase().includes(s.toLowerCase())).slice(0,8);
  if(!m.length){suggest.style.display='none';return;}
  suggest.innerHTML=m.map(n=>`<button data-w="${n}">${n}</button>`).join('');
  suggest.style.display='block';
  suggest.querySelectorAll('button').forEach(b=>b.onmousedown=()=>{setSelected(b.dataset.w);q.value=b.dataset.w;suggest.style.display='none';});
}
q.addEventListener('input',()=>suggestList(q.value.trim()));
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const v=q.value.trim().toLowerCase();
    const exact=NAMES.find(n=>n.toLowerCase()===v);
    const m=exact||NAMES.find(n=>n.toLowerCase().includes(v));
    if(m){setSelected(m);suggest.style.display='none';}
  } else if(e.key==='Escape'){suggest.style.display='none';}
});
document.addEventListener('click',e=>{if(!e.target.closest('#searchbox'))suggest.style.display='none';});

// --- camera controls
function onDown(x,y){dragging=true;px=x;py=y;}
function onMove(x,y){if(!dragging)return;rotY+=(x-px)*0.005;rotX-=(y-py)*0.005;rotX=Math.max(-1.2,Math.min(1.2,rotX));px=x;py=y;}
function onUp(){dragging=false;}
renderer.domElement.addEventListener('pointerdown',e=>{onDown(e.clientX,e.clientY);renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{
  if(dragging){onMove(e.clientX,e.clientY);return;}
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObject(inst)[0];
  const h=hit?hit.instanceId:-1;
  if(h!==hovered){hovered=h; renderer.domElement.style.cursor=h>=0?'pointer':'grab';}
});
renderer.domElement.addEventListener('pointerup',e=>{
  onUp();
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObject(inst)[0];
  if(hit){const n=NAMES[hit.instanceId]; setSelected(n); q.value=n;}
});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault(); dist=Math.max(28,Math.min(150,dist+e.deltaY*0.05));},{passive:false});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// labels: show selected node label
let labelSprite=null;
const group=new THREE.Group(); scene.add(group);
// put everything (stars excluded) into group for rotation
// -- simpler: rotate camera around origin
function updateLabel(){
  if(labelSprite){scene.remove(labelSprite);labelSprite=null;}
  if(selected>=0){
    labelSprite=makeLabel(NAMES[selected]);
    labelSprite.position.set(nodes[selected].x,nodes[selected].y+baseScale(selected)+3.2,nodes[selected].z);
    scene.add(labelSprite);
  }
}
new MutationObserver(updateLabel).observe(document.getElementById('detail'),{childList:true});

const clock=new THREE.Clock();
let auto=true;
renderer.domElement.addEventListener('pointerdown',()=>{auto=false;},true);
function animate(){
  requestAnimationFrame(animate);
  if(auto)rotY+=0.0016;
  const cy=Math.cos(rotX), sy=Math.sin(rotX);
  camera.position.set(Math.sin(rotY)*dist*cy, Math.sin(rotX)*dist+10, Math.cos(rotY)*dist*cy);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
document.getElementById('stats').innerHTML=`<b>${N}</b> palavras · <b>${edges.length}</b> relações`;
animate();
// initial selection from URL
const param=new URL(location.href).searchParams.get('word');
if(param && idx[param]!==undefined) setSelected(param,false);
else if(param){const m=NAMES.find(n=>n.toLowerCase()===param.toLowerCase()); if(m) setSelected(m,false);}
document.getElementById('loader').style.opacity='0';
setTimeout(()=>document.getElementById('loader').remove(),700);
updateLabel();
</script>
