<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Archer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1b2a4a; }
  body { font-family:'Baloo 2',sans-serif; }
  #game { position:fixed; inset:0; display:block; cursor:crosshair; }
  .hud { position:fixed; top:18px; left:0; right:0; display:flex; justify-content:center; gap:18px; pointer-events:none; z-index:5; }
  .pill { background:rgba(20,28,55,.72); border:1px solid rgba(255,255,255,.18); color:#fff; padding:8px 20px; border-radius:999px; font-weight:800; font-size:20px; letter-spacing:.5px; backdrop-filter:blur(6px); box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .pill b { color:#ffd166; }
  #lives { display:flex; gap:6px; align-items:center; }
  .heart { width:22px; height:22px; }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse at center, rgba(30,40,80,.82), rgba(10,15,35,.94)); z-index:10; transition:opacity .45s; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #overlay h1 { font-size:min(84px,12vw); color:#fff; text-shadow:0 6px 0 rgba(0,0,0,.3), 0 0 44px rgba(255,209,102,.35); letter-spacing:2px; line-height:1; }
  #overlay h1 span { color:#ffd166; }
  #overlay p { color:#cfd8ee; margin:18px 0 26px; font-size:20px; text-align:center; max-width:520px; padding:0 20px; }
  .btn { font-family:inherit; font-weight:800; font-size:24px; letter-spacing:1px; color:#26160a; background:linear-gradient(#ffe29a,#ffb347); border:none; border-radius:14px; padding:16px 46px; cursor:pointer; box-shadow:0 6px 0 #b06f1d, 0 12px 26px rgba(0,0,0,.45); transition:transform .12s, box-shadow .12s; }
  .btn:hover { transform:translateY(-2px) scale(1.03); box-shadow:0 8px 0 #b06f1d, 0 16px 30px rgba(0,0,0,.5); }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #b06f1d; }
  #finalScore { font-size:30px; color:#ffd166; margin-bottom:6px; font-weight:800; }
  #hint { position:fixed; bottom:18px; width:100%; text-align:center; color:rgba(255,255,255,.65); font-size:15px; letter-spacing:.4px; z-index:5; pointer-events:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
  <div class="pill">SCORE <b id="score">0</b></div>
  <div class="pill" id="lives"></div>
</div>
<div id="overlay">
  <h1>BALLOON<br><span>ARCHER</span></h1>
  <p id="subtitle">Mouse to aim &nbsp;·&nbsp; hold &amp; drag back to draw the bow &nbsp;·&nbsp; release to fire</p>
  <button class="btn" id="startBtn">START</button>
</div>
<div id="hint">Pop the balloons before they float away. Three escapes and you're out.</div>
<script>
(() => {
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const subtitle = document.getElementById('subtitle');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ---------- audio ----------
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; }
function blip(freq, dur, type, vol, slide) {
  try {
    const ac = audio(); const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(slide, 1), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
function pop() { blip(420 + Math.random() * 200, 0.12, 'square', 0.22, 90); blip(900, 0.08, 'triangle', 0.12, 300); }
function twang(p) { blip(160 + p * 180, 0.28, 'sawtooth', 0.16, 50); blip(70, 0.22, 'triangle', 0.2, 40); }
function thud() { blip(90, 0.18, 'sine', 0.22, 35); }
function over() { [330, 262, 196].forEach((f, i) => setTimeout(() => blip(f, 0.35, 'triangle', 0.2), i * 180)); }

// ---------- state ----------
const GRAV = 900;
const ARCHER = () => ({ x: W * 0.12, y: H * 0.82 });
let state = 'menu'; // menu | playing | over
let score = 0, lives = 3, arrows = [], balloons = [], particles = [], floats = [];
let mouse = { x: W * 0.5, y: H * 0.4, down: false, sx: 0, sy: 0 };
let charge = 0, aimAngle = -0.5;
let spawnTimer = 0, time = 0;

function drawHearts() {
  livesEl.innerHTML = '';
  for (let i = 0; i < lives; i++) {
    const s = document.createElement('span');
    s.innerHTML = '<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.5-9.2C1 8 3.5 4.5 7 4.5c2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 3.5 0 6 3.5 4.5 7.3C19.5 16.3 12 21 12 21z" fill="#ff5d73" stroke="#fff" stroke-width="1.2"/></svg>';
    livesEl.appendChild(s.firstChild);
  }
  if (!lives) { const s = document.createElement('span'); s.style.color = '#ff8fa0'; s.textContent = 'OUT'; livesEl.appendChild(s); }
}

function balloonColor() {
  const palette = ['#ff5d73', '#ffb347', '#ffd166', '#7bd88f', '#6ec6ff', '#c792ff'];
  return palette[(Math.random() * palette.length) | 0];
}
function spawnBalloon() {
  const small = Math.random() < 0.35;
  balloons.push({
    x: W * 0.32 + Math.random() * W * 0.62,
    y: H + 60,
    r: small ? 20 + Math.random() * 8 : 30 + Math.random() * 14,
    vy: 38 + Math.random() * 30 + score * 0.35,
    wob: Math.random() * Math.PI * 2,
    wobSpeed: 0.8 + Math.random() * 1.2,
    vx: (Math.random() - 0.5) * 14,
    color: balloonColor(),
    points: small ? 30 : 10
  });
}

function reset() {
  score = 0; lives = 3; arrows = []; balloons = []; particles = []; floats = [];
  spawnTimer = 0; charge = 0; time = 0;
  scoreEl.textContent = '0'; drawHearts();
}
function startGame() {
  audio(); reset(); state = 'playing';
  overlay.classList.add('hidden');
}
function endGame() {
  state = 'over'; over();
  subtitle.innerHTML = 'Final score <b style="color:#ffd166">' + score + '</b> &nbsp;·&nbsp; balloons left no room to escape';
  startBtn.textContent = 'PLAY AGAIN';
  overlay.classList.remove('hidden');
}
startBtn.addEventListener('click', startGame);

// ---------- input ----------
function canvasPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
canvas.addEventListener('mousedown', e => {
  if (state !== 'playing') return;
  const p = canvasPos(e); mouse.down = true; mouse.sx = p.x; mouse.sy = p.y; mouse.x = p.x; mouse.y = p.y; audio();
});
window.addEventListener('mousemove', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; });
window.addEventListener('mouseup', () => {
  if (!mouse.down) return; mouse.down = false;
  if (state !== 'playing') return;
  fire();
});
canvas.addEventListener('touchstart', e => {
  if (state !== 'playing') return;
  const t = e.touches[0]; const p = canvasPos(t);
  mouse.down = true; mouse.sx = p.x; mouse.sy = p.y; mouse.x = p.x; mouse.y = p.y; audio();
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchmove', e => {
  if (!mouse.down) return; const t = e.touches[0]; const p = canvasPos(t);
  mouse.x = p.x; mouse.y = p.y; e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', () => {
  if (!mouse.down) return; mouse.down = false;
  if (state === 'playing') fire();
});

function fire() {
  const a = ARCHER();
  const pull = Math.hypot(mouse.x - mouse.sx, mouse.y - mouse.sy);
  const power = Math.min(1, pull / 170);
  if (power < 0.06) { charge = 0; return; }
  const dx = mouse.x - a.x, dy = mouse.y - a.y;
  const len = Math.hypot(dx, dy) || 1;
  const speed = 380 + power * 720;
  arrows.push({ x: a.x + Math.cos(Math.atan2(dy, dx)) * 40, y: a.y - 10, vx: (dx / len) * speed, vy: (dy / len) * speed, rot: Math.atan2(dy, dx), life: 4 });
  twang(power);
  charge = 0;
}

function burst(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 240;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.55 + Math.random() * 0.4, max: 0.9, color, size: 2 + Math.random() * 4 });
  }
}
function addFloat(x, y, text) { floats.push({ x, y, text, life: 1 }); }

// ---------- update ----------
function update(dt) {
  time += dt;
  if (state !== 'playing') return;
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnBalloon(); spawnTimer = Math.max(0.7, 1.9 - score * 0.02); }

  const pull = mouse.down ? Math.hypot(mouse.x - mouse.sx, mouse.y - mouse.sy) : 0;
  charge = Math.min(1, pull / 170);
  const a = ARCHER();
  const dx = mouse.x - a.x, dy = mouse.y - (a.y - 10);
  if (Math.hypot(dx, dy) > 8) aimAngle = Math.atan2(dy, dx);

  for (const b of balloons) {
    b.wob += dt * b.wobSpeed;
    b.y -= b.vy * dt;
    b.x += Math.sin(b.wob) * 24 * dt + b.vx * dt;
  }
  for (let i = balloons.length - 1; i >= 0; i--) {
    if (balloons[i].y + balloons[i].r < 0) {
      balloons.splice(i, 1); lives--; drawHearts(); thud();
      addFloat(balloons[i] ? balloons[i].x : W / 2, 50, 'ESCAPED!');
      if (lives <= 0) { endGame(); return; }
    }
  }

  for (let i = arrows.length - 1; i >= 0; i--) {
    const ar = arrows[i];
    ar.vy += GRAV * dt; ar.x += ar.vx * dt; ar.y += ar.vy * dt;
    ar.rot = Math.atan2(ar.vy, ar.vx); ar.life -= dt;
    let hit = false;
    for (let j = balloons.length - 1; j >= 0; j--) {
      const b = balloons[j];
      if (Math.hypot(ar.x - b.x, ar.y - b.y) < b.r + 4) {
        burst(b.x, b.y, b.color); pop();
        score += b.points; scoreEl.textContent = score;
        addFloat(b.x, b.y - b.r - 6, '+' + b.points);
        balloons.splice(j, 1); hit = true; break;
      }
    }
    if (hit || ar.life <= 0 || ar.y > H + 40 || ar.x > W + 60 || ar.x < -60) arrows.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].y -= 46 * dt; floats[i].life -= dt * 0.9; if (floats[i].life <= 0) floats.splice(i, 1); }
}

// ---------- draw ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2b3a67'); g.addColorStop(0.55, '#4a5d8f'); g.addColorStop(1, '#2e7d5b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = 'rgba(255,230,150,0.85)';
  ctx.beginPath(); ctx.arc(W * 0.82, H * 0.16, 44, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,230,150,0.18)';
  ctx.beginPath(); ctx.arc(W * 0.82, H * 0.16, 82, 0, Math.PI * 2); ctx.fill();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 297 + time * 12) % (W + 300)) - 150, cy = H * (0.12 + i * 0.07);
    ctx.beginPath(); ctx.ellipse(cx, cy, 70, 20, 0, 0, Math.PI * 2); ctx.ellipse(cx + 46, cy + 6, 46, 15, 0, 0, Math.PI * 2); ctx.ellipse(cx - 48, cy + 8, 40, 14, 0, 0, Math.PI * 2); ctx.fill();
  }
  // hills
  ctx.fillStyle = '#245238';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H * 0.88 + Math.sin(x * 0.006 + 2) * 14);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

function drawArcher() {
  const a = ARCHER();
  ctx.save(); ctx.translate(a.x, a.y);
  // body
  ctx.fillStyle = '#3b2a1e';
  ctx.beginPath(); ctx.ellipse(0, -8, 20, 26, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9975f';
  ctx.beginPath(); ctx.arc(0, -44, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2b1e14';
  ctx.beginPath(); ctx.arc(0, -48, 12, Math.PI, 0); ctx.fill();
  // bow (rotates with aim)
  ctx.save();
  ctx.translate(Math.cos(aimAngle) * 18, -18 + Math.sin(aimAngle) * 18);
  ctx.rotate(aimAngle + Math.PI / 2);
  const drawPull = charge * 26;
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 0, 40, -Math.PI / 2.4, Math.PI / 2.4); ctx.stroke();
  // string
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.6;
  const topX = 40 * Math.sin(-Math.PI / 2.4), topY = 40 * Math.cos(-Math.PI / 2.4);
  const botX = 40 * Math.sin(Math.PI / 2.4), botY = 40 * Math.cos(Math.PI / 2.4);
  ctx.beginPath(); ctx.moveTo(topX, topY); ctx.lineTo(0, drawPull); ctx.lineTo(botX, botY); ctx.stroke();
  // arrow while charging
  if (mouse.down && charge > 0.05) {
    ctx.save(); ctx.translate(0, drawPull); ctx.rotate(Math.PI / 2);
    ctx.strokeStyle = '#e8d9b0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -52); ctx.stroke();
    ctx.fillStyle = '#e8e8e8';
    ctx.beginPath(); ctx.moveTo(0, -62); ctx.lineTo(-6, -48); ctx.lineTo(6, -48); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  ctx.restore();
}

function drawArrow(ar) {
  ctx.save(); ctx.translate(ar.x, ar.y); ctx.rotate(ar.rot);
  ctx.strokeStyle = '#e8d9b0'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(20, 0); ctx.stroke();
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(16, -4.5); ctx.lineTo(16, 4.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff8fa0';
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-22, -5); ctx.lineTo(-22, 5); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBalloon(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  // string
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0, b.r); ctx.quadraticCurveTo(Math.sin(b.wob * 1.4) * 8, b.r + 22, Math.sin(b.wob) * 12, b.r + 44); ctx.stroke();
  // body
  const grad = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.4, b.r * 0.2, 0, 0, b.r * 1.15);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.25, b.color); grad.addColorStop(1, shade(b.color, -45));
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(0, 0, b.r * 0.82, b.r, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = shade(b.color, -45);
  ctx.beginPath(); ctx.moveTo(-5, b.r - 2); ctx.lineTo(5, b.r - 2); ctx.lineTo(0, b.r + 9); ctx.closePath(); ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-b.r * 0.34, -b.r * 0.42, b.r * 0.2, b.r * 0.3, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + amt)), g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + amt)), b = Math.max(0, Math.min(255, (n & 0xff) + amt));
  return `rgb(${r},${g},${b})`;
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawFloats() {
  ctx.textAlign = 'center'; ctx.font = '800 26px "Baloo 2", sans-serif';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 4;
    ctx.strokeText(f.text, f.x, f.y); ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function drawPower() {
  if (!mouse.down || charge <= 0.02) return;
  const barW = 220, barH = 14, x = W / 2 - barW / 2, y = H - 56;
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.roundRect(x - 4, y - 4, barW + 8, barH + 8, 9); ctx.fill();
  const grad = ctx.createLinearGradient(x, 0, x + barW, 0);
  grad.addColorStop(0, '#7bd88f'); grad.addColorStop(0.6, '#ffd166'); grad.addColorStop(1, '#ff5d73');
  ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, y, barW * charge, barH, 6); ctx.fill();
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt);
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  for (const b of balloons) drawBalloon(b);
  drawArcher();
  for (const ar of arrows) drawArrow(ar);
  drawParticles(); drawFloats(); drawPower();
  requestAnimationFrame(loop);
}
drawHearts();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
