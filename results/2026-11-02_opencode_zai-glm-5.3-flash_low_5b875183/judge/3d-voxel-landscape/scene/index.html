<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chureito Pagoda — Mount Fuji at Dusk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1230}
  canvas{display:block}
  .overlay{position:fixed;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:5vh;font-family:'Cormorant Garamond',serif;color:#f3d9e0;
    text-shadow:0 2px 12px rgba(20,10,40,.8);opacity:.9}
  .overlay h1{font-size:clamp(20px,3.4vw,38px);font-weight:600;letter-spacing:.14em;margin:0;text-transform:uppercase}
  .overlay p{font-size:clamp(12px,1.4vw,16px);letter-spacing:.3em;margin:4px 0 0;opacity:.75;text-transform:uppercase}
</style>
</head>
<body>
<div class="overlay"><div style="text-align:center">
  <h1>Chūreitō</h1><p>Mount Fuji · Arakurayama</p>
</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x4a3a63, 0.016);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 600);
camera.position.set(0, 16, 46);
camera.lookAt(0, 12, -10);

// ---------- Lighting: dusk ----------
const hemi = new THREE.HemisphereLight(0xb08cd0, 0x33214a, 0.55);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xff9a5c, 1.5);
sun.position.set(-60, 26, -90); // sun low behind-left of Fuji
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-70; sun.shadow.camera.right=70;
sun.shadow.camera.top=60; sun.shadow.camera.bottom=-40;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x6f7ec9, 0.45);
fill.position.set(40, 30, 50);
scene.add(fill);

// ---------- Sky dome (vertex-gradient shader) ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(500, 32, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms:{ top:{value:new THREE.Color(0x1c1440)}, mid:{value:new THREE.Color(0x7a4d8f)},
               bot:{value:new THREE.Color(0xf2915e)} },
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vP; uniform vec3 top,mid,bot;
      void main(){ float h=normalize(vP).y;
        vec3 c = mix(bot, mid, smoothstep(-0.05,0.28,h));
        c = mix(c, top, smoothstep(0.22,0.75,h));
        gl_FragColor=vec4(c,1.);}`
  })
);
scene.add(sky);

// Stars in upper sky
{
  const n=350, pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*0.55+0.45); // upper dome
    const r=480;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const s=new THREE.Points(g,new THREE.PointsMaterial({color:0xfff2e0,size:1.6,sizeAttenuation:false,transparent:true,opacity:.8,fog:false}));
  scene.add(s);
}

// ---------- Materials ----------
const M = {
  snow:  new THREE.MeshLambertMaterial({color:0xf6eef4}),
  rock:  new THREE.MeshLambertMaterial({color:0x5a4f72, flatShading:true}),
  duskFace:new THREE.MeshLambertMaterial({color:0x8a6f9e, flatShading:true}),
  ground:new THREE.MeshLambertMaterial({color:0x3f6152, flatShading:true}),
  hill:  new THREE.MeshLambertMaterial({color:0x2e4a40, flatShading:true}),
  trunk: new THREE.MeshLambertMaterial({color:0x4a3527, flatShading:true}),
  red:   new THREE.MeshLambertMaterial({color:0xc0392b, flatShading:true}),
  white: new THREE.MeshLambertMaterial({color:0xf2ece2, flatShading:true}),
  roof:  new THREE.MeshLambertMaterial({color:0x9c2f23, flatShading:true}),
  petal: new THREE.MeshLambertMaterial({color:0xf7c8d8, flatShading:true}),
  pink:  new THREE.MeshLambertMaterial({color:0xf2a7c3, flatShading:true, flatShading:true}),
  pink2: new THREE.MeshLambertMaterial({color:0xe88bab, flatShading:true}),
};

// ---------- Mount Fuji ----------
function fuji(){
  const R=110, H=52, seg=48;
  const g=new THREE.ConeGeometry(R,H,seg,6);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const t=(y+H/2)/H; // 0 base -> 1 apex
    if(t<0.42){ // lower slopes: rocky ridged
      const a=Math.atan2(z,x);
      const ridge=0.9+0.12*Math.sin(a*9)+0.05*Math.sin(a*17+1.3);
      pos.setX(i,x*ridge); pos.setZ(i,z*ridge);
    }
    pos.setY(i,y + (Math.random()-0.5)*0.6*(1-t));
  }
  g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,[M.snow,M.rock]);
  // add a clean snow cap cone
  const cap=new THREE.Mesh(new THREE.ConeGeometry(R*0.40,H*0.36,seg,1),M.snow);
  cap.position.y=H/2 - H*0.36/2 + 0.05;
  // rim slightly wider snow band
  const band=new THREE.Mesh(new THREE.CylinderGeometry(R*0.42,R*0.47,H*0.06,seg,1),M.snow);
  band.position.y=H/2-H*0.36-H*0.03;
  const grp=new THREE.Group(); grp.add(mesh,cap,band);
  grp.position.set(6,-0.5,-120);
  return grp;
}
scene.add(fuji());

// ---------- Terrain: foreground hill (Arakurayama) ----------
const terrain = (()=>{
  const g=new THREE.PlaneGeometry(260,160,40,24);
  g.rotateX(-Math.PI/2);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    // rising hill toward back, rolling foreground, gentle center dip
    const back = THREE.MathUtils.smoothstep(-z,10,80)*10;
    const roll = Math.sin(x*0.05)*1.6 + Math.sin(z*0.07+x*0.03)*1.4;
    const dip  = -2.2*Math.exp(-((x*x)/600+((z+8)*(z+8))/500));
    const edge = THREE.MathUtils.smoothstep(Math.abs(x),80,130)*6;
    pos.setY(i, back+roll+dip+edge + (Math.random()-0.5)*0.5);
  }
  g.computeVertexNormals();
  const m=new THREE.Mesh(g,M.hill); m.receiveShadow=true;
  scene.add(m); return m;
})();
{
  const floor=new THREE.Mesh(new THREE.CircleGeometry(240,32).rotateX(-Math.PI/2), M.ground);
  floor.position.y=-0.4; scene.add(floor);
}

// ---------- Chureito pagoda: 5 tiers ----------
function pagoda(){
  const grp=new THREE.Group();
  // stone base
  const base=new THREE.Mesh(new THREE.BoxGeometry(8.4,1.2,8.4),M.white);
  base.position.y=0.6; grp.add(base);
  let y=1.2;
  const w0=6.2;
  for(let t=0;t<5;t++){
    const w=w0*Math.pow(0.86,t);
    // body
    const body=new THREE.Mesh(new THREE.BoxGeometry(w*0.72,2.0,w*0.72),M.red);
    body.position.y=y+1.0; body.castShadow=true; grp.add(body);
    // white band between floors
    const band=new THREE.Mesh(new THREE.BoxGeometry(w*0.76,0.35,w*0.76),M.white);
    band.position.y=y+0.18; grp.add(band);
    // roof: squashed pyramid with upturned flare
    const rh=w*1.28, roofH=0.95*Math.pow(0.9,t);
    const roof=new THREE.Mesh(new THREE.ConeGeometry(rh,roofH,4),M.roof);
    roof.rotation.y=Math.PI/4;
    roof.scale.y=1; roof.scale.set(1,1,0.82);
    roof.position.y=y+2.0+roofH/2; roof.castShadow=true;
    grp.add(roof);
    // eave underside
    const eave=new THREE.Mesh(new THREE.CylinderGeometry(rh*0.62,rh*0.7,0.18,4),M.red);
    eave.rotation.y=Math.PI/4; eave.position.y=y+2.0;
    grp.add(eave);
    y += 2.0+roofH;
  }
  // spire
  const spire=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.16,2.4,6),M.roof);
  spire.position.y=y+1.2; grp.add(spire);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.32,0.05,6,12),M.roof);
  ring.rotation.x=Math.PI/2; ring.position.y=y+1.9; grp.add(ring);

  grp.position.set(6, terrain.position.y+2.0, -8);
  // sit on terrain height
  grp.position.y = 5.2;
  grp.rotation.y = -0.5; // three-quarter view
  return grp;
}
scene.add(pagoda());

// ---------- Cherry trees ----------
const trees=[]; const canopyGeo=new THREE.IcosahedronGeometry(1,0);
function tree(x,z,s=1){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.16*s,0.28*s,1.8*s,5),M.trunk);
  trunk.position.y=0.9*s; trunk.castShadow=true; g.add(trunk);
  const blobs=[[0,2.0,0,1.15],[0.7,1.7,0.3,0.7],[-0.65,1.8,-0.25,0.75],[0.1,2.7,-0.4,0.6],[-0.15,2.6,0.45,0.65]];
  blobs.forEach((b,i)=>{
    const m=new THREE.Mesh(canopyGeo,(i%2?M.pink2:M.pink));
    m.position.set(b[0]*s,b[1]*s,b[2]*s); m.scale.setScalar(b[3]*s);
    m.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    m.castShadow=true; g.add(m);
  });
  g.position.set(x, 0, z);
  g.userData.phase=Math.random()*Math.PI*2;
  scene.add(g); trees.push(g); return g;
}
// rows framing the pagoda + scattered grove
[[-14,-2,1.2],[-19,4,1.0],[-10,6,1.1],[16,-1,1.25],[21,6,1.0],[12,7,1.1],[-25,12,0.9],[27,14,0.9],[-6,12,1.0],[19,13,0.85],[3,13,0.9],[-30,20,0.8],[30,22,0.8]]
 .forEach(t=>tree(t[0],t[1],t[2]));

// distant treeline silhouettes
{
  const mat=new THREE.MeshLambertMaterial({color:0x24394f,flatShading:true});
  for(let i=0;i<26;i++){
    const m=new THREE.Mesh(new THREE.ConeGeometry(2+Math.random()*2,5+Math.random()*4,5),mat);
    m.position.set(-120+Math.random()*240, 7+Math.random()*4, -70-Math.random()*20);
    scene.add(m);
  }
}

// ---------- Falling petals ----------
const PETALS=240;
const petals=new THREE.InstancedMesh(new THREE.PlaneGeometry(0.22,0.3),M.petal,PETALS);
petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const P=[]; const dummy=new THREE.Object3D();
for(let i=0;i<PETALS;i++)P.push({x:(Math.random()-0.5)*70,y:Math.random()*22,z:(Math.random()-0.5)*60,
  vy:0.6+Math.random()*0.8,ph:Math.random()*6.28,sp:0.6+Math.random()});
scene.add(petals);

// ---------- Clouds (drifting low-poly blobs) ----------
const clouds=[];
{
  const mat=new THREE.MeshLambertMaterial({color:0xd9b8c8,transparent:true,opacity:0.85,flatShading:true});
  for(let i=0;i<7;i++){
    const g=new THREE.Group();
    for(let j=0;j<4;j++){
      const m=new THREE.Mesh(canopyGeo,mat);
      m.position.set(j*2.2-3+Math.random(), Math.random()*0.8, Math.random()*1.5);
      m.scale.set(2.2+Math.random()*1.6, 0.9+Math.random()*0.5, 1.4+Math.random());
      g.add(m);
    }
    g.position.set(-90+Math.random()*180, 26+Math.random()*16, -40-Math.random()*60);
    g.userData.v=0.25+Math.random()*0.35;
    scene.add(g); clouds.push(g);
  }
}

// ---------- Animate ----------
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime(), dt=Math.min(clock.getDelta(),0.05);

  // gentle camera sway
  camera.position.x = Math.sin(t*0.08)*1.6;
  camera.position.y = 16 + Math.sin(t*0.13)*0.5;
  camera.lookAt(Math.sin(t*0.06)*1.2, 11.5, -12);

  // trees breathe
  for(const tr of trees){ const p=tr.userData.phase;
    tr.rotation.z = Math.sin(t*0.9+p)*0.02; tr.rotation.x = Math.cos(t*0.7+p)*0.015; }

  // petals
  for(let i=0;i<PETALS;i++){ const p=P[i];
    p.y-=p.vy*dt; p.x+=Math.sin(t*1.4+p.ph)*dt*1.2; p.z+=Math.cos(t+p.ph)*dt*0.6;
    if(p.y<0){ p.y=20+Math.random()*4; p.x=(Math.random()-0.5)*70; p.z=(Math.random()-0.5)*60; }
    dummy.position.set(p.x,p.y,p.z);
    dummy.rotation.set(t*p.sp+p.ph, t*0.8*p.sp, p.ph);
    dummy.updateMatrix(); petals.setMatrixAt(i,dummy.matrix);
  }
  petals.instanceMatrix.needsUpdate=true;

  // clouds drift
  for(const c of clouds){ c.position.x+=c.userData.v*dt; if(c.position.x>110)c.position.x=-110; }

  renderer.render(scene,camera);
}
tick();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
