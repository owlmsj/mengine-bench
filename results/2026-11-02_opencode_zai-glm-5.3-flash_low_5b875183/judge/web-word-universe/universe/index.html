<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras — Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d12; --panel:#12151d; --line:#232838; --ink:#e8e6df; --dim:#8b90a0;
    --accent:#e8b44a;
  }
  *{box-sizing:border-box; margin:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; overflow:hidden}
  header{position:fixed; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; gap:16px;
    padding:14px 20px; background:linear-gradient(#0b0d12f0,#0b0d1200); pointer-events:none}
  header *{pointer-events:auto}
  header h1{font-family:'Cormorant Garamond',serif; font-weight:700; font-size:22px; letter-spacing:.5px}
  header h1 em{color:var(--accent); font-style:normal}
  header .sub{font-size:12px; color:var(--dim)}
  #searchwrap{position:relative; margin-left:auto; width:min(340px,45vw)}
  #search{width:100%; padding:9px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font:inherit; font-size:14px; outline:none}
  #search:focus{border-color:var(--accent)}
  #suggest{position:absolute; top:110%; left:0; right:0; max-height:300px; overflow:auto; display:none;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 32px #0009}
  #suggest div{padding:8px 14px; cursor:pointer; font-size:14px; display:flex; justify-content:space-between; gap:8px}
  #suggest div span.deg{color:var(--dim); font-size:12px}
  #suggest div:hover,#suggest div.active{background:#1c2230}
  #canvas{position:fixed; inset:0}
  #panel{position:fixed; top:64px; right:16px; bottom:16px; width:min(360px,86vw); z-index:9;
    background:#12151df2; border:1px solid var(--line); border-radius:16px; padding:22px;
    overflow:auto; backdrop-filter:blur(6px); display:none}
  #panel h2{font-family:'Cormorant Garamond',serif; font-size:40px; line-height:1.05; font-weight:700; word-break:break-word}
  #panel .tema{display:inline-block; margin:8px 0 4px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--accent); border:1px solid #e8b44a55; border-radius:999px; padding:3px 10px}
  #panel .close{position:absolute; top:10px; right:12px; background:none; border:none; color:var(--dim);
    font-size:20px; cursor:pointer}
  #panel .close:hover{color:var(--ink)}
  .relgroup{margin-top:18px}
  .relgroup h3{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--dim); margin-bottom:8px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{border:1px solid var(--line); background:#1a1f2c; color:var(--ink); border-radius:999px;
    padding:5px 12px; font-size:13px; cursor:pointer; transition:.15s}
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  #panel .note{margin-top:20px; font-size:12px; color:var(--dim); line-height:1.6}
  #hint{position:fixed; left:20px; bottom:16px; z-index:9; color:var(--dim); font-size:12px; line-height:1.7}
  #stats{position:fixed; left:20px; top:64px; z-index:9; color:var(--dim); font-size:12px}
  #loading{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim)}
  @media (max-width:640px){ #panel{top:auto; height:55vh} #stats{display:none} }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<header>
  <div>
    <h1>Universo <em>de</em> Palavras</h1>
    <div class="sub">Dicionário Criativo — as palavras e os laços entre elas</div>
  </div>
  <div id="searchwrap">
    <input id="search" type="text" placeholder="Procurar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="suggest"></div>
  </div>
</header>
<div id="stats"></div>
<div id="hint">arraste para girar · role para aproximar · clique numa palavra</div>
<div id="loading">a carregar o universo…</div>
<aside id="panel">
  <button class="close" id="close" title="fechar">✕</button>
  <h2 id="p-word"></h2>
  <span class="tema" id="p-tema"></span>
  <div id="p-rels"></div>
  <div class="note" id="p-note"></div>
</aside>

const palette = ["#e8b44a","#5fb0e8","#e87a6a","#8fd47a","#c58ae0","#5fd4c4","#e8d05f","#e88ac2","#9aa5e8","#d4a06a","#7ac9a0","#d47a8f"];
const temaColor = {}; temas.forEach((t,i)=>temaColor[t]=palette[i%palette.length]);

/* layout: deterministic pseudo-random sphere + force relaxation */
function srand(seed){ let s=seed>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
const rnd = srand(42);
const nodes = words.map(w=>{
  const r = 34 + Math.sqrt(rnd())*46;
  const th = rnd()*Math.PI*2, ph = Math.acos(2*rnd()-1);
  return { w, x:r*Math.sin(ph)*Math.cos(th), y:r*Math.cos(ph)*0.8, z:r*Math.sin(ph)*Math.sin(th),
    vx:0, vy:0, vz:0, d:degree[w] };
});
const idx = {}; nodes.forEach((n,i)=>idx[n.w]=i);
const edges = [];
words.forEach(w=>{ for(const r in DATA[w].links) for(const t of DATA[w].links[r]){
  const a=idx[w], b=idx[t]; if(a===b) return;
  const k=Math.min(a,b)+"_"+Math.max(a,b);
  if(!edges.some(e=>e.k===k)) edges.push({a,b,k});
}});

/* force simulation (pre-run then light live) */
function step(rep){
  for(let it=0; it<rep; it++){
    for(const e of edges){
      const A=nodes[e.a], B=nodes[e.b];
      let dx=B.x-A.x, dy=B.y-A.y, dz=B.z-A.z;
      let dist=Math.sqrt(dx*dx+dy*dy+dz*dz)||0.01;
      const rest=16; const f=(dist-rest)*0.012;
      dx/=dist; dy/=dist; dz/=dist;
      A.vx+=dx*f*dist*0.05; A.vy+=dy*f*dist*0.05; A.vz+=dz*f*dist*0.05;
      B.vx-=dx*f*dist*0.05; B.vy-=dy*f*dist*0.05; B.vz-=dz*f*dist*0.05;
    }
    for(let i=0;i<nodes.length;i++){
      const A=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const B=nodes[j];
        let dx=B.x-A.x, dy=B.y-A.y, dz=B.z-A.z;
        let d2=dx*dx+dy*dy+dz*dz+0.01;
        if(d2>2500) continue;
        const f=140/d2;
        const d=Math.sqrt(d2); dx/=d; dy/=d; dz/=d;
        A.vx-=dx*f; A.vy-=dy*f; A.vz-=dz*f;
        B.vx+=dx*f; B.vy+=dy*f; B.vz+=dz*f;
      }
    }
    for(const n of nodes){
      n.vx*=0.85; n.vy*=0.85; n.vz*=0.85;
      n.x+=n.vx; n.y+=n.vy; n.z+=n.vz;
      const L=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1;
      if(L>95){ n.x*=95/L; n.y*=95/L; n.z*=95/L; }
    }
  }
}
step(320);

/* ---------- three.js scene ---------- */
const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0d12, 0.006);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
camera.position.set(0, 20, 150);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const l1 = new THREE.DirectionalLight(0xfff4e0, 1.1); l1.position.set(60,80,40); scene.add(l1);
const l2 = new THREE.DirectionalLight(0x8899ff, 0.4); l2.position.set(-60,-40,-60); scene.add(l2);

/* edges */
const edgePos = new Float32Array(edges.length*6);
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute("position", new THREE.BufferAttribute(edgePos,3));
const edgeMat = new THREE.LineBasicMaterial({color:0x3a4260, transparent:true, opacity:0.42});
const lineObj = new THREE.LineSegments(edgeGeo, edgeMat); scene.add(lineObj);

/* nodes: sphere + text sprite */
function labelSprite(text, size, color){
  const c=document.createElement("canvas"); const s=128; const fs=44;
  const ctx=c.getContext("2d"); ctx.font=`600 ${fs}px 'IBM Plex Sans',sans-serif`;
  const w=Math.ceil(ctx.measureText(text).width)+28;
  c.width=w; c.height=s; const ctx2=c.getContext("2d");
  ctx2.font=ctx.font; ctx2.textBaseline="middle";
  ctx2.fillStyle="rgba(8,10,16,0.55)";
  const r=16; ctx2.beginPath(); ctx2.roundRect(2,8,w-4,s-16,r); ctx2.fill();
  ctx2.strokeStyle=color+"99"; ctx2.lineWidth=2; ctx2.stroke();
  ctx2.fillStyle=color; ctx2.textAlign="center"; ctx2.fillText(text,w/2,s/2+2);
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4;
  const m=new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  const sp=new THREE.Sprite(m);
  sp.scale.set(size*(w/s), size, 1);
  return sp;
}
const nodeGroup = new THREE.Group(); scene.add(nodeGroup);
const meshes = [];
for(const n of nodes){
  const col = new THREE.Color(temaColor[DATA[n.w].tema]||"#aaa");
  const rad = 1.1 + Math.sqrt(n.d/maxDeg)*2.6;
  const geo = new THREE.SphereGeometry(rad, 20, 16);
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:0.45, metalness:0.1,
    emissive:col, emissiveIntensity:0.12});
  const m = new THREE.Mesh(geo, mat); m.userData.w = n.w;
  const lab = labelSprite(n.w, 6.5, temaColor[DATA[n.w].tema]||"#aaa");
  lab.position.y = rad + 3.4;
  m.add(lab);
  nodeGroup.add(m); meshes.push(m);
  n.mesh=m; n.lab=lab;
}
function syncEdges(){
  for(let i=0;i<edges.length;i++){
    const A=nodes[edges[i].a], B=nodes[edges[i].b];
    edgePos.set([A.x,A.y,A.z,B.x,B.y,B.z], i*6);
  }
  edgeGeo.attributes.position.needsUpdate = true;
}
syncEdges();

/* camera orbit (hand-rolled, no addons needed) */
let theta=0.4, phi=1.25, dist=150, targetDist=150;
let dragging=false, px=0, py=0, moved=false;
canvas.addEventListener("pointerdown", e=>{dragging=true; moved=false; px=e.clientX; py=e.clientY; canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx=e.clientX-px, dy=e.clientY-py;
  if(Math.abs(dx)+Math.abs(dy)>3) moved=true;
  theta-=dx*0.005; phi=Math.min(2.9,Math.max(0.25,phi-dy*0.005));
  px=e.clientX; py=e.clientY;
});
canvas.addEventListener("pointerup", ()=>dragging=false);
canvas.addEventListener("wheel", e=>{e.preventDefault(); targetDist=Math.min(420,Math.max(40,targetDist*(1+Math.sign(e.deltaY)*0.12)));},{passive:false});

/* picking */
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2();
let hover=null;
canvas.addEventListener("pointermove", e=>{
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(meshes,false)[0];
  hover=hit?hit.object.userData.w:null;
  canvas.style.cursor=hover?"pointer":(dragging?"grabbing":"grab");
});
canvas.addEventListener("click", ()=>{ if(hover && !moved) select(hover); });

function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

/* highlight state */
let selected=null;
function applyHighlight(){
  for(const n of nodes){
    const m=n.mesh, on=!selected || n.w===selected || linkedTo(selected).has(n.w);
    m.material.emissiveIntensity = selected ? (n.w===selected?0.75: (on?0.3:0.02)) : 0.12;
    m.material.opacity = on?1:0.15; m.material.transparent=true;
    n.lab.material.opacity = on?1:0.12;
  }
  if(selected){
    for(let i=0;i<edges.length;i++){
      const A=nodes[edges[i].a].w, B=nodes[edges[i].b].w;
      edgeMat.color.setHex(0x3a4260);
    }
  }
}
function linkedTo(w){
  const s=new Set();
  for(const r in DATA[w].links) for(const t of DATA[w].links[r]) s.add(t);
  // incoming
  for(const w2 of words){ if(w2===w) continue; for(const r in DATA[w2].links) if(DATA[w2].links[r].includes(w)) s.add(w2); }
  return s;
}
const linkType = {};
words.forEach(w=>{ for(const r in DATA[w].links) for(const t of DATA[w].links[r]){
  const k=[w,t].sort((a,b)=>a.localeCompare(b,"pt")).join("|");
  if(!linkType[k]) linkType[k]=new Set(); linkType[k].add(r);
}});

/* ---------- UI ---------- */
const search=document.getElementById("search"), suggest=document.getElementById("suggest");
let sugIdx=-1, sugList=[];
function showSuggest(q){
  q=q.trim().toLowerCase();
  if(!q){suggest.style.display="none"; return;}
  sugList=words.filter(w=>w.toLowerCase().includes(q)).slice(0,12);
  if(!sugList.length){suggest.style.display="none"; return;}
  suggest.innerHTML=sugList.map((w,i)=>
    `<div data-w="${w}" class="${i===sugIdx?'active':''}">${w}<span class="deg">${degree[w]} laços</span></div>`).join("");
  suggest.style.display="block";
  suggest.querySelectorAll("div").forEach(d=>d.onclick=()=>select(d.dataset.w));
}
search.addEventListener("input", ()=>{sugIdx=-1; showSuggest(search.value);});
search.addEventListener("keydown", e=>{
  if(e.key==="ArrowDown"){sugIdx=Math.min(sugIdx+1,sugList.length-1); showSuggest(search.value); e.preventDefault();}
  else if(e.key==="ArrowUp"){sugIdx=Math.max(sugIdx-1,0); showSuggest(search.value); e.preventDefault();}
  else if(e.key==="Enter"){
    const w=sugIdx>=0?sugList[sugIdx]:(lower[search.value.trim().toLowerCase()]||null);
    if(w) select(w); suggest.style.display="none";
  } else if(e.key==="Escape"){ suggest.style.display="none"; }
});
document.addEventListener("click", e=>{ if(!e.target.closest("#searchwrap")) suggest.style.display="none"; });

const panel=document.getElementById("panel");
document.getElementById("close").onclick=()=>select(null);

function select(w){
  selected=w;
  const url = w ? `${location.pathname}?word=${encodeURIComponent(w)}` : location.pathname;
  history.replaceState(null,"",url);
  if(!w){ panel.style.display="none"; applyHighlight(); return; }
  search.value=w; suggest.style.display="none";
  document.getElementById("p-word").textContent=w;
  const t=DATA[w].tema; const te=document.getElementById("p-tema");
  te.textContent=t||"sem tema"; te.style.display=t?"":"none";
  const rels=document.getElementById("p-rels"); rels.innerHTML="";
  const allLinks={}; // merged: rel type -> words (both directions)
  for(const r in DATA[w].links) for(const t2 of DATA[w].links[r]) (allLinks[r]??=new Set()).add(t2);
  for(const w2 of words){ if(w2===w) continue;
    for(const r in DATA[w2].links) if(DATA[w2].links[r].includes(w)) (allLinks[r]??=new Set()).add(w2);
  }
  for(const r of Object.keys(allLinks).sort()){
    const g=document.createElement("div"); g.className="relgroup";
    g.innerHTML=`<h3>${r} (${allLinks[r].size})</h3>`;
    const ch=document.createElement("div"); ch.className="chips";
    for(const t2 of [...allLinks[r]].sort((a,b)=>a.localeCompare(b,"pt"))){
      const b=document.createElement("button"); b.className="chip"; b.textContent=t2;
      b.onclick=()=>select(t2); ch.appendChild(b);
    }
    g.appendChild(ch); rels.appendChild(g);
  }
  document.getElementById("p-note").innerHTML =
    `${degree[w]} laços no total · ${temas.length} temas no universo · partilha: <code>?word=${encodeURIComponent(w)}</code>`;
  panel.style.display="block";
  applyHighlight();
  // focus camera on node
  const n=nodes[idx[w]];
  const L=Math.hypot(n.x,n.y,n.z)||1;
  targetDist=70;
  const tTh=Math.atan2(n.x,n.z), tPh=Math.acos(n.y/L);
  // animate
  animTheta=tTh; animPhi=Math.min(2.6,Math.max(0.4,tPh));
}
let animTheta=null, animPhi=null;

/* animate loop */
const clock=new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t=clock.getElapsedTime();
  if(animTheta!==null){ theta+= (animTheta-theta)*0.08; phi+=(animPhi-phi)*0.08; dist+=(targetDist-dist)*0.08;
    if(Math.abs(animTheta-theta)<0.001) animTheta=null; }
  else { dist+=(targetDist-dist)*0.1; if(!dragging) theta+=0.0006; }
  camera.position.set(dist*Math.sin(phi)*Math.sin(theta), dist*Math.cos(phi), dist*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(0,0,0);
  // gentle drift
  for(const n of nodes){ n.mesh.position.set(n.x+Math.sin(t*0.5+idx[n.w])*0.8, n.y+Math.cos(t*0.4+idx[n.w])*0.8, n.z); }
  syncEdges();
  // face labels to camera is automatic for sprites
  for(const n of nodes) n.lab.material.color.set(n.w===hover?"#ffffff":(temaColor[DATA[n.w].tema]||"#aaa"));
  renderer.render(scene,camera);
}

document.getElementById("stats").textContent = `${words.length} palavras · ${pairSeen.size} relações · ${temas.length} temas`;
document.getElementById("loading").remove();

/* open ?word= */
const q=new URLSearchParams(location.search).get("word");
if(q){ const w=lower[q.toLowerCase()]; if(w) select(w); else { search.value=q; showSuggest(q); } }
else search.focus();
tick();
</script>
</body>
</html>
