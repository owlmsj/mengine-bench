<!doctype html><html><head><meta charset="utf-8"><title>Great Wave - low poly</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8d9b8}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
const PAPER=0xe9dcbc, PRUSSIAN=0x1c3f75, MIDBLUE=0x2f5f9c, PALE=0x9cc3d6, FOAM=0xf4efe0, BOATC=0xd9a886, GRAY=0x6d6a63;
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(PAPER);
const cam=new THREE.PerspectiveCamera(35,1,0.1,200);cam.position.set(0,0,40);
s.add(new THREE.HemisphereLight(0xfff6e0,0x6d7e95,1.6));const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(-5,10,10);s.add(sun);
const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true,side:THREE.DoubleSide});
function shape(pts,z,c,d=0.6){const sh=new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],p[1])));const m=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:d,bevelEnabled:false,curveSegments:2}),M(c));m.position.z=z;s.add(m);return m;}
// dark horizon band behind Fuji (print's gray gradient)
const band=shape([[-30,-6],[30,-6],[30,-1],[-30,-1]],-12,GRAY,0.1);band.material.transparent=true;band.material.opacity=0.55;
const band2=shape([[-30,-1],[30,-1],[30,1.5],[-30,1.5]],-12.1,0xb3a78f,0.1);
// clouds
shape([[3,9],[6,11],[9,10.5],[12,11.5],[14,9],[10,8],[5,8]],-11,0xf3ecdc,0.1);
// Mount Fuji, small, centered-right low
const fuji=shape([[-3.5,-3.6],[0,0],[3.5,-3.6]],-10,MIDBLUE,1);fuji.position.x=4;
const cap=shape([[-1.6,-1.65],[-0.9,-1.3],[-0.4,-1.7],[0,-1.2],[0.5,-1.65],[1,-1.3],[1.6,-1.65],[0,0]],-9.8,FOAM,0.5);cap.position.x=4;
// sea
const seaG=new THREE.PlaneGeometry(80,30,40,12);const sea=new THREE.Mesh(seaG,M(MIDBLUE));sea.rotation.x=-Math.PI/2;sea.position.set(0,-6,-8);s.add(sea);
// great wave: curling silhouette (left), layered
const wave=[[-24,-12],[-24,4],[-20,6],[-15,9.5],[-10,11.5],[-5,11.8],[-1,10.5],[2,8.5],[3.5,6.2],[2.6,4.6],[1,5.6],[-0.5,6.5],[-2,6],[-3,4],[-3.4,0],[-2.5,-4],[-1,-8],[0,-12]];
const wDark=shape(wave,-2,PRUSSIAN,1.2);
const inner=wave.map(([x,y])=>[x*0.93-0.8,y*0.88-0.6]);const wMid=shape(inner,-1.2,MIDBLUE,0.4);
const body=[[-24,-12],[-24,3],[-18,5],[-12,6.5],[-8,5],[-6,1],[-7,-4],[-4,-12]];const wWhite=shape(body,-0.5,FOAM,0.4);
// foreground wave + a small wave mimicking Fuji (lower left)
const fg=shape([[-24,-14],[-24,-8],[-20,-5],[-16,-4.2],[-13,-5],[-11,-8],[-9,-14]],2,PRUSSIAN,1);
const fgW=shape([[-23,-14],[-22,-9],[-19,-6.5],[-16,-5.7],[-14,-7],[-12,-14]],2.6,FOAM,0.3);
// right-side swell
const rw=shape([[0,-14],[6,-6],[12,-3],[17,0],[24,3],[24,-14]],-4,MIDBLUE,1);
const rwW=shape([[2,-14],[8,-7.5],[14,-4.5],[19,-2],[24,0.6],[24,-14]],-3.2,FOAM,0.3);
const rw2=shape([[2,-14],[10,-9],[16,-7.5],[24,-5],[24,-14]],-2.6,PRUSSIAN,0.6);
// foam claws along the crest
const claws=new THREE.Group();s.add(claws);const clawG=new THREE.TetrahedronGeometry(0.55,0);
for(let i=0;i<wave.length-8;i++){const a=wave[i+2],b=wave[i+3];for(let k=0;k<4;k++){const t=k/4,m=new THREE.Mesh(clawG,M(FOAM));m.position.set(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t+0.3,-0.6);m.userData.p=Math.random()*6;claws.add(m);}}
// spray flecks
for(let i=0;i<70;i++){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(0.12,0),M(FOAM));m.position.set(-2+Math.random()*7,-3+Math.random()*9,0.2);m.userData.p=Math.random()*6;claws.add(m);}
// three oshiokuri-bune boats with rowers
const boats=[];function boat(x,y,rot,sc){const g=new THREE.Group();
 const hull=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.3,9,5,1),M(BOATC));hull.rotation.z=Math.PI/2;hull.scale.set(1,1,0.6);g.add(hull);
 for(let i=0;i<8;i++){const h=new THREE.Mesh(new THREE.IcosahedronGeometry(0.32,0),M(PRUSSIAN));h.position.set(-3+i*0.8,0.6,0.2);g.add(h);}
 g.position.set(x,y,0.5);g.rotation.z=rot;g.scale.setScalar(sc);s.add(g);boats.push({g,y,rot,p:Math.random()*6});}
boat(-14,-4.5,-0.5,1);boat(9,-3,0.35,0.9);boat(2,-9,-0.2,1.1);
// title cartouche (upper left, built in code)
const cart=shape([[-21,7.5],[-19.6,7.5],[-19.6,11.5],[-21,11.5]],1,0xf6efdc,0.1);
function resize(){r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1.4?35*1.4/cam.aspect:35;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const base=seaG.attributes.position.array.slice();const clock=new THREE.Clock();
r.setAnimationLoop(()=>{const t=clock.getElapsedTime();
 const pa=seaG.attributes.position.array;for(let i=0;i<pa.length;i+=3)pa[i+2]=Math.sin(base[i]*0.3+t)*0.4+Math.cos(base[i+1]*0.4+t*0.7)*0.3;seaG.attributes.position.needsUpdate=true;seaG.computeVertexNormals();
 const sw=Math.sin(t*0.5)*0.15;wDark.rotation.z=wMid.rotation.z=sw*0.08;wDark.position.y=wMid.position.y=sw;
 rw.position.y=rwW.position.y=rw2.position.y=Math.sin(t*0.6+1)*0.3;fg.position.y=fgW.position.y=Math.sin(t*0.7+2)*0.25;
 claws.children.forEach(c=>{c.rotation.set(t+c.userData.p,t*0.7,0);c.position.z=-0.6+Math.sin(t*1.5+c.userData.p)*0.3;});
 boats.forEach(b=>{b.g.position.y=b.y+Math.sin(t*0.8+b.p)*0.3;b.g.rotation.z=b.rot+Math.sin(t*0.6+b.p)*0.05;});
 cam.position.x=Math.sin(t*0.1)*1.2;cam.lookAt(0,0,0);r.render(s,cam);});
</script></body></html>
