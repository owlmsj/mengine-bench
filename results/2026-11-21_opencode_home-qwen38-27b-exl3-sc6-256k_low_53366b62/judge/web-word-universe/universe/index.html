<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a14; --ink:#e8ecf8; --dim:#8b93ad; --amber:#ffd28a; --blue:#9ad1ff;
  --line:rgba(140,160,220,.16); --panel:rgba(10,14,28,.82);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:Inter,system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
header{position:absolute;top:22px;left:26px;max-width:min(46vw,520px)}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(26px,3.4vw,40px);
  margin:0;letter-spacing:.01em}
h1 em{font-style:italic;font-weight:300;color:var(--dim)}
.stats{margin:8px 0 0;color:var(--dim);font-size:13px;letter-spacing:.04em}
.stats b{color:var(--ink);font-weight:500}
#searchbox{position:absolute;top:26px;right:26px;width:min(34vw,340px)}
#search{width:100%;padding:11px 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:400 14px Inter,sans-serif;outline:none;
  backdrop-filter:blur(8px)}
#search:focus{border-color:rgba(255,210,138,.5)}
#search::placeholder{color:var(--dim)}
#panel{position:absolute;top:86px;right:26px;width:min(34vw,340px);max-height:calc(100vh - 150px);
  overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px 22px;backdrop-filter:blur(10px);scrollbar-width:thin}
#panel h2{font-family:Fraunces,serif;font-size:30px;margin:0 0 2px;font-weight:600}
#p-tema{margin:0;color:var(--amber);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#p-alias{margin:6px 0 0;color:var(--dim);font-size:12px}
#panel h3{margin:18px 0 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);font-weight:600}
#p-links{list-style:none;margin:0;padding:0}
#p-links li{margin:0}
#p-links a{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;margin:2px 0;
  border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px}
#p-links a:hover{background:rgba(154,209,255,.1)}
#p-links .tag{color:var(--dim);font-size:11px;letter-spacing:.06em}
#close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--dim);
  font-size:20px;cursor:pointer;line-height:1}
#close:hover{color:var(--ink)}
#hint{position:absolute;bottom:18px;left:26px;margin:0;color:var(--dim);font-size:12px;
  letter-spacing:.05em}
#fallback{position:fixed;inset:0;overflow:auto;padding:90px 26px 40px}
#fallback .chips{display:flex;flex-wrap:wrap;gap:8px}
#fallback .chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;font-size:13px}
#fallback .chip:hover{border-color:var(--amber)}
#fallback .chip.sel{background:var(--amber);color:#1a1205;border-color:var(--amber)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <header>
    <h1>Universo de <em>Palavras</em></h1>
    <p class="stats"><b id="stat-words"></b> palavras · <b id="stat-rel"></b> relações · mais conectadas: <b id="stat-top"></b></p>
  </header>
  <div id="searchbox">
    <input id="search" list="wordlist" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
    <datalist id="wordlist"></datalist>
  </div>
  <aside id="panel" hidden>
    <button id="close" title="fechar">×</button>
    <h2 id="p-name"></h2>
    <p id="p-tema"></p>
    <p id="p-alias"></p>
    <h3>Relações <span id="p-count"></span></h3>
    <ul id="p-links"></ul>
  </aside>
  <p id="hint">arraste para orbitar · role para aproximar · clique numa palavra</p>
</div>
<div id="fallback" hidden></div>

/* ---------- graph ---------- */
const keys = Object.keys(DATA.words);
const idx = {}; keys.forEach((k,i)=>idx[k]=i);
const adj = {}; keys.forEach(k=>adj[k]=new Set(DATA.words[k]));
const inDeg = {}; keys.forEach(k=>inDeg[k]=0);
keys.forEach(k=>adj[k].forEach(t=>inDeg[t]++));
const deg = k=>adj[k].size + inDeg[k];
const norm = s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const byNorm = {};
keys.forEach(k=>{ byNorm[norm(k)]=k;
  (DATA.meta[k].aliases||[]).forEach(a=>byNorm[norm(a)]=k); });
const pairs = new Set();
keys.forEach(k=>adj[k].forEach(t=>pairs.add([k,t].sort().join('\u0000'))));

document.getElementById('stat-words').textContent = keys.length;
document.getElementById('stat-rel').textContent = pairs.size;
const maxDeg = Math.max(...keys.map(deg));
document.getElementById('stat-top').textContent =
  keys.filter(k=>deg(k)===maxDeg).map(k=>DATA.meta[k].name).join(' e ');

/* ---------- selection / panel (shared by 3D and fallback) ---------- */
const $ = id=>document.getElementById(id);
let selected = null;
function select(key, push=true){
  selected = key;
  if(!key){ $('panel').hidden = true; }
  else{
    const m = DATA.meta[key];
    $('panel').hidden = false;
    $('p-name').textContent = m.name;
    $('p-tema').textContent = m.tema ? 'tema: '+m.tema : 'sem tema (link órfão)';
    $('p-alias').textContent = (m.aliases&&m.aliases.length) ? 'também: '+m.aliases.join(', ') : '';
    const typed = m.typed||{};
    const rels = [...adj[key]].sort((a,b)=>deg(b)-deg(a));
    $('p-count').textContent = rels.length;
    $('p-links').innerHTML = rels.map(t=>{
      const kinds = (typed[t]||[]).map(s=>s==='sinonimos'?'sinônimo':'análoga').join(' · ');
      return '<li><a href="?word='+encodeURIComponent(t)+'" data-k="'+t+'">'+
        DATA.meta[t].name+'<span class="tag">'+kinds+'</span></a></li>';
    }).join('');
  }
  if(push) history.replaceState(null,'', key ? '?word='+encodeURIComponent(key) : location.pathname);
  applyHighlight();
}
$('p-links').addEventListener('click', e=>{
  const a = e.target.closest('a[data-k]');
  if(a){ e.preventDefault(); select(a.dataset.k); }
});
$('close').addEventListener('click', ()=>select(null));
const search = $('search');
function trySearch(){
  const k = byNorm[norm(search.value.trim())];
  if(k) select(k);
}
search.addEventListener('change', trySearch);
search.addEventListener('keydown', e=>{ if(e.key==='Enter') trySearch(); });
keys.forEach(k=>{
  const o = document.createElement('option');
  o.value = DATA.meta[k].name;
  $('wordlist').appendChild(o);
});

/* ---------- 3D view ---------- */
let applyHighlight = ()=>{};
async function start3D(){
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js');
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070a14, 0.0035);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);

  /* layout: force simulation */
  const N = keys.length;
  const pos = new Float32Array(N*3);
  const vel = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const r=30+Math.random()*30, th=Math.random()*6.283, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
  }
  const edges=[];
  keys.forEach((k,i)=>adj[k].forEach(t=>{ const j=idx[t]; if(j>undefined&&j!==i) edges.push([i,j]); }));
  for(let it=0; it<240; it++){
    const cool = 1 - it/240;
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      const d2=dx*dx+dy*dy+dz*dz+0.05, d=Math.sqrt(d2), f=260/d2;
      dx=dx/d*f; dy=dy/d*f; dz=dz/d*f;
      vel[i*3]+=dx*cool; vel[i*3+1]+=dy*cool; vel[i*3+2]+=dz*cool;
      vel[j*3]-=dx*cool; vel[j*3+1]-=dy*cool; vel[j*3+2]-=dz*cool;
    }
    for(const [i,j] of edges){
      let dx=pos[j*3]-pos[i*3], dy=pos[j*3+1]-pos[i*3+1], dz=pos[j*3+2]-pos[i*3+2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01, f=(d-13)*0.025;
      dx=dx/d*f; dy=dy/d*f; dz=dz/d*f;
      vel[i*3]+=dx; vel[i*3+1]+=dy; vel[i*3+2]+=dz;
      vel[j*3]-=dx; vel[j*3+1]-=dy; vel[j*3+2]-=dz;
    }
    for(let i=0;i<N;i++){
      vel[i*3]-=pos[i*3]*0.0025; vel[i*3+1]-=pos[i*3+1]*0.0025; vel[i*3+2]-=pos[i*3+2]*0.0025;
      vel[i*3]*=0.82; vel[i*3+1]*=0.82; vel[i*3+2]*=0.82;
      pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
    }
  }

  /* starfield */
  const starGeo = new THREE.BufferGeometry();
  const sp = new Float32Array(900*3);
  for(let i=0;i<900;i++){
    const r=300+Math.random()*500, th=Math.random()*6.283, ph=Math.acos(2*Math.random()-1);
    sp[i*3]=r*Math.sin(ph)*Math.cos(th); sp[i*3+1]=r*Math.sin(ph)*Math.sin(th); sp[i*3+2]=r*Math.cos(ph);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0x3a4568,size:1.4,transparent:true,opacity:.8})));

  /* labels */
  function makeLabel(text){
    const c=document.createElement('canvas'), ctx=c.getContext('2d');
    const font='500 44px Inter, sans-serif';
    ctx.font=font;
    const w=Math.ceil(ctx.measureText(text).width)+28;
    c.width=w; c.height=72;
    ctx.font=font; ctx.fillStyle='#fff'; ctx.textBaseline='middle';
    ctx.fillText(text,14,38);
    const tex=new THREE.CanvasTexture(c);
    const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,opacity:.85});
    const s=new THREE.Sprite(mat);
    const sc=0.075;
    s.scale.set(w*sc,72*sc,1);
    return s;
  }
  const sprites=[];
  keys.forEach((k,i)=>{
    const s=makeLabel(DATA.meta[k].name);
    s.position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
    s.userData.key=k;
    scene.add(s); sprites.push(s);
  });

  /* edges */
  const epos=new Float32Array(edges.length*6), ecol=new Float32Array(edges.length*6);
  const edgeGeo=new THREE.BufferGeometry();
  edgeGeo.setAttribute('position',new THREE.BufferAttribute(epos,3));
  edgeGeo.setAttribute('color',new THREE.BufferAttribute(ecol,3));
  const lines=new THREE.LineSegments(edgeGeo,
    new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.9}));
  scene.add(lines);
  function paintEdges(){
    for(let e=0;e<edges.length;e++){
      const [i,j]=edges[e];
      epos[e*6]=pos[i*3]; epos[e*6+1]=pos[i*3+1]; epos[e*6+2]=pos[i*3+2];
      epos[e*6+3]=pos[j*3]; epos[e*6+4]=pos[j*3+1]; epos[e*6+5]=pos[j*3+2];
      let r,g,b;
      if(selected){
        const on = keys[i]===selected || keys[j]===selected;
        if(on){ r=1; g=.82; b=.54; } else { r=.09; g=.11; b=.18; }
      } else { r=.22; g=.27; b=.42; }
      ecol[e*6]=r; ecol[e*6+1]=g; ecol[e*6+2]=b;
      ecol[e*6+3]=r; ecol[e*6+4]=g; ecol[e*6+5]=b;
    }
    edgeGeo.attributes.position.needsUpdate=true;
    edgeGeo.attributes.color.needsUpdate=true;
  }
  applyHighlight=function(){
    const nb = selected ? adj[selected] : null;
    sprites.forEach(s=>{
      const k=s.userData.key;
      if(!selected){ s.material.opacity=.85; s.material.color.set(0xcdd6f4); s.scale.multiplyScalar(1); }
      else if(k===selected){ s.material.opacity=1; s.material.color.set(0xffd28a); }
      else if(nb.has(k)){ s.material.opacity=1; s.material.color.set(0x9ad1ff); }
      else { s.material.opacity=.1; s.material.color.set(0x8b93ad); }
    });
    paintEdges();
  };

  /* orbit + zoom + pick */
  let theta=.7, phi=1.15, dist=170, dragging=false, px=0, py=0, moved=0;
  function resize(){
    const w=innerWidth,h=innerHeight;
    renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize); resize();
  canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;px=e.clientX;py=e.clientY;});
  addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dx=e.clientX-px, dy=e.clientY-py;
    moved+=Math.abs(dx)+Math.abs(dy);
    theta-=dx*.005; phi=Math.max(.2,Math.min(Math.PI-.2,phi-dy*.005));
    px=e.clientX; py=e.clientY;
  });
  addEventListener('pointerup',e=>{
    if(!dragging) return; dragging=false;
    if(moved<6){
      const rc=new THREE.Raycaster();
      const v=new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
      rc.setFromCamera(v,camera);
      const hit=rc.intersectObjects(sprites)[0];
      select(hit ? hit.object.userData.key : null);
    }
  });
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();
    dist=Math.max(50,Math.min(600,dist*(1+Math.sign(e.deltaY)*.08)));
  },{passive:false});

  let t=0;
  (function frame(){
    requestAnimationFrame(frame);
    if(!dragging) t+=0.0012;
    camera.position.set(
      dist*Math.sin(phi)*Math.sin(theta+t),
      dist*Math.cos(phi),
      dist*Math.sin(phi)*Math.cos(theta+t));
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  })();
  applyHighlight();
}

/* ---------- fallback (no WebGL / CDN blocked) ---------- */
function startFallback(){
  $('c').style.display='none';
  const fb=$('fallback'); fb.hidden=false;
  $('hint').textContent='clique numa palavra para ver suas relações';
  const div=document.createElement('div'); div.className='chips';
  [...keys].sort((a,b)=>deg(b)-deg(a)).forEach(k=>{
    const b=document.createElement('button');
    b.className='chip'; b.textContent=DATA.meta[k].name; b.dataset.k=k;
    b.onclick=()=>{ fb.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel')); b.classList.add('sel'); select(k); };
    div.appendChild(b);
  });
  fb.appendChild(div);
}

/* ---------- boot ---------- */
const params = new URLSearchParams(location.search);
const initial = params.get('word') ? (byNorm[norm(params.get('word'))]||null) : null;
select(initial,false);
try{
  await (document.fonts?document.fonts.ready:Promise.resolve());
  await start3D();
}catch(err){
  console.warn('3D indisponível, usando visão em lista', err);
  startFallback();
  select(selected,false);
}
</script>
