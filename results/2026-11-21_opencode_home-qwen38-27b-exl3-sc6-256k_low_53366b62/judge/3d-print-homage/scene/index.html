<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Great Wave off Kanagawa — low poly</title>
<style>
  html, body { margin: 0; height: 100%; background: #e7dcc2; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  #cap {
    position: fixed; left: 14px; bottom: 12px; z-index: 2;
    font: 12px/1.4 system-ui, sans-serif; color: #4a4335;
    background: rgba(231,220,194,0.6); padding: 6px 10px; border-radius: 6px;
    letter-spacing: .3px; pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">The Great Wave off Kanagawa · after Hokusai · low-poly rebuild</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---- palette sampled from the print ----
const COL = {
  sky:      0xe7dcc2, deep: 0x163a5e, blue: 0x235a86, blueLt: 0x6fa3c4,
  foam:     0xf3efe3, foamSh: 0xcfe0e8, ink: 0x1d2430,
  boat:     0xcf9463, fuji: 0x2c3e56, fujiSnow: 0xeef1f3, water: 0x2a557e, skyHi: 0xf0e8d2,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.sky);
scene.fog = new THREE.Fog(COL.sky, 34, 82);

const camera = new THREE.PerspectiveCamera(44, innerWidth/innerHeight, 0.1, 200);
camera.position.set(-3, 8, 31);
camera.lookAt(-3, 6, 0);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

scene.add(new THREE.AmbientLight(0xfff4e0, 0.9));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.1); sun.position.set(-8, 18, 12); scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd4e8, 0.35); fill.position.set(12, 6, -8); scene.add(fill);

const mat = (c, o={}) => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.95, metalness: 0, ...o });
const M = { deep: mat(COL.deep), blue: mat(COL.blue), blueLt: mat(COL.blueLt), foam: mat(COL.foam),
  foamSh: mat(COL.foamSh), ink: mat(COL.ink), boat: mat(COL.boat), fuji: mat(COL.fuji),
  fujiSnow: mat(COL.fujiSnow), water: mat(COL.water) };

function smoothY(x, pts){
  if (x <= pts[0][0]) return pts[0][1];
  if (x >= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for (let i=0;i<pts.length-1;i++){
    if (x>=pts[i][0] && x<=pts[i+1][0]){
      const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
      const t=(x-p1[0])/(p2[0]-p1[0]), t2=t*t, t3=t2*t;
      return 0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
    }
  }
  return 0;
}

// ---- water base ----
const waterGeo = new THREE.PlaneGeometry(95, 70, 26, 16);
waterGeo.rotateX(-Math.PI/2);
const water = new THREE.Mesh(waterGeo, M.water);
water.position.y = -0.4; scene.add(water);
const waterBase = waterGeo.attributes.position.array.slice();

// ---- big curling wave, anchored LEFT, crest curls over at top-left ----
const bigWave = new THREE.Group();
// wave face: tall on the left, sloping down to the right (the trough)
const WPTS = [[-26,8],[-20,12.5],[-15,13.5],[-10,10],[-5,5.5],[0,2.5],[4,1]];
function buildWall(pts, x0, x1, z0, z1, nx, nz, lean){
  const pos=[], idx=[];
  for (let i=0;i<=nx;i++){
    const x = x0 + (x1-x0)*i/nx;
    for (let j=0;j<=nz;j++){
      const z = z0 + (z1-z0)*j/nz;
      let y = smoothY(x, pts) + lean*(z-z0)/(z1-z0);
      y += 0.3*Math.sin(x*0.7 + z*0.6);
      pos.push(x, y, z);
    }
  }
  for (let i=0;i<nx;i++) for (let j=0;j<nz;j++){
    const a=i*(nz+1)+j, b=a+nz+1; idx.push(a,b,a+1, b,b+1,a+1);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
bigWave.add(new THREE.Mesh(buildWall(WPTS, -26, 4, -8, 8, 28, 8, 3.0), M.deep));

// crest foam: compact curl at the top-left, tip pointing down-right
const hookPts = [
  new THREE.Vector3(-19, 8, 0), new THREE.Vector3(-15, 12.5, 0),
  new THREE.Vector3(-11, 14.5, 0), new THREE.Vector3(-7, 13.5, 0),
  new THREE.Vector3(-4, 11, 0), new THREE.Vector3(-2, 8, 0),
];
const hook = new THREE.CatmullRomCurve3(hookPts);
const crest = new THREE.Mesh(new THREE.TubeGeometry(hook, 26, 1.2, 6), M.foam);
bigWave.add(crest);
const hook2 = new THREE.CatmullRomCurve3(hookPts.map(p=>p.clone().add(new THREE.Vector3(0.3,-0.9,0))));
bigWave.add(new THREE.Mesh(new THREE.TubeGeometry(hook2, 26, 0.8, 6), M.blueLt));

// claw "fingers" at the curl tip (down-right)
for (let k=0;k<6;k++){
  const a = -0.5 + k*0.22;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.45, 2.0, 5), M.foam);
  cone.position.set(-2 + Math.cos(a)*1.1, 8 + Math.sin(a)*1.4, (k-2.5)*0.9);
  cone.rotation.set(0, 0, -2.3);
  bigWave.add(cone);
}
// foam dots on the wave face
const dotGeo = new THREE.IcosahedronGeometry(0.42, 0);
for (let k=0;k<52;k++){
  const x = -22 + Math.random()*17;
  const z = -6 + Math.random()*12;
  const y = smoothY(x, WPTS) + 3.0*(z+8)/16 + 0.2;
  if (y < 2.5) continue;
  const d = new THREE.Mesh(dotGeo, Math.random()<0.5?M.foam:M.foamSh);
  d.position.set(x, y, z); d.scale.setScalar(0.6+Math.random()*0.8);
  bigWave.add(d);
}
scene.add(bigWave);

// ---- smaller foreground waves in the troughs ----
function smallWave(x, z, s, rot){
  const g = new THREE.Group();
  const pts=[[-6,0],[-3,3.5],[0,4.5],[3,2.5],[6,0.5]];
  g.add(new THREE.Mesh(buildWall(pts, -6, 6, -4, 4, 14, 5, 1.6), M.blue));
  const hp=[new THREE.Vector3(-4,2,0),new THREE.Vector3(-1,4.6,0),new THREE.Vector3(2,4,0),new THREE.Vector3(4,1.5,0)];
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(hp),16,0.9,5), M.foam));
  g.position.set(x,0,z); g.scale.setScalar(s); g.rotation.y=rot;
  scene.add(g); return g;
}
const sw1 = smallWave(-15, 9, 0.9, 0.3);   // left foreground
const sw2 = smallWave(2, 8, 1.0, -0.2);    // center foreground
const sw3 = smallWave(13, 4, 1.1, 0.5);    // right foreground

// ---- Mount Fuji, center-right background ----
const fuji = new THREE.Group();
const base = new THREE.Mesh(new THREE.ConeGeometry(6, 8, 7), M.fuji); base.position.y = 4;
const snow = new THREE.Mesh(new THREE.ConeGeometry(3.4, 4.2, 7), M.fujiSnow); snow.position.y = 6.0;
fuji.add(base, snow); fuji.position.set(9, -0.4, -18); scene.add(fuji);

// ---- clouds (upper right) ----
for (let k=0;k<5;k++){
  const cl = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2+Math.random()*1.5, 0), mat(COL.skyHi, {transparent:true, opacity:0.9}));
  cl.scale.set(1.6, 0.7, 1);
  cl.position.set(8 + Math.random()*16, 14 + Math.random()*6, -22 - Math.random()*6);
  scene.add(cl);
}

// ---- boats: 3, each 9 rowers ----
function makeBoat(){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(6, 0.7, 1.5), M.boat); hull.position.y = 0.35;
  const bow = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.6, 4), M.boat); bow.rotation.z = -Math.PI/2; bow.position.set(3.6, 0.35, 0);
  const stern = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.6, 4), M.boat); stern.rotation.z = Math.PI/2; stern.position.set(-3.6, 0.35, 0);
  const gunwale = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.12, 1.7), M.ink); gunwale.position.y = 0.72;
  g.add(hull, bow, stern, gunwale);
  const rGeo = new THREE.CapsuleGeometry(0.16, 0.32, 2, 5);
  for (let i=0;i<9;i++){ const r = new THREE.Mesh(rGeo, M.ink); r.position.set(-2.2 + i*0.55, 0.95, 0); g.add(r); }
  return g;
}
const boats = [];
function placeBoat(x, y, z, tilt){ const b = makeBoat(); b.position.set(x, y, z); b.rotation.z = tilt; b.rotation.y = 0.1; scene.add(b); boats.push(b); }
placeBoat(-15, 0.6, 4, 0.18);   // left, in the trough under the big wave
placeBoat(2, 0.2, 6, -0.10);    // center, in front of Fuji
placeBoat(12, 0.9, 2, 0.22);    // right

// ---- gentle motion ----
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  bigWave.position.y = Math.sin(t*0.6)*0.3;
  bigWave.rotation.z = Math.sin(t*0.4)*0.008;
  crest.rotation.z = Math.sin(t*0.8)*0.02;
  sw1.position.y = Math.sin(t*0.7+1)*0.25;
  sw2.position.y = Math.sin(t*0.7+2)*0.25;
  sw3.position.y = Math.sin(t*0.7+3)*0.25;
  boats.forEach((b,i)=>{
    b.position.y += Math.sin(t*1.1 + i)*0.003;
    b.rotation.z = (i===0?0.18:i===1?-0.10:0.22) + Math.sin(t*1.2 + i)*0.05;
    b.rotation.x = Math.sin(t*0.9 + i)*0.04;
  });
  const wp = waterGeo.attributes.position;
  for (let i=0;i<wp.count;i++){
    const x = waterBase[i*3], z = waterBase[i*3+2];
    wp.setY(i, Math.sin(x*0.4 + t)*0.25 + Math.cos(z*0.5 + t*0.8)*0.2);
  }
  wp.needsUpdate = true;
  camera.position.x = -3 + Math.sin(t*0.1)*1.2;
  camera.lookAt(-3, 6, 0);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
