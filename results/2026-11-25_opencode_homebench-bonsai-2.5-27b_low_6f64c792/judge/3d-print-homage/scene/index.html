<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanagawa-oki Nami Ura — Low Poly 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #e8dcc0; }
  #app { width: 100vw; height: 100vh; display: block; }
  #caption {
    position: fixed; left: 18px; bottom: 14px;
    font-family: 'Noto Serif JP', 'Noto Sans JP', serif;
    color: rgba(26, 58, 92, 0.7);
    font-size: 14px; letter-spacing: 0.06em;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="caption">神奈川沖浪裏 · The Great Wave off Kanagawa</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------- palette
// Taken from the print: deep Prussian blue waves, cream foam/snow,
// tan/ochre boats, warm beige sky grading to muted grey at the horizon.
const PAL = {
  waveDeep:   0x16324f,
  waveMid:    0x24507a,
  foam:       0xf2ead8,
  snow:       0xf7f2e6,
  boat:       0xb5854f,
  boatDark:   0x8a6238,
  skyTop:     0xe8dcc0,
  skyHorizon: 0x9aa4ae,
  water:      0x2e5f8a,
  fujiBase:   0x46586a,
  cloud:      0xf5efe0,
  rower:      0x5a4632,
  seal:       0xa63a2b,
};

// ---------------------------------------------------------------- renderer
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.skyHorizon, 30, 70);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 4.5, 17);
camera.lookAt(0, 2.5, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
sun.position.set(6, 12, 8);
scene.add(sun);

// ---------------------------------------------------------------- sky
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(90, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      top:    { value: new THREE.Color(PAL.skyTop) },
      bottom: { value: new THREE.Color(PAL.skyHorizon) },
    },
    vertexShader: `
      varying vec3 vW;
      void main() {
        vW = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * viewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 top; uniform vec3 bottom; varying vec3 vW;
      void main() {
        float h = normalize(vW).y;
        vec3 c = mix(bottom, top, clamp(h * 1.6, 0.0, 1.0));
        gl_FragColor = vec4(c, 1.0);
      }`,
  })
);
scene.add(sky);

// ---------------------------------------------------------------- water
const waterGeo = new THREE.PlaneGeometry(44, 30, 44, 30);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({
  color: PAL.water, flatShading: true, roughness: 0.9,
}));
water.position.set(0, 0, -1);
scene.add(water);
const waterPos = waterGeo.attributes.position;
const waterBase = Float32Array.from(waterPos.array);

// ---------------------------------------------------------------- wave
// The great wave: a filled hump with the crest curling over to the right,
// built as an extruded 2D outline (no textures — geometry only).
const waveShape = new THREE.Shape();
waveShape.moveTo(-5.0, 0);
waveShape.lineTo(-4.5, 1.5);
waveShape.lineTo(-3.5, 3.0);
waveShape.lineTo(-2.0, 4.5);
waveShape.lineTo(-0.5, 5.5);   // crest
waveShape.lineTo(1.0, 5.2);    // curling over
waveShape.lineTo(2.5, 4.0);
waveShape.lineTo(3.2, 2.0);
waveShape.lineTo(3.5, 0);
waveShape.lineTo(-5.0, 0);
waveShape.closePath();

const waveGeo = new THREE.ExtrudeGeometry(waveShape, { depth: 0.8, bevelEnabled: false });
waveGeo.translate(0, 0, -0.4);

const waveGroup = new THREE.Group();
const wave = new THREE.Mesh(waveGeo, new THREE.MeshStandardMaterial({
  color: PAL.waveDeep, flatShading: true, side: THREE.DoubleSide, roughness: 0.85,
}));
waveGroup.add(wave);

// claw-like white foam along the crest
const clawMat = new THREE.MeshStandardMaterial({ color: PAL.foam, flatShading: true });
const claws = [];
const crestPoints = [
  [-2.5, 4.0], [-1.8, 4.6], [-1.0, 5.1], [-0.5, 5.5],
  [0.3, 5.3], [1.0, 5.0], [1.8, 4.4], [2.5, 3.8],
];
const nClaws = crestPoints.length;
for (let i = 0; i < nClaws; i++) {
  const [x, y] = crestPoints[i];
  const size = 0.3 + 0.12 * Math.sin((i + 1) * Math.PI / (nClaws + 1));
  const claw = new THREE.Mesh(new THREE.ConeGeometry(size, size * 3.5, 6), clawMat);
  claw.position.set(x, y + 0.05, 0.38);
  // sweep from pointing up (left of crest) to pointing right (curl)
  claw.rotation.z = -i * Math.PI / (2 * nClaws);
  waveGroup.add(claw);
  claws.push(claw);
}
scene.add(waveGroup);

// ---------------------------------------------------------------- Mount Fuji
const fuji = new THREE.Group();
const fujiBase = new THREE.Mesh(
  new THREE.ConeGeometry(3.2, 4.5, 16),
  new THREE.MeshStandardMaterial({ color: PAL.fujiBase, flatShading: true })
);
fujiBase.position.y = 2.25;
fuji.add(fujiBase);
const fujiSnow = new THREE.Mesh(
  new THREE.ConeGeometry(1.07, 1.5, 16),
  new THREE.MeshStandardMaterial({ color: PAL.snow, flatShading: true })
);
fujiSnow.position.y = 3.75;
fuji.add(fujiSnow);
fuji.position.set(6.0, 0, -6);
scene.add(fuji);

// ---------------------------------------------------------------- boats
function makeBoat() {
  const g = new THREE.Group();
  const hullMat = new THREE.MeshStandardMaterial({ color: PAL.boat, flatShading: true });
  const hull = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.25, 0.45), hullMat);
  hull.position.set(-0.1, 0.15, 0);
  g.add(hull);
  const bow = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.6, 4), hullMat);
  bow.rotation.z = -Math.PI / 2;
  bow.position.set(0.95, 0.15, 0);
  g.add(bow);
  const stern = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 4), hullMat);
  stern.rotation.z = Math.PI / 2;
  stern.position.set(-0.95, 0.15, 0);
  g.add(stern);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.2, 0.3),
    new THREE.MeshStandardMaterial({ color: PAL.boatDark, flatShading: true })
  );
  cabin.position.set(-0.25, 0.35, 0);
  g.add(cabin);
  const rowerMat = new THREE.MeshStandardMaterial({ color: PAL.rower, flatShading: true });
  for (let i = 0; i < 3; i++) {
    const r = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 5), rowerMat);
    r.position.set(-0.35 + i * 0.28, 0.32, 0);
    g.add(r);
  }
  return g;
}

// three boats, as in the print: left under the wave, center-right in the
// trough, and one further back to the right in front of the mountain
const boats = [
  { m: makeBoat(), pos: new THREE.Vector3(-3.0, 0, 1.5), rotY: -0.4, phase: 0.0 },
  { m: makeBoat(), pos: new THREE.Vector3(2.5, 0, 0.5), rotY: 0.3, phase: 1.3 },
  { m: makeBoat(), pos: new THREE.Vector3(4.5, 0, 2.5), rotY: -0.2, phase: 2.4 },
];
for (const b of boats) {
  b.m.position.copy(b.pos);
  b.m.rotation.y = b.rotY;
  scene.add(b.m);
}

// ---------------------------------------------------------------- clouds
const cloudMat = new THREE.MeshStandardMaterial({ color: PAL.cloud, flatShading: true });
const clouds = [];
function makeCloud(x, y, z, s) {
  const c = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.8 * s, 7, 6), cloudMat);
    p.position.set((i - 1.5) * 0.9 * s, (i % 2) * 0.15 * s, 0);
    p.scale.y = 0.6;
    c.add(p);
  }
  c.position.set(x, y, z);
  scene.add(c);
  clouds.push(c);
  return c;
}
makeCloud(4, 6.5, -8, 1.0);
makeCloud(-6, 7.0, -9, 0.8);

// ---------------------------------------------------------------- cartouche
// upper-left title plaque, rendered to canvas in code (Noto Serif JP via
// Google Fonts); falls back to a plain plaque if the font is unavailable
function makeCartouche() {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f2ead8';
  ctx.fillRect(0, 0, 512, 256);
  ctx.strokeStyle = '#16324f';
  ctx.lineWidth = 14;
  ctx.strokeRect(12, 12, 488, 232);
  // red seal
  ctx.fillStyle = '#a63a2b';
  ctx.fillRect(430, 30, 60, 60);
  // vertical title
  ctx.fillStyle = '#16324f';
  ctx.font = '56px "Noto Serif JP", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const text = '神奈川沖浪裏';
  for (let i = 0; i < text.length; i++) {
    ctx.fillText(text[i], 120, 40 + i * 44);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(3.2, 1.6),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
  );
  plane.position.set(-7.5, 6.5, -2);
  plane.rotation.y = 0.15;
  scene.add(plane);
}

// ---------------------------------------------------------------- animation
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // water: gentle rolling
  for (let i = 0; i < waterPos.count; i++) {
    const x = waterBase[i * 3];
    const z = waterBase[i * 3 + 2];
    waterPos.setY(i, Math.sin(x * 0.5 + t * 0.8) * 0.15 + Math.cos(z * 0.4 + t * 0.6) * 0.15);
  }
  waterPos.needsUpdate = true;

  // wave: slight sway and bob
  waveGroup.rotation.z = Math.sin(t * 0.4) * 0.015;
  waveGroup.position.y = Math.sin(t * 0.35) * 0.05;

  // foam claws: soft pulse
  for (const c of claws) {
    const s = 1 + Math.sin(t * 1.0 + c.position.x) * 0.06;
    c.scale.set(s, s, s);
  }

  // boats: bob and pitch
  for (const b of boats) {
    b.m.position.y = b.pos.y + Math.sin(t * 0.9 + b.phase) * 0.12;
    b.m.rotation.x = Math.sin(t * 0.7 + b.phase) * 0.06;
    b.m.rotation.z = Math.cos(t * 0.6 + b.phase) * 0.04;
  }

  // clouds: slow drift
  for (const c of clouds) {
    c.position.x += 0.003;
    if (c.position.x > 15) c.position.x = -15;
  }

  renderer.render(scene, camera);
}
animate();

// cartouche after webfont is ready (fallback: plain plaque)
document.fonts.ready.then(makeCartouche).catch(makeCartouche);

// ---------------------------------------------------------------- resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
