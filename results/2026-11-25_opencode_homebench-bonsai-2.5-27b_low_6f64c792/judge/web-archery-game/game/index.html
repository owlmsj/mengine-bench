<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balloon Pop 95</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #008080;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    overflow: hidden;
    user-select: none;
  }
  .window {
    width: min(96vw, 1000px);
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #000 #000 #fff;
    box-shadow: 5px 5px 0 rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    background: linear-gradient(#1084d8, #000080);
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    padding: 5px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
  }
  .titlebar .title { letter-spacing: 1px; }
  .titlebar .buttons { display: flex; gap: 4px; }
  .titlebar .buttons button {
    width: 18px; height: 16px;
    background: #c0c0c0;
    border: 1px solid;
    border-color: #fff #000 #000 #fff;
    font-size: 9px;
    line-height: 1;
    cursor: pointer;
    font-family: monospace;
    padding: 0;
    color: #000;
  }
  .titlebar .buttons button:hover { background: #d8d8d8; }
  .menubar {
    background: #c0c0c0;
    border-bottom: 1px solid #000;
    padding: 2px 6px;
    font-size: 16px;
    color: #000;
    display: flex;
    gap: 16px;
  }
  .menubar span { cursor: pointer; }
  .menubar span:hover { background: #1084d8; color: #fff; }
  .body { position: relative; flex: 1; background: #000; }
  canvas { display: block; width: 100%; height: auto; cursor: crosshair; }
  .statusbar {
    background: #c0c0c0;
    border-top: 1px solid #fff;
    padding: 3px 8px;
    font-size: 15px;
    color: #000;
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="title">BALLOON POP 95</span>
      <div class="buttons">
        <button title="Minimize">─</button>
        <button title="Close">×</button>
      </div>
    </div>
    <div class="menubar">
      <span id="menuPlay">Play</span>
      <span id="menuHelp">Help</span>
    </div>
    <div class="body">
      <canvas id="game"></canvas>
    </div>
    <div class="statusbar" id="status">Aim with mouse, hold to draw, release to shoot.</div>
  </div>
<script>
// ===== Canvas setup =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
const GROUND_H = 40;
const GRAVITY = 500;
const MIN_SPEED = 400, MAX_SPEED = 1300;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ===== Audio (all synthesized, no files) =====
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playPop() {
  if (!audioCtx) return;
  const c = audioCtx;
  const t = c.currentTime;
  const dur = 0.12;
  const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
  const src = c.createBufferSource();
  src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1500;
  filter.Q.value = 0.8;
  const gain = c.createGain();
  gain.gain.setValueAtTime(0.5, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter); filter.connect(gain); gain.connect(c.destination);
  src.start(t);
  const osc = c.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(600, t);
  osc.frequency.exponentialRampToValueAtTime(120, t + 0.1);
  const g2 = c.createGain();
  g2.gain.setValueAtTime(0.3, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.connect(g2); g2.connect(c.destination);
  osc.start(t); osc.stop(t + 0.1);
}
function playThwip() {
  if (!audioCtx) return;
  const c = audioCtx;
  const t = c.currentTime;
  const dur = 0.18;
  const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) {
    const p = i / data.length;
    data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * p);
  }
  const src = c.createBufferSource();
  src.buffer = buf;
  const filter = c.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(2500, t);
  filter.frequency.exponentialRampToValueAtTime(400, t + dur);
  filter.Q.value = 1.5;
  const gain = c.createGain();
  gain.gain.setValueAtTime(0.4, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(filter); filter.connect(gain); gain.connect(c.destination);
  src.start(t);
}
function playThud() {
  if (!audioCtx) return;
  const c = audioCtx;
  const t = c.currentTime;
  const osc = c.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(160, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.2);
  const g = c.createGain();
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t + 0.25);
}
function playBlip(f) {
  if (!audioCtx) return;
  const c = audioCtx;
  const t = c.currentTime;
  const osc = c.createOscillator();
  osc.type = 'square';
  osc.frequency.value = f;
  const g = c.createGain();
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  osc.connect(g); g.connect(c.destination);
  osc.start(t); osc.stop(t + 0.08);
}
function playGameOver() {
  if (!audioCtx) return;
  const c = audioCtx;
  const t = c.currentTime;
  const notes = [400, 300, 200, 100];
  notes.forEach((f, i) => {
    const osc = c.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = f;
    const g = c.createGain();
    const start = t + i * 0.15;
    g.gain.setValueAtTime(0.2, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
    osc.connect(g); g.connect(c.destination);
    osc.start(start); osc.stop(start + 0.3);
  });
}

// ===== Constants / state =====
const BALLOON_TYPES = [
  { color: '#e74c3c', value: 100 },
  { color: '#f1c40f', value: 100 },
  { color: '#2ecc71', value: 100 },
  { color: '#3498db', value: 100 },
  { color: '#9b59b6', value: 200 },
  { color: '#e91e63', value: 200 },
  { color: '#f1b700', value: 500 },
];
const archerX = 130, archerY = H - GROUND_H;
const startBtn = { x: W / 2 - 110, y: H / 2 + 30, w: 220, h: 54 };
const playAgainBtn = { x: W / 2 - 110, y: H / 2 + 70, w: 220, h: 54 };

let state = 'menu'; // menu | playing | gameover
let score = 0, combo = 0, misses = 0, maxMisses = 5;
let balloons = [], arrows = [], particles = [], popups = [];
let drawing = false, drawTime = 0, power = 0, drawAmount = 0;
let aimAngle = -Math.PI / 2;
let mouseX = W / 2, mouseY = H / 3;
let shake = 0;
let spawnTimer = 0, spawnInterval = 1.8;
let time = 0;
let best = 0;
let showHelp = false;

const clouds = [];
for (let i = 0; i < 4; i++) {
  clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 140, s: 0.5 + Math.random() * 0.8, speed: 8 + Math.random() * 10 });
}

// ===== Balloons =====
function spawnBalloon() {
  const r = Math.random();
  let type;
  if (r < 0.08) type = BALLOON_TYPES[6];
  else type = BALLOON_TYPES[Math.floor(Math.random() * 6)];
  const radius = 20 + Math.random() * 10;
  const baseX = 60 + Math.random() * (W - 120);
  const speed = 45 + Math.random() * 45;
  const bobAmp = 15 + Math.random() * 20;
  const bobFreq = 0.5 + Math.random() * 0.8;
  const phase = Math.random() * Math.PI * 2;
  balloons.push({ type, radius, baseX, y: -radius - 10, speed, bobAmp, bobFreq, phase, x: baseX });
}

// ===== Input =====
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}
function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

canvas.addEventListener('mousemove', (e) => { const p = canvasPos(e); mouseX = p.x; mouseY = p.y; });
canvas.addEventListener('mousedown', (e) => { ensureAudio(); handleDown(); });
window.addEventListener('mouseup', () => { handleUp(); });
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); const p = canvasPos(e.touches[0]); mouseX = p.x; mouseY = p.y; handleDown(); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); const p = canvasPos(e.touches[0]); mouseX = p.x; mouseY = p.y; }, { passive: false });
canvas.addEventListener('touchend', (e) => { e.preventDefault(); handleUp(); }, { passive: false });
window.addEventListener('keydown', (e) => {
  ensureAudio();
  if (e.key === 'Enter' || e.key === ' ') {
    if (state === 'menu' || state === 'gameover') startGame();
  }
});

function handleDown() {
  if (state === 'menu') {
    if (inRect(mouseX, mouseY, startBtn)) startGame();
  } else if (state === 'gameover') {
    if (inRect(mouseX, mouseY, playAgainBtn)) startGame();
  } else if (state === 'playing') {
    drawing = true;
    drawTime = 0;
  }
}
function handleUp() {
  if (state === 'playing' && drawing) {
    drawing = false;
    fire();
  }
}

function fire() {
  const p = Math.max(0.15, power);
  const speed = MIN_SPEED + p * (MAX_SPEED - MIN_SPEED);
  const nockLocalX = 15 - drawAmount * 15;
  const px = archerX, py = archerY - 25;
  const nockX = px + Math.cos(aimAngle) * nockLocalX;
  const nockY = py + Math.sin(aimAngle) * nockLocalX;
  arrows.push({ x: nockX, y: nockY, vx: Math.cos(aimAngle) * speed, vy: Math.sin(aimAngle) * speed, r: 4 });
  playThwip();
}

function startGame() {
  state = 'playing';
  score = 0; combo = 0; misses = 0;
  balloons = []; arrows = []; particles = []; popups = [];
  drawing = false; drawTime = 0; power = 0; drawAmount = 0;
  spawnTimer = 0.5; spawnInterval = 1.8;
  updateStatus();
  playBlip(600);
}

// ===== Game logic =====
function popBalloon(b) {
  combo++;
  const mult = Math.min(combo, 5);
  const pts = b.type.value * mult;
  score += pts;
  for (let i = 0; i < 16; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 160;
    particles.push({ x: b.x, y: b.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 40, color: b.type.color, r: 2 + Math.random() * 3, life: 1 });
  }
  popups.push({ x: b.x, y: b.y - 10, text: '+' + pts, color: b.type.color, life: 1, vy: -50 });
  playPop();
  playBlip(500 + combo * 50);
}

function onMiss(a) {
  misses++;
  combo = 0;
  shake = 10;
  popups.push({ x: Math.min(Math.max(a.x, 30), W - 30), y: Math.min(a.y, H - 60), text: 'MISS', color: '#e74c3c', life: 1, vy: -30 });
  playThud();
  if (misses >= maxMisses) {
    state = 'gameover';
    best = Math.max(best, score);
    playGameOver();
    updateStatus();
  }
}

function update(dt) {
  time += dt;
  for (const c of clouds) {
    c.x += c.speed * dt;
    if (c.x > W + 100) c.x = -100;
  }
  if (state !== 'playing') return;

  if (drawing) {
    drawTime += dt;
    const period = 1.4;
    const phase = (drawTime % period) / period;
    power = phase < 0.5 ? phase / 0.5 : (1 - phase) / 0.5;
  }
  if (drawing) drawAmount = power;
  else drawAmount += (0 - drawAmount) * Math.min(1, dt * 12);

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnBalloon();
    spawnInterval = Math.max(0.9, spawnInterval - 0.01);
    spawnTimer = spawnInterval;
  }

  for (const b of balloons) {
    b.y += b.speed * dt;
    b.x = b.baseX + Math.sin(time * b.bobFreq + b.phase) * b.bobAmp;
  }
  balloons = balloons.filter(b => b.y < H + b.radius);

  // arrows with substeps to avoid tunneling
  for (const a of arrows) {
    if (a.hit || a.missed) continue;
    if (state !== 'playing') break;
    a.vy += GRAVITY * dt;
    const dist = Math.hypot(a.vx, a.vy) * dt;
    const steps = Math.max(1, Math.ceil(dist / 5));
    const sdt = dt / steps;
    for (let s = 0; s < steps; s++) {
      a.x += a.vx * sdt;
      a.y += a.vy * sdt;
      for (const b of balloons) {
        if (b.popped) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const rr = a.r + b.radius;
        if (dx * dx + dy * dy < rr * rr) {
          a.hit = true;
          b.popped = true;
          popBalloon(b);
          break;
        }
      }
      if (a.hit) break;
      if (a.y > H - GROUND_H + 5 || a.x < -20 || a.x > W + 20 || a.y < -60) {
        a.missed = true;
        onMiss(a);
        break;
      }
    }
  }
  arrows = arrows.filter(a => !a.hit && !a.missed);
  balloons = balloons.filter(b => !b.popped);

  for (const p of particles) {
    p.vy += GRAVITY * 0.5 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt * 1.5;
  }
  particles = particles.filter(p => p.life > 0);

  for (const p of popups) {
    p.y += p.vy * dt;
    p.life -= dt * 1.2;
  }
  popups = popups.filter(p => p.life > 0);

  if (shake > 0) {
    shake -= shake * dt * 8;
    if (shake < 0.5) shake = 0;
  }
}

// ===== Drawing =====
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a90d9');
  g.addColorStop(1, '#bfe0f5');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function drawSun() {
  ctx.fillStyle = 'rgba(255,215,94,0.3)';
  ctx.beginPath();
  ctx.arc(W - 80, 70, 50, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffd75e';
  ctx.beginPath();
  ctx.arc(W - 80, 70, 35, 0, Math.PI * 2);
  ctx.fill();
}
function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.arc(c.x, c.y, 20 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 25 * c.s, c.y - 10 * c.s, 15 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 50 * c.s, c.y, 18 * c.s, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawGround() {
  ctx.fillStyle = '#5a8f3c';
  ctx.fillRect(0, H - GROUND_H, W, GROUND_H);
  ctx.fillStyle = '#3d6b2a';
  ctx.fillRect(0, H - GROUND_H, W, 4);
  ctx.strokeStyle = '#4a7d30';
  ctx.lineWidth = 2;
  for (let x = 15; x < W; x += 34) {
    ctx.beginPath();
    ctx.moveTo(x, H - GROUND_H + 4);
    ctx.lineTo(x + 3, H - GROUND_H - 6);
    ctx.stroke();
  }
}
function drawBalloon(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, b.radius);
  ctx.quadraticCurveTo(6, b.radius + 15, 0, b.radius + 30);
  ctx.stroke();
  ctx.fillStyle = b.type.color;
  ctx.beginPath();
  ctx.moveTo(0, b.radius);
  ctx.lineTo(-4, b.radius + 8);
  ctx.lineTo(4, b.radius + 8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = b.type.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, b.radius * 0.85, b.radius, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(-b.radius * 0.3, -b.radius * 0.35, b.radius * 0.25, b.radius * 0.35, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawArcher() {
  const ax = archerX, ay = archerY;
  ctx.save();
  ctx.fillStyle = '#6b4a2b';
  ctx.fillRect(ax - 8, ay - 16, 6, 16);
  ctx.fillRect(ax + 2, ay - 16, 6, 16);
  ctx.fillStyle = '#3d7a4f';
  ctx.beginPath();
  ctx.moveTo(ax - 10, ay - 16);
  ctx.lineTo(ax + 10, ay - 16);
  ctx.lineTo(ax + 8, ay - 40);
  ctx.lineTo(ax - 8, ay - 40);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath();
  ctx.arc(ax, ay - 50, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#888';
  ctx.beginPath();
  ctx.arc(ax, ay - 52, 10, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(ax - 11, ay - 53, 22, 3);
  drawBow(ax, ay - 25, aimAngle, drawAmount);
  ctx.restore();
}
function drawBow(px, py, angle, drawAmount) {
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);
  ctx.strokeStyle = '#8b5a2b';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(15, 0, 25, -Math.PI / 2, Math.PI / 2);
  ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  const nockX = 15 - drawAmount * 15;
  ctx.beginPath();
  ctx.moveTo(15, -25);
  ctx.lineTo(nockX, 0);
  ctx.lineTo(15, 25);
  ctx.stroke();
  const arrowLen = 30;
  ctx.strokeStyle = '#d9d9d9';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(nockX, 0);
  ctx.lineTo(nockX + arrowLen, 0);
  ctx.stroke();
  ctx.fillStyle = '#d9d9d9';
  ctx.beginPath();
  ctx.moveTo(nockX + arrowLen + 6, 0);
  ctx.lineTo(nockX + arrowLen - 2, -4);
  ctx.lineTo(nockX + arrowLen - 2, 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(nockX + 4, 0);
  ctx.lineTo(nockX + 10, -4);
  ctx.lineTo(nockX + 10, 4);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#f0c8a0';
  ctx.beginPath();
  ctx.arc(8, 0, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawArrow(a) {
  const ang = Math.atan2(a.vy, a.vx);
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(ang);
  ctx.strokeStyle = '#d9d9d9';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(10, 0);
  ctx.stroke();
  ctx.fillStyle = '#d9d9d9';
  ctx.beginPath();
  ctx.moveTo(14, 0);
  ctx.lineTo(8, -3);
  ctx.lineTo(8, 3);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(-10, 0);
  ctx.lineTo(-14, -3);
  ctx.lineTo(-14, 3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function drawTrajectory() {
  const p = Math.max(0.15, power);
  const speed = MIN_SPEED + p * (MAX_SPEED - MIN_SPEED);
  const nockLocalX = 15 - drawAmount * 15;
  let x = archerX + Math.cos(aimAngle) * nockLocalX;
  let y = (archerY - 25) + Math.sin(aimAngle) * nockLocalX;
  let vx = Math.cos(aimAngle) * speed;
  let vy = Math.sin(aimAngle) * speed;
  const dtStep = 1 / 60;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 60; i++) {
    vy += GRAVITY * dtStep;
    x += vx * dtStep;
    y += vy * dtStep;
    if (x < 0 || x > W || y > H - GROUND_H || y < 0) break;
    if (i % 3 === 0) {
      ctx.beginPath();
      ctx.arc(x, y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}
function drawPanel(x, y, w, h) {
  ctx.fillStyle = '#c0c0c0';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(x, y, w, 2);
  ctx.fillRect(x, y, 2, h);
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y + h - 2, w, 2);
  ctx.fillRect(x + w - 2, y, 2, h);
}
function drawButton(r, label) {
  ctx.fillStyle = '#c0c0c0';
  ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(r.x, r.y, r.w, 2);
  ctx.fillRect(r.x, r.y, 2, r.h);
  ctx.fillStyle = '#000';
  ctx.fillRect(r.x, r.y + r.h - 2, r.w, 2);
  ctx.fillRect(r.x + r.w - 2, r.y, 2, r.h);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 18px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}
function drawHUD() {
  drawPanel(10, 10, 180, 40);
  ctx.fillStyle = '#000';
  ctx.font = 'bold 20px "VT323", monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('SCORE ' + score, 20, 38);
  drawPanel(W - 200, 10, 190, 40);
  ctx.fillStyle = '#000';
  ctx.fillText('LIVES', W - 190, 38);
  const lives = maxMisses - misses;
  for (let i = 0; i < maxMisses; i++) {
    const lx = W - 140 + i * 28;
    const ly = 28;
    const c = i < lives ? '#2ecc71' : 'rgba(0,0,0,0.2)';
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(lx + 12, ly);
    ctx.lineTo(lx, ly + 6);
    ctx.lineTo(lx + 12, ly + 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = c;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(lx + 12, ly + 3);
    ctx.lineTo(lx + 18, ly + 3);
    ctx.stroke();
  }
  if (combo >= 2) {
    ctx.fillStyle = '#f1c40f';
    ctx.font = 'bold 28px "VT323", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('COMBO x' + Math.min(combo, 5), W / 2, 40);
  }
  if (drawing) {
    const bx = archerX - 45, by = archerY - 95, bw = 90, bh = 12;
    ctx.fillStyle = '#000';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(bx + 1, by + 1, bw - 2, bh - 2);
    const p = Math.max(0.15, power);
    ctx.fillStyle = p > 0.8 ? '#e74c3c' : (p > 0.4 ? '#f1c40f' : '#2ecc71');
    ctx.fillRect(bx + 2, by + 2, (bw - 4) * p, bh - 4);
  }
}
function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 34px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('BALLOON POP 95', W / 2, H / 2 - 60);
  ctx.fillStyle = '#c0c0c0';
  ctx.font = '24px "VT323", monospace';
  ctx.fillText('An archery game from the Windows 95 era', W / 2, H / 2 - 20);
  ctx.fillStyle = '#fff';
  ctx.font = '20px "VT323", monospace';
  ctx.fillText('Aim with the mouse. Hold to draw, release to shoot.', W / 2, H / 2 + 10);
  ctx.fillText("Pop balloons. Miss 5 arrows and it's game over.", W / 2, H / 2 + 34);
  drawButton(startBtn, 'START');
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e74c3c';
  ctx.font = 'bold 32px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 50);
  ctx.fillStyle = '#fff';
  ctx.font = '28px "VT323", monospace';
  ctx.fillText('Score: ' + score, W / 2, H / 2 + 10);
  ctx.fillStyle = '#c0c0c0';
  ctx.font = '22px "VT323", monospace';
  ctx.fillText('Best: ' + best, W / 2, H / 2 + 40);
  drawButton(playAgainBtn, 'PLAY AGAIN');
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  }
  drawSky();
  drawSun();
  drawClouds();
  drawGround();
  for (const b of balloons) drawBalloon(b);
  drawArcher();
  for (const a of arrows) drawArrow(a);
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (state === 'playing' && drawing) drawTrajectory();
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.font = 'bold 20px "VT323", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (state === 'playing') drawHUD();
  if (state === 'gameover') { drawHUD(); drawGameOver(); }
  if (state === 'menu') drawMenu();
}

// ===== Status bar =====
const statusEl = document.getElementById('status');
function updateStatus() {
  if (showHelp) {
    statusEl.textContent = 'Aim with mouse • Hold to draw bow • Release to shoot • Pop balloons • 5 misses = game over';
  } else if (state === 'playing') {
    statusEl.textContent = 'Ready. Pop the balloons!';
  } else if (state === 'gameover') {
    statusEl.textContent = 'Game over. Score ' + score + '. Click PLAY AGAIN.';
  } else {
    statusEl.textContent = 'Aim with mouse, hold to draw, release to shoot.';
  }
}

// ===== Menu bar =====
document.getElementById('menuPlay').addEventListener('click', () => {
  ensureAudio();
  if (state !== 'playing') startGame();
});
document.getElementById('menuHelp').addEventListener('click', () => {
  showHelp = !showHelp;
  updateStatus();
});

// ===== Main loop =====
let last = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000);
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
