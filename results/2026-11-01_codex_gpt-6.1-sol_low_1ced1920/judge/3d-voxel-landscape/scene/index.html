<body>
<header><div class="brand"><span class="mark">富士</span>STILL / JAPAN</div><div class="location">35.5012° N &nbsp; 138.8014° E</div></header>
<main><div class="eyebrow">A MOMENT IN YAMANASHI</div><h1>Afterglow.</h1><p class="description">Mount Fuji &nbsp; / &nbsp; Spring, at the edge of evening</p></main>
<div class="controls"><span class="status"><span class="dot"></span>THE WORLD, A LITTLE SLOWER</span><button id="motion" aria-pressed="false">Ⅱ &nbsp; Pause</button><button id="clean" title="Hide interface (H)">⛶ &nbsp; Clear view</button></div><div id="error" role="alert"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
// All geometry is procedural. A fixed seed keeps the landscape reproducible.
let seed=127;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0xbda1b2,.009);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;document.body.prepend(renderer.domElement);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.1,250);camera.position.set(0,13,38);camera.lookAt(0,9,-7);
scene.add(new THREE.HemisphereLight(0xf5c8db,0x4d4554,2.4));const sunlight=new THREE.DirectionalLight(0xffc498,3);sunlight.position.set(-20,26,15);scene.add(sunlight);
const mat=(color)=>new THREE.MeshStandardMaterial({color,flatShading:true,roughness:1});
const red=mat(0xa53431),redLight=mat(0xd6503e),dark=mat(0x343443),gold=mat(0xb99a67),wood=mat(0x653c3d),stone=mat(0x807b83);
function mesh(geo,material,x=0,y=0,z=0,parent=scene){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);parent.add(m);return m}
function box(w,h,d,material,x,y,z,parent=scene){return mesh(new THREE.BoxGeometry(w,h,d),material,x,y,z,parent)}
function branch(a,b,r,material,parent){const direction=new THREE.Vector3().subVectors(b,a);const m=mesh(new THREE.CylinderGeometry(r*.58,r,direction.length(),5),material,0,0,0,parent);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());return m}
// Faceted Fuji: snow follows an irregular ring, rather than a separate cone.
const mountain=new THREE.Group();mountain.position.set(-7,-4,-43);scene.add(mountain);
const N=36;const rings=[{r:23,y:0},{r:13.7,y:6},{r:7.8,y:12},{r:4.1,y:16},{r:1.55,y:20.5},{r:.9,y:20.8}];
const snowline=Array.from({length:N},()=>rand()*2-1);const vertices=[],colors=[];
const rockColors=[0x68677f,0x7e7a90,0x898198,0x6c6b85];const snowColors=[0xf3dfdf,0xe4d4df,0xffe9df,0xc6c2d7];
function ringPoint(k,j){const a=j/N*Math.PI*2;const ring=rings[k];const variance=k===3?snowline[j%N]:0;return [Math.cos(a)*ring.r,ring.y+variance,Math.sin(a)*ring.r*.7]}
for(let k=0;k<rings.length-1;k++)for(let j=0;j<N;j++){const a=ringPoint(k,j),b=ringPoint(k,(j+1)%N),c=ringPoint(k+1,j),d=ringPoint(k+1,(j+1)%N);for(const tri of [[a,c,b],[b,c,d]]){const color=new THREE.Color((k>=3?snowColors:rockColors)[Math.floor(rand()*4)]);for(const p of tri){vertices.push(...p);colors.push(color.r,color.g,color.b)}}}
const mg=new THREE.BufferGeometry();mg.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));mg.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));mg.computeVertexNormals();mesh(mg,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,side:THREE.DoubleSide}),0,0,0,mountain);
mesh(new THREE.CircleGeometry(3.2,64),new THREE.MeshBasicMaterial({color:0xffd2ad,fog:false}),-24,19,-65);
// Overlapping angular ridgelines and the quiet valley below.
function ridge(z,y,color,amplitude){const points=[];for(let i=0;i<20;i++)points.push(new THREE.Vector3(-65+i*7,y+rand()*amplitude,z));const v=[];for(let i=0;i<19;i++){const a=points[i],b=points[i+1];v.push(a.x,a.y,z,b.x,b.y,z,a.x,-10,z,b.x,b.y,z,b.x,-10,z,a.x,-10,z)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.computeVertexNormals();mesh(g,new THREE.MeshBasicMaterial({color,side:THREE.DoubleSide}));}
ridge(-36,-1,0x9790a6,3.5);ridge(-27,-2,0x787d92,4);ridge(-19,-3,0x626d7c,4);
const townMats=[mat(0x9a8c91),mat(0xa99b9e),mat(0x82818d)];for(let i=0;i<230;i++){const x=(rand()-.5)*70,z=-16-rand()*15,y=-3;const h=.15+rand()*.55;box(.25+rand()*.55,h,.4+rand()*.6,townMats[i%3],x,y+h/2,z);}
mesh(new THREE.CylinderGeometry(25,30,4,12),mat(0x424c49),7,-3,10);box(14,.5,10,stone,9,-.7,4);
// Five individually constructed storeys, with flared eaves and vermilion rails.
const pagoda=new THREE.Group();pagoda.position.set(8,-.4,3);pagoda.rotation.y=-.18;scene.add(pagoda);
box(7,.4,6.4,stone,0,0,0,pagoda);box(6.1,.4,5.7,stone,0,.35,0,pagoda);
function roof(width,y,parent){const levels=[{w:width*.49,y:0},{w:width*.5,y:.16},{w:width*.40,y:.33},{w:width*.13,y:1.25}];const v=[];const corners=[[-1,-1],[1,-1],[1,1],[-1,1]];for(let k=0;k<3;k++)for(let j=0;j<4;j++){let a=corners[j],b=corners[(j+1)%4];const p=(c,l)=>[c[0]*levels[l].w,levels[l].y+(l<2?.18:0),c[1]*levels[l].w];const A=p(a,k),B=p(b,k),C=p(a,k+1),D=p(b,k+1);v.push(...A,...B,...C,...B,...D,...C)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.computeVertexNormals();const r=mesh(g,dark,0,y,0,parent);r.material.side=THREE.DoubleSide;for(let j=0;j<4;j++){const a=corners[j],b=corners[(j+1)%4];branch(new THREE.Vector3(a[0]*width*.5,y+.15,a[1]*width*.5),new THREE.Vector3(b[0]*width*.5,y+.15,b[1]*width*.5),.055,gold,parent)}return r}
for(let level=0;level<5;level++){const y=.6+level*2.35,w=4.6-level*.45;box(w,1.85,w,red,0,y+.95,0,pagoda);box(w+.55,.16,w+.55,redLight,0,y,0,pagoda);for(const sx of [-1,1])for(const sz of [-1,1])box(.17,1.9,.17,redLight,sx*(w/2-.08),y+.95,sz*(w/2-.08),pagoda);
for(let j=-1;j<=1;j++){box(.47,1.04,.035,dark,j*w*.25,y+1.05,w/2+.025,pagoda);box(.035,1.04,.47,dark,-w/2-.025,y+1.05,j*w*.25,pagoda);box(.06,1.05,.04,gold,j*w*.25,y+1.05,w/2+.05,pagoda)}
const rw=w+.6;for(const side of [-1,1]){box(rw,.1,.1,redLight,0,y+.58,side*rw/2,pagoda);box(.1,.1,rw,redLight,side*rw/2,y+.58,0,pagoda);for(let j=0;j<9;j++){const t=(j/8-.5)*rw;box(.065,.55,.065,redLight,t,y+.3,side*rw/2,pagoda);box(.065,.55,.065,redLight,side*rw/2,y+.3,t,pagoda)}}roof(w+2.1,y+1.85,pagoda);}
const top=13.3;mesh(new THREE.CylinderGeometry(.055,.095,3,8),gold,0,top+.6,0,pagoda);for(let i=0;i<7;i++){const tor=new THREE.TorusGeometry(.27-i*.023,.045,4,12);const m=mesh(tor,gold,0,top-.5+i*.28,0,pagoda);m.rotation.x=Math.PI/2}mesh(new THREE.SphereGeometry(.14,8,6),gold,0,top+2.15,0,pagoda);
for(let i=0;i<7;i++)box(3,.17,1.1,stone,8,-.8-i*.16,7+i*.65);
const blossomMats=[0xf4b7c6,0xe6a0bb,0xffd2d4,0xd88dab,0xf9c5cf].map(mat);const trunk=mat(0x594249);const trees=[];
function tree(x,y,z,size){const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(size);scene.add(g);branch(new THREE.Vector3(0,0,0),new THREE.Vector3(.15,3.9,0),.22,trunk,g);for(let i=0;i<9;i++){const a=i*2.4;const end=new THREE.Vector3(Math.cos(a)*(1+rand()*1.4),3+rand()*2,Math.sin(a)*1.8);branch(new THREE.Vector3(.1,1.7+i*.16,0),end,.09,trunk,g);for(let j=0;j<5;j++){const p=end.clone().add(new THREE.Vector3((rand()-.5)*1.9,(rand()-.5)*1.1,(rand()-.5)*1.8));const m=mesh(new THREE.IcosahedronGeometry(.65+rand()*.48,0),blossomMats[Math.floor(rand()*5)],p.x,p.y,p.z,g);m.scale.y=.65+rand()*.35;}}trees.push({g,phase:rand()*6});}
tree(-13,-2,5,1.8);tree(-18,-2,-2,1.7);tree(-6,-2,12,1.1);tree(16,-1,9,1.7);tree(19,-1,-3,1.5);tree(-19,-1,16,2);tree(3,-2,-5,.8);tree(-3,-2,-8,.7);
// Small conifers give the foreground a dark, faceted edge.
for(let i=0;i<45;i++){const x=(rand()-.5)*52,z=rand()*20-7;if(x>3&&x<13&&z<10)continue;const h=1+rand()*2;mesh(new THREE.ConeGeometry(h*.45,h,5),mat(i%2?0x354b4c:0x435757),x,-1+h*.25,z)}
const petals=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.065,0),mat(0xffc6d2),160);scene.add(petals);const petalData=Array.from({length:160},()=>({x:(rand()-.5)*48,y:rand()*19,z:rand()*30-12,s:rand()*6}));const dummy=new THREE.Object3D();
let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,t=0,last=0,frames=0;const motion=document.querySelector('#motion');function setLabel(){motion.textContent=paused?'▷  Resume':'Ⅱ  Pause';motion.setAttribute('aria-pressed',String(paused))}setLabel();motion.onclick=()=>{paused=!paused;setLabel()};const toggleUI=()=>document.body.classList.toggle('hidden-ui');document.querySelector('#clean').onclick=toggleUI;addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h')toggleUI();if(e.code==='Space'&&e.target===document.body){e.preventDefault();paused=!paused;setLabel()}});
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth/innerHeight<1?55:39;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;if(!paused)t+=dt;trees.forEach(({g,phase})=>{g.rotation.z=Math.sin(t*.45+phase)*.012});petalData.forEach((p,i)=>{dummy.position.set(((p.x+t*.37+24)%48)-24,((p.y-t*.22+30)%20)-1,p.z+Math.sin(t*.3+p.s)*.6);dummy.rotation.set(t*.5+p.s,t*.3,p.s+t*.2);dummy.scale.set(1,.45,1.4);dummy.updateMatrix();petals.setMatrixAt(i,dummy.matrix)});petals.instanceMatrix.needsUpdate=true;renderer.render(scene,camera);frames++;document.documentElement.dataset.rendered=String(frames);}
requestAnimationFrame(animate);
window.addEventListener('error',e=>{const el=document.querySelector('#error');el.style.display='block';el.textContent='The landscape could not render. '+e.message});
</script>
