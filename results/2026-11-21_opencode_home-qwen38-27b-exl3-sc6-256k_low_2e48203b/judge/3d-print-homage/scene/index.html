<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Great Wave off Kanagawa — low poly</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8ddc0}
  canvas{display:block}
  #cap{position:fixed;left:14px;bottom:10px;font:12px/1.4 Georgia,serif;color:#3a4a63;opacity:.75;pointer-events:none}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="cap">The Great Wave off Kanagawa (Katsushika Hokusai, c. 1831) — low poly homage</div>
<script type="module">
import * as THREE from 'three';

// ---- Palette sampled from the print ----
const C = {
  paper: 0xe8ddc0, deep: 0x14324f, blue: 0x1d4e79, mid: 0x2f6f9e,
  pale:  0x9cc3d5, foam: 0xf4f1e4, snow: 0xf6f3e8, fuji: 0x5b7d9c,
  hull:  0xd9a05b, hullD: 0xa8743c, line: 0x12233a,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 45, 100);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 5.5, 27);
camera.lookAt(0, 3.5, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const mat = c => new THREE.MeshLambertMaterial({color:c, flatShading:true, side:THREE.DoubleSide});
// foam / snow: bright white that reads as white regardless of light (unlit)
const foamMat = new THREE.MeshBasicMaterial({color:C.foam});
scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xfff4dd, 0.6);
sun.position.set(-6, 14, 8);
scene.add(sun);

// ---------- Clouds (paper-white low poly puffs) ----------
function cloud(x,y,z,s){
  const g = new THREE.Group();
  for(let i=0;i<6;i++){
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(s*(0.45+Math.random()*0.5),0), foamMat);
    m.position.set((i-2.5)*s*0.6, Math.random()*s*0.25, Math.random()*s*0.2);
    m.scale.y = 0.55;
    g.add(m);
  }
  g.position.set(x,y,z);
  return g;
}
const clouds = [cloud(-9,12,-24,1.7), cloud(3,13.5,-26,2.1), cloud(13,11.5,-22,1.4)];
clouds.forEach(c=>scene.add(c));

// ---------- Mt. Fuji ----------
const fuji = new THREE.Group();
const fbase = new THREE.Mesh(new THREE.ConeGeometry(7, 5, 7), mat(C.fuji));
fbase.position.y = 2.5;
const fcap = new THREE.Mesh(new THREE.ConeGeometry(3.2, 2.1, 7), foamMat);
fcap.position.y = 4.3;
fuji.add(fbase, fcap);
fuji.position.set(11, 1.5, -10);
scene.add(fuji);

// ---------- Curling wave crest ----------
// Build a crescent "C" profile in the XY plane (like the print's curl),
// extrude it along Z for depth, then add a white foam lip + foam dots on the inner edge.
function makeCrest(size, depth){
  const g = new THREE.Group();
  const R = size, r = size*0.55;
  const a0 = Math.PI*0.15, a1 = Math.PI*1.35; // sweep of the curl
  // solid filled curl: full disc (no hole) so it reads as a wave, not a ring
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R, depth, 22, 1), mat(C.blue));
  body.rotation.x = Math.PI/2; // axis along Z
  g.add(body);
  // darker throat ring on the front face (the curl's inner edge)
  const throat = new THREE.Mesh(new THREE.TorusGeometry(r, size*0.10, 5, 20, Math.PI*1.2), mat(C.deep));
  throat.rotation.z = a0;
  throat.position.z = depth/2 + 0.01;
  g.add(throat);
  // white foam lip along the outer crest edge (front face)
  const lip = new THREE.Mesh(new THREE.TorusGeometry(R*0.99, size*0.13, 6, 22, Math.PI*1.2), foamMat);
  lip.rotation.z = a0;
  lip.position.z = depth/2 + 0.02;
  g.add(lip);
  // foam "claws": small icosahedra scattered along the outer lip
  for(let i=0;i<14;i++){
    const t = a0 + (i/13)*Math.PI*1.2;
    const dot = new THREE.Mesh(new THREE.IcosahedronGeometry(size*(0.05+Math.random()*0.05),0),
      (Math.random()<0.5?foamMat:mat(C.pale)));
    dot.position.set(Math.cos(t)*R, Math.sin(t)*R, depth/2 + 0.06);
    g.add(dot);
  }
  return g;
}

// The great wave: big crest on the left, curl opening to the right (like the print)
const great = makeCrest(6.5, 3.0);
great.position.set(-8, 7, -7);
great.rotation.y = 0.25;
scene.add(great);

// secondary waves: smaller crests across the sea (kept behind the boats)
const waves = [
  {m:makeCrest(3.2,2.4), p:[4,3,-3],    ry:-0.2,  flip:true},
  {m:makeCrest(4.2,2.8), p:[10,4.5,-5], ry:0.1,   flip:false},
  {m:makeCrest(2.6,2.0), p:[-3,2,1],    ry:0.4,   flip:true},
  {m:makeCrest(2.8,2.2), p:[13,2.5,0],  ry:-0.3,  flip:true},
  {m:makeCrest(3.0,2.2), p:[-12,3.5,-2],ry:0.2,   flip:false},
];
waves.forEach(w=>{
  if(w.flip) w.m.scale.x = -1;
  w.m.position.set(...w.p);
  w.m.rotation.y = w.ry;
  scene.add(w.m);
});

// ---------- Boats: three fishing boats (the print shows three) ----------
function boat(x,y,z,s,rotY){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(s*2.4, s*0.5, s*0.9), mat(C.hull));
  const bow = new THREE.Mesh(new THREE.ConeGeometry(s*0.45, s*0.9, 4), mat(C.hull));
  bow.rotation.z = -Math.PI/2; bow.rotation.y = Math.PI/4; bow.position.set(s*1.35, 0, 0);
  const stern = new THREE.Mesh(new THREE.ConeGeometry(s*0.45, s*0.9, 4), mat(C.hull));
  stern.rotation.z = Math.PI/2; stern.rotation.y = Math.PI/4; stern.position.set(-s*1.35, 0, 0);
  const edge = new THREE.Mesh(new THREE.BoxGeometry(s*2.5, s*0.12, s*0.95), mat(C.hullD));
  edge.position.y = s*0.28;
  g.add(hull, bow, stern, edge);
  // row of crouching figures (heads) like the print
  for(let i=0;i<6;i++){
    const head = new THREE.Mesh(new THREE.IcosahedronGeometry(s*0.13,0), mat(C.line));
    head.position.set(-s*0.9 + i*s*0.32, s*0.42, 0);
    g.add(head);
  }
  if(s>0.8){
    const cover = new THREE.Mesh(new THREE.BoxGeometry(s*0.8, s*0.35, s*0.7), mat(C.foam));
    cover.position.set(-s*0.4, s*0.5, 0);
    g.add(cover);
  }
  g.position.set(x,y,z);
  g.rotation.y = rotY;
  return g;
}
const boats = [
  boat(-9, 4.2, 2, 0.9, 0.5),    // under the great wave (left)
  boat(6, 3.2, 3, 1.0, -0.4),    // right of Fuji
  boat(0.5, 2.2, 6, 1.1, 0.15),  // lower centre
];
boats.forEach(b=>scene.add(b));

// ---------- Gentle motion ----------
const t0 = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const t = (performance.now()-t0)/1000;
  great.position.y = 6 + Math.sin(t*0.7)*0.35;
  great.rotation.z = Math.sin(t*0.5)*0.04;
  waves.forEach((w,i)=>{
    w.m.position.y = w.p[1] + Math.sin(t*0.9 + i)*0.15;
    w.m.rotation.z = Math.sin(t*0.6 + i*1.3)*0.03;
  });
  boats.forEach((b,i)=>{
    b.position.y += Math.sin(t*1.1 + i*2)*0.006;
    b.rotation.z = Math.sin(t*0.8 + i)*0.06;
    b.rotation.x = Math.cos(t*0.6 + i)*0.04;
  });
  clouds.forEach((c,i)=>{ c.position.x += 0.003*(i%2?1:-1); });
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
