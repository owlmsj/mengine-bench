<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0d12; --panel:#16141c; --ink:#f2efe9; --dim:#9a93a8;
    --line:#2a2733; --accent:#e8b464; --accent2:#7fb4a8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .ui{position:fixed;z-index:10}
  header.ui{top:0;left:0;right:0;padding:18px 22px;display:flex;align-items:baseline;gap:14px;pointer-events:none}
  header h1{font-family:Fraunces,serif;font-weight:300;font-size:26px;margin:0;letter-spacing:.02em}
  header .sub{color:var(--dim);font-size:13px}
  .search{position:fixed;top:16px;right:22px;z-index:20;display:flex;flex-direction:column;gap:8px;width:280px}
  .search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
    background:rgba(22,20,28,.85);backdrop-filter:blur(8px);color:var(--ink);font-size:14px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .sugg{list-style:none;margin:0;padding:6px;border-radius:10px;background:rgba(22,20,28,.92);
    border:1px solid var(--line);max-height:260px;overflow:auto;display:none}
  .sugg li{padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--dim)}
  .sugg li:hover{background:#221f2b;color:var(--ink)}
  .sugg li b{color:var(--ink);font-weight:600}
  .panel{left:22px;bottom:22px;width:340px;max-height:60vh;overflow:auto;background:rgba(22,20,28,.88);
    backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .panel .word{font-family:Fraunces,serif;font-size:30px;font-weight:600;margin:0 0 2px}
  .panel .theme{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
  .panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:14px 0 8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#1d1a24;
    font-size:12.5px;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.syn{border-color:rgba(232,180,100,.5)}
  .chip.an{border-color:rgba(127,180,168,.5)}
  .stats{position:fixed;right:22px;bottom:22px;z-index:10;color:var(--dim);font-size:12px;text-align:right;pointer-events:none}
  .stats b{color:var(--ink);font-weight:600}
  .hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;color:var(--dim);font-size:12px;pointer-events:none}
  @media (max-width:720px){.panel{width:calc(100% - 44px)}.search{width:200px}}
</style>
</head>

<div id="app"></div>
<header class="ui"><h1>Universo de Palavras</h1><span class="sub">dicionário criativo — 252 palavras, 1113 relações</span></header>
<div class="search">
  <input id="q" type="search" placeholder="buscar palavra…" autocomplete="off" spellcheck="false">
  <ul id="sugg" class="sugg"></ul>
</div>
<div id="panel" class="panel ui" hidden></div>
<div class="stats" id="stats"></div>
<div class="hint" id="hint">arraste para girar · role para zoom · clique numa palavra</div>

r": "sentimentos", "prima": "família", "primo": "família", "professor": "ofícios", "profissão": "ofícios", "pulmão": "corpo", "quarto": "lugares", "queijo": "comida", "raiz": "natureza", "refeição": "comida", "resposta": "linguagem", "riacho": "natureza", "rima": "artes", "rio": "natureza", "ritmo": "artes", "romance": "artes", "rosto": "corpo", "rua": "lugares", "sal": "comida", "salário": "ofícios", "samba": "artes", "sangue": "corpo", "sapateiro": "ofícios", "saudade": "sentimentos", "século": "tempo", "segundo": "tempo", "selva": "natureza", "semana": "tempo", "semente": "natureza", "sentido": "linguagem", "serra": "natureza", "significado": "linguagem", "sílaba": "linguagem", "silêncio": "linguagem", "sinônimo": "linguagem", "sobrinho": "família", "sogra": "família", "soldado": "ofícios", "sotaque": "linguagem", "surpresa": "sentimentos", "sussurro": "linguagem", "susto": "sentimentos", "tambor": "artes", "tarde": "tempo", "teatro": "artes", "tela": "artes", "tempo": "tempo", "ternura": "sentimentos", "tia": "família", "tio": "família", "trabalho": "ofícios", "trigo": "comida", "tristeza": "sentimentos", "unha": "corpo", "vale": "natureza", "verso": "artes", "vila": "lugares", "vinho": "comida", "violão": "artes", "voz": "linguagem"};
// ---- scene
const app = document.getElementById("app");
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0e0d12, 0.0016);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 5000);
camera.position.set(0, 40, 320);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
app.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, .9));
const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(120, 200, 160); scene.add(dl);

// ---- layout: deterministic 3D positions via hash-based sphere + jitter
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967295;}
const pos = {};
words.forEach((w,i)=>{
  const u = hash(w), v = hash(w+"x"), th = u*Math.PI*2, ph = Math.acos(2*v-1);
  const R = 120 + hash(w+"r")*60;
  pos[w] = new THREE.Vector3(R*Math.sin(ph)*Math.cos(th), R*Math.cos(ph)*0.7, R*Math.sin(ph)*Math.sin(th));
});

// ---- nodes
const nodeGeo = new THREE.SphereGeometry(1, 12, 12);
const nodeMat = new THREE.MeshStandardMaterial({color:0xf2efe9, roughness:.6, metalness:.1});
const nodes = {};
const deg = {};
for (const w of words){ deg[w] = WORDS[w].length; }
const maxDeg = Math.max(...Object.values(deg));
for (const w of words){
  const m = nodeMat.clone();
  const mesh = new THREE.Mesh(nodeGeo, m);
  const s = 1.6 + (deg[w]/maxDeg)*4.2;
  mesh.scale.setScalar(s);
  mesh.position.copy(pos[w]);
  mesh.userData.word = w;
  scene.add(mesh);
  nodes[w] = mesh;
}

// ---- labels (sprites)
function makeLabel(text, size=48){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const fs = size;
  ctx.font = `600 ${fs}px Inter, sans-serif`;
  const tw = ctx.measureText(text).width;
  c.width = Math.ceil(tw)+24; c.height = fs+24;
  const g = c.getContext("2d");
  g.font = `600 ${fs}px Inter, sans-serif`;
  g.fillStyle = "#f2efe9"; g.textBaseline = "middle"; g.textAlign = "center";
  g.fillText(text, c.width/2, c.height/2);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  const sp = new THREE.Sprite(mat);
  const scale = c.width/c.height;
  sp.scale.set(scale*10, 10, 1);
  return sp;
}
const labels = {};
for (const w of words){
  const sp = makeLabel(w, 40);
  sp.position.copy(pos[w]).add(new THREE.Vector3(0, 6 + (deg[w]/maxDeg)*3, 0));
  sp.material.opacity = 0.85;
  scene.add(sp);
  labels[w] = sp;
}

// ---- edges
const edgeMat = new THREE.LineBasicMaterial({color:0x4a4558, transparent:true, opacity:0.28});
const edgeGroup = new THREE.Group(); scene.add(edgeGroup);
const edges = [];
const seen = new Set();
for (const w of words){
  for (const r of WORDS[w]){
    const key = [w,r].sort().join("|");
    if (seen.has(key)) continue; seen.add(key);
    const g = new THREE.BufferGeometry().setFromPoints([pos[w], pos[r]]);
    const line = new THREE.Line(g, edgeMat.clone());
    edgeGroup.add(line);
    edges.push({a:w, b:r, line});
  }
}

// ---- interaction
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let selected = null;
function setWord(w, push=true){
  selected = w;
  const p = document.getElementById("panel");
  if (!w){ p.hidden = true; }
  else {
    const d = WORDS[w];
    const syn = d.filter(x => (adj[w][x]||"") === "mut" || true); // show all relations, mark kind
    const kinds = {};
    for (const r of d) kinds[r] = adj[w][r];
    let html = `<p class="word">${w}</p>`;
    const theme = (typeof THEMES!=="undefined") ? THEMES[w] : null;
    if (theme) html += `<div class="theme">tema: ${theme}</div>`;
    html += `<h3>${d.length} relações</h3><div class="chips">`;
    for (const r of d){
      const k = kinds[r] === "mut" ? "syn" : "an";
      html += `<span class="chip ${k}" data-w="${r}">${r}</span>`;
    }
    html += `</div>`;
    p.innerHTML = html;
    p.hidden = false;
    p.querySelectorAll(".chip").forEach(c => c.onclick = () => setWord(c.dataset.w));
  }
  // highlight
  const nb = new Set(w ? WORDS[w] : []);
  if (w) nb.add(w);
  for (const x of words){
    const on = !w || nb.has(x);
    nodes[x].material.color.set(on ? (x===w?0xe8b464:0xf2efe9) : 0x3a3644);
    nodes[x].material.emissive = nodes[x].material.emissive || new THREE.Color(0);
    nodes[x].material.emissive.set(x===w ? 0x553300 : 0x000000);
    labels[x].material.opacity = on ? 0.95 : 0.12;
  }
  for (const e of edges){
    const on = w && (e.a===w || e.b===w);
    e.line.material.opacity = on ? 0.9 : (w ? 0.06 : 0.28);
    e.line.material.color.set(on ? 0xe8b464 : 0x4a4558);
  }
  if (push && w) history.replaceState(null, "", "?word="+encodeURIComponent(w));
  if (!w) history.replaceState(null, "", location.pathname);
}

// ---- search
const q = document.getElementById("q");
const sugg = document.getElementById("sugg");
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
q.addEventListener("input", () => {
  const v = norm(q.value.trim());
  if (!v){ sugg.style.display="none"; return; }
  const hits = words.filter(w => norm(w).startsWith(v) || norm(w).includes(v)).slice(0, 12);
  if (!hits.length){ sugg.style.display="none"; return; }
  sugg.innerHTML = hits.map(w => `<li data-w="${w}"><b>${w}</b></li>`).join("");
  sugg.style.display = "block";
  sugg.querySelectorAll("li").forEach(li => li.onclick = () => { setWord(li.dataset.w); q.value=li.dataset.w; sugg.style.display="none"; });
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter"){
    const v = norm(q.value.trim());
    const hit = words.find(w => norm(w) === v) || words.find(w => norm(w).startsWith(v));
    if (hit) setWord(hit);
  }
  if (e.key === "Escape"){ sugg.style.display="none"; }
});

// ---- click / drag
let down = null, moved = false;
renderer.domElement.addEventListener("pointerdown", e => { down = {x:e.clientX, y:e.clientY}; moved = false; });
renderer.domElement.addEventListener("pointermove", e => {
  if (down && (Math.abs(e.clientX-down.x)>4 || Math.abs(e.clientY-down.y)>4)) moved = true;
});
renderer.domElement.addEventListener("pointerup", e => {
  if (moved){ down = null; return; }
  mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const meshes = Object.values(nodes);
  const hits = ray.intersectObjects(meshes);
  if (hits.length) setWord(hits[0].object.userData.word);
  else setWord(null);
  down = null;
});

// ---- orbit
let rotY = 0, rotX = 0.15, zoom = 320, dragging = false, last = null;
renderer.domElement.addEventListener("pointerdown", e => { dragging = true; last = {x:e.clientX, y:e.clientY}; });
addEventListener("pointerup", () => dragging = false);
addEventListener("pointermove", e => {
  if (!dragging) return;
  rotY += (e.clientX-last.x)*0.005;
  rotX += (e.clientY-last.y)*0.005;
  rotX = Math.max(-1.4, Math.min(1.4, rotX));
  last = {x:e.clientX, y:e.clientY};
});
renderer.domElement.addEventListener("wheel", e => {
  e.preventDefault();
  zoom *= (1 + Math.sign(e.deltaY)*0.08);
  zoom = Math.max(80, Math.min(900, zoom));
}, {passive:false});

// ---- stats
const totalPairs = new Set(words.flatMap(w => WORDS[w].map(r => [w,r].sort().join("|")))).size;
document.getElementById("stats").innerHTML =
  `<b>${words.length}</b> palavras · <b>${totalPairs}</b> relações<br>mais conectada: <b>${[...words].sort((a,b)=>WORDS[b].length-WORDS[a].length)[0]}</b>`;

// ---- deep link
const params = new URLSearchParams(location.search);
const init = params.get("word");
if (init && WORDS[init]) setWord(init, false);

// ---- animate
function tick(){
  requestAnimationFrame(tick);
  if (!dragging) rotY += 0.0009;
  const group = new THREE.Group();
  // rotate camera around origin
  camera.position.set(Math.sin(rotY)*zoom, Math.sin(rotX)*zoom*0.5 + 30, Math.cos(rotY)*zoom);
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
}
tick();
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
