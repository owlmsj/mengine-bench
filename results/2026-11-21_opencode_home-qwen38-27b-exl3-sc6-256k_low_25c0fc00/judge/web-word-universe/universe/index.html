for (const w of words) for (const r of rels.get(w)) pairs.add([w,r].sort().join("\u0000"));

const N = words.length;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d0b14, 0.0035);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 3000);
cam.position.set(0,0,240);
const ren = new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.setSize(innerWidth,innerHeight);

// ---- force layout (3D, a few hundred iters) ----
const pos = new Float32Array(N*3), vel = new Float32Array(N*3);
for (let i=0;i<N;i++){
  const t = Math.acos(2*Math.random()-1), p = Math.random()*Math.PI*2, r = 90*Math.cbrt(Math.random());
  pos[i*3]=r*Math.sin(t)*Math.cos(p); pos[i*3+1]=r*Math.sin(t)*Math.sin(p); pos[i*3+2]=r*Math.cos(t);
}
const edges=[]; for (const w of words) for (const r of rels.get(w)) if (w<r) edges.push([idx.get(w),idx.get(r)]);
const K=14, REP=2600;
for (let it=0; it<300; it++){
  const f=new Float32Array(N*3);
  for (let a=0;a<N;a++) for (let b=a+1;b<N;b++){
    let dx=pos[a*3]-pos[b*3],dy=pos[a*3+1]-pos[b*3+1],dz=pos[a*3+2]-pos[b*3+2];
    let d2=dx*dx+dy*dy+dz*dz+.01, d=Math.sqrt(d2), m=REP/d2/d;
    f[a*3]+=dx*m;f[a*3+1]+=dy*m;f[a*3+2]+=dz*m;
    f[b*3]-=dx*m;f[b*3+1]-=dy*m;f[b*3+2]-=dz*m;
  }
  for (const [a,b] of edges){
    let dx=pos[a*3]-pos[b*3],dy=pos[a*3+1]-pos[b*3+1],dz=pos[a*3+2]-pos[b*3+2];
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01, m=(d-K)*.02/d;
    f[a*3]-=dx*m;f[a*3+1]-=dy*m;f[a*3+2]-=dz*m;
    f[b*3]+=dx*m;f[b*3+1]+=dy*m;f[b*3+2]+=dz*m;
  }
  const cool=1-it/300;
  for (let i=0;i<N;i++){ f[i*3]-=pos[i*3]*.01; f[i*3+1]-=pos[i*3+1]*.01; f[i*3+2]-=pos[i*3+2]*.01; }
  for (let i=0;i<N;i++){
    vel[i*3]=(vel[i*3]+f[i*3])*.85*cool; vel[i*3+1]=(vel[i*3+1]+f[i*3+1])*.85*cool; vel[i*3+2]=(vel[i*3+2]+f[i*3+2])*.85*cool;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}
// center
let cx=0,cy=0,cz=0; for(let i=0;i<N;i++){cx+=pos[i*3];cy+=pos[i*3+1];cz+=pos[i*3+2];}
cx/=N;cy/=N;cz/=N;
for(let i=0;i<N;i++){pos[i*3]-=cx;pos[i*3+1]-=cy;pos[i*3+2]-=cz;}
// rescale to a fixed radius so the spread is predictable
let rr=0; for(let i=0;i<N;i++) rr=Math.max(rr, Math.hypot(pos[i*3],pos[i*3+1],pos[i*3+2]));
const S=150/rr; for(let i=0;i<N*3;i++) pos[i]*=S;

// ---- nodes: instanced spheres ----
const geo = new THREE.SphereGeometry(1,12,12);
const mat = new THREE.MeshBasicMaterial({color:0xffffff});
const inst = new THREE.InstancedMesh(geo, mat, N);
const c = new THREE.Color();
for (let i=0;i<N;i++){
  const s = 1.1 + Math.sqrt(deg.get(words[i]))*0.55;
  inst.setMatrixAt(i, new THREE.Matrix4().makeScale(s,s,s).setPosition(pos[i*3],pos[i*3+1],pos[i*3+2]));
  const t = deg.get(words[i])/16;
  c.setHSL(0.09 - t*0.05, 0.55, 0.55 + t*0.25);
  inst.setColorAt(i, c);
}
scene.add(inst);

// ---- labels: sprites ----
function label(word, big){
  const cv=document.createElement("canvas"), x=cv.getContext("2d");
  const fs = big?44:26; x.font=`${big?600:400} ${fs}px Inter`;
  const w=Math.ceil(x.measureText(word).width)+16; cv.width=w; cv.height=fs+16;
  x.font=`${big?600:400} ${fs}px Inter`; x.fillStyle=big?"#e8b04b":"#cfc8da"; x.textBaseline="middle";
  x.fillText(word,8,fs/2+8);
  const tx=new THREE.CanvasTexture(cv); tx.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthTest:false}));
  const sc=(big?1.6:0.85); sp.scale.set(w/28*sc, (fs+16)/28*sc, 1);
  return sp;
}
const labels=[];
for (let i=0;i<N;i++){ const l=label(words[i], deg.get(words[i])>=8); l.position.set(pos[i*3],pos[i*3+1]+3.2,pos[i*3+2]); l.userData.i=i; scene.add(l); labels.push(l); }

// ---- edges ----
const epos=new Float32Array(edges.length*6);
function updEdges(){ for(let k=0;k<edges.length;k++){const [a,b]=edges[k]; epos.set([pos[a*3],pos[a*3+1],pos[a*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]],k*6);} }
updEdges();
const egeo=new THREE.BufferGeometry();
egeo.setAttribute("position", new THREE.BufferAttribute(epos,3));
const eline=new THREE.LineSegments(egeo, new THREE.LineBasicMaterial({color:0x4a4260,transparent:true,opacity:.35}));
scene.add(eline);
// highlight edges
const hgeo=new THREE.BufferGeometry();
hgeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(0),3));
const hline=new THREE.LineSegments(hgeo, new THREE.LineBasicMaterial({color:0xe8b04b,transparent:true,opacity:.9}));
scene.add(hline);

// ---- selection ----
let sel=null, hl=new Set();
const panel=document.getElementById("panel");
function select(w){
  sel=w; hl=new Set([w, ...rels.get(w)]);
  const i=idx.get(w);
  const d=deg.get(w);
  const top=words.filter(x=>deg.get(x)>=d).length===1;
  panel.innerHTML=`<div class="w">${w}</div><div class="t">${d} ligações${top?" · mais conectada":""}</div>
  <h3>Relacionadas</h3><ul>${rels.get(w).map(r=>`<li><a data-w="${r}">${r}</a></li>`).join("")}</ul>`;
  panel.querySelectorAll("a").forEach(a=>a.onclick=()=>select(a.dataset.w));
  history.replaceState(null,"","?word="+encodeURIComponent(w));
  // highlight edges
  const arr=[]; for(const [a,b] of edges){ if(a===i||b===i) arr.push(pos[a*3],pos[a*3+1],pos[a*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]); }
  hgeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(arr),3));
  // dim non-neighbors
  for(let k=0;k<N;k++){
    const on=hl.has(words[k]);
    const s=1.1+Math.sqrt(deg.get(words[k]))*.55;
    inst.setMatrixAt(k,new THREE.Matrix4().makeScale(on?s*1.25:s*.8,on?s*1.25:s*.8,on?s*1.25:s*.8).setPosition(pos[k*3],pos[k*3+1],pos[k*3+2]));
    c.setHSL(0.09-(deg.get(words[k])/16)*.05,.55,on?.8:.28);
    inst.setColorAt(k,c);
    labels[k].material.opacity=on?1:.18;
  }
  inst.instanceMatrix.needsUpdate=true; inst.instanceColor.needsUpdate=true;
  // focus camera on the word
  focus.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
  dist=140;
}
panel.innerHTML=`<div class="w" style="color:var(--dim)">escolha uma palavra</div><div class="t">${N} palavras · ${pairs.size} relações</div>`;
document.getElementById("stats").innerHTML=`<b>${N}</b> palavras<br><b>${pairs.size}</b> relações<br>mais conectada: <b>${words.reduce((a,b)=>deg.get(b)>deg.get(a)?b:a,words[0])}</b>`;

// ---- camera controls (orbit + focus) ----
let theta=0, phi=1.2, dist=380; const focus=new THREE.Vector3();
function camUp(){ const sp=Math.sin(phi); cam.position.set(focus.x+dist*sp*Math.sin(theta), focus.y+dist*Math.cos(phi), focus.z+dist*sp*Math.cos(theta)); cam.lookAt(focus); }
let drag=null;
addEventListener("pointerdown",e=>{ if(e.target.tagName==="INPUT")return; drag=[e.clientX,e.clientY]; });
addEventListener("pointermove",e=>{ if(!drag)return; theta-=(e.clientX-drag[0])*.005; phi=Math.max(.15,Math.min(2.9,phi-(e.clientY-drag[1])*.005)); drag=[e.clientX,e.clientY]; camUp(); });
addEventListener("pointerup",()=>drag=null);
addEventListener("wheel",e=>{ dist=Math.max(60,Math.min(900,dist+e.deltaY*.25)); camUp(); },{passive:true});

// click node
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
addEventListener("click",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="A")return;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,cam);
  const hit=ray.intersectObject(inst);
  if(hit.length) select(words[hit[0].instanceId]);
});

// ---- search ----
const q=document.getElementById("q"), sug=document.getElementById("sug");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();
  if(!v){sug.style.display="none";return;}
  const m=words.filter(w=>w.toLowerCase().includes(v)).slice(0,12);
  sug.innerHTML=m.map(w=>`<div data-w="${w}">${w}</div>`).join("")||`<div>nenhuma</div>`;
  sug.style.display="block";
  sug.querySelectorAll("div[data-w]").forEach(d=>d.onclick=()=>{select(d.dataset.w);sug.style.display="none";q.value=d.dataset.w;});
});
document.getElementById("go").onclick=()=>{ const v=q.value.trim().toLowerCase(); const w=words.find(x=>x.toLowerCase()===v)||words.find(x=>x.toLowerCase().includes(v)); if(w){select(w);sug.style.display="none";} };
q.addEventListener("keydown",e=>{ if(e.key==="Enter")document.getElementById("go").click(); });

// ---- deep link ----
const p=new URLSearchParams(location.search).get("word");
if(p){ const w=words.find(x=>x.toLowerCase()===p.toLowerCase()); if(w) select(w); }

// ---- loop ----
camUp();
(function tick(){ requestAnimationFrame(tick); if(!drag){theta+=.0006; camUp();} ren.render(scene,cam); })();
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
</script></body></html>
