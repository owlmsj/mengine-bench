<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Wave off Kanagawa — Low Poly 3D</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #d8c9a3; }
  canvas { display: block; }
  #title {
    position: absolute; top: 14px; left: 18px; color: #1e3a5f;
    font-family: Georgia, 'Times New Roman', serif; font-size: 15px;
    letter-spacing: .06em; opacity: .85; pointer-events: none;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
</style>
</head>
<body>
<div id="title">The Great Wave off Kanagawa &mdash; low poly homage</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ---- Palette from the print (Hokusai, public domain) ---- */
const C = {
  paper: 0xd8c9a3,
  blueDk: 0x1b3a5c,  // deep Prussian (wave body)
  blueMd: 0x2e5f8a,
  blueLt: 0x7fa8c9,  // light blue band
  white: 0xffffff,   // foam (bright white to read against paper)
  fuji:  0x27476e,
  snow:  0xf2ede1,
  hull:  0xd9a86a,
  hullDk:0x8a5a2b,
  mat:   0xe8e0cc,
  fig:   0x3a2a1a,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 70, 180);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 7, 50);
camera.lookAt(0, 3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xf5ecd8, 0x2e5f8a, 1.15));
const sun = new THREE.DirectionalLight(0xfff4dd, 0.85);
sun.position.set(-8, 20, 10);
scene.add(sun);

const mat = (c, o={}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });

/* ================= Mt. Fuji (snow-capped, low, center-right) ================= */
{
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(15, 13, 7, 1), mat(C.fuji));
  body.position.y = 6.5;
  g.add(body);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(6, 5, 7, 1), mat(C.snow));
  cap.position.y = 11.5;
  cap.rotation.y = 0.3;
  g.add(cap);
  for (let i = 0; i < 5; i++) {
    const a = i/5 * Math.PI*2 + 0.4;
    const p = new THREE.Mesh(new THREE.ConeGeometry(1.4, 2, 5, 1), mat(C.snow));
    p.position.set(Math.cos(a)*7, 9 - Math.abs(Math.sin(a))*1.2, Math.sin(a)*7);
    p.rotation.set(Math.sin(a)*0.5, 0, Math.cos(a)*0.5);
    g.add(p);
  }
  g.position.set(15, -3, -32);
  scene.add(g);
}

/* ================= WAVES =================
   A wave = a thick blue ribbon that rises, curls over, and ends in foam "claws".
   Built as a series of overlapping boxes along a curl path, so it reads as one
   continuous breaking wave, not disjointed pieces. */

const waves = [];

function buildWave(scale) {
  const g = new THREE.Group();
  const deep = mat(C.blueDk), light = mat(C.blueLt), foam = new THREE.MeshBasicMaterial({ color: C.white });

  // Path: the wave rises from the left, peaks, curls over to the right.
  // Points along the curl (x = horizontal, y = height).
  const pts = [];
  const N = 14;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    // Rise then curl: x goes 0 -> 10, y goes 0 -> 8 -> 5 (crest then curl down)
    const x = t * 10;
    const y = Math.sin(t * Math.PI * 0.85) * 8 * (1 - t * 0.25);
    pts.push([x, y]);
  }

  // Lay thick boxes along the path, each rotated to follow the tangent.
  for (let i = 0; i < N - 1; i++) {
    const [x0, y0] = pts[i];
    const [x1, y1] = pts[i+1];
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy) + 1.2 * scale; // overlap
    const ang = Math.atan2(dy, dx);

    // Main blue body
    const seg = new THREE.Mesh(new THREE.BoxGeometry(len, 2.6 * scale, 2.2 * scale), deep);
    seg.position.set((x0+x1)/2, (y0+y1)/2, 0);
    seg.rotation.z = ang;
    g.add(seg);

    // Light blue stripe on the upper edge (the print's lighter band)
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(len * 0.9, 0.7 * scale, 2.25 * scale), light);
    stripe.position.set((x0+x1)/2, (y0+y1)/2 + 0.9 * scale, 0);
    stripe.rotation.z = ang;
    g.add(stripe);
  }

  // Foam: white tips at the crest and curl end (the "claws").
  // Place foam clusters along the top of the curl.
  for (let i = 4; i < N; i += 2) {
    const [x, y] = pts[i];
    const t = i / (N - 1);
    // Foam fingers: small white boxes pointing outward (up-right at the curl)
    const nFingers = 3;
    for (let f = 0; f < nFingers; f++) {
      const sz = (1.0 - f * 0.15) * scale;
      const finger = new THREE.Mesh(new THREE.BoxGeometry(sz, sz * 1.6, sz * 0.8), foam);
      const spread = (f - 1) * 0.5 * scale;
      finger.position.set(x + 0.5 * scale + t * 1.5 * scale, y + 1.3 * scale + spread * 0.5, 0);
      finger.rotation.z = -0.6 - t * 0.8 + (f - 1) * 0.3;
      g.add(finger);
    }
  }

  // Foam base: white along the bottom of the wave (where it meets the water)
  for (let i = 0; i < 6; i++) {
    const [x, y] = pts[i];
    const base = new THREE.Mesh(new THREE.BoxGeometry(2.2 * scale, 1.0 * scale, 2.3 * scale), foam);
    base.position.set(x, y - 1.2 * scale, 0);
    g.add(base);
  }

  return g;
}

function placeWave(x, y, z, scale, rotY, flipX) {
  const g = buildWave(scale);
  if (flipX) g.scale.x = -1;
  g.position.set(x, y, z);
  g.rotation.y = rotY;
  scene.add(g);
  waves.push(g);
  return g;
}

// THE GREAT WAVE: left side, rising and curling to the right (like the print)
placeWave(-24, 0, -4, 1.6, 0.12, false);
// Right-side wave: curls to the left (mirrored), lower
placeWave(24, -1, -2, 1.2, -0.1, true);
// Foreground wave: small, bottom-center
placeWave(0, -5, 12, 0.9, 0, false);

/* ================= BOATS (3, as in the print) ================= */
const boats = [];

function makeBoat() {
  const g = new THREE.Group();
  const L = 7, W = 1.5;
  const hullM = mat(C.hull), hullDkM = mat(C.hullDk);

  // Hull: elongated, pointed at both ends (use a stretched box + tapered ends)
  const hull = new THREE.Mesh(new THREE.BoxGeometry(L, 0.8, W), hullM);
  hull.position.y = 0.4;
  g.add(hull);

  // Pointed bow (right) and stern (left): rotated thin boxes
  const bow = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, W * 0.7), hullM);
  bow.position.set(L/2 + 0.6, 0.55, 0);
  bow.rotation.z = 0.4;
  g.add(bow);
  const stern = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, W * 0.7), hullM);
  stern.position.set(-L/2 - 0.5, 0.5, 0);
  stern.rotation.z = -0.35;
  g.add(stern);

  // Bottom shadow
  const under = new THREE.Mesh(new THREE.BoxGeometry(L, 0.25, W * 1.02), hullDkM);
  under.position.y = 0.05;
  g.add(under);

  // Deck
  const deck = new THREE.Mesh(new THREE.BoxGeometry(L * 0.8, 0.12, W * 0.65), mat(C.mat));
  deck.position.y = 0.85;
  g.add(deck);

  // Rowers: small dark figures along the deck
  const figM = mat(C.fig);
  for (let i = 0; i < 7; i++) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.4, 0.22), figM);
    f.position.set(-L/2 + 1 + i * (L - 2) / 6, 1.1, 0);
    g.add(f);
  }

  // Oars: thin boxes angled out the sides
  const oarM = mat(C.hullDk);
  for (let i = 0; i < 5; i++) {
    const o = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 1.4), oarM);
    o.position.set(-L/2 + 1.5 + i * 1.1, 0.6, W/2 + 0.4);
    o.rotation.x = 0.35;
    g.add(o);
    const o2 = o.clone();
    o2.position.z = -W/2 - 0.4;
    o2.rotation.x = -0.35;
    g.add(o2);
  }
  return g;
}

// Boat 1: under the great wave (left)
const b1 = makeBoat();
b1.position.set(-16, 1.2, -2);
b1.rotation.y = 0.45;
scene.add(b1); boats.push(b1);

// Boat 2: center-right, in front of Fuji
const b2 = makeBoat();
b2.position.set(10, -0.5, 2);
b2.rotation.y = -0.25;
scene.add(b2); boats.push(b2);

// Boat 3: foreground bottom-center
const b3 = makeBoat();
b3.position.set(0, -3.5, 10);
b3.rotation.y = 0.1;
scene.add(b3); boats.push(b3);

/* ================= CLOUDS (soft, upper right) ================= */
const clouds = [];
function makeCloud(x, y, z, s) {
  const g = new THREE.Group();
  const m = mat(0xe8e0cc, { transparent: true, opacity: 0.8 });
  for (let i = 0; i < 5; i++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry((2.5 - Math.abs(i-2)*0.5)*s, 1.1*s, 1.4*s), m);
    b.position.set((i-2)*1.3*s, Math.sin(i*1.7)*0.4*s, 0);
    g.add(b);
  }
  g.position.set(x, y, z);
  scene.add(g);
  clouds.push(g);
}
makeCloud(12, 15, -38, 1.4);
makeCloud(22, 12, -40, 1.0);
makeCloud(-2, 17, -42, 1.1);

/* ================= GENTLE MOTION ================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  waves.forEach((w, i) => {
    w.position.y += Math.sin(t * 0.5 + i * 1.3) * 0.003;
    w.rotation.z = Math.sin(t * 0.35 + i) * 0.015;
  });
  boats.forEach((b, i) => {
    b.rotation.z = Math.sin(t * 0.7 + i * 2.1) * 0.07;
    b.rotation.x = Math.cos(t * 0.55 + i * 1.7) * 0.04;
    b.position.y += Math.sin(t * 0.8 + i * 2.1) * 0.002;
  });
  clouds.forEach((c, i) => { c.position.x += Math.sin(t * 0.08 + i) * 0.0015; });
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
