<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Wave off Kanagawa - Low Poly Wallpaper</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #d8c9a3; }
  canvas { display: block; }
  #label {
    position: fixed; bottom: 12px; left: 14px; color: #1d3557;
    font-family: Georgia, serif; font-size: 13px; opacity: .55; pointer-events: none;
  }
</style>
</head>
<body>
<div id="label">The Great Wave off Kanagawa &middot; low-poly after Hokusai (public domain)</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ---- Palette sampled from the print ---- */
const COL = {
  paper: 0xd8c9a3,
  ink:   0x1d3557,
  mid:   0x2e5e8e,
  pale:  0x9db8cc,
  foam:  0xf2f0e4,
  hull:  0xd9a066,
  hullDk:0xb07a45,
  fuji:  0xf4f1e8,
  fujiSh:0xb9c4cc,
  cloud: 0xe9e0c4,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.paper);
scene.fog = new THREE.Fog(COL.paper, 60, 160);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 10, 85);
camera.lookAt(0, 6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const flat = (c, e={}) => new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...e });
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const sun = new THREE.DirectionalLight(0xfff4d6, 0.7);
sun.position.set(-8, 18, 20);
scene.add(sun);

/* =====================================================================
   MOUNTAIN FUJI  - center-right, snow-capped, small in distance
   ===================================================================== */
const fuji = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.ConeGeometry(7, 9, 7, 1), flat(0x3a4a5a));
  body.position.y = 4.5;
  fuji.add(body);
  // snow cap: a smaller white cone on top
  const cap = new THREE.Mesh(new THREE.ConeGeometry(4.5, 5.5, 7, 1), flat(COL.fuji));
  cap.position.y = 7.2;
  fuji.add(cap);
  // shadow slope
  const sh = new THREE.Mesh(new THREE.ConeGeometry(4.3, 5.2, 7, 1), flat(COL.fujiSh));
  sh.position.set(0.7, 7.0, 0.3);
  fuji.add(sh);
}
fuji.position.set(10, 0, -14);
scene.add(fuji);

/* =====================================================================
   THE GREAT WAVE  - left side, big curling crest with claw foam
   Built from a tilted cone (the wave face) + a torus curl + foam claws
   ===================================================================== */
const wave = new THREE.Group();
{
  // Wave face: a large cone leaning right, its wide base at bottom-left
  const face = new THREE.Mesh(new THREE.ConeGeometry(14, 16, 9, 1), flat(COL.ink));
  face.position.set(-14, 8, 0);
  face.rotation.z = 0.35; // lean right
  wave.add(face);

  // Curling lip: a partial torus forming the "tube" of the breaking wave
  const lip = new THREE.Mesh(new THREE.TorusGeometry(4.5, 2.0, 6, 10, Math.PI*1.4), flat(COL.ink));
  lip.position.set(-8, 15, 0);
  lip.rotation.z = -0.4;
  wave.add(lip);

  // Foam claws: white blobs along the crest edge
  const clawGeo = new THREE.SphereGeometry(0.8, 5, 4);
  const clawMat = flat(COL.foam);
  for (let i = 0; i < 12; i++) {
    const t = i/11;
    const a = Math.PI*1.4*(1-t) + 0.3;
    const r = 6.5;
    const c = new THREE.Mesh(clawGeo, clawMat);
    c.position.set(-8 + Math.cos(a)*r, 15 + Math.sin(a)*r, (Math.random()-0.5)*1.2);
    c.scale.setScalar(0.6 + Math.random()*0.7);
    wave.add(c);
  }

  // Foam spray dots on the wave face
  const dotGeo = new THREE.SphereGeometry(0.3, 4, 3);
  for (let i = 0; i < 30; i++) {
    const d = new THREE.Mesh(dotGeo, flat(COL.foam));
    const a = Math.random()*Math.PI;
    const r = 3 + Math.random()*7;
    d.position.set(-14 + Math.cos(a)*r*0.5, 4 + Math.sin(a)*r*0.6, (Math.random()-0.5)*5);
    d.scale.setScalar(0.5+Math.random());
    wave.add(d);
  }
}
scene.add(wave);

/* =====================================================================
   FOREGROUND SWELLS  - low mounds across the bottom
   ===================================================================== */
function swell(x, z, sx, sy, sz, color){
  const m = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 5, 0, Math.PI*2, 0, Math.PI/2), flat(color));
  m.scale.set(sx, sy, sz);
  m.position.set(x, 0, z);
  scene.add(m);
  // foam cap
  const c = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 4, 0, Math.PI*2, 0, Math.PI/2), flat(COL.foam));
  c.scale.set(sx, sy*0.7, sz);
  c.position.set(x, sy*0.5, z);
  scene.add(c);
}
swell(-24, 14, 6, 2, 4, COL.mid);
swell(2, 16, 5, 1.6, 3.5, COL.ink);
swell(20, 12, 4.5, 1.5, 3, COL.pale);
swell(32, 16, 4, 1.3, 3, COL.mid);

/* =====================================================================
   BOATS  - three fishing boats as in the print
   ===================================================================== */
const boats = [];
function buildBoat(){
  const g = new THREE.Group();
  const hullGeo = new THREE.BoxGeometry(5, 1.0, 1.6, 3, 1, 1);
  const hp = hullGeo.attributes.position;
  for (let i=0;i<hp.count;i++){
    const x = hp.getX(i);
    const taper = 1 - Math.abs(x)/5*0.5;
    hp.setZ(i, hp.getZ(i)*taper);
    if (hp.getY(i)>0) hp.setY(i, hp.getY(i)+Math.abs(hp.getZ(i))*0.25);
  }
  hullGeo.computeVertexNormals();
  g.add(new THREE.Mesh(hullGeo, flat(COL.hull)));
  const rim = new THREE.Mesh(new THREE.BoxGeometry(5.05,0.2,1.7), flat(COL.hullDk));
  rim.position.y = 0.5;
  g.add(rim);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.8,0.9,1.2), flat(COL.hullDk));
  cab.position.set(-0.4,1.2,0);
  g.add(cab);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.1,2.8,5), flat(0x5a4632));
  mast.position.set(1.3,1.9,0);
  g.add(mast);
  return g;
}
function placeBoat(x,y,z,ry,s=1){
  const b = buildBoat();
  b.position.set(x,y,z);
  b.rotation.y = ry;
  b.scale.setScalar(s);
  scene.add(b);
  boats.push(b);
}
// 1) left, under the great wave
placeBoat(-14, 7.5, 22, 0.5, 1.3);
// 2) center-right, in front of Fuji
placeBoat(10, 6.5, 24, -0.4, 1.3);
// 3) foreground center
placeBoat(0, 5.5, 28, 0.2, 1.4);

/* =====================================================================
   CLOUDS
   ===================================================================== */
const clouds = [];
function cloud(x,y,z,s){
  const g = new THREE.Group();
  const mat = flat(COL.cloud);
  for (let i=0;i<4;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(1.4,5,4), mat);
    m.position.set(i*1.3-1.8, (Math.random()-0.5)*0.5, 0);
    m.scale.set(1.2,0.6,0.7);
    g.add(m);
  }
  g.position.set(x,y,z);
  g.scale.setScalar(s);
  scene.add(g);
  clouds.push(g);
}
cloud(16, 17, -20, 2.0);
cloud(-4, 20, -24, 1.5);

/* =====================================================================
   GENTLE MOTION
   ===================================================================== */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  wave.rotation.z = Math.sin(t*0.5)*0.02;
  wave.position.y = Math.sin(t*0.7)*0.25;
  boats.forEach((b,i)=>{
    b.position.y += Math.sin(t*1.2+i*2)*0.003;
    b.rotation.z = Math.sin(t*0.9+i)*0.05;
    b.rotation.x = Math.cos(t*0.7+i*1.3)*0.03;
  });
  clouds.forEach(c=>{ c.position.x += 0.002; if(c.position.x>40) c.position.x=-40; });
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
