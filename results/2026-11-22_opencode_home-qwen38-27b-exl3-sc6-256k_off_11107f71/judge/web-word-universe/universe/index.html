<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo das Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --ink:#e8e4da; --dim:#8b8fa3; --line:#232838;
    --accent:#e0a458; --accent2:#7fb4c9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0;display:block}
  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:22px 26px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .brand h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:30px;margin:0;letter-spacing:.5px}
  .brand p{margin:2px 0 0;color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase}
  .search{pointer-events:auto;display:flex;flex-direction:column;gap:6px;min-width:280px;position:relative}
  .search input{background:rgba(15,19,30,.85);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);padding:11px 14px;font-size:15px;outline:none;backdrop-filter:blur(6px)}
  .search input:focus{border-color:var(--accent)}
  .search .hint{color:var(--dim);font-size:11px;text-align:right}
  .sug{position:absolute;top:46px;left:0;right:0;background:rgba(13,17,27,.97);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;display:none;z-index:5}
  .sug div{padding:9px 14px;font-size:14px;cursor:pointer}
  .sug div:hover,.sug div.act{background:rgba(224,164,88,.12);color:var(--accent)}
  .panel{pointer-events:auto;position:fixed;left:26px;bottom:26px;width:340px;max-height:56vh;
    background:rgba(13,17,27,.9);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);
    padding:18px 20px;overflow:auto;transition:opacity .3s,transform .3s}
  .panel.hidden{opacity:0;transform:translateY(12px);pointer-events:none}
  .panel h2{font-family:"Cormorant Garamond",serif;font-size:30px;margin:0 0 2px;font-weight:600}
  .panel .theme{color:var(--accent);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
  .panel h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}
  .panel ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .panel li{pointer-events:auto}
  .chip{display:inline-block;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
    font-size:13px;color:var(--ink);cursor:pointer;background:rgba(255,255,255,.02);transition:.15s}
  .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .count{color:var(--dim);font-size:12px;margin-top:14px}
  .stats{position:fixed;right:26px;bottom:26px;text-align:right;color:var(--dim);font-size:12px;line-height:1.7;pointer-events:none}
  .stats b{color:var(--ink);font-weight:600}
  .fallback{position:fixed;inset:0;display:none;place-items:center;color:var(--dim);font-size:14px;text-align:center;padding:40px}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <div class="top">
    <div class="brand">
      <h1>Universo das Palavras</h1>
      <p>Dicionário Criativo · constelação</p>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
      <div class="sug" id="sug"></div>
      <div class="hint">digite ou clique numa palavra</div>
    </div>
  </div>
</div>
<div class="panel hidden" id="panel">
  <h2 id="p-word"></h2>
  <div class="theme" id="p-theme"></div>
  <h3>Sinônimos</h3><ul id="p-syn"></ul>
  <h3>Palavras análogas</h3><ul id="p-ana"></ul>
  <div class="count" id="p-count"></div>
</div>
<div class="stats" id="stats"></div>
<div class="fallback" id="fallback">WebGL indisponível — palavras: <span id="fb"></span></div>

"trabalho"], ["serra", "vale"], ["serra", "árvore"], ["silêncio", "sussurro"], ["sinônimo", "sílaba"], ["sobrinho", "sotaque"], ["sogra", "tempo"], ["sogra", "tia"], ["sotaque", "vinho"], ["sotaque", "voz"], ["susto", "tempo"], ["tambor", "verso"], ["teatro", "tempo"], ["tempo", "tio"], ["tia", "tio"], ["trigo", "unha"], ["vinho", "água"]];
const MOST = "palavra";
const WORDS = Object.keys(DATA);
const N = WORDS.length;
const idx = new Map(WORDS.map((w,i)=>[w,i]));

const deg = new Array(N).fill(0);
for (const [a,b] of PAIRS){ deg[idx.get(a)]++; deg[idx.get(b)]++; }
const maxDeg = Math.max(...deg);

const adj = new Map(WORDS.map(w=>[w,new Set()]));
for (const [a,b] of PAIRS){ adj.get(a).add(b); adj.get(b).add(a); }

const themes = [...new Set(WORDS.map(w=>DATA[w].theme||""))].filter(Boolean).sort();
const themeColor = new Map();
themes.forEach((t,i)=>themeColor.set(t, new THREE.Color().setHSL((i*0.61803)%1, 0.55, 0.62)));
const defaultColor = new THREE.Color(0x9aa3b8);

// deterministic 3D positions: golden spiral sphere, hubs pulled inward
const positions = new Float32Array(N*3);
{
  const R = 60, ga = Math.PI*(3-Math.sqrt(5));
  for (let i=0;i<N;i++){
    const y = 1 - (i/(N-1))*2;
    const r = Math.sqrt(Math.max(0,1-y*y));
    const th = ga*i;
    const rad = R*(1 - 0.25*(deg[i]/maxDeg));
    positions[i*3]   = Math.cos(th)*r*rad;
    positions[i*3+1] = y*rad;
    positions[i*3+2] = Math.sin(th)*r*rad;
  }
}

const canvas = document.getElementById("scene");
let renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
}catch(e){
  document.getElementById("fallback").style.display="grid";
  document.getElementById("fb").textContent = WORDS.join(", ");
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.FogExp2(0x0b0e14, 0.0045);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,0,150);
function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}

const group = new THREE.Group();
scene.add(group);

const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
const colors = new Float32Array(N*3);
const baseColors = new Float32Array(N*3);
for (let i=0;i<N;i++){
  const c = themeColor.get(DATA[WORDS[i]].theme) || defaultColor;
  baseColors[i*3]=c.r; baseColors[i*3+1]=c.g; baseColors[i*3+2]=c.b;
}
colors.set(baseColors);
geo.setAttribute("color", new THREE.BufferAttribute(colors,3));
const sizes = new Float32Array(N);
for (let i=0;i<N;i++) sizes[i] = 1.2 + 2.6*(deg[i]/maxDeg);
geo.setAttribute("size", new THREE.BufferAttribute(sizes,1));

const mat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, vertexColors:true,
  uniforms:{ uScale:{value: innerHeight/2} },
  vertexShader:`
    attribute float size; varying vec3 vColor; uniform float uScale;
    void main(){ vColor=color; vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize=size*(uScale/-mv.z); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`
    varying vec3 vColor;
    void main(){ vec2 d=gl_PointCoord-0.5; float a=smoothstep(0.5,0.0,length(d));
      if(a<0.02) discard; gl_FragColor=vec4(vColor,a); }`
});
const points = new THREE.Points(geo, mat);
group.add(points);

const edgePos = new Float32Array(PAIRS.length*6);
PAIRS.forEach(([a,b],k)=>{
  const ia=idx.get(a), ib=idx.get(b);
  edgePos[k*6]=positions[ia*3]; edgePos[k*6+1]=positions[ia*3+1]; edgePos[k*6+2]=positions[ia*3+2];
  edgePos[k*6+3]=positions[ib*3]; edgePos[k*6+4]=positions[ib*3+1]; edgePos[k*6+5]=positions[ib*3+2];
});
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute("position", new THREE.BufferAttribute(edgePos,3));
const lines = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({color:0x2a3145, transparent:true, opacity:0.35}));
group.add(lines);

// labels
const labelSprites = [];
function makeLabel(word){
  const c=document.createElement("canvas"); const ctx=c.getContext("2d");
  const fs=46; ctx.font=`600 ${fs}px Inter, sans-serif`;
  const w=Math.ceil(ctx.measureText(word).width)+24; c.width=w; c.height=64;
  const ctx2=c.getContext("2d"); ctx2.font=`600 ${fs}px Inter, sans-serif`;
  ctx2.fillStyle="rgba(232,228,218,0.95)"; ctx2.textBaseline="middle"; ctx2.fillText(word,12,32);
  const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  const scale=0.02; s.scale.set(c.width*scale,c.height*scale,1); s.visible=false;
  return s;
}
for (let i=0;i<N;i++){
  const s=makeLabel(WORDS[i]);
  s.position.set(positions[i*3], positions[i*3+1]+sizes[i]*0.9+1.2, positions[i*3+2]);
  group.add(s); labelSprites.push(s);
}

let selected=null; const highlightSet=new Set();
function applyHighlight(){
  const col=geo.attributes.color.array;
  for (let i=0;i<N;i++){
    const w=WORDS[i]; let c;
    if(!selected) c=[baseColors[i*3],baseColors[i*3+1],baseColors[i*3+2]];
    else if(w===selected) c=[1,0.78,0.42];
    else if(highlightSet.has(w)) c=[0.55,0.8,0.95];
    else c=[baseColors[i*3]*0.18,baseColors[i*3+1]*0.18,baseColors[i*3+2]*0.18];
    col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
  }
  geo.attributes.color.needsUpdate=true;
  labelSprites.forEach((s,i)=>{ const w=WORDS[i]; s.visible=selected&&(w===selected||highlightSet.has(w)); });
}

const panel=document.getElementById("panel");
function chipList(el, list){
  el.innerHTML="";
  list.forEach(l=>{
    const li=document.createElement("li");
    const chip=document.createElement("span"); chip.className="chip"; chip.textContent=l;
    chip.onclick=()=>selectWord(l.toLowerCase());
    li.appendChild(chip); el.appendChild(li);
  });
}
function showPanel(word){
  const d=DATA[word];
  document.getElementById("p-word").textContent=d.display||word;
  document.getElementById("p-theme").textContent=d.theme?("Tema: "+d.theme):"";
  chipList(document.getElementById("p-syn"), d.syn||[]);
  chipList(document.getElementById("p-ana"), d.ana||[]);
  document.getElementById("p-count").textContent=((d.syn||[]).length+(d.ana||[]).length)+" relações";
  panel.classList.remove("hidden");
}
function hidePanel(){ panel.classList.add("hidden"); }

function selectWord(word){
  if(!idx.has(word)) return;
  selected=word; highlightSet.clear();
  (adj.get(word)||[]).forEach(x=>highlightSet.add(x));
  applyHighlight(); showPanel(word);
  history.replaceState(null,"","?word="+encodeURIComponent(word));
}
function clearSelection(){
  selected=null; highlightSet.clear(); applyHighlight(); hidePanel();
  history.replaceState(null,"",location.pathname);
}

document.getElementById("stats").innerHTML=
  `<b>${N}</b> palavras<br><b>${PAIRS.length}</b> relações<br>mais conectada: <b>${MOST}</b>`;

// interaction
const ray=new THREE.Raycaster(); ray.params.Points={threshold:3};
const mouse=new THREE.Vector2();
let dragging=false,lastX=0,lastY=0,moved=0,rotY=0,rotX=0,autoRot=true;
canvas.addEventListener("pointerdown",e=>{dragging=true;autoRot=false;lastX=e.clientX;lastY=e.clientY;moved=0;});
addEventListener("pointerup",()=>{dragging=false;});
canvas.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; moved+=Math.abs(dx)+Math.abs(dy);
  rotY+=dx*0.005; rotX+=dy*0.005; lastX=e.clientX;lastY=e.clientY;
});
canvas.addEventListener("click",e=>{
  if(moved>6) return;
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObject(points);
  if(hits.length) selectWord(WORDS[hits[0].index]); else clearSelection();
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  camera.position.z=Math.max(40,Math.min(300,camera.position.z+e.deltaY*0.1));
},{passive:false});

// search with suggestions
const q=document.getElementById("q"), sug=document.getElementById("sug");
let matches=[], act=-1;
function renderSug(){
  if(!matches.length){ sug.style.display="none"; return; }
  sug.innerHTML=""; act=-1;
  matches.slice(0,8).forEach(w=>{
    const div=document.createElement("div"); div.textContent=w;
    div.onmousedown=ev=>{ev.preventDefault(); selectWord(w); q.value=""; sug.style.display="none";};
    sug.appendChild(div);
  });
  sug.style.display="block";
}
q.addEventListener("input",()=>{
  const t=q.value.trim().toLowerCase();
  matches=t?WORDS.filter(w=>w.startsWith(t)):[];
  renderSug();
});
q.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const w=matches[0]||q.value.trim().toLowerCase();
    if(idx.has(w)){ selectWord(w); q.value=""; sug.style.display="none"; }
  }
  if(e.key==="Escape"){ q.value=""; matches=[]; sug.style.display="none"; clearSelection(); }
});
q.addEventListener("blur",()=>{ setTimeout(()=>sug.style.display="none",150); });

// deep link
const params=new URLSearchParams(location.search);
const w0=params.get("word");
if(w0 && idx.has(w0.toLowerCase())) selectWord(w0.toLowerCase());

// animate
function loop(){
  requestAnimationFrame(loop);
  if(autoRot) rotY+=0.0006;
  group.rotation.y=rotY; group.rotation.x=rotX;
  renderer.render(scene,camera);
}
resize(); addEventListener("resize",resize);
loop();
</script>
