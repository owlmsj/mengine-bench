<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e8e4dc;font-family:Inter,system-ui,sans-serif;overflow:hidden}
#canvas{position:fixed;inset:0}
#ui{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:16px 20px;z-index:10;pointer-events:none}
#ui>*{pointer-events:auto}
#title{font-family:'Playfair Display',serif;font-size:22px;color:#f0e8d8;text-shadow:0 0 20px rgba(200,160,80,.4)}
#search{background:rgba(20,18,30,.85);border:1px solid rgba(200,160,80,.3);border-radius:20px;padding:8px 16px;color:#e8e4dc;font-size:14px;width:220px;outline:none;backdrop-filter:blur(8px)}
#search:focus{border-color:rgba(200,160,80,.7)}
#info{position:fixed;bottom:20px;left:20px;right:20px;z-index:10;pointer-events:none}
#card{display:none;background:rgba(15,13,25,.92);border:1px solid rgba(200,160,80,.25);border-radius:12px;padding:18px 22px;backdrop-filter:blur(12px);max-width:420px;pointer-events:auto}
#card h2{font-family:'Playfair Display',serif;font-size:26px;color:#f0e8d8;margin-bottom:4px}
#card .tema{font-size:12px;color:rgba(200,160,80,.8);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
#card .rels{display:flex;flex-wrap:wrap;gap:6px}
#card .rel{background:rgba(200,160,80,.12);border:1px solid rgba(200,160,80,.3);border-radius:14px;padding:4px 12px;font-size:13px;color:#e8e4dc;cursor:pointer;transition:background .2s}
#card .rel:hover{background:rgba(200,160,80,.3)}
#stats{position:fixed;top:16px;right:20px;font-size:11px;color:rgba(200,160,80,.6);text-align:right;z-index:10}
</style>
</head>

<div id="stats"></div>
<div id="info"><div id="card"></div></div>

const words = Object.keys(DATA);
const wordSet = new Set(words);

// Build adjacency
const adj = {};
for (const w of words) {
  adj[w] = new Set();
  for (const link of DATA[w].links) {
    for (const t of words) {
      if (t.toLowerCase() === link.toLowerCase()) { adj[w].add(t); break; }
    }
  }
}

// Positions: simple force-directed layout (precomputed)
const N = words.length;
const idx = {};
words.forEach((w, i) => idx[w] = i);

// Initialize positions on a sphere
const pos = [];
for (let i = 0; i < N; i++) {
  const phi = Math.acos(1 - 2 * (i + 0.5) / N);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  const r = 40 + Math.random() * 20;
  pos.push(new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  ));
}

// Simple force-directed iterations
for (let iter = 0; iter < 80; iter++) {
  const forces = pos.map(() => new THREE.Vector3());
  // Repulsion
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const d = new THREE.Vector3().subVectors(pos[i], pos[j]);
      const dist = Math.max(d.length(), 0.5);
      const f = 200 / (dist * dist);
      d.normalize().multiplyScalar(f);
      forces[i].add(d);
      forces[j].sub(d);
    }
  }
  // Attraction along edges
  for (const w of words) {
    for (const r of adj[w]) {
      const i = idx[w], j = idx[r];
      if (i >= j) continue;
      const d = new THREE.Vector3().subVectors(pos[j], pos[i]);
      const dist = d.length();
      const f = (dist - 8) * 0.05;
      d.normalize().multiplyScalar(f);
      forces[i].add(d);
      forces[j].sub(d);
    }
  }
  // Center gravity
  for (let i = 0; i < N; i++) {
    forces[i].add(pos[i].clone().multiplyScalar(-0.005));
  }
  // Apply
  for (let i = 0; i < N; i++) {
    pos[i].add(forces[i].multiplyScalar(0.8));
  }
}

// Scene
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a12, 0.008);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 0, 90);

// Lights
scene.add(new THREE.AmbientLight(0x404040, 0.5));
const dirLight = new THREE.DirectionalLight(0xfff0d0, 1.2);
dirLight.position.set(20, 30, 40);
scene.add(dirLight);

// Stars background
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(2000 * 3);
for (let i = 0; i < 2000 * 3; i++) starPos[i] = (Math.random() - 0.5) * 400;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0x665544, size: 0.5, sizeAttenuation: true });
scene.add(new THREE.Points(starGeo, starMat));

// Node sizes by degree
const degree = {};
for (const w of words) degree[w] = adj[w].size;
const maxDeg = Math.max(...Object.values(degree));

// Create node meshes
const nodes = [];
const nodeGroup = new THREE.Group();
for (let i = 0; i < N; i++) {
  const w = words[i];
  const deg = degree[w];
  const size = 0.3 + (deg / maxDeg) * 0.8;
  const geo = new THREE.SphereGeometry(size, 12, 12);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.1 + 0.3 * (i / N), 0.5, 0.45),
    emissive: new THREE.Color().setHSL(0.1 + 0.3 * (i / N), 0.5, 0.15),
    roughness: 0.6,
    metalness: 0.3
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(pos[i]);
  mesh.userData.word = w;
  nodeGroup.add(mesh);
  nodes.push(mesh);
}
scene.add(nodeGroup);

// Create edges
const edgeMat = new THREE.LineBasicMaterial({ color: 0x886633, transparent: true, opacity: 0.15 });
const edgeGroup = new THREE.Group();
const edgeList = [];
for (const w of words) {
  for (const r of adj[w]) {
    if (idx[w] < idx[r]) {
      const geo = new THREE.BufferGeometry().setFromPoints([pos[idx[w]], pos[idx[r]]]);
      const line = new THREE.Line(geo, edgeMat.clone());
      edgeGroup.add(line);
      edgeList.push({ line, a: idx[w], b: idx[r] });
    }
  }
}
scene.add(edgeGroup);

// Labels (sprites)
function makeLabel(text, word) {
  const cvs = document.createElement('canvas');
  const ctx = cvs.getContext('2d');
  const font = '28px Inter, sans-serif';
  ctx.font = font;
  const tw = ctx.measureText(text).width;
  cvs.width = tw + 20;
  cvs.height = 40;
  ctx.font = font;
  ctx.fillStyle = '#e8e4dc';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, cvs.width / 2, cvs.height / 2);
  const tex = new THREE.CanvasTexture(cvs);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.7 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(cvs.width / 40, cvs.height / 40, 1);
  sprite.position.copy(pos[idx[word]]).add(new THREE.Vector3(0, 0.8, 0));
  return sprite;
}

// Raycasting
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;
let selected = null;
let labelSprite = null;

function clearHighlight() {
  for (const n of nodes) {
    n.material.emissiveIntensity = 1;
    n.material.opacity = 1;
    n.material.transparent = false;
  }
  for (const e of edgeList) {
    e.line.material.opacity = 0.15;
    e.line.material.color.set(0x886633);
  }
  if (labelSprite) { scene.remove(labelSprite); labelSprite = null; }
}

function highlight(word) {
  clearHighlight();
  const i = idx[word];
  const neighbors = adj[word];
  // Dim all
  for (const n of nodes) {
    n.material.transparent = true;
    n.material.opacity = 0.15;
  }
  // Brighten word + neighbors
  nodes[i].material.opacity = 1;
  nodes[i].material.emissiveIntensity = 2;
  for (const r of neighbors) {
    nodes[idx[r]].material.opacity = 1;
    nodes[idx[r]].material.emissiveIntensity = 1.5;
  }
  // Brighten edges to neighbors
  for (const e of edgeList) {
    if (e.a === i || e.b === i) {
      e.line.material.opacity = 0.8;
      e.line.material.color.set(0xffcc66);
    }
  }
  // Label
  labelSprite = makeLabel(word, word);
  scene.add(labelSprite);
}

function showCard(word) {
  const card = document.getElementById('card');
  const d = DATA[word];
  const rels = [...adj[word]];
  card.innerHTML = `<h2>${word}</h2><div class="tema">${d.tema || ''}</div><div class="rels">${
    rels.map(r => `<span class="rel" data-word="${r}">${r}</span>`).join('')
  }</div>`;
  card.style.display = 'block';
  card.querySelectorAll('.rel').forEach(el => {
    el.addEventListener('click', () => selectWord(el.dataset.word));
  });
}

function selectWord(word) {
  if (!wordSet.has(word)) return;
  selected = word;
  highlight(word);
  showCard(word);
  // Update URL
  history.replaceState(null, '', `?word=${encodeURIComponent(word)}`);
  // Camera fly to word
  const target = pos[idx[word]].clone();
  cameraTarget.copy(target);
}

// Camera controls
let cameraTarget = new THREE.Vector3(0, 0, 0);
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let rotY = 0, rotX = 0;
let autoRotate = true;

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  prevMouse = { x: e.clientX, y: e.clientY };
  autoRotate = false;
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', e => {
  if (isDragging) {
    rotY += (e.clientX - prevMouse.x) * 0.005;
    rotX += (e.clientY - prevMouse.y) * 0.005;
    rotX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotX));
    prevMouse = { x: e.clientX, y: e.clientY };
  }
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});
canvas.addEventListener('wheel', e => {
  camera.position.z = Math.max(20, Math.min(200, camera.position.z + e.deltaY * 0.1));
}, { passive: true });

canvas.addEventListener('click', e => {
  if (isDragging) return;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(nodes);
  if (hits.length > 0) {
    selectWord(hits[0].object.userData.word);
  }
});

// Search
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) return;
  const match = words.find(w => w.toLowerCase() === q);
  if (match) selectWord(match);
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim().toLowerCase();
    const match = words.find(w => w.toLowerCase().startsWith(q));
    if (match) selectWord(match);
  }
});

// Stats
const totalPairs = new Set();
for (const w of words) for (const r of adj[w]) totalPairs.add([w, r].sort().join('|'));
document.getElementById('stats').textContent =
  `${words.length} palavras · ${totalPairs.size} relações`;

// URL param
const params = new URLSearchParams(window.location.search);
const urlWord = params.get('word');
if (urlWord) {
  const match = words.find(w => w.toLowerCase() === urlWord.toLowerCase());
  if (match) setTimeout(() => selectWord(match), 100);
}

// Animate
function animate() {
  requestAnimationFrame(animate);
  if (autoRotate) {
    nodeGroup.rotation.y += 0.002;
    edgeGroup.rotation.y += 0.002;
  } else {
    nodeGroup.rotation.y += (rotY - nodeGroup.rotation.y) * 0.1;
    nodeGroup.rotation.x += (rotX - nodeGroup.rotation.x) * 0.1;
    edgeGroup.rotation.y = nodeGroup.rotation.y;
    edgeGroup.rotation.x = nodeGroup.rotation.x;
  }
  // Smooth camera
  camera.position.lerp(new THREE.Vector3(0, 0, 90), 0.02);
  camera.lookAt(cameraTarget);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
