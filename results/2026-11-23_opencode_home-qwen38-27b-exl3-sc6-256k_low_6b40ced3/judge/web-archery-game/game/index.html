<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arrow Pop - Balloon Archer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
"use strict";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener("resize", resize);
resize();

// ---------- Audio ----------
let actx = null;
function audio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); return actx; }
function env(g, t, a, d, peak){ g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); }
function noiseBuf(a, dur){ const n = Math.max(1, Math.floor(a.sampleRate*dur)); const b = a.createBuffer(1,n,a.sampleRate); const d = b.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1; return b; }
function sfxShoot(p){ const a = audio(); const t = a.currentTime;
  const o = a.createOscillator(); o.type="triangle";
  o.frequency.setValueAtTime(700+300*p, t);
  o.frequency.exponentialRampToValueAtTime(140, t+0.16);
  const g = a.createGain(); env(g,t,0.005,0.18,0.25);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.22);
  const n = a.createBufferSource(); n.buffer = noiseBuf(a,0.12);
  const f = a.createBiquadFilter(); f.type="bandpass"; f.frequency.value=2200; f.Q.value=1;
  const ng = a.createGain(); env(ng,t,0.002,0.1,0.18);
  n.connect(f).connect(ng).connect(a.destination); n.start(t); n.stop(t+0.14);
}
function sfxPop(size){ const a = audio(); const t = a.currentTime;
  const o = a.createOscillator(); o.type="sine";
  const base = 500 + size*140;
  o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base*0.4, t+0.09);
  const g = a.createGain(); env(g,t,0.002,0.12,0.4);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.15);
  const n = a.createBufferSource(); n.buffer = noiseBuf(a,0.05);
  const f = a.createBiquadFilter(); f.type="highpass"; f.frequency.value=1800;
  const ng = a.createGain(); env(ng,t,0.001,0.05,0.3);
  n.connect(f).connect(ng).connect(a.destination); n.start(t); n.stop(t+0.06);
}
function sfxMiss(){ const a = audio(); const t = a.currentTime;
  const o = a.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(90,t+0.15);
  const g = a.createGain(); env(g,t,0.005,0.18,0.15);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+0.2);
}
function sfxGameOver(){ const a = audio(); const t = a.currentTime;
  [392,330,262,196].forEach((f,i)=>{
    const o=a.createOscillator(); o.type="square"; o.frequency.value=f;
    const g=a.createGain(); env(g, t+i*0.18, 0.01, 0.22, 0.12);
    o.connect(g).connect(a.destination); o.start(t+i*0.18); o.stop(t+i*0.18+0.26);
  });
}
function sfxWin(){ const a = audio(); const t = a.currentTime;
  [523,659,784,1047].forEach((f,i)=>{
    const o=a.createOscillator(); o.type="square"; o.frequency.value=f;
    const g=a.createGain(); env(g, t+i*0.12, 0.01, 0.25, 0.12);
    o.connect(g).connect(a.destination); o.start(t+i*0.12); o.stop(t+i*0.12+0.3);
  });
}

// ---------- Input ----------
const mouse = {x: W/2, y: H/3, down: false};
canvas.addEventListener("mousemove", e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
canvas.addEventListener("mousedown", e => { mouse.down = true; onDown(); });
window.addEventListener("mouseup", e => { mouse.down = false; onUp(); });
canvas.addEventListener("touchstart", e => { e.preventDefault(); const t=e.touches[0]; const r=canvas.getBoundingClientRect(); mouse.x=t.clientX-r.left; mouse.y=t.clientY-r.top; mouse.down=true; onDown(); }, {passive:false});
canvas.addEventListener("touchmove", e => { e.preventDefault(); const t=e.touches[0]; const r=canvas.getBoundingClientRect(); mouse.x=t.clientX-r.left; mouse.y=t.clientY-r.top; }, {passive:false});
canvas.addEventListener("touchend", e => { e.preventDefault(); mouse.down=false; onUp(); }, {passive:false});

// ---------- Game state ----------
const MAX_ARROWS = 10;
const TARGET_SCORE = 100;
const BALLOON_COLORS = ["#ff4d6d","#ffd93d","#6bcb77","#4d96ff","#c77dff","#ff9e4d","#4dd0e1"];
let state = "menu"; // menu | play | over | win
let score = 0, arrowsLeft = MAX_ARROWS;
let balloons = [];
let arrows = [];
let particles = [];
let floaters = [];
let spawnTimer = 0;
let pull = 0;        // 0..1 while aiming
let pullDir = 1;     // +1 while mouse down (charging), -1 releasing
let shake = 0;
let time = 0;

function archerPos(){ return {x: W*0.12, y: H - 90}; }

function spawnBalloon(){
  const size = 26 + Math.random()*22;
  balloons.push({
    x: W*0.35 + Math.random()*W*0.6,
    y: -50,
    vy: 0,
    size,
    color: BALLOON_COLORS[(Math.random()*BALLOON_COLORS.length)|0],
    wobble: Math.random()*Math.PI*2,
    wobbleSpd: 1.5 + Math.random()*1.5,
    amp: 10 + Math.random()*14,
    baseX: 0,
    alive: true
  });
  balloons[balloons.length-1].baseX = balloons[balloons.length-1].x;
}

function reset(){
  score = 0; arrowsLeft = MAX_ARROWS;
  balloons = []; arrows = []; particles = []; floaters = [];
  spawnTimer = 0; pull = 0;
  for(let i=0;i<5;i++) spawnBalloon();
}

function onDown(){
  if(state === "menu"){ state = "play"; reset(); return; }
  if(state === "over" || state === "win"){ state = "play"; reset(); return; }
  if(state === "play"){
    if(arrowsLeft <= 0) return;
    // only allow charging if aiming roughly at the field (not clicking UI)
    pullDir = 1;
  }
}
function onUp(){
  if(state === "play" && pullDir === 1 && pull > 0.08){
    fireArrow(pull);
  }
  pullDir = -1; pull = 0;
}

function fireArrow(power){
  const a = archerPos();
  const ang = Math.atan2(mouse.y - a.y, mouse.x - a.x);
  const speed = 550 + power*1150;
  arrows.push({
    x: a.x, y: a.y,
    vx: Math.cos(ang)*speed,
    vy: Math.sin(ang)*speed,
    ang,
    power,
    trail: []
  });
  arrowsLeft--;
  shake = 4 + power*6;
  sfxShoot(power);
}

function burst(x,y,color,n,big){
  for(let i=0;i<n;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = (big?260:140) * (0.4+Math.random());
    particles.push({
      x, y,
      vx: Math.cos(ang)*sp,
      vy: Math.sin(ang)*sp - 60,
      life: 0.5+Math.random()*0.4,
      t: 0,
      size: 2+Math.random()*3,
      color
    });
  }
}

function popBalloon(b, i){
  balloons.splice(i,1);
  burst(b.x, b.y, b.color, 18, true);
  const pts = b.size < 34 ? 10 : b.size < 44 ? 5 : 2;
  score += pts;
  floaters.push({x:b.x, y:b.y, txt:"+"+pts, t:0, life:0.9, color:b.color});
  sfxPop(b.size);
  shake = Math.max(shake, 3);
  if(score >= TARGET_SCORE && state === "play"){
    state = "win";
    sfxWin();
  }
}

// ---------- Update ----------
function update(dt){
  time += dt;
  if(shake > 0) shake = Math.max(0, shake - dt*30);

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.t += dt;
    if(p.t >= p.life){ particles.splice(i,1); continue; }
    p.vy += 500*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  // floaters
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.t += dt; f.y -= 40*dt;
    if(f.t >= f.life) floaters.splice(i,1);
  }

  if(state !== "play") return;

  // charge
  if(pullDir === 1){
    pull = Math.min(1, pull + dt*1.6);
  }

  // spawn balloons
  spawnTimer -= dt;
  if(spawnTimer <= 0 && balloons.length < 12){
    spawnBalloon();
    spawnTimer = 0.9 + Math.random()*0.9;
  }

  // balloons fall
  for(let i=balloons.length-1;i>=0;i--){
    const b = balloons[i];
    b.vy = Math.min(b.vy + 30*dt, 90);
    b.y += b.vy*dt;
    b.wobble += b.wobbleSpd*dt;
    b.x = b.baseX + Math.sin(b.wobble)*b.amp;
    if(b.y - b.size > H + 20){
      balloons.splice(i,1);
      if(arrowsLeft <= 0 && arrows.length === 0 && balloons.length === 0 && state === "play"){
        state = "over"; sfxGameOver();
      }
    }
  }

  // arrows
  for(let i=arrows.length-1;i>=0;i--){
    const ar = arrows[i];
    ar.trail.push({x:ar.x,y:ar.y});
    if(ar.trail.length > 8) ar.trail.shift();
    ar.vy += 320*dt; // slight gravity for arc
    ar.x += ar.vx*dt; ar.y += ar.vy*dt;
    ar.ang = Math.atan2(ar.vy, ar.vx);
    // hit test
    let hit = false;
    for(let j=balloons.length-1;j>=0;j--){
      const b = balloons[j];
      const dx = ar.x-b.x, dy = ar.y-b.y;
      if(dx*dx+dy*dy < (b.size+4)*(b.size+4)){
        popBalloon(b,j);
        hit = true;
        break;
      }
    }
    if(hit || ar.x < -60 || ar.x > W+60 || ar.y > H+60 || ar.y < -200){
      if(!hit) sfxMiss();
      arrows.splice(i,1);
    }
  }

  // lose check: no arrows left, none in flight, and a balloon escaped (handled above)
  // also lose if arrows run out while balloons remain on screen? No - classic: you lose when you run out of arrows AND all remaining balloons escape.
}

// ---------- Draw ----------
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#7ec8ff");
  g.addColorStop(0.6,"#bfe3ff");
  g.addColorStop(1,"#e8f6ff");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
  // sun
  ctx.fillStyle = "rgba(255,240,150,0.9)";
  ctx.beginPath(); ctx.arc(W*0.85, H*0.14, 46, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "rgba(255,240,150,0.25)";
  ctx.beginPath(); ctx.arc(W*0.85, H*0.14, 70, 0, Math.PI*2); ctx.fill();
  // clouds
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  const t = time*0.02;
  for(let i=0;i<4;i++){
    const cx = ((i*0.27 + t*0.5 + i*0.1) % 1.2 - 0.1) * W;
    const cy = H*(0.12 + 0.07*(i%3));
    drawCloud(cx, cy, 30+ (i%2)*14);
  }
  // hills
  ctx.fillStyle = "#8fd07a";
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.quadraticCurveTo(W*0.25, H-140, W*0.5, H-40);
  ctx.quadraticCurveTo(W*0.75, H-160, W, H-30);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#79c263";
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.quadraticCurveTo(W*0.35, H-70, W*0.7, H-15);
  ctx.quadraticCurveTo(W*0.85, H-40, W, H-10);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
}
function drawCloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,s*0.6,0,Math.PI*2);
  ctx.arc(x+s*0.7,y-s*0.25,s*0.5,0,Math.PI*2);
  ctx.arc(x+s*1.3,y,s*0.55,0,Math.PI*2);
  ctx.arc(x+s*0.6,y+s*0.2,s*0.5,0,Math.PI*2);
  ctx.fill();
}
function drawBalloon(b){
  // string
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y+b.size);
  ctx.quadraticCurveTo(b.x+4, b.y+b.size+14, b.x-2, b.y+b.size+26);
  ctx.stroke();
  // body
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.ellipse(b.x, b.y, b.size*0.85, b.size, 0, 0, Math.PI*2);
  ctx.fill();
  // knot
  ctx.beginPath();
  ctx.moveTo(b.x-5, b.y+b.size);
  ctx.lineTo(b.x+5, b.y+b.size);
  ctx.lineTo(b.x, b.y+b.size+7);
  ctx.closePath(); ctx.fill();
  // shine
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.beginPath();
  ctx.ellipse(b.x-b.size*0.3, b.y-b.size*0.35, b.size*0.22, b.size*0.32, -0.5, 0, Math.PI*2);
  ctx.fill();
}
function drawArcher(){
  const a = archerPos();
  const ang = Math.atan2(mouse.y - a.y, mouse.x - a.x);
  ctx.save();
  ctx.translate(a.x, a.y);
  // body
  ctx.fillStyle = "#5a3e2b";
  ctx.fillRect(-8, -30, 16, 30); // torso
  ctx.fillStyle = "#e0b088";
  ctx.beginPath(); ctx.arc(0, -40, 10, 0, Math.PI*2); ctx.fill(); // head
  // bow arm toward mouse
  ctx.save();
  ctx.rotate(ang);
  const draw = 10 + pull*26;
  // bow limb
  ctx.strokeStyle = "#7a4a21";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(draw, -28);
  ctx.quadraticCurveTo(draw+18, 0, draw, 28);
  ctx.stroke();
  // string
  ctx.strokeStyle = "#ddd";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(draw, -28);
  ctx.lineTo(draw - 14 - pull*10, 0);
  ctx.lineTo(draw, 28);
  ctx.stroke();
  // arrow nocked
  if(state === "play" && arrowsLeft > 0){
    ctx.strokeStyle = "#3a2a1a";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(draw - 14 - pull*10, 0);
    ctx.lineTo(draw + 30, 0);
    ctx.stroke();
    // tip
    ctx.fillStyle = "#ccc";
    ctx.beginPath();
    ctx.moveTo(draw+30,0); ctx.lineTo(draw+22,-4); ctx.lineTo(draw+22,4); ctx.closePath(); ctx.fill();
    // fletching
    ctx.fillStyle = "#ff5555";
    ctx.beginPath();
    ctx.moveTo(draw-14-pull*10,0); ctx.lineTo(draw-20-pull*10,-5); ctx.lineTo(draw-18-pull*10,0); ctx.lineTo(draw-20-pull*10,5); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
  // power bar
  if(state === "play"){
    const bw = 70, bh = 10;
    const bx = a.x - bw/2, by = a.y - 70;
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(bx-2, by-2, bw+4, bh+4);
    ctx.fillStyle = "#222";
    ctx.fillRect(bx, by, bw, bh);
    const g = ctx.createLinearGradient(bx,0,bx+bw,0);
    g.addColorStop(0,"#4dd24d"); g.addColorStop(0.6,"#ffd24d"); g.addColorStop(1,"#ff4d4d");
    ctx.fillStyle = g;
    ctx.fillRect(bx, by, bw*pull, bh);
  }
}
function drawArrow(ar){
  // trail
  for(let i=0;i<ar.trail.length;i++){
    const t = ar.trail[i];
    const al = (i/ar.trail.length)*0.35;
    ctx.fillStyle = `rgba(255,255,255,${al})`;
    ctx.beginPath(); ctx.arc(t.x,t.y, 2.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.save();
  ctx.translate(ar.x, ar.y);
  ctx.rotate(ar.ang);
  ctx.strokeStyle = "#3a2a1a";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(14,0); ctx.stroke();
  ctx.fillStyle = "#ccc";
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(5,-4); ctx.lineTo(5,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ff5555";
  ctx.beginPath(); ctx.moveTo(-18,0); ctx.lineTo(-25,-5); ctx.lineTo(-22,0); ctx.lineTo(-25,5); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawParticles(){
  for(const p of particles){
    const al = 1 - p.t/p.life;
    ctx.globalAlpha = al;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function drawFloaters(){
  ctx.textAlign = "center";
  ctx.font = "16px 'Press Start 2P', monospace";
  for(const f of floaters){
    const al = 1 - f.t/f.life;
    ctx.globalAlpha = al;
    ctx.fillStyle = "#fff";
    ctx.fillText(f.txt, f.x+2, f.y+2);
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}
function drawHUD(){
  ctx.textAlign = "left";
  ctx.font = "18px 'Press Start 2P', monospace";
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(14, 14, 300, 74);
  ctx.fillStyle = "#fff";
  ctx.fillText("SCORE " + score, 26, 40);
  // arrows as pips
  ctx.fillStyle = "#ffd24d";
  for(let i=0;i<arrowsLeft;i++){
    ctx.fillRect(26 + i*18, 56, 10, 14);
  }
  ctx.textAlign = "right";
  ctx.fillStyle = "#fff";
  ctx.font = "12px 'Press Start 2P', monospace";
  ctx.fillText("TARGET " + TARGET_SCORE, W-20, 34);
}
function drawCenter(title, sub, color){
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, H*0.3, W, H*0.4);
  ctx.textAlign = "center";
  ctx.fillStyle = color;
  ctx.font = "34px 'Press Start 2P', monospace";
  ctx.fillText(title, W/2, H*0.42);
  ctx.fillStyle = "#fff";
  ctx.font = "14px 'Press Start 2P', monospace";
  ctx.fillText(sub, W/2, H*0.52);
  ctx.fillStyle = "rgba(255,255,255," + (0.6 + 0.4*Math.sin(time*4)) + ")";
  ctx.font = "12px 'Press Start 2P', monospace";
  ctx.fillText("CLICK TO START", W/2, H*0.6);
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  update(dt);

  ctx.save();
  if(shake > 0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  drawSky();
  for(const b of balloons) drawBalloon(b);
  for(const ar of arrows) drawArrow(ar);
  drawArcher();
  drawParticles();
  drawFloaters();
  ctx.restore();

  if(state === "play") drawHUD();
  if(state === "menu") drawCenter("ARROW POP", "Pop balloons before you run out of arrows!", "#ffd24d");
  if(state === "over") drawCenter("GAME OVER", "Score: " + score + "  -  Arrows left: " + arrowsLeft, "#ff5555");
  if(state === "win") drawCenter("YOU WIN!", "Score: " + score + "  -  Arrows left: " + arrowsLeft, "#4dd24d");

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
