<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Great Wave | A moving woodblock</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e8ddbd;color:#173e55}canvas{display:block;width:100%;height:100%}#caption{position:absolute;left:4%;top:6%;border:1px solid #284a5b;padding:7px;pointer-events:none}#caption div{border:1px solid #284a5b;padding:13px 8px;writing-mode:vertical-rl;font:22px Georgia,serif;letter-spacing:5px}footer{position:absolute;bottom:23px;left:4%;right:4%;display:flex;align-items:end;justify-content:space-between;pointer-events:none;color:#f2edd5;text-shadow:0 1px 3px #15374a;font:10px Georgia,serif;letter-spacing:2px;text-transform:uppercase}footer span{display:block;margin-top:7px;font-size:9px;letter-spacing:1px}button{pointer-events:auto;color:inherit;background:#eee4cbd9;border:1px solid #254d6260;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:15px}button:focus-visible{outline:2px solid #173e55;outline-offset:4px}#error{position:absolute;inset:40% 15%;text-align:center;font:18px Georgia;display:none} @media(max-width:600px){#caption div{font-size:16px;padding:8px 4px}footer{bottom:16px}}
</style></head><body>
<div id="caption" aria-label="Thirty-six views of Mount Fuji, The Great Wave off Kanagawa"><div>冨嶽三十六景<br>神奈川沖浪裏</div></div>
<footer><div>Under the wave<span>After Hokusai · A study in low poly</span></div><button id="motion" aria-label="Pause animation" title="Pause animation">Ⅱ</button></footer><div id="error" role="alert"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#e9ddbd');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);renderer.domElement.setAttribute('aria-label','Low-poly Great Wave with three fishing boats and Mount Fuji');
const camera=new THREE.OrthographicCamera(-12,12,8,-8,.1,100);camera.position.set(0,0,35);camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xfff6df,0x476c85,2.1));const sun=new THREE.DirectionalLight(0xfff0cf,2.2);sun.position.set(-8,12,18);scene.add(sun);
let seed=174;function random(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const palette=['#123d59','#164b67','#1c5973','#276c86','#438598','#a9c4bd'];
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true,side:THREE.DoubleSide});const ivory=mat('#f3eed4'),wood=mat('#c49b68'),woodLight=mat('#e3bd83'),ink=mat('#183e55');
function meshTriangle(a,b,c,color,parent=scene){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([...a,...b,...c],3));g.computeVertexNormals();const m=new THREE.Mesh(g,mat(color));parent.add(m);return m}
function tube(points,radius,material,parent=scene){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));const m=new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(5,points.length*3),radius,5,false),material);parent.add(m);return m}
function pebble(x,y,z,r,material=ivory,parent=scene){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),material);m.position.set(x,y,z);m.rotation.set(random()*3,random()*3,random()*3);m.scale.set(1,.7,.7);parent.add(m);return m}
// Layered geometry keeps the composition readable from the fixed print viewpoint.
const backdrop=new THREE.Group();scene.add(backdrop);

// Fuji is small and distant, beneath the hollow of the breaking wave.
const fuji=new THREE.Group();fuji.name='Mount Fuji';scene.add(fuji);
meshTriangle([1.3,-3.2,-3],[3.65,-.95,-3],[6.15,-3.2,-3],'#54717a',fuji);
meshTriangle([3.65,-.95,-2.95],[3.9,-3.2,-2.95],[6.15,-3.2,-2.95],'#294c63',fuji);
const snow=[[2.5,-2.1],[3.65,-.95],[4.75,-2.12],[4.3,-1.94],[4.35,-2.32],[3.98,-2.02],[3.8,-2.5],[3.54,-1.95],[3.2,-2.35],[3.12,-2.04]];const shape=new THREE.Shape(snow.map(p=>new THREE.Vector2(...p)));const cap=new THREE.Mesh(new THREE.ShapeGeometry(shape),ivory);cap.position.z=-2.8;fuji.add(cap);
function ribbon(outer,inner,depth,parent,colors=palette){const a=new THREE.CatmullRomCurve3(outer.map(p=>new THREE.Vector3(...p))),b=new THREE.CatmullRomCurve3(inner.map(p=>new THREE.Vector3(...p)));const rows=42,cols=7,vertices=[];
for(let i=0;i<=rows;i++){const u=i/rows,A=a.getPoint(u),B=b.getPoint(u);for(let j=0;j<=cols;j++){const v=j/cols;const p=A.clone().lerp(B,v);p.z+=Math.sin(v*Math.PI)*depth+(i&&i<rows&&j&&j<cols?(random()-.5)*.24:0);vertices.push(p)}}
const positions=[],colorsOut=[];for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const k=i*(cols+1)+j;for(const tri of [[k,k+1,k+cols+1],[k+1,k+cols+2,k+cols+1]]){const color=new THREE.Color(colors[Math.min(colors.length-1,Math.floor(j/cols*(colors.length-1)+(random()>.72?1:0)))]);for(const n of tri){positions.push(...vertices[n].toArray());colorsOut.push(color.r,color.g,color.b)}}}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setAttribute('color',new THREE.Float32BufferAttribute(colorsOut,3));g.computeVertexNormals();const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,side:THREE.DoubleSide}));parent.add(m);return a;}
const ocean=new THREE.Group();scene.add(ocean);
ribbon([[-15,-3,-2],[-7,-4,-2],[0,-3.5,-2],[7,-3,-2],[15,1.2,-2]],[[-15,-9,-2],[-7,-9,-2],[0,-9,-2],[7,-9,-2],[15,-9,-2]],.9,ocean);
const breaker=new THREE.Group();breaker.name='Great curling wave';scene.add(breaker);
const crest=ribbon([[-14,-3,0],[-11,1,0],[-8,4.8,0],[-5.1,6.2,0],[-2.7,6,0],[-.6,4.7,0],[1.5,2.7,0]],[[-9,-7,.8],[-6,-4,.8],[-4,-1,.8],[-4.4,2.4,.8],[-3,3.9,.8],[-1,3.8,.6],[1.5,2.7,0]],1.7,breaker,['#a9c8c4','#246b87','#154c6e','#103851','#164969']);
// Narrow raised flow lines follow the same curl, catching light like carved ridges.
for(let k=0;k<11;k++){const s=k*.18;tube([[-11+s,-6,1.25],[-7.5+s,-2.2,1.7],[-6.6+s,1.9,1.8],[-4.8+s,4.8,1.4],[-2.9+s,5.05,1.15]],.027+(k%3)*.012,k%3===0?ivory:mat('#5294a5'),breaker)}
const foam=new THREE.Group();breaker.add(foam);
for(let i=25;i<95;i++){const p=crest.getPoint(i/100);for(let j=0;j<5;j++)pebble(p.x+(random()-.5)*.55,p.y-.1-random()*.36,p.z+.45+random()*.3,.10+random()*.16,ivory,foam);}
for(let i=5;i<91;i++){const t=i/100,p=crest.getPoint(t);for(let j=0;j<3;j++)pebble(p.x+(random()-.5)*.45,p.y+(random()-.5)*.32,p.z+.3+random()*.3,.09+random()*.16,ivory,foam);
if(i%3===0){const reach=.25+random()*.55;const x=p.x,y=p.y,z=p.z+.45;tube([[x,y,z],[x+.26,y+.18,z+.12],[x+reach,y-.12,z+.2],[x+reach+.12,y-.5,z+.15],[x+reach-.06,y-.58,z+.1]],.045+random()*.045,ivory,foam);}}
// The hanging foam fingers are sculpted, not image decals.
for(let i=0;i<17;i++){const x=-3.5+i*.27,y=5.1-i*.10+Math.sin(i*1.5)*.25;tube([[x,y,.8],[x+.35,y-.12,1],[x+.48,y-.5,1.1],[x+.28,y-.73,1.2],[x+.2,y-.59,1.2]],.07,ivory,foam);}
const droplets=[];for(let i=0;i<130;i++){const x=-7+random()*10,y=-3+random()*8;if(x>-2&&y>3.8)continue;const m=pebble(x,y,1+random(),.025+random()*.05);droplets.push({m,y,phase:random()*6})}
function boat(x,y,z,length,angle){const group=new THREE.Group();group.name='Fishing boat';group.position.set(x,y,z);group.rotation.z=angle;scene.add(group);const n=16,verts=[],indices=[];
for(let i=0;i<=n;i++){const u=i/n,xx=(u-.5)*length,up=Math.pow(Math.abs(u-.5)*2,3)*.7,w=Math.sin(u*Math.PI)*.36;verts.push(xx,up, w,xx,up,-w,xx,up-.36*Math.sin(u*Math.PI),0);if(i<n){const a=i*3;indices.push(a,a+3,a+2,a+3,a+5,a+2,a+1,a+2,a+4,a+4,a+2,a+5)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));g.setIndex(indices);g.computeVertexNormals();group.add(new THREE.Mesh(g,wood));
for(const side of [-1,1]){const pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([(u-.5)*length,Math.pow(Math.abs(u-.5)*2,3)*.7,side*Math.sin(u*Math.PI)*.36])}tube(pts,.045,woodLight,group)}
for(let i=2;i<15;i++){const u=i/16,xx=(u-.5)*length,yy=Math.pow(Math.abs(u-.5)*2,3)*.7;tube([[xx,yy,-.3],[xx,yy,.3]],.035,woodLight,group)}
for(let i=0;i<8;i++){const xx=-length*.23+i*length*.065,yy=.11+Math.pow(Math.abs(xx/length)*2,3)*.7;const body=pebble(xx,yy,.22,.16,ink,group);body.scale.set(1.5,.75,1);pebble(xx+.07,yy+.16,.27,.095,woodLight,group);tube([[xx-.12,yy,.3],[xx+.1,yy-.07,.45]],.037,ivory,group)}
return {group,y,angle};}
const boats=[boat(-8,-2.9,2.6,5.8,-.48),boat(6,-2.65,-.4,7,.33),boat(3.2,-5.65,3.4,8.1,-.12)];
const swells=[];
function swell(points,bottom,z,scale=1){const group=new THREE.Group();scene.add(group);const upper=points.map(([x,y])=>[x,y,z]);const lower=points.map(([x,y])=>[x,y-bottom,z]);const edge=ribbon(upper,lower,.8,group,['#ecedd6','#9fc4c0','#367e96','#154b6b','#103950']);
for(let i=0;i<85;i++){const p=edge.getPoint(i/84);if(i%2===0)pebble(p.x,p.y+.03,p.z+.15,.07+random()*.08,ivory,group);if(i%7===0)tube([[p.x,p.y,p.z+.2],[p.x-.13,p.y+.28*scale,p.z+.3],[p.x+.08,p.y+.44*scale,p.z+.3],[p.x+.24,p.y+.27*scale,p.z+.3]],.055,ivory,group)}swells.push(group);return group;}
swell([[-15,-6],[-11,-4.8],[-7,-4.5],[-4,-2.5],[-1,-5],[3,-6.8],[9,-6.2],[15,-3.7]],3.5,4,.7);
swell([[1,-4.3],[5,-4.1],[8,-3.4],[11,-1.2],[15,2]],2,-.1,.8);
swell([[-15,-7],[-11,-5.8],[-8,-5.2],[-5,-7.1],[-1,-8]],3,5,1.4);
swell([[5,-8.4],[8,-7],[11,-5.1],[15,-4]],3,5,.6);
// Distant horizontal ink strokes tie the open water to the woodblock palette.
for(let i=0;i<15;i++){const y=-3.6-i*.21;tube([[0,y,-1.2],[3,y-.1,-1.2],[7,y+.25,-1.2],[12,y+.8,-1.2]],.018,mat('#80a9af'),ocean)}
let running=!matchMedia('(prefers-reduced-motion: reduce)').matches;const button=document.querySelector('#motion');function updateButton(){button.textContent=running?'Ⅱ':'▷';button.setAttribute('aria-label',running?'Pause animation':'Play animation');button.title=running?'Pause animation':'Play animation'}updateButton();button.onclick=()=>{running=!running;updateButton()};
let time=0,previous=performance.now();function frame(now){const dt=Math.min((now-previous)/1000,.05);previous=now;if(running)time+=dt;breaker.rotation.z=Math.sin(time*.24)*.003;for(let i=0;i<boats.length;i++){const b=boats[i];b.group.position.y=b.y+Math.sin(time*.65+i)*.055;b.group.rotation.z=b.angle+Math.sin(time*.5+i)*.007}swells.forEach((g,i)=>g.position.y=Math.sin(time*.4+i)*.035);droplets.forEach(d=>{d.m.position.y=d.y+Math.sin(time*.5+d.phase)*.06});renderer.render(scene,camera);requestAnimationFrame(frame)}
function resize(){const aspect=innerWidth/innerHeight;const h=aspect<1.45?24/aspect:16.5;camera.left=-h*aspect/2;camera.right=h*aspect/2;camera.top=h/2;camera.bottom=-h/2;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();requestAnimationFrame(frame);
window.__sceneEvidence={boats:boats.length,mountain:fuji.name,meshCount:0};scene.traverse(o=>{if(o.isMesh)window.__sceneEvidence.meshCount++});
</script></body></html>
