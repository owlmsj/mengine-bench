<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chureito at Dusk — Low Poly Fuji</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#241d47; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #title {
    position:fixed; left:34px; bottom:30px; color:#f6e8d8; pointer-events:none;
    font-family:"Zen Old Mincho", serif; font-weight:700;
    text-shadow:0 2px 18px rgba(20,10,40,.55);
    opacity:.92;
  }
  #title .jp { font-size:34px; letter-spacing:.14em; }
  #title .en { font-size:12px; letter-spacing:.42em; margin-top:6px; opacity:.75; text-transform:uppercase; }
  #vignette {
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 55%, rgba(10,5,25,.42) 100%);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="vignette"></div>
<div id="title"><div class="jp">忠霊塔 · 黄昏</div><div class="en">Mount Fuji &amp; Chureito Pagoda</div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ------------------------------------------------------------------ *
 * Composition assumptions (brief leaves these open):
 *  - Classic postcard view: pagoda lower-left foreground, Fuji center-
 *    right across a still lake, low sun just right of the summit.
 *  - "Gentle motion": slow camera drift, swaying blossoms, falling
 *    petals, drifting clouds, softly pulsing sun glow. Loop-friendly.
 *  - Everything procedural: geometry + canvas-made textures only.
 * ------------------------------------------------------------------ */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const HORIZON = 0xa5717f;
scene.fog = new THREE.FogExp2(HORIZON, 0.0092);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 400);
const CAM_BASE = new THREE.Vector3(-0.6, 3.3, 13.5);
const LOOK_BASE = new THREE.Vector3(1.1, 4.6, -18);

const SUN_POS = new THREE.Vector3(16, 3.6, -62);

/* ------------------------------ sky ------------------------------- */
{
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { sunDir: { value: SUN_POS.clone().normalize() } },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 sunDir;
      void main() {
        float y = clamp(vDir.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 low  = vec3(0.949, 0.612, 0.416);   // amber horizon
        vec3 mid  = vec3(0.604, 0.357, 0.494);   // dusty rose
        vec3 high = vec3(0.318, 0.216, 0.439);   // violet
        vec3 top  = vec3(0.102, 0.078, 0.235);   // dusk indigo
        vec3 col = mix(low, mid, smoothstep(0.40, 0.55, y));
        col = mix(col, high, smoothstep(0.55, 0.72, y));
        col = mix(col, top,  smoothstep(0.72, 0.95, y));
        float s = max(dot(normalize(vDir), sunDir), 0.0);
        col += vec3(1.0, 0.62, 0.30) * (pow(s, 14.0) * 0.85 + pow(s, 3.0) * 0.16);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(180, 24, 16), mat));
}

/* ---------------------------- lighting ----------------------------- */
scene.add(new THREE.HemisphereLight(0xa894c8, 0x3a3550, 1.35));
scene.add(new THREE.AmbientLight(0x8f6f9a, 0.55));
const sun = new THREE.DirectionalLight(0xffb27a, 2.6);
sun.position.copy(SUN_POS);
scene.add(sun);
const rim = new THREE.DirectionalLight(0xbfa8d8, 0.9);
rim.position.set(-18, 10, 22);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffc9a3, 0.8);
fill.position.set(4, 6, 16);
scene.add(fill);

/* ------------------------- shared helpers -------------------------- */
function jitter(geo, amt) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++)
    p.setXYZ(i, p.getX(i) + (Math.random() - .5) * amt,
                p.getY(i) + (Math.random() - .5) * amt,
                p.getZ(i) + (Math.random() - .5) * amt);
  p.needsUpdate = true;
}
function paintByHeight(geo, stops) { // stops: sorted [yThreshold, color]
  const g = geo.toNonIndexed();
  const p = g.attributes.position;
  const colors = [];
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i) + (Math.random() - .5) * 0.7;
    let c = stops[0][1];
    for (const [t, col] of stops) if (y >= t) c = col;
    colors.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.computeVertexNormals();
  return g;
}
const C = (hex) => new THREE.Color(hex);

/* ----------------------------- ground ------------------------------ */
{
  let g = new THREE.PlaneGeometry(150, 150, 26, 26);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const inLake = Math.abs(x) < 25 && z > -26 && z < -11;
    p.setY(i, inLake ? 0.0 : (Math.random() - .5) * 0.5);
  }
  g = paintByHeight(g, [[-9, C(0x35402f)], [0.4, C(0x46465e)]]);
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, roughness: 1 })));
}

/* ------------------------------ lake ------------------------------- */
{
  let g = new THREE.PlaneGeometry(46, 13, 22, 7);
  jitter(g, 0.06);
  g.rotateX(-Math.PI / 2);
  g.computeVertexNormals();
  const lake = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: 0x3a3f66, flatShading: true, roughness: 0.14, metalness: 0.55 }));
  lake.position.set(0, 0.1, -18.5);
  scene.add(lake);
}

/* ---------------------------- Mount Fuji --------------------------- */
{
  const geo = new THREE.ConeGeometry(18, 14, 11, 6);
  jitter(geo, 0.45);
  geo.translate(0, 7, 0);
  const g = paintByHeight(geo, [
    [-1, C(0x3b4064)], [4.5, C(0x4a5178)], [8.0, C(0xe4ddf0)], [9.8, C(0xfaf6fd)]
  ]);
  const fuji = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors: true, flatShading: true, roughness: 0.95 }));
  fuji.position.set(11, 0, -42);
  scene.add(fuji);
  // distant ridges for depth
  const ridgeMat = new THREE.MeshStandardMaterial({ color: 0x4a4166, flatShading: true, roughness: 1 });
  for (const [x, h, r] of [[-26, 5.5, 20], [34, 6.5, 24], [-2, 4.2, 30]]) {
    const c = new THREE.ConeGeometry(r, h, 9, 1);
    jitter(c, 0.5); c.translate(0, h / 2 - 0.2, 0);
    const m = new THREE.Mesh(c, ridgeMat);
    m.position.set(x, 0, -58 + Math.random() * 6);
    scene.add(m);
  }
}

/* ---------------------------- sun glow ----------------------------- */
const glow = new THREE.Sprite(new THREE.SpriteMaterial({
  map: (() => {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(128, 128, 4, 128, 128, 128);
    gr.addColorStop(0, 'rgba(255,236,200,1)');
    gr.addColorStop(0.25, 'rgba(255,180,110,0.85)');
    gr.addColorStop(1, 'rgba(255,140,80,0)');
    x.fillStyle = gr; x.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  })(),
  blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, fog: false }));
glow.position.copy(SUN_POS);
glow.scale.setScalar(17);
scene.add(glow);

/* ------------------------- Chureito pagoda -------------------------- */
{
  const pagoda = new THREE.Group();
  const red  = new THREE.MeshStandardMaterial({ color: 0xa63f2b, flatShading: true, roughness: 0.8 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2b3446, flatShading: true, roughness: 0.85 });
  const gold = new THREE.MeshStandardMaterial({ color: 0xd9a441, flatShading: true, roughness: 0.5, metalness: 0.5 });
  const stone = new THREE.MeshStandardMaterial({ color: 0x6b6470, flatShading: true, roughness: 1 });

  const s1 = new THREE.Mesh(new THREE.BoxGeometry(3.9, 0.25, 3.9), stone); s1.position.y = 0.13; pagoda.add(s1);
  const s2 = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.35, 3.4), stone); s2.position.y = 0.42; pagoda.add(s2);

  let b = 0.6;
  for (let i = 0; i < 5; i++) {
    const w = 2.3 - i * 0.31, h = 1.12 - i * 0.14;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), red);
    body.position.y = b + h / 2; pagoda.add(body);
    const band = new THREE.Mesh(new THREE.BoxGeometry(w + 0.08, 0.09, w + 0.08), gold);
    band.position.y = b + 0.06; pagoda.add(band);
    // windows on the three camera-facing sides
    const rh = h * 0.5;
    for (const face of [0, Math.PI / 2, Math.PI]) {
      for (const off of [-0.3, 0, 0.3]) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(w * 0.15, h * 0.48, 0.04), dark);
        const a = face;
        win.position.set(Math.sin(a) * (w / 2 + 0.01) + Math.cos(a) * w * off,
                         b + h * 0.52,
                         Math.cos(a) * (w / 2 + 0.01) - Math.sin(a) * w * off);
        win.rotation.y = a;
        pagoda.add(win);
      }
    }
    const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 0.97, rh, 4, 1), dark);
    roof.rotation.y = Math.PI / 4;
    roof.position.y = b + h + rh / 2 - 0.03;
    pagoda.add(roof);
    b += h + rh * 0.82;
  }
  const finial = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.1, 6), gold);
  finial.position.y = b + 0.45; pagoda.add(finial);
  for (let k = 0; k < 3; k++) {
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.15 - k * 0.03, 0.15 - k * 0.03, 0.04, 8), gold);
    disc.position.y = b + 0.2 + k * 0.16; pagoda.add(disc);
  }
  pagoda.position.set(-5.4, 0, -5);
  pagoda.rotation.y = 0.42;
  scene.add(pagoda);
}

/* --------------------------- cherry trees --------------------------- */
const canopies = [];
function cherryTree(x, z, s, seed) {
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x59422f, flatShading: true, roughness: 1 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1 * s, 0.19 * s, 1.7 * s, 5), trunkMat);
  trunk.position.y = 0.85 * s;
  trunk.rotation.z = (seed - 0.5) * 0.12;
  g.add(trunk);
  const pinks = [0xf9cddf, 0xf6b4d0, 0xfde2ee, 0xf3c0da];
  for (let i = 0; i < 4; i++) {
    const geo = new THREE.IcosahedronGeometry(0.62 * s * (0.75 + Math.random() * 0.5), 0);
    jitter(geo, 0.1 * s);
    geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: pinks[(i + Math.floor(seed * 4)) % 4], flatShading: true, roughness: 0.9 }));
    m.position.set((Math.random() - .5) * 1.3 * s, (1.9 + Math.random() * 0.9) * s, (Math.random() - .5) * 1.2 * s);
    m.userData.phase = Math.random() * Math.PI * 2;
    canopies.push(m);
    g.add(m);
  }
  g.position.set(x, 0, z);
  g.rotation.y = seed * Math.PI * 2;
  scene.add(g);
  return g;
}
cherryTree(-9.2, -0.6, 1.45, 0.1);
cherryTree(-3.0, -6.6, 1.15, 0.5);
cherryTree(-8.0, -8.8, 1.0,  0.8);
cherryTree(3.6, 2.4, 1.7,   0.3);
cherryTree(7.6, -3.4, 1.15, 0.65);

/* ------------------------------ petals ------------------------------ */
const P_N = 260;
const petals = (() => {
  const pos = new Float32Array(P_N * 3);
  const data = [];
  for (let i = 0; i < P_N; i++) {
    const p = {
      x: (Math.random() - .5) * 26, z: (Math.random() - .5) * 26 - 2,
      y: Math.random() * 12, sp: 0.25 + Math.random() * 0.4, ph: Math.random() * Math.PI * 2,
      sw: 0.5 + Math.random() * 0.8
    };
    data.push(p);
    pos[i * 3] = p.x; pos[i * 3 + 1] = p.y; pos[i * 3 + 2] = p.z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const tex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 32;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(16, 16, 1, 16, 16, 15);
    gr.addColorStop(0, 'rgba(255,224,238,1)');
    gr.addColorStop(1, 'rgba(255,190,215,0)');
    x.fillStyle = gr; x.beginPath(); x.arc(16, 16, 15, 0, 7); x.fill();
    return new THREE.CanvasTexture(c);
  })();
  const mat = new THREE.PointsMaterial({
    size: 0.13, map: tex, color: 0xffc8de, transparent: true,
    opacity: 0.9, depthWrite: false });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return { pts, data };
})();

/* ----------------------------- clouds ------------------------------- */
const clouds = [];
{
  const mat = new THREE.MeshStandardMaterial({
    color: 0xf2c8d6, flatShading: true, roughness: 1, transparent: true, opacity: 0.8 });
  for (let c = 0; c < 4; c++) {
    const grp = new THREE.Group();
    for (let i = 0; i < 3 + Math.floor(Math.random() * 3); i++) {
      const m = new THREE.Mesh(new THREE.IcosahedronGeometry(2.4 + Math.random() * 2, 0), mat);
      m.scale.set(1.6, 0.4, 0.9);
      m.position.set((Math.random() - .5) * 7, (Math.random() - .5) * 0.8, (Math.random() - .5) * 3);
      grp.add(m);
    }
    grp.position.set((Math.random() - .5) * 130, 20 + Math.random() * 10, -70 - Math.random() * 30);
    grp.userData.speed = 0.5 + Math.random() * 0.6;
    clouds.push(grp); scene.add(grp);
  }
}

/* ----------------------------- animate ------------------------------ */
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // gentle camera drift
  camera.position.set(
    CAM_BASE.x + Math.sin(t * 0.10) * 0.5,
    CAM_BASE.y + Math.sin(t * 0.13 + 1.0) * 0.16,
    CAM_BASE.z + Math.cos(t * 0.08) * 0.35);
  camera.lookAt(LOOK_BASE.x + Math.sin(t * 0.07) * 0.25, LOOK_BASE.y, LOOK_BASE.z);

  // swaying blossoms
  for (const m of canopies) {
    m.rotation.z = Math.sin(t * 0.9 + m.userData.phase) * 0.05;
    m.rotation.x = Math.cos(t * 0.7 + m.userData.phase) * 0.04;
  }

  // falling petals
  const arr = petals.pts.geometry.attributes.position;
  for (let i = 0; i < P_N; i++) {
    const p = petals.data[i];
    p.y -= p.sp * dt * 2.2;
    if (p.y < 0.05) { p.y = 12; p.x = (Math.random() - .5) * 26; p.z = (Math.random() - .5) * 26 - 2; }
    arr.setXYZ(i,
      p.x + Math.sin(t * p.sw + p.ph) * 0.9,
      p.y,
      p.z + Math.cos(t * p.sw * 0.8 + p.ph) * 0.7);
  }
  arr.needsUpdate = true;

  // drifting clouds + pulsing sun glow
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 90) c.position.x = -90;
  }
  glow.scale.setScalar(17 * (1 + Math.sin(t * 0.35) * 0.04));

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
