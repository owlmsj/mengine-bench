const n = D.names.length;

const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

// ---------- three.js scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x07080f);

const camera = new THREE.PerspectiveCamera(55, 1, .1, 2000);

const P = new Float32Array(n*3), C = new Float32Array(n*3), SZ = new Float32Array(n), HI = new Float32Array(n);
const tv = new THREE.Vector3();
for (let i=0;i<n;i++){
  P.set(D.pos[i], i*3);
  tv.set(accentOf(i)); tv.multiplyScalar(D.deg[i]>=14?1:0.85); C.set([tv.r,tv.g,tv.b], i*3);
  SZ[i] = 7 + D.deg[i]*1.35; HI[i] = 1;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(P,3));

const mat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{uPr:{value:Math.min(devicePixelRatio,2)}},
  vertexShader:`attribute vec3 aCol; attribute float aSize, aHi; varying vec3 vC; varying float vH;

  fragmentShader:`varying vec3 vC; varying float vH;
    void main(){ vec2 u=gl_PointCoord-.5; float d=length(u); if(d>.5)discard;

    gl_FragColor=vec4(vC+core*.7, a*(vH>.9?1:.22)); }`
});
scene.add(new THREE.Points(geo, mat));

// edges
const EC = new Float32Array(D.edges.length*3);

const egeo = new THREE.BufferGeometry();
egeo.setAttribute('position', new THREE.BufferAttribute(P,3));
egeo.setAttribute('color', new THREE.BufferAttribute(EC,3));
scene.add(new THREE.LineSegments(egeo, em));

// starfield dust
const dustG = new THREE.BufferGeometry();
const dp = new Float32Array(900*3);
let s=7; const rr=()=> (s=(s*16807)%2147483647)/2147483647;
for(let i=0;i<900;i++){dp[i*3]=(rr()-.5)*700;dp[i*3+1]=(rr()-.5)*700;dp[i*3+2]=(rr()-.5)*700;}
dustG.setAttribute('position', new THREE.BufferAttribute(dp,3));
scene.add(new THREE.Points(dustG, new THREE.PointsMaterial({color:0x3a4060,size:1.1,transparent:true,opacity:.55})));

// ---------- interaction ----------
let sel=-1, focusTheme=-1;
const cam = {yaw:.4, pitch:.25, dist:170, tx:0,ty:0,tz:0};
let dirty=true;
function applyState(){
  for(let i=0;i<n;i++){
    let h=1;
    if(focusTheme>=0) h = D.tema[i]===D.themes[focusTheme] ? 1.25 : .18;
    if(sel>=0){
      const nb = D.ties[sel];
      if(i===sel) h=1.6; else if(nb.includes(i)) h=Math.max(h,1); else h=Math.min(h,.13);
    }
    HI[i]=h;
  }
  geo.attributes.aHi.needsUpdate=true;
  for(let e=0;e<D.edges.length/2;e++){
    const a=D.edges[2*e], b=D.edges[2*e+1];
    let c=.10, col=[.5,.55,.75];
    if(focusTheme>=0 && (D.tema[a]===D.themes[focusTheme]&&D.tema[b]===D.themes[focusTheme])) c=.34;
    if(sel>=0 && (a===sel||b===sel)){ c=.85; const o=a===sel?b:a; col=new THREE.Vector3().set(accentOf(o)).toArray(); }
    else if(sel>=0) c=.028;
    const k=e*6; EC[k]=EC[k+3]=col[0]*c; EC[k+1]=EC[k+4]=col[1]*c; EC[k+2]=EC[k+5]=col[2]*c;
  }
  egeo.attributes.color.needsUpdate=true;
  renderPanel(); refreshLabels(); dirty=true;
}
function select(i, push=true){
  sel = i;
  if(i>=0){ cam.tx=D.pos[i][0]; cam.ty=D.pos[i][1]; cam.tz=D.pos[i][2]; cam.dist=52; }
  else { cam.tx=cam.ty=cam.tz=0; cam.dist=170; }
  if(push){ const u=new URL(location); i>=0?u.searchParams.set('word',D.names[i]):u.searchParams.delete('word'); history.replaceState(null,'',u); }
  applyState();
}
const el = id=>document.getElementById(id);
const panel=el('panel'), pbody=el('pbody');
function renderPanel(){
  if(sel<0){ panel.classList.remove('open'); return; }
  const w=sel, N=D.names;
  const others = D.ties[w].filter(t=>!D.sin[w].includes(t)&&!D.ana[w].includes(t));
  const tags=(arr,cls)=>arr.map(t=>`<button class="tag ${cls}" data-i="${t}">${N[t]}</button>`).join('');
  pbody.innerHTML=`<h2>${N[w]}</h2>
    <div class="tema"><i style="background:${accentOf(w)}"></i>${D.tema[w]}</div>
    <div class="n"><b>${D.ties[w].length}</b> vínculos neste universo</div>
    ${D.sin[w].length?`<h3>Sinônimos</h3><div class="tags">${tags(D.sin[w],'syn')}</div>`:''}
    ${D.ana[w].length?`<h3>Palavras análogas</h3><div class="tags">${tags(D.ana[w],'ana')}</div>`:''}
    ${others.length?`<h3>Também se ligam a ${N[w]}</h3><div class="tags">${tags(others,'')}</div>`:''}`;
  panel.classList.add('open');
}
pbody.addEventListener('click',e=>{const b=e.target.closest('[data-i]'); if(b) select(+b.dataset.i);});
panel.querySelector('.close').onclick=()=>select(-1);
addEventListener('keydown',e=>{if(e.key==='Escape')select(-1);});

// legend
D.themes.forEach((t,i)=>{
  const c=document.createElement('div'); c.className='chip'; c.innerHTML=`<i style="background:${PAL[i]}"></i>${t}`;
  c.onclick=()=>{focusTheme=focusTheme===i?-1:i; [...el('legend').children].forEach((x,j)=>x.classList.toggle('on',j===focusTheme)); applyState();};
  el('legend').appendChild(c);
});

// search
const q=el('q');
D.names.forEach(w=>{const o=document.createElement('option');o.value=w;el('dl').appendChild(o);});
q.addEventListener('change',()=>{const i=find(q.value); if(i!==undefined)select(i);});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const i=find(q.value); if(i!==undefined){select(i);q.blur();}}});

// labels (fixed pool, reused)
const hud=el('hud'), pool=[];
for(let k=0;k<40;k++){const d=document.createElement('div');d.className='lbl';d.style.display='none';
  d.onclick=()=>{if(d._i!==undefined)select(d._i);}; hud.appendChild(d); pool.push(d);}
let active=[];
function refreshLabels(){
  for(const d of pool){d.style.display='none';d._i=undefined;}
  active=[];
  const use=i=>{const d=pool[active.length]; if(!d)return null; d._i=i; d.textContent=D.names[i]; active.push(d); return d;};
  if(sel>=0){ const d=use(sel); if(d){d.style.color=accentOf(sel); d._i=undefined;}
    for(const t of D.ties[sel]){const x=use(t); if(x)x.classList.add('nbr');} }
  else D.names.forEach((w,i)=>{ if(D.deg[i]>=14){const d=use(i); if(d)d.classList.add('nbr');} });
}
function placeLabels(){
  for(const d of active){ const i=pool.indexOf(d);
    tv.set(P[i*3],P[i*3+1],P[i*3+2]).project(camera);
    if(tv.z>1){d.style.display='none';continue;}
    d.style.display=''; d.style.left=(tv.x*.5+.5)*innerWidth+'px'; d.style.top=(-tv.y*.5+.5)*innerHeight-10+'px';
  }
}

// orbit controls
const cv=renderer.domElement; let drag=null, moved=0;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];moved=0;cv.classList.add('drag');});
addEventListener('pointermove',e=>{ if(!drag)return;
  cam.yaw-=(e.clientX-drag[0])*.005; cam.pitch=Math.max(-1.45,Math.min(1.45,cam.pitch+(e.clientY-drag[1])*.005));
  moved+=Math.abs(e.clientX-drag[0])+Math.abs(e.clientY-drag[1]); drag=[e.clientX,e.clientY]; dirty=true;});
addEventListener('pointerup',e=>{cv.classList.remove('drag'); if(drag&&moved<4)pick(e); drag=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist=Math.max(24,Math.min(320,cam.dist*(1+e.deltaY*.001)));dirty=true;},{passive:false});
const rc=new THREE.Raycaster(); rc.params.Points.threshold=2.4;
function pick(e){
  rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);
  const h=rc.intersectObject(scene.children.find(o=>o.isPoints&&o.geometry===geo));
  select(h.length?h[0].index:-1);
}

// animate
let tYaw=0;
function frame(){
  requestAnimationFrame(frame);
  if(!drag&&sel<0){cam.yaw+=0.0006;dirty=true;}
  camera.position.set( Math.sin(cam.yaw)*Math.cos(cam.pitch), Math.sin(cam.pitch), Math.cos(cam.yaw)*Math.cos(cam.pitch) ).multiplyScalar(cam.dist).add(new THREE.Vector3(cam.tx,cam.ty,cam.tz));
  camera.lookAt(cam.tx,cam.ty,cam.tz);
  placeLabels();
  renderer.render(scene,camera);
}
function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

// boot: ?word=
const want=new URLSearchParams(location.search).get('word');
if(want!==null){ const i=find(want||'saudade'); if(i!==undefined) select(i,false); }
applyState(); frame();
</script>
