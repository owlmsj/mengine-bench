<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop '95</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  body { display:flex; align-items:center; justify-content:center; }
  #wrap { position:relative; }
  canvas { display:block; image-rendering:pixelated; cursor:crosshair; }
  .font-pixel { font-family:'Press Start 2P', monospace; }
  .font-term { font-family:'VT323', monospace; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
'use strict';

// ---------- constants ----------
const W = 960, H = 540;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// scale canvas to fit window, keep aspect
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

// ---------- audio (WebAudio, no assets) ----------
let AC = null;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, type, vol, slideTo) {
  try {
    const ac = audio();
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, ac.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function noiseBurst(dur, vol) {
  try {
    const ac = audio();
    const len = ac.sampleRate * dur;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol || 0.2, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    src.connect(g); g.connect(ac.destination);
    src.start();
  } catch(e) {}
}
const sfx = {
  draw: () => beep(180, 0.08, 'sawtooth', 0.05, 320),
  shoot: () => { beep(700, 0.12, 'square', 0.12, 180); noiseBurst(0.06, 0.08); },
  pop: () => { beep(900, 0.09, 'square', 0.18, 2200); noiseBurst(0.05, 0.15); },
  miss: () => beep(140, 0.25, 'triangle', 0.1, 60),
  win: () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.14), i*110)); },
  lose: () => { [392,330,262,196].forEach((f,i)=>setTimeout(()=>beep(f,0.22,'triangle',0.14), i*150)); },
  click: () => beep(600, 0.06, 'square', 0.1),
};

// ---------- state ----------
const S = {
  mode: 'title',   // title | playing | won | lost
  score: 0,
  lives: 3,
  balloons: [],
  arrows: [],
  parts: [],       // particles
  floaters: [],    // floating score text
  pull: 0,         // 0..1 bow draw
  pulling: false,
  mouse: { x: W/2, y: H/2 },
  spawnTimer: 0,
  time: 0,
  targetScore: 15,
  shake: 0,
};

const ARCHER = { x: 120, y: H - 70 };

// ---------- balloons ----------
const COLORS = ['#e74c3c','#3498db','#f1c40f','#2ecc71','#e67e22','#9b59b6','#1abc9c','#fd79a8'];
function spawnBalloon() {
  const r = 22 + Math.random()*14;
  const speed = 22 + Math.random()*30 + S.score * 1.2;
  S.balloons.push({
    x: W + r,
    y: 60 + Math.random() * (H - 180),
    r,
    vx: -speed,
    vy: 0,
    wob: Math.random() * Math.PI * 2,
    wobSpeed: 1.5 + Math.random()*2,
    color: COLORS[(Math.random()*COLORS.length)|0],
    alive: true,
  });
}

// ---------- arrows ----------
function shootArrow() {
  const dx = S.mouse.x - ARCHER.x;
  const dy = S.mouse.y - (ARCHER.y - 40);
  const ang = Math.atan2(dy, dx);
  const power = 380 + S.pull * 620;
  S.arrows.push({
    x: ARCHER.x, y: ARCHER.y - 40,
    vx: Math.cos(ang) * power,
    vy: Math.sin(ang) * power,
    ang,
    trail: [],
    alive: true,
  });
  sfx.shoot();
  S.pull = 0;
  S.pulling = false;
  S.shake = 4;
}

// ---------- particles ----------
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 220;
    S.parts.push({
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 60,
      life: 0.5 + Math.random()*0.4,
      maxLife: 0.9,
      size: 2 + Math.random()*4,
      color,
    });
  }
}
function floater(x, y, text, color) {
  S.floaters.push({ x, y, text, color, life: 0.9 });
}

// ---------- input ----------
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  S.mouse.x = (e.clientX - rect.left) * (W / rect.width);
  S.mouse.y = (e.clientY - rect.top) * (H / rect.height);
});
canvas.addEventListener('mousedown', e => {
  audio();
  if (S.mode === 'title' || S.mode === 'won' || S.mode === 'lost') {
    sfx.click();
    startGame();
    return;
  }
  if (S.mode === 'playing') {
    S.pulling = true;
  }
});
window.addEventListener('mouseup', e => {
  if (S.mode === 'playing' && S.pulling) {
    shootArrow();
  }
  S.pulling = false;
});
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    if (S.mode !== 'playing') { sfx.click(); startGame(); }
  }
});

function startGame() {
  S.mode = 'playing';
  S.score = 0;
  S.lives = 3;
  S.balloons = [];
  S.arrows = [];
  S.parts = [];
  S.floaters = [];
  S.pull = 0;
  S.pulling = false;
  S.spawnTimer = 0;
  S.time = 0;
  S.shake = 0;
  for (let i = 0; i < 4; i++) spawnBalloon();
}

// ---------- update ----------
function update(dt) {
  S.time += dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 20);

  if (S.mode !== 'playing') return;

  // pull power
  if (S.pulling) {
    S.pull = Math.min(1, S.pull + dt * 1.4);
  }

  // spawn balloons
  S.spawnTimer -= dt;
  if (S.spawnTimer <= 0) {
    spawnBalloon();
    S.spawnTimer = Math.max(0.5, 1.6 - S.score * 0.04);
  }

  // balloons
  for (const b of S.balloons) {
    b.x += b.vx * dt;
    b.wob += b.wobSpeed * dt;
    b.y += Math.sin(b.wob) * 18 * dt;
    if (b.x + b.r < -20) {
      b.alive = false;
      S.lives--;
      sfx.miss();
      S.shake = 6;
      floater(80, b.y, '-1 LIFE', '#ff5555');
      if (S.lives <= 0) {
        S.mode = 'lost';
        sfx.lose();
      }
    }
  }
  S.balloons = S.balloons.filter(b => b.alive);

  // arrows
  for (const a of S.arrows) {
    a.trail.push({x:a.x, y:a.y});
    if (a.trail.length > 8) a.trail.shift();
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.vy += 120 * dt; // slight gravity
    a.ang = Math.atan2(a.vy, a.vx);

    // hit balloons
    for (const b of S.balloons) {
      if (!b.alive) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      if (dx*dx + dy*dy < (b.r + 6) * (b.r + 6)) {
        b.alive = false;
        a.alive = false;
        const pts = b.r > 30 ? 1 : 2;
        S.score += pts;
        sfx.pop();
        burst(b.x, b.y, b.color, 26);
        burst(b.x, b.y, '#ffffff', 8);
        floater(b.x, b.y, '+' + pts, '#ffffff');
        S.shake = 5;
        if (S.score >= S.targetScore) {
          S.mode = 'won';
          sfx.win();
        }
        break;
      }
    }
    if (a.x > W + 40 || a.x < -40 || a.y > H + 40 || a.y < -40) a.alive = false;
  }
  S.arrows = S.arrows.filter(a => a.alive);
  S.balloons = S.balloons.filter(b => b.alive);

  // particles
  for (const p of S.parts) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.life -= dt;
  }
  S.parts = S.parts.filter(p => p.life > 0);

  // floaters
  for (const f of S.floaters) {
    f.y -= 40 * dt;
    f.life -= dt;
  }
  S.floaters = S.floaters.filter(f => f.life > 0);
}

// ---------- draw ----------
function drawBackground() {
  // sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a90d9');
  g.addColorStop(0.6, '#87ceeb');
  g.addColorStop(1, '#c8e6ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // sun
  ctx.fillStyle = '#fff59d';
  ctx.beginPath(); ctx.arc(W - 90, 80, 38, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'rgba(255,245,157,0.35)';
  ctx.beginPath(); ctx.arc(W - 90, 80, 52, 0, Math.PI*2); ctx.fill();

  // clouds (parallax drift)
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const t = S.time;
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 280 + t * 12) % (W + 200)) - 100;
    const cy = 60 + i * 45;
    cloud(cx, cy, 1 + i * 0.15);
  }

  // hills
  ctx.fillStyle = '#5cb85c';
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, H - 90);
  ctx.quadraticCurveTo(W*0.25, H - 160, W*0.5, H - 90);
  ctx.quadraticCurveTo(W*0.75, H - 150, W, H - 80);
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // ground
  ctx.fillStyle = '#4a9d4a';
  ctx.fillRect(0, H - 60, W, 60);
  // grass tufts
  ctx.strokeStyle = '#3d8b3d';
  ctx.lineWidth = 2;
  for (let x = 10; x < W; x += 26) {
    ctx.beginPath();
    ctx.moveTo(x, H - 60);
    ctx.lineTo(x - 4, H - 72);
    ctx.moveTo(x, H - 60);
    ctx.lineTo(x + 4, H - 74);
    ctx.stroke();
  }
}
function cloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 22*s, 0, Math.PI*2);
  ctx.arc(x + 24*s, y - 8*s, 18*s, 0, Math.PI*2);
  ctx.arc(x + 48*s, y, 20*s, 0, Math.PI*2);
  ctx.arc(x + 24*s, y + 8*s, 16*s, 0, Math.PI*2);
  ctx.fill();
}

function drawArcher() {
  const ax = ARCHER.x, ay = ARCHER.y;
  const aimAng = Math.atan2(S.mouse.y - (ay - 40), S.mouse.x - ax);
  const pull = S.pulling ? S.pull : 0;

  ctx.save();
  ctx.translate(ax, ay);

  // body
  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(-8, -30, 16, 34); // torso
  // head
  ctx.fillStyle = '#f5cba7';
  ctx.beginPath(); ctx.arc(0, -40, 11, 0, Math.PI*2); ctx.fill();
  // hair
  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath(); ctx.arc(0, -44, 11, Math.PI, 0); ctx.fill();
  // legs
  ctx.fillStyle = '#4a4a6a';
  ctx.fillRect(-8, 4, 7, 22);
  ctx.fillRect(1, 4, 7, 22);

  // bow (rotated toward mouse)
  ctx.save();
  ctx.translate(0, -40);
  ctx.rotate(aimAng);
  // bow arc
  ctx.strokeStyle = '#6b3e1f';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(0, 0, 26, -Math.PI/2.4, Math.PI/2.4);
  ctx.stroke();
  // bowstring
  const nockX = -pull * 18;
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(Math.cos(-Math.PI/2.4)*26, Math.sin(-Math.PI/2.4)*26);
  ctx.lineTo(nockX, 0);
  ctx.lineTo(Math.cos(Math.PI/2.4)*26, Math.sin(Math.PI/2.4)*26);
  ctx.stroke();
  // arrow on string
  if (S.pulling) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(nockX, 0);
    ctx.lineTo(nockX + 34, 0);
    ctx.stroke();
    // arrowhead
    ctx.fillStyle = '#999';
    ctx.beginPath();
    ctx.moveTo(nockX + 34, 0);
    ctx.lineTo(nockX + 27, -4);
    ctx.lineTo(nockX + 27, 4);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // power bar
  if (S.pulling) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(-20, -70, 40, 8);
    const pw = 36 * S.pull;
    ctx.fillStyle = S.pull > 0.8 ? '#ff4444' : (S.pull > 0.5 ? '#ffaa00' : '#44dd44');
    ctx.fillRect(-18, -68, pw, 4);
  }
  ctx.restore();
}

function drawBalloon(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  // string
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, b.r);
  ctx.quadraticCurveTo(4, b.r + 14, 0, b.r + 26);
  ctx.stroke();
  // body
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, b.r * 0.85, b.r, 0, 0, Math.PI*2);
  ctx.fill();
  // knot
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.moveTo(-4, b.r - 2);
  ctx.lineTo(4, b.r - 2);
  ctx.lineTo(0, b.r + 6);
  ctx.closePath();
  ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.ellipse(-b.r*0.3, -b.r*0.35, b.r*0.22, b.r*0.32, -0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawArrow(a) {
  // trail
  for (let i = 0; i < a.trail.length; i++) {
    const t = a.trail[i];
    const al = (i / a.trail.length) * 0.4;
    ctx.fillStyle = `rgba(255,255,255,${al})`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.ang);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-16, 0);
  ctx.lineTo(10, 0);
  ctx.stroke();
  ctx.fillStyle = '#999';
  ctx.beginPath();
  ctx.moveTo(14, 0);
  ctx.lineTo(6, -4);
  ctx.lineTo(6, 4);
  ctx.closePath();
  ctx.fill();
  // fletching
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(-16, 0); ctx.lineTo(-22, -4); ctx.lineTo(-19, 0); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-16, 0); ctx.lineTo(-22, 4); ctx.lineTo(-19, 0); ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawHUD() {
  // score
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(12, 12, 200, 44);
  ctx.fillStyle = '#fff';
  ctx.font = '20px "Press Start 2P", monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE ' + S.score, 22, 36);
  ctx.font = '13px "Press Start 2P", monospace';
  ctx.fillStyle = '#ffd700';
  ctx.fillText('GOAL ' + S.targetScore, 22, 52);

  // lives
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(W - 172, 12, 160, 44);
  ctx.font = '20px "Press Start 2P", monospace';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.fillText('LIVES', W - 22, 36);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < S.lives ? '#ff4444' : '#444';
    ctx.beginPath();
    ctx.arc(W - 148 + i * 30, 48, 9, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawCenterText(title, sub, color) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = color || '#fff';
  ctx.font = '34px "Press Start 2P", monospace';
  ctx.fillText(title, W/2, H/2 - 40);
  ctx.fillStyle = '#ddd';
  ctx.font = '16px "Press Start 2P", monospace';
  ctx.fillText(sub, W/2, H/2 + 10);
  // blinking prompt
  if (Math.floor(S.time * 2) % 2 === 0) {
    ctx.fillStyle = '#ffd700';
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillText('CLICK TO START', W/2, H/2 + 60);
  }
}

function draw() {
  ctx.save();
  if (S.shake > 0) {
    ctx.translate((Math.random()-0.5)*S.shake, (Math.random()-0.5)*S.shake);
  }
  drawBackground();
  for (const b of S.balloons) drawBalloon(b);
  for (const a of S.arrows) drawArrow(a);
  drawArcher();
  // particles
  for (const p of S.parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  // floaters
  for (const f of S.floaters) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = '18px "Press Start 2P", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (S.mode === 'playing') drawHUD();
  if (S.mode === 'title') drawCenterText('BALLOON POP \'95', 'An archery balloon game', '#ffd700');
  if (S.mode === 'won') drawCenterText('YOU WIN!', 'Score: ' + S.score + '  -  Click to play again', '#44ff44');
  if (S.mode === 'lost') drawCenterText('GAME OVER', 'Score: ' + S.score + '  -  Click to retry', '#ff4444');
}

// ---------- main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
