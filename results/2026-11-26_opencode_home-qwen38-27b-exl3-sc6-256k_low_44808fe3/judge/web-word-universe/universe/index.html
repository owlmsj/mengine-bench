<title>Universo das Palavras</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e8e6e3;font-family:'Georgia',serif;overflow:hidden;height:100vh}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;padding:16px 20px;z-index:10;pointer-events:none}
#ui>*{pointer-events:auto}
h1{font-size:1.3rem;font-weight:400;letter-spacing:.08em;color:#c9b99a;margin-bottom:8px}
#search{width:280px;padding:8px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(201,185,154,.3);border-radius:20px;color:#e8e6e3;font-size:.95rem;font-family:inherit;outline:none;transition:border .2s}
#search:focus{border-color:#c9b99a}
#info{position:fixed;bottom:0;left:0;width:100%;padding:14px 20px;z-index:10;background:linear-gradient(transparent,rgba(10,10,18,.92) 40%);pointer-events:none}
#info h2{font-size:1.5rem;font-weight:400;color:#c9b99a;margin-bottom:4px}
#info .tema{font-size:.85rem;color:#8a8578;margin-bottom:6px}
#info .rels{font-size:.9rem;line-height:1.7}
#info .rels a{color:#a8c4e0;text-decoration:none;border-bottom:1px dotted rgba(168,196,224,.4);cursor:pointer}
#info .rels a:hover{color:#d0e4ff;border-color:#d0e4ff}
#stats{position:fixed;top:16px;right:20px;font-size:.75rem;color:#5a564e;z-index:10;text-align:right;line-height:1.6}
</style>
</head>

const words = Object.keys(wordsJson);
const N = words.length;
const idx = {}; words.forEach((w,i)=>idx[w.toLowerCase()]=i);

// Build edges (undirected, deduped)
const edgeSet = new Set();
const edges = [];
for (const [w, links] of Object.entries(wordsJson)) {
  const wi = idx[w.toLowerCase()];
  for (const l of links) {
    const li = idx[l.toLowerCase()];
    if (li === undefined) continue;
    const key = Math.min(wi,li)+'|'+Math.max(wi,li);
    if (!edgeSet.has(key)) { edgeSet.add(key); edges.push([wi,li]); }
  }
}

// Degree
const deg = new Array(N).fill(0);
edges.forEach(([a,b])=>{deg[a]++;deg[b]++});
const maxDeg = Math.max(...deg);

// 3D layout: simple force-directed (few iterations)
const pos = [];
for (let i=0;i<N;i++){
  pos.push(new THREE.Vector3(
    (Math.random()-.5)*40,(Math.random()-.5)*40,(Math.random()-.5)*40
  ));
}
// Force layout: 120 iterations
for (let iter=0;iter<120;iter++){
  const disp = pos.map(()=>new THREE.Vector3());
  // Repulsion
  for (let i=0;i<N;i++){
    for (let j=i+1;j<N;j++){
      const d = new THREE.Vector3().subVectors(pos[i],pos[j]);
      const dist = Math.max(d.length(),0.1);
      d.normalize().multiplyScalar(8/(dist*dist));
      disp[i].add(d); disp[j].sub(d);
    }
  }
  // Attraction along edges
  for (const [a,b] of edges){
    const d = new THREE.Vector3().subVectors(pos[b],pos[a]);
    const dist = d.length();
    d.normalize().multiplyScalar(dist*0.02);
    disp[a].add(d); disp[b].sub(d);
  }
  // Apply
  const cool = 1 - iter/120;
  for (let i=0;i<N;i++){
    pos[i].add(disp[i].clampLength(0,2*cool));
  }
}
// Center
const center = new THREE.Vector3();
pos.forEach(p=>center.add(p)); center.divideScalar(N);
pos.forEach(p=>p.sub(center));

// Three.js scene
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50,window.innerWidth/window.innerHeight,0.1,500);
camera.position.set(0,0,60);

// Nodes: spheres sized by degree
const nodeGeo = new THREE.SphereGeometry(1,12,12);
const nodeMat = new THREE.MeshBasicMaterial({color:0x5a564e});
const nodeHiMat = new THREE.MeshBasicMaterial({color:0xc9b99a});
const nodeLinkMat = new THREE.MeshBasicMaterial({color:0x3a6a9a});
const nodes = [];
for (let i=0;i<N;i++){
  const s = 0.15 + 0.5*(deg[i]/maxDeg);
  const m = new THREE.Mesh(nodeGeo,nodeMat.clone());
  m.position.copy(pos[i]);
  m.scale.setScalar(s);
  m.userData = {idx:i, baseScale:s};
  scene.add(m);
  nodes.push(m);
}

// Edges: lines
const lineGeo = new THREE.BufferGeometry();
const linePos = new Float32Array(edges.length*6);
edges.forEach(([a,b],i)=>{
  linePos[i*6]=pos[a].x; linePos[i*6+1]=pos[a].y; linePos[i*6+2]=pos[a].z;
  linePos[i*6+3]=pos[b].x; linePos[i*6+4]=pos[b].y; linePos[i*6+5]=pos[b].z;
});
lineGeo.setAttribute('position',new THREE.BufferAttribute(linePos,3));
const lineMat = new THREE.LineBasicMaterial({color:0x2a2a3a,transparent:true,opacity:0.35});
const lines = new THREE.LineSegments(lineGeo,lineMat);
scene.add(lines);

// Highlight edges for selected word
let hlLines = null;
function clearHl(){
  if(hlLines){scene.remove(hlLines);hlLines.geometry.dispose();hlLines=null;}
  nodes.forEach(n=>{n.material.color.setHex(0x5a564e);n.scale.setScalar(n.userData.baseScale);});
  lineMat.opacity=0.35;
}
function highlight(word){
  clearHl();
  const wi = idx[word.toLowerCase()];
  if(wi===undefined) return;
  const links = wordsJson[words[wi]]||[];
  const linkSet = new Set();
  links.forEach(l=>{const li=idx[l.toLowerCase()];if(li!==undefined)linkSet.add(li);});
  linkSet.add(wi);
  nodes.forEach((n,i)=>{
    if(i===wi){n.material.color.setHex(0xc9b99a);n.scale.setScalar(n.userData.baseScale*1.8);}
    else if(linkSet.has(i)){n.material.color.setHex(0x3a6a9a);n.scale.setScalar(n.userData.baseScale*1.3);}
  });
  // Draw highlighted edges
  const hlEdges = edges.filter(([a,b])=>(a===wi&&linkSet.has(b))||(b===wi&&linkSet.has(a)));
  if(hlEdges.length){
    const g = new THREE.BufferGeometry();
    const p = new Float32Array(hlEdges.length*6);
    hlEdges.forEach(([a,b],i)=>{
      p[i*6]=pos[a].x;p[i*6+1]=pos[a].y;p[i*6+2]=pos[a].z;
      p[i*6+3]=pos[b].x;p[i*6+4]=pos[b].y;p[i*6+5]=pos[b].z;
    });
    g.setAttribute('position',new THREE.BufferAttribute(p,3));
    hlLines = new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xc9b99a,transparent:true,opacity:0.8}));
    scene.add(hlLines);
  }
  lineMat.opacity=0.12;
}

// Info panel
const info = document.getElementById('info');
function showInfo(word){
  const wi = idx[word.toLowerCase()];
  if(wi===undefined){info.innerHTML='';return;}
  const links = wordsJson[words[wi]]||[];
  const relHtml = links.map(l=>`<a data-w="${l}">${l}</a>`).join(' ');
  info.innerHTML = `<h2>${word}</h2><div class="rels">${relHtml}</div>`;
  info.querySelectorAll('a').forEach(a=>{
    a.onclick=()=>selectWord(a.dataset.w);
  });
}

// Stats
document.getElementById('stats').innerHTML =
  `${N} palavras · ${edges.length} relações`;

// Search
const search = document.getElementById('search');
function selectWord(w){
  const wi = idx[w.toLowerCase()];
  if(wi===undefined) return;
  highlight(words[wi]);
  showInfo(words[wi]);
  search.value = words[wi];
}
search.addEventListener('input',()=>{
  const v = search.value.toLowerCase().trim();
  if(!v){clearHl();info.innerHTML='';return;}
  const match = words.find(w=>w.toLowerCase()===v);
  if(match) selectWord(match);
  else {
    const partial = words.filter(w=>w.toLowerCase().includes(v));
    if(partial.length===1) selectWord(partial[0]);
    else {clearHl();info.innerHTML='';}
  }
});

// URL param ?word=
const params = new URLSearchParams(window.location.search);
const urlWord = params.get('word');
if(urlWord){
  const wi = idx[urlWord.toLowerCase()];
  if(wi!==undefined) selectWord(words[wi]);
}

// Slow rotation
let angle = 0;
function animate(){
  requestAnimationFrame(animate);
  angle += 0.0008;
  camera.position.x = Math.sin(angle)*60;
  camera.position.z = Math.cos(angle)*60;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
