<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Wave off Kanagawa — Low Poly</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8d9b0; }
  canvas { display: block; }
  #label {
    position: fixed; left: 16px; bottom: 12px;
    font-family: Georgia, 'Times New Roman', serif;
    color: #3a2f1d; font-size: 13px; letter-spacing: .04em;
    opacity: .75; pointer-events: none;
  }
</style>
</head>
<body>
<div id="label">The Great Wave off Kanagawa — Hokusai, c. 1831 (public domain) · low-poly rebuild</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---- Palette taken from the print ----
const C = {
  paper:   0xe8d9b0, // aged washi background
  sky:     0xd9c9a3,
  blue:    0x1b4a7a, // prussian blue wave body
  blueDk:  0x0e2f52, // deep blue shadow
  blueLt:  0x4a7fae, // lighter blue mid-tone
  foam:    0xf7f4e9, // white foam
  hull:    0xc9a06a, // tan boat hull
  hullDk:  0x8a6a3f,
  fuji:    0x2a4a6a, // Fuji body blue
  snow:    0xf2efe6, // snow cap
  cloud:   0xf0e9d6,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 60, 140);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
camera.position.set(0, 4, 46);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// flat-shaded low-poly material helper
const mat = (color, opts = {}) => new THREE.MeshLambertMaterial({ color, flatShading: true, ...opts });

// ---- Lights ----
scene.add(new THREE.AmbientLight(0xfff4e0, 0.75));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.9);
sun.position.set(-18, 30, 20);
scene.add(sun);

// ---- Sky: paper wash with soft clouds ----
function makeCloud(x, y, z, s) {
  const g = new THREE.Group();
  const m = mat(C.cloud);
  for (let i = 0; i < 5; i++) {
    const r = (0.8 + Math.random() * 0.9) * s;
    const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), m);
    blob.position.set((Math.random() - 0.5) * s * 3, (Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    blob.scale.y = 0.6;
    g.add(blob);
  }
  g.position.set(x, y, z);
  return g;
}
const clouds = [];
for (let i = 0; i < 7; i++) {
  const c = makeCloud((Math.random() - 0.5) * 90, 14 + Math.random() * 10, -30 - Math.random() * 20, 2 + Math.random() * 2);
  clouds.push(c);
  scene.add(c);
}

// ---- Mount Fuji: low-poly cone, snow cap, center-right ----
const fuji = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.ConeGeometry(14, 16, 7), mat(C.fuji));
  body.position.y = 8;
  fuji.add(body);
  // snow cap: smaller cone on top, slightly offset for the asymmetric Fuji cap
  const cap = new THREE.Mesh(new THREE.ConeGeometry(6.2, 6.5, 7), mat(C.snow));
  cap.position.y = 13.2;
  cap.rotation.y = 0.4;
  fuji.add(cap);
  fuji.position.set(10, -6, -26);
}
scene.add(fuji);

// ---- The Great Wave: a series of stacked, curling wave lobes ----
// Built from torus segments (curling crest) + cone-ish lobes for the body.
const wave = new THREE.Group();

function waveLobe(radius, tube, arc, color, x, y, z, rotZ = 0) {
  const m = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 6, 12, arc),
    mat(color)
  );
  m.position.set(x, y, z);
  m.rotation.z = rotZ;
  return m;
}

// Main crest: a curling claw built from a thick arc that hooks over to the right,
// matching the print's great wave breaking left-to-right with a foamy lip.
const crest = new THREE.Group();
// outer blue body of the crest (the big hook)
const outer = waveLobe(12, 3.4, Math.PI * 1.35, C.blue, 0, 0, 0, Math.PI * 0.55);
crest.add(outer);
// inner darker curl (the hollow under the lip)
const inner = waveLobe(9, 2.4, Math.PI * 1.2, C.blueDk, 0.8, 0.6, 0.5, Math.PI * 0.6);
crest.add(inner);
// bright mid-blue band between them
const mid = waveLobe(10.5, 1.2, Math.PI * 1.3, C.blueLt, 0.3, 0.3, 0.2, Math.PI * 0.58);
crest.add(mid);
// foam tips: white icosahedra tracing the outer lip of the hook
const foamMat = mat(C.foam);
for (let i = 0; i < 18; i++) {
  const t = (i / 17) * Math.PI * 1.35;
  const r = 12;
  const fx = Math.cos(t + Math.PI * 0.55) * r;
  const fy = Math.sin(t + Math.PI * 0.55) * r;
  const tip = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0 + Math.random() * 0.8, 0), foamMat);
  tip.position.set(fx, fy, (Math.random() - 0.5) * 1.8);
  crest.add(tip);
}
crest.position.set(-12, 7, -6);
crest.rotation.z = -0.15;
wave.add(crest);

// Secondary wave lobes rolling toward the right
function lobe(x, y, z, s, color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(s, 7, 5), mat(color));
  body.scale.set(1.6, 0.9, 1);
  g.add(body);
  // curling top
  const curl = waveLobe(s * 0.7, s * 0.28, Math.PI * 0.9, color, 0, s * 0.5, 0, Math.PI * 1.1);
  g.add(curl);
  // foam on the lip
  for (let i = 0; i < 6; i++) {
    const t = (i / 5) * Math.PI * 0.9;
    const tip = new THREE.Mesh(new THREE.IcosahedronGeometry(s * 0.16, 0), foamMat);
    tip.position.set(Math.cos(t + Math.PI * 1.1) * s * 0.7, s * 0.5 + Math.sin(t + Math.PI * 1.1) * s * 0.7, 0);
    g.add(tip);
  }
  g.position.set(x, y, z);
  return g;
}
const lobes = [
  lobe(-2, -2, -2, 5.5, C.blue),
  lobe(6, -4, 0, 4.5, C.blueLt),
  lobe(14, -6, -2, 5, C.blue),
  lobe(22, -8, 0, 4, C.blueDk),
  lobe(-10, -5, 2, 4.5, C.blueLt),
  lobe(-18, -8, 0, 5, C.blue),
];
lobes.forEach(l => wave.add(l));

// Foam field: scattered white blobs across the wave surface
for (let i = 0; i < 60; i++) {
  const b = new THREE.Mesh(new THREE.IcosahedronGeometry(0.4 + Math.random() * 0.8, 0), foamMat);
  b.position.set((Math.random() - 0.5) * 50, -2 + Math.random() * 6, (Math.random() - 0.5) * 10);
  wave.add(b);
}
scene.add(wave);

// ---- Boats: 3 low-poly fishing boats with rowers ----
function makeBoat(x, y, z, rotY, scale = 1) {
  const g = new THREE.Group();
  // hull: stretched box, pointed ends via scaled cones
  const hull = new THREE.Mesh(new THREE.BoxGeometry(7, 0.8, 2), mat(C.hull));
  g.add(hull);
  const bow = new THREE.Mesh(new THREE.ConeGeometry(1, 2.4, 4), mat(C.hull));
  bow.rotation.z = -Math.PI / 2; bow.position.x = 4.6;
  g.add(bow);
  const stern = new THREE.Mesh(new THREE.ConeGeometry(1, 2.4, 4), mat(C.hullDk));
  stern.rotation.z = Math.PI / 2; stern.position.x = -4.6;
  g.add(stern);
  // gunwale rim
  const rim = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.25, 2.2), mat(C.hullDk));
  rim.position.y = 0.45;
  g.add(rim);
  // rowers: small dark spheres in a row
  const rowerMat = mat(0x2a2018);
  for (let i = -2; i <= 2; i++) {
    const r = new THREE.Mesh(new THREE.SphereGeometry(0.35, 5, 4), rowerMat);
    r.position.set(i * 1.2, 0.7, 0);
    g.add(r);
    // oar
    const oar = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 2.2), mat(C.hullDk));
    oar.position.set(i * 1.2, 0.5, 1.1);
    oar.rotation.x = 0.5;
    g.add(oar);
  }
  g.position.set(x, y, z);
  g.rotation.y = rotY;
  g.scale.setScalar(scale);
  return g;
}
const boats = [
  makeBoat(-12, 1.5, 2, 0.5, 1.0),   // left boat in trough under the crest
  makeBoat(2, 0.5, 4, -0.3, 1.1),    // center boat
  makeBoat(16, -1, 2, 0.8, 0.9),     // right boat
];
boats.forEach(b => scene.add(b));

// ---- Gentle motion ----
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // wave swells and the crest rotates slowly
  wave.position.y = Math.sin(t * 0.5) * 0.8;
  crest.rotation.z = -0.35 + Math.sin(t * 0.4) * 0.06;
  crest.position.y = 8 + Math.sin(t * 0.5 + 1) * 0.5;

  // lobes bob
  lobes.forEach((l, i) => {
    l.position.y = l.userData.baseY ?? (l.userData.baseY = l.position.y);
    l.position.y = l.userData.baseY + Math.sin(t * 0.6 + i) * 0.5;
    l.rotation.z = Math.sin(t * 0.4 + i * 0.7) * 0.08;
  });

  // boats rock in the troughs
  boats.forEach((b, i) => {
    b.position.y += Math.sin(t * 0.8 + i * 1.3) * 0.01;
    b.rotation.z = Math.sin(t * 0.7 + i) * 0.07;
    b.rotation.x = Math.cos(t * 0.5 + i * 0.8) * 0.05;
  });

  // clouds drift
  clouds.forEach((c, i) => {
    c.position.x += 0.01 + i * 0.002;
    if (c.position.x > 60) c.position.x = -60;
  });

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
