<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --bg2:#11151f; --panel:#151a26; --line:#232a3a;
    --ink:#e8ecf4; --dim:#8b94a7; --faint:#5a6377;
    --accent:#7aa2ff; --accent2:#ff9e6d; --gold:#ffd479;
    --ok:#7ee2a8;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 800px at 70% -10%, #16203a 0%, var(--bg) 55%) fixed;
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    overflow:hidden;
  }
  #scene{position:fixed;inset:0;display:block}
  .ui{position:fixed;inset:0;pointer-events:none}
  .ui *{pointer-events:auto}

  /* top bar */
  .top{
    position:fixed;top:0;left:0;right:0;
    display:flex;align-items:center;gap:18px;
    padding:14px 20px;
    background:linear-gradient(180deg, rgba(11,14,20,.92), rgba(11,14,20,.55) 70%, transparent);
    z-index:5;
  }
  .brand{
    font-family:"Fraunces",serif;font-weight:700;font-size:20px;letter-spacing:.2px;
    display:flex;align-items:baseline;gap:10px;white-space:nowrap;
  }
  .brand small{font-family:"Inter";font-weight:500;font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
  .search{
    flex:1;max-width:520px;position:relative;
  }
  .search input{
    width:100%;padding:11px 14px 11px 38px;border-radius:12px;
    background:rgba(21,26,38,.9);border:1px solid var(--line);color:var(--ink);
    font:500 14px "Inter";outline:none;transition:border-color .15s, box-shadow .15s;
  }
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,162,255,.18)}
  .search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px}
  .stats{
    margin-left:auto;display:flex;gap:18px;font-size:12px;color:var(--dim);white-space:nowrap;
  }
  .stats b{color:var(--ink);font-weight:600}
  .stats .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}

  /* detail card */
  .card{
    position:fixed;right:18px;top:74px;width:330px;max-height:calc(100% - 100px);
    background:linear-gradient(180deg, rgba(21,26,38,.96), rgba(17,21,31,.96));
    border:1px solid var(--line);border-radius:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    padding:18px;overflow:auto;
    transform:translateX(120%);opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;
    z-index:6;
  }
  .card.open{transform:translateX(0);opacity:1}
  .card .close{
    position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:8px;
    border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;
  }
  .card .close:hover{color:var(--ink);border-color:var(--faint)}
  .card .kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
  .card h1{
    font-family:"Fraunces",serif;font-weight:700;font-size:30px;line-height:1.05;margin:0 0 4px;
    background:linear-gradient(90deg,var(--ink),#c9d4ea);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .card .deg{font-size:12px;color:var(--accent2);margin-bottom:14px}
  .card h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    font-size:12.5px;padding:5px 10px;border-radius:999px;cursor:pointer;
    background:rgba(122,162,255,.10);border:1px solid rgba(122,162,255,.25);color:#cdd9f5;
    transition:background .12s,transform .12s;
  }
  .chip:hover{background:rgba(122,162,255,.22);transform:translateY(-1px)}
  .chip.analog{background:rgba(255,158,109,.10);border-color:rgba(255,158,109,.28);color:#f3d3bd}
  .chip.analog:hover{background:rgba(255,158,109,.22)}
  .empty{color:var(--faint);font-size:13px;font-style:italic}

  /* legend */
  .legend{
    position:fixed;left:18px;bottom:16px;display:flex;gap:14px;font-size:11.5px;color:var(--dim);
    background:rgba(11,14,20,.55);padding:8px 12px;border-radius:10px;border:1px solid var(--line);z-index:4;
  }
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .hint{position:fixed;left:18px;bottom:52px;font-size:11px;color:var(--faint);z-index:4}

  /* toast for unknown word */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#2a1520;border:1px solid #5a2a3a;color:#ffb3c4;padding:10px 16px;border-radius:12px;
    font-size:13px;opacity:0;transition:opacity .2s,transform .2s;z-index:8;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="ui">
  <div class="top">
    <div class="brand">Universo de Palavras <small>dicionário criativo</small></div>
    <div class="search">
      <span class="icon">⌕</span>
      <input id="q" type="search" placeholder="Buscar uma palavra… (ex.: saudade)" autocomplete="off" spellcheck="false">
    </div>
    <div class="stats">
      <span><span class="dot"></span><b id="nWords">–</b> palavras</span>
      <span><b id="nRel">–</b> ligações</span>
    </div>
  </div>

  <div class="card" id="card">
    <button class="close" id="close" aria-label="fechar">✕</button>
    <div class="kicker">palavra</div>
    <h1 id="cTitle">—</h1>
    <div class="deg" id="cDeg"></div>
    <h3>Sinônimos</h3>
    <div class="chips" id="cSin"></div>
    <h3>Palavras análogas</h3>
    <div class="chips" id="cAna"></div>
  </div>

  <div class="hint">arraste para girar · role para zoom · clique numa palavra</div>
  <div class="legend">
    <span><i style="background:#7aa2ff"></i>sinônimo</span>
    <span><i style="background:#ff9e6d"></i>análoga</span>
    <span><i style="background:#ffd479"></i>selecionada</span>
  </div>
</div>
<div class="toast" id="toast"></div>

o":["ALFAIATE","Amor","ESPANTO","Estação","Pétala","pavor","tempo"],"tambor":["Dança","Piano","VERSO","joelho","minuto"],"tarde":["DIA","MANHÃ","NOITE","acougueiro","língua","noite"],"teatro":["CENA","DANÇA","ERA","fotografia","pai","ritmo","romance","tempo"],"tela":["cinema","desenho","milho","pintura","pé"],"tempo":["Açúcar","História","Prado","PÁTRIA","SOGRA","Tio","capital","floresta","futuro","hora","idioma","onda","pescador","rua","susto","teatro"],"ternura":["Alegria","ENGENHEIRO","carinho","compaixao","medo","praça"],"tia":["PAIS","Primo","TIO","estação","filha","irmão","sogra"],"tio":["FOLHA","HERANÇA","Tempo","neta","tia"],"trabalho":["SENTIDO","aldeia","carpinteiro","engenheiro","oficio"],"trigo":["arroz","farinha","milho","unha"],"tristeza":["AMOR","FRASE","MELANCOLIA","Mágoa","hoje"],"unha":["DEDO","Peito","TRIGO","açúcar","paixões","pulmao"],"vale":["RAIZ","RIO","mar","ponte","serra"],"verso":["Melodia","pescador","poesia","pão","rima","tambor"],"vila":["CARPINTEIRO","Porto","aldeia","capital","madrugada","nação"],"vinho":["Farinha","SOTAQUE","agua","cha","feijao"],"violão":["Enfermeira","Escultura","PIANO","POESIA","Praça","RIMA","pais","samba"],"voz":["AFETO","CAPITAL","Cozinha","Nome","fala","sotaque"]};
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const allWords = Object.keys(WORDS);
const wordSet = new Set(allWords);
const nWords = allWords.length;
const pairSet = new Set();
for (const w of allWords) for (const t of WORDS[w]) {
  const a = norm(w), b = norm(t);
  if (a === b) continue; // ignore self-loops
  pairSet.add(a < b ? a + "\u0000" + b : b + "\u0000" + a);
}
const nRel = pairSet.size;
document.getElementById("nWords").textContent = nWords;
document.getElementById("nRel").textContent = nRel;
// prefer the canonical count from result.json (same distinct-pair definition)
fetch(new URL("../result.json", location.href)).then(r=>r.json()).then(res=>{
  if (typeof res.relations === "number") document.getElementById("nRel").textContent = res.relations;
}).catch(()=>{});

/* ---------- search index (case + accents) ---------- */
const byNorm = new Map();
for (const w of allWords) byNorm.set(norm(w), w);

/* ---------- graph model ---------- */
const nodes = allWords.map((w,i)=>({
  id:i, word:w,
  pos:new THREE.Vector3((Math.random()-.5)*40,(Math.random()-.5)*40,(Math.random()-.5)*40),
  vel:new THREE.Vector3(),
  deg:WORDS[w].length,
}));
const idx = new Map(nodes.map(n=>[n.word,n.id]));
const edges = []; // {a,b,type}
for (const w of allWords) {
  for (const t of WORDS[w]) {
    const a = idx.get(w), b = idx.get(t);
    if (a===undefined || b===undefined || a===b) continue;
    // avoid duplicate undirected edge
    if (a<b) edges.push({a,b,type:"sin"});
  }
}
// degree for sizing (undirected)
const deg = new Array(nodes.length).fill(0);
for (const e of edges){deg[e.a]++;deg[e.b]++;}
nodes.forEach((n,i)=>n.deg=deg[i]);
const maxDeg = Math.max(1,...deg);

/* ---------- three.js scene ---------- */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0e14, 0.012);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0,0,95);

scene.add(new THREE.AmbientLight(0x8899bb, 0.7));
const p1 = new THREE.PointLight(0x7aa2ff, 1.2, 300); p1.position.set(40,30,60); scene.add(p1);
const p2 = new THREE.PointLight(0xff9e6d, 0.8, 300); p2.position.set(-50,-20,-40); scene.add(p2);

/* node spheres */
const nodeGeo = new THREE.SphereGeometry(1, 20, 20);
const nodeMat = new THREE.MeshStandardMaterial({color:0x7aa2ff, roughness:.45, metalness:.15, emissive:0x0a1230, emissiveIntensity:.4});
const nodeGroup = new THREE.Group();
for (const n of nodes) {
  const m = nodeGeo.clone();
  const mesh = new THREE.Mesh(m, nodeMat);
  const s = 0.5 + 1.6*Math.sqrt(n.deg/maxDeg);
  mesh.scale.setScalar(s);
  mesh.position.copy(n.pos);
  mesh.userData.id = n.id;
  n.mesh = mesh;
  nodeGroup.add(mesh);
}
scene.add(nodeGroup);

/* edges as line segments (rebuilt each frame while simulating) */
const lineGeo = new THREE.BufferGeometry();
const linePos = new Float32Array(edges.length*2*3);
lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos,3).setUsage(THREE.DynamicDrawUsage));
const lineMat = new THREE.LineBasicMaterial({color:0x33405c, transparent:true, opacity:0.35});
const lines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(lines);

/* highlight edges for selected word (separate, brighter) */
const hlGeo = new THREE.BufferGeometry();
const hlPos = new Float32Array(0);
hlGeo.setAttribute("position", new THREE.BufferAttribute(hlPos,3).setUsage(THREE.DynamicDrawUsage));
const hlMat = new THREE.LineBasicMaterial({color:0xffd479, transparent:true, opacity:0.9});
const hlLines = new THREE.LineSegments(hlGeo, hlMat);
scene.add(hlLines);

/* ---------- force simulation (simple) ---------- */
let simAlpha = 1;
const REPULSE = 60, SPRING = 0.02, REST = 14, CENTER = 0.004, DAMP = 0.86;
function simStep(){
  if (simAlpha < 0.02) return;
  const N = nodes.length;
  // repulsion (O(n^2) fine for 255)
  for (let i=0;i<N;i++){
    const a = nodes[i];
    for (let j=i+1;j<N;j++){
      const b = nodes[j];
      const dx=a.pos.x-b.pos.x, dy=a.pos.y-b.pos.y, dz=a.pos.z-b.pos.z;
      let d2 = dx*dx+dy*dy+dz*dz + 0.01;
      const f = REPULSE/d2;
      const d = Math.sqrt(d2);
      const fx=f*dx/d, fy=f*dy/d, fz=f*dz/d;
      a.vel.x+=fx; a.vel.y+=fy; a.vel.z+=fz;
      b.vel.x-=fx; b.vel.y-=fy; b.vel.z-=fz;
    }
  }
  // springs
  for (const e of edges){
    const a=nodes[e.a], b=nodes[e.b];
    const dx=b.pos.x-a.pos.x, dy=b.pos.y-a.pos.y, dz=b.pos.z-a.pos.z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    const f=SPRING*(d-REST);
    const fx=f*dx/d, fy=f*dy/d, fz=f*dz/d;
    a.vel.x+=fx; a.vel.y+=fy; a.vel.z+=fz;
    b.vel.x-=fx; b.vel.y-=fy; b.vel.z-=fz;
  }
  // centering + integrate
  for (const n of nodes){
    n.vel.x += -n.pos.x*CENTER; n.vel.y += -n.pos.y*CENTER; n.vel.z += -n.pos.z*CENTER;
    n.vel.multiplyScalar(DAMP);
    n.pos.add(n.vel);
  }
  simAlpha *= 0.995;
}

/* ---------- labels (canvas sprites) ---------- */
function makeLabel(text){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const font = "600 28px Inter, sans-serif";
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width)+20;
  c.width = w; c.height = 44;
  const ctx2 = c.getContext("2d");
  ctx2.font = font; ctx2.fillStyle = "rgba(232,236,244,.92)";
  ctx2.textAlign="center"; ctx2.textBaseline="middle";
  ctx2.fillText(text, w/2, 22);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false});
  const sp = new THREE.Sprite(mat);
  const scale = 0.02;
  sp.scale.set(w*scale, 44*scale, 1);
  return sp;
}
const labelGroup = new THREE.Group();
const labelFor = new Map(); // word -> sprite
function ensureLabel(word){
  let sp = labelFor.get(word);
  if (sp) return sp;
  sp = makeLabel(word);
  labelFor.set(word, sp);
  labelGroup.add(sp);
  return sp;
}
function clearLabels(){
  for (const sp of labelGroup.children) sp.visible=false;
}

/* ---------- selection ---------- */
let selected = null;
const card = document.getElementById("card");
function select(word, {push=true}={}){
  selected = word;
  const n = nodes[idx.get(word)];
  // highlight node
  for (const nd of nodes){
    nd.mesh.material.emissiveIntensity = 0.4;
    nd.mesh.material.color.setHex(0x7aa2ff);
  }
  if (n){
    n.mesh.material.color.setHex(0xffd479);
    n.mesh.material.emissiveIntensity = 1.2;
  }
  // labels: selected + neighbors
  clearLabels();
  if (n){
    const sp = ensureLabel(word); sp.visible=true;
    for (const t of WORDS[word]){
      const tn = nodes[idx.get(t)];
      if (tn){ const s2=ensureLabel(t); s2.visible=true; }
    }
  }
  // highlight edges
  buildHighlight();
  // card
  document.getElementById("cTitle").textContent = word;
  const sin = WORDS[word] || [];
  document.getElementById("cDeg").textContent = sin.length + " ligação" + (sin.length===1?"":"ões");
  const sinEl = document.getElementById("cSin");
  const anaEl = document.getElementById("cAna");
  sinEl.innerHTML=""; anaEl.innerHTML="";
  if (!sin.length){
    sinEl.innerHTML = '<span class="empty">sem sinônimos</span>';
    anaEl.innerHTML = '<span class="empty">sem palavras análogas</span>';
  } else {
    for (const t of sin){
      const isAna = false;
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = t;
      chip.onclick = ()=>select(t);
      sinEl.appendChild(chip);
    }
  }
  card.classList.add("open");
  if (push) history.replaceState(null,"","?word="+encodeURIComponent(word));
  // reheat sim a bit
  simAlpha = Math.max(simAlpha, 0.15);
}
function deselect(){
  selected=null;
  for (const nd of nodes){
    nd.mesh.material.emissiveIntensity=0.4;
    nd.mesh.material.color.setHex(0x7aa2ff);
  }
  clearLabels();
  buildHighlight();
  card.classList.remove("open");
  history.replaceState(null,"",location.pathname);
}
function buildHighlight(){
  if (!selected){
    hlGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(0),3).setUsage(THREE.DynamicDrawUsage));
    return;
  }
  const list=[];
  for (const e of edges){
    if (nodes[e.a].word===selected || nodes[e.b].word===selected){
      list.push(e);
    }
  }
  const arr = new Float32Array(list.length*2*3);
  hlGeo.setAttribute("position", new THREE.BufferAttribute(arr,3).setUsage(THREE.DynamicDrawUsage));
  hlEdges = list;
}
let hlEdges = [];

/* ---------- per-frame edge update ---------- */
function updateEdges(){
  const pos = lineGeo.attributes.position.array;
  for (let i=0;i<edges.length;i++){
    const e=edges[i];
    const a=nodes[e.a].pos, b=nodes[e.b].pos;
    pos[i*6]=a.x; pos[i*6+1]=a.y; pos[i*6+2]=a.z;
    pos[i*6+3]=b.x; pos[i*6+4]=b.y; pos[i*6+5]=b.z;
  }
  lineGeo.attributes.position.needsUpdate=true;
  if (hlEdges.length){
    const hpos = hlGeo.attributes.position.array;
    for (let i=0;i<hlEdges.length;i++){
      const e=hlEdges[i];
      const a=nodes[e.a].pos, b=nodes[e.b].pos;
      hpos[i*6]=a.x; hpos[i*6+1]=a.y; hpos[i*6+2]=a.z;
      hpos[i*6+3]=b.x; hpos[i*6+4]=b.y; hpos[i*6+5]=b.z;
    }
    hlGeo.attributes.position.needsUpdate=true;
  }
}
function updateLabels(){
  for (const [word,sp] of labelFor){
    if (!sp.visible) continue;
    const n = nodes[idx.get(word)];
    if (n){
      sp.position.copy(n.pos);
      sp.position.y += 1.6 + 1.6*Math.sqrt(n.deg/maxDeg);
    }
  }
}

/* ---------- orbit controls (manual, no deps) ---------- */
let theta=0, phi=1.2, radius=95, target=new THREE.Vector3();
let dragging=false, px=0, py=0;
canvas.addEventListener("pointerdown",e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointermove",e=>{
  if(!dragging) return;
  const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  theta -= dx*0.005; phi -= dy*0.005;
  phi = Math.max(0.15, Math.min(Math.PI-0.15, phi));
});
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  radius *= (1 + Math.sign(e.deltaY)*0.08);
  radius = Math.max(20, Math.min(300, radius));
},{passive:false});

/* ---------- click to pick ---------- */
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
canvas.addEventListener("click",e=>{
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(nodeGroup.children);
  if (hits.length){
    const id = hits[0].object.userData.id;
    select(nodes[id].word);
  }
});

/* ---------- search ---------- */
const q = document.getElementById("q");
function doSearch(){
  const v = norm(q.value.trim());
  if (!v){ deselect(); return; }
  const hit = byNorm.get(v);
  if (hit){ select(hit); q.value=""; q.blur(); }
  else {
    // fuzzy: prefix
    let found=null;
    for (const [k,w] of byNorm){ if (k.startsWith(v)){ found=w; break; } }
    if (found) select(found);
    else toast("“"+q.value+"” não está no universo");
  }
}
q.addEventListener("keydown",e=>{ if(e.key==="Enter") doSearch(); });
q.addEventListener("input",()=>{ if(q.value==="") deselect(); });
document.getElementById("close").onclick = deselect;

/* toast */
let toastT;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- deep link ?word= ---------- */
const params = new URLSearchParams(location.search);
const initWord = params.get("word");
if (initWord){
  const hit = byNorm.get(norm(initWord));
  if (hit) select(hit,{push:false});
  else toast("“"+initWord+"” não está no universo");
}

/* ---------- resize ---------- */
function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

/* ---------- loop ---------- */
function frame(){
  requestAnimationFrame(frame);
  simStep();
  for (const n of nodes) n.mesh.position.copy(n.pos);
  updateEdges();
  updateLabels();
  // camera
  camera.position.x = radius*Math.sin(phi)*Math.sin(theta);
  camera.position.y = radius*Math.cos(phi);
  camera.position.z = radius*Math.sin(phi)*Math.cos(theta);
  camera.lookAt(target);
  renderer.render(scene, camera);
}
frame();
</script>
