<title>o universo das palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#0b0e14;--ink:#e8e4da;--dim:#8b8fa3;--acc:#e0b05e;--line:#2a2f3f}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block}
header{position:fixed;top:0;left:0;right:0;padding:18px 22px;display:flex;align-items:baseline;gap:18px;pointer-events:none;z-index:5}
h1{font-family:Fraunces,serif;font-weight:700;font-size:26px;letter-spacing:.01em}
h1 em{font-style:normal;color:var(--acc)}
#stats{font-size:12px;color:var(--dim);white-space:nowrap}
#stats b{color:var(--ink);font-weight:600}
#searchbox{position:fixed;top:16px;right:22px;z-index:6;width:240px}
#q{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(11,14,20,.8);color:var(--ink);font:14px Inter,sans-serif;outline:none;backdrop-filter:blur(6px)}
#q:focus{border-color:var(--acc)}
#sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(15,18,27,.96);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none}
#sugg div{padding:8px 14px;font-size:13px;cursor:pointer}
#sugg div:hover,#sugg div.on{background:#1a1f2e}
#panel{position:fixed;left:22px;bottom:22px;z-index:6;width:330px;max-width:calc(100vw - 44px);background:rgba(13,16,24,.88);border:1px solid var(--line);border-radius:16px;padding:18px 20px;backdrop-filter:blur(8px);display:none}
#panel .w{font-family:Fraunces,serif;font-size:30px;font-weight:700;color:var(--acc)}
#panel .d{font-size:12px;color:var(--dim);margin:4px 0 12px}
#panel .rel{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#141927;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
#hint{position:fixed;bottom:22px;right:22px;font-size:11.5px;color:var(--dim);z-index:5;text-align:right;line-height:1.6;pointer-events:none}
#hint b{color:var(--ink)}
#clear{position:fixed;top:64px;right:22px;z-index:6;font-size:12px;color:var(--dim);cursor:pointer;display:none;background:none;border:none}
#clear:hover{color:var(--acc)}
</style></head>

eijao", "sotaque"], "violao": ["enfermeira", "escultura", "pais", "piano", "poesia", "praca", "rima", "samba"], "voz": ["afeto", "capital", "cozinha", "fala", "nome", "sotaque"]};
const keys = Object.keys(DATA);
const idx = new Map(keys.map((k,i)=>[k,i]));
const N = keys.length;
const eset = new Set();
for(const k of keys) for(const l of DATA[k]) eset.add([k,l].sort().join("|"));
const most = keys.reduce((a,b)=>DATA[b].length>DATA[a].length?b:a);
document.getElementById("stats").innerHTML =
 `<b>${N}</b> palavras · <b>${eset.size}</b> laços · mais conectada: <b>${most}</b>`;

// ---- force layout (3D) ----
const pos = new Float32Array(N*3), vel = new Float32Array(N*3);
let seed = 42; const rnd = ()=> (seed = (seed*16807)%2147483647)/2147483647;
for(let i=0;i<N;i++){pos[i*3]=(rnd()-.5)*60;pos[i*3+1]=(rnd()-.5)*60;pos[i*3+2]=(rnd()-.5)*60;}
const edges = [];
for(const k of keys) for(const l of DATA[k]) if(idx.get(l)>idx.get(k)) edges.push([idx.get(k),idx.get(l)]);
const deg = new Uint16Array(N);
for(const [a,b] of edges){deg[a]++;deg[b]++;}
for(let it=0;it<260;it++){
  const t = 1-it/260, step = .06*t+.005;
  // repulsion
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const dx=pos[i*3]-pos[j*3],dy=pos[i*3+1]-pos[j*3+1],dz=pos[i*3+2]-pos[j*3+2];
    let d2=dx*dx+dy*dy+dz*dz+.01; const f=.9/(d2); const d=Math.sqrt(d2);
    const fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;
    vel[i*3]+=fx*step;vel[i*3+1]+=fy*step;vel[i*3+2]+=fz*step;
    vel[j*3]-=fx*step;vel[j*3+1]-=fy*step;vel[j*3+2]-=fz*step;
  }
  // springs
  for(const [a,b] of edges){
    const dx=pos[b*3]-pos[a*3],dy=pos[b*3+1]-pos[a*3+1],dz=pos[b*3+2]-pos[a*3+2];
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01; const f=(d-7)*.012;
    const fx=dx/d*f,fy=dy/d*f,fz=dz/d*f;
    vel[a*3]+=fx*step*8;vel[a*3+1]+=fy*step*8;vel[a*3+2]+=fz*step*8;
    vel[b*3]-=fx*step*8;vel[b*3+1]-=fy*step*8;vel[b*3+2]-=fz*step*8;
  }
  // centering + integrate
  for(let i=0;i<N;i++){
    vel[i*3]-=pos[i*3]*.002;vel[i*3+1]-=pos[i*3+1]*.002;vel[i*3+2]-=pos[i*3+2]*.002;
    pos[i*3]+=vel[i*3];pos[i*3+1]+=vel[i*3+1];pos[i*3+2]+=vel[i*3+2];
  }
}
// normalize radius
let maxR=0; for(let i=0;i<N;i++){const r=Math.hypot(pos[i*3],pos[i*3+1],pos[i*3+2]);if(r>maxR)maxR=r;}
const S=46/maxR; for(let i=0;i<N*3;i++)pos[i]*=S;

// ---- three scene ----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0e14, .0075);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("stage").appendChild(renderer.domElement);

function labelSprite(word, size, color){
  const c = document.createElement("canvas"); const ctx = c.getContext("2d");
  const fs = 44; ctx.font = `600 ${fs}px Inter, sans-serif`;
  const w = Math.ceil(ctx.measureText(word).width)+20;
  c.width = w; c.height = 64;
  ctx.font = `600 ${fs}px Inter, sans-serif`; ctx.fillStyle = color;
  ctx.textBaseline="middle"; ctx.fillText(word, 10, 34);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  const h = .8*size; sp.scale.set(h*w/64, h, 1);
  return sp;
}
const baseColor = "#e6e9f2", hiColor = "#e0b05e", dimColor = "#6a7188";
const sprites = [];
for(let i=0;i<N;i++){
  const size = .7 + deg[i]*.22;
  const sp = labelSprite(keys[i], size, baseColor);
  sp.position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
  sp.userData = {i, base: sp.scale.clone(), color: baseColor};
  scene.add(sp); sprites.push(sp);
}
const lineGeo = new THREE.BufferGeometry();
const lp = new Float32Array(edges.length*6);
edges.forEach(([a,b],e)=>{lp.set([pos[a*3],pos[a*3+1],pos[a*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]], e*6);});
lineGeo.setAttribute("position", new THREE.BufferAttribute(lp,3));
const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({color:0x4a5470, transparent:true, opacity:.55}));
scene.add(lines);

// ---- interaction ----
let rotY=0, rotX=.15, dist=70, dragging=false, px=0, py=0;
const el = renderer.domElement;
el.addEventListener("pointerdown", e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener("pointerup", e=>{dragging=false;
  if(Math.abs(e.clientX-px)<4 && Math.abs(e.clientY-py)<4) pick(e);
});
addEventListener("pointermove", e=>{
  if(!dragging) return;
  rotY += (e.clientX-px)*.005; rotX += (e.clientY-py)*.005;
  rotX = Math.max(-1.4, Math.min(1.4, rotX)); px=e.clientX; py=e.clientY;
});
el.addEventListener("wheel", e=>{dist = Math.max(15, Math.min(180, dist + e.deltaY*.06));}, {passive:true});

const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
function pick(e){
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse, cam);
  const hit = ray.intersectObjects(sprites);
  if(hit.length) select(keys[hit[0].object.userData.i], true);
}

// ---- selection ----
const panel = document.getElementById("panel");
const clearBtn = document.getElementById("clear");
let selected = null;
function select(word, fromClick){
  if(!(word in DATA)) return;
  selected = word;
  const neigh = new Set(DATA[word]);
  sprites.forEach(sp=>{
    const i = sp.userData.i, k = keys[i];
    let col, op, s=1;
    if(k===word){col=hiColor;op=1;s=1.7;}
    else if(neigh.has(k)){col="#f0d9a8";op=1;}
    else {col=dimColor;op=.55;}
    sp.material.color.set(col); sp.material.opacity=op;
    sp.scale.copy(sp.userData.base).multiplyScalar(s);
  });
  lines.material.opacity = .25;
  // highlight edges of selected word
  const hl = new THREE.BufferGeometry();
  const pts=[];
  for(const [a,b] of edges){
    if(keys[a]===word||keys[b]===word) pts.push(pos[a*3],pos[a*3+1],pos[a*3+2],pos[b*3],pos[b*3+1],pos[b*3+2]);
  }
  hl.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts),3));
  if(scene.getObjectByName("hl")) scene.remove(scene.getObjectByName("hl"));
  const hlLines = new THREE.LineSegments(hl, new THREE.LineBasicMaterial({color:0xe0b05e, transparent:true, opacity:.9}));
  hlLines.name="hl"; scene.add(hlLines);
  // panel
  panel.style.display="block";
  panel.querySelector(".w").textContent = word;
  panel.querySelector(".d").textContent = `${DATA[word].length} palavras relacionadas`;
  const rel = panel.querySelector(".rel"); rel.innerHTML="";
  DATA[word].sort().forEach(k=>{
    const c=document.createElement("span"); c.className="chip"; c.textContent=k;
    c.onclick=()=>select(k,true); rel.appendChild(c);
  });
  clearBtn.style.display="block";
  if(history.replaceState) history.replaceState(null,"",`?word=${encodeURIComponent(word)}`);
}
function clearSel(){
  selected=null;
  sprites.forEach(sp=>{sp.material.color.set(baseColor); sp.material.opacity=1; sp.scale.copy(sp.userData.base);});
  lines.material.opacity=.55;
  if(scene.getObjectByName("hl")) scene.remove(scene.getObjectByName("hl"));
  panel.style.display="none"; clearBtn.style.display="none";
  if(history.replaceState) history.replaceState(null,"",location.pathname);
}
clearBtn.onclick = clearSel;

// ---- search ----
const q = document.getElementById("q"), sugg = document.getElementById("sugg");
q.addEventListener("input", ()=>{
  const v = q.value.trim().toLowerCase();
  if(!v){sugg.style.display="none";return;}
  const m = keys.filter(k=>k.startsWith(v)).slice(0,8);
  if(!m.length){sugg.style.display="none";return;}
  sugg.innerHTML=""; m.forEach(k=>{
    const d=document.createElement("div"); d.textContent=k;
    d.onmousedown=()=>{select(k); q.value=""; sugg.style.display="none";};
    sugg.appendChild(d);
  });
  sugg.style.display="block";
});
q.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const v=q.value.trim().toLowerCase();
    if(v in DATA) select(v);
    else {const m=keys.find(k=>k.startsWith(v)); if(m) select(m);}
    q.value=""; sugg.style.display="none";
  }
});
document.addEventListener("click", e=>{ if(!sugg.contains(e.target)) sugg.style.display="none"; });

// ---- init from URL ----
const w = new URLSearchParams(location.search).get("word");
if(w && w in DATA) select(w);

// ---- loop ----
function frame(){
  requestAnimationFrame(frame);
  if(!dragging) rotY += .0012;
  cam.position.set(dist*Math.sin(rotY)*Math.cos(rotX), dist*Math.sin(rotX), dist*Math.cos(rotY)*Math.cos(rotX));
  cam.lookAt(0,0,0);
  renderer.render(scene, cam);
}
frame();
addEventListener("resize", ()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
