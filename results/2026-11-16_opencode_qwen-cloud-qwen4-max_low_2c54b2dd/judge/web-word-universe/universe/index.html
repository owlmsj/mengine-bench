<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080f; --panel:rgba(13,15,26,.88); --line:rgba(255,255,255,.09);
  --ink:#eef0ff; --dim:#9aa0bd; --accent:#ffd166;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;overflow:hidden}
#sky{position:fixed;inset:0;display:block}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:18px;
  padding:14px 22px;background:linear-gradient(180deg,rgba(7,8,15,.92),rgba(7,8,15,0));pointer-events:none}
header>*{pointer-events:auto}
.brand h1{font-family:Fraunces,serif;font-weight:600;font-size:22px;letter-spacing:.3px}
.brand h1 em{font-style:normal;color:var(--accent)}
.brand p{font-size:12px;color:var(--dim);margin-top:2px}
.stats{display:flex;gap:14px;font-size:12px;color:var(--dim)}
.stats b{display:block;font-size:17px;color:var(--ink);font-weight:700}
.searchwrap{margin-left:auto;position:relative;width:min(340px,38vw)}
#q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(16,18,32,.92);color:var(--ink);font:inherit;font-size:14px;outline:none}
#q:focus{border-color:var(--accent)}
#sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#10121f;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;display:none;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:9}
#sugg div{padding:9px 14px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#sugg div small{color:var(--dim)}
#sugg div.on,#sugg div:hover{background:rgba(255,209,102,.12)}
#panel{position:fixed;top:76px;right:18px;bottom:18px;width:min(360px,86vw);z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);
  padding:22px;overflow-y:auto;scrollbar-width:thin}
#panel h2{font-family:Fraunces,serif;font-size:34px;font-weight:600;line-height:1.1;word-break:break-word}
.badge{display:inline-block;margin-top:8px;padding:3px 11px;border-radius:99px;font-size:12px;
  border:1px solid var(--line);color:var(--dim)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.sub{color:var(--dim);font-size:13px;margin-top:10px;line-height:1.5}
.relgroup{margin-top:18px}
.relgroup h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.bar{display:flex;align-items:center;gap:9px;margin:7px 0;cursor:pointer;font-size:13px}
.bar .track{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:99px}
.bar:hover .name{color:var(--accent)}
.bar .name{width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .n{width:22px;text-align:right;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
button.action{margin-top:18px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,209,102,.1);color:var(--accent);font:inherit;font-size:13px;cursor:pointer}
button.action:hover{background:rgba(255,209,102,.2)}
#tip{position:fixed;z-index:8;pointer-events:none;background:#10121f;border:1px solid var(--line);
  padding:7px 12px;border-radius:10px;font-size:13px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tip small{color:var(--dim);display:block;font-size:11px}
#hint{position:fixed;left:22px;bottom:16px;z-index:4;font-size:12px;color:var(--dim);
  background:rgba(7,8,15,.6);padding:6px 12px;border-radius:99px;border:1px solid var(--line)}
#fallback{position:fixed;inset:76px 18px 18px 18px;z-index:3;display:none;overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
#fallback .cols{columns:3;column-gap:26px;font-size:14px}
#fallback .tw{break-inside:avoid;margin-bottom:14px}
#fallback h4{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--dim);margin-bottom:6px}
#fallback a{color:var(--ink);text-decoration:none;cursor:pointer;display:inline-block;margin:2px 6px 2px 0}
#fallback a:hover{color:var(--accent)}
@media (max-width:760px){ .stats{display:none} #panel{top:auto;height:46vh} #fallback{bottom:calc(46vh + 26px)} }
</style>
</head>
<body>
<canvas id="sky"></canvas>

  </div>
</header>
<aside id="panel"></aside>
<div id="fallback"></div>
<div id="tip"></div>

const WORDS = Object.keys(DATA.words).sort((a,b)=>a.localeCompare(b,'pt'));
const ADJ = {}; WORDS.forEach(w=>ADJ[w]=new Set());
for (const w of WORDS) for (const sec of Object.values(DATA.words[w].rel)) for (const t of sec){ ADJ[w].add(t); ADJ[t].add(w); }
const DEG = {}; WORDS.forEach(w=>DEG[w]=ADJ[w].size);
const TEMAS = [...new Set(WORDS.map(w=>DATA.words[w].tema))].sort((a,b)=>a.localeCompare(b,'pt'));
const PALETTE = ['#ff6b8b','#ffd166','#7bd88f','#5bc8f5','#b48cf2','#ff9e64','#64e0c8','#f272ba','#c9d66b','#8ea2ff'];
const TC = {}; TEMAS.forEach((t,i)=>TC[t]=PALETTE[i%PALETTE.length]);
const norm = s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const NWORD = {}; WORDS.forEach(w=>NWORD[norm(w)]=w);
const ALIAS = {}; for (const [k,v] of Object.entries(DATA.alias)) ALIAS[norm(k)]=v;
const lookup = s=>{ const n=norm(s.trim()); return NWORD[n]||ALIAS[n]||null; };
const $ = id=>document.getElementById(id);
const esc = s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('stats').innerHTML =
  `<span><b>${DATA.stats.words}</b>palavras</span><span><b>${DATA.stats.relations}</b>relações</span>`+
  `<span><b>${TEMAS.length}</b>temas</span><span><b>${esc(DATA.stats.most_connected)}</b>mais ligada</span>`;

/* ---------- panel ---------- */
let selected=null, themeFocus=null;
function chip(w){ return `<button class="chip" data-w="${esc(w)}"><span class="dot" style="background:${TC[DATA.words[w].tema]}"></span>${esc(w)}</button>`; }
function renderPanel(){
  const p=$('panel');
  if(!selected){
    const max=DATA.top[0][1];
    p.innerHTML = `<h2>Visão geral</h2>
      <p class="sub">${DATA.stats.words} palavras ligadas por ${DATA.stats.relations} relações, extraídas das páginas de sinônimos e palavras análogas do dicionário. Os links são mútuos: se A aponta para B, B aponta para A.</p>
      <div class="relgroup"><h3>Mais conectadas</h3>${DATA.top.map(([w,n])=>
        `<div class="bar" data-w="${esc(w)}"><span class="name">${esc(w)}</span><span class="track"><span class="fill" style="width:${Math.round(n/max*100)}%;background:${TC[DATA.words[w].tema]}"></span></span><span class="n">${n}</span></div>`).join('')}</div>
      <div class="relgroup"><h3>Temas · clique para destacar</h3><div class="legend">${TEMAS.map(t=>
        `<button class="chip" data-t="${esc(t)}" style="${themeFocus===t?'border-color:'+TC[t]+';color:'+TC[t]:''}"><span class="dot" style="background:${TC[t]}"></span>${esc(t)} (${WORDS.filter(w=>DATA.words[w].tema===t).length})</button>`).join('')}</div></div>
      <button class="action" id="reset">Limpar destaque</button>
      <p class="sub">Fonte: cópia local do Dicionário Criativo (./site). Dados completos em ./words.json. Links quebrados do site original (rascunhos, páginas removidas) foram ignorados; apelidos como “saudades” redirecionam para a palavra canônica.</p>`;
  } else {
    const d=DATA.words[selected], rel=d.rel;
    const inc=[...ADJ[selected]].filter(t=>!Object.values(rel).flat().includes(t));
    p.innerHTML = `<h2>${esc(selected)}</h2>
      <span class="badge"><span class="dot" style="background:${TC[d.tema]}"></span>tema: ${esc(d.tema)}</span>
      <span class="badge">${DEG[selected]} ligações</span>
      ${rel.sinonimos?.length?`<div class="relgroup"><h3>Sinônimos</h3><div class="chips">${rel.sinonimos.map(chip).join('')}</div></div>`:''}
      ${rel.analogas?.length?`<div class="relgroup"><h3>Palavras análogas</h3><div class="chips">${rel.analogas.map(chip).join('')}</div></div>`:''}
      ${inc.length?`<div class="relgroup"><h3>Também ligada a</h3><div class="chips">${inc.map(chip).join('')}</div></div>`:''}
      <button class="action" id="share">Copiar link desta palavra</button>
      <button class="action" id="back" style="background:rgba(255,255,255,.05);color:var(--dim)">← Visão geral</button>`;
  }
  p.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>select(el.dataset.w));
  p.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{themeFocus=themeFocus===el.dataset.t?null:el.dataset.t;selected=null;syncUrl();renderPanel();paint();});
  const sh=$('share'); if(sh) sh.onclick=async()=>{ const u=shareUrl(selected);
    try{ await navigator.clipboard.writeText(u); sh.textContent='Link copiado ✓'; }catch{ prompt('Copie o link:',u); } };
  const bk=$('back'); if(bk) bk.onclick=()=>select(null);
  const rs=$('reset'); if(rs) rs.onclick=()=>{themeFocus=null;renderPanel();paint();};
}
function shareUrl(w){ const u=new URL(location.href); u.search='?word='+encodeURIComponent(w); return u.href; }
function syncUrl(){ try{ const u=new URL(location.href); if(selected) u.search='?word='+encodeURIComponent(selected); else u.search=''; history.replaceState(null,'',u); }catch{} }

/* ---------- search ---------- */
const q=$('q'), sugg=$('sugg'); let hits=[], hi=0;
function search(){
  const n=norm(q.value); sugg.innerHTML=''; hits=[]; hi=0;
  if(!n){ sugg.style.display='none'; return; }
  hits=WORDS.filter(w=>norm(w).includes(n)).slice(0,8);
  if(!hits.length){ const a=ALIAS[n]; if(a) hits=[a]; }
  if(!hits.length){ sugg.style.display='none'; return; }
  sugg.innerHTML=hits.map((w,i)=>`<div role="option" data-i="${i}" class="${i===0?'on':''}"><span>${esc(w)}</span><small>${esc(DATA.words[w].tema)} · ${DEG[w]} ligações</small></div>`).join('');
  sugg.style.display='block';
  sugg.querySelectorAll('div').forEach(el=>el.onmousedown=e=>{e.preventDefault();select(hits[+el.dataset.i]);q.value='';sugg.style.display='none';});
}
q.addEventListener('input',search);
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ if(!hits.length)return; e.preventDefault();
    hi=(hi+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;
    sugg.querySelectorAll('div').forEach((el,i)=>el.classList.toggle('on',i===hi)); }
  else if(e.key==='Enter'){ const w=lookup(q.value)||hits[hi]; if(w){select(w);q.value='';sugg.style.display='none';q.blur();} }
  else if(e.key==='Escape'){ sugg.style.display='none'; q.blur(); }
});
q.addEventListener('blur',()=>setTimeout(()=>sugg.style.display='none',150));

/* ---------- layout (shared by 3D and fallback) ---------- */
function mulberry(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd=mulberry(42);
const POS={}; const ANCH={};
TEMAS.forEach((t,i)=>{ const phi=Math.acos(1-2*(i+.5)/TEMAS.length), th=Math.PI*(1+Math.sqrt(5))*i;
  ANCH[t]=[46*Math.sin(phi)*Math.cos(th),46*Math.cos(phi),46*Math.sin(phi)*Math.sin(th)]; });
WORDS.forEach(w=>{ const a=ANCH[DATA.words[w].tema];
  POS[w]=[a[0]+(rnd()-.5)*30,a[1]+(rnd()-.5)*30,a[2]+(rnd()-.5)*30]; });
{ const idx=WORDS.map((w,i)=>[w,i]), F=WORDS.map(()=>[0,0,0]);
  for(let it=0;it<220;it++){
    F.forEach(f=>{f[0]=f[1]=f[2]=0;});
    for(let i=0;i<WORDS.length;i++) for(let j=i+1;j<WORDS.length;j++){
      const a=POS[WORDS[i]],b=POS[WORDS[j]];
      let dx=a[0]-b[0],dy=a[1]-b[1],dz=a[2]-b[2],d2=dx*dx+dy*dy+dz*dz+.01;
      if(d2>3600) continue; const f=150/d2, d=Math.sqrt(d2); dx/=d;dy/=d;dz/=d;
      F[i][0]+=dx*f;F[i][1]+=dy*f;F[i][2]+=dz*f; F[j][0]-=dx*f;F[j][1]-=dy*f;F[j][2]-=dz*f;
    }
    for(const w of WORDS) for(const t of ADJ[w]){
      const a=POS[w],b=POS[t]; let dx=b[0]-a[0],dy=b[1]-a[1],dz=b[2]-a[2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+.01, f=(d-13)*.015; dx/=d;dy/=d;dz/=d;
      const i=WORDS.indexOf(w); F[i][0]+=dx*f*d;F[i][1]+=dy*f*d;F[i][2]+=dz*f*d;
    }
    for(let i=0;i<WORDS.length;i++){ const w=WORDS[i],a=ANCH[DATA.words[w].tema],p=POS[w];
      F[i][0]+=(a[0]-p[0])*.012-p[0]*.002; F[i][1]+=(a[1]-p[1])*.012-p[1]*.002; F[i][2]+=(a[2]-p[2])*.012-p[2]*.002;
      const cap=2.4; for(let k=0;k<3;k++) p[k]+=Math.max(-cap,Math.min(cap,F[i][k]));
    }
  }
}

/* ---------- selection state ---------- */
function select(w){
  selected=w; themeFocus=null; syncUrl(); renderPanel(); paint();
  if(w && fly) fly(POS[w]);
  if(!w && fly) fly([0,0,0],true);
}

/* ---------- 3D view ---------- */
let paint=()=>{}, fly=null;
const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js').catch(()=>null);
if(THREE){
  const canvas=$('sky');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07080f);
  scene.fog=new THREE.FogExp2(0x07080f,0.0035);
  const camera=new THREE.PerspectiveCamera(55,1,.1,900);
  const orbit={theta:.6,phi:1.15,r:170,target:new THREE.Vector3(),tTarget:new THREE.Vector3(),tR:170};
  function resize(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize',resize); resize();

  const N=WORDS.length, pos=new Float32Array(N*3), col=new Float32Array(N*3), size=new Float32Array(N), alp=new Float32Array(N);
  WORDS.forEach((w,i)=>{ pos.set(POS[w],i*3); const c=new THREE.Color(TC[DATA.words[w].tema]);
    col.set([c.r,c.g,c.b],i*3); size[i]=2.2+Math.sqrt(DEG[w])*1.15; alp[i]=1; });
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(size,1));
  geo.setAttribute('aAlpha',new THREE.BufferAttribute(alp,1));
  const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    vertexShader:`attribute float aSize;attribute float aAlpha;attribute vec3 aColor;varying vec3 vC;varying float vA;
      void main(){vC=aColor;vA=aAlpha;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(300.0/-mv.z);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vC;varying float vA;
      void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,.3,d)*vA;gl_FragColor=vec4(vC,a);}`});
  scene.add(new THREE.Points(geo,mat));

  const E=[]; for(const w of WORDS) for(const t of ADJ[w]) if(w<t) E.push([w,t]);
  const epos=new Float32Array(E.length*6), ecol=new Float32Array(E.length*6);
  E.forEach(([a,b],i)=>{ epos.set(POS[a],i*6); epos.set(POS[b],i*6+3); });
  const egeo=new THREE.BufferGeometry();
  egeo.setAttribute('position',new THREE.BufferAttribute(epos,3));
  egeo.setAttribute('color',new THREE.BufferAttribute(ecol,3));
  scene.add(new THREE.LineSegments(egeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.55,depthWrite:false})));

  const labelGroup=new THREE.Group(); scene.add(labelGroup);
  const spriteCache={};
  function label(w){
    if(spriteCache[w]) return spriteCache[w];
    const c=document.createElement('canvas'); c.width=512; c.height=128;
    const x=c.getContext('2d'); x.font='600 56px "Space Grotesk", sans-serif'; x.textAlign='center'; x.textBaseline='middle';
    x.shadowColor='rgba(0,0,0,.9)'; x.shadowBlur=14; x.fillStyle='#eef0ff'; x.fillText(w,256,64);
    const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
    const sc=Math.max(8,w.length*1.2); s.userData.sc=sc; s.scale.set(sc,sc/4,1);
    s.position.set(POS[w][0],POS[w][1]+2.6+size[WORDS.indexOf(w)]*.35,POS[w][2]);
    spriteCache[w]=s; return s;
  }
  const hubs=DATA.top.slice(0,10).map(([w])=>w);

  paint=function(){
    const focus=selected?new Set([selected,...ADJ[selected]]):null;
    for(let i=0;i<N;i++){ const w=WORDS[i];
      let a=1;
      if(focus) a=focus.has(w)?1:.08;
      else if(themeFocus) a=DATA.words[w].tema===themeFocus?1:.1;
      alp[i]=a;
      size[i]=(2.2+Math.sqrt(DEG[w])*1.15)*(selected===w?1.7:1);
    }
    geo.attributes.aAlpha.needsUpdate=true; geo.attributes.aSize.needsUpdate=true;
    const base=new THREE.Color();
    E.forEach(([a,b],i)=>{
      let k=.16;
      if(focus) k=(a===selected||b===selected)?.9:.03;
      else if(themeFocus) k=(DATA.words[a].tema===themeFocus&&DATA.words[b].tema===themeFocus)?.5:.04;
      base.set(TC[DATA.words[a].tema]).lerp(new THREE.Color(TC[DATA.words[b].tema]),.5);
      ecol.set([base.r*k,base.g*k,base.b*k],i*6); ecol.set([base.r*k,base.g*k,base.b*k],i*6+3);
    });
    egeo.attributes.color.needsUpdate=true;
    labelGroup.clear();
    if(selected){ labelGroup.add(label(selected)); for(const t of ADJ[selected]) labelGroup.add(label(t)); }
    else if(themeFocus){ for(const w of WORDS) if(DATA.words[w].tema===themeFocus&&DEG[w]>=5) labelGroup.add(label(w)); }
    else for(const w of hubs) labelGroup.add(label(w));
  };
  fly=function(p,overview=false){ orbit.tTarget.set(p[0],p[1],p[2]); orbit.tR=overview?170:52; };

  /* interaction */
  const ray=new THREE.Raycaster(); ray.params.Points.threshold=1.6;
  const mouse=new THREE.Vector2(); let dragging=false,moved=0,lx=0,ly=0,lastInput=0,hovered=null;
  const tip=$('tip');
  canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;lx=e.clientX;ly=e.clientY;lastInput=performance.now();});
  addEventListener('pointerup',e=>{
    if(dragging&&moved<6){ const w=pick(e.clientX,e.clientY); select(w||null); }
    dragging=false;
  });
  addEventListener('pointermove',e=>{
    lastInput=performance.now();
    if(dragging){ const dx=e.clientX-lx,dy=e.clientY-ly; moved+=Math.abs(dx)+Math.abs(dy);
      orbit.theta-=dx*.005; orbit.phi=Math.max(.15,Math.min(Math.PI-.15,orbit.phi-dy*.005)); lx=e.clientX;ly=e.clientY; tip.style.display='none'; return; }
    const w=pick(e.clientX,e.clientY);
    if(w!==hovered){ hovered=w; canvas.style.cursor=w?'pointer':'grab';
      if(w){ tip.innerHTML=`<b>${esc(w)}</b><small>${esc(DATA.words[w].tema)} · ${DEG[w]} ligações</small>`; tip.style.display='block'; }
      else tip.style.display='none'; }
    if(w){ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+10)+'px'; }
  });
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); lastInput=performance.now();
    orbit.tR=Math.max(24,Math.min(320,orbit.tR*(e.deltaY>0?1.12:.89))); },{passive:false});
  function pick(cx,cy){
    mouse.set(cx/innerWidth*2-1,-(cy/innerHeight)*2+1);
    ray.setFromCamera(mouse,camera);
    const hit=ray.intersectObject(scene.children.find(o=>o.isPoints))[0];
    return hit?WORDS[hit.index]:null;
  }
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.activeElement!==q) select(null); });

  paint();
  renderer.setAnimationLoop(()=>{
    if(!dragging&&performance.now()-lastInput>3500&&!selected) orbit.theta+=.0007;
    orbit.target.lerp(orbit.tTarget,.06); orbit.r+=(orbit.tR-orbit.r)*.06;
    camera.position.set(
      orbit.target.x+orbit.r*Math.sin(orbit.phi)*Math.cos(orbit.theta),
      orbit.target.y+orbit.r*Math.cos(orbit.phi),
      orbit.target.z+orbit.r*Math.sin(orbit.phi)*Math.sin(orbit.theta));
    camera.lookAt(orbit.target);
    for(const s of labelGroup.children){ const k=camera.position.distanceTo(s.position)/110;
      s.scale.set(s.userData.sc*k,s.userData.sc*k/4,1); }
    renderer.render(scene,camera);
  });
} else {
  /* fallback: themed index, fully usable without WebGL/CDN */
  $('sky').style.display='none'; $('hint').textContent='modo lista (3D indisponível)';
  const fb=$('fallback'); fb.style.display='block';
  fb.innerHTML='<div class="cols">'+TEMAS.map(t=>`<div class="tw"><h4><span class="dot" style="background:${TC[t]}"></span>${esc(t)}</h4>${
    WORDS.filter(w=>DATA.words[w].tema===t).map(w=>`<a data-w="${esc(w)}">${esc(w)}</a>`).join('')}</div>`).join('')+'</div>';
  fb.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>select(el.dataset.w));
}

/* ---------- boot ---------- */
renderPanel();
const initial=lookup(new URLSearchParams(location.search).get('word')||'');
if(initial) select(initial);
</script>
</body>
