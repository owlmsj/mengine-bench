<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Universo das Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#070912; --bg1:#0d1122;
  --ink:#ece9df; --ink-dim:#9a97a8; --ink-faint:#5c5a6e;
  --gold:#e3b458;
  --panel:rgba(13,17,34,.72);
  --line:rgba(236,233,223,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Space Grotesk",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 800px at 70% 20%, #141a35 0%, transparent 60%),
    radial-gradient(900px 700px at 20% 85%, #101527 0%, transparent 55%),
    linear-gradient(var(--bg1), var(--bg0));
  overflow:hidden;
}
#gl{position:fixed;inset:0;display:block;cursor:grab}
#gl.dragging{cursor:grabbing}

.hud{position:fixed;top:22px;left:24px;z-index:5;max-width:340px;pointer-events:none}
.hud .kicker{
  font-size:11px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-bottom:6px;
}
.hud h1{
  font-family:"Fraunces",serif;font-weight:600;font-size:30px;line-height:1.05;
  letter-spacing:.01em;
}
.hud .sub{margin-top:8px;font-size:12.5px;color:var(--ink-dim);line-height:1.5}
.hud .sub b{color:var(--ink);font-weight:500}

.searchwrap{position:fixed;top:158px;left:24px;z-index:6;width:300px}
#search{
  width:100%;padding:11px 14px 11px 38px;font:500 14px "Space Grotesk",sans-serif;
  color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;outline:none;backdrop-filter:blur(10px);
  transition:border-color .15s;
}
#search:focus{border-color:var(--gold)}
.searchwrap .lens{position:absolute;left:13px;top:12px;width:15px;height:15px;opacity:.55}
#results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;list-style:none;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  backdrop-filter:blur(12px);overflow:hidden;display:none;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
}
#results.open{display:block}
#results li{
  padding:9px 14px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:9px;
  border-bottom:1px solid rgba(236,233,223,.06);
}
#results li:last-child{border-bottom:0}
#results li:hover,#results li.active{background:rgba(227,180,88,.12)}
#results li .dot{width:8px;height:8px;border-radius:50%;flex:none}
#results li small{margin-left:auto;color:var(--ink-faint);font-size:11px}

.legend{
  position:fixed;left:24px;bottom:20px;z-index:5;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  backdrop-filter:blur(10px);padding:12px 14px;font-size:11.5px;max-width:300px;
}
.legend h3{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px;font-weight:700}
.legend .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.legend .item{display:flex;align-items:center;gap:7px;color:var(--ink-dim)}
.legend .item .dot{width:8px;height:8px;border-radius:50%;flex:none}
.legend .top{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);color:var(--ink-dim);line-height:1.6}
.legend .top b{color:var(--ink);font-weight:500}

.hint{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;
  font-size:11px;color:var(--ink-faint);letter-spacing:.06em;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;
  padding:7px 16px;backdrop-filter:blur(8px);white-space:nowrap;
}

.panel{
  position:fixed;top:22px;right:22px;bottom:22px;width:330px;z-index:7;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  backdrop-filter:blur(14px);padding:22px;overflow-y:auto;
  transform:translateX(24px);opacity:0;pointer-events:none;
  transition:transform .25s ease,opacity .25s ease;
  box-shadow:0 18px 60px rgba(0,0,0,.5);
}
.panel.open{transform:none;opacity:1;pointer-events:auto}
.panel .close{
  position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:8px;
  border:1px solid var(--line);background:transparent;color:var(--ink-dim);
  font-size:15px;cursor:pointer;line-height:1;
}
.panel .close:hover{color:var(--ink);border-color:var(--ink-dim)}
.panel .themechip{
  display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-dim);
  border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin-bottom:12px;
}
.panel .themechip .dot{width:8px;height:8px;border-radius:50%}
.panel h2{font-family:"Fraunces",serif;font-size:40px;font-weight:600;line-height:1;margin-bottom:6px}
.panel .deg{font-size:12.5px;color:var(--ink-dim);margin-bottom:18px}
.panel .deg b{color:var(--gold);font-weight:700}
.panel h4{
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);
  margin:16px 0 9px;font-weight:700;
}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font:500 13px "Space Grotesk",sans-serif;color:var(--ink);
  background:rgba(236,233,223,.05);border:1px solid var(--line);
  border-radius:999px;padding:6px 13px;cursor:pointer;transition:all .12s;
}
.chip:hover{border-color:var(--gold);background:rgba(227,180,88,.14);transform:translateY(-1px)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.panel .share{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.panel .share label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;display:block;margin-bottom:8px}
.sharebox{display:flex;gap:7px}
.sharebox input{
  flex:1;min-width:0;font:400 11.5px "Space Grotesk",monospace;color:var(--ink-dim);
  background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;
}
.sharebox button{
  font:700 12px "Space Grotesk",sans-serif;color:var(--bg0);background:var(--gold);
  border:0;border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap;
}
.sharebox button:active{transform:translateY(1px)}
.panel .missing{font-size:12px;color:var(--ink-faint);margin-top:14px;line-height:1.5}

#nogl{
  position:fixed;inset:0;z-index:4;display:none;place-items:center;text-align:center;
  color:var(--ink-dim);font-size:14px;padding:40px;
}
#nogl.on{display:grid}
#nogl .big{font-family:"Fraunces",serif;font-size:26px;color:var(--ink);margin-bottom:10px}

@media (max-width:760px){
  .panel{width:calc(100vw - 44px)}
  .legend{display:none}
  .hint{display:none}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="nogl"><div><div class="big">O universo, em lista</div>
<p>A visualização 3D precisa da rede (three.js). A busca continua funcionando.</p></div></div>

<div class="hud">
  <div class="kicker">Dicionário Criativo</div>
  <h1>O Universo das Palavras</h1>
  <div class="sub" id="stats"></div>
</div>

<div class="searchwrap">
  <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="#ece9df" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
  <input id="search" type="text" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
  <ul id="results"></ul>
</div>

<div class="legend" id="legend"></div>
<div class="hint">arraste para orbitar · role para aproximar · clique numa palavra</div>

<aside class="panel" id="panel">
  <button class="close" id="closepanel" title="fechar">✕</button>
  <div id="panelbody"></div>
</aside>

// ---- theme palette (golden-angle hues, deterministic) ----
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0), f(8), f(4)];
}
const THEMES = [...new Set(nodes.map(n => n.theme).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt"));
const themeRGB = {};
THEMES.forEach((t, i) => { themeRGB[t] = hsl2rgb((i * 137.508 + 12) % 360, 70, 66); });
const GRAYRGB = [0.48, 0.50, 0.56];
const nodeRGB = nodes.map(n => !n.exists ? GRAYRGB : (n.theme ? themeRGB[n.theme] : GRAYRGB));
const css = c => `rgb(${Math.round(c[0]*255)},${Math.round(c[1]*255)},${Math.round(c[2]*255)})`;

// ---- stats + legend ----
const wordCount = nodes.filter(n => n.exists).length;

  `<span class="item"><span class="dot" style="background:${css(GRAYRGB)}"></span>sem página</span></div>` +
  `<div class="top">mais conectadas: ` +
  topNodes.slice(0, 5).map(([i, d]) => `<b>${nodes[i].name}</b> (${d})`).join(" · ") + `</div>`;

// ---- selection state ----
let selected = null;
function applySelection() { if (window.__apply3D) window.__apply3D(); }
const panel = document.getElementById("panel");
const panelbody = document.getElementById("panelbody");

function chipHTML(name) {
  const i = byNorm.get(norm(name));
  const c = i != null ? nodeRGB[i] : GRAYRGB;
  return `<button class="chip" data-name="${name.replace(/"/g, "&quot;")}"><span class="dot" style="background:${css(c)}"></span>${name}</button>`;
}
function renderPanel(i) {
  const n = nodes[i];
  const t = typed[n.name];
  const themeChip = n.theme
    ? `<span class="themechip"><span class="dot" style="background:${css(nodeRGB[i])}"></span>tema: ${n.theme}</span>`
    : `<span class="themechip"><span class="dot" style="background:${css(GRAYRGB)}"></span>fora do dicionário</span>`;
  let rel = "";
  if (t) {
    if (t.syn.length) rel += `<h4>Sinônimos</h4><div class="chips">${t.syn.map(chipHTML).join("")}</div>`;
    if (t.ana.length) rel += `<h4>Palavras análogas</h4><div class="chips">${t.ana.map(chipHTML).join("")}</div>`;
  } else {
    rel = `<div class="missing">O dicionário aponta relações para esta palavra, mas a página dela não existe no site salvo.</div>`;
  }
  const share = location.href.split("?")[0] + "?word=" + encodeURIComponent(n.name);
  panelbody.innerHTML =
    themeChip +
    `<h2>${n.name}</h2>` +
    `<div class="deg"><b>${n.deg}</b> palavra${n.deg === 1 ? "" : "s"} relacionada${n.deg === 1 ? "" : "s"}</div>` +
    rel +
    `<div class="share"><label>compartilhar</label><div class="sharebox">` +
    `<input id="shareurl" readonly value="${share}"><button id="copybtn">copiar</button></div></div>`;
  panel.classList.add("open");
  document.getElementById("copybtn").addEventListener("click", async () => {
    const inp = document.getElementById("shareurl");
    try { await navigator.clipboard.writeText(inp.value); }
    catch (e) { inp.select(); document.execCommand("copy"); }
    const b = document.getElementById("copybtn");
    b.textContent = "copiado ✓"; setTimeout(() => b.textContent = "copiar", 1400);
  });
}
panelbody.addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const i = byNorm.get(norm(chip.dataset.name));
  if (i != null) select(i);
});
document.getElementById("closepanel").addEventListener("click", () => clearSel());

function select(i, push = true) {
  selected = i;
  applySelection();
  renderPanel(i);
  if (push) history.replaceState(null, "", "?word=" + encodeURIComponent(nodes[i].name));
  closeResults();
  searchEl.value = "";
  searchEl.blur();
}
function clearSel(push = true) {
  selected = null;

  panel.classList.remove("open");

}

// ---- search ----
const searchEl = document.getElementById("search");
const resultsEl = document.getElementById("results");
let matches = [], activeIdx = -1;
function closeResults() { resultsEl.classList.remove("open"); matches = []; activeIdx = -1; }
function renderResults(list) {
  matches = list; activeIdx = -1;
  if (!list.length) { closeResults(); return; }
  resultsEl.innerHTML = list.map((i, k) =>
    `<li data-i="${i}"><span class="dot" style="background:${css(nodeRGB[i])}"></span>${nodes[i].name}<small>${nodes[i].deg} rel.</small></li>`
  ).join("");
  resultsEl.classList.add("open");
}
function runSearch() {
  const nq = norm(searchEl.value.trim());
  if (!nq) { closeResults(); return; }
  const hit = [];
  for (let i = 0; i < N; i++) {
    const nm = norm(nodes[i].name);
    if (nm.startsWith(nq) || nm.includes(nq)) hit.push(i);
  }
  hit.sort((a, b) =>
    (norm(nodes[a].name).startsWith(nq) ? 0 : 1) - (norm(nodes[b].name).startsWith(nq) ? 0 : 1) ||
    nodes[b].deg - nodes[a].deg);
  renderResults(hit.slice(0, 8));
}
searchEl.addEventListener("input", runSearch);
searchEl.addEventListener("keydown", e => {
  const lis = [...resultsEl.children];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if (!lis.length) return;
    activeIdx = (activeIdx + (e.key === "ArrowDown" ? 1 : -1) + lis.length) % lis.length;
    lis.forEach((li, k) => li.classList.toggle("active", k === activeIdx));
  } else if (e.key === "Enter") {
    const i = activeIdx >= 0 ? +lis[activeIdx].dataset.i : (matches[0] ?? null);
    if (i != null) select(i);
  } else if (e.key === "Escape") closeResults();
});
resultsEl.addEventListener("mousedown", e => {
  const li = e.target.closest("li");
  if (li) select(+li.dataset.i);
});
document.addEventListener("click", e => {
  if (!e.target.closest(".searchwrap")) closeResults();
});

// ---- deep link ?word= ----
const q0 = new URLSearchParams(location.search).get("word");
if (q0) {
  const i = byNorm.get(norm(q0));
  if (i != null) select(i, false);
  else { searchEl.value = q0; runSearch(); }
}

// ---- 3D scene ----
const canvas = document.getElementById("gl");
let T = null;
try {
  T = await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js");
} catch (e) {
  document.getElementById("nogl").classList.add("on");
  canvas.style.display = "none";
}
if (T) {
  await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]);
  const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 4000);

  // starfield backdrop
  {
    const M = 600, sp = new Float32Array(M * 3);
    for (let i = 0; i < M; i++) {
      const r = 700 + Math.random() * 900, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
      sp[i*3] = r * Math.sin(ph) * Math.cos(th); sp[i*3+1] = r * Math.cos(ph); sp[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    }
    const g = new T.BufferGeometry();
    g.setAttribute("position", new T.BufferAttribute(sp, 3));
    scene.add(new T.Points(g, new T.PointsMaterial({ color: 0x8890b8, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0.35, depthWrite: false })));
  }

  // word nodes as points
  const baseSize = nodes.map(n => 1.5 + n.deg * 0.34);
  const posArr = new Float32Array(N * 3);
  nodes.forEach((n, i) => { posArr[i*3] = n.pos[0]; posArr[i*3+1] = n.pos[1]; posArr[i*3+2] = n.pos[2]; });
  const colArr = new Float32Array(N * 3);
  const sizeArr = new Float32Array(N);
  const pg = new T.BufferGeometry();
  pg.setAttribute("position", new T.BufferAttribute(posArr, 3));
  pg.setAttribute("aColor", new T.BufferAttribute(colArr, 3));
  pg.setAttribute("aSize", new T.BufferAttribute(sizeArr, 1));
  const pm = new T.ShaderMaterial({
    transparent: true, depthWrite: false, blending: T.AdditiveBlending,
    vertexShader: `attribute vec3 aColor; attribute float aSize; varying vec3 vC;
      void main(){ vC = aColor; vec4 mv = modelViewMatrix * vec4(position,1.0);
      gl_PointSize = aSize * (300.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `varying vec3 vC;
      void main(){ float d = length(gl_PointCoord - 0.5);

      gl_FragColor = vec4(vC, a); }`
  });
  const points = new T.Points(pg, pm);
  scene.add(points);

  // relation edges
  const E = edges.length;
  const lpos = new Float32Array(E * 6), lcol = new Float32Array(E * 6);
  edges.forEach(([a, b], e) => {
    lpos.set([nodes[a].pos[0], nodes[a].pos[1], nodes[a].pos[2], nodes[b].pos[0], nodes[b].pos[1], nodes[b].pos[2]], e * 6);
  });
  const lg = new T.BufferGeometry();
  lg.setAttribute("position", new T.BufferAttribute(lpos, 3));
  lg.setAttribute("color", new T.BufferAttribute(lcol, 3));
  scene.add(new T.LineSegments(lg, new T.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.9, blending: T.AdditiveBlending, depthWrite: false })));

  // labels
  const labelMats = [];
  function makeLabel(text, rgb) {
    const cv = document.createElement("canvas");
    const ctx = cv.getContext("2d");
    const font = "600 30px 'Space Grotesk', sans-serif";
    ctx.font = font;
    const w = Math.max(64, Math.ceil(ctx.measureText(text).width) + 20);
    cv.width = w; cv.height = 44;
    ctx.font = font; ctx.textBaseline = "middle";
    ctx.fillStyle = `rgba(${Math.round(rgb[0]*255)},${Math.round(rgb[1]*255)},${Math.round(rgb[2]*255)},1)`;
    ctx.fillText(text, 10, 23);
    const tex = new T.CanvasTexture(cv);
    tex.colorSpace = T.SRGBColorSpace;
    const m = new T.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    const s = new T.Sprite(m);
    s.scale.set(3.2 * w / 44, 3.2, 1);
    return { s, m };
  }
  nodes.forEach((n, i) => {
    const { s, m } = makeLabel(n.name, nodeRGB[i]);
    s.position.set(n.pos[0], n.pos[1] + 3.0, n.pos[2]);
    scene.add(s); labelMats.push(m);
  });

  // orbit state
  const cur = { theta: -0.7, phi: 1.12, radius: 175, target: new T.Vector3(0, 0, 0) };
  const des = { theta: -0.7, phi: 1.12, radius: 175, target: new T.Vector3(0, 0, 0) };

  window.__apply3D = function () {
    const sel = selected;
    const inSet = new Set();
    if (sel != null) { inSet.add(sel); neighbors[sel].forEach(j => inSet.add(j)); }
    for (let i = 0; i < N; i++) {
      const b = nodeRGB[i];
      let c = b, s = baseSize[i];
      if (sel != null) {
        if (i === sel) { c = [1, 1, 1]; s = baseSize[i] * 1.9; }
        else if (inSet.has(i)) { s = baseSize[i] * 1.25; }
        else { c = [b[0]*0.12, b[1]*0.12, b[2]*0.12]; s = baseSize[i] * 0.75; }
      }
      colArr[i*3] = c[0]; colArr[i*3+1] = c[1]; colArr[i*3+2] = c[2];
      sizeArr[i] = s;
      labelMats[i].opacity = sel == null ? (nodes[i].deg >= 9 ? 0.9 : 0.0) : (inSet.has(i) ? 1 : 0.03);
    }
    pg.attributes.aColor.needsUpdate = true;
    pg.attributes.aSize.needsUpdate = true;
    for (let e = 0; e < E; e++) {
      const [a, b] = edges[e];
      const k = sel == null ? 0.14 : (a === sel || b === sel ? 0.85 : 0.025);
      for (let v = 0; v < 2; v++) {
        const src = v ? b : a, o = e * 6 + v * 3;
        lcol[o] = nodeRGB[src][0] * k; lcol[o+1] = nodeRGB[src][1] * k; lcol[o+2] = nodeRGB[src][2] * k;
      }
    }
    lg.attributes.color.needsUpdate = true;
    if (sel != null) {
      des.target.set(nodes[sel].pos[0], nodes[sel].pos[1], nodes[sel].pos[2]);
      des.radius = Math.min(130, 58 + neighbors[sel].size * 2.4);
    } else {
      des.target.set(0, 0, 0); des.radius = 175;
    }
  };
  window.__apply3D();

  // picking + controls
  const ray = new T.Raycaster();
  ray.params.Points.threshold = 3.2;
  let dragging = false, moved = 0, px = 0, py = 0;
  canvas.addEventListener("pointerdown", e => {
    dragging = true; moved = 0; px = e.clientX; py = e.clientY;
    canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - px, dy = e.clientY - py;
    px = e.clientX; py = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    des.theta -= dx * 0.005;
    des.phi = Math.max(0.08, Math.min(Math.PI - 0.08, des.phi - dy * 0.005));
  });
  canvas.addEventListener("pointerup", e => {
    dragging = false; canvas.classList.remove("dragging");
    if (moved < 6) {
      const ndc = new T.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObject(points);
      if (hit.length) select(hit[0].index);
      else clearSel();
    }
  });
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    des.radius = Math.max(28, Math.min(420, des.radius * Math.exp(e.deltaY * 0.0012)));
  }, { passive: false });
  addEventListener("keydown", e => { if (e.key === "Escape" && selected != null) clearSel(); });
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function frame() {
    requestAnimationFrame(frame);
    cur.theta += (des.theta - cur.theta) * 0.12;
    cur.phi += (des.phi - cur.phi) * 0.12;
    cur.radius += (des.radius - cur.radius) * 0.10;
    cur.target.lerp(des.target, 0.10);
    camera.position.setFromSphericalCoords(cur.radius, cur.phi, cur.theta).add(cur.target);
    camera.lookAt(cur.target);
    renderer.render(scene, camera);
  })();
}
</script>
</body>
</html>
