<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARCHERY 95</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#008080;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;user-select:none;-webkit-user-select:none}
.win{background:#c0c0c0;border:2px solid;border-color:#dfdfdf #404040 #404040 #dfdfdf;box-shadow:5px 5px 0 rgba(0,0,0,.35);padding:3px}
.titlebar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:4px 8px;font-size:12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:1px}
.titlebar .btns{display:flex;gap:2px}
.titlebar .b{width:18px;height:16px;background:#c0c0c0;border:1px solid;border-color:#fff #404040 #404040 #fff;color:#000;font-size:9px;text-align:center;line-height:14px}
.bevel{border:2px solid;border-color:#404040 #fff #fff #404040;margin-top:3px;line-height:0}
canvas{display:block;background:#87ceeb;width:min(960px,94vw);height:auto;cursor:crosshair}
.statusbar{display:flex;gap:3px;padding:3px 2px 1px;font-size:9px;color:#000}
.statusbar .cell{flex:1;border:1px solid;border-color:#404040 #fff #fff #404040;padding:4px 6px;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div class="win">
<div class="titlebar"><span>ARCHERY 95 - LEVEL 1</span><span class="btns"><span class="b">_</span><span class="b">□</span><span class="b">×</span></span></div>
<div class="bevel"><canvas id="cv" width="960" height="540"></canvas></div>
<div class="statusbar"><span class="cell" id="stScore">SCORE 0</span><span class="cell" id="stLives">LIVES 3</span><span class="cell">AIM: MOUSE | HOLD: DRAW | RELEASE: FIRE</span></div>
</div>
<script>
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,GROUND=H-42,TAU=Math.PI*2;
const stScore=document.getElementById('stScore'),stLives=document.getElementById('stLives');

/* ---------- audio: all synthesized, no assets ---------- */
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(type,f0,f1,dur,peak,delay){
  const a=ac(),t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(1,f0),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,peak,freq,q,delay){
  const a=ac(),t=a.currentTime+(delay||0);
  const len=Math.max(1,(a.sampleRate*dur)|0),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=a.createBufferSource();n.buffer=buf;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q||1;
  const g=a.createGain();g.gain.setValueAtTime(peak,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f);f.connect(g);g.connect(a.destination);n.start(t);
}
const S={
  click(){tone('square',950,700,0.05,0.12);},
  draw(p){tone('square',150+p*430,130+p*430,0.03,0.045);},
  twang(p){tone('triangle',180+p*100,55,0.16,0.4);noise(0.05,0.22,1500,2);},
  pop(){const r=0.85+Math.random()*0.35;tone('sine',520*r,85,0.09,0.5);noise(0.06,0.38,1900,1.4);},
  thud(){tone('sine',130,55,0.08,0.18);},
  lose(){tone('sawtooth',290,60,0.4,0.28);noise(0.3,0.18,280,1);},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone('square',f,f,0.15,0.16,i*0.11));}
};

/* ---------- state ---------- */
const TARGET=1000;
let state='title',score=0,lives=3;
let balloons=[],arrows=[],parts=[],pops=[];
let mx=W*0.62,my=H*0.38,down=false,power=0,pdir=1,creakT=0,recoil=0;
let spawnT=1.2,time=0,shake=0,flash=0;
const clouds=[];for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:40+Math.random()*150,s:0.6+Math.random()*0.9});
const AX=118,AY=GROUND;
function bowPos(){return{x:AX+20,y:AY-44};}
function syncHUD(){stScore.textContent='SCORE '+score;stLives.textContent='LIVES '+lives;}
function reset(){score=0;lives=3;balloons=[];arrows=[];parts=[];pops=[];spawnT=1.0;power=0;down=false;shake=0;flash=0;recoil=0;syncHUD();}
function checkWin(){if(state==='play'&&score>=TARGET){state='win';S.win();}}

/* ---------- entities ---------- */
function spawnBalloon(x){
  const r=Math.random();let kind=0;
  if(r<0.12)kind=2;else if(r<0.35)kind=1;
  const R=kind===2?16:kind===1?20:24;
  const cols=['#ff4444','#44cc55','#4499ff','#ff9933','#cc66ff'];
  balloons.push({
    x:(x===undefined?W+30:x),y:70+Math.random()*(GROUND-170),r:R,kind,
    sp:kind===1?70+Math.random()*50:40+Math.random()*40,
    ph:Math.random()*TAU,amp:6+Math.random()*10,
    col:kind===2?'#ffd700':cols[(Math.random()*cols.length)|0],
    pts:kind===2?200:kind===1?100:50
  });
}
for(let i=0;i<4;i++)spawnBalloon(180+i*200); // title-screen drifters

function aimAngle(){
  const b=bowPos();let a=Math.atan2(my-b.y,mx-b.x);
  if(a<-1.35)a=-1.35;if(a>0.22)a=0.22;return a;
}
function arrowSpeed(){return 430+power*800;}

function fire(){
  const b=bowPos(),a=aimAngle(),sp=arrowSpeed();
  arrows.push({x:b.x+Math.cos(a)*46,y:b.y+Math.sin(a)*46,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp});
  S.twang(power);recoil=8;
  if(power>0.95){
    score+=25;syncHUD();
    pops.push({x:b.x+40,y:b.y-24,txt:'PERFECT +25',t:0,small:true});
    checkWin();
  }
  power=0;down=false;
}
function popBalloon(j){
  const b=balloons[j],by=b.y+Math.sin(b.ph)*b.amp;
  balloons.splice(j,1);
  score+=b.pts;syncHUD();S.pop();shake=Math.min(6,shake+3);
  pops.push({x:b.x,y:by,txt:'+'+b.pts,t:0});
  for(let i=0;i<14;i++){
    const an=Math.random()*TAU,sp=60+Math.random()*180;
    parts.push({x:b.x,y:by,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-40,t:0,life:0.45+Math.random()*0.3,col:b.col,sz:3+Math.random()*4});
  }
  parts.push({x:b.x,y:by,ring:true,t:0,life:0.3,col:b.col});
  checkWin();
}
function loseLife(){lives--;S.lose();shake=10;flash=1;syncHUD();if(lives<=0)state='over';}

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  for(const c of clouds){c.x-=dt*8*c.s;if(c.x<-140)c.x=W+140;}
  for(let i=balloons.length-1;i>=0;i--){
    const b=balloons[i];b.x-=b.sp*dt;b.ph+=dt*2.2;
    if(b.x<-b.r-4){
      balloons.splice(i,1);
      if(state==='play')loseLife();
      else if(state==='title')spawnBalloon(W+30);
    }
  }
  if(state==='play'){
    if(down){
      power+=pdir*dt*1.5;
      if(power>=1){power=1;pdir=-1;}
      if(power<=0){power=0;pdir=1;}
      creakT-=dt;if(creakT<=0){S.draw(power);creakT=0.09;}
    }
    spawnT-=dt;
    if(spawnT<=0&&balloons.length<8){
      spawnBalloon();
      spawnT=Math.max(0.75,2.1-score/TARGET*1.3);
    }
    for(let i=arrows.length-1;i>=0;i--){
      const a=arrows[i];
      a.vy+=520*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;
      if(a.x>W+40||a.x<-40||a.y>H+40){
        if(a.y>H+40)S.thud();
        arrows.splice(i,1);continue;
      }
      for(let j=balloons.length-1;j>=0;j--){
        const b=balloons[j],by=b.y+Math.sin(b.ph)*b.amp;
        const dx=a.x-b.x,dy=a.y-by;
        if(dx*dx+dy*dy<(b.r+4)*(b.r+4)){popBalloon(j);arrows.splice(i,1);break;}
      }
    }
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.t+=dt;
    if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;}
    if(p.t>p.life)parts.splice(i,1);
  }
  for(let i=pops.length-1;i>=0;i--){pops[i].t+=dt;if(pops[i].t>0.9)pops.splice(i,1);}
  shake=Math.max(0,shake-dt*30);
  flash=Math.max(0,flash-dt*2);
  recoil=Math.max(0,recoil-dt*40);
}

/* ---------- drawing ---------- */
function cloud(x,y,s){
  ctx.beginPath();
  ctx.arc(x,y,18*s,0,TAU);ctx.arc(x+20*s,y-8*s,14*s,0,TAU);
  ctx.arc(x+38*s,y,16*s,0,TAU);ctx.arc(x+18*s,y+6*s,15*s,0,TAU);
  ctx.fill();
}
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#6ec6ff');g.addColorStop(0.7,'#bfe6ff');g.addColorStop(1,'#d8f2ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,247,174,.4)';ctx.beginPath();ctx.arc(W-110,90,58,0,TAU);ctx.fill();
  ctx.fillStyle='#fff7ae';ctx.beginPath();ctx.arc(W-110,90,42,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(const c of clouds)cloud(c.x,c.y,c.s);
  ctx.fillStyle='#79c860';ctx.beginPath();ctx.ellipse(W*0.7,GROUND+60,320,120,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#8fd973';ctx.beginPath();ctx.ellipse(W*0.25,GROUND+70,260,100,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#5aa843';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#4c9238';ctx.fillRect(0,GROUND,W,4);
  ctx.fillStyle='#e8d9b0';
  for(let x=30;x<W;x+=70)ctx.fillRect(x,GROUND-26,6,26);
  ctx.fillRect(0,GROUND-22,W,4);ctx.fillRect(0,GROUND-10,W,4);
}
function drawBalloon(b){
  const y=b.y+Math.sin(b.ph)*b.amp,r=b.r;
  ctx.save();ctx.translate(b.x,y);
  ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,r);ctx.quadraticCurveTo(4,r+14,-2,r+26);ctx.stroke();
  ctx.fillStyle=b.col;
  ctx.beginPath();ctx.ellipse(0,0,r*0.85,r,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.moveTo(-4,r);ctx.lineTo(4,r);ctx.lineTo(0,r+6);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';
  ctx.beginPath();ctx.ellipse(-r*0.3,-r*0.35,r*0.22,r*0.32,-0.5,0,TAU);ctx.fill();
  if(b.kind===2){
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-5,-2);ctx.lineTo(5,-2);ctx.moveTo(0,-7);ctx.lineTo(0,3);ctx.stroke();
  }
  ctx.restore();
}
function drawArrow(a){
  const an=Math.atan2(a.vy,a.vx);
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(an);
  ctx.strokeStyle='#8b5a2b';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(0,0);ctx.stroke();
  ctx.fillStyle='#ccc';
  ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-4);ctx.lineTo(-4,4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e33';
  ctx.beginPath();ctx.moveTo(-26,0);ctx.lineTo(-20,-4);ctx.lineTo(-16,0);ctx.lineTo(-20,4);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawArcher(){
  const b=bowPos(),an=aimAngle();
  const bx=b.x-Math.cos(an)*recoil,by=b.y-Math.sin(an)*recoil;
  ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(AX,AY+4,26,6,0,0,TAU);ctx.fill();
  ctx.fillStyle='#3b3b6d';ctx.fillRect(AX-12,AY-20,9,20);ctx.fillRect(AX+3,AY-20,9,20);
  ctx.fillStyle='#c0392b';ctx.fillRect(AX-14,AY-44,28,26);
  ctx.fillStyle='#5d3a1a';ctx.fillRect(AX-14,AY-22,28,4);
  ctx.fillStyle='#f2c9a0';ctx.fillRect(AX-9,AY-60,18,16);
  ctx.fillStyle='#8e44ad';ctx.fillRect(AX-11,AY-64,22,8);ctx.fillRect(AX-11,AY-60,5,14);
  ctx.fillStyle='#222';ctx.fillRect(AX+3,AY-55,3,3);
  ctx.save();ctx.translate(bx,by);ctx.rotate(an);
  const nock=8-power*26;
  ctx.strokeStyle='#eee';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(10,-34);ctx.lineTo(nock,0);ctx.lineTo(10,34);ctx.stroke();
  ctx.strokeStyle='#7a4a1f';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(10,-34);ctx.quadraticCurveTo(30,0,10,34);ctx.stroke();
  if(down&&state==='play'){
    ctx.strokeStyle='#8b5a2b';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(nock,0);ctx.lineTo(nock+44,0);ctx.stroke();
    ctx.fillStyle='#ccc';
    ctx.beginPath();ctx.moveTo(nock+50,0);ctx.lineTo(nock+40,-4);ctx.lineTo(nock+40,4);ctx.closePath();ctx.fill();
  }
  ctx.restore();
  ctx.strokeStyle='#f2c9a0';ctx.lineWidth=5;
  ctx.beginPath();ctx.moveTo(AX+6,AY-40);ctx.lineTo(bx,by);ctx.stroke();
  if(down&&state==='play'){
    const sp=arrowSpeed();
    let x=bx+Math.cos(an)*46,y=by+Math.sin(an)*46,vx=Math.cos(an)*sp,vy=Math.sin(an)*sp;
    ctx.fillStyle='rgba(255,255,255,.7)';
    for(let i=0;i<40;i++){
      vy+=520/60;x+=vx/60;y+=vy/60;
      if(i%4===0){ctx.beginPath();ctx.arc(x,y,2,0,TAU);ctx.fill();}
      if(x>W||y>H)break;
    }
  }
}
function drawHUD(){
  ctx.textAlign='left';
  ctx.font='14px "Press Start 2P"';
  ctx.fillStyle='#fff';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=4;
  ctx.strokeText('SCORE '+score,16,30);ctx.fillText('SCORE '+score,16,30);
  ctx.font='10px "Press Start 2P"';
  ctx.strokeText('TARGET '+TARGET,16,50);ctx.fillText('TARGET '+TARGET,16,50);
  for(let i=0;i<3;i++){
    ctx.globalAlpha=i<lives?1:0.25;
    ctx.fillStyle='#ff4444';
    ctx.beginPath();ctx.ellipse(W-30-i*30,26,9,11,0,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath();ctx.ellipse(W-33-i*30,22,2.5,3.5,-0.5,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
  const px=18,py=H-170,pw=18,ph=120;
  ctx.fillStyle='#000';ctx.fillRect(px-3,py-3,pw+6,ph+6);
  ctx.fillStyle='#c0c0c0';ctx.fillRect(px-2,py-2,pw+4,ph+4);
  ctx.fillStyle='#444';ctx.fillRect(px,py,pw,ph);
  const h=ph*power;
  ctx.fillStyle=power<0.5?'#4c4':power<0.8?'#cc4':'#e33';
  ctx.fillRect(px,py+ph-h,pw,h);
  ctx.font='8px "Press Start 2P"';ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.lineWidth=3;
  ctx.strokeText('PWR',px+pw/2,py+ph+16);ctx.fillText('PWR',px+pw/2,py+ph+16);
}
function blink(txt,x,y){
  ctx.globalAlpha=0.55+0.45*Math.sin(time*5);
  ctx.font='13px "Press Start 2P"';ctx.fillStyle='#fff';
  ctx.fillText(txt,x,y);ctx.globalAlpha=1;
}
function drawOverlay(){
  ctx.fillStyle='rgba(0,0,32,.6)';ctx.fillRect(0,0,W,H);
  const cx=W/2;ctx.textAlign='center';
  ctx.lineWidth=6;ctx.strokeStyle='#000';
  if(state==='title'){
    ctx.font='38px "Press Start 2P"';ctx.fillStyle='#ffd700';
    ctx.strokeText('ARCHERY 95',cx,170);ctx.fillText('ARCHERY 95',cx,170);
    ctx.font='14px "Press Start 2P"';ctx.fillStyle='#fff';
    ctx.fillText('LEVEL 1',cx,214);
    ctx.font='11px "Press Start 2P"';
    ctx.fillText('AIM WITH THE MOUSE - HOLD TO DRAW - RELEASE TO FIRE',cx,300);
    ctx.fillText('POP BALLOONS AND REACH '+TARGET+' POINTS',cx,330);
    ctx.fillText('IF A BALLOON ESCAPES YOU LOSE A LIFE - 3 LIVES',cx,360);
    blink('CLICK TO START',cx,430);
  }else if(state==='over'){
    ctx.font='36px "Press Start 2P"';ctx.fillStyle='#ff5555';
    ctx.strokeText('GAME OVER',cx,200);ctx.fillText('GAME OVER',cx,200);
    ctx.font='14px "Press Start 2P"';ctx.fillStyle='#fff';
    ctx.fillText('SCORE '+score,cx,260);
    blink('CLICK TO RETRY',cx,340);
  }else{
    ctx.font='30px "Press Start 2P"';ctx.fillStyle='#7dff7d';
    ctx.strokeText('LEVEL 1 COMPLETE!',cx,200);ctx.fillText('LEVEL 1 COMPLETE!',cx,200);
    ctx.font='14px "Press Start 2P"';ctx.fillStyle='#fff';
    ctx.fillText('FINAL SCORE '+score,cx,260);
    blink('CLICK TO PLAY AGAIN',cx,340);
  }
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawSky();
  for(const b of balloons)drawBalloon(b);
  for(const a of arrows)drawArrow(a);
  drawArcher();
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,1-p.t/p.life);
    if(p.ring){
      ctx.strokeStyle=p.col;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(p.x,p.y,6+(p.t/p.life)*30,0,TAU);ctx.stroke();
    }else{
      ctx.fillStyle=p.col;
      ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
    }
  }
  ctx.globalAlpha=1;
  ctx.textAlign='center';
  for(const p of pops){
    ctx.globalAlpha=Math.max(0,1-p.t/0.9);
    ctx.font=p.small?'9px "Press Start 2P"':'13px "Press Start 2P"';
    ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;
    ctx.strokeText(p.txt,p.x,p.y-p.t*40);ctx.fillText(p.txt,p.x,p.y-p.t*40);
  }
  ctx.globalAlpha=1;
  drawHUD();
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,0,0,'+(flash*0.25)+')';ctx.fillRect(0,0,W,H);}
  if(state!=='play')drawOverlay();
}

/* ---------- input ---------- */
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  mx=(e.clientX-r.left)*(W/r.width);
  my=(e.clientY-r.top)*(H/r.height);
});
cv.addEventListener('mousedown',e=>{
  e.preventDefault();ac();
  if(state!=='play'){S.click();reset();state='play';return;}
  down=true;power=0;pdir=1;
});
window.addEventListener('mouseup',()=>{if(state==='play'&&down)fire();});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
