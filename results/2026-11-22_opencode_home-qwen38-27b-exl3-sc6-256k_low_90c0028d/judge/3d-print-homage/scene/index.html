<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa — low poly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f0e5cf}
  #c{display:block;width:100vw;height:100vh}
  .cap{position:fixed;left:16px;bottom:12px;font-family:"Noto Serif JP",serif;
       color:#274b63;font-size:13px;line-height:1.5;opacity:.9;pointer-events:none;letter-spacing:.03em}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">The Great Wave off Kanagawa — after Katsushika Hokusai, c. 1831 (public domain)<br>low-poly interpretation</div>
<script type="module">
import * as THREE from 'three';

// ---- palette taken from the print -------------------------------------
const C = {
  paper:    0xf0e5cf,
  deep:     0x24496b,   // main wave indigo
  deeper:   0x1a3350,   // troughs
  mid:      0x5a89a8,   // light band on wave face
  foam:     0xeef0e9,   // foam white
  waterLt:  0x8aa6b8,   // light water patches
  fujiDark: 0x33465c,
  fujiMid:  0x7d8b96,
  fujiSnow: 0xf7f6f1,
  hull:     0xd8896a,   // salmon boat hull
  hullDark: 0x22384f,   // gunwale
  figure:   0xefece2,
};

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(C.paper);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C.paper, 26, 46);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0.6, 7.9, 15.2);
camera.lookAt(0.2, 2.2, 0);

// ---- wave surface (shared by geometry + foam dots) ----------------------
// v: 0 = waterline, 0.5 = crest, 1 = end of the foam curl (hanging mid-face,
// like the print's claw, so the broad indigo face stays visible below it)
const waveH = x => 3.0 + 4.4 * Math.exp(-Math.pow((x + 2) / 3.2, 2)); // tall left, lower right swell
function ySurf(x, v) {
  const H = waveH(x);
  if (v < 0.5) return H * (v / 0.5);
  const th = (v - 0.5) * Math.PI; // 0..pi/2 curl
  return H * 0.70 + H * 0.30 * Math.cos(th);
}
function zSurf(x, v) {
  if (v < 0.5) return 2.2 + 0.35 * (v / 0.5) + 0.5 * Math.sin(x * 0.4) * v;
  const th = (v - 0.5) * Math.PI;
  return 2.55 + 1.55 * Math.sin(th) + 0.5 * Math.sin(x * 0.4) * v;
}

function waveColor(v) {
  if (v < 0.10) return C.deeper;
  if (v < 0.42) return C.deep;
  if (v < 0.55) return C.mid;
  return C.foam; // the foam claw on the crest/curl
}

function buildWave(len, x0, z0, ny, nx) {
  const pos = [], col = [], idx = [];
  for (let i = 0; i <= nx; i++) {
    const x = x0 + (i / nx) * len;
    for (let j = 0; j <= ny; j++) {
      const v = j / ny;
      pos.push(x, ySurf(x, v), z0 + zSurf(x, v));
      const c = new THREE.Color(waveColor(v));
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    const a = i * (ny + 1) + j, b = a + ny + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const waveGroup = new THREE.Group();
const waveMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide });
waveGroup.add(new THREE.Mesh(buildWave(18, -9, 0, 22, 96), waveMat));
scene.add(waveGroup);

// ---- foam stipple dots (the print's white specks on the wave face) -------
const dotGeo = new THREE.IcosahedronGeometry(1, 0);
const dotMat = new THREE.MeshBasicMaterial({ color: C.foam });
const DOTS = 240;
const dots = new THREE.InstancedMesh(dotGeo, dotMat, DOTS);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
for (let i = 0; i < DOTS; i++) {
  const x = -9 + Math.random() * 18;
  const v = 0.18 + Math.random() * 0.62;           // on the face, below the foam band
  p.set(x, ySurf(x, v) + 0.05, zSurf(x, v) + 0.05);
  s.setScalar(0.05 + Math.random() * 0.09);
  m4.compose(p, q.identity(), s);
  dots.setMatrixAt(i, m4);
}
scene.add(dots);

// ---- water plane, mottled like the print's lower area -------------------
const waterGeo = new THREE.PlaneGeometry(46, 26, 56, 34);
waterGeo.rotateX(-Math.PI / 2);
{
  const pAttr = waterGeo.attributes.position;
  const cols = [];
  for (let i = 0; i < pAttr.count; i++) {
    const x = pAttr.getX(i), z = pAttr.getZ(i);
    const n = Math.sin(x * 0.7 + 2.1) * Math.sin(z * 0.55 + 0.7);
    cols.push(...(n > 0.5 ? [0x8a, 0xa6, 0xb8].map(v => v / 255) : [0x24, 0x49, 0x6b].map(v => v / 255)));
  }
  waterGeo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
}
const water = new THREE.Mesh(waterGeo, new THREE.MeshBasicMaterial({ vertexColors: true }));
water.position.y = -0.12;
scene.add(water);
const waterBase = waterGeo.attributes.position.array.slice();

// ---- right swell (the smaller wave climbing toward Fuji) ----------------
const rightWave = new THREE.Mesh(
  buildWave(11, 0.5, 0, 16, 48).applyMatrix4(new THREE.Matrix4().makeTranslation(0, 0, 0)),
  new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })
);
// lower it: scale waveH effect via geometry transform is easiest by rebuilding smaller
rightWave.geometry.dispose();
rightWave.geometry = (function () {
  const pos = [], col = [], idx = [];
  const H = 2.6;
  for (let i = 0; i <= 48; i++) {
    const x = 0.5 + (i / 48) * 11;
    for (let j = 0; j <= 16; j++) {
      const v = j / 16;
      const y = v < 0.5 ? H * (v / 0.5) : H * 0.45 + H * 0.55 * Math.cos((v - 0.5) * Math.PI);
      const z = v < 0.5 ? -2.2 + 0.25 * v : -2.075 + 2.2 * Math.sin((v - 0.5) * Math.PI);
      pos.push(x, y, z);
      const c = new THREE.Color(v < 0.55 ? C.mid : C.foam);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < 48; i++) for (let j = 0; j < 16; j++) {
    const a = i * 17 + j, b = a + 17;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
})();
scene.add(rightWave);

// ---- Mount Fuji ----------------------------------------------------------
{
  const g = new THREE.ConeGeometry(2.1, 3.4, 7);
  const pAttr = g.attributes.position;
  const cols = [];
  for (let i = 0; i < pAttr.count; i++) {
    const y = pAttr.getY(i);
    const c = y > 1.7 ? C.fujiSnow : (y > 0.6 ? C.fujiMid : C.fujiDark);
    const cc = new THREE.Color(c);
    cols.push(cc.r, cc.g, cc.b);
  }
  // fix: rebuild properly
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  const fuji = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  fuji.position.set(3.6, 0.5, -7.6);
  scene.add(fuji);
}

// ---- clouds (upper right, like the print) -------------------------------
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xfbf9f2, transparent: true, opacity: 0.92 });
const clouds = new THREE.Group();
[[5.5, 8.6, -9.5, 1.7], [7.0, 7.7, -9.0, 1.2], [4.3, 7.4, -10.5, 1.4]].forEach(([x, y, z, r]) => {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), cloudMat);
  m.position.set(x, y, z);
  m.scale.set(1.6, 0.55, 1);
  clouds.add(m);
});
scene.add(clouds);

// ---- boats (three, as in the print) -------------------------------------
function makeBoat() {
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(-1.5, -0.12);
  shape.lineTo(-1.85, 0.05);          // stern
  shape.lineTo(-1.4, 0.42);
  shape.lineTo(1.0, 0.48);
  shape.lineTo(1.85, 0.12);          // pointed bow
  shape.lineTo(0.9, -0.12);
  shape.closePath();
  const hull = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth: 0.42, bevelEnabled: false }),
    new THREE.MeshBasicMaterial({ color: C.hull, side: THREE.DoubleSide })
  );
  hull.geometry.rotateX(-Math.PI / 2);
  g.add(hull);
  const rail = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.09, 0.4), new THREE.MeshBasicMaterial({ color: C.hullDark }));
  rail.position.y = 0.44;
  g.add(rail);
  // hunched crew, small white figures
  for (let i = 0; i < 4; i++) {
    const f = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.26, 5), new THREE.MeshBasicMaterial({ color: C.figure }));
    f.position.set(-0.7 + i * 0.42, 0.58, 0);
    f.rotation.x = -0.55;
    g.add(f);
  }
  return g;
}
const boats = [];
function placeBoat(x, y, z, rz, scale) {
  const b = makeBoat();
  b.position.set(x, y, z);
  b.rotation.z = rz;
  b.scale.setScalar(scale);
  b.userData = { baseY: y, baseRz: rz, phase: Math.random() * 6.28 };
  scene.add(b);
  boats.push(b);
  return b;
}
// center foreground boat (the large salmon one), left boat under the big wave, right boat on the swell
placeBoat(1.2, 0.35, 6.5, 0.30, 1.2);
placeBoat(-4.8, 0.3, 3.6, 0.55, 1.0);
placeBoat(5.0, 1.35, -0.6, 0.45, 0.95);

// ---- gentle motion -------------------------------------------------------
const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  // wave sways
  waveGroup.position.y = 0.12 * Math.sin(t * 0.55);
  waveGroup.rotation.z = 0.008 * Math.sin(t * 0.4);
  // water undulates
  const pAttr = waterGeo.attributes.position;
  for (let i = 0; i < pAttr.count; i++) {
    const x = waterBase[i * 3], z = waterBase[i * 3 + 2];
    pAttr.setY(i, 0.16 * Math.sin(x * 0.55 + t * 0.8) + 0.12 * Math.sin((x + z) * 0.35 + t * 0.6));
  }
  pAttr.needsUpdate = true;
  // boats rock and bob
  for (const b of boats) {
    const u = b.userData;
    b.position.y = u.baseY + 0.09 * Math.sin(t * 0.8 + u.phase);
    b.rotation.z = u.baseRz + 0.05 * Math.sin(t * 0.7 + u.phase * 1.3);
  }
  // clouds drift
  clouds.position.x = 0.25 * Math.sin(t * 0.12);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

window.__dbg = { camera, scene, waveGroup, water, renderer };
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
