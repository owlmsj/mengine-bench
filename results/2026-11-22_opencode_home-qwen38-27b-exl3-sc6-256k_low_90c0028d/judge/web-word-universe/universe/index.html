<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O universo das palavras | Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:rgba(16,19,28,.82);--line:rgba(255,255,255,.09);--txt:#e9ecf4;--dim:#8b93a7;--amber:#ffd28a;--acc:#7fb4ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
#scene{position:fixed;inset:0;display:block;cursor:grab}
.ui{position:fixed;z-index:10}
#top{top:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:14px 18px;pointer-events:none}
#top>*{pointer-events:auto}
#top h1{font-family:Fraunces,serif;font-weight:700;font-size:19px;letter-spacing:.02em;white-space:nowrap}
#top h1 span{color:var(--amber)}
#searchwrap{flex:0 1 340px}
#search{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);
color:var(--txt);font:15px Inter,sans-serif;outline:none;backdrop-filter:blur(8px)}
#search:focus{border-color:var(--acc)}
#hint{position:fixed;top:64px;left:18px;font-size:12px;color:var(--dim)}
#panel{top:64px;right:16px;width:300px;max-height:calc(100% - 150px);overflow:auto;padding:18px;
background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);
transition:opacity .25s}
#panel.hidden{opacity:0;pointer-events:none}
#panel h2{font-family:Fraunces,serif;font-size:30px;font-weight:700;line-height:1.1}
#tema{display:inline-block;margin:6px 0 4px;padding:3px 10px;border-radius:999px;font-size:12px;
letter-spacing:.06em;text-transform:uppercase;color:var(--acc);border:1px solid var(--line)}
h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);
font-size:13px;color:var(--txt);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--amber);color:var(--amber)}
#clear{margin-top:16px;width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);
background:transparent;color:var(--dim);font:13px Inter,sans-serif;cursor:pointer}
#clear:hover{color:var(--txt);border-color:var(--txt)}
#stats{left:18px;bottom:14px;font-size:12px;color:var(--dim);line-height:1.7}
#stats b{color:var(--txt);font-weight:600}
#fallback{position:fixed;inset:0;padding:24px;overflow:auto;background:var(--bg);display:none}
#fallback h2{font-family:Fraunces,serif;margin-bottom:12px}
#fallback .w{margin:8px 0;font-size:14px;color:var(--dim)}
#fallback .w b{color:var(--txt)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="ui" id="top">
  <h1>O universo das <span>palavras</span></h1>
  <div id="searchwrap">
    <input id="search" list="wordlist" placeholder="buscar palavra…" autocomplete="off">
    <datalist id="wordlist"></datalist>
  </div>
</div>
<div class="ui" id="hint">arraste para girar · role para aproximar · clique numa palavra</div>
<div class="ui" id="panel">
  <h2 id="p-word"></h2><span id="tema"></span>
  <div id="p-body"></div>
  <button id="clear">limpar seleção</button>
</div>
<div class="ui" id="stats"></div>
<div id="fallback"></div>

const ALIAS = {"saudades":"saudade","coracoes":"corão","paixoes":"paixão"};
const words = Object.keys(DATA);
const rel = {};
for (const w of words){ rel[w]=new Set([...DATA[w].sinonimos, ...DATA[w].analogas]); }
const rev = {};
for (const w of words) for (const t of rel[w]) (rev[t] ??= new Set()).add(w);
const pairSet = new Set();
for (const w of words) for (const t of rel[w]) pairSet.add([w,t].sort().join('|'));
const pairCount = pairSet.size;
const deg = Object.fromEntries(words.map(w=>[w,rel[w].size+(rev[w]?.size||0)]));
const top = [...words].sort((a,b)=>deg[b]-deg[a]||a.localeCompare(b,'pt'))[0];

  `<b>${words.length}</b> palavras · <b>${pairCount}</b> relações · a mais conectada é <b>${top}</b> (${deg[top]})`;
const dl = document.getElementById('wordlist');
for (const w of words){ const o=document.createElement('option'); o.value=w; dl.appendChild(o); }

function resolve(word){
  if (!word) return null;
  if (DATA[word]) return word;
  const k = word.toLowerCase();
  if (ALIAS[k]) return ALIAS[k];
  return words.find(w=>w.toLowerCase()===k) || null;
}
const panel=document.getElementById('panel'), pWord=document.getElementById('p-word'),
      pTema=document.getElementById('tema'), pBody=document.getElementById('p-body');
function chips(list){ const d=document.createElement('div'); d.className='chips';
  for (const t of list){ const c=document.createElement('span'); c.className='chip'; c.textContent=t;
    c.onclick=()=>select(t); d.appendChild(c); } return d; }
let sel = null;
function select(word){
  const w = typeof word==='string' ? resolve(word.trim()) : null;
  sel = w;
  if (!w){ panel.classList.add('hidden'); }
  else{
    const D=DATA[w];
    pWord.textContent=w; pTema.textContent=D.tema; pBody.innerHTML='';
    if (D.sinonimos.length){ const h=document.createElement('h3');
      h.textContent=`sinônimos · ${D.sinonimos.length}`; pBody.appendChild(h); pBody.appendChild(chips(D.sinonimos)); }
    if (D.analogas.length){ const h=document.createElement('h3');
      h.textContent=`palavras análogas · ${D.analogas.length}`; pBody.appendChild(h); pBody.appendChild(chips(D.analogas)); }
    panel.classList.remove('hidden');

  history.replaceState(null,'', w? `?word=${encodeURIComponent(w)}` : location.pathname);
  window.__applySel && window.__applySel();
}

      const s= w===sel ? 2 : (nb&&nb.has(w))?1:0;
      n.mesh.material.opacity = s===2?1 : s===1?.95 : (sel?.07:.95);
      n.sprite.material.opacity = s===2?1 : s===1?.95 : (sel?.05:.85);
      n.mesh.scale.setScalar(s===2?2.1:1);
      n.mesh.material.color.setHSL(s===2?.09:s===1?.6:.6, s===2?.75:.25, s===2?.68:.55);
      if (s){ n.mesh.material.emissive.setHSL(.09,.9,.25); n.mesh.material.emissiveIntensity=s===2?1:.4; }
      else n.mesh.material.emissive.set(0x000000);
    }
    dimMat.opacity = sel? .04 : .16;
    if (actLines){ world.remove(actLines); actLines.geometry.dispose(); actLines=null; }
    if (sel){
      const pairs=edgePairs.filter(p=>p[0]===sel||p[1]===sel);
      actLines=new THREE.LineSegments(buildEdges(pairs),actMat); world.add(actLines);
    }
  };
  // ---- interaction: orbit + zoom + click ----
  let yaw=.4, pitch=.18, dragging=false, px=0, py=0, moved=0;
  function layout(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize',layout); layout();
  canvas.addEventListener('pointerdown',e=>{ dragging=true; moved=0; px=e.clientX; py=e.clientY; });
  addEventListener('pointerup',()=>dragging=false);
  addEventListener('pointermove',e=>{
    if (!dragging) return;
    const dx=e.clientX-px, dy=e.clientY-py; moved+=Math.abs(dx)+Math.abs(dy);
    px=e.clientX; py=e.clientY; yaw+=dx*.005; pitch=Math.max(-1.3,Math.min(1.3,pitch+dy*.005));
  });
  canvas.addEventListener('wheel',e=>{ e.preventDefault();
    const d=camera.position.length()*(e.deltaY>0?1.08:0.93);
    camera.position.setLength(Math.max(24,Math.min(140,d))); },{passive:false});
  const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
  canvas.addEventListener('click',e=>{
    if (moved>6) return;
    mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight*2)+1);
    ray.setFromCamera(mouse,camera);
    const hit=ray.intersectObjects(meshList)[0];
    select(hit? hit.object.userData.word : null);
  });
  const clock=new THREE.Clock();
  (function tick(){
    requestAnimationFrame(tick);
    if (!dragging) yaw+=0.0006;
    const r=camera.position.length();
    camera.position.set(r*Math.sin(yaw)*Math.cos(pitch), r*Math.sin(pitch), r*Math.cos(yaw)*Math.cos(pitch));
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  })();
  select(new URLSearchParams(location.search).get('word')||'');
}).catch(showFallback);
</script>
</body>
