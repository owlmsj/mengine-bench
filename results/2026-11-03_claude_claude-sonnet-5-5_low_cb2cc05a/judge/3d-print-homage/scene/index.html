<!doctype html><html><head><meta charset="utf-8"><title>Great Wave low poly</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8d9b0}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,300);cam.position.set(0,5,34);cam.lookAt(0,5,0);
S.add(new THREE.HemisphereLight(0xfff4dc,0x1b3a6b,1.6));const dl=new THREE.DirectionalLight(0xffffff,1.4);dl.position.set(-8,14,12);S.add(dl);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const mat=(c)=>new THREE.MeshLambertMaterial({color:c,flatShading:true,vertexColors:false});
// sky: parchment gradient, grey-dark band near horizon like the print
const cv=document.createElement('canvas');cv.width=4;cv.height=256;const g=cv.getContext('2d');
const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#e0c88e');gr.addColorStop(.45,'#ecdcb4');gr.addColorStop(.72,'#e6dcc6');gr.addColorStop(.9,'#6e6a6a');gr.addColorStop(1,'#3d3f46');
g.fillStyle=gr;g.fillRect(0,0,4,256);const sky=new THREE.Mesh(new THREE.PlaneGeometry(260,110),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),fog:false}));sky.position.set(0,18,-90);S.add(sky);
// cloud polys
for(let i=0;i<7;i++){const c=new THREE.Mesh(new THREE.IcosahedronGeometry(3+rnd()*3,0),new THREE.MeshBasicMaterial({color:0xf4ead2}));c.scale.set(2.4,.5,.2);c.position.set(2+rnd()*30,12+rnd()*8,-80);S.add(c)}
// Fuji
const fuji=new THREE.Group();const fb=new THREE.Mesh(new THREE.ConeGeometry(7,5.5,7,1),mat(0x1f3f73));fuji.add(fb);
const cap=new THREE.Mesh(new THREE.ConeGeometry(3.4,2.6,7,1),mat(0xf6f3ea));cap.position.y=1.45;fuji.add(cap);
fuji.position.set(6,2.2,-40);fuji.scale.setScalar(1.5);S.add(fuji);
// sea heightfield
const W=120,D=70,nx=90,nz=50;const sg=new THREE.PlaneGeometry(W,D,nx,nz);sg.rotateX(-Math.PI/2);
const P=sg.attributes.position;sg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(P.count*3),3));
const base=[];for(let i=0;i<P.count;i++)base.push([P.getX(i),P.getZ(i)]);
const dark=new THREE.Color(0x14336a),mid=new THREE.Color(0x3a74a8),pale=new THREE.Color(0xbfdde6),white=new THREE.Color(0xf7f4ea),ng=new THREE.Color(0x2c2f38);
function hf(x,z,t){// foreground swells: big right-hand swell and bottom-left swell
 let h=1.2*Math.sin(x*.35+t*.8+z*.2)+.6*Math.sin(x*.9-t*1.2+z*.6);
 h+=7*Math.exp(-((x-26)**2)/90-((z-6)**2)/160);
 h+=5.5*Math.exp(-((x+8)**2)/50-((z-14)**2)/50);
 return h}
const col=new THREE.Color();
function upd(t){for(let i=0;i<P.count;i++){const [x,z]=base[i];const h=hf(x,z+35,t);P.setY(i,h-1.5-(z<-20?(z+20)*.0:0));
 const far=THREE.MathUtils.clamp((-z-12)/20,0,1);
 if(h>6)col.copy(white);else if(h>3.6)col.lerpColors(pale,white,(h-3.6)/2.4);else if(h>1.2)col.lerpColors(mid,pale,(h-1.2)/2.4);else col.lerpColors(dark,mid,Math.max(0,(h+1.5)/2.7));
 col.lerp(ng,far*.8);sg.attributes.color.setXYZ(i,col.r,col.g,col.b)}
 P.needsUpdate=true;sg.attributes.color.needsUpdate=true;sg.computeVertexNormals()}
const sea=new THREE.Mesh(sg,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true}));sea.position.set(0,0,-2);S.add(sea);
// the great wave: swept profile
const prof=[[-26,-2],[-20,1],[-15,5],[-11,9.5],[-8,13.5],[-5,15.8],[-2,16],[1.5,14.6],[4,12],[4.6,9.4],[3.4,7.2],[1.4,7.4],[-0.2,9],[-1.6,6.5],[-2.8,3],[-4,-2]];
const wg=new THREE.BufferGeometry();const pos=[],cols=[];const ZS=[-5,-2,1.5,4];
const cD=new THREE.Color(0x15356f),cM=new THREE.Color(0x2b5a98),cW=new THREE.Color(0xf6f3ea);
function V(p,c){pos.push(...p);cols.push(c.r,c.g,c.b)}
for(let k=0;k<prof.length-1;k++){const a=prof[k],b=prof[k+1];const crest=k<4||false;
 for(let j=0;j<ZS.length-1;j++){const z0=ZS[j]+rnd()*.4,z1=ZS[j+1]+rnd()*.4;const q=[[a[0],a[1],z0],[b[0],b[1],z0],[b[0],b[1],z1],[a[0],a[1],z1]];
  const top=a[1]>8&&k<8,under=k>=8;let c=top?cW:(under?(k%2?cD:cM):cW);
  if(k>=4&&k<8)c=cW;
  const c2=c.clone().offsetHSL(0,0,(rnd()-.5)*.06);
  V(q[0],c2);V(q[1],c2);V(q[2],c2);V(q[0],c2);V(q[2],c2);V(q[3],c2)}}
wg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));wg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));wg.computeVertexNormals();
const wave=new THREE.Mesh(wg,new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true,side:THREE.DoubleSide}));wave.position.set(-2,-1,-6);wave.scale.set(1,1,2.5);S.add(wave);
// dark blue inner face wedge under the curl
const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(4.6,0),mat(0x16377a));inner.scale.set(1.2,2,.8);inner.position.set(-3.5,7,-5);S.add(inner);
for(let i=0;i<5;i++){const s=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,0),mat(i%2?0x24508f:0x14316b));s.scale.set(.7,1.8,.6);s.position.set(-7+i*1.9,5.8-i*.5,-3.4);s.rotation.z=.4;S.add(s)}
// foam claws
const claws=[];const wm=mat(0xfaf8f0);
for(let i=0;i<42;i++){const a=i/42*Math.PI*1.1;const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.35+rnd()*.7,0),wm);
 m.position.set(-8+i*.28+rnd()*2,15.6-Math.abs(Math.sin(a))*.0-(i>24?(i-24)*.55:0)+rnd()*1.5,-3.5+rnd()*2);m.userData={y:m.position.y,p:rnd()*6};S.add(m);claws.push(m)}
// spray flecks
for(let i=0;i<60;i++){const m=new THREE.Mesh(new THREE.TetrahedronGeometry(.12+rnd()*.15,0),wm);m.position.set(-12+rnd()*26,3+rnd()*13,-3+rnd()*4);m.userData={y:m.position.y,p:rnd()*6};S.add(m);claws.push(m)}
// boats
const boats=[];const hull=mat(0xe2a780),rower=mat(0x1e3f7a);
function boat(x,y,z,ry,rz,len){const b=new THREE.Group();
 const h=new THREE.Mesh(new THREE.BoxGeometry(len,.5,1.2),hull);h.scale.set(1,1,1);b.add(h);
 const bow=new THREE.Mesh(new THREE.ConeGeometry(.6,1.6,4),hull);bow.rotation.z=Math.PI/2;bow.position.x=len/2+.6;b.add(bow);
 const st=new THREE.Mesh(new THREE.ConeGeometry(.6,1.6,4),hull);st.rotation.z=-Math.PI/2;st.position.x=-len/2-.6;b.add(st);
 const thatch=new THREE.Mesh(new THREE.BoxGeometry(len*.4,.4,1),mat(0xb08a5c));thatch.position.set(0,.4,0);b.add(thatch);
 for(let i=0;i<5;i++){const r=new THREE.Mesh(new THREE.IcosahedronGeometry(.3,0),rower);r.position.set(len*.2+i*.55,.5,(i%2?.25:-.25));b.add(r)}
 b.position.set(x,y,z);b.rotation.set(0,ry,rz);b.userData={y,p:rnd()*6,rz};S.add(b);boats.push(b)}
boat(-17,2.2,-3,-0.3,-0.45,6);   // left, half-swallowed by the wave
boat(14,5.4,-8,0.15,0.5,7);      // right, climbing swell near Fuji
boat(5,-1,2,0.05,-0.25,8);       // foreground, lower centre
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth/innerHeight<1.4?55:40;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const clk=new THREE.Clock();
R.setAnimationLoop(()=>{const t=clk.getElapsedTime();upd(t*.6);
 boats.forEach(b=>{b.position.y=b.userData.y+Math.sin(t*.9+b.userData.p)*.35;b.rotation.z=b.userData.rz+Math.sin(t*.7+b.userData.p)*.06});
 claws.forEach(m=>{m.position.y=m.userData.y+Math.sin(t*1.5+m.userData.p)*.25;m.rotation.y=t+m.userData.p});
 wave.position.y=-1+Math.sin(t*.5)*.25;cam.position.x=Math.sin(t*.15)*1.2;cam.lookAt(0,5,0);R.render(S,cam)});
</script></body></html>
