function step(){const k=tick<300?1:.2;for(let i=0;i<names.length;i++){const a=P[names[i]];for(let j=i+1;j<names.length;j++){const b=P[names[j]];let dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy+.1;if(d>90000)continue;const f=900/d;dx*=f;dy*=f;a.vx+=dx;a.vy+=dy;b.vx-=dx;b.vy-=dy}a.vx-=a.x*.002;a.vy-=a.y*.002}
E.forEach(([p,q])=>{const a=P[p],b=P[q],dx=b.x-a.x,dy=b.y-a.y,f=.01;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f});
names.forEach(n=>{const a=P[n];a.x+=a.vx*.5*k;a.y+=a.vy*.5*k;a.vx*=.6;a.vy*=.6});tick++}
const sc=()=>Math.min(w,h)/900*1.0;
const sx=n=>w/2+P[n].x*sc()*(sel?1:1),sy=n=>h/2+P[n].y*sc();
function draw(){if(tick<500)step();x.clearRect(0,0,w,h);
let cx=0,cy=0;if(sel){cx=P[sel].x;cy=P[sel].y}
const z=sel?1.6:1,X=n=>w/2+(P[n].x-cx)*sc()*z,Y=n=>h/2+(P[n].y-cy)*sc()*z;
const nb=sel?new Set(W[sel]):null,act=n=>!sel||n==sel||nb.has(n);
E.forEach(([a,b])=>{const hi=sel&&(a==sel||b==sel);x.strokeStyle=hi?(S[a+'|'+b]=='s'?'#ffd36e':'#7fd'):'rgba(150,160,200,'+(sel?.05:.18)+')';x.lineWidth=hi?2:.7;
x.beginPath();x.moveTo(X(a),Y(a));x.lineTo(X(b),Y(b));x.stroke()});
names.forEach(n=>{const r=3+Math.sqrt(W[n].length)*2.2+(n==sel?5:0);x.globalAlpha=act(n)?1:.2;x.fillStyle=col(n);x.beginPath();x.arc(X(n),Y(n),r,0,7);x.fill();
if(act(n)&&(sel||W[n].length>=7||n==hov)){x.fillStyle='#fff';x.font=(n==sel?'bold 16px':'12px')+' system-ui';x.fillText(n,X(n)+r+3,Y(n)+4)}});
x.globalAlpha=1;draw.X=X;draw.Y=Y;requestAnimationFrame(draw)}
draw();
function pick(e){let b=null,bd=200;names.forEach(n=>{const dx=draw.X(n)-e.clientX,dy=draw.Y(n)-e.clientY,d=dx*dx+dy*dy;if(d<bd){bd=d;b=n}});return b}
cv.onmousemove=e=>{hov=pick(e);cv.style.cursor=hov?'pointer':''};
cv.onclick=e=>{const n=pick(e);if(n)go(n)};
function go(n,push=true){sel=n;q.value=n;sg.innerHTML='';if(push)history.replaceState(0,'','?word='+encodeURIComponent(n));
const syn=W[n].filter(m=>S[[n,m].sort().join('|')]=='s'),an=W[n].filter(m=>!syn.includes(m));
const L=(t,a)=>a.length?`<div class=k>${t}</div>`+a.map(m=>`<div class=n data-w="${m}" style="color:${col(m)}">${m}</div>`).join(''):'';
i.innerHTML=`<h2 style="color:${col(n)}">${n}</h2><div class=k>tema: ${T[n]||'-'} · ${W[n].length} ligações</div>`+L('Sinônimos',syn)+L('Análogas',an);
i.querySelectorAll('.n').forEach(e=>e.onclick=()=>go(e.dataset.w));
document.getElementById('l').textContent=`${names.length} palavras · ${E.length} relações · clique num nó ou busque`}
function none(){sel=null;i.innerHTML='';l.textContent=`${names.length} palavras · ${E.length} relações · amarelo = sinônimo, ciano = análoga`}
q.oninput=()=>{const t=norm(q.value.trim());sg.innerHTML='';if(!t){none();return}
const m=names.filter(n=>norm(n).includes(t)).slice(0,8);m.forEach(n=>{const d=document.createElement('div');d.textContent=n;d.onclick=()=>go(n);sg.appendChild(d)});
if(!m.length)sg.textContent='nada encontrado'};
q.onkeydown=e=>{if(e.key=='Enter'){const t=norm(q.value.trim()),m=names.find(n=>norm(n)==t)||names.find(n=>norm(n).includes(t));if(m)go(m)}};
none();const pw=new URLSearchParams(location.search).get('word');
if(pw){const t=norm(pw.trim()),m=names.find(n=>norm(n)==t);m?go(m,false):(q.value=pw,q.oninput())}
</script></html>
