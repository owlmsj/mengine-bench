<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e1a;--ink:#e8e4da;--dim:#8b8fa3;--acc:#e0b34c;--acc2:#7fb4d8;--line:#2a2f45}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#sky{position:fixed;inset:0;z-index:0}
#ui{position:fixed;inset:0;z-index:1;pointer-events:none;display:flex;flex-direction:column}
header{padding:22px 28px 0;pointer-events:auto}
h1{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;letter-spacing:.02em}
h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:12.5px;margin-top:2px;letter-spacing:.04em}
#searchwrap{margin-top:14px;position:relative;width:min(420px,80vw)}
#q{width:100%;padding:10px 14px;border-radius:22px;border:1px solid var(--line);background:rgba(11,14,26,.72);color:var(--ink);font-size:14px;outline:none;backdrop-filter:blur(6px)}
#q:focus{border-color:var(--acc)}
#list{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(14,17,32,.95);border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto;display:none}
#list div{padding:8px 14px;cursor:pointer;font-size:13.5px;color:var(--ink)}
#list div:hover{background:rgba(224,179,76,.12)}
#list div small{color:var(--dim);float:right}
main{flex:1;pointer-events:none}
#card{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:min(340px,86vw);background:rgba(13,16,30,.82);border:1px solid var(--line);border-radius:16px;padding:22px 24px;backdrop-filter:blur(8px);pointer-events:auto;display:none}
#card h2{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;line-height:1.05}
#card .tema{color:var(--acc);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 14px}
#card h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}
#card ul{list-style:none}
#card li{margin:3px 0}
#card li a{color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer;border-bottom:1px dotted var(--line);padding-bottom:1px}
#card li a:hover{color:var(--acc)}
#card .deg{color:var(--acc2);font-size:12px;margin-top:14px}
#hint{position:fixed;left:28px;bottom:20px;color:var(--dim);font-size:12px;letter-spacing:.03em;pointer-events:none}
#stats{position:fixed;right:28px;bottom:20px;color:var(--dim);font-size:12px;letter-spacing:.03em;text-align:right;pointer-events:none}
#stats b{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="ui">
<header>
<h1>Universo de <span>Palavras</span></h1>
<div class="sub">dicionário criativo — 250 palavras, 668 laços</div>
<div id="searchwrap"><input id="q" placeholder="buscar uma palavra…" autocomplete="off"><div id="list"></div></div>
</header>
<main></main>
<aside id="card"></aside>
<div id="hint">arraste para girar · clique numa palavra</div>
<div id="stats"></div>
</div>

const words = Object.keys(WORDS);
const idx = new Map(words.map((w,i)=>[w,i]));
const adj = words.map(w=>WORDS[w].map(t=>idx.get(t)));

// --- layout: deterministic 3D positions (Fibonacci sphere + jitter by degree)
const N = words.length;
const R = 60;
const pos = [];
for(let i=0;i<N;i++){
  const y = 1 - (i/(N-1))*2;
  const r = Math.sqrt(1-y*y);
  const th = i*2.399963;
  const s = R*(0.82+0.18*Math.sin(i*12.9898));
  pos.push(new THREE.Vector3(Math.cos(th)*r*s, y*s, Math.sin(th)*r*s));
}

// --- three setup
const canvas = document.getElementById("sky");
const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0e1a,0.0035);
const cam = new THREE.PerspectiveCamera(55,1,0.1,1000);
cam.position.set(0,0,150);

const themeColor = {};
let ti=0;
for(const t of Object.keys(THEMES)){ themeColor[t] = new THREE.Color().setHSL((ti*0.618)%1,0.55,0.62); ti++; }
const defaultC = new THREE.Color(0x8b8fa3);

// nodes
const nodeGeo = new THREE.SphereGeometry(1,10,10);
const nodes = [];
words.forEach((w,i)=>{
  const m = new THREE.Mesh(nodeGeo, new THREE.MeshBasicMaterial({color:themeColor[THEMES[w]]||defaultC,transparent:true,opacity:0.9}));
  m.position.copy(pos[i]);
  m.scale.setScalar(0.7+Math.sqrt(adj[i].length)*0.35);
  m.userData.i = i;
  scene.add(m); nodes.push(m);
});
// links
{
  const arr=[];
  for(let i=0;i<N;i++) for(const j of adj[i]) if(j>i){ arr.push(pos[i].x,pos[i].y,pos[i].z,pos[j].x,pos[j].y,pos[j].z); }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(arr,3));
  scene.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x2a2f45,transparent:true,opacity:0.5})));
}
// highlight lines (rebuilt on selection)
let hlLines = null;
function setHighlight(sel){
  if(hlLines){ scene.remove(hlLines); hlLines.geometry.dispose(); hlLines=null; }
  nodes.forEach((m,i)=>{
    const mat = m.material;
    if(sel==null){ mat.opacity=0.9; mat.color.copy(themeColor[THEMES[words[i]]]||defaultC); }
    else if(i===sel){ mat.opacity=1; mat.color.set(0xe0b34c); }
    else if(adj[sel].includes(i)){ mat.opacity=1; mat.color.copy(themeColor[THEMES[words[i]]]||defaultC); }
    else { mat.opacity=0.12; mat.color.copy(defaultC); }
  });
  if(sel!=null){
    const arr=[];
    for(const j of adj[sel]) arr.push(pos[sel].x,pos[sel].y,pos[sel].z,pos[j].x,pos[j].y,pos[j].z);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(arr,3));
    hlLines = new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xe0b34c,transparent:true,opacity:0.85}));
    scene.add(hlLines);
  }
}

// labels: CSS2D-free, use sprites
function makeLabel(text,color){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const fs = 44;
  ctx.font = `600 ${fs}px Inter, sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width)+16;
  c.width = w; c.height = fs+16;
  const ctx2 = c.getContext("2d");
  ctx2.font = `600 ${fs}px Inter, sans-serif`;
  ctx2.fillStyle = color;
  ctx2.fillText(text,8,fs);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(w/14, (fs+16)/14, 1);
  return sp;
}
const labels = words.map((w,i)=>{
  const s = makeLabel(w, "#e8e4da");
  s.position.copy(pos[i]).add(new THREE.Vector3(0, 2.2+nodes[i].scale.x, 0));
  s.visible = false;
  scene.add(s); return s;
});
function showLabels(sel){
  labels.forEach((s,i)=> s.visible = sel==null ? false : (i===sel || adj[sel].includes(i)));
}

// rotation + drag
let rotY=0, rotX=0, auto=true, dragging=false, px=0, py=0;
addEventListener("resize", fit);
function fit(){
  renderer.setSize(innerWidth,innerHeight);
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
}
fit();
addEventListener("pointerdown",e=>{dragging=true;auto=false;px=e.clientX;py=e.clientY;});
addEventListener("pointerup",()=>{dragging=false;});
addEventListener("pointermove",e=>{
  if(!dragging) return;
  rotY += (e.clientX-px)*0.005; rotX += (e.clientY-py)*0.005;
  rotX = Math.max(-1.2,Math.min(1.2,rotX));
  px=e.clientX;py=e.clientY;
});
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
canvas.addEventListener("click",e=>{
  mouse.x = (e.clientX/innerWidth)*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,cam);
  const hit = ray.intersectObjects(nodes);
  if(hit.length) select(hit[0].object.userData.i);
});

// card + selection
const card = document.getElementById("card");
function select(i){
  setHighlight(i); showLabels(i);
  const w = words[i];
  const rel = adj[i].map(j=>words[j]);
  card.style.display="block";
  card.innerHTML = `<h2>${w}</h2><div class="tema">${THEMES[w]||"sem tema"}</div>
  <h3>laços (${rel.length})</h3><ul>${rel.map(r=>`<li><a data-w="${r}">${r}</a></li>`).join("")}</ul>
  <div class="deg">compartilha o universo com ${rel.length} outras palavras</div>`;
  card.querySelectorAll("a").forEach(a=>a.onclick=()=>select(idx.get(a.dataset.w)));
  history.replaceState(null,"","?word="+encodeURIComponent(w));
}
function clearSel(){
  setHighlight(null); showLabels(null);
  card.style.display="none";
  history.replaceState(null,"","");
}
card.addEventListener("click",e=>{ if(e.target===card) clearSel(); });

// search
const q = document.getElementById("q");
const list = document.getElementById("list");
q.addEventListener("input",()=>{
  const v = q.value.trim().toLowerCase();
  if(!v){ list.style.display="none"; return; }
  const hits = words.filter(w=>w.includes(v)).slice(0,12);
  list.innerHTML = hits.map(w=>`<div data-w="${w}">${w}<small>${adj[idx.get(w)].length}</small></div>`).join("");
  list.style.display = hits.length?"block":"none";
  list.querySelectorAll("div").forEach(d=>d.onclick=()=>{ select(idx.get(d.dataset.w)); list.style.display="none"; q.value=""; });
});
q.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const v=q.value.trim().toLowerCase(); const hit=words.find(w=>w===v)||words.find(w=>w.includes(v)); if(hit) select(idx.get(hit)); }
  if(e.key==="Escape"){ q.value=""; list.style.display="none"; }
});
addEventListener("keydown",e=>{ if(e.key==="Escape") clearSel(); });

// stats
document.getElementById("stats").innerHTML =
  `<b>${N}</b> palavras · <b>${LINKS}</b> laços · mais conectada: <b>${words.reduce((a,b)=>WORDS[b].length>WORDS[a].length?b:a)}</b>`;

// deep link
const m = new URLSearchParams(location.search).get("word");
if(m){
  const w2 = words.find(w=>w.toLowerCase()===m.toLowerCase());
  if(w2) select(idx.get(w2));
}

// animate
const group = new THREE.Group();
scene.add(group);
nodes.forEach(n=>group.add(n));
labels.forEach(l=>group.add(l));
let t=0;
(function loop(){
  requestAnimationFrame(loop);
  t+=0.005;
  if(auto) rotY += 0.0012;
  group.rotation.y = rotY; group.rotation.x = rotX;
  nodes.forEach((n,i)=>{ n.scale.setScalar((0.7+Math.sqrt(adj[i].length)*0.35)*(1+0.06*Math.sin(t*2+i))); });
  renderer.render(scene,cam);
})();
</script>
