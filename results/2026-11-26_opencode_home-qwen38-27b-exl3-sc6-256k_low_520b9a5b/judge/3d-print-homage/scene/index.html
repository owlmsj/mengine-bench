<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa — low poly wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8dcc0; }
  canvas { display: block; }
  #label {
    position: fixed; left: 24px; bottom: 18px; z-index: 2;
    font-family: "Shippori Mincho", serif; color: #1d3a5f;
    font-size: 15px; letter-spacing: .04em; opacity: .85;
    pointer-events: none; user-select: none;
  }
  #label b { font-size: 19px; display: block; }
</style>
</head>
<body>
<div id="label"><b>神奈川沖浪裏</b>The Great Wave off Kanagawa · low poly</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ---- palette sampled from the print ---- */
const C = {
  skyTop:   0xf3e9cf,   // cream washi sky
  skyBot:   0xd9cba6,
  prussian: 0x1d3a5f,   // deep prussian blue (wave body)
  prussian2:0x2e567f,   // mid blue
  paleBlue: 0x9db8cc,   // pale blue wave faces
  foam:     0xf7f3e8,   // off-white foam
  paper:    0xe8dcc0,   // washi
  hull:     0xc9a06a,   // tan hull
  hullDark: 0x8a6a3f,
  fuji:     0x274b6d,   // fuji blue
  fujiSnow: 0xf4efe2,
  ink:      0x22303f
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.skyTop);
scene.fog = new THREE.Fog(0xd9cba6, 60, 160);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 6, 46);
camera.lookAt(0, 4, 0);

/* ---- lights: flat, print-like ---- */
scene.add(new THREE.HemisphereLight(0xf3e9cf, 0x33506e, 1.15));
const sun = new THREE.DirectionalLight(0xfff6e0, 0.55);
sun.position.set(-18, 30, 20);
scene.add(sun);

/* ================= MOUNTAIN (Mt. Fuji) ================= */
function makeFuji() {
  const g = new THREE.Group();
  // blue cone body
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(9, 10, 5, 1),
    new THREE.MeshLambertMaterial({ color: C.fuji, flatShading: true })
  );
  body.position.y = 5;
  g.add(body);
  // snow cap: smaller white cone on top
  const cap = new THREE.Mesh(
    new THREE.ConeGeometry(3.4, 3.4, 5, 1),
    new THREE.MeshLambertMaterial({ color: C.fujiSnow, flatShading: true })
  );
  cap.position.y = 10 - 1.7;
  g.add(cap);
  return g;
}
const fuji = makeFuji();
fuji.position.set(8, -1.5, -34);
fuji.scale.setScalar(1.15);
scene.add(fuji);

/* ================= WAVES ================= */
// A wave = a low-poly "curl": a flattened torus segment (the crest) + foam claws.
function makeWaveCrest(radius, tube, arc, color) {
  const geo = new THREE.TorusGeometry(radius, tube, 6, 14, arc);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color, flatShading: true }));
  return m;
}

// Foam "claws": small white cones/spikes clustered at the wave lip
function makeFoamClaws(count, spread, size) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: C.foam });
  for (let i = 0; i < count; i++) {
    const s = size * (0.6 + Math.random() * 0.8);
    const claw = new THREE.Mesh(new THREE.ConeGeometry(s * 0.5, s, 4), mat);
    const t = i / (count - 1) - 0.5;
    claw.position.set(t * spread, Math.abs(t) * -size * 0.4, Math.sin(t * 6) * size * 0.3);
    claw.rotation.z = -Math.PI / 2 + t * 1.2;
    claw.rotation.x = Math.random() * 0.6 - 0.3;
    g.add(claw);
  }
  return g;
}

// The great wave: big curl on the left, lip pointing right
function makeGreatWave() {
  const g = new THREE.Group();
  // main body: a big curl (torus arc ~200deg)
  const body = makeWaveCrest(11, 3.4, Math.PI * 1.15, C.prussian);
  body.rotation.z = Math.PI * 0.12;
  body.position.set(-14, 6, -6);
  g.add(body);
  // inner pale face
  const face = makeWaveCrest(9.2, 2.2, Math.PI * 1.0, C.paleBlue);
  face.rotation.z = Math.PI * 0.12;
  face.position.set(-14, 6, -5.4);
  g.add(face);
  // foam lip along the crest
  const foam = makeFoamClaws(26, 20, 2.2);
  foam.position.set(-6, 13.5, -5);
  foam.rotation.z = -0.5;
  g.add(foam);
  // secondary foam ring under lip
  const foam2 = makeFoamClaws(16, 12, 1.5);
  foam2.position.set(-10, 11, -4.5);
  g.add(foam2);
  return g;
}
const greatWave = makeGreatWave();
scene.add(greatWave);

// Smaller waves: right side and foreground
function makeSmallWave(scale, color) {
  const g = new THREE.Group();
  const body = makeWaveCrest(5 * scale, 1.6 * scale, Math.PI * 1.1, color);
  body.rotation.z = -Math.PI * 0.1;
  g.add(body);
  const foam = makeFoamClaws(12, 8 * scale, 1.4 * scale);
  foam.position.set(3 * scale, 4.5 * scale, 0);
  foam.rotation.z = 0.4;
  g.add(foam);
  return g;
}
const waveR = makeSmallWave(1.0, C.prussian2);
waveR.position.set(20, 2, -10);
scene.add(waveR);

const waveF = makeSmallWave(0.8, C.prussian);
waveF.position.set(-4, 0.5, 6);
waveF.rotation.y = 0.3;
scene.add(waveF);

const waveR2 = makeSmallWave(0.7, C.paleBlue);
waveR2.position.set(26, 1, 2);
scene.add(waveR2);

/* ================= BOATS (9 in the print) ================= */
function makeBoat() {
  const g = new THREE.Group();
  // hull: elongated box, tan
  const hull = new THREE.Mesh(
    new THREE.BoxGeometry(7, 0.7, 1.6),
    new THREE.MeshLambertMaterial({ color: C.hull, flatShading: true })
  );
  g.add(hull);
  // upturned prow & stern: two thin angled boxes
  const prow = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.5, 1.4),
    new THREE.MeshLambertMaterial({ color: C.hullDark, flatShading: true })
  );
  prow.position.set(4.2, 0.5, 0);
  prow.rotation.z = 0.7;
  g.add(prow);
  const stern = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.5, 1.4),
    new THREE.MeshLambertMaterial({ color: C.hullDark, flatShading: true })
  );
  stern.position.set(-4.2, 0.5, 0);
  stern.rotation.z = -0.7;
  g.add(stern);
  // 9 tiny figures: small dark spheres in a row
  const figMat = new THREE.MeshLambertMaterial({ color: C.ink, flatShading: true });
  for (let i = 0; i < 9; i++) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.28, 5, 4), figMat);
    f.position.set(-2.6 + i * 0.65, 0.55, 0);
    g.add(f);
  }
  return g;
}

// positions echoing the print: one in the great wave's trough (left),
// one right of centre, one foreground-centre, plus scattered others
const boats = [];
const boatDefs = [
  { p: [-13, 4.5, -2],  s: 1.0, r: 0.15 },   // in the great wave trough
  { p: [2, 2.5, -4],    s: 0.9, r: -0.1 },   // right of centre
  { p: [-2, 1.5, 8],    s: 1.0, r: 0.05 },   // foreground centre
  { p: [16, 3.5, -8],   s: 0.8, r: 0.2 },    // right wave
  { p: [24, 2.5, 0],    s: 0.7, r: -0.15 },  // far right
  { p: [-20, 3, -8],    s: 0.8, r: 0.1 },    // far left
  { p: [8, 1.5, 10],    s: 0.8, r: 0.1 },    // foreground right
  { p: [-8, 2, 4],      s: 0.7, r: -0.1 },   // mid left
  { p: [14, 1.5, 12],   s: 0.7, r: 0.05 }    // foreground far right
];
for (const d of boatDefs) {
  const b = makeBoat();
  b.position.set(...d.p);
  b.scale.setScalar(d.s);
  b.rotation.y = d.r;
  scene.add(b);
  boats.push(b);
}

/* ================= GENTLE MOTION ================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // waves: slow bob + slight curl sway
  greatWave.position.y = Math.sin(t * 0.6) * 0.5;
  greatWave.rotation.z = Math.sin(t * 0.4) * 0.02;
  waveR.position.y = 2 + Math.sin(t * 0.7 + 1) * 0.4;
  waveF.position.y = 0.5 + Math.sin(t * 0.8 + 2) * 0.35;
  waveR2.position.y = 1 + Math.sin(t * 0.65 + 3) * 0.3;

  // boats: rock and bob in the swell
  boats.forEach((b, i) => {
    b.position.y += Math.sin(t * 1.1 + i * 1.7) * 0.006;
    b.rotation.z = Math.sin(t * 0.9 + i) * 0.06;
    b.rotation.x = Math.cos(t * 0.7 + i * 2) * 0.04;
  });

  // camera: very slow drift for wallpaper feel
  camera.position.x = Math.sin(t * 0.05) * 1.5;
  camera.position.y = 6 + Math.sin(t * 0.08) * 0.4;
  camera.lookAt(0, 4, 0);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
