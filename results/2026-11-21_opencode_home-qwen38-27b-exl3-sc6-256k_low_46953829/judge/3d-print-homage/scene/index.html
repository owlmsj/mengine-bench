<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Wave off Kanagawa — Low Poly 3D</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#1a2332; }
  canvas { display:block; }
  #label {
    position:fixed; bottom:12px; left:12px;
    font-family:'Caveat',cursive; font-size:18px; color:#e8d5a3;
    text-shadow:0 1px 3px rgba(0,0,0,.6); pointer-events:none;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="label">The Great Wave off Kanagawa · Hokusai · low-poly 3D</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ── Palette from the print ────────────────────────────────────────────── */
const PAL = {
  paper:    0xf2e8c9,
  waveDeep: 0x1a3a5c,
  waveMid:  0x2a5a8a,
  waveLite: 0x4a7aaa,
  foam:     0xf0f4f8,
  foamBlue: 0xc8dce8,
  boatHull: 0x8b4513,
  boatTrim: 0xd4a050,
  boatDeck: 0xc89440,
  fujiBase: 0x3a5a7a,
  fujiSnow: 0xf0f4f8,
  fujiShadow:0x2a4a6a,
  cloud:    0xf5ecd8,
};

/* ── Scene / camera / renderer ─────────────────────────────────────────── */
const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.paper);
scene.fog = new THREE.Fog(PAL.paper, 60, 160);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 3, 24);
camera.lookAt(0, 1.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* ── Lighting ──────────────────────────────────────────────────────────── */
scene.add(new THREE.AmbientLight(0xfff8e8, 0.7));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.0);
sun.position.set(5, 10, 8);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xa0c0e0, 0.3);
fill.position.set(-5, 3, -5);
scene.add(fill);

/* ── Helpers ───────────────────────────────────────────────────────────── */
function flatMat(color, opts={}) {
  return new THREE.MeshLambertMaterial({ color, flatShading:true, ...opts });
}

/* ── Mt. Fuji — distant background ─────────────────────────────────────── */
function buildFuji() {
  const g = new THREE.Group();

  // Main cone
  const coneGeo = new THREE.ConeGeometry(12, 14, 8, 3);
  const pos = coneGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    pos.setX(i, x + Math.sin(x*3.7 + z*2.1) * 0.25);
    pos.setZ(i, z + Math.cos(x*2.1 + z*3.7) * 0.2);
  }
  coneGeo.computeVertexNormals();
  const cone = new THREE.Mesh(coneGeo, flatMat(PAL.fujiBase));
  cone.position.y = 7;
  g.add(cone);

  // Snow cap
  const snowGeo = new THREE.ConeGeometry(5, 5.5, 8, 2);
  const sPos = snowGeo.attributes.position;
  for (let i = 0; i < sPos.count; i++) {
    const x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
    sPos.setX(i, x + Math.sin(x*4+z*3)*0.2);
    sPos.setZ(i, z + Math.cos(x*3+z*4)*0.2);
  }
  snowGeo.computeVertexNormals();
  const snow = new THREE.Mesh(snowGeo, flatMat(PAL.fujiSnow));
  snow.position.y = 11;
  g.add(snow);

  // Shadow side
  const shadowGeo = new THREE.ConeGeometry(12.1, 14.1, 8, 3);
  const shadow = new THREE.Mesh(shadowGeo, flatMat(PAL.fujiShadow));
  shadow.position.set(-0.5, 6.9, -0.5);
  shadow.scale.set(1.01, 1, 1.01);
  g.add(shadow);

  return g;
}

const fuji = buildFuji();
fuji.position.set(0, -3, -30);
scene.add(fuji);

/* ── Clouds ────────────────────────────────────────────────────────────── */
function buildCloud(x, y, z, scale=1) {
  const g = new THREE.Group();
  const mat = flatMat(PAL.cloud);
  const puffs = [
    [0, 0, 0, 1.2], [1.2, 0.2, 0.3, 0.9], [-1.1, 0.1, -0.2, 1.0],
    [0.5, 0.5, -0.4, 0.8], [-0.5, 0.4, 0.3, 0.7],
  ];
  for (const [px, py, pz, r] of puffs) {
    const geo = new THREE.IcosahedronGeometry(r * scale, 0);
    const m = new THREE.Mesh(geo, mat);
    m.position.set(px*scale, py*scale, pz*scale);
    g.add(m);
  }
  g.position.set(x, y, z);
  return g;
}

const clouds = [];
[[-12, 12, -25, 1.5],[8, 13, -28, 1.2],[16, 11, -22, 1.0],
 [-18, 10, -20, 0.8],[0, 14, -30, 1.3],[12, 15, -32, 1.0]]
.forEach(([x,y,z,s]) => { const c = buildCloud(x,y,z,s); clouds.push(c); scene.add(c); });

/* ── Waves — flat low-poly terrain ─────────────────────────────────────── */
function buildWaveTerrain(x, z, w, d, h, color, seed, curl) {
  const geo = new THREE.PlaneGeometry(w, d, 16, 10);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const px = pos.getX(i), py = pos.getY(i);
    const nx = px / (w/2);
    const nz = py / (d/2);
    // Base swell
    let y = Math.cos(nx * Math.PI * 0.8) * h * 0.5;
    // Add curl: raise the back, dip the front
    if (curl) {
      y += nz * h * 0.3;
      y += Math.max(0, -nx) * h * 0.4; // higher on the left (curl side)
    }
    // Low-poly jitter
    y += Math.sin(px*2.1 + seed) * 0.15;
    y += Math.cos(py*1.7 + seed*0.7) * 0.1;
    pos.setZ(i, y);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, flatMat(color, { side: THREE.DoubleSide }));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(x, 0, z);
  return mesh;
}

// Great wave — left side, tall, curling
const waveMain = buildWaveTerrain(-5, 0, 16, 10, 5, PAL.waveDeep, 1, true);
scene.add(waveMain);

// Right swell
const waveRight = buildWaveTerrain(8, 2, 12, 8, 3, PAL.waveMid, 3, false);
scene.add(waveRight);

// Foreground wave
const waveFront = buildWaveTerrain(0, 8, 20, 6, 2.5, PAL.waveLite, 5, false);
scene.add(waveFront);

/* ── Foam crests — white strips on wave tops ───────────────────────────── */
function buildFoamStrip(x, z, w, d, y, color) {
  const geo = new THREE.PlaneGeometry(w, d, 12, 4);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const px = pos.getX(i);
    const nx = px / (w/2);
    pos.setZ(i, Math.cos(nx * Math.PI) * 0.3);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, flatMat(color, { side: THREE.DoubleSide }));
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(x, y, z);
  return mesh;
}

const foam1 = buildFoamStrip(-5, -1, 14, 1.5, 4.2, PAL.foam);
scene.add(foam1);
const foam2 = buildFoamStrip(8, 1, 10, 1.2, 2.8, PAL.foamBlue);
scene.add(foam2);
const foam3 = buildFoamStrip(0, 7, 18, 1, 2.2, PAL.foam);
scene.add(foam3);

// Foam dots on the great wave
for (let i = 0; i < 30; i++) {
  const dotGeo = new THREE.IcosahedronGeometry(0.1 + Math.random()*0.12, 0);
  const dot = new THREE.Mesh(dotGeo, flatMat(PAL.foam));
  dot.position.set(
    -10 + Math.random() * 10,
    2 + Math.random() * 3,
    -2 + Math.random() * 4
  );
  scene.add(dot);
}

/* ── Boats ─────────────────────────────────────────────────────────────── */
function buildBoat(x, y, z, rotY, scale=1) {
  const g = new THREE.Group();

  // Hull
  const hullGeo = new THREE.BoxGeometry(2.0, 0.4, 0.7, 3, 1, 2);
  const hPos = hullGeo.attributes.position;
  for (let i = 0; i < hPos.count; i++) {
    const px = hPos.getX(i), pz = hPos.getZ(i);
    const taper = 1 - Math.abs(px) / 1.0 * 0.4;
    hPos.setZ(i, pz * taper);
    hPos.setY(i, hPos.getY(i) + Math.abs(px) / 1.0 * 0.12);
  }
  hullGeo.computeVertexNormals();
  g.add(new THREE.Mesh(hullGeo, flatMat(PAL.boatHull)));

  // Deck
  const deck = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.06, 0.45), flatMat(PAL.boatDeck));
  deck.position.y = 0.2;
  g.add(deck);

  // Trim
  const trim = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.05, 0.72), flatMat(PAL.boatTrim));
  trim.position.y = 0.08;
  g.add(trim);

  // Cabin
  const cab = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.4), flatMat(PAL.boatTrim));
  cab.position.set(-0.25, 0.45, 0);
  g.add(cab);

  // Mast
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.0, 4), flatMat(PAL.boatHull));
  mast.position.set(0.4, 0.7, 0);
  g.add(mast);

  // Sail
  const sailGeo = new THREE.BufferGeometry();
  sailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0.4, 1.1, 0, 0.4, 0.35, 0.12, 0.4, 0.35, -0.12
  ]), 3));
  sailGeo.computeVertexNormals();
  g.add(new THREE.Mesh(sailGeo, flatMat(PAL.foam, { side: THREE.DoubleSide })));

  // Crew
  for (let i = 0; i < 3; i++) {
    const crew = new THREE.Mesh(new THREE.SphereGeometry(0.06, 4, 3), flatMat(0x2a2a2a));
    crew.position.set(-0.5 + i*0.3, 0.3, 0);
    g.add(crew);
  }

  g.position.set(x, y, z);
  g.rotation.y = rotY;
  g.scale.setScalar(scale);
  return g;
}

const boats = [];
// Left group (under the great wave)
boats.push(buildBoat(-7,  2.5, -1, 0.3, 1.0));
boats.push(buildBoat(-5,  2.8,  0, 0.5, 0.9));
boats.push(buildBoat(-3,  3.0,  1, 0.2, 1.1));
// Middle group
boats.push(buildBoat(-1,  2.2,  4, -0.2, 1.0));
boats.push(buildBoat( 1,  2.0,  5,  0.1, 0.9));
boats.push(buildBoat( 3,  2.3,  3, -0.4, 1.0));
// Right group
boats.push(buildBoat( 6,  2.5,  1,  0.6, 1.0));
boats.push(buildBoat( 8,  2.8,  0,  0.3, 0.9));
boats.push(buildBoat(10,  3.0, -1,  0.8, 1.1));
for (const b of boats) scene.add(b);

/* ── Water surface ─────────────────────────────────────────────────────── */
const waterGeo = new THREE.PlaneGeometry(80, 50, 20, 12);
const wPos = waterGeo.attributes.position;
for (let i = 0; i < wPos.count; i++) {
  const px = wPos.getX(i), py = wPos.getY(i);
  wPos.setZ(i, Math.sin(px*0.4)*0.2 + Math.cos(py*0.6)*0.15);
}
waterGeo.computeVertexNormals();
const water = new THREE.Mesh(waterGeo, flatMat(PAL.waveDeep, { side: THREE.DoubleSide }));
water.rotation.x = -Math.PI/2;
water.position.y = -0.5;
scene.add(water);

/* ── Animation ─────────────────────────────────────────────────────────── */
const clock = new THREE.Clock();
const boatBaseY = boats.map(b => b.position.y);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  boats.forEach((b, i) => {
    b.position.y = boatBaseY[i] + Math.sin(t * 1.2 + i * 0.8) * 0.12;
    b.rotation.z = Math.sin(t * 0.9 + i * 1.1) * 0.07;
    b.rotation.x = Math.cos(t * 0.7 + i * 0.6) * 0.04;
  });

  waveMain.position.y = Math.sin(t * 0.3) * 0.08;
  waveRight.position.y = Math.sin(t * 0.25 + 1) * 0.06;
  waveFront.position.y = Math.sin(t * 0.35 + 2) * 0.05;

  foam1.position.y = 4.2 + Math.sin(t * 0.8) * 0.06;
  foam2.position.y = 2.8 + Math.sin(t * 0.7 + 1) * 0.05;
  foam3.position.y = 2.2 + Math.sin(t * 0.9 + 2) * 0.04;

  clouds.forEach((c, i) => {
    c.position.x += Math.sin(t * 0.1 + i) * 0.001;
    c.position.y += Math.cos(t * 0.15 + i * 0.7) * 0.0005;
  });

  const wp = waterGeo.attributes.position;
  for (let i = 0; i < wp.count; i++) {
    const px = wp.getX(i), py = wp.getY(i);
    wp.setZ(i, Math.sin(px*0.4 + t*0.5)*0.2 + Math.cos(py*0.6 + t*0.3)*0.15);
  }
  wp.needsUpdate = true;
  waterGeo.computeVertexNormals();

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
