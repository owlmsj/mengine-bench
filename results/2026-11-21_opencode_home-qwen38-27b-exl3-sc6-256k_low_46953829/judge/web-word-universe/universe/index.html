<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras | Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1017; --panel:#131826; --panel2:#182032; --line:#26304a;
    --ink:#e8ecf6; --dim:#93a0bd; --faint:#5c6884; --acc:#ffd9a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #scene{position:fixed;inset:0;display:block}
  #ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
  header{padding:18px 22px 8px;pointer-events:none}
  header h1{margin:0;font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:30px;letter-spacing:.3px}
  header h1 em{font-style:italic;color:var(--acc)}
  header p{margin:4px 0 0;color:var(--dim);font-size:13px}
  #searchwrap{position:fixed;top:16px;right:20px;width:270px;pointer-events:auto}
  #search{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    background:rgba(19,24,38,.92);color:var(--ink);font-size:14px;outline:none;
    backdrop-filter:blur(6px)}
  #search:focus{border-color:#3b4a72}
  #sugg{margin-top:6px;background:rgba(19,24,38,.96);border:1px solid var(--line);
    border-radius:10px;overflow:hidden;display:none}
  #sugg div{padding:9px 14px;font-size:13px;cursor:pointer;color:var(--dim)}
  #sugg div:hover{background:var(--panel2);color:var(--ink)}
  #panel{position:fixed;left:20px;bottom:20px;width:300px;max-height:62vh;overflow:auto;
    pointer-events:auto;background:rgba(19,24,38,.94);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;backdrop-filter:blur(8px);
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  #panel h2{margin:0;font-family:'Cormorant Garamond',serif;font-size:30px;
    font-weight:600;line-height:1.05}
  #panel .theme{margin:2px 0 10px;font-size:12px;color:var(--dim);text-transform:lowercase}
  #panel .theme b{color:var(--acc);font-weight:500}
  #panel h3{margin:14px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  #panel ul{margin:0;padding:0;list-style:none}
  #panel li{padding:6px 8px;margin:2px -8px;border-radius:8px;font-size:14px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  #panel li:hover{background:var(--panel2)}
  #panel li .tag{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
  #panel .close{position:absolute;top:10px;right:12px;cursor:pointer;color:var(--faint);
    font-size:18px;line-height:1;padding:4px}
  #panel .close:hover{color:var(--ink)}
  #panel .relcount{font-size:12px;color:var(--dim);margin-top:10px}
  #legend{position:fixed;right:20px;bottom:20px;pointer-events:auto;background:rgba(19,24,38,.9);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(6px)}
  #legend h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  #legend .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);
    padding:2px 0;cursor:pointer}
  #legend .row:hover{color:var(--ink)}
  #legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
  #legend .row .n{margin-left:auto;color:var(--faint);font-size:11px;padding-left:12px}
  #stats{position:fixed;left:22px;top:86px;pointer-events:none;color:var(--dim);font-size:12px}
  #stats b{color:var(--ink);font-weight:600}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none;
    color:var(--faint);font-size:12px}
  @media (max-width:720px){ #legend{display:none} #panel{width:calc(100% - 40px)} }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">

    <h1>Universo de <em>Palavras</em></h1>
    <p>Dicionário Criativo — cada palavra, seus laços</p>

  <div id="searchwrap">
    <input id="search" type="text" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="sugg"></div>
  </div>
  <div id="stats"></div>
  <div id="panel" style="display:none"></div>
  <div id="legend"></div>
  <div id="hint">arraste para girar · role para zoom · clique numa palavra</div>
</div>

const noacc = s => [...s].map(c=>c.normalize('NFD').replace(/[\u0300-\u036f]/g,'')).join('').toLowerCase();
const normKey = s => noacc(s.trim());

const words = DATA.words;                       // display -> {theme, links:{target:[types]}}
const W = Object.keys(words);
const keyIndex = new Map(W.map(w=>[normKey(w), w]));
const themeSet = [...new Set(W.map(w=>words[w].theme).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
const THEME_COLOR = {
  'sentimentos':'#ff8fa3','linguagem':'#7cc7ff','comida':'#ffb454','ofícios':'#c9a0ff',
  'lugares':'#6fe3c1','corpo':'#ff9e7c','tempo':'#ffe08a','natureza':'#8fd460',

};

// ---- graph ----
const nodes = W.map((w,i)=>({w, i, deg:0}));
const nodeByWord = new Map(nodes.map(n=>[n.w,n]));
const edges = [];
{
  const seen = new Set();
  for(const a of W) for(const b of Object.keys(words[a].links)){
    if(!nodeByWord.has(b)) continue;
    const k = a<b ? a+'|'+b : b+'|'+a;
    if(seen.has(k)) continue; seen.add(k);
    edges.push([nodeByWord.get(a).i, nodeByWord.get(b).i]);
    nodes[nodeByWord.get(a).i].deg++; nodes[nodeByWord.get(b).i].deg++;
  }
}
const maxDeg = Math.max(...nodes.map(n=>n.deg));
const radius = n => 1.4 + 2.6*Math.sqrt(n.deg/maxDeg);

// ---- layout: 3D force simulation ----
const N = nodes.length;
const pos = new Float32Array(N*3), vel = new Float32Array(N*3);
for(let i=0;i<N;i++){
  // fibonacci sphere for a stable start
  const y = 1 - (i/(N-1))*2, r = Math.sqrt(1-y*y), th = i*2.399963;
  pos[i*3]=Math.cos(th)*r*60; pos[i*3+1]=y*60; pos[i*3+2]=Math.sin(th)*r*60;
}
function step(){
  const REP=900, SPRING=0.015, REST=14, CENTER=0.004, DAMP=0.85;
  for(let i=0;i<N;i++){
    for(let j=i+1;j<N;j++){
      let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      let d2=dx*dx+dy*dy+dz*dz+0.01;
      let f=REP/d2; let d=Math.sqrt(d2);
      dx/=d; dy/=d; dz/=d;
      vel[i*3]+=dx*f; vel[i*3+1]+=dy*f; vel[i*3+2]+=dz*f;
      vel[j*3]-=dx*f; vel[j*3+1]-=dy*f; vel[j*3+2]-=dz*f;
    }
  }
  for(const [a,b] of edges){
    let dx=pos[b*3]-pos[a*3], dy=pos[b*3+1]-pos[a*3+1], dz=pos[b*3+2]-pos[a*3+2];
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    let f=SPRING*(d-REST);
    dx/=d; dy/=d; dz/=d;
    vel[a*3]+=dx*f; vel[a*3+1]+=dy*f; vel[a*3+2]+=dz*f;
    vel[b*3]-=dx*f; vel[b*3+1]-=dy*f; vel[b*3+2]-=dz*f;
  }
  for(let i=0;i<N;i++){
    vel[i*3]-=pos[i*3]*CENTER; vel[i*3+1]-=pos[i*3+1]*CENTER; vel[i*3+2]-=pos[i*3+2]*CENTER;
    vel[i*3]*=DAMP; vel[i*3+1]*=DAMP; vel[i*3+2]*=DAMP;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}
for(let s=0;s<220;s++) step();   // pre-settle so the view opens calm

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0d1017, 0.0035);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0,0,150);

// nodes: one sphere per word
const geo = new THREE.SphereGeometry(1, 20, 16);
const nodeMeshes = [];
for(const n of nodes){
  const c = new THREE.Color(themeColor(words[n.w].theme));
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:0.95}));
  m.position.set(pos[n.i*3],pos[n.i*3+1],pos[n.i*3+2]);
  m.scale.setScalar(radius(n));
  m.userData = n;
  scene.add(m); nodeMeshes.push(m);
}
// edges: line segments
const linePos = new Float32Array(edges.length*6);
for(let e=0;e<edges.length;e++){
  const [a,b]=edges[e];
  linePos[e*6]=pos[a*3]; linePos[e*6+1]=pos[a*3+1]; linePos[e*6+2]=pos[a*3+2];
  linePos[e*6+3]=pos[b*3]; linePos[e*6+4]=pos[b*3+1]; linePos[e*6+5]=pos[b*3+2];
}
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos,3));
const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({color:0x33405f, transparent:true, opacity:0.5}));
scene.add(lines);

// labels: sprites for the selected word + its neighbours
const labelCanvas = document.createElement('canvas');
const labelCtx = labelCanvas.getContext('2d');
function makeLabel(text, color){
  const c = document.createElement('canvas'); const x = c.getContext('2d');
  const font = '600 44px Inter, sans-serif'; x.font = font;
  const w = Math.ceil(x.measureText(text).width)+24;
  c.width = w; c.height = 64; x.font = font; x.textBaseline='middle';
  x.fillStyle = 'rgba(13,16,23,.75)';
  x.beginPath(); x.roundRect(0,0,w,64,14); x.fill();
  x.fillStyle = color; x.fillText(text,12,34);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  sp.scale.set(w/64*6, 6, 1); sp.renderOrder = 10;
  return sp;
}
let labelGroup = new THREE.Group(); scene.add(labelGroup);
function setLabels(centerWord){
  while(labelGroup.children.length) labelGroup.remove(labelGroup.children[0]);
  if(!centerWord) return;
  const cn = nodeByWord.get(centerWord);
  const cl = makeLabel(centerWord, '#ffffff');
  cl.position.copy(nodeMeshes[cn.i].position).add(new THREE.Vector3(0, radius(cn)+4, 0));
  labelGroup.add(cl);
  for(const t of Object.keys(words[centerWord].links)){
    const tn = nodeByWord.get(t); if(!tn) continue;
    const l = makeLabel(t, themeColor(words[t].theme));
    l.position.copy(nodeMeshes[tn.i].position).add(new THREE.Vector3(0, radius(tn)+3.4, 0));
    labelGroup.add(l);
  }
}

// ---- selection / highlight ----
let selected = null;
function applyHighlight(){
  const nbrs = new Set();
  if(selected){ nbrs.add(selected); for(const t of Object.keys(words[selected].links)) if(nodeByWord.has(t)) nbrs.add(t); }
  for(const m of nodeMeshes){
    const n = m.userData;
    if(!selected){ m.material.opacity=0.95; m.material.color.set(themeColor(words[n.w].theme)); }
    else if(nbrs.has(n.w)){ m.material.opacity=1; m.material.color.set(0xffffff); }
    else { m.material.opacity=0.12; m.material.color.set(themeColor(words[n.w].theme)); }
  }
  lines.material.opacity = selected ? 0.15 : 0.5;
  setLabels(selected);
  renderPanel();
}
function select(word, push=true){
  selected = word || null;
  applyHighlight();
  if(push && word) history.replaceState(null,'','?word='+encodeURIComponent(word));
  if(!word) history.replaceState(null,'',location.pathname);
}

// ---- panel ----
const panel = document.getElementById('panel');
function renderPanel(){
  if(!selected){ panel.style.display='none'; return; }
  const w = words[selected];
  const links = w.links;
  const syn = Object.entries(links).filter(([,t])=>t.includes('sinonimo')).map(([k])=>k);
  const ana = Object.entries(links).filter(([,t])=>t.includes('analogas')).map(([k])=>k);
  const deg = nodeByWord.get(selected).deg;
  panel.style.display='block';
  panel.innerHTML =
    `<span class="close" title="fechar">×</span>`+
    `<h2>${selected}</h2>`+
    `<div class="theme">tema: <b>${w.theme||'—'}</b> · ${deg} laços</div>`+
    (syn.length?`<h3>Sinônimos</h3><ul>${syn.map(k=>li(k,'sinônimo')).join('')}</ul>`:'')+
    (ana.length?`<h3>Palavras análogas</h3><ul>${ana.map(k=>li(k,'análoga')).join('')}</ul>`:'')+
    `<div class="relcount">partilha laços com ${deg} palavras do universo</div>`;
  panel.querySelector('.close').onclick = ()=>select(null);
  panel.querySelectorAll('li[data-w]').forEach(el=>el.onclick=()=>select(el.dataset.w));
}
function li(word, tag){
  return `<li data-w="${word.replace(/"/g,'&quot;')}"><span>${word}</span><span class="tag">${tag}</span></li>`;
}

// ---- stats + legend ----
const degOf = w => nodeByWord.get(w).deg;
const topWord = W.slice().sort((a,b)=>degOf(b)-degOf(a)||a.localeCompare(b,'pt'))[0];
document.getElementById('stats').innerHTML =
  `<b>${W.length}</b> palavras · <b>${edges.length}</b> laços · mais conectada: <b>${topWord}</b> (${degOf(topWord)})`;
const legend = document.getElementById('legend');
legend.innerHTML = '<h4>Temas</h4>' + themeSet.map(t=>{
  const n = W.filter(w=>words[w].theme===t).length;
  return `<div class="row" data-t="${t}"><span class="dot" style="background:${themeColor(t)}"></span><span>${t}</span><span class="n">${n}</span></div>`;
}).join('');
let themeFilter = null;
legend.querySelectorAll('.row').forEach(el=>el.onclick=()=>{
  const t = el.dataset.t;
  themeFilter = (themeFilter===t)? null : t;
  applyThemeFilter();
});
function applyThemeFilter(){
  if(!themeFilter){ applyHighlight(); return; }
  for(const m of nodeMeshes){
    const n=m.userData;
    const on = words[n.w].theme===themeFilter;
    m.material.opacity = on?1:0.1;
    m.material.color.set(on?0xffffff:themeColor(words[n.w].theme));
  }
  lines.material.opacity=0.12;
}

// ---- search ----
const search = document.getElementById('search');
const sugg = document.getElementById('sugg');
function showSugg(q){
  const k = normKey(q);
  if(!k){ sugg.style.display='none'; return; }
  const hits = W.filter(w=>normKey(w).startsWith(k)).slice(0,8);
  if(!hits.length){ sugg.style.display='none'; return; }
  sugg.innerHTML = hits.map(h=>`<div data-w="${h}">${h}</div>`).join('');
  sugg.style.display='block';
  sugg.querySelectorAll('div').forEach(el=>el.onclick=()=>{ select(el.dataset.w); search.value=el.dataset.w; sugg.style.display='none'; });
}
search.addEventListener('input', ()=>showSugg(search.value));
search.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const k=normKey(search.value);
    const hit = keyIndex.get(k) || W.find(w=>normKey(w).startsWith(k));
    if(hit){ select(hit); search.value=hit; sugg.style.display='none'; }
  } else if(e.key==='Escape'){ sugg.style.display='none'; }
});
document.addEventListener('click', e=>{ if(!e.target.closest('#searchwrap')) sugg.style.display='none'; });

// ---- pointer: rotate / zoom / click ----
let dragging=false, px=0, py=0, moved=0;
let rotY=0, rotX=0, zoom=150;
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
canvas.addEventListener('pointerdown', e=>{ dragging=true; moved=0; px=e.clientX; py=e.clientY; });
addEventListener('pointerup', e=>{
  if(dragging && moved<6){ // click
    mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(nodeMeshes)[0];
    if(hit) select(hit.object.userData.w); else select(null);
  }
  dragging=false;
});
addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  rotY+=dx*0.005; rotX+=dy*0.005; rotX=Math.max(-1.4,Math.min(1.4,rotX));
});
canvas.addEventListener('wheel', e=>{ e.preventDefault(); zoom*= (e.deltaY>0?1.1:0.9); zoom=Math.max(40,Math.min(400,zoom)); }, {passive:false});

function frame(){
  requestAnimationFrame(frame);
  scene.rotation.y += (rotY - scene.rotation.y)*0.15;
  scene.rotation.x += (rotX - scene.rotation.x)*0.15;
  camera.position.z += (zoom - camera.position.z)*0.15;
  renderer.setSize(innerWidth, innerHeight);
  renderer.render(scene, camera);
}
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); });
frame();

// ---- deep link ?word= ----
const q = new URLSearchParams(location.search).get('word');
if(q){
  const hit = keyIndex.get(normKey(q)) || W.find(w=>normKey(w).startsWith(normKey(q)));
  if(hit){ select(hit, false); search.value=hit; }
}
</script>
