<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras · Dicionário Criativo</title>
<style>
:root{
  --bg:#0d0b14; --panel:#16131f; --ink:#f2ecff; --dim:#9b93b5;
  --accent:#e8b4ff; --accent2:#8be9fd; --line:#3a3350;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 800px at 70% -10%, #1b1430 0%, var(--bg) 55%);
  color:var(--ink);
  font-family:"Spectral", Georgia, serif;
  overflow:hidden;
}
#stage{position:fixed;inset:0}
canvas{display:block}
#hud{
  position:fixed;top:0;left:0;right:0;
  display:flex;align-items:center;gap:16px;
  padding:14px 20px;
  background:linear-gradient(180deg, rgba(13,11,20,.92), rgba(13,11,20,0));
  z-index:5;pointer-events:none;
}
#hud .brand{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
#hud .brand b{color:var(--ink);font-weight:600}
#search{
  pointer-events:auto;
  margin-left:auto;
  display:flex;align-items:center;gap:8px;
  background:rgba(22,19,31,.85);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 14px;
  min-width:260px;max-width:340px;
}
#search input{
  background:none;border:none;outline:none;color:var(--ink);
  font-family:inherit;font-size:15px;width:100%;
}
#search input::placeholder{color:var(--dim)}
#search .ic{color:var(--dim);font-size:14px}
#sugg{
  position:fixed;top:64px;right:20px;width:300px;z-index:6;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;display:none;box-shadow:0 12px 40px rgba(0,0,0,.5);
  max-height:50vh;overflow-y:auto;
}
#sugg button{
  display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--ink);font-family:inherit;font-size:14px;padding:10px 14px;cursor:pointer;
}
#sugg button:hover{background:#221c33}
#panel{
  position:fixed;right:20px;bottom:20px;width:340px;max-height:70vh;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:20px;overflow:auto;z-index:5;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  display:none;
}
#panel h2{font-size:26px;font-weight:600;letter-spacing:.02em;margin-bottom:4px;padding-right:24px}
#panel .tema{color:var(--accent2);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
#panel .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:14px 0 8px}
#panel .chips{display:flex;flex-wrap:wrap;gap:6px}
#panel .chip{
  background:#221c33;border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:13px;color:var(--ink);cursor:pointer;
}
#panel .chip:hover{border-color:var(--accent);color:var(--accent)}
#panel .close{
  position:absolute;top:12px;right:14px;background:none;border:none;
  color:var(--dim);font-size:18px;cursor:pointer;
}
#panel .close:hover{color:var(--ink)}
#legend{
  position:fixed;left:20px;bottom:20px;z-index:5;
  background:rgba(22,19,31,.8);border:1px solid var(--line);border-radius:12px;
  padding:12px 16px;font-size:12px;color:var(--dim);line-height:1.7;
}
#legend b{color:var(--ink)}
#hint{
  position:fixed;left:20px;top:64px;z-index:4;color:var(--dim);font-size:13px;
  pointer-events:none;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
<div id="stage"></div>
<div id="hud">
  <div class="brand"><b>Dicionário</b> Criativo · universo</div>
  <div id="search">
    <span class="ic">⌕</span>
    <input id="q" type="text" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
  </div>
</div>
<div id="sugg"></div>
<div id="hint">arraste para girar · role para aproximar · clique numa palavra</div>
<div id="panel">
  <button class="close" id="pclose">✕</button>
  <h2 id="pword"></h2>
  <div class="tema" id="ptema"></div>
  <div class="lbl">ligações</div>
  <div class="chips" id="plinks"></div>
</div>
<div id="legend">
  <b id="lwords"></b> palavras · <b id="lrel"></b> relações<br>
  mais conectada: <b id="ltop"></b>
</div>

const TOP_WORD = 'palavra';
const TOP_COUNT = 16;
const WORD_COUNT = 253;
const REL_COUNT = 757;

/* normalize: lowercase keys, dedupe links, drop self */
const norm = s => s.toLowerCase().trim();
const graph = {};
for (const k of Object.keys(WORDS)) {
  const key = norm(k);
  const links = (WORDS[k]||[]).map(norm).filter(l => l && l !== key);
  graph[key] = Array.from(new Set(links));
}
const names = Object.keys(graph);
const idx = {}; names.forEach((n,i)=>idx[n]=i);
const N = names.length;

/* adjacency for force sim */
const adj = names.map(()=>[]);
const edgeSet = new Set();
const edges = [];
for (const n of names) {
  for (const l of graph[n]) {
    if (!(l in idx)) continue;
    const a = idx[n], b = idx[l];
    if (a===b) continue;
    const key = a<b ? a+'-'+b : b+'-'+a;
    if (!edgeSet.has(key)) { edgeSet.add(key); edges.push([a,b]); }
    adj[a].push(b);
  }
}
const degree = names.map((_,i)=>adj[i].length);

/* ---- three.js scene ---- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 4000);
camera.position.set(0,0,420);

/* nodes: spheres sized by degree */
const maxDeg = Math.max(1, ...degree);
const nodeGeo = new THREE.SphereGeometry(1, 20, 16);
const nodeMats = [];
const nodes = [];
const baseColor = new THREE.Color('#6f6390');
const hotColor = new THREE.Color('#e8b4ff');
const dimColor = new THREE.Color('#241f33');
for (let i=0;i<N;i++){
  const r = 1.6 + 3.4*(degree[i]/maxDeg);
  const mat = new THREE.MeshBasicMaterial({color: baseColor.clone()});
  const m = new THREE.Mesh(nodeGeo, mat);
  m.scale.setScalar(r);
  m.userData.i = i;
  scene.add(m);
  nodes.push(m);
  nodeMats.push(mat);
}

/* edges: lines */
const edgePos = new Float32Array(edges.length*6);
const edgeGeo = new THREE.BufferGeometry();
edgeGeo.setAttribute('position', new THREE.BufferAttribute(edgePos,3));
const edgeMat = new THREE.LineBasicMaterial({color:0x4a4166, transparent:true, opacity:0.5});
const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
scene.add(edgeLines);

/* labels: sprites */
function makeLabel(text){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const fs = 44;
  ctx.font = `600 ${fs}px Spectral, Georgia, serif`;
  const w = Math.ceil(ctx.measureText(text).width)+20;
  c.width = w; c.height = 64;
  const ctx2 = c.getContext('2d');
  ctx2.font = `600 ${fs}px Spectral, Georgia, serif`;
  ctx2.fillStyle = '#f2ecff';
  ctx2.textBaseline = 'middle';
  ctx2.fillText(text, 10, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  const s = 0.16;
  sp.scale.set(w*s, 64*s, 1);
  return sp;
}
const labels = names.map(n=>{
  const sp = makeLabel(n);
  scene.add(sp);
  return sp;
});

/* ---- force layout (simple spring/repulsion, 3D) ---- */
const pos = names.map(()=>new THREE.Vector3(
  (Math.random()-0.5)*200,(Math.random()-0.5)*200,(Math.random()-0.5)*200));
const vel = names.map(()=>new THREE.Vector3());
function tick(){
  const k = 0.02, rep = 2600, damp = 0.85;
  for (let i=0;i<N;i++){
    for (let j=i+1;j<N;j++){
      const d = pos[i].clone().sub(pos[j]);
      const dist = Math.max(0.1, d.length());
      const f = rep/(dist*dist);
      d.normalize().multiplyScalar(f);
      vel[i].add(d); vel[j].sub(d);
    }
  }
  for (const [a,b] of edges){
    const d = pos[a].clone().sub(pos[b]);
    const dist = d.length();
    const f = k*(dist-30);
    d.normalize().multiplyScalar(f);
    vel[a].sub(d); vel[b].add(d);
  }
  for (let i=0;i<N;i++){
    vel[i].multiplyScalar(damp);
    pos[i].add(vel[i]);
  }
}
for (let s=0;s<260;s++) tick();
/* apply */
function sync(){
  for (let i=0;i<N;i++){
    nodes[i].position.copy(pos[i]);
    labels[i].position.copy(pos[i]).add(new THREE.Vector3(0, nodes[i].scale.x+6, 0));
  }
  for (let e=0;e<edges.length;e++){
    const [a,b] = edges[e];
    edgePos[e*6]=pos[a].x; edgePos[e*6+1]=pos[a].y; edgePos[e*6+2]=pos[a].z;
    edgePos[e*6+3]=pos[b].x; edgePos[e*6+4]=pos[b].y; edgePos[e*6+5]=pos[b].z;
  }
  edgeGeo.attributes.position.needsUpdate = true;
}
sync();

/* ---- interaction ---- */
let selected = null;
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function pick(ev){
  mouse.x = (ev.clientX/innerWidth)*2-1;
  mouse.y = -(ev.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(nodes);
  return hit.length ? hit[0].object.userData.i : null;
}
let downXY=null;
renderer.domElement.addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downXY) return;
  const dx=e.clientX-downXY[0], dy=e.clientY-downXY[1];
  if (dx*dx+dy*dy < 25) { const i=pick(e); if(i!=null) select(names[i]); }
  downXY=null;
});

/* orbit (manual) */
let rotX=0.2, rotY=0.4, dist=420, dragging=false, px=0, py=0;
renderer.domElement.addEventListener('pointerdown', e=>{ dragging=true; px=e.clientX; py=e.clientY; });
addEventListener('pointerup', ()=>dragging=false);
addEventListener('pointermove', e=>{
  if(!dragging) return;
  rotY += (e.clientX-px)*0.005;
  rotX += (e.clientY-py)*0.005;
  rotX = Math.max(-1.5, Math.min(1.5, rotX));
  px=e.clientX; py=e.clientY;
});
addEventListener('wheel', e=>{
  dist = Math.max(80, Math.min(1200, dist + e.deltaY*0.4));
}, {passive:true});

function applyCam(){
  const cx = dist*Math.sin(rotY)*Math.cos(rotX);
  const cy = dist*Math.sin(rotX);
  const cz = dist*Math.cos(rotY)*Math.cos(rotX);
  camera.position.set(cx,cy,cz);
  camera.lookAt(0,0,0);
}
applyCam();

/* selection highlight */
function select(name){
  selected = name;
  const i = idx[name];
  const neigh = new Set([i, ...adj[i]]);
  for (let j=0;j<N;j++){
    if (neigh.has(j)) nodeMats[j].color.copy(hotColor);
    else nodeMats[j].color.copy(dimColor);
  }
  /* panel */
  document.getElementById('pword').textContent = name;
  const tema = (window.__tema && window.__tema[name]) || '';
  document.getElementById('ptema').textContent = tema ? 'tema: '+tema : '';
  const chips = document.getElementById('plinks');
  chips.innerHTML='';
  for (const l of graph[name]){
    const b=document.createElement('button');
    b.className='chip'; b.textContent=l;
    b.onclick=()=>select(l);
    chips.appendChild(b);
  }
  document.getElementById('panel').style.display='block';
  /* url */
  history.replaceState(null,'','?word='+encodeURIComponent(name));
}
function clearSel(){
  selected=null;
  for (let j=0;j<N;j++) nodeMats[j].color.copy(baseColor);
  document.getElementById('panel').style.display='none';
  history.replaceState(null,'','');
}
document.getElementById('pclose').onclick=clearSel;

/* search */
const q=document.getElementById('q'), sugg=document.getElementById('sugg');
q.addEventListener('input', ()=>{
  const v=q.value.toLowerCase().trim();
  if(!v){ sugg.style.display='none'; return; }
  const m=names.filter(n=>n.startsWith(v)).slice(0,8);
  if(!m.length){ sugg.style.display='none'; return; }
  sugg.innerHTML='';
  for(const n of m){
    const b=document.createElement('button'); b.textContent=n;
    b.onclick=()=>{ select(n); q.value=n; sugg.style.display='none'; };
    sugg.appendChild(b);
  }
  sugg.style.display='block';
});
q.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const v=q.value.toLowerCase().trim();
    if(v in graph) select(v);
    else if(names.length===1) select(names[0]);
  }
});

/* legend */
document.getElementById('lwords').textContent = N;
document.getElementById('lrel').textContent = edges.length;
document.getElementById('ltop').textContent = TOP_WORD+' ('+TOP_COUNT+')';

/* deep link */
const params = new URLSearchParams(location.search);
const w0 = params.get('word');
if (w0 && w0.toLowerCase() in graph) select(w0.toLowerCase());

/* animate */
function loop(){
  requestAnimationFrame(loop);
  applyCam();
  renderer.render(scene, camera);
}
loop();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
