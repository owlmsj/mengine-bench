<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa - low poly 3D wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#f3e9d2; }
  #c { position:fixed; inset:0; display:block; }
  #label {
    position:fixed; left:18px; bottom:14px; z-index:2;
    font-family:'Zen Old Mincho', serif; color:#16324f;
    font-size:13px; letter-spacing:.08em; opacity:.75; pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">富嶽三十六景 · 神奈川沖浪裏</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---- Palette sampled from the print (prussian blue, washi cream, indigo) ----
const COL = {
  paper:   0xf3e9d2,  // washi background
  sky:     0xefe3c8,
  waveDeep:0x16324f,  // darkest indigo
  waveMid: 0x2a5d8f,  // mid blue
  waveLite:0x6f9fc4,  // light blue
  foam:    0xf6f1e4,  // white foam
  hull:    0xd8a86e,  // wood hull
  hullDark:0x8a5a33,
  fuji:    0x274b6d,  // mountain body (blue)
  fujiSnow:0xf6f1e4,
  cloud:   0xf6f1e4,
};

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.paper);
scene.fog = new THREE.Fog(COL.paper, 40, 120);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 6, 34);
camera.lookAt(0, 2, 0);

// soft light
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const sun = new THREE.DirectionalLight(0xfff2d8, 0.9);
sun.position.set(-10, 18, 12);
scene.add(sun);

const flat = (c) => new THREE.MeshLambertMaterial({ color:c, flatShading:true });

// ---- Low-poly wave: a curling crest (the "hook") with foam claws, on a swell ----
function makeWave(scale = 1) {
  const g = new THREE.Group();

  // Swell: a low, wide mound of water the crest sits on (reads as sea, not a spike)
  const swell = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 6.2, 3.2, 7), flat(COL.waveMid));
  swell.position.set(-1.5, -2.6, 0);
  swell.scale.y = 0.7;
  g.add(swell);
  const swellTop = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 4.2, 2.0, 7), flat(COL.waveLite));
  swellTop.position.set(-1.5, -1.2, 0);
  swellTop.scale.y = 0.7;
  g.add(swellTop);

  // Crest: a curling hook built from a spiral of low-poly slabs, thick at the base,
  // tapering and curling over the lip (the famous "claw" shape)
  const segs = 12;
  for (let i = 0; i < segs; i++) {
    const t = i / (segs - 1);
    // spiral: rise, lean right, curl back over the lip
    const ang = t * Math.PI * 1.15;
    const r = 3.6 * (1 - t * 0.35);
    const x = Math.cos(ang) * r - 1.2;
    const y = Math.sin(ang) * r + 0.5;
    const w = 2.6 - t * 1.4;
    const h = 2.2 - t * 1.0;
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 2.6), flat(i % 2 ? COL.waveMid : COL.waveDeep));
    m.position.set(x, y, 0);
    m.rotation.z = -ang * 0.75;
    g.add(m);
  }

  // Foam claws: white tetrahedron clusters along the curling lip
  for (let i = 0; i < 12; i++) {
    const t = i / 11;
    const ang = t * Math.PI * 1.1;
    const r = 3.6 * (1 - t * 0.35);
    const x = Math.cos(ang) * r - 1.2 + 0.7;
    const y = Math.sin(ang) * r + 1.1;
    const claw = new THREE.Mesh(new THREE.TetrahedronGeometry(0.5), flat(COL.foam));
    claw.position.set(x, y, (Math.random()-0.5)*1.4);
    claw.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    g.add(claw);
  }

  g.scale.setScalar(scale);
  return g;
}

// ---- Oshiokuri-bune: a low-poly boat with rowers ----
function makeBoat() {
  const g = new THREE.Group();
  // hull: elongated box, upturned ends
  const hull = new THREE.Mesh(new THREE.BoxGeometry(7, 0.9, 1.6), flat(COL.hull));
  hull.position.y = 0;
  g.add(hull);
  // prow and stern tips
  const prow = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.6, 4), flat(COL.hullDark));
  prow.rotation.z = -Math.PI/2; prow.position.set(4.1, 0.5, 0); g.add(prow);
  const stern = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.4, 4), flat(COL.hullDark));
  stern.rotation.z = Math.PI/2; stern.position.set(-4.0, 0.4, 0); g.add(stern);
  // rowers: small dark spheres in a row
  for (let i = 0; i < 9; i++) {
    const r = new THREE.Mesh(new THREE.SphereGeometry(0.28, 6, 5), flat(0x2b2b2b));
    r.position.set(-2.6 + i * 0.65, 0.75, 0);
    g.add(r);
  }
  return g;
}

// ---- Mount Fuji: snow-capped cone ----
function makeFuji() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(7, 9, 7), flat(COL.fuji));
  body.position.y = 4.5;
  g.add(body);
  const snow = new THREE.Mesh(new THREE.ConeGeometry(3.2, 3.4, 7), flat(COL.fujiSnow));
  snow.position.y = 8.2;
  g.add(snow);
  return g;
}

// ---- Clouds: soft white low-poly puffs ----
function makeCloud() {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const p = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6 + Math.random(), 0), flat(COL.cloud));
    p.position.set(i * 1.8 - 2.7, Math.random() * 0.6, (Math.random()-0.5));
    p.scale.y = 0.6;
    g.add(p);
  }
  return g;
}

// ---- Compose the scene (print composition) ----
// Big wave left, curling right toward center
const bigWave = makeWave(1.6);
bigWave.position.set(-10, 3, 0);
scene.add(bigWave);

// Secondary wave right
const wave2 = makeWave(1.1);
wave2.position.set(11, 0, -4);
wave2.rotation.y = Math.PI;
scene.add(wave2);

// Foreground small wave
const wave3 = makeWave(0.8);
wave3.position.set(2, -3, 6);
scene.add(wave3);

// Three boats: one in the left trough, one center-right, one foreground
const boat1 = makeBoat(); boat1.position.set(-4, -1.5, 2);  boat1.rotation.y = 0.3;  scene.add(boat1);
const boat2 = makeBoat(); boat2.position.set(9, 0.5, -2);  boat2.rotation.y = -0.5; scene.add(boat2);
const boat3 = makeBoat(); boat3.position.set(1, -4.5, 8);  boat3.rotation.y = 0.1;  scene.add(boat3);

// Mt Fuji, center-right, behind the waves
const fuji = makeFuji();
fuji.position.set(4, -2, -14);
scene.add(fuji);

// Clouds upper right
const cloud1 = makeCloud(); cloud1.position.set(12, 10, -18); scene.add(cloud1);
const cloud2 = makeCloud(); cloud2.position.set(6, 12, -20); scene.add(cloud2);

// ---- Gentle motion ----
const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();

  // waves bob and crest gently
  bigWave.position.y = 3 + Math.sin(t * 0.8) * 0.6;
  bigWave.rotation.z = Math.sin(t * 0.5) * 0.04;
  wave2.position.y = 0 + Math.sin(t * 0.8 + 1.5) * 0.5;
  wave3.position.y = -3 + Math.sin(t * 0.8 + 3) * 0.4;

  // boats rock with the swell
  boat1.position.y = -1.5 + Math.sin(t * 1.1) * 0.35;
  boat1.rotation.z = Math.sin(t * 1.1) * 0.08;
  boat2.position.y = 0.5 + Math.sin(t * 1.1 + 1) * 0.3;
  boat2.rotation.z = Math.sin(t * 1.1 + 1) * 0.08;
  boat3.position.y = -4.5 + Math.sin(t * 1.1 + 2) * 0.3;
  boat3.rotation.z = Math.sin(t * 1.1 + 2) * 0.08;

  // clouds drift
  cloud1.position.x = 12 + Math.sin(t * 0.1) * 1.5;
  cloud2.position.x = 6 + Math.cos(t * 0.08) * 1.5;

  // slow camera sway
  camera.position.x = Math.sin(t * 0.15) * 0.8;
  camera.lookAt(0, 2, 0);

  renderer.render(scene, camera);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
