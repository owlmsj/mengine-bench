<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop! - Level 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
  body { font-family: 'Press Start 2P', monospace; }
  #game { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    background: rgba(10, 10, 30, 0.85); z-index: 10;
  }
  .hidden { display: none !important; }
  h1 { color: #ffd93d; font-size: clamp(20px, 5vw, 48px); text-shadow: 4px 4px 0 #c0392b; text-align: center; line-height: 1.4; }
  h2 { color: #ff6b6b; font-size: clamp(16px, 4vw, 36px); text-shadow: 3px 3px 0 #2c3e50; }
  .sub { color: #ecf0f1; font-size: clamp(8px, 1.6vw, 14px); text-align: center; line-height: 2; }
  .btn {
    font-family: inherit; font-size: clamp(12px, 2.4vw, 20px); color: #fff;
    background: linear-gradient(#f39c12, #d35400); border: 4px solid #fff;
    padding: 16px 32px; cursor: pointer; box-shadow: 0 6px 0 #7e3300;
    transition: transform 0.05s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #7e3300; }
  #finalScore { color: #ffd93d; font-size: clamp(14px, 3vw, 28px); }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay">
  <h1>BALLOON POP!</h1>
  <div class="sub">
    HOLD MOUSE TO DRAW THE BOW<br>
    AIM WITH THE CURSOR - RELEASE TO FIRE<br>
    POP 15 BALLOONS TO WIN<br>
    5 MISSES AND YOU LOSE
  </div>
  <button class="btn" id="startBtn">START</button>
</div>

<div id="endScreen" class="overlay hidden">
  <h2 id="endTitle">GAME OVER</h2>
  <div id="finalScore"></div>
  <button class="btn" id="retryBtn">PLAY AGAIN</button>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- audio ----------
let actx = null;
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur, type, vol, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol, hp) {
  const a = audio(); if (!a) return;
  const len = a.sampleRate * dur;
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
  const g = a.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start();
}
const sfx = {
  draw(p) { beep(120 + p * 240, 0.03, 'triangle', 0.05); },
  shoot(p) { noise(0.12, 0.25, 800); beep(300 + p * 200, 0.1, 'square', 0.12, 90); },
  pop(i) {
    noise(0.08, 0.5, 2000);
    beep(500 + i * 120, 0.09, 'sine', 0.35, 900 + i * 120);
    beep(200, 0.05, 'square', 0.15);
  },
  miss() { beep(220, 0.25, 'sawtooth', 0.12, 80); },
  win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25, 'square', 0.2), i * 140)); },
  lose() { [400, 350, 300, 200].forEach((f, i) => setTimeout(() => beep(f, 0.3, 'sawtooth', 0.18, f * 0.5), i * 180)); },
};

// ---------- game state ----------
const GOAL = 15, MAX_MISSES = 5;
const BALLOON_COLORS = ['#ff5252', '#ffd93d', '#4fc3f7', '#81c784', '#ba68c8', '#ff8a65'];

let state = 'menu'; // menu | play | win | lose
let score = 0, misses = 0, combo = 0, comboTimer = 0;
let balloons = [], arrows = [], particles = [], floaters = [];
let mouse = { x: 0, y: 0, down: false, drawStart: 0 };
let lastTime = 0;

function archerPos() { return { x: W * 0.12, y: H * 0.78 }; }

function spawnBalloon() {
  const r = 26 + Math.random() * 14;
  const fromLeft = Math.random() < 0.5;
  balloons.push({
    x: fromLeft ? -r : W + r,
    y: H * 0.12 + Math.random() * H * 0.55,
    r,
    vx: (fromLeft ? 1 : -1) * (55 + Math.random() * 70),
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 1.5 + Math.random() * 2,
    wobbleAmp: 12 + Math.random() * 14,
    color: BALLOON_COLORS[(Math.random() * BALLOON_COLORS.length) | 0],
    alive: true,
  });
}

function reset() {
  score = 0; misses = 0; combo = 0; comboTimer = 0;
  balloons = []; arrows = []; particles = []; floaters = [];
  for (let i = 0; i < 5; i++) spawnBalloon();
}

function startGame() {
  audio();
  reset();
  state = 'play';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
}

function endGame(won) {
  state = won ? 'win' : 'lose';
  const t = document.getElementById('endTitle');
  t.textContent = won ? 'YOU WIN!' : 'GAME OVER';
  t.style.color = won ? '#81c784' : '#ff6b6b';
  document.getElementById('finalScore').textContent = 'SCORE: ' + score;
  document.getElementById('endScreen').classList.remove('hidden');
  if (won) sfx.win(); else sfx.lose();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

// ---------- input ----------
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', e => {
  if (state !== 'play') return;
  mouse.down = true;
  mouse.drawStart = performance.now();
  beep(150, 0.04, 'triangle', 0.08);
});
window.addEventListener('mouseup', e => {
  if (state !== 'play' || !mouse.down) return;
  mouse.down = false;
  const power = drawPower();
  if (power < 0.12) return; // too weak, no shot
  const a = archerPos();
  const dx = mouse.x - a.x, dy = mouse.y - a.y;
  const dist = Math.hypot(dx, dy) || 1;
  const speed = 500 + power * 900;
  arrows.push({
    x: a.x, y: a.y,
    vx: dx / dist * speed, vy: dy / dist * speed,
    power,
    trail: [],
  });
  sfx.shoot(power);
});

function drawPower() {
  const t = (performance.now() - mouse.drawStart) / 1000;
  return Math.min(1, t / 0.9);
}

// ---------- particles ----------
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = 80 + Math.random() * 260;
    particles.push({
      x, y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 60,
      life: 0.5 + Math.random() * 0.5, maxLife: 1,
      size: 3 + Math.random() * 5,
      color,
      rot: Math.random() * Math.PI, rotSp: (Math.random() - 0.5) * 12,
    });
  }
}
function floater(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 1 });
}

// ---------- update ----------
function update(dt) {
  if (state !== 'play') return;

  // spawn balloons to keep the field busy
  const target = 5 + Math.floor(score / 4);
  if (balloons.length < Math.min(target, 10)) {
    if (Math.random() < dt * 2.5) spawnBalloon();
  }

  comboTimer = Math.max(0, comboTimer - dt);
  if (comboTimer === 0) combo = 0;

  // balloons
  for (const b of balloons) {
    b.x += b.vx * dt;
    b.wobble += b.wobbleSpeed * dt;
    b.y += Math.sin(b.wobble) * b.wobbleAmp * dt;
    if ((b.vx > 0 && b.x > W + b.r + 20) || (b.vx < 0 && b.x < -b.r - 20)) {
      b.alive = false;
    }
  }
  balloons = balloons.filter(b => b.alive);

  // arrows
  for (const ar of arrows) {
    ar.trail.push({ x: ar.x, y: ar.y });
    if (ar.trail.length > 8) ar.trail.shift();
    ar.x += ar.vx * dt;
    ar.y += ar.vy * dt;
    ar.vy += 30 * dt; // slight gravity for feel
    if (ar.x < -40 || ar.x > W + 40 || ar.y < -40 || ar.y > H + 40) ar.dead = true;

    for (const b of balloons) {
      if (!b.alive) continue;
      const dx = ar.x - b.x, dy = ar.y - b.y;
      if (dx * dx + dy * dy < (b.r + 6) * (b.r + 6)) {
        b.alive = false;
        ar.dead = true;
        combo++;
        comboTimer = 1.5;
        const pts = 10 * combo;
        score += pts;
        burst(b.x, b.y, b.color, 22);
        burst(b.x, b.y, '#ffffff', 6);
        floater(b.x, b.y - b.r, '+' + pts + (combo > 1 ? ' x' + combo : ''), '#ffd93d');
        sfx.pop(Math.min(combo, 6));
        if (score >= GOAL) { endGame(true); return; }
        break;
      }
    }
  }
  arrows = arrows.filter(a => !a.dead);

  // particles
  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 500 * dt;
    p.rot += p.rotSp * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  // floaters
  for (const f of floaters) { f.y -= 50 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);
}

// ---------- draw ----------
function drawBackground() {
  // sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4a90d9');
  g.addColorStop(0.6, '#87ceeb');
  g.addColorStop(1, '#b8e0f5');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // sun
  ctx.fillStyle = '#fff59d';
  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.15, 45, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,245,157,0.35)';
  ctx.beginPath(); ctx.arc(W * 0.85, H * 0.15, 65, 0, Math.PI * 2); ctx.fill();

  // clouds (simple, deterministic)
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const t = performance.now() / 1000;
  for (let i = 0; i < 4; i++) {
    const cx = ((t * (12 + i * 5) + i * 400) % (W + 300)) - 150;
    const cy = H * (0.1 + i * 0.09);
    cloud(cx, cy, 40 + i * 8);
  }

  // ground
  ctx.fillStyle = '#6ab04c';
  ctx.fillRect(0, H * 0.85, W, H * 0.15);
  ctx.fillStyle = '#5a9e42';
  ctx.fillRect(0, H * 0.85, W, 6);
}
function cloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, s * 0.5, 0, Math.PI * 2);
  ctx.arc(x + s * 0.45, y - s * 0.15, s * 0.42, 0, Math.PI * 2);
  ctx.arc(x + s * 0.9, y, s * 0.48, 0, Math.PI * 2);
  ctx.arc(x + s * 0.45, y + s * 0.12, s * 0.4, 0, Math.PI * 2);
  ctx.fill();
}

function drawBalloon(b) {
  ctx.save();
  ctx.translate(b.x, b.y);
  // string
  ctx.strokeStyle = 'rgba(80,80,80,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, b.r);
  ctx.quadraticCurveTo(4, b.r + 14, -2, b.r + 28);
  ctx.stroke();
  // body
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, b.r * 0.88, b.r, 0, 0, Math.PI * 2);
  ctx.fill();
  // knot
  ctx.beginPath();
  ctx.moveTo(-5, b.r * 0.92); ctx.lineTo(5, b.r * 0.92); ctx.lineTo(0, b.r * 1.12);
  ctx.closePath(); ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.ellipse(-b.r * 0.32, -b.r * 0.35, b.r * 0.2, b.r * 0.3, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawArcher() {
  const a = archerPos();
  const dx = mouse.x - a.x, dy = mouse.y - a.y;
  const ang = Math.atan2(dy, dx);
  const power = mouse.down && state === 'play' ? drawPower() : 0;
  const draw = power * 26;

  ctx.save();
  ctx.translate(a.x, a.y);

  // legs
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-4, 14); ctx.lineTo(-10, 40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, 14); ctx.lineTo(10, 40); ctx.stroke();
  // body
  ctx.strokeStyle = '#37474f'; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, -14); ctx.stroke();
  // head
  ctx.fillStyle = '#ffcc80';
  ctx.beginPath(); ctx.arc(0, -24, 9, 0, Math.PI * 2); ctx.fill();
  // hat
  ctx.fillStyle = '#6d4c41';
  ctx.fillRect(-11, -33, 22, 5);
  ctx.fillRect(-7, -40, 14, 8);

  // bow arm + bow
  ctx.rotate(ang);
  ctx.strokeStyle = '#37474f'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(22, -6); ctx.stroke();
  // bow
  ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.arc(22, -6, 20, -Math.PI / 2.4, Math.PI / 2.4);
  ctx.stroke();
  // string
  const topX = 22 + 20 * Math.cos(-Math.PI / 2.4), topY = -6 + 20 * Math.sin(-Math.PI / 2.4);
  const botX = 22 + 20 * Math.cos(Math.PI / 2.4), botY = -6 + 20 * Math.sin(Math.PI / 2.4);
  const nockX = 22 - draw, nockY = -6;
  ctx.strokeStyle = '#eceff1'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(topX, topY); ctx.lineTo(nockX, nockY); ctx.lineTo(botX, botY);
  ctx.stroke();
  // arrow nocked
  if (mouse.down && state === 'play') {
    ctx.strokeStyle = '#a1887f'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(nockX, nockY); ctx.lineTo(nockX + 34, nockY); ctx.stroke();
    ctx.fillStyle = '#eceff1';
    ctx.beginPath();
    ctx.moveTo(nockX + 34, nockY - 4); ctx.lineTo(nockX + 42, nockY); ctx.lineTo(nockX + 34, nockY + 4);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // power bar
  if (mouse.down && state === 'play') {
    const bw = 90, bh = 12, bx = a.x - bw / 2, by = a.y + 52;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    pg.addColorStop(0, '#4caf50'); pg.addColorStop(0.6, '#ffc107'); pg.addColorStop(1, '#f44336');
    ctx.fillStyle = pg;
    ctx.fillRect(bx, by, bw * power, bh);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
  }
}

function drawArrow(ar) {
  const ang = Math.atan2(ar.vy, ar.vx);
  // trail
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ar.trail.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.lineTo(ar.x, ar.y);
  ctx.stroke();
  ctx.save();
  ctx.translate(ar.x, ar.y);
  ctx.rotate(ang);
  ctx.strokeStyle = '#a1887f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(8, 0); ctx.stroke();
  ctx.fillStyle = '#eceff1';
  ctx.beginPath();
  ctx.moveTo(8, -4); ctx.lineTo(16, 0); ctx.lineTo(8, 4);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f44336';
  ctx.beginPath();
  ctx.moveTo(-26, -4); ctx.lineTo(-20, 0); ctx.lineTo(-26, 4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.fillStyle = p.color;
  ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
  ctx.restore();
}

function drawHUD() {
  ctx.font = '16px "Press Start 2P", monospace';
  ctx.textAlign = 'left';
  // score panel
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(14, 14, 230, 92, 10); ctx.fill();
  ctx.fillStyle = '#ffd93d';
  ctx.fillText('SCORE ' + score + '/' + GOAL, 30, 44);
  // misses as hearts
  ctx.fillStyle = '#ff5252';
  for (let i = 0; i < MAX_MISSES; i++) {
    const hx = 34 + i * 34;
    heart(hx, 74, i < MAX_MISSES - misses ? '#ff5252' : 'rgba(255,255,255,0.25)');
  }
  if (combo > 1) {
    ctx.fillStyle = '#4fc3f7';
    ctx.textAlign = 'center';
    ctx.fillText('COMBO x' + combo, W / 2, 40);
  }
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function heart(x, y, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y + 4);
  ctx.bezierCurveTo(x, y, x - 7, y - 2, x - 7, y + 3);
  ctx.bezierCurveTo(x - 7, y + 8, x, y + 11, x, y + 13);
  ctx.bezierCurveTo(x, y + 11, x + 7, y + 8, x + 7, y + 3);
  ctx.bezierCurveTo(x + 7, y - 2, x, y, x, y + 4);
  ctx.fill();
}

function drawFloater(f) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, f.life);
  ctx.font = '14px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText(f.text, f.x + 2, f.y + 2);
  ctx.fillStyle = f.color;
  ctx.fillText(f.text, f.x, f.y);
  ctx.restore();
}

// ---------- main loop ----------
function frame(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
  lastTime = now;
  update(dt);

  drawBackground();
  for (const b of balloons) drawBalloon(b);
  for (const ar of arrows) drawArrow(ar);
  drawArcher();
  for (const p of particles) drawParticle(p);
  for (const f of floaters) drawFloater(f);
  if (state === 'play') drawHUD();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
