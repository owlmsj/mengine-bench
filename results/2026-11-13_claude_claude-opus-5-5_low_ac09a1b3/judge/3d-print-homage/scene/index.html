<!doctype html><html><head><meta charset="utf-8"><title>Great Wave - low poly</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9dcbc}</style></head><body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(devicePixelRatio);r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xe9dcbc);s.fog=new THREE.Fog(0xe9dcbc,60,140);
const c=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,300);c.position.set(0,6,40);c.lookAt(0,6,0);
s.add(new THREE.HemisphereLight(0xfff6e0,0x1c3a66,1.6));const d=new THREE.DirectionalLight(0xffffff,1.2);d.position.set(10,20,15);s.add(d);
const M=(col)=>new THREE.MeshLambertMaterial({color:col,flatShading:true,side:THREE.DoubleSide});
const PRUSSIAN=0x1b3f73,MID=0x4f7fae,FOAM=0xf3ecd8,BOAT=0xe4b98a,SKYGREY=0x8a8a84;
// dark horizon band (grey sky behind Fuji)
const band=new THREE.Mesh(new THREE.PlaneGeometry(200,14),new THREE.MeshBasicMaterial({color:0xb7b0a0}));band.position.set(0,2,-40);s.add(band);
// clouds
for(const [x,y,k] of [[12,22,6],[22,18,5],[-18,26,4]]){const g=new THREE.Mesh(new THREE.IcosahedronGeometry(k,0),M(0xf5efe0));g.position.set(x,y,-50);g.scale.set(2,0.6,0.3);s.add(g);}
// Fuji small in centre distance
const fuji=new THREE.Mesh(new THREE.ConeGeometry(4,2.6,7),M(0x2a4d80));fuji.position.set(5,0.8,-20);s.add(fuji);
const cap=new THREE.Mesh(new THREE.ConeGeometry(2.2,1.45,7),M(0xffffff));cap.position.set(5,1.55,-19.95);s.add(cap);
// sea
const seaG=new THREE.PlaneGeometry(200,120,60,40);seaG.rotateX(-Math.PI/2);const sea=new THREE.Mesh(seaG,M(MID));sea.position.z=-20;s.add(sea);
const base=seaG.attributes.position.array.slice();
// Great wave: curling tube of rings, left side
const wave=new THREE.Group();s.add(wave);const tips=[];
const N=26;
for(let i=0;i<N;i++){const t=i/(N-1);const ang=t*Math.PI*1.35;const R=11*(1-t*0.55);
 const x=-14+Math.sin(ang)*R*0.9+t*8,y=Math.max(0,(1-Math.cos(ang))*R*0.9);
 const seg=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.6,22-t*6,1,1,3),M(t>0.75?FOAM:(i%2?PRUSSIAN:MID)));
 seg.position.set(x,y,-4);seg.rotation.z=-ang;wave.add(seg);
 if(t>0.55){for(let k=0;k<6;k++){const f=new THREE.Mesh(new THREE.TetrahedronGeometry(0.5+Math.random()*0.5),M(FOAM));f.position.set(x+(Math.random()-.5)*2,y+(Math.random()-.5)*2,-4+(Math.random()-.5)*18);wave.add(f);tips.push([f,f.position.clone(),Math.random()*6]);}}
}
// foreground smaller wave mimicking Fuji shape + right-side swell
function swell(x,z,h,w,col){const g=new THREE.ConeGeometry(w,h,6,1,true);const m=new THREE.Mesh(g,M(col));m.position.set(x,h/2-1,z);m.scale.z=0.5;s.add(m);const top=new THREE.Mesh(new THREE.ConeGeometry(w*0.35,h*0.35,6),M(FOAM));top.position.set(x,h-1-h*0.17,z);top.scale.z=0.5;s.add(top);return [m,top];}
const swells=[swell(-6,6,7,7,PRUSSIAN),swell(18,-2,9,9,MID)];
// three oshiokuri-bune boats
function boat(x,y,z,rz){const g=new THREE.Group();const hull=new THREE.Mesh(new THREE.BoxGeometry(12,0.6,1.4),M(BOAT));g.add(hull);
 for(let i=0;i<8;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(0.32,5,4),M(PRUSSIAN));p.position.set(-4+i*1.1,0.5,0);g.add(p);}
 g.position.set(x,y,z);g.rotation.z=rz;s.add(g);return g;}
const boats=[boat(-14,4,2,-0.5),boat(11,2.5,-6,0.3),boat(4,-0.2,10,-0.15)];
const clock=new THREE.Clock();
function loop(){const t=clock.getElapsedTime();
 const p=seaG.attributes.position;for(let i=0;i<p.count;i++){const x=base[i*3],z=base[i*3+2];p.array[i*3+1]=Math.sin(x*0.15+t)*0.6+Math.cos(z*0.2+t*0.8)*0.5;}p.needsUpdate=true;
 wave.rotation.z=Math.sin(t*0.4)*0.02;wave.position.y=Math.sin(t*0.4)*0.3;
 for(const [f,o,ph] of tips){f.position.y=o.y+Math.sin(t*1.3+ph)*0.25;f.rotation.x=t+ph;}
 boats.forEach((b,i)=>{b.position.y+=Math.sin(t*0.9+i*2)*0.006;b.rotation.x=Math.sin(t*0.7+i)*0.05;});
 swells.forEach(([m,top],i)=>{m.rotation.y=Math.sin(t*0.6+i)*0.05;top.rotation.y=m.rotation.y;});
 c.position.x=Math.sin(t*0.1)*1.5;c.lookAt(0,6,0);
 r.render(s,c);requestAnimationFrame(loop);}loop();
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
</script></body></html>
