<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Great Wave - Low Poly Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe3c2}
  canvas{display:block}
  #ui{position:fixed;left:24px;top:20px;color:#1b4477;font-family:'Shippori Mincho',serif;pointer-events:none}
  #ui .jp{font-size:26px;letter-spacing:4px;writing-mode:vertical-rl;line-height:1.5}
  #credit{position:fixed;right:16px;bottom:12px;font:11px sans-serif;color:#1b4477aa;pointer-events:none}
</style>
</head>
<body>
<div id="ui"><div class="jp">神奈川沖浪裏</div></div>
<div id="credit">after Katsushika Hokusai, The Great Wave off Kanagawa (ca. 1831)</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// Palette sampled from the print
const C = {
  cream: 0xefe3c2, grayCloud: 0x8f887e,
  deep: 0x1b4477, prussian: 0x2b5d8c, mid: 0x4a7fab,
  foam: 0xdce6dd, paper: 0xf2ecd9, ochre: 0xd9b98a, dark: 0x14304f
};

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.cream);
scene.fog = new THREE.Fog(C.cream, 90, 190);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 400);
camera.position.set(6, 14, 46);
camera.lookAt(-2, 7, -10);

scene.add(new THREE.HemisphereLight(0xfff6e0, 0x2b5d8c, 1.2));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.5);
sun.position.set(-14, 26, 20);
scene.add(sun);

function mat(color, double=false){
  return new THREE.MeshPhongMaterial({color, flatShading:true, shininess:12, side: double?THREE.DoubleSide:THREE.FrontSide});
}

// ---------- Mount Fuji: small snow-capped cone, horizon center-right ----------
function makeFuji(){
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 7, 5.5, 7, 1), mat(C.prussian));
  cone.position.y = 2.75; g.add(cone);
  const snow = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 2.6, 1.8, 7, 1), mat(C.paper));
  snow.position.y = 4.6; g.add(snow);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.8, 7), mat(C.paper));
  cap.position.y = 5.75; g.add(cap);
  g.position.set(16, 5.5, -90);
  return g;
}
scene.add(makeFuji());

// gray cloud band across the horizon (as in the print)
const cloud = new THREE.Mesh(new THREE.PlaneGeometry(220, 10),
  new THREE.MeshBasicMaterial({color:C.grayCloud, transparent:true, opacity:0.5}));
cloud.position.set(6, 12, -110);
scene.add(cloud);

// ---------- rolling sea ----------
const seaGeo = new THREE.PlaneGeometry(220, 130, 30, 20);
seaGeo.rotateX(-Math.PI/2);
const sea = new THREE.Mesh(seaGeo, mat(C.deep));
scene.add(sea);
const basePos = seaGeo.attributes.position.array.slice();

// ---------- The Great Wave: left, curling right, foam claws ----------
function claw(len){
  const g = new THREE.Group();
  for(let i=0;i<7;i++){
    const t = i/6;
    const seg = new THREE.Mesh(
      new THREE.BoxGeometry(len*0.34*(1-t*0.7), 0.75*(1-t*0.5), 0.9),
      mat(i%2 ? C.paper : C.foam));
    seg.position.set(t*len*0.42, Math.sin(t*2.0)*1.0 + 0.4, (i%3-1)*0.35);
    seg.rotation.z = -t*1.0;
    g.add(seg);
  }
  return g;
}

function bigWave(){
  const g = new THREE.Group();
  // steep swell body
  const body = new THREE.Mesh(new THREE.CylinderGeometry(4.5, 13, 24, 6, 3), mat(C.deep));
  body.position.set(-26, 10, -8);
  body.rotation.z = 0.5;
  g.add(body);
  // lighter face on the swell
  const face = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 9, 20, 6, 2), mat(C.prussian));
  face.position.set(-21, 8.5, -4.5);
  face.rotation.z = 0.55;
  g.add(face);
  // the curl: torus arc leaning right over the trough
  const curl = new THREE.Mesh(new THREE.TorusGeometry(8, 3.4, 5, 10, Math.PI*1.1), mat(C.prussian));
  curl.position.set(-12, 19, -6);
  curl.rotation.y = Math.PI/2;
  curl.rotation.z = -0.35;
  g.add(curl);
  // foam claws hanging from the crest
  const claws = [];
  for(let i=0;i<7;i++){
    const c = claw(3.8);
    const a = 0.12 + i*0.15;
    c.position.set(-12 + Math.cos(a)*8.2, 19 + Math.sin(a)*8.2, -7.5 + (i%3-1)*1.6);
    c.userData = {baseY: c.position.y, ph: i*0.7, claw:true};
    claws.push(c); g.add(c);
  }
  g.userData.claws = claws;
  // spray points below the crest
  const pts = [];
  for(let i=0;i<140;i++){
    const a = Math.random()*Math.PI*1.15;
    pts.push(-12+Math.cos(a)*9 + (Math.random()-0.5)*7, 19+Math.sin(a)*9 + (Math.random()-0.5)*6, -7+(Math.random()-0.5)*9);
  }
  const spray = new THREE.Points(
    new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pts,3)),
    new THREE.PointsMaterial({color:C.paper, size:0.4}));
  g.add(spray);
  g.userData.spray = spray;
  return g;
}
const great = bigWave();
scene.add(great);

// secondary swell humps (mid trough wave and big right wave)
const humps = new THREE.Group();
function hump(x,z,s,color){
  const m = new THREE.Mesh(new THREE.ConeGeometry(5*s, 8*s, 6), mat(color));
  m.position.set(x, 0, z);
  m.userData = {baseY: 0, ph: Math.random()*6};
  return m;
}
const phA = 1.3, phB = 3.7, phC2 = 5.1;
humps.add(hump(2, 6, 1.4, C.prussian));  humps.children[0].userData.ph = phA;
humps.add(hump(30, 14, 2.4, C.deep));    humps.children[1].userData.ph = phB;
humps.add(hump(-34, 18, 1.5, C.prussian)); humps.children[2].userData.ph = phC2;
scene.add(humps);
const caps = new THREE.Group();
function cap(x,z,s,ph){
  const m = new THREE.Mesh(new THREE.ConeGeometry(1.7*s, 1.3*s, 6), mat(C.paper));
  m.position.set(x, 4*s, z);
  m.userData = {baseY: 4*s, ph};
  return m;
}
caps.add(cap(2,6,1.4,phA), cap(30,14,2.4,phB), cap(-34,18,1.5,phC2));
scene.add(caps);

// ---------- three ochre boats with dark rowers ----------
function boat(){
  const b = new THREE.Group();
  const hull = new THREE.Mesh(
    new THREE.CylinderGeometry(1.0, 0.55, 8, 6, 1, false, 0, Math.PI),
    mat(C.ochre, true));
  hull.rotation.z = Math.PI/2; hull.rotation.x = Math.PI/2;
  hull.position.y = 0.6;
  b.add(hull);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(7, 0.25, 1.5), mat(C.dark));
  deck.position.y = 0.85; b.add(deck);
  const cargo = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.9, 1.4), mat(C.dark));
  cargo.position.set(1.0, 1.35, 0); b.add(cargo);
  for(let i=0;i<5;i++){
    const r = new THREE.Mesh(new THREE.SphereGeometry(0.3, 5, 4), mat(C.dark));
    r.position.set(-2.6+i*1.2, 1.55, 0);
    b.add(r);
  }
  return b;
}
const boatA = boat(); boatA.position.set(-16, 5.5, 4);  boatA.rotation.set(0, 0.3, -1.0); // tumbling under the great wave
const boatB = boat(); boatB.position.set(20, 1.0, -34); boatB.rotation.set(0, -0.4, 0.4); boatB.scale.setScalar(0.5); // small, before Fuji
const boatC = boat(); boatC.position.set(12, 0.5, 22);  boatC.rotation.set(0, 0.9, 0.55); // bottom, big
scene.add(boatA, boatB, boatC);
const boats = [
  {g:boatA, y:5.5, tilt:-1.0, ph:0.0},
  {g:boatB, y:1.0, tilt: 0.4, ph:2.1},
  {g:boatC, y:0.5, tilt: 0.55, ph:4.2}
];

// ---------- gentle motion ----------
const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  // great wave breathes and sways
  great.position.y = Math.sin(t*0.4)*1.1;
  great.rotation.z = Math.sin(t*0.25)*0.04;
  great.userData.spray.position.y = Math.sin(t*0.8)*0.7;
  for(const c of great.userData.claws)
    c.position.y = c.userData.baseY + Math.sin(t*0.85 + c.userData.ph)*0.4;
  // sea swell
  const pos = seaGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x = basePos[i*3], z = basePos[i*3+2];
    pos.setY(i, Math.sin(x*0.07 + t*0.55)*0.9 + Math.cos(z*0.09 + t*0.4)*0.6);
  }
  pos.needsUpdate = true;
  seaGeo.computeVertexNormals();
  // humps bob
  for(const h of humps.children) h.position.y = h.userData.baseY + Math.sin(t*0.5 + h.userData.ph)*0.7;
  for(const h of caps.children)  h.position.y = h.userData.baseY + Math.sin(t*0.5 + h.userData.ph)*0.7;
  // boats pitch and heave
  for(const b of boats){
    b.g.position.y = b.y + Math.sin(t*0.65 + b.ph)*0.6;
    b.g.rotation.x = Math.sin(t*0.75 + b.ph)*0.08;
    b.g.rotation.z = b.tilt + Math.sin(t*0.5 + b.ph)*0.08;
  }
  // slow camera drift, wallpaper-like
  camera.position.x = 6 + Math.sin(t*0.12)*1.2;
  camera.position.y = 14 + Math.sin(t*0.18)*0.5;
  camera.lookAt(-2, 7, -10);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
