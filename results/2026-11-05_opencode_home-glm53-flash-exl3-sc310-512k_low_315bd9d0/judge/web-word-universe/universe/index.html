});
const points = new THREE.Points(geo,mat); scene.add(points);

const lgeo = new THREE.BufferGeometry();
const lpos = new Float32Array(elist.length*6), lcol = new Float32Array(elist.length*6);
lgeo.setAttribute('position',new THREE.BufferAttribute(lpos,3));
lgeo.setAttribute('color',new THREE.BufferAttribute(lcol,3));
const lines = new THREE.LineSegments(lgeo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.5}));
scene.add(lines);

// labels
const labelEls = nodes.map(nd=>{const d=document.createElement('div');d.className='label';d.textContent=nd.n;d.style.color=col(nd.n);document.body.appendChild(d);return d;});
function placeLabels(){
  const v=new THREE.Vector3();
  nodes.forEach((nd,i)=>{
    const el=labelEls[i];
    if(nd.deg>=8 || i===sel || (sel>=0 && nbrs.has(i))){
      v.copy(nd.p).applyAxisAngle(new THREE.Vector3(1,0,0),rotX).applyAxisAngle(new THREE.Vector3(0,1,0),rotY);
      v.multiplyScalar(dist/90); v.project(camera);
      const behind=v.z>1;
      el.style.left=(v.x*0.5+0.5)*innerWidth+'px';
      el.style.top=(-v.y*0.5+0.5)*innerHeight+'px';
      el.style.opacity=behind?0:(i===sel?1:(sel>=0&&nbrs.has(i)?0.95:0.5));
    } else el.style.opacity=0;
  });
}

// simulation
function tick(){
  for(let k=0;k<2;k++){
    for(const nd of nodes){nd.v.multiplyScalar(0.85);}
    for(const e of elist){
      const a=nodes[e.a],b=nodes[e.b];
      const d=a.p.clone().sub(b.p);const l=Math.max(d.length(),0.01);
      const f=(l-12)/l*0.02;d.multiplyScalar(f);a.v.sub(d);b.v.add(d);
    }
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i],b=nodes[j];const d=a.p.clone().sub(b.p);const l2=Math.max(d.lengthSq(),0.01);
      if(l2<100){d.multiplyScalar(0.4/l2);a.v.add(d);b.v.sub(d);}
    }
    for(const nd of nodes){nd.p.add(nd.v);nd.p.clampLength(0,45);}
  }
}
function draw(){
  nodes.forEach((nd,i)=>pos.set([nd.p.x,nd.p.y,nd.p.z],i*3));
  geo.attributes.position.needsUpdate=true;
  elist.forEach((e,i)=>{
    const a=nodes[e.a].p,b=nodes[e.b].p;
    lpos.set([a.x,a.y,a.z,b.x,b.y,b.z],i*6);
    const on=(sel<0)||(e.a===sel||e.b===sel);
    const cc=on?(e.k==='sin'?[0.35,0.85,0.5]:[0.9,0.55,0.35]):[0.18,0.2,0.28];
    lcol.set([...cc,...cc],i*6);
  });
  lgeo.attributes.position.needsUpdate=true;lgeo.attributes.color.needsUpdate=true;
  // dim non-neighbors
  nodes.forEach((nd,i)=>{c.set(col(nd.n));
    const on=(sel<0)||i===sel||nbrs.has(i);
    const f=on?1:0.18;colr.set([c.r*f,c.g*f,c.b*f],i*3);});
  geo.attributes.color.needsUpdate=true;
  camera.position.set(0,0,dist);
  camera.rotation.set(0,0,0);
  camera.rotateY(rotY);camera.rotateX(rotX);
  renderer.render(scene,camera);
  placeLabels();
}
function loop(){tick();draw();requestAnimationFrame(loop);}

// interaction
let sel=-1; const nbrs=new Set();
canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
  if(dragging){rotY+=(e.clientX-px)*0.005;rotX+=(e.clientY-py)*0.005;rotX=Math.max(-1.4,Math.min(1.4,rotX));px=e.clientX;py=e.clientY;}
});
canvas.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(25,Math.min(220,dist*(1+e.deltaY*0.001)));},{passive:false});
canvas.addEventListener('click',e=>{
  const m=new THREE.Vector3((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  const r=new THREE.Raycaster();r.params.Points={threshold:2.5};
  const v=new THREE.Vector3();
  let best=-1,bd=1e9;
  nodes.forEach((nd,i)=>{
    v.copy(nd.p).applyAxisAngle(new THREE.Vector3(1,0,0),rotX).applyAxisAngle(new THREE.Vector3(0,1,0),rotY);
    v.multiplyScalar(dist/90).project(camera);
    const sx=(v.x*0.5+0.5)*innerWidth, sy=(-v.y*0.5+0.5)*innerHeight;
    const d2=(sx-e.clientX)**2+(sy-e.clientY)**2;
    if(d2<bd){bd=d2;best=i;}
  });
  if(best>=0&&bd<400)select(names[best]);
});

const qEl=document.getElementById('q'), dl=document.getElementById('dl');
names.forEach(n=>{const o=document.createElement('option');o.value=n;dl.appendChild(o);});
qEl.addEventListener('change',()=>{const v=qEl.value.trim().toLowerCase();
  const hit=names.find(n=>n.toLowerCase()===v)||names.find(n=>n.toLowerCase().startsWith(v));
  if(hit)select(hit);});
qEl.addEventListener('keydown',e=>{if(e.key==='Enter')qEl.dispatchEvent(new Event('change'));});

const wordEl=document.getElementById('word'), temaEl=document.getElementById('tema'), defsEl=document.getElementById('defs'), shareEl=document.getElementById('share');
function chip(w,cls){const s=document.createElement('span');s.className='chip '+cls;s.textContent=w;s.onclick=()=>select(w);return s;}
function select(w){
  sel=id(w);nbrs.clear();
  WORDS[w].sinonimos.forEach(t=>nbrs.add(id(t)));
  WORDS[w].analogas.forEach(t=>nbrs.add(id(t)));
  wordEl.textContent=w;wordEl.style.color=col(w);
  temaEl.textContent=WORDS[w].tema||'sem tema';
  defsEl.innerHTML='';
  const g1=document.createElement('div');g1.className='grp';g1.innerHTML='<h3>Sinônimos ('+WORDS[w].sinonimos.length+')</h3>';
  WORDS[w].sinonimos.forEach(t=>g1.appendChild(chip(t,'sin')));
  const g2=document.createElement('div');g2.className='grp';g2.innerHTML='<h3>Palavras análogas ('+WORDS[w].analogas.length+')</h3>';
  WORDS[w].analogas.forEach(t=>g2.appendChild(chip(t,'ana')));
  const g3=document.createElement('div');g3.className='grp';g3.innerHTML='<h3>Vizinhos no grafo ('+nbrs.size+')</h3>';
  defsEl.append(g1,g2,g3);
  const url=location.pathname+'?word='+encodeURIComponent(w);
  history.replaceState(null,'',url);
  shareEl.style.display='block';shareEl.textContent=location.origin==='null'?url:location.origin+url;
  shareEl.onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(shareEl.textContent);
  dist=Math.min(dist,70);
}
window.__select=select;

// resize + start
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
for(let i=0;i<60;i++)tick(); // pre-relax layout
const w0=new URLSearchParams(location.search).get('word');
if(w0&&WORDS[w0])select(w0); else if(w0){const hit=names.find(n=>n.toLowerCase()===w0.toLowerCase());if(hit)select(hit);}
loop();
</script>
</body>
</html>
