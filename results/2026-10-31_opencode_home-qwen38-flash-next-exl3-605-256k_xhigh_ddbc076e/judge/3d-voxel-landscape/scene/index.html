<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mount Fuji &amp; Chureito Pagoda at Dusk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a3e; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xe89a72, 0.0038);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1200);
const CAM_BASE = new THREE.Vector3(17, 7, 32);
const CAM_TARGET = new THREE.Vector3(-3, 7.5, -46);
camera.position.copy(CAM_BASE);
camera.lookAt(CAM_TARGET);

// ---------- lighting: warm dusk sun ----------
const SUN_DIR = new THREE.Vector3(26, 20, -150).normalize();
const sun = new THREE.DirectionalLight(0xffb27a, 2.0);
sun.position.copy(SUN_DIR).multiplyScalar(200);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffd9c4, 0x332a52, 0.85));
const fill = new THREE.DirectionalLight(0xc9a8e8, 0.75);
fill.position.set(30, 35, 110);
scene.add(fill);

// ---------- sky dome (procedural dusk gradient + sun glow) ----------
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(600, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: { uSun: { value: SUN_DIR.clone() } },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vDir;
      uniform vec3 uSun;
      void main() {
        vec3 d = normalize(vDir);
        float h = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 low  = vec3(0.99, 0.72, 0.50);
        vec3 mid  = vec3(0.90, 0.47, 0.42);
        vec3 top  = vec3(0.15, 0.12, 0.34);
        vec3 col = mix(low, mid, smoothstep(0.44, 0.56, h));
        col = mix(col, top, smoothstep(0.56, 0.92, h));
        float s = max(dot(d, normalize(uSun)), 0.0);
        col += vec3(1.0, 0.78, 0.52) * pow(s, 350.0) * 1.4;
        col += vec3(1.0, 0.58, 0.34) * pow(s, 7.0) * 0.28;
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(sky);

// ---------- ground ----------
const groundGeo = new THREE.PlaneGeometry(800, 800, 56, 56);
groundGeo.rotateX(-Math.PI / 2);
{
  const p = groundGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    const d = Math.hypot(x, z);
    const k = Math.min(1, d / 40);
    p.setY(i, (Math.sin(x * 0.11) * Math.cos(z * 0.09) + Math.sin(x * 0.31 + z * 0.21)) * 0.55 * k);
  }
  groundGeo.computeVertexNormals();
  const ng = groundGeo.toNonIndexed();
  const np = ng.attributes.position;
  const col = new Float32Array(np.count * 3);
  const a = new THREE.Color('#6f8f57'), b = new THREE.Color('#54764a'), c = new THREE.Color('#7d9a5e');
  for (let i = 0; i < np.count; i += 3) {
    const cx = (np.getX(i) + np.getX(i + 1) + np.getX(i + 2)) / 3;
    const cz = (np.getZ(i) + np.getZ(i + 1) + np.getZ(i + 2)) / 3;
    const t = (Math.sin(cx * 0.09) * Math.cos(cz * 0.07) + 1) * 0.5;
    const colFace = a.clone().lerp(t > 0.55 ? c : b, Math.abs(t - 0.5) * 1.6);
    for (let j = 0; j < 3; j++) {
      col[(i + j) * 3] = colFace.r; col[(i + j) * 3 + 1] = colFace.g; col[(i + j) * 3 + 2] = colFace.b;
    }
  }
  ng.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(ng, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true })));
}

// ---------- Mount Fuji ----------
function makeFuji() {
  const geo = new THREE.ConeGeometry(52, 40, 15, 6);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (y < 19.5 && y > -19.9) {
      const k = 1 + (Math.sin(x * 0.35 + z * 0.22) * 0.6 + Math.sin(y * 0.5) * 0.4) * 0.035;
      p.setX(i, x * k); p.setZ(i, z * k);
    }
  }
  geo.computeVertexNormals();
  const ng = geo.toNonIndexed();
  const np = ng.attributes.position;
  const col = new Float32Array(np.count * 3);
  const rock = new THREE.Color('#565d80'), rockShade = new THREE.Color('#454b6b');
  const snow = new THREE.Color('#f4f1fa'), snowWarm = new THREE.Color('#ffdcc9');
  for (let i = 0; i < np.count; i += 3) {
    const ay = (np.getY(i) + np.getY(i + 1) + np.getY(i + 2)) / 3;
    const ax = (np.getX(i) + np.getX(i + 1) + np.getX(i + 2)) / 3;
    const snowLine = 7.5 + Math.sin(ax * 0.4) * 2.2;
    let face;
    if (ay > snowLine + 3) face = snow.clone();
    else if (ay > snowLine) face = rock.clone().lerp(snowWarm, (ay - snowLine) / 3);
    else face = (ax % 7 < 3.5 ? rock : rockShade).clone();
    for (let j = 0; j < 3; j++) {
      col[(i + j) * 3] = face.r; col[(i + j) * 3 + 1] = face.g; col[(i + j) * 3 + 2] = face.b;
    }
  }
  ng.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const m = new THREE.Mesh(ng, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }));
  m.position.set(6, 20, -160);
  return m;
}
scene.add(makeFuji());

// distant ridges to close the horizon
const ridgeMat = new THREE.MeshLambertMaterial({ color: '#5a4f78', flatShading: true });
[[-120, -150, 40, 16], [130, -170, 55, 20], [-40, -200, 70, 24], [200, -120, 45, 13]].forEach(([x, z, r, h]) => {
  const ridge = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), ridgeMat);
  ridge.position.set(x, h / 2 - 0.5, z);
  scene.add(ridge);
});

// ---------- Chureito pagoda: red, five tiers ----------
function makePagoda() {
  const g = new THREE.Group();
  const red = new THREE.MeshLambertMaterial({ color: 0xc23b2e, flatShading: true });
  const deepRed = new THREE.MeshLambertMaterial({ color: 0x8f2a20, flatShading: true });
  const tile = new THREE.MeshLambertMaterial({ color: 0x37324e, flatShading: true });
  const gold = new THREE.MeshLambertMaterial({ color: 0xe8b84a, flatShading: true });

  const base = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.7, 5.2), tile);
  base.position.y = 0.35;
  g.add(base);

  let y = 0.7, w = 3.6;
  for (let i = 0; i < 5; i++) {
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, 1.5, w), i % 2 ? deepRed : red);
    body.position.y = y + 0.75;
    g.add(body);
    const rail = new THREE.Mesh(new THREE.BoxGeometry(w * 1.28, 0.22, w * 1.28), red);
    rail.position.y = y + 0.12;
    g.add(rail);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 1.18, 0.95, 4), tile);
    roof.rotation.y = Math.PI / 4;
    roof.position.y = y + 1.5 + 0.475;
    g.add(roof);
    y += 1.5 + 0.95;
    w *= 0.83;
  }
  const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.1, 2.2, 6), gold);
  spire.position.y = y + 1.1;
  g.add(spire);
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(new THREE.SphereGeometry(0.16 - i * 0.03, 6, 5), gold);
    ring.position.y = y + 0.5 + i * 0.5;
    g.add(ring);
  }
  return g;
}
const pagoda = makePagoda();
pagoda.position.set(-13, 0, -18);
pagoda.scale.setScalar(1.15);
pagoda.rotation.y = 0.5;
scene.add(pagoda);

// ---------- cherry trees in bloom ----------
const canopyMats = ['#f6c3d6', '#f9d7e4', '#ec9fbc', '#f3b3cb'].map(
  c => new THREE.MeshLambertMaterial({ color: c, flatShading: true })
);
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5d4234, flatShading: true });
const trees = [];
function makeTree(x, z, s, lean) {
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16 * s, 0.34 * s, 2.6 * s, 6), trunkMat);
  trunk.position.y = 1.3 * s;
  trunk.rotation.z = lean;
  t.add(trunk);
  const blob = new THREE.IcosahedronGeometry(1, 0);
  for (let i = 0; i < 6; i++) {
    const r = (0.85 + Math.random() * 0.65) * s;
    const m = new THREE.Mesh(blob, canopyMats[i % canopyMats.length]);
    const a = (i / 6) * Math.PI * 2 + Math.random();
    m.position.set(Math.cos(a) * 1.05 * s, (2.5 + Math.random() * 1.2) * s, Math.sin(a) * 1.05 * s);
    m.scale.setScalar(r);
    m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    t.add(m);
  }
  const crown = new THREE.Mesh(blob, canopyMats[1]);
  crown.scale.setScalar(1.15 * s);
  crown.position.y = 3.7 * s;
  t.add(crown);
  t.position.set(x, 0, z);
  t.userData.phase = Math.random() * Math.PI * 2;
  trees.push(t);
  return t;
}
scene.add(makeTree(10, 6, 1.5, 0.08));
scene.add(makeTree(16, -3, 1.2, -0.06));
scene.add(makeTree(13, 17, 1.7, -0.05));
scene.add(makeTree(-19, 4, 1.1, -0.09));
scene.add(makeTree(-4, -4, 0.9, 0.1));

// stone lantern accent near the pagoda
const lantern = new THREE.Group();
const stone = new THREE.MeshLambertMaterial({ color: 0x8d8a96, flatShading: true });
lantern.add(new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.4, 0.9, 6), stone));
const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.7), stone);
head.position.y = 0.8;
lantern.add(head);
const cap = new THREE.Mesh(new THREE.ConeGeometry(0.7, 0.45, 4), stone);
cap.rotation.y = Math.PI / 4;
cap.position.y = 1.25;
lantern.add(cap);
lantern.position.set(-5.5, 0.45, -3);
scene.add(lantern);

// ---------- drifting petals ----------
const PETALS = 260;
const petalMesh = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.16, 0.1),
  new THREE.MeshBasicMaterial({ color: 0xf7bcd2, side: THREE.DoubleSide, transparent: true, opacity: 0.95 }),
  PETALS
);
const petals = [];
for (let i = 0; i < PETALS; i++) {
  petals.push({
    pos: new THREE.Vector3((Math.random() - 0.4) * 55, Math.random() * 16, (Math.random() - 0.5) * 60 - 5),
    phase: Math.random() * Math.PI * 2,
    fall: 0.5 + Math.random() * 0.9,
    spin: 1 + Math.random() * 3
  });
}
scene.add(petalMesh);
const dummy = new THREE.Object3D();

// ---------- animation ----------
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();

  camera.position.x = CAM_BASE.x + Math.sin(t * 0.11) * 1.6;
  camera.position.y = CAM_BASE.y + Math.sin(t * 0.15 + 1.3) * 0.5;
  camera.lookAt(CAM_TARGET);

  for (const tree of trees) {
    tree.rotation.z = Math.sin(t * 0.7 + tree.userData.phase) * 0.018;
  }

  for (let i = 0; i < PETALS; i++) {
    const pt = petals[i];
    pt.pos.y -= pt.fall * 0.016;
    pt.pos.x += Math.sin(t * pt.spin + pt.phase) * 0.012 + 0.006;
    pt.pos.z += Math.cos(t * pt.spin * 0.8 + pt.phase) * 0.008;
    if (pt.pos.y < 0.05) {
      pt.pos.y = 14 + Math.random() * 4;
      pt.pos.x = (Math.random() - 0.4) * 55;
      pt.pos.z = (Math.random() - 0.5) * 60 - 5;
    }
    dummy.position.copy(pt.pos);
    dummy.rotation.set(t * pt.spin + pt.phase, pt.phase, t * pt.spin * 0.6);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
