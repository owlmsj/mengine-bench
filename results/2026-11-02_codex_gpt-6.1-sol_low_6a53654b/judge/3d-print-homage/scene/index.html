const mats=new Map();function mat(c){if(!mats.has(c))mats.set(c,new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true}));return mats.get(c)}

function claw(x,y,scale,angle,z,parent){const g=new THREE.Group();g.position.set(x,860-y,z);g.rotation.z=angle;parent.add(g);const pts=[[0,0],[12*scale,14*scale],[16*scale,29*scale],[10*scale,37*scale],[1*scale,34*scale]];const cv=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],p[1],0)));g.add(new THREE.Mesh(new THREE.TubeGeometry(cv,7,4*scale,4,false),mat(C.foam)));for(let j=0;j<2;j++){const branch=new THREE.CatmullRomCurve3([new THREE.Vector3(10*scale,18*scale,0),new THREE.Vector3((24+j*6)*scale,(24+j*8)*scale,0),new THREE.Vector3((23+j*7)*scale,(32+j*8)*scale,0)]);g.add(new THREE.Mesh(new THREE.TubeGeometry(branch,4,2*scale,4,false),mat(C.foam)))}return g}

let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;const button=document.querySelector('#motion');function label(){button.textContent=paused?'PLAY ▷':'PAUSE ∥';button.setAttribute('aria-label',paused?'Play animation':'Pause animation')}label();button.onclick=()=>{paused=!paused;label()};let t=0,last=0;function frame(ms){const dt=Math.min((ms-last)/1000,.05);last=ms;if(!paused)t+=dt;breaker.position.y=Math.sin(t*.42)*2.2;breaker.rotation.z=Math.sin(t*.3)*.0012;boats.forEach((b,i)=>{b.position.y+=0; b.rotation.x=Math.sin(t*.65+i)*.025;b.position.z=[115,119,198][i]+Math.sin(t*.7+i)*2.5});spray.position.y=Math.sin(t*.5)*3;renderer.render(scene,camera);requestAnimationFrame(frame)}
