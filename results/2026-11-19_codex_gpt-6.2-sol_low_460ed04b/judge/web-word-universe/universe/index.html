    position.set(word,[x+radius*Math.cos(phase),y+radius*Math.sin(phase)]);
  }
  const label=svg(labels,"text",{x:cx+(rx+72)*Math.cos(angle),y:cy+(ry+69)*Math.sin(angle)+4,"text-anchor":"middle",class:"theme-label",fill:color(theme)},theme);
  label.addEventListener("click",()=>showTheme(theme));
  themeLabels.set(theme,label);
}
function curve(a,b){
  const [x1,y1]=position.get(a),[x2,y2]=position.get(b);
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const tension=themes[a]===themes[b]?0:.34;
  return "M"+x1+" "+y1+" Q"+(mx+(cx-mx)*tension)+" "+(my+(cy-my)*tension)+" "+x2+" "+y2;
}
const lines=edges.map(([a,b,kind])=>[a,b,kind,svg(paths,"path",{d:curve(a,b),class:"edge"+(themes[a]===themes[b]?" within":"")})]);
const livePaths=svg(chart,"g",{"aria-hidden":"true"});
chart.insertBefore(livePaths,nodes);
for(const word of words){
  const [x,y]=position.get(word);
  const dot=svg(nodes,"circle",{cx:x,cy:y,r:2.1+degree(word)*.19,class:"dot",fill:color(themes[word])});
  dot.addEventListener("click",()=>choose(word));
  dot.addEventListener("pointerenter",event=>{tip.textContent=word+" · "+degree(word);tip.hidden=false;moveTip(event);});
  dot.addEventListener("pointermove",moveTip);
  dot.addEventListener("pointerleave",()=>{tip.hidden=true;});
  dots.set(word,dot);
}
function moveTip(event){
  const box=document.querySelector("#mapbody").getBoundingClientRect();
  tip.style.left=Math.min(event.clientX-box.left+10,box.width-tip.offsetWidth-5)+"px";
  tip.style.top=Math.max(0,event.clientY-box.top-29)+"px";
}
let selected=null, activeTheme=null;
function render(){
  const near=selected?adjacency.get(selected):new Map();
  const themeIsActive=theme=>selected?[...near.keys(),selected].some(word=>themes[word]===theme):!activeTheme||activeTheme===theme;
  reset.hidden=!selected&&!activeTheme;
  mapTitle.textContent=selected?"Relações de "+selected:activeTheme?"Tema: "+activeTheme:"Mapa de relações";
  legend.innerHTML=selected?'<span class="legend"><i class="sample ivory"></i>Sinônimo</span><span class="legend"><i class="sample gold"></i>Palavra análoga</span>':'<span class="legend"><i class="sample dotkey"></i>Cada ponto é uma palavra</span><span class="legend"><i class="sample"></i>Cada linha é uma relação</span><span>O tamanho indica o número de relações</span>';
  livePaths.replaceChildren();
  highlights.replaceChildren();
  for(const [a,b,kind,line] of lines){
    const linked=selected===a||selected===b;
    const inTheme=activeTheme&&(themes[a]===activeTheme||themes[b]===activeTheme);
    line.classList.toggle("dim",Boolean(selected||activeTheme));
    if(linked||inTheme)svg(livePaths,"path",{d:line.getAttribute("d"),class:"edge lit"+(linked&&(kind&1)?" syn":"")});
  }
  const shown=[];
  for(const [word,dot] of dots){
    const isSelected=word===selected,isNeighbor=near.has(word);
    dot.classList.toggle("dim",selected?!isSelected&&!isNeighbor:!!activeTheme&&themes[word]!==activeTheme);
    dot.classList.toggle("hot",isNeighbor);
    dot.classList.toggle("active",isSelected);
    if(isSelected||isNeighbor)shown.push(word);
  }
  for(const [theme,label] of themeLabels)label.classList.toggle("dim",!themeIsActive(theme));
  if(selected)labelWords(shown);
  renderDetail();
}
function labelWords(shown){
  const placed=[];
  for(const word of [selected,...shown.filter(word=>word!==selected)]){
    const [x,y]=position.get(word);
    const size=word===selected?17:13,width=word.length*size*.57;
    const candidates=[[9,-8],[-width-9,-8],[9,17],[-width-9,17],[-width/2,-20],[-width/2,28]];
    const clear=([dx,dy])=>x+dx>6&&x+dx+width<894&&!placed.some(([left,top,w])=>x+dx<left+w+4&&x+dx+width>left-4&&Math.abs(y+dy-top)<17);
    const offset=candidates.find(clear);
    if(!offset)continue;
    const [dx,dy]=offset;
    placed.push([x+dx,y+dy,width]);
    svg(highlights,"text",{x:x+dx,y:y+dy,class:"word-label"+(word===selected?" active":"")},word);
  }
}
function renderDetail(){
  if(selected){
    const theme=themes[selected], near=adjacency.get(selected);
    const related=kind=>[...near].filter(([,flags])=>flags&kind).map(([word])=>word).sort(collator.compare);
    const synonyms=related(1), analogs=related(2);
    detail.innerHTML='<h2>'+selected+'</h2><p class="meta">'+swatch(theme)+theme+' · '+degree(selected)+' relações diretas</p>'+
      '<h3>Sinônimos ('+synonyms.length+')</h3><div class="words">'+(synonyms.map(chip).join("")||"Nenhum neste acervo.")+'</div>'+
      '<h3>Palavras análogas ('+analogs.length+')</h3><div class="words">'+(analogs.map(chip).join("")||"Nenhuma neste acervo.")+'</div>'+
      '<button type="button" class="share" id="share">Copiar link da palavra</button><p id="share-status" role="status"></p>';
    return;
  }
  if(activeTheme){
    const members=words.filter(word=>themes[word]===activeTheme);
    detail.innerHTML='<h2>'+activeTheme+'</h2><p class="meta">'+swatch(activeTheme)+members.length+' palavras neste tema</p><div class="words">'+members.map(chip).join("")+'</div><h3>Temas do mapa</h3>'+themeButtons(activeTheme);
    return;
  }
  detail.innerHTML='<h2>Por onde começar?</h2><p>Selecione um ponto ou tema no mapa, ou comece por <a data-word="saudade" href="?word=saudade">saudade</a>.</p><h3>Temas do mapa</h3>'+themeButtons(null)+
    '<h3>Palavras mais conectadas</h3><p>'+degree(hubs[0])+' relações diretas cada</p><div class="words">'+hubs.map(chip).join("")+'</div>';
}
function clearFeedback(){feedback.hidden=true;feedback.textContent="";}
function choose(word,historyMode="push"){
  selected=word;activeTheme=null;query.value=word||"";tip.hidden=true;
  closeSuggestions();clearFeedback();
  if(historyMode==="push"&&new URLSearchParams(location.search).get("word")!==word)history.pushState(null,"",url(word));
  render();
}
function showTheme(theme){
  if(selected)history.pushState(null,"",url(null));
  selected=null;activeTheme=activeTheme===theme?null:theme;
  query.value="";closeSuggestions();clearFeedback();render();
}
function resolve(raw){
  const clean=raw.trim().normalize("NFC").toLowerCase();
  if(adjacency.has(clean))return clean;
  if(Object.hasOwn(aliases,clean))return aliases[clean];
  return words.find(word=>fold(word)===fold(clean));
}
let matches=[], focused=-1;
function closeSuggestions(){
  matches=[];focused=-1;suggest.hidden=true;query.setAttribute("aria-expanded","false");query.removeAttribute("aria-activedescendant");
}
function suggestions(){
  clearFeedback();
  const term=fold(query.value);
  if(!term){closeSuggestions();return;}
  matches=words.filter(word=>fold(word).startsWith(term)).concat(words.filter(word=>!fold(word).startsWith(term)&&fold(word).includes(term))).slice(0,7);
  if(!matches.length){closeSuggestions();return;}
  focused=-1;query.removeAttribute("aria-activedescendant");
  suggest.innerHTML=matches.map((word,i)=>'<li id="option-'+i+'" role="option" aria-selected="false" data-option="'+i+'">'+word+'<small>'+themes[word]+'</small></li>').join("");
  suggest.hidden=false;query.setAttribute("aria-expanded","true");
}
function reportMissing(raw){
  feedback.textContent=raw.trim()?'Nenhuma palavra encontrada para “'+raw.trim()+'”.':"Digite uma palavra para buscar.";
  feedback.hidden=false;
}
query.addEventListener("input",suggestions);
query.addEventListener("focus",()=>{if(query.value!==selected)suggestions();});
query.addEventListener("keydown",event=>{
  if(event.key==="Escape"){closeSuggestions();return;}
  if(event.key!=="ArrowDown"&&event.key!=="ArrowUp")return;
  if(!matches.length)suggestions();
  if(!matches.length)return;
  event.preventDefault();
  focused=focused<0?(event.key==="ArrowDown"?0:matches.length-1):(focused+(event.key==="ArrowDown"?1:-1)+matches.length)%matches.length;
  [...suggest.children].forEach((item,i)=>item.setAttribute("aria-selected",i===focused));
  query.setAttribute("aria-activedescendant","option-"+focused);
});
suggest.addEventListener("pointerdown",event=>event.preventDefault());
suggest.addEventListener("click",event=>{
  const option=event.target.closest("[data-option]");
  if(option)choose(matches[Number(option.dataset.option)]);
});
document.addEventListener("pointerdown",event=>{if(!event.target.closest("#search"))closeSuggestions();});
document.querySelector("#search").addEventListener("focusout",event=>{if(!event.currentTarget.contains(event.relatedTarget))closeSuggestions();});
document.querySelector("#search").addEventListener("submit",event=>{
  event.preventDefault();
  const word=matches[focused]||resolve(query.value)||matches[0];
  if(word)choose(word);
  else reportMissing(query.value);
});
reset.addEventListener("click",()=>choose(null));
detail.addEventListener("click",async event=>{
  const word=event.target.closest("[data-word]"),theme=event.target.closest("[data-theme]");
  if(word&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&!event.altKey){event.preventDefault();choose(word.dataset.word);detail.querySelector("h2").setAttribute("tabindex","-1");detail.querySelector("h2").focus();}
  if(theme){const name=theme.dataset.theme;showTheme(name);detail.querySelector('[data-theme="'+name+'"]').focus();}
  if(event.target.id==="share"){
    const status=document.querySelector("#share-status");
    const address=new URL(url(selected),location.href).href;
    try{await navigator.clipboard.writeText(address);status.textContent="Link copiado.";}
    catch{status.replaceChildren();const field=document.createElement("input");field.value=address;field.readOnly=true;field.setAttribute("aria-label","Link da palavra");field.style.width="100%";status.append(field);field.focus();field.select();}
  }
});
function readUrl(){
  const raw=new URLSearchParams(location.search).get("word");
  const word=raw?resolve(raw):null;
  choose(word||null,"none");
  if(raw&&!word){query.value=raw;reportMissing(raw);}
}
window.addEventListener("popstate",readUrl);
readUrl();
</script>
</body>
