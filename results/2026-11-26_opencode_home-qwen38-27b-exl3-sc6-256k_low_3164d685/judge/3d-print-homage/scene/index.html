<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Wave off Kanagawa — low poly 3D</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #e8dcc0; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---- Palette from the print (prussian blue woodblock) ----
const C = {
  paper:   0xe8dcc0,
  blueDk:  0x16305e,
  blueMd:  0x2a5a8b,
  blueLt:  0x7ba7c9,
  foam:    0xf2ede0,
  foamSh:  0xb8c4c4,
  boat:    0xc9a06a,
  boatDk:  0x8a6a3a,
  fuji:    0x24406e,
  snow:    0xf2ede0,
  ink:     0x14202e,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 80, 180);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 8, 42);
camera.lookAt(0, 2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const dir = new THREE.DirectionalLight(0xfff4e0, 0.5);
dir.position.set(-10, 20, 10);
scene.add(dir);

function mat(color) { return new THREE.MeshLambertMaterial({ color, flatShading: true }); }

// ---- Mt. Fuji: small, center-right, snow-capped, clearly visible ----
const fuji = new THREE.Group();
const fujiBody = new THREE.Mesh(new THREE.ConeGeometry(8, 10, 7), mat(C.fuji));
fujiBody.position.y = 5;
fuji.add(fujiBody);
const fujiCap = new THREE.Mesh(new THREE.ConeGeometry(4.5, 4.5, 7), mat(C.snow));
fujiCap.position.y = 8;
fuji.add(fujiCap);
fuji.position.set(8, -1, -20);
scene.add(fuji);

// ---- Great Wave: left, curling over toward center ----
const wave = new THREE.Group();

// Wave body: rounded mass on the left (smaller)
const waveBody = new THREE.Mesh(
  new THREE.SphereGeometry(9, 8, 6, 0, Math.PI*2, 0, Math.PI*0.55),
  mat(C.blueDk)
);
waveBody.scale.set(1.3, 0.8, 1);
waveBody.position.set(-10, -1, 0);
wave.add(waveBody);

// The curl: torus arc forming the breaking crest
const curl = new THREE.Mesh(
  new THREE.TorusGeometry(5.5, 2.8, 6, 10, Math.PI * 1.3),
  mat(C.blueDk)
);
curl.rotation.z = Math.PI * 0.55;
curl.position.set(-6, 4, 0);
wave.add(curl);

// Inner curl (lighter)
const curlIn = new THREE.Mesh(
  new THREE.TorusGeometry(5.5, 1.9, 5, 8, Math.PI * 1.15),
  mat(C.blueMd)
);
curlIn.rotation.z = Math.PI * 0.55;
curlIn.position.set(-6, 4, 0.5);
wave.add(curlIn);

// Foam along the crest: white cones
const foamMat = mat(C.foam);
const foamShMat = mat(C.foamSh);
for (let i = 0; i <= 18; i++) {
  const t = i / 18;
  const ang = Math.PI * 0.1 + t * Math.PI * 1.2;
  const x = -6 + Math.cos(ang) * 5.5;
  const y = 4 + Math.sin(ang) * 5.5;
  const n = 2 + (i % 3);
  for (let k = 0; k < n; k++) {
    const s = 0.35 + Math.random() * 0.5;
    const f = new THREE.Mesh(new THREE.ConeGeometry(s, s*2.4, 5),
      (i % 2 ? foamMat : foamShMat));
    f.position.set(x + (Math.random()-0.5)*1.8, y + (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.0);
    f.rotation.set((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5);
    wave.add(f);
  }
}

// Foreground wave: rolling swell across the bottom (lower so boats show)
const fgWave = new THREE.Mesh(
  new THREE.SphereGeometry(14, 8, 5, 0, Math.PI*2, 0, Math.PI*0.4),
  mat(C.blueMd)
);
fgWave.scale.set(1.8, 0.4, 1);
fgWave.position.set(0, -6, 6);
wave.add(fgWave);

// FG foam ridges
for (let i = 0; i < 14; i++) {
  const s = 0.5 + Math.random()*0.8;
  const f = new THREE.Mesh(new THREE.ConeGeometry(s, s*1.6, 5), foamMat);
  f.position.set(-12 + i*1.7, -4.5 + Math.sin(i*0.8)*1.0, 6 + (Math.random()-0.5)*3);
  f.rotation.z = (Math.random()-0.5)*0.6;
  wave.add(f);
}

// Right wave: smaller, background right
const rw = new THREE.Mesh(
  new THREE.SphereGeometry(5, 7, 5, 0, Math.PI*2, 0, Math.PI*0.5),
  mat(C.blueLt)
);
rw.scale.set(1.5, 0.6, 1);
rw.position.set(20, -3, -8);
wave.add(rw);

scene.add(wave);

// ---- Boats: 3, each with 9 crew, clearly visible on the water ----
function makeBoat() {
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(5, 0.6, 1.3), mat(C.boat));
  g.add(hull);
  const bow = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 1.2), mat(C.boat));
  bow.position.set(2.6, 0.35, 0); bow.rotation.z = 0.5; g.add(bow);
  const stern = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.8, 1.2), mat(C.boatDk));
  stern.position.set(-2.6, 0.35, 0); stern.rotation.z = -0.5; g.add(stern);
  const crewMat = mat(C.ink);
  for (let i = 0; i < 9; i++) {
    const c = new THREE.Mesh(new THREE.SphereGeometry(0.22, 5, 4), crewMat);
    c.position.set(-1.9 + i * 0.5, 0.55, 0);
    g.add(c);
  }
  return g;
}

// Boat 1: under the great wave (left)
const boat1 = makeBoat();
boat1.position.set(-10, 2.5, 3);
boat1.rotation.z = 0.2;
scene.add(boat1);

// Boat 2: center, in front of Fuji
const boat2 = makeBoat();
boat2.position.set(3, 1.0, -2);
boat2.rotation.z = -0.08;
scene.add(boat2);

// Boat 3: right side
const boat3 = makeBoat();
boat3.position.set(15, 1.5, 0);
boat3.rotation.z = 0.12;
scene.add(boat3);

// ---- Gentle motion ----
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  wave.position.y = Math.sin(t * 0.6) * 0.35;
  wave.rotation.z = Math.sin(t * 0.4) * 0.012;

  boat1.position.y = 2.5 + Math.sin(t * 0.8 + 1) * 0.3;
  boat1.rotation.z = 0.2 + Math.sin(t * 0.7) * 0.05;
  boat2.position.y = 1.0 + Math.sin(t * 0.8 + 2) * 0.25;
  boat2.rotation.z = -0.08 + Math.sin(t * 0.7 + 1) * 0.04;
  boat3.position.y = 1.5 + Math.sin(t * 0.8 + 3) * 0.3;
  boat3.rotation.z = 0.12 + Math.sin(t * 0.7 + 2) * 0.05;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
