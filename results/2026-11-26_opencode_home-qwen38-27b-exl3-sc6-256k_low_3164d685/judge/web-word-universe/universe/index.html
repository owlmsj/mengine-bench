<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0a10; --ink:#f3ead8; --dim:#9a8f7d; --line:#2a2633;
  --gold:#d8a24a; --rose:#c96f6f; --teal:#5fa8a0;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 700px at 70% -10%, #1a1626 0%, transparent 60%),
    radial-gradient(900px 600px at 10% 110%, #141019 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  overflow:hidden;
}
#stage{position:fixed;inset:0}
canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
header{
  pointer-events:auto;padding:20px 26px;display:flex;align-items:baseline;gap:14px;
}
header h1{
  font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;margin:0;letter-spacing:.5px;
}
header h1 em{color:var(--gold);font-style:italic}
header .sub{color:var(--dim);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
#searchwrap{
  pointer-events:auto;margin:0 26px;max-width:560px;position:relative;
}
#search{
  width:100%;padding:13px 18px;border-radius:999px;border:1px solid var(--line);
  background:rgba(20,17,26,.72);backdrop-filter:blur(8px);color:var(--ink);
  font-family:'Inter',sans-serif;font-size:15px;outline:none;transition:border-color .2s;
}
#search:focus{border-color:var(--gold)}
#search::placeholder{color:var(--dim)}
#sug{
  position:absolute;top:calc(100% + 8px);left:0;right:0;max-height:260px;overflow:auto;
  background:rgba(16,13,22,.96);border:1px solid var(--line);border-radius:14px;
  padding:6px;display:none;box-shadow:0 18px 50px rgba(0,0,0,.5);
}
#sug button{
  display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);
  font-family:'Inter',sans-serif;font-size:14.5px;padding:9px 14px;border-radius:9px;cursor:pointer;
}
#sug button:hover,#sug button.sel{background:rgba(216,162,74,.14);color:var(--gold)}
#panel{
  pointer-events:auto;margin:14px 26px 0;padding:20px 22px;max-width:430px;
  background:rgba(16,13,22,.82);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  transition:opacity .3s, transform .3s;
}
#panel.hidden{opacity:0;transform:translateY(8px);pointer-events:none}
#panel .word{
  font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;line-height:1;margin:0 0 2px;
}
#panel .deg{color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
#panel .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:12px 0 7px}
#panel .chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13.5px;font-family:'Inter',sans-serif;
  transition:all .15s;
}
.chip:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.chip.syn{border-color:rgba(201,111,111,.5)}
.chip.syn:hover{border-color:var(--rose);color:var(--rose)}
#stats{
  pointer-events:auto;margin-top:auto;padding:16px 26px;display:flex;gap:26px;align-items:baseline;
}
#stats .n{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--gold)}
#stats .k{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-left:6px}
#hint{position:fixed;bottom:16px;right:22px;color:var(--dim);font-size:11.5px;letter-spacing:.06em;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
  <header>
    <h1>Universo de <em>Palavras</em></h1>
    <span class="sub">dicionário criativo</span>
  </header>
  <div id="searchwrap">
    <input id="search" type="text" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="sug"></div>
  </div>
  <div id="panel" class="hidden">
    <p class="word" id="pword"></p>
    <p class="deg" id="pdeg"></p>
    <div class="lbl">sinônimos</div><div class="chips" id="psyn"></div>
    <div class="lbl">análogas</div><div class="chips" id="pana"></div>
  </div>
  <div id="stats">
    <span><span class="n" id="sn"></span><span class="k">palavras</span></span>
    <span><span class="n" id="sr"></span><span class="k">relações</span></span>
    <span><span class="n" id="sm"></span><span class="k">mais ligada</span></span>
  </div>
</div>
<div id="hint">arraste para girar · role para aproximar · clique numa palavra</div>

dor":{"name":"lavrador","links":[{"to":"pescador","type":"sinonimos"},{"to":"Pastor","type":"sinonimos"},{"to":"padeiro","type":"analogas"},{"to":"Oficio","type":"analogas"},{"to":"selva","type":"analogas"},{"to":"engenheiro","type":"analogas"}]},"pavor":{"name":"pavor","links":[{"to":"medo","type":"sinonimos"},{"to":"Susto","type":"sinonimos"},{"to":"medo","type":"analogas"},{"to":"melancolia","type":"analogas"},{"to":"aflicao","type":"analogas"},{"to":"pais","type":"analogas"},{"to":"ontem","type":"analogas"},{"to":"ritmo","type":"analogas"}]},"Jardim":{"name":"jardim","links":[{"to":"fruto","type":"sinonimos"},{"to":"campo","type":"sinonimos"},{"to":"petala","type":"analogas"},{"to":"escultura","type":"analogas"},{"to":"montanha","type":"analogas"},{"to":"praia","type":"analogas"}]},"sentido":{"name":"sentido","links":[{"to":"frase","type":"sinonimos"},{"to":"significado","type":"sinonimos"},{"to":"sangue","type":"analogas"},{"to":"trabalho","type":"analogas"},{"to":"historia","type":"analogas"},{"to":"mandioca","type":"analogas"},{"to":"significado","type":"analogas"}]},"farinha":{"name":"farinha","links":[{"to":"pao","type":"sinonimos"},{"to":"Trigo","type":"sinonimos"},{"to":"vinho","type":"analogas"},{"to":"pescador","type":"analogas"}]},"boca":{"name":"boca","links":[{"to":"olho","type":"sinonimos"},{"to":"língua","type":"sinonimos"},{"to":"rosto","type":"analogas"},{"to":"ombro","type":"analogas"},{"to":"Alfaiate","type":"analogas"},{"to":"acougueiro","type":"analogas"},{"to":"livro","type":"analogas"}]},"letra":{"name":"letra","links":[{"to":"apelido","type":"sinonimos"},{"to":"silaba","type":"sinonimos"},{"to":"significado","type":"analogas"},{"to":"dia","type":"analogas"}]},"mês":{"name":"mês","links":[{"to":"ano","type":"sinonimos"},{"to":"Semana","type":"sinonimos"},{"to":"era","type":"analogas"},{"to":"momento","type":"analogas"},{"to":"ferreiro","type":"analogas"},{"to":"sinonimo","type":"analogas"}]},"linguagem":{"name":"linguagem","links":[{"to":"Idioma","type":"sinonimos"},{"to":"frase","type":"sinonimos"},{"to":"riacho","type":"analogas"},{"to":"grito","type":"analogas"},{"to":"cachoeira","type":"analogas"}]},"conversa":{"name":"conversa","links":[{"to":"Fala","type":"sinonimos"},{"to":"silencio","type":"sinonimos"},{"to":"grito","type":"analogas"},{"to":"felicidade","type":"analogas"}]},"giria":{"name":"gíria","links":[{"to":"sinonimo","type":"sinonimos"},{"to":"sotaque","type":"sinonimos"},{"to":"crepusculo","type":"analogas"},{"to":"alma","type":"analogas"},{"to":"frase","type":"analogas"},{"to":"Idioma","type":"analogas"},{"to":"sotaque","type":"analogas"}]},"arroz":{"name":"arroz","links":[{"to":"Trigo","type":"sinonimos"},{"to":"feijao","type":"sinonimos"},{"to":"cha","type":"analogas"},{"to":"Madrugada","type":"analogas"},{"to":"feijao","type":"analogas"}]},"advogado":{"name":"advogado","links":[{"to":"professor","type":"sinonimos"},{"to":"Juiz","type":"sinonimos"},{"to":"cachoeira","type":"analogas"},{"to":"Hora","type":"analogas"},{"to":"coracoes","type":"analogas"},{"to":"Juiz","type":"analogas"},{"to":"eternidade","type":"analogas"},{"to":"Fala","type":"analogas"},{"to":"palavra","type":"analogas"}]}};
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
let THREE;
try { THREE = await import(THREE_URL); } catch(e){ document.body.insertAdjacentHTML("beforeend","<p style='color:#c96f6f;padding:20px'>three.js não carregou</p>"); throw e; }

const words = DATA; // key -> {name, links:[{to,type}]}
const keys = Object.keys(words);
const idx = new Map(keys.map((k,i)=>[k,i]));
const N = keys.length;
// build edges (distinct pairs) + adjacency
const edgeSet = new Set();
const adj = Array.from({length:N},()=>[]);
let relations = 0;
for (const k of keys){
  const a = idx.get(k);
  for (const l of words[k].links){
    const b = idx.get(l.to);
    if (b===undefined || b===a) continue;
    const id = a<b ? a+"|"+b : b+"|"+a;
    if (!edgeSet.has(id)){ edgeSet.add(id); relations++; }
    adj[a].push(b); adj[b].push(a);
  }
}
const deg = adj.map(a=>a.length);
let maxDeg=0, mostKey=keys[0];
deg.forEach((d,i)=>{ if(d>maxDeg){maxDeg=d;mostKey=keys[i];} });

// ---- layout: force-directed in 3D, run synchronously ----
const pos = new Float32Array(N*3);
const vel = new Float32Array(N*3);
// seed on a sphere
for (let i=0;i<N;i++){
  const t = i/N*Math.PI*2, p = Math.acos(1-2*(i+0.5)/N);
  const r = 60;
  pos[i*3]   = r*Math.sin(p)*Math.cos(t);
  pos[i*3+1] = r*Math.cos(p);
  pos[i*3+2] = r*Math.sin(p)*Math.sin(t);
}
const edges = [...edgeSet].map(id=>id.split("|").map(Number));
for (let iter=0; iter<220; iter++){
  // repulsion (O(N^2) fine for 256)
  for (let i=0;i<N;i++){
    for (let j=i+1;j<N;j++){
      let dx=pos[i*3]-pos[j*3], dy=pos[i*3+1]-pos[j*3+1], dz=pos[i*3+2]-pos[j*3+2];
      let d2=dx*dx+dy*dy+dz*dz+0.01;
      let f = 900/d2;
      let d=Math.sqrt(d2); dx/=d;dy/=d;dz/=d;
      vel[i*3]+=dx*f; vel[i*3+1]+=dy*f; vel[i*3+2]+=dz*f;
      vel[j*3]-=dx*f; vel[j*3+1]-=dy*f; vel[j*3+2]-=dz*f;
    }
  }
  // springs
  for (const [a,b] of edges){
    let dx=pos[b*3]-pos[a*3], dy=pos[b*3+1]-pos[a*3+1], dz=pos[b*3+2]-pos[a*3+2];
    let d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    let f=(d-14)*0.02;
    dx/=d;dy/=d;dz/=d;
    vel[a*3]+=dx*f; vel[a*3+1]+=dy*f; vel[a*3+2]+=dz*f;
    vel[b*3]-=dx*f; vel[b*3+1]-=dy*f; vel[b*3+2]-=dz*f;
  }
  // centering + integrate
  for (let i=0;i<N;i++){
    vel[i*3]-=pos[i*3]*0.004; vel[i*3+1]-=pos[i*3+1]*0.004; vel[i*3+2]-=pos[i*3+2]*0.004;
    vel[i*3]*=0.85; vel[i*3+1]*=0.85; vel[i*3+2]*=0.85;
    pos[i*3]+=vel[i*3]; pos[i*3+1]+=vel[i*3+1]; pos[i*3+2]+=vel[i*3+2];
  }
}

// ---- three.js scene ----
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(0,0,170);

const nodeGeo = new THREE.SphereGeometry(1, 12, 12);
const nodeMat = new THREE.MeshBasicMaterial({color:0x9a8f7d, transparent:true, opacity:0.85});
const nodes = [];
for (let i=0;i<N;i++){
  const m = new THREE.Mesh(nodeGeo, nodeMat.clone());
  m.position.set(pos[i*3],pos[i*3+1],pos[i*3+2]);
  const s = 0.7 + deg[i]*0.16;
  m.scale.setScalar(s);
  m.userData.i = i;
  scene.add(m); nodes.push(m);
}
const linePos = new Float32Array(edges.length*6);
edges.forEach((e,k)=>{
  linePos[k*6]=pos[e[0]*3]; linePos[k*6+1]=pos[e[0]*3+1]; linePos[k*6+2]=pos[e[0]*3+2];
  linePos[k*6+3]=pos[e[1]*3]; linePos[k*6+4]=pos[e[1]*3+1]; linePos[k*6+5]=pos[e[1]*3+2];
});
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos,3));
const lineMat = new THREE.LineBasicMaterial({color:0x3a3346, transparent:true, opacity:0.5});
scene.add(new THREE.LineSegments(lineGeo, lineMat));

// labels via sprites for top words + selected
function makeLabel(text, big){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const font = (big?44:26)+"px 'Cormorant Garamond', serif";
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text).width)+16;
  c.width=w; c.height=big?64:44;
  const ctx2 = c.getContext("2d");
  ctx2.font=font; ctx2.fillStyle= big?"#d8a24a":"#f3ead8";
  ctx2.textBaseline="middle";
  ctx2.fillText(text,8,c.height/2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter=THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false});
  const sp = new THREE.Sprite(mat);
  sp.scale.set(w/ (big?10:14), c.height/(big?10:14), 1);
  return sp;
}
const labelSel = makeLabel("", true); labelSel.visible=false; scene.add(labelSel);

// interaction: rotate + zoom
let rotX=0.15, rotY=0.4, zoom=1, dragging=false, px=0, py=0;
const el = renderer.domElement;
el.style.pointerEvents="auto";
el.addEventListener("pointerdown",e=>{dragging=true;px=e.clientX;py=e.clientY;});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointermove",e=>{
  if(!dragging) return;
  rotY += (e.clientX-px)*0.005; rotX += (e.clientY-py)*0.005;
  rotX=Math.max(-1.4,Math.min(1.4,rotX));
  px=e.clientX;py=e.clientY;
});
el.addEventListener("wheel",e=>{e.preventDefault(); zoom*= (e.deltaY>0?1.08:0.93); zoom=Math.max(0.35,Math.min(3,zoom));},{passive:false});
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
el.addEventListener("click",e=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit = ray.intersectObjects(nodes)[0];
  if (hit) select(hit.object.userData.i);
});

let selected = -1;
const panel=document.getElementById("panel");
function select(i){
  selected=i;
  const k=keys[i]; const d=words[k];
  document.getElementById("pword").textContent=d.name;
  document.getElementById("pdeg").textContent=deg[i]+" ligações";
  const syn=d.links.filter(l=>l.type==="sinonimos"&&idx.has(l.to));
  const ana=d.links.filter(l=>l.type==="analogas"&&idx.has(l.to));
  const psyn=document.getElementById("psyn"); psyn.innerHTML="";
  syn.forEach(l=>{const b=document.createElement("button");b.className="chip syn";b.textContent=words[l.to].name;b.onclick=()=>select(idx.get(l.to));psyn.appendChild(b);});
  if(!syn.length) psyn.innerHTML='<span style="color:var(--dim);font-size:12px">—</span>';
  const pana=document.getElementById("pana"); pana.innerHTML="";
  ana.forEach(l=>{const b=document.createElement("button");b.className="chip";b.textContent=words[l.to].name;b.onclick=()=>select(idx.get(l.to));pana.appendChild(b);});
  if(!ana.length) pana.innerHTML='<span style="color:var(--dim);font-size:12px">—</span>';
  panel.classList.remove("hidden");
  labelSel.material.map = makeLabel(d.name,true).material.map;
  labelSel.visible=true;
  // highlight
  const nb=new Set(adj[i]);
  nodes.forEach((m,j)=>{
    if(j===i){m.material.color.set(0xd8a24a);m.material.opacity=1;}
    else if(nb.has(j)){m.material.color.set(0xc96f6f);m.material.opacity=1;}
    else {m.material.color.set(0x5a5147);m.material.opacity=0.25;}
  });
  lineMat.opacity=0.12;
  history.replaceState(null,"","?word="+encodeURIComponent(k));
}
function clearSel(){
  selected=-1; panel.classList.add("hidden"); labelSel.visible=false;
  nodes.forEach(m=>{m.material.color.set(0x9a8f7d);m.material.opacity=0.85;});
  lineMat.opacity=0.5;
  history.replaceState(null,"",location.pathname);
}

// stats
document.getElementById("sn").textContent=N;
document.getElementById("sr").textContent=relations;
document.getElementById("sm").textContent=words[mostKey].name;

// search
const search=document.getElementById("search"), sug=document.getElementById("sug");
let selIdx=-1;
function renderSug(q){
  sug.innerHTML=""; selIdx=-1;
  if(!q){sug.style.display="none";return;}
  const ql=q.toLowerCase();
  const m=keys.filter(k=>words[k].name.toLowerCase().includes(ql)).slice(0,12);
  if(!m.length){sug.style.display="none";return;}
  m.forEach(k=>{
    const b=document.createElement("button");
    b.textContent=words[k].name;
    b.onclick=()=>{select(idx.get(k));search.value=words[k].name;sug.style.display="none";};
    sug.appendChild(b);
  });
  sug.style.display="block";
}
search.addEventListener("input",()=>renderSug(search.value.trim()));
search.addEventListener("keydown",e=>{
  const btns=[...sug.querySelectorAll("button")];
  if(e.key==="ArrowDown"){selIdx=Math.min(selIdx+1,btns.length-1);e.preventDefault();}
  else if(e.key==="ArrowUp"){selIdx=Math.max(selIdx-1,0);e.preventDefault();}
  else if(e.key==="Enter"){ if(selIdx>=0&&btns[selIdx])btns[selIdx].click(); else if(btns[0])btns[0].click(); return;}
  else return;
  btns.forEach((b,i)=>b.classList.toggle("sel",i===selIdx));
});
search.addEventListener("blur",()=>setTimeout(()=>sug.style.display="none",150));

// deep link ?word=
const q=new URLSearchParams(location.search).get("word");
if(q){
  const k=keys.find(k=>k===q || words[k].name.toLowerCase()===q.toLowerCase());
  if(k) select(idx.get(k));
}

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// animate
function tick(){
  requestAnimationFrame(tick);
  if(!dragging) rotY+=0.0016;
  const cz=Math.cos(rotX),sx=Math.sin(rotX),cy=Math.cos(rotY),sy=Math.sin(rotY);
  nodes.forEach(m=>{
    const x=m.position.x,y=m.position.y,z=m.position.z;
    const x1=x*cy - z*sy, z1=x*sy + z*cy;
    const y1=y*cz - z1*sx, z2=y*sx + z1*cz;
    m.position.set(x1,y1,z2);
  });
  // rebuild line positions from rotated nodes
  const lp=lineGeo.attributes.position.array;
  edges.forEach((e,k)=>{
    const a=nodes[e[0]].position,b=nodes[e[1]].position;
    lp[k*6]=a.x;lp[k*6+1]=a.y;lp[k*6+2]=a.z;lp[k*6+3]=b.x;lp[k*6+4]=b.y;lp[k*6+5]=b.z;
  });
  lineGeo.attributes.position.needsUpdate=true;
  if(selected>=0){
    const p=nodes[selected].position;
    labelSel.position.set(p.x,p.y+3.2,p.z);
  }
  camera.position.z=170/zoom;
  renderer.render(scene,camera);
}
tick();
</script>
