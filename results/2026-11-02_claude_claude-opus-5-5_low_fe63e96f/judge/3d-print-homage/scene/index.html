<!doctype html><html><head><meta charset="utf-8"><title>Great Wave - low poly</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9dcbd}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(30,1,1,200);C.position.set(0,0,60);
// palette sampled by eye from print: Prussian blue, mid blue, pale blue, foam, paper, grey sky band, boat tan
const P={deep:0x1b3360,mid:0x3f6aa0,pale:0xa9c6cf,foam:0xf3ecd9,paper:0xe9dcbd,grey:0x5d5a55,boat:0xd9b483,fuji:0x2a3a52};
const mat=c=>new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide});
// sky: paper top, dark grey band at horizon (vertex colors)
{const g=new THREE.PlaneGeometry(80,46,1,8),c=[],p=g.attributes.position;
for(let i=0;i<p.count;i++){const y=p.getY(i),t=THREE.MathUtils.clamp((y+12)/20,0,1);const col=new THREE.Color(P.grey).lerp(new THREE.Color(P.paper),t);c.push(col.r,col.g,col.b);}
g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true}));m.position.z=-20;S.add(m);}
// cloud
const cloud=new THREE.Mesh(new THREE.CircleGeometry(6,7),mat(0xf2eadb));cloud.scale.set(2,.6,1);cloud.position.set(10,9,-19);S.add(cloud);
function shape(pts,color,z){const s=new THREE.Shape();s.moveTo(pts[0][0],pts[0][1]);for(const q of pts.slice(1))s.lineTo(q[0],q[1]);const m=new THREE.Mesh(new THREE.ShapeGeometry(s),mat(color));m.position.z=z;S.add(m);return m;}
// Mount Fuji: small, center-low, snow cap
const fuji=new THREE.Group();S.add(fuji);
{const b=new THREE.Mesh(new THREE.ConeGeometry(3.4,2.6,6),mat(P.fuji));fuji.add(b);const cap=new THREE.Mesh(new THREE.ConeGeometry(1.7,1.3,6),mat(0xf6f1e4));cap.position.y=.66;fuji.add(cap);fuji.position.set(2.5,-5.4,-15);}
// big wave on left: layered low-poly silhouettes, curling crest to the right
const big=new THREE.Group();S.add(big);
const outer=[[-24,-14],[-24,4],[-19,7],[-13,10.5],[-7,11.6],[-2,11],[2,9.4],[5,7],[6.5,5],[5,4.4],[3,6],[0,6.8],[-2.5,6],[-4,3],[-4,-1],[-2,-4],[1,-6.5],[3,-8],[-2,-14]];
big.add(shape(outer,P.foam,-8));
const body=[[-22,-14],[-21,-3],[-17,1],[-12,4],[-8,7],[-4,9],[0,8.8],[3,7.3],[4.5,5.8],[2.5,5.6],[-0.5,5.8],[-3,4.2],[-4.8,1],[-4.5,-3],[-2.5,-6],[0.5,-8],[-3,-14]];
big.children[0].geometry; const bodyM=shape(body,P.deep,-7.9);big.add(bodyM);
big.add(shape([[-20,-14],[-19,-4],[-15,-.5],[-10,2.5],[-7,4.5],[-6,1],[-6.5,-4],[-5,-8],[-8,-14]],P.mid,-7.8));
// foam claws along the crest
const foamG=new THREE.IcosahedronGeometry(.42,0),fm=mat(P.foam);const claws=[];
for(let i=0;i<70;i++){const t=i/70,a=Math.PI*(1.05-1.25*t);const r=6.5+Math.sin(t*20)*.5;const x=-5+Math.cos(a)*r*(.9+.4*t),y=3.5+Math.sin(a)*r*.95;
const m=new THREE.Mesh(foamG,fm);m.position.set(x,y,-7.7);m.scale.setScalar(.6+Math.random()*.8);big.add(m);claws.push(m);}
// white flecks in the blue (spray)
for(let i=0;i<60;i++){const m=new THREE.Mesh(new THREE.CircleGeometry(.12,5),fm);m.position.set(-14+Math.random()*16,-8+Math.random()*16,-7.75);big.add(m);claws.push(m);}
// foreground small wave (bottom-left, a little Fuji echo) and right swell
const fg=shape([[-26,-16],[-24,-9],[-20,-6],[-16,-5.5],[-12,-7],[-9,-10],[-6,-16]],P.deep,-5);
shape([[-24,-9.6],[-20,-6.4],[-16,-5.9],[-12,-7.4],[-14,-7],[-18,-6.8]],P.foam,-4.9);
const right=shape([[2,-16],[6,-11],[11,-7.5],[16,-5],[21,-2],[24,2],[24,-16]],P.mid,-9);
shape([[6,-11],[11,-7.5],[16,-5],[21,-2],[24,2],[24,0.5],[20,-3.4],[15,-6.4],[10,-9]],P.foam,-8.95);
const mid=shape([[-8,-16],[-2,-10.5],[3,-9.5],[9,-10],[16,-12],[22,-13],[24,-16]],P.deep,-6);
shape([[-2,-10.5],[3,-9.5],[9,-10],[16,-12],[12,-11],[6,-10.5],[1,-10.2]],P.foam,-5.95);
// three oshiokuri-bune boats with crouching rowers
function boat(x,y,z,rot,len){const g=new THREE.Group();const h=new THREE.Mesh(new THREE.BoxGeometry(len,.5,1.2),new THREE.MeshLambertMaterial({color:P.boat,flatShading:true}));g.add(h);
const prow=new THREE.Mesh(new THREE.ConeGeometry(.35,1.6,4),mat(P.boat));prow.rotation.z=-Math.PI/2;prow.position.x=len/2+.7;g.add(prow);
for(let i=0;i<8;i++){const r=new THREE.Mesh(new THREE.IcosahedronGeometry(.28,0),mat(P.fuji));r.position.set(-len/2+.8+i*(len-1.4)/7,.4,0);g.add(r);}
g.position.set(x,y,z);g.rotation.z=rot;S.add(g);return g;}
const boats=[boat(-17,-7.5,-7.6,-.45,8),boat(10,-5.6,-8.8,.35,7),boat(1,-12,-5.8,-.25,9)];
S.add(new THREE.AmbientLight(0xffffff,1.2));const L=new THREE.DirectionalLight(0xffffff,1);L.position.set(2,5,5);S.add(L);
// title cartouche (top-left) drawn as frame
const cart=new THREE.Mesh(new THREE.PlaneGeometry(1.4,4.5),mat(0xefe6cf));cart.position.set(-20,10.5,-7);S.add(cart);
const ed=new THREE.LineSegments(new THREE.EdgesGeometry(cart.geometry),new THREE.LineBasicMaterial({color:0x223}));cart.add(ed);
function fit(){const w=innerWidth,h=innerHeight;R.setSize(w,h);C.aspect=w/h;
// keep the full print width visible on portrait screens
C.position.z=w/h<1.48?60*1.48/(w/h):60;C.updateProjectionMatrix();}
addEventListener('resize',fit);fit();
const base=claws.map(m=>m.position.clone());
R.setAnimationLoop(ms=>{const t=ms/1000;
big.rotation.z=Math.sin(t*.4)*.012;big.position.y=Math.sin(t*.5)*.15;
claws.forEach((m,i)=>{m.position.y=base[i].y+Math.sin(t*1.3+i)*.07;m.rotation.z=t*.3+i;});
boats.forEach((b,i)=>{b.position.y+=Math.sin(t*.9+i*2)*.004;b.rotation.z+=Math.cos(t*.7+i)*.0008;});
right.position.y=Math.sin(t*.6+1)*.25;mid.position.x=Math.sin(t*.45)*.3;fg.position.y=Math.sin(t*.7)*.2;
cloud.position.x=10+Math.sin(t*.05)*2;
R.render(S,C);});
</script></body></html>
