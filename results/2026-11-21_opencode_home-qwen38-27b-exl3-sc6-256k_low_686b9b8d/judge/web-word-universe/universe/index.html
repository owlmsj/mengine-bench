<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>universo das palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07050c; --ink:#efe9dc; --dim:#8d849c; --line:#2a2438;
  --gold:#e8c47c; --rose:#e07a9a; --teal:#6fd3c7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Cormorant Garamond",Georgia,serif;
  overflow:hidden;
}
#scene{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column}
#top{
  display:flex;align-items:baseline;gap:14px;padding:18px 22px 0;
  background:linear-gradient(180deg,rgba(7,5,12,.9),rgba(7,5,12,0));
}
#top h1{font-size:22px;font-weight:600;letter-spacing:.04em}
#top h1 em{color:var(--gold);font-style:italic}
#top .sub{font-family:"Space Mono",monospace;font-size:10px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase}
#search{
  pointer-events:auto;margin:12px 22px 0;position:relative;width:min(420px,60vw);
}
#search input{
  width:100%;background:rgba(20,15,30,.75);border:1px solid var(--line);
  color:var(--ink);font-family:"Space Mono",monospace;font-size:13px;
  padding:10px 14px;border-radius:2px;outline:none;
}
#search input:focus{border-color:var(--gold)}
#suggest{
  position:absolute;top:100%;left:0;right:0;background:#120d1e;
  border:1px solid var(--line);border-top:none;max-height:260px;overflow:auto;
  font-family:"Space Mono",monospace;font-size:12px;display:none;
}
#suggest div{padding:7px 14px;cursor:pointer;color:var(--dim)}
#suggest div:hover{background:#1d1530;color:var(--ink)}
#panel{
  pointer-events:auto;position:fixed;right:22px;top:70px;width:300px;
  max-height:calc(100vh - 100px);overflow:auto;
  background:rgba(13,9,20,.88);border:1px solid var(--line);border-radius:3px;
  padding:20px 20px 16px;backdrop-filter:blur(6px);
  display:none;
}
#panel.open{display:block}
#panel .word{font-size:34px;font-weight:600;line-height:1.05}
#panel .tema{
  font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);margin:6px 0 14px;
}
#panel h3{
  font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);margin:14px 0 8px;
  border-top:1px solid var(--line);padding-top:12px;
}
#panel h3:first-of-type{border-top:none;padding-top:0;margin-top:0}
#panel ul{list-style:none}
#panel li{margin:2px 0}
#panel li button{
  background:none;border:none;color:var(--ink);cursor:pointer;
  font-family:"Cormorant Garamond",serif;font-size:17px;text-align:left;
  padding:2px 0;
}
#panel li button:hover{color:var(--gold)}
#panel .count{font-family:"Space Mono",monospace;font-size:10px;color:var(--dim)}
#panel .close{
  position:absolute;top:10px;right:12px;background:none;border:none;
  color:var(--dim);font-size:18px;cursor:pointer;font-family:"Space Mono",monospace;
}
#panel .close:hover{color:var(--ink)}
#stats{
  position:fixed;left:22px;bottom:18px;font-family:"Space Mono",monospace;
  font-size:10px;color:var(--dim);letter-spacing:.12em;line-height:1.9;
}
#stats b{color:var(--ink);font-weight:400}
#hint{
  position:fixed;right:22px;bottom:18px;font-family:"Space Mono",monospace;
  font-size:10px;color:var(--dim);letter-spacing:.12em;text-align:right;
}
@media (max-width:700px){
  #panel{left:12px;right:12px;width:auto;top:auto;bottom:12px;max-height:45vh}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div id="top">
    <h1>universo das <em>palavras</em></h1>
    <span class="sub">dicionário criativo · 253 palavras</span>
  </div>
  <div id="search">
    <input id="q" type="text" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="suggest"></div>
  </div>
</div>
<div id="panel">
  <button class="close" id="close">×</button>
  <div class="word" id="p-word"></div>
  <div class="tema" id="p-tema"></div>
  <h3>sinônimos</h3><ul id="p-sin"></ul>
  <h3>palavras análogas</h3><ul id="p-an"></ul>
  <div class="count" id="p-count"></div>
</div>
<div id="stats"></div>
<div id="hint">arraste para girar · role para aproximar<br>clique numa palavra</div>

  const phi = Math.acos(1-2*t);
  const theta = Math.PI*(1+Math.sqrt(5))*i;
  const r = R*(0.55+0.45*(deg[WORDS[i]]/maxDeg));
  pos.push(new THREE.Vector3(
    r*Math.sin(phi)*Math.cos(theta),
    r*Math.cos(phi),
    r*Math.sin(phi)*Math.sin(theta)
  ));
}

// ---- scene ----
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07050c, 0.0016);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 3000);
camera.position.set(0,0,420);
camera.lookAt(0,0,0);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("scene").appendChild(renderer.domElement);

// node points
const geo = new THREE.BufferGeometry();
const parr = new Float32Array(N*3);
const carr = new Float32Array(N*3);
const gold = new THREE.Color(0xe8c47c), dim = new THREE.Color(0x5a5170);
for (let i=0;i<N;i++){
  parr.set([pos[i].x,pos[i].y,pos[i].z], i*3);
  const c = dim.clone().lerp(gold, 0.25+0.75*(deg[WORDS[i]]/maxDeg));
  carr.set([c.r,c.g,c.b], i*3);
}
geo.setAttribute("position", new THREE.BufferAttribute(parr,3));
geo.setAttribute("color", new THREE.BufferAttribute(carr,3));
const pts = new THREE.Points(geo, new THREE.PointsMaterial({
  size:4.5, vertexColors:true, sizeAttenuation:true, transparent:true, opacity:0.95
}));
scene.add(pts);

// edges
const epos = [];
const ekeys = [];
for (const k of pairs){
  const [a,b] = k.split("\u0000");
  const A = pos[IDX.get(a)], B = pos[IDX.get(b)];
  epos.push(A.x,A.y,A.z, B.x,B.y,B.z);
  ekeys.push([a,b]);
}
const egeo = new THREE.BufferGeometry();
egeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(epos),3));
const lines = new THREE.LineSegments(egeo, new THREE.LineBasicMaterial({
  color:0x2a2438, transparent:true, opacity:0.5
}));
scene.add(lines);

// halo for selected word
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(9,24,24),
  new THREE.MeshBasicMaterial({color:0xe8c47c, transparent:true, opacity:0.25, wireframe:true})
);
halo.visible = false;
scene.add(halo);

// ---- picking ----
const ray = new THREE.Raycaster();
ray.params.Points.threshold = 8;
const mouse = new THREE.Vector2();
function pick(e){
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObject(pts);
  return hit.length ? hit[0].index : -1;
}
let dragging=false, moved=0, px=0, py=0;
let rotY=0, rotX=0, vY=0.0006;
renderer.domElement.addEventListener("pointerdown", e=>{
  dragging=true; moved=0; px=e.clientX; py=e.clientY;
});
addEventListener("pointermove", e=>{
  if(!dragging) return;
  const dx=e.clientX-px, dy=e.clientY-py;
  moved += Math.abs(dx)+Math.abs(dy);
  px=e.clientX; py=e.clientY;
  rotY += dx*0.004; rotX += dy*0.004;
});
addEventListener("pointerup", e=>{
  if(dragging && moved<5){
    const i = pick(e);
    if(i>=0) select(WORDS[i]);
  }
  dragging=false;
});
renderer.domElement.addEventListener("wheel", e=>{
  camera.position.z = Math.min(900, Math.max(120, camera.position.z + e.deltaY*0.4));
},{passive:true});

// ---- selection ----
let selected = null;
const panel = document.getElementById("panel");
function select(w, focus=true){
  selected = w;
  const i = IDX.get(w);
  halo.visible = true;
  halo.position.copy(pos[i]);
  document.getElementById("p-word").textContent = META[w].word;
  document.getElementById("p-tema").textContent = META[w].tema ? "tema: "+META[w].tema : "";
  const sin = DATA[w].filter(x=>META[x].tema===META[w].tema);
  const an = DATA[w].filter(x=>!sin.includes(x));
  fill("p-sin", sin); fill("p-an", an);
  document.getElementById("p-count").textContent = DATA[w].length+" ligações";
  panel.classList.add("open");
  if(focus){
    const dist = Math.max(camera.position.length(), 300);
    camera.position.copy(pos[i].clone().normalize().multiplyScalar(dist));
    camera.lookAt(0,0,0);
  }
  history.replaceState(null,"","?word="+encodeURIComponent(w));
}
function fill(id, arr){
  const ul = document.getElementById(id);
  ul.innerHTML = "";
  for (const x of arr){
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.textContent = META[x].word;
    b.onclick = ()=>select(x);
    li.appendChild(b); ul.appendChild(li);
  }
  if(!arr.length){
    const li = document.createElement("li");
    li.textContent = "—"; li.style.color = "var(--dim)";
    ul.appendChild(li);
  }
}
document.getElementById("close").onclick = ()=>{
  panel.classList.remove("open");
  halo.visible = false;
  selected = null;
  history.replaceState(null,"",location.pathname);
};

// ---- search ----
const q = document.getElementById("q");
const sug = document.getElementById("suggest");
q.addEventListener("input", ()=>{
  const v = q.value.trim().toLowerCase();
  sug.innerHTML = "";
  if(!v){ sug.style.display="none"; return; }
  const hits = WORDS.filter(w=>w.startsWith(v)).slice(0,12);
  if(!hits.length){ sug.style.display="none"; return; }
  for (const w of hits){
    const d = document.createElement("div");
    d.textContent = META[w].word;
    d.onclick = ()=>{ select(w); q.value=""; sug.style.display="none"; };
    sug.appendChild(d);
  }
  sug.style.display = "block";
});
q.addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const v = q.value.trim().toLowerCase();
    const hit = WORDS.find(w=>w===v) || WORDS.find(w=>w.startsWith(v));
    if(hit){ select(hit); q.value=""; sug.style.display="none"; }
  }
});
document.addEventListener("click", e=>{
  if(!e.target.closest("#search")) sug.style.display="none";
});

// ---- stats ----
document.getElementById("stats").innerHTML =
  "<b>"+N+"</b> palavras · <b>"+pairs.size+"</b> laços<br>mais ligada: <b>"+
  WORDS.reduce((a,b)=>deg[b]>deg[a]?b:a, WORDS[0])+"</b>";

// ---- deep link ?word= ----
const urlWord = new URLSearchParams(location.search).get("word");
if (urlWord){
  const w = WORDS.find(x=>x===urlWord.toLowerCase()) ||
            WORDS.find(x=>x===urlWord.toLowerCase().normalize("NFC"));
  if (w) select(w);
}


// ---- loop ----
function tick(){
  requestAnimationFrame(tick);
  if(!dragging) rotY += vY;
  const e = new THREE.Euler(rotX, rotY, 0);
  pts.rotation.copy(e); lines.rotation.copy(e); halo.rotation.copy(e);
  renderer.render(scene, camera);
}
tick();
addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
