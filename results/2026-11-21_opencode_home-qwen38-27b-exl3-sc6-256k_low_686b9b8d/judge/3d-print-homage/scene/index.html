<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa - low poly wallpaper</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe3c6}
  canvas{display:block}
  #cap{position:fixed;left:16px;bottom:12px;font:12px/1.4 Georgia,serif;color:#2b3a55;opacity:.75;pointer-events:none}
</style>
</head>
<body>
<div id="cap">The Great Wave off Kanagawa &mdash; after Katsushika Hokusai (public domain), rebuilt as a low-poly scene</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---- palette taken from the print ----
const C = {
  paper: 0xefe3c6,   // aged washi
  deep:  0x1d3a6e,   // deep prussian blue (wave bodies)
  mid:   0x2f5d9e,   // mid blue
  pale:  0xa8c8e0,   // pale blue (foam shading)
  foam:  0xf3f0e4,   // white foam
  hull:  0xd99a5b,   // ochre / tan hulls
  hull2: 0xb97a3f,   // darker hull
  skin:  0xe8c9a0,   // rowers' skin
  fuji:  0x3a5a8c,   // Fuji blue slope
  snow:  0xf5f2e8,   // Fuji snow cap
  sky:   0xe9dcc0,   // sky wash
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.paper);
scene.fog = new THREE.Fog(C.paper, 60, 160);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 400);
camera.position.set(0, 7, 46);
camera.lookAt(0, 4, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const flat = (c, e=1) => new THREE.MeshLambertMaterial({color:c, flatShading:true, emissive:c, emissiveIntensity:.35*e});
scene.add(new THREE.AmbientLight(0xffffff, .9));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.1);
sun.position.set(-20, 30, 20);
scene.add(sun);

// =========================================================
// The Great Wave: a curling cone of stacked rings, left side
// =========================================================
const wave = new THREE.Group();
scene.add(wave);

// curl profile: a series of torus-like rings sweeping up and over
// center of curl at x=-14, rising to y=16, lip curling right
const RINGS = 26;
for (let i=0;i<RINGS;i++){
  const t = i/(RINGS-1);
  const y = 2 + t*13;                 // height up the wall
  const x = -14 + t*10;               // leaning right as it rises
  const r = 16 - t*11;                // radius shrinking toward the lip
  const seg = 10 + (i%2)*2;           // low-poly facets, alternating
  const geo = new THREE.TorusGeometry(r, 1.1 - t*.55, 4, seg, Math.PI*1.35);
  const col = (i%5===0) ? C.pale : (i%2 ? C.deep : C.mid);
  const m = new THREE.Mesh(geo, flat(col));
  m.position.set(x, y, -6 - t*2);
  m.rotation.z = -0.5 + t*1.15;       // sweep from wall to overhanging lip
  m.rotation.y = 0.25;
  wave.add(m);
}
// foam "claws": white spiky cones at the lip
function claws(x,y,z,n,spread,up){
  for(let i=0;i<n;i++){
    const a = -0.6 + (i/(n-1))*spread;
    const g = new THREE.ConeGeometry(.55, 2.2+Math.random()*1.4, 4);
    const m = new THREE.Mesh(g, flat(C.foam));
    m.position.set(x+Math.cos(a)*6, y+Math.sin(a)*3, z);
    m.rotation.set(0,0, a + (up?-.4:.4));
    wave.add(m);
  }
}
claws(-4, 15.5, -7, 9, 2.4, true);
claws(-10, 12, -8, 7, 1.8, true);

// foam dots scattered on the wave face (the print's white specks)
for(let i=0;i<60;i++){
  const t=Math.random();
  const g=new THREE.SphereGeometry(.28+Math.random()*.3, 4, 3);
  const m=new THREE.Mesh(g, flat(C.foam));
  m.position.set(-14+t*12, 2+t*13+Math.random()*1.5-0.75, -6-t*2+Math.random()*2-1);
  wave.add(m);
}

// =========================================================
// Foreground swells: rolling low-poly hills of blue
// =========================================================
// rounded low-poly wave mounds (squashed icosahedra) leaving troughs for boats
function mound(x, z, rx, ry, rz, col){
  const g = new THREE.IcosahedronGeometry(1, 1);
  const m = new THREE.Mesh(g, flat(col));
  m.scale.set(rx, ry, rz);
  m.position.set(x, -ry*.45, z);
  scene.add(m);
  return m;
}
mound(-22, 14, 13, 5, 7, C.mid);
mound( -2, 18, 12, 4.5, 7, C.deep);
mound( 18, 12, 12, 5.5, 7, C.mid);
mound( 34, 16, 11, 4, 7, C.pale);
mound( -12, 30, 20, 4, 8, C.pale);
mound(  12, 34, 22, 3.5, 8, C.deep);
mound( -34, 30, 16, 3.5, 8, C.mid);
mound(  34, 34, 18, 3, 8, C.deep);

// =========================================================
// Mt. Fuji: distant cone with snow cap, right of center
// =========================================================
const fuji = new THREE.Group();
const body = new THREE.Mesh(new THREE.ConeGeometry(9, 11, 6), flat(C.fuji));
body.position.y = 5.5;
fuji.add(body);
const cap = new THREE.Mesh(new THREE.ConeGeometry(3.4, 4.2, 6), flat(C.snow));
cap.position.y = 9.4;
fuji.add(cap);
fuji.position.set(10, 0, -38);
scene.add(fuji);

// =========================================================
// Boats: three, as in the print (left, center, right)
// =========================================================
function boat(scale=1){
  const g = new THREE.Group();
  // hull: elongated low-poly trough
  const hullGeo = new THREE.CylinderGeometry(1.1, .5, 7, 6, 1, false);
  hullGeo.rotateZ(Math.PI/2);
  hullGeo.scale(1, .55, 1);
  const hull = new THREE.Mesh(hullGeo, flat(C.hull));
  g.add(hull);
  // raised prow and stern (the print's upturned ends)
  const prow = new THREE.Mesh(new THREE.ConeGeometry(.9, 2.6, 5), flat(C.hull2));
  prow.rotation.z = -1.25; prow.position.set(4.2, .5, 0);
  const stern = new THREE.Mesh(new THREE.ConeGeometry(.9, 2.2, 5), flat(C.hull2));
  stern.rotation.z = 1.35; stern.position.set(-4.2, .4, 0);
  g.add(prow, stern);
  // 9 rowers (the print shows nine men per boat)
  for(let i=0;i<9;i++){
    const x = -2.6 + i*0.65;
    const body = new THREE.Mesh(new THREE.ConeGeometry(.32, .8, 5), flat(C.skin));
    body.position.set(x, .55, 0);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.2, 5, 4), flat(C.skin));
    head.position.set(x, 1.05, 0);
    const oar = new THREE.Mesh(new THREE.BoxGeometry(.08, 1.5, .08), flat(C.hull2));
    oar.position.set(x, .3, .8);
    oar.rotation.x = .5; oar.rotation.z = .3;
    g.add(body, head, oar);
  }
  g.scale.setScalar(scale);
  return g;
}
const boatL = boat(1.0);  boatL.position.set(-16, 3.2, 6);  boatL.rotation.y = .5;
const boatC = boat(1.1);  boatC.position.set(  2, 2.6, 10); boatC.rotation.y = -.25;
const boatR = boat(.95);  boatR.position.set( 19, 3.4, 4);  boatR.rotation.y = -.6;
scene.add(boatL, boatC, boatR);

// =========================================================
// Gentle motion: wave rock, boat bob, slow camera drift
// =========================================================
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  wave.rotation.z = Math.sin(t*.4)*.03;
  wave.position.y = Math.sin(t*.5)*.4;
  boatL.position.y = 3.2 + Math.sin(t*1.1)*.5;
  boatL.rotation.z = Math.sin(t*.9)*.08;
  boatC.position.y = 2.6 + Math.sin(t*1.1+2)*.55;
  boatC.rotation.z = Math.sin(t*.9+2)*.09;
  boatR.position.y = 3.4 + Math.sin(t*1.1+4)*.5;
  boatR.rotation.z = Math.sin(t*.9+4)*.08;
  camera.position.x = Math.sin(t*.07)*2.5;
  camera.position.y = 7 + Math.sin(t*.11)*.6;
  camera.lookAt(0, 4, 0);
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
