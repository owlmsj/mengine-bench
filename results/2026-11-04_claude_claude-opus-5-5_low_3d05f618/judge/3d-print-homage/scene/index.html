<!doctype html><html><head><meta charset="utf-8"><title>Wave and Fuji - low poly</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9dcc0}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0xe9dcc0);S.fog=new THREE.Fog(0xe9dcc0,60,140);
const C=new THREE.PerspectiveCamera(45,1,0.1,300);C.position.set(0,6,34);C.lookAt(0,5,0);
S.add(new THREE.HemisphereLight(0xfff4dc,0x324a6a,1.6));const L=new THREE.DirectionalLight(0xffffff,1.4);L.position.set(-10,20,15);S.add(L);
const M=c=>new THREE.MeshLambertMaterial({color:c,flatShading:true,side:THREE.DoubleSide});
const PRUS=0x1d3a6e,LIGHT=0x8fb4c8,FOAM=0xf3ecd8,WOOD=0xd9a77a,SKYG=0x8a8679;
// dark horizon band behind Fuji
const band=new THREE.Mesh(new THREE.PlaneGeometry(200,8),new THREE.MeshBasicMaterial({color:SKYG,fog:false}));band.position.set(0,1,-60);S.add(band);
// pale cloud
const cl=new THREE.Mesh(new THREE.IcosahedronGeometry(6,0),new THREE.MeshBasicMaterial({color:0xf6efe0}));cl.scale.set(2.4,.6,.3);cl.position.set(14,20,-50);S.add(cl);
// Mount Fuji: small, centre-right, white cap
const fuji=new THREE.Group();const fb=new THREE.Mesh(new THREE.ConeGeometry(9,5,7),M(PRUS));fb.position.y=2.5;fuji.add(fb);
const fc=new THREE.Mesh(new THREE.ConeGeometry(4.2,2.6,7),M(FOAM));fc.position.y=3.8;fuji.add(fc);fuji.position.set(4,-1,-55);S.add(fuji);
// sea plane with waves
const sg=new THREE.PlaneGeometry(120,80,40,30);sg.rotateX(-Math.PI/2);const sea=new THREE.Mesh(sg,M(PRUS));S.add(sea);const sp=sg.attributes.position.array.slice();
// great wave: a curling tube built from rings along a spiral
function wave(){const g=new THREE.Group();const n=26;
 for(let i=0;i<n;i++){const t=i/(n-1);const a=t*Math.PI*1.35;const r=13*(1-t*.55);
  const x=-14+Math.sin(a)*r*0.9+t*4, y=Math.max(-1,13-Math.cos(a)*r*0.95-5)+t*2;
  const seg=new THREE.Mesh(new THREE.DodecahedronGeometry(2.6*(1-t*.6)+.5,0),M(t>.75?FOAM:(i%2?PRUS:0x2d5a8f)));
  seg.position.set(x,y,0);seg.scale.set(1.3,1,1.6);g.add(seg);
  if(t>.4){for(let k=0;k<3;k++){const f=new THREE.Mesh(new THREE.TetrahedronGeometry(.7,0),M(FOAM));f.position.set(x+(Math.random()-.5)*3,y+1.5+Math.random(),(Math.random()-.5)*3);f.userData.claw=1;g.add(f);}}}
 // big mass at the base
 const base=new THREE.Mesh(new THREE.ConeGeometry(14,14,7),M(PRUS));base.position.set(-16,4,0);base.scale.set(1,1,.5);g.add(base);
 const cap=new THREE.Mesh(new THREE.ConeGeometry(7,6,7),M(LIGHT));cap.position.set(-17,13,0);cap.scale.set(1,1,.6);g.add(cap);
 return g;}
const W=wave();W.position.set(-4,0,-8);S.add(W);
// smaller foreground wave mimicking Fuji's shape
const fw=new THREE.Mesh(new THREE.ConeGeometry(7,7,6),M(PRUS));fw.position.set(-3,1.5,6);S.add(fw);
const fwc=new THREE.Mesh(new THREE.ConeGeometry(3.4,3.2,6),M(FOAM));fwc.position.set(-3,3.6,6);S.add(fwc);
// right swell
const rw=new THREE.Mesh(new THREE.ConeGeometry(10,9,7),M(0x2d5a8f));rw.position.set(20,2,-6);rw.scale.set(1.4,1,.5);S.add(rw);
// three oshiokuri boats with rowers
const boats=[];function boat(x,y,z,rot){const g=new THREE.Group();const h=new THREE.Mesh(new THREE.BoxGeometry(12,.6,1.6),M(WOOD));g.add(h);
 const p=new THREE.Mesh(new THREE.ConeGeometry(.8,2.5,4),M(WOOD));p.rotation.z=-Math.PI/2;p.position.x=7;g.add(p);
 for(let i=0;i<8;i++){const r=new THREE.Mesh(new THREE.IcosahedronGeometry(.35,0),M(0x24345a));r.position.set(-4.5+i*1.1,.6,(i%2-.5)*.6);g.add(r);}
 g.position.set(x,y,z);g.rotation.z=rot;g.userData={y,rot,ph:Math.random()*6};S.add(g);boats.push(g);}
boat(-20,3,-4,-.5);boat(9,2,-14,.35);boat(4,.4,8,-.25);
function size(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();}addEventListener('resize',size);size();
const clock=new THREE.Clock();
R.setAnimationLoop(()=>{const t=clock.getElapsedTime();const p=sg.attributes.position;
 for(let i=0;i<p.count;i++){const x=sp[i*3],z=sp[i*3+2];p.array[i*3+1]=Math.sin(x*.25+t)*.6+Math.cos(z*.3+t*.8)*.5;}p.needsUpdate=true;sg.computeVertexNormals();
 W.rotation.z=Math.sin(t*.4)*.02;W.position.y=Math.sin(t*.5)*.3;
 W.children.forEach((c,i)=>{if(c.userData.claw)c.rotation.y=t+i;});
 boats.forEach(b=>{const u=b.userData;b.position.y=u.y+Math.sin(t*.9+u.ph)*.4;b.rotation.z=u.rot+Math.sin(t*.7+u.ph)*.06;});
 C.position.x=Math.sin(t*.1)*1.2;C.lookAt(0,5,0);R.render(S,C);});
</script></body></html>
