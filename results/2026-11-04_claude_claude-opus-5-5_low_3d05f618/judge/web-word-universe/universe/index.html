};const names=Object.keys(W);const idx={};names.forEach((n,i)=>idx[n]=i);
const N=names.map((n,i)=>({n,x:Math.cos(i)*300*Math.random(),y:Math.sin(i)*300*Math.random(),vx:0,vy:0,d:W[n].length}));
const E=[];names.forEach(a=>W[a].forEach(b=>{if(a<b)E.push([idx[a],idx[b]])}));
stats.textContent=`${names.length} palavras · ${E.length} ligações · tamanho = nº de ligações`;
dl.innerHTML=names.map(n=>`<option value="${n}">`).join('');
const c=document.getElementById('c'),g=c.getContext('2d');let sel=-1,cam={x:0,y:0,s:1};
function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;
for(let k=0;k<400;k++)step(1-k/400);
function step(t){for(const a of N){for(const b of N){if(a===b)continue;let dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy+1;let f=900/d;a.vx+=dx*f*.05;a.vy+=dy*f*.05}a.vx-=a.x*.002;a.vy-=a.y*.002}
for(const[i,j]of E){let a=N[i],b=N[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-40)*.02;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
for(const a of N){a.x+=a.vx*t;a.y+=a.vy*t;a.vx*=.5;a.vy*=.5}}
const P=(a)=>[(a.x-cam.x)*cam.s+c.width/2,(a.y-cam.y)*cam.s+c.height/2];
function draw(){g.clearRect(0,0,c.width,c.height);const nb=sel<0?null:new Set(W[names[sel]].map(n=>idx[n]));
for(const[i,j]of E){const on=nb&&(i==sel||j==sel);g.strokeStyle=on?'#ffd27a':nb?'#ffffff0d':'#8890c033';g.lineWidth=on?2:1;const[a,b]=P(N[i]),[x,y]=P(N[j]);g.beginPath();g.moveTo(a,b);g.lineTo(x,y);g.stroke()}
N.forEach((a,i)=>{const[x,y]=P(a),r=2+Math.sqrt(a.d)*1.6,hot=i==sel||(nb&&nb.has(i));g.fillStyle=i==sel?'#ffd27a':hot?'#ff9f7a':nb?'#555a7a':`hsl(${220+a.d*8},70%,${55+a.d*2}%)`;g.beginPath();g.arc(x,y,r*(i==sel?1.8:1),0,7);g.fill();
if(hot||a.d>=10||cam.s>2){g.fillStyle=hot?'#fff':'#c8cbe8aa';g.font=(i==sel?'bold 18px ':'12px ')+'Fraunces';g.fillText(a.n,x+r+3,y+4)}});requestAnimationFrame(draw)}draw();
function show(w){w=(w||'').trim().toLowerCase();if(!(w in idx)){info.innerHTML=w?`<p>“${w}” não está no universo.</p>`:'';sel=-1;return}
sel=idx[w];cam.x=N[sel].x;cam.y=N[sel].y;cam.s=Math.max(cam.s,1.6);q.value=w;history.replaceState(0,'','?word='+encodeURIComponent(w));
info.innerHTML=`<h2>${w}</h2><small>${W[w].length} ligações</small><p>${W[w].map(n=>`<a data-w="${n}">${n}</a>`).join('')}</p>`}
info.onclick=e=>{if(e.target.dataset.w)show(e.target.dataset.w)};q.onchange=()=>show(q.value);
c.onclick=e=>{let best=-1,bd=200;N.forEach((a,i)=>{const[x,y]=P(a),d=(x-e.clientX)**2+(y-e.clientY)**2;if(d<bd){bd=d;best=i}});if(best>=0)show(names[best])};
c.onwheel=e=>{cam.s*=e.deltaY<0?1.15:.87};let dr=null;c.onmousedown=e=>dr=[e.clientX,e.clientY];onmouseup=()=>dr=null;
c.onmousemove=e=>{if(!dr)return;cam.x-=(e.clientX-dr[0])/cam.s;cam.y-=(e.clientY-dr[1])/cam.s;dr=[e.clientX,e.clientY]};
const fit=Math.max(...N.map(a=>Math.max(Math.abs(a.x),Math.abs(a.y))));cam.s=Math.min(c.width,c.height)/2/fit;
show(new URLSearchParams(location.search).get('word')||'');
