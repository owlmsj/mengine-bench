<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo das Palavras — Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e14;--ink:#e8e6df;--dim:#8a8f9c;--panel:rgba(14,18,26,.82);--line:#232a38}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 800px at 70% 20%,#131a29 0%,var(--bg) 60%);color:var(--ink);
font-family:'Sora',system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block}
.lbl{position:absolute;transform:translate(-50%,-50%);font:400 12px 'Sora';color:var(--ink);
text-shadow:0 1px 6px #000,0 0 2px #000;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .25s}
.lbl.on{opacity:.95}
.lbl.big{font:600 15px 'Fraunces'}
#panel{position:fixed;top:18px;left:18px;width:min(340px,calc(100vw - 36px));background:var(--panel);
border:1px solid var(--line);border-radius:14px;padding:18px;backdrop-filter:blur(10px);z-index:5}
h1{font:600 22px 'Fraunces';letter-spacing:.2px}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
#stats{display:flex;gap:14px;margin:12px 0}
#stats div{font-size:11px;color:var(--dim)}
#stats b{display:block;font:600 18px 'Sora';color:var(--ink)}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#111725;
color:var(--ink);font:400 14px 'Sora';outline:none}
#q:focus{border-color:#4b6ef5}
#detail{position:fixed;right:18px;top:18px;width:min(320px,calc(100vw - 36px));max-height:calc(100vh - 36px);
overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
backdrop-filter:blur(10px);z-index:5;display:none}
#detail.show{display:block}
#dName{font:600 26px 'Fraunces'}
#dTema{display:inline-block;margin-top:6px;font-size:11px;padding:3px 10px;border-radius:99px;color:#0b0e14;font-weight:600}
#dCount{color:var(--dim);font-size:12px;margin:10px 0 8px}
.chip{display:inline-block;margin:3px 3px 0 0;padding:5px 11px;border-radius:99px;font-size:12.5px;
border:1px solid var(--line);background:#141b2a;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:#4b6ef5}
#legend{position:fixed;left:18px;bottom:16px;display:flex;flex-wrap:wrap;gap:6px 12px;max-width:min(700px,92vw);z-index:5}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);cursor:pointer}
.lg i{width:9px;height:9px;border-radius:50%}
#hint{position:fixed;right:18px;bottom:16px;color:var(--dim);font-size:11px;z-index:5}
#fallback{position:fixed;inset:0;overflow:auto;padding:32px;display:none;background:var(--bg);z-index:9}
#fallback.show{display:block}
#fallback a{color:#8ea6ff;cursor:pointer;text-decoration:none;margin:0 6px;font-size:14px}
@media (max-width:760px){#detail{top:auto;bottom:12px;right:12px;left:12px;width:auto;max-height:44vh}#legend{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <h1>Universo das Palavras</h1>
  <div class="sub">cada palavra puxa as suas vizinhas — arraste para girar, busque para encontrar</div>
  <div id="stats"></div>
  <input id="q" list="wl" placeholder="buscar palavra… (ex.: saudade)" autocomplete="off">
  <datalist id="wl"></datalist>
</div>
<div id="detail">
  <div id="dName"></div><div><span id="dTema"></span></div>
  <div id="dCount"></div><div id="dRels"></div>
</div>
<div id="legend"></div>
<div id="hint">arraste: girar · roda: zoom · clique: palavra</div>
<div id="fallback"></div>

<script type="module" onerror="window.__threefail&&window.__threefail()">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
window.__threeok = true;
const {nodes, edges, words} = DATA;
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const byNorm = new Map(nodes.map(n => [norm(n.id), n]));
const TEMAS = [...new Set(nodes.map(n => n.tema))].sort();
const PAL = ["#f2b134","#e2574c","#4cc2f2","#7bd88f","#c77dff","#ff8fab","#f9e04b","#59d0c3","#ff9770","#9ad1ff"];
const colorOf = Object.fromEntries(TEMAS.map((t,i) => [t, PAL[i % PAL.length]]));

// ---- force layout (3D) ----
const N = nodes.length, idx = new Map(nodes.map((n,i) => [n.id,i]));
const P = nodes.map((n,i) => { const r=170*Math.cbrt(i/N), th=i*2.399963, ph=Math.acos(1-2*(i+.5)/N);
  return [r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph)]; });
const adj = nodes.map(() => []);
const E = edges.map(([a,b]) => { const i=idx.get(a), j=idx.get(b); adj[i].push(j); adj[j].push(i); return [i,j]; });
for (let it=0; it<300; it++) {
  const f = P.map(() => [0,0,0]), k = Math.max(.08, 1 - it/300);
  for (let i=0;i<N;i++) for (let j=i+1;j<N;j++) {
    let dx=P[i][0]-P[j][0], dy=P[i][1]-P[j][1], dz=P[i][2]-P[j][2];
    let d2=dx*dx+dy*dy+dz*dz+1e-4, w=14000/d2;
    if (d2 < 2500) w += (2500-d2)*.012;
    const d=Math.sqrt(d2); dx/=d; dy/=d; dz/=d;
    f[i][0]+=dx*w; f[i][1]+=dy*w; f[i][2]+=dz*w;
    f[j][0]-=dx*w; f[j][1]-=dy*w; f[j][2]-=dz*w;
  }
  for (const [i,j] of E) {
    let dx=P[j][0]-P[i][0], dy=P[j][1]-P[i][1], dz=P[j][2]-P[i][2];
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+1e-4, w=(d-40)*.05;
    dx/=d; dy/=d; dz/=d;
    f[i][0]+=dx*w; f[i][1]+=dy*w; f[i][2]+=dz*w;
    f[j][0]-=dx*w; f[j][1]-=dy*w; f[j][2]-=dz*w;
  }
  for (let i=0;i<N;i++) {
    f[i][0]-=P[i][0]*.012; f[i][1]-=P[i][1]*.012; f[i][2]-=P[i][2]*.012;
    for (let m=0;m<3;m++) P[i][m]=Math.max(-600,Math.min(600,P[i][m]+Math.max(-6,Math.min(6,f[i][m]))*k)); }
}

// ---- three scene ----
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const root = new THREE.Group(); scene.add(root);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 4000);
let camDist = 300, camDir = new THREE.Vector3(0,0,1);
cam.position.z = camDist;
scene.add(new THREE.AmbientLight(0xffffff,.9));
const dl = new THREE.DirectionalLight(0xffffff,.5); dl.position.set(1,1,1); scene.add(dl);

const geo = new THREE.SphereGeometry(1, 18, 18);
const meshes = nodes.map((n,i) => {
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color: colorOf[n.tema]}));
  const r = 1.1 + Math.sqrt(n.deg)*.85;
  m.scale.setScalar(r); m.position.set(P[i][0],P[i][1],P[i][2]); m.userData.i = i;
  root.add(m); return m;
});
let allLines; {
  const pos = new Float32Array(E.length*6), col = new Float32Array(E.length*6);
  E.forEach(([i,j],e) => { pos.set([P[i][0],P[i][1],P[i][2],P[j][0],P[j][1],P[j][2]], e*6);
    const c=new THREE.Color(colorOf[nodes[i].tema]).lerp(new THREE.Color(colorOf[nodes[j].tema]),.5);
    col.set([c.r,c.g,c.b,c.r,c.g,c.b], e*6); });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos,3));
  g.setAttribute("color", new THREE.BufferAttribute(col,3));
  allLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.22}));
  root.add(allLines);
}
let hiLines = null;
const labels = nodes.map(n => { const d=document.createElement("div"); d.className="lbl"; d.textContent=n.id;
  stage.appendChild(d); return d; });

// ---- selection ----
let sel = -1;
function neighbors(i){ return new Set(adj[i]); }
function focus(i) {
  root.updateMatrixWorld();
  const wp = meshes[i].getWorldPosition(new THREE.Vector3());
  if (wp.lengthSq() > 1) camDir = wp.normalize();
}
function select(name, push=true) {
  const n = byNorm.get(norm(name)); const i = n ? idx.get(n.id) : -1;
  sel = i; paint(); if (i >= 0) focus(i);
  const det = document.getElementById("detail");
  if (i < 0) { det.classList.remove("show"); history.replaceState(null,"",location.pathname); return; }
  const w = nodes[i].id, rels = words[w] || [];
  document.getElementById("dName").textContent = w;
  const t = document.getElementById("dTema"); t.textContent = "tema: " + nodes[i].tema;
  t.style.background = colorOf[nodes[i].tema];
  document.getElementById("dCount").textContent = rels.length + (rels.length===1?" ligação":" ligações");
  const box = document.getElementById("dRels"); box.innerHTML = "";
  for (const r of rels) { const c=document.createElement("span"); c.className="chip"; c.textContent=r;
    c.onclick = () => { select(r); document.getElementById("q").value=""; }; box.appendChild(c); }
  det.classList.add("show");
  if (push) history.replaceState(null,"", "?word=" + encodeURIComponent(w));
}
function paint() {
  const nb = sel < 0 ? null : neighbors(sel);
  meshes.forEach((m,i) => { const base = new THREE.Color(colorOf[nodes[i].tema]);
    const on = sel<0 || i===sel || nb.has(i);
    m.material.color.copy(base).multiplyScalar(on ? 1 : .22);
    m.scale.setScalar((1.1 + Math.sqrt(nodes[i].deg)*.85) * (i===sel ? 1.5 : 1)); });
  allLines.material.opacity = sel<0 ? .22 : .06;
  if (hiLines) { root.remove(hiLines); hiLines.geometry.dispose(); hiLines=null; }
  if (sel >= 0) {
    const es = E.filter(([i,j]) => i===sel || j===sel);
    const pos = new Float32Array(es.length*6);
    es.forEach(([i,j],e) => pos.set([P[i][0],P[i][1],P[i][2],P[j][0],P[j][1],P[j][2]], e*6));
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos,3));
    hiLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.75}));
    root.add(hiLines);
  }
}

// ---- interaction ----
let rx=.3, ry=0, dragging=false, px=0, py=0, autoRot=true;
const maxR = Math.max(...P.map(p => Math.hypot(...p)));
let targetDist = maxR*2.3; camDist = targetDist;
addEventListener("pointerdown", e => { if(e.target!==renderer.domElement) return;
  dragging=true; autoRot=false; px=e.clientX; py=e.clientY; });
addEventListener("pointerup", e => { if (dragging && Math.abs(e.clientX-px)<4 && Math.abs(e.clientY-py)<4) pick(e);
  dragging=false; setTimeout(()=>autoRot=true, 4000); });
addEventListener("pointermove", e => { if(!dragging) return; ry += (e.clientX-px)*.005; rx += (e.clientY-py)*.005;
  rx=Math.max(-1.5,Math.min(1.5,rx)); px=e.clientX; py=e.clientY; });
addEventListener("wheel", e => { targetDist=Math.max(60,Math.min(1400,targetDist*(1+e.deltaY*.001))); }, {passive:true});
const ray = new THREE.Raycaster();
function pick(e){ ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), cam);
  const hit = ray.intersectObjects(meshes)[0]; select(hit ? nodes[hit.object.userData.i].id : null); }

// ---- ui ----
document.getElementById("stats").innerHTML =
  `<div><b>${DATA.meta.words}</b>palavras</div><div><b>${DATA.meta.relations}</b>ligações</div>
   <div><b>${DATA.meta.most_connected}</b>mais conectada</div>`;
const wl = document.getElementById("wl");
for (const n of nodes) { const o=document.createElement("option"); o.value=n.id; wl.appendChild(o); }
const q = document.getElementById("q");
q.addEventListener("keydown", e => { if(e.key==="Enter" && q.value.trim()){ select(q.value.trim()); q.blur(); } });
const lg = document.getElementById("legend");
for (const t of TEMAS) { const d=document.createElement("span"); d.className="lg";
  d.innerHTML = `<i style="background:${colorOf[t]}"></i>${t}`; lg.appendChild(d); }

// ---- render loop ----
const v = new THREE.Vector3();
function frame(){

  if (autoRot) ry += .0016;

  root.updateMatrixWorld();

  cam.position.lerp(camDir.clone().multiplyScalar(camDist), .07);
  cam.lookAt(0,0,0);
  renderer.render(scene, cam);
  const show = sel>=0 ? new Set([sel, ...neighbors(sel)]) : null;
  labels.forEach((d,i) => {
    const big = i===sel, on = show ? show.has(i) : nodes[i].deg>=9;
    if (!on && !big) { d.classList.remove("on","big"); return; }
    v.set(P[i][0],P[i][1],P[i][2]).applyEuler(root.rotation).project(cam);
    if (v.z>1) { d.classList.remove("on"); return; }
    d.style.left = (v.x*.5+.5)*innerWidth+"px"; d.style.top = (-v.y*.5+.5)*innerHeight+"px";
    d.classList.add("on"); d.classList.toggle("big", big);
  });
}
frame();
addEventListener("resize", () => { cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); });

const w0 = new URLSearchParams(location.search).get("word");
if (w0) select(w0, false);
</script>
<script>
window.__threefail = function(){
  const f = document.getElementById("fallback"); f.classList.add("show");
  f.innerHTML = "<h1>Universo das Palavras</h1><p style='color:#8a8f9c'>modo lista (sem WebGL/CDN):</p>";
  const box = document.createElement("div"); f.appendChild(box);
  for (const w of Object.keys(DATA.words).sort()) {
    const a=document.createElement("a"); a.textContent=w;
    a.onclick=()=>{ box.innerHTML=""; box.insertAdjacentHTML("beforeend",
      "<h2>"+w+"</h2><p>"+DATA.words[w].map(x=>"<a>"+x+"</a>").join("")+"</p>"); };
    box.appendChild(a); box.appendChild(document.createTextNode(" "));
  }
};
setTimeout(()=>{ if(!window.__threeok) window.__threefail(); }, 9000);
</script>
