<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa — low-poly wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f2e2bd;}
  body{
    background:
      radial-gradient(ellipse 70% 55% at 68% 28%, rgba(255,250,232,.85), rgba(255,250,232,0) 70%),
      linear-gradient(180deg,#f7ecd2 0%,#f2e2bd 52%,#e8d3aa 100%);
    font-family:'Cormorant Garamond',serif;
  }
  #stage{position:fixed;inset:0;}
  canvas{display:block;}
  /* paper-grain vignette, generated in code, not an image of the print */
  #grain{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(74,52,25,.13) 100%);
    mix-blend-mode:multiply;}
  #cartouche{position:fixed;left:3.2vw;top:6vh;width:46px;padding:10px 7px 12px;
    background:rgba(247,238,214,.86);border:2px solid #17385a;
    box-shadow:2px 3px 0 rgba(23,56,90,.18);text-align:center;pointer-events:none;}
  #cartouche .jp{font-family:'Shippori Mincho',serif;color:#17385a;font-size:15px;
    line-height:1.18;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:2px;}
  #caption{position:fixed;left:3.2vw;bottom:4.5vh;color:#17385a;opacity:.72;
    pointer-events:none;letter-spacing:.06em;}
  #caption .t{font-size:clamp(15px,1.5vw,22px);font-weight:600;}
  #caption .s{font-size:clamp(11px,1vw,14px);font-style:italic;opacity:.85;}
  @media (max-width:640px){#cartouche{width:36px;left:4vw;top:4vh}#cartouche .jp{font-size:12px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="grain"></div>
<div id="cartouche"><div class="jp">神奈川沖浪裏</div></div>
<div id="caption"><div class="t">The Great Wave off Kanagawa</div>
<div class="s">after Katsushika Hokusai · low-poly study</div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ---------- palette sampled from the print ---------- */
const C = {
  ink:    0x102c4a,
  deep:   0x123a63,
  deep2:  0x0d2b4d,
  blue:   0x1f5c8e,
  blue2:  0x317fae,
  light:  0x7fb4d1,
  pale:   0xc6dfe8,
  foam:   0xfaf6e9,
  cloud:  0xf3e7cd,
  wood:   0xd7a066,
  woodDk: 0x9b6a3f,
  hull:   0x33251f,
  snow:   0xf8f3e2,
  fuji:   0x204e75
};

/* ---------- renderer / scene / camera ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff, 1.35));
const key = new THREE.DirectionalLight(0xfff3dc, 1.15);
key.position.set(-9, 13, 18); scene.add(key);
const fill = new THREE.DirectionalLight(0xbcd8ef, .5);
fill.position.set(11, -3, 12); scene.add(fill);

const DESIGN_W = 48, DESIGN_H = 27, FOV = 42;
const camera = new THREE.PerspectiveCamera(FOV, 1, .1, 200);
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const t = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  camera.position.z = Math.max((DESIGN_H/2)/t, (DESIGN_W/2)/(t*camera.aspect));
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- helpers ---------- */
const mat = (c, o={}) => new THREE.MeshStandardMaterial(
  Object.assign({color:c, flatShading:true, roughness:1, metalness:0, side:THREE.DoubleSide}, o));

function extrude(shape, depth, material, seg=10){
  return new THREE.Mesh(new THREE.ExtrudeGeometry(shape,
    {depth, bevelEnabled:false, steps:1, curveSegments:seg}), material);
}

/* build a flat low-poly ribbon from a smooth 2D spline */
function ribbon(points, width, material, z, seg){
  const curve = new THREE.SplineCurve(points.map(p=>new THREE.Vector2(p[0],p[1])));
  const N = seg || Math.max(30, points.length*9);
  const pts = curve.getPoints(N);
  const L = [], R = [];
  for (let i=0;i<pts.length;i++){
    const p = pts[i], a = pts[Math.max(0,i-1)], b = pts[Math.min(pts.length-1,i+1)];
    const t = new THREE.Vector2(b.x-a.x, b.y-a.y).normalize();
    const n = new THREE.Vector2(-t.y, t.x);
    const w = typeof width === 'function' ? width(i/(pts.length-1)) : width;
    L.push(new THREE.Vector2(p.x+n.x*w/2, p.y+n.y*w/2));
    R.push(new THREE.Vector2(p.x-n.x*w/2, p.y-n.y*w/2));
  }
  const sh = new THREE.Shape();
  sh.moveTo(L[0].x, L[0].y);
  L.forEach(p=>sh.lineTo(p.x,p.y));
  R.reverse().forEach(p=>sh.lineTo(p.x,p.y));
  sh.closePath();
  const m = extrude(sh, .3, material, 4);
  m.position.z = z;
  return m;
}

/* ---------- layers ---------- */
const skyGroup = new THREE.Group();  skyGroup.position.z = -8;  scene.add(skyGroup);
const farGroup = new THREE.Group();  farGroup.position.z = -5;  scene.add(farGroup);
const waveGroup = new THREE.Group(); waveGroup.position.z = 0;   scene.add(waveGroup);
const rightGroup= new THREE.Group(); rightGroup.position.z = -.4;scene.add(rightGroup);
const seaGroup = new THREE.Group();  seaGroup.position.z = 1.1; scene.add(seaGroup);
const boatGroup= new THREE.Group();  boatGroup.position.z = 3.2; scene.add(boatGroup);
const sprayGroup= new THREE.Group(); sprayGroup.position.z = 5; scene.add(sprayGroup);

/* ---------- soft clouds (procedural, low poly) ---------- */
const cloudMat = mat(C.cloud, {transparent:true, opacity:.62});
const cloudGeo = new THREE.IcosahedronGeometry(1, 0);
function makeCloud(x,y,s){
  const g = new THREE.Group();
  const n = 3 + Math.floor(Math.random()*3);
  for (let i=0;i<n;i++){
    const m = new THREE.Mesh(cloudGeo, cloudMat);
    m.position.set((i-(n-1)/2)*s*.85, Math.sin(i*1.7)*s*.18, Math.random()*.4);
    m.scale.set(s*(.8+Math.random()*.5), s*(.35+Math.random()*.2), s*.5);
    g.add(m);
  }
  g.position.set(x,y,0); g.userData.baseX = x; g.userData.ph = Math.random()*6.28;
  return g;
}
const clouds = [
  makeCloud(8,6.4,2.4), makeCloud(14,8.2,3.1), makeCloud(19,4.9,2.0),
  makeCloud(2,9.4,2.2), makeCloud(-19,9.6,2.6)
];
clouds.forEach(c=>skyGroup.add(c));

/* ---------- Mount Fuji ---------- */
const fuji = new THREE.Group();
const fujiBody = new THREE.Mesh(new THREE.ConeGeometry(2.65, 3.15, 6), mat(C.fuji));
fujiBody.rotation.y = Math.PI/6;
fujiBody.position.y = -2.45;
const fujiSnow = new THREE.Mesh(new THREE.ConeGeometry(1.05, 1.25, 6), mat(C.snow));
fujiSnow.rotation.y = Math.PI/6;
fujiSnow.position.set(0, -1.02, .06);
fuji.add(fujiBody, fujiSnow);
fuji.position.set(4.9, 0, 0);
farGroup.add(fuji);

/* distant water around Fuji */
farGroup.add(ribbon([[-10,-4.4],[-4,-4.9],[2,-4.5],[8,-4.9],[15,-4.3]], 1.1, mat(C.blue,.9), .6));

/* ---------- the great wave ---------- */
const greatShape = new THREE.Shape();
greatShape.moveTo(-26, -2);
greatShape.bezierCurveTo(-21, 1, -18, 6.5, -12.5, 8.8);
greatShape.bezierCurveTo(-8, 10.4, -3.2, 9.2, 1.0, 4.6);
greatShape.bezierCurveTo(2.4, 2.8, 0.6, 1.9, -2.2, 2.9);
greatShape.bezierCurveTo(-5.2, 4.0, -7.2, 0.2, -9.6, -4.2);
greatShape.bezierCurveTo(-12.4, -7.8, -18, -10.5, -26, -10.5);
greatShape.closePath();
const greatBody = extrude(greatShape, 2.4, mat(C.deep), 16);
greatBody.position.z = -1.2;          // front face sits at z = 1.2
waveGroup.add(greatBody);

/* interior striped bands (woodblock colour planes) — in front of the body */
waveGroup.add(ribbon([[-24,-.6],[-19,2.6],[-15,5.8],[-11,8.0],[-7,8.7],[-3.5,7.8],[-.5,5.8],[.85,4.4]],
  1.35, mat(C.blue2), 1.35));
waveGroup.add(ribbon([[-22,-4],[-17,-2.5],[-13,-1],[-10,-1.6],[-8,-4.2]],
  1.25, mat(C.blue), 1.37));
waveGroup.add(ribbon([[-25,-7.6],[-19,-6.6],[-14,-5.5],[-10,-6.5],[-7,-9.2]],
  1.7, mat(C.deep2), 1.39));
waveGroup.add(ribbon([[-19,3.4],[-15,5.6],[-11,7.1],[-7,7.5],[-3.5,6.6]],
  .55, mat(C.pale), 1.41));
waveGroup.add(ribbon([[-25,-4.2],[-21,-5.2],[-17,-6],[-13,-6.7],[-10,-8.4]],
  1.1, mat(C.blue), 1.43));
waveGroup.add(ribbon([[-24,-4.6],[-20,-5.6],[-16,-6.4],[-12,-7.1],[-9.5,-8.8]],
  .3, mat(C.pale), 1.45));

/* white lip along the crest */
const crestPts = [[-18,6.4],[-15,7.7],[-12.5,8.7],[-9.5,9.5],[-6,9.5],[-3,8.6],[-.8,6.8],[.95,4.7]];
waveGroup.add(ribbon(crestPts, w=>(.45+.35*Math.sin(Math.PI*w)), mat(C.foam), 1.55, 80));

/* ---------- foam claws ---------- */
const clawShape = new THREE.Shape();
clawShape.moveTo(0,0);
clawShape.bezierCurveTo(.12,.5,.72,.62,.78,.16);
clawShape.bezierCurveTo(.82,-.1,.6,-.16,.55,.06);
clawShape.bezierCurveTo(.5,.32,.31,.32,.28,.04);
clawShape.bezierCurveTo(.25,-.16,.05,-.1,0,0);
clawShape.closePath();
const clawGeo = new THREE.ExtrudeGeometry(clawShape,{depth:.26,bevelEnabled:false,curveSegments:6});
const clawInkGeo = new THREE.ExtrudeGeometry(clawShape,{depth:.26,bevelEnabled:false,curveSegments:6});
const mInk = mat(C.ink), mFoam = mat(C.foam);
const claws = [];
function addClaw(x,y,rot,s,parent,zoff){
  const g = new THREE.Group();
  const back = new THREE.Mesh(clawInkGeo, mInk);
  back.scale.set(1.22,1.22,1); back.position.z = -.18;
  const front = new THREE.Mesh(clawGeo, mFoam);
  front.position.z = .06;
  g.add(back, front);
  g.position.set(x,y,zoff||0);
  g.rotation.z = rot;
  g.scale.setScalar(s);
  parent.add(g);
  claws.push({g, rot, ph:Math.random()*6.28});
}
function clawLine(points, count, parent, size, from=.02, to=.98, flip=false, zoff=0){
  const curve = new THREE.SplineCurve(points.map(p=>new THREE.Vector2(p[0],p[1])));
  for (let i=0;i<count;i++){
    const t = from + (to-from)*i/(count-1);
    const p = curve.getPoint(t), d = curve.getTangent(t);
    const ang = Math.atan2(d.y,d.x) + (flip ? Math.PI : 0);
    addClaw(p.x, p.y, ang + (Math.random()-.5)*.9, size*(.6+Math.random()*.7), parent, zoff);
  }
}
clawLine(crestPts, 30, waveGroup, 1.05, .02, 1, false, 1.75);
clawLine(crestPts, 14, waveGroup, .55, .05, .95, true, 1.72);
clawLine([[-19,5.6],[-15,6.4],[-12,7.0],[-9,7.3],[-6,7.1],[-3.5,6.1],[-1.5,4.6]], 20, waveGroup, .55, .02,.98, true, 1.75);
clawLine([[-17,-1],[-14,-2],[-11.5,-3.6],[-9.5,-5.4]], 12, waveGroup, .5, .02,.98, false, 1.75);
clawLine([[-24,-2.5],[-21,-4],[-18,-6],[-14,-8]], 9, waveGroup, .46, .02,.98, true, 1.75);

/* foam droplets along the crest */
const blobGeo = new THREE.IcosahedronGeometry(1,0);
for (let i=0;i<16;i++){
  const t = i/15, c = new THREE.SplineCurve(crestPts.map(p=>new THREE.Vector2(p[0],p[1]))).getPoint(t);
  const b = new THREE.Mesh(blobGeo, mFoam);
  b.position.set(c.x + (Math.random()-.5)*.5, c.y + Math.random()*.35, 1.8);
  b.scale.setScalar(.16+Math.random()*.24);
  waveGroup.add(b);
}

/* ---------- right-hand wave ---------- */
const rightShape = new THREE.Shape();
rightShape.moveTo(26,-10);
rightShape.bezierCurveTo(23,-5,22.5,0,23.5,5);
rightShape.bezierCurveTo(24.5,8.5,20,9.5,16.5,7.5);
rightShape.bezierCurveTo(13.5,5.8,13.5,3.6,15.5,3.2);
rightShape.bezierCurveTo(18.5,2.6,20,4.5,21.5,3.0);
rightShape.bezierCurveTo(23,1.6,23,-4,24,-8);
rightShape.lineTo(26,-10);
rightShape.closePath();
const rightBody = extrude(rightShape, 1.8, mat(C.deep), 14);
rightBody.position.z = -.9;          // front face at z = .9
rightGroup.add(rightBody);
rightGroup.add(ribbon([[23.4,4.6],[22.2,7.2],[19.6,8.5],[17,7.7],[15.3,5.8],[14.3,3.8],[15.6,3.2]],
  .6, mat(C.foam), 1.05, 70));
rightGroup.add(ribbon([[24,-3],[23.4,1],[22.4,4],[20,5.8],[17.5,5.2]],
  1.15, mat(C.blue2), 1.07));
clawLine([[23.4,4.6],[22.2,7.2],[19.6,8.5],[17,7.7],[15.3,5.8],[14.3,3.8]], 18, rightGroup, .42, .02,.98,true,1.2);

/* ---------- foreground sea bands ---------- */
const seaFill = new THREE.Shape();
seaFill.moveTo(-26,-15);
seaFill.lineTo(-26,-5.0);
seaFill.bezierCurveTo(-16,-4.2,-6,-5.6,2,-5.0);
seaFill.bezierCurveTo(10,-4.4,18,-5.5,26,-4.8);
seaFill.lineTo(26,-15);
seaFill.closePath();
const fillMesh = extrude(seaFill, .5, mat(C.deep), 8);
fillMesh.position.z = -.7;
seaGroup.add(fillMesh);
seaGroup.add(ribbon([[-26,-4.9],[-19,-4.2],[-12,-5.1],[-5,-4.3],[2,-5.2],[9,-4.4],[16,-5.3],[26,-4.6]],
  1.15, mat(C.blue), 0));
seaGroup.add(ribbon([[-26,-5.4],[-19,-4.7],[-12,-5.6],[-5,-4.8],[2,-5.7],[9,-4.9],[16,-5.8],[26,-5.1]],
  .32, mat(C.foam), .1));
seaGroup.add(ribbon([[-26,-8],[-18,-7.1],[-10,-8.2],[-2,-7.3],[6,-8.4],[14,-7.2],[26,-8.6]],
  2.5, mat(C.deep), .25));
seaGroup.add(ribbon([[-26,-7.0],[-18,-6.1],[-10,-7.2],[-2,-6.3],[6,-7.4],[14,-6.2],[26,-7.6]],
  .38, mat(C.pale), .35));
seaGroup.add(ribbon([[-26,-10.1],[-16,-9.2],[-6,-10.1],[4,-9.3],[14,-10.1],[26,-9.6]],
  2.1, mat(C.blue2), .45));
clawLine([[-24,-6.7],[-18,-5.9],[-12,-6.9],[-6,-6.1],[0,-6.9],[6,-6.2]], 10, seaGroup, .3, .02,.98,true);

/* ---------- boats ---------- */
const mHull = mat(C.hull), mDeck = mat(C.wood), mRim = mat(C.woodDk), mCrew = mat(C.ink);
function makeBoat(){
  const g = new THREE.Group();
  const hs = new THREE.Shape();
  hs.moveTo(-2.25,0);
  hs.quadraticCurveTo(0,-.95,2.25,.14);
  hs.lineTo(2.03,.54);
  hs.quadraticCurveTo(0,-.16,-2.03,.42);
  hs.closePath();
  g.add(extrude(hs,.8,mHull,8));
  const ds = new THREE.Shape();
  ds.moveTo(-1.95,.22);
  ds.quadraticCurveTo(0,-.42,1.95,.36);
  ds.lineTo(1.8,.5);
  ds.quadraticCurveTo(0,-.24,-1.8,.36);
  ds.closePath();
  const deck = extrude(ds,.84,mDeck,8); deck.position.z = .02; g.add(deck);
  const rim = ribbon([[-2.15,.12],[0,-.55],[2.15,.28]], .12, mRim, .45, 30);
  g.add(rim);
  for (let i=0;i<11;i++){
    const x = -1.75 + i*.35;
    const y = .22 + .12*Math.sin(i*.8);
    const body = new THREE.Mesh(new THREE.CylinderGeometry(.085,.1,.38,5), mCrew);
    body.position.set(x,y+.18,.62); body.rotation.z = -.45; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(.105,6,4), mCrew);
    head.position.set(x-.11,y+.42,.62); g.add(head);
    if (i%2===0){
      const oar = new THREE.Mesh(new THREE.BoxGeometry(.06,.9,.06), mRim);
      oar.position.set(x+.18,y-.18,.68); oar.rotation.z = -.55; g.add(oar);
    }
  }
  return g;
}
const boats = [
  {o:makeBoat(), x:-14.2, y:-3.2, s:1.05, r:-.30, ph:0},
  {o:makeBoat(), x: 7.6,  y:-3.7, s:.95,  r: .26, ph:2.1},
  {o:makeBoat(), x: .2,   y:-7.5, s:1.32, r: .12, ph:4.2}
];
boats.forEach(b=>{ b.o.scale.setScalar(b.s); b.o.position.set(b.x,b.y,0);
  b.o.rotation.z=b.r; boatGroup.add(b.o); });

/* ---------- drifting spray (instanced) ---------- */
const N = 110;
const spray = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0), mat(C.foam), N);
const dummy = new THREE.Object3D();
const sprayData = [];
for (let i=0;i<N;i++){
  let x,y;
  if (i < N*.72){
    const t = Math.random();
    const c = new THREE.SplineCurve(crestPts.map(p=>new THREE.Vector2(p[0],p[1]))).getPoint(t);
    x = c.x + (Math.random()-.5)*2.2; y = c.y + Math.random()*3.2;
  } else {
    x = -25 + Math.random()*24; y = -9 + Math.random()*7;
  }
  sprayData.push({x,y,z:.2+Math.random()*1.4, s:.05+Math.random()*.13,
    ph:Math.random()*6.28, sp:.5+Math.random()*.8});
}
sprayGroup.add(spray);

/* ---------- animation ---------- */
const clock = new THREE.Clock();
let mx = 0, my = 0, tx = 0, ty = 0;
addEventListener('pointermove', e=>{
  mx = (e.clientX/innerWidth - .5)*2;
  my = (e.clientY/innerHeight - .5)*2;
});

function animate(){
  const t = clock.getElapsedTime();
  tx += (mx-tx)*.035; ty += (my-ty)*.035;

  // gentle breathing of the swelling wave
  waveGroup.position.y = Math.sin(t*.42)*.16;
  waveGroup.rotation.z = Math.sin(t*.31)*.012;
  greatBody.scale.y = 1 + Math.sin(t*.5)*.012;
  rightGroup.position.y = Math.sin(t*.37+1.2)*.12;
  seaGroup.position.y = Math.sin(t*.55+.8)*.07;
  farGroup.position.x = Math.sin(t*.18)*.12;

  clouds.forEach(c=>{ c.position.x = c.userData.baseX + Math.sin(t*.07+c.userData.ph)*.7; });

  claws.forEach(c=>{ c.g.rotation.z = c.rot + Math.sin(t*.9+c.ph)*.035; });

  boats.forEach(b=>{
    b.o.position.y = b.y + Math.sin(t*1.05+b.ph)*.16;
    b.o.rotation.z = b.r + Math.sin(t*.8+b.ph)*.035;
  });

  for (let i=0;i<N;i++){
    const d = sprayData[i];
    dummy.position.set(d.x + Math.sin(t*.6+d.ph)*.28,
                       d.y + Math.sin(t*d.sp+d.ph)*.34,
                       d.z);
    dummy.rotation.set(d.ph, t*.35+d.ph, 0);
    dummy.scale.setScalar(d.s);
    dummy.updateMatrix();
    spray.setMatrixAt(i, dummy.matrix);
  }
  spray.instanceMatrix.needsUpdate = true;

  camera.position.x = tx*1.5 + Math.sin(t*.12)*.25;
  camera.position.y = -ty*1.0 + Math.sin(t*.09)*.18;
  camera.lookAt(0,0,0);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
