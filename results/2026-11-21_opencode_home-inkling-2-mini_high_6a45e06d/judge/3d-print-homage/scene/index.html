<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa — Low-Poly Wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#e3d7b8; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }
  .cartouche {
    position:fixed; top:26px; left:26px; z-index:10; pointer-events:none;
    border:2px solid #3a2e1c; outline:1px solid #3a2e1c; outline-offset:4px;
    background:rgba(240,232,208,.82); backdrop-filter:blur(3px);
    padding:14px 22px 12px; max-width:340px;
    font-family:'Cormorant Garamond', Georgia, serif; color:#2b2114;
    box-shadow:0 4px 24px rgba(46,32,16,.25);
  }
  .cartouche h1 { margin:0 0 4px; font-size:26px; font-weight:700; letter-spacing:.04em; line-height:1.12; }
  .cartouche p  { margin:0; font-size:13px; font-style:italic; letter-spacing:.08em; color:#5a4830; }
  .credit {
    position:fixed; right:22px; bottom:18px; z-index:10; pointer-events:none;
    font-family:'Cormorant Garamond', Georgia, serif; font-size:12px; font-style:italic;
    letter-spacing:.12em; color:#4b3c26; background:rgba(240,232,208,.6);
    padding:6px 12px; border-radius:3px;
  }
  .palette {
    position:fixed; left:26px; bottom:18px; z-index:10; pointer-events:none;
    display:flex; gap:8px; align-items:center;
    font-family:'Cormorant Garamond', Georgia, serif; font-size:11px; letter-spacing:.14em;
    color:#4b3c26; text-transform:uppercase; background:rgba(240,232,208,.6); padding:7px 12px; border-radius:3px;
  }
  .palette span { width:14px; height:14px; display:inline-block; border:1px solid rgba(43,32,16,.5); transform:rotate(45deg); }
  .vignette {
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, transparent 58%, rgba(38,25,10,.38) 100%);
  }
</style>
</head>
<body>
<div id="stage"></div>
<div class="vignette"></div>
<div class="cartouche">
  <h1>The Great Wave<br>off Kanagawa</h1>
  <p>after Katsushika Hokusai, c. 1831</p>
</div>
<div class="credit">3 boats &middot; Mount Fuji &middot; built from code</div>
<div class="palette">
  <span style="background:#1d3a5c"></span><span style="background:#2e4d70"></span><span style="background:#3f5f88"></span><span style="background:#f2ead6"></span><span style="background:#e6d9b8"></span><span style="background:#8d7a5e"></span>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
} }
</script>

<script type="module">
import * as THREE from 'three';

/* ---------- renderer / scene / camera ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// warm gradient sky: beige top -> ochre mid -> gray-brown mist at horizon
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 4; skyCanvas.height = 512;
const g = skyCanvas.getContext('2d');
const grad = g.createLinearGradient(0,0,0,512);
grad.addColorStop(0.0,'#e8dfc4');
grad.addColorStop(0.45,'#d9c79c');
grad.addColorStop(0.72,'#b3a17c');
grad.addColorStop(1.0,'#8d7a5e');
g.fillStyle = grad; g.fillRect(0,0,4,512);
scene.background = new THREE.CanvasTexture(skyCanvas);
scene.fog = new THREE.Fog(0xc0ae88, 26, 66);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 7.2, 22);

/* ---------- lights ---------- */
scene.add(new THREE.AmbientLight(0xf5ead2, 1.05));
const sun = new THREE.DirectionalLight(0xfff1d0, 1.35);
sun.position.set(-14, 18, 10);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xc9d4e4, 0.4);
fill.position.set(12, 6, 14);
scene.add(fill);

/* ---------- sea ---------- */
const seaGeo = new THREE.PlaneGeometry(70, 40, 72, 42);
seaGeo.rotateX(-Math.PI/2);
const seaPos = seaGeo.attributes.position;
const seaBase = new Float32Array(seaPos.count * 3);
for (let i=0;i<seaPos.count;i++){
  seaBase[i*3]   = seaPos.getX(i);
  seaBase[i*3+1] = seaPos.getY(i);
  seaBase[i*3+2] = seaPos.getZ(i);
}
const seaMat = new THREE.MeshStandardMaterial({ color:0x355d85, flatShading:true, roughness:0.8, metalness:0.05 });
const sea = new THREE.Mesh(seaGeo, seaMat);
sea.position.set(0, 0, -6);
scene.add(sea);

/* ---------- the Great Wave (left, arching toward camera) ---------- */
const waveStartX = -13.5, waveLenX = 20, waveBaseZ = -1.5, segU = 72, segV = 18;
const foamLow = new THREE.Color(0x1d3a5c), foamMid = new THREE.Color(0x2e4d70), foamHigh = new THREE.Color(0x44648c);
function hump(u){ return 10.5 * Math.pow(Math.sin(Math.PI*(0.10 + 0.78*u)), 1.12); }
function wavePoint(u, v, out){
  const t = Math.max(0, (v - 0.60) / 0.40);
  out.x = waveStartX + u * waveLenX;
  out.y = v * hump(u) - 2.2 * t * t;
  out.z = waveBaseZ + v * v * 3.1 + Math.max(0,(v-0.60)/0.40) * 2.5;
  return out;
}
const waveGeo = (function(){
  const positions = [], colors = [], indices = [];
  const p = { x:0, y:0, z:0 };
  for (let i=0;i<=segU;i++){
    const u = i/segU;
    for (let j=0;j<=segV;j++){
      const v = j/segV;
      wavePoint(u, v, p);
      positions.push(p.x, p.y, p.z);
      const c = new THREE.Color();
      if (v < 0.5) c.lerpColors(foamLow, foamMid, v/0.5);
      else c.lerpColors(foamMid, foamHigh, (v-0.5)/0.5);
      colors.push(c.r, c.g, c.b);
    }
  }
  for (let i=0;i<segU;i++){
    for (let j=0;j<segV;j++){
      const a = i*(segV+1)+j, b = (i+1)*(segV+1)+j;
      indices.push(a, b, a+1, b, b+1, a+1);
    }
  }
  const waveGeo = new THREE.BufferGeometry();
  waveGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  waveGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  waveGeo.setIndex(indices);
  waveGeo.computeVertexNormals();
  return waveGeo;
})();
const wave = new THREE.Mesh(waveGeo, new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:0.7, metalness:0.08, side:THREE.DoubleSide }));
scene.add(wave);

/* foam crest blobs + spray */
const crestPts = [];
for (let k=0;k<14;k++){
  const u = 0.20 + (k/13) * 0.66;
  const pt = wavePoint(u, 1.0, { x:0, y:0, z:0 });
  crestPts.push(pt);
}
const foam = new THREE.Group();
crestPts.forEach((pt, k) => {
  const blob = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.62, 0),
    new THREE.MeshStandardMaterial({ color:0xf2ead6, flatShading:true, roughness:0.9 })
  );
  blob.position.set(pt.x, pt.y + 0.25, pt.z + 0.15);
  const s = 0.9 + Math.sin(k * 2.4) * 0.35 + (k%3)*0.16;
  blob.scale.set(1.45*s, 0.85*s, 0.95*s);
  blob.userData = { baseY: blob.position.y, phase: k * 1.7 };
  foam.add(blob);
});
scene.add(foam);

const spray = new THREE.Group();
const sprayBits = [];
for (let k=0;k<42;k++){
  const u = 0.25 + Math.random()*0.62;
  const pt = wavePoint(u, 1.0, { x:0, y:0, z:0 });
  const s = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.16 + Math.random()*0.22, 0),
    new THREE.MeshStandardMaterial({ color:0xf2ead6, flatShading:true, roughness:0.9 })
  );
  s.userData = { u, t: Math.random(), speed: 0.10 + Math.random()*0.14, dx: 0.6 + Math.random()*1.7, dy: 1.6 + Math.random()*2.4 };
  sprayBits.push(s); spray.add(s);
}
scene.add(spray);

/* ---------- Mount Fuji ---------- */
const fuji = new THREE.Group();
{
  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(7.2, 5.6, 7, 1),
    new THREE.MeshStandardMaterial({ color:0x43617b, flatShading:true, roughness:0.95 })
  );
  cone.position.y = 2.8;
  fuji.add(cone);
  const cap = new THREE.Mesh(
    new THREE.ConeGeometry(2.9, 2.7, 7, 1),
    new THREE.MeshStandardMaterial({ color:0xf2ead6, flatShading:true, roughness:0.95 })
  );
  cap.position.y = 4.75;
  cap.rotation.y = 0.35;
  fuji.add(cap);
}
fuji.position.set(6.5, 0, -19);
scene.add(fuji);

// mist band at Fuji base
const mist = new THREE.Mesh(
  new THREE.PlaneGeometry(46, 6),
  new THREE.MeshBasicMaterial({ color:0xe6dcc0, transparent:true, opacity:0.38, depthWrite:false })
);
mist.position.set(2, 3.4, -16.5);
scene.add(mist);

/* ---------- clouds ---------- */
const clouds = new THREE.Group();
const cloudDefs = [ {x:-11, y:11.5, z:-14, s:2.1, speed:0.22}, {x:9, y:13.5, z:-20, s:2.9, speed:0.14}, {x:1, y:10.2, z:-9, s:1.5, speed:0.34} ];
cloudDefs.forEach(def => {
  const grp = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0xeadfc2, flatShading:true, roughness:1 });
  [[0,0,0,1.4],[1.3,0.25,0.2,1.0],[-1.25,0.2,0.3,0.9],[0.4,0.75,-0.2,0.8]].forEach(b => {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(b[3], 0), mat);
    m.position.set(b[0], b[1], b[2]);
    m.scale.y = 0.62;
    grp.add(m);
  });
  grp.position.set(def.x, def.y, def.z);
  grp.scale.setScalar(def.s);
  grp.userData.speed = def.speed;
  clouds.add(grp);
});
scene.add(clouds);

/* ---------- boats ---------- */
function makeHull(){
  const geo = new THREE.BoxGeometry(6.6, 0.85, 1.7, 12, 1, 1);
  const pos = geo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const x = pos.getX(i), y = pos.getY(i);
    const t = Math.abs(x)/3.3;
    if (y < 0) pos.setY(i, y * (0.28 + 0.72 * (1 - t*t)));
    pos.setZ(i, pos.getZ(i) * (1.0 - 0.38*t*t));
  }
  geo.computeVertexNormals();
  return geo;
}
const hullGeo = makeHull();
const hullMat = new THREE.MeshStandardMaterial({ color:0x6f4a2d, flatShading:true, roughness:0.85 });
const plankMat = new THREE.MeshStandardMaterial({ color:0x3c2818, flatShading:true, roughness:0.9 });
const bodyMat = new THREE.MeshStandardMaterial({ color:0x2e4a6e, flatShading:true, roughness:0.9 });
const headMat = new THREE.MeshStandardMaterial({ color:0x2a1d14, flatShading:true, roughness:0.9 });
const oarMat = new THREE.MeshStandardMaterial({ color:0x7a4a26, flatShading:true, roughness:0.85 });

function makeBoat(){
  const boat = new THREE.Group();
  boat.add(new THREE.Mesh(hullGeo, hullMat));
  const inner = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.5, 1.3), plankMat);
  inner.position.set(0, 0.32, 0);
  boat.add(inner);
  const rowers = [];
  for (let i=0;i<5;i++){
    const r = new THREE.Group();
    const x = -2.1 + i * 1.05;
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.26, 0.95, 6), bodyMat);
    body.position.y = 0.62;
    body.rotation.z = 0.28;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 6, 5), headMat);
    head.position.set(0.16, 1.18, 0);
    const oar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3.3, 5), oarMat);
    oar.position.set(0, 0.72, 0.95);
    oar.rotation.set(1.05, 0, 0.35);
    r.add(body, head, oar);
    r.position.set(x, 0.1, -0.05);
    boat.add(r);
    rowers.push({ oar, phase: i * 0.9 });
  }
  boat.userData.rowers = rowers;
  return boat;
}
const boats = [];
const boatDefs = [
  { x:-9.2, y:0.22, z:-3.4, rotY: 0.10, phase:0.0 },   // submerged at base of the great wave
  { x:-1.4,  y:0.42, z: 5.6, rotY:-0.20, phase:2.1 },    // foreground boat
  { x: 9.4,  y:0.45, z:-6.2, rotY: 0.30, phase:4.0 }     // middle ground boat
];
boatDefs.forEach(d => {
  const b = makeBoat();
  b.position.set(d.x, d.y, d.z);
  b.rotation.y = d.rotY;
  scene.add(b);
  boats.push({ mesh:b, baseY:d.y, phase:d.phase });
});

/* ---------- animation ---------- */
const clock = new THREE.Clock();
const tmp = { x:0, y:0, z:0 };
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // sea swell
  for (let i=0;i<seaPos.count;i++){
    const x = seaBase[i*3], z = seaBase[i*3+2];
    seaPos.setY(i, Math.sin(x*0.24 + t*0.85)*0.34 + Math.sin(z*0.36 + t*1.15)*0.26);
  }
  seaPos.needsUpdate = true;
  seaGeo.computeVertexNormals();

  // crest foam gentle bob
  foam.children.forEach(blob => {
    blob.position.y = blob.userData.baseY + Math.sin(t*1.15 + blob.userData.phase) * 0.22;
  });

  // spray loop
  sprayBits.forEach(s => {
    const u = s.userData, uu = u.u;
    wavePoint(uu, 1.0, tmp);
    let frac = (t * u.speed + u.t) % 1;
    s.position.set(tmp.x + u.dx * frac, tmp.y + 0.6 + u.dy * frac - 2.2 * frac * frac, tmp.z + 0.4);
    const sc = Math.max(0.02, 1 - frac) * (0.7 + 0.6*Math.sin(frac*Math.PI));
    s.scale.setScalar(sc);
  });

  // boats bob + row
  boats.forEach(({ mesh, baseY, phase }) => {
    mesh.position.y = baseY + Math.sin(t*1.05 + phase) * 0.28;
    mesh.rotation.z = Math.sin(t*0.8 + phase) * 0.055;
    mesh.rotation.x = Math.sin(t*0.7 + phase*1.3) * 0.035;
    mesh.userData.rowers.forEach((r, i) => {
      r.oar.rotation.x = 1.05 + Math.sin(t*1.35 + r.phase) * 0.30;
    });
  });

  // clouds drift
  clouds.children.forEach(c => {
    c.position.x += c.userData.speed * 0.016;
    if (c.position.x > 34) c.position.x = -34;
  });

  // gentle camera sway
  camera.position.x = Math.sin(t*0.11) * 1.25 - 1.5;
  camera.position.y = 7.2 + Math.sin(t*0.07) * 0.35;
  camera.lookAt(-3.5, 3.0, -6);

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>
</body>
</html>
