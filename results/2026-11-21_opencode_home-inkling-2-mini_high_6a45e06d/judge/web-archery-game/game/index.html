<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop Archer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #1a0f2e; font-family: 'Nunito', sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; box-shadow: 0 24px 80px rgba(0,0,0,.55); border-radius: 14px; overflow: hidden; }
  canvas { display: block; background: #7ec8f7; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 14px 18px; pointer-events: none; z-index: 5; }
  #score-box { font-family: 'Bangers', cursive; font-size: 46px; color: #fff; text-shadow: 3px 3px 0 rgba(0,0,0,.35); line-height: 1; letter-spacing: 1px; }
  #score-box small { display: block; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 3px; color: #ffe9a3; text-shadow: 1px 1px 0 rgba(0,0,0,.4); }
  #hearts { display: flex; gap: 5px; font-size: 26px; line-height: 1; padding-top: 6px; filter: drop-shadow(2px 2px 0 rgba(0,0,0,.35)); }
  #hearts span { transition: transform .3s, opacity .3s; }
  #hearts span.lost { opacity: .22; transform: scale(.72) rotate(-18deg); }
  #hearts span.flash { animation: heartFlash .45s ease; }
  @keyframes heartFlash { 0%{transform:scale(1.9) rotate(12deg); color:#ff3355;} 100%{transform:scale(1);} }
  #streak { position: absolute; left: 50%; top: 76px; transform: translateX(-50%); font-family: 'Bangers', cursive; font-size: 24px; color: #ffd94a; text-shadow: 2px 2px 0 rgba(0,0,0,.4); letter-spacing: 2px; opacity: 0; transition: opacity .25s, transform .25s; z-index: 5; pointer-events: none; }
  #streak.show { opacity: 1; transform: translateX(-50%) scale(1.08); }
  #mutebtn { position: absolute; bottom: 12px; right: 12px; z-index: 6; width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(0,0,0,.38); color: #fff; font-size: 19px; cursor: pointer; backdrop-filter: blur(4px); transition: transform .15s; }
  #mutebtn:hover { transform: scale(1.12); }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; background: radial-gradient(ellipse at center, rgba(26,10,46,.55), rgba(12,5,26,.88)); text-align: center; padding: 30px; }
  .overlay.hidden { display: none; }
  .title-font { font-family: 'Bangers', cursive; color: #fff; letter-spacing: 3px; text-shadow: 4px 4px 0 #1a0f2e, 8px 8px 0 rgba(0,0,0,.25); line-height: .95; }
  h1.title-font { font-size: 88px; }
  h1.title-font .accent { color: #ffd94a; }
  .subtitle { color: #ffe9a3; font-weight: 800; font-size: 17px; letter-spacing: 1px; }
  .howto { color: #d9ccf2; font-size: 15px; font-weight: 600; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 12px 20px; max-width: 480px; line-height: 1.7; }
  .howto b { color: #ffd94a; }
  .btn { font-family: 'Bangers', cursive; font-size: 34px; letter-spacing: 3px; color: #2a1600; background: linear-gradient(#ffe066, #ffb703); border: none; border-radius: 14px; padding: 10px 46px 14px; cursor: pointer; box-shadow: 0 7px 0 #b26a00, 0 12px 22px rgba(0,0,0,.45); transition: transform .1s, box-shadow .1s; }
  .btn:hover { transform: translateY(-2px) scale(1.03); }
  .btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #b26a00, 0 6px 12px rgba(0,0,0,.4); }
  .best-line { color: #cbb7ea; font-weight: 800; font-size: 14px; letter-spacing: 2px; }
  #over-score { font-family: 'Bangers', cursive; font-size: 84px; color: #ffd94a; text-shadow: 4px 4px 0 rgba(0,0,0,.4); letter-spacing: 2px; line-height: 1; }
  .over-title { font-size: 66px; color: #ff8fa3; }
  .new-best { display: none; font-family: 'Bangers', cursive; color: #b9ff9e; font-size: 30px; letter-spacing: 2px; animation: pulse 1s ease infinite; }
  @keyframes pulse { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.12);} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="1024" height="640"></canvas>
  <div id="hud">
    <div id="score-box"><small>SCORE</small><span id="score">0</span></div>
    <div id="hearts"></div>
  </div>
  <div id="streak"></div>
  <button id="mutebtn" title="Mute (M)">🔊</button>
  <div class="overlay" id="title-screen">
    <h1 class="title-font">BALLOON<br><span class="accent">POP</span> ARCHER</h1>
    <div class="subtitle">A tiny Windows-95-era archery blast</div>
    <div class="howto"><b>Hold</b> the mouse to draw the bow &nbsp;•&nbsp; <b>release</b> to fire<br>Pop balloons, juggle streaks, miss 5 and you're out.</div>
    <button class="btn" id="start-btn">START</button>
    <div class="best-line" id="title-best"></div>
  </div>
  <div class="overlay hidden" id="over-screen">
    <h1 class="title-font over-title">GAME OVER</h1>
    <div id="over-score">0</div>
    <div class="new-best" id="new-best">NEW BEST!</div>
    <div class="best-line" id="over-best"></div>
    <button class="btn" id="again-btn">PLAY AGAIN</button>
  </div>
</div>
<script>
(() => {
  'use strict';
  const W = 1024, H = 640;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const heartsEl = document.getElementById('hearts');
  const streakEl = document.getElementById('streak');
  const titleEl = document.getElementById('title-screen');
  const overEl = document.getElementById('over-screen');
  const muteBtn = document.getElementById('mutebtn');
  const overScoreEl = document.getElementById('over-score');
  const overBestEl = document.getElementById('over-best');
  const newBestEl = document.getElementById('new-best');
  const titleBestEl = document.getElementById('title-best');

  // ---------- sizing ----------
  function fit() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    document.getElementById('wrap').style.width = W * scale + 'px';
    document.getElementById('wrap').style.height = H * scale + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  // ---------- audio ----------
  let AC = null, muted = false;
  function ac() {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function tone({ f = 440, f2 = null, dur = 0.15, type = 'sine', vol = 0.22, t0 = 0 }) {
    if (muted) return;
    try {
      const c = ac(), t = c.currentTime + t0;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(Math.max(f, 1), t);
      if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.06);
    } catch (e) {}
  }
  function noise({ dur = 0.15, vol = 0.3, freq = 1000, freq2 = null, q = 1, t0 = 0 }) {
    if (muted) return;
    try {
      const c = ac(), t = c.currentTime + t0;
      const len = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
      if (freq2) f.frequency.exponentialRampToValueAtTime(Math.max(freq2, 20), t + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start(t);
    } catch (e) {}
  }
  const sndDraw  = () => { tone({ f: 150, f2: 240, dur: 0.12, type: 'sawtooth', vol: 0.05 }); noise({ dur: 0.1, vol: 0.05, freq: 500, freq2: 900, q: 2 }); };
  const sndFire  = () => { tone({ f: 240, f2: 65, dur: 0.16, type: 'square', vol: 0.32 }); noise({ dur: 0.14, vol: 0.22, freq: 500, freq2: 2200, q: 0.8 }); };
  const sndPop   = () => { noise({ dur: 0.12, vol: 0.5, freq: 1100, freq2: 350, q: 0.7 }); tone({ f: 620, f2: 140, dur: 0.13, type: 'triangle', vol: 0.34 }); };
  const sndMiss  = () => { tone({ f: 150, f2: 55, dur: 0.32, type: 'sine', vol: 0.38 }); noise({ dur: 0.2, vol: 0.18, freq: 220, q: 0.6 }); };
  const sndStart = () => { [523, 659, 784, 1047].forEach((f, i) => tone({ f, dur: 0.13, type: 'triangle', vol: 0.22, t0: i * 0.075 })); };
  const sndOver  = () => { [392, 330, 262, 196].forEach((f, i) => tone({ f, dur: 0.24, type: 'triangle', vol: 0.22, t0: i * 0.16 })); };

  // ---------- state ----------
  const PALETTE = ['#ff4d6d', '#ff9f1c', '#ffd93b', '#6bcb77', '#4d96ff', '#c77dff', '#ff6b9d'];
  const ARCHER = { x: 150, y: H - 118 };
  const GRAV = 620;
  let state = 'title';
  let score = 0, best = +(localStorage.getItem('balloon-archer-best') || 0);
  let hearts = 5, streak = 0, arrows = [], balloons = [], particles = [], popups = [];
  let drawing = false, drawT = 0, power = 0, aim = 0;
  let mouse = { x: W * 0.66, y: H * 0.42 };
  let shake = 0, spawnT = 0, tGlobal = 0, flash = 0;
  let clouds = [];
  function initClouds() {
    clouds = [];
    for (let i = 0; i < 4; i++) clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 150, s: 0.6 + Math.random() * 0.8, v: 6 + Math.random() * 9 });
  }
  initClouds();

  // ---------- input ----------
  function toGame(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  cv.addEventListener('mousemove', e => { mouse = toGame(e); });
  cv.addEventListener('mousedown', e => {
    if (state !== 'playing') return;
    e.preventDefault();
    mouse = toGame(e);
    if (!drawing) { drawing = true; drawT = 0; power = 0; sndDraw(); }
  });
  window.addEventListener('mouseup', () => { if (drawing) release(); });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  // touch support: hold to draw, release to fire
  cv.addEventListener('touchstart', e => {
    if (state !== 'playing') return;
    e.preventDefault();
    mouse = toGame(e.touches[0]);
    if (!drawing) { drawing = true; drawT = 0; power = 0; sndDraw(); }
  }, { passive: false });
  cv.addEventListener('touchmove', e => { e.preventDefault(); mouse = toGame(e.touches[0]); }, { passive: false });
  cv.addEventListener('touchend', e => { e.preventDefault(); if (drawing) release(); }, { passive: false });

  window.addEventListener('keydown', e => {
    if (e.key === 'm' || e.key === 'M') toggleMute();
    if ((e.key === ' ' || e.key === 'Enter')) {
      if (state === 'title') start();
      else if (state === 'over') restart();
    }
  });

  function toggleMute() {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }
  muteBtn.addEventListener('click', toggleMute);

  document.getElementById('start-btn').addEventListener('click', start);
  document.getElementById('again-btn').addEventListener('click', restart);

  // ---------- game flow ----------
  function start() {
    score = 0; hearts = 5; streak = 0;
    arrows = []; balloons = []; particles = []; popups = [];
    spawnT = 0.3; shake = 0; flash = 0; drawing = false; power = 0;
    state = 'playing';
    titleEl.classList.add('hidden');
    overEl.classList.add('hidden');
    sndStart();
    updateHUD();
  }
  function restart() { start(); }
  function gameOver() {
    state = 'over';
    sndOver();
    drawing = false;
    const isBest = score > best;
    if (isBest) { best = score; localStorage.setItem('balloon-archer-best', String(best)); }
    overScoreEl.textContent = score;
    overBestEl.textContent = 'BEST  ' + best;
    newBestEl.style.display = isBest ? 'block' : 'none';
    overEl.classList.remove('hidden');
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    let html = '';
    for (let i = 0; i < 5; i++) html += `<span class="${i < hearts ? '' : 'lost'}">❤️</span>`;
    heartsEl.innerHTML = html;
    if (streak >= 2) { streakEl.textContent = `STREAK x${streak}`; streakEl.classList.add('show'); }
    else streakEl.classList.remove('show');
  }

  function release() {
    drawing = false;
    const p = power;
    power = 0;
    if (state !== 'playing') return;
    if (p < 0.08) return; // too soft to fire
    const sp = 480 + 760 * p;
    const nock = nockPoint();
    arrows.push({ x: nock.x, y: nock.y, vx: Math.cos(aim) * sp, vy: Math.sin(aim) * sp, dead: false });
    sndFire();
    shake = Math.max(shake, 2 + p * 3);
  }

  function nockPoint() {
    const bow = bowPoint();
    const pull = drawing ? power * 36 : 0;
    return { x: bow.x - Math.cos(aim) * pull, y: bow.y - Math.sin(aim) * pull };
  }
  function bowPoint() { return { x: ARCHER.x + 42, y: ARCHER.y - 52 }; }

  function spawnBalloon() {
    const x = W * 0.42 + Math.random() * W * 0.52;
    const y = H * 0.30 + Math.random() * H * 0.34;
    balloons.push({
      x, y, r: 21 + Math.random() * 9,
      c: PALETTE[Math.floor(Math.random() * PALETTE.length)],
      wob: Math.random() * Math.PI * 2,
      wobSpeed: 1.1 + Math.random() * 1.2,
      vy: -(10 + Math.random() * 18),
      grow: 1 // scale-in pop
    });
  }

  function hitBalloon(b) {
    score += 10 + Math.min((streak) * 5, 25);
    streak++;
    sndPop();
    shake = Math.max(shake, 5);
    popups.push({ x: b.x, y: b.y - b.r - 6, text: `+${10 + Math.min((streak - 1) * 5, 25)}`, t: 0, life: 0.85 });
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 260;
      particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, r: 2 + Math.random() * 4, c: Math.random() < 0.75 ? b.c : '#ffffff', t: 0, life: 0.5 + Math.random() * 0.5, grav: 500 });
    }
    // confetti rectangles
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 180;
      particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, r: 3 + Math.random() * 3, c: PALETTE[Math.floor(Math.random() * PALETTE.length)], t: 0, life: 0.7 + Math.random() * 0.6, grav: 380, rect: true, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12 });
    }
    updateHUD();
  }

  function missArrow() {
    hearts--;
    streak = 0;
    sndMiss();
    flash = 1;
    const heartSpan = heartsEl.children[hearts];
    if (heartSpan) heartSpan.classList.add('flash');
    updateHUD();
    if (hearts <= 0) gameOver();
  }

  // ---------- update ----------
  function update(dt) {
    tGlobal += dt;
    clouds.forEach(c => { c.x += c.v * dt; if (c.x > W + 130) c.x = -130; });

    if (state === 'playing') {
      // aim
      const bow = bowPoint();
      let ang = Math.atan2(mouse.y - bow.y, mouse.x - bow.x);
      ang = Math.max(-1.35, Math.min(1.12, ang));
      aim = ang;

      if (drawing) {
        drawT += dt;
        power = Math.min(1, drawT / 0.85);
      }

      // spawn balloons
      spawnT -= dt;
      if (spawnT <= 0 && balloons.length < 7) {
        spawnBalloon();
        spawnT = Math.max(0.62, 1.35 - score * 0.004);
      }

      // arrows
      for (const a of arrows) {
        a.vy += GRAV * dt;
        a.x += a.vx * dt; a.y += a.vy * dt;
      }
      // collision
      for (const a of arrows) {
        if (a.dead) continue;
        for (let i = 0; i < balloons.length; i++) {
          const b = balloons[i];
          const dx = a.x - b.x, dy = a.y - b.y;
          if (dx * dx + dy * dy < (b.r + 7) * (b.r + 7)) {
            a.dead = true;
            balloons.splice(i, 1);
            hitBalloon(b);
            break;
          }
        }
      }
      // miss detection
      for (const a of arrows) {
        if (a.dead) continue;
        if (a.x > W + 60 || a.x < -40 || a.y > H + 30 || a.y < -120) {
          a.dead = true;
          missArrow();
        }
      }
      arrows = arrows.filter(a => !a.dead);

      // balloons motion
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        b.wob += b.wobSpeed * dt;
        b.x += Math.sin(b.wob) * 24 * dt;
        b.y += b.vy * dt;
        b.grow = Math.min(1, b.grow + dt * 5);
        if (b.y < -90) balloons.splice(i, 1);
      }

      // shake decay
      shake = Math.max(0, shake - dt * 26);
      flash = Math.max(0, flash - dt * 3);
    }

    // particles & popups always animate
    for (const p of particles) {
      p.t += dt; p.vy += (p.grav || 400) * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.rect) p.rot += p.vr * dt;
    }
    particles = particles.filter(p => p.t < p.life);
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < p.life);
  }

  // ---------- render ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#4fa8e8');
    g.addColorStop(0.55, '#8fd0f7');
    g.addColorStop(1, '#d8f0c8');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sun
    const sx = W - 130, sy = 92;
    const sg = ctx.createRadialGradient(sx, sy, 8, sx, sy, 92);
    sg.addColorStop(0, 'rgba(255,244,170,.95)');
    sg.addColorStop(0.4, 'rgba(255,214,77,.55)');
    sg.addColorStop(1, 'rgba(255,214,77,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(sx, sy, 92, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ffdf6b';
    ctx.beginPath(); ctx.arc(sx, sy, 34, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath(); ctx.arc(sx - 6, sy - 6, 26, 0, 6.29); ctx.fill();

    // clouds
    for (const c of clouds) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(c.s, c.s);
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      ctx.beginPath();
      ctx.arc(0, 0, 26, 0, 6.29);
      ctx.arc(30, -8, 32, 0, 6.29);
      ctx.arc(62, 0, 24, 0, 6.29);
      ctx.arc(30, 10, 30, 0, 6.29);
      ctx.fill();
      ctx.fillStyle = 'rgba(210,230,245,.75)';
      ctx.beginPath(); ctx.arc(30, 16, 26, 0, 6.29); ctx.fill();
      ctx.restore();
    }
  }

  function drawHill() {
    ctx.fillStyle = '#69b35a';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.bezierCurveTo(0, H - 150, 260, H - 205, 470, H - 128);
    ctx.bezierCurveTo(620, H - 84, 820, H - 92, W, H - 60);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#57a047';
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.bezierCurveTo(60, H - 120, 300, H - 168, 480, H - 96);
    ctx.bezierCurveTo(640, H - 60, 840, H - 66, W, H - 44);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
    // grass tufts
    ctx.strokeStyle = '#3f7a36';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    const tufts = [[60, H - 104], [110, H - 130], [220, H - 152], [330, H - 134], [430, H - 108], [560, H - 78], [700, H - 80], [860, H - 74]];
    for (const [tx, ty] of tufts) {
      ctx.beginPath();
      ctx.moveTo(tx, ty); ctx.lineTo(tx - 5, ty - 12);
      ctx.moveTo(tx, ty); ctx.lineTo(tx + 1, ty - 14);
      ctx.moveTo(tx, ty); ctx.lineTo(tx + 7, ty - 11);
      ctx.stroke();
    }
  }

  function drawArcher() {
    const ax = ARCHER.x, ay = ARCHER.y;
    // legs
    ctx.strokeStyle = '#3a2b1f'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax - 8, ay + 6); ctx.lineTo(ax - 14, ay + 52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax + 10, ay + 6); ctx.lineTo(ax + 16, ay + 52); ctx.stroke();
    // boots
    ctx.fillStyle = '#241a12';
    rr(ax - 24, ay + 46, 20, 10, 4); ctx.fill();
    rr(ax + 7, ay + 46, 20, 10, 4); ctx.fill();
    // torso
    ctx.fillStyle = '#2f8f4e';
    ctx.beginPath();
    ctx.moveTo(ax - 20, ay + 8);
    ctx.quadraticCurveTo(ax - 24, ay - 44, ax, ay - 48);
    ctx.quadraticCurveTo(ax + 26, ay - 44, ax + 22, ay + 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd94a';
    rr(ax - 24, ay - 6, 48, 9, 4); ctx.fill(); // belt
    // head
    ctx.fillStyle = '#f4c48a';
    ctx.beginPath(); ctx.arc(ax + 2, ay - 62, 13, 0, 6.29); ctx.fill();
    // cap
    ctx.fillStyle = '#1f6b3a';
    ctx.beginPath();
    ctx.moveTo(ax - 14, ay - 68);
    ctx.quadraticCurveTo(ax + 2, ay - 88, ax + 18, ay - 68);
    ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.ellipse(ax + 14, ay - 69, 12, 4, -0.15, 0, 6.29); ctx.fill();

    // bow + arms
    const bow = bowPoint();
    const axS = bow.x - Math.cos(aim) * 30, ayS = bow.y - Math.sin(aim) * 30;
    // arm to bow
    ctx.strokeStyle = '#f4c48a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax + 8, ay - 34); ctx.lineTo(bow.x - Math.cos(aim) * 12, bow.y - Math.sin(aim) * 12); ctx.stroke();

    // bow (rotated arc)
    ctx.save();
    ctx.translate(bow.x, bow.y);
    ctx.rotate(aim);
    ctx.strokeStyle = '#5a3817'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, 44, -1.25, 1.25);
    ctx.stroke();
    ctx.strokeStyle = '#7a4d24'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, 40, -1.25, 1.25); ctx.stroke();
    // tips
    const tipTop = { x: Math.cos(-1.25) * 44, y: Math.sin(-1.25) * 44 };
    const tipBot = { x: Math.cos(1.25) * 44, y: Math.sin(1.25) * 44 };
    // string
    const nock = nockPoint();
    const nockLocal = { x: nock.x - bow.x, y: nock.y - bow.y };
    // rotate nock local into bow space
    const cosA = Math.cos(-aim), sinA = Math.sin(-aim);
    const nockBow = { x: nockLocal.x * cosA - nockLocal.y * sinA, y: nockLocal.x * sinA + nockLocal.y * cosA };
    ctx.strokeStyle = '#f3ecd8'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tipTop.x, tipTop.y);
    ctx.lineTo(nockBow.x, nockBow.y);
    ctx.lineTo(tipBot.x, tipBot.y);
    ctx.stroke();
    // drawn arrow
    if (drawing && state === 'playing') {
      ctx.strokeStyle = '#2b1d10'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(nockBow.x, nockBow.y);
      ctx.lineTo(46, 0);
      ctx.stroke();
      ctx.fillStyle = '#e8e8e8';
      ctx.beginPath();
      ctx.moveTo(52, 0); ctx.lineTo(40, -4.5); ctx.lineTo(40, 4.5); ctx.closePath(); ctx.fill();
      // fletching
      ctx.strokeStyle = '#ff595e'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(nockBow.x, nockBow.y); ctx.lineTo(nockBow.x - 10, nockBow.y - 4);
      ctx.moveTo(nockBow.x, nockBow.y); ctx.lineTo(nockBow.x - 10, nockBow.y + 4);
      ctx.stroke();
    }
    ctx.restore();

    // drawing arm (to nock)
    if (drawing && state === 'playing') {
      ctx.strokeStyle = '#f4c48a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      const nock = nockPoint();
      ctx.beginPath(); ctx.moveTo(ax + 6, ay - 26); ctx.lineTo(nock.x, nock.y); ctx.stroke();
    }
  }

  function drawTrajectory() {
    if (!drawing || state !== 'playing') return;
    const sp = 480 + 760 * power;
    const bow = bowPoint();
    let px = bow.x, py = bow.y, pvx = Math.cos(aim) * sp, pvy = Math.sin(aim) * sp;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 42; i++) {
      const dt = 0.035;
      pvy += GRAV * dt;
      px += pvx * dt; py += pvy * dt;
      if (py > H + 20) break;
      if (i % 2 === 0) {
        ctx.globalAlpha = 1 - i / 46;
        ctx.beginPath(); ctx.arc(px, py, 3.4 - i * 0.045, 0, 6.29); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawBalloon(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    const s = b.grow;
    ctx.scale(s, s);
    // string
    ctx.strokeStyle = 'rgba(40,30,50,.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, b.r + 4);
    ctx.quadraticCurveTo(Math.sin(b.wob * 1.6) * 7, b.r + 26, Math.sin(b.wob * 0.8) * 5, b.r + 46);
    ctx.stroke();
    // knot
    ctx.fillStyle = b.c;
    ctx.beginPath();
    ctx.moveTo(-4, b.r - 2); ctx.lineTo(4, b.r - 2); ctx.lineTo(0, b.r + 6); ctx.closePath(); ctx.fill();
    // body
    const grd = ctx.createRadialGradient(-b.r * 0.35, -b.r * 0.4, b.r * 0.15, 0, 0, b.r * 1.15);
    grd.addColorStop(0, '#ffffff');
    grd.addColorStop(0.18, '#ffffff');
    grd.addColorStop(0.25, b.c);
    grd.addColorStop(1, shade(b.c, -38));
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(0, 0, b.r * 0.92, b.r, 0, 0, 6.29);
    ctx.fill();
    // highlight
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath();
    ctx.ellipse(-b.r * 0.36, -b.r * 0.44, b.r * 0.18, b.r * 0.28, -0.5, 0, 6.29);
    ctx.fill();
    ctx.restore();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return `rgb(${r},${g},${b})`;
  }

  function drawArrows() {
    for (const a of arrows) {
      const ang = Math.atan2(a.vy, a.vx);
      // trail
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(a.x - Math.cos(ang) * 34, a.y - Math.sin(ang) * 34);
      ctx.lineTo(a.x, a.y);
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(ang);
      ctx.strokeStyle = '#2b1d10'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-22, 0); ctx.lineTo(8, 0); ctx.stroke();
      ctx.fillStyle = '#e8e8e8';
      ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(4, -4.6); ctx.lineTo(4, 4.6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ff595e'; ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(-22, 0); ctx.lineTo(-31, -4.4);
      ctx.moveTo(-22, 0); ctx.lineTo(-31, 4.4);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const k = 1 - p.t / p.life;
      ctx.save();
      ctx.globalAlpha = Math.max(0, k);
      ctx.fillStyle = p.c;
      if (p.rect) {
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot || 0);
        ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k + 0.6, 0, 6.29); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawPopups() {
    for (const p of popups) {
      const k = 1 - p.t / p.life;
      ctx.save();
      ctx.globalAlpha = k;
      ctx.translate(p.x, p.y - p.t * 52);
      ctx.font = '30px Bangers, cursive';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = 'rgba(30,10,40,.8)'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
      ctx.strokeText(p.text, 0, 0);
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
  }

  function drawCrosshair() {
    if (state !== 'playing') return;
    const m = mouse;
    ctx.save();
    ctx.translate(m.x, m.y);
    const s = drawing ? 10 + power * 4 : 12;
    ctx.strokeStyle = 'rgba(30,20,40,.75)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, s, 0, 6.29); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s - 7, 0); ctx.lineTo(-s + 3, 0);
    ctx.moveTo(s + 7, 0); ctx.lineTo(s - 3, 0);
    ctx.moveTo(0, -s - 7); ctx.lineTo(0, -s + 3);
    ctx.moveTo(0, s + 7); ctx.lineTo(0, s - 3);
    ctx.stroke();
    ctx.strokeStyle = '#ffd94a'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, 0, s, 0, 6.29); ctx.stroke();
    ctx.restore();
  }

  function drawPowerMeter() {
    if (!drawing || state !== 'playing') return;
    const bow = bowPoint();
    const x = bow.x - 34, y = bow.y - 78;
    const w = 92, h = 13;
    ctx.save();
    ctx.fillStyle = 'rgba(15,8,30,.55)';
    rr(x, y, w, h, 7); ctx.fill();
    const grad = ctx.createLinearGradient(x, y, x + w, y);
    grad.addColorStop(0, '#6bcb77');
    grad.addColorStop(0.6, '#ffd93b');
    grad.addColorStop(1, '#ff595e');
    ctx.fillStyle = grad;
    rr(x + 2, y + 2, Math.max(6, (w - 4) * power), h - 4, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5;
    rr(x, y, w, h, 7); ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    drawSky();
    drawHill();
    drawArcher();
    drawTrajectory();
    balloons.forEach(drawBalloon);
    drawArrows();
    drawParticles();
    drawPopups();
    drawPowerMeter();
    drawCrosshair();

    // miss flash vignette
    if (flash > 0 && state === 'playing') {
      ctx.fillStyle = `rgba(255,50,70,${flash * 0.16})`;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();

    if (state === 'title') {
      // gentle “pop” demo hint behind overlay — nothing extra needed
    }
  }

  // ---------- loop ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // debug hook (harmless)
  window.__game = { get state() { return state; }, get score() { return score; }, get hearts() { return hearts; }, get power() { return power; }, get drawing() { return drawing; }, get balloonList() { return balloons.map(b => ({ x: b.x, y: b.y, r: b.r })); }, get arrows() { return arrows.length; } };

  // init hearts & best line
  heartsEl.innerHTML = '<span>❤️</span>'.repeat(5);
  titleBestEl.textContent = best > 0 ? 'BEST  ' + best : '';
})();
</script>
</body>
</html>
