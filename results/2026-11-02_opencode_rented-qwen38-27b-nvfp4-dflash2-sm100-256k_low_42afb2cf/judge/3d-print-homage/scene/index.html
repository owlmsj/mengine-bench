<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kanagawa-oki Nami Ura - low-poly wallpaper</title>
<!-- Google Fonts is the only allowed external origin besides the Three.js CDN. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e4d9bf; }
  canvas { display: block; }
  #card {
    position: absolute; top: 22px; left: 24px;
    font-family: 'Shippori Mincho', serif;
    color: #2b2a26; pointer-events: none; user-select: none; line-height: 1.15;
  }
  #card .jp { font-size: 30px; font-weight: 800; letter-spacing: .06em; }
  #card .en { font-size: 12px; font-weight: 400; letter-spacing: .12em;
              text-transform: uppercase; opacity: .72; margin-top: 4px; }
  #card .rule { width: 64px; height: 2px; background: #2b2a26; opacity: .55;
                margin: 8px 0 6px; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
  <div id="card">
    <div class="jp">神奈川沖浪裏</div>
    <div class="rule"></div>
    <div class="en">The Great Wave off Kanagawa &middot; low-poly</div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // ---- Palette taken from the print (reference, not a texture) ----
    const C = {
      deep:  0x1e3a5f, // Prussian / indigo blue of the wave body
      mid:   0x2f5b86, // mid blue, smaller waves
      light: 0x5b8cb0, // light blue, foreground swell
      sea:   0x21405f, // deep trough water
      foam:  0xf2efe6, // white foam & claws
      fuji:  0x6d6a60, // gray-brown mountain body
      snow:  0xf4f4f0, // Fuji snow cap
      hull:  0xd6a15a, // pink-tan boat hulls
      wood:  0x5b3f2a, // dark wood / oars / planks
    };

    const scene = new THREE.Scene();

    // Cream-to-smoky vertical gradient sky (canvas texture, screen space).
    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 2; skyCanvas.height = 512;
    const sctx = skyCanvas.getContext('2d');
    const grad = sctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.00, '#efe6cd');
    grad.addColorStop(0.38, '#e4d9bf');
    grad.addColorStop(0.62, '#bdb6a4');
    grad.addColorStop(1.00, '#77746b');
    sctx.fillStyle = grad; sctx.fillRect(0, 0, 2, 512);
    const skyTex = new THREE.CanvasTexture(skyCanvas);
    skyTex.colorSpace = THREE.SRGBColorSpace;
    scene.background = skyTex;

    const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 200);
    camera.position.set(0, 1.5, 19);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // Lighting tuned to keep faces close to the flat print colors.
    scene.add(new THREE.AmbientLight(0xffffff, 0.92));
    const key = new THREE.DirectionalLight(0xfff4e0, 0.5);
    key.position.set(4, 8, 6);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xcfd8ff, 0.16);
    fill.position.set(-6, 3, -4);
    scene.add(fill);

    function mat(color) {
      return new THREE.MeshStandardMaterial({
        color, flatShading: true, roughness: 1.0, metalness: 0.0,
      });
    }

    // ---- Deep water floor so the boats have something to sit in ----
    const sea = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 70),
      mat(C.sea)
    );
    sea.rotation.x = -Math.PI / 2;
    sea.position.set(0, -3.6, -6);
    scene.add(sea);

    // ---- The great curling wave (left): hook/claw outline, extruded for body. ----
    function buildWave() {
      const pts = [
        [-7.0, -3.0], [-6.6, 0.5], [-5.4, 2.6], [-3.4, 4.4], [-1.2, 5.7],
        [ 0.9, 6.1],  [ 2.4, 5.3],  [ 3.3, 3.9],  [ 3.7, 2.4],  [ 3.1, 1.0],
        [ 2.0, 1.3],  [ 1.6, 2.6],  [ 1.9, 3.8],  [ 3.0, 4.3],  [ 4.1, 3.3],
        [ 4.9, 1.6],  [ 5.4, 0.0],  [ 5.6, -2.0], [ 5.6, -3.0],
      ];
      const shape = new THREE.Shape();
      shape.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 6, bevelEnabled: false, curveSegments: 1 });
      geo.translate(0, 0, -3); // center along z
      return new THREE.Mesh(geo, mat(C.deep));
    }

    const waveGroup = new THREE.Group();
    waveGroup.add(buildWave());
    waveGroup.scale.setScalar(0.85);
    waveGroup.position.x = -2.5;
    scene.add(waveGroup);

    // White foam "claws" (the curling spiky tips) along the crest.
    // [x, y, tiltZ]  tiltZ<0 leans the tip to the right, following the curl.
    const clawSpec = [
      [-4.6, 3.1, -0.55], [-3.6, 4.1, -0.50], [-2.5, 5.0, -0.40], [-1.4, 5.6, -0.30],
      [-0.3, 5.9, -0.20], [ 0.9, 5.9, -0.10], [ 2.0, 5.3, -0.15], [ 2.9, 4.4, -0.30],
      [ 3.4, 3.2, -0.55], [ 3.5, 2.1, -0.90], [ 3.1, 1.2, -1.20], [ 2.3, 1.3, -0.70],
    ];
    const clawGeo = new THREE.ConeGeometry(0.55, 1.5, 5);
    const clawMat = mat(C.foam);
    const claws = [];
    for (const [x, y, tilt] of clawSpec) {
      const c = new THREE.Mesh(clawGeo, clawMat);
      c.position.set(x, y + 0.2, 2.6);
      c.rotation.set(0.35, 0, tilt);
      c.userData.phase = Math.random() * Math.PI * 2;
      waveGroup.add(c);
      claws.push(c);
    }

    // Froth bits between the claws.
    const foamGeo = new THREE.IcosahedronGeometry(0.28, 0);
    const foamMat = mat(C.foam);
    const foamSpots = [
      [-4.0, 3.5], [-2.9, 4.4], [-1.8, 5.2], [-0.6, 5.5], [ 0.4, 5.5],
      [ 1.5, 5.3], [ 2.5, 4.7], [ 3.1, 3.6], [ 3.4, 2.7], [ 2.7, 2.3],
    ];
    for (const [x, y] of foamSpots) {
      const f = new THREE.Mesh(foamGeo, foamMat);
      f.position.set(x, y + 0.1, 2.75);
      waveGroup.add(f);
    }

    // Scattered white foam dots on the blue face (the print's spray specks).
    const sprayGeo = new THREE.IcosahedronGeometry(0.16, 0);
    const sprayPositions = [
      [-5.0, 1.2], [-4.0, 2.2], [-3.0, 3.2], [-2.0, 4.0], [-0.8, 4.4],
      [ 0.4, 4.2], [ 1.6, 3.6], [-5.2, 0.2], [-3.6, 1.2], [-1.8, 2.4],
      [-0.4, 3.2], [ 1.2, 2.8], [ 2.4, 2.4], [-2.6, 2.0],
    ];
    for (const [x, y] of sprayPositions) {
      const s = new THREE.Mesh(sprayGeo, foamMat);
      s.position.set(x, y, 2.9);
      waveGroup.add(s);
    }

    // Lighter-blue water streaks on the face (the print's spiral bands).
    const streakMat = mat(0x7ba3c4);
    const streaks = [
      { p: [-3.6, 2.3, 3.0], r: 0.9,  len: 3.4, w: 0.5 },
      { p: [-1.4, 4.1, 3.0], r: 0.5,  len: 3.0, w: 0.45 },
      { p: [ 1.5, 4.5, 3.0], r: -0.5, len: 2.8, w: 0.45 },
      { p: [ 2.2, 3.5, 3.0], r: -0.9, len: 2.4, w: 0.4 },
    ];
    for (const s of streaks) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(1, s.w, 0.12), streakMat);
      m.scale.x = s.len;
      m.position.set(...s.p);
      m.rotation.z = s.r;
      waveGroup.add(m);
    }

    // ---- Smaller waves: a hump on the right, a low swell in the foreground. ----
    function buildHump(color) {
      const pts = [[-2.6, -2], [-1.6, 0.3], [0, 1.2], [1.6, 0.3], [2.6, -2]];
      const shape = new THREE.Shape();
      shape.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 5, bevelEnabled: false, curveSegments: 1 });
      geo.translate(0, 0, -2.5);
      return new THREE.Mesh(geo, mat(color));
    }
    const rightWave = buildHump(C.mid);
    rightWave.position.set(8.0, -0.6, -0.5);
    rightWave.rotation.y = -0.3;
    rightWave.scale.setScalar(1.2);
    scene.add(rightWave);

    const frontWave = buildHump(C.light);
    frontWave.position.set(0.4, -1.9, 6.8);
    frontWave.rotation.y = 0.05;
    frontWave.scale.set(1.5, 1.15, 1.0);
    scene.add(frontWave);

    // Foam rim on the foreground swell.
    const rimGeo = new THREE.IcosahedronGeometry(0.24, 0);
    const rimMat = mat(C.foam);
    for (let i = -4; i <= 4; i++) {
      const r = new THREE.Mesh(rimGeo, rimMat);
      r.position.set(0.4 + i * 1.1, -1.0 + Math.abs(Math.sin(i * 0.8)) * 0.6, 7.2);
      scene.add(r);
    }

    // ---- Mount Fuji: small, snow-capped, centered in the smoky background. ----
    const fujiGroup = new THREE.Group();
    const fujiBody = new THREE.Mesh(new THREE.ConeGeometry(3.2, 4.4, 6), mat(C.fuji));
    fujiGroup.add(fujiBody); // base local y=-2.2, tip local y=+2.2
    const fujiCap = new THREE.Mesh(new THREE.ConeGeometry(1.45, 1.98, 6), mat(C.snow));
    fujiCap.position.y = 1.21; // snow cap on the upper slope, tip at the peak
    fujiGroup.add(fujiCap);
    fujiGroup.position.set(3.5, -2.0, -11);
    fujiGroup.scale.setScalar(1.35);
    scene.add(fujiGroup);

    // ---- Boats (fune): long narrow pink-tan hulls with planks, rowers and oars. ----
    function buildBoat() {
      const g = new THREE.Group();
      const pts = [
        [-1.4, 0.0], [-1.0, 0.32], [0, 0.42], [1.0, 0.32], [1.4, 0.0],
        [1.0, -0.10], [0, -0.14], [-1.0, -0.10],
      ];
      const shape = new THREE.Shape();
      shape.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.34, bevelEnabled: false, curveSegments: 1 });
      geo.translate(0, 0, -0.17);
      g.add(new THREE.Mesh(geo, mat(C.hull)));

      const woodMat = mat(C.wood);
      const plank = new THREE.BoxGeometry(2.5, 0.04, 0.4);
      for (const z of [-0.06, 0.06]) {
        const p = new THREE.Mesh(plank, woodMat);
        p.position.set(0, 0.20, z);
        g.add(p);
      }
      const hump = new THREE.BoxGeometry(0.16, 0.12, 0.2);
      for (const x of [-0.7, -0.2, 0.3, 0.8]) {
        const h = new THREE.Mesh(hump, woodMat);
        h.position.set(x, 0.30, 0);
        g.add(h);
      }
      const oar = new THREE.BoxGeometry(0.5, 0.03, 0.03);
      for (const x of [-0.8, -0.3, 0.2, 0.7]) {
        for (const side of [-1, 1]) {
          const o = new THREE.Mesh(oar, woodMat);
          o.position.set(x, 0.24, side * 0.30);
          o.rotation.x = side * 0.5;
          g.add(o);
        }
      }
      return g;
    }

    const boats = [];
    const boatSpec = [
      { pos: [-4.8, -0.6, 3.0],  rot: 0.10, scale: 1.15 },  // left, under the wave
      { pos: [ 4.8, -0.8, -1.0], rot: 0.30, scale: 1.15 },  // mid-right trough
      { pos: [ 0.4, -1.1, 5.4],  rot: -0.10, scale: 1.45 }, // foreground center
    ];
    for (const s of boatSpec) {
      const b = buildBoat();
      b.position.set(...s.pos);
      b.rotation.y = s.rot;
      b.scale.setScalar(s.scale);
      b.userData.baseY = s.pos[1];
      scene.add(b);
      boats.push(b);
    }

    // ---- Gentle motion ----
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      waveGroup.position.y = Math.sin(t * 0.6) * 0.18;
      waveGroup.rotation.z = Math.sin(t * 0.45) * 0.015;

      for (const c of claws) {
        c.scale.setScalar(1 + Math.sin(t * 1.5 + c.userData.phase) * 0.08);
      }

      for (let i = 0; i < boats.length; i++) {
        const b = boats[i];
        const ph = i * 1.7;
        b.position.y = b.userData.baseY + Math.sin(t * 1.0 + ph) * 0.12;
        b.rotation.z = Math.sin(t * 0.9 + ph) * 0.06;
        b.rotation.x = Math.cos(t * 0.7 + ph) * 0.03;
      }

      rightWave.position.y = -0.6 + Math.sin(t * 0.5 + 1.2) * 0.12;
      frontWave.position.y = -1.9 + Math.sin(t * 0.7 + 2.1) * 0.10;

      camera.position.x = Math.sin(t * 0.12) * 0.4;
      camera.lookAt(0.5, 1.4, 0);

      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
