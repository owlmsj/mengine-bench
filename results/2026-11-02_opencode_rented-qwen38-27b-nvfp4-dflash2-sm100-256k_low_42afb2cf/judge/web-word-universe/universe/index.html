<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Universo das Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{--bg0:#04050d;--bg1:#0c1230;--fg:#e9edff;--dim:#8f98c0;--accent:#8fb4ff;--line:rgba(140,160,255,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(130% 120% at 28% 18%,var(--bg1),var(--bg0));color:var(--fg);font-family:Inter,system-ui,sans-serif}
#scene{position:fixed;inset:0;display:block;cursor:grab}
#scene.grabbing{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:Literata,serif;font-size:13px;line-height:1;color:#fff;
 text-shadow:0 0 10px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.9);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s}
.lbl.big{font-size:24px;font-weight:600;letter-spacing:.2px}
.lbl .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
#top{position:fixed;top:0;left:0;right:0;padding:16px 20px;display:flex;gap:18px;align-items:flex-start;z-index:6;pointer-events:none;
 background:linear-gradient(180deg,rgba(4,5,13,.85),rgba(4,5,13,0))}
#brand{pointer-events:auto}
#brand h1{font-family:Literata,serif;font-size:21px;margin:0;font-weight:600;letter-spacing:.3px}
#brand h1 span{color:var(--accent)}
#brand p{margin:3px 0 0;font-size:12px;color:var(--dim)}
#searchwrap{position:relative;pointer-events:auto;margin-left:auto;width:min(340px,46vw)}
#search{width:100%;padding:10px 14px;border-radius:11px;border:1px solid var(--line);background:rgba(10,14,34,.72);
 color:var(--fg);font-size:14px;font-family:Inter;outline:none;backdrop-filter:blur(6px)}
#search:focus{border-color:var(--accent)}
#suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(10,14,34,.96);border:1px solid var(--line);
 border-radius:11px;overflow:hidden;display:none;max-height:320px;overflow-y:auto;backdrop-filter:blur(8px)}
#suggest .row{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:14px;cursor:pointer}
#suggest .row:hover{background:rgba(120,150,255,.12)}
#suggest .row .sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
#suggest .row .th{margin-left:auto;font-size:11px;color:var(--dim)}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,44vw);z-index:5;pointer-events:auto;
 background:linear-gradient(200deg,rgba(9,12,30,.92),rgba(6,8,20,.92));border-left:1px solid var(--line);
 backdrop-filter:blur(10px);padding:78px 22px 22px;overflow-y:auto}
#panel h2{font-family:Literata,serif;font-size:30px;margin:0;font-weight:600;line-height:1.05}
#panel .theme{font-size:12px;color:var(--dim);margin:6px 0 14px;display:flex;align-items:center;gap:8px}
#panel .theme .sw{width:10px;height:10px;border-radius:50%}
#panel .sec{margin-top:18px}
#panel .sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:0 0 9px}
#panel .rels{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:Literata,serif;font-size:14px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);
 background:rgba(20,26,58,.6);cursor:pointer;color:var(--fg);transition:.15s}
.chip:hover{border-color:var(--accent);background:rgba(60,90,190,.3)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
#panel .desc{font-size:13px;color:var(--dim);line-height:1.5}
#legend .row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;color:var(--fg)}
#legend .sw{width:10px;height:10px;border-radius:50%}
#legend .n{margin-left:auto;color:var(--dim);font-size:12px}
#stats{display:flex;gap:22px;margin-top:8px}
#stats .s .v{font-family:Literata,serif;font-size:22px;font-weight:600}
#stats .s .k{font-size:11px;color:var(--dim)}
#back{margin-top:16px;font-size:12px;color:var(--accent);cursor:pointer;display:none;background:none;border:none;font-family:Inter}
#hint{position:fixed;bottom:14px;left:20px;font-size:11px;color:var(--dim);z-index:5;letter-spacing:.02em}
#clear{position:fixed;top:16px;right:16px;z-index:7;display:none;background:rgba(10,14,34,.7);border:1px solid var(--line);
 color:var(--dim);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:Inter}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>
<div id="top">
  <div id="brand"><h1>Universo das <span>Palavras</span></h1><p id="brand-sub">Dicionário Criativo</p></div>
  <div id="searchwrap"><input id="search" placeholder="busque uma palavra…" autocomplete="off" spellcheck="false"/>
    <div id="suggest"></div></div>
</div>
<button id="clear">✕ limpar</button>
<aside id="panel"></aside>
<div id="hint">arraste para orbitar · role para aproximar · clique numa palavra</div>

const ADJ = new Map(); const edges = [];

  const a=k(w),b=k(t); if(a!==b) edges.push([a,b,new Set(kind.split(""))]); } }

/* ---------- 3D layout (seeded, deterministic) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(20261102);
const themeCenters = {};
{ const R=100, n=themeList.length;
  for(let i=0;i<n;i++){ const y=1-(i+0.5)/n*2, r=Math.sqrt(1-y*y), th=i*2.399963;
    themeCenters[themeList[i]]=new THREE.Vector3(Math.cos(th)*r*R, y*R, Math.sin(th)*r*R); } }
const pos = WORDS.map(w=>{ const c=themeCenters[w[1]];
  return new THREE.Vector3(c.x+(rnd()*2-1)*22, c.y+(rnd()*2-1)*22, c.z+(rnd()*2-1)*22); });
{ const springs=[]; for(const [a,b] of EDGEMAP){ const ia=INDEX.get(a).i, ib=INDEX.get(b).i; springs.push([ia,ib]); }
  const F=Array.from({length:WORDS.length},()=>new THREE.Vector3());
  const d=new THREE.Vector3();
  for(let it=0;it<420;it++){ F.forEach(v=>v.set(0,0,0));
    for(let i=0;i<WORDS.length;i++) for(let j=i+1;j<WORDS.length;j++){ d.subVectors(pos[i],pos[j]);
      let dist2=d.lengthSq(); if(dist2<1)dist2=1; const cut=40; if(dist2<cut*cut){ const f=70/dist2; F[i].addScaledVector(d.normalize(),f); F[j].addScaledVector(d.normalize(),-f); } }
    for(const [i,j] of springs){ d.subVectors(pos[j],pos[i]); const dist=d.length()||1; const f=0.012*(dist-12);
      F[i].addScaledVector(d.normalize(),f); F[j].addScaledVector(d.normalize(),-f); }
    for(let i=0;i<WORDS.length;i++){ d.subVectors(themeCenters[WORDS[i][1]],pos[i]); F[i].addScaledVector(d,0.06); }
    for(let i=0;i<WORDS.length;i++){ pos[i].addScaledVector(F[i],0.9); } } }

/* starfield */
{ const N=1600, p=new Float32Array(N*3);

/* edges as line segments */
{ const p=new Float32Array(EDGEMAP.length*6), c=new Float32Array(EDGEMAP.length*6);
  EDGEMAP.forEach(([a,b],e)=>{ const A=INDEX.get(a).i,B=INDEX.get(b).i;
    p.set([pos[A].x,pos[A].y,pos[A].z,pos[B].x,pos[B].y,pos[B].z],e*6);

    window.EDGE.geometry.attributes.color.needsUpdate=true;

    ' · '+rels.length+' ligações</div>'+
    '<div class="sec"><h3>Palavras ligadas</h3><div class="rels">'+
      rels.map(r=>'<span class="chip" data-w="'+r.w+'"><span class="dot" style="background:'+THEME_COLORS[r.theme]+'"></span>'+r.w+'</span>').join("")+
    '</div></div>'+
    '<div class="sec"><h3>Classificação</h3><div class="desc">'+
      rels.filter(r=>r.kind.has("s")).length+' sinônimo(s) · '+rels.filter(r=>r.kind.has("a")).length+' análoga(s)'+
    '</div></div>'+
    '<button id="back">← voltar ao universo</button>';
  P.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>select(ch.dataset.w));
  P.querySelector("#back").style.display="block"; P.querySelector("#back").onclick=()=>select(null);
}

/* ---------- selection API ---------- */
function select(w){ selected=w;
  if(w) history.replaceState(null,"","?word="+encodeURIComponent(w));
  else history.replaceState(null,"","");
  apply(); const cs=document.getElementById("clear"); cs.style.display=w?"block":"none"; }
document.getElementById("clear").onclick=()=>select(null);

/* ---------- search ---------- */
const search=document.getElementById("search"), sug=document.getElementById("suggest");
function matches(q){ if(!q) return []; const ql=q.toLowerCase(), nq=norm(q); const res=[];
  for(const w of WORDS){ const kk=k(w[0]);
    if(kk===ql) res.push([0,w[0]]); else if(kk.startsWith(ql)||norm(w[0]).startsWith(nq)) res.push([1,w[0]]);
    else if(kk.includes(ql)||norm(w[0]).includes(nq)) res.push([2,w[0]]); }
  res.sort((a,b)=>a[0]-b[0]||a[1].localeCompare(b[1],"pt"));
  return res.slice(0,8).map(x=>x[1]); }
function drawSuggest(list){ if(!list.length){ sug.style.display="none"; return; }
  sug.innerHTML=list.map(w=>'<div class="row" data-w="'+w+'"><span class="sw" style="background:'+THEME_COLORS[INDEX.get(k(w)).theme]+'"></span>'+w+
    '<span class="th">'+INDEX.get(k(w)).theme+'</span></div>').join(""); sug.style.display="block";
  sug.querySelectorAll(".row").forEach(r=>r.onmousedown=e=>{e.preventDefault();select(r.dataset.w);sug.style.display="none";search.value="";}); }
search.addEventListener("input",()=>{ drawSuggest(matches(search.value));
  const ex=resolve(search.value); if(ex&&norm(ex)===norm(search.value)){ select(ex); sug.style.display="none"; } });
search.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const m=matches(search.value)[0]; if(m)select(m); sug.style.display="none"; }
  if(e.key==="Escape"){ sug.style.display="none"; search.blur(); } });
addEventListener("click",e=>{ if(!e.target.closest("#searchwrap")) sug.style.display="none"; });

/* ---------- orbit + raycast ---------- */
let yaw=0.4,pitch=0.12,dragging=false,lx=0,ly=0;
function applyCam(){ content.rotation.set(pitch,yaw,0); }
canvas.addEventListener("pointerdown",e=>{dragging=true;lx=e.clientX;ly=e.clientY;canvas.classList.add("grabbing");});
addEventListener("pointermove",e=>{ if(dragging){ yaw+=(e.clientX-lx)*0.005; pitch+=(e.clientY-ly)*0.005;
  pitch=Math.max(-1.4,Math.min(1.4,pitch)); lx=e.clientX;ly=e.clientY; applyCam(); } else hover(e); });
addEventListener("pointerup",()=>{dragging=false;canvas.classList.remove("grabbing");});
canvas.addEventListener("wheel",e=>{ e.preventDefault(); camera.position.z=Math.max(60,Math.min(420,camera.position.z+e.deltaY*0.25)); },{passive:false});
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
function pick(e){ mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObjects(nodes,false); return hit.length?hit[0].object:null; }
function hover(e){ const m=pick(e); canvas.style.cursor=m?"pointer":"grab"; }
canvas.addEventListener("click",e=>{ const m=pick(e); if(m) select(m.userData.word); });
let moved=0; canvas.addEventListener("pointerdown",()=>moved=0);

/* ---------- labels each frame ---------- */
const proj=new THREE.Vector3();
function tick(){ renderer.render(scene,camera);
  for(const L of labelEls){ const i=INDEX.get(k(L.w)).i; proj.copy(nodes[i].position); proj.applyEuler(content.rotation); proj.project(camera);
    if(proj.z>1){ L.el.style.opacity=0; continue; }
    const big=L.el.classList.contains("big");
    const x=(proj.x*0.5+0.5)*innerWidth, y=(-proj.y*0.5+0.5)*innerHeight+(big?0:17);
    L.el.style.transform="translate(-50%,-50%) translate("+x+"px,"+y+"px)";
    L.el.style.opacity = big?1:0.95; }
  requestAnimationFrame(tick); }

/* ---------- boot ---------- */
document.getElementById("brand-sub").textContent="Dicionário Criativo · "+STATS.words+" palavras · "+STATS.relations+" relações";
applyCam();
const initial=resolve(new URLSearchParams(location.search).get("word"));
select(initial); tick();
</script>
</body>
