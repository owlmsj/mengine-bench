<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Universo das Palavras — Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0e1a; --ink:#e8ecf8; --dim:#8b93ad; --gold:#f5d78e; --card:rgba(16,20,38,.78); }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; background:radial-gradient(120% 120% at 50% 0%, #131a33 0%, var(--bg) 55%, #070910 100%); color:var(--ink); font-family:'Sora',sans-serif; }
  canvas { display:block; }
  #labels { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .lbl { position:absolute; transform:translate(-50%,-140%); font-size:12px; letter-spacing:.04em; color:var(--ink); text-shadow:0 1px 8px #000,0 0 14px #000; white-space:nowrap; }
  .lbl.sel { font-size:17px; font-family:'Cormorant Garamond',serif; font-weight:600; color:var(--gold); }
  #hud { position:fixed; top:18px; left:20px; z-index:5; max-width:340px; }
  #hud h1 { font-family:'Cormorant Garamond',serif; font-size:30px; font-weight:600; line-height:1.05; }
  #hud h1 em { color:var(--gold); font-style:italic; }
  #hud p.sub { color:var(--dim); font-size:12.5px; margin-top:6px; }
  #searchwrap { position:relative; margin-top:14px; }
  #search { width:100%; padding:10px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.14); background:var(--card); color:var(--ink); font:14px 'Sora',sans-serif; outline:none; backdrop-filter:blur(8px); }
  #search:focus { border-color:rgba(245,215,142,.55); }
  #sugg { position:absolute; top:calc(100% + 6px); left:0; right:0; background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:12px; backdrop-filter:blur(10px); overflow:hidden; display:none; }
  #sugg div { padding:8px 14px; font-size:13.5px; cursor:pointer; }
  #sugg div:hover, #sugg div.on { background:rgba(245,215,142,.14); color:var(--gold); }
  #panel { position:fixed; top:18px; right:20px; width:300px; max-height:calc(100vh - 36px); overflow:auto; background:var(--card); border:1px solid rgba(255,255,255,.12); border-radius:16px; backdrop-filter:blur(12px); padding:20px; z-index:5; display:none; }
  #panel h2 { font-family:'Cormorant Garamond',serif; font-size:34px; font-weight:600; color:var(--gold); line-height:1; }
  #panel .tema { display:inline-block; margin-top:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:3px 10px; }
  #panel h3 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; }
  #panel ul { list-style:none; }
  #panel li button { display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink); font:14px 'Sora',sans-serif; padding:6px 8px; border-radius:8px; cursor:pointer; }
  #panel li button:hover { background:rgba(245,215,142,.12); color:var(--gold); }
  #panel .close { position:absolute; top:12px; right:14px; background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; }
  #panel .close:hover { color:var(--ink); }
  #stats { position:fixed; left:20px; bottom:16px; z-index:5; font-size:12px; color:var(--dim); display:flex; gap:18px; }
  #stats b { color:var(--ink); font-weight:600; }
  #stats .gold { color:var(--gold); }
  #hint { position:fixed; right:20px; bottom:16px; font-size:11.5px; color:var(--dim); z-index:5; }
  @media (max-width:760px){ #panel{ width:calc(100vw - 40px); } #hud h1{font-size:24px;} }
</style>
</head>
<body>
<div id="hud">
  <h1>O universo<br>das <em>palavras</em></h1>
  <p class="sub">Cada ponto é uma palavra; cada fio, um laço que o dicionário conhece. Procure, toque, siga o fio.</p>
  <div id="searchwrap">
    <input id="search" type="text" placeholder="Buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="sugg"></div>
  </div>
</div>
<div id="panel">
  <button class="close" aria-label="fechar">✕</button>
  <h2 id="p-word"></h2>
  <span class="tema" id="p-tema"></span>
  <h3>Sinônimos</h3><ul id="p-sin"></ul>
  <h3>Palavras análogas</h3><ul id="p-an"></ul>
</div>
<div id="labels"></div>
<div id="stats"></div>
<div id="hint">arraste para orbitar · roda para aproximar · clique numa palavra</div>

// halo for selected
const halo = new THREE.Mesh(new THREE.SphereGeometry(3.4, 24, 24),
  new THREE.MeshBasicMaterial({color:0xf5d78e, transparent:true, opacity:.35}));
halo.visible = false; scene.add(halo);

function writeEdges(hi){
  for (let k=0;k<E.length;k++){
    const [a,b] = E[k], i = idx[a], j = idx[b];
    epos.set([P[i*3],P[i*3+1],P[i*3+2],P[j*3],P[j*3+1],P[j*3+2]], k*6);
    const on = hi && (a===hi || b===hi);
    col.set(on ? 0xf5d78e : 0x2a3352);
    ecol.set([col.r,col.g,col.b,col.r,col.g,col.b], k*6);
  }
  eGeo.attributes.position.needsUpdate = true;
  eGeo.attributes.color.needsUpdate = true;
}
function writeNodes(hi){
  for (let i=0;i<N;i++){
    const w = W[i];
    if (!hi) col.set(C[w]);
    else if (w===hi) col.set(0xf5d78e);
    else if (adj[hi].has(w)) col.set(C[w]);
    else { col.set(C[w]); col.multiplyScalar(.16); }
    ncol[i*3]=col.r; ncol[i*3+1]=col.g; ncol[i*3+2]=col.b;
  }
  nodeGeo.attributes.color.needsUpdate = true;
}

// labels
const labelsEl = document.getElementById('labels');
let labeled = [];
function setLabels(list){
  labelsEl.innerHTML = '';
  labeled = list.map(w=>({w, el:document.createElement('div')}));
  labeled.forEach(o=>{ o.el.className = 'lbl' + (o.w===selected?' sel':''); o.el.textContent = o.w; labelsEl.appendChild(o.el); });
}
function placeLabels(){
  const v = new THREE.Vector3();
  for (const o of labeled){
    const i = idx[o.w];
    v.set(P[i*3],P[i*3+1],P[i*3+2]).project(camera);
    if (v.z > 1){ o.el.style.display='none'; continue; }
    o.el.style.display='block';
    o.el.style.left = ((v.x*.5+.5)*innerWidth)+'px';
    o.el.style.top = ((-v.y*.5+.5)*innerHeight)+'px';
  }
}

// selection + panel
let selected = null;
const $ = id => document.getElementById(id);
function select(w, push=true){
  selected = w;
  writeNodes(w); writeEdges(w);
  const nb = [...adj[w]].sort();
  setLabels([w, ...nb]);
  halo.visible = true;
  const i = idx[w]; halo.position.set(P[i*3],P[i*3+1],P[i*3+2]);
  $('p-word').textContent = w;
  $('p-tema').textContent = T[w] ? 'Tema: ' + T[w] : 'sem tema';
  const sec = DATA.sec[w] || {sinonimos:[], analogas:[]};
  const row = a => a.map(x=>`<li><button data-w="${x}">${x}</button></li>`).join('') || '<li><span style="color:var(--dim);font-size:13px">—</span></li>';
  $('p-sin').innerHTML = row(sec.sinonimos);
  $('p-an').innerHTML = row(sec.analogas);
  $('panel').style.display = 'block';
  if (push) history.replaceState(null,'','?word='+encodeURIComponent(w));
}
function clearSel(){
  selected = null;
  writeNodes(null); writeEdges(null); setLabels([]); halo.visible=false;
  $('panel').style.display='none';
  history.replaceState(null,'',location.pathname);
}
$('panel').addEventListener('click', e=>{
  const b = e.target.closest('button[data-w]');
  if (b) select(b.dataset.w);
  else if (e.target.classList.contains('close')) clearSel();
});

// search
const search = $('search'), sugg = $('sugg');
let matches = [], mIdx = -1;
function renderSugg(){
  sugg.innerHTML = matches.map((w,i)=>`<div data-w="${w}" class="${i===mIdx?'on':''}">${w}</div>`).join('');
  sugg.style.display = matches.length ? 'block' : 'none';
}
search.addEventListener('input', ()=>{
  const q = norm(search.value.trim());
  matches = q ? W.filter(w=>norm(w).startsWith(q)).slice(0,9) : [];
  mIdx = -1; renderSugg();
});
search.addEventListener('keydown', e=>{
  if (e.key==='ArrowDown'){ mIdx=Math.min(mIdx+1,matches.length-1); renderSugg(); }
  else if (e.key==='ArrowUp'){ mIdx=Math.max(mIdx-1,0); renderSugg(); }
  else if (e.key==='Enter'){ if (matches[mIdx]!==undefined) select(matches[mIdx]); else if (matches.length) select(matches[0]); search.blur(); }
  else if (e.key==='Escape'){ matches=[]; renderSugg(); }
});
sugg.addEventListener('mousedown', e=>{
  const d = e.target.closest('div[data-w]');
  if (d){ select(d.dataset.w); search.value=''; matches=[]; renderSugg(); search.blur(); }
});

// orbit controls (manual)
let theta=.6, phi=1.25, radius=170, dragging=false, lx=0, ly=0, moved=0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e=>{ dragging=true; moved=0; lx=e.clientX; ly=e.clientY; });
addEventListener('pointerup', e=>{
  dragging=false;
  if (moved < 6) pick(e);
});
addEventListener('pointermove', e=>{
  if (!dragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
  theta -= dx*.005; phi = Math.min(Math.max(phi - dy*.005, .15), Math.PI-.15);
});
el.addEventListener('wheel', e=>{ e.preventDefault(); radius = Math.min(Math.max(radius*(1+e.deltaY*.001), 40), 420); }, {passive:false});
const ray = new THREE.Raycaster(); ray.params.Points.threshold = 3;
function pick(e){
  const r = el.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1), camera);
  const hit = ray.intersectObject(nodes)[0];
  if (hit && hit.index!==undefined) select(W[hit.index]);
}

// stats
$('stats').innerHTML =
  `<span><b>${DATA.stats.words}</b> palavras</span>` +
  `<span><b>${DATA.stats.relations}</b> laços</span>` +
  `<span>mais conectada: <b class="gold">${DATA.stats.most_connected}</b> (${DATA.deg[DATA.stats.most_connected]})</span>`;

// deep link ?word=
const q = new URLSearchParams(location.search).get('word');
if (q){
  const nq = norm(q);
  const hit = W.find(w=>norm(w)===nq) || W.find(w=>norm(w).startsWith(nq));
  if (hit) select(hit, false);
}

writeNodes(null); writeEdges(null);
let t0 = performance.now();
function frame(){
  requestAnimationFrame(frame);
  if (!dragging) theta += .0006;
  camera.position.setFromSphericalCoords(radius, phi, theta);
  camera.lookAt(0,0,0);
  halo.scale.setScalar(1 + Math.sin((performance.now()-t0)*.004)*.12);
  renderer.render(scene, camera);
  placeLabels();
}
frame();
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
