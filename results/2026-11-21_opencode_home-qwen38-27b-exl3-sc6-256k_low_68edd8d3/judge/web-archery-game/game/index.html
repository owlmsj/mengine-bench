<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCHER '95</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#14162b;overflow:hidden;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{box-shadow:0 0 0 4px #0b0d1c,0 24px 60px rgba(0,0,0,.6);cursor:crosshair}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<script>
"use strict";
// ============================== setup ==============================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = H - 56;
const TARGET = 150, MAX_ARROWS = 10, GRAV = 1050;
const FONT = '"Press Start 2P", monospace';
const ARCHER = { x: 130, y: GROUND };

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.96;
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ============================== audio ==============================
let AC = null;
function audio(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function env(g, t0, a, d, v){
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(v, t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
}
function tone(o){
  const f = o.f || 440, dur = o.dur || 0.1, vol = o.vol || 0.2, delay = o.delay || 0;
  const ac = audio(), t0 = ac.currentTime + delay;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
  env(g, t0, 0.005, dur, vol);
  osc.connect(g).connect(ac.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function noise(o){
  const dur = o.dur || 0.08, vol = o.vol || 0.2, delay = o.delay || 0;
  const ac = audio(), t0 = ac.currentTime + delay;
  const len = Math.max(1, (ac.sampleRate * dur) | 0);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const flt = ac.createBiquadFilter();
  flt.type = 'bandpass'; flt.frequency.setValueAtTime(o.f || 1000, t0); flt.Q.value = o.q || 1;
  if(o.f2) flt.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
  const g = ac.createGain(); env(g, t0, 0.003, dur, vol);
  src.connect(flt).connect(g).connect(ac.destination);
  src.start(t0); src.stop(t0 + dur + 0.05);
}
const sfx = {
  click(){ tone({ f: 880, type: 'square', dur: 0.06, vol: 0.12 }); },
  pop(){ tone({ f: 520 + Math.random() * 160, f2: 120, dur: 0.09, vol: 0.5 }); noise({ dur: 0.04, vol: 0.25, f: 2500, q: 0.8 }); },
  thwip(){ noise({ dur: 0.14, vol: 0.3, f: 2400, f2: 300, q: 1.2 }); },
  thud(){ tone({ f: 130, f2: 55, dur: 0.16, vol: 0.2 }); noise({ dur: 0.05, vol: 0.1, f: 300, q: 0.7 }); },
  whoosh(){ noise({ dur: 0.25, vol: 0.07, f: 800, f2: 200, q: 0.6 }); },
  combo(n){ tone({ f: 660 + n * 110, type: 'square', dur: 0.07, vol: 0.1 }); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => tone({ f, type: 'square', dur: 0.14, vol: 0.14, delay: i * 0.13 })); },
  lose(){ [392, 330, 262, 196].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.2, vol: 0.16, delay: i * 0.16 })); },
};
let drawOsc = null, drawGain = null;
function drawSoundStart(){
  const ac = audio();
  drawOsc = ac.createOscillator(); drawOsc.type = 'sawtooth'; drawOsc.frequency.value = 70;
  const flt = ac.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 500;
  drawGain = ac.createGain(); drawGain.gain.value = 0;
  drawOsc.connect(flt).connect(drawGain).connect(ac.destination);
  drawOsc.start();
}
function drawSoundUpdate(pw){
  if(drawOsc){ drawOsc.frequency.value = 70 + pw * 160; drawGain.gain.value = 0.03 + pw * 0.04; }
}
function drawSoundStop(){
  if(drawOsc){ try { drawGain.gain.value = 0; drawOsc.stop(); } catch(e){} drawOsc = null; drawGain = null; }
}

// ============================== state ==============================
const S = {
  mode: 'menu', // menu | play | over | win
  score: 0, arrows: MAX_ARROWS,
  balloons: [], arrowsF: [], parts: [], texts: [],
  mouse: { x: W * 0.7, y: H * 0.4 },
  drawing: false, drawT: 0,
  spawnT: 0.4, shake: 0, freeze: 0, combo: 0, lastHit: -9, t: 0,
};

function aimAngle(){
  const px = ARCHER.x, py = ARCHER.y - 64;
  let a = Math.atan2(S.mouse.y - py, S.mouse.x - px);
  const min = -1.45, max = 0.45;
  if(a < min) a = min;
  if(a > max) a = max;
  return a;
}
function power(){
  const p = (S.drawT * 0.85) % 2;
  return p < 1 ? p : 2 - p;
}
function launchSpeed(){ return 480 + power() * 950; }

function reset(){
  S.score = 0; S.arrows = MAX_ARROWS;
  S.balloons = []; S.arrowsF = []; S.parts = []; S.texts = [];
  S.drawing = false; S.drawT = 0; S.spawnT = 0.4;
  S.combo = 0; S.lastHit = -9; S.freeze = 0; S.shake = 0;
  drawSoundStop();
}

function spawnBalloon(){
  const r = Math.random();
  let t;
  if(r < 0.55)      t = { color: '#ff4757', pts: 10, r: 26, sp: [55, 105] };
  else if(r < 0.85) t = { color: '#ffd32a', pts: 20, r: 21, sp: [105, 165] };
  else              t = { color: '#ff9f1a', pts: 50, r: 15, sp: [165, 235] };
  const by = 90 + Math.random() * (GROUND - 175);
  S.balloons.push({
    x: W + 40, by, y: by, r: t.r, color: t.color, pts: t.pts,
    vx: -(t.sp[0] + Math.random() * (t.sp[1] - t.sp[0])),
    ph: Math.random() * 6.28, wsp: 1.5 + Math.random() * 2, wamp: 8 + Math.random() * 14,
  });
}

function shoot(){
  const a = aimAngle(), pw = power(), sp = 480 + pw * 950;
  const sh = { x: ARCHER.x, y: ARCHER.y - 64 };
  const B = { x: sh.x + Math.cos(a) * 40, y: sh.y + Math.sin(a) * 40 };
  const N = { x: B.x - Math.cos(a) * (10 + pw * 26), y: B.y - Math.sin(a) * (10 + pw * 26) };
  S.arrowsF.push({ x: N.x + Math.cos(a) * 34, y: N.y + Math.sin(a) * 34, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dead: false });
  S.arrows--;
  sfx.thwip();
  S.shake = Math.max(S.shake, 0.12);
}

function pop(b){
  S.combo = (S.t - S.lastHit < 2.5) ? S.combo + 1 : 1;
  S.lastHit = S.t;
  const mult = Math.min(S.combo, 3);
  const pts = b.pts * mult;
  S.score += pts;
  sfx.pop();
  if(mult > 1) sfx.combo(mult);
  S.freeze = 0.045;
  S.shake = Math.max(S.shake, 0.22);
  S.texts.push({ x: b.x, y: b.y - 24, text: '+' + pts + (mult > 1 ? ' x' + mult : ''), life: 0.9, color: '#fff' });
  for(let i = 0; i < 14; i++){
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
    S.parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.5 + Math.random() * 0.4, color: Math.random() < 0.7 ? b.color : '#fff', size: 2 + Math.random() * 4 });
  }
}

function dust(x, y){
  for(let i = 0; i < 8; i++){
    S.parts.push({ x, y, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 120, life: 0.4 + Math.random() * 0.3, color: '#b8a06a', size: 2 + Math.random() * 3 });
  }
}

function confetti(){
  const cols = ['#ff4757', '#ffd32a', '#2ecc71', '#74b9ff', '#a29bfe'];
  for(let i = 0; i < 80; i++){
    S.parts.push({ x: Math.random() * W, y: -10 - Math.random() * 120, vx: (Math.random() - 0.5) * 80, vy: 60 + Math.random() * 120, life: 2 + Math.random() * 2, color: cols[i % 5], size: 3 + Math.random() * 4 });
  }
}

function endGame(win){
  S.mode = win ? 'win' : 'over';
  S.drawing = false;
  drawSoundStop();
  if(win){ sfx.win(); confetti(); } else sfx.lose();
}

// ============================== update ==============================
function update(dt){
  S.t += dt;
  if(S.freeze > 0){ S.freeze -= dt; return; }
  // particles + floating texts always animate
  for(const p of S.parts){ p.vy += GRAV * 0.35 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  S.parts = S.parts.filter(p => p.life > 0);
  for(const t of S.texts){ t.y -= 34 * dt; t.life -= dt; }
  S.texts = S.texts.filter(t => t.life > 0);
  S.shake = Math.max(0, S.shake - dt * 3);

  if(S.mode !== 'play' && S.mode !== 'menu') return;

  // balloons drift in menu and play
  S.spawnT -= dt;
  if(S.spawnT <= 0 && S.balloons.length < 8){
    S.spawnT = 0.7 + Math.random() * 0.9;
    spawnBalloon();
  }
  for(const b of S.balloons){
    b.x += b.vx * dt;
    b.ph += b.wsp * dt;
    b.y = b.by + Math.sin(b.ph) * b.wamp;
  }
  S.balloons = S.balloons.filter(b => b.x > -60);

  if(S.mode !== 'play') return;

  if(S.drawing){ S.drawT += dt; drawSoundUpdate(power()); }

  // arrows (substepped so fast shots can't tunnel through small balloons)
  for(const ar of S.arrowsF){
    if(ar.dead) continue;
    const steps = 3;
    for(let s = 0; s < steps && !ar.dead; s++){
      ar.vy += GRAV * dt / steps;
      ar.x += ar.vx * dt / steps;
      ar.y += ar.vy * dt / steps;
      if(ar.y > GROUND - 2){ ar.dead = true; sfx.thud(); dust(ar.x, GROUND); continue; }
      if(ar.x > W + 40 || ar.x < -40 || ar.y > H + 40){ ar.dead = true; sfx.whoosh(); continue; }
      for(const b of S.balloons){
        if(b.dead) continue;
        const dx = ar.x - b.x, dy = ar.y - b.y;
        if(dx * dx + dy * dy < (b.r + 5) * (b.r + 5)){ b.dead = true; ar.dead = true; pop(b); break; }
      }
    }
  }
  S.arrowsF = S.arrowsF.filter(a => !a.dead);
  S.balloons = S.balloons.filter(b => !b.dead);

  if(S.score >= TARGET) endGame(true);
  else if(S.arrows <= 0 && S.arrowsF.length === 0) endGame(false);
}

// ============================== drawing ==============================
function panel(x, y, w, h){
  ctx.fillStyle = 'rgba(16,18,35,0.72)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}
function cloud(x, y, s){
  ctx.beginPath();
  ctx.ellipse(x, y, 34 * s, 16 * s, 0, 0, 7);
  ctx.ellipse(x + 26 * s, y - 8 * s, 24 * s, 14 * s, 0, 0, 7);
  ctx.ellipse(x - 26 * s, y - 4 * s, 20 * s, 12 * s, 0, 0, 7);
  ctx.fill();
}
function cloudX(base, speed){
  const m = W + 260;
  return (((base - S.t * speed) % m) + m) % m - 130;
}
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#69b7ea');
  g.addColorStop(1, '#cdeffd');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, GROUND);
  ctx.fillStyle = 'rgba(255,243,176,0.35)';
  ctx.beginPath(); ctx.arc(W - 90, 80, 46, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.arc(W - 90, 80, 34, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  cloud(cloudX(100, 9), 90, 1);
  cloud(cloudX(500, 6), 150, 0.7);
  cloud(cloudX(820, 12), 60, 1.2);
}
function drawGround(){
  ctx.fillStyle = '#5cb85c';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#3f9b3f';
  ctx.fillRect(0, GROUND, W, 6);
  ctx.fillStyle = '#4aa84a';
  for(let i = 0; i < 24; i++){
    const x = (i * 47 + 20) % W;
    ctx.beginPath();
    ctx.moveTo(x, GROUND + 2); ctx.lineTo(x + 4, GROUND - 8); ctx.lineTo(x + 8, GROUND + 2);
    ctx.closePath(); ctx.fill();
  }
}
function drawBalloon(b){
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(Math.sin(b.ph) * 0.12);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, b.r + 4);
  ctx.quadraticCurveTo(4, b.r + 18, -2, b.r + 30);
  ctx.stroke();
  ctx.fillStyle = b.color;
  ctx.beginPath(); ctx.ellipse(0, 0, b.r * 0.82, b.r, 0, 0, 7); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-4, b.r - 1); ctx.lineTo(4, b.r - 1); ctx.lineTo(0, b.r + 5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-b.r * 0.3, -b.r * 0.35, b.r * 0.22, b.r * 0.34, -0.5, 0, 7); ctx.fill();
  ctx.restore();
}
function drawArrow(x, y, a){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  ctx.strokeStyle = '#8d5524';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-5, 0); ctx.stroke();
  ctx.fillStyle = '#cfd6dd';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-37, -5); ctx.lineTo(-27, -1); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(-37, 5); ctx.lineTo(-27, 1); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawArcher(){
  const a = aimAngle();
  const px = ARCHER.x, py = ARCHER.y;
  const sh = { x: px, y: py - 64 };
  const pw = S.drawing ? power() : 0;
  const B = { x: sh.x + Math.cos(a) * 40, y: sh.y + Math.sin(a) * 40 };
  const N = { x: B.x - Math.cos(a) * (10 + pw * 26), y: B.y - Math.sin(a) * (10 + pw * 26) };
  // legs
  ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(px, py - 38); ctx.lineTo(px - 10, py);
  ctx.moveTo(px, py - 38); ctx.lineTo(px + 12, py);
  ctx.stroke();
  // torso
  ctx.strokeStyle = '#e17055'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(px, py - 38); ctx.lineTo(sh.x, sh.y); ctx.stroke();
  // head + cap
  ctx.fillStyle = '#ffe0bd';
  ctx.beginPath(); ctx.arc(px + 4, py - 80, 11, 0, 7); ctx.fill();
  ctx.fillStyle = '#d63031';
  ctx.beginPath(); ctx.arc(px + 4, py - 82, 11, Math.PI, 0); ctx.fill();
  ctx.fillRect(px + 4, py - 85, 17, 4);
  // back arm to bow grip
  ctx.strokeStyle = '#ffe0bd'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(B.x, B.y); ctx.stroke();
  // bow
  ctx.strokeStyle = '#6d4c1b'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(B.x, B.y, 32, a - 1.15, a + 1.15); ctx.stroke();
  // string
  const t1 = { x: B.x + Math.cos(a - 1.15) * 32, y: B.y + Math.sin(a - 1.15) * 32 };
  const t2 = { x: B.x + Math.cos(a + 1.15) * 32, y: B.y + Math.sin(a + 1.15) * 32 };
  ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(t1.x, t1.y); ctx.lineTo(N.x, N.y); ctx.lineTo(t2.x, t2.y); ctx.stroke();
  // nocked arrow
  if(S.drawing) drawArrow(N.x + Math.cos(a) * 34, N.y + Math.sin(a) * 34, a);
  // front arm to nock
  ctx.strokeStyle = '#ffe0bd'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(N.x, N.y); ctx.stroke();
  // trajectory preview
  if(S.drawing){
    const sp = 480 + pw * 950;
    let sx = N.x + Math.cos(a) * 34, sy = N.y + Math.sin(a) * 34;
    let svx = Math.cos(a) * sp, svy = Math.sin(a) * sp;
    ctx.fillStyle = '#fff';
    for(let i = 0; i < 26; i++){
      const dt = 0.045;
      svy += GRAV * dt; sx += svx * dt; sy += svy * dt;
      if(sy > GROUND) break;
      if(i % 2 === 0){
        ctx.globalAlpha = 0.7 * (1 - i / 26);
        ctx.beginPath(); ctx.arc(sx, sy, 2.5, 0, 7); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
}
function drawHUD(){
  if(S.mode === 'menu') return;
  ctx.textAlign = 'left';
  panel(14, 14, 190, 44);
  ctx.fillStyle = '#fff'; ctx.font = '12px ' + FONT;
  ctx.fillText('SCORE ' + S.score, 26, 34);
  ctx.fillStyle = '#ffd32a'; ctx.font = '9px ' + FONT;
  ctx.fillText('TARGET ' + TARGET, 26, 50);
  // arrows remaining
  const aw = MAX_ARROWS * 22 + 24, ax0 = W - 14 - aw;
  panel(ax0, 14, aw, 44);
  for(let i = 0; i < MAX_ARROWS; i++){
    const x = ax0 + 22 + i * 22, y = 36;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.7);
    ctx.strokeStyle = i < S.arrows ? '#fff' : 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(3, -3); ctx.moveTo(8, 0); ctx.lineTo(3, 3); ctx.stroke();
    ctx.restore();
  }
  // power bar (top center) while drawing
  if(S.drawing){
    const pw = power();
    panel(W / 2 - 100, 14, 200, 44);
    ctx.fillStyle = '#fff'; ctx.font = '8px ' + FONT; ctx.textAlign = 'center';
    ctx.fillText('POWER', W / 2, 30);
    ctx.fillStyle = '#2f3640'; ctx.fillRect(W / 2 - 80, 38, 160, 12);
    const g = ctx.createLinearGradient(W / 2 - 80, 0, W / 2 + 80, 0);
    g.addColorStop(0, '#2ecc71'); g.addColorStop(0.6, '#ffd32a'); g.addColorStop(1, '#e74c3c');
    ctx.fillStyle = g;
    ctx.fillRect(W / 2 - 80, 38, 160 * pw, 12);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.strokeRect(W / 2 - 80, 38, 160, 12);
  }
}
function title(t, x, y, s){
  ctx.font = s + 'px ' + FONT;
  ctx.fillStyle = '#101223'; ctx.fillText(t, x + 3, y + 3);
  ctx.fillStyle = '#fff'; ctx.fillText(t, x, y);
}
function blink(t, x, y, s){
  if(Math.floor(S.t * 2) % 2 === 0){
    ctx.fillStyle = '#ffd32a'; ctx.font = s + 'px ' + FONT;
    ctx.fillText(t, x, y);
  }
}
function drawOverlay(){
  ctx.fillStyle = 'rgba(10,12,24,0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  if(S.mode === 'menu'){
    title("ARCHER '95", W / 2, 170, 34);
    ctx.fillStyle = '#fff'; ctx.font = '11px ' + FONT;
    ctx.fillText('A WIN95-STYLE BALLOON POPPER', W / 2, 222);
    ctx.font = '10px ' + FONT; ctx.fillStyle = '#cfd8e3';
    ctx.fillText('AIM WITH MOUSE - HOLD TO DRAW - RELEASE TO SHOOT', W / 2, 292);
    ctx.fillText('POP ' + TARGET + ' POINTS BEFORE YOUR ' + MAX_ARROWS + ' ARROWS RUN OUT', W / 2, 318);
    ctx.fillText('RED 10  -  YELLOW 20  -  GOLD 50  -  COMBOS x3', W / 2, 344);
    blink('CLICK TO START', W / 2, 400, 16);
  } else if(S.mode === 'over'){
    title('GAME OVER', W / 2, 190, 30);
    ctx.fillStyle = '#fff'; ctx.font = '12px ' + FONT;
    ctx.fillText('SCORE ' + S.score + ' / ' + TARGET, W / 2, 252);
    blink('CLICK TO RETRY', W / 2, 330, 14);
  } else {
    title('LEVEL 1 CLEAR!', W / 2, 190, 26);
    ctx.fillStyle = '#ffd32a'; ctx.font = '12px ' + FONT;
    ctx.fillText('FINAL SCORE ' + S.score, W / 2, 252);
    blink('CLICK TO PLAY AGAIN', W / 2, 330, 14);
  }
}
function render(){
  ctx.save();
  if(S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake * 14, (Math.random() - 0.5) * S.shake * 14);
  drawSky();
  drawGround();
  for(const b of S.balloons) drawBalloon(b);
  for(const ar of S.arrowsF) drawArrow(ar.x, ar.y, Math.atan2(ar.vy, ar.vx));
  drawArcher();
  for(const p of S.parts){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for(const t of S.texts){
    ctx.globalAlpha = Math.min(1, t.life * 2);
    ctx.fillStyle = t.color;
    ctx.font = '10px ' + FONT;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawHUD();
  if(S.mode !== 'play') drawOverlay();
  // retro scanlines
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = '#000';
  for(let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  ctx.globalAlpha = 1;
}

// ============================== input ==============================
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
cv.addEventListener('mousemove', e => { S.mouse = canvasPos(e); });
cv.addEventListener('mousedown', e => {
  if(e.button !== 0) return;
  audio();
  if(S.mode === 'menu' || S.mode === 'over' || S.mode === 'win'){
    sfx.click();
    reset();
    S.mode = 'play';
    return;
  }
  S.drawing = true;
  S.drawT = 0;
  drawSoundStart();
});
addEventListener('mouseup', e => {
  if(e.button !== 0) return;
  if(S.mode === 'play' && S.drawing){
    S.drawing = false;
    drawSoundStop();
    shoot();
  }
});
addEventListener('blur', () => {
  if(S.drawing){ S.drawing = false; drawSoundStop(); }
});
cv.addEventListener('contextmenu', e => e.preventDefault());

// ============================== main loop ==============================
let last = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
