<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Great Wave off Kanagawa — low poly</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9dcbf;}
  canvas{display:block;}
  #cap{position:fixed;left:14px;bottom:12px;font:12px/1.4 "Georgia",serif;
       color:#5a4a2e;letter-spacing:.04em;opacity:.75;pointer-events:none;}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="cap">Kanagawa Oki Nami Ura · Hokusai · low-poly rebuild</div>
<script type="module">
import * as THREE from 'three';

// ---- palette sampled from the print ----
const C = {
  deep:  0x16344f,  // prussian deep blue (wave body)
  mid:   0x2f5d8a,  // mid blue
  light: 0x9cc0dc,  // pale blue (sea)
  foam:  0xf3efe2,  // off-white foam / snow
  boat:  0xd9c39a,  // tan hull
  boatD: 0x27405a,  // dark hull / rowers
  fuji:  0x22384f,  // mountain rock
  sea:   0x7fb0d4,
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9dcbf);
scene.fog = new THREE.Fog(0xe9dcbf, 9, 20);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0.45, 7.4);
camera.lookAt(0, 0.05, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.9));
const sun = new THREE.DirectionalLight(0xfff3dd, 0.85);
sun.position.set(3, 6, 4);
scene.add(sun);

const std = (color, extra={}) =>
  new THREE.MeshStandardMaterial(Object.assign({ color, flatShading:true, roughness:0.9, metalness:0 }, extra));

// ---- sky: soft cream gradient plane behind everything ----
{
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256;
  const g = cv.getContext('2d');
  const grd = g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#f1e7cb'); grd.addColorStop(0.55,'#e9dcbf'); grd.addColorStop(1,'#d6c49c');
  g.fillStyle = grd; g.fillRect(0,0,4,256);
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(46,22),
    new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(cv) }));
  sky.position.set(0,2.5,-7);
  scene.add(sky);
}

// ---- the Great Wave (left) ----
// ---- the Great Wave (left): steep back, crest curling over, claw hooking down ----
const wave = new THREE.Group();
{
  const shape = new THREE.Shape();
  shape.moveTo(-1.3,-1.3);
  shape.lineTo(-1.3,1.1);
  shape.quadraticCurveTo(-1.25,2.1,-0.5,2.25);  // up the back, over the crest
  shape.quadraticCurveTo(0.7,2.2,1.15,1.35);    // crest curls out and down to the right
  shape.quadraticCurveTo(1.3,1.0,0.95,0.8);     // the claw hooks under (concave)
  shape.lineTo(1.25,-1.3);                      // front face drops to the right
  shape.lineTo(-1.3,-1.3);
  const geo = new THREE.ExtrudeGeometry(shape,{ depth:2.0, bevelEnabled:false, steps:1, curveSegments:32 });
  geo.translate(0,0,-1.0);
  wave.add(new THREE.Mesh(geo, std(C.deep)));

  // thick spiky white foam band hugging the crest (the print's "claws")
  const foamMat = std(C.foam, { roughness:0.8 });
  const cone = new THREE.ConeGeometry(0.16,0.5,5);
  const crest = [];
  for (let i=0;i<=30;i++){
    const t=i/30; let x,y;
    if (t<0.4){ const u=t/0.4; x=-1.3+u*0.8; y=1.1+u*1.15; }                                   // back rise
    else if (t<0.8){ const u=(t-0.4)/0.4; x=-0.5+u*1.65; y=2.25-Math.sin(u*Math.PI*0.5)*0.15; } // crest over + curl
    else { const u=(t-0.8)/0.2; x=1.15-u*0.2; y=1.35-u*0.55; }                                   // claw tip down
    crest.push([x,y]);
  }
  crest.forEach(([x,y])=>{
    const c=new THREE.Mesh(cone,foamMat);
    c.position.set(x, y+0.18, (Math.random()-0.5)*1.9);
    c.rotation.z = x<-0.4 ? -0.5 : (x>0.8 ? 1.2 : 0.2);
    c.rotation.x = (Math.random()-0.5)*0.5;
    c.scale.setScalar(0.8+Math.random()*0.8);
    wave.add(c);
  });
}
wave.position.set(-2.1,0.1,0);
wave.rotation.y = 0.16;
wave.scale.setScalar(1.05);
scene.add(wave);

// ---- secondary wave on the right (as in the print) ----
const wave2 = new THREE.Group();
{
  const shape = new THREE.Shape();
  shape.moveTo(-1.2,-1.0);
  shape.lineTo(-1.2,0.2);
  shape.quadraticCurveTo(-1.0,1.1,-0.1,1.2);
  shape.quadraticCurveTo(0.7,1.15,0.95,0.7);
  shape.lineTo(1.2,-1.0);
  shape.lineTo(-1.2,-1.0);
  const geo = new THREE.ExtrudeGeometry(shape,{ depth:1.6, bevelEnabled:false, steps:1, curveSegments:24 });
  geo.translate(0,0,-0.8);
  wave2.add(new THREE.Mesh(geo, std(C.deep)));
  const foamMat = std(C.foam,{roughness:0.8});
  const cone = new THREE.ConeGeometry(0.11,0.3,5);
  for (let i=0;i<=14;i++){
    const t=i/14; let x,y;
    if (t<0.5){ const u=t/0.5; x=-1.2+u*1.1; y=0.2+u*1.0; }
    else { const u=(t-0.5)/0.5; x=-0.1+u*1.0; y=1.2-u*0.5; }
    const c=new THREE.Mesh(cone,foamMat);
    c.position.set(x,y+0.1,(Math.random()-0.5)*1.5);
    c.rotation.z = x<0 ? -0.4 : 0.4;
    c.scale.setScalar(0.6+Math.random()*0.6);
    wave2.add(c);
  }
}
wave2.position.set(2.3,-0.3,0.4);
wave2.rotation.y = -0.2;
wave2.scale.setScalar(0.9);
scene.add(wave2);

// ---- Mount Fuji (center-right, far) ----
{
  const fuji = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(1.15,1.5,7), std(C.fuji));
  body.position.y = 0.75;                 // base y=0, peak y=1.5
  fuji.add(body);
  const snow = new THREE.Mesh(new THREE.ConeGeometry(0.5,0.66,7), std(C.foam,{roughness:0.8}));
  snow.position.y = 1.18;                 // caps the peak (base ~y0.85, apex ~y1.5)
  fuji.add(snow);
  fuji.position.set(1.35,-0.2,-3.4);
  scene.add(fuji);
}

// ---- boats (three, as in the print) ----
function makeBoat(){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(1.75,0.22,0.5), std(C.boat)));
  const inner = new THREE.Mesh(new THREE.BoxGeometry(1.55,0.12,0.36), std(C.boatD));
  inner.position.y = 0.1;
  g.add(inner);
  const head = std(C.boatD);
  for (let i=0;i<7;i++){
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.06,5,4), head);
    h.position.set(-0.66+i*0.22, 0.17, 0);
    g.add(h);
  }
  return g;
}
const boats = [];
[[ -1.25,-0.55,0.6, 0.3],[ 1.75,-0.28,0.3,-0.4],[ 0.35,-0.88,1.25,0.12 ]].forEach(([x,y,z,ry])=>{
  const b = makeBoat();
  b.position.set(x,y,z); b.rotation.y = ry;
  b.userData.baseY = y; b.userData.phase = boats.length*1.3;
  scene.add(b); boats.push(b);
});

// ---- sea surface (low poly, animated) ----
const seaGeo = new THREE.PlaneGeometry(16,9,28,16);
seaGeo.rotateX(-Math.PI/2);
const seaBase = Float32Array.from(seaGeo.attributes.position.array);
const sea = new THREE.Mesh(seaGeo, std(C.sea,{ roughness:0.7, metalness:0.05 }));
sea.position.y = -1.05;
scene.add(sea);

// ---- gentle motion ----
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  wave.rotation.z = Math.sin(t*0.6)*0.02;
  wave.position.y = 0.2 + Math.sin(t*0.8)*0.05;
  wave2.rotation.z = Math.sin(t*0.6+1)*0.02;
  wave2.position.y = -0.3 + Math.sin(t*0.8+1)*0.05;

  boats.forEach(b=>{
    const p = b.userData.phase;
    b.position.y = b.userData.baseY + Math.sin(t*1.1+p)*0.06;
    b.rotation.z = Math.sin(t*0.9+p)*0.06;
    b.rotation.x = Math.cos(t*0.7+p)*0.04;
  });

  const pos = seaGeo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const x = seaBase[i*3], z = seaBase[i*3+2];
    pos.setY(i, Math.sin(x*0.6+t*0.9)*0.12 + Math.cos(z*0.5+t*0.7)*0.1);
  }
  pos.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
