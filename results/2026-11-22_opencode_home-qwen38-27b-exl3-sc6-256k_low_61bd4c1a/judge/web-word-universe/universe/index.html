<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --ink:#e8ecf7; --dim:#8b93ad; --line:#232c47;
  --panel:rgba(13,18,35,.86); --accent:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:14px/1.5 Inter,system-ui,sans-serif}
#stage,#cv2{position:fixed;inset:0;width:100%;height:100%;display:block}
#stage canvas{display:block}
#cv2[hidden]{display:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:18px;
  padding:16px 20px;pointer-events:none;z-index:5}
.brand h1{font:600 22px Fraunces,serif;margin:0;letter-spacing:.2px}
.brand .sub{margin:2px 0 0;color:var(--dim);font-size:12px}
.search{position:relative;margin-left:auto;pointer-events:auto;width:min(320px,44vw)}
#q{width:100%;padding:10px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font:inherit;outline:none;backdrop-filter:blur(8px)}
#q:focus{border-color:#3d4d80}
#sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;backdrop-filter:blur(8px);display:none}
#sugg button{display:flex;justify-content:space-between;width:100%;padding:8px 14px;border:0;
  background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
#sugg button:hover,#sugg button.on{background:#1a2342}
#sugg .t{color:var(--dim);font-size:11px;margin-left:10px}
#panel{position:fixed;top:84px;right:18px;width:300px;max-height:calc(100% - 150px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
  backdrop-filter:blur(10px);z-index:6}
#panel[hidden]{display:none}
#panel .w{font:600 34px/1.1 Fraunces,serif;margin:0}
#panel .tema{display:inline-block;margin:8px 0 4px;padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
#panel h3{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);
  margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#101731;
  color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:#4a5c9e;background:#182248}
.chip.syn{border-color:#7c5a8f}
#panel .clear{margin-top:14px;color:var(--dim);font-size:12px;cursor:pointer;user-select:none}
#panel .clear:hover{color:var(--ink)}
#foot{position:fixed;left:20px;bottom:16px;z-index:5;color:var(--dim);font-size:12px;
  pointer-events:none}
#foot b{color:var(--ink);font-weight:600}
#foot .hint{margin-top:3px;opacity:.7}
#legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;max-width:420px}
#legend .lg{display:flex;align-items:center;gap:5px;pointer-events:auto;cursor:pointer;
  opacity:.85;font-size:11px}
#legend .lg i{width:9px;height:9px;border-radius:50%;display:inline-block}
#legend .lg.off{opacity:.3}
#tip{position:fixed;z-index:7;pointer-events:none;background:#0d1226;border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;font-size:13px;display:none}
#tip small{color:var(--dim);display:block;font-size:10px}
#fail{position:fixed;inset:auto 0 60px 0;text-align:center;color:var(--dim);font-size:12px;z-index:4}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="cv2" hidden></canvas>
<header id="top">
  <div class="brand">
    <h1>Universo de Palavras</h1>
    <p class="sub">dicionário criativo — cada ponto é uma palavra, cada linha um laço</p>
  </div>
  <div class="search">
    <input id="q" placeholder="buscar palavra…" autocomplete="off" spellcheck="false">
    <div id="sugg"></div>
  </div>
</header>
<aside id="panel" hidden></aside>
<footer id="foot"></footer>
<div id="tip"></div>
<div id="fail" hidden>modo 2D — three.js indisponível</div>

const temaKey = t => t ? (t.normalize ? t : t).replace("familia","familia").replace("ofícios","oficios") : "out";
function tcol(tema){
  const k = norm(tema || "").replace(/ç/g,"c");
  return TCOL[k] || TCOL.out;
}
const deg = {};
for(const w of W) deg[w] = (DATA.rel[w].sinonimos.length + DATA.rel[w].analogas.length || 1);
/* distinct-neighbor count for display */
const neigh = {};
for(const w of W) neigh[w] = new Set([...DATA.rel[w].sinonimos, ...DATA.rel[w].analogas]);
let sel = null;
/* ---------- UI: panel, footer, search ---------- */
const $ = s => document.querySelector(s);
const panel = $("#panel"), tip = $("#tip");
function esc(s){return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function setSel(word, push=true){
  sel = word;
  if(word){
    const r = DATA.rel[word], tc = tcol(DATA.tema[word]);
    panel.innerHTML =
      `<p class="w">${esc(word)}</p>` +
      `<span class="tema" style="background:${tc}22;color:${tc};border:1px solid ${tc}55">${esc(DATA.tema[word]||"sem tema")}</span>` +
      (r.sinonimos.length ? `<h3>Sinônimos</h3><div class="chips">${r.sinonimos.map(x=>`<button class="chip syn" data-w="${esc(x)}">${esc(x)}</button>`).join("")}</div>` : "") +
      (r.analogas.length ? `<h3>Palavras análogas</h3><div class="chips">${r.analogas.map(x=>`<button class="chip" data-w="${esc(x)}">${esc(x)}</button>`).join("")}</div>` : "") +
      `<div class="clear" id="clr">✕ fechar (Esc)</div>`;
    panel.hidden = false;
    panel.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => setSel(b.dataset.w)));
    $("#clr").addEventListener("click", () => setSel(null));
    if(push) history.replaceState(null,"", word ? `?word=${encodeURIComponent(word)}` : location.pathname);
  } else {
    panel.hidden = true;
    if(push) history.replaceState(null,"", location.pathname);
  }
  viewHighlight(word);
}
/* footer stats + legend */
(function(){
  const st = DATA.stats;
  const lg = DATA.temas.map(t =>
    `<span class="lg" data-t="${esc(t)}"><i style="background:${tcol(t)}"></i>${esc(t)}</span>`).join("");
  $("#foot").innerHTML =
    `<div><b>${st.words}</b> palavras · <b>${st.relations}</b> relações · mais conectada: <b>${esc(st.most_connected)}</b> (${neigh[st.most_connected].size} laços)</div>` +
    `<div class="hint">arraste para girar · role para aproximar · clique numa palavra</div><div id="legend">${lg}</div>`;
  $("#legend").querySelectorAll(".lg").forEach(el => el.addEventListener("click", () => {
    el.classList.toggle("off"); viewTheme(el.dataset.t, !el.classList.contains("off"));
  }));
})();
/* search */
const q = $("#q"), sugg = $("#sugg");
let sugItems = [];
q.addEventListener("input", () => {
  const n = norm(q.value);
  if(!n){ sugg.style.display = "none"; return; }
  sugItems = W.filter(w => norm(w).includes(n)).slice(0, 8);
  sugg.innerHTML = sugItems.map((w,i) =>
    `<button data-i="${i}" data-w="${esc(w)}"><span>${esc(w)}</span><span class="t">${esc(DATA.tema[w]||"")}</span></button>`).join("");
  sugg.style.display = sugItems.length ? "block" : "none";
  sugg.querySelectorAll("button").forEach(b => b.addEventListener("mousedown", e => {
    e.preventDefault(); setSel(b.dataset.w); q.value = ""; sugg.style.display = "none";
  }));
});
q.addEventListener("keydown", e => {
  if(e.key === "Enter" && sugItems.length){ setSel(sugItems[0]); q.value=""; sugg.style.display="none"; }
  if(e.key === "Escape"){ sugg.style.display="none"; }
});
q.addEventListener("blur", () => setTimeout(() => sugg.style.display="none", 120));
window.addEventListener("keydown", e => { if(e.key === "Escape") setSel(null); });
/* ---------- view API: viewHighlight(word|null), viewTheme(tema, on) ---------- */
let viewHighlight = () => {}, viewTheme = () => {};
const themeOff = new Set();
async function boot(){
  let THREE = null;
  try { THREE = await import("https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"); } catch(e) {}
  try {
    if(THREE){ init3(THREE); } else { init2(); }
    const urlWord = new URLSearchParams(location.search).get("word");
    const hit = urlWord ? resolve(urlWord) : null;
    if(hit) setSel(hit, false);
  } catch(e){
    const f = $("#fail"); f.hidden = false;
    f.textContent = "erro: " + (e && e.message ? e.message : e) + " | " + (e && e.stack ? e.stack.split("\n").slice(0,4).join(" / ") : "");
  }
}
/* ============ 3D with three.js ============ */
function init3(THREE){
  const stage = $("#stage");
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070b16, 0.0016);
  const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
  const ren = new THREE.WebGLRenderer({antialias:true, alpha:true});
  ren.setPixelRatio(Math.min(devicePixelRatio, 2));
  ren.setSize(innerWidth, innerHeight);
  stage.appendChild(ren.domElement);
  const geo = new THREE.SphereGeometry(1, 14, 14);
  const nodes = W.map((w,i) => {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: tcol(DATA.tema[w]), transparent:true}));
    const d = neigh[w].size;
    m.scale.setScalar(1.1 + Math.min(d,14)*0.16);
    m.position.fromArray(DATA.pos[i]);
    m.userData.w = w;
    scene.add(m);
    return m;
  });
  /* edges */
  const epos = new Float32Array(DATA.edges.length*6), ecol = new Float32Array(DATA.edges.length*6);
  function paintEdges(){
    DATA.edges.forEach((e,k) => {
      const [a,b] = e;
      const on = sel ? (W[a]===sel || W[b]===sel) : true;
      const c = on ? (sel ? 0xbfd0ff : 0x3a4a72) : 0x0d1322;
      for(const [vi,p] of [[k*6, a],[k*6+3, b]]){
        epos[vi]=DATA.pos[p][0]; epos[vi+1]=DATA.pos[p][1]; epos[vi+2]=DATA.pos[p][2];
        ecol[vi]=((c>>16)&255)/255; ecol[vi+1]=((c>>8)&255)/255; ecol[vi+2]=(c&255)/255;
      }
    });
    eg.attributes.position.needsUpdate = true;
    eg.attributes.color.needsUpdate = true;
  }
  const eg = new THREE.BufferGeometry();
  eg.setAttribute("position", new THREE.BufferAttribute(epos,3));
  eg.setAttribute("color", new THREE.BufferAttribute(ecol,3));
  const lines = new THREE.LineSegments(eg, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.6}));
  scene.add(lines);
  paintEdges(null);
  /* labels */
  function makeLabel(text, big){
    const c = document.createElement("canvas");
    const fs = big ? 44 : 26;
    const ctx = c.getContext("2d");
    ctx.font = `600 ${fs}px Fraunces, serif`;
    c.width = Math.ceil(ctx.measureText(text).width) + 24; c.height = fs + 20;
    const g = c.getContext("2d");
    g.font = `600 ${fs}px Fraunces, serif`;
    g.fillStyle = big ? "#fff" : "#cdd6f2";
    g.shadowColor = "rgba(0,0,0,.9)"; g.shadowBlur = 8;
    g.fillText(text, 12, fs + 4);
    const tex = new THREE.CanvasTexture(c);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
    const s = big ? 0.16 : 0.09;
    sp.scale.set(c.width*s/2, c.height*s/2, 1);
    sp.renderOrder = 10;
    return sp;
  }
  let labels = [];
  function showLabels(words){
    labels.forEach(l => scene.remove(l)); labels = [];
    words.forEach((w,i) => {
      const sp = makeLabel(w, w === sel);
      sp.position.copy(nodes[i].position).add(new THREE.Vector3(0, w===sel ? 3.4 : 2.1, 0));
      scene.add(sp); labels.push(sp);
    });
  }
  /* orbit state */
  let theta = 0.6, phi = 1.25, radius = 190, auto = true;
  function orbit(){
    const sp = Math.sin(phi);
    cam.position.set(radius*sp*Math.sin(theta), radius*Math.cos(phi), radius*sp*Math.cos(theta));
    cam.lookAt(0,0,0);
  }
  let drag = null;
  ren.domElement.addEventListener("pointerdown", e => { drag = {x:e.clientX, y:e.clientY, t:theta, p:phi, moved:0}; auto = false; });
  window.addEventListener("pointermove", e => {
    if(!drag) return;
    drag.moved += Math.abs(e.movementX) + Math.abs(e.movementY);
    theta = drag.t + (e.clientX - drag.x) * 0.005;
    phi = Math.min(Math.PI-0.15, Math.max(0.15, drag.p + (e.clientY - drag.y) * 0.005));
    orbit();
  });
  window.addEventListener("pointerup", e => {
    if(drag && drag.moved < 6) pick3(e.clientX, e.clientY);
    drag = null;
  });
  ren.domElement.addEventListener("wheel", e => {
    e.preventDefault();
    radius = Math.min(500, Math.max(35, radius * Math.exp(e.deltaY * 0.0012)));
    orbit();
  }, {passive:false});
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  function pick3(x, y){
    ptr.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
    ray.setFromCamera(ptr, cam);
    const hit = ray.intersectObjects(nodes, false)[0];
    if(hit) setSel(hit.object.userData.w);
  }
  ren.domElement.addEventListener("pointermove", e => {
    if(drag){ tip.style.display="none"; return; }
    ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
    ray.setFromCamera(ptr, cam);
    const hit = ray.intersectObjects(nodes, false)[0];
    if(hit){
      const w = hit.object.userData.w;
      tip.innerHTML = `${esc(w)}<small>${neigh[w].size} laços</small>`;
      tip.style.display = "block";
      tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 10) + "px";
      ren.domElement.style.cursor = "pointer";
    } else { tip.style.display = "none"; ren.domElement.style.cursor = "grab"; }
  });
  function apply(word){
    const act = word ? new Set([word, ...neigh[word]]) : null;
    nodes.forEach((m,i) => {
      const w = W[i];
      m.material.opacity = !act || act.has(w) ? 1 : 0.06;
      const off = themeOff.has(DATA.tema[w]);
      if(off && (!act || !act.has(w))) m.material.opacity = 0.03;
      m.scale.setScalar((1.1 + Math.min(neigh[w].size,14)*0.16) * (w === word ? 1.7 : 1));
      m.material.color.set(w === word ? 0xffffff : tcol(DATA.tema[w]));
    });
    paintEdges(act);
    showLabels(word ? [word, ...neigh[word]] : []);
  }
  viewHighlight = apply;
  viewTheme = (t, on) => { if(on) themeOff.delete(t); else themeOff.add(t); apply(sel); };
  addEventListener("resize", () => {
    cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
    ren.setSize(innerWidth, innerHeight);
  });
  (function loop(){
    requestAnimationFrame(loop);
    if(auto && !sel){ theta += 0.0012; orbit(); }
    ren.render(scene, cam);
  })();
}
/* ============ 2D fallback (sem three.js) ============ */
function init2(){
  $("#fail").hidden = false;
  const cv = $("#cv2"); cv.hidden = false; $("#stage").style.display = "none";
  const ctx = cv.getContext("2d");
  let rotY = 0.6, rotX = 0.4, zoom = 1, cx = 0, cy = 0, drag = null, hoverW = null;
  function fit(){
    const dpr = Math.min(devicePixelRatio, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = innerWidth/2; cy = innerHeight/2;
  }
  fit(); addEventListener("resize", fit);
  const act3 = (p, ry, rx) => {
    let x = p[0]*Math.cos(ry) + p[2]*Math.sin(ry);
    let z = -p[0]*Math.sin(ry) + p[2]*Math.cos(ry);
    let y = p[1]*Math.cos(rx) - z*Math.sin(rx);
    z = p[1]*Math.sin(rx) + z*Math.cos(rx);
    const s = 620*zoom/(z + 320);
    return [cx + x*s, cy - y*s, z];
  };
  function draw(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    const act = sel ? new Set([sel, ...neigh[sel]]) : null;
    const P = W.map((w,i) => act3(DATA.pos[i], rotY, rotX));
    for(const [a,b] of DATA.edges){
      const on = !act || act.has(W[a]) || act.has(W[b]) || (sel && (W[a]===sel || W[b]===sel));
      ctx.strokeStyle = on ? (sel ? "rgba(159,180,255,.8)" : "rgba(70,85,127,.5)") : "rgba(16,22,39,.5)";
      ctx.lineWidth = sel && (W[a]===sel || W[b]===sel) ? 1.4 : 0.7;
      ctx.beginPath(); ctx.moveTo(P[a][0], P[a][1]); ctx.lineTo(P[b][0], P[b][1]); ctx.stroke();
    }
    W.forEach((w,i) => {
      const [x,y,z] = P[i];
      const off = themeOff.has(DATA.tema[w]);
      const dim = act && !act.has(w);
      ctx.globalAlpha = off ? 0.12 : dim ? 0.12 : 1;
      ctx.fillStyle = w === sel ? "#fff" : tcol(DATA.tema[w]);
      ctx.beginPath(); ctx.arc(x, y, (2.4 + Math.min(neigh[w].size,14)*0.3) * (w===sel?1.6:1), 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      if((act && act.has(w)) || w === hoverW){
        ctx.font = w === sel ? "600 20px Fraunces, serif" : "13px Inter, sans-serif";
        ctx.fillStyle = w === sel ? "#fff" : "#cdd6f2";
        ctx.fillText(w, x + 8, y - 8);
      }
    });
  }
  viewHighlight = () => draw();
  viewTheme = (t, on) => { if(on) themeOff.delete(t); else themeOff.add(t); draw(); };
  cv.addEventListener("pointerdown", e => { drag = {x:e.clientX, y:e.clientY, t:rotY, p:rotX}; });
  addEventListener("pointermove", e => {
    if(drag){ rotY = drag.t + (e.clientX-drag.x)*0.006; rotX = Math.min(Math.PI/2, Math.max(0, drag.p + (e.clientY-drag.y)*0.006)); draw(); return; }
    const P = W.map((w,i) => act3(DATA.pos[i], rotY, rotX));
    let best = null, bd = 14;
    P.forEach(([x,y], i) => { const d = Math.hypot(x-e.clientX, y-e.clientY); if(d < bd){ bd = d; best = i; } });
    hoverW = best !== null ? W[best] : null;
    cv.style.cursor = hoverW ? "pointer" : "grab";
    if(hoverW){
      tip.innerHTML = `${esc(hoverW)}<small>${neigh[hoverW].size} laços</small>`;
      tip.style.display = "block"; tip.style.left = (e.clientX+14)+"px"; tip.style.top = (e.clientY+10)+"px";
    } else tip.style.display = "none";
    draw();
  });
  addEventListener("pointerup", e => {
    if(!drag) return;
    const moved = Math.abs(e.clientX-drag.x) + Math.abs(e.clientY-drag.y);
    drag = null;
    if(moved < 6 && hoverW) setSel(hoverW);
  });
  cv.addEventListener("wheel", e => { e.preventDefault(); zoom = Math.min(4, Math.max(0.3, zoom*Math.exp(-e.deltaY*0.001))); draw(); }, {passive:false});
  (function loop(){ requestAnimationFrame(loop); if(!drag && !sel) { rotY += 0.001; draw(); } })();
}
boot();
</script>
