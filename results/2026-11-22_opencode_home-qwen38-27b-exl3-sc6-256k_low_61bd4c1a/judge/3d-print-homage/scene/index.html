<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>神奈川沖浪裏 — low poly 3D wallpaper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #EFE5C9; }
  canvas { display: block; }
  #cartouche {
    position: fixed; top: 24px; left: 30px; display: flex; gap: 7px;
    border: 2px solid #262626; padding: 12px 8px;
    background: rgba(240, 233, 214, 0.85);
    font-family: "Noto Serif JP", serif; color: #1d1d1d;
  }
  #cartouche span { writing-mode: vertical-rl; letter-spacing: 0.35em; }
  #cartouche .t1 { font-size: 15px; font-weight: 700; }
  #cartouche .t2 { font-size: 15px; font-weight: 500; }
  #sig {
    position: fixed; top: 30px; left: 10px; writing-mode: vertical-rl;
    font-family: "Noto Serif JP", serif; font-size: 12px; color: #3a3a3a;
    letter-spacing: 0.3em;
  }
</style>
</head>
<body>
<div id="cartouche"><span class="t1">富嶽三十六景</span><span class="t2">神奈川沖浪裏</span></div>
<div id="sig">勝政画</div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xEFE5C9);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.25, 15);
camera.lookAt(0, 0.05, 0);

scene.add(new THREE.HemisphereLight(0xFFF6E2, 0x2A4A68, 1.05));
const sun = new THREE.DirectionalLight(0xFFF0D2, 0.7);
sun.position.set(5, 7, 9);
scene.add(sun);

const mat = (color, opts = {}) =>
  new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, flatShading: true, ...opts });

/* ---------------- sky (paper cream -> mist grey gradient) ---------------- */
{
  const g = new THREE.PlaneGeometry(48, 24);
  const p = g.attributes.position;
  const col = [];
  const top = new THREE.Color(0xF2E9CF), bot = new THREE.Color(0x948E7E);
  for (let i = 0; i < p.count; i++) {
    const t = THREE.MathUtils.clamp((p.getY(i) + 12) / 24, 0, 1);
    const c = bot.clone().lerp(top, t);
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  const sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true }));
  sky.position.set(0, 0.4, -9.5);
  scene.add(sky);
}

/* ---------------- mist halo behind Fuji ---------------- */
const mistMat = new THREE.MeshBasicMaterial({ color: 0x9A9484, transparent: true, opacity: 0.45 });
const mist = new THREE.Mesh(new THREE.CircleGeometry(4.2, 24), mistMat);
mist.position.set(3.6, 0.1, -8.8);
scene.add(mist);

/* ---------------- Mount Fuji ---------------- */
const fuji = new THREE.Group();
{
  const base = new THREE.Mesh(new THREE.ConeGeometry(1.25, 1.15, 7), mat(0x7E909A));
  base.position.y = 0.575;
  const snow = new THREE.Mesh(new THREE.ConeGeometry(0.78, 0.95, 7), mat(0xFAF7EE));
  snow.position.y = 1.5;
  fuji.add(base, snow);
}
fuji.position.set(3.9, -0.25, -3.6);
fuji.scale.setScalar(1.15);
scene.add(fuji);

/* ---------------- waves ---------------- */
const waveGroup = new THREE.Group();
scene.add(waveGroup);

function tube(points, radius, color, radial = 5, z = 0) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], z)));
  return new THREE.Mesh(new THREE.TubeGeometry(curve, 72, radius, radial, false), mat(color));
}

/* the great wave: rises from lower left, crest curls to the right */
waveGroup.add(tube([
  [-9.2, -3.9], [-7.3, -2.7], [-5.7, -1.3], [-4.3, 0.3], [-2.8, 1.8],
  [-1.3, 2.75], [0.5, 3.05], [1.9, 2.6], [2.4, 1.8], [2.2, 0.9], [1.5, 0.3], [1.05, -0.5]
], 1.05, 0x1E4E74));

/* white foam strip along the crest and lip, sitting on the wave surface */
waveGroup.add(tube([
  [-2.8, 2.9], [-1.3, 3.87], [0.5, 4.17], [1.9, 3.7], [3.48, 1.5], [3.2, 0.65], [2.35, 0.15], [1.6, -0.35]
], 0.34, 0xF2ECDA));

/* foam "claws" jutting out of the crest */
const clawSpec = [
  [0.5, 4.45, 0.0], [1.8, 4.0, -0.7], [3.05, 3.1, -1.15],
  [3.95, 2.0, -1.5], [3.8, 0.95, -1.85], [3.1, -0.1, -2.1]
];
const clawGeo = new THREE.ConeGeometry(0.2, 0.7, 5);
const clawMat = mat(0xF2ECDA);
for (const [x, y, rz] of clawSpec) {
  const c = new THREE.Mesh(clawGeo, clawMat);
  c.position.set(x, y, 0);
  c.rotation.z = rz;
  waveGroup.add(c);
}

/* right wave: pale blue, descending from the upper right */
waveGroup.add(tube([
  [8.6, 2.6], [6.9, 1.5], [5.25, 0.35], [4.35, -0.85], [3.75, -2.1], [3.6, -4.0]
], 1.0, 0x38617F));
waveGroup.add(tube([
  [8.0, 2.85], [6.4, 1.7], [4.7, 0.65], [3.85, -0.45]
], 0.26, 0xF2ECDA));

/* foreground wave: white foam crest at bottom center */
waveGroup.add(tube([
  [-9.4, -3.4], [-7.6, -2.5], [-5.6, -1.95], [-3.4, -1.8], [-1.1, -1.95], [0.6, -2.5], [2.2, -4.3]
], 1.3, 0xF1EBDA));
/* blue band running along the white crest, in front of the foam face */
waveGroup.add(tube([
  [-8.8, -0.9], [-6.2, -0.5], [-3.8, -0.55], [-1.4, -0.8], [0.6, -1.3]
], 0.55, 0x2A5876, 5, 0.5));

/* dark water band filling the bottom of the frame */
{
  const sea = new THREE.Mesh(new THREE.BoxGeometry(34, 2.6, 2.4), mat(0x244F6E));
  sea.position.set(0, -5.0, 0.3);
  waveGroup.add(sea);
}

/* ---------------- foam dots ---------------- */
const dots = [];
function dotCluster(center, rBig, count, color, size, dMin, dMax, aMin, aMax) {
  const geo = new THREE.IcosahedronGeometry(size, 0);
  const m = mat(color);
  for (let i = 0; i < count; i++) {
    const d = dMin + ((i * 37) % 100) / 100 * (dMax - dMin);
    const a = aMin + (i / count) * (aMax - aMin);
    const x = center[0] + Math.cos(a) * d;
    const y = center[1] + Math.sin(a) * d;
    const z = Math.sqrt(Math.max(rBig * rBig - d * d, 0)) + 0.12;
    const m2 = new THREE.Mesh(geo, m);
    m2.position.set(x, y, z);
    m2.scale.setScalar(0.7 + ((i * 53) % 10) / 10 * 0.6);
    waveGroup.add(m2);
    dots.push(m2);
  }
}
/* white dot spirals on the great wave's inner face */
dotCluster([1.35, 1.7], 1.05, 16, 0xF2ECDA, 0.075, 0.3, 0.95, 0.35, 1.93);
dotCluster([-3.6, 0.9], 1.05, 9, 0xF2ECDA, 0.07, 0.25, 0.9, 0.5, 2.4);
/* white dots on the right wave */
dotCluster([4.6, 0.5], 1.0, 8, 0xF2ECDA, 0.07, 0.3, 0.8, 0.6, 2.6);
/* small blue accents on the white foreground crest */
for (let i = 0; i < 6; i++) {
  const d = 0.5 + (i / 5) * 0.55;
  const x = -5.2 + i * 0.75;
  const yc = [-1.95, -1.95, -1.8, -1.95, -2.0, -2.2][i];
  const m2 = new THREE.Mesh(new THREE.IcosahedronGeometry(0.06, 0), mat(0x2A5876));
  m2.position.set(x, yc + d, Math.sqrt(Math.max(1.69 - d * d, 0)) + 0.1);
  waveGroup.add(m2);
  dots.push(m2);
}

/* ---------------- fishing boats ---------------- */
function makeBoat(scale) {
  const g = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(-1.05, 0.2);
  s.quadraticCurveTo(-0.5, -0.05, 0, -0.07);
  s.quadraticCurveTo(0.55, -0.05, 1.05, 0.18);
  s.quadraticCurveTo(0.55, -0.33, 0, -0.35);
  s.quadraticCurveTo(-0.55, -0.33, -1.05, 0.2);
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.26, bevelEnabled: false });
  geo.translate(0, 0, -0.13);
  g.add(new THREE.Mesh(geo, mat(0xC08A52)));
  const trim = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.04, 0.3), mat(0x2E2A24));
  trim.position.y = -0.1;
  g.add(trim);
  for (let i = 0; i < 5; i++) {
    const r = new THREE.Mesh(new THREE.SphereGeometry(0.075, 6, 5), mat(0xF4EFE2));
    r.position.set(-0.6 + i * 0.3, 0.12, 0);
    g.add(r);
  }
  g.scale.setScalar(scale);
  return g;
}

const boats = [];
function addBoat(scale, x, y, z, rotZ) {
  const b = makeBoat(scale);
  b.position.set(x, y, z);
  b.rotation.z = rotZ;
  waveGroup.add(b);
  boats.push({ mesh: b, rot: rotZ, y, phase: boats.length * 1.9 });
}
/* left boat, tucked in the trough under the great wave */
addBoat(1.2, -5.1, -1.35, 1.3, 0.3);
/* center boat, the long one with rowers, riding the white crest */
addBoat(1.5, -1.35, -0.35, 1.45, -0.12);
/* right boat on the descending right wave */
addBoat(1.15, 5.0, 0.45, 1.2, 0.5);

/* ---------------- gentle motion ---------------- */
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  waveGroup.position.y = Math.sin(t * 0.5) * 0.06;
  waveGroup.rotation.z = Math.sin(t * 0.33) * 0.012;
  for (const b of boats) {
    b.mesh.rotation.z = b.rot + Math.sin(t * 0.9 + b.phase) * 0.05;
    b.mesh.position.y = b.y + Math.sin(t * 1.1 + b.phase) * 0.05;
  }
  dots.forEach((d, i) => d.scale.multiplyScalar(1 + 0.001 * Math.sin(t * 1.3 + i)));
  mistMat.opacity = 0.5 + 0.08 * Math.sin(t * 0.4);
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
