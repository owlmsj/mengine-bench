<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under the Wave off Kanagawa · low-poly homage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9dcbc; }
  #c { display: block; width: 100%; height: 100%; }
  .cartouche {
    position: fixed; top: 26px; left: 28px; z-index: 2;
    writing-mode: vertical-rl; font-family: 'Shippori Mincho', serif;
    color: #16304f; letter-spacing: .18em; font-size: 21px; font-weight: 700;
    border: 2px solid #16304f; padding: 10px 6px; background: rgba(242,236,217,.55);
  }
  .seal {
    position: fixed; top: 30px; left: 78px; z-index: 2;
    writing-mode: vertical-rl; font-family: 'Shippori Mincho', serif;
    color: #f2ecd9; background: #a63a2e; font-size: 13px;
    padding: 6px 3px; letter-spacing: .12em;
  }
  .caption {
    position: fixed; right: 22px; bottom: 16px; z-index: 2;
    font-family: 'Shippori Mincho', serif; color: #16304f;
    font-size: 12.5px; letter-spacing: .08em; opacity: .8; text-align: right;
  }
</style>
</head>
<body>
<div class="cartouche">冨嶽三十六景 神奈川沖浪裏</div>
<div class="seal">北斎</div>
<div class="caption">Under the Wave off Kanagawa · after Hokusai · rebuilt in low poly</div>
<canvas id="c"></canvas>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// Palette lifted from the print
const P = {
  paper:   0xe9dcbc, grey:   0x8f9aa3, deep:   0x123a70, darker: 0x0a2a52,
  mid:     0x2f6396, pale:   0x7fa8c9, foam:   0xf2ecd9, wood:   0xd9b382,
  woodDk:  0x8a6a44, fuji:   0x3a5f8a, ink:    0x16304f
};

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(P.paper);
scene.fog = new THREE.Fog(P.paper, 105, 215);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
camera.position.set(4, 11, 38);
camera.lookAt(-2, 6, -18);

scene.add(new THREE.HemisphereLight(0xf5ecd4, 0x2f6396, 1.05));
const sun = new THREE.DirectionalLight(0xfff4dd, 1.1);
sun.position.set(-30, 50, 30);
scene.add(sun);

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// Height field: calm far sea, swell ridges, the great wave left, shoulder bump
function seaHeight(x, z, t) {
  const near = smooth(-72, -42, z);
  let h = 0.35 * Math.sin(0.05 * x + 0.12 * t);
  h += near * (1.15 * Math.sin(0.16 * x + 0.20 * z + 0.8 * t)
             + 0.80 * Math.sin(0.10 * x - 0.14 * z + 0.6 * t)
             + 0.55 * Math.sin(0.26 * z - 0.07 * x + 1.1 * t));
  h += smooth(8, 40, z) * 1.5 * Math.sin(0.2 * x + 0.3 * z + 1.2 * t);
  // right ridge sloping up to the right, as in the print
  const rd = z - (-2 + 0.28 * (x - 14));
  h += Math.exp(-(rd * rd) / 34) * (2.4 + 3.2 * smooth(-6, 42, x));
  // the great wave: steep face toward camera-right
  const gx = x + 22, gz = z + 4, sx = (x > -22) ? 6.0 : 10.5;
  const g = Math.exp(-((gx * gx) / (2 * sx * sx) + (gz * gz) / 84));
  h += 16.5 * g + g * 1.7 * Math.sin(2.4 * x + 1.8 * z + 0.5 * t); // ribbed face
  // shoulder swell in front of it
  const ax = x + 13, az = z - 3;
  h += 7.0 * Math.exp(-((ax * ax) / 66 + (az * az) / 66));
  return h;
}

// ---- Sea ----
const SEG_X = 150, SEG_Z = 92, W = 180, D = 122, Z0 = -77;
const seaGeo = new THREE.PlaneGeometry(W, D, SEG_X, SEG_Z);
seaGeo.rotateX(-Math.PI / 2);
const pos = seaGeo.attributes.position;
const colors = new Float32Array(pos.count * 3);
seaGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const sea = new THREE.Mesh(seaGeo, new THREE.MeshBasicMaterial({ vertexColors: true }));
scene.add(sea);

const cDeep = new THREE.Color(P.darker), cMid = new THREE.Color(P.mid),
      cPale = new THREE.Color(P.pale), cFoam = new THREE.Color(P.foam),
      cInk = new THREE.Color(P.deep), tmp = new THREE.Color();

function paintSea(t) {
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const h = seaHeight(x, z, t);
    pos.setY(i, h);
    // slope from neighbours of the height field
    const hx = seaHeight(x + 1.2, z, t) - seaHeight(x - 1.2, z, t);
    const hz = seaHeight(x, z + 1.2, t) - seaHeight(x, z - 1.2, t);
    const slope = Math.sqrt(hx * hx + hz * hz) / 2.4;
    const far = smooth(-72, -46, z);
    tmp.copy(cDeep).lerp(cInk, smooth(0.5, 3.5, h));
    tmp.lerp(cMid, (0.5 + 0.5 * Math.sin(h * 3.0)) * 0.3 * far); // banded blues
    tmp.lerp(cPale, smooth(0.7, 1.2, slope) * 0.75);
    tmp.lerp(cFoam, Math.min(1, smooth(0.95, 1.5, slope) + smooth(10.5, 13.5, h)));
    // far sea reads as the print's dark band
    tmp.lerp(cInk, (1 - far) * 0.55);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  pos.needsUpdate = true;
  seaGeo.attributes.color.needsUpdate = true;
  seaGeo.computeVertexNormals();
}

// ---- Sky backdrop with the print's grey horizon wash ----
const skyGeo = new THREE.PlaneGeometry(360, 170, 1, 6);
{
  const sp = skyGeo.attributes.position, sc = new Float32Array(sp.count * 3);
  const top = new THREE.Color(P.paper), bot = new THREE.Color(P.grey);
  for (let i = 0; i < sp.count; i++) {
    const k = smooth(-85, -18, sp.getY(i));
    tmp.copy(bot).lerp(top, k * 0.92);
    sc[i * 3] = tmp.r; sc[i * 3 + 1] = tmp.g; sc[i * 3 + 2] = tmp.b;
  }
  skyGeo.setAttribute('color', new THREE.BufferAttribute(sc, 3));
}
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, fog: false }));
sky.position.set(0, 45, -150);
scene.add(sky);

// soft paper clouds
const cloudMat = new THREE.MeshBasicMaterial({ color: 0xf3ead2, fog: false, transparent: true, opacity: 0.8 });
for (const [cx, cy, s] of [[-55, 78, 1.4], [40, 88, 1.8], [10, 66, 1.0]]) {
  const cl = new THREE.Mesh(new THREE.SphereGeometry(9 * s, 6, 4), cloudMat);
  cl.scale.set(2.6, 0.5, 1); cl.position.set(cx, cy, -148);
  scene.add(cl);
}

// ---- Mount Fuji ----
const fuji = new THREE.Group();
const fGeo = new THREE.ConeGeometry(7.5, 8.5, 8, 3);
{
  const fp = fGeo.attributes.position, fc = new Float32Array(fp.count * 3);
  const rock = new THREE.Color(P.fuji), snow = new THREE.Color(P.foam);
  for (let i = 0; i < fp.count; i++) {
    const y = fp.getY(i);
    const jag = 0.6 * Math.sin(fp.getX(i) * 2.1) + 0.5 * Math.sin(fp.getZ(i) * 2.7);
    tmp.copy(rock).lerp(snow, smooth(1.6 + jag, 3.0 + jag, y));
    fc[i * 3] = tmp.r; fc[i * 3 + 1] = tmp.g; fc[i * 3 + 2] = tmp.b;
  }
  fGeo.setAttribute('color', new THREE.BufferAttribute(fc, 3));
}
fuji.add(new THREE.Mesh(fGeo, new THREE.MeshBasicMaterial({ vertexColors: true })));
fuji.position.set(9, 0.2, -72);
scene.add(fuji);

// ---- Boats ----
function makeBoat(len, wid, big) {
  const g = new THREE.Group();
  const hull = new THREE.BoxGeometry(len, 0.55, wid, 8, 1, 2);
  const hp = hull.attributes.position;
  for (let i = 0; i < hp.count; i++) {
    const x = hp.getX(i), k = Math.abs(x) / (len / 2);
    hp.setZ(i, hp.getZ(i) * (1 - 0.62 * Math.pow(k, 2.2)));
    hp.setY(i, hp.getY(i) + 1.15 * Math.pow(k, 3));
  }
  hull.computeVertexNormals();
  g.add(new THREE.Mesh(hull, new THREE.MeshLambertMaterial({ color: P.wood, flatShading: true })));
  const deck = new THREE.Mesh(new THREE.BoxGeometry(len * 0.8, 0.18, wid * 0.5),
    new THREE.MeshLambertMaterial({ color: P.woodDk, flatShading: true }));
  deck.position.y = 0.32; g.add(deck);
  const rowerMat = new THREE.MeshLambertMaterial({ color: P.deep, flatShading: true });
  const rower = new THREE.SphereGeometry(0.24, 4, 3);
  const n = big ? 5 : 8;
  for (let i = 0; i < n; i++) {
    const r = new THREE.Mesh(rower, rowerMat);
    r.position.set(-len * 0.32 + (i / (n - 1)) * len * 0.62, 0.62, wid * 0.16);
    g.add(r);
    if (!big) {
      const oar = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.06, 0.09), rowerMat);
      oar.position.set(r.position.x, 0.45, wid * 0.55); oar.rotation.y = 0.5;
      g.add(oar);
    }
  }
  if (big) { // cargo boat cabin
    const cab = new THREE.Mesh(new THREE.BoxGeometry(len * 0.3, 0.9, wid * 0.7),
      new THREE.MeshLambertMaterial({ color: P.woodDk, flatShading: true }));
    cab.position.set(len * 0.18, 0.85, 0); g.add(cab);
  }
  return g;
}
const boats = [
  { g: makeBoat(11, 1.5, false), x: -1,  z: 12,  ry: 0.28,   roll: 0.05 },
  { g: makeBoat(11, 1.4, false), x: 18,  z: 3,   ry: -0.55,  roll: -0.12 },
  { g: makeBoat(9, 2.0, true),   x: -15, z: 17,  ry: 1.2,   roll: 0.3 }
];
boats.forEach(b => scene.add(b.g));

function ride(b, t) {
  const { x, z } = b, e = 1.4;
  const h = seaHeight(x, z, t);
  const nx = (seaHeight(x + e, z, t) - seaHeight(x - e, z, t)) / (2 * e);
  const nz = (seaHeight(x, z + e, t) - seaHeight(x, z - e, t)) / (2 * e);
  b.g.position.set(x, h + 0.42 + 0.06 * Math.sin(t * 1.3 + x), z);
  b.g.rotation.set(Math.atan2(nz, 1) * 0.8, b.ry, -Math.atan2(nx, 1) * 0.8 + b.roll + 0.05 * Math.sin(t + z));
}

// ---- Spray off the great wave's claws ----
const N = 700;
const sprayPos = new Float32Array(N * 3), sprayVel = [];
function respawn(i) {
  const a = Math.random() * Math.PI * 2, r = Math.random() * 7;
  const x = -18 + Math.cos(a) * r * 1.6, z = -4 + Math.sin(a) * r;
  sprayPos[i * 3] = x; sprayPos[i * 3 + 1] = 14.5 + Math.random() * 3; sprayPos[i * 3 + 2] = z;
  sprayVel[i] = { x: 1.6 + Math.random() * 2.2, y: 0.6 + Math.random() * 1.4, z: (Math.random() - 0.5) * 0.8, life: Math.random() * 2.4 };
}
for (let i = 0; i < N; i++) respawn(i);
const sprayGeo = new THREE.BufferGeometry();
sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPos, 3));
const spray = new THREE.Points(sprayGeo, new THREE.PointsMaterial({ color: P.foam, size: 0.55, transparent: true, opacity: 0.9 }));
scene.add(spray);

function moveSpray(dt, t) {
  for (let i = 0; i < N; i++) {
    const v = sprayVel[i];
    v.life -= dt; v.y -= 3.4 * dt;
    sprayPos[i * 3] += v.x * dt; sprayPos[i * 3 + 1] += v.y * dt; sprayPos[i * 3 + 2] += v.z * dt;
    if (v.life <= 0 || sprayPos[i * 3 + 1] < seaHeight(sprayPos[i * 3], sprayPos[i * 3 + 2], t)) respawn(i);
  }
  sprayGeo.attributes.position.needsUpdate = true;
}

// ---- Loop ----
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime(), dt = Math.min(clock.getDelta() + 0.016, 0.05);
  paintSea(t);
  boats.forEach(b => ride(b, t));
  moveSpray(dt, t);
  camera.position.x = 2 + Math.sin(t * 0.12) * 0.8; // gentle drift
  renderer.render(scene, camera);
});
</script>
</body>
</html>
