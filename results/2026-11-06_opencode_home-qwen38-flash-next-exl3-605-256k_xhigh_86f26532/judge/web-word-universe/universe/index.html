<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universo das Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--ink:#e8e6df;--dim:#8b8fa3;--panel:rgba(13,15,26,.86);--line:#262a3d;--accent:#ffd166}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
canvas{display:block;cursor:grab}
header{position:fixed;top:0;left:0;right:0;display:flex;gap:18px;align-items:baseline;padding:16px 22px;pointer-events:none;z-index:5}
h1{font:600 20px/1.2 Fraunces,serif;letter-spacing:.02em}
h1 em{color:var(--accent);font-style:normal}
#stats{color:var(--dim);font-size:12px}
#search{position:fixed;top:14px;right:22px;z-index:6}
#search input{width:250px;padding:9px 13px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:14px Inter;outline:none}
#search input:focus{border-color:var(--accent)}
#panel{position:fixed;left:22px;top:76px;bottom:22px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;overflow-y:auto;z-index:5;backdrop-filter:blur(8px)}
#panel .word{font:600 34px/1.1 Fraunces,serif}
#panel .tema{display:inline-block;margin:10px 0 4px;padding:3px 10px;border-radius:99px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);color:var(--dim)}
#panel .deg{color:var(--dim);font-size:12px;margin-bottom:14px}
#panel h2{font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
#panel ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
#panel li button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:4px 11px;font:13px Inter;cursor:pointer}
#panel li button:hover{border-color:var(--accent);color:var(--accent)}
#panel .hint{color:var(--dim);font-size:12px;margin-top:10px}
#panel .hint b{color:var(--ink)}
#tag{position:fixed;pointer-events:none;z-index:4;color:var(--accent);font:600 15px Inter;text-shadow:0 1px 6px #000;display:none;transform:translate(-50%,-160%)}
#legend{position:fixed;left:22px;bottom:16px;display:flex;flex-wrap:wrap;gap:10px;max-width:60vw;z-index:5;font-size:11px;color:var(--dim)}
#legend span{display:inline-flex;align-items:center;gap:5px}
#legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
#err{position:fixed;inset:0;display:none;place-items:center;color:var(--dim);text-align:center;padding:40px}
</style>
</head>

<div id="stage"></div>
<header><h1>Universo das <em>Palavras</em></h1><span id="stats"></span></header>
<div id="search"><input id="q" list="wl" placeholder="buscar palavra… (ex.: saudade)" autocomplete="off"><datalist id="wl"></datalist></div>
<aside id="panel"></aside>
<div id="legend"></div>
<div id="tag"></div>
<div id="err">Carregando o universo… se nada aparecer, a CDN do three.js não está acessível.</div>

const W = DATA.words, names = Object.keys(W);
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const byNorm = new Map(names.map(w => [norm(w), w]));
const find = q => W[q] !== undefined ? q : byNorm.get(norm(q.trim()));
// symmetric neighbourhood (relations are mutual in this dictionary)
const adj = new Map(names.map(w => [w, new Set()]));
for (const [a, bs] of Object.entries(W)) for (const b of bs) { adj.get(a).add(b); adj.get(b)?.add(a); }
const deg = Object.fromEntries(names.map(w => [w, adj.get(w).size]));
const maxdeg = Math.max(...Object.values(deg));
const most = names.filter(w => deg[w] === maxdeg).sort((a,b)=>a.localeCompare(b,'pt'))[0];
document.getElementById('stats').textContent =
  `${names.length} palavras · ${Object.values(deg).reduce((a,b)=>a+b,0)/2} relações · mais conectada: ${most} (${maxdeg})`;
document.getElementById('wl').innerHTML = names.map(w=>`<option value="${w}">`).join('');
const temas = [...new Set(Object.values(DATA.tema))].sort((a,b)=>a.localeCompare(b,'pt'));
const pal = ['#ffd166','#ef6f8e','#6ec6f5','#8ce99a','#c792ea','#f78c6c','#64e5d2','#fffb61','#7a8cff','#f5a3ff','#a9e34b','#98a4b8'];
const tcol = Object.fromEntries(temas.map((t,i)=>[t,pal[i%pal.length]]));
document.getElementById('legend').innerHTML =
  temas.map(t=>`<span><i style="background:${tcol[t]}"></i>${t}</span>`).join('');

// ---- three.js scene
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 4000);
const rend = new THREE.WebGLRenderer({antialias:true});
rend.setPixelRatio(devicePixelRatio); rend.setSize(innerWidth, innerHeight);
document.getElementById('stage').appendChild(rend.domElement);
const geo = new THREE.SphereGeometry(1, 18, 18);
const mat = new THREE.MeshBasicMaterial();
const mesh = new THREE.InstancedMesh(geo, mat, names.length);
const M = new THREE.Matrix4(), C = new THREE.Color();
names.forEach((w,i)=>{
  const p = DATA.pos[w], s = .55 + 1.5*Math.sqrt(deg[w]/maxdeg);
  M.makeScale(s,s,s).setPosition(p[0],p[1],p[2]);
  mesh.setMatrixAt(i,M); mesh.setColorAt(i,C.set(tcol[DATA.tema[w]]||'#fff'));
});
mesh.instanceMatrix.needsUpdate = true;
scene.add(mesh);
const eA=[], eB=[], eCol=[];
const baseEdgeCol = new THREE.Color('#39405e');
const seenPairs = new Set();
for (const [a,bs] of Object.entries(W)) for (const b of bs) {
  const key = norm(a) < norm(b) ? a+'\u0000'+b : b+'\u0000'+a;
  if (seenPairs.has(key)) continue; seenPairs.add(key);
  eA.push(a); eB.push(b);
}
const epos = new Float32Array(eA.length*6);
eA.forEach((a,i)=>{
  const p=DATA.pos[a], q=DATA.pos[eB[i]];
  epos.set([p[0],p[1],p[2],q[0],q[1],q[2]], i*6);
});
const ecol = new Float32Array(eA.length*6);
const eg = new THREE.BufferGeometry();
eg.setAttribute('position', new THREE.BufferAttribute(epos,3));
eg.setAttribute('color', new THREE.BufferAttribute(ecol,3));
scene.add(new THREE.LineSegments(eg, new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:.75})));

let sel = null;
function paint(){
  const keep = sel ? new Set([sel, ...adj.get(sel)]) : null;
  names.forEach((w,i)=>{
    const c = C.set(tcol[DATA.tema[w]]||'#fff');
    if (keep && !keep.has(w)) c.multiplyScalar(.12);
    else if (keep && w===sel) c.lerp(new THREE.Color('#ffffff'),.45);
    mesh.setColorAt(i,c);
  });
  mesh.instanceColor.needsUpdate = true;
  eA.forEach((a,i)=>{
    const hot = sel && (a===sel || eB[i]===sel);
    const c = hot ? new THREE.Color('#ffd166')
      : sel ? baseEdgeCol.clone().multiplyScalar(.15) : baseEdgeCol;
    ecol.set([c.r,c.g,c.b,c.r,c.g,c.b], i*6);
  });
  eg.attributes.color.needsUpdate = true;
}
function panel(){
  const el = document.getElementById('panel');
  if (!sel){
    el.innerHTML = `<div class="word">O universo</div>
      <p class="hint">Cada estrela é uma palavra do dicionário; cada fio, uma relação entre duas.
      O brilho e o tamanho mostram quantas ligações cada palavra tem.</p>
      <h2>Como navegar</h2>
      <p class="hint">Arraste para girar · roda para aproximar · clique numa estrela ou busque uma palavra.
      Compartilhe qualquer palavra com <b>?word=…</b> na URL.</p>
      <h2>Palavras mais conectadas</h2>
      <ul>${names.slice().sort((a,b)=>deg[b]-deg[a]||a.localeCompare(b,'pt')).slice(0,12)
        .map(w=>`<li><button data-w="${w}">${w} · ${deg[w]}</button></li>`).join('')}</ul>`;
  } else {
    const nb = [...adj.get(sel)].sort((a,b)=>a.localeCompare(b,'pt'));
    el.innerHTML = `<div class="word">${sel}</div>
      <span class="tema" style="color:${tcol[DATA.tema[sel]]||'#fff'};border-color:${tcol[DATA.tema[sel]]||'#fff'}">${DATA.tema[sel]||'—'}</span>
      <div class="deg">${nb.length} relações · clique para viajar</div>
      <ul>${nb.map(w=>`<li><button data-w="${w}">${w}</button></li>`).join('')}</ul>
      <p class="hint"><a href="?word=${encodeURIComponent(sel)}" style="color:var(--dim)">link desta palavra ↗</a></p>`;
  }
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.w,true));
}
function select(w, push){
  sel = w || null; paint(); panel();
  const url = sel ? `?word=${encodeURIComponent(sel)}` : location.pathname;
  if (push) history.replaceState(null,'',url);
}
// camera orbit
let th=.6, ph=1.15, R=170, drag=null, idle=0;
function place(){
  cam.position.set(R*Math.sin(ph)*Math.cos(th), R*Math.cos(ph), R*Math.sin(ph)*Math.sin(th));
  cam.lookAt(0,0,0);
}
const dom = rend.domElement;
dom.addEventListener('pointerdown', e=>{drag=[e.clientX,e.clientY,th,ph]; idle=0;});
addEventListener('pointermove', e=>{
  if(!drag) return;
  th = drag[2] + (e.clientX-drag[0])*.005;
  ph = Math.min(Math.PI-.05, Math.max(.05, drag[3] - (e.clientY-drag[1])*.005));
});
addEventListener('pointerup', ()=>drag=null);
addEventListener('wheel', e=>{R=Math.min(600,Math.max(40,R+e.deltaY*.15));},{passive:true});
const ray = new THREE.Raycaster(); ray.params.Points={threshold:2};
dom.addEventListener('click', e=>{
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1), cam);
  const hit = ray.intersectObject(mesh)[0];
  select(hit ? names[hit.instanceId] : null, true);
});
document.getElementById('q').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  const w = find(e.target.value);
  if(w){ select(w,true); e.target.value=''; }
});
addEventListener('popstate', ()=>select(find(new URLSearchParams(location.search).get('word')||''),false));
const tag = document.getElementById('tag');
function loop(){
  requestAnimationFrame(loop);
  if(!drag){ idle++; if(idle>90) th += .0009; } else idle=0;
  place(); rend.render(scene,cam);
  if(sel){
    const p = new THREE.Vector3(...DATA.pos[sel]).project(cam);
    if(p.z<1){ tag.style.display='block';
      tag.style.left=(p.x*.5+.5)*innerWidth+'px'; tag.style.top=(-p.y*.5+.5)*innerHeight+'px';
      tag.textContent=sel;
    } else tag.style.display='none';
  } else tag.style.display='none';
}
paint(); panel(); loop();
const q = new URLSearchParams(location.search).get('word');
if (q){ const w=find(q); if(w) select(w,false); }
document.getElementById('err').style.display='none';
</script>
