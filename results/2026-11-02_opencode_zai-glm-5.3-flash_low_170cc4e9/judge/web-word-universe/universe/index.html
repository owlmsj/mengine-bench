<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras — Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a12;--ink:#e8ecf6;--dim:#8a93a8;--line:#232a3d;--gold:#e8c477;}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;cursor:grab}
#stage:active{cursor:grabbing}
h1,.display{font-family:"Cormorant Garamond",serif}
#brand{position:fixed;top:22px;left:28px;z-index:5;pointer-events:none}
#brand h1{font-size:26px;font-weight:700;letter-spacing:.5px}
#brand p{color:var(--dim);font-size:12px;margin-top:2px;letter-spacing:.3px}
#searchwrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:6;width:min(420px,86vw)}
#search{width:100%;padding:12px 16px 12px 42px;border-radius:999px;border:1px solid var(--line);background:rgba(13,17,28,.85);color:var(--ink);font:15px Inter,sans-serif;outline:none;backdrop-filter:blur(8px)}
#search:focus{border-color:var(--gold)}
#searchwrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5}
#ac{list-style:none;margin-top:6px;border:1px solid var(--line);border-radius:14px;background:rgba(13,17,28,.95);overflow:hidden;backdrop-filter:blur(8px);display:none;max-height:300px;overflow-y:auto}
#ac li{padding:9px 16px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:10px}
#ac li .th{color:var(--dim);font-size:11px}
#ac li:hover,#ac li.sel{background:#1a2135}
#panel{position:fixed;top:88px;right:24px;width:min(340px,88vw);z-index:5;border:1px solid var(--line);border-radius:18px;background:rgba(12,16,26,.92);backdrop-filter:blur(10px);padding:22px;display:none;max-height:calc(100vh - 120px);overflow-y:auto}
#panel .close{position:absolute;top:10px;right:14px;background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer}
#panel .kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
#panel h2{font-family:"Cormorant Garamond",serif;font-size:38px;font-weight:700;line-height:1.05}
#panel .theme{display:inline-block;margin:10px 0 4px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--dim)}
#panel .deg{color:var(--dim);font-size:12px;margin-bottom:10px}
#panel h3{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin:16px 0 8px}
#panel .tags{display:flex;flex-wrap:wrap;gap:6px}
#panel .tags button{border:1px solid var(--line);background:#141a2b;color:var(--ink);border-radius:999px;padding:5px 12px;font:13px Inter,sans-serif;cursor:pointer}
#panel .tags button:hover{border-color:var(--gold);color:var(--gold)}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:var(--dim);font-size:12px;z-index:5;text-align:center;pointer-events:none}
#stats{position:fixed;bottom:18px;left:28px;color:var(--dim);font-size:12px;z-index:5}
#stats b{color:var(--ink)}
#legend{position:fixed;bottom:18px;right:28px;z-index:5;display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;max-width:46vw}
#legend span{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
#legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
@media(max-width:720px){#panel{top:auto;bottom:60px;right:12px;left:12px;width:auto}#legend{display:none}}
</style>
</head>

const words = Object.keys(DATA).sort((a,b)=>a.localeCompare(b,'pt'));
const idx = Object.fromEntries(words.map((w,i)=>[w,i]));
const N = words.length;
// neighbours union (everything the page links to, plus backlinks)
const nbr = words.map(w=>{
  const d=DATA[w]; const s=new Set([...(d.s||[]),...(d.a||[])]);
  return [...s];
});
const backlinks = words.map(()=>[]);
nbr.forEach((list,i)=>list.forEach(t=>{ if(idx[t]!==undefined) backlinks[idx[t]].push(words[i]); }));

// ---- force layout (3D), precomputed at load ----
const pos = words.map((_,i)=>{
  const r=60+((i*2654435761)%1000)/1000*140, th=i*2.399963, ph=Math.acos(2*(((i*40503)%999)/999)-1);
  return new THREE.Vector3(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph));
});
const vel = words.map(()=>new THREE.Vector3());

(function simulate(){
  const rep=1600, spr=0.012, rest=44, damp=0.86, linkK=0.02;
  for(let it=0; it<420; it++){
    for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
      const d=pos[i].clone().sub(pos[j]); let L=Math.max(d.length(),0.01);
      const f=rep/(L*L); d.multiplyScalar(f/L); vel[i].add(d); vel[j].sub(d);
    }
    for(let i=0;i<N;i++) for(const t of nbr[i]){
      const j=idx[t]; if(j===undefined||j<=i) continue;
      const d=pos[j].clone().sub(pos[i]); const L=Math.max(d.length(),0.01);
      const f=(L-rest)*linkK; d.multiplyScalar(f/L); vel[i].add(d); vel[j].sub(d);
    }
    for(let i=0;i<N;i++){
      pos[i].add(vel[i].multiplyScalar(damp)); vel[i].multiplyScalar(0.5);
      pos[i].multiplyScalar(0.999); // gentle pull to center
    }
  }
  // center & scale
  const c=new THREE.Vector3(); pos.forEach(p=>c.add(p)); c.divideScalar(N);
  pos.forEach(p=>p.sub(c));
})();

function pick(e){
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(meshes,false);
  return hits.length?hits[0].object.userData.i:-1;
}
stage.addEventListener('pointermove',e=>{
  if(dragging){stage.style.cursor='grabbing';return;}
  const i=pick(e); hoverI=i; stage.style.cursor=i>=0?'pointer':'grab';
  renderer.domElement.style.setProperty('cursor',i>=0?'pointer':'grab');
});
stage.addEventListener('click',e=>{ const i=pick(e); if(i>=0) select(words[i]); });

function highlight(word){
  const pts=[]; const cols=[];
  const i=idx[word];
  const set=new Set([word]);
  (DATA[word].s||[]).forEach(t=>set.add(t));
  (DATA[word].a||[]).forEach(t=>set.add(t));
  backlinks[i].forEach(t=>set.add(t));
  const base=new THREE.Color(0x2e3a58), gold=new THREE.Color('#e8c477'), nodeCol=new THREE.Color(colorOf(DATA[word].t));
  const seen=new Set();
  words.forEach((w,ii)=>{
    if(!set.has(w))return;
    (DATA[w].s||[]).forEach(t=>{ if(!set.has(t))return; const k=[Math.min(ii,idx[t]),Math.max(ii,idx[t])].join(); if(seen.has(k))return; seen.add(k);
      pts.push(pos[ii].x,pos[ii].y,pos[ii].z,pos[idx[t]].x,pos[idx[t]].y,pos[idx[t]].z);
      const c=(w===word||t===word)?gold:base; cols.push(c.r,c.g,c.b,c.r,c.g,c.b); });
  });
  hEdges.geometry.dispose();
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3)); hEdges.geometry=g;
  meshes.forEach((m,ii)=>{ const on=set.has(words[ii]); m.material.opacity=on?1:0.14;
    m.material.color=words[ii]===word?new THREE.Color('#ffffff'):m.material.color;
    if(words[ii]===word) m.scale.setScalar(m.userData.size*1.6); else m.scale.setScalar(m.userData.size); });
  labels.forEach(sp=>sp.material.opacity=0.18);
}

function select(word,focus){
  focusW=word; location.hashSync=false;
  history.replaceState(null,'','?word='+encodeURIComponent(word));
  const d=DATA[word]; const i=idx[word];
  const back=backlinks[i].filter(t=>!(d.s||[]).includes(t)&&!(d.a||[]).includes(t));
  document.getElementById('p-kick').textContent='palavra · '+word.length+' letras';
  document.getElementById('p-word').textContent=word;
  document.getElementById('p-theme').textContent=d.t||'—';
  document.getElementById('p-deg').textContent=(d.s||[]).length+' sinônimos · '+(d.a||[]).length+' análogas · '+(back.length)+' ligações recebidas';
  const fill=(id,list)=>{ const el=document.getElementById(id); el.innerHTML='';
    [...list].sort((a,b)=>a.localeCompare(b,'pt')).forEach(t=>{ const b=document.createElement('button'); b.textContent=t;
      b.onclick=()=>select(t); el.appendChild(b); }); if(!list.length) el.innerHTML='<span style="color:#5c6478;font-size:13px">—</span>'; };
  fill('p-sin',d.s||[]); fill('p-ana',d.a||[]); fill('p-out',back);
  const p=document.getElementById('panel'); p.style.display='block';
  highlight(word);
  if(focus!==false){ // gently move camera toward node
    targetPos=pos[i].clone();
  }
}
let targetPos=null;
function clearSel(){
  focusW=null; targetPos=null; document.getElementById('panel').style.display='none';
  history.replaceState(null,'',location.pathname);
  meshes.forEach(m=>{m.material.opacity=.95;m.scale.setScalar(m.userData.size);});
  labels.forEach(sp=>sp.material.opacity=.85);
  hEdges.geometry.dispose(); hEdges.geometry=new THREE.BufferGeometry();
}
document.getElementById('close').onclick=clearSel;

// search + autocomplete
const inp=document.getElementById('search'), ac=document.getElementById('ac');
let sel=-1;
function matches(q){ q=q.toLowerCase();
  return words.filter(w=>w.toLowerCase().startsWith(q)).concat(words.filter(w=>!w.toLowerCase().startsWith(q)&&w.toLowerCase().includes(q))).slice(0,9);
}
function showAc(){ const q=inp.value.trim(); sel=-1;
  if(!q){ac.style.display='none';return;}
  const m=matches(q); if(!m.length){ac.style.display='none';return;}
  ac.innerHTML=''; m.forEach(w=>{ const li=document.createElement('li');
    li.innerHTML=`<span>${w}</span><span class="th">${DATA[w].t||''}</span>`;
    li.onclick=()=>{ inp.value=''; ac.style.display='none'; select(w); }; ac.appendChild(li); });
  ac.style.display='block';
}
inp.addEventListener('input',showAc);
inp.addEventListener('keydown',e=>{
  const items=[...ac.children];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!items.length)return;
    sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;
    items.forEach((li,i)=>li.classList.toggle('sel',i===sel));
  } else if(e.key==='Enter'){
    const w=(sel>=0&&items[sel])?items[sel].querySelector('span').textContent:(matches(inp.value.trim())[0]||words.find(w=>w.toLowerCase()===inp.value.trim().toLowerCase()));
    if(w){ inp.value=''; ac.style.display='none'; select(w); }
  } else if(e.key==='Escape'){ ac.style.display='none'; inp.blur(); }
});
document.addEventListener('click',e=>{ if(!document.getElementById('searchwrap').contains(e.target)) ac.style.display='none'; });

// stats + legend
document.getElementById('stats').innerHTML=`<b>${N}</b> palavras · <b>${edgePos.length/6}</b> pares ligados`;
const lg=document.getElementById('legend');
THEMES.forEach(t=>{ const s=document.createElement('span');
  s.innerHTML=`<i style="background:${colorOf(t)}"></i>${t}`; lg.appendChild(s); });

// entrance animation
let t0=performance.now();
meshes.forEach((m,i)=>{ m.position.set(0,0,0); });

function frame(){
  requestAnimationFrame(frame);
  // ease positions from center to layout on load; afterwards slow rotation
  const k=Math.min(1,(performance.now()-t0)/2600);
  const e=1-Math.pow(1-k,3);
  meshes.forEach((m,i)=>{
    m.position.copy(pos[i]).multiplyScalar(e);
    m.material.rotation=0;
  });
  labels.forEach((sp,i)=>{ const m=meshes[sp.userData.i]; sp.position.copy(m.position); sp.position.y+=m.scale.x*0.5+7; });
  // rebuild edge positions each frame during entrance
  if(k<1){
    const p=[]; words.forEach((w,i)=>{ const d=DATA[w];
      [...new Set([...(d.s||[]),...(d.a||[])])].forEach(t=>{ const j=idx[t]; if(j===undefined||j<=i)return;
        p.push(meshes[i].position.x,meshes[i].position.y,meshes[i].position.z,meshes[j].position.x,meshes[j].position.y,meshes[j].position.z); });});
    edges.geometry.dispose(); const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p,3)); edges.geometry=g;
    if(targetPos){ const i=idx[focusW]; targetPos=meshes[i].position.clone(); }
  } else if(!frame.once){ frame.once=true;
    const p=[]; words.forEach((w,i)=>{ const d=DATA[w];
      [...new Set([...(d.s||[]),...(d.a||[])])].forEach(t=>{ const j=idx[t]; if(j===undefined||j<=i)return;
        p.push(pos[i].x,pos[i].y,pos[i].z,pos[j].x,pos[j].y,pos[j].z); });});
    edges.geometry.dispose(); const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(p,3)); edges.geometry=g;
  }
  if(!dragging) yaw+=0.0006;
  if(focusW){ dist+=(320-dist)*0.05; }
  place();
  renderer.render(scene,camera);
}

frame();

// deep link ?word=
const q=new URLSearchParams(location.search).get('word');
if(q){ const found=words.find(w=>w.toLowerCase()===q.toLowerCase())||words.find(w=>w.toLowerCase().startsWith(q.toLowerCase()));
  if(found) select(found,false); else document.getElementById('search').placeholder=`“${q}” não encontrada — tente outra palavra`; }
else inp.focus();
</script>
