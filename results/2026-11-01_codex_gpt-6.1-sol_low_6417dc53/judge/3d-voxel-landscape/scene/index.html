<body><div class="caption"><div class="line"></div><div class="eyebrow">Thirty-six quiet moments · 01</div><h1>Evening, in bloom.</h1><div class="sub">ARAKURAYAMA · JAPAN</div></div><div class="seal">富士の春<small>SPRING AT FUJI</small></div><div id="error">The scene could not load. Please check your connection and refresh.</div>

mesh(new THREE.SphereGeometry(3.3,48,32),new THREE.MeshBasicMaterial({color:'#ffe4b5'}),-65,28,-78);

// Fuji is a radial polygon mesh with a separately faceted, irregular snow line.

const N=48;const rings=[{y:0,r:31},{y:5,r:22},{y:11,r:14},{y:17,r:7.1},{y:23,r:1.9},{y:23.5,r:1.5}];

mesh(new THREE.CylinderGeometry(25,31,10,14),palette.grass,13,-4,9);
mesh(new THREE.CylinderGeometry(23,30,7,12),mat('#69746c'),-25,-6,9);
// A little town rests in the valley, with warm window pinpoints.

for(let i=0;i<190;i++){let x=range(-70,50),z=range(-48,-17),w=range(.5,1.6),h=range(.35,1.3);box(w,h,w*.8,townMat[i%3],x,-3.8+h/2,z);const roof=mesh(new THREE.ConeGeometry(w*.87,.45,4),roofMat,x,-3.8+h+.2,z);roof.rotation.y=Math.PI/4;if(i%4===0)box(.17,.14,.02,mat('#ffd6a3',{emissive:'#ffb55f',emissiveIntensity:.6}),x,-3.6+h/2,z+w*.4+.01)}

function roof(size,y){box(size*.52,.08,size*.52,palette.dark,0,y+1.42,0,pagoda);const rings=[{s:size*.26,y:y+1.42},{s:size*.47,y:y+.27},{s:size*.57,y:y+.14},{s:size*.62,y:y+.42}];let v=[];for(let j=0;j<3;j++)for(let i=0;i<4;i++){let a=i*Math.PI/2+Math.PI/4,b=(i+1)*Math.PI/2+Math.PI/4;let r=rings[j],s=rings[j+1];const p=(t,q)=>[Math.cos(t)*q.s*1.414,q.y,Math.sin(t)*q.s*1.414];v.push(...p(a,r),...p(b,r),...p(a,s),...p(b,r),...p(b,s),...p(a,s));}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.computeVertexNormals();mesh(g,palette.dark,0,0,0,pagoda);const e=rings[3];for(let i=0;i<4;i++){let a=i*Math.PI/2+Math.PI/4,b=(i+1)*Math.PI/2+Math.PI/4;rod(new THREE.Vector3(Math.cos(a)*e.s*1.414,e.y,Math.sin(a)*e.s*1.414),new THREE.Vector3(Math.cos(b)*e.s*1.414,e.y,Math.sin(b)*e.s*1.414),.075,palette.edge,pagoda)}
// Fine battens travel down each of the four roof faces.

for(let level=0;level<5;level++){const y=.4+level*3.05,s=7.2-level*.75;box(s*.79,2.1,s*.79,palette.red,0,y+1.05,0,pagoda);box(s*.63,1.5,s*.81,palette.cream,0,y+1.15,0,pagoda);box(s*.81,1.5,s*.63,palette.cream,0,y+1.15,0,pagoda);
for(let side=0;side<4;side++){const wall=new THREE.Group();wall.rotation.y=side*Math.PI/2;pagoda.add(wall);for(let j=-2;j<=2;j++){box(.15,2.18,.18,palette.redLight,j*s*.17,y+1.09,s*.41,wall);if(Math.abs(j)<2)box(.23,1.05,.07,palette.wood,j*s*.17,y+1.2,s*.418,wall)}box(s*.96,.18,.55,palette.redLight,0,y+.1,s*.43,wall);box(s*.96,.12,.12,palette.redLight,0,y+.66,s*.49,wall);for(let j=-5;j<=5;j++)box(.065,.56,.065,palette.red,j*s*.088,y+.37,s*.49,wall);box(s*.92,.18,.22,palette.redLight,0,y+2.1,s*.42,wall);for(let j=-3;j<=3;j++){box(.15,.3,.5,palette.cream,j*s*.125,y+2.23,s*.42,wall)}}roof(s*1.07,y+2.15)}
const top=18.05;rod(new THREE.Vector3(0,16.1,0),new THREE.Vector3(0,20.8,0),.075,palette.wood,pagoda);for(let i=0;i<8;i++){const ring=mesh(new THREE.TorusGeometry(.39-i*.025,.042,5,16),palette.cream,0,top+i*.27,0,pagoda);ring.rotation.x=Math.PI/2}mesh(new THREE.SphereGeometry(.16,8,6),palette.cream,0,20.85,0,pagoda);
// Broad stone staircase anchors the architecture in the foreground.
for(let i=0;i<12;i++)box(5.6,.27,1.05,palette.stone,11,.4-i*.27,10+i*.76);
for(let side of [-1,1]){rod(new THREE.Vector3(11+side*3,.9,9.4),new THREE.Vector3(11+side*3,-2.3,19),.11,palette.stone);for(let i=0;i<5;i++)box(.18,1.1,.18,palette.stone,11+side*3,.1-i*.67,10+i*1.9)}
// Cherry trees are branching sculptures with clusters of faceted blossoms.

function tree(x,y,z,scale){const group=new THREE.Group();group.position.set(x,y,z);group.scale.setScalar(scale);scene.add(group);const sway=new THREE.Group();group.add(sway);treeGroups.push(sway);rod(new THREE.Vector3(0,0,0),new THREE.Vector3(.3,4.3,0),.4,bark,sway,.2);for(let i=0;i<9;i++){const angle=i*2.4,r=range(1.8,4),end=new THREE.Vector3(Math.cos(angle)*r,range(4,7.5),Math.sin(angle)*r*.7);const start=new THREE.Vector3(.2,range(2,3.8),0);rod(start,end,.17,bark,sway,.06);for(let j=0;j<7;j++){const pos=end.clone().add(new THREE.Vector3(range(-1.3,1.3),range(-.4,1),range(-1.2,1.2)));const o=mesh(bloomGeo,blossoms[(i+j)%4],pos.x,pos.y,pos.z,sway);o.scale.set(range(.7,1.25),range(.65,1),range(.7,1.2));o.rotation.set(rand()*3,rand()*3,rand()*3)}}}

// Scattered fallen blossoms make the stone terrace feel lived in.

const petalGeo=new THREE.BufferGeometry();const petalCount=120;const positions=new Float32Array(petalCount*3),drift=[];for(let i=0;i<petalCount;i++){positions[i*3]=range(-30,30);positions[i*3+1]=range(0,20);positions[i*3+2]=range(-8,25);drift.push(range(.2,.7))}petalGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));const petals=new THREE.Points(petalGeo,new THREE.PointsMaterial({color:'#ffe0e6',size:.10,transparent:true,opacity:.85}));scene.add(petals);

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=0;function animate(ms){requestAnimationFrame(animate);let t=ms*.001,dt=Math.min(t-last,.05);last=t;if(!reduced){treeGroups.forEach((o,i)=>o.rotation.z=Math.sin(t*.45+i)*.012);for(let i=0;i<petalCount;i++){positions[i*3]+=(.28+Math.sin(t*.4+i)*.14)*dt;positions[i*3+1]-=drift[i]*dt;positions[i*3+2]+=Math.cos(t*.3+i)*.12*dt;if(positions[i*3+1]<-1){positions[i*3+1]=18;positions[i*3]=range(-30,25)}}petalGeo.attributes.position.needsUpdate=true;}renderer.render(scene,camera)}
