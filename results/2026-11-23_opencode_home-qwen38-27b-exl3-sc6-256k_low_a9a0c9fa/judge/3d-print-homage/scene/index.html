<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Great Wave off Kanagawa — low poly 3D wallpaper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e8dfc8}
  #c{display:block;width:100%;height:100%}
  #cap{position:fixed;left:14px;bottom:10px;color:#23415e;font:12px/1.4 Georgia,serif;
       letter-spacing:.06em;opacity:.85;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">The Great Wave off Kanagawa &middot; after Katsushika Hokusai (public domain) &middot; low-poly rebuild</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

/* ---- palette taken from the print ---- */
const COL = {
  skyTop:   0xf2ead2,  // aged paper cream
  skyBot:   0xd9cfb2,
  paper:    0xefe6cc,
  prussian: 0x1f4e79,  // deep Prussian blue of the wave body
  prussian2:0x2e6da4,  // lighter blue of troughs
  foam:     0xf7f3e6,  // white foam
  foamShade:0xd8e4e8,
  hull:     0xc98f5a,  // tan hull
  hullDark: 0x8a5a33,
  sail:     0xe9dfc2,
  fuji:     0x4a6f92,  // blue-grey mountain
  fujiSnow: 0xf5f1e4,
  ink:      0x2b3a4a
};

const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.paper);
scene.fog = new THREE.Fog(COL.paper, 60, 160);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 400);
camera.position.set(0, 7.5, 46);
camera.lookAt(0, 6, 0);

/* flat, print-like lighting */
scene.add(new THREE.HemisphereLight(0xfff6dd, 0x33506b, 1.15));
const sun = new THREE.DirectionalLight(0xfff2d0, .55);
sun.position.set(-18, 30, 20);
scene.add(sun);

const flat = (color, opts={}) =>
  new THREE.MeshLambertMaterial({color, flatShading:true, ...opts});
// unlit material: foam and snow stay their print color regardless of light
const unlit = (color) =>
  new THREE.MeshBasicMaterial({color, flatShading:true});

/* =========================================================
   Sky: a big gradient plane behind everything (paper tone)
   ========================================================= */
{
  const g = new THREE.BufferGeometry();
  const v = new Float32Array([-80,-10,0,  80,-10,0,  80,40,0,  -80,40,0]);
  const c = [COL.skyBot,COL.skyBot,COL.skyTop,COL.skyTop].map(h=>new THREE.Color(h));
  const cc = new Float32Array(12);
  c.forEach((col,i)=>{cc[i*3]=col.r;cc[i*3+1]=col.g;cc[i*3+2]=col.b;});
  g.setAttribute('position', new THREE.BufferAttribute(v,3));
  g.setAttribute('color', new THREE.BufferAttribute(cc,3));
  g.setIndex([0,1,2, 0,2,3]);
  g.computeVertexNormals();
  const sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide}));
  sky.position.z = -90;
  scene.add(sky);
}

/* =========================================================
   Mount Fuji — low-poly cone with snow cap, centre-back
   ========================================================= */
const fuji = new THREE.Group();
{
  const body = new THREE.Mesh(new THREE.ConeGeometry(16, 14, 7, 3), flat(COL.fuji));
  body.position.y = 7;
  fuji.add(body);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(6.2, 5.2, 7, 2), unlit(COL.fujiSnow));
  cap.position.y = 11.4;
  fuji.add(cap);
  // jagged snow line: a few small white shards on the shoulder
  for(let i=0;i<5;i++){
    const a = i/5*Math.PI*2 + .4;
    const s = new THREE.Mesh(new THREE.TetrahedronGeometry(1.6), unlit(COL.fujiSnow));
    s.position.set(Math.cos(a)*4.6, 9.6, Math.sin(a)*4.6);
    s.rotation.set(Math.random(),Math.random(),Math.random());
    fuji.add(s);
  }
}
fuji.position.set(7, -5.5, -46);
fuji.scale.setScalar(0.85);
scene.add(fuji);

/* =========================================================
   Waves — low-poly "curls" built from stacked torus-ish rings
   The great wave: a big curling crest on the left.
   ========================================================= */
const waves = [];   // {group, baseY, phase, amp, speed}

function makeCurl(radius, tube, segs, color, foamColor, foamCount){
  // A breaking wave: a curved wedge of blue (the face of the wave)
  // with a white foam crest that hooks over to the right, like the print.
  const g = new THREE.Group();
  // wave face: a quarter-cylinder shell (blue)
  const face = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius*1.06, tube*2.4, segs, 1, true, Math.PI*0.15, Math.PI*0.95),
    new THREE.MeshLambertMaterial({color, flatShading:true, side:THREE.DoubleSide}));
  face.rotation.z = Math.PI/2;
  face.rotation.y = Math.PI/2;
  g.add(face);
  // crest: a row of white foam clumps following the curl, hooking right
  const arc = Math.PI*0.95;
  for(let i=0;i<foamCount;i++){
    const t = Math.PI*0.15 + (i/(foamCount-1))*arc;
    const r = radius + tube*0.9;
    const x = Math.cos(t)*r, y = Math.sin(t)*r;
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(tube*(0.5+Math.random()*0.45),0), unlit(foamColor));
    s.position.set(x, y, 0);
    s.scale.set(1.25,0.75,1.25);
    g.add(s);
  }
  // claw fingers: white cones hanging from the crest, pointing down-right
  for(let i=0;i<Math.floor(foamCount*0.8);i++){
    const t = Math.PI*0.15 + (i/(Math.floor(foamCount*0.8)-1))*arc*0.9;
    const r = radius + tube*0.7;
    const x = Math.cos(t)*r, y = Math.sin(t)*r;
    const f = new THREE.Mesh(new THREE.ConeGeometry(tube*0.22, tube*1.5, 4), unlit(foamColor));
    f.position.set(x + tube*0.3, y - tube*0.7, 0);
    f.rotation.z = Math.PI*0.75;
    g.add(f);
  }
  return g;
}

function makeTrough(width, color){
  // a low-poly swell: a stretched, flattened icosahedron sea
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), flat(color));
  m.scale.set(width, 1.6, 3.2);
  return m;
}

/* --- the Great Wave (left) --- */
{
  const g = new THREE.Group();
  const body = makeTrough(16, COL.prussian);
  body.position.set(-16, 2.2, -6);
  g.add(body);
  const curl = makeCurl(8.5, 3.0, 16, COL.prussian, COL.foam, 30);
  curl.position.set(-15, 5.5, -4);
  g.add(curl);
  // secondary breaking wave in front
  const curl2 = makeCurl(3.4, 1.3, 10, COL.prussian2, COL.foam, 14);
  curl2.position.set(-9, 3.4, 2);
  g.add(curl2);
  scene.add(g);
  waves.push({group:g, baseY:0, phase:0, amp:.35, speed:.5});
}

/* --- right side waves --- */
{
  const g = new THREE.Group();
  const t1 = makeTrough(14, COL.prussian);
  t1.position.set(17, 2.0, -8);
  g.add(t1);
  const c1 = makeCurl(4.6, 1.6, 12, COL.prussian, COL.foam, 18);
  c1.position.set(19, 5.2, -6);
  g.add(c1);
  const c2 = makeCurl(3.0, 1.1, 10, COL.prussian2, COL.foam, 12);
  c2.position.set(12, 3.6, 0);
  g.add(c2);
  scene.add(g);
  waves.push({group:g, baseY:0, phase:1.7, amp:.3, speed:.62});
}

/* --- foreground swells --- */
{
  const g = new THREE.Group();
  const t = makeTrough(20, COL.prussian2);
  t.position.set(0, 1.4, 8);
  g.add(t);
  const c = makeCurl(2.6, 1.0, 9, COL.prussian, COL.foam, 10);
  c.position.set(-4, 2.6, 10);
  g.add(c);
  const c2 = makeCurl(2.2, .9, 9, COL.prussian2, COL.foam, 9);
  c2.position.set(7, 2.4, 11);
  g.add(c2);
  scene.add(g);
  waves.push({group:g, baseY:0, phase:3.1, amp:.25, speed:.75});
}

/* =========================================================
   Boats — 9 in the print. Low-poly hulls with crews.
   ========================================================= */
const boats = [];

function makeBoat(scale=1){
  const g = new THREE.Group();
  // hull: a stretched box tapered at both ends (two boxes + two cones)
  const hull = new THREE.Mesh(new THREE.BoxGeometry(6.4, .9, 1.7), flat(COL.hull));
  g.add(hull);
  const bow = new THREE.Mesh(new THREE.ConeGeometry(.85, 2.2, 4), flat(COL.hull));
  bow.rotation.z = -Math.PI/2; bow.rotation.y = Math.PI/4;
  bow.position.set(4.2, .25, 0);
  g.add(bow);
  const stern = new THREE.Mesh(new THREE.ConeGeometry(.85, 2.2, 4), flat(COL.hull));
  stern.rotation.z = Math.PI/2; stern.rotation.y = Math.PI/4;
  stern.position.set(-4.2, .25, 0);
  g.add(stern);
  // gunwale strip (darker)
  const strip = new THREE.Mesh(new THREE.BoxGeometry(6.6, .28, 1.85), flat(COL.hullDark));
  strip.position.y = .5;
  g.add(strip);
  // crew: rows of small dark figures (the print shows rows of rowers)
  const n = 7;
  for(let i=0;i<n;i++){
    const x = -2.6 + i*(5.2/(n-1));
    const fig = new THREE.Mesh(new THREE.CapsuleGeometry(.22,.5,2,5), flat(COL.ink));
    fig.position.set(x, 1.05, 0);
    g.add(fig);
    const oar = new THREE.Mesh(new THREE.BoxGeometry(.08,.9,.08), flat(COL.hullDark));
    oar.position.set(x, .55, .95);
    oar.rotation.x = .5;
    g.add(oar);
  }
  g.scale.setScalar(scale);
  return g;
}

/* positions roughly follow the print: 3 left under the great wave,
   3 right in the troughs, 3 in the foreground */
const boatSpots = [
  // left group, tucked in the wave's claw
  {p:[-20, 4.6, -2],  r: .35,  s:.85},
  {p:[-16.5, 3.6, 1], r:-.3,   s:.95},
  {p:[-13, 3.0, 3.5], r:.25,   s:1.0},
  // right group
  {p:[ 15, 3.4, -3],  r:-.4,   s:.9},
  {p:[ 11, 2.8, 1],   r:.3,    s:1.0},
  {p:[ 18, 2.6, 3],   r:-.2,   s:.8},
  // foreground
  {p:[ -5, 2.2, 12],  r:.15,   s:1.1},
  {p:[  2, 2.0, 14],  r:-.25,  s:1.15},
  {p:[  9, 2.3, 11],  r:.2,    s:1.0},
];
boatSpots.forEach((b,i)=>{
  const boat = makeBoat(b.s);
  boat.position.set(...b.p);
  boat.rotation.y = b.r;
  scene.add(boat);
  boats.push({group:boat, baseY:b.p[1], phase:i*1.3, amp:.28, speed:.9,
              rockAmp:.12, rockSpeed:1.1});
});

/* =========================================================
   Gentle motion
   ========================================================= */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  for(const w of waves){
    w.group.position.y = w.baseY + Math.sin(t*w.speed + w.phase)*w.amp;
  }
  for(const b of boats){
    b.group.position.y = b.baseY + Math.sin(t*b.speed + b.phase)*b.amp;
    b.group.rotation.z = Math.sin(t*b.rockSpeed + b.phase)*b.rockAmp;
    b.group.rotation.x = Math.cos(t*b.rockSpeed*.8 + b.phase)*b.rockAmp*.6;
  }
  // slow parallax drift of the camera for a wallpaper feel
  camera.position.x = Math.sin(t*.05)*1.6;
  camera.position.y = 7.5 + Math.sin(t*.07)*.4;
  camera.lookAt(0, 6, 0);
  renderer.render(scene, camera);
}
tick();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
