<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloon Pop Archery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas { display: block; image-rendering: pixelated; cursor: crosshair; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10;
    background: rgba(10,10,30,0.82); color: #fff; text-align: center;
    font-family: 'VT323', monospace;
  }
  .overlay.hidden { display: none; }
  .title {
    font-family: 'Press Start 2P', monospace; font-size: 28px;
    color: #ffd23f; text-shadow: 3px 3px 0 #b03030, 6px 6px 0 rgba(0,0,0,.4);
    margin-bottom: 24px; line-height: 1.5;
  }
  .subtitle { font-size: 26px; color: #a8d8ff; margin-bottom: 8px; }
  .hint { font-size: 20px; color: #888; margin-top: 18px; line-height: 1.6; }
  .score-big { font-family: 'Press Start 2P', monospace; font-size: 40px; color: #7CFC00; margin: 16px 0; text-shadow: 2px 2px 0 #000; }
  .btn {
    font-family: 'Press Start 2P', monospace; font-size: 16px;
    color: #1a1a2e; background: #ffd23f; border: none; padding: 16px 32px;
    cursor: pointer; margin-top: 24px; box-shadow: 0 6px 0 #b8860b;
    transition: transform .05s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b8860b; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="startScreen" class="overlay">
    <div class="title">BALLOON<br>ARCHERY</div>
    <div class="subtitle">Level 1 &mdash; Pop them all!</div>
    <div class="hint">
      Aim with the mouse &middot; Hold left button to draw the bow<br>
      Release to fire &middot; Pop all 10 balloons before you run out of arrows
    </div>
    <button class="btn" id="startBtn">START</button>
  </div>
  <div id="endScreen" class="overlay hidden">
    <div class="title" id="endTitle">GAME OVER</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="subtitle" id="endMsg"></div>
    <button class="btn" id="retryBtn">PLAY AGAIN</button>
  </div>
</div>
<script>
(() => {
"use strict";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 960, H = 600;
canvas.width = W; canvas.height = H;

// ---------- Audio ----------
let AC = null;
function audio() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function blip(freq, dur, type='square', vol=0.15, slide=0) {
  const ac = audio();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
const sfx = {
  draw: () => blip(120, 0.1, 'sawtooth', 0.05, 80),
  shoot: () => { blip(300, 0.12, 'square', 0.12, -200); blip(150, 0.15, 'triangle', 0.1, -100); },
  pop: () => { blip(600, 0.08, 'square', 0.2, 300); blip(900, 0.06, 'sine', 0.15, 200); },
  miss: () => blip(100, 0.2, 'sawtooth', 0.08, -50),
  win: () => { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.25,'square',0.15),i*120)); },
  lose: () => { [400,350,300,200].forEach((f,i)=>setTimeout(()=>blip(f,0.3,'sawtooth',0.12),i*150)); },
};

// ---------- State ----------
const TOTAL_BALLOONS = 10;
const MAX_ARROWS = 12;
let state = 'start'; // start | playing | won | lost
let score = 0, arrowsLeft = MAX_ARROWS, balloonsPopped = 0;
let balloons = [], arrows = [], particles = [], floaters = [];
let mouse = { x: W/2, y: H/3, down: false };
let drawPower = 0; // 0..1
let archer = { x: 120, y: H - 90 };
let wind = 0, windTimer = 0;

function reset() {
  score = 0; arrowsLeft = MAX_ARROWS; balloonsPopped = 0;
  balloons = []; arrows = []; particles = []; floaters = [];
  drawPower = 0; wind = 0;
  spawnBalloons();
}
function spawnBalloons() {
  const colors = ['#ff5252','#ffd740','#69f0ae','#40c4ff','#e040fb','#ff6e40'];
  for (let i = 0; i < TOTAL_BALLOONS; i++) {
    balloons.push({
      x: 250 + Math.random() * (W - 320),
      y: 60 + Math.random() * (H - 220),
      r: 26 + Math.random() * 10,
      color: colors[i % colors.length],
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.3,
      phase: Math.random() * Math.PI * 2,
      alive: true,
      wob: 0,
    });
  }
}

// ---------- Input ----------
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('mousedown', e => {
  if (state !== 'playing') return;
  if (e.button === 0) { mouse.down = true; }
});
window.addEventListener('mouseup', e => {
  if (e.button === 0 && mouse.down && state === 'playing') {
    mouse.down = false;
    if (drawPower > 0.08) shoot();
    drawPower = 0;
  }
});
document.getElementById('startBtn').addEventListener('click', () => {
  audio(); reset(); state = 'playing';
  document.getElementById('startScreen').classList.add('hidden');
});
document.getElementById('retryBtn').addEventListener('click', () => {
  reset(); state = 'playing';
  document.getElementById('endScreen').classList.add('hidden');
});

// ---------- Shooting ----------
function shoot() {
  const dx = mouse.x - archer.x, dy = mouse.y - archer.y;
  const ang = Math.atan2(dy, dx);
  const speed = 8 + drawPower * 16;
  arrows.push({
    x: archer.x + Math.cos(ang) * 30,
    y: archer.y + Math.sin(ang) * 30,
    vx: Math.cos(ang) * speed,
    vy: Math.sin(ang) * speed,
    ang,
    dead: false,
  });
  arrowsLeft--;
  sfx.shoot();
}

function updateArrows(dt) {
  const g = 0.12;
  for (const a of arrows) {
    if (a.dead) continue;
    a.vy += g;
    a.x += a.vx; a.y += a.vy;
    a.ang = Math.atan2(a.vy, a.vx);
    if (a.x < -40 || a.x > W + 40 || a.y > H + 40) {
      a.dead = true;
      sfx.miss();
      floaters.push({ x: Math.min(W-30, Math.max(30, a.x)), y: Math.min(H-20, Math.max(20, a.y)), text: 'MISS', life: 40, color: '#ff8a80' });
    }
    for (const b of balloons) {
      if (!b.alive) continue;
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < b.r + 6) {
        a.dead = true; b.alive = false; balloonsPopped++;
        const pts = 100 + Math.round((1 - b.r / 36) * 50);
        score += pts;
        sfx.pop();
        burst(b.x, b.y, b.color, 22);
        floaters.push({ x: b.x, y: b.y - 20, text: '+' + pts, life: 50, color: '#fff' });
        checkEnd();
        break;
      }
    }
  }
  arrows = arrows.filter(a => !a.dead);
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 1, life: 30 + Math.random()*20, color, r: 2 + Math.random()*3 });
  }
}
function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 0.8; f.life--; }
  floaters = floaters.filter(f => f.life > 0);
}

function updateBalloons(t) {
  windTimer--;
  if (windTimer <= 0) { wind = (Math.random() - 0.5) * 0.3; windTimer = 120; }
  for (const b of balloons) {
    if (!b.alive) continue;
    b.phase += 0.03;
    b.x += b.vx + wind + Math.sin(b.phase) * 0.3;
    b.y += b.vy + Math.cos(b.phase * 0.7) * 0.2;
    if (b.x < b.r) { b.x = b.r; b.vx *= -1; }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx *= -1; }
    if (b.y < b.r) { b.y = b.r; b.vy *= -1; }
    if (b.y > H - 60) { b.y = H - 60; b.vy *= -1; }
  }
}

function checkEnd() {
  if (balloonsPopped >= TOTAL_BALLOONS) {
    state = 'won'; sfx.win();
    showEnd(true);
  } else if (arrowsLeft <= 0 && arrows.length === 0) {
    state = 'lost'; sfx.lose();
    showEnd(false);
  }
}
function showEnd(won) {
  document.getElementById('endTitle').textContent = won ? 'LEVEL CLEAR!' : 'GAME OVER';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('endMsg').textContent = won
    ? `All ${TOTAL_BALLOONS} balloons popped with ${arrowsLeft} arrows to spare!`
    : `You popped ${balloonsPopped} of ${TOTAL_BALLOONS} balloons.`;
  setTimeout(() => document.getElementById('endScreen').classList.remove('hidden'), won ? 600 : 400);
}

// ---------- Drawing ----------
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#4a90d9');
  grad.addColorStop(0.6, '#87ceeb');
  grad.addColorStop(1, '#c9e8f5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  cloud(150, 80, 1); cloud(420, 140, 0.7); cloud(700, 60, 1.2); cloud(850, 180, 0.6);
}
function cloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 22*s, 0, Math.PI*2);
  ctx.arc(x+24*s, y-8*s, 18*s, 0, Math.PI*2);
  ctx.arc(x+46*s, y, 20*s, 0, Math.PI*2);
  ctx.arc(x+22*s, y+8*s, 16*s, 0, Math.PI*2);
  ctx.fill();
}
function drawGround() {
  ctx.fillStyle = '#5da03c';
  ctx.fillRect(0, H - 60, W, 60);
  ctx.fillStyle = '#4c8a30';
  ctx.fillRect(0, H - 60, W, 8);
}
function drawArcher() {
  const a = archer;
  const ang = Math.atan2(mouse.y - a.y, mouse.x - a.x);
  ctx.save();
  ctx.translate(a.x, a.y);
  // body
  ctx.fillStyle = '#6d4c2f';
  ctx.fillRect(-8, -10, 16, 34); // torso
  ctx.fillStyle = '#e8b88a';
  ctx.beginPath(); ctx.arc(0, -20, 11, 0, Math.PI*2); ctx.fill(); // head
  ctx.fillStyle = '#3a2a1a';
  ctx.fillRect(-11, -26, 22, 6); // hat brim
  ctx.fillStyle = '#4a3420';
  ctx.fillRect(-8, -34, 16, 9); // hat top
  // bow arm + bow
  ctx.rotate(ang);
  const pull = drawPower * 22;
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(18, -18);
  ctx.quadraticCurveTo(26 + pull*0.3, 0, 18, 18);
  ctx.stroke();
  // string
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(18, -18);
  ctx.lineTo(18 - pull, 0);
  ctx.lineTo(18, 18);
  ctx.stroke();
  // arrow nocked while drawing
  if (drawPower > 0.05) {
    ctx.strokeStyle = '#a0682a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(18 - pull, 0); ctx.lineTo(34, 0); ctx.stroke();
    ctx.fillStyle = '#ccc';
    ctx.beginPath(); ctx.moveTo(34, 0); ctx.lineTo(28, -4); ctx.lineTo(28, 4); ctx.fill();
  }
  ctx.restore();
}
function drawBalloon(b) {
  const wob = Math.sin(b.phase) * 2;
  ctx.save();
  ctx.translate(b.x, b.y);
  // string
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, b.r); ctx.quadraticCurveTo(wob, b.r + 18, -wob, b.r + 34); ctx.stroke();
  // body
  const grad = ctx.createRadialGradient(-b.r*0.3, -b.r*0.3, b.r*0.2, 0, 0, b.r);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.25, b.color);
  grad.addColorStop(1, shade(b.color, -30));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, b.r * 0.85, b.r, 0, 0, Math.PI * 2);
  ctx.fill();
  // knot
  ctx.fillStyle = shade(b.color, -30);
  ctx.beginPath();
  ctx.moveTo(-4, b.r - 2); ctx.lineTo(4, b.r - 2); ctx.lineTo(0, b.r + 6);
  ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(-b.r*0.3, -b.r*0.35, b.r*0.18, b.r*0.28, -0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return `rgb(${r},${g},${b})`;
}
function drawArrow(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.ang);
  ctx.strokeStyle = '#a0682a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(10, 0); ctx.stroke();
  ctx.fillStyle = '#ccc';
  ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(6, -4); ctx.lineTo(6, 4); ctx.fill();
  ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-22, -4); ctx.moveTo(-18, 0); ctx.lineTo(-22, 4); ctx.stroke();
  ctx.restore();
}
function drawHUD() {
  ctx.font = '24px "VT323", monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(10, 10, 220, 56);
  ctx.fillStyle = '#fff';
  ctx.fillText('SCORE ' + score, 20, 36);
  ctx.fillText('BALLOONS ' + balloonsPopped + '/' + TOTAL_BALLOONS, 20, 60);
  // arrows
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(W - 190, 10, 180, 40);
  ctx.fillStyle = '#ffd23f';
  ctx.font = '24px "VT323", monospace';
  ctx.fillText('ARROWS ' + arrowsLeft, W - 20, 38);
  // power bar
  if (drawPower > 0.02) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(archer.x - 40, archer.y + 34, 80, 12);
    const pcol = drawPower < 0.5 ? '#69f0ae' : drawPower < 0.8 ? '#ffd740' : '#ff5252';
    ctx.fillStyle = pcol;
    ctx.fillRect(archer.x - 38, archer.y + 36, 76 * drawPower, 8);
  }
}

// ---------- Loop ----------
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(33, t - last); last = t;
  if (state === 'playing') {
    if (mouse.down) {
      drawPower = Math.min(1, drawPower + 0.025);
    }
    updateBalloons(t);
    updateArrows(dt);
    updateParticles();
    if (arrowsLeft <= 0 && arrows.length === 0 && balloonsPopped < TOTAL_BALLOONS && state === 'playing') {
      state = 'lost'; sfx.lose(); showEnd(false);
    }
  }
  drawSky();
  drawGround();
  for (const b of balloons) if (b.alive) drawBalloon(b);
  for (const a of arrows) drawArrow(a);
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 40);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.life / 25);
    ctx.font = '26px "VT323", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  if (state === 'playing' || state === 'won' || state === 'lost') drawArcher();
  if (state === 'playing') drawHUD();
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
