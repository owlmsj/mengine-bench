<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universo de Palavras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14; --ink:#e8e4da; --dim:#8b8fa3; --accent:#e0b070; --accent2:#7fb0a8;
  --panel:rgba(16,20,30,.82); --line:rgba(232,228,218,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",sans-serif;overflow:hidden}
#scene{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;top:0;left:0;right:0;padding:20px 28px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#title h1{font-family:"Cormorant Garamond",serif;font-size:30px;font-weight:600;letter-spacing:.5px}
#title p{color:var(--dim);font-size:12.5px;margin-top:4px;max-width:340px;line-height:1.5}
#stats{color:var(--dim);font-size:12px;text-align:right;line-height:1.7}
#stats b{color:var(--ink);font-weight:500}
#search{position:absolute;left:50%;top:22px;transform:translateX(-50%);pointer-events:auto}
#search input{width:300px;padding:10px 16px;border-radius:22px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px;outline:none;backdrop-filter:blur(8px)}
#search input::placeholder{color:var(--dim)}
#search input:focus{border-color:var(--accent)}
#panel{position:absolute;right:24px;top:90px;width:300px;max-height:calc(100vh - 140px);overflow-y:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;backdrop-filter:blur(10px);
  pointer-events:auto;transform:translateX(20px);opacity:0;transition:.25s ease}
#panel.show{transform:none;opacity:1}
#panel h2{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;margin-bottom:2px}
#panel .tema{color:var(--accent);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px}
#panel .lbl{color:var(--dim);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:14px 0 8px}
#panel ul{list-style:none}
#panel li{margin-bottom:5px}
#panel li a{color:var(--ink);text-decoration:none;font-size:14px;padding:5px 10px;border-radius:8px;display:inline-block;cursor:pointer;transition:.15s}
#panel li a:hover{background:rgba(224,176,112,.15);color:var(--accent)}
#panel .close{position:absolute;top:14px;right:14px;color:var(--dim);cursor:pointer;font-size:18px;line-height:1}
#panel .close:hover{color:var(--ink)}
#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:var(--dim);font-size:11.5px;letter-spacing:.5px}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <div id="top">
    <div id="title">
      <h1>Universo de Palavras</h1>
      <p>Um dicionário criativo em que as palavras se ligam entre si. Arraste para girar, role para aproximar, clique numa palavra para ver suas relações.</p>
    </div>
    <div id="stats"></div>
  </div>
  <div id="search"><input id="q" type="text" placeholder="buscar uma palavra…" autocomplete="off"></div>
  <div id="panel">
    <span class="close" id="close">×</span>
    <h2 id="pword"></h2>
    <div class="tema" id="ptheme"></div>
    <div class="lbl">Ligada a</div>
    <ul id="plinks"></ul>
  </div>
  <div id="hint">?word=saudade abre direto numa palavra</div>
</div>

const words = Object.keys(DATA);
const N = words.length;
const idx = new Map(words.map((w,i)=>[w,i]));
const idxCI = new Map(words.map((w,i)=>[w.toLowerCase(),i]));
function resolve(t){ return idx.has(t) ? idx.get(t) : (idxCI.has(t.toLowerCase()) ? idxCI.get(t.toLowerCase()) : -1); }

// degree
const deg = new Array(N).fill(0);
for (const w of words) for (const t of DATA[w]) if (idx.has(t)) deg[idx.get(w)]++;
const maxDeg = Math.max(...deg);

// themes: derive from links? we only have words->links; keep a theme map from data if present
// (words.json is a flat map word->links; no themes. Fine.)

// positions: force-directed-ish spherical layout by degree (high degree near center)
const pos = new Float32Array(N*3);
// deterministic pseudo-random
let seed = 42;
function rnd(){ seed = (seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
for (let i=0;i<N;i++){
  const r = 60 + rnd()*140;
  const th = rnd()*Math.PI*2, ph = Math.acos(2*rnd()-1);
  pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
  pos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
  pos[i*3+2] = r*Math.cos(ph);
}
// a few relaxation iterations pulling linked words together
const adj = words.map(w=>DATA[w].map(t=>resolve(t)).filter(j=>j>=0));
for (let it=0; it<40; it++){
  const f = new Float32Array(N*3);
  for (let i=0;i<N;i++){
    let cx=0,cy=0,cz=0,n=0;
    for (const j of adj[i]){ cx+=pos[j*3]; cy+=pos[j*3+1]; cz+=pos[j*3+2]; n++; }
    if(n){ f[i*3]+=(cx/n-pos[i*3])*0.02; f[i*3+1]+=(cy/n-pos[i*3+1])*0.02; f[i*3+2]+=(cz/n-pos[i*3+2])*0.02; }
    // mild centering
    f[i*3]-=pos[i*3]*0.002; f[i*3+1]-=pos[i*3+1]*0.002; f[i*3+2]-=pos[i*3+2]*0.002;
  }
  for (let i=0;i<N;i++){ pos[i*3]+=f[i*3]; pos[i*3+1]+=f[i*3+1]; pos[i*3+2]+=f[i*3+2]; }
}

// scene
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0e14, 0.0016);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 2000);
camera.position.set(0,0,260);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0b0e14);
document.getElementById("scene").appendChild(renderer.domElement);

// nodes: instanced spheres sized by degree
const geo = new THREE.SphereGeometry(1, 12, 12);
const mat = new THREE.MeshBasicMaterial({color:0xffffff});
const nodes = new THREE.InstancedMesh(geo, mat, N);
const col = new THREE.Color();
const baseCol = new THREE.Color(0x8b8fa3);
const hiCol = new THREE.Color(0xe0b070);
for (let i=0;i<N;i++){
  const s = 0.8 + (deg[i]/maxDeg)*2.6;
  const m = new THREE.Matrix4().setPosition(pos[i*3],pos[i*3+1],pos[i*3+2]).scale(new THREE.Vector3(s,s,s));
  nodes.setMatrixAt(i,m);
  const t = deg[i]/maxDeg;
  col.copy(baseCol).lerp(hiCol, t);
  nodes.setColorAt(i,col);
}
scene.add(nodes);

// edges (deduped undirected pairs)
const eSet = new Set();
const eIdx = [];
for (let i=0;i<N;i++) for (const j of adj[i]) if (j>i){ const k=i+"_"+j; if(!eSet.has(k)){ eSet.add(k); eIdx.push(i,j); } }
const eGeo = new THREE.BufferGeometry();
eGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(eIdx.length*3),3).setUsage(THREE.DynamicDrawUsage));
const eMat = new THREE.LineBasicMaterial({color:0x2a3040, transparent:true, opacity:.5});
const edges = new THREE.LineSegments(eGeo, eMat);
scene.add(edges);
function updateEdges(){
  const a = eGeo.attributes.position.array;
  let k=0;
  for (let i=0;i<eIdx.length;i+=2){
    a[k++]=pos[eIdx[i]*3]; a[k++]=pos[eIdx[i]*3+1]; a[k++]=pos[eIdx[i]*3+2];
    a[k++]=pos[eIdx[i+1]*3]; a[k++]=pos[eIdx[i+1]*3+1]; a[k++]=pos[eIdx[i+1]*3+2];
  }
  eGeo.attributes.position.needsUpdate=true;
}
updateEdges();

// labels: sprites for all words (small), bigger for selected
function makeLabel(text, size){
  const c = document.createElement("canvas");
  const ctx = c.getContext("2d");
  const fs = 42;
  ctx.font = `${fs}px "Space Grotesk", sans-serif`;
  const w = Math.ceil(ctx.measureText(text).width)+16;
  c.width=w; c.height=fs+16;
  const ctx2 = c.getContext("2d");
  ctx2.font = `${fs}px "Space Grotesk", sans-serif`;
  ctx2.fillStyle = "rgba(232,228,218,.92)";
  ctx2.textBaseline="middle";
  ctx2.fillText(text,8, c.height/2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter=THREE.LinearFilter;
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  const s = size;
  spr.scale.set(w/42*s, (fs+16)/42*s, 1);
  return spr;
}
const labels = [];
for (let i=0;i<N;i++){
  const sp = makeLabel(words[i], 0.9);
  sp.position.set(pos[i*3], pos[i*3+1]+2.5, pos[i*3+2]);
  sp.visible=false;
  scene.add(sp); labels.push(sp);
}

// stats
document.getElementById("stats").innerHTML =
  `<b>${N}</b> palavras<br><b>${eIdx.length/2}</b> relações`;

// selection
let selected = -1;
const panel = document.getElementById("panel");
function select(i){
  selected = i;
  document.getElementById("pword").textContent = words[i];
  const links = adj[i];
  document.getElementById("plinks").innerHTML =
    links.map(j=>`<li><a data-i="${j}">${words[j]}</a></li>`).join("") || "<li>—</li>";
  panel.classList.add("show");
  // show labels for selected + neighbors
  for (let k=0;k<N;k++) labels[k].visible = (k===i || links.includes(k));
  // highlight edges: rebuild edge color via opacity is global; instead tint selected node
  for (let k=0;k<N;k++){
    const t = k===i ? 1 : (links.includes(k)? .6 : 0);
    col.copy(baseCol).lerp(hiCol, t);
    nodes.setColorAt(k,col);
  }
  nodes.instanceColor.needsUpdate=true;
  history.replaceState(null,"","?word="+encodeURIComponent(words[i]));
}
function deselect(){
  selected=-1; panel.classList.remove("show");
  for (let k=0;k<N;k++) labels[k].visible=false;
  for (let k=0;k<N;k++){ const t=deg[k]/maxDeg; col.copy(baseCol).lerp(hiCol,t); nodes.setColorAt(k,col); }
  nodes.instanceColor.needsUpdate=true;
  history.replaceState(null,"","");
}
document.getElementById("close").onclick=deselect;
document.getElementById("plinks").addEventListener("click",e=>{
  const a=e.target.closest("a"); if(a) select(+a.dataset.i);
});

// search
const q = document.getElementById("q");
q.addEventListener("input",()=>{
  const v=q.value.trim().toLowerCase();
  if(!v) return;
  const hit = words.find(w=>w.toLowerCase()===v);
  if(hit) select(idx.get(hit));
});
q.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const v=q.value.trim().toLowerCase();
    const hit = words.find(w=>w.toLowerCase()===v) || words.find(w=>w.toLowerCase().startsWith(v));
    if(hit){ select(idx.get(hit)); q.value=""; q.blur(); }
  }
});

// deep link
const urlWord = new URLSearchParams(location.search).get("word");
if (urlWord){
  const hit = words.find(w=>w.toLowerCase()===urlWord.toLowerCase());
  if (hit) select(idx.get(hit));
}

// raycast click
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let downXY=null;
renderer.domElement.addEventListener("pointerdown",e=>{downXY=[e.clientX,e.clientY];});
renderer.domElement.addEventListener("pointerup",e=>{
  if(!downXY) return;
  const dx=e.clientX-downXY[0], dy=e.clientY-downXY[1];
  downXY=null;
  if (dx*dx+dy*dy>25) return; // drag, not click
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObject(nodes);
  if(hit.length) select(hit[0].instanceId); else deselect();
});

// orbit (manual)
let rotX=0, rotY=0, zoom=260, dragging=false, lx=0, ly=0;
renderer.domElement.addEventListener("pointerdown",e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
addEventListener("pointerup",()=>dragging=false);
addEventListener("pointermove",e=>{
  if(!dragging) return;
  rotY+=(e.clientX-lx)*0.004; rotX+=(e.clientY-ly)*0.004;
  lx=e.clientX; ly=e.clientY;
});
addEventListener("wheel",e=>{ zoom=Math.max(60,Math.min(600, zoom+e.deltaY*0.25)); },{passive:true});

function tick(){
  requestAnimationFrame(tick);
  if(!dragging) rotY+=0.0006; // slow auto-rotate
  camera.position.set(Math.sin(rotY)*zoom, Math.sin(rotX)*zoom, Math.cos(rotY)*Math.cos(rotX)*zoom);
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
tick();
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
