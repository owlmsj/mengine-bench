<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mount Fuji, Chureito Pagoda and Cherry Blossoms - low poly dusk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2a55; }
  canvas { display: block; }
  #caption {
    position: fixed; left: 18px; bottom: 14px; color: #fff3f0; font: 13px/1.4 system-ui, sans-serif;
    letter-spacing: .08em; text-shadow: 0 1px 6px rgba(60,20,60,.7); opacity: .85; pointer-events: none;
  }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="caption">富士山 &middot; 新倉山浅間公園 &middot; Chureito Pagoda</div>
<script type="module">
import * as THREE from 'three';

// ---------- helpers ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20240407);
const clamp01 = (v) => Math.min(1, Math.max(0, v));
const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const stdMat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.95, metalness: 0, ...extra });

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const FOG_COLOR = 0xe6b3b8;
const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG_COLOR);
scene.fog = new THREE.Fog(FOG_COLOR, 30, 340);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.5, 2000);
const CAM_BASE = new THREE.Vector3(3, 8.5, 27);
const CAM_TARGET = new THREE.Vector3(-0.5, 10.5, -60);
camera.position.copy(CAM_BASE);
camera.lookAt(CAM_TARGET);

// ---------- sky ----------
const SUN_DIR = new THREE.Vector3(-0.42, 0.045, -1).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: {
    uTop: { value: new THREE.Color(0x30306e) },
    uMid: { value: new THREE.Color(0xd2799f) },
    uHorizon: { value: new THREE.Color(0xf7c4aa) },
    uSun: { value: new THREE.Color(0xffd29a) },
    uSunDir: { value: SUN_DIR },
  },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform vec3 uTop, uMid, uHorizon, uSun, uSunDir; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir); float h = max(d.y, 0.0);
      vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.16, h));
      col = mix(col, uTop, smoothstep(0.12, 0.65, h));
      float s = max(dot(d, uSunDir), 0.0);
      col += uSun * (pow(s, 400.0) * 2.0 + pow(s, 24.0) * 0.45 + pow(s, 4.0) * 0.12);
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat);
sky.renderOrder = -10;
scene.add(sky);

// stars near the top of the dusk sky
{
  const n = 220, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, e = 0.45 + rnd() * 0.55 * 1.0;
    const el = Math.asin(e), r = 850;
    pos[i * 3] = Math.cos(a) * Math.cos(el) * r;
    pos[i * 3 + 1] = Math.sin(el) * r;
    pos[i * 3 + 2] = Math.sin(a) * Math.cos(el) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xfff1f5, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0.7, fog: false, depthWrite: false }));
  scene.add(stars);
}

// dusk cloud streaks
const skyClouds = new THREE.Group();
{
  const cols = [0xffa59c, 0xf08fa8, 0xffc3a4, 0xc57ab0];
  for (let i = 0; i < 14; i++) {
    const c = new THREE.Group();
    const col = cols[i % cols.length];
    const m = new THREE.MeshBasicMaterial({ color: col, fog: false, transparent: true, opacity: 0.8 });
    const parts = 3 + Math.floor(rnd() * 3);
    for (let k = 0; k < parts; k++) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(30 + rnd() * 40, 1.6 + rnd() * 1.4, 4 + rnd() * 3), m);
      b.position.set((k - parts / 2) * 26 + rnd() * 8, rnd() * 3, rnd() * 4);
      c.add(b);
    }
    c.position.set(-320 + rnd() * 640, 28 + rnd() * 70, -330 - rnd() * 60);
    skyClouds.add(c);
  }
  scene.add(skyClouds);
}

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xffc4d4, 0x4a4468, 1.35));
const sunLight = new THREE.DirectionalLight(0xffa86a, 2.4);
sunLight.position.set(-60, 22, -90);
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0xffd8e4, 1.1);
fillLight.position.set(30, 40, 60);
scene.add(fillLight);

// ---------- terrain ----------
const PAGODA_X = -3.5, PAGODA_Z = 6, PAGODA_Y = 3;
function valueNoise(x, z) {
  return Math.sin(x * 1.7 + Math.sin(z * 1.3)) * 0.5 + Math.sin(z * 2.1 - x * 0.8) * 0.5;
}
function terrainH(x, z) {
  let h = 3 + valueNoise(x * 0.18, z * 0.18) * 0.9;
  h -= 11 * smooth(4, -22, z);                      // valley
  h += 9.5 * smooth(-36, -78, z);                   // far shore
  const side = Math.max(0, Math.abs(x) - 17);
  h += side * side * 0.028 * smooth(-30, 5, z);     // framing slopes
  const d = Math.hypot(x - PAGODA_X, z - PAGODA_Z);
  const w = smooth(10, 5.5, d);
  return mix(h, PAGODA_Y, w);                       // flat platform for the pagoda
}
{
  const g = new THREE.PlaneGeometry(190, 140, 95, 70);
  g.rotateX(-Math.PI / 2);
  g.translate(0, 0, -25);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terrainH(p.getX(i), p.getZ(i)));
  const ng = g.toNonIndexed();
  const q = ng.attributes.position;
  const col = new Float32Array(q.count * 3);
  const cLow = new THREE.Color(0x8c8f68), cGrass = new THREE.Color(0x58783d), cDark = new THREE.Color(0x3b5a38), c = new THREE.Color();
  for (let f = 0; f < q.count; f += 3) {
    const cx = (q.getX(f) + q.getX(f + 1) + q.getX(f + 2)) / 3;
    const cy = (q.getY(f) + q.getY(f + 1) + q.getY(f + 2)) / 3;
    const cz = (q.getZ(f) + q.getZ(f + 1) + q.getZ(f + 2)) / 3;
    c.copy(cGrass).lerp(cDark, clamp01(valueNoise(cx * 0.3, cz * 0.3) * 0.5 + 0.5));
    c.lerp(cLow, smooth(-2, -7, cy));
    const j = 0.9 + rnd() * 0.2;
    c.multiplyScalar(j);
    for (let k = 0; k < 3; k++) { col[(f + k) * 3] = c.r; col[(f + k) * 3 + 1] = c.g; col[(f + k) * 3 + 2] = c.b; }
  }
  ng.setAttribute('color', new THREE.BufferAttribute(col, 3));
  ng.computeVertexNormals();
  scene.add(new THREE.Mesh(ng, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1 })));

  // lake in the valley
  const water = new THREE.Mesh(new THREE.PlaneGeometry(260, 140),
    new THREE.MeshLambertMaterial({ color: 0xc995b8, emissive: 0x6a4a7c }));
  water.rotation.x = -Math.PI / 2;
  water.position.set(0, -6.4, -55);
  scene.add(water);
}

// ---------- Mount Fuji ----------
const fujiGroup = new THREE.Group();
{
  const H = 64, R0 = 98, RT = 6;
  const g = new THREE.CylinderGeometry(RT, R0, H, 24, 14, true);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = (y + H / 2) / H, a = Math.atan2(z, x);
    const n = Math.sin(a * 3 + t * 5) * 0.5 + Math.sin(a * 7 - t * 9 + 1.3) * 0.5;
    const r = (RT + (R0 - RT) * Math.pow(1 - t, 1.8)) * (1 + 0.045 * n * (1 - 0.5 * t));
    p.setXYZ(i, Math.cos(a) * r, y + n * 0.9 * t * (1 - t) * 2, Math.sin(a) * r);
  }
  const ng = g.toNonIndexed();
  const q = ng.attributes.position;
  const col = new Float32Array(q.count * 3);
  const cBase = new THREE.Color(0x4a5a74), cMid = new THREE.Color(0x77709a), cHigh = new THREE.Color(0x8a7fa8);
  const snowA = new THREE.Color(0xfbf1f2), snowB = new THREE.Color(0xd9d0ea), c = new THREE.Color();
  for (let f = 0; f < q.count; f += 3) {
    let cx = 0, cy = 0, cz = 0;
    for (let k = 0; k < 3; k++) { cx += q.getX(f + k); cy += q.getY(f + k); cz += q.getZ(f + k); }
    cx /= 3; cy /= 3; cz /= 3;
    const t = (cy + H / 2) / H, a = Math.atan2(cz, cx);
    const gully = Math.pow(Math.max(0, Math.sin(a * 17 + 0.7)), 2) * 0.12;
    const snowLine = 0.56 + 0.06 * Math.sin(a * 5 + 0.5) + 0.04 * Math.sin(a * 13) - gully;
    if (t > snowLine) {
      c.copy(snowA).lerp(snowB, clamp01(0.5 + 0.5 * Math.sin(a * 23 + t * 40)) * 0.55);
    } else {
      c.copy(cBase).lerp(cMid, smooth(0.0, 0.45, t)).lerp(cHigh, smooth(0.4, 0.6, t));
      c.multiplyScalar(0.92 + rnd() * 0.16);
    }
    for (let k = 0; k < 3; k++) { col[(f + k) * 3] = c.r; col[(f + k) * 3 + 1] = c.g; col[(f + k) * 3 + 2] = c.b; }
  }
  ng.setAttribute('color', new THREE.BufferAttribute(col, 3));
  ng.computeVertexNormals();
  fujiGroup.add(new THREE.Mesh(ng, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 1, side: THREE.DoubleSide })));
  const crater = new THREE.Mesh(new THREE.CircleGeometry(RT, 24).rotateX(-Math.PI / 2), stdMat(0xb9aec6, { side: THREE.DoubleSide }));
  crater.position.y = H / 2 - 0.4;
  fujiGroup.add(crater);
  fujiGroup.position.set(10, -7 + H / 2, -178);
  scene.add(fujiGroup);
}

// foothills
{
  const nearC = new THREE.Color(0x5c6a86), farC = new THREE.Color(0x7c7aa0);
  for (let i = 0; i < 20; i++) {
    const x = -260 + i * 27 + (rnd() - 0.5) * 20;
    const z = -90 - rnd() * 70;
    const edge = clamp01(Math.abs(x) / 200);
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1),
      stdMat(nearC.clone().lerp(farC, rnd()), {}));
    m.scale.set(38 + rnd() * 28, 7 + rnd() * 6 + 20 * edge, 28 + rnd() * 16);
    m.position.set(x, -9, z);
    m.rotation.y = rnd() * 3;
    scene.add(m);
  }
}

// drifting mist bands
const mists = [];
{
  const mm = new THREE.MeshBasicMaterial({ color: 0xf6d0d2, transparent: true, opacity: 0.38, depthWrite: false });
  for (let i = 0; i < 9; i++) {
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), mm);
    m.scale.set(40 + rnd() * 30, 1.8 + rnd() * 1.5, 7 + rnd() * 5);
    m.position.set(-160 + rnd() * 320, -2 + rnd() * 14, -75 - rnd() * 70);
    m.userData.speed = 0.5 + rnd() * 0.9;
    mists.push(m); scene.add(m);
  }
}

// ---------- Chureito pagoda ----------
const lanternLights = [];
const pagoda = new THREE.Group();
{
  const red = stdMat(0xcf3523), redDark = stdMat(0x8c2316), roofM = stdMat(0x3a3846);
  const goldM = stdMat(0xe0b040, { roughness: 0.5, metalness: 0.3 }), stone = stdMat(0x948f9a);
  const glowM = new THREE.MeshBasicMaterial({ color: 0xffcf7a });
  const box = (w, h, d, m, x, y, z) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); pagoda.add(b); return b; };

  box(7.2, 0.5, 7.2, stone, 0, 0.25, 0);
  box(5.8, 0.5, 5.8, stone, 0, 0.75, 0);
  let y = 1.0;
  for (let i = 0; i < 5; i++) {
    const w = 4.0 * Math.pow(0.84, i), bh = 1.25 - 0.05 * i, rh = 1.0;
    box(w, bh, w, red, 0, y + bh / 2, 0);
    const o = w / 2;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(0.2, bh, 0.2, redDark, sx * o, y + bh / 2, sz * o);
    // glowing lattice windows on all four faces
    for (const s of [-1, 1]) {
      box(w * 0.42, bh * 0.5, 0.06, glowM, 0, y + bh / 2, s * (o + 0.02));
      box(0.06, bh * 0.5, w * 0.42, glowM, s * (o + 0.02), y + bh / 2, 0);
    }
    box(w * 1.1, 0.15, w * 1.1, redDark, 0, y + bh + 0.075, 0);
    const rad = (w * 1.6 / 2) * Math.SQRT2;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(rad, rh, 4, 1), roofM);
    roof.rotation.y = Math.PI / 4;
    roof.position.y = y + bh + 0.15 + rh / 2;
    pagoda.add(roof);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.55, 4), roofM);
      tip.position.set(sx * w * 0.8, y + bh + 0.3, sz * w * 0.8);
      pagoda.add(tip);
    }
    y += bh + 0.15 + rh * 0.5;
  }
  // finial
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.11, 3.0, 6), goldM);
  pole.position.y = y + 1.1; pagoda.add(pole);
  for (let k = 0; k < 5; k++) {
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.34 - k * 0.04, 0.34 - k * 0.04, 0.09, 8), goldM);
    ring.position.y = y + 0.7 + k * 0.32; pagoda.add(ring);
  }
  const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(0.2, 0), goldM);
  ball.position.y = y + 2.7; pagoda.add(ball);

  pagoda.position.set(PAGODA_X, PAGODA_Y - 0.2, PAGODA_Z);
  pagoda.scale.setScalar(0.55);
  scene.add(pagoda);

  const warm = new THREE.PointLight(0xffb070, 22, 16, 1.6);
  warm.position.set(PAGODA_X, PAGODA_Y + 3.5, PAGODA_Z + 3);
  scene.add(warm); lanternLights.push(warm);

  // stone lanterns and fence around the platform
  const lanternM = stdMat(0xa7a2a8);
  for (const sx of [-1, 1]) {
    const lx = PAGODA_X + sx * 3.2, lz = PAGODA_Z + 3.6;
    const base = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 0.3), lanternM); base.position.set(lx, PAGODA_Y + 0.35, lz);
    const top = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.5), new THREE.MeshBasicMaterial({ color: 0xffc47a })); top.position.set(lx, PAGODA_Y + 0.88, lz);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.3, 4), lanternM); cap.rotation.y = Math.PI / 4; cap.position.set(lx, PAGODA_Y + 1.2, lz);
    scene.add(base, top, cap);
  }
  const fenceM = stdMat(0xb52c1e);
  for (let i = -4; i <= 4; i++) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.8, 0.12), fenceM);
    post.position.set(PAGODA_X + i * 0.8, PAGODA_Y + 0.4, PAGODA_Z + 5.2);
    scene.add(post);
  }
  const rail = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.1, 0.1), fenceM);
  rail.position.set(PAGODA_X, PAGODA_Y + 0.65, PAGODA_Z + 5.2); scene.add(rail);
}

// ---------- trees ----------
const blossomPalette = [0xf7b6cc, 0xf2a0bd, 0xffd0de, 0xe88aab, 0xffc2d4].map((c) => stdMat(c, { emissive: 0x6a2038, emissiveIntensity: 0.18 }));
const trunkM = stdMat(0x4a3328);
const swayTrees = [];
function addCherry(x, z, s) {
  const grp = new THREE.Group();
  const th = 2.4 * s;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14 * s, 0.3 * s, th, 6), trunkM);
  trunk.position.y = th / 2; grp.add(trunk);
  const nb = 2 + Math.floor(rnd() * 2);
  for (let i = 0; i < nb; i++) {
    const a = rnd() * Math.PI * 2;
    const br = new THREE.Mesh(new THREE.CylinderGeometry(0.06 * s, 0.12 * s, 1.8 * s, 5), trunkM);
    br.position.set(Math.cos(a) * 0.5 * s, th * 0.85, Math.sin(a) * 0.5 * s);
    br.rotation.set(Math.sin(a) * 0.7, 0, -Math.cos(a) * 0.7);
    grp.add(br);
  }
  const blobs = 6 + Math.floor(rnd() * 3);
  for (let i = 0; i < blobs; i++) {
    const r = (1.0 + rnd() * 0.9) * s;
    const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), blossomPalette[Math.floor(rnd() * blossomPalette.length)]);
    const a = rnd() * Math.PI * 2, d = rnd() * 1.6 * s;
    b.position.set(Math.cos(a) * d, th + (rnd() - 0.2) * 1.3 * s, Math.sin(a) * d);
    b.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
    grp.add(b);
  }
  grp.position.set(x, terrainH(x, z) - 0.15, z);
  grp.userData.phase = rnd() * 6.28;
  swayTrees.push(grp);
  scene.add(grp);
}
function addCedar(x, z, s) {
  const grp = new THREE.Group();
  const m = stdMat(new THREE.Color(0x2c4a3a).lerp(new THREE.Color(0x3f6044), rnd()));
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.18 * s, 1.2 * s, 5), trunkM);
  tr.position.y = 0.6 * s; grp.add(tr);
  for (let i = 0; i < 4; i++) {
    const c = new THREE.Mesh(new THREE.ConeGeometry((1.5 - i * 0.3) * s, 2.0 * s, 6), m);
    c.position.y = (1.6 + i * 1.2) * s; grp.add(c);
  }
  grp.position.set(x, terrainH(x, z) - 0.1, z);
  scene.add(grp);
}
const nearPagoda = (x, z, r) => Math.hypot(x - PAGODA_X, z - PAGODA_Z) < r;
// hand-placed framing trees
[[-12, 19, 1.7], [11.5, 17, 1.6], [-20, 11, 1.8], [17, 8, 1.7], [-9, -1, 1.3], [7, -2, 1.2], [-26, 20, 1.9], [24, 19, 1.9]]
  .forEach(([x, z, s]) => addCherry(x, z, s));
// scattered cherry trees
for (let i = 0; i < 38; i++) {
  const x = (rnd() - 0.5) * 90, z = 22 - rnd() * 48;
  if (nearPagoda(x, z, 9)) continue;
  if (Math.abs(x) < 6 && z > 12) continue;
  addCherry(x, z, 0.8 + rnd() * 0.7);
}
// cedars
for (let i = 0; i < 46; i++) {
  const sideSign = rnd() < 0.5 ? -1 : 1;
  const x = sideSign * (10 + rnd() * 40), z = 20 - rnd() * 46;
  if (nearPagoda(x, z, 9)) continue;
  addCedar(x, z, 1.3 + rnd() * 1.4);
}
// a few houses on the far shore (lit windows)
{
  const roofM = stdMat(0x4b4258), wallM = stdMat(0xe8d6c4), winM = new THREE.MeshBasicMaterial({ color: 0xffd18a });
  for (let i = 0; i < 16; i++) {
    const x = -34 + rnd() * 68, z = -40 - rnd() * 14, y = terrainH(x, z);
    if (y < -5.8) continue;
    const g = new THREE.Group();
    const b = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 1.6), wallM); b.position.y = 0.6;
    const r = new THREE.Mesh(new THREE.ConeGeometry(1.6, 0.9, 4), roofM); r.rotation.y = Math.PI / 4; r.position.y = 1.65;
    const w = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.05), winM); w.position.set(0, 0.7, 0.82);
    g.add(b, r, w); g.position.set(x, y, z); scene.add(g);
  }
}

// ---------- falling petals ----------
const PETALS = 700;
const petalPos = new Float32Array(PETALS * 3), petalVel = [];
for (let i = 0; i < PETALS; i++) {
  petalPos[i * 3] = (rnd() - 0.5) * 60;
  petalPos[i * 3 + 1] = rnd() * 22;
  petalPos[i * 3 + 2] = 28 - rnd() * 40;
  petalVel.push({ fall: 0.5 + rnd() * 0.7, sway: 0.5 + rnd() * 1.5, ph: rnd() * 6.28 });
}
const petalGeo = new THREE.BufferGeometry();
petalGeo.setAttribute('position', new THREE.BufferAttribute(petalPos, 3));
scene.add(new THREE.Points(petalGeo, new THREE.PointsMaterial({ color: 0xffc6d9, size: 0.22, sizeAttenuation: true, transparent: true, opacity: 0.95, depthWrite: false })));

// ---------- animation ----------
const clock = new THREE.Clock();
let lastT = 0;
function frame() {
  // getElapsedTime() consumes the delta, so derive dt from successive t values
  const t = clock.getElapsedTime(), dt = Math.min(Math.max(t - lastT, 0.001), 0.05);
  lastT = t;
  // slow camera drift, always framing the same composition
  camera.position.set(CAM_BASE.x + Math.sin(t * 0.12) * 1.6, CAM_BASE.y + Math.sin(t * 0.17) * 0.35, CAM_BASE.z + Math.sin(t * 0.09) * 0.8);
  camera.lookAt(CAM_TARGET);
  sky.position.copy(camera.position);

  skyClouds.children.forEach((c, i) => { c.position.x += 0.6 * dt * (1 + (i % 3) * 0.3); if (c.position.x > 380) c.position.x = -380; });
  mists.forEach((m) => { m.position.x += m.userData.speed * dt * 1.5; if (m.position.x > 180) m.position.x = -180; });
  swayTrees.forEach((g) => { g.rotation.z = Math.sin(t * 0.8 + g.userData.phase) * 0.015; g.rotation.x = Math.cos(t * 0.6 + g.userData.phase) * 0.01; });
  lanternLights.forEach((l) => { l.intensity = 22 + Math.sin(t * 7) * 1.5 + Math.sin(t * 13.3) * 0.8; });

  const pa = petalGeo.attributes.position;
  for (let i = 0; i < PETALS; i++) {
    const v = petalVel[i];
    let x = pa.getX(i), y = pa.getY(i), z = pa.getZ(i);
    y -= v.fall * 0.016 * 60 * dt * 0.6;
    x += Math.sin(t * v.sway + v.ph) * 0.012 + 0.012;
    z += Math.cos(t * v.sway * 0.7 + v.ph) * 0.006;
    if (y < 0.5) { y = 20 + rnd() * 4; x = (rnd() - 0.5) * 60; z = 28 - rnd() * 40; }
    if (x > 32) x = -32;
    pa.setXYZ(i, x, y, z);
  }
  pa.needsUpdate = true;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  // keep the pagoda and Fuji in frame on narrow screens
  camera.fov = camera.aspect < 1 ? 46 + (1 - camera.aspect) * 30 : 46;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
window.dispatchEvent(new Event('resize'));
</script>
