const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function results(){matches.replaceChildren();let q=fold(query.value);if(!q)return;let hits=words.filter(w=>fold(w).includes(q)).sort((a,b)=>Number(fold(b).startsWith(q))-Number(fold(a).startsWith(q)));for(let w of hits){let a=document.createElement('a');a.href=link(w);a.textContent=w;a.onclick=e=>{e.preventDefault();selectWord(w,true);query.blur()};matches.append(a)}if(!hits.length)matches.innerHTML='<span>Nenhuma palavra encontrada.</span>'}
query.oninput=results;query.onfocus=results;query.onkeydown=e=>{if(e.key==='Enter')matches.querySelector('a')?.click();if(e.key==='ArrowDown'){e.preventDefault();matches.querySelector('a')?.focus()}};document.onkeydown=e=>{if(e.key==='/'&&document.activeElement!==query){e.preventDefault();query.focus()}if(e.key==='Escape'){matches.replaceChildren();query.blur()}};document.addEventListener('click',e=>{if(!e.target.closest('.search'))matches.replaceChildren()});function restore(){let q=new URLSearchParams(location.search).get('word')||'saudade';selectWord(words.find(w=>fold(w)===fold(q))||'saudade',false)}window.onpopstate=restore;
