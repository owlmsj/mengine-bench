function surf() {
  const ink = '#173c58', deep = '#214d6c', denim = '#316582';
  const blue = '#4d8498', aqua = '#97c2c2', mist = '#c9d9c9';
  const cream = '#f5edd6', chalk = '#fff6e1';
  function profile(nodes, x) {
    let i = 1;
    while (i < nodes.length - 1 && x > nodes[i][0]) i++;
    const a = nodes[i - 1], b = nodes[i];
    return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
  }
  function swell(nodes, floor, z, bands, spacing, phase) {
    const xs = nodes.map(p => p[0]);
    for (let x = nodes[0][0] + 13; x < nodes[nodes.length - 1][0]; x += spacing * (.7 + rand() * .6)) xs.push(x);
    xs.sort((a,b) => a-b);
    const columns = xs.map(x => {
      const top = profile(nodes,x);
      return bands.map(([fraction],j) => {
        const wiggle = Math.sin(fraction * Math.PI) * (6 * Math.sin(x / 61 + phase + j*.65) + 4 * Math.sin(x / 117 - j*.41));
        return [x, top + fraction * (floor - top) + wiggle, .42 * Math.sin(Math.PI*fraction) * Math.cos(x/92 + phase)];
      });
    });
    for (let i=1;i<columns.length;i++) {
      for (let j=0;j<bands.length-1;j++) {
        const a=columns[i-1][j], b=columns[i][j], c=columns[i][j+1], d=columns[i-1][j+1];
        const tone=bands[j][1], amount=.04+.085*rand();
        poly([a,b,d], mix(tone, rand()>.51?chalk:ink,amount), z);
        poly([b,c,d], mix(tone, rand()>.51?chalk:ink,amount*.8), z);
      }
    }
  }
  // Tapered woodcut strokes follow the curving face between successive ridges.
  function streaks(nodes,floor,z,num,colors) {
    for (let i=0;i<num;i++) {
      const x=nodes[0][0]+rand()*(nodes[nodes.length-1][0]-nodes[0][0]);
      const length=17+Math.pow(rand(),1.5)*96, t=.03+rand()*.76;
      const h=1+rand()*3.5, p=[];
      for(let k=0;k<5;k++) {
        const u=k/4, xx=x+u*length;
        const top=profile(nodes,xx);
        p.push([xx,top+(floor-top)*t+Math.sin(u*Math.PI)*h]);

      const tone=colors[Math.floor(rand()*colors.length)];
      for(let j=0;j<4;j++) {
        const a=p[j], b=p[j+1];
        poly([a,b,[b[0],b[1]+Math.sin((j+1)*Math.PI/4)*h],[a[0],a[1]+Math.sin(j*Math.PI/4)*h]],tone,z);
      }

  }

  swell(middle,923,40,[[0,cream],[.052,chalk],[.13,mist],[.175,cream],[.235,aqua],[.29,cream],[.36,blue],[.41,denim],[.49,ink],[.57,deep],[.64,blue],[.695,mist],[.725,cream],[.78,deep],[.88,ink],[1,deep]],35,2.4);

}

function boats() {
  const ink = "#192f43", rail = "#eed2a0", warm = "#c88b5f";
  function vessel(a, b, c, size, z, timber, crewStart, crewEnd) {
    // A quadratic sheer line keeps the long gunwales continuous around the swell.
    function frame(t) {
      const s = 1-t;
      const dx = 2*(s*(b[0]-a[0])+t*(c[0]-b[0]));
      const dy = 2*(s*(b[1]-a[1])+t*(c[1]-b[1]));
      const length = Math.hypot(dx,dy);
      return [s*s*a[0]+2*s*t*b[0]+t*t*c[0],s*s*a[1]+2*s*t*b[1]+t*t*c[1],dx/length,dy/length];
    }
    function beam(t) {return size*Math.pow(Math.max(0,Math.sin(Math.PI*t)),.72);}
    function pt(t, across) {
      const [x,y,tx,ty]=frame(t);

    }
    function ribbon(t0,t1,lo,hi,color,layer,steps) {
      const edge = [], reverse = [];

    }
    const width = n => t => beam(t)*n;

    ribbon(.004,.996,width(-.16),width(.94),timber,.05,24);
    ribbon(.015,.988,width(.66),width(.92),warm,.12,20);
    ribbon(.02,.98,width(.84),width(.96),"#9e7157",.14,19);
    for(let i=0;i<11;i++){
      let t=.06+i*.078;
      poly([pt(t,beam(t)*.64),pt(t+.069,beam(t+.069)*.64),pt(t+.041,beam(t+.041)*.91)],mix(warm,timber,.2+rand()*.6),z+.17);
    }
    ribbon(.05,.95,width(.61),width(.636),"#916e54",.2,20);
    // Recessed deck, far rail and timber thwarts.
    ribbon(.09,.94,width(-.12),width(.32),"#735b47",.24,24);
    ribbon(.12,.91,width(-.08),width(.16),"#ae9271",.26,21);
    ribbon(.025,.972,width(-.18),width(-.115),rail,.28,20);
    for(let i=0;i<18;i++) {
      const t=.14+.042*i;
      poly([pt(t,-beam(t)*.1),pt(t+.008,-beam(t)*.1),pt(t+.015,beam(t)*.27),pt(t+.003,beam(t)*.27)],i%3?"#d6bd90":"#f1dca9",z+.3);

    ribbon(coverStart+.008,coverEnd-.008,width(-.15),width(.17),"#dfc699",.33,6);
    for(let i=0;i<11;i++){
      const t=coverStart+.014+i*.018;

    // Hunched sailors face the bow, hands tucked around the inboard rail.

        poly(shape.map(([u,v])=>[x+scale*(u*tx-v*ty),y+scale*(u*ty+v*tx)]),color,z+.38+i*.011+layer);
      }

      local([[-6,-5],[-1,-11],[4,-12],[8,-9],[5,-4],[0,0]],i%3===1?"#365d76":"#244a68",.001);

      local([[-8,-8],[-10,-6],[-10,-3],[-7,-2],[-5,-5]],"#f1d7ac",.004);

function breaker() {
  const ink = "#173958", deepest = "#173e61", ocean = "#205778";
  const warm = "#fff2d3", chalk = "#f9f1d7", ice = "#c4dacf", pale = "#dee6d5";
  const draw = (p,c,z) => poly(p,c,z);
  const lerp = (a,b,t) => a+(b-a)*t;
  function curve(pts,t) {
    const s=Math.max(0,Math.min(t,1))*(pts.length-1), i=Math.min(pts.length-2,Math.floor(s)), f=s-i;
    const a=pts[Math.max(0,i-1)], b=pts[i], c=pts[i+1], d=pts[Math.min(pts.length-1,i+2)];

  const crest=[[-100,373],[6,357],[108,317],[185,282],[260,249],[324,221],[386,190],[445,173],[495,176],[527,196],[565,242]];
  const foot=[[-190,633],[-40,633],[92,641],[205,646],[326,629],[429,606],[497,608],[556,622],[615,643],[666,659],[729,677]];
  function surface(u,v) {
    const a=curve(crest,u), b=curve(foot,u), d=Math.sin(v*Math.PI);

  }
  const us=[0,.037,.082,.115,.166,.21,.247,.295,.337,.39,.44,.476,.52,.566,.60,.651,.69,.747,.785,.825,.864,.911,.949,1];
  const vs=[0,.13,.28,.47,.66,.83,1];
  const colors=["#1c496b","#205677","#295f80","#1d486a","#234c6e","#1d4365","#286384","#193e60"];
  const lattice=us.map((u,i)=>vs.map((v,j)=>surface(u+(i>0&&i<us.length-1&&j>0&&j<vs.length-1?(rand()-.5)*.025:0),v+(j>0&&j<vs.length-1?(rand()-.5)*.06:0))));
  for(let i=0;i<us.length-1;i++) {
    const c=colors[i%colors.length];
    for(let j=0;j<vs.length-1;j++) {
      const a=lattice[i][j], b=lattice[i+1][j], d=lattice[i][j+1], e=lattice[i+1][j+1];
      draw([a,b,d],mix(c,"#81a6a6",rand()*.14),20);
      draw([b,e,d],mix(c,"#0d2f52",rand()*.25),20);
    }
  }
  // Long unbroken cuts follow the folded face of the wave.
  for(let i=0;i<15;i++) {
    const u=.035+i*.065, w=.003+rand()*.012, start=.02+rand()*.22, end=.68+rand()*.3;
    const c=i%3===0?"#5a93a1":i%3===1?"#337793":"#183d60";
    let a=surface(u,start), b=a;
    for(let j=1;j<=9;j++){
      const k=j/9,v=lerp(start,end,k), q=u+Math.sin(k*5+i)*.007;
      const h=surface(q,v), l=surface(q+w*Math.sin(k*Math.PI),v);
      draw([a,b,l,h],c,22); a=h;b=l;
    }
  }
  const outer=[[-110,358],[-22,354],[69,329],[142,267],[208,194],[272,143],[338,105],[404,85],[468,76],[515,81],[560,103],[605,132],[635,160],[647,190],[676,211],[708,226],[739,252],[752,284],[741,303],[719,305],[687,292],[657,277],[625,263],[592,253],[563,244]];
  const underside=[[-110,377],[-22,367],[69,336],[142,304],[208,273],[272,248],[308,227],[348,205],[387,187],[424,174],[461,168],[488,174],[513,184],[533,201],[549,222],[568,242],[594,264],[620,281],[649,306],[670,328],[690,338],[711,350],[727,357],[705,317],[563,244]];
  // A raised, folded snow-white mantle, drawn in irregular triangular planes.
  const rows=[];
  for(let i=0;i<outer.length;i++){
    const a=outer[i], b=underside[i], t=.34+rand()*.28;
    rows.push([a,[lerp(a[0],b[0],t),lerp(a[1],b[1],t),2+rand()*2],b]);
  }
  for(let i=0;i<rows.length-1;i++){
    const a=rows[i],b=rows[i+1];
    for(let j=0;j<2;j++){
      const c=j===0?warm:chalk;
      draw([a[j],b[j],a[j+1]],mix(c,j===0?"#d7d9be":ice,rand()*(j===0?.29:.62)),24);
      draw([b[j],b[j+1],a[j+1]],mix(c,ice,rand()*.66),24);
    }
  }
  function shard(x,y,w,h,c,z=28) {
    draw([[x-w*.44,y-h*.2],[x+w*.08,y-h*.57],[x+w*.56,y-h*.14],[x+w*.25,y+h*.29],[x-w*.42,y+h*.48]],c,z);
  }
  // Each foam finger has an elbow, projecting knuckle and sharply returning tip.
  function claw(x,y,s,angle,shade=ice) {
    const ca=Math.cos(angle),sa=Math.sin(angle);

    const p=[[-20,-4],[-10,-9],[0,-10],[9,-6],[16,1],[20,9],[18,16],[13,20],[13,14],[11,9],[5,6],[0,6],[-5,10],[-10,7],[-8,2],[-14,2],[-19,6]];

    draw(a.map(([px,py])=>[px+1.2*s,py+2.7*s]),ink,25);
    draw(a,chalk,26);
    draw([[-20,-4],[-10,-9],[0,-10],[9,-6],[1,-4],[-8,-3],[-14,2]].map(at),shade,26.1);
    draw([[9,-6],[16,1],[20,9],[18,16],[13,20],[16,11]].map(at),pale,26.2);
  }
  for(let i=0;i<18;i++){
    const u=.28+i*.04, p=curve(crest,u);
    claw(p[0],p[1]+2,.48+rand()*.47,-.94+rand()*.42);
