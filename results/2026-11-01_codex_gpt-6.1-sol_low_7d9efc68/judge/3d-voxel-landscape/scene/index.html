<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuji · An evening in spring</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#b8b0c4;overflow:hidden;font-family:Georgia,'Times New Roman',serif;color:#fff7ec}canvas{display:block} .caption{position:absolute;left:5vw;bottom:6vh;pointer-events:none;text-shadow:0 2px 18px #463e6580}.eyebrow{font-family:Arial,sans-serif;font-size:10px;letter-spacing:5px;text-transform:uppercase;opacity:.8}h1{font-size:clamp(30px,4vw,56px);font-weight:400;letter-spacing:2px;margin:12px 0} .sub{font-size:13px;letter-spacing:2px;opacity:.8}.seal{position:absolute;right:4vw;top:5vh;border:1px solid #fff5;padding:14px 10px;writing-mode:vertical-rl;letter-spacing:6px;font-size:15px;line-height:1.7;pointer-events:none}.note{position:absolute;right:4vw;bottom:4vh;font:9px Arial,sans-serif;letter-spacing:2px;opacity:.6;pointer-events:none}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
  <div class="caption"><div class="eyebrow">Thirty-six moments of spring</div><h1>Under the blossom sky</h1><div class="sub">Chureito · Fujiyoshida · Japan</div></div>
  <div class="seal">富士山<br>春の夕暮れ</div><div class="note">A PROCEDURAL LANDSCAPE · MOVE TO EXPLORE</div>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#c1b5c9');
    scene.fog = new THREE.FogExp2('#b9afc5', .0065);
    const camera = new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.1,700);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.22;
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight('#ffe0dc','#5d6274',2.5));
    const sun=new THREE.DirectionalLight('#ffdab7',3.1);sun.position.set(-45,70,35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:65,bottom:-45,near:1,far:200});sun.shadow.bias=-.0005;scene.add(sun);
    let seed=851;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
    const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:1,flatShading:true});
    const red=mat('#ae302f'),redLight=mat('#d64c3b'),darkRed=mat('#77292b'),cream=mat('#f6dab3'),roofMat=mat('#303e48'),roofEdge=mat('#59636a'),wood=mat('#59414a'),stone=mat('#8a8987');
    function mesh(geo,material,parent,x=0,y=0,z=0){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
    function box(parent,w,h,d,x,y,z,material){return mesh(new THREE.BoxGeometry(w,h,d),material,parent,x,y,z)}
    function rod(parent,a,b,r,material,r2=r){const d=new THREE.Vector3().subVectors(b,a);const m=mesh(new THREE.CylinderGeometry(r2,r,d.length,7),material,parent);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m;}
    // A shader sky gives the horizon a warm, pale glow without image textures.
    const sky=mesh(new THREE.SphereGeometry(450,32,24),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:{},vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 vP;void main(){float h=normalize(vP).y;vec3 lo=vec3(.91,.71,.64);vec3 hi=vec3(.36,.40,.59);gl_FragColor=vec4(mix(lo,hi,smoothstep(-.08,.8,h)),1.);}'}),scene);sky.castShadow=false;
    const sunDisc=mesh(new THREE.CircleGeometry(6,64),new THREE.MeshBasicMaterial({color:'#ffe6bf',fog:false}),scene,-70,50,-200);sunDisc.lookAt(40,30,80);
    // Fuji's radial rings share vertices, with a naturally irregular snow line.
    const mountain=new THREE.Group();mountain.position.set(-25,-5,-130);scene.add(mountain);
    const n=64, rings=[{y:0,r:65},{y:9,r:48},{y:21,r:33},{y:34,r:21},{y:43,r:13},{y:49,r:8},{y:50,r:6.5}];
    const verts=[],cols=[],indices=[];const rockColors=['#686c86','#77768e','#888298','#9590a2'];
    for(let j=0;j<rings.length;j++)for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let rr=rings[j].r*(1+.025*Math.sin(a*7)+.015*Math.cos(a*13));let y=rings[j].y+(j===0?0:Math.sin(a*5+j)*.5);verts.push(Math.cos(a)*rr,y,Math.sin(a)*rr);let c=new THREE.Color(j>=4?'#f4e7e5':rockColors[Math.min(j,3)]);c.multiplyScalar(.9+.14*rand());cols.push(c.r,c.g,c.b);}
    for(let j=0;j<rings.length-1;j++)for(let i=0;i<n;i++){let a=j*n+i,b=j*n+(i+1)%n,c=(j+1)*n+i,d=(j+1)*n+(i+1)%n;indices.push(a,c,b,b,c,d)}
    const mg=new THREE.BufferGeometry();mg.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));mg.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));mg.setIndex(indices);mg.computeVertexNormals();mesh(mg,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1}),mountain);
    mesh(new THREE.CylinderGeometry(6.5,6.5,.2,n),mat('#eee0e1'),mountain,0,50,0);
    // Snow fingers descend over the slopes, separate irregular triangular facets.
    for(let i=0;i<28;i++){let a=i/28*Math.PI*2;let b=a+.12;let low=29+rand()*9;let r=21+(34-low)*1.1;let p=[Math.cos(a)*13,43,Math.sin(a)*13,Math.cos(b)*13,43,Math.sin(b)*13,Math.cos(a+.05)*r,low,Math.sin(a+.05)*r];const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.computeVertexNormals();mesh(g,mat(i%2?'#e6dde0':'#f0e4e4'),mountain);}
    // Layered foothills and a tiny suggestion of the valley town.
    const hills=['#858a9e','#757f91','#657a83'];
    for(let layer=0;layer<3;layer++){const g=new THREE.BufferGeometry(),p=[],ix=[];for(let i=0;i<34;i++){let x=-160+i*10,y=3+Math.sin(i*.52+layer*2)*4+rand()*3;p.push(x,y,-92+layer*23,x,-12,-92+layer*23);if(i<33){let k=i*2;ix.push(k,k+1,k+2,k+1,k+3,k+2)}}g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setIndex(ix);g.computeVertexNormals();mesh(g,mat(hills[layer]),scene);}
    const valley=new THREE.Group();scene.add(valley);for(let i=0;i<200;i++){let x=-85+rand()*170,z=-65+rand()*28;box(valley,1+rand()*2,.5+rand()*1.6,1+rand()*2,x,-1,z,mat(['#a9a3ab','#beb4b2','#8c939f'][i%3]));}
    const ground=mesh(new THREE.CylinderGeometry(75,80,8,64),mat('#65796a'),scene,0,-5,25);
    box(scene,41,.65,26,13,-.45,12,stone);
    // Terrace retaining wall and broad approach steps.
    box(scene,42,3,1,13,-1.6,25,mat('#727a78'));
    for(let i=0;i<7;i++)box(scene,11,.4,1.2,17,-2.6+i*.4,33-i*1.2,mat(i%2?'#a2a09b':'#b2aaa0'));
    for(let i=0;i<20;i++){box(scene,.45,1.5,.45,-7+i*2.05,.6,24,stone);if(i<19)box(scene,2.05,.25,.3,-6+i*2.05,1.2,24,stone);}
    // Chureito: five distinct diminishing stories and sweeping hip roofs.
    const pagoda=new THREE.Group();pagoda.position.set(18,0,8);pagoda.rotation.y=-.12;scene.add(pagoda);
    box(pagoda,14,1,13,0,.3,0,stone);box(pagoda,12,.6,11,0,1,0,cream);
    function roof(w,d,y){const positions=[],idx=[];const levels=[{w:w*.39,d:d*.39,y:y+2},{w:w*.48,d:d*.48,y:y+.5},{w:w*.59,d:d*.59,y:y+.02},{w:w*.62,d:d*.62,y:y+.36}];for(const l of levels)positions.push(-l.w,l.y,-l.d,l.w,l.y,-l.d,l.w,l.y,l.d,-l.w,l.y,l.d);for(let j=0;j<3;j++)for(let i=0;i<4;i++){let a=j*4+i,b=j*4+(i+1)%4;idx.push(a,b,a+4,b,b+4,a+4)}idx.push(0,2,1,0,3,2);const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(idx);g.computeVertexNormals();mesh(g,roofMat,pagoda);for(let side=0;side<4;side++){const a=side*Math.PI/2,b=a+Math.PI/2;const corners=[[-w*.62,-d*.62],[w*.62,-d*.62],[w*.62,d*.62],[-w*.62,d*.62]];const c=corners[side],e=corners[(side+1)%4];rod(pagoda,new THREE.Vector3(c[0],y+.36,c[1]),new THREE.Vector3(e[0],y+.36,e[1]),.10,roofEdge);}}
    for(let level=0;level<5;level++){const w=10-level*1.25,d=8.8-level*1.1,y=1.35+level*4.25;box(pagoda,w,2.8,d,0,y+1.4,0,red);box(pagoda,w+.7,.3,d+.7,0,y,0,darkRed);box(pagoda,w+.5,.25,d+.5,0,y+2.6,0,cream);
      for(let side of [-1,1]){for(let j=-1;j<=1;j++){box(pagoda,w*.19,1.45,.1,j*w*.28,y+1.5,side*(d/2+.06),cream);box(pagoda,.12,1.6,.18,j*w*.28,y+1.5,side*(d/2+.14),redLight)}for(let j=0;j<5;j++)box(pagoda,.21,3,.23,-w/2+j*w/4,y+1.4,side*(d/2+.25),redLight);}
      for(let side of [-1,1]){box(pagoda,.12,1.45,d*.55,side*(w/2+.07),y+1.5,0,cream);for(let j=0;j<4;j++)box(pagoda,.22,3,.22,side*(w/2+.2),y+1.4,-d/2+j*d/3,redLight);}
      const bw=w+1.8,bd=d+1.8;box(pagoda,bw,.25,bd,0,y+.2,0,redLight);for(let s of [-1,1]){box(pagoda,bw,.14,.14,0,y+1,s*bd/2,redLight);box(pagoda,.14,.14,bd,s*bw/2,y+1,0,redLight);for(let j=0;j<11;j++)box(pagoda,.10,.8,.1,-bw/2+j*bw/10,y+.6,s*bd/2,redLight);for(let j=0;j<8;j++)box(pagoda,.10,.8,.1,s*bw/2,y+.6,-bd/2+j*bd/7,redLight);}
      roof(w+2.2,d+2.2,y+3);
    }
    const gold=mat('#bda573');rod(pagoda,new THREE.Vector3(0,23,0),new THREE.Vector3(0,30.4,0),.11,gold);
    for(let i=0;i<9;i++){const torus=mesh(new THREE.TorusGeometry(.7-i*.045,.075,5,16),gold,pagoda,0,25+i*.47,0);torus.rotation.x=Math.PI/2;}mesh(new THREE.SphereGeometry(.28,8,6),gold,pagoda,0,30.4,0);
    // Branching trees with clusters of faceted flowers.
    const blossoms=['#f5b6cb','#f4cbd8','#e99bb7','#ffe0e4'].map(mat),bloomGeo=new THREE.IcosahedronGeometry(1,1);const treeGroups=[];
    function tree(x,z,scale=1){const t=new THREE.Group();t.position.set(x,-.1,z);t.scale.setScalar(scale);scene.add(t);treeGroups.push(t);rod(t,new THREE.Vector3(0,0,0),new THREE.Vector3(.3,7,0),.55,wood,.25);for(let b=0;b<7;b++){let a=b*2.4,h=4+rand()*3;let end=new THREE.Vector3(Math.cos(a)*(3+rand()*2),h+2,Math.sin(a)*3);rod(t,new THREE.Vector3(.15,3+b*.5,0),end,.22,wood,.07);for(let k=0;k<6;k++){let p=end.clone().add(new THREE.Vector3((rand()-.5)*4,rand()*2-1,(rand()-.5)*3));if(k<2)rod(t,end,p,.07,wood,.03);const bloom=mesh(bloomGeo,blossoms[Math.floor(rand()*4)],t,p.x,p.y,p.z);bloom.scale.set(1.1+rand(),.65+rand()*.6,1+rand());bloom.rotation.set(rand()*3,rand()*3,rand()*3);}}return t;}
    tree(-18,17,1.65);tree(-31,6,1.4);tree(-9,3,1);tree(34,12,1.2);tree(40,26,1.6);tree(-35,34,1.5);tree(0,-12,.8);tree(32,-9,.85);
    const green=mat('#506f62');for(let i=0;i<38;i++){let x=-55+rand()*110,z=-26+rand()*26;if(x>8&&x<29)continue;const h=3+rand()*5;mesh(new THREE.ConeGeometry(1.8+rand(),h,7),green,scene,x,h/2-1,z);}
    // Floating petals use one shared geometry and a gentle looping fall.
    const petalGeo=new THREE.CircleGeometry(.12,5),petalMat=new THREE.MeshStandardMaterial({color:'#ffd4e1',side:THREE.DoubleSide,roughness:1});const petals=[];for(let i=0;i<140;i++){const p=mesh(petalGeo,petalMat,scene,-45+rand()*90,3+rand()*22,-5+rand()*55);p.userData={x:p.position.x,y:p.position.y,z:p.position.z,phase:rand()*Math.PI*2,speed:.4+rand()*.5};p.castShadow=false;petals.push(p);}
    const pointer=new THREE.Vector2();addEventListener('pointermove',e=>{pointer.set(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5)});
    function frame(){const aspect=innerWidth/innerHeight;camera.aspect=aspect;camera.fov=aspect<1?54:40;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}addEventListener('resize',frame);frame();
    const clock=new THREE.Clock();let mx=0,my=0;
    function animate(){requestAnimationFrame(animate);let time=clock.getElapsedTime();mx+=(pointer.x-mx)*.025;my+=(pointer.y-my)*.025;let portrait=innerWidth<innerHeight;camera.position.set(52+mx*3,29-my*2,portrait?102:83);camera.lookAt(-3,15,-30);for(const p of petals){const d=p.userData;p.position.set(d.x+Math.sin(time*.3+d.phase)*2+time*.12%8,(d.y-time*d.speed+50)%25,d.z+Math.cos(time*.3+d.phase));p.rotation.set(time*.5+d.phase,time*.3,d.phase+time*.6);}renderer.render(scene,camera);}animate();
  </script>
</body>
