<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Wave off Kanagawa — low poly tribute</title>
<!--
  Rebuilt from the print (Hokusai, Kanagawa-ochi Nami Ura), public domain.
  The print is the reference for composition, palette and subjects —
  nothing here is a texture sample of the print; every shape is built in code.
  Palette: Prussian indigo, foam white, washi beige, hull sienna.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9dfc8}
  canvas{display:block}
  #title{position:fixed;top:14px;left:16px;font-family:'Shippori Mincho',serif;
         color:#22364f;font-size:15px;letter-spacing:.1em;opacity:.8;pointer-events:none}
</style>
<script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}
</script>
</head>
<body>
<div id="title">The Great Wave off Kanagawa · low poly</div>
<script type="module">
import * as THREE from "three";

// ---- palette (from the print) -------------------------------------------
const BEIGE = 0xe9dfc8, INK   = 0x1f3b63, BLUE  = 0x2e639e, DEEP  = 0x1a2f4f,
      FOAM  = 0xf6f2e6, HULL  = 0xc98a52, HULL_D= 0x7e5636, MOUNT = 0x6b7d95, CLOUD = 0xf2e9d5;

const scene = new THREE.Scene();
scene.background = new THREE.Color(BEIGE);
scene.fog = new THREE.Fog(BEIGE, 14, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0.2, 2.0, 9.5);
camera.lookAt(0, 1.9, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(2, 5, 4);
scene.add(sun);

const mat = (c, extra={}) => new THREE.MeshLambertMaterial({color:c, side:THREE.DoubleSide, flatShading:true, ...extra});

// ---- the great wave: a bent ribbon following the print's crest profile ----
// 2D silhouette of the breaker, left flank up over the clawed crest,
// into the trough, then the back swell to the right (print proportions).
const PROFILE = [
  [-4.8, 0.15], [-4.45, 1.35], [-3.85, 2.55], [-2.95, 3.6], [-1.75, 4.15],
  [-0.55, 3.95], [ 0.5, 3.1],  [ 0.8, 2.0],   [ 0.4, 1.2],  [-0.55, 0.9],
  [ 0.55, 0.8],  [ 2.2, 1.15], [ 4.1, 1.05], [ 5.8, 0.5]
];
function ribbon(pts, halfW, w){
  const n = pts.length, pos = [], idx = [];
  for (let i = 0; i < n; i++){
    const [x, y] = pts[i];
    for (let j = 0; j < 3; j++){
      const v = (j/2 - 0.5);            // -0.5..0.5 across the width
      pos.push(x, y, v * halfW * w);
    }
  }
  for (let i = 0; i < n-1; i++)
    for (let j = 0; j < 2; j++){
      const a = i*3+j, b = i*3+j+1, c = (i+1)*3+j, d = (i+1)*3+j+1;
      idx.push(a, c, b, b, c, d);
    }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const waveGroup = new THREE.Group();
const greatWave = new THREE.Mesh(ribbon(PROFILE, 2.3, 1), mat(BLUE));
waveGroup.add(greatWave);
// inner shade under the curl so the hollow reads (deep ink)
const hollowPts = PROFILE.slice(5, 10);
waveGroup.add(new THREE.Mesh(ribbon(hollowPts, 2.0, 0.85), mat(DEEP)));
scene.add(waveGroup);

// ---- foam claws: curling white torus arcs along the crest, print style ----
function foamCluster(x, y, angle, scale = 1){
  const g = new THREE.Group();
  const arc = new THREE.Mesh(new THREE.TorusGeometry(0.3*scale, 0.09*scale, 5, 8, Math.PI*1.25), mat(FOAM));
  arc.rotation.z = angle;
  g.add(arc);
  for (let k = 0; k < 2; k++){
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13*scale, 0), mat(FOAM));
    s.position.set(Math.cos(angle + k*0.9)*0.32*scale, Math.sin(angle + k*0.9)*0.32*scale, (k-0.5)*0.3*scale);
    g.add(s);
  }
  g.position.set(x, y, 0);
  return g;
}
const foam = [];
const crestX = [-4.2, -3.5, -2.6, -1.6, -0.7, 0.25], crestY = [2.25, 3.25, 3.95, 4.32, 4.15, 3.45];
crestX.forEach((x, i) => { foam.push(foamCluster(x, crestY[i], 2.6 - i*0.35, 1 - i*0.05)); waveGroup.add(foam[foam.length-1]); });
// foam on the back swell's crest, following it to the right
[[1.5, 1.25, 0.8], [2.3, 1.45, 0.9], [-4.0, 1.9, 0.9], [4.4, 1.4, 0.8], [5.3, 0.75, 0.7]]
  .forEach(([x, y, s]) => { const c = foamCluster(x, y, 1.2, s); waveGroup.add(c); foam.push(c); });

// ---- three boats, as in the print (left trough, centre, right swell) -----
function boat(){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.16, 0.42), mat(HULL));
  g.add(hull);
  const bow = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.2, 0.34), mat(HULL_D));
  bow.position.set(0.95, 0.12, 0); bow.rotation.z = -0.5;
  g.add(bow);
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.12, 0.3), mat(DEEP));
  canopy.position.set(-0.15, 0.14, 0);
  g.add(canopy);
  for (let i = 0; i < 3; i++){                 // crew, low poly
    const h = new THREE.Mesh(new THREE.IcosahedronGeometry(0.07, 0), mat(FOAM));
    h.position.set(-0.55 + i*0.5, 0.13, 0.12);
    g.add(h);
  }
  return g;
}
const boats = [];
function placeBoat(x, y, z, rz){
  const b = boat();
  b.position.set(x, y, z); b.rotation.z = rz;
  b.userData = {baseY: y, baseRz: rz, phase: boats.length * 2.1};
  scene.add(b); boats.push(b);
}
placeBoat(-2.95, 1.05, 0.5, -0.62);   // left, nosed into the trough
placeBoat( 0.45, 0.95, 2.0,  0.12);  // centre, riding the front swell
placeBoat( 3.45, 0.95, 0.8,  0.48);  // right, climbing the far swell

// ---- foreground swells: rounded blue rows with foam crests (print bottom) --
const swells = [];
[[ -3.8, -0.05, 3.2, 0.7], [ -1.5, 0.0, 3.4, 0.85], [ 0.9, 0.05, 3.5, 0.95], [ 3.3, 0.0, 3.6, 1.0]]
.forEach(([x, y, z, s]) => {
  const sw = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.38*s, 0.45*s, 2.4, 8, 1, false, 0, Math.PI), mat(BLUE));
  body.rotation.x = Math.PI/2; body.rotation.z = Math.PI/2;
  sw.add(body);
  const crest = new THREE.Mesh(new THREE.CylinderGeometry(0.12*s, 0.12*s, 2.2, 6), mat(FOAM));
  crest.rotation.z = Math.PI/2; crest.position.y = 0.38*s;
  sw.add(crest);
  sw.position.set(x, y, z);
  sw.userData = {baseY: y};
  scene.add(sw); swells.push(sw);
});

// ---- Mount Fuji: small snow-capped cone, centre-right in the distance -----
const fuji = new THREE.Mesh(new THREE.ConeGeometry(1.15, 0.95, 6), mat(MOUNT));
fuji.position.set(1.9, 0.95, -7);
scene.add(fuji);
const cap = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.4, 6), mat(FOAM));
cap.position.set(1.9, 1.25, -7);
scene.add(cap);

// ---- clouds, upper right as in the print ----------------------------------
[[2.8, 3.9, -7.5], [4.9, 3.3, -8.5], [1.2, 4.4, -9]].forEach(([x, y, z]) => {
  const c = new THREE.Group();
  for (let i = 0; i < 3; i++){
    const p = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45 + (i%2)*0.2, 0), mat(CLOUD));
    p.position.set(i*0.4 - 0.4, (i%2)*0.12, 0);
    c.add(p);
  }
  c.position.set(x, y, z);
  scene.add(c);
});

// ---- gentle motion ---------------------------------------------------------
const clock = new THREE.Clock();
function tick(){
  const t = clock.getElapsedTime();
  waveGroup.position.y = Math.sin(t*0.6)*0.06;
  waveGroup.rotation.z = Math.sin(t*0.4)*0.012;
  foam.forEach((f, i) => { f.rotation.z = Math.sin(t*0.9 + i)*0.06; });
  boats.forEach(b => {
    b.position.y = b.userData.baseY + Math.sin(t*0.8 + b.userData.phase)*0.06;
    b.rotation.z = b.userData.baseRz + Math.sin(t*0.7 + b.userData.phase)*0.05;
  });
  swells.forEach((s, i) => { s.position.y = s.userData.baseY + Math.sin(t*0.7 + i*1.3)*0.04; });
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
