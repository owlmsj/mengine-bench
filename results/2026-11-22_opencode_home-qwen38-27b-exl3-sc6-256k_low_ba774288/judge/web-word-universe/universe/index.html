<title>Universo de Palavras · Dicionário Criativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d17; --ink:#e8ecf8; --dim:#9aa3c0; --line:#2a3050;
  --panel:rgba(13,16,30,.92); --acc:#ffd166;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,sans-serif;overflow:hidden}
#sky{position:fixed;inset:0;display:block;cursor:crosshair}
header{position:fixed;top:0;left:0;right:0;display:flex;gap:18px;align-items:flex-start;
  padding:18px 22px;pointer-events:none;z-index:5}
header>*{pointer-events:auto}
h1{margin:0;font:600 26px/1.1 "Fraunces",serif;letter-spacing:.01em}
h1 em{font-style:italic;color:var(--acc)}
.sub{margin:4px 0 0;color:var(--dim);font-size:12.5px}
.searchwrap{position:relative;margin-left:auto;width:320px}
#busca{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);color:var(--ink);font:inherit;outline:none;transition:border .15s}
#busca:focus{border-color:var(--acc)}
#sug{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;display:none;backdrop-filter:blur(6px)}
#sug div{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
#sug div small{color:var(--dim)}
#sug div:hover,#sug div.act{background:#1b2140}
#panel{position:fixed;top:86px;right:18px;width:300px;max-height:calc(100% - 150px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  z-index:6;display:none;backdrop-filter:blur(8px)}
#panel.show{display:block}
#clear{position:absolute;top:10px;right:12px;border:0;background:none;color:var(--dim);
  font-size:18px;cursor:pointer;line-height:1}
#clear:hover{color:var(--ink)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;
  color:#0a0d17;margin-bottom:8px}
#pWord{margin:2px 0 2px;font:600 34px/1.05 "Fraunces",serif}
#pCount{color:var(--dim);font-size:12.5px;margin:0 0 14px}
#panel h3{margin:14px 0 6px;font:600 13px "Inter";text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
#panel ul{margin:0;padding:0;list-style:none}
#panel li{padding:6px 10px;margin:2px -10px;border-radius:8px;cursor:pointer;font-size:14.5px}
#panel li:hover{background:#1b2140;color:var(--acc)}
#panel .none{color:var(--dim);font-size:13px;padding:4px 2px}
footer{position:fixed;bottom:0;left:0;right:0;padding:10px 22px;color:var(--dim);
  font-size:12.5px;display:flex;gap:16px;align-items:center;z-index:5;pointer-events:none}
footer b{color:var(--ink);font-weight:600}
.hint{margin-left:auto;opacity:.75}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<header>
  <div>
    <h1>Universo de <em>Palavras</em></h1>
    <p class="sub" id="stats"></p>
  </div>
  <div class="searchwrap">
    <input id="busca" placeholder="buscar uma palavra…" autocomplete="off" spellcheck="false">
    <div id="sug"></div>
  </div>
</header>
<aside id="panel">
  <button id="clear" title="fechar">✕</button>
  <span class="chip" id="pTema"></span>
  <h2 id="pWord"></h2>
  <p id="pCount"></p>
  <h3>Sinônimos</h3><ul id="pSin"></ul>
  <h3>Palavras análogas</h3><ul id="pAna"></ul>
</aside>
<footer>
  <span id="fstats"></span>
  <span class="hint">clique numa palavra para ver suas relações · compartilhe com <b>?word=</b></span>
</footer>

<script>
"use strict";
const norm = s => s.trim().toLowerCase();
const normNoAcc = s => norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");

const TEMAS = [...new Set(Object.values(DATA).map(v => v.t).filter(Boolean))].sort();
const hueOf = t => { let h = 0; for (const c of t) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const temaColor = (t, L=62) => `hsl(${hueOf(t||"?")}, 62%, ${L}%)`;

const words = Object.entries(DATA).map(([w, v]) => ({ w, d: v.d, t: v.t, sin: v.sin, ana: v.ana }));
const byWord = Object.fromEntries(words.map(x => [x.w, x]));
words.forEach(x => { x.deg = new Set([...x.sin, ...x.ana]).size; });
const edgeKeys = new Set();
const edges = [];
words.forEach(x => [...x.sin, ...x.ana].forEach(y => {
  const k = [x.w, y].sort().join("|");
  if (!edgeKeys.has(k)) { edgeKeys.add(k); edges.push([x.w, y]); }
}));
const maxDeg = Math.max(...words.map(x => x.deg));
const most = [...words].filter(x => x.deg === maxDeg).sort((a,b) => a.w < b.w ? -1 : 1)[0];
document.getElementById("stats").textContent =
  `${words.length} palavras · ${edges.length} relações · cada palavra guarda as suas`;
document.getElementById("fstats").innerHTML =
  `${words.length} palavras · ${edges.length} pares · mais conectada: <b>${most.d}</b> (${maxDeg} laços)`;

/* ---------- canvas ---------- */
const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

/* stars */
const stars = Array.from({length: 140}, () => ({
  x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + .2, a: Math.random() * .5 + .1
}));

/* layout: cluster by tema */
const temas = [...new Set(words.map(x => x.t))];
const T = Math.min(W, H);
words.forEach((x, i) => {
  const ti = Math.max(0, temas.indexOf(x.t));
  const a = (ti / temas.length) * Math.PI * 2;
  const cx = W/2 + Math.cos(a) * T * .30, cy = H/2 + Math.sin(a) * T * .30;
  x.x = cx + (Math.random() - .5) * T * .22;
  x.y = cy + (Math.random() - .5) * T * .22;
  x.vx = 0; x.vy = 0;
  x.r = 2.4 + Math.sqrt(x.deg) * 1.5;
  x.col = temaColor(x.t);
});
const nodeAt = Object.fromEntries(words.map(x => [x.w, x]));

let alpha = 1;
function tick(){
  if (alpha < .004) return;
  alpha *= .985;
  const rep = 900 * alpha;
  for (let i = 0; i < words.length; i++){
    const a = words[i];
    for (let j = i + 1; j < words.length; j++){
      const b = words[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx*dx + dy*dy; if (d2 < 1) { d2 = 1; dx = .5; dy = .5; }
      const f = rep / d2;
      const d = Math.sqrt(d2);
      const fx = dx / d * f, fy = dy / d * f;
      a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
    }
  }
  const k = .015 * alpha * 60, rest = 64;
  for (const [u, v] of edges){
    const a = nodeAt[u], b = nodeAt[v];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.max(1, Math.hypot(dx, dy));
    const f = (d - rest) / d * k * .016;
    a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const x of words){
    x.vx += (W/2 - x.x) * .0009 * alpha;
    x.vy += (H/2 - x.y) * .0009 * alpha;
    x.vx *= .86; x.vy *= .86;
    if (x === drag) continue;
    x.x += x.vx; x.y += x.vy;
  }
}

let sel = null, hover = null, drag = null;
function egoSet(){
  if (!sel) return null;
  const s = new Set([sel.w, ...sel.sin, ...sel.ana]);
  return s;
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  for (const s of stars){
    ctx.globalAlpha = s.a; ctx.fillStyle = "#cdd6ff";
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const ego = egoSet();
  const inEgo = n => !ego || ego.has(n.w);
  for (const [u, v] of edges){
    const a = nodeAt[u], b = nodeAt[v];
    const active = ego && (u === sel.w || v === sel.w);
    const on = inEgo(a) && inEgo(b);
    ctx.strokeStyle = active ? sel.col : (on ? "rgba(150,165,220,.14)" : "rgba(150,165,220,.04)");
    ctx.lineWidth = active ? 1.6 : 1;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for (const x of words){
    const on = inEgo(x);
    const isSel = sel && x.w === sel.w;
    const isHover = hover === x;
    ctx.globalAlpha = on ? 1 : .14;
    const r = isSel ? x.r * 1.7 : (isHover ? x.r * 1.35 : x.r);
    ctx.shadowColor = x.col; ctx.shadowBlur = isSel ? 26 : (on ? 10 : 0);
    ctx.fillStyle = x.col;
    ctx.beginPath(); ctx.arc(x.x, x.y, r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    if (on){
      const show = isSel || isHover || ego ? x.deg >= 9 : x.deg >= maxDeg - 1;
      if (show || isSel || isHover || (ego && ego.has(x.w))){
        ctx.font = `${isSel ? 700 : 500} ${isSel ? 19 : 13}px Inter, sans-serif`;
        ctx.fillStyle = isSel ? "#ffffff" : "rgba(226,232,255,.85)";
        ctx.textAlign = "center";
        ctx.fillText(x.d, x.x, x.y - r - 6);
      }
    }
  }
  ctx.globalAlpha = 1;
}
function frame(){ tick(); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

/* ---------- painel ---------- */
const panel = document.getElementById("panel");
function select(wordKey, pushUrl = true){
  const x = nodeAt[wordKey];
  if (!x) return;
  sel = x;
  document.getElementById("pWord").textContent = x.d;
  const chip = document.getElementById("pTema");
  chip.textContent = x.t || "sem tema";
  chip.style.background = temaColor(x.t, 70);
  document.getElementById("pCount").textContent = `${x.deg} palavras relacionadas`;
  fill("pSin", x.sin); fill("pAna", x.ana);
  panel.classList.add("show");
  if (pushUrl){
    try { history.replaceState(null, "", "?word=" + encodeURIComponent(x.w)); } catch(e){}
  }
}
function fill(id, arr){
  const ul = document.getElementById(id);
  ul.innerHTML = "";
  if (!arr.length){ ul.innerHTML = '<li class="none" style="cursor:default">—</li>'; return; }
  for (const w of arr){
    const li = document.createElement("li");
    li.textContent = (nodeAt[w] || { d: w }).d;
    li.addEventListener("click", () => select(w));
    ul.appendChild(li);
  }
}
function clearSel(pushUrl = true){
  sel = null; panel.classList.remove("show");
  if (pushUrl){
    try { history.replaceState(null, "", location.pathname || "index.html"); } catch(e){}
  }
}
document.getElementById("clear").addEventListener("click", () => clearSel());

/* ---------- busca ---------- */
const busca = document.getElementById("busca"), sug = document.getElementById("sug");
let sugList = [], sugAct = -1;
function renderSug(){
  if (!sugList.length){ sug.style.display = "none"; return; }
  sug.innerHTML = "";
  sugList.forEach((x, i) => {
    const d = document.createElement("div");
    d.innerHTML = `<span>${x.d}</span><small>${x.t || ""}</small>`;
    if (i === sugAct) d.classList.add("act");
    d.addEventListener("click", () => { select(x.w); busca.value = x.d; sugList = []; renderSug(); });
    sug.appendChild(d);
  });
  sug.style.display = "block";
}
busca.addEventListener("input", () => {
  const q = normNoAcc(busca.value.trim());
  sugAct = -1;
  sugList = q ? words.filter(x => normNoAcc(x.w).includes(q)).sort((a,b) => a.w < b.w ? -1 : 1).slice(0, 8)
              : [...words].sort((a,b) => b.deg - a.deg).slice(0, 8);
  if (!q && !sugList.length) sugList = [];
  renderSug();
});
busca.addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ sugAct = Math.min(sugList.length - 1, sugAct + 1); renderSug(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ sugAct = Math.max(0, sugAct - 1); renderSug(); e.preventDefault(); }
  else if (e.key === "Enter"){
    const pick = sugAct >= 0 ? sugList[sugAct] : sugList[0];
    if (pick){ select(pick.w); busca.value = pick.d; sugList = []; renderSug(); busca.blur(); }
  }
  else if (e.key === "Escape"){ sugList = []; renderSug(); busca.blur(); }
});
busca.addEventListener("blur", () => setTimeout(() => { sugList = []; renderSug(); }, 150));

/* ---------- mouse ---------- */
function pick(mx, my){
  let best = null, bd = 1e9;
  for (const x of words){
    const d = Math.hypot(x.x - mx, x.y - my);
    if (d < x.r + 6 && d < bd){ bd = d; best = x; }
  }
  return best;
}
cv.addEventListener("mousemove", e => {
  const m = { x: e.clientX, y: e.clientY };
  if (drag){ drag.x = m.x; drag.y = m.y; drag.vx = 0; drag.vy = 0; alpha = Math.max(alpha, .25); return; }
  hover = pick(m.x, m.y);
  cv.style.cursor = hover ? "pointer" : "crosshair";
});
cv.addEventListener("mousedown", e => {
  const n = pick(e.clientX, e.clientY);
  if (n){ drag = n; cv.style.cursor = "grabbing"; }
});
addEventListener("mouseup", e => {
  if (drag){
    const moved = Math.hypot(drag.x - (drag._mx ?? drag.x), drag.y - (drag._my ?? drag.y));
    if (moved < 4) select(drag.w);
    drag = null; cv.style.cursor = "crosshair";
  } else {
    if (!pick(e.clientX, e.clientY)) clearSel();
  }
});
/* track press position for click vs drag */
cv.addEventListener("mousedown", e => { const n = pick(e.clientX, e.clientY); if (n){ n._mx = e.clientX; n._my = e.clientY; } });

/* deep link ?word= */
const q = new URLSearchParams(location.search).get("word");
if (q){
  const key = norm(q);
  const hit = words.find(x => x.w === key) || words.find(x => normNoAcc(x.w) === normNoAcc(q));
  if (hit) select(hit.w, false);
}
</script>
