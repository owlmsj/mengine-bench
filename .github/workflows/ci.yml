name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, no persisted credentials: CI runs PR code.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run pytest -q
      # Generic checks only: the private terms never leave the maintainer's machine.
      - run: uv run mengine-bench privacy-scan
