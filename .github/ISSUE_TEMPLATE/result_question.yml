name: Result question
description: Ask about or dispute a result on the leaderboard.
title: "[result] "
labels: ["result-question"]
body:
  - type: markdown
    attributes:
      value: |
        Deterministic checks and scores are re-verified by the maintainer; timings, judge votes and vision votes are
        self-reported (docs/SUBMITTING.md). Please run `uv run mengine-bench verify <bundle>` first and
        include its output.
  - type: input
    id: bundle
    attributes:
      label: Bundle directory
      description: Path under results/, for example results/fast/2026-10-17_claude_model_high_ab12cd34
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Question
        - Verify fails on my machine
        - Suspected self-reported data problem (timings or judge votes)
        - Possible secret or personal data in the bundle
        - Other
    validations:
      required: true
  - type: input
    id: bench_commit
    attributes:
      label: Bench commit you verified with
      description: Output of `git rev-parse HEAD` in your bench checkout
  - type: textarea
    id: verify_output
    attributes:
      label: Verify output
      render: text
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What looks wrong, and how to reproduce it. Do not paste secrets you found; say where they are.
    validations:
      required: true
