name: Result question
description: Ask about or dispute a result on the leaderboard.
title: "[result] "
labels: ["result-question"]
body:
  - type: markdown
    attributes:
      value: |
        Results are self-reported by the submitter; the maintainer reviews and judges every run before merge.
        Each bundle holds result.json, summary.md and the transcripts of every task.
  - type: input
    id: bundle
    attributes:
      label: Run folder
      description: Path under results/, for example results/2026-10-20_claude_claude-sonnet-5-5_high_1a2b3c4d
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Question
        - Suspected wrong score, time, cost or judge vote
        - Possible secret or personal data in the bundle
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What looks wrong, and where in the bundle. Do not paste secrets you found; say where they are.
    validations:
      required: true
