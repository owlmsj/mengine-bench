name: Result question
description: Ask about or dispute a result on the leaderboard.
title: "[result] "
labels: ["result-question"]
body:
  - type: markdown
    attributes:
      value: |
        Scores are self-reported by the submitter and reviewed by the maintainer before merge.
        Each bundle holds result.json, summary.md and the transcripts of every task.
  - type: input
    id: bundle
    attributes:
      label: Bundle directory
      description: Path under results/, for example results/full/2026-10-17_codex_gpt-6.1-sol_low_f96c04d3
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Question
        - Suspected wrong score, timing or judge vote
        - Possible secret or personal data in the bundle
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What looks wrong, and where in the bundle. Do not paste secrets you found; say where they are.
    validations:
      required: true
